not solve the resulting model; he posed it as a problem and, after moving from Rostock to Hamburg, assigned the one-dimensional case to his doctoral student Ernst Ising. Ising's 1924 dissertation appeared in print in 1925 [6] with the exact 1D solution\n\n$$f(T,H=0) \\;=\\; -k_B T \\ln\\!\\bigl[2\\cosh(\\beta J)\\bigr]$$\n\nand no phase transition at any finite $T$. Ising extrapolated — wrongly — that no Lenz-type model would order in any dimension and dismissed the construction as a failed account of ferromagnetism. The historical correction is unambiguous: the lattice model now universally called *Ising* is Lenz's; Ising solved a single dimensional case and drew an erroneous moral from it. Brush's 1967 reconstruction from Hamburg correspondence [7] makes the priority explicit. *Lenz–Ising* is the bibliographically honest name; the dossier will use it.\n\n### 1928: Heisenberg supplies the missing field\n\nHeisenberg's 1928 paper [8] solved Weiss's scandal. Taking two electrons in orthogonal atomic orbitals $\\phi_a,\\phi_b$, antisymmetry of the spatial-times-spin wavefunction forces the singlet and triplet to differ in energy by twice the *exchange integral*\n\n$$J \\;=\\; \\int\\!\\!\\int \\phi_a^{*}(1)\\phi_b^{*}(2)\\,\\frac{e^{2}}{r_{12}}\\,\\phi_a(2)\\phi_b(1)\\,d\\tau_1 d\\tau_2.$$\n\nA modest $J \\sim 10^{-2}\\,\\mathrm{eV}$ is enough to reproduce $T_C$ for iron, and the magnitude is electrostatic, not magnetostatic. The paper is a Heitler–London-style many-electron calculation, not a spin Hamiltonian: nowhere in Heisenberg 1928 does the compact form $-\\sum J\\,\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$ appear. That bilinear rewriting was Dirac's, in *On the theory of quantum mechanics* (Proc. Roy. Soc. A **123**, 714, 1929) (verify), where the spin-permutation identity $P_{12}^{\\sigma} = \\tfrac{1}{2}(1 + \\boldsymbol{\\sigma}_1\\!\\cdot\\!\\boldsymbol{\\sigma}_2)$ converts the singlet-triplet splitting into the now-canonical scalar form. Yakov Frenkel's nearly simultaneous *Elementare Theorie magnetischer und elektrischer Eigenschaften der Metalle* (Z. Physik **49**, 31, 1928) (verify) independently identified electron exchange as the seat of ferromagnetism, with greater emphasis on band-like itinerancy that would resurface in Bloch [9] and Stoner [10]. Frenkel is conspicuously absent from Anglophone textbooks; the standard genealogy \"Heisenberg → Van Vleck\" elides both Dirac's reformulation and Frenkel's independent contribution.\n\n### 1934: Kramers, in French, builds the bridge to insulators\n\nHeisenberg's exchange is short-ranged: two magnetic ions separated by a closed-shell anion (as in MnO, NiO, the rare-earth oxides) have vanishing direct overlap and therefore vanishing direct exchange — yet they order. Hendrik Kramers's 1934 *Physica* paper [11], written in French and rarely cited in its original form, supplied the resolution: a virtual perturbative pathway $3d \\to 2p \\to 3d$ through the intervening oxygen transfers a kinetic-energy penalty that depends on the relative spin orientation of the two cations, generating an effective antiferromagnetic coupling of order $t^{4}/U^{2}\\Delta$. This is *superexchange*. Anderson's 1950 paper (covered in §3) is a quantitative deepening, not the origin; the modern phrase \"Anderson superexchange\" truncates a sixteen-year priority that Anderson himself acknowledged in print.\n\n### The credit map this dossier will honor\n\nThe 1895–1934 arc therefore breaks into six distinct intellectual acts, not the three usually conflated:\n\n| Year | Act | Author(s) | What is *not* it |\n|---|---|---|---|\n| 1895 | $\\chi = C/T$ and $T_C$ as datum | Curie [1] | not a theory of mechanism |\n| 1905 | classical statistics $\\Rightarrow$ $\\mathcal{L}(x)$ | Langevin [2] | not yet a Curie–Weiss law |\n| 1907 | molecular field $\\lambda$, $\\chi = C/(T-\\Theta)$ | Weiss [3] | no microscopic content |\n| 1920 | binary-spin lattice model | Lenz [5] | \"Ising\" is a misnomer |\n| 1925 | 1D solution, wrong extrapolation | Ising [6] | not the model itself |\n| 1928–29 | exchange as origin of $\\lambda$; bilinear spin form | Heisenberg [8], Dirac (verify), Frenkel (verify) | Heisenberg did *not* write $-J\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$ |\n| 1934 | superexchange via virtual ligand hopping | Kramers [11] | predates Anderson by sixteen years |\n\nEach subsequent section of this dossier — the Hamiltonians of §2, the exchange zoology of §3, the Lenz–Ising lineage of §5 — will be built on this audit rather than on the textbook shorthand it corrects."}, {"id": "pedagogical-core", "title": "The Pedagogical Core: Hamiltonians, Order Parameters, and Mean Fields", "markdown": "## The Pedagogical Core: Hamiltonians, Order Parameters, and Mean Fields\n\n### The five Hamiltonians, side by side\n\nModern magnetism rests on a small set of model Hamiltonians. Each is defined by what is fixed (the local degree of freedom and its symmetry) and what is allowed to fluctuate. Writing them together makes the differences pedagogically sharp:\n\n| Model | Hamiltonian | DOF | Global symmetry | Order parameter | $d_{\\text{LC}}$ | $d_{\\text{UC}}$ |\n|---|---|---|---|---|---|---|\n| Lenz–Ising [5, 6] | $-J\\sum_{\\langle ij\\rangle}\\sigma_i\\sigma_j - h\\sum_i\\sigma_i$, $\\sigma_i=\\pm1$ | classical scalar | $\\mathrm{Z}_2$ | $m=\\langle\\sigma\\rangle$ | 1 | 4 |\n| XY | $-J\\sum_{\\langle ij\\rangle}(S_i^x S_j^x+S_i^y S_j^y)$ | 2-component spin | $\\mathrm{O}(2)$ | $\\vec m_\\perp$ | 2 (BKT) | 4 |\n| Heisenberg [8] | $-J\\sum_{\\langle ij\\rangle}\\vec S_i\\cdot\\vec S_j$ | 3-component spin | $\\mathrm{O}(3)$ | $\\vec m$ | 2 | 4 |\n| Hubbard | $-t\\sum_{\\langle ij\\rangle\\sigma}c^\\dagger_{i\\sigma}c_{j\\sigma}+U\\sum_i n_{i\\uparrow}n_{i\\downarrow}$ | itinerant fermions | $\\mathrm{U}(1)\\times\\mathrm{SU}(2)$ | $m$ (Stoner), $\\vec n_{\\mathbf Q}$ (SDW) | — | — |\n| s–d / Kondo lattice | $-t\\sum c^\\dagger c + J_K\\sum_i \\vec s_i\\cdot\\vec S_i$ | band + local spins | $\\mathrm{SU}(2)$ | $m_c$, $m_f$, Kondo singlet $\\langle \\vec s\\cdot\\vec S\\rangle$ | — | — |\n\nThe Mermin–Wagner theorem [12] is the cleanest organizing principle behind the $d_{\\text{LC}}$ column: spontaneous breaking of a continuous symmetry is forbidden at $T\u003e0$ in $d\\le 2$ for short-ranged isotropic Heisenberg and XY systems. Ising survives in $d=2$ because $\\mathrm{Z}_2$ is discrete (Peierls's contour argument [13]; Onsager's exact free energy [14]). In $d=2$ the XY model loses true long-range order yet retains an algebraic phase below the Berezinskii–Kosterlitz–Thouless transition; Mermin–Wagner is silent on it because the theorem forbids only $\\langle\\vec S\\rangle\\ne 0$, not power-law correlations.\n\nThe Hubbard model (Hubbard, Gutzwiller, Kanamori, 1963 — *verify*) interpolates between Stoner (weak $U/t$, itinerant) and Heisenberg (large $U/t$ at half filling, $J\\sim 4t^2/U$ via superexchange, §3) and contains Nagaoka [15] as its singular $U\\to\\infty$, single-hole limit. The s–d / Kondo lattice — written down by Vonsovskii and Zener (*verify*) — is the natural home for RKKY [16], heavy fermions, and double exchange [17].\n\n### One mean-field skeleton; five consequences\n\nEvery classical mean-field result in this family flows from the same single-site decoupling. Replace the environment of spin $i$ by an effective field\n$$H_{\\text{eff}} = H + \\lambda M,\\qquad M=\\frac{1}{N}\\sum_i\\langle S_i^z\\rangle,$$\nwith $\\lambda$ the Weiss molecular-field constant [3]. The microscopic content of $\\lambda$ — that it is exchange, not dipolar — is Heisenberg's [8]; Weiss left it as a fitted number nearly $10^3$ times larger than any dipolar estimate.\n\n**(i) Langevin function and the classical Curie law.** For a continuous classical moment $\\mu$ in field $B$, the single-spin partition function is $Z_1=\\int d\\Omega\\,e^{\\mu B\\cos\\theta/k_B T}=4\\pi\\sinh x/x$ with $x=\\mu B/k_B T$, so\n$$\\langle\\mu_z\\rangle = \\mu L(x),\\qquad L(x)=\\coth x - 1/x \\;\\;[2].$$\nExpanding $L(x)\\approx x/3$ gives $\\chi = n\\mu^2/3k_BT \\equiv C/T$, the law Curie measured in 1895 [1]. **Silent assumptions:** the moment magnitude $\\mu$ is fixed and classical; the quantum Brillouin function $B_J(x)$ replaces $L(x)$ at finite $J$ and reduces to it only as $J\\to\\infty$.\n\n**(ii) Curie–Weiss from Langevin + Weiss.** Insert $H_{\\text{eff}}$ into the self-consistency $M=n\\mu L(\\mu H_{\\text{eff}}/k_B T)$ and linearize:\n$$\\chi=\\frac{C}{T-\\Theta},\\qquad \\Theta=\\lambda C,\\qquad T_c=\\Theta.$$\n**Silent assumptions:** (a) Gaussian fluctuations of $H_{\\text{eff}}$ around its mean are neglected — strictly exact only at infinite coordination $z\\to\\infty$; (b) $\\lambda M$ couples only to the longitudinal channel; (c) the implied critical exponents $\\beta=1/2,\\gamma=1,\\delta=3$ are mean-field and therefore wrong below the upper critical dimension $d_{\\text{UC}}=4$.\n\n**(iii) Néel two-sublattice antiferromagnet.** Split the lattice into A, B with $M_A=-M_B$ in the ordered phase; each sublattice sees $H_{\\text{eff}}^A=H-\\lambda M_B$. Linearizing the coupled equations [4],\n$$\\chi_{\\text{AFM}}(T) = \\frac{C}{T+\\Theta_N},\\qquad \\Theta_N=\\lambda C,$$\nwith a cusp at $T_N$ and, below $T_N$, the celebrated split $\\chi_\\parallel\\to 0$, $\\chi_\\perp=1/\\lambda$. **Silent assumption:** a single intersublattice coupling. The ferrimagnetic generalization [18] permits $|M_A|\\ne|M_B|$ and yields Néel's compensation-point susceptibility.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eSymmetry vs dimension phase plane for cooperative magnets\u003c/title\u003e\u003ctext x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003eOrder-parameter symmetry vs spatial dimension\u003c/text\u003e\u003cline x1=\"100\" y1=\"350\" x2=\"680\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"100\" y1=\"350\" x2=\"100\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"390\" y=\"388\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003espatial dimension d\u003c/text\u003e\u003ctext x=\"34\" y=\"205\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" transform=\"rotate(-90 34 205)\"\u003eorder-parameter components n\u003c/text\u003e\u003cline x1=\"220\" y1=\"350\" x2=\"220\" y2=\"60\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"340\" y1=\"350\" x2=\"340\" y2=\"60\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"460\" y1=\"350\" x2=\"460\" y2=\"60\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"580\" y1=\"350\" x2=\"580\" y2=\"60\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003ctext x=\"220\" y=\"368\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003e1\u003c/text\u003e\u003ctext x=\"340\" y=\"368\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003e2\u003c/text\u003e\u003ctext x=\"460\" y=\"368\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003e3\u003c/text\u003e\u003ctext x=\"580\" y=\"368\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003e4\u003c/text\u003e\u003cline x1=\"100\" y1=\"280\" x2=\"680\" y2=\"280\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"100\" y1=\"200\" x2=\"680\" y2=\"200\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"100\" y1=\"120\" x2=\"680\" y2=\"120\" stroke=\"#e8e6e1\" stroke-dasharray=\"2,4\" stroke-width=\"0.8\"/\u003e\u003ctext x=\"90\" y=\"284\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"14\"\u003en=1 Ising\u003c/text\u003e\u003ctext x=\"90\" y=\"204\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"14\"\u003en=2 XY\u003c/text\u003e\u003ctext x=\"90\" y=\"124\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"14\"\u003en=3 Heisenberg\u003c/text\u003e\u003cpath d=\"M 100 350 L 220 350 L 220 110 L 100 110 Z\" fill=\"#ff7a90\" fill-opacity=\"0.18\" stroke=\"none\"/\u003e\u003cpath d=\"M 220 280 L 340 280 L 340 110 L 220 110 Z\" fill=\"#ff7a90\" fill-opacity=\"0.14\" stroke=\"none\"/\u003e\u003ctext x=\"160\" y=\"92\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"14\"\u003eno LRO at T\u0026gt;0\u003c/text\u003e\u003ctext x=\"160\" y=\"108\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"14\"\u003eMermin–Wagner [12]\u003c/text\u003e\u003ccircle cx=\"220\" cy=\"280\" r=\"7\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"234\" y=\"284\" fill=\"#7aa2ff\" font-size=\"14\"\u003eIsing 1D: no order [6]\u003c/text\u003e\u003ccircle cx=\"340\" cy=\"280\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"354\" y=\"284\" fill=\"#7ee0a3\" font-size=\"14\"\u003eIsing 2D: orders [13, 14]\u003c/text\u003e\u003ccircle cx=\"340\" cy=\"200\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"354\" y=\"204\" fill=\"#ffb86b\" font-size=\"14\"\u003eXY 2D: BKT (quasi-LRO)\u003c/text\u003e\u003ccircle cx=\"460\" cy=\"200\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"474\" y=\"204\" fill=\"#7ee0a3\" font-size=\"14\"\u003eXY 3D: LRO\u003c/text\u003e\u003ccircle cx=\"460\" cy=\"120\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"474\" y=\"124\" fill=\"#7ee0a3\" font-size=\"14\"\u003eHeisenberg 3D: LRO [8, 9]\u003c/text\u003e\u003ccircle cx=\"580\" cy=\"120\" r=\"7\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"594\" y=\"124\" fill=\"#7aa2ff\" font-size=\"14\"\u003ed=4: mean-field exact\u003c/text\u003e\u003c/svg\u003e\n*Figure: The (symmetry, dimension) plane for short-ranged isotropic models. Pink region: continuous-symmetry breaking forbidden at $T\u003e0$ by Mermin–Wagner [12]. The 2D XY point escapes via topological (BKT) order, which the theorem does not forbid because correlations decay algebraically rather than saturating. Ising ($\\mathrm{Z}_2$) is exempt from the theorem in any $d\\ge 2$. Above $d_{\\text{UC}}=4$, mean-field exponents are exact.*\n\n**(iv) Bloch's $T^{3/2}$ law.** Heisenberg ferromagnets in 3D have gapless Goldstone modes (magnons) with $\\omega_k = D k^2$ at long wavelength. Bose-counting thermal magnons,\n$$\\Delta M(T) = \\frac{1}{S}\\int\\!\\frac{d^3k}{(2\\pi)^3}\\,\\frac{1}{e^{Dk^2/k_BT}-1}\\propto T^{3/2},$$\ngiving $M(T)=M(0)[1-(T/T_0)^{3/2}]$ [9]. **Silent assumptions:** (a) non-interacting magnons (Holstein–Primakoff to lowest order); (b) quadratic dispersion — no anisotropy gap, no relativistic corrections; (c) $d=3$ — the same integral diverges logarithmically at $d=2$, which is Mermin–Wagner as seen from the magnon side.\n\n**(v) Stoner criterion.** In the Hubbard model, Hartree–Fock decoupling of $U n_\\uparrow n_\\downarrow$ promotes a uniform exchange splitting $\\Delta = U(n_\\uparrow - n_\\downarrow)/2$. Solving self-consistently for the uniform susceptibility yields\n$$\\chi_s = \\frac{\\chi_0}{1-U N(E_F)} \\;\\;[10],$$\ndiverging — the paramagnet becoming unstable to ferromagnetism — when $U N(E_F)\u003e1$. **Silent assumptions:** (a) Hartree–Fock, i.e. no longitudinal correlations; (b) only the $q=0$ channel is examined, so finite-$q$ SDW (Overhauser) and Pomeranchuk instabilities are excluded by fiat; (c) a smooth DOS near $E_F$. In nearly-ferromagnetic d-metals these assumptions matter: paramagnon corrections in Moriya's self-consistent renormalization theory cut predicted $T_c$ by an order of magnitude.\n\n### What the skeleton hides\n\nThree silent assumptions span all five derivations and mark the perimeter of the mean-field consensus:\n\n1. **Single-site decoupling** is exact only in the $z\\to\\infty$ limit; the $1/z$ corrections carry all the fluctuation physics that separates universality classes.\n2. **The symmetry of the order parameter is put in by hand** through the form of $\\lambda M$. Whether $M$ is a scalar (Ising), planar (XY), or vector (Heisenberg) determines the Goldstone count and, with it, the Mermin–Wagner verdict.\n3. **The molecular-field constant $\\lambda$ is microscopically vacant** in Weiss's original presentation [3]. Heisenberg's [8] identification of it with exchange — and Dirac's 1929 reformulation as $H=-\\sum J_{ij}\\vec S_i\\cdot\\vec S_j$ (*verify*), popularized via Van Vleck's 1932 monograph (*verify*) — is what made the program quantitative. Treating $\\lambda$ as a phenomenological fitting constant, while still ubiquitous, conceals that the entire microscopic enterprise of §3 (direct, super-, double, RKKY, anisotropic exchange) is the project of *computing* $J_{ij}$ from first principles.\n\nBrush's reconstruction [7] is the canonical reminder that the historical order was nearly the reverse of the pedagogical one: Curie measured before Langevin computed, Weiss postulated before Heisenberg explained, Ising solved a special case before Peierls proved the general one had a transition. The mean-field skeleton looks tidy in retrospect; in 1928 it was a heap of unconnected calculations held together by the experimental fact that iron magnetizes."}, {"id": "exchange-mechanisms-zoology", "title": "A Zoology of Exchange: Direct, Super-, Double-, RKKY, Anisotropic", "markdown": "## A Zoology of Exchange: Direct, Super-, Double-, RKKY, Anisotropic\n\nThe bilinear form\n\n$$H_{\\text{ex}} = -\\sum_{\\langle ij\\rangle} J_{ij}\\,\\mathbf{S}_i\\cdot\\mathbf{S}_j$$\n\nis the great flattener of magnetism: a single symbol $J_{ij}$ that conceals at least half a dozen distinct microscopic mechanisms, each with its own sign convention, perturbative order, and regime of validity. The pedagogical sequence \"exchange equals overlap of wavefunctions, end of story\" is wrong twice — wrong about origin (most insulating $J$'s are not direct exchange) and wrong about form (real magnets carry antisymmetric and biquadratic pieces that the bilinear scalar form does not contain). This section catalogues the mechanisms and names what the textbooks routinely elide.\n\n### Direct (Heitler–London) exchange\n\nThe original mechanism. Two electrons in non-orthogonal orbitals $\\phi_a,\\phi_b$ on neighbouring sites; antisymmetrization of the spatial part forces singlet/triplet splitting\n\n$$E_S - E_T \\;=\\; 2\\,\\frac{K - S^2 H_{aa}}{1 - S^4} \\;\\approx\\; 2K - 4\\beta S \\quad (S\\ll 1),$$\n\nwith $K$ the two-electron exchange integral, $S=\\langle\\phi_a\\mid\\phi_b\\rangle$ the overlap, and $\\beta$ the one-electron hopping. Heisenberg's 1928 paper [8] is precisely this Heitler–London calculation extended to a many-electron lattice; the now-ubiquitous Pauli-spin form $-J\\,\\mathbf{S}_i\\cdot\\mathbf{S}_j$ is Dirac (1929, Proc. Roy. Soc. A 123, 714) (verify), popularised through Van Vleck's 1932 *Theory of Electric and Magnetic Susceptibilities*. The textbook claim that \"direct exchange is always ferromagnetic because $K\u003e0$\" is true only for strictly orthogonal orbitals on a single atom (Hund's first rule); between distinct sites the kinetic tail $-4\\beta S$ usually dominates and the sign flips antiferromagnetic. Genuinely direct, ferromagnetic $J$ is rare in the periodic table — Gd and a handful of $f$-electron metals are the standard examples — because the $3d/4f$ overlap between neighbouring sites in most transition-metal compounds is too weak to compete with the indirect channels below.\n\n### Kramers–Anderson superexchange\n\nThe dominant mechanism in insulating oxides, halides, and pnictides. Kramers (1934) [11] is the original construction: a virtual second-order process in which a $d$ electron hops onto a closed-shell ligand $p$ orbital and back, paying the charge-transfer gap as an intermediate-state energy. Anderson's 1950 paper [19] gave the quantitative Mott–Hubbard form\n\n$$J_{\\text{SE}} \\;=\\; \\frac{4 t^2}{U}\\quad(\\text{half-filled, single orbital, } t \\ll U),$$\n\nantiferromagnetic because the singlet alone permits virtual double occupancy; the triplet is Pauli-blocked. The textbook attribution \"Anderson superexchange\" silently erases Kramers's sixteen-year priority; Anderson's own 1950 paper cites [11] honestly and frames itself as a quantitative extension of an idea already in print.\n\nThe sign- and strength-rules for real materials are the Goodenough–Kanamori–Anderson (GKA) rules: Goodenough (Phys. Rev. 100, 564, 1955) and Kanamori (J. Phys. Chem. Solids 10, 87, 1959) (both verify), refined by Anderson (1959). The two cases worth memorising:\n\n- 180° cation–anion–cation, both half-filled $e_g$ orbitals: strong AF, $J\\sim 4t_{pd}^4/(U\\Delta^2)$ in fourth order.\n- 90° cation–anion–cation, orthogonal ligand $p$ orbitals on the two paths: weak FM via Hund's coupling on the anion.\n\nCuprates (180°, half-filled $d_{x^2-y^2}$) sit squarely on the first rule and give $J\\sim 130$ meV; CrBr$_3$ (≈90° edge-sharing octahedra) sits on the second. The standard textbook elision is to quote \"GKA rules\" as fixed laws rather than as the leading-order results of a specific perturbative scheme that breaks down for moderate $U/\\Delta$ and for orbitals with significant covalent admixture.\n\n### Zener double exchange\n\nMixed-valence ferromagnetism. Zener (1951) [17] noticed that in La$_{1-x}$Ca$_x$MnO$_3$, charge transport between Mn$^{3+}$ ($t_{2g}^3 e_g^1$) and Mn$^{4+}$ ($t_{2g}^3$) through the bridging O$^{2-}$ proceeds without paying $U$ — the $e_g$ electron simply moves — provided the three $t_{2g}$ core spins are aligned with it via Hund's $J_H$. Anderson and Hasegawa (Phys. Rev. 100, 675, 1955) (verify) made this quantitative: the effective hopping amplitude becomes\n\n$$t_{\\text{eff}}(\\theta) \\;=\\; t\\,\\cos(\\theta/2),$$\n\nwhere $\\theta$ is the angle between neighbouring core spins. Maximising kinetic energy maximises ferromagnetic alignment; hence the CMR phenomenology of the manganites. Crucially, double exchange is *real* electron transfer in lowest order — not a virtual fourth-order process — so it produces *metallic* ferromagnetism, sharply distinct from superexchange. Textbooks that lump \"double exchange\" together with superexchange under \"indirect exchange\" miss this transport signature.\n\n### The tripartite RKKY construction\n\nThe indirect coupling of localised moments through a conduction sea. Ruderman and Kittel (1954) [16] solved the original problem — nuclear $I$ coupled via $s$-band Pauli polarisation — and obtained the kernel\n\n$$\\chi(r) \\;\\propto\\; \\frac{2k_F r\\,\\cos(2k_F r) - \\sin(2k_F r)}{(2k_F r)^4},$$\n\nwhich at large $r$ becomes $\\cos(2k_F r)/r^3$. Kasuya (Prog. Theor. Phys. 16, 45, 1956) (verify) extended the same calculation to $d$ moments via the $s$–$d$ Hamiltonian, and Yosida (Phys. Rev. 106, 893, 1957) (verify) closed it for rare-earth $4f$ moments, deriving the canonical sign-oscillating $J(r)$ that organises Gd, Tb, Dy, and the heavy lanthanide spirals. The label \"RKKY\" is therefore a tripartite construction completed in 1957, not a single 1954 paper — the conflation is bibliographically convenient and historically wrong. RKKY is also the engineering mechanism behind interlayer exchange coupling in Fe/Cr/Fe trilayers, the platform of giant magnetoresistance.\n\n### Dzyaloshinskii–Moriya antisymmetric exchange\n\nWhen site $i$ and site $j$ are not related by a centre of inversion, spin–orbit coupling generates an antisymmetric term\n\n$$H_{\\text{DM}} \\;=\\; \\mathbf{D}_{ij}\\cdot(\\mathbf{S}_i\\times\\mathbf{S}_j),$$\n\nwith $\\mathbf{D}_{ij}$ of order $(\\Delta g/g)\\,J\\sim (\\lambda/\\Delta_{\\text{cf}})\\,J$. Dzyaloshinskii (J. Phys. Chem. Solids 4, 241, 1958) (verify) extracted it phenomenologically from a Landau expansion to explain the weak ferromagnetism of $\\alpha$-Fe$_2$O$_3$ and MnCO$_3$; Moriya (Phys. Rev. 120, 91, 1960) (verify) derived it microscopically and gave the symmetry rules that determine $\\hat{\\mathbf{D}}$ from the local bond environment. DM exchange is now the load-bearing ingredient of skyrmion lattices in MnSi and FeGe, of cycloidal multiferroics like TbMnO$_3$, and of canted-moment Hall responses in non-collinear antiferromagnets. The under-acknowledged subtlety: $\\mathbf{D}_{ij}=-\\mathbf{D}_{ji}$ as a vector but $\\mathbf{D}_{ij}\\cdot(\\mathbf{S}_i\\times\\mathbf{S}_j)=\\mathbf{D}_{ji}\\cdot(\\mathbf{S}_j\\times\\mathbf{S}_i)$, so the bond sense is set once and for all by the crystal symmetry — a point that disorients half the papers that try to fit DM by free parameter.\n\n### Biquadratic and ring exchange\n\nEven within a pure Heisenberg framework, fourth-order perturbation in $t/U$ generates terms the bilinear form does not capture:\n\n$$H_{(4)} \\;=\\; -K\\sum_{\\langle ij\\rangle}(\\mathbf{S}_i\\cdot\\mathbf{S}_j)^2 \\;+\\; K_{\\square}\\sum_{\\square}\\bigl[(\\mathbf{S}_i\\cdot\\mathbf{S}_j)(\\mathbf{S}_k\\cdot\\mathbf{S}_l) + \\cdots\\bigr].$$\n\nThe biquadratic coefficient $K\\sim 80\\,t^4/U^3$ is small for spin-$\\tfrac12$ but becomes appreciable for $S\\geq 1$ (where the bilinear and biquadratic terms are independent invariants), for multi-orbital systems where intra-atomic Hund coupling enhances it, and for magneto-elastic compounds where lattice relaxation feeds back into a $(\\mathbf{S}\\cdot\\mathbf{S})^2$ piece. Ring exchange $K_\\square$ is the well-documented organising term in solid $^3$He on the bcc lattice and is now invoked routinely in cuprate ladder physics. The conflation watch here: many \"anomalous\" deviations from $J$-only fits in inelastic neutron data are quietly absorbed into a renormalised $J$ rather than admitting that the underlying Hamiltonian is no longer purely bilinear.\n\nThe credit audit for this whole catalogue is uncomfortable. Kramers loses to Anderson, Kasuya and Yosida lose to Ruderman–Kittel, Dirac loses to Heisenberg, Goodenough and Kanamori lose to Anderson again, and Dzyaloshinskii's phenomenology is half-remembered as Moriya's microscopics. The phrase \"exchange interaction\" is in this sense a tribute to four generations of theorists whose names did not survive the abbreviation."}, {"id": "itinerant-versus-localized", "title": "Itinerant vs. Localized: Stoner, Nagaoka, and the Hubbard Continuum", "markdown": "## Itinerant vs. Localized: Stoner, Nagaoka, and the Hubbard Continuum\n\nThe phrase \"band ferromagnetism\" is a portmanteau that hides a category error. Stoner's 1938 instability [10] and Nagaoka's 1966 theorem [15] are both statements about itinerant electrons, and both are sometimes invoked to \"explain\" why iron, cobalt, and nickel are ferromagnets. But they sit at opposite ends of a single control parameter — the dimensionless interaction $U/W$, where $W$ is the bandwidth — and the mechanisms they describe share essentially no microscopic content. Reading them as variants of one another is the most common conceptual confusion in itinerant magnetism, and it is the reason mean-field Curie temperatures for transition metals come out wrong by a factor of three to ten.\n\n### The common stage: the one-band Hubbard model\n\nFix the arena. The model is\n$$H = -t\\sum_{\\langle ij\\rangle\\sigma}\\bigl(c^\\dagger_{i\\sigma}c_{j\\sigma}+\\text{h.c.}\\bigr) + U\\sum_i n_{i\\uparrow}n_{i\\downarrow},$$\nwith bandwidth $W = 2zt$ on a lattice of coordination $z$, density of states $N(\\varepsilon)$, and filling $n = N_e/N$. Two dimensionless ratios organize everything: the coupling $u \\equiv U/W$ and the doping $\\delta \\equiv \\mid 1-n\\mid$. Stoner lives at $u\\ll 1$, any $n$, in mean field. Nagaoka lives at $u\\to\\infty$, $\\delta\\to 0^+$, exactly, on bipartite lattices.\n\n### Stoner: weak coupling, Hartree–Fock, and Slater's shadow\n\nThe Stoner argument is the Hartree–Fock decoupling\n$$U n_{i\\uparrow}n_{i\\downarrow}\\;\\longrightarrow\\;U\\bigl(\\langle n_{i\\uparrow}\\rangle n_{i\\downarrow}+\\langle n_{i\\downarrow}\\rangle n_{i\\uparrow}\\bigr)-U\\langle n_{i\\uparrow}\\rangle\\langle n_{i\\downarrow}\\rangle.$$\nA uniform polarization $m = \\langle n_\\uparrow\\rangle - \\langle n_\\downarrow\\rangle$ shifts the two spin subbands rigidly by $\\pm Um/2$. Linearizing the self-consistency about $m=0$ gives the instability condition\n$$U\\,N(E_F) \u003e 1,$$\nthe celebrated Stoner criterion [10]. Above it, the paramagnetic Fermi sea is unstable to an infinitesimal exchange splitting; below it, a Stoner-enhanced susceptibility $\\chi = \\chi_0/[1-UN(E_F)]$. The construction is identical in spirit — and, when one writes it out for a tight-binding $d$ band, nearly identical in algebra — to Slater's 1936 spin-polarized band picture, a fact obscured by the British/American attribution split (verify; the Slater–Stoner equivalence was made explicit by Wohlfarth in the 1950s).\n\nTwo features of this derivation deserve emphasis, because they are routinely silently dropped. First, the only fluctuation kept is the longitudinal Hartree shift; transverse spin fluctuations (magnons, paramagnons) are projected out. Second, the temperature dependence of $m(T)$ in Stoner theory comes entirely from the Fermi function smearing the split bands — single-particle excitations across the gap. This predicts $T_C$ comparable to the exchange splitting $\\Delta = Um$, which for Fe, Co, Ni runs $1$–$2$ eV, i.e. $T_C^{\\text{Stoner}}\\sim 10^4$ K. The measured values are an order of magnitude smaller. The mode that destroys the order at the true $T_C$ is not single-particle: it is the transverse spin fluctuation, which Stoner discards by construction.\n\n### Moriya: the middle that everyone forgets\n\nThe repair is Moriya's self-consistent renormalization (SRR) theory of spin fluctuations (1973, *Prog. Theor. Phys.* 49, 970 — verify), built on the RPA susceptibility\n$$\\chi^{+-}(\\mathbf{q},\\omega) = \\frac{\\chi_0^{+-}(\\mathbf{q},\\omega)}{1-U\\chi_0^{+-}(\\mathbf{q},\\omega)}.$$\nIn a nearly ferromagnetic metal, $1-U\\chi_0(\\mathbf{0},0)$ is small but positive: the paramagnon pole sits just below the real axis, and low-energy transverse fluctuations dominate the entropy. Including their feedback on the static susceptibility — a self-consistency that resums the leading mode-coupling diagrams — yields a Curie–Weiss-like $\\chi(T)^{-1}\\propto T-T_C$ above the transition with a $T_C$ governed by the *fluctuation* scale, not the splitting scale. For Ni this brings the theoretical $T_C$ within a factor of two of $631$ K (verify). The lesson is structural: Stoner is exact at $T=0$ in the limit $U\\to 0^+$ where transverse fluctuations are gapped out at the Stoner energy; at finite $T$ near a real Curie point, the same fluctuations are massless and dominant.\n\n### Nagaoka: strong coupling, exact, fragile\n\nAt the opposite limit, set $U=\\infty$ and forbid double occupancy entirely. Take exactly one hole on a bipartite lattice (square, cubic, honeycomb...). Nagaoka [15] proved that the unique ground state (up to global SU(2)) is fully ferromagnetic: $S = S_{\\max} = N/2 - 1/2$. The mechanism is purely kinetic. A hole hopping through a background of immobile spins picks up a Berry-like sign from spin permutations along its path; when all spins are aligned, every closed loop contributes constructively to the hole's coherent bandwidth, lowering its kinetic energy by $\\sim t$. Any spin flip introduces destructive interference. There is no exchange integral, no $J$; the ferromagnet is the configuration that minimizes the hole's confinement, full stop.\n\nNagaoka's theorem is rigorous and surprising, but it is also a knife edge. Three perturbations destroy it: (i) finite hole density $\\delta \\gtrsim \\delta_c$ with $\\delta_c$ small and lattice-dependent — phase-separation and polaron arguments by Shastry–Krishnamurthy–Anderson and others (1990, verify) suggest $\\delta_c \\lesssim 0.2$ on the square lattice and possibly zero in the thermodynamic limit; (ii) finite $U$ at fixed $\\delta$, with virtual double occupancy generating an antiferromagnetic superexchange $J = 4t^2/U$ that overwhelms the kinetic gain for $U/t \\lesssim 50$; (iii) non-bipartite lattices, where the sign structure of hole hopping no longer favors the ferromagnetic background — the triangular lattice gives a counter-rotating chirality.\n\nThe recent demonstration of Nagaoka-like ferromagnetism in a four-site quantum-dot plaquette (Dehollain *et al.*, *Nature* 2020 — verify) and in optical-lattice Hubbard simulators (Prichard *et al.*, 2024 — verify) is not academic vindication only. It is the first experimental access to a magnetic ground state whose origin contains no exchange integral whatsoever.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePhase diagram of the one-band Hubbard model in U/W and doping\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"380\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003edoping δ = |1 − n| (away from half-filling)\u003c/text\u003e\u003ctext x=\"30\" y=\"190\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 30 190)\"\u003ecoupling U / W\u003c/text\u003e\u003ctext x=\"80\" y=\"358\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e0\u003c/text\u003e\u003ctext x=\"680\" y=\"358\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e1\u003c/text\u003e\u003ctext x=\"65\" y=\"345\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"65\" y=\"45\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003e∞\u003c/text\u003e\u003cline x1=\"80\" y1=\"280\" x2=\"680\" y2=\"280\" stroke=\"#e8e6e1\" stroke-width=\"0.7\" stroke-dasharray=\"3,3\"/\u003e\u003ctext x=\"690\" y=\"284\" fill=\"#e8e6e1\" font-size=\"12\"\u003eU·N(E_F)=1\u003c/text\u003e\u003crect x=\"80\" y=\"280\" width=\"600\" height=\"60\" fill=\"#7aa2ff\" fill-opacity=\"0.18\"/\u003e\u003ctext x=\"380\" y=\"318\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003ePauli paramagnet (weak correlation)\u003c/text\u003e\u003cpath d=\"M 80,280 Q 250,210 420,170 T 680,110\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ctext x=\"500\" y=\"200\" fill=\"#ffb86b\" font-size=\"14\"\u003eStoner ferromagnet (HF mean field)\u003c/text\u003e\u003ctext x=\"500\" y=\"218\" fill=\"#ffb86b\" font-size=\"12\"\u003eU·N(E_F) \u0026gt; 1, any δ\u003c/text\u003e\u003crect x=\"80\" y=\"40\" width=\"55\" height=\"240\" fill=\"#ff7a90\" fill-opacity=\"0.20\"/\u003e\u003ctext x=\"155\" y=\"80\" fill=\"#ff7a90\" font-size=\"14\"\u003eMott insulator + AF\u003c/text\u003e\u003ctext x=\"155\" y=\"98\" fill=\"#ff7a90\" font-size=\"12\"\u003eδ=0, J = 4t²/U\u003c/text\u003e\u003ccircle cx=\"100\" cy=\"60\" r=\"6\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"115\" y=\"64\" fill=\"#7ee0a3\" font-size=\"14\"\u003eNagaoka point: U→∞, one hole, bipartite\u003c/text\u003e\u003cpath d=\"M 100,60 Q 180,90 250,140\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" fill=\"none\" stroke-dasharray=\"4,3\"/\u003e\u003ctext x=\"260\" y=\"146\" fill=\"#7ee0a3\" font-size=\"12\"\u003efragile FM lobe (lattice-dependent)\u003c/text\u003e\u003cpath d=\"M 200,170 Q 320,200 460,230 T 680,260\" stroke=\"#e8e6e1\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"2,4\"/\u003e\u003ctext x=\"460\" y=\"252\" fill=\"#e8e6e1\" font-size=\"12\"\u003eMoriya SRR regime: paramagnons rule T_C\u003c/text\u003e\u003c/svg\u003e\n*Figure: The one-band Hubbard model in the $(\\delta, U/W)$ plane. Stoner is the weak-coupling lobe along the top of the orange curve; Nagaoka is the green point in the strong-coupling, low-doping corner; Moriya's self-consistent spin-fluctuation theory governs the dashed crossover where real $3d$ metals (Ni, ZrZn$_2$, Pd-near-FM) actually live. The Mott/antiferromagnetic slab at $\\delta=0$ is governed by the superexchange $J=4t^2/U$ generated by virtual double occupancy.*\n\n### Why they are not the same physics\n\nA compact contrast clarifies the stakes.\n\n| Aspect | Stoner (1938) [10] | Nagaoka (1966) [15] |\n|---|---|---|\n| Regime | $U/W\\ll 1$, any filling | $U/W\\to\\infty$, $\\delta=1/N\\to 0^+$ |\n| Status | Mean-field (Hartree–Fock) approximation | Rigorous theorem on bipartite lattices |\n| Order-parameter scale | $\\Delta = Um \\sim$ eV | $S = S_{\\max}$, kinetic gain $\\sim t$ |\n| Mechanism | Exchange splitting of a Fermi sea | Coherent hole motion in aligned background |\n| Robustness | Qualitatively correct for Fe, Co, Ni; $T_C$ wrong by $\\times 10$ | Destroyed by finite $\\delta$, finite $1/U$, or lattice frustration |\n| Fluctuations | Longitudinal only; transverse modes discarded | Theorem is about the exact ground state — fluctuations enter only in stability analyses |\n| Relation to exchange | $J_{\\text{eff}}$ generated from $U$ at second order is *not* used | No $J$ anywhere; mechanism is purely kinetic |\n\nThe Hubbard model has room for both because it has two limits. Stoner is what you get when you ask a free electron gas to break a symmetry while keeping the Hartree–Fock blinkers on; Nagaoka is what you get when you ask the wavefunction what it actually wants when the interaction is so large that the Hilbert space has been carved down to the no-double-occupancy subspace. Between them lies the territory that real materials occupy — strong, finite $U$, finite doping, finite temperature — and the honest names for what governs it are \"spin fluctuations\" (Moriya) and \"quantum Monte Carlo on small clusters\". Calling either limit \"the explanation of metallic ferromagnetism\" is a category error that has survived in textbooks because each is, separately, a beautiful piece of physics."}, {"id": "ising-evolution-and-what-superseded-what", "title": "The Lenz–Ising Lineage: From a 1920 Thesis Exercise to Universality Classes", "markdown": "## The Lenz–Ising Lineage: From a 1920 Thesis Exercise to Universality Classes\n\n### 1920: Lenz's quiet proposal\n\nThe model that bears Ising's name was set down by Wilhelm Lenz in a three-page note in *Physikalische Zeitschrift* [5]. Lenz's question was operational: could Weiss's molecular field [3] — a phenomenological $\\lambda M$ with no microscopic carrier — be generated by *local* couplings between atomic moments fixed to lattice sites? He posited that each site carries a discrete degree of freedom, two-valued under the crystalline anisotropy (he envisaged dipoles tunneling between symmetry-related minima), and that neighbours interact pairwise. The Hamiltonian\n\n$$H = -J \\sum_{\\langle ij\\rangle} \\sigma_i\\sigma_j - h \\sum_i \\sigma_i, \\qquad \\sigma_i = \\pm 1$$\n\nis not written in this form anywhere in Lenz's paper — that compact notation is post-Onsager — but the content is his. Lenz then handed the problem to his Hamburg student Ernst Ising as a thesis exercise. Brush's careful reconstruction of the Hamburg correspondence and seminar record [7] leaves no doubt about priority; the persistent \"Ising model\" is a bibliographic accident that *Lenz–Ising* would correct.\n\n### 1925: Ising's correct solution and incorrect inference\n\nIsing's published thesis [6] solved the one-dimensional chain exactly. With $N$ sites and periodic boundaries the partition function is\n\n$$Z_N = \\mathrm{Tr}\\,T^N, \\qquad T = \\begin{pmatrix} e^{\\beta(J+h)} \u0026 e^{-\\beta J} \\\\ e^{-\\beta J} \u0026 e^{\\beta(J-h)} \\end{pmatrix},$$\n\n— the transfer-matrix view, though Ising solved by direct combinatorics. At $h=0$ the free energy per site is $-\\beta^{-1}\\ln(2\\cosh\\beta J)$, analytic for all finite $T\u003e0$: no phase transition. Ising then made the leap that haunted the subject for a decade: he argued (by a crude perturbative extension) that *no* finite-dimensional version of the model would order, and concluded that the Lenz construction failed as a microscopic basis for ferromagnetism. The 1D result is rigorous and remains so; the higher-dimensional inference was wrong, and Ising's discouragement contributed to his leaving research. Heisenberg's 1928 turn to a continuous-spin, exchange-driven theory [8] was in part a response to Ising's pessimism, which was widely read as closing the lattice-model route.\n\n### 1936: Peierls and the contour argument\n\nPeierls [13] resurrected the model with a topological proof that the *two*-dimensional Ising ferromagnet does order at sufficiently low $T$. The argument: in a $+$ ground state, any minus-domain is bounded by a closed contour of length $L$ on the dual lattice; the Boltzmann weight of a configuration containing such a contour is suppressed by $e^{-2\\beta J L}$, while the entropic count of contours of length $L$ enclosing a fixed site grows only as $\\mu^L$ with $\\mu \\le 3$ (a simple Peierls bound — refined by later workers). For $\\beta$ large enough, $\\sum_L L\\mu^L e^{-2\\beta J L} \u003c \\tfrac{1}{2}$, so the expectation $\\langle\\sigma_0\\rangle$ cannot vanish. This is the first rigorous proof of spontaneous symmetry breaking in a short-range lattice model with discrete symmetry. It survives unaltered: the modern Pirogov–Sinai theory is its lineal descendant, and it remains the cleanest pedagogical demonstration that *finite-temperature order in $d\\ge 2$ requires nothing but the bare model* — no molecular field, no exchange microscopy.\n\n### 1941: Kramers–Wannier duality and the locus of $T_c$\n\nKramers and Wannier observed that the high- and low-temperature series of the 2D Ising model on the square lattice are related by\n\n$$\\sinh(2\\beta J)\\,\\sinh(2\\tilde\\beta J) = 1,$$\n\na self-duality between the bond representation (high-$T$) and the contour representation (low-$T$). Assuming a *single* transition, the self-dual point $\\sinh(2\\beta_c J)=1$, i.e. $k_B T_c/J = 2/\\ln(1+\\sqrt 2) \\approx 2.269$, must be it. This pinned $T_c$ three years before Onsager pinned the free energy. The duality remains rigorously valid as a relation between partition functions; the *uniqueness-of-transition* assumption is what Onsager's solution justified.\n\n### 1944: Onsager's exact solution\n\nOnsager's *Crystal Statistics* [14] is the high-water mark of pre-renormalization-group statistical mechanics. He diagonalized the row-to-row transfer matrix of the square-lattice Ising model in zero field by recognizing it as a product of operators generating a finite-dimensional Lie algebra (a free-fermion structure, in modern language). The result, per site,\n\n$$-\\beta f = \\ln(2\\cosh 2\\beta J) + \\frac{1}{2\\pi}\\int_0^\\pi \\ln\\!\\tfrac{1}{2}\\!\\left(1+\\sqrt{1-\\kappa^2\\sin^2\\phi}\\right)\\,d\\phi, \\qquad \\kappa = \\frac{2\\sinh 2\\beta J}{\\cosh^2 2\\beta J},$$\n\ngives a logarithmic singularity in the specific heat, $C \\sim -\\ln|T-T_c|$, at the Kramers–Wannier point. This was the first demonstration that a microscopic model could produce a *non-mean-field* second-order transition: $\\alpha = 0$ (log), not the mean-field $\\alpha = 0_{\\text{disc}}$. The mean-field critical exponents inherited from Weiss [3] were now provably wrong in $d=2$. Onsager announced the spontaneous magnetization\n\n$$M = \\left[1 - \\sinh^{-4}(2\\beta J)\\right]^{1/8}$$\n\nat a 1948 conference but did not publish a derivation. C. N. Yang's 1952 paper supplied the first published proof, by a tour-de-force calculation of an off-diagonal matrix element of the transfer matrix; this gave the order-parameter exponent $\\beta = 1/8$ rigorously. Kac and Ward (1952) then provided a combinatorial route to Onsager's free energy via a signed sum over closed graphs — a derivation later cleaned up by Sherman, Vdovichenko, and others, and which remains the basis of the modern Pfaffian / dimer formulation.\n\n### Transfer matrices, Bethe ansatz, and what does *not* generalize\n\nOnsager's free-fermion structure is special to $d=2$ and zero field. Three things are worth keeping separate:\n\n- The transfer matrix as a *method* generalizes to any $d$, but its spectrum is generically not integrable; one falls back on numerics (DMRG, in modern guise — itself a variational ansatz on the transfer-matrix eigenstate).\n- The *Bethe ansatz* solves the 1D anisotropic Heisenberg ($XXZ$) chain, not the Ising model in $d\\ge 2$. The Ising chain in a *transverse* field maps via Jordan–Wigner to free fermions and is exactly solvable; this is the quantum-classical correspondence between the 1D transverse-field Ising chain and the 2D classical Ising model, which is rigorous and is the simplest setting in which to see conformal invariance at criticality.\n- *No* exact closed-form solution exists for the 2D Ising model in nonzero field, or for the 3D Ising model in any field — and there are strong arguments (NP-hardness of the 3D partition function with fields) that none will. \"Ising is solved\" is shorthand for the $d=2$, $h=0$ case.\n\n### Wilson, universality, and \"Ising\" as a symmetry class\n\nThe reinterpretation that matters most for the working physicist came with Wilson's renormalization group (1971–72) and the $\\varepsilon$-expansion of Wilson and Fisher: the long-wavelength behaviour of *any* short-range model with a scalar order parameter and $\\mathbb{Z}_2$ symmetry — lattice gas, binary alloy, uniaxial ferromagnet, $\\phi^4$ field theory — flows to the same Wilson–Fisher fixed point and shares the same critical exponents. \"Ising universality class\" became a statement about the IR fixed point of the $\\phi^4$ theory in $4-\\varepsilon$ dimensions, not about $\\pm 1$ spins on a lattice. The 2D exponents Onsager and Yang obtained ($\\alpha = 0_{\\log}$, $\\beta = 1/8$, $\\gamma = 7/4$, $\\nu = 1$, $\\eta = 1/4$) are recovered as the central-charge-$1/2$ minimal model of Belavin–Polyakov–Zamolodchikov (1984) — the 2D Ising CFT — and the 3D exponents, long known approximately, are now pinned to six-digit precision by the conformal-bootstrap programme (Rychkov and collaborators, post-2012).\n\n### What stands and what was superseded\n\nRigorous and unsuperseded: Ising's 1D solution [6]; Peierls's existence-of-order proof in $d\\ge 2$ [13]; Kramers–Wannier duality as an identity between partition functions; Onsager's $d=2$, $h=0$ free energy [14] and Yang's spontaneous magnetization. Superseded as *interpretations*: Ising's no-transition extrapolation; the mean-field exponents inherited from Weiss [3] in any $d\u003c4$; the view of \"the Ising model\" as one object — it is a lattice model, a Euclidean field theory, a CFT at criticality, and a universality class, and conflating them remains a source of confusion in the modern literature, particularly in discussions of \"Ising anyons\" (which are about the $c=1/2$ topological order, not Lenz's $\\pm 1$ spins)."}, {"id": "landmark-experiments", "title": "Landmark Experiments: Bitter Powders, Shull's Neutrons, Spin-Polarized Tunneling, and Beyond", "markdown": "## Landmark Experiments: Bitter Powders, Shull's Neutrons, Spin-Polarized Tunneling, and Beyond\n\nCooperative magnetism is unusual in that the experimental signature of each idea usually arrived after — sometimes long after — the theoretical claim it would verify or falsify. The dossier below pairs prediction with measurement, in the order in which the experiments closed each loop.\n\n### 1895 — Curie's torsion susceptometer\n\nCurie's Paris thesis [1] is, before anything else, an instrument paper. The torsion-balance susceptometer he built at the École de Physique et Chimie Industrielles measured susceptibilities over roughly four decades and across nearly three decades of temperature, the high end reached in a custom Pt-wound furnace. Two facts emerged that the next half-century of theory existed to explain: (i) $\\chi_{\\text{para}}=C/T$ over a wide range for $\\mathrm{O_2}$, $\\mathrm{FeCl_3}$ solutions, and many salts; (ii) iron loses its ferromagnetism abruptly near 770 °C and above this its susceptibility joins a $1/T$ branch with a Curie constant of the same order as the salts. Weiss [3] would absorb the first as a limit of his molecular-field theory and the second as the defining *point de Curie*. Without Curie's instrument there is no Curie law, no Curie temperature, and no quantitative target for Weiss in 1907.\n\n### 1931 — Bitter powders: Weiss's domains made visible\n\nWeiss [3] had postulated domains as a logical necessity (a uniformly magnetized iron bar would have an absurd dipole field) but produced no evidence. Francis Bitter (verify) at MIT decanted colloidal magnetite onto polished iron in 1931 and photographed the micron-scale stripe and maze patterns that decorate closure-domain walls. The technique simultaneously confirmed Weiss's domain hypothesis and the Landau–Lifshitz (1935, verify) prediction $\\delta \\sim \\sqrt{A/K}$ for wall width: of order $50$–$100$ nm in soft Fe, kilometers wide compared to the lattice constant — the macroscopic signature of microscopic exchange stiffness $A \\sim J S^2/a$.\n\n### 1949 — Shull on MnO: a sublattice you could index\n\nNéel's 1932 [4] two-sublattice theory predicted antiferromagnets with a susceptibility cusp at $T_N$ and oppositely magnetized sublattices invisible to bulk magnetometry. The prediction lay unfalsifiable for seventeen years. Shull and Smart (verify) used the new Oak Ridge graphite-pile beam on powdered MnO and found, below $T_N=122$ K, magnetic Bragg peaks at $(\\tfrac12\\tfrac12\\tfrac12)$ of the chemical FCC cell — the magnetic unit cell doubled along $$. The peaks vanished above $T_N$. Their intensity tracked a Brillouin function, the temperature dependence of Néel's sublattice order parameter. The same campaign mapped $\\alpha\\text{-Fe}_2\\mathrm{O}_3$ and ferrimagnetic $\\mathrm{Fe_3O_4}$, confirming Néel's 1948 [18] account of magnetite as the difference of two unequal sublattices. The Néel Nobel lecture [20] credits Shull explicitly; the 1994 Nobel cemented neutron diffraction as the operational definition of magnetic order.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eMnO neutron diffraction above and below T_N\u003c/title\u003e\u003ctext x=\"360\" y=\"22\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003eShull–Smart (1949): magnetic Bragg peaks at half-integer indices below T_N\u003c/text\u003e\u003ctext x=\"70\" y=\"55\" fill=\"#e8e6e1\" font-size=\"14\"\u003eT \u0026gt; T_N (paramagnetic) — chemical cell only\u003c/text\u003e\u003cline x1=\"60\" y1=\"180\" x2=\"700\" y2=\"180\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"180\" x2=\"60\" y2=\"70\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"48\" y=\"125\" fill=\"#e8e6e1\" font-size=\"14\" transform=\"rotate(-90 48 125)\"\u003eI(Q)\u003c/text\u003e\u003cline x1=\"200\" y1=\"180\" x2=\"200\" y2=\"95\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"200\" y=\"88\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(111)\u003c/text\u003e\u003cline x1=\"275\" y1=\"180\" x2=\"275\" y2=\"115\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"275\" y=\"108\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(200)\u003c/text\u003e\u003cline x1=\"400\" y1=\"180\" x2=\"400\" y2=\"105\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"400\" y=\"98\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(220)\u003c/text\u003e\u003cline x1=\"495\" y1=\"180\" x2=\"495\" y2=\"125\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"495\" y=\"118\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(311)\u003c/text\u003e\u003cline x1=\"545\" y1=\"180\" x2=\"545\" y2=\"140\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"545\" y=\"133\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(222)\u003c/text\u003e\u003ctext x=\"70\" y=\"220\" fill=\"#e8e6e1\" font-size=\"14\"\u003eT \u0026lt; T_N (antiferromagnetic) — magnetic cell doubled along \u003c/text\u003e\u003cline x1=\"60\" y1=\"360\" x2=\"700\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"360\" x2=\"60\" y2=\"240\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"48\" y=\"305\" fill=\"#e8e6e1\" font-size=\"14\" transform=\"rotate(-90 48 305)\"\u003eI(Q)\u003c/text\u003e\u003cline x1=\"135\" y1=\"360\" x2=\"135\" y2=\"260\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"135\" y=\"253\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"11\"\u003e(½½½)\u003c/text\u003e\u003cline x1=\"240\" y1=\"360\" x2=\"240\" y2=\"290\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"240\" y=\"283\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"11\"\u003e(3/2 ½ ½)\u003c/text\u003e\u003cline x1=\"345\" y1=\"360\" x2=\"345\" y2=\"315\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"345\" y=\"308\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"11\"\u003e(3/2 3/2 ½)\u003c/text\u003e\u003cline x1=\"200\" y1=\"360\" x2=\"200\" y2=\"275\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"200\" y=\"268\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(111)\u003c/text\u003e\u003cline x1=\"275\" y1=\"360\" x2=\"275\" y2=\"295\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"275\" y=\"288\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(200)\u003c/text\u003e\u003cline x1=\"400\" y1=\"360\" x2=\"400\" y2=\"285\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"400\" y=\"278\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(220)\u003c/text\u003e\u003cline x1=\"495\" y1=\"360\" x2=\"495\" y2=\"305\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"495\" y=\"298\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"12\"\u003e(311)\u003c/text\u003e\u003ctext x=\"380\" y=\"385\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"13\"\u003escattering vector Q →\u003c/text\u003e\u003crect x=\"560\" y=\"245\" width=\"16\" height=\"3\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"582\" y=\"250\" fill=\"#e8e6e1\" font-size=\"12\"\u003enuclear Bragg\u003c/text\u003e\u003crect x=\"560\" y=\"263\" width=\"16\" height=\"3\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"582\" y=\"268\" fill=\"#e8e6e1\" font-size=\"12\"\u003emagnetic Bragg\u003c/text\u003e\u003c/svg\u003e\n*Figure: schematic powder patterns of MnO above and below the Néel temperature. The magnetic peaks at half-integer indices of the chemical FCC cell are the direct experimental footprint of a doubled magnetic unit cell — Néel's sublattices made visible.*\n\n### 1960s — de Haas–van Alphen on Ni: counting Stoner electrons\n\nThe Stoner picture [10] predicts that the up- and down-spin Fermi surfaces of Ni are rigidly shifted by an exchange splitting $\\Delta_{\\text{ex}}\\sim 0.3$ eV, depopulating the minority $3d$ states near $E_F$. dHvA and cyclotron-resonance work by Tsui, Stark, Hodges, and others through the 1960s (verify) mapped the extremal Fermi-surface areas separately for the two spin channels. The \"majority\" and \"minority\" surfaces are *not* in the proportion a rigid Stoner shift dictates: the minority $d$-pocket survives and the splitting at high-symmetry points is anisotropic. The data forced Wohlfarth (verify) and later Moriya to graft self-consistent spin-fluctuation corrections onto Stoner — the criterion $UN(E_F)\u003e1$ is right in spirit, quantitatively poor.\n\n### 1958– — Mössbauer on hyperfine fields\n\nThe 14.4 keV $^{57}\\mathrm{Fe}$ Mössbauer line (verify) opened a per-site magnetometer with $\\sim 10^{-9}$ eV resolution. The internal hyperfine field at Fe nuclei in $\\alpha$-Fe is $-33$ T at 4 K, dominated by the Fermi-contact term $-(8\\pi/3)\\mu_B \\langle|\\psi(0)|^2\\rangle_s$ of polarized core $s$-electrons. In magnetite [18] the two crystallographically distinct iron sites (tetrahedral A, octahedral B) yield two well-resolved sextets whose intensity ratio confirmed Néel's ferrimagnetic ordering. In dilute alloys Mössbauer measured the RKKY [16] oscillation in $B_{\\text{hf}}$ at non-magnetic impurities — a direct readout of $\\cos(2k_F r)/r^3$ at distances $r$ to neighbour shells around a Fe solute.\n\n### 1971 — Spin-polarized tunneling\n\nMeservey and Tedrow (verify) at MIT used a Zeeman-split superconducting Al film as a spin analyzer to measure tunneling spin polarizations $P_T$ of Ni, Co, Fe ($\\approx +33\\%, +35\\%, +44\\%$). The *sign* is positive — the majority $s$-like electrons dominate the tunneling current — which contradicts a naive Stoner reading in which the minority $d$-states at $E_F$ should win. The result repositioned the Stoner exchange splitting as an *excitation* account, not a transport account, and is the proximate ancestor of the spintronics literature: Julliere's TMR formula (1975, verify), the GMR effect (1988, verify), magnetic tunnel junctions.\n\n### 1970s– — Polarized neutrons on weak itinerant ferromagnets\n\nZrZn$_2$ ($T_C\\!\\approx\\!28$ K) and MnSi ($T_C\\!\\approx\\!29$ K) are textbook tests of itinerant magnetism: their ordered moments (0.17 and 0.4 $\\mu_B$ per formula unit) are small fractions of any localized spin assignment. Polarized-neutron form-factor measurements at ILL (verify) on ZrZn$_2$ showed a delocalized Bloch-function magnetization density — confirming the band picture but not the Stoner amplitudes. The $\\chi(T)$ of MnSi above $T_C$ is Curie–Weiss-like with an effective moment far in excess of the ordered moment, the signature of pre-existing local fluctuations that Moriya's SCR theory (verify) parametrizes. Stoner [10] survives as the kinematic skeleton; the thermodynamics is Moriya's.\n\n### 1970s– — Inelastic neutron scattering: magnons and the $T^{3/2}$ law\n\nBloch [9] predicted spin waves with dispersion $\\omega(q)=Dq^2$ at long wavelength in a ferromagnet, and the thermal occupation of these bosons giving\n$$M(T)=M(0)\\bigl[1-\\zeta(3/2)\\,(k_B T/4\\pi D)^{3/2}+\\cdots\\bigr].$$\nTriple-axis spectrometry at Brookhaven and Chalk River through the 1970s extracted $D$ directly for Fe, Ni, Co, EuO over much of the Brillouin zone and verified the $T^{3/2}$ law in Ni over more than two decades in $T$. In antiferromagnets the linear $\\omega=cq$ branch was confirmed first in $\\mathrm{MnF_2}$ (verify); inelastic scattering on KCuF$_3$ and CsNiCl$_3$ later furnished the experimental footprints of 1D des Cloizeaux–Pearson spinons and the Haldane gap.\n\n### 2009 — SANS skyrmion lattice in MnSi\n\nMühlbauer et al. (verify) at FRM-II resolved a hexagonal six-spot small-angle neutron pattern in MnSi just below $T_C$ in a small applied field — the diffraction signature of a triangular lattice of skyrmion tubes. The discovery closed a loop opened by Dzyaloshinskii and Moriya half a century earlier: the chiral DM exchange (cf. §3) does not merely cant spins by a constant angle but can stabilize topologically nontrivial textures with integer winding number per cell. Lorentz TEM imaging in Fe$_{0.5}$Co$_{0.5}$Si (Yu et al., verify) saw the same lattice in real space the following year.\n\n---\n\nThe instruments that mattered share a pattern: each measured a quantity the theory could only otherwise infer. Curie's susceptometer measured $\\chi(T)$; Bitter's colloid imaged domains; Shull's diffractometer counted sublattice peaks; dHvA counted Fermi pockets per spin channel; Mössbauer counted hyperfine fields per crystallographic site; polarized neutrons mapped magnetization density in reciprocal space; inelastic neutrons mapped $\\omega(\\mathbf q)$; tunneling resolved the spin polarization of an extracted current; SANS resolved a skyrmion lattice in $\\mathbf q$-space before Lorentz TEM resolved it in $\\mathbf r$-space. The Lenz–Ising–Heisenberg–Néel–Stoner family survives in its modern form because each of its predictions has been forced past a measurement of this granularity — and, where the prediction failed (rigid Stoner splittings, mean-field $T_C$ in nearly ferromagnetic metals, the positive sign of tunneling spin polarization), the experiment selected the survivor."}, {"id": "live-confusions-in-the-current-literature", "title": "Live Confusions: Where the Modern Literature Still Loses the Thread", "markdown": "## Live Confusions: Where the Modern Literature Still Loses the Thread\n\nFive mis-attributions and category errors recur with such regularity in contemporary papers, reviews, and graduate textbooks that they have effectively become folklore. Each is correctable in a sentence; each, left in place, distorts how the next generation reads the literature.\n\n### 1. The \"Heisenberg Hamiltonian\" was written down by Dirac\n\nThe compact bilinear\n\n$$H = -\\sum_{\\langle ij\\rangle} J_{ij}\\,\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$$\n\nis the workhorse of the field, and is universally attributed to Heisenberg [8]. Heisenberg's 1928 paper does not contain it. What Heisenberg constructs is a perturbative many-electron problem in the Heitler–London spirit: he writes the orbital exchange integral\n\n$$J_{ij} = \\int \\psi_i^{*}(1)\\psi_j^{*}(2)\\,\\frac{e^{2}}{r_{12}}\\,\\psi_j(1)\\psi_i(2)\\,d\\tau_1 d\\tau_2$$\n\nand shows, by counting how antisymmetrisation redistributes singlet and triplet weights, that the energy of a ferromagnetically aligned many-electron state can be lower than the antiferromagnetic one when $J_{ij}\u003e0$ and the coordination number is large enough. The spin operators $\\mathbf{S}_i$ never appear as dynamical variables on a lattice; the entire calculation is about orbital wavefunctions and the Pauli principle.\n\nThe reformulation as a Hamiltonian acting on spin degrees of freedom — the recognition that, on the singlet–triplet subspace of two electrons, the operator identity\n\n$$\\tfrac{1}{2}(1+\\boldsymbol{\\sigma}_1\\!\\cdot\\!\\boldsymbol{\\sigma}_2) = P_{\\text{exchange}}$$\n\nreduces the Coulomb-exchange contribution to a pure spin–spin form — is Dirac's, in his 1929 *Proc. Roy. Soc. A* paper on the quantum mechanics of many-electron systems (verify). Van Vleck's 1932 monograph then canonised the bilinear as the operational definition of \"exchange\" and propagated it to a generation of solid-state physicists (verify). The price of calling it \"Heisenberg's\" is the loss of the conceptual point that $\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$ is not the microscopic interaction; it is a *projected* effective Hamiltonian on the Hilbert subspace fixed by Pauli exchange. The distinction matters as soon as one asks why the operator survives the inclusion of multi-orbital structure, spin–orbit coupling, or itinerancy — it does, but only by virtue of the projection Dirac made explicit and Heisenberg did not.\n\n### 2. The Stoner criterion as a general condition for itinerant ferromagnetism\n\nStoner's collective-electron paper [10] is routinely cited for the inequality\n\n$$U\\,N(E_F) \u003e 1$$\n\nas if it were a sufficient condition for itinerant ferromagnetism. It is not. The criterion is the Hartree–Fock instability of the paramagnetic Fermi sea to a *uniform*, $\\mathbf{q}=0$ exchange splitting. Three silent assumptions are usually stripped.\n\n(i) The susceptibility is computed at the level of a single bubble — the static homogeneous limit of $\\chi_0(\\mathbf{q},\\omega)$ evaluated at $\\mathbf{q}=0$. Competing instabilities at finite $\\mathbf{q}$ (spin-density waves), in the charge channel (Pomeranchuk), or in higher angular-momentum spin channels are not part of the comparison.\n\n(ii) Longitudinal and transverse spin fluctuations are absent. In nearly ferromagnetic 3d metals — Pd, Ni$_3$Al, ZrZn$_2$ — the Stoner $T_C$ overestimates the observed Curie temperature by an order of magnitude, because the local moment is quenched by paramagnon fluctuations long before global order is destroyed. The standard correction is Moriya's self-consistent-renormalisation theory (verify); a textbook that presents Stoner as a complete theory of band magnetism owes the reader at least a footnote pointing to it.\n\n(iii) The criterion is mean-field, and as such inherits the disease that Mermin and Wagner [12] diagnosed in another guise: it cannot distinguish a true broken-symmetry transition from a smooth crossover, and it has no notion of dimensionality or Goldstone-mode entropy.\n\nIn short: $U N(E_F)\u003e1$ identifies the parameter window where, *if* the paramagnetic state ordered at all and *if* it ordered uniformly, the leading channel would be ferromagnetic. It is a screening tool, not a verdict.\n\n### 3. \"Anderson superexchange\" — Kramers got there first\n\nThe phrase \"Anderson superexchange\" has hardened into the standard credit for the mechanism by which two magnetic cations couple antiferromagnetically through a closed-shell anion. Anderson's 1950 paper [19] is a genuine advance — the first quantitative perturbative treatment, with the correct factor structure $\\sim t^{4}/(U^{2}\\Delta)$ for the cuprate-like geometry and a clear account of why the sign is antiferromagnetic for half-filled $d$-orbitals. But the mechanism itself is Kramers's, sixteen years earlier [11]. Kramers's 1934 *Physica* note, written in French and rarely reproduced in Anglophone bibliographies, sets up the virtual third-order pathway $3d \\to 2p \\to 3d$ through an oxygen ligand and identifies it as the origin of antiferromagnetic coupling in paramagnetic salts. Anderson cites Kramers approvingly; subsequent textbooks dropped the citation. The fair name is \"Kramers–Anderson superexchange\", and the fair history is that Kramers introduced the concept while Anderson supplied the quantitative apparatus later refined into the Goodenough–Kanamori–Anderson rules.\n\n### 4. \"Curie–Weiss\" is not one law\n\nThree distinct results are routinely compressed into one hyphenated phrase.\n\n$$\\chi = \\frac{C}{T} \\qquad \\text{(Curie, 1895 [1])}$$\n\nis the paramagnetic susceptibility of non-interacting moments, established empirically by Curie's torsion-balance measurements on Fe, Ni, and a range of oxygen-bearing compounds.\n\n$$\\chi = \\frac{C}{T - \\Theta_W} \\qquad \\text{(Weiss, 1907 [3])}$$\n\nis the molecular-field correction: the Langevin susceptibility evaluated at the effective field $H + \\lambda M$ gives a divergence at $T = \\Theta_W = C\\lambda$, with $\\Theta_W\u003e0$ above a ferromagnetic transition.\n\n$$\\chi = \\frac{C}{T + \\Theta_N} \\qquad \\text{(N\\'eel, 1932 [4])}$$\n\nis the two-sublattice molecular-field result that diagnoses an antiferromagnet by a *negative* Weiss intercept, with the susceptibility cusp at $T = \\Theta_N$ identified in [18] as the experimental signature of sublattice order. The lumped phrase \"Curie–Weiss behaviour\" obscures both N\\'eel's contribution and the sign convention that distinguishes ferro- from antiferromagnetic exchange in a high-temperature fit. When a contemporary paper reports $\\Theta_{CW} = -150~\\text{K}$ for a candidate spin liquid, what is being quoted is N\\'eel's extension of Weiss's molecular field, not anything Curie or Weiss themselves wrote.\n\n### 5. \"Kinetic ferromagnetism\" used as a label for any $U$-driven polarisation\n\nNagaoka's theorem [15] is precise: in the Hubbard model with $U=\\infty$, exactly one hole away from half-filling, on a finite bipartite lattice satisfying the connectivity hypothesis (sign-problem-free hole motion in the maximal-spin sector), the ground state is fully spin-polarised. The polarisation is \"kinetic\" in the strict sense that it minimises a hopping energy: parallel-spin alignment removes the on-site Coulomb blockade that would otherwise impede the hole's coherent motion through every closed loop.\n\nIn the recent literature on moir\\'e systems, triangular-lattice optical-lattice experiments, and finite-cluster numerics, the same phrase is applied to any polarised state that appears at large $U$ and finite hole doping. This is a category drift. Away from the Nagaoka point, ferromagnetism in doped Hubbard models requires either (a) flat-band conditions of the Mielke–Tasaki type (verify), (b) special lattice geometries (Kagome line graphs), or (c) finite Hund's coupling $J_H$ in multi-orbital settings — each with its own microscopic mechanism and a parameter window that does not include Nagaoka's. Calling all of them \"kinetic ferromagnetism\" elides the distinction between an exact theorem and a family of mechanisms that share only the negative attribute of not being Stoner. The honest taxonomy keeps \"Nagaoka ferromagnetism\" for the $U=\\infty$, single-hole, bipartite-lattice statement, and reserves \"flat-band ferromagnetism\" or \"Hund's ferromagnetism\" for the alternatives. The cost of the loose usage is that readers infer a Nagaoka-strength theorem where only a numerical observation, often on small clusters and at finite $U$, has actually been made."}, {"id": "frontier-and-open-problems", "title": "The Frontier: Frustration, Spin Liquids, Altermagnetism, and Moiré Magnets", "markdown": "## The Frontier: Frustration, Spin Liquids, Altermagnetism, and Moiré Magnets\n\nThe classical lineage closed by §7 — Curie's susceptometer, Weiss's $\\lambda$, Heisenberg's exchange, Stoner's band splitting, Néel's two sublattices — handles every ordered phase whose order parameter is a single $\\mathbf{m}(\\mathbf{r})$ that condenses at a finite $T_{\\rm c}$. The live problems are precisely those where this assumption fails: degeneracy survives to $T=0$, the local moment is itself emergent, the order parameter has more structure than $\\mathrm{O}(3)$, or the lattice itself is a control knob. Six fronts are worth a credit-aware audit.\n\n### Frustration and the pyrochlore spin ices\n\nThe pyrochlores $\\mathrm{Dy_2Ti_2O_7}$ and $\\mathrm{Ho_2Ti_2O_7}$ realize a corner-sharing tetrahedral lattice of Ising-like rare-earth moments whose crystal-field axis points to the tetrahedron centre. The local \"two-in/two-out\" ice rule generates an extensive ground-state degeneracy formally identical to Pauling's residual entropy of water ice. Castelnovo, Moessner, and Sondhi showed that violating the ice rule fractionalizes a flipped dipole into a pair of emergent monopoles connected by a Dirac string, with an effective magnetic Coulomb interaction set by the lattice geometry ([Nature 451, 42 (2008)](https://www.nature.com/articles/nature06433)). The neutron and magnetization signatures of these excitations are by now well established ([Morris et al., Science 326, 411 (2009)](https://www.science.org/doi/10.1126/science.1178868); [Bramwell et al., Nature 461, 956 (2009)](https://www.nature.com/articles/nature08500)) — *established*. What is *folklore* is the casual identification of the emergent magnetic monopole with a fundamental Dirac monopole; the object is a defect in an emergent $\\mathrm{U}(1)$ gauge theory whose photon is hosted by the spin manifold, not by Maxwell's vacuum. Recent work has also documented \"refrustration\" — extra dipolar and exchange terms partly lift the ice degeneracy and modify low-$T$ dynamics ([arXiv:1512.05361](https://arxiv.org/abs/1512.05361)), so the canonical nearest-neighbour spin-ice picture is itself a leading-order model.\n\n### The Kitaev honeycomb and the spin-liquid program\n\nKitaev's 2006 honeycomb model is the rare exactly solvable interacting spin model in 2D: bond-dependent Ising couplings $K_x S_i^x S_j^x + K_y S_i^y S_j^y + K_z S_i^z S_j^z$ on a tricoordinated lattice, soluble by a Jordan–Wigner-like Majorana decomposition with a static $\\mathbb{Z}_2$ gauge field ([Ann. Phys. 321, 2 (2006)](https://www.sciencedirect.com/science/article/pii/S0003491605002381)). The gapped phase in a magnetic field is non-Abelian and supports Ising anyons — a clean theoretical target. $\\alpha$-$\\mathrm{RuCl_3}$ became the candidate material once $d^5$ jeff $=1/2$ moments and Ru–Cl–Ru bonding geometry were shown to generate sizeable Kitaev terms.\n\nThe status here deserves precision. The exact solution and its anyon spectrum are *established*. The Kasahara group's report of a half-quantized thermal Hall conductivity $\\kappa_{xy}/T = (\\pi/12)(k_{\\rm B}^2/\\hbar)$ in an in-plane field ([Nature 559, 227 (2018)](https://www.nature.com/articles/s41586-018-0274-0)) is *plausible but contested*: subsequent measurements have shown strong sample dependence, with some ultraclean crystals failing to reproduce the plateau and substantial phonon contributions to $\\kappa_{xy}$ ([Czajka et al., Nat. Phys. 2022](https://www.nature.com/articles/s41567-021-01501-y); see also [npj Quantum Materials 2025 review](https://www.nature.com/articles/s41535-025-00811-1)). \"Kitaev physics realized in $\\alpha$-$\\mathrm{RuCl_3}$\" is *folklore* in the absence of a reproducible quantized signature.\n\n### Altermagnetism: a third collinear class\n\nThe Šmejkal–Sinova–Jungwirth classification ([PRX 12, 031042 (2022)](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.12.031042); [PRX 12, 040501 (2022)](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.12.040501)) identifies a third collinear class beyond Weiss's ferromagnet and Néel's antiferromagnet. Altermagnets are compensated collinear magnets in which the two spin sublattices are related not by translation or inversion but by a *rotation* (proper or improper). The non-relativistic spin point group therefore allows a momentum-dependent spin splitting $\\Delta_\\sigma(\\mathbf{k})$ of $d$-, $g$-, or $i$-wave symmetry, with zero net moment but anomalous-Hall, magneto-optic, and spin-current responses — phenomena once thought to require a finite $\\mathbf{M}$.\n\nThe classification scheme is *established* on symmetry grounds and is now supported by direct ARPES observation of large altermagnetic band splitting in CrSb ($\\sim 1\\,{\\rm eV}$, $g$-wave; [Nat. Commun. 15, 2116 (2024)](https://www.nature.com/articles/s41467-024-46476-5); [Nat. Commun. 16, 1442 (2025)](https://www.nature.com/articles/s41467-025-56647-7)) and consistent signatures in $\\alpha$-MnTe. Less settled is the *material list*: $\\mathrm{RuO_2}$, the original poster child, has been challenged by μSR studies that find a nonmagnetic ground state ([npj Spintronics 2024](https://www.nature.com/articles/s44306-024-00055-y)) and by lattice-dynamics/Mössbauer evidence that electronic correlations, not magnetic order, dominate the phonon spectrum ([Cell Rep. Phys. Sci. 2025](https://www.cell.com/cell-reports-physical-science/fulltext/S2666-3864(25)00451-5)). Calling $\\mathrm{RuO_2}$ an altermagnet in 2026 is *no longer defensible*; the classification itself remains intact.\n\n### 2D van der Waals magnets and the Mermin–Wagner loophole\n\nMermin and Wagner [12] forbid long-range order at finite $T$ in the isotropic Heisenberg model in $d\\le 2$ because Goldstone modes have a logarithmically divergent thermal population — the proof requires $\\mathrm{SU}(2)$ symmetry to be exact. Any single-ion or exchange anisotropy that opens a magnon gap $\\Delta$ exits the hypothesis. Monolayer CrI$_3$ ($T_{\\rm c}\\!\\approx\\!45$ K, out-of-plane easy axis from the strong I $5p$ spin–orbit coupling; [Huang et al., Nature 546, 270 (2017)](https://www.nature.com/articles/nature22391)) and few-layer Fe$_3$GeTe$_2$ ($T_{\\rm c}\\!\\sim\\!130$ K in the monolayer, $\\sim\\!200$ K in five layers; [Deng et al., Nature 563, 94 (2018)](https://www.nature.com/articles/s41586-018-0626-9)) are textbook realizations: anisotropy makes them effectively Ising or $XY$, and Mermin–Wagner does not apply. The persistent claim that these materials \"violate\" Mermin–Wagner is *folklore*; they satisfy a strictly different hypothesis.\n\n### Moiré-engineered flat-band magnetism\n\nTwisting two layers of a vdW magnet generates a moiré superlattice in which the interlayer exchange $J_\\perp(\\mathbf{r})$ varies between ferromagnetic and antiferromagnetic depending on local stacking registry. In small-twist CrI$_3$ bilayers this produces a ground state of coexisting FM and AFM domains pinned to the moiré, transitioning to uniform FM above a critical twist of $\\sim 3^\\circ$ ([Xie et al., Nat. Nanotechnol. 17, 143 (2022)](https://www.nature.com/articles/s41565-021-01014-y); [Song et al., Science 374, 1140 (2021)](https://www.science.org/doi/10.1126/science.abj7478)). The phenomenology — moiré-pinned magnetic textures, noncollinear states, and proposals for moiré skyrmions — is now *established* qualitatively, with the detailed phase diagram still under construction. Distinct from moiré magnetism is the flat-band route in twisted graphene multilayers, where Stoner-like instabilities of an isolated narrow band produce orbital ferromagnets and the quantum anomalous Hall effect — these are not local-moment systems and should not be conflated with the CrI$_3$ family.\n\n### Nagaoka, reborn in cold atoms\n\nNagaoka's 1966 theorem [15] applied to a single hole in the $U=\\infty$ Hubbard model on a bipartite lattice. The Lebrat–Greiner and Prichard–Bakr collaborations independently imaged Nagaoka-type polarons in 2024 — finite ferromagnetic bubbles surrounding mobile dopants in a triangular-lattice Fermi–Hubbard quantum gas microscope ([Lebrat et al., Nature 629, 317 (2024)](https://www.nature.com/articles/s41586-024-07272-9); [Prichard et al., Nature 629, 323 (2024)](https://www.nature.com/articles/s41586-024-07292-5)). Two cautions: the experimental regime is large but finite $U/t$, and the triangular lattice is non-bipartite — so the theorem's hypotheses are not literally satisfied, but the polaron is the natural finite-$U$, finite-frustration descendant of the Nagaoka state. The observation is *established*; the identification with \"the Nagaoka mechanism\" is *defensible but technically loose*, and authors who claim more should be read carefully.\n\n### Where the framework runs out\n\nEach frontier maps cleanly onto a failure mode of the Curie–Weiss–Heisenberg–Stoner program. Spin ice fails the assumption that the ground state is unique. Kitaev liquids fail the assumption that the low-energy degrees of freedom are spins at all — they are Majoranas and a $\\mathbb{Z}_2$ gauge field. Altermagnetism fails the assumption that compensated order has trivial transport. 2D vdW magnets fail the assumption that anisotropy is a small correction. Moiré systems fail the assumption that the lattice is fixed. Nagaoka polarons fail the assumption that exchange — not hopping — is what aligns spins. The verdict for §8 of the dossier is that no single replacement framework has emerged; what has emerged is a clean catalogue of which classical assumption each new system breaks."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent eight sections refusing to launder textbook attributions. In closing I will state, without hedging, what I think the durable content of cooperative magnetism actually is, where the field is sleepwalking past its own assumptions, and what I would put my name on next.\n\n### (a) What I will defend with my reputation\n\nThe Lenz–Ising–Peierls–Onsager edifice is the single most secure result in condensed matter. The Z$_2$ universality class is real, its critical exponents are exact in $d=2$, and Onsager's free energy is one of the very few non-trivial closed-form solutions of an interacting many-body problem in physics. I will defend it against any \"modern\" reformulation that tries to relativize it.\n\nThe Dirac–Heitler–London identification of exchange as an antisymmetrization energy — not a magnetic interaction — is the correct microscopic origin of $J$ in insulators. The compact bilinear $H=-\\sum J_{ij}\\,\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$ is Dirac's, not Heisenberg's, and I will keep saying so.\n\nNagaoka's theorem, Mermin–Wagner, the Lieb–Mattis theorem for the half-filled Hubbard model on bipartite lattices, and Kramers' superexchange mechanism are rigorous and load-bearing. They survive every fashion cycle.
