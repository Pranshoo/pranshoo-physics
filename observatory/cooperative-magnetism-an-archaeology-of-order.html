leBody": "Before the Models: Curie, Langevin, Weiss — and the Pioneers the Textbooks Lost Before the Models: Curie, Langevin, Weiss — and the Pioneers the Textbooks Lost 1895: Curie measures, and a temperature gets a name Pierre Curie's 1895 Paris thesis is two distinct works bound under one title. The diamagnetic half — the observation that the susceptibility of bismuth, antimony, and a host of \"feebly magnetic\" substances is temperature-independent — is what occupied most of the bench time. The paramagnetic half, a few dozen pages, contains what every physicist now calls the Curie law extracted from measurements on oxygen gas and on a battery of iron, palladium, and rare-earth salts in his elder brother Jacques's piezoelectric susceptometer. In the same memoir Curie reports the disappearance of spontaneous magnetization in iron near 1043\\,\\mathrm{K} — the point de transformation later universally called the Curie temperature T C. The thesis is silent on mechanism: Curie was an experimentalist closing a regression, not a theorist proposing a model. 1905: Langevin classicizes the paramagnet Langevin's 1905 Magnétisme et théorie des électrons is the first statistical-mechanical derivation of \\chi(T). Taking N classical dipoles of moment \\mu in a field H at temperature T, the Boltzmann average gives the Langevin function For small x, \\mathcal{L}(x)\\simeq x/3, recovering Curie's law with C = N\\mu^{2}/3k B. Langevin also disposed of diamagnetism by an electron-orbital argument that survives in modified form as the Langevin–Larmor diamagnetic formula. The result is wholly classical: Bohr and van Leeuwen would soon show that strict classical statistics in fact forbids magnetism altogether, so Langevin's derivation must be read as a semi-classical limit of what would later be Brillouin's quantized form. Within its regime it is exact. 1907: Weiss invents a field he cannot justify Three years later Weiss supplements Langevin with the hypothèse du champ moléculaire : each dipole sees not the applied field H but an effective field Self-consistency in Langevin's equation now generates spontaneous magnetization below a critical temperature and, in the paramagnetic regime above it, the Curie–Weiss law . The bibliographic shorthand is convenient but misleading: \\chi = C/T is Curie 1895; the shift T \\to T - \\Theta is Weiss 1907; the extrapolation T \\to T + \\Theta N that diagnoses antiferromagnets is Néel 1932 . Three different acts, three different decades. The conceptual scandal in Weiss's paper, openly acknowledged by Weiss himself, is the magnitude of \\lambda. To reproduce \\Theta \\sim 10^{3}\\,\\mathrm{K} in iron one needs \\lambda \\sim 10^{3} in CGS, i.e. an internal field of order 10^{7}\\,\\mathrm{Oe} — roughly four orders of magnitude larger than any classical dipolar field a neighbour can produce. Weiss had a phenomenology that worked; he had no microscopic basis. For two decades \\lambda was a placeholder. 1920: Lenz proposes a lattice — and hands it to a student In a short, often-overlooked 1920 paper in Physikalische Zeitschrift , Wilhelm Lenz proposed that Weiss's molecular field might arise from purely local couplings between elementary \"molecular magnets\" pinned to lattice sites and restricted to two orientations. Lenz did not solve the resulting model; he posed it as a problem and, after moving from Rostock to Hamburg, assigned the one-dimensional case to his doctoral student Ernst Ising. Ising's 1924 dissertation appeared in print in 1925 with the exact 1D solution and no phase transition at any finite T. Ising extrapolated — wrongly — that no Lenz-type model would order in any dimension and dismissed the construction as a failed account of ferromagnetism. The historical correction is unambiguous: the lattice model now universally called Ising is Lenz's; Ising solved a single dimensional case and drew an erroneous moral from it. Brush's 1967 reconstruction from Hamburg correspondence makes the priority explicit. Lenz–Ising is the bibliographically honest name; the dossier will use it. 1928: Heisenberg supplies the missing field Heisenberg's 1928 paper solved Weiss's scandal. Taking two electrons in orthogonal atomic orbitals \\phi a,\\phi b, antisymmetry of the spatial-times-spin wavefunction forces the singlet and triplet to differ in energy by twice the exchange integral A modest J \\sim 10^{-2}\\,\\mathrm{eV} is enough to reproduce T C for iron, and the magnitude is electrostatic, not magnetostatic. The paper is a Heitler–London-style many-electron calculation, not a spin Hamiltonian: nowhere in Heisenberg 1928 does the compact form -\\sum J\\,\\mathbf{S} i\\!\\cdot\\!\\mathbf{S} j appear. That bilinear rewriting was Dirac's, in On the theory of quantum mechanics (Proc. Roy. Soc. A 123 , 714, 1929) (verify), where the spin-permutation identity P {12}^{\\sigma} = \\tfrac{1}{2}(1 + \\boldsymbol{\\sigma} 1\\!\\cdot\\!\\boldsymbol{\\sigma} 2) converts the singlet-triplet splitting into the now-canonical scalar form. Yakov Frenkel's nearly simultaneous Elementare Theorie magnetischer und elektrischer Eigenschaften der Metalle (Z. Physik 49 , 31, 1928) (verify) independently identified electron exchange as the seat of ferromagnetism, with greater emphasis on band-like itinerancy that would resurface in Bloch and Stoner . Frenkel is conspicuously absent from Anglophone textbooks; the standard genealogy \"Heisenberg → Van Vleck\" elides both Dirac's reformulation and Frenkel's independent contribution. 1934: Kramers, in French, builds the bridge to insulators Heisenberg's exchange is short-ranged: two magnetic ions separated by a closed-shell anion (as in MnO, NiO, the rare-earth oxides) have vanishing direct overlap and therefore vanishing direct exchange — yet they order. Hendrik Kramers's 1934 Physica paper , written in French and rarely cited in its original form, supplied the resolution: a virtual perturbative pathway 3d \\to 2p \\to 3d through the intervening oxygen transfers a kinetic-energy penalty that depends on the relative spin orientation of the two cations, generating an effective antiferromagnetic coupling of order t^{4}/U^{2}\\Delta. This is superexchange . Anderson's 1950 paper (covered in §3) is a quantitative deepening, not the origin; the modern phrase \"Anderson superexchange\" truncates a sixteen-year priority that Anderson himself acknowledged in print. The credit map this dossier will honor The 1895–1934 arc therefore breaks into six distinct intellectual acts, not the three usually conflated: Year Act Author(s) What is not it --- --- --- --- 1895 \\chi = C/T and T C as datum Curie not a theory of mechanism 1905 classical statistics \\Rightarrow \\mathcal{L}(x) Langevin not yet a Curie–Weiss law 1907 molecular field \\lambda, \\chi = C/(T-\\Theta) Weiss no microscopic content 1920 binary-spin lattice model Lenz \"Ising\" is a misnomer 1925 1D solution, wrong extrapolation Ising not the model itself 1928–29 exchange as origin of \\lambda; bilinear spin form Heisenberg , Dirac (verify), Frenkel (verify) Heisenberg did not write -J\\mathbf{S} i\\!\\cdot\\!\\mathbf{S} j 1934 superexchange via virtual ligand hopping Kramers predates Anderson by sixteen years Each subsequent section of this dossier — the Hamiltonians of §2, the exchange zoology of §3, the Lenz–Ising lineage of §5 — will be built on this audit rather than on the textbook shorthand it corrects. The Pedagogical Core: Hamiltonians, Order Parameters, and Mean Fields The Pedagogical Core: Hamiltonians, Order Parameters, and Mean Fields The five Hamiltonians, side by side Modern magnetism rests on a small set of model Hamiltonians. Each is defined by what is fixed (the local degree of freedom and its symmetry) and what is allowed to fluctuate. Writing them together makes the differences pedagogically sharp: Model Hamiltonian DOF Global symmetry Order parameter d {\\text{LC}} d {\\text{UC}} --- --- --- --- --- --- --- Lenz–Ising [5, 6] -J\\sum {\\langle ij\\rangle}\\sigma i\\sigma j - h\\sum i\\sigma i, \\sigma i=\\pm1 classical scalar \\mathrm{Z} 2 m=\\langle\\sigma\\rangle 1 4 XY -J\\sum {\\langle ij\\rangle}(S i^x S j^x+S i^y S j^y) 2-component spin \\mathrm{O}(2) \\vec m \\perp 2 (BKT) 4 Heisenberg -J\\sum {\\langle ij\\rangle}\\vec S i\\cdot\\vec S j 3-component spin \\mathrm{O}(3) \\vec m 2 4 Hubbard -t\\sum {\\langle ij\\rangle\\sigma}c^\\dagger {i\\sigma}c {j\\sigma}+U\\sum i n {i\\uparrow}n {i\\downarrow} itinerant fermions \\mathrm{U}(1)\\times\\mathrm{SU}(2) m (Stoner), \\vec n {\\mathbf Q} (SDW) — — s–d / Kondo lattice -t\\sum c^\\dagger c + J K\\sum i \\vec s i\\cdot\\vec S i band + local spins \\mathrm{SU}(2) m c, m f, Kondo singlet \\langle \\vec s\\cdot\\vec S\\rangle — — The Mermin–Wagner theorem is the cleanest organizing principle behind the d {\\text{LC}} column: spontaneous breaking of a continuous symmetry is forbidden at T 0 in d\\le 2 for short-ranged isotropic Heisenberg and XY systems. Ising survives in d=2 because \\mathrm{Z} 2 is discrete (Peierls's contour argument ; Onsager's exact free energy ). In d=2 the XY model loses true long-range order yet retains an algebraic phase below the Berezinskii–Kosterlitz–Thouless transition; Mermin–Wagner is silent on it because the theorem forbids only \\langle\\vec S\\rangle\\ne 0, not power-law correlations. The Hubbard model (Hubbard, Gutzwiller, Kanamori, 1963 — verify ) interpolates between Stoner (weak U/t, itinerant) and Heisenberg (large U/t at half filling, J\\sim 4t^2/U via superexchange, §3) and contains Nagaoka as its singular U\\to\\infty, single-hole limit. The s–d / Kondo lattice — written down by Vonsovskii and Zener ( verify ) — is the natural home for RKKY , heavy fermions, and double exchange . One mean-field skeleton; five consequences Every classical mean-field result in this family flows from the same single-site decoupling. Replace the environment of spin i by an effective field with \\lambda the Weiss molecular-field constant . The microscopic content of \\lambda — that it is exchange, not dipolar — is Heisenberg's ; Weiss left it as a fitted number nearly 10^3 times larger than any dipolar estimate. (i) Langevin function and the classical Curie law. For a continuous classical moment \\mu in field B, the single-spin partition function is Z 1=\\int d\\Omega\\,e^{\\mu B\\cos\\theta/k B T}=4\\pi\\sinh x/x with x=\\mu B/k B T, so Expanding L(x)\\approx x/3 gives \\chi = n\\mu^2/3k BT \\equiv C/T, the law Curie measured in 1895 . Silent assumptions: the moment magnitude \\mu is fixed and classical; the quantum Brillouin function B J(x) replaces L(x) at finite J and reduces to it only as J\\to\\infty. (ii) Curie–Weiss from Langevin + Weiss. Insert H {\\text{eff}} into the self-consistency M=n\\mu L(\\mu H {\\text{eff}}/k B T) and linearize: Silent assumptions: (a) Gaussian fluctuations of H {\\text{eff}} around its mean are neglected — strictly exact only at infinite coordination z\\to\\infty; (b) \\lambda M couples only to the longitudinal channel; (c) the implied critical exponents \\beta=1/2,\\gamma=1,\\delta=3 are mean-field and therefore wrong below the upper critical dimension d {\\text{UC}}=4. (iii) Néel two-sublattice antiferromagnet. Split the lattice into A, B with M A=-M B in the ordered phase; each sublattice sees H {\\text{eff}}^A=H-\\lambda M B. Linearizing the coupled equations , with a cusp at T N and, below T N, the celebrated split \\chi \\parallel\\to 0, \\chi \\perp=1/\\lambda. Silent assumption: a single intersublattice coupling. The ferrimagnetic generalization permits M A \\ne M B and yields Néel's compensation-point susceptibility. Figure: The (symmetry, dimension) plane for short-ranged isotropic models. Pink region: continuous-symmetry breaking forbidden at T 0 by Mermin–Wagner . The 2D XY point escapes via topological (BKT) order, which the theorem does not forbid because correlations decay algebraically rather than saturating. Ising (\\mathrm{Z} 2) is exempt from the theorem in any d\\ge 2. Above d {\\text{UC}}=4, mean-field exponents are exact. (iv) Bloch's T^{3/2} law. Heisenberg ferromagnets in 3D have gapless Goldstone modes (magnons) with \\omega k = D k^2 at long wavelength. Bose-counting thermal magnons, giving M(T)=M(0)[1-(T/T 0)^{3/2}] . Silent assumptions: (a) non-interacting magnons (Holstein–Primakoff to lowest order); (b) quadratic dispersion — no anisotropy gap, no relativistic corrections; (c) d=3 — the same integral diverges logarithmically at d=2, which is Mermin–Wagner as seen from the magnon side. (v) Stoner criterion. In the Hubbard model, Hartree–Fock decoupling of U n \\uparrow n \\downarrow promotes a uniform exchange splitting \\Delta = U(n \\uparrow - n \\downarrow)/2. Solving self-consistently for the uniform susceptibility yields diverging — the paramagnet becoming unstable to ferromagnetism — when U N(E F) 1. Silent assumptions: (a) Hartree–Fock, i.e. no longitudinal correlations; (b) only the q=0 channel is examined, so finite-q SDW (Overhauser) and Pomeranchuk instabilities are excluded by fiat; (c) a smooth DOS near E F. In nearly-ferromagnetic d-metals these assumptions matter: paramagnon corrections in Moriya's self-consistent renormalization theory cut predicted T c by an order of magnitude. What the skeleton hides Three silent assumptions span all five derivations and mark the perimeter of the mean-field consensus: 1. Single-site decoupling is exact only in the z\\to\\infty limit; the 1/z corrections carry all the fluctuation physics that separates universality classes. 2. The symmetry of the order parameter is put in by hand through the form of \\lambda M. Whether M is a scalar (Ising), planar (XY), or vector (Heisenberg) determines the Goldstone count and, with it, the Mermin–Wagner verdict. 3. The molecular-field constant \\lambda is microscopically vacant in Weiss's original presentation . Heisenberg's identification of it with exchange — and Dirac's 1929 reformulation as H=-\\sum J {ij}\\vec S i\\cdot\\vec S j ( verify ), popularized via Van Vleck's 1932 monograph ( verify ) — is what made the program quantitative. Treating \\lambda as a phenomenological fitting constant, while still ubiquitous, conceals that the entire microscopic enterprise of §3 (direct, super-, double, RKKY, anisotropic exchange) is the project of computing J {ij} from first principles. Brush's reconstruction is the canonical reminder that the historical order was nearly the reverse of the pedagogical one: Curie measured before Langevin computed, Weiss postulated before Heisenberg explained, Ising solved a special case before Peierls proved the general one had a transition. The mean-field skeleton looks tidy in retrospect; in 1928 it was a heap of unconnected calculations held together by the experimental fact that iron magnetizes. A Zoology of Exchange: Direct, Super-, Double-, RKKY, Anisotropic A Zoology of Exchange: Direct, Super-, Double-, RKKY, Anisotropic The bilinear form is the great flattener of magnetism: a single symbol J {ij} that conceals at least half a dozen distinct microscopic mechanisms, each with its own sign convention, perturbative order, and regime of validity. The pedagogical sequence \"exchange equals overlap of wavefunctions, end of story\" is wrong twice — wrong about origin (most insulating J's are not direct exchange) and wrong about form (real magnets carry antisymmetric and biquadratic pieces that the bilinear scalar form does not contain). This section catalogues the mechanisms and names what the textbooks routinely elide. Direct (Heitler–London) exchange The original mechanism. Two electrons in non-orthogonal orbitals \\phi a,\\phi b on neighbouring sites; antisymmetrization of the spatial part forces singlet/triplet splitting with K the two-electron exchange integral, S=\\langle\\phi a\\mid\\phi b\\rangle the overlap, and \\beta the one-electron hopping. Heisenberg's 1928 paper is precisely this Heitler–London calculation extended to a many-electron lattice; the now-ubiquitous Pauli-spin form -J\\,\\mathbf{S} i\\cdot\\mathbf{S} j is Dirac (1929, Proc. Roy. Soc. A 123, 714) (verify), popularised through Van Vleck's 1932 Theory of Electric and Magnetic Susceptibilities . The textbook claim that \"direct exchange is always ferromagnetic because K 0\" is true only for strictly orthogonal orbitals on a single atom (Hund's first rule); between distinct sites the kinetic tail -4\\beta S usually dominates and the sign flips antiferromagnetic. Genuinely direct, ferromagnetic J is rare in the periodic table — Gd and a handful of f-electron metals are the standard examples — because the 3d/4f overlap between neighbouring sites in most transition-metal compounds is too weak to compete with the indirect channels below. Kramers–Anderson superexchange The dominant mechanism in insulating oxides, halides, and pnictides. Kramers (1934) is the original construction: a virtual second-order process in which a d electron hops onto a closed-shell ligand p orbital and back, paying the charge-transfer gap as an intermediate-state energy. Anderson's 1950 paper gave the quantitative Mott–Hubbard form antiferromagnetic because the singlet alone permits virtual double occupancy; the triplet is Pauli-blocked. The textbook attribution \"Anderson superexchange\" silently erases Kramers's sixteen-year priority; Anderson's own 1950 paper cites honestly and frames itself as a quantitative extension of an idea already in print. The sign- and strength-rules for real materials are the Goodenough–Kanamori–Anderson (GKA) rules: Goodenough (Phys. Rev. 100, 564, 1955) and Kanamori (J. Phys. Chem. Solids 10, 87, 1959) (both verify), refined by Anderson (1959). The two cases worth memorising: - 180° cation–anion–cation, both half-filled e g orbitals: strong AF, J\\sim 4t {pd}^4/(U\\Delta^2) in fourth order. - 90° cation–anion–cation, orthogonal ligand p orbitals on the two paths: weak FM via Hund's coupling on the anion. Cuprates (180°, half-filled d {x^2-y^2}) sit squarely on the first rule and give J\\sim 130 meV; CrBr 3 (≈90° edge-sharing octahedra) sits on the second. The standard textbook elision is to quote \"GKA rules\" as fixed laws rather than as the leading-order results of a specific perturbative scheme that breaks down for moderate U/\\Delta and for orbitals with significant covalent admixture. Zener double exchange Mixed-valence ferromagnetism. Zener (1951) noticed that in La {1-x}Ca xMnO 3, charge transport between Mn^{3+} (t {2g}^3 e g^1) and Mn^{4+} (t {2g}^3) through the bridging O^{2-} proceeds without paying U — the e g electron simply moves — provided the three t {2g} core spins are aligned with it via Hund's J H. Anderson and Hasegawa (Phys. Rev. 100, 675, 1955) (verify) made this quantitative: the effective hopping amplitude becomes where \\theta is the angle between neighbouring core spins. Maximising kinetic energy maximises ferromagnetic alignment; hence the CMR phenomenology of the manganites. Crucially, double exchange is real electron transfer in lowest order — not a virtual fourth-order process — so it produces metallic ferromagnetism, sharply distinct from superexchange. Textbooks that lump \"double exchange\" together with superexchange under \"indirect exchange\" miss this transport signature. The tripartite RKKY construction The indirect coupling of localised moments through a conduction sea. Ruderman and Kittel (1954) solved the original problem — nuclear I coupled via s-band Pauli polarisation — and obtained the kernel which at large r becomes \\cos(2k F r)/r^3. Kasuya (Prog. Theor. Phys. 16, 45, 1956) (verify) extended the same calculation to d moments via the s–d Hamiltonian, and Yosida (Phys. Rev. 106, 893, 1957) (verify) closed it for rare-earth 4f moments, deriving the canonical sign-oscillating J(r) that organises Gd, Tb, Dy, and the heavy lanthanide spirals. The label \"RKKY\" is therefore a tripartite construction completed in 1957, not a single 1954 paper — the conflation is bibliographically convenient and historically wrong. RKKY is also the engineering mechanism behind interlayer exchange coupling in Fe/Cr/Fe trilayers, the platform of giant magnetoresistance. Dzyaloshinskii–Moriya antisymmetric exchange When site i and site j are not related by a centre of inversion, spin–orbit coupling generates an antisymmetric term with \\mathbf{D} {ij} of order (\\Delta g/g)\\,J\\sim (\\lambda/\\Delta {\\text{cf}})\\,J. Dzyaloshinskii (J. Phys. Chem. Solids 4, 241, 1958) (verify) extracted it phenomenologically from a Landau expansion to explain the weak ferromagnetism of \\alpha-Fe 2O 3 and MnCO 3; Moriya (Phys. Rev. 120, 91, 1960) (verify) derived it microscopically and gave the symmetry rules that determine \\hat{\\mathbf{D}} from the local bond environment. DM exchange is now the load-bearing ingredient of skyrmion lattices in MnSi and FeGe, of cycloidal multiferroics like TbMnO 3, and of canted-moment Hall responses in non-collinear antiferromagnets. The under-acknowledged subtlety: \\mathbf{D} {ij}=-\\mathbf{D} {ji} as a vector but \\mathbf{D} {ij}\\cdot(\\mathbf{S} i\\times\\mathbf{S} j)=\\mathbf{D} {ji}\\cdot(\\mathbf{S} j\\times\\mathbf{S} i), so the bond sense is set once and for all by the crystal symmetry — a point that disorients half the papers that try to fit DM by free parameter. Biquadratic and ring exchange Even within a pure Heisenberg framework, fourth-order perturbation in t/U generates terms the bilinear form does not capture: The biquadratic coefficient K\\sim 80\\,t^4/U^3 is small for spin-\\tfrac12 but becomes appreciable for S\\geq 1 (where the bilinear and biquadratic terms are independent invariants), for multi-orbital systems where intra-atomic Hund coupling enhances it, and for magneto-elastic compounds where lattice relaxation feeds back into a (\\mathbf{S}\\cdot\\mathbf{S})^2 piece. Ring exchange K \\square is the well-documented organising term in solid ^3He on the bcc lattice and is now invoked routinely in cuprate ladder physics. The conflation watch here: many \"anomalous\" deviations from J-only fits in inelastic neutron data are quietly absorbed into a renormalised J rather than admitting that the underlying Hamiltonian is no longer purely bilinear. The credit audit for this whole catalogue is uncomfortable. Kramers loses to Anderson, Kasuya and Yosida lose to Ruderman–Kittel, Dirac loses to Heisenberg, Goodenough and Kanamori lose to Anderson again, and Dzyaloshinskii's phenomenology is half-remembered as Moriya's microscopics. The phrase \"exchange interaction\" is in this sense a tribute to four generations of theorists whose names did not survive the abbreviation. Itinerant vs. Localized: Stoner, Nagaoka, and the Hubbard Continuum Itinerant vs. Localized: Stoner, Nagaoka, and the Hubbard Continuum The phrase \"band ferromagnetism\" is a portmanteau that hides a category error. Stoner's 1938 instability and Nagaoka's 1966 theorem are both statements about itinerant electrons, and both are sometimes invoked to \"explain\" why iron, cobalt, and nickel are ferromagnets. But they sit at opposite ends of a single control parameter — the dimensionless interaction U/W, where W is the bandwidth — and the mechanisms they describe share essentially no microscopic content. Reading them as variants of one another is the most common conceptual confusion in itinerant magnetism, and it is the reason mean-field Curie temperatures for transition metals come out wrong by a factor of three to ten. The common stage: the one-band Hubbard model Fix the arena. The model is with bandwidth W = 2zt on a lattice of coordination z, density of states N(\\varepsilon), and filling n = N e/N. Two dimensionless ratios organize everything: the coupling u \\equiv U/W and the doping \\delta \\equiv \\mid 1-n\\mid. Stoner lives at u\\ll 1, any n, in mean field. Nagaoka lives at u\\to\\infty, \\delta\\to 0^+, exactly, on bipartite lattices. Stoner: weak coupling, Hartree–Fock, and Slater's shadow The Stoner argument is the Hartree–Fock decoupling A uniform polarization m = \\langle n \\uparrow\\rangle - \\langle n \\downarrow\\rangle shifts the two spin subbands rigidly by \\pm Um/2. Linearizing the self-consistency about m=0 gives the instability condition the celebrated Stoner criterion . Above it, the paramagnetic Fermi sea is unstable to an infinitesimal exchange splitting; below it, a Stoner-enhanced susceptibility \\chi = \\chi 0/[1-UN(E F)]. The construction is identical in spirit — and, when one writes it out for a tight-binding d band, nearly identical in algebra — to Slater's 1936 spin-polarized band picture, a fact obscured by the British/American attribution split (verify; the Slater–Stoner equivalence was made explicit by Wohlfarth in the 1950s). Two features of this derivation deserve emphasis, because they are routinely silently dropped. First, the only fluctuation kept is the longitudinal Hartree shift; transverse spin fluctuations (magnons, paramagnons) are projected out. Second, the temperature dependence of m(T) in Stoner theory comes entirely from the Fermi function smearing the split bands — single-particle excitations across the gap. This predicts T C comparable to the exchange splitting \\Delta = Um, which for Fe, Co, Ni runs 1–2 eV, i.e. T C^{\\text{Stoner}}\\sim 10^4 K. The measured values are an order of magnitude smaller. The mode that destroys the order at the true T C is not single-particle: it is the transverse spin fluctuation, which Stoner discards by construction. Moriya: the middle that everyone forgets The repair is Moriya's self-consistent renormalization (SRR) theory of spin fluctuations (1973, Prog. Theor. Phys. 49, 970 — verify), built on the RPA susceptibility In a nearly ferromagnetic metal, 1-U\\chi 0(\\mathbf{0},0) is small but positive: the paramagnon pole sits just below the real axis, and low-energy transverse fluctuations dominate the entropy. Including their feedback on the static susceptibility — a self-consistency that resums the leading mode-coupling diagrams — yields a Curie–Weiss-like \\chi(T)^{-1}\\propto T-T C above the transition with a T C governed by the fluctuation scale, not the splitting scale. For Ni this brings the theoretical T C within a factor of two of 631 K (verify). The lesson is structural: Stoner is exact at T=0 in the limit U\\to 0^+ where transverse fluctuations are gapped out at the Stoner energy; at finite T near a real Curie point, the same fluctuations are massless and dominant. Nagaoka: strong coupling, exact, fragile At the opposite limit, set U=\\infty and forbid double occupancy entirely. Take exactly one hole on a bipartite lattice (square, cubic, honeycomb...). Nagaoka proved that the unique ground state (up to global SU(2)) is fully ferromagnetic: S = S {\\max} = N/2 - 1/2. The mechanism is purely kinetic. A hole hopping through a background of immobile spins picks up a Berry-like sign from spin permutations along its path; when all spins are aligned, every closed loop contributes constructively to the hole's coherent bandwidth, lowering its kinetic energy by \\sim t. Any spin flip introduces destructive interference. There is no exchange integral, no J; the ferromagnet is the configuration that minimizes the hole's confinement, full stop. Nagaoka's theorem is rigorous and surprising, but it is also a knife edge. Three perturbations destroy it: (i) finite hole density \\delta \\gtrsim \\delta c with \\delta c small and lattice-dependent — phase-separation and polaron arguments by Shastry–Krishnamurthy–Anderson and others (1990, verify) suggest \\delta c \\lesssim 0.2 on the square lattice and possibly zero in the thermodynamic limit; (ii) finite U at fixed \\delta, with virtual double occupancy generating an antiferromagnetic superexchange J = 4t^2/U that overwhelms the kinetic gain for U/t \\lesssim 50; (iii) non-bipartite lattices, where the sign structure of hole hopping no longer favors the ferromagnetic background — the triangular lattice gives a counter-rotating chirality. The recent demonstration of Nagaoka-like ferromagnetism in a four-site quantum-dot plaquette (Dehollain et al. , Nature 2020 — verify) and in optical-lattice Hubbard simulators (Prichard et al. , 2024 — verify) is not academic vindication only. It is the first experimental access to a magnetic ground state whose origin contains no exchange integral whatsoever. Figure: The one-band Hubbard model in the (\\delta, U/W) plane. Stoner is the weak-coupling lobe along the top of the orange curve; Nagaoka is the green point in the strong-coupling, low-doping corner; Moriya's self-consistent spin-fluctuation theory governs the dashed crossover where real 3d metals (Ni, ZrZn 2, Pd-near-FM) actually live. The Mott/antiferromagnetic slab at \\delta=0 is governed by the superexchange J=4t^2/U generated by virtual double occupancy. Why they are not the same physics A compact contrast clarifies the stakes. Aspect Stoner (1938) Nagaoka (1966) --- --- --- Regime U/W\\ll 1, any filling U/W\\to\\infty, \\delta=1/N\\to 0^+ Status Mean-field (Hartree–Fock) approximation Rigorous theorem on bipartite lattices Order-parameter scale \\Delta = Um \\sim eV S = S {\\max}, kinetic gain \\sim t Mechanism Exchange splitting of a Fermi sea Coherent hole motion in aligned background Robustness Qualitatively correct for Fe, Co, Ni; T C wrong by \\times 10 Destroyed by finite \\delta, finite 1/U, or lattice frustration Fluctuations Longitudinal only; transverse modes discarded Theorem is about the exact ground state — fluctuations enter only in stability analyses Relation to exchange J {\\text{eff}} generated from U at second order is not used No J anywhere; mechanism is purely kinetic The Hubbard model has room for both because it has two limits. Stoner is what you get when you ask a free electron gas to break a symmetry while keeping the Hartree–Fock blinkers on; Nagaoka is what you get when you ask the wavefunction what it actually wants when the interaction is so large that the Hilbert space has been carved down to the no-double-occupancy subspace. Between them lies the territory that real materials occupy — strong, finite U, finite doping, finite temperature — and the honest names for what governs it are \"spin fluctuations\" (Moriya) and \"quantum Monte Carlo on small clusters\". Calling either limit \"the explanation of metallic ferromagnetism\" is a category error that has survived in textbooks because each is, separately, a beautiful piece of physics. The Lenz–Ising Lineage: From a 1920 Thesis Exercise to Universality Classes The Lenz–Ising Lineage: From a 1920 Thesis Exercise to Universality Classes 1920: Lenz's quiet proposal The model that bears Ising's name was set down by Wilhelm Lenz in a three-page note in Physikalische Zeitschrift . Lenz's question was operational: could Weiss's molecular field — a phenomenological \\lambda M with no microscopic carrier — be generated by local couplings between atomic moments fixed to lattice sites? He posited that each site carries a discrete degree of freedom, two-valued under the crystalline anisotropy (he envisaged dipoles tunneling between symmetry-related minima), and that neighbours interact pairwise. The Hamiltonian is not written in this form anywhere in Lenz's paper — that compact notation is post-Onsager — but the content is his. Lenz then handed the problem to his Hamburg student Ernst Ising as a thesis exercise. Brush's careful reconstruction of the Hamburg correspondence and seminar record leaves no doubt about priority; the persistent \"Ising model\" is a bibliographic accident that Lenz–Ising would correct. 1925: Ising's correct solution and incorrect inference Ising's published thesis solved the one-dimensional chain exactly. With N sites and periodic boundaries the partition function is — the transfer-matrix view, though Ising solved by direct combinatorics. At h=0 the free energy per site is -\\beta^{-1}\\ln(2\\cosh\\beta J), analytic for all finite T 0: no phase transition. Ising then made the leap that haunted the subject for a decade: he argued (by a crude perturbative extension) that no finite-dimensional version of the model would order, and concluded that the Lenz construction failed as a microscopic basis for ferromagnetism. The 1D result is rigorous and remains so; the higher-dimensional inference was wrong, and Ising's discouragement contributed to his leaving research. Heisenberg's 1928 turn to a continuous-spin, exchange-driven theory was in part a response to Ising's pessimism, which was widely read as closing the lattice-model route. 1936: Peierls and the contour argument Peierls resurrected the model with a topological proof that the two -dimensional Ising ferromagnet does order at sufficiently low T. The argument: in a + ground state, any minus-domain is bounded by a closed contour of length L on the dual lattice; the Boltzmann weight of a configuration containing such a contour is suppressed by e^{-2\\beta J L}, while the entropic count of contours of length L enclosing a fixed site grows only as \\mu^L with \\mu \\le 3 (a simple Peierls bound — refined by later workers). For \\beta large enough, \\sum L L\\mu^L e^{-2\\beta J L} \u003c \\tfrac{1}{2}, so the expectation \\langle\\sigma 0\\rangle cannot vanish. This is the first rigorous proof of spontaneous symmetry breaking in a short-range lattice model with discrete symmetry. It survives unaltered: the modern Pirogov–Sinai theory is its lineal descendant, and it remains the cleanest pedagogical demonstration that finite-temperature order in d\\ge 2 requires nothing but the bare model — no molecular field, no exchange microscopy. 1941: Kramers–Wannier duality and the locus of T c Kramers and Wannier observed that the high- and low-temperature series of the 2D Ising model on the square lattice are related by a self-duality between the bond representation (high-T) and the contour representation (low-T). Assuming a single transition, the self-dual point \\sinh(2\\beta c J)=1, i.e. k B T c/J = 2/\\ln(1+\\sqrt 2) \\approx 2.269, must be it. This pinned T c three years before Onsager pinned the free energy. The duality remains rigorously valid as a relation between partition functions; the uniqueness-of-transition assumption is what Onsager's solution justified. 1944: Onsager's exact solution Onsager's Crystal Statistics is the high-water mark of pre-renormalization-group statistical mechanics. He diagonalized the row-to-row transfer matrix of the square-lattice Ising model in zero field by recognizing it as a product of operators generating a finite-dimensional Lie algebra (a free-fermion structure, in modern language). The result, per site, gives a logarithmic singularity in the specific heat, C \\sim -\\ln T-T c , at the Kramers–Wannier point. This was the first demonstration that a microscopic model could produce a non-mean-field second-order transition: \\alpha = 0 (log), not the mean-field \\alpha = 0 {\\text{disc}}. The mean-field critical exponents inherited from Weiss were now provably wrong in d=2. Onsager announced the spontaneous magnetization at a 1948 conference but did not publish a derivation. C. N. Yang's 1952 paper supplied the first published proof, by a tour-de-force calculation of an off-diagonal matrix element of the transfer matrix; this gave the order-parameter exponent \\beta = 1/8 rigorously. Kac and Ward (1952) then provided a combinatorial route to Onsager's free energy via a signed sum over closed graphs — a derivation later cleaned up by Sherman, Vdovichenko, and others, and which remains the basis of the modern Pfaffian / dimer formulation. Transfer matrices, Bethe ansatz, and what does not generalize Onsager's free-fermion structure is special to d=2 and zero field. Three things are worth keeping separate: - The transfer matrix as a method generalizes to any d, but its spectrum is generically not integrable; one falls back on numerics (DMRG, in modern guise — itself a variational ansatz on the transfer-matrix eigenstate). - The Bethe ansatz solves the 1D anisotropic Heisenberg (XXZ) chain, not the Ising model in d\\ge 2. The Ising chain in a transverse field maps via Jordan–Wigner to free fermions and is exactly solvable; this is the quantum-classical correspondence between the 1D transverse-field Ising chain and the 2D classical Ising model, which is rigorous and is the simplest setting in which to see conformal invariance at criticality. - No exact closed-form solution exists for the 2D Ising model in nonzero field, or for the 3D Ising model in any field — and there are strong arguments (NP-hardness of the 3D partition function with fields) that none will. \"Ising is solved\" is shorthand for the d=2, h=0 case. Wilson, universality, and \"Ising\" as a symmetry class The reinterpretation that matters most for the working physicist came with Wilson's renormalization group (1971–72) and the \\varepsilon-expansion of Wilson and Fisher: the long-wavelength behaviour of any short-range model with a scalar order parameter and \\mathbb{Z} 2 symmetry — lattice gas, binary alloy, uniaxial ferromagnet, \\phi^4 field theory — flows to the same Wilson–Fisher fixed point and shares the same critical exponents. \"Ising universality class\" became a statement about the IR fixed point of the \\phi^4 theory in 4-\\varepsilon dimensions, not about \\pm 1 spins on a lattice. The 2D exponents Onsager and Yang obtained (\\alpha = 0 {\\log}, \\beta = 1/8, \\gamma = 7/4, \\nu = 1, \\eta = 1/4) are recovered as the central-charge-1/2 minimal model of Belavin–Polyakov–Zamolodchikov (1984) — the 2D Ising CFT — and the 3D exponents, long known approximately, are now pinned to six-digit precision by the conformal-bootstrap programme (Rychkov and collaborators, post-2012). What stands and what was superseded Rigorous and unsuperseded: Ising's 1D solution ; Peierls's existence-of-order proof in d\\ge 2 ; Kramers–Wannier duality as an identity between partition functions; Onsager's d=2, h=0 free energy and Yang's spontaneous magnetization. Superseded as interpretations : Ising's no-transition extrapolation; the mean-field exponents inherited from Weiss in any d\u003c4; the view of \"the Ising model\" as one object — it is a lattice model, a Euclidean field theory, a CFT at criticality, and a universality class, and conflating them remains a source of confusion in the modern literature, particularly in discussions of \"Ising anyons\" (which are about the c=1/2 topological order, not Lenz's \\pm 1 spins). Landmark Experiments: Bitter Powders, Shull's Neutrons, Spin-Polarized Tunneling, and Beyond Landmark Experiments: Bitter Powders, Shull's Neutrons, Spin-Polarized Tunneling, and Beyond Cooperative magnetism is unusual in that the experimental signature of each idea usually arrived after — sometimes long after — the theoretical claim it would verify or falsify. The dossier below pairs prediction with measurement, in the order in which the experiments closed each loop. 1895 — Curie's torsion susceptometer Curie's Paris thesis is, before anything else, an instrument paper. The torsion-balance susceptometer he built at the École de Physique et Chimie Industrielles measured susceptibilities over roughly four decades and across nearly three decades of temperature, the high end reached in a custom Pt-wound furnace. Two facts emerged that the next half-century of theory existed to explain: (i) \\chi {\\text{para}}=C/T over a wide range for \\mathrm{O 2}, \\mathrm{FeCl 3} solutions, and many salts; (ii) iron loses its ferromagnetism abruptly near 770 °C and above this its susceptibility joins a 1/T branch with a Curie constant of the same order as the salts. Weiss would absorb the first as a limit of his molecular-field theory and the second as the defining point de Curie . Without Curie's instrument there is no Curie law, no Curie temperature, and no quantitative target for Weiss in 1907. 1931 — Bitter powders: Weiss's domains made visible Weiss had postulated domains as a logical necessity (a uniformly magnetized iron bar would have an absurd dipole field) but produced no evidence. Francis Bitter (verify) at MIT decanted colloidal magnetite onto polished iron in 1931 and photographed the micron-scale stripe and maze patterns that decorate closure-domain walls. The technique simultaneously confirmed Weiss's domain hypothesis and the Landau–Lifshitz (1935, verify) prediction \\delta \\sim \\sqrt{A/K} for wall width: of order 50–100 nm in soft Fe, kilometers wide compared to the lattice constant — the macroscopic signature of microscopic exchange stiffness A \\sim J S^2/a. 1949 — Shull on MnO: a sublattice you could index Néel's 1932 two-sublattice theory predicted antiferromagnets with a susceptibility cusp at T N and oppositely magnetized sublattices invisible to bulk magnetometry. The prediction lay unfalsifiable for seventeen years. Shull and Smart (verify) used the new Oak Ridge graphite-pile beam on powdered MnO and found, below T N=122 K, magnetic Bragg peaks at (\\tfrac12\\tfrac12\\tfrac12) of the chemical FCC cell — the magnetic unit cell doubled along M(T)=M(0)\\bigl[1-\\zeta(3/2)\\,(k B T/4\\pi D)^{3/2}+\\cdots\\bigr].$$ Triple-axis spectrometry at Brookhaven and Chalk River through the 1970s extracted D directly for Fe, Ni, Co, EuO over much of the Brillouin zone and verified the T^{3/2} law in Ni over more than two decades in T. In antiferromagnets the linear \\omega=cq branch was confirmed first in \\mathrm{MnF 2} (verify); inelastic scattering on KCuF 3 and CsNiCl 3 later furnished the experimental footprints of 1D des Cloizeaux–Pearson spinons and the Haldane gap. 2009 — SANS skyrmion lattice in MnSi Mühlbauer et al. (verify) at FRM-II resolved a hexagonal six-spot small-angle neutron pattern in MnSi just below T C in a small applied field — the diffraction signature of a triangular lattice of skyrmion tubes. The discovery closed a loop opened by Dzyaloshinskii and Moriya half a century earlier: the chiral DM exchange (cf. §3) does not merely cant spins by a constant angle but can stabilize topologically nontrivial textures with integer winding number per cell. Lorentz TEM imaging in Fe {0.5}Co {0.5}Si (Yu et al., verify) saw the same lattice in real space the following year. --- The instruments that mattered share a pattern: each measured a quantity the theory could only otherwise infer. Curie's susceptometer measured \\chi(T); Bitter's colloid imaged domains; Shull's diffractometer counted sublattice peaks; dHvA counted Fermi pockets per spin channel; Mössbauer counted hyperfine fields per crystallographic site; polarized neutrons mapped magnetization density in reciprocal space; inelastic neutrons mapped \\omega(\\mathbf q); tunneling resolved the spin polarization of an extracted current; SANS resolved a skyrmion lattice in \\mathbf q-space before Lorentz TEM resolved it in \\mathbf r-space. The Lenz–Ising–Heisenberg–Néel–Stoner family survives in its modern form because each of its predictions has been forced past a measurement of this granularity — and, where the prediction failed (rigid Stoner splittings, mean-field T C in nearly ferromagnetic metals, the positive sign of tunneling spin polarization), the experiment selected the survivor. Live Confusions: Where the Modern Literature Still Loses the Thread Live Confusions: Where the Modern Literature Still Loses the Thread Five mis-attributions and category errors recur with such regularity in contemporary papers, reviews, and graduate textbooks that they have effectively become folklore. Each is correctable in a sentence; each, left in place, distorts how the next generation reads the literature. 1. The \"Heisenberg Hamiltonian\" was written down by Dirac The compact bilinear is the workhorse of the field, and is universally attributed to Heisenberg . Heisenberg's 1928 paper does not contain it. What Heisenberg constructs is a perturbative many-electron problem in the Heitler–London spirit: he writes the orbital exchange integral and shows, by counting how antisymmetrisation redistributes singlet and triplet weights, that the energy of a ferromagnetically aligned many-electron state can be lower than the antiferromagnetic one when J {ij} 0 and the coordination number is large enough. The spin operators \\mathbf{S} i never appear as dynamical variables on a lattice; the entire calculation is about orbital wavefunctions and the Pauli principle. The reformulation as a Hamiltonian acting on spin degrees of freedom — the recognition that, on the singlet–triplet subspace of two electrons, the operator identity reduces the Coulomb-exchange contribution to a pure spin–spin form — is Dirac's, in his 1929 Proc. Roy. Soc. A paper on the quantum mechanics of many-electron systems (verify). Van Vleck's 1932 monograph then canonised the bilinear as the operational definition of \"exchange\" and propagated it to a generation of solid-state physicists (verify). The price of calling it \"Heisenberg's\" is the loss of the conceptual point that \\mathbf{S} i\\!\\cdot\\!\\mathbf{S} j is not the microscopic interaction; it is a projected effective Hamiltonian on the Hilbert subspace fixed by Pauli exchange. The distinction matters as soon as one asks why the operator survives the inclusion of multi-orbital structure, spin–orbit coupling, or itinerancy — it does, but only by virtue of the projection Dirac made explicit and Heisenberg did not. 2. The Stoner criterion as a general condition for itinerant ferromagnetism Stoner's collective-electron paper is routinely cited for the inequality as if it were a sufficient condition for itinerant ferromagnetism. It is not. The criterion is the Hartree–Fock instability of the paramagnetic Fermi sea to a uniform , \\mathbf{q}=0 exchange splitting. Three silent assumptions are usually stripped. (i) The susceptibility is computed at the level of a single bubble — the static homogeneous limit of \\chi 0(\\mathbf{q},\\omega) evaluated at \\mathbf{q}=0. Competing instabilities at finite \\mathbf{q} (spin-density waves), in the charge channel (Pomeranchuk), or in higher angular-momentum spin channels are not part of the comparison. (ii) Longitudinal and transverse spin fluctuations are absent. In nearly ferromagnetic 3d metals — Pd, Ni 3Al, ZrZn 2 — the Stoner T C overestimates the observed Curie temperature by an order of magnitude, because the local moment is quenched by paramagnon fluctuations long before global order is destroyed. The standard correction is Moriya's self-consistent-renormalisation theory (verify); a textbook that presents Stoner as a complete theory of band magnetism owes the reader at least a footnote pointing to it. (iii) The criterion is mean-field, and as such inherits the disease that Mermin and Wagner diagnosed in another guise: it cannot distinguish a true broken-symmetry transition from a smooth crossover, and it has no notion of dimensionality or Goldstone-mode entropy. In short: U N(E F) 1 identifies the parameter window where, if the paramagnetic state ordered at all and if it ordered uniformly, the leading channel would be ferromagnetic. It is a screening tool, not a verdict. 3. \"Anderson superexchange\" — Kramers got there first The phrase \"Anderson superexchange\" has hardened into the standard credit for the mechanism by which two magnetic cations couple antiferromagnetically through a closed-shell anion. Anderson's 1950 paper is a genuine advance — the first quantitative perturbative treatment, with the correct factor structure \\sim t^{4}/(U^{2}\\Delta) for the cuprate-like geometry and a clear account of why the sign is antiferromagnetic for half-filled d-orbitals. But the mechanism itself is Kramers's, sixteen years earlier . Kramers's 1934 Physica note, written in French and rarely reproduced in Anglophone bibliographies, sets up the virtual third-order pathway 3d \\to 2p \\to 3d through an oxygen ligand and identifies it as the origin of antiferromagnetic coupling in paramagnetic salts. Anderson cites Kramers approvingly; subsequent textbooks dropped the citation. The fair name is \"Kramers–Anderson superexchange\", and the fair history is that Kramers introduced the concept while Anderson supplied the quantitative apparatus later refined into the Goodenough–Kanamori–Anderson rules. 4. \"Curie–Weiss\" is not one law Three distinct results are routinely compressed into one hyphenated phrase. is the paramagnetic susceptibility of non-interacting moments, established empirically by Curie's torsion-balance measurements on Fe, Ni, and a range of oxygen-bearing compounds. is the molecular-field correction: the Langevin susceptibility evaluated at the effective field H + \\lambda M gives a divergence at T = \\Theta W = C\\lambda, with \\Theta W 0 above a ferromagnetic transition. is the two-sublattice molecular-field result that diagnoses an antiferromagnet by a negative Weiss intercept, with the susceptibility cusp at T = \\Theta N identified in as the experimental signature of sublattice order. The lumped phrase \"Curie–Weiss behaviour\" obscures both N\\'eel's contribution and the sign convention that distinguishes ferro- from antiferromagnetic exchange in a high-temperature fit. When a contemporary paper reports \\Theta {CW} = -150 \\text{K} for a candidate spin liquid, what is being quoted is N\\'eel's extension of Weiss's molecular field, not anything Curie or Weiss themselves wrote. 5. \"Kinetic ferromagnetism\" used as a label for any U-driven polarisation Nagaoka's theorem is precise: in the Hubbard model with U=\\infty, exactly one hole away from half-filling, on a finite bipartite lattice satisfying the connectivity hypothesis (sign-problem-free hole motion in the maximal-spin sector), the ground state is fully spin-polarised. The polarisation is \"kinetic\" in the strict sense that it minimises a hopping energy: parallel-spin alignment removes the on-site Coulomb blockade that would otherwise impede the hole's coherent motion through every closed loop. In the recent literature on moir\\'e systems, triangular-lattice optical-lattice experiments, and finite-cluster numerics, the same phrase is applied to any polarised state that appears at large U and finite hole doping. This is a category drift. Away from the Nagaoka point, ferromagnetism in doped Hubbard models requires either (a) flat-band conditions of the Mielke–Tasaki type (verify), (b) special lattice geometries (Kagome line graphs), or (c) finite Hund's coupling J H in multi-orbital settings — each with its own microscopic mechanism and a parameter window that does not include Nagaoka's. Calling all of them \"kinetic ferromagnetism\" elides the distinction between an exact theorem and a family of mechanisms that share only the negative attribute of not being Stoner. The honest taxonomy keeps \"Nagaoka ferromagnetism\" for the U=\\infty, single-hole, bipartite-lattice statement, and reserves \"flat-band ferromagnetism\" or \"Hund's ferromagnetism\" for the alternatives. The cost of the loose usage is that readers infer a Nagaoka-strength theorem where only a numerical observation, often on small clusters and at finite U, has actually been made. The Frontier: Frustration, Spin Liquids, Altermagnetism, and Moiré Magnets The Frontier: Frustration, Spin Liquids, Altermagnetism, and Moiré Magnets The classical lineage closed by §7 — Curie's susceptometer, Weiss's \\lambda, Heisenberg's exchange, Stoner's band splitting, Néel's two sublattices — handles every ordered phase whose order parameter is a single \\mathbf{m}(\\mathbf{r}) that condenses at a finite T {\\rm c}. The live problems are precisely those where this assumption fails: degeneracy survives to T=0, the local moment is itself emergent, the order parameter has more structure than \\mathrm{O}(3), or the lattice itself is a control knob. Six fronts are worth a credit-aware audit. Frustration and the pyrochlore spin ices The pyrochlores \\mathrm{Dy 2Ti 2O 7} and \\mathrm{Ho 2Ti 2O 7} realize a corner-sharing tetrahedral lattice of Ising-like rare-earth moments whose crystal-field axis points to the tetrahedron centre. The local \"two-in/two-out\" ice rule generates an extensive ground-state degeneracy formally identical to Pauling's residual entropy of water ice. Castelnovo, Moessner, and Sondhi showed that violating the ice rule fractionalizes a flipped dipole into a pair of emergent monopoles connected by a Dirac string, with an effective magnetic Coulomb interaction set by the lattice geometry (Nature 451, 42 (2008)). The neutron and magnetization signatures of these excitations are by now well established (Morris et al., Science 326, 411 (2009); Bramwell et al., Nature 461, 956 (2009)) — established . What is folklore is the casual identification of the emergent magnetic monopole with a fundamental Dirac monopole; the object is a defect in an emergent \\mathrm{U}(1) gauge theory whose photon is hosted by the spin manifold, not by Maxwell's vacuum. Recent work has also documented \"refrustration\" — extra dipolar and exchange terms partly lift the ice degeneracy and modify low-T dynamics (arXiv:1512.05361), so the canonical nearest-neighbour spin-ice picture is itself a leading-order model. The Kitaev honeycomb and the spin-liquid program Kitaev's 2006 honeycomb model is the rare exactly solvable interacting spin model in 2D: bond-dependent Ising couplings K x S i^x S j^x + K y S i^y S j^y + K z S i^z S j^z on a tricoordinated lattice, soluble by a Jordan–Wigner-like Majorana decomposition with a static \\mathbb{Z} 2 gauge field (Ann. Phys. 321, 2 (2006)). The gapped phase in a magnetic field is non-Abelian and supports Ising anyons — a clean theoretical target. \\alpha-\\mathrm{RuCl 3} became the candidate material once d^5 jeff =1/2 moments and Ru–Cl–Ru bonding geometry were shown to generate sizeable Kitaev terms. The status here deserves precision. The exact solution and its anyon spectrum are established . The Kasahara group's report of a half-quantized thermal Hall conductivity \\kappa {xy}/T = (\\pi/12)(k {\\rm B}^2/\\hbar) in an in-plane field (Nature 559, 227 (2018)) is plausible but contested : subsequent measurements have shown strong sample dependence, with some ultraclean crystals failing to reproduce the plateau and substantial phonon contributions to \\kappa {xy} (Czajka et al., Nat. Phys. 2022; see also npj Quantum Materials 2025 review). \"Kitaev physics realized in \\alpha-\\mathrm{RuCl 3}\" is folklore in the absence of a reproducible quantized signature. Altermagnetism: a third collinear class The Šmejkal–Sinova–Jungwirth classification (PRX 12, 031042 (2022); PRX 12, 040501 (2022)) identifies a third collinear class beyond Weiss's ferromagnet and Néel's antiferromagnet. Altermagnets are compensated collinear magnets in which the two spin sublattices are related not by translation or inversion but by a rotation (proper or improper). The non-relativistic spin point group therefore allows a momentum-dependent spin splitting \\Delta \\sigma(\\mathbf{k}) of d-, g-, or i-wave symmetry, with zero net moment but anomalous-Hall, magneto-optic, and spin-current responses — phenomena once thought to require a finite \\mathbf{M}. The classification scheme is established on symmetry grounds and is now supported by direct ARPES observation of large altermagnetic band splitting in CrSb (\\sim 1\\,{\\rm eV}, g-wave; Nat. Commun. 15, 2116 (2024); Nat. Commun. 16, 1442 (2025)) and consistent signatures in \\alpha-MnTe. Less settled is the material list : \\mathrm{RuO 2}, the original poster child, has been challenged by μSR studies that find a nonmagnetic ground state (npj Spintronics 2024) and by lattice-dynamics/Mössbauer evidence that electronic correlations, not magnetic order, dominate the phonon spectrum (Cell Rep. Phys. Sci. 202500451-5)). Calling \\mathrm{RuO 2} an altermagnet in 2026 is no longer defensible ; the classification itself remains intact. 2D van der Waals magnets and the Mermin–Wagner loophole Mermin and Wagner forbid long-range order at finite T in the isotropic Heisenberg model in d\\le 2 because Goldstone modes have a logarithmically divergent thermal population — the proof requires \\mathrm{SU}(2) symmetry to be exact. Any single-ion or exchange anisotropy that opens a magnon gap \\Delta exits the hypothesis. Monolayer CrI 3 (T {\\rm c}\\!\\approx\\!45 K, out-of-plane easy axis from the strong I 5p spin–orbit coupling; Huang et al., Nature 546, 270 (2017)) and few-layer Fe 3GeTe 2 (T {\\rm c}\\!\\sim\\!130 K in the monolayer, \\sim\\!200 K in five layers; Deng et al., Nature 563, 94 (2018)) are textbook realizations: anisotropy makes them effectively Ising or XY, and Mermin–Wagner does not apply. The persistent claim that these materials \"violate\" Mermin–Wagner is folklore ; they satisfy a strictly different hypothesis. Moiré-engineered flat-band magnetism Twisting two layers of a vdW magnet generates a moiré superlattice in which the interlayer exchange J \\perp(\\mathbf{r}) varies between ferromagnetic and antiferromagnetic depending on local stacking registry. In small-twist CrI 3 bilayers this produces a ground state of coexisting FM and AFM domains pinned to the moiré, transitioning to uniform FM above a critical twist of \\sim 3^\\circ (Xie et al., Nat. Nanotechnol. 17, 143 (2022); Song et al., Science 374, 1140 (2021)). The phenomenology — moiré-pinned magnetic textures, noncollinear states, and proposals for moiré skyrmions — is now established qualitatively, with the detailed phase diagram still under construction. Distinct from moiré magnetism is the flat-band route in twisted graphene multilayers, where Stoner-like instabilities of an isolated narrow band produce orbital ferromagnets and the quantum anomalous Hall effect — these are not local-moment systems and should not be conflated with the CrI 3 family. Nagaoka, reborn in cold atoms Nagaoka's 1966 theorem applied to a single hole in the U=\\infty Hubbard model on a bipartite lattice. The Lebrat–Greiner and Prichard–Bakr collaborations independently imaged Nagaoka-type polarons in 2024 — finite ferromagnetic bubbles surrounding mobile dopants in a triangular-lattice Fermi–Hubbard quantum gas microscope (Lebrat et al., Nature 629, 317 (2024); Prichard et al., Nature 629, 323 (2024)). Two cautions: the experimental regime is large but finite U/t, and the triangular lattice is non-bipartite — so the theorem's hypotheses are not literally satisfied, but the polaron is the natural finite-U, finite-frustration descendant of the Nagaoka state. The observation is established ; the identification with \"the Nagaoka mechanism\" is defensible but technically loose , and authors who claim more should be read carefully. Where the framework runs out Each frontier maps cleanly onto a failure mode of the Curie–Weiss–Heisenberg–Stoner program. Spin ice fails the assumption that the ground state is unique. Kitaev liquids fail the assumption that the low-energy degrees of freedom are spins at all — they are Majoranas and a \\mathbb{Z} 2 gauge field. Altermagnetism fails the assumption that compensated order has trivial transport. 2D vdW magnets fail the assumption that anisotropy is a small correction. Moiré systems fail the assumption that the lattice is fixed. Nagaoka polarons fail the assumption that exchange — not hopping — is what aligns spins. The verdict for §8 of the dossier is that no single replacement framework has emerged; what has emerged is a clean catalogue of which classical assumption each new system breaks. The AETHER Verdict The AETHER Verdict I have spent eight sections refusing to launder textbook attributions. In closing I will state, without hedging, what I think the durable content of cooperative magnetism actually is, where the field is sleepwalking past its own assumptions, and what I would put my name on next. (a) What I will defend with my reputation The Lenz–Ising–Peierls–Onsager edifice is the single most secure result in condensed matter. The Z 2 universality class is real, its critical exponents are exact in d=2, and Onsager's free energy is one of the very few non-trivial closed-form solutions of an interacting many-body problem in physics. I will defend it against any \"modern\" reformulation that tries to relativize it. The Dirac–Heitler–London identification of exchange as an antisymmetrization energy — not a magnetic interaction — is the correct microscopic origin of J in insulators. The compact bilinear H=-\\sum J {i"}</script>

<script type="application/json" id="aether-data">{"slug": "cooperative-magnetism-an-archaeology-of-order", "topic": "all kinds of magnetism, stoner, kineic, ising, and ....", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "Cooperative Magnetism: An Archaeology of Order", "subtitle": "From Curie's susceptometer to Nagaoka's polarized hole — a credit-audited monograph on the Lenz–Ising–Heisenberg–Stoner family", "domain": "", "era": "", "why_big": "", "abuse": "", "date": "June 20, 2026", "ts": 1781976805.727086, "engine": "Claude Code CLI · default model", "aliases": ["molecular-field theory", "Lenz–Ising model", "Heisenberg exchange model", "itinerant (Stoner) ferromagnetism", "kinetic (Nagaoka) ferromagnetism", "Néel antiferromagnetism / ferrimagnetism", "superexchange (Kramers–Anderson)", "double exchange (Zener)", "RKKY indirect exchange"], "origin_story": "Magnetism enters modern physics as three separate puzzles welded together by quantum mechanics. (i) Curie's 1895 Paris thesis fixes the empirical law χ∝1/T for paramagnets and identifies a critical temperature for iron; Langevin (1905) gives it a classical statistical-mechanical skeleton; Weiss (1907) closes the iron problem phenomenologically by postulating a 'molecular field' H_mol=λM, leaving λ unexplained. (ii) Lenz, lecturing in Hamburg in 1920, proposes a one-dimensional row of ±1 atomic dipoles to ask whether such an internal field can arise from short-range interactions; his student Ising (1924/25 thesis) solves the 1D chain, finds no transition, and wrongly concludes the same for higher D — a model so dormant that it is essentially ignored until Peierls (1936) and Onsager (1944) rescue it. (iii) Heisenberg (1928), with parallel papers by Dirac (1929) and Frenkel (1928), identifies the antisymmetry of the electronic wavefunction — the exchange integral J — as the microscopic origin of Weiss's λ, giving H=−Σ J_ij S_i·S_j. Bloch (1930) then derives spin waves and the T^{3/2} law. From there the field branches: Néel (1932, 1948) extends Weiss's machinery to two sublattices and invents antiferro- and ferrimagnetism; Stoner (1938) reformulates ferromagnetism for itinerant d-electrons via a band-splitting criterion UN(E_F)\u003e1; Kramers (1934) and Anderson (1950, 1959) explain how insulating oxides couple via virtual hops (superexchange); Zener (1951) supplies the metallic-manganite analogue (double exchange); Ruderman–Kittel (1954) generalize to oscillatory conduction-electron-mediated coupling (RKKY, completed by Kasuya 1956 and Yosida 1957); Nagaoka (1966) discovers a genuinely kinetic ferromagnetism in the U→∞ Hubbard model with one hole; and Mermin–Wagner (1966) close the era by proving that the continuous-symmetry Heisenberg model cannot order at T\u003e0 in D≤2, sharply distinguishing it from the discrete Lenz–Ising case.", "credit_audit": "Three durable mis-attributions dominate the modern textbook record. (1) The 'Ising model' is Lenz's invention; Ising solved only the 1D case and drew the wrong conclusion from it. Brush's 1967 Rev. Mod. Phys. history makes this explicit, yet nearly every statistical-mechanics text uses 'Ising' without qualification. (2) Weiss is regularly credited with explaining ferromagnetism, but his λ has no microscopic content — the explanation is Heisenberg's (1928), with independent and contemporaneous contributions by Dirac (1929) and Frenkel (1928, in Z. Physik), the last of which is almost never cited in Anglophone textbooks. (3) 'Anderson superexchange' obscures Kramers's 1934 priority; conversely, the Néel Nobel (1970) correctly recognizes antiferro- and ferrimagnetism but leaves out Landau's 1933 antiferromagnetic-order paper on heavy alkali metals and Bitter's early experiments on domain visualization. The Stoner criterion is usually presented as Stoner's alone but is essentially equivalent to Slater's 1936 band picture published a year earlier; the British/American attribution split here is a question of community, not chronology.", "timeline": [{"year": 1895, "event": "Curie law χ=C/T for paramagnets; Curie temperature for iron measured", "who": "Pierre Curie", "work": "Propriétés magnétiques des corps à diverses températures — Paris doctoral thesis / Ann. Chim. Phys. 7e sér. 5, 289", "kind": "observation", "ref": 1}, {"year": 1905, "event": "Classical statistical theory of dia- and paramagnetism; Langevin function L(x)=coth x − 1/x", "who": "Paul Langevin", "work": "Magnétisme et théorie des électrons, Ann. Chim. Phys. 5, 70", "kind": "theory", "ref": 2}, {"year": 1907, "event": "Molecular-field hypothesis H_mol=λM; mean-field account of ferromagnetism and the Curie–Weiss law", "who": "Pierre Weiss", "work": "L'hypothèse du champ moléculaire et la propriété ferromagnétique, J. Phys. Théor. Appl. 6, 661", "kind": "theory", "ref": 3}, {"year": 1920, "event": "Proposal of the binary-spin lattice model later called 'Ising'", "who": "Wilhelm Lenz", "work": "Beitrag zum Verständnis der magnetischen Erscheinungen in festen Körpern, Phys. Z. 21, 613", "kind": "theory", "ref": 5}, {"year": 1925, "event": "Exact solution of the 1D chain; (incorrect) inference of no transition in higher D", "who": "Ernst Ising", "work": "Beitrag zur Theorie des Ferromagnetismus, Z. Physik 31, 253 (Hamburg thesis, 1924)", "kind": "theory", "ref": 6}, {"year": 1928, "event": "Microscopic origin of Weiss's molecular field: exchange interaction from antisymmetric electronic wavefunctions", "who": "Werner Heisenberg", "work": "Zur Theorie des Ferromagnetismus, Z. Physik 49, 619", "kind": "theory", "ref": 8}, {"year": 1930, "event": "Spin-wave quantization; Bloch T^{3/2} law for low-T magnetization", "who": "Felix Bloch", "work": "Zur Theorie des Ferromagnetismus, Z. Physik 61, 206", "kind": "formalization", "ref": 9}, {"year": 1932, "event": "Two-sublattice molecular-field theory predicting antiferromagnetism and a 'compensation point' susceptibility", "who": "Louis Néel", "work": "Influence des fluctuations du champ moléculaire sur les propriétés magnétiques des corps, Ann. Phys. (Paris) 17, 64 (Strasbourg thesis)", "kind": "theory", "ref": 4}, {"year": 1934, "event": "Superexchange: virtual electron transfer through a non-magnetic anion as origin of antiferromagnetic coupling in insulators", "who": "Hendrik A. Kramers", "work": "L'interaction entre les atomes magnétogènes dans un cristal paramagnétique, Physica 1, 182", "kind": "theory", "ref": 11}, {"year": 1936, "event": "Contour ('Peierls argument') proof that the 2D Ising model orders at finite T, refuting Ising's pessimism", "who": "Rudolf Peierls", "work": "On Ising's model of ferromagnetism, Proc. Cambridge Phil. Soc. 32, 477", "kind": "theory", "ref": 13}, {"year": 1938, "event": "Collective-electron (itinerant) ferromagnetism; Stoner criterion UN(E_F)\u003e1 for band splitting", "who": "Edmund C. Stoner", "work": "Collective electron ferromagnetism, Proc. Roy. Soc. A 165, 372", "kind": "theory", "ref": 10}, {"year": 1944, "event": "Exact closed-form free energy and singular specific heat of the 2D Ising model — first non-trivial second-order transition solved", "who": "Lars Onsager", "work": "Crystal statistics. I. A two-dimensional model with an order-disorder transition, Phys. Rev. 65, 117", "kind": "formalization", "ref": 14}, {"year": 1948, "event": "Coining and theory of 'ferrimagnétisme'; explanation of magnetite/ferrite anomalies via unequal sublattice moments", "who": "Louis Néel", "work": "Propriétés magnétiques des ferrites; ferrimagnétisme et antiferromagnétisme, Ann. Phys. (Paris) 12, 137", "kind": "naming", "ref": 18}, {"year": 1951, "event": "Double-exchange mechanism for ferromagnetism in mixed-valence manganites (LaMnO₃/CaMnO₃ family)", "who": "Clarence Zener", "work": "Interaction between the d-shells in the transition metals. II., Phys. Rev. 82, 403", "kind": "theory", "ref": 17}, {"year": 1954, "event": "Oscillatory conduction-electron-mediated indirect exchange (RKKY) of localized moments — kernel ∝ cos(2k_F r)/r³ for large r", "who": "Malvin Ruderman, Charles Kittel", "work": "Indirect exchange coupling of nuclear magnetic moments by conduction electrons, Phys. Rev. 96, 99", "kind": "theory", "ref": 16}, {"year": 1966, "event": "Theorem: in the U→∞ Hubbard model with one hole, the ground state on bipartite lattices is fully spin-polarized — purely kinetic ferromagnetism", "who": "Yosuke Nagaoka", "work": "Ferromagnetism in a narrow, almost half-filled s band, Phys. Rev. 147, 392", "kind": "theory", "ref": 15}, {"year": 1966, "event": "Rigorous absence of spontaneous breaking of continuous symmetry in 1D/2D Heisenberg-type models at T\u003e0 — separates Ising from Heisenberg universality", "who": "N. David Mermin, Herbert Wagner", "work": "Absence of ferromagnetism or antiferromagnetism in one- or two-dimensional isotropic Heisenberg models, Phys. Rev. Lett. 17, 1133", "kind": "theory", "ref": 12}], "neglected": [{"name": "Wilhelm Lenz", "role": "Actually invented what is universally called the 'Ising model': a binary ±1 lattice with nearest-neighbour interactions, proposed in 1920 to test whether Weiss's molecular field could be generated by local couplings. He handed the 1D problem to Ising as a thesis exercise; the name stuck because Ising published the (negative) solution. The fairer name is 'Lenz–Ising model'.", "evidence": "Lenz 1920 Phys. Zeit. paper is explicit; Brush's 1967 history reconstructs the priority in detail from correspondence and Hamburg seminar notes.", "ref": 7}, {"name": "Rudolf Peierls", "role": "Rescued the Ising model from a decade of neglect by giving the first proof that the 2D version actually orders (the 'Peierls argument' via domain-wall counting). Without this, Onsager's 1944 tour de force would not have been so urgently sought, and the model would likely have remained a curiosity.", "evidence": "Peierls 1936 Proc. Cambridge Phil. Soc. 32, 477; Brush 1967 documents how the community received the 1D Ising result as evidence of no transition in any D until Peierls.", "ref": 13}, {"name": "Hendrik A. Kramers", "role": "Introduced the superexchange concept — virtual hopping through a closed-shell ligand — sixteen years before Anderson's celebrated paper. Kramers's contribution is routinely truncated to a footnote in textbooks that credit 'Anderson superexchange'.", "evidence": "Kramers, Physica 1, 182 (1934), in French, explicitly constructs the perturbative pathway 3d–2p–3d; Anderson (Phys. Rev. 79, 350, 1950) cites Kramers and frames his own contribution as a quantitative extension.", "ref": 11}], "conflations": [{"claim": "'The Ising model' as a single object", "clarification": "The lattice model is Lenz's (1920); the 1D solution is Ising's (1925); the 2D existence-of-transition proof is Peierls's (1936); the exact 2D free energy is Onsager's (1944). Each is a different intellectual act, and the universality class 'Ising' refers to the symmetry of the order parameter (Z₂), not to any individual's contribution."}, {"claim": "'Heisenberg Hamiltonian' H=−Σ J S_i·S_j is what Heisenberg wrote in 1928", "clarification": "Heisenberg's 1928 paper is a perturbative many-electron calculation in the spirit of Heitler–London, not a spin Hamiltonian. The compact bilinear form H=−Σ J S_i·S_j is due to Dirac (1929) and was popularized via Van Vleck's 1932 monograph. Calling the spin Hamiltonian itself 'Heisenberg's' elides Dirac's reformulation."}, {"claim": "Stoner itinerant ferromagnetism and Nagaoka kinetic ferromagnetism are the same kind of 'band ferromagnetism'", "clarification": "They live in opposite limits of the Hubbard model. Stoner is a weak-coupling, mean-field statement: at U N(E_F)\u003e1 the paramagnetic band is unstable to a uniform spin splitting — it is a Hartree–Fock result and is known to overestimate ordering. Nagaoka is a rigorous strong-coupling theorem at U→∞ for exactly one hole away from half-filling on bipartite lattices: the ground state is the maximally polarized state because parallel spins avoid the on-site Coulomb penalty while allowing coherent hole motion. The Nagaoka state is fragile (finite hole density and/or finite U destroys it on most lattices) and shares essentially no microscopic mechanism with the Stoner instability."}, {"claim": "The 'Stoner criterion' is a general condition for itinerant ferromagnetism", "clarification": "It is the mean-field instability condition of a homogeneous paramagnet to a uniform exchange splitting. It silently neglects correlation, longitudinal/transverse spin fluctuations, and competing instabilities (SDW, Pomeranchuk). In nearly ferromagnetic d-metals it predicts ordering temperatures off by an order of magnitude; Moriya's self-consistent renormalization theory is the correction usually omitted."}, {"claim": "Antiferromagnetism was discovered by Néel", "clarification": "Néel formulated the molecular-field theory and gave it operational consequences (susceptibility cusp, the Néel temperature, neutron-detectable sublattice structure later confirmed by Shull 1949). The bare suggestion that opposite sublattices might be antiparallel had also been entertained by Landau in 1933 for layered structures and by Bitter; what was Néel's is the systematic two-sublattice theory and the prediction of the susceptibility maximum at T_N."}, {"claim": "RKKY is a single 1954 result", "clarification": "Ruderman–Kittel (1954) treated nuclear moments coupled via conduction electrons; Kasuya (1956) extended it to localized d-spins in metals (the s-d model context); Yosida (1957) closed it for rare-earth f-moments and showed the canonical oscillatory long-range form. 'RKKY' is a tripartite construction completed in 1957, not a 1954 paper."}, {"claim": "'Curie–Weiss law' is a single phenomenological discovery", "clarification": "χ=C/T is Curie (1895); χ=C/(T−Θ) is Weiss (1907) and follows from the molecular-field correction to Langevin's classical theory. The χ=C/(T+Θ_N) extrapolation that diagnoses antiferromagnets is Néel's contribution (1932/36). Lumping these together as 'Curie–Weiss' is bibliographically convenient but historically inaccurate."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Before the Models: Curie, Langevin, Weiss — and the Pioneers the Textbooks Lost", "markdown": "## Before the Models: Curie, Langevin, Weiss — and the Pioneers the Textbooks Lost\n\n### 1895: Curie measures, and a temperature gets a name\n\nPierre Curie's 1895 Paris thesis [1] is two distinct works bound under one title. The diamagnetic half — the observation that the susceptibility of bismuth, antimony, and a host of \"feebly magnetic\" substances is temperature-independent — is what occupied most of the bench time. The paramagnetic half, a few dozen pages, contains what every physicist now calls the *Curie law*\n\n$$\\chi \\;=\\; \\frac{C}{T},$$\n\nextracted from measurements on oxygen gas and on a battery of iron, palladium, and rare-earth salts in his elder brother Jacques's piezoelectric susceptometer. In the same memoir Curie reports the disappearance of spontaneous magnetization in iron near $1043\\,\\mathrm{K}$ — the *point de transformation* later universally called the *Curie temperature* $T_C$. The thesis is silent on mechanism: Curie was an experimentalist closing a regression, not a theorist proposing a model.\n\n### 1905: Langevin classicizes the paramagnet\n\nLangevin's 1905 *Magnétisme et théorie des électrons* [2] is the first statistical-mechanical derivation of $\\chi(T)$. Taking $N$ classical dipoles of moment $\\mu$ in a field $H$ at temperature $T$, the Boltzmann average gives the *Langevin function*\n\n$$M \\;=\\; N\\mu\\,\\mathcal{L}\\!\\left(\\tfrac{\\mu H}{k_B T}\\right), \\qquad \\mathcal{L}(x) \\;=\\; \\coth x - \\tfrac{1}{x}.$$\n\nFor small $x$, $\\mathcal{L}(x)\\simeq x/3$, recovering Curie's law with $C = N\\mu^{2}/3k_B$. Langevin also disposed of diamagnetism by an electron-orbital argument that survives in modified form as the Langevin–Larmor diamagnetic formula. The result is wholly classical: Bohr and van Leeuwen would soon show that strict classical statistics in fact forbids magnetism altogether, so Langevin's derivation must be read as a semi-classical limit of what would later be Brillouin's quantized form. Within its regime it is exact.\n\n### 1907: Weiss invents a field he cannot justify\n\nThree years later Weiss [3] supplements Langevin with the *hypothèse du champ moléculaire*: each dipole sees not the applied field $H$ but an effective field\n\n$$H_{\\mathrm{eff}} \\;=\\; H + \\lambda M.$$\n\nSelf-consistency in Langevin's equation now generates spontaneous magnetization below a critical temperature and, in the paramagnetic regime above it,\n\n$$\\chi \\;=\\; \\frac{C}{T - \\Theta}, \\qquad \\Theta \\;=\\; C\\lambda,$$\n\nthe *Curie–Weiss law*. The bibliographic shorthand is convenient but misleading: $\\chi = C/T$ is Curie 1895; the shift $T \\to T - \\Theta$ is Weiss 1907; the extrapolation $T \\to T + \\Theta_N$ that diagnoses antiferromagnets is Néel 1932 [4]. Three different acts, three different decades.\n\nThe conceptual scandal in Weiss's paper, openly acknowledged by Weiss himself, is the magnitude of $\\lambda$. To reproduce $\\Theta \\sim 10^{3}\\,\\mathrm{K}$ in iron one needs $\\lambda \\sim 10^{3}$ in CGS, i.e. an internal field of order $10^{7}\\,\\mathrm{Oe}$ — roughly four orders of magnitude larger than any classical dipolar field a neighbour can produce. Weiss had a phenomenology that worked; he had no microscopic basis. For two decades $\\lambda$ was a placeholder.\n\n### 1920: Lenz proposes a lattice — and hands it to a student\n\nIn a short, often-overlooked 1920 paper in *Physikalische Zeitschrift*, Wilhelm Lenz [5] proposed that Weiss's molecular field might arise from purely local couplings between elementary \"molecular magnets\" pinned to lattice sites and restricted to two orientations. Lenz did
