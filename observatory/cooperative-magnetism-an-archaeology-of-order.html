\n\n### (b) What is shakier than the literature admits\n\nThree loose joists.\n\n**The Stoner picture as a theory of $T_c$.** The criterion $U\\,N(E_F)\u003e1$ is a *zero-temperature, mean-field, longitudinal* instability. Applied to Fe, Co, Ni it overestimates $T_c$ by factors of 3–10. The standard rescue — Moriya's self-consistent renormalization of spin fluctuations — is treated as a footnote when it is the actual physics. The assumption silently smuggled in is that the order parameter amplitude is rigid above $T_c$; it isn't, and the literature still draws Stoner-style DOS-splitting cartoons to \"explain\" $T_c$ in elemental ferromagnets.\n\n**Effective spin Hamiltonians extracted from DFT+$U$.** Mapping a multi-orbital itinerant problem onto $H=-\\sum J_{ij}\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$ via energy differences of broken-symmetry states assumes (i) the moment is rigid, (ii) higher-order ring exchange is negligible, (iii) $U$ is transferable. None of these hold cleanly for $4d/5d$ oxides, and the $J_{ij}$ that decorate the abstracts of half the magnonics literature carry an unstated uncertainty of order unity.\n\n**\"Quantum spin liquid\" as a positive identification.** Absence of order down to $T/\\Theta_{CW}\\sim 10^{-2}$ plus a broad inelastic continuum is, strictly, a *failure* to detect order, not detection of fractionalization. The few unambiguous diagnostics — a quantized thermal Hall response, oscillations in a Mott insulator — remain contested. I would not bet a graduate student's thesis on any specific candidate being a Kitaev liquid until a topological invariant is measured, not inferred.\n\n### (c) Three open questions I would actually work on\n\n1. **Quantitative theory of $T_c$ in itinerant ferromagnets that interpolates between Stoner and Heisenberg without an adjustable parameter.** — Moriya's SCR is 50 years old; we still cannot predict $T_c$ of Fe to 20%.\n2. **A microscopic, symmetry-resolved definition of altermagnetism that distinguishes it cleanly from a collinear antiferromagnet with anisotropic exchange.** — The phenomenology is striking; the order parameter is not yet uniquely defined.\n3. **Experimental realization of Nagaoka ferromagnetism in a tunable platform (moiré or quantum-dot array) with controlled hole density.** — The cleanest test of strong-coupling kinetic magnetism, and the recent quantum-dot results [verify] are tantalizing but small-system.\n\n### (d) Reading path\n\n1. **Brush, *Rev. Mod. Phys.* 39, 883 (1967)** — the only history of the Ising model written by someone who read the German originals; corrects the attribution at the source.\n2. **Van Vleck, *The Theory of Electric and Magnetic Susceptibilities* (1932)** — the book that fixed the spin-Hamiltonian language; read it to see Dirac's identity in its natural habitat.\n3. **Anderson, *Phys. Rev.* 115, 2 (1959), \"New approach to the theory of superexchange interactions\"** — the canonical superexchange paper; read it *alongside* Kramers (1934) to see what was new and what was already there.\n4. **Moriya, *Spin Fluctuations in Itinerant Electron Magnetism* (Springer, 1985)** — the correction to Stoner that the textbooks omit; everything you need to stop drawing rigid-band cartoons of $T_c$.\n5. **Shull \u0026 Smart, *Phys. Rev.* 76, 1256 (1949)** — two pages of neutron data that turned Néel's two-sublattice theory from hypothesis into fact; read last, as the experimental closure of the classical lineage."}], "references": [{"n": 1, "title": "Propriétés magnétiques des corps à diverses températures", "authors": ["Pierre Curie"], "year": 1895, "venue": "Annales de Chimie et de Physique, 7e série, t. 5, pp. 289–405 (Paris doctoral thesis)", "url": "https://gallica.bnf.fr/ark:/12148/bpt6k34875g", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Magnétisme et théorie des électrons", "authors": ["Paul Langevin"], "year": 1905, "venue": "Annales de Chimie et de Physique, 8e série, t. 5, pp. 70–127", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "L'hypothèse du champ moléculaire et la propriété ferromagnétique", "authors": ["Pierre Weiss"], "year": 1907, "venue": "Journal de Physique Théorique et Appliquée, 4e série, t. 6, pp. 661–690", "url": "https://doi.org/10.1051/jphystap:019070060066100", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Influence des fluctuations du champ moléculaire sur les propriétés magnétiques des corps", "authors": ["Louis Néel"], "year": 1932, "venue": "Annales de Physique (Paris) 17, 64–129 (Strasbourg doctoral thesis)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Beitrag zum Verständnis der magnetischen Erscheinungen in festen Körpern", "authors": ["Wilhelm Lenz"], "year": 1920, "venue": "Physikalische Zeitschrift 21, 613–615", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Beitrag zur Theorie des Ferromagnetismus", "authors": ["Ernst Ising"], "year": 1925, "venue": "Zeitschrift für Physik 31, 253–258 (based on 1924 Hamburg dissertation)", "url": "https://doi.org/10.1007/BF02980577", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "History of the Lenz–Ising model", "authors": ["Stephen G. Brush"], "year": 1967, "venue": "Reviews of Modern Physics 39, 883–893", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Zur Theorie des Ferromagnetismus", "authors": ["Werner Heisenberg"], "year": 1928, "venue": "Zeitschrift für Physik 49, 619–636", "url": "https://doi.org/10.1007/BF01328601", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Zur Theorie des Ferromagnetismus", "authors": ["Felix Bloch"], "year": 1930, "venue": "Zeitschrift für Physik 61, 206–219", "url": "https://doi.org/10.1007/BF01339661", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Collective electron ferromagnetism", "authors": ["Edmund C. Stoner"], "year": 1938, "venue": "Proceedings of the Royal Society A 165, 372–414", "url": "https://doi.org/10.1098/r y": null, "bucket": "archive"}, {"n": 18, "title": "Propriétés magnétiques des ferrites; ferrimagnétisme et antiferromagnétisme", "authors": ["Louis Néel"], "year": 1948, "venue": "Annales de Physique (Paris) 12, 137–198", "url": "https://doi.org/10.1051/anphys/194812030137", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Antiferromagnetism. Theory of superexchange interaction", "authors": ["Philip W. Anderson"], "year": 1950, "venue": "Physical Review 79, 350–356", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Magnetism and the local molecular field — Nobel Lecture", "authors": ["Louis Néel"], "year": 1970, "venue": "Nobel Foundation, lecture delivered 11 December 1970", "url": "https://www.nobelprize.org/prizes/physics/1970/neel/lecture/", "cited_by": null, "bucket": "archive"}], "nsec": 9, "nref": 20, "teaser": "From Curie's susceptometer to Nagaoka's polarized hole — a credit-audited monograph on the Lenz–Ising–Heisenberg–Stoner family"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

<script>

var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){

  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');

  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+

     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+

     aka+'</header>';
  /* seminar callouts */

        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+

      }).join('')+'</ol></div>';

  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');

  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';

  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
