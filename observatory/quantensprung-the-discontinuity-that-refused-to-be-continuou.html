tory 1.1 The 1913 postulate: a discontinuity inserted by hand The quantum jump enters physics not as a derivation but as an axiom. In the three installments of On the Constitution of Atoms and Molecules , Bohr writes down two postulates whose only justification is that they reproduce the Balmer formula. The first asserts that an atomic electron can occupy only a discrete set of \"stationary states\" in which, in defiance of Larmor, it does not radiate. The second asserts that radiation accompanies a transition between two such states, with frequency fixed by The transition itself has no dynamical description. It is not a continuous motion in configuration space; it is not a perturbative process in any well-defined Hamiltonian; it is a primitive of the theory. Bohr is explicit about this — he calls the inter-state passage \"a process which cannot be treated on the ordinary mechanical conceptions.\" Read coldly in 2026, the trilogy is a remarkable document: a logically incomplete theory whose central new object (the jump) is defined operationally by the spectral lines it produces and otherwise left as a black box. The discreteness comes from the spectrum; the jump is an interpretive overlay placed on top of it. Two consequences of this surgical incision are worth fixing now, because they propagate through every later confusion (see §6 of the dossier on conflations). First, Bohr's h\\nu = E n - E m is a constraint on the radiation , not a clock for the transition: nothing in tells you how long a jump takes, only that energy is balanced before and after. Second, Bohr's framework is silent on individual photons. The 1913 paper does not yet commit to the light quantum — Bohr will, notoriously, resist it until 1925. The jump and the photon are, at birth, separated. 1.2 Einstein 1917: the statistical law nobody credits The piece textbooks call \"Bohr's quantum jump\" is in fact Einstein's. In Zur Quantentheorie der Strahlung , Einstein replaces Bohr's qualitative postulate with a complete statistical kinetics . He posits three elementary processes — spontaneous emission with rate A {mn}, stimulated emission with rate B {mn}\\rho(\\nu), and absorption with rate B {nm}\\rho(\\nu) — and shows that detailed balance against a Planck distribution forces the relations This is more than a derivation of Planck's law. Three structural features of every later theory of jumps are quietly fixed here: 1. Each emission act carries a definite directed momentum h\\nu/c. Einstein insists on this: without directionality, detailed balance fails. The \"needle radiation\" ( Nadelstrahlung ) is the photon in all but name, eight years before Compton. 2. The transitions are Poissonian. The probability of a jump in dt is A {mn}\\,dt, independent of history; populations decay as e^{-A {mn}t}. Every Lindblad rate calculation done today is structurally Einstein 1917 with a derivation supplied for A {mn}. 3. The when is uncaused. Einstein writes — and this is the sentence Schrödinger will quote bitterly thirty-five years later [3, 4] — that \"the time and direction of the elementary process are left to chance \" ( es bleibt dem 'Zufall' überlassen ). He flags this as a weakness of the theory, not as a positive result. The man who would later refuse dice did not invent the casino either; he diagnosed it. So the modern object — the stochastic, Poissonian, momentum-carrying jump — is Einstein's . Bohr supplied the conservation law h\\nu = E n - E m; Einstein supplied the rate law dP/dt = A {mn} that turns it into a calculable theory. Pedagogy collapses both into \"the Bohr postulate,\" and the most important half of the structure ends up uncredited. 1.3 BKS 1924: the theory that tried to kill the jump Within a year of de Broglie's matter waves and a year before Heisenberg's Umdeutung , Bohr made one last attempt to abolish the quantum jump as a real physical event. The Bohr–Kramers–Slater paper proposed that each atom in a stationary state continuously generates a virtual radiation field at all of its possible transition frequencies. Real emission and absorption are then statistically induced by this field, and — crucially — energy and momentum are conserved only on statistical average , not in individual atomic events. The jump dissolves into a continuous, classical-looking radiation process whose only quantum content is statistical. Here the historical record diverges sharply from the textbook story, and Slater is the casualty. As his own later accounts make clear (and as Mehra–Rechenberg vol. 1 documents in detail), Slater arrived in Copenhagen with a photon-preserving virtual-field picture: real light quanta guided by virtual oscillators, with strict event-by-event conservation. It was Bohr and Kramers who stripped the photons and the conservation laws before publication, against Slater's objection. The paper bears his name; the physics does not. Slater never quite recovered scientific seniority after the experiment killed the theory, and the credit asymmetry — Bohr the visionary, Kramers the theorist, Slater the postdoc — has fossilized. 1.4 Bothe–Geiger 1925: the names that get erased The verdict on BKS was empirical, not theoretical, and it was rendered by an apparatus, not an axiom. Bothe and Geiger built the first coincidence counter : a needle counter for Compton-scattered photons and a point counter for the recoil electron, with a fast mechanical recording system. If BKS were right, the photon-scattering and electron-recoil events would be independently random, correlated only by an overall rate, because no individual conservation law links them. If real quanta are right, every recoil electron is born simultaneously with a scattered photon, and the two counters should fire in lock-step. They did. Bothe and Geiger reported coincidence rates orders of magnitude above the BKS-allowed accidental rate; Compton and Simon, working independently in Chicago with cloud-chamber tracks, reached the same conclusion within months. Energy and momentum conservation hold event-by-event . The jump is real, discrete, and individually-conservative. Pauli's relief is famous (\"die Idee Bohrs ist gestorben\"); Schrödinger's irritation, less so. Bothe's 1954 Nobel lecture is unambiguous that this experiment is the origin of the coincidence method and the empirical death of BKS — yet most modern textbooks attribute the demise of BKS to \"experiments by Compton\" or simply to \"experiment,\" dropping Bothe and Geiger by name. The first instrument ever built to interrogate a single quantum event has, in the pedagogical record, become anonymous. 1.5 What 1925 left on the table By the end of 1925 the conceptual furniture of the jump is in place and largely uncredited at the right addresses. From comes discreteness and the frequency condition; from comes Poissonian kinetics, directed quanta, and the explicit admission that the when is uncaused; from the failure of comes the empirical guarantee, via , that individual events conserve E and \\mathbf{p}. What is missing is any dynamical account of the transition itself: a Hamiltonian, an evolution equation, a duration. That gap is what Schrödinger will pry open in 1926, and again, more bitterly, in 1952 — and what will not close, in any operational sense, until Minev 2019 . The Physics: From hν = E_n − E_m to the Einstein A and B Coefficients The Physics: From hν = E n − E m to the Einstein A and B Coefficients Bohr's frequency condition as an axiom Bohr's second postulate of 1913 is a single line of arithmetic doing the work of a derivation: with \\nu {mn} the frequency of the radiation emitted (or absorbed) in the transition m \\!\\to\\! n . The radical move is not the equation but what is omitted from it: the postulate fixes only the frequency of the emitted quantum, not the time at which the jump occurs, not the duration of the transient, not the phase relation between the initial and final stationary states. Maxwellian intuition — that a radiating atom is an oscillating dipole whose frequency equals its mechanical frequency — is severed at the root. The radiation frequency is a difference of mechanical eigenfrequencies and bears no fixed relation to either of them. The Rydberg combination principle (Ritz 1908), empirical and unexplained for five years, becomes a corollary: spectral lines combine additively in frequency because energies combine additively in level differences. What Bohr does not supply is a rate . The postulate is silent on dN m/dt. Atoms in the excited stationary state are stipulated as stationary; the jump down is asserted but its statistics are absent. That gap is what Einstein closes in 1917. Einstein 1917: the three rate constants Einstein's \"Zur Quantentheorie der Strahlung\" introduces three elementary processes between any pair of bound states m,n in a bath of thermal radiation of spectral energy density \\rho(\\nu) : - Spontaneous emission m \\!\\to\\! n at rate A {mn} per atom, independent of \\rho. - Stimulated emission m \\!\\to\\! n at rate B {mn}\\,\\rho(\\nu {mn}) per atom. - Absorption n \\!\\to\\! m at rate B {nm}\\,\\rho(\\nu {mn}) per atom. Population dynamics in a closed two-level subspace then obey the rate (master) equation with \\dot N n = -\\dot N m. The conceptual jump — Einstein's own — is to treat each elementary act as a Poissonian random event : the probability that an atom currently in m emits in [t,t+dt] is (A {mn} + B {mn}\\rho)\\,dt, independent of how long it has already sat in m. This memoryless ansatz, imported by analogy with radioactive decay (Rutherford 1900), is what makes \"quantum jump\" a statistical object rather than a kinematic one. Bohr supplied the kinematics (h\\nu = \\Delta E); Einstein supplied the statistics (A, B, exponential dwell). Detailed balance fixes A/B In thermal equilibrium at temperature T, \\dot N m = 0 and the populations satisfy Boltzmann statistics N m/N n = (g m/g n)\\exp(-h\\nu {mn}/k B T), with g {m,n} the level degeneracies. Inserting this into the steady-state condition and solving for \\rho gives For this to reduce to the Planck distribution Einstein extracts two algebraic constraints, valid for any T: The second is the relation that physicists actually use: it ties the spontaneous rate to the stimulated cross-section through nothing but the mode density of free space 8\\pi\\nu^2/c^3 and one photon of energy h\\nu per mode. Conceptually this is already the embryo of quantum electrodynamics — spontaneous emission is stimulated emission driven by the vacuum's zero-point occupation, a viewpoint made rigorous only after Dirac 1927. Figure: Left — the three elementary processes Einstein introduces in between levels n\\rangle and m\\rangle separated by h\\nu = E m - E n. Right — the resulting exponential decay of the excited-state population that follows from treating each emission as a Poissonian event of rate \\Gamma; the dwell-time distribution is p(\\tau) = \\Gamma e^{-\\Gamma\\tau}, and counted clicks form a Poisson process. Exponential decay and Poisson click statistics In the absence of driving (\\rho \\to 0) the rate equation collapses to \\dot N m = -A {mn} N m, with the textbook solution For a single atom, N m(t) is replaced by the survival probability P m(t) = e^{-\\Gamma t} with \\Gamma = \\sum n A {mn} summing over all decay channels; the lifetime is \\tau = \\Gamma^{-1}. The distribution of dwell times \\tau {\\text{dwell}} before a click is and the number of clicks in [0,T] from N independent atoms is Poisson-distributed with mean N\\Gamma T (small-excitation limit) — the form the 1986 single-ion experiments analyzed to confirm they were seeing Einstein-A kinetics on the shelving transition [8, 9, 10]. The branching ratio between two decay channels is A {m \\to n 1}/A {m \\to n 2}, fixed by the transition matrix elements and ultimately calculable from QED. What is silently invoked The Einstein derivation is irreproachable but rests on assumptions textbooks rarely state. They reappear, with consequences, in every modern Lindblad calculation and every Monte Carlo unraveling [12, 13, 14]. 1. Weak coupling. The atom–field interaction must be small enough that \\rho(\\nu) is essentially undisturbed by the presence of the atom and that perturbative transition rates are well-defined. Strong-coupling cavity QED breaks this: vacuum Rabi oscillations replace exponential decay. 2. Broad-band, smooth reservoir. \\rho(\\nu) must vary negligibly over the natural linewidth \\Gamma. In photonic crystals or near a cavity resonance this fails outright; the Purcell factor F P = (3/4\\pi^2)(\\lambda/n)^3(Q/V) modifies A {mn} by orders of magnitude, demonstrating that \"the\" spontaneous rate is not a property of the atom but of the atom-in-its-mode-environment. 3. Markov approximation. The memoryless Poisson ansatz requires that the reservoir correlation time \\tau c be much shorter than any system timescale: \\tau c \\ll \\Gamma^{-1}. For free-space optical transitions \\tau c \\sim 1/\\nu \\sim 10^{-15} s and \\Gamma^{-1} \\sim 10^{-8} s, so the gap is comfortable; for engineered reservoirs (structured photonic baths, slow electromagnetic environments) it is not, and one needs the non-Markovian jump generalization of Piilo et al. . 4. Rotating-wave / energy-shell restriction. \\rho is sampled only at \\nu {mn}; counter-rotating contributions and the Lamb shift are quietly absorbed into renormalized energies. 5. Stationary thermal reservoir for the derivation of A/B. The ratio A/B = 8\\pi h\\nu^3/c^3 is forced by Planck plus Boltzmann; the derivation uses thermal equilibrium as a device to fix the ratio, after which the ratio is treated as a universal property of the transition. This is legitimate (the coefficients are atomic, not thermal) but the logical move is rarely flagged. 6. No coherence. The rate equation tracks populations N m, not coherences \\rho {mn}. It is the diagonal sector of the optical Bloch equations in the limit where the off-diagonal damping \\Gamma \\perp = \\Gamma \\parallel/2 + \\gamma \\phi exceeds the Rabi frequency. Coherent driving, dark states, EIT, and superradiance all live in the sector Einstein's 1917 framework discards. What Einstein leaves intact, and what survives every refinement, is the structural skeleton: a discrete spectrum (Bohr), a statistical law of transition rates between discrete levels (Einstein), and a thermal-equilibrium constraint that ties spontaneous to stimulated rates via the free-space mode density. Modern Lindblad operators L k = \\sqrt{\\Gamma k}\\, n\\rangle\\langle m are nothing more than the operator-valued square roots of Einstein's A {mn}; the master equation \\dot\\rho = -i[H,\\rho]/\\hbar + \\sum k(L k \\rho L k^\\dagger - \\tfrac{1}{2}\\{L k^\\dagger L k,\\rho\\}) reproduces Einstein's rate equation on the diagonal and supplies, on the off-diagonal, exactly the coherences that 1917 could not yet see. Every \"quantum jump\" in the operational sense of Section 5 is a click drawn from a L k-conditioned Poisson process whose intensity, in equilibrium, is set by the very ratio Einstein extracted from black-body radiation. The Foundational War: Schrödinger's 1926 Outburst and the 1952 Polemic The Foundational War: Schrödinger's 1926 Outburst and the 1952 Polemic The Copenhagen confrontation, September 1926 By the autumn of 1926 the quantum jump had become not a postulate but a sociological fault line. Schrödinger arrived in Copenhagen at Bohr's invitation on 1 October 1926, fresh from the wave-mechanical papers of January–June and from his proof of formal equivalence with matrix mechanics. He came armed with a physical picture — continuous \\psi(\\mathbf{r},t) obeying a deterministic linear PDE — that left no room for discontinuous transitions between stationary states. Bohr came armed with the 1913 postulate, Einstein's 1917 statistical machinery , and the empirical verdict of Bothe–Geiger 1925 which had killed BKS and reinstated event-by-event energy conservation. The two were not arguing about formalism; they were arguing about what the formalism meant . The conversation is preserved primarily through Heisenberg's reconstruction in Der Teil und das Ganze . Heisenberg was a partisan witness — he was in the room because Bohr had drafted him as reinforcement — and his text is a memoir written four decades after the event, so the exact wording must be treated as paraphrase rather than transcript (verify). The substance, however, is corroborated by Bohr's own correspondence and by Schrödinger's letters to Wien and Planck in late 1926. The famous outburst, attributed to Schrödinger after days of being kept up past midnight by Bohr's relentless Socratic pressure, runs in Heisenberg's German as roughly: \"Wenn es bei dieser verdammten Quantenspringerei bleiben soll, dann bedaure ich, mich überhaupt mit der Quantentheorie beschäftigt zu haben.\" — \"If we are going to have to put up with these damned quantum jumps, I regret ever having had anything to do with quantum theory.\" Pedagogy has compressed this episode into a cartoon of the stubborn classical physicist refusing the new physics. The cartoon is wrong on two counts. First, Schrödinger was not denying discreteness — his own eigenvalue equation produced the discrete spectrum E n as the boundary-value spectrum of \\hat H \\psi = E\\psi, and he was perfectly happy with the Bohr frequency condition h\\nu {mn} = E m - E n read off the spectral gaps. What he objected to was the ontological claim that between two stationary states the atom executes an instantaneous, observer-independent, physically real discontinuity. Second, Bohr was not defending a derivation; he was defending a postulate by appealing to its empirical consequences (line spectra, Einstein statistics, Compton coincidences) and to the impossibility, in his view, of giving any other consistent account of measurement. What was actually at stake The technical content of the disagreement can be stated precisely. The 1926 wave mechanics gives, for an atom coupled to a radiation reservoir, a unitary evolution of the total atom-plus-field state. If one traces over the field, one obtains a reduced density matrix \\rho(t) whose off-diagonal coherences decay and whose diagonal populations evolve smoothly under the Einstein rate equations Nothing here jumps. The discontinuity enters only when one insists that at every instant the atom occupies a single definite stationary state, so that p n(t) must be interpreted as the probability that the atom has already jumped by time t. That insistence is the Bohr-Heisenberg measurement-axiom overlay; it is not contained in either wave mechanics or in Einstein's derivation. Schrödinger's position, fully formed by 1926 and made explicit in 1952, was that the overlay is bookkeeping, not physics — that the continuous evolution is the real process and the \"jump\" is what a detector record looks like when one demands a classical narrative for each individual atom. The 1952 polemic A quarter-century later, in two papers in the British Journal for the Philosophy of Science , Schrödinger returned to the attack [3, 4]. The papers are usually summarized as \"Schrödinger denied quantum jumps\" — a summary so compressed that it reverses the actual argument. Read on their own terms, they make three distinct claims. First, the language of jumps is parasitic on a discredited picture. Schrödinger points out that \"transition from state n to state m\" presupposes that the atom occupies stationary states between transitions, which is precisely the picture wave mechanics replaced. In wave mechanics the atom occupies a superposition that evolves continuously; only the energy measurement yields one of the eigenvalues E n. Second, the Einstein A and B coefficients do not require jumps for their derivation. They require only (i) a discrete spectrum, (ii) Fermi-golden-rule transition rates, and (iii) the statistical assumption of detailed balance with the Planck distribution. None of these is a statement that an individual atom executes a discontinuous transition at a definite instant. Schrödinger's Part I is essentially an extended demonstration that the statistics of emission can be reproduced without the ontology of jumps. Third — and this is the point the pedagogy loses — Schrödinger argues that the only place a real discontinuity appears is in the projection postulate applied to a single system. Remove the projection postulate, treat \\psi as a description of an ensemble or of a system-plus-apparatus joint state, and the jumps disappear from the physics while leaving every observable prediction intact. Part II presses this point against Born's probabilistic interpretation, arguing that the apparent discontinuity is a feature of the epistemic update of the observer's information, not of the dynamical evolution of the system. Why the pedagogy flattens this, and why it matters The flattening — \"Schrödinger refused to accept jumps\" — survives because it is convenient for two pedagogical purposes: it lets textbooks present the Copenhagen interpretation as victorious without engaging its critics, and it lets the 1986 single-ion experiments [8, 9, 10] be sold as direct refutations of Schrödinger. Neither use survives scrutiny. The 1986 experiments observed millisecond-to-second dwell-time statistics of a fluorescence telegraph signal entirely consistent with Einstein A-coefficient Poisson kinetics; they did not resolve the sub-nanosecond transition itself and therefore could not adjudicate the question of what happens between clicks. The question of what happens between clicks is exactly Schrödinger's question, and it was unanswerable in 1952 because the theoretical apparatus for asking it — quantum trajectory theory [12, 13, 14], the conditional state given a detection record — did not exist. Once it did exist, in 1992–1993, the inter-click evolution acquired a precise definition: continuous non-Hermitian evolution under an effective Hamiltonian \\hat H {\\rm eff} = \\hat H - \\tfrac{i\\hbar}{2}\\sum k \\hat L k^\\dagger \\hat L k, deterministic between jumps, with the \"jump\" itself appearing only as the operational update conditioned on a click. This is Schrödinger's continuity — the thing he could not articulate in 1952 because the formal vocabulary was thirty years away. The 2019 Yale catch-and-reverse experiment then closes the loop. By monitoring an ancillary transition in a superconducting transmon and conditioning on the absence of clicks, Minev and coworkers showed that the inter-click evolution is not only continuous but predictable and reversible : a jump in progress can be detected before completion and aborted by a coherent pulse. The discreteness Bohr postulated is preserved; the instantaneous observer-independent discontinuity Schrödinger denied is, as he suspected, an artifact of the measurement story. The foundational war did not end in a victor — it ended in a partition of the territory each side had actually been defending. Making the Jump Visible: Dehmelt's Shelving and the Three 1986 Observations Making the Jump Visible: Dehmelt's Shelving and the Three 1986 Observations The amplifier problem By the mid-1970s the Bohr–Einstein jump was sixty years old as a theoretical object and still zero seconds old as a directly witnessed one. The reason was a brutal signal-to-noise asymmetry. A single atom undergoing a single dipole-allowed transition emits, at most, one photon per spontaneous-emission lifetime — typically 10^{-8}\\,s for an optical line — into 4\\pi steradians, of which a realistic detector subtends perhaps 10^{-2}, with quantum efficiency of order 10^{-1}. A single jump on a weak intercombination line, with branching ratio \\sim 10^{-7} relative to the strong line, is detectionally invisible: it produces, on average, a fraction of a photon before being lost in dark counts. Dehmelt's idea, sketched in a one-paragraph abstract for the 1975 Washington APS meeting and developed throughout the late 1970s in his ion-trap programme, was to convert the weak jump into a macroscopic on/off signal by coupling it to a strong cycling transition driven to saturation. The strong transition acts as an optical amplifier with a gain of order 10^{8}: each second of \"bright\" time delivers \\sim 10^{7}–10^{8} detected photons, and each \"dark\" interval corresponds, unambiguously, to the electron being shelved on the metastable level. The transition that one wants to see — the rare jump onto and off the shelf — is inferred not from its own photons but from the disappearance and reappearance of the cycling fluorescence. This is the electron-shelving scheme, and it is the only reason the quantum jump ever became visible to a photomultiplier. Figure: Dehmelt's three-level shelving scheme illustrated for Ba⁺. The bright/dark telegraph is generated by the strong cycling transition g\\rangle \\leftrightarrow e\\rangle; the rare jumps onto and off the metastable shelf s\\rangle are the events being witnessed. What the shelving signal actually is Let \\Gamma {eg} be the strong line's spontaneous-emission rate, R {gs} the rate of jumping onto the shelf (set by a weak probe or by an off-resonant excitation), and \\gamma s = 1/\\tau s the shelf's spontaneous decay rate back to g\\rangle. Under saturation of the strong line the bright steady-state photon flux is \\Phi b \\sim \\tfrac{1}{2}\\Gamma {eg}\\eta, with \\eta the overall detection efficiency. The dwell times in bright and dark intervals are independent exponentials, so the signal is a random telegraph whose statistics are Einstein-A kinetics applied to a single atom. The macroscopic Poisson process of fluorescence drops is the amplifier output; the microscopic event being amplified is the Bohr jump itself. This is the precise sense in which the experiments below \"observed\" the jump — they resolved the Poissonian statistics of the inter-jump waiting times, not the sub-nanosecond electronic transition. A modern bound on the latter, from continuous-wave heralding on a single atom, is given in . The three 1986 PRLs Within five months, three groups published independent realizations of Dehmelt's 1975 proposal in Physical Review Letters . Seattle (Nagourney, Sandberg, Dehmelt). Published July 1986 . A single ^{138}\\text{Ba}^+ ion in a Paul trap, the cycling transition 6S {1/2}\\leftrightarrow 6P {1/2} at 493 nm driven near saturation with a repumper out of 5D {3/2}, and a weak excitation onto the metastable shelf 5D {5/2} (\\tau \\approx 30\\,s). The recorded fluorescence trace shows abrupt step-function transitions between a bright level of \\sim 10^4 counts per second and a dark level of pure background, with bright/dark durations of order seconds. Histograms of the dwell times fit single exponentials. This is the paper Dehmelt cites in his 1989 Nobel Lecture as the realization of the \"mono-ion oscillator\" he had been advocating since 1975. Hamburg (Sauter, Neuhauser, Blatt, Toschek). Published October 1986 . Same ion, \\text{Ba}^+, in a Paul trap built in Toschek's lab, but with arguably the cleanest implementation of the three-level scheme: the shelf is reached by an off-resonant excitation, and the telegraph is recorded simultaneously for a single ion and (in a separate trace) for two ions, where the signal exhibits three fluorescence levels (both bright, one dark, both dark) whose dwell-time statistics confirm independent jump processes. The two-ion data is, in retrospect, the more incisive demonstration: it rules out classical telegraph noise from the laser or the detector and establishes that each ion is jumping on its own clock. Toschek's group's contribution is the one most systematically displaced in popular accounts, partly because they were second by months in PRL and partly because Dehmelt's Nobel concentrated attention on the Seattle work. NIST Boulder (Bergquist, Hulet, Itano, Wineland). Published October 1986 . A different ion, ^{198}\\text{Hg}^+, in a different trap, on a different (UV) transition: cycling on 5d^{10}6s\\,{}^2S {1/2}\\leftrightarrow 5d^{10}6p\\,{}^2P {1/2} at 194 nm with shelving on the metastable 5d^96s^2\\,{}^2D {5/2} level (\\tau \\approx 0.1\\,s). The shorter shelf lifetime gives faster telegraph statistics; the UV cycling transition gives a different photon-counting regime. The independence of system, wavelength, and laboratory is the substantive content of this paper: it certifies that the shelving telegraph is not an artifact of the particular Ba⁺ level structure. Wineland's 2012 Nobel was awarded for ion-trap quantum logic, not for this observation, which leaves the 1986 contribution disproportionately under-credited in the trade-book literature. The three papers are properly read together. None of them is \"the\" 1986 observation; together they constitute it, and the simultaneous independent realization across two continents, two ion species, and two trap traditions is itself the empirical content. Wineland's note explicitly acknowledges receipt of the Seattle preprint; the Hamburg group's acknowledges Dehmelt's original proposal. The priority structure is one of mutual recognition, not of contest. What was — and was not — resolved It is worth saying plainly. What 1986 resolved was the statistical witness of single discontinuous transitions on a single quantum object: the bright/dark dwell-time histograms are exponentials with rates predicted by Einstein's 1917 A-coefficient applied to one atom, not to an ensemble. This was, philosophically, the death of the last refuge of the ensemble-only reading of A {mn}: the Poisson statistics live on the single ion. It was also the realization of Schrödinger's 1952 rhetorical demand to \"see one\" — though, as he had warned , \"seeing one\" is not the same as seeing the transition. The shelving telegraph has a temporal resolution set by the count rate of the bright signal, \\Delta t \\sim 1/\\Phi b \\sim 10^{-4}\\,s, and a fundamental resolution set by the shelf entry/exit times, neither of which approaches the actual transition timescale. The strong-line transition itself completes in \\sim 1/\\Gamma {eg}\\sim 10^{-8}\\,s; the weak-line shelving transition is similarly fast on the optical Bloch timescale. None of that is resolved in 1986. The temporal interior of the jump remained closed to direct observation, and would remain so until reopened it three decades later under conditions of weak continuous measurement on a manifestly continuous (transmon) artificial atom. The three PRLs do, however, irreversibly close the question of whether discrete jumps occur on a single quantum system. After 1986 the Bohr postulate is no longer a theoretical posit and no longer an ensemble convenience. It is a single-system observable. The remaining question — what happens inside it — required the trajectory formalism that Dalibard–Castin–Mølmer, Dum–Zoller–Ritsch, and Carmichael were independently inventing in those same years [12, 13, 14], and which we turn to next. From Postulate to Algorithm: Monte Carlo Wavefunctions and Quantum Trajectories From Postulate to Algorithm: Monte Carlo Wavefunctions and Quantum Trajectories The problem the 1986 experiments left open By 1987 the experimentalists had outpaced the theorists. The Seattle, Hamburg, and NIST telegraph signals [8, 9, 10] were obviously Markovian Poisson processes on the macroscopic dwell-time scale, and a Bloch-equation / master-equation calculation reproduced the ensemble averaged fluorescence intensity perfectly well. What the master equation manifestly did not do was produce a single telegraph trace. The Lindblad evolution is a deterministic equation for the unconditioned density operator. The dark and bright intervals seen in a single ion are a stochastic record, and there was no canonical way — circa 1990 — to extract one such record from \\rho(t) without resorting to ad hoc \"quantum-jump\" Monte Carlo recipes that had been floating around the quantum-optics community since the late 1970s (Cook's photon-counting work, Zoller's atomic decay simulations, Carmichael's lectures at Oregon and Texas). Three groups, working effectively in parallel between roughly 1989 and 1992, gave that ad hoc recipe a principled foundation. The constructions are technically equivalent at the level of ensemble averages and, with hindsight, structurally identical; the physical motivations and the regional citation patterns were not. The MCWF algorithm Fix a Lindblad master equation with jump operators \\{L k\\}. Define the non-Hermitian effective Hamiltonian A single Monte Carlo wavefunction trajectory \\psi(t)\\rangle is generated by the following two-step procedure on each infinitesimal interval [t,t+\\delta t]: 1. Deterministic step. Propagate \\tilde\\psi(t+\\delta t)\\rangle = (1 - iH {\\mathrm{eff}}\\delta t/\\hbar) \\psi(t)\\rangle. The norm decreases by \\delta p = \\delta t \\sum k \\langle\\psi L k^\\dagger L k \\psi\\rangle \\equiv \\sum k \\delta p k. 2. Stochastic step. Draw a uniform r\\in[0,1). If r \\delta p, no jump : renormalize, \\psi(t+\\delta t)\\rangle = \\tilde\\psi(t+\\delta t)\\rangle/\\sqrt{1-\\delta p}. If r \\le \\delta p, a jump of channel k occurs with conditional probability \\delta p k/\\delta p, and The ensemble average over many realizations reproduces the Lindblad evolution: with the variance scaling as 1/\\sqrt{N} in N trajectories. The proof is a one-line second-order expansion that exactly cancels the anti-commutator term of the Lindbladian against the renormalization of the no-jump branch — that cancellation is the algebraic miracle that makes the unraveling work, and it is independent of \\delta t up to O(\\delta t^2). Two features deserve emphasis. First, the continuous between-jump evolution is genuinely non-Hermitian; the state is being sharpened by the absence of a click, in exact analogy to a Bayesian update on a null measurement outcome. Second, the discontinuous jump \\psi\\rangle \\mapsto L k \\psi\\rangle/\\lVert\\cdot\\rVert is the operational object that the algorithm calls a \"quantum jump\". It is not Bohr's spectroscopic transition and it is not Copenhagen's collapse — it is a conditional state update tied to a specific factorization of the dissipator and a specific (here, direct-photodetection) measurement record. Triple parentage and the regional citation split The Dalibard–Castin–Mølmer PRL presented the algorithm above almost verbatim, motivated computationally: the master equation for a multi-level atom in an optical lattice is a d^2 \\times d^2 object, while a wavefunction is d-dimensional, and Monte Carlo averaging buys a quadratic memory reduction at the price of statistical noise. The same issue of Physical Review A carried the Dum–Zoller–Ritsch construction , with an essentially identical algorithm derived from a different starting point — discretizing the Born-series expansion of the reduced atom dynamics over the electromagnetic vacuum. The Mølmer–Castin–Dalibard JOSA B of the following year is the most complete pedagogical statement and is the one almost universally cited in the European literature. Carmichael's Open Systems Approach to Quantum Optics , built from Oregon and Texas lectures delivered between 1989 and 1991, gave the third independent derivation, and the one of deepest physical content. Where DCM and DZR begin from the master equation and ask how to simulate it, Carmichael begins from the photon-counting measurement record. Applying Srinivas–Davies / Davies counting theory to a cascaded source–detector system, he derives a stochastic Schrödinger equation in which the jump \\psi\\rangle \\mapsto L k \\psi\\rangle/\\lVert\\cdot\\rVert is literally the state update consequent on registering a click at channel k . The unraveling is thereby promoted from a numerical trick to a physically interpretable object: the trajectory is the experimenter's best estimate of the system state given a specific detection record. The Plenio–Knight review is the document that unified the two pictures under the single rubric \"quantum-jump approach\", explicitly acknowledged Carmichael's independent derivation, and fixed the modern terminology. Citation patterns bifurcated regionally and have largely stayed that way. European papers — particularly those tracing intellectual descent from the Paris and Aarhus schools — cite [12, 20] for the method. North American papers, and especially those rooted in cavity QED at Caltech, Texas, and Auckland, cite . Plenio and Knight noted this split in 1998 ; thirty years on, an arXiv keyword search would still reveal it. The decisive conceptual point: unraveling-dependence The same Lindblad equation admits infinitely many stochastic unravelings, all reproducing the same \\rho(t) on average. Replace direct photodetection by balanced homodyne detection of the output field, and the discontinuous jump \\psi\\rangle \\mapsto L k \\psi\\rangle/\\lVert\\cdot\\rVert is replaced by a continuous quantum state diffusion with dW k real Wiener increments. The state never jumps; it executes a continuous trajectory whose ensemble average is, again, the Lindblad \\rho(t). Different unravelings correspond to different physical apparatuses placed on the same dissipative channel; the choice of unraveling is the choice of measurement basis on the environment. The methodological consequence is a discipline that the modern literature still routinely fails to enforce. The MCWF \"quantum jump\" is not a feature of the open quantum system as such — it is a feature of the joint description (system + chosen environmental measurement). Two experiments differing only in whether they photodetect or homodyne the emitted light will record, respectively, jumps and diffusion for the very same atomic dynamics. To assert that the system \"really\" jumps is therefore a category mistake of the same flavour as the BKS-vs-Bohr–Geiger confusion of 1924–1925, displaced from photons to detector design. This is also the precise sense in which the 1992–1993 formalism prepared the ground for Minev 2019 [21, 7]. If the inter-click no-jump branch is a continuous, deterministic, non-Hermitian evolution that sharpens the state under negative measurement results, then conditioning on a long enough no-jump segment must, in principle, predict the next jump and allow it to be aborted mid-flight. The §7 catch-and-reverse experiment is the operational vindication of a feature that was already algebraically present in the DCM / DZR / Carmichael construction — for twenty-seven years before anyone built the apparatus to see it. What the algorithm did to the word \"jump\" By 1998 the word \"quantum jump\" carried four distinct technical meanings depending on which community spoke it: Bohr's spectroscopic transition, the Copenhagen measurement postulate, the macroscopic fluorescence-telegraph event of the 1986 ion experiments, and the conditional state update of an MCWF trajectory under photodetection unraveling. These are not synonymous; the trajectory unraveling is the most operationally precise of the four and the only one with an algorithm attached. §6 disentangles the four; the rest of the dossier uses jump in the trajectory-theoretic sense unless flagged otherwise. What the Literature Confuses: Four Distinct Things Called 'Quantum Jump' What the Literature Confuses: Four Distinct Things Called 'Quantum Jump' The phrase quantum jump (and its German ancestor Quantensprung ) carries at least four technically distinct meanings that the literature — including refereed literature — routinely runs together. The conflations are not pedantic: they propagate into wrong claims about Markovianity, instantaneity, observer-independence, and even the direction of magnitude (the colloquial inversion). What follows is a taxonomy, with the regime of validity for each, and an audit of which equations survive which translation. (i) The Bohr jump: a spectral statement Bohr's 1913 postulate is a statement about the spectrum of a bound system, not about its dynamics. The content is: with \\{E n\\} discrete and the transition allowed only between members of this discrete set. Nothing in this statement requires a time, a duration, or a stochastic law. It survives unchanged in modern QED: it is the energy-conservation constraint on the matrix element \\langle m \\mid H {\\mathrm{int}} \\mid n\\rangle that appears in Fermi's golden rule. The \"jump\" here is a kinematic discreteness, not a temporal event. This meaning is unraveling-independent, measurement-independent, and basis-fixed (by H 0). It is also Markovianity-independent: non-Markovian dynamics do not soften the discreteness of the bound-state spectrum. (ii) The Copenhagen collapse: a postulate about the unconditioned state The second meaning is the von Neumann/Lüders projection acting on the unconditioned density matrix after a measurement outcome k: This is the \"jump\" Schrödinger objected to in Copenhagen in 1926 and again in [3, 4]: a discontinuous, instantaneous, observer-triggered change of the state vector. Its theoretical status is postulational — it sits outside the unitary part of the theory and is the operational target of every interpretation-of-QM dispute. It is generically not the same as (i): a collapse can be onto a degenerate subspace or onto a continuous-spectrum POVM element with no Bohr-discrete content, and a Bohr transition leaves no fingerprint on the unconditioned \\rho if the environment is unread. Conflation watch: the standard pedagogical sentence \"the atom jumps from \\mid m\\rangle to \\mid n\\rangle and emits a photon\" elides (i) and (ii) by identifying the discrete spectral label with the post-measurement projector. The identification is correct only in the idealized limit where the photon detector is perfect, prompt, and frequency-resolving — which is exactly what the 1986 shelving experiments engineered, not what the postulate guarantees. (iii) The trajectory jump: a conditional state update inside an unraveling The third meaning is the one used in the Monte Carlo wavefunction / quantum-trajectory literature [12, 13, 14, 20, 11]. Given a Lindblad master equation an unraveling is a stochastic process on pure states whose ensemble average reproduces \\rho(t). In the photon-counting unraveling, between detector clicks the state evolves under the non-Hermitian effective Hamiltonian and at a click of channel k the state is updated discontinuously: This is the trajectory jump . Three features distinguish it from (ii): 1. It is conditional on a specific measurement record. The unconditioned \\rho — obtained by averaging over all records — evolves smoothly. 2. It is unraveling-dependent . Replace the photon counter with a homodyne detector and the same master equation unravels into a continuous diffusive stochastic Schrödinger equation with no jumps at all. The Lindblad generator is invariant under the unitary mixing L k \\mapsto \\sum j U {kj} L j that converts jump records into diffusive records. 3. It is operational . The post-click state is whatever Bayes' rule prescribes given the click; there is no extra metaphysical commitment. Carmichael's photon-counting derivation is the version that makes (iii) physically rather than algorithmically motivated — a point under-credited in the European citation tradition. Conflation watch: a trajectory jump is not a Copenhagen collapse. It collapses the conditional state, not the unconditioned one, and only relative to a chosen measurement scheme. Statements of the form \"decoherence proves wavefunctions really collapse via Lindblad jumps\" confuse (ii) and (iii). (iv) The colloquial \"quantum leap\" The fourth meaning is not a physical concept at all. In English popular usage quantum leap denotes a large, transformative advance. Physically, the elementary jump is the smallest possible change a quantized system can undergo — one quantum. The popular meaning is the technical meaning inverted in magnitude. Quantensprung in German has drifted the same way. No equation, but worth flagging in any pedagogical context because the inversion seeds wrong intuition before the student opens the textbook. Markovianity and instantaneity: where the standard slogans fail Two slogans circulate that are correct only inside (iii) in the Born–Markov regime, and are routinely over-quoted: - \"Quantum jumps are instantaneous.\" True of the trajectory update rule \\mid\\psi\\rangle \\to L k\\mid\\psi\\rangle/\\ \\cdot\\ as a mathematical object, because the update is a single application of an operator at a single time. False as a statement about nature: the inter-click evolution under H {\\mathrm{eff}} has finite, predictable, continuous structure, and the catch-and-reverse experiment [21, 7] resolves precisely that structure. What is \"instantaneous\" is the bookkeeping convention chosen by the unraveler, not a physical duration. An experimental upper bound on any genuine duration is given in . - \"Quantum jumps are Markovian.\" True only when L k are time-independent Lindblad operators and the environment correlation time is negligible. The non-Markovian quantum jump formalism of Piilo, Maniscalco, Härkönen and Suominen constructs jumps with memory-kernel-dependent rates that can be negative-probability in intermediate steps and can be reversed — the trajectory genuinely runs backward on the relevant time scales. The reversibility is structurally compatible with and incompatible with the popular \"jumps = irreversible collapse\" reading. Both slogans live or die with the unraveling, not with the physics. Which formulas survive which translation Formula Meaning it lives in Survives outside? --- --- --- h\\nu {mn} = E m - E n (i) spectral yes; survives non-Markovian, multi-photon, dressed-state regimes — it is a constraint on matrix elements Einstein A {mn}, B {mn} rates (i) + Poisson statistics survives in the weak-coupling, broadband-bath limit; fails in structured reservoirs and cavity QED strong-coupling \\rho \\to P k\\rho P k/\\mathrm{Tr}(\\cdot) (ii) Copenhagen survives as a POVM update; the projective form fails for inefficient or noisy detectors \\mid\\psi\\rangle \\to L k\\mid\\psi\\rangle/\\ \\cdot\\ (iii) jump unraveling does not survive an unraveling change; replaced by a stochastic Schrödinger equation under homodyne H {\\mathrm{eff}} = H - \\tfrac{i\\hbar}{2}\\sum L k^\\dagger L k (iii) Markov replaced by a memory-kernel non-Hermitian generator in ; the simple form fails for non-Markovian baths \"Quantum leap = big advance\" (iv) colloquial survives nowhere in physics The taxonomy is the point: when a paper says quantum jump , the first job of a careful reader is to ask which of (i)–(iv) , and the second is to ask what is the unraveling . Most disputes in the foundational literature — including the one Schrödinger lost rhetorically in 1926 and won structurally in 2019 — dissolve once those two questions are answered. The Jump Caught Mid-Flight: Minev 2019 and the Vindication of Schrödinger The Jump Caught Mid-Flight: Minev 2019 and the Vindication of Schrödinger In June 2019 a Yale–Devoret team published a measurement whose title read like a historical taunt: To catch and reverse a quantum jump mid-flight . The headline result is that the jump from a bright cycling manifold to a long-lived dark state — the discontinuity Bohr had postulated and the artefact Schrödinger had insisted was bookkeeping [3, 4] — can be monitored as a smooth, predictable, deterministic excursion through Hilbert space, and stopped before it completes. The physical substrate is a superconducting transmon, not a trapped ion, but the underlying object is the photon-counting unraveling of a three-level Lindblad system, exactly what [12, 13, 14] were written to compute. The effective atom and the record The transmon is operated as a synthetic three-level system with states G\\rangle, B\\rangle, D\\rangle. B\\rangle plays the role of Dehmelt's strong cycling level with radiative rate \\gamma B, while D\\rangle is the shelved metastable state with \\gamma D\\ll\\gamma B. Two coherent drives, realize the bright cycling transition and the weak G\\!\\leftrightarrow\\!D coupling. The experiment does not detect fluorescence directly. Instead the transmon is dispersively coupled to a readout cavity tuned so that only B\\rangle shifts the cavity frequency appreciably; a continuously injected probe is monitored by a near-quantum-limited parametric amplifier in heterodyne. A \"click\" is a binarized excursion of the integrated heterodyne record into the B bin. In the operator language of , the unraveling is generated by and the cavity acts as the photon counter for L B. Figure: Left — the transmon as a three-level effective atom. A strong drive \\Omega {BG} cycles G\\!\\leftrightarrow\\!B with rapid spontaneous emission \\gamma B, while a weak \\Omega {DG} couples G to the long-lived dark D. Right — the dispersive heterodyne record produces a stream of bright clicks; a silent window \\Delta\\tau {\\rm catch} raises the conditional probability of D\\rangle, triggering a tailored unitary U {\\rm rev} that returns the trajectory to G before the jump completes, after which clicks resume. What the no-click record encodes Between clicks the conditional state \\psi c(t)\\rangle evolves under the non-Hermitian effective Hamiltonian renormalized at every instant. This is the precise content of the Dalibard–Castin–Mølmer and Dum–Zoller–Ritsch unravelings [12, 13, 20]: the no-jump propagator is a deterministic Hilbert-space rotation, not passive waiting. In the textbook Bohr picture nothing is happening during a dark interval. In the trajectory picture, the absence of clicks is information, and Bayes' rule converts that information into a continuous sweep of conditional amplitude from G\\rangle toward D\\rangle. The longer the silence, the further the conditional state has rotated. This is the structural point Schrödinger pressed in [3, 4]: the wavefunction is continuous; what is discontinuous is the bookkeeping the observer imposes when they declare that \"a jump happened\". Minev et al. write this point into hardware. Their conditional tomography reconstructs the latitude of \\psi c\\rangle on the G–D meridian as a smooth, monotonic, and — averaged over silent windows of equal duration — deterministic function of \\Delta\\tau. The trajectory is reproducible from shot to shot; the click time is not. Catch and reverse The catch protocol is a real-time decision rule. One fixes a click-free threshold \\Delta\\tau {\\rm catch} short enough that an ordinary inter-click pause is unlikely to exceed it (\\Delta\\tau {\\rm catch}\\gg\\gamma B^{-1}), but long enough that the effective G\\!\\to\\!D pumping has had time to rotate \\psi c\\rangle a known finite angle on the meridian. When the record has been silent for \\Delta\\tau {\\rm catch}, the conditional state lies at a computed point of the G–D great circle, and the experimenter applies a tailored unitary U {\\rm rev} — a partial rotation about the axis fixed by that geometry — that returns it to G\\rangle. A subsequent reappearance of bright fluorescence within a calibration window confirms that the impending dark transition has been aborted. The reported reversal fidelity in is large enough that the catch ensemble is statistically distinguishable from any model in which the inter-click trajectory is unphysical bookkeeping; in the favorable post-selected branch it exceeds 99\\%. Two things must be said about what this does not do. It does not violate Born statistics: averaged over the silent-window ensemble, the dark and reversed-outcome probabilities reproduce the standard Lindblad master-equation prediction, exactly as required by the Plenio–Knight equivalence theorem . And it does not abolish discreteness: the asymptotic projectors P B and P D are precisely the spectral objects Bohr's 1913 postulate selected, and the radiative click of L B remains an instantaneous Poissonian event whose statistics obey Einstein's A-coefficient law . What is overturned is the textbook claim that the macroscopic transition between the two manifolds is itself instantaneous and irreducible. Whose picture wins The catch-and-reverse experiment is best read as the joint empirical embodiment of three theoretical claims that the literature had presented in isolation. First, the Plenio–Knight unification — the conditional non-Hermitian evolution between clicks is physical, not fictional. Second, Carmichael's photon-counting interpretation — the jump lives in the record ; the trajectory lives in Hilbert space. Third, Schrödinger's 1952 contention [3, 4] that the underlying dynamics is continuous and the discontinuity is an artefact of the projection step. The 1986 telegraph signals [8, 9, 10] were consistent with all three but discriminated between none, because their bandwidth integrated over the inter-click dynamics. Minev resolves the inter-click dynamics, and the resolution is smooth. A final clarification, since the result is repeatedly miscast in popular and secondary accounts. The \"jump\" that is reversed is not the elementary radiative emission — that remains an instantaneous click of L B. The \"jump\" is the macroscopic discrete change of which manifold the system is found in: bright versus dark. Bohr's 1913 postulate , Einstein's 1917 statistics , the 1986 telegraph signal [8, 9, 10], the MCWF stochastic update [12, 13, 20], and Minev's catch-and-reverse refer to four different temporal scales of the same word. Once those scales are separated, Bohr's discreteness and Schrödinger's continuity address disjoint parts of the picture and do not collide. It took a century, and a transmon coupled to a quantum-limited amplifier, to make the disjointness experimentally visible. Frontier: Non-Markovian Jumps, Continuous Measurement, and What Remains Genuinely Open Frontier: Non-Markovian Jumps, Continuous Measurement, and What Remains Genuinely Open Three threads currently animate the quantum-jump literature, none of them closed. They concern (i) the structure of jumps when the bath has memory, (ii) the physical, not merely computational, status of the choice between jump and diffusive unravelings, and (iii) the thermodynamic bookkeeping that the trajectory picture has made possible. Around all three sits an older question that 1992–1998 did not answer and 2019 only sharpened: does any unraveling deserve ontological weight, or are trajectories strictly an observer-conditioned bookkeeping device over the smoothly evolving density matrix? Memory, negativity, and reversed jumps The Markovian Lindblad master equation guarantees a completely positive evolution with rate functions that are everywhere non-negative; the standard MCWF algorithm of [12, 13, 20] exploits this to read each Lindblad operator as a Poissonian click. Once the Born–Markov assumption is relaxed, the time-local generator carries decay rates that can transiently turn negative — the canonical signature of a non-Markovian environment. The non-Markovian quantum jump (NMQJ) construction of Piilo, Maniscalco, Härkönen and Suominen addresses this directly by promoting negative rates to a second class of jump events that reverse a previously executed click and restore the ensemble member to its pre-jump state, with a probability fixed by the requirement that the unconditioned average reproduces the time-local master equation. The construction is unbiased, sample-efficient, and crucially it makes the jump no longer the smallest irreversible event in the theory: information leaked into the bath can flow back. A recent driven-dissipative extension, Non-Markovian Quantum Jump Method for Driven-Dissipative Two-Level Systems, generalizes the prescription to non-perturbative drive regimes where the eigen-operators of the dissipator themselves carry memory. What NMQJ does not settle is whether a reversed jump is a faithful record of a physical detection event. In a standard photon-counting unraveling each click corresponds to a click at a real photodiode; in the non-Markovian setting \"reversal\" corresponds to a re-absorption of structured-bath excitations whose detection requires monitoring the bath in a regime where photodetection language no longer applies cleanly. The mathematical object is well defined; the experiment that turns it into an operational protocol is still missing. Jump versus diffusion are not the same physics A common but wrong reading of the 1992 unravelings [12, 13] is that they are gauges over the same Lindblad equation. They are not. Two unravelings agree only at the level of the unconditioned \\rho(t); the conditional trajectories, and therefore the measurement records that generate them, are physically distinct. For a single decay channel with collapse operator c and Hamiltonian H, the homodyne stochastic master equation with local-oscillator phase \\phi reads while the photon-counting jump equation reads Both ensemble-average to \\dot\\rho = -i[H,\\rho]+\\mathcal{D}[c]\\rho. They differ in the back-action: a click projects the conditional state non-linearly and discontinuously onto c\\rho c c^\\dagger / \\mathrm{Tr}(\\cdot), while homodyne back-action diffuses it on the Bloch sphere. A 2014 New J. Phys. result, Quantum jumps are more quantum than quantum diffusion , proved that there exist conditional pure-state ensembles preparable only through the jump unraveling: no detector configuration of finite efficiency reproduces them diffusively. The two unravelings are therefore not interchangeable representations but correspond to physically distinct measurement back-actions, and only one of them is instantiated in any given experiment. This is the operational content of the 2012 Wiseman–Gambetta question Are dynamical quantum jumps detector-dependent? : the answer is yes, and that fact is not interpretive softness — it is structural. Trajectory thermodynamics and the stochastic entropy of a click Once a trajectory is a well-defined object, it can carry energetic accounting. Horowitz (Phys. Rev. E 85, 031110, 2012) and the subsequent Horowitz–Parrondo–Manzano line define heat exchanged with the bath as the sum over clicks of the energy quanta carried away, and stochastic entropy production along a quantum-jump trajectory \\gamma as the log-ratio of forward to time-reversed path weights. A trajectory fluctuation theorem \\langle e^{-\\Sigma}\\rangle = 1 then follows, generalizing Crooks/Jarzynski into the open-quantum regime; conditional fluctuation theorems under imperfect detection have since been written down (arXiv:2308.08491). Two features distinguish this from the classical case. (i) Heat is operationally defined only relative to a chosen unraveling — a homodyne observer records a continuously fluctuating heat current with no isolated quanta; a photon-counting observer records the same total \\langle Q\\rangle as a sum of discrete jumps. (ii) Conditioning on a no-click segment, which evolves the state by the non-Hermitian effective Hamiltonian H {\\mathrm{eff}} = H - \\tfrac{i}{2}c^\\dagger c, nevertheless updates entropy because it updates the observer's information. The Maxwell-demon limit of this is being probed in superconducting and trapped-ion platforms but remains bounded by detection efficiency rather than by principle. Does any unraveling correspond to \"what happens\"? The 2019 Yale catch-and-reverse experiment removed one classical worry — that between detection events nothing definite is happening — by exhibiting the inter-click trajectory as continuous, predictable from the no-click record, and reversible by a unitary pulse. This vindicates Schrödinger's 1952 position structurally without endorsing his hostility to discrete spectra. But it does not select a preferred unraveling: the Yale data are consistent with the conditional state under the photon-counting unraveling appropriate to their detector, and a homodyne setup on t ak narrow transition turns strong cycling fluorescence on and off, amplifying a single quantum jump into a macroscopically visible telegraph signal.", "who": "Hans G. Dehmelt", "work": "Bull. Am. Phys. Soc. 20, 60 (abstract)", "kind": "theory", "ref": 17}, {"year": 1986, "event": "First direct observation: random extinction of 493 nm fluorescence on a single trapped Ba+ ion when the electron is shelved in 5D_{5/2} — the Bohr jump made visible in real time.", "who": "Warren Nagourney, Jon Sandberg, Hans Dehmelt", "work": "Shelved Optical Electron Amplifier: Observation of Quantum Jumps, PRL 56, 2797", "kind": "observation", "ref": 8}, {"year": 1986, "event": "Independent simultaneous observation on Ba+ at Hamburg, three months later in PRL.", "who": "Th. Sauter, W. Neuhauser, R. Blatt, P. E. Toschek", "work": "Observation of Quantum Jumps, PRL 57, 1696", "kind": "observation", "ref": 9}, {"year": 1986, "event": "Independent simultaneous observation on a single Hg+ at NIST Boulder — three groups converge within months.", "who": "J. C. Bergquist, R. G. Hulet, W. M. Itano, D. J. Wineland", "work": "Observation of Quantum Jumps in a Single Atom, PRL 57, 1699", "kind": "observation", "ref": 10}, {"year": 1992, "event": "Monte Carlo wave-function method: master-equation dynamics unraveled as continuous non-Hermitian evolution punctuated by stochastic Lindblad-operator jumps conditioned on detected clicks; jumps become a computable, operational object.", "who": "Jean Dalibard, Yvan Castin, Klaus Mølmer", "work": "Wave-function approach to dissipative processes in quantum optics, PRL 68, 580", "kind": "formalization", "ref": 12}, {"year": 1992, "event": "Independent contemporaneous formulation of the stochastic trajectory unraveling tied to atomic spontaneous emission.", "who": "R. Dum, P. Zoller, H. Ritsch", "work": "Monte Carlo simulation of the atomic master equation for spontaneous emission, PRA 45, 4879", "kind": "formalization", "ref": 13}, {"year": 1993, "event": "Quantum trajectory theory derived from photon counting / homodyne records, giving the jump operational identity as the post-click state-update.", "who": "Howard J. Carmichael", "work": "An Open Systems Approach to Quantum Optics, Springer Lect. Notes Phys. m18", "kind": "formalization", "ref": 14}, {"year": 1998, "event": "Canonical review unifying European and US trajectory pictures under the 'quantum-jump approach' name; cements modern usage.", "who": "Martin B. Plenio, Peter L. Knight", "work": "The quantum-jump approach to dissipative dynamics in quantum optics, RMP 70, 101", "kind": "formalization", "ref": 11}, {"year": 2007, "event": "Non-Markovian generalization: jump operators become memory-kernel-dependent, allowing reversible jumps and avoiding the Markovian discontinuity assumption.", "who": "J. Piilo, S. Maniscalco, K. Härkönen, K.-A. Suominen", "work": "Non-Markovian quantum jumps, PRL 100, 180402", "kind": "theory", "ref": 15}, {"year": 2019, "event": "Catch-and-reverse experiment on superconducting transmon: between clicks the jump is shown to be continuous, deterministic, and reversible — vindicating Schrödinger's 1952 intuition without contradicting Bohr's discreteness.", "who": "Z. K. Minev, S. O. Mundhada, S. Shankar, P. Reinhold, R. Gutiérrez-Jáuregui, R. J. Schoelkopf, M. Mirrahimi, H. J. Carmichael, M. H. Devoret", "work": "To catch and reverse a quantum jump mid-flight, Nature 570, 200", "kind": "observation", "ref": 7}], "neglected": [{"name": "John C. Slater", "role": "Originated the virtual-radiation-field idea that became BKS; in his original conception energy and momentum were strictly conserved event-by-event and the virtual field merely guided real photons — Bohr and Kramers stripped the photons and the conservation law before publication. He never fully recovered scientific seniority in the dispute.", "evidence": "Slater's 1924 letters and his later autobiographical accounts (Solid-State and Molecular Theory: A Scientific Biography, 1975); also recounted in Mehra–Rechenberg vol. 1.", "ref": 5}, {"name": "Walther Bothe \u0026 Hans Geiger", "role": "Their 1925 coincidence experiment was the empirical death-blow to BKS and the de facto experimental confirmation that quantum jumps are real, discrete, energy-conserving events. Compton–Simon followed independently. Textbooks usually attribute the 'end of BKS' abstractly to 'experiment', dropping the names.", "evidence": "Bothe \u0026 Geiger, Z. Phys. 32, 639 (1925); Bothe's 1954 Nobel lecture explicitly cites this work as the origin of coincidence method.", "ref": 6}, {"name": "Peter E. Toschek group (Sauter, Neuhauser, Blatt)", "role": "Independent 1986 observation of quantum jumps on Ba+ at Hamburg, with arguably the cleanest three-level shelving scheme. Routinely omitted in popular accounts that credit Dehmelt alone because of the 1989 Nobel.", "evidence": "PRL 57, 1696 (1986); Toschek's obituaries and Blatt's memorial articles document the priority claim.", "ref": 9}, {"name": "NIST / Wineland group (Bergquist, Hulet, Itano)", "role": "Third independent 1986 observation on Hg+, technically distinct (UV transition, different trap geometry). Wineland's 2012 Nobel was for ion-trap quantum logic, not for the jump observation, so this contribution is often historically displaced.", "evidence": "PRL 57, 1699 (1986); Wineland Nobel lecture (2012) acknowledges the 1986 work as background.", "ref": 10}, {"name": "Howard J. Carmichael", "role": "Independently developed the quantum trajectory formalism as the photon-counting unraveling of master equations and supplied the physical (not merely computational) interpretation of the jump. European literature standardly cites Dalibard–Castin–Mølmer; US literature cites Carmichael — credit is regionally bifurcated.", "evidence": "Carmichael, An Open Systems Approach to Quantum Optics, Springer Lect. Notes Phys. m18 (1993); explicit independent-discovery statements in Plenio–Knight RMP 70, 101 (1998).", "ref": 14}, {"name": "Erwin Schrödinger (as critic, not founder)", "role": "His 1952 BJPS papers are usually reduced in pedagogy to a stubborn refusal to accept QM. Their actual content — that the *continuous Schrödinger evolution* between detection events is the physical content and 'jumps' belong to the measurement bookkeeping — is precisely the view vindicated by quantum trajectory theory and by Minev 2019. He was right earlier than he is credited for.", "evidence": "Schrödinger, BJPS 3, 109 \u0026 233 (1952); reassessment in Minev et al., Nature 570, 200 (2019), which explicitly invokes Schrödinger.", "ref": 4}], "conflations": [{"claim": "'Quantum jump' is used interchangeably for (a) a Bohr discrete energy-level transition, (b) a measurement-induced wavefunction collapse, and (c) a stochastic state update in a Monte Carlo unraveling.", "clarification": "These are distinct. (a) is a statement about the discreteness of the spectrum and the selection rule structure; it is unraveling-independent. (b) is a postulate of the Copenhagen measurement axiom acting on the unconditioned state. (c) is a *conditional* state update tied to a specific detection record in a specific unraveling — different unravelings (jump vs. homodyne / diffusive) give different 'jumps' for the same Lindblad master equation. The unconditioned density matrix evolves smoothly in all cases."}, {"claim": "Schrödinger 1952 'denied quantum jumps'.", "clarification": "He denied the *instantaneous, physical, observer-independent state discontinuity*. He did not deny discrete spectra, selection rules, or Einstein's transition rates. The modern trajectory picture — continuous non-Hermitian evolution between clicks, conditional updates at clicks — is essentially what he was asking for, and Minev 2019 makes it experimentally explicit."}, {"claim": "The 1986 single-ion experiments 'observed the quantum jump'.", "clarification": "They observed the macroscopic fluorescence telegraph signal that *witnesses* a shelving transition on a weak narrow line. The transition itself is sub-nanosecond and is not temporally resolved in those experiments — what is resolved is the millisecond-to-second dark/bright dwell-time statistics consistent with Einstein A-coefficient Poisson kinetics. Resolving the jump dynamics waited for Minev 2019."}, {"claim": "Quantum jumps are intrinsically Markovian and instantaneous.", "clarification": "Only within the Born–Markov Lindblad / standard MCWF picture. The Piilo et al. (2007) non-Markovian quantum jump formalism allows reversible jumps with memory; experimentally, Minev 2019 shows that even in a Markovian effective master equation, conditioning on the no-click record renders the jump continuous, predictable, and reversible. 'Instantaneous' is a feature of an unraveling, not of nature."}, {"claim": "'Quantum leap' / 'Quantensprung' in popular usage means 'a huge advance'.", "clarification": "Physically the elementary jump is the *smallest possible* change of state a quantized system can undergo — colloquial usage inverts the technical meaning."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: Bohr's Postulate, Einstein's Statistics, and the Names Erased from the Story", "markdown": "## Origins: Bohr's Postulate, Einstein's Statistics, and the Names Erased from the Story\n\n### 1.1 The 1913 postulate: a discontinuity inserted by hand\n\nThe quantum jump enters physics not as a derivation but as an axiom. In the three installments of *On the Constitution of Atoms and Molecules* [1], Bohr writes down two postulates whose only justification is that they reproduce the Balmer formula. The first asserts that an atomic electron can occupy only a discrete set of \"stationary states\" in which, in defiance of Larmor, it does *not* radiate. The second asserts that radiation accompanies a *transition* between two such states, with frequency fixed by\n\n$$h\\nu = E_n - E_m.$$\n\nThe transition itself has no dynamical description. It is not a continuous motion in configuration space; it is not a perturbative process in any well-defined Hamiltonian; it is a primitive of the theory. Bohr is explicit about this — he calls the inter-state passage \"a process which cannot be treated on the ordinary mechanical conceptions.\" Read coldly in 2026, the trilogy is a remarkable document: a logically incomplete theory whose central new object (the jump) is defined operationally by the spectral lines it produces and otherwise left as a black box. The discreteness comes from the spectrum; the *jump* is an interpretive overlay placed on top of it.\n\nTwo consequences of this surgical incision are worth fixing now, because they propagate through every later confusion (see §6 of the dossier on conflations). First, Bohr's $h\\nu = E_n - E_m$ is a constraint on the *radiation*, not a clock for the transition: nothing in [1] tells you how long a jump takes, only that energy is balanced before and after. Second, Bohr's framework is silent on individual photons. The 1913 paper does not yet commit to the light quantum — Bohr will, notoriously, resist it until 1925. The jump and the photon are, at birth, separated.\n\n### 1.2 Einstein 1917: the statistical law nobody credits\n\nThe piece textbooks call \"Bohr's quantum jump\" is in fact Einstein's. In *Zur Quantentheorie der Strahlung* [2], Einstein replaces Bohr's qualitative postulate with a complete *statistical kinetics*. He posits three elementary processes — spontaneous emission with rate $A_{mn}$, stimulated emission with rate $B_{mn}\\rho(\\nu)$, and absorption with rate $B_{nm}\\rho(\\nu)$ — and shows that detailed balance against a Planck distribution forces the relations\n\n$$\\frac{A_{mn}}{B_{mn}} = \\frac{8\\pi h \\nu^3}{c^3}, \\qquad g_n B_{nm} = g_m B_{mn}.$$\n\nThis is more than a derivation of Planck's law. Three structural features of every later theory of jumps are quietly fixed here:\n\n1. **Each emission act carries a definite directed momentum $h\\nu/c$.** Einstein insists on this: without directionality, detailed balance fails. The \"needle radiation\" (*Nadelstrahlung*) is the photon in all but name, eight years before Compton.\n2. **The transitions are Poissonian.** The probability of a jump in $dt$ is $A_{mn}\\,dt$, independent of history; populations decay as $e^{-A_{mn}t}$. Every Lindblad rate calculation done today is structurally Einstein 1917 with a derivation supplied for $A_{mn}$.\n3. **The when is uncaused.** Einstein writes — and this is the sentence Schrödinger will quote bitterly thirty-five years later [3, 4] — that \"the time and direction of the elementary process are left to *chance*\" (*es bleibt dem 'Zufall' überlassen*). He flags this as a weakness of the theory, not as a positive result. The man who would later refuse dice did not invent the casino either; he diagnosed it.\n\nSo the modern object — the stochastic, Poissonian, momentum-carrying jump — is *Einstein's*. Bohr supplied the conservation law $h\\nu = E_n - E_m$; Einstein supplied the rate law $dP/dt = A_{mn}$ that turns it into a calculable theory. Pedagogy collapses both into \"the Bohr postulate,\" and the most important half of the structure ends up uncredited.\n\n### 1.3 BKS 1924: the theory that tried to kill the jump\n\nWithin a year of de Broglie's matter waves and a year before Heisenberg's *Umdeutung*, Bohr made one last attempt to *abolish* the quantum jump as a real physical event. The Bohr–Kramers–Slater paper [5] proposed that each atom in a stationary state continuously generates a *virtual radiation field* at all of its possible transition frequencies. Real emission and absorption are then statistically induced by this field, and — crucially — energy and momentum are conserved only on *statistical average*, not in individual atomic events. The jump dissolves into a continuous, classical-looking radiation process whose only quantum content is statistical.\n\nHere the historical record diverges sharply from the textbook story, and Slater is the casualty. As his own later accounts make clear (and as Mehra–Rechenberg vol. 1 documents in detail), Slater arrived in Copenhagen with a *photon-preserving* virtual-field picture: real light quanta guided by virtual oscillators, with strict event-by-event conservation. It was Bohr and Kramers who stripped the photons and the conservation laws before publication, against Slater's objection. The paper bears his name; the physics does not. Slater never quite recovered scientific seniority after the experiment killed the theory, and the credit asymmetry — Bohr the visionary, Kramers the theorist, Slater the postdoc — has fossilized.\n\n### 1.4 Bothe–Geiger 1925: the names that get erased\n\nThe verdict on BKS was empirical, not theoretical, and it was rendered by an apparatus, not an axiom. Bothe and Geiger [6] built the first *coincidence counter*: a needle counter for Compton-scattered photons and a point counter for the recoil electron, with a fast mechanical recording system. If BKS were right, the photon-scattering and electron-recoil events would be *independently* random, correlated only by an overall rate, because no individual conservation law links them. If real quanta are right, every recoil electron is born simultaneously with a scattered photon, and the two counters should fire in lock-step.\n\nThey did. Bothe and Geiger reported coincidence rates orders of magnitude above the BKS-allowed accidental rate; Compton and Simon, working independently in Chicago with cloud-chamber tracks, reached the same conclusion within months. Energy and momentum conservation hold *event-by-event*. The jump is real, discrete, and individually-conservative. Pauli's relief is famous (\"die Idee Bohrs ist gestorben\"); Schrödinger's irritation, less so. Bothe's 1954 Nobel lecture is unambiguous that this experiment is the origin of the coincidence method and the empirical death of BKS — yet most modern textbooks attribute the demise of BKS to \"experiments by Compton\" or simply to \"experiment,\" dropping Bothe and Geiger by name. The first instrument ever built to interrogate a single quantum event has, in the pedagogical record, become anonymous.\n\n### 1.5 What 1925 left on the table\n\nBy the end of 1925 the conceptual furniture of the jump is in place and largely uncredited at the right addresses. From [1] comes discreteness and the frequency condition; from [2] comes Poissonian kinetics, directed quanta, and the explicit admission that the *when* is uncaused; from the failure of [5] comes the empirical guarantee, via [6], that individual events conserve $E$ and $\\mathbf{p}$. What is missing is any dynamical account of the transition itself: a Hamiltonian, an evolution equation, a duration. That gap is what Schrödinger will pry open in 1926, and again, more bitterly, in 1952 — and what will not close, in any operational sense, until Minev 2019 [7]."}, {"id": "the-physics-itself", "title": "The Physics: From hν = E_n − E_m to the Einstein A and B Coefficients", "markdown": "## The Physics: From hν = E_n − E_m to the Einstein A and B Coefficients\n\n### Bohr's frequency condition as an axiom\n\nBohr's second postulate of 1913 is a single line of arithmetic doing the work of a derivation:\n\n$$h\\nu_{mn} \\;=\\; E_m - E_n, \\qquad E_m \u003e E_n,$$\n\nwith $\\nu_{mn}$ the frequency of the radiation emitted (or absorbed) in the transition $m \\!\\to\\! n$ [1]. The radical move is not the equation but what is *omitted* from it: the postulate fixes only the frequency of the emitted quantum, not the time at which the jump occurs, not the duration of the transient, not the phase relation between the initial and final stationary states. Maxwellian intuition — that a radiating atom is an oscillating dipole whose frequency equals its mechanical frequency — is severed at the root. The radiation frequency is a *difference* of mechanical eigenfrequencies and bears no fixed relation to either of them. The Rydberg combination principle (Ritz 1908), empirical and unexplained for five years, becomes a corollary: spectral lines combine additively in frequency because energies combine additively in level differences.\n\nWhat Bohr does not supply is a *rate*. The postulate is silent on $dN_m/dt$. Atoms in the excited stationary state are stipulated as stationary; the jump down is asserted but its statistics are absent. That gap is what Einstein closes in 1917.\n\n### Einstein 1917: the three rate constants\n\nEinstein's \"Zur Quantentheorie der Strahlung\" introduces three elementary processes between any pair of bound states $m,n$ in a bath of thermal radiation of spectral energy density $\\rho(\\nu)$ [2]:\n\n- *Spontaneous emission* $m \\!\\to\\! n$ at rate $A_{mn}$ per atom, independent of $\\rho$.\n- *Stimulated emission* $m \\!\\to\\! n$ at rate $B_{mn}\\,\\rho(\\nu_{mn})$ per atom.\n- *Absorption* $n \\!\\to\\! m$ at rate $B_{nm}\\,\\rho(\\nu_{mn})$ per atom.\n\nPopulation dynamics in a closed two-level subspace then obey the rate (master) equation\n\n$$\\frac{dN_m}{dt} \\;=\\; -\\,A_{mn}\\,N_m \\;-\\; B_{mn}\\,\\rho(\\nu_{mn})\\,N_m \\;+\\; B_{nm}\\,\\rho(\\nu_{mn})\\,N_n,$$\n\nwith $\\dot N_n = -\\dot N_m$. The conceptual jump — Einstein's own — is to treat each elementary act as a *Poissonian random event*: the probability that an atom currently in $m$ emits in $[t,t+dt]$ is $(A_{mn} + B_{mn}\\rho)\\,dt$, independent of how long it has already sat in $m$. This memoryless ansatz, imported by analogy with radioactive decay (Rutherford 1900), is what makes \"quantum jump\" a *statistical* object rather than a kinematic one. Bohr supplied the kinematics ($h\\nu = \\Delta E$); Einstein supplied the statistics ($A$, $B$, exponential dwell).\n\n### Detailed balance fixes $A/B$\n\nIn thermal equilibrium at temperature $T$, $\\dot N_m = 0$ and the populations satisfy Boltzmann statistics $N_m/N_n = (g_m/g_n)\\exp(-h\\nu_{mn}/k_B T)$, with $g_{m,n}$ the level degeneracies. Inserting this int
