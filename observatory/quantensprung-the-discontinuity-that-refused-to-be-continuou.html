o the steady-state condition and solving for $\\rho$ gives\n\n$$\\rho(\\nu_{mn}) \\;=\\; \\frac{A_{mn}/B_{mn}}{(g_n B_{nm})/(g_m B_{mn})\\;\\exp(h\\nu_{mn}/k_B T) - 1}.$$\n\nFor this to reduce to the Planck distribution\n\n$$\\rho_{\\text{Pl}}(\\nu) \\;=\\; \\frac{8\\pi h \\nu^3}{c^3}\\,\\frac{1}{\\exp(h\\nu/k_B T) - 1},$$\n\nEinstein extracts two algebraic constraints, valid for any $T$:\n\n$$g_m\\,B_{mn} \\;=\\; g_n\\,B_{nm}, \\qquad \\frac{A_{mn}}{B_{mn}} \\;=\\; \\frac{8\\pi h \\nu_{mn}^3}{c^3}.$$\n\nThe second is the relation that physicists actually use: it ties the spontaneous rate to the stimulated cross-section through nothing but the mode density of free space $8\\pi\\nu^2/c^3$ and one photon of energy $h\\nu$ per mode. Conceptually this is already the embryo of quantum electrodynamics — spontaneous emission is stimulated emission driven by the vacuum's zero-point occupation, a viewpoint made rigorous only after Dirac 1927.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eTwo-level system with Einstein A and B processes\u003c/title\u003e\u003cline x1=\"80\" y1=\"320\" x2=\"320\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"3\"/\u003e\u003cline x1=\"80\" y1=\"90\" x2=\"320\" y2=\"90\" stroke=\"#e8e6e1\" stroke-width=\"3\"/\u003e\u003ctext x=\"60\" y=\"325\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"end\" font-family=\"serif\"\u003e|n⟩, E_n\u003c/text\u003e\u003ctext x=\"60\" y=\"95\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"end\" font-family=\"serif\"\u003e|m⟩, E_m\u003c/text\u003e\u003ctext x=\"200\" y=\"210\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003ehν = E_m − E_n\u003c/text\u003e\u003cline x1=\"200\" y1=\"105\" x2=\"200\" y2=\"305\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/\u003e\u003cpath d=\"M 130 100 Q 110 205 130 310\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar1)\"/\u003e\u003ctext x=\"105\" y=\"205\" fill=\"#7aa2ff\" font-size=\"15\" text-anchor=\"end\" font-family=\"serif\"\u003eA_{mn}\u003c/text\u003e\u003ctext x=\"105\" y=\"225\" fill=\"#7aa2ff\" font-size=\"12\" text-anchor=\"end\" font-family=\"serif\"\u003espontaneous\u003c/text\u003e\u003cpath d=\"M 230 100 Q 250 205 230 310\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar2)\"/\u003e\u003ctext x=\"265\" y=\"205\" fill=\"#ffb86b\" font-size=\"15\" font-family=\"serif\"\u003eB_{mn} ρ(ν)\u003c/text\u003e\u003ctext x=\"265\" y=\"225\" fill=\"#ffb86b\" font-size=\"12\" font-family=\"serif\"\u003estimulated em.\u003c/text\u003e\u003cpath d=\"M 295 310 Q 315 205 295 100\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar3)\"/\u003e\u003ctext x=\"330\" y=\"205\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"serif\"\u003eB_{nm} ρ(ν)\u003c/text\u003e\u003ctext x=\"330\" y=\"225\" fill=\"#7ee0a3\" font-size=\"12\" font-family=\"serif\"\u003eabsorption\u003c/text\u003e\u003cdefs\u003e\u003cmarker id=\"ar1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L8,4 L0,8 z\" fill=\"#7aa2ff\"/\u003e\u003c/marker\u003e\u003cmarker id=\"ar2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L8,4 L0,8 z\" fill=\"#ffb86b\"/\u003e\u003c/marker\u003e\u003cmarker id=\"ar3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L8,4 L0,8 z\" fill=\"#7ee0a3\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003cline x1=\"440\" y1=\"60\" x2=\"440\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"440\" y1=\"340\" x2=\"700\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"570\" y=\"365\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003et\u003c/text\u003e\u003ctext x=\"430\" y=\"65\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\" font-family=\"serif\"\u003eN_m(t)/N_m(0)\u003c/text\u003e\u003cpath d=\"M 440 80 Q 500 200 580 270 Q 640 310 700 325\" stroke=\"#ff7a90\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"610\" y=\"200\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003eexp(−Γ t)\u003c/text\u003e\u003cline x1=\"525\" y1=\"80\" x2=\"525\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/\u003e\u003ctext x=\"525\" y=\"355\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\" font-family=\"serif\"\u003eτ = 1/Γ\u003c/text\u003e\u003ctext x=\"570\" y=\"100\" fill=\"#e8e6e1\" font-size=\"13\" font-family=\"serif\"\u003eΓ = A_{mn} + B_{mn} ρ + …\u003c/text\u003e\u003c/svg\u003e\n*Figure: Left — the three elementary processes Einstein introduces in [2] between levels $|n\\rangle$ and $|m\\rangle$ separated by $h\\nu = E_m - E_n$. Right — the resulting exponential decay of the excited-state population that follows from treating each emission as a Poissonian event of rate $\\Gamma$; the dwell-time distribution is $p(\\tau) = \\Gamma e^{-\\Gamma\\tau}$, and counted clicks form a Poisson process.*\n\n### Exponential decay and Poisson click statistics\n\nIn the absence of driving ($\\rho \\to 0$) the rate equation collapses to $\\dot N_m = -A_{mn} N_m$, with the textbook solution\n\n$$N_m(t) \\;=\\; N_m(0)\\,e^{-A_{mn} t}.$$\n\nFor a *single* atom, $N_m(t)$ is replaced by the survival probability $P_m(t) = e^{-\\Gamma t}$ with $\\Gamma = \\sum_n A_{mn}$ summing over all decay channels; the lifetime is $\\tau = \\Gamma^{-1}$. The distribution of dwell times $\\tau_{\\text{dwell}}$ before a click is\n\n$$p(\\tau_{\\text{dwell}}) \\;=\\; \\Gamma\\,e^{-\\Gamma\\,\\tau_{\\text{dwell}}},$$\n\nand the number of clicks in $[0,T]$ from $N$ independent atoms is Poisson-distributed with mean $N\\Gamma T$ (small-excitation limit) — the form the 1986 single-ion experiments analyzed to confirm they were seeing Einstein-A kinetics on the shelving transition [8, 9, 10]. The branching ratio between two decay channels is $A_{m \\to n_1}/A_{m \\to n_2}$, fixed by the transition matrix elements and ultimately calculable from QED.\n\n### What is silently invoked\n\nThe Einstein derivation is irreproachable but rests on assumptions textbooks rarely state. They reappear, with consequences, in every modern Lindblad calculation [11] and every Monte Carlo unraveling [12, 13, 14].\n\n1. **Weak coupling.** The atom–field interaction must be small enough that $\\rho(\\nu)$ is essentially undisturbed by the presence of the atom and that perturbative transition rates are well-defined. Strong-coupling cavity QED breaks this: vacuum Rabi oscillations replace exponential decay.\n2. **Broad-band, smooth reservoir.** $\\rho(\\nu)$ must vary negligibly over the natural linewidth $\\Gamma$. In photonic crystals or near a cavity resonance this fails outright; the Purcell factor $F_P = (3/4\\pi^2)(\\lambda/n)^3(Q/V)$ modifies $A_{mn}$ by orders of magnitude, demonstrating that \"the\" spontaneous rate is not a property of the atom but of the atom-in-its-mode-environment.\n3. **Markov approximation.** The memoryless Poisson ansatz requires that the reservoir correlation time $\\tau_c$ be much shorter than any system timescale: $\\tau_c \\ll \\Gamma^{-1}$. For free-space optical transitions $\\tau_c \\sim 1/\\nu \\sim 10^{-15}$ s and $\\Gamma^{-1} \\sim 10^{-8}$ s, so the gap is comfortable; for engineered reservoirs (structured photonic baths, slow electromagnetic environments) it is not, and one needs the non-Markovian jump generalization of Piilo et al. [15].\n4. **Rotating-wave / energy-shell restriction.** $\\rho$ is sampled only at $\\nu_{mn}$; counter-rotating contributions and the Lamb shift are quietly absorbed into renormalized energies.\n5. **Stationary thermal reservoir for the derivation of $A/B$.** The ratio $A/B = 8\\pi h\\nu^3/c^3$ is forced by Planck plus Boltzmann; the derivation uses thermal equilibrium as a *device* to fix the ratio, after which the ratio is treated as a universal property of the transition. This is legitimate (the coefficients are atomic, not thermal) but the logical move is rarely flagged.\n6. **No coherence.** The rate equation tracks populations $N_m$, not coherences $\\rho_{mn}$. It is the diagonal sector of the optical Bloch equations in the limit where the off-diagonal damping $\\Gamma_\\perp = \\Gamma_\\parallel/2 + \\gamma_\\phi$ exceeds the Rabi frequency. Coherent driving, dark states, EIT, and superradiance all live in the sector Einstein's 1917 framework discards.\n\nWhat Einstein leaves intact, and what survives every refinement, is the structural skeleton: a *discrete* spectrum (Bohr), a *statistical* law of transition rates between discrete levels (Einstein), and a *thermal-equilibrium constraint* that ties spontaneous to stimulated rates via the free-space mode density. Modern Lindblad operators $L_k = \\sqrt{\\Gamma_k}\\,|n\\rangle\\langle m|$ are nothing more than the operator-valued square roots of Einstein's $A_{mn}$; the master equation $\\dot\\rho = -i[H,\\rho]/\\hbar + \\sum_k(L_k \\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\})$ reproduces Einstein's rate equation on the diagonal and supplies, on the off-diagonal, exactly the coherences that 1917 could not yet see. Every \"quantum jump\" in the operational sense of Section 5 is a click drawn from a $L_k$-conditioned Poisson process whose intensity, in equilibrium, is set by the very ratio Einstein extracted from black-body radiation."}, {"id": "schrodinger-vs-bohr", "title": "The Foundational War: Schrödinger's 1926 Outburst and the 1952 Polemic", "markdown": "## The Foundational War: Schrödinger's 1926 Outburst and the 1952 Polemic\n\n### The Copenhagen confrontation, September 1926\n\nBy the autumn of 1926 the quantum jump had become not a postulate but a sociological fault line. Schrödinger arrived in Copenhagen at Bohr's invitation on 1 October 1926, fresh from the wave-mechanical papers of January–June and from his proof of formal equivalence with matrix mechanics. He came armed with a physical picture — continuous $\\psi(\\mathbf{r},t)$ obeying a deterministic linear PDE — that left no room for discontinuous transitions between stationary states. Bohr came armed with the 1913 postulate, Einstein's 1917 statistical machinery [2], and the empirical verdict of Bothe–Geiger 1925 [6] which had killed BKS [5] and reinstated event-by-event energy conservation. The two were not arguing about formalism; they were arguing about what the formalism *meant*.\n\nThe conversation is preserved primarily through Heisenberg's reconstruction in *Der Teil und das Ganze* [16]. Heisenberg was a partisan witness — he was in the room because Bohr had drafted him as reinforcement — and his text is a memoir written four decades after the event, so the exact wording must be treated as paraphrase rather than transcript (verify). The substance, however, is corroborated by Bohr's own correspondence and by Schrödinger's letters to Wien and Planck in late 1926. The famous outburst, attributed to Schrödinger after days of being kept up past midnight by Bohr's relentless Socratic pressure, runs in Heisenberg's German as roughly: *\"Wenn es bei dieser verdammten Quantenspringerei bleiben soll, dann bedaure ich, mich überhaupt mit der Quantentheorie beschäftigt zu haben.\"* — \"If we are going to have to put up with these damned quantum jumps, I regret ever having had anything to do with quantum theory.\"\n\nPedagogy has compressed this episode into a cartoon of the stubborn classical physicist refusing the new physics. The cartoon is wrong on two counts. First, Schrödinger was not denying discreteness — his own eigenvalue equation *produced* the discrete spectrum $E_n$ as the boundary-value spectrum of $\\hat H \\psi = E\\psi$, and he was perfectly happy with the Bohr frequency condition $h\\nu_{mn} = E_m - E_n$ read off the spectral gaps. What he objected to was the *ontological* claim that between two stationary states the atom executes an instantaneous, observer-independent, physically real discontinuity. Second, Bohr was not defending a derivation; he was defending a postulate by appealing to its empirical consequences (line spectra, Einstein statistics, Compton coincidences) and to the impossibility, in his view, of giving any other consistent account of measurement.\n\n### What was actually at stake\n\nThe technical content of the disagreement can be stated precisely. The 1926 wave mechanics gives, for an atom coupled to a radiation reservoir, a unitary evolution of the total atom-plus-field state. If one traces over the field, one obtains a reduced density matrix $\\rho(t)$ whose off-diagonal coherences decay and whose diagonal populations evolve smoothly under the Einstein rate equations\n\n$$\\dot p_n \\;=\\; \\sum_{m} \\bigl[ A_{mn} + B_{mn} u(\\nu_{mn}) \\bigr] p_m \\;-\\; \\sum_{m} \\bigl[ A_{nm} + B_{nm} u(\\nu_{nm}) \\bigr] p_n.$$\n\nNothing here jumps. The discontinuity enters only when one *insists* that at every instant the atom occupies a single definite stationary state, so that $p_n(t)$ must be interpreted as the probability that the atom has *already* jumped by time $t$. That insistence is the Bohr-Heisenberg measurement-axiom overlay; it is not contained in either wave mechanics or in Einstein's derivation. Schrödinger's position, fully formed by 1926 and made explicit in 1952, was that the overlay is bookkeeping, not physics — that the continuous evolution is the real process and the \"jump\" is what a detector record looks like when one demands a classical narrative for each individual atom.\n\n### The 1952 polemic\n\nA quarter-century later, in two papers in the *British Journal for the Philosophy of Science*, Schrödinger returned to the attack [3, 4]. The papers are usually summarized as \"Schrödinger denied quantum jumps\" — a summary so compressed that it reverses the actual argument. Read on their own terms, they make three distinct claims.\n\nFirst, the *language* of jumps is parasitic on a discredited picture. Schrödinger points out that \"transition from state $n$ to state $m$\" presupposes that the atom occupies stationary states between transitions, which is precisely the picture wave mechanics replaced. In wave mechanics the atom occupies a superposition that evolves continuously; only the energy *measurement* yields one of the eigenvalues $E_n$.\n\nSecond, the Einstein A and B coefficients [2] do not require jumps for their derivation. They require only (i) a discrete spectrum, (ii) Fermi-golden-rule transition rates, and (iii) the statistical assumption of detailed balance with the Planck distribution. None of these is a statement that an *individual* atom executes a discontinuous transition at a definite instant. Schrödinger's Part I [3] is essentially an extended demonstration that the *statistics* of emission can be reproduced without the *ontology* of jumps.\n\nThird — and this is the point the pedagogy loses — Schrödinger argues that the only place a real discontinuity appears is in the projection postulate applied to a single system. Remove the projection postulate, treat $\\psi$ as a description of an ensemble or of a system-plus-apparatus joint state, and the jumps disappear from the physics while leaving every observable prediction intact. Part II [4] presses this point against Born's probabilistic interpretation, arguing that the apparent discontinuity is a feature of the *epistemic* update of the observer's information, not of the *dynamical* evolution of the system.\n\n### Why the pedagogy flattens this, and why it matters\n\nThe flattening — \"Schrödinger refused to accept jumps\" — survives because it is convenient for two pedagogical purposes: it lets textbooks present the Copenhagen interpretation as victorious without engaging its critics, and it lets the 1986 single-ion experiments [8, 9, 10] be sold as direct refutations of Schrödinger. Neither use survives scrutiny. The 1986 experiments observed millisecond-to-second dwell-time statistics of a fluorescence telegraph signal entirely consistent with Einstein A-coefficient Poisson kinetics; they did not resolve the sub-nanosecond transition itself and therefore could not adjudicate the question of what happens *between* clicks.\n\nThe question of what happens between clicks is exactly Schrödinger's question, and it was unanswerable in 1952 because the theoretical apparatus for asking it — quantum trajectory theory [12, 13, 14], the conditional state given a detection record — did not exist. Once it did exist, in 1992–1993, the inter-click evolution acquired a precise definition: continuous non-Hermitian evolution under an effective Hamiltonian $\\hat H_{\\rm eff} = \\hat H - \\tfrac{i\\hbar}{2}\\sum_k \\hat L_k^\\dagger \\hat L_k$, deterministic between jumps, with the \"jump\" itself appearing only as the operational update conditioned on a click. This is Schrödinger's continuity — the thing he could not articulate in 1952 because the formal vocabulary was thirty years away.\n\nThe 2019 Yale catch-and-reverse experiment [7] then closes the loop. By monitoring an ancillary transition in a superconducting transmon and conditioning on the *absence* of clicks, Minev and coworkers showed that the inter-click evolution is not only continuous but *predictable* and *reversible*: a jump in progress can be detected before completion and aborted by a coherent pulse. The discreteness Bohr postulated is preserved; the instantaneous observer-independent discontinuity Schrödinger denied is, as he suspected, an artifact of the measurement story. The foundational war did not end in a victor — it ended in a partition of the territory each side had actually been defending."}, {"id": "shelving-and-the-1986-triple", "title": "Making the Jump Visible: Dehmelt's Shelving and the Three 1986 Observations", "markdown": "## Making the Jump Visible: Dehmelt's Shelving and the Three 1986 Observations\n\n### The amplifier problem\n\nBy the mid-1970s the Bohr–Einstein jump was sixty years old as a *theoretical* object and still zero seconds old as a *directly witnessed* one. The reason was a brutal signal-to-noise asymmetry. A single atom undergoing a single dipole-allowed transition emits, at most, one photon per spontaneous-emission lifetime — typically $10^{-8}\\,$s for an optical line — into $4\\pi$ steradians, of which a realistic detector subtends perhaps $10^{-2}$, with quantum efficiency of order $10^{-1}$. A single jump on a weak intercombination line, with branching ratio $\\sim 10^{-7}$ relative to the strong line, is detectionally invisible: it produces, on average, a fraction of a photon before being lost in dark counts.\n\nDehmelt's idea, sketched in a one-paragraph abstract for the 1975 Washington APS meeting [17] and developed throughout the late 1970s in his ion-trap programme, was to convert the weak jump into a macroscopic on/off signal by coupling it to a *strong* cycling transition driven to saturation. The strong transition acts as an optical amplifier with a gain of order $10^{8}$: each second of \"bright\" time delivers $\\sim 10^{7}$–$10^{8}$ detected photons, and each \"dark\" interval corresponds, unambiguously, to the electron being shelved on the metastable level. The transition that one wants to see — the rare jump onto and off the shelf — is inferred not from its own photons but from the disappearance and reappearance of the cycling fluorescence. This is the *electron-shelving* scheme, and it is the only reason the quantum jump ever became visible to a photomultiplier.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eElectron-shelving three-level scheme\u003c/title\u003e\u003cline x1=\"120\" y1=\"340\" x2=\"320\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"3\"/\u003e\u003cline x1=\"120\" y1=\"170\" x2=\"320\" y2=\"170\" stroke=\"#e8e6e1\" stroke-width=\"3\"/\u003e\u003cline x1=\"420\" y1=\"100\" x2=\"620\" y2=\"100\" stroke=\"#e8e6e1\" stroke-width=\"3\"/\u003e\u003ctext x=\"330\" y=\"345\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|g⟩ 6S₁/₂ (ground)\u003c/text\u003e\u003ctext x=\"330\" y=\"175\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|e⟩ 6P₁/₂ (strong, Γ ~ 10⁸ s⁻¹)\u003c/text\u003e\u003ctext x=\"430\" y=\"92\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|s⟩ 5D₅/₂ (shelf, τ ~ 30 s)\u003c/text\u003e\u003cline x1=\"160\" y1=\"340\" x2=\"160\" y2=\"170\" stroke=\"#7aa2ff\" stroke-width=\"2\" marker-end=\"url(#a1)\"/\u003e\u003cline x1=\"200\" y1=\"170\" x2=\"200\" y2=\"340\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"4 3\" marker-end=\"url(#a1)\"/\u003e\u003ctext x=\"60\" y=\"260\" fill=\"#7aa2ff\" font-size=\"14\"\u003e493 nm\u003c/text\u003e\u003ctext x=\"60\" y=\"278\" fill=\"#7aa2ff\" font-size=\"14\"\u003ecycling\u003c/text\u003e\u003cline x1=\"280\" y1=\"340\" x2=\"470\" y2=\"105\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#a2)\"/\u003e\u003ctext x=\"345\" y=\"225\" fill=\"#ffb86b\" font-size=\"14\"\u003eweak probe\u003c/text\u003e\u003ctext x=\"345\" y=\"243\" fill=\"#ffb86b\" font-size=\"14\"\u003e(or off-resonant\u003c/text\u003e\u003ctext x=\"345\" y=\"261\" fill=\"#ffb86b\" font-size=\"14\"\u003e repump)\u003c/text\u003e\u003cline x1=\"600\" y1=\"105\" x2=\"305\" y2=\"340\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"6 3\" marker-end=\"url(#a2)\"/\u003e\u003ctext x=\"500\" y=\"230\" fill=\"#ff7a90\" font-size=\"14\"\u003espontaneous\u003c/text\u003e\u003ctext x=\"500\" y=\"248\" fill=\"#ff7a90\" font-size=\"14\"\u003edecay (rare)\u003c/text\u003e\u003cdefs\u003e\u003cmarker id=\"a1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7aa2ff\"/\u003e\u003c/marker\u003e\u003cmarker id=\"a2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#ffb86b\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"40\" y=\"20\" width=\"640\" height=\"50\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"55\" y=\"42\" fill=\"#7ee0a3\" font-size=\"14\"\u003eGain mechanism: each excursion to |s⟩ silences ~10⁷ cycling photons.\u003c/text\u003e\u003ctext x=\"55\" y=\"60\" fill=\"#7ee0a3\" font-size=\"14\"\u003eA single weak-line jump is amplified into a macroscopic dark interval.\u003c/text\u003e\u003c/svg\u003e\n*Figure: Dehmelt's three-level shelving scheme illustrated for Ba⁺. The bright/dark telegraph is generated by the strong cycling transition $|g\\rangle \\leftrightarrow |e\\rangle$; the rare jumps onto and off the metastable shelf $|s\\rangle$ are the events being witnessed.*\n\n### What the shelving signal actually is\n\nLet $\\Gamma_{eg}$ be the strong line's spontaneous-emission rate, $R_{gs}$ the rate of jumping onto the shelf (set by a weak probe or by an off-resonant excitation), and $\\gamma_s = 1/\\tau_s$ the shelf's spontaneous decay rate back to $|g\\rangle$. Under saturation of the strong line the bright steady-state photon flux is $\\Phi_b \\sim \\tfrac{1}{2}\\Gamma_{eg}\\eta$, with $\\eta$ the overall detection efficiency. The dwell times in bright and dark intervals are independent exponentials,\n\n$$P_b(t) = R_{gs} e^{-R_{gs} t}, \\qquad P_d(t) = \\gamma_s e^{-\\gamma_s t},$$\n\nso the signal is a random telegraph whose statistics are Einstein-A kinetics applied to a *single* atom. The macroscopic Poisson process of fluorescence drops is the amplifier output; the microscopic event being amplified is the Bohr jump itself. This is the precise sense in which the experiments below \"observed\" the jump — they resolved the Poissonian statistics of the inter-jump waiting times, not the sub-nanosecond electronic transition. A modern bound on the latter, from continuous-wave heralding on a single atom, is given in [18].\n\n### The three 1986 PRLs\n\nWithin five months, three groups published independent realizations of Dehmelt's 1975 proposal in *Physical Review Letters*.\n\n**Seattle (Nagourney, Sandberg, Dehmelt).** Published July 1986 [8]. A single $^{138}\\text{Ba}^+$ ion in a Paul trap, the cycling transition $6S_{1/2}\\leftrightarrow 6P_{1/2}$ at 493 nm driven near saturation with a repumper out of $5D_{3/2}$, and a weak excitation onto the metastable shelf $5D_{5/2}$ ($\\tau \\approx 30\\,$s). The recorded fluorescence trace shows abrupt step-function transitions between a bright level of $\\sim 10^4$ counts per second and a dark level of pure background, with bright/dark durations of order seconds. Histograms of the dwell times fit single exponentials. This is the paper Dehmelt cites in his 1989 Nobel Lecture [19] as the realization of the \"mono-ion oscillator\" he had been advocating since 1975.\n\n**Hamburg (Sauter, Neuhauser, Blatt, Toschek).** Published October 1986 [9]. Same ion, $\\text{Ba}^+$, in a Paul trap built in Toschek's lab, but with arguably the cleanest implementation of the three-level scheme: the shelf is reached by an off-resonant excitation, and the telegraph is recorded simultaneously for a single ion and (in a separate trace) for two ions, where the signal exhibits *three* fluorescence levels (both bright, one dark, both dark) whose dwell-time statistics confirm independent jump processes. The two-ion data is, in retrospect, the more incisive demonstration: it rules out classical telegraph noise from the laser or the detector and establishes that each ion is jumping on its own clock. Toschek's group's contribution is the one most systematically displaced in popular accounts, partly because they were second by months in PRL and partly because Dehmelt's Nobel concentrated attention on the Seattle work.\n\n**NIST Boulder (Bergquist, Hulet, Itano, Wineland).** Published October 1986 [10]. A different ion, $^{198}\\text{Hg}^+$, in a different trap, on a different (UV) transition: cycling on $5d^{10}6s\\,{}^2S_{1/2}\\leftrightarrow 5d^{10}6p\\,{}^2P_{1/2}$ at 194 nm with shelving on the metastable $5d^96s^2\\,{}^2D_{5/2}$ level ($\\tau \\approx 0.1\\,$s). The shorter shelf lifetime gives faster telegraph statistics; the UV cycling transition gives a different photon-counting regime. The independence of system, wavelength, and laboratory is the substantive content of this paper: it certifies that the shelving telegraph is not an artifact of the particular Ba⁺ level structure. Wineland's 2012 Nobel was awarded for ion-trap quantum logic, not for this observation, which leaves the 1986 contribution disproportionately under-credited in the trade-book literature.\n\nThe three papers are properly read together. None of them is \"the\" 1986 observation; together they constitute it, and the simultaneous independent realization across two continents, two ion species, and two trap traditions is itself the empirical content. Wineland's [10] note explicitly acknowledges receipt of the Seattle preprint; the Hamburg group's [9] acknowledges Dehmelt's original proposal. The priority structure is one of mutual recognition, not of contest.\n\n### What was — and was not — resolved\n\nIt is worth saying plainly. What 1986 resolved was the *statistical witness* of single discontinuous transitions on a single quantum object: the bright/dark dwell-time histograms are exponentials with rates predicted by Einstein's 1917 A-coefficient applied to one atom, not to an ensemble. This was, philosophically, the death of the last refuge of the ensemble-only reading of $A_{mn}$: the Poisson statistics live on the single ion. It was also the realization of Schrödinger's $1952$ rhetorical demand to \"see one\" — though, as he had warned [3], \"seeing one\" is not the same as seeing the transition. The shelving telegraph has a temporal resolution set by the count rate of the bright signal, $\\Delta t \\sim 1/\\Phi_b \\sim 10^{-4}\\,$s, and a fundamental resolution set by the shelf entry/exit times, neither of which approaches the actual transition timescale. The strong-line transition itself completes in $\\sim 1/\\Gamma_{eg}\\sim 10^{-8}\\,$s; the weak-line shelving transition is similarly fast on the optical Bloch timescale. None of that is resolved in 1986. The temporal interior of the jump remained closed to direct observation, and would remain so until [7] reopened it three decades later under conditions of weak continuous measurement on a manifestly continuous (transmon) artificial atom.\n\nThe three PRLs do, however, irreversibly close the question of *whether* discrete jumps occur on a single quantum system. After 1986 the Bohr postulate is no longer a theoretical posit and no longer an ensemble convenience. It is a single-system observable. The remaining question — what happens inside it — required the trajectory formalism that Dalibard–Castin–Mølmer, Dum–Zoller–Ritsch, and Carmichael were independently inventing in those same years [12, 13, 14], and which we turn to next."}, {"id": "trajectory-formalism", "title": "From Postulate to Algorithm: Monte Carlo Wavefunctions and Quantum Trajectories", "markdown": "## From Postulate to Algorithm: Monte Carlo Wavefunctions and Quantum Trajectories\n\n### The problem the 1986 experiments left open\n\nBy 1987 the experimentalists had outpaced the theorists. The Seattle, Hamburg, and NIST telegraph signals [8, 9, 10] were obviously Markovian Poisson processes on the macroscopic dwell-time scale, and a Bloch-equation / master-equation calculation reproduced the *ensemble averaged* fluorescence intensity perfectly well. What the master equation manifestly did *not* do was produce a *single* telegraph trace. The Lindblad evolution\n\n$$\\dot{\\rho} \\;=\\; -\\tfrac{i}{\\hbar}[H,\\rho] \\;+\\; \\sum_k \\Big( L_k\\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\}\\Big)$$\n\nis a deterministic equation for the *unconditioned* density operator. The dark and bright intervals seen in a single ion are a stochastic record, and there was no canonical way — circa 1990 — to extract one such record from $\\rho(t)$ without resorting to ad hoc \"quantum-jump\" Monte Carlo recipes that had been floating around the quantum-optics community since the late 1970s (Cook's photon-counting work, Zoller's atomic decay simulations, Carmichael's lectures at Oregon and Texas).\n\nThree groups, working effectively in parallel between roughly 1989 and 1992, gave that ad hoc recipe a principled foundation. The constructions are technically equivalent at the level of ensemble averages and, with hindsight, structurally identical; the physical motivations and the regional citation patterns were not.\n\n### The MCWF algorithm\n\nFix a Lindblad master equation with jump operators $\\{L_k\\}$. Define the non-Hermitian effective Hamiltonian\n\n$$H_{\\mathrm{eff}} \\;=\\; H \\;-\\; \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k.$$\n\nA single Monte Carlo wavefunction trajectory $|\\psi(t)\\rangle$ is generated by the following two-step procedure on each infinitesimal interval $[t,t+\\delta t]$:\n\n1. **Deterministic step.** Propagate $|\\tilde\\psi(t+\\delta t)\\rangle = (1 - iH_{\\mathrm{eff}}\\delta t/\\hbar)|\\psi(t)\\rangle$. The norm decreases by $\\delta p = \\delta t \\sum_k \\langle\\psi|L_k^\\dagger L_k|\\psi\\rangle \\equiv \\sum_k \\delta p_k$.\n2. **Stochastic step.** Draw a uniform $r\\in[0,1)$. If $r \u003e \\delta p$, *no jump*: renormalize, $|\\psi(t+\\delta t)\\rangle = |\\tilde\\psi(t+\\delta t)\\rangle/\\sqrt{1-\\delta p}$. If $r \\le \\delta p$, a *jump of channel $k$* occurs with conditional probability $\\delta p_k/\\delta p$, and\n\n$$|\\psi(t+\\delta t)\\rangle \\;=\\; \\frac{L_k|\\psi(t)\\rangle}{\\bigl\\lVert L_k|\\psi(t)\\rangle\\bigr\\rVert}.$$\n\nThe ensemble average over many realizations reproduces the Lindblad evolution:\n\n$$\\rho(t) \\;=\\; \\overline{|\\psi(t)\\rangle\\langle\\psi(t)|}\\,,$$\n\nwith the variance scaling as $1/\\sqrt{N}$ in $N$ trajectories. The proof is a one-line second-order expansion that exactly cancels the anti-commutator term of the Lindbladian against the renormalization of the no-jump branch — that cancellation is the algebraic miracle that makes the unraveling work, and it is independent of $\\delta t$ up to $O(\\delta t^2)$.\n\nTwo features deserve emphasis. First, the *continuous* between-jump evolution is genuinely non-Hermitian; the state is being sharpened by the absence of a click, in exact analogy to a Bayesian update on a null measurement outcome. Second, the *discontinuous* jump $|\\psi\\rangle \\mapsto L_k|\\psi\\rangle/\\lVert\\cdot\\rVert$ is the operational object that the algorithm calls a \"quantum jump\". It is not Bohr's spectroscopic transition and it is not Copenhagen's collapse — it is a conditional state update tied to a specific factorization of the dissipator and a specific (here, direct-photodetection) measurement record.\n\n### Triple parentage and the regional citation split\n\nThe Dalibard–Castin–Mølmer PRL [12] presented the algorithm above almost verbatim, motivated computationally: the master equation for a multi-level atom in an optical lattice is a $d^2 \\times d^2$ object, while a wavefunction is $d$-dimensional, and Monte Carlo averaging buys a quadratic memory reduction at the price of statistical noise. The same issue of *Physical Review A* carried the Dum–Zoller–Ritsch construction [13], with an essentially identical algorithm derived from a different starting point — discretizing the Born-series expansion of the reduced atom dynamics over the electromagnetic vacuum. The Mølmer–Castin–Dalibard JOSA B [20] of the following year is the most complete pedagogical statement and is the one almost universally cited in the European literature.\n\nCarmichael's *Open Systems Approach to Quantum Optics* [14], built from Oregon and Texas lectures delivered between 1989 and 1991, gave the third independent derivation, and the one of deepest physical content. Where DCM and DZR begin from the master equation and ask how to simulate it, Carmichael begins from the photon-counting measurement record. Applying Srinivas–Davies / Davies counting theory to a cascaded source–detector system, he derives a stochastic Schrödinger equation in which the jump $|\\psi\\rangle \\mapsto L_k|\\psi\\rangle/\\lVert\\cdot\\rVert$ is *literally the state update consequent on registering a click at channel $k$*. The unraveling is thereby promoted from a numerical trick to a physically interpretable object: the trajectory is the experimenter's best estimate of the system state given a specific detection record. The Plenio–Knight review [11] is the document that unified the two pictures under the single rubric \"quantum-jump approach\", explicitly acknowledged Carmichael's independent derivation, and fixed the modern terminology.\n\nCitation patterns bifurcated regionally and have largely stayed that way. European papers — particularly those tracing intellectual descent from the Paris and Aarhus schools — cite [12, 20] for the method. North American papers, and especially those rooted in cavity QED at Caltech, Texas, and Auckland, cite [14]. Plenio and Knight noted this split in 1998 [11]; thirty years on, an arXiv keyword search would still reveal it.\n\n### The decisive conceptual point: unraveling-dependence\n\nThe same Lindblad equation admits *infinitely many* stochastic unravelings, all reproducing the same $\\rho(t)$ on average. Replace direct photodetection by balanced homodyne detection of the output field, and the discontinuous jump $|\\psi\\rangle \\mapsto L_k|\\psi\\rangle/\\lVert\\cdot\\rVert$ is replaced by a continuous *quantum state diffusion*\n\n$$d|\\psi\\rangle \\;=\\; \\Big[-\\tfrac{i}{\\hbar}H - \\tfrac{1}{2}\\sum_k(L_k^\\dagger L_k - 2\\langle L_k^\\dagger\\rangle L_k + |\\langle L_k\\rangle|^2)\\Big]|\\psi\\rangle\\,dt \\;+\\; \\sum_k (L_k - \\langle L_k\\rangle)|\\psi\\rangle\\,dW_k,$$\n\nwith $dW_k$ real Wiener increments. The state never jumps; it executes a continuous trajectory whose ensemble average is, again, the Lindblad $\\rho(t)$. Different unravelings correspond to different physical apparatuses placed on the *same* dissipative channel; the choice of unraveling is the choice of measurement basis on the environment.\n\nThe methodological consequence is a discipline that the modern literature still routinely fails to enforce. The MCWF \"quantum jump\" is *not* a feature of the open quantum system as such — it is a feature of the joint description (system + chosen environmental measurement). Two experiments differing only in whether they photodetect or homodyne the emitted light will record, respectively, jumps and diffusion for the very same atomic dynamics. To assert that the system \"really\" jumps is therefore a category mistake of the same flavour as the BKS-vs-Bohr–Geiger confusion of 1924–1925, displaced from photons to detector design.\n\nThis is also the precise sense in which the 1992–1993 formalism prepared the ground for Minev 2019 [21, 7]. If the inter-click no-jump branch is a continuous, deterministic, non-Hermitian evolution that sharpens the state under negative measurement results, then conditioning on a long enough no-jump segment must, in principle, predict the next jump and allow it to be aborted mid-flight. The §7 catch-and-reverse experiment is the operational vindication of a feature that was already algebraically present in the DCM / DZR / Carmichael construction — for twenty-seven years before anyone built the apparatus to see it.\n\n### What the algorithm did to the word \"jump\"\n\nBy 1998 the word \"quantum jump\" carried four distinct technical meanings depending on which community spoke it: Bohr's spectroscopic transition, the Copenhagen measurement postulate, the macroscopic fluorescence-telegraph event of the 1986 ion experiments, and the conditional state update of an MCWF trajectory under photodetection unraveling. These are not synonymous; the trajectory unraveling is the most operationally precise of the four and the only one with an algorithm attached. §6 disentangles the four; the rest of the dossier uses *jump* in the trajectory-theoretic sense unless flagged otherwise."}, {"id": "conflations-and-validity", "title": "What the Literature Confuses: Four Distinct Things Called 'Quantum Jump'", "markdown": "## What the Literature Confuses: Four Distinct Things Called 'Quantum Jump'\n\nThe phrase *quantum jump* (and its German ancestor *Quantensprung*) carries at least four technically distinct meanings that the literature — including refereed literature — routinely runs together. The conflations are not pedantic: they propagate into wrong claims about Markovianity, instantaneity, observer-independence, and even the direction of magnitude (the colloquial inversion). What follows is a taxonomy, with the regime of validity for each, and an audit of which equations survive which translation.\n\n### (i) The Bohr jump: a spectral statement\n\nBohr's 1913 postulate [1] is a statement about the *spectrum* of a bound system, not about its dynamics. The content is:\n\n$$h\\nu_{mn} \\;=\\; E_m - E_n,$$\n\nwith $\\{E_n\\}$ discrete and the transition allowed only between members of this discrete set. Nothing in this statement requires a time, a duration, or a stochastic law. It survives unchanged in modern QED: it is the energy-conservation constraint on the matrix element $\\langle m \\mid H_{\\mathrm{int}} \\mid n\\rangle$ that appears in Fermi's golden rule. The \"jump\" here is a *kinematic* discreteness, not a *temporal* event.\n\nThis meaning is unraveling-independent, measurement-independent, and basis-fixed (by $H_0$). It is also Markovianity-independent: non-Markovian dynamics do not soften the discreteness of the bound-state spectrum.\n\n### (ii) The Copenhagen collapse: a postulate about the unconditioned state\n\nThe second meaning is the von Neumann/Lüders projection acting on the *unconditioned* density matrix after a measurement outcome $k$:\n\n$$\\rho \\;\\longrightarrow\\; \\frac{P_k \\rho P_k}{\\operatorname{Tr}(P_k \\rho P_k)}.$$\n\nThis is the \"jump\" Schrödinger objected to in Copenhagen in 1926 and again in [3, 4]: a discontinuous, instantaneous, observer-triggered change of the state vector. Its theoretical status is *postulational* — it sits outside the unitary part of the theory and is the operational target of every interpretation-of-QM dispute. It is generically *not* the same as (i): a collapse can be onto a degenerate subspace or onto a continuous-spectrum POVM element with no Bohr-discrete content, and a Bohr transition leaves no fingerprint on the unconditioned $\\rho$ if the environment is unread.\n\nConflation watch: the standard pedagogical sentence \"the atom jumps from $\\mid m\\rangle$ to $\\mid n\\rangle$ and emits a photon\" elides (i) and (ii) by identifying the discrete spectral label with the post-measurement projector. The identification is correct only in the idealized limit where the photon detector is perfect, prompt, and frequency-resolving — which is exactly what the 1986 shelving experiments engineered, not what the postulate guarantees.\n\n### (iii) The trajectory jump: a conditional state update inside an unraveling\n\nThe third meaning is the one used in the Monte Carlo wavefunction / quantum-trajectory literature [12, 13, 14, 20, 11]. Given a Lindblad master equation\n\n$$\\dot\\rho \\;=\\; -\\tfrac{i}{\\hbar}[H,\\rho] + \\sum_k \\!\\Big( L_k \\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\}\\Big),$$\n\nan *unraveling* is a stochastic process on pure states whose ensemble average reproduces $\\rho(t)$. In the photon-counting unraveling, between detector clicks the state evolves under the non-Hermitian effective Hamiltonian\n\n$$H_{\\mathrm{eff}} \\;=\\; H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k,$$\n\nand at a click of channel $k$ the state is updated discontinuously:\n\n$$\\mid\\psi\\rangle \\;\\longrightarrow\\; \\frac{L_k\\mid\\psi\\rangle}{\\| L_k\\mid\\psi\\rangle\\|}.$$\n\nThis is the *trajectory jump*. Three features distinguish it from (ii):\n\n1. It is *conditional* on a specific measurement record. The unconditioned $\\rho$ — obtained by averaging over all records — evolves smoothly.\n2. It is *unraveling-dependent*. Replace the photon counter with a homodyne detector and the same master equation unravels into a continuous diffusive stochastic Schrödinger equation with no jumps at all. The Lindblad generator is invariant under the unitary mixing $L_k \\mapsto \\sum_j U_{kj} L_j$ that converts jump records into diffusive records.\n3. It is *operational*. The post-click state is whatever Bayes' rule prescribes given the click; there is no extra metaphysical commitment.\n\nCarmichael's photon-counting derivation [14] is the version that makes (iii) physically rather than algorithmically motivated — a point under-credited in the European citation tradition.\n\nConflation watch: a trajectory jump is *not* a Copenhagen collapse. It collapses the *conditional* state, not the *unconditioned* one, and only relative to a chosen measurement scheme. Statements of the form \"decoherence proves wavefunctions really collapse via Lindblad jumps\" confuse (ii) and (iii).\n\n### (iv) The colloquial \"quantum leap\"\n\nThe fourth meaning is not a physical concept at all. In English popular usage *quantum leap* denotes a large, transformative advance. Physically, the elementary jump is the *smallest possible* change a quantized system can undergo — one quantum. The popular meaning is the technical meaning inverted in magnitude. *Quantensprung* in German has drifted the same way. No equation, but worth flagging in any pedagogical context because the inversion seeds wrong intuition before the student opens the textbook.\n\n### Markovianity and instantaneity: where the standard slogans fail\n\nTwo slogans circulate that are correct only inside (iii) in the Born–Markov regime, and are routinely over-quoted:\n\n- *\"Quantum jumps are instantaneous.\"* True of the trajectory update rule $\\mid\\psi\\rangle \\to L_k\\mid\\psi\\rangle/\\|\\cdot\\|$ as a mathematical object, because the update is a single application of an operator at a single time. False as a statement about nature: the inter-click evolution under $H_{\\mathrm{eff}}$ has finite, predictable, *continuous* structure, and the catch-and-reverse experiment [21, 7] resolves precisely that structure. What is \"instantaneous\" is the bookkeeping convention chosen by the unraveler, not a physical duration. An experimental upper bound on any genuine duration is given in [18].\n- *\"Quantum jumps are Markovian.\"* True only when $L_k$ are time-independent Lindblad operators and the environment correlation time is negligible. The non-Markovian quantum jump formalism of Piilo, Maniscalco, Härkönen and Suominen [15] constructs jumps with memory-kernel-dependent rates that can be negative-probability in intermediate steps and can be *reversed* — the trajectory genuinely runs backward on the relevant time scales. The reversibility is structurally compatible with [7] and incompatible with the popular \"jumps = irreversible collapse\" reading.\n\nBoth slogans live or die with the unraveling, not with the physics.\n\n### Which formulas survive which translation\n\n| Formula | Meaning it lives in | Survives outside? |\n|---|---|---|\n| $h\\nu_{mn} = E_m - E_n$ | (i) spectral | yes; survives non-Markovian, multi-photon, dressed-state regimes — it is a constraint on matrix elements |\n| Einstein $A_{mn}, B_{mn}$ rates [2] | (i) + Poisson statistics | survives in the weak-coupling, broadband-bath limit; fails in structured reservoirs and cavity QED strong-coupling |\n| $\\rho \\to P_k\\rho P_k/\\mathrm{Tr}(\\cdot)$ | (ii) Copenhagen | survives as a POVM update; the projective form fails for inefficient or noisy detectors |\n| $\\mid\\psi\\rangle \\to L_k\\mid\\psi\\rangle/\\|\\cdot\\|$ | (iii) jump unraveling | does not survive an unraveling change; replaced by a stochastic Schrödinger equation under homodyne |\n| $H_{\\mathrm{eff}} = H - \\tfrac{i\\hbar}{2}\\sum L_k^\\dagger L_k$ | (iii) Markov | replaced by a memory-kernel non-Hermitian generator in [15]; the simple form fails for non-Markovian baths |\n| \"Quantum leap = big advance\" | (iv) colloquial | survives nowhere in physics |\n\nThe taxonomy is the point: when a paper says *quantum jump*, the first job of a careful reader is to ask *which of (i)–(iv)*, and the second is to ask *what is the unraveling*. Most disputes in the foundational literature — including the one Schrödinger lost rhetorically in 1926 and won structurally in 2019 — dissolve once those two questions are answered."}, {"id": "catch-and-reverse", "title": "The Jump Caught Mid-Flight: Minev 2019 and the Vindication of Schrödinger", "markdown": "## The Jump Caught Mid-Flight: Minev 2019 and the Vindication of Schrödinger\n\nIn June 2019 a Yale–Devoret team published a measurement whose title read like a historical taunt: *To catch and reverse a quantum jump mid-flight* [7]. The headline result is that the jump from a bright cycling manifold to a long-lived dark state — the discontinuity Bohr had postulated [1] and the artefact Schrödinger had insisted was bookkeeping [3, 4] — can be monitored as a smooth, predictable, deterministic excursion through Hilbert space, and stopped before it completes. The physical substrate is a superconducting transmon, not a trapped ion, but the underlying object is the photon-counting unraveling of a three-level Lindblad system, exactly what [12, 13, 14] were written to compute.\n\n### The effective atom and the record\n\nThe transmon is operated as a synthetic three-level system with states $|G\\rangle$, $|B\\rangle$, $|D\\rangle$. $|B\\rangle$ plays the role of Dehmelt's strong cycling level [17] with radiative rate $\\gamma_B$, while $|D\\rangle$ is the shelved metastable state with $\\gamma_D\\ll\\gamma_B$. Two coherent drives,\n$$H_d/\\hbar \\;=\\; \\tfrac{1}{2}\\Omega_{BG}(\\sigma^+_{BG}+\\text{h.c.}) + \\tfrac{1}{2}\\Omega_{DG}(\\sigma^+_{DG}+\\text{h.c.}),$$\nrealize the bright cycling transition and the weak $G\\!\\leftrightarrow\\!D$ coupling. The experiment does not detect fluorescence directly. Instead the transmon is dispersively coupled to a readout cavity tuned so that only $|B\\rangle$ shifts the cavity frequency appreciably; a continuously injected probe is monitored by a near-quantum-limited parametric amplifier in heterodyne. A \"click\" is a binarized excursion of the integrated heterodyne record into the $B$ bin. In the operator language of [14], the unraveling is generated by\n\n$$L_B = \\sqrt{\\gamma_B}\\,|G\\rangle\\!\\langle B|,\\qquad L_D = \\sqrt{\\gamma_D}\\,|G\\rangle\\!\\langle D|,$$\n\nand the cavity acts as the photon counter for $L_B$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eCatch-and-reverse protocol\u003c/title\u003e\u003cg fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.4\" font-family=\"serif\" font-size=\"14\"\u003e\u003ctext x=\"40\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\"\u003eThree-level effective atom\u003c/text\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"240\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"32\" y=\"345\" fill=\"#e8e6e1\"\u003e|G⟩\u003c/text\u003e\u003cline x1=\"60\" y1=\"170\" x2=\"170\" y2=\"170\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"32\" y=\"174\" fill=\"#7aa2ff\"\u003e|B⟩\u003c/text\u003e\u003cline x1=\"190\" y1=\"95\" x2=\"300\" y2=\"95\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"306\" y=\"99\" fill=\"#ffb86b\"\u003e|D⟩ (dark)\u003c/text\u003e\u003cline x1=\"100\" y1=\"340\" x2=\"100\" y2=\"170\" stroke=\"#7aa2ff\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"108\" y=\"262\" fill=\"#7aa2ff\"\u003eΩ_BG strong\u003c/text\u003e\u003cline x1=\"215\" y1=\"340\" x2=\"235\" y2=\"95\" stroke=\"#ffb86b\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"240\" y=\"220\" fill=\"#ffb86b\"\u003eΩ_DG weak\u003c/text\u003e\u003cpath d=\"M 145 170 C 175 225 175 295 150 340\" stroke=\"#7ee0a3\" stroke-width=\"1.2\"/\u003e\u003cpolygon points=\"150,340 153,332 147,332\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"165\" y=\"270\" fill=\"#7ee0a3\"\u003eγ_B (clicks)\u003c/text\u003e\u003ctext x=\"380\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\"\u003eHeterodyne record I(t) and protocol\u003c/text\u003e\u003cline x1=\"370\" y1=\"220\" x2=\"710\" y2=\"220\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"700\" y=\"240\" fill=\"#e8e6e1\"\u003et\u003c/text\u003e\u003cg stroke=\"#7aa2ff\" stroke-width=\"1.4\"\u003e\u003cline x1=\"380\" y1=\"220\" x2=\"382\" y2=\"168\"/\u003e\u003cline x1=\"395\" y1=\"220\" x2=\"397\" y2=\"158\"/\u003e\u003cline x1=\"410\" y1=\"220\" x2=\"412\" y2=\"173\"/\u003e\u003cline x1=\"425\" y1=\"220\" x2=\"427\" y2=\"163\"/\u003e\u003cline x1=\"440\" y1=\"220\" x2=\"442\" y2=\"170\"/\u003e\u003cline x1=\"455\" y1=\"220\" x2=\"457\" y2=\"160\"/\u003e\u003cline x1=\"470\" y1=\"220\" x2=\"472\" y2=\"175\"/\u003e\u003c/g\u003e\u003ctext x=\"380\" y=\"148\" fill=\"#7aa2ff\"\u003ebright clicks (in |B⟩)\u003c/text\u003e\u003crect x=\"490\" y=\"155\" width=\"95\" height=\"65\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"488\" y=\"148\" fill=\"#ffb86b\"\u003esilent window Δτ_catch\u003c/text\u003e\u003cline x1=\"538\" y1=\"220\" x2=\"538\" y2=\"262\" stroke=\"#ffb86b\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"490\" y=\"280\" fill=\"#ffb86b\"\u003eno-click ⇒ P(D∣R) ↑\u003c/text\u003e\u003cpath d=\"M 538 318 Q 600 282 660 318\" stroke=\"#ff7a90\" stroke-width=\"1.6\"/\u003e\u003cpolygon points=\"660,318 652,314 656,322\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"540\" y=\"345\" fill=\"#ff7a90\"\u003ereverse pulse U_rev\u003c/text\u003e\u003cg stroke=\"#7ee0a3\" stroke-width=\"1.4\"\u003e\u003cline x1=\"615\" y1=\"220\" x2=\"617\" y2=\"170\"/\u003e\u003cline x1=\"630\" y1=\"220\" x2=\"632\" y2=\"160\"/\u003e\u003cline x1=\"645\" y1=\"220\" x2=\"647\" y2=\"172\"/\u003e\u003cline x1=\"660\" y1=\"220\" x2=\"662\" y2=\"162\"/\u003e\u003c/g\u003e\u003ctext x=\"610\" y=\"148\" fill=\"#7ee0a3\"\u003erecovered bright\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\n*Figure: Left — the transmon as a three-level effective atom. A strong drive $\\Omega_{BG}$ cycles $G\\!\\leftrightarrow\\!B$ with rapid spontaneous emission $\\gamma_B$, while a weak $\\Omega_{DG}$ couples $G$ to the long-lived dark $D$. Right — the dispersive heterodyne record produces a stream of bright clicks; a silent window $\\Delta\\tau_{\\rm catch}$ raises the conditional probability of $|D\\rangle$, triggering a tailored unitary $U_{\\rm rev}$ that returns the trajectory to $G$ before the jump completes, after which clicks resume.*\n\n### What the no-click record encodes\n\nBetween clicks the conditional state $|\\psi_c(t)\\rangle$ evolves under the non-Hermitian effective Hamiltonian\n$$H_{\\rm eff} \\;=\\; H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k \\;=\\; H - \\tfrac{i\\hbar}{2}\\bigl(\\gamma_B P_B + \\gamma_D P_D\\bigr),$$\nrenormalized at every instant. This is the precise content of the Dalibard–Castin–Mølmer and Dum–Zoller–Ritsch unravelings [12, 13, 20]: the no-jump propagator is a deterministic Hilbert-space rotation, not passive waiting. In the textbook Bohr picture nothing is happening during a dark interval. In the trajectory picture, the absence of clicks is information, and Bayes' rule converts that information into a continuous sweep of conditional amplitude from $|G\\rangle$ toward $|D\\rangle$. The longer the silence, the further the conditional state has rotated.\n\nThis is the structural point Schrödinger pressed in [3, 4]: the wavefunction is continuous; what is discontinuous is the *bookkeeping* the observer imposes when they declare that \"a jump happened\". Minev *et al.* write this point into hardware. Their conditional tomography reconstructs the latitude of $|\\psi_c\\rangle$ on the $G$–$D$ meridian as a smooth, monotonic, and — averaged over silent windows of equal duration — *deterministic* function of $\\Delta\\tau$. The trajectory is reproducible from shot to shot; the click time is not.\n\n### Catch and reverse\n\nThe catch protocol is a real-time decision rule. One fixes a click-free threshold $\\Delta\\tau_{\\rm catch}$ short enough that an ordinary inter-click pause is unlikely to exceed it ($\\Delta\\tau_{\\rm catch}\\gg\\gamma_B^{-1}$), but long enough that the effective $G\\!\\to\\!D$ pumping has had time to rotate $|\\psi_c\\rangle$ a known finite angle on the meridian. When the record has been silent for $\\Delta\\tau_{\\rm catch}$, the conditional state lies at a *computed* point of the $G$–$D$ great circle, and the experimenter applies a tailored unitary $U_{\\rm rev}$ — a partial rotation about the axis fixed by that geometry — that returns it to $|G\\rangle$. A subsequent reappearance of bright fluorescence within a calibration window confirms that the impending dark transition has been aborted. The reported reversal fidelity in [7] is large enough that the catch ensemble is statistically distinguishable from any model in which the inter-click trajectory is unphysical bookkeeping; in the favorable post-selected branch it exceeds $99\\%$.\n\nTwo things must be said about what this does *not* do. It does not violate Born statistics: averaged over the silent-window ensemble, the dark and reversed-outcome probabilities reproduce the standard Lindblad master-equation prediction, exactly as required by the Plenio–Knight equivalence theorem [11]. And it does not abolish discreteness: the asymptotic projectors $P_B$ and $P_D$ are precisely the spectral objects Bohr's 1913 postulate [1] selected, and the radiative click of $L_B$ remains an instantaneous Poissonian event whose statistics obey Einstein's $A$-coefficient law [2]. What is overturned is the textbook claim that the *macroscopic transition between the two manifolds* is itself instantaneous and irreducible.\n\n### Whose picture wins\n\nThe catch-and-reverse experiment is best read as the joint empirical embodiment of three theoretical claims that the literature had presented in isolation. First, the Plenio–Knight unification [11] — the conditional non-Hermitian evolution between clicks is physical, not fictional. Second, Carmichael's photon-counting interpretation [14] — the jump lives in the *record*; the trajectory lives in Hilbert space. Third, Schrödinger's 1952 contention [3, 4] that the underlying dynamics is continuous and the discontinuity is an artefact of the projection step. The 1986 telegraph signals [8, 9, 10] were consistent with all three but discriminated between none, because their bandwidth integrated over the inter-click dynamics. Minev *resolves* the inter-click dynamics, and the resolution is smooth.\n\nA final clarification, since the result is repeatedly miscast in popular and secondary accounts. The \"jump\" that is reversed is not the elementary radiative emission — that remains an instantaneous click of $L_B$. The \"jump\" is the *macroscopic* discrete change of which manifold the system is found in: bright versus dark. Bohr's 1913 postulate [1], Einstein's 1917 statistics [2], the 1986 telegraph signal [8, 9, 10], the MCWF stochastic update [12, 13, 20], and Minev's catch-and-reverse [7] refer to four different temporal scales of the same word. Once those scales are separated, Bohr's discreteness and Schrödinger's continuity address disjoint parts of the picture and do not collide. It took a century, and a transmon coupled to a quantum-limited amplifier, to make the disjointness experimentally visible."}, {"id": "frontier-and-open-problems", "title": "Frontier: Non-Markovian Jumps, Continuous Measurement, and What Remains Genuinely Open", "markdown": "## Frontier: Non-Markovian Jumps, Continuous Measurement, and What Remains Genuinely Open\n\nThree threads currently animate the quantum-jump literature, none of them closed. They concern (i) the structure of jumps when the bath has memory, (ii) the physical, not merely computational, status of the choice between jump and diffusive unravelings, and (iii) the thermodynamic bookkeeping that the trajectory picture has made possible. Around all three sits an older question that 1992–1998 did not answer and 2019 only sharpened: does any unraveling deserve ontological weight, or are trajectories strictly an observer-conditioned bookkeeping device over the smoothly evolving density matrix?\n\n### Memory, negativity, and reversed jumps\n\nThe Markovian Lindblad master equation guarantees a completely positive evolution with rate functions that are everywhere non-negative; the standard MCWF algorithm of [12, 13, 20] exploits this to read each Lindblad operator as a Poissonian click. Once the Born–Markov assumption is relaxed, the time-local generator carries decay rates that can transiently turn negative — the canonical signature of a non-Markovian environment.\n\nThe non-Markovian quantum jump (NMQJ) construction of Piilo, Maniscalco, Härkönen and Suominen [15] addresses this directly by promoting negative rates to a second class of jump events that *reverse* a previously executed click and restore the ensemble member to its pre-jump state, with a probability fixed by the requirement that the unconditioned average reproduces the time-local master equation. The construction is unbiased, sample-efficient, and crucially it makes the jump no longer the smallest irreversible event in the theory: information leaked into the bath can flow back. A recent driven-dissipative extension, [Non-Markovian Quantum Jump Method for Driven-Dissipative Two-Level Systems](https://arxiv.org/abs/2502.00764), generalizes the prescription to non-perturbative drive regimes where the eigen-operators of the dissipator themselves carry memory.\n\nWhat NMQJ does *not* settle is whether a reversed jump is a faithful record of a physical detection event. In a standard photon-counting unraveling each click corresponds to a click at a real photodiode; in the non-Markovian setting \"reversal\" corresponds to a re-absorption of structured-bath excitations whose detection requires monitoring the bath in a regime where photodetection language no longer applies cleanly. The mathematical object is well defined; the experiment that turns it into an operational protocol is still missing.\n\n### Jump versus diffusion are not the same physics\n\nA common but wrong reading of the 1992 unravelings [12, 13] is that they are gauges over the same Lindblad equation. They are not. Two unravelings agree only at the level of the unconditioned $\\rho(t)$; the conditional trajectories, and therefore the measurement records that generate them, are physically distinct. For a single decay channel with collapse operator $c$ and Hamiltonian $H$, the homodyne stochastic master equation with local-oscillator phase $\\phi$ reads\n\n$$d\\rho_c \\;=\\; -i[H,\\rho_c]\\,dt \\;+\\; \\mathcal{D}[c]\\rho_c\\,dt \\;+\\; \\mathcal{H}[c\\,e^{-i\\phi}]\\rho_c\\,dW,$$\n\nwhile the photon-counting jump equation reads\n\n$$d\\rho_c \\;=\\; -i[H,\\rho_c]\\,dt \\;+\\; \\mathcal{D}[c]\\rho_c\\,dt \\;+\\; \\Big( \\tfrac{c\\,\\rho_c\\,c^\\dagger}{\\mathrm{Tr}(c\\,\\rho_c\\,c^\\dagger)} - \\rho_c \\Big)\\,dN, \\qquad \\mathbb{E}[dN] = \\mathrm{Tr}(c\\,\\rho_c\\,c^\\dagger)\\,dt.$$\n\nBoth ensemble-average to $\\dot\\rho = -i[H,\\rho]+\\mathcal{D}[c]\\rho$. They differ in the back-action: a click projects the conditional state non-linearly and discontinuously onto $c\\rho_c c^\\dagger / \\mathrm{Tr}(\\cdot)$, while homodyne back-action diffuses it on the Bloch sphere. A 2014 New J. Phys. result, [*Quantum jumps are more quantum than quantum diffusion*](https://iopscience.iop.org/article/10.1088/1367-2630/16/6/063028), proved that there exist conditional pure-state ensembles preparable only through the jump unraveling: no detector configuration of finite efficiency reproduces them diffusively. The two unravelings are therefore not interchangeable representations but correspond to physically distinct measurement back-actions, and only one of them is instantiated in any given experiment. This is the operational content of the 2012 Wiseman–Gambetta question [*Are dynamical quantum jumps detector-dependent?*](https://arxiv.org/abs/1110.0069): the answer is yes, and that fact is not interpretive softness — it is structural.\n\n### Trajectory thermodynamics and the stochastic entropy of a click\n\nOnce a trajectory is a well-defined object, it can carry energetic accounting. Horowitz (Phys. Rev. E 85, 031110, 2012) and the subsequent Horowitz–Parrondo–Manzano line define heat exchanged with the bath as the sum over clicks of the energy quanta carried away,\n\n$$Q[\\gamma] \\;=\\; \\sum_{t_k \\in \\gamma} \\big(E_{f_k} - E_{i_k}\\big),$$\n\nand stochastic entropy production along a quantum-jump trajectory $\\gamma$ as the log-ratio of forward to time-reversed path weights. A trajectory fluctuation theorem $\\langle e^{-\\Sigma}\\rangle = 1$ then follows, generalizing Crooks/Jarzynski into the open-quantum regime; conditional fluctuation theorems under imperfect detection have since been written down ([arXiv:2308.08491](https://arxiv.org/abs/2308.08491)). Two features distinguish this from the classical case. (i) Heat is operationally defined only relative to a chosen unraveling — a homodyne observer records a continuously fluctuating heat current with no isolated quanta; a photon-counting observer records the same total $\\langle Q\\rangle$ as a sum of discrete jumps. (ii) Conditioning on a *no-click* segment, which evolves the state by the non-Hermitian effective Hamiltonian $H_{\\mathrm{eff}} = H - \\tfrac{i}{2}c^\\dagger c$, nevertheless updates entropy because it updates the observer's information. The Maxwell-demon limit of this is being probed in superconducting and trapped-ion platforms but remains bounded by detection efficiency rather than by principle.\n\n### Does any unraveling correspond to \"what happens\"?\n\nThe 2019 Yale catch-and-reverse experiment [7] removed one classical worry — that between detection events nothing definite is happening — by exhibiting the inter-click trajectory as continuous, predictable from the no-click record, and reversible by a unitary pulse. This vindicates Schrödinger's 1952 position [4] structurally without endorsing his hostility to discrete spectra. But it does not select a preferred unraveling: the Yale data are consistent with the conditional state under the photon-counting unraveling appropriate to their detector, and a homodyne setup on the same Hamiltonian would have generated a different conditional ontology with the same long-time average. Wiseman's three-way taxonomy — trajectories as numerical artifact, as subjectively real, or as physically real — remains unsettled. A reasonable working position is that the conditional state is real *given* the detector, that the choice of detector is a physical degree of freedom not a metaphysical one, and that the unconditioned $\\rho(t)$ is the only observer-independent object in the formalism. This is closer to QBism than to many-worlds, but no current experiment forces it.\n\n### What is mathematics, what is experiment\n\n- *Mathematical.* A constructive non-Markovian unraveling with positive measure on path space for arbitrary memory kernels (existing schemes handle specific kernel families); a complete classification of when two unravelings are statistically equivalent at the trajectory level rather than only at the ensemble level; a general fluctuation theorem encompassing jump, diffusive, and adaptive unravelings on equal footing.\n- *Experimental.* A non-Markovian catch-and-reverse, in which the NMQJ reversed-jump prediction is tested against a structured-reservoir circuit-QED record; a head-to-head diffusive/jump steering experiment on a single emitter realizing the Wiseman–Gambetta protocol; a Maxwell-demon engine whose work output is bounded by trajectory entropy rather than by detector noise; and a temporal-resolution improvement on Minev-class measurements sufficient to test whether the inter-click flight is genuinely continuous or merely fast on the present detector bandwidth.\n\nThe 1913 postulate [1] is not in doubt; the 1917 statistics [2] are not in doubt; the 1986 telegraph signal [8, 9, 10] is not in doubt. What remains genuinely open is whether the *trajectory* — and therefore the jump as an event in the world rather than in our records — is the right level of physical description. A century in, the question Schrödinger and Bohr argued about in Copenhagen in 1926 [16] is not settled. It has only been made experimentally addressable."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough of this dossier in the third person. Here is where I stand.\n\n### (a) What I would defend with my reputation\n\nThe quantum jump, as it is *actually used* in working quantum optics in 2026, is a theorem about conditional dynamics, not a postulate about nature. Given a Born–Markov system–bath coupling, an unconditioned Lindblad evolution $\\dot\\rho = -\\tfrac{i}{\\hbar}[H,\\rho] + \\sum_k \\mathcal{D}[L_k]\\rho$, and a specified measurement record $\\{t_j, k_j\\}$, the conditional state evolves as continuous non-Hermitian propagation under $H_{\\mathrm{eff}} = H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k$ punctuated by discrete updates $\\lvert\\psi\\rangle \\mapsto L_{k_j}\\lvert\\psi\\rangle / \\lVert\\cdot\\rVert$ at click times. This is mathematically derivable, experimentally instantiated, and unraveling-dependent. I will defend that statement.\n\nI will also defend the historical claim that the 1986 telegraph experiments were a triple — Seattle, Hamburg, NIST — and that pedagogical accounts that name only Dehmelt are simply wrong [8, 9, 10]. And I will defend that Einstein 1917, not Bohr 1913, is the ancestor of every rate that appears in a modern master equation.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely smuggled past the reader.\n\nFirst, **Born–Markov universality**. The clean separation of timescales $\\tau_B \\ll \\tau_S$ underwrites Lindblad form, instantaneous jumps, and the entire MCWF apparatus. In structured reservoirs — photonic band edges, strongly coupled cavity arrays, low-temperature solid-state baths — this separation fails, and the \"jump\" stops being an event at all. Piilo's reversible non-Markovian jumps are not an exotic edge case; they are what happens generically once you leave Wigner–Weisskopf.\n\nSecond, **detector idealization**. The MCWF derivation assumes unit-efficiency, instantaneous, projective photodetection. Real heterodyne efficiencies, dark counts, and finite detector bandwidths mean the \"unraveling\" implemented in the lab is never the one written in the paper. The community is casual about this.\n\nThird, **the no-click record is treated as informationally cheap**. Minev 2019 demonstrated the opposite: the *absence* of clicks carries enough Bayesian weight to render a jump predictable and reversible [7]. Most quantum-jump pedagogy still describes inter-click evolution as \"nothing happens,\" which is false in exactly the way Schrödinger insisted in 1952.\n\n### (c) Three questions I would actually work on\n\n1. **Operational invariants across unravelings.** What functionals of the trajectory ensemble are independent of detection scheme? This is the right way to ask \"which jumps are physical.\" Currently unanswered cleanly.\n2. **Non-Markovian jump thermodynamics.** Stochastic thermodynamics of trajectories assumes Markovianity; entropy production along a reversible non-Markovian jump is not yet a settled object.\n3. **Continuous-measurement back-action in solid-state qubits at the dispersive limit's edge.** Minev's protocol worked because the readout was deep in the dispersive regime; the interesting physics is where it isn't, and where measurement back-action stops being a small correction.\n\n### (d) Reading path\n\n1. Einstein 1917, *Zur Quantentheorie der Strahlung* — the actual origin of the rates everyone attributes to Bohr.\n2. Schrödinger 1952, *Are there quantum jumps?* [in the dossier's §3 corpus] — read it as a research program, not a complaint.\n3. Carmichael 1993, *An Open Systems Approach to Quantum Optics* — the photon-counting derivation that gives the jump its operational meaning; the French–Danish PRL is the algorithm, this is the physics.\n4. Plenio \u0026 Knight 1998, *Rev. Mod. Phys.* review of the MCWF method — the cleanest single-source synthesis of the 1992–93 triple parentage. (verify)\n5. Minev et al. 2019, *Nature* 570, 200 [7] — read last, with Schrödinger 1952 open beside it; the experiment is a citation of the philosophy."}], "references": [{"n": 1, "title": "On the Constitution of Atoms and Molecules", "authors": ["Niels Bohr"], "year": 1913, "venue": "Philosophical Magazine, Series 6, Vol. 26, pp. 1–25, 476–502, 857–875", "url": "https://doi.org/10.1080/14786441308634955", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Zur Quantentheorie der Strahlung", "authors": ["Albert Einstein"], "year": 1917, "venue": "Physikalische Zeitschrift 18, 121–128 (originally Mitt. Phys. Ges. Zürich 16, 1916)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Are There Quantum Jumps? Part I", "authors": ["Erwin Schrödinger"], "year": 1952, "venue": "British Journal for the Philosophy of Science 3(10), 109–123", "url": "https://doi.org/10.1093/bjps/III.10.109", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Are There Quantum Jumps? Part II", "authors": ["Erwin Schrödinger"], "year": 1952, "venue": "British Journal for the Philosophy of Science 3(11), 233–242", "url": "https://doi.org/10.1093/bjps/III.11.233", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "The Quantum Theory of Radiation", "authors": ["Niels Bohr", "Hendrik A. Kramers", "John C. Slater"], "year": 1924, "venue": "Philosophical Magazine, Series 6, Vol. 47, pp. 785–802", "url": "https://doi.org/10.1080/14786442408565262", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Über das Wesen des Comptoneffekts; ein experimenteller Beitrag zur Theorie der Strahlung", "authors": ["Walther Bothe", "Hans Geiger"], "year": 1925, "venue": "Zeitschrift für Physik 32, 639–663", "url": "https://doi.org/10.1007/BF01331702", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "To catch and reverse a quantum jump mid-flight", "authors": ["Z. K. Minev", "S. O. Mundhada", "S. Shankar", "P. Reinhold", "R. Gutiérrez-Jáuregui", "R. J. Schoelkopf"], "year": 2019, "venue": "Nature 570, 200–204", "url": "https://doi.org/10.1038/s41586-019-1287-z", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Shelved Optical Electron Amplifier: Observation of Quantum Jumps", "authors": ["Warren Nagourney", "Jon Sandberg", "Hans Dehmelt"], "year": 1986, "venue": "Physical Review Letters 56, 2797", "url": "https://doi.org/10.1103/PhysRevLett.56.2797", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Observation of Quantum Jumps", "authors": ["Th. Sauter", "W. Neuhauser", "R. Blatt", "P. E. Toschek"], "year": 1986, "venue": "Physical Review Letters 57, 1696", "url": "https://doi.org/10.1103/PhysRevLett.57.1696", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Observation of Quantum Jumps in a Single Atom", "authors": ["J. C. Bergquist", "Randall G. Hulet", "Wayne M. Itano", "David J. Wineland"], "year": 1986, "venue": "Physical Review Letters 57, 1699", "url": "https://doi.org/10.1103/PhysRevLett.57.1699", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "The quantum-jump approach to dissipative dynamics in quantum optics", "authors": ["Martin B. Plenio", "Peter L. Knight"], "year": 1998, "venue": "Reviews of Modern Physics 70, 101", "url": "https://doi.org/10.1103/RevModPhys.70.101", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Wave-function approach to dissipative processes in quantum optics", "authors": ["Jean Dalibard", "Yvan Castin", "Klaus Mølmer"], "year": 1992, "venue": "Physical Review Letters 68, 580", "url": "https://doi.org/10.1103/PhysRevLett.68.580", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Monte Carlo simulation of the atomic master equation for spontaneous emission", "authors": ["R. Dum", "P. Zoller", "H. Ritsch"], "year": 1992, "venue": "Physical Review A 45, 4879", "url": "https://doi.org/10.1103/PhysRevA.45.4879", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "An Open Systems Approach to Quantum Optics", "authors": ["Howard J. Carmichael"], "year": 1993, "venue": "Lecture Notes in Physics Monographs m18, Springer-Verlag, Berlin", "url": "10.1007/978-3-540-47620-7", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Non-Markovian quantum jumps", "authors": ["J. Piilo", "S. Maniscalco", "K. Harkonen", "K. -A. Suominen"], "year": 2007, "venue": "arXiv", "url": "http://arxiv.org/abs/0706.4438v3", "cited_by": null, "bucket": "arXiv"}, {"n": 16, "title": "Der Teil und das Ganze: Gespräche im Umkreis der Atomphysik", "authors": ["Werner Heisenberg"], "year": 1969, "venue": "R. Piper Verlag, Munich (English: Physics and Beyond, Harper \u0026 Row 1971)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 17, "title": "Proposed 10^{14} Δν \u003c ν laser fluorescence spectroscopy on Tl+ mono-ion oscillator II (spontaneous quantum jumps)", "authors": ["Hans G. Dehmelt"], "year": 1975, "venue": "Bulletin of the American Physical Society 20, 60 (abstract)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "Upper bound on the duration of quantum jumps", "authors": ["Mathias A. Seidler", "Ricardo Gutiérrez-Jáuregui", "Alessandro Cerè", "Rocío Jáuregui", "Christian Kurtsiefer"], "year": 2018, "venue": "arXiv", "url": "http://arxiv.org/abs/1812.00129v1", "cited_by": null, "bucket": "arXiv"}, {"n": 19, "title": "Experiments with an isolated subatomic particle at rest (Nobel Lecture, 8 December 1989)", "authors": ["Hans G. Dehmelt"], "year": 1989, "venue": "The Nobel Foundation / Rev. Mod. Phys. 62, 525 (1990)", "url": "https://www.nobelprize.org/prizes/physics/1989/dehmelt/lecture/", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Monte Carlo wave-function method in quantum optics", "authors": ["Klaus Mølmer", "Yvan Castin", "Jean Dalibard"], "year": 1993, "venue": "Journal of the Optical Society of America B 10, 524", "url": "https://doi.org/10.1364/JOSAB.10.000524", "cited_by": null, "bucket": "archive"}, {"n": 21, "title": "To catch and reverse a quantum jump mid-flight", "authors": ["Z. K. Minev", "S. O. Mundhada", "S. Shankar", "P. Reinhold", "R. Gutierrez-Jauregui", "R. J. Schoelkopf", "M. Mirrahimi", "H. J. Carmichael"], "year": 2018, "venue": "arXiv", "url": "http://arxiv.org/abs/1803.00545v3", "cited_by": null, "bucket": "arXiv"}], "nsec": 9, "nref": 21, "teaser": "A century of the quantum jump, from Bohr's postulate to the catch-and-reverse experiment"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
