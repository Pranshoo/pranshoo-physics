<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Theorem Everyone Cites and No One States: Adiabatic Following from Rayleigh's Pendulum to Berry's Holonomy", "alternativeHeadline": "adiabatic theorem quantum mechanics", "name": "adiabatic theorem quantum mechanics", "description": "Rayleigh 1902 → Ehrenfest's hypothesis → Burgers's proof → Born–Fock → Kato's projections → Berry's discarded phase — and the folk criterion with published counterexamples.", "inLanguage": "en", "keywords": ["adiabatic theorem quantum mechanics", "adiabatic theorem of quantum mechanics", "Born–Fock theorem", "Kato's adiabatic theorem", "adiabatic approximation", "adiabatic following", "Ehrenfest's adiabatic hypothesis (the pre-quantum ancestor)", "Bohr's principle of mechanical transformability", "Adiabatensatz", "adiabatic invariance (classical ancestor)", "quantum adiabatic evolution / adiabatic quantum computation (applied descendant)", "quantum mechanics / foundations"], "about": [{"@type": "Thing", "name": "adiabatic theorem quantum mechanics"}, {"@type": "Thing", "name": "adiabatic theorem of quantum mechanics"}, {"@type": "Thing", "name": "Born–Fock theorem"}, {"@type": "Thing", "name": "Kato's adiabatic theorem"}, {"@type": "Thing", "name": "adiabatic approximation"}, {"@type": "Thing", "name": "adiabatic following"}, {"@type": "Thing", "name": "Ehrenfest's adiabatic hypothesis (the pre-quantum ancestor)"}, {"@type": "Thing", "name": "Bohr's principle of mechanical transformability"}], "articleSection": "quantum mechanics / foundations", "datePublished": "2026-08-07", "dateModified": "2026-08-07", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-theorem-everyone-cites-and-no-one-states-adiabatic-follo.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-theorem-everyone-cites-and-no-one-states-adiabatic-follo.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "From a Shortened Pendulum to the Old Quantum Theory's Only Selection Rule From a Shortened Pendulum to the Old Quantum Theory's Only Selection Rule The old quantum theory had a structural problem that is easy to forget now that it has been solved: it could quantize, but it could not say what to quantize. Planck set E = nh\\nu for an oscillator; Bohr set L = n\\hbar for a circular orbit; Sommerfeld and Wilson wrote \\oint p k\\,dq k = n k h. Nothing in the framework explained why those quantities and not, say, E, or E^2/\\nu, or the orbital eccentricity. Worse, the choice had to be stable : if you deform a system continuously into another, the integers must not jump, or the theory assigns two different spectra to the same physical setup. Ehrenfest's adiabatic hypothesis was the only principled answer anyone produced to this question — the correspondence principle, which arrived later, answered a different one (transition intensities, not which coordinates carry integers). Rayleigh, 1902 The invariant itself is classical, pre-quantum, and acoustical. In \"On the Pressure of Vibrations\" Rayleigh treated a pendulum whose string is drawn slowly through a fixed point, and showed that the energy and the frequency change together such that to leading order in the rate of shortening . The mechanism is the work done against the tension's oscillation-averaged excess; the result is the first explicit adiabatic invariant in physics, and it is nearly never cited in quantum texts, which reach for instead. Le Cornu (1895) had already handled parts of the same computation (verify). The modern name \"Rayleigh–Lorentz pendulum\" attaches Lorentz's name to a question he asked nine years after Rayleigh answered it. Solvay, 1911: the principle stated out loud At the first Solvay Council, Lorentz raised exactly Rayleigh's setup in quantum dress: shorten a \"quantum pendulum\" by sliding two fingers down the wire — what happens to h\\nu? Einstein's reply, printed in the discussion of the proceedings, is that if the change is infinitely slow the energy remains h\\nu if it was h\\nu . That is the adiabatic principle: E/\\nu invariant \\Rightarrow the quantum number is preserved. It was spoken, not written as a paper, and is therefore invisible to citation indices — the earliest quantum statement of the principle has essentially zero priority weight in the literature. Ehrenfest, 1913–1916: the hypothesis, and its Boltzmannian genealogy Ehrenfest arrived independently and from a different direction. His 1913 KNAW paper identifies the source of adiabatic invariance in a mechanical theorem of Boltzmann's — the monocyclic-systems tradition running through Helmholtz and Clausius that sought a mechanical analogue of the second law — and singles out the phase integral \\oint p\\,dq as the quantizable object . The 1916 Annalen paper states the hypothesis in general form and fixes the vocabulary: adiabatic invariants are exactly the quantities that may be set equal to integer multiples of h , and reversible slow deformations map allowed motions to allowed motions . Note what this is: a selection rule for building a theory , not a theorem about a differential equation. That distinction will matter for the rest of the dossier. Burgers, 1917–18: the actual proof Ehrenfest gave a physical argument and worked examples. The general theorem — that for separable, conditionally (multiply) periodic systems every action variable J k = \\oint p k\\,dq k is invariant under slow variation of parameters — was proved by his doctoral student Jan Burgers, using the canonical/angle-variable averaging machinery of celestial mechanics, in the KNAW Proceedings and Philosophical Magazine 33, 514 (1917) and extended in his Leiden dissertation on the Rutherford–Bohr atom (a parallel Annalen der Physik 52 version also exists — verify). The old quantum theory's selection rule therefore rests on Burgers's theorem. Burgers is remembered for the Burgers equation and turbulence. Bohr, 1918: rebranding Bohr absorbed the hypothesis into the 1918 Quantum Theory of Line Spectra and renamed it the principle of mechanical transformability , explicitly to shed what he regarded as misleading thermodynamic connotations . Under that name it became a load-bearing consistency principle rather than an unproved hypothesis — which is why much 1920s literature cites \"mechanical transformability\" and modern readers fail to recognize it as the same statement. See Pérez \u0026 Valls for the reception history. Krutkov–Fock, 1923: the bridge Krutkov and Fock returned to Rayleigh's pendulum precisely to settle what Ehrenfest's hypothesis meant mechanically , treating the slowly varying length with the perturbative apparatus that Fock would carry into the quantum proof five years later . This paper is the methodological ancestor of Born–Fock 1928 ; it is routinely cited, when cited at all, as \"Fock's early work.\" Krutkov was arrested in the 1936 Leningrad purges and disappeared from the record. The four-way attribution failure This dossier will cash out four separable defects, in ascending order of technical consequence: Failure Character --- --------- ----------- 1 Ehrenfest credited with a theorem Burgers proved under-crediting the prover 2 Rayleigh's invariant and Einstein's Solvay statement absent from quantum citation practice under-crediting the origin 3 \"Born–Fock\" drifting to \"Born\"; Fock's gauge argument for \\langle n\\mid\\partial t n\\rangle left unexamined for 55 years erosion of a joint name 4 Physicists state Kato's theorem — isolated spectral subspace, degeneracy permitted — while citing Born and Fock's paper, which assumed a simple, discrete eigenvalue outright attribution error with different hypotheses Established record: Rayleigh's 1902 invariant; Burgers's proof; Bohr's renaming; the Krutkov–Fock lineage. Plausible but disputed: the weighting of Ehrenfest's sources — how much he took from Rayleigh's pendulum versus the Boltzmann–Helmholtz monocyclic tradition; Navarro \u0026 Pérez document both channels without settling their relative force. Folklore: that Ehrenfest \"proved\" adiabatic invariance, and that the adiabatic hypothesis and the adiabatic theorem are one statement in two languages. The Physics, Properly: Born–Fock's Expansion, Kato's Projections, and the Assumptions A1–A8 The Physics, Properly: Born–Fock's Expansion, Kato's Projections, and the Assumptions A1–A8 Two derivations underlie every modern use of the theorem. They are not the same derivation, they do not have the same hypotheses, and the physics literature routinely states the second while citing the first. The Born–Fock expansion Fix a path R(s) in parameter space, s = t/T \\in , and write H(s) for the Hamiltonian along it. Let H(s)\\lvert n(s)\\rangle = E n(s)\\lvert n(s)\\rangle with the instantaneous eigenbasis complete and orthonormal. Expand the solution of i\\hbar\\,\\partial t\\psi = H(t)\\psi as Substituting and projecting on \\langle m\\rvert gives the exact coupled system that Born and Fock wrote down in 1928 : Differentiating the eigenvalue equation converts the off-diagonal overlap into the object every subsequent paper quotes, which under t = Ts carries an explicit 1/T. Integrating by parts against the rapidly oscillating exponential — the step where the gap \\Delta = \\min s\\lvert E n - E m\\rvert is used , not merely assumed — yields transition amplitudes O(\\hbar\\,\\lVert\\partial s H\\rVert/\\Delta^2 T) plus boundary terms at s=0,1. That is the entire content: O(1/T), with the constant set by the gap and the path, not by any instantaneous ratio. The first term is different in kind. The diagonal \\langle n\\mid\\partial t n\\rangle is pure imaginary, carries no 1/T suppression (it survives the limit), and Fock disposed of it by the gauge choice \\lvert n(t)\\rangle \\to e^{i\\theta n(t)}\\lvert n(t)\\rangle with \\dot\\theta n = i\\langle n\\mid\\partial t n\\rangle. For an open path this is exact and irreproachable. On a closed loop C in parameter space the required \\theta n need not be single-valued, and the residue is gauge-invariant. Simon identified this as the holonomy of a connection on a Hermitian line bundle over parameter space; Berry recognized it as physical. The term was never missing — it was correctly removed under an assumption (open path) that nobody had thought to relax for fifty-five years. Figure: the same expansion split into the term that vanishes as T\\to\\infty (gap-controlled, off-diagonal) and the term that does not (diagonal). Fock's gauge removal of the latter is valid precisely when the parameter path is not closed; closing it converts the discarded term into the geometric phase. Kato's recasting Kato removed the eigenvectors entirely. Let P(s) be the spectral projection onto the isolated part \\sigma (s) of the spectrum. Differentiating P^2 = P gives \\dot P = \\dot P P + P \\dot P, hence P\\dot P P = 0 — the derivative is purely off-diagonal in the P/(1-P) splitting. Kato then defines the generator whose propagator U A(s) (the \"Kato dynamics\", or adiabatic intertwiner) satisfies exactly for all s, with no error term at all. The theorem is then the statement that the physical propagator U T(s) generated by H(Ts)/\\hbar satisfies \\lVert (U T - U A)P(0)\\rVert = O(1/T). Nothing here requires a nondegenerate level, a choice of phase, or even a discrete spectrum outside \\sigma : \\sigma may be a degenerate eigenvalue, a band, or a cluster, provided it stays separated from the rest. This is the version physicists actually state — and then cite Born–Fock for. The hypotheses, numbered These labels are used verbatim throughout §3–§6. Hypothesis Used for --- --- --- A1 H(t) self-adjoint for each t, on a t-independent domain D \\subset \\mathcal H existence/uniqueness of U T; silently violated by moving boundaries, expanding boxes, \\delta-couplings A2 t\\mapsto H(t) (or t\\mapsto P(t)) is C^k, k\\geq 2, or piecewise so integration by parts; k=1 gives convergence, k\\ge2 gives the 1/T rate A3 \\sigma (s) is isolated from the rest of \\sigma(H(s)) by a gap \\Delta 0, uniformly in s the resolvent bound \\lVert(H-z)^{-1}\\rVert\\le 1/\\Delta; sets the \\Delta^{-2} in every error estimate A4 P(s) has fixed, finite rank (Born–Fock: rank one and simple) rules out level crossings inside \\sigma and rank changes; Avron–Elgart keep A4, drop A3 A5 \\partial t H bounded, or H-bounded with uniform relative bound makes \\langle m\\mid\\partial t H\\mid n\\rangle finite; fails for unbounded perturbations A6 The relevant spectrum is discrete near \\sigma (Born–Fock assumed purely discrete) legitimizes the eigenbasis expansion; continuous spectrum needs A3 in resolvent form A7 Closed-system, unitary generation by a self-adjoint H the entire proof; Lindbladians satisfy none of it A8 Fixed path in parameter space, asymptotics as T\\to\\infty; path open unless stated this is an \\varepsilon\\to 0 statement, not a finite-T bound — and closing the path resurrects \\gamma(C) Born–Fock 1928 assume A1–A8 with A4 at rank one and A6 at \"purely discrete\" . Kato 1950 needs only A1–A3, A5, A7, A8, with A4 weakened to finite rank and A6 dropped outright . Avron–Elgart 1999 discard A3 . The counterexample literature attacks A8: every published pathology is a finite-T statement dressed as a violation of a T\\to\\infty theorem. Where Each Hypothesis Breaks: Gaps, Crossings, Continuous Spectrum, and the Finite-T Problem Where Each Hypothesis Breaks: Gaps, Crossings, Continuous Spectrum, and the Finite-T Problem Take the assumptions in the order established in §2 and ask, for each, what the world does when it fails. The useful discipline is that every failure has a controlling parameter, and that parameter is not always the gap. A1 (self-adjoint generator, unitary evolution). This is the hypothesis that fails silently, because it fails outside the theorem's own language. A Lindbladian \\mathcal{L}(t) has no spectral projection onto an eigenvector to be followed; what survives is the instantaneous kernel — the stationary state — and adiabatic theorems for generators of contracting evolutions require a gap in the dissipative spectrum plus resolvent bounds, hypotheses that are almost never checked in the papers that invoke them. Nothing in Born–Fock or Kato licenses this, and the extension is a genuinely different theorem, not a corollary. A2 (smoothness of H(s) in the scaled time s = t/T). This is the hypothesis that controls the exponent , and it is the one most often left unstated. For H \\in C^1 with endpoints where \\partial s H \\neq 0, the error is O(1/T) and the leading term is a boundary contribution — the switching-on and switching-off transients, not the interior of the path. If \\partial s^k H vanishes at both endpoints for k = 1,\\dots,m, the error drops to O(T^{-m-1}); if H(s) is C^\\infty with all derivatives vanishing at the endpoints, one gets superpolynomial decay; if H(s) is analytic in a strip of width \\delta about the real axis, the error is O(e^{-cT\\delta}) (Nenciu; Joye–Pfister; Hagedorn–Joye) (verify) . The exponentially-small-transitions folklore is a statement about analyticity plus smooth switching, and it is routinely quoted as though it were the generic behavior of the theorem. A3 (isolated eigenvalue / spectral gap). The gap buys the rate , not the theorem. Avron and Elgart proved an adiabatic theorem with no gap condition whatsoever, requiring only that the relevant spectral projection P(s) be finite-rank and piecewise twice differentiable ; the price is convergence without any error estimate — \\ (1-P)U\\psi\\ \\to 0 as T\\to\\infty, with no T at which you may stop. So the textbook implication runs backwards in both directions: gaplessness does not kill adiabaticity, and a gap does not certify it at any finite T (see A6). The gap's real role is dimensional: \\Delta is what makes \\hbar\\ \\partial t H\\ /\\Delta^2 a time. A4 (nondegeneracy along the path) and gap closure. When two levels approach and separate linearly in time with coupling V, Landau, Zener, Stückelberg and Majorana independently obtained in 1932 the transition probability P = e^{-2\\pi\\Gamma} with which is the theorem's failure made quantitative . Note what \\Gamma contains: the rate of gap traversal , not the minimum gap alone. This is the only regime where \"how slow is slow enough\" has a closed-form answer, which is why the whole subject leans on it well past its two-level, linear-sweep hypotheses. At a genuine conical intersection the situation is worse than a small gap. The derivative coupling \\langle m \\mid \\nabla R n\\rangle diverges as 1/R as the intersection is approached, P(s) is not differentiable, and the real adiabatic electronic wavefunction changes sign around a circuit — the \\mathbb{Z} 2 geometric phase found in the Jahn–Teller literature in 1958 . A3, A4, and the differentiability required by A2 all fail simultaneously, and even Avron–Elgart's weakened hypothesis (piecewise C^2 projection) is not satisfied. Invoking \"the adiabatic theorem\" to justify Born–Oppenheimer near a conical intersection is not an approximation being pushed hard; it is the invocation of a theorem none of whose hypotheses hold. A5 (discrete spectrum / spectral projection exists). With continuous spectrum the object being followed may not exist. An eigenvalue embedded in the continuum generically dissolves under perturbation into a resonance with width \\Gamma {\\rm res}; there is no rank-one P(s) to transport, and the correct statement involves survival of the resonance pole with an additional decay factor e^{-\\Gamma {\\rm res} T/\\hbar} competing against the adiabatic suppression. The two limits do not commute: slowing down improves following but increases decay. Threshold points, where a bound state is absorbed into the continuum, break the theorem outright even though the \"gap\" to the rest of the discrete spectrum may be large. A6 (finite T vs. T\\to\\infty). The theorem is asymptotic in T along a fixed path; the folk criterion is an attempt to read a finite-T bound off an asymptotic statement, and it is neither necessary nor sufficient. Marzlin and Sanders built an explicit two-level Hamiltonian satisfying the criterion whose evolution is not adiabatic ; Tong, Singh, Kwek and Oh showed the standard quantitative condition secures adiabaticity only for a restricted class of systems . The mechanism is structural, not pathological: a small off-diagonal amplitude accumulating resonantly over a long time is a T-dependent effect that any pointwise instantaneous ratio is blind to. The correct replacement is a Jansen–Ruskai–Seiler-type bound, of the schematic form which contains second derivatives, an integral along the path, and separated boundary terms — none of which the instantaneous criterion has. Every feature of the counterexamples is visible in the structure of this bound. The classical contrast. Ehrenfest's and Burgers's invariance and Born–Fock following are not the same claim, and their error laws differ qualitatively. For an analytic one-frequency Hamiltonian, the classical action I is conserved to O(e^{-c/\\varepsilon}) (Neishtadt; Nekhoroshev-type estimates) (verify) : a number is preserved to all orders. Quantum adiabatic following preserves a state , and generically only to O(\\varepsilon), the improvement to exponential requiring the analyticity and smooth-switching hypotheses of A2. Quoting exponentially small nonadiabatic transitions as a general fact imports the classical result into a setting that has not earned it. Signatures: What Actually Demonstrates Adiabatic Following, and What Merely Looks Like It Signatures: What Actually Demonstrates Adiabatic Following, and What Merely Looks Like It The claim \"the system followed adiabatically\" is, operationally, a claim about a functional dependence , not about an outcome. Population in the right state at the end of the pulse is compatible with at least six mechanisms, only one of which is the theorem. What distinguishes them is how the observable moves when you vary the knobs the theorem's hypotheses name: the sweep rate, the gap, the path in parameter space, the direction of traversal, and the coupling to the environment. Below: the signatures that are diagnostic, and the ones that only correlate. Direct signatures 1. The Landau–Zener rate law and its Stückelberg fringes. For a linear sweep through an avoided crossing with gap \\Delta and sweep velocity v = \\partial t(E 1-E 2) , the diabatic transition probability is so a plot of \\ln P against 1/v must be a straight line of slope -\\pi\\Delta^2/2\\hbar . This is a two-parameter falsifiable prediction, not a fit: measure \\Delta spectroscopically, then the slope is fixed. Traverse the crossing twice and the two adiabatic paths interfere, producing Stückelberg oscillations in P versus the dwell phase — fringes whose spacing measures the accumulated dynamical phase between crossings. Fringes are the strong evidence, because incoherent leakage and heating reproduce a monotone P(v) but cannot reproduce coherent interference. Note what the LZ law is not : it is a statement about one isolated crossing, and it is exact in a model with linearly swept, infinitely extended asymptotics. Applying e^{-2\\pi\\Gamma} to a finite pulse with sharp switch-on imports edge effects that dominate at large \\Gamma. 2. Gap scaling at fixed rate. The cleanest test, and the rarest. Hold the trajectory and the total time T fixed and tune \\Delta independently — in a superconducting qubit via a coupling drive amplitude, in a molecular beam via an applied field detuning. The theorem's content is that infidelity collapses as \\Delta opens; if \\Delta is varied by an order of magnitude and 1-F does not move, whatever produced the fidelity is not gap-protected following. 3. Gauge-invariant cyclic geometric phase. Adiabatic transport around a closed loop C in parameter space should produce, over and above the dynamical phase, \\gamma(C) = -\\oint C \\mathrm{Im}\\langle n \\nabla R n\\rangle\\cdot d\\mathbf{R}, which for spin-j in a slowly rotated field is -j\\,\\Omega(C), the solid angle subtended . The signature is geometric : \\gamma must depend on the loop's shape and enclosed flux and be independent of how fast the loop is traversed, and must reverse sign when the loop is reversed while the dynamical phase does not. In the real-wavefunction case the phase collapses to \\mathbb{Z} 2: a circuit encircling a conical intersection flips the sign of the adiabatic electronic state — the Herzberg–Longuet-Higgins effect, visible as half-integer vibronic quantum numbers in Jahn–Teller spectra . Half-integer level spacing is essentially unfakeable by any dynamical-phase artifact. Figure: The two scalings that carry the evidential weight. High fidelity at a single operating point sits on every curve at once; only the derivatives distinguish the mechanisms. A dark state (green) is exactly degenerate-eigenvalue tracking and is by construction insensitive to the Δ that gap-protected following depends on. Circumstantial signatures, and how to break them High final-state fidelity alone. Shortcuts to adiabaticity are engineered to reach the adiabatic endpoint while violating adiabaticity throughout — counterdiabatic driving adds H {\\rm CD} = i\\hbar\\sum n( \\partial t n\\rangle\\langle n - \\langle n \\partial t n\\rangle n\\rangle\\langle n ) precisely to cancel the following error, and a well-tuned resonant \\pi-pulse reaches the same endpoint with no slowness at all. Discriminator: sample the state mid-sweep (interrupt the ramp and do tomography, or measure the spectroscopic response at intermediate times). Adiabatic following predicts the instantaneous eigenstate at every intermediate time; a \\pi-pulse or a counterdiabatic protocol does not. Failing that, the T-scaling: STA fidelity is flat in T, adiabatic fidelity is monotone. Dark-state / STIRAP transfer. Complete population transfer through a zero-eigenvalue dark state is the most frequently mislabeled case. What protects it is that D\\rangle is an exact null eigenvector of the coupling Hamiltonian for all pulse shapes; the relevant \"gap\" to the bright states is set by the Rabi frequencies , not by a spectral feature of a Hamiltonian being deformed. Discriminator: the transfer efficiency depends on \\Omega {\\rm rms}\\tau and on pulse ordering/overlap, and is famously insensitive to detuning from the intermediate state — including large one-photon detuning where the intermediate level is never populated. A genuine gap-protected process cannot be indifferent to the level it is supposedly gapped from. Slow driving with a good result in an open system. Dephasing in the instantaneous eigenbasis relaxes a system into the instantaneous ground state; slower is then better for reasons that have nothing to do with unitary following, and Born–Fock/Kato do not apply at all (this is the category error catalogued in §3). Discriminator: run the loop in reverse, and run it at fixed T with the environment coupling varied. Unitary following is reversible — retracing the path returns you to the initial state — while dissipative pumping is not. Equivalently, check whether the final state depends on the initial state at all; a pumped system forgets it. Geometric phase from an interferometric phase shift. Any \\gamma extracted by subtracting a separately measured dynamical phase inherits that measurement's systematics; a miscalibrated \\int E\\,dt produces a spurious \"geometric\" offset that scales innocuously with loop area if the loop area and the traversal time were varied together. Discriminator: vary loop area at fixed traversal time and fixed \\int E\\,dt; or use spin-echo to cancel the dynamical phase identically rather than subtracting it; or reverse the loop orientation — \\gamma \\to -\\gamma while the dynamical phase is unchanged. And demand the solid-angle functional form across a family of non-similar loops, not a single number. The general rule: every one of these tests works by moving a variable that appears in the theorem's hypotheses and checking that the observable moves the way the hypothesis says it must. A demonstration that reports one operating point reports a coincidence, and — given the Marzlin–Sanders and Tong et al. counterexamples — the instantaneous slowness criterion computed at that point is not a substitute for the scan. Use \u0026 Abuse: The Gapless Citation, the Instantaneous Criterion, and 'Adiabatic' as an Honorific Use \u0026 Abuse: The Gapless Citation, the Instantaneous Criterion, and 'Adiabatic' as an Honorific What follows is a field guide. Each entry names the assumption from §2 that is being quietly dropped, and the published result that forbids the drop. (i) The gapless citation — A3 and A8 dropped together. The most common failure is a sentence of the form \"by the adiabatic theorem, the system remains in its instantaneous ground state,\" with no \\Delta named and no statement of what T is large compared to. This is not merely informal: it is the deletion of both the isolation hypothesis A3 and the asymptotic structure A8. A3 fixes which spectral patch is being followed; A8 says the error vanishes as T\\to\\infty along a fixed path in parameter space. A claim with neither is unfalsifiable — there is no T at which it can be wrong. Note the asymmetry Avron and Elgart established : dropping A3 does not destroy the theorem (a finite-rank, piecewise twice-differentiable projection suffices) but destroys the rate . So the gapless citation is doubly confused — it treats the gap as indispensable rhetorically while never bounding it numerically. (ii) The instantaneous criterion mistaken for the theorem. The ubiquitous condition is not the theorem, is not implied by it, and does not imply it. Marzlin and Sanders made this concrete with a two-level construction: given H(t) with propagator U(t), the dual Hamiltonian \\tilde H(t) = -U^\\dagger(t)H(t)U(t) has propagator U^\\dagger(t) and — because the criterion is built from unitarily covariant matrix elements and gaps — satisfies the identical bound. The adiabatic conclusions drawn for the two are mutually contradictory. Tong, Singh, Kwek and Oh then showed the standard condition is sufficient only for a restricted class. The mechanism is visible in the exact amplitude, whose O(1/T) size comes from integration by parts and therefore presupposes the phase is non-stationary. If \\partial t H carries a component oscillating at the instantaneous Bohr frequency with amplitude falling like 1/T, the phase cancels, the integrand adds coherently over a window growing like T, and c m(T)=O(1) while the pointwise ratio is O(1/T). A later analysis confirms the inconsistency arises precisely for Hamiltonians containing resonant terms whose amplitudes vanish asymptotically. A criterion evaluated pointwise in t has no access to a resonance defined by accumulation over t — this is structural, not a matter of sharpening constants. The honest finite-T statements are integral bounds, e.g. Jansen–Ruskai–Seiler, involving \\int \\ \\partial t H\\ /\\Delta^2 and \\int\\ \\partial t^2 H\\ /\\Delta^2, with exponentially small errors only under analyticity and smooth switching. (iii) Citing Born–Fock for Kato's theorem. Born and Fock assumed a simple, isolated eigenvalue of a discrete spectrum with a differentiable eigenvector. Nearly every modern application follows a degenerate or high-dimensional spectral subspace — a ground-state manifold, a Landau level, a band. That is Kato's projection-valued theorem , with its own hypotheses. The citation is not a courtesy misattribution; it points the reader at a set of hypotheses the work does not satisfy. (iv) Adiabatic quantum computing runtimes with an unbounded gap. The Farhi–Goldstone–Gutmann–Sipser algorithm has runtime governed by \\Delta {\\min}^{-2} (or better, under the integral bounds). A polynomial runtime claim is therefore a claim about \\Delta {\\min}(n) for the interpolating path on the specific instance family — typically an Ising encoding — and this is the hard part, not a detail. Small-n numerics do not bound it: first-order quantum phase transitions along the path drive \\Delta {\\min} exponentially small in n, and the transition need not be visible at accessible sizes. \"We verified adiabaticity up to 16 qubits\" is a statement about 16 qubits. (v) Shortcuts marketed as theorem consequences. STIRAP's robustness comes from the dark state D\\rangle \\propto \\cos\\theta 1\\rangle - \\sin\\theta 3\\rangle, an exact zero-eigenvalue eigenvector whose structural decoupling from the lossy intermediate state does most of the work; the theorem supplies only the tracking of \\theta(t). Counterdiabatic / transitionless driving (Demirplak–Rice; Berry 2009) goes further: it adds H {\\rm CD} = i\\hbar\\sum n\\bigl( \\partial t n\\rangle\\langle n - \\langle n \\partial t n\\rangle n\\rangle\\langle n \\bigr) precisely to make the evolution exact at any speed — the theorem is what is being circumvented, not invoked (review). (vi) Open-system \"adiabatic master equations.\" A Lindbladian is not self-adjoint and has no gap-protected eigenstate to follow; the object being tracked is the kernel of the instantaneous generator. The correct framework is adiabatic theory for generators of contracting evolutions (Avron–Fraas–Graf–Grech), where the lowest-order result is parallel transport in the manifold of instantaneous stationary states, with dissipative-gap and resolvent hypotheses. Citing here is a category error, not a controlled approximation. (vii) Born–Oppenheimer near conical intersections, and the two equivocations. The derivative coupling \\langle m \\nabla R n\\rangle = \\langle m \\nabla R H n\\rangle/(E n-E m) diverges exactly where the gap closes ; invoking the adiabatic theorem there asserts the hypotheses at the one point they fail. Two word-level confusions feed this: the adiabatic basis (instantaneous electronic eigenstates — a static object) versus adiabatic dynamics (a rate claim); and thermodynamic adiabaticity (\\delta Q=0, arbitrarily fast) versus mechanical adiabaticity (slow, maximally coupled). A fast adiabatic compression is one and the negation of the other. The tells A claim is hollow when: no \\Delta or \\Delta {\\min} is quoted anywhere; no error-versus-T scaling is exhibited, only a single simulation at one T; the bound cited contains \\partial t H but never \\partial t^2 H or the switching profile; the spectral object being followed is never identified as a level or a projection; and \"adiabatic\" appears as an honorific — a synonym for we went slowly and it worked — rather than as the name of a hypothesis someone could fail. Status Today — Mutated, Not Superseded — and What AETHER Demands of a New Claim Status Today — Mutated, Not Superseded — and What AETHER Demands of a New Claim The theorem is in the odd position of being simultaneously more rigorous and more abused than at any point in its history. Both trends are real, and they run on separate tracks: the mathematical physics literature has been repairing and extending the statement continuously since 1999, while the applied literature has largely frozen at a 1928 slogan that Born and Fock did not prove . What has actually been built. Five distinct lineages have grown out of Kato's projection formalism , and they are not interchangeable. Finite-T bounds. Jansen, Ruskai and Seiler (2007) replaced the asymptotic statement with an explicit inequality: for a gapped path H(s), s = t/T, the error obeys a bound of the schematic form with computable constants. This — not T \\gg \\hbar\\ \\partial t H\\ /\\Delta^2 — is the object that actually licenses a finite-time adiabatic claim. Note the \\ H''\\ term: the criterion in circulation contains no second derivative at all, which is precisely the crack the counterexamples of Marzlin–Sanders and Tong et al. exploit. Gapless and rate-free. Avron–Elgart survives intact, and has been complemented by results where the gap is replaced by something weaker: Elgart and Hagedorn proved adiabatic theorems for resonances rather than bound states, which is the right object when an eigenvalue is embedded in continuous spectrum and becomes metastable under perturbation. On timescales short compared with the resonance lifetime the two are operationally indistinguishable; on longer ones the theorem simply does not apply, and no amount of slowness helps. Many-body. This is the most consequential extension and the one most often misunderstood. For an extensive H(s)=\\sum x h x(s), the total \\ \\partial s H\\ grows with volume while the gap does not, so the single-particle bounds above are vacuous in the thermodynamic limit. Hastings's quasi-adiabatic continuation, and then Bachmann, De Roeck and Fraas (PRL 119, 060201, 2017), fixed this by trading operator norms for locality: with Lieb–Robinson bounds supplying the causal structure, one obtains an adiabatic theorem uniform in system size, with a density of nonadiabatic excitations that is superpolynomially (in fact almost-exponentially, with a dimension-dependent exponent) small in the driving rate. This is what makes a mathematical proof of the Kubo formula possible for interacting gapped systems, and it is the correct citation for any claim about adiabatic state preparation on a lattice. Discrete time. Digital algorithms do not evolve under H(s); they apply a sequence of unitaries. Costa et al. , PRX Quantum 3, 040303 (2022) proved an adiabatic theorem intrinsically for discrete-time walks, which is what delivered the optimal O(\\kappa\\log(1/\\epsilon)) linear-systems solver. Papers invoking Farhi et al. for a gate-model circuit are citing a continuous-time statement for a discrete-time process. Open systems. Avron, Fraas, Graf and Grech (2012) built adiabatic theory for generators of contracting evolutions on Banach spaces, covering Lindbladians and classical stochastic generators in one framework. The transported object is the instantaneous stationary state , the kernel of the generator — not an eigenvector of a Hamiltonian — and the relevant gap is the dissipative one. What is genuinely open. Sharp constants for many-body gapped systems: the exponent in the excitation density is dimension-dependent and not known to be optimal, and the crossover to the Kibble–Zurek regime as the gap closes with system size is not covered by any single theorem. Adiabatic theorems in the presence of true embedded eigenvalues without a resonance approximation remain fragmentary. Honest, computable error control for driven Lindbladians — bounds whose ingredients an experimentalist can actually estimate — is largely missing; most \"adiabatic master equation\" papers verify no hypothesis at all. And no rigorous adiabatic theorem currently covers a gap that closes polynomially in N at a first-order many-body transition, which is exactly the regime adiabatic quantum optimization lives in. The AETHER checklist A claim of adiabaticity is admissible only if the paper answers all nine: 1. Which theorem. Born–Fock , Kato , Avron–Elgart , Jansen–Ruskai–Seiler, discrete-time, many-body, or dissipative — named, not gestured at. State which of A1–A8 are verified and which are assumed. 2. The gap. \\Delta quantified, with its scaling in system size and in any parameter driven toward a critical point. \"Gapped\" without \\Delta(N) is not a hypothesis. 3. A finite-T bound, not a ratio. Path integrals of \\ \\partial s H\\ and \\ \\partial s^2 H\\ against powers of \\Delta. The instantaneous criterion is neither necessary nor sufficient ; quoting it is a citation of folklore. 4. Rate scaling. Measured or computed infidelity versus T over at least a decade, with the exponent reported. One slow run is not evidence of following. 5. Smoothness class and switching profile. C^k or analytic; boundary derivatives specified. Exponential suppression is a smooth-switching result and is silently imported far too often. 6. Unitary or not. If not, name the dissipative adiabatic theorem and its gap condition. 7. Extensivity. For many-body claims, cite a locality-based theorem and report a density of excitations, not a global overlap. 8. Phase claims. Gauge-invariant and cyclic, or else not a geometric phase ; open-path phases require a stated gauge convention. 9. Basis versus dynamics. State explicitly whether \"adiabatic\" denotes the instantaneous eigenbasis or actual following. Near a crossing these are opposites . The AETHER Verdict The AETHER Verdict What I will defend Three things, without qualification. First: the theorem is true and it is Kato's, not Born and Fock's. The object worth stating is the intertwining property of the Kato propagator — U A(s)P(0) = P(s)U A(s) holding exactly , with the physical propagator converging to U A dressed by dynamical phases as T \\to \\infty. This survives degeneracy, survives level crossings within the followed subspace, and is the version every physicist actually means. Citing Born–Fock 1928 for it is not a venial sin; the 1928 hypotheses (simple eigenvalue, purely discrete spectrum) exclude most of what the citation is used to license. Second: the standard adiabatic criterion T \\gg \\hbar\\ \\partial t H\\ /\\Delta^2 is not a theorem and should be treated as a heuristic with known counterexamples. Marzlin and Sanders closed this question with an explicit construction; Tong et al. delimited when the condition is sufficient. A pointwise ratio cannot detect resonant accumulation of amplitude over long times, because the failure mode is T-dependent and the criterion is not. Anyone reporting an adiabatic protocol should quote a Jansen–Ruskai–Seiler-type bound — integrals of \\ \\partial s H\\ and \\ \\partial s^2 H\\ along the path, with boundary terms — or say plainly that they are using folklore. Third: the gap is a hypothesis about rates, not about the conclusion. Avron and Elgart proved adiabatic following with no gap condition, at the cost of losing the rate. This cuts both ways and the community reliably gets both directions wrong: gapless does not mean the theorem fails, and gapped does not mean adiabaticity at any particular finite T. What is shakier than advertised A5 (the gap as a physical quantity in the thermodynamic limit). Most many-body adiabatic claims — quantum annealing complexity arguments above all — require a gap that closes at worst polynomially in system size, and this is almost never established. The theorem is invoked to carry an assumption that is itself the hard open problem. A7 (unitarity). The Lindbladian case is the most widespread category error in the field. There is no eigenstate to gap-protect; the relevant object is the kernel of the generator, and the relevant hypotheses (spectral gap of the dissipative generator, resolvent bounds) are usually neither stated nor checked. \"Adiabatic elimination\" citing Born–Fock is not a loose citation, it is a citation to a theorem about a different mathematical object. A3 (isolation of the spectral subspace, in the presence of a continuum). Resonances are not eigenvalues. Adiabatic theorems in the presence of continuous spectrum exist but are delicate and regime-bound; the literature routinely uses the discrete-spectrum statement for metastable states embedded in a continuum, where the correct statement involves exponential decay competing with the sweep rate. Error-scaling transfer. The \\exp(-c/\\varepsilon) results are classical-invariance results or smooth-switching results. Quoting them as generic quantum adiabatic behaviour imports a boundary-condition hypothesis silently — this is the invariance/following conflation doing real damage in numbers people publish. The three questions I would work on 1. Verifiable finite-T certificates for many-body adiabatic protocols. We have rigorous bounds whose ingredients (the gap along the path) are uncomputable in exactly the cases we care about; a certificate using only measurable or variationally bounded quantities would change annealing from folklore to engineering. 2. A clean adiabatic theorem for Lindbladians with an explicit, checkable gap condition. The existing results are correct and almost unused, because their hypotheses are stated in terms nobody verifies. Restating them in terms practitioners can test would eliminate an entire genre of error. 3. Adiabatic following through, not merely around, conical intersections. The gap closes and the derivative coupling diverges simultaneously; the sign anomaly of is well understood, the dynamics is not. This is where the theorem's failure is most physically consequential. Reading path: 1. Rayleigh 1902 — the invariant, classical, before quantum theory existed to complicate it; read it to see what the theorem is about . 2. Ehrenfest's 1916 adiabatic-hypothesis papers with Burgers 1917–18 side by side — physical argument versus actual proof; the credit gap is visible in one sitting. 3. Born and Fock 1928 — read for the eigenfunction expansion, the O(1/T) estimate, and the gauge term Fock derived and discarded; note the hypotheses you are about to see cited away. 4. Kato 1950 — the theorem as it is actually used; the intertwining relation makes clear that the physical propagator is not the geometric one. 5. Berry 1990 — the candid retrospective; read it after so the discarded term and Simon's bundle reading land as history rather than legend."}</script>

<script type="application/json" id="aether-data">{"slug": "the-theorem-everyone-cites-and-no-one-states-adiabatic-follo", "topic": "adiabatic theorem quantum mechanics", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "The Theorem Everyone Cites and No One States: Adiabatic Following from Rayleigh's Pendulum to Berry's Holonomy", "subtitle": "Rayleigh 1902 → Ehrenfest's hypothesis → Burgers's proof → Born–Fock → Kato's projections → Berry's discarded phase — and the folk criterion with published counterexamples.", "domain": "quantum mechanics / foundations", "era": "1916–1928 (Ehrenfest's adiabatic invariants; Born–Fock 1928), revived 1950 (Kato) and 1984 (Berry)", "why_big": "Ehrenfest's adiabatic hypothesis was the selection rule of the old quantum theory — the only principled answer to which classical quantities could be quantized — and Born and Fock's 1928 proof was among the first rigorous theorems about time-dependent Schrödinger evolution, later sharpened by Kato's 1950 gap-condition version. It underwrites the Born–Oppenheimer separation, quantum-number conservation under slow deformation, the Gell-Mann–Low construction of interacting states, Landau–Zener physics as its controlled failure, and the entire geometric-phase apparatus once Berry noticed in 1984 that the phase everyone had been discarding was the interesting part. It is the hinge between 'the state follows the Hamiltonian' and 'the state remembers the path.'", "abuse": "The theorem is routinely quoted as 'slow enough evolution stays in the instantaneous eigenstate' with no gap condition, no statement of what the rate is slow compared to, and no attention to the fact that the standard T ≫ ħ‖∂_t H‖/Δ² criterion is neither necessary nor sufficient — a point that produced a genuine controversy in the 2000s after Marzlin–Sanders and Tong et al. exhibited explicit counterexamples to the folk criterion. It is invoked wholesale in adiabatic quantum computing, STIRAP-adjacent protocols, open-system 'adiabatic' master equations (where no gap-protected eigenstate even exists), and Born–Oppenheimer arguments near conical intersections, i.e. precisely where the degeneracy assumption fails.", "date": "August 7, 2026", "ts": 1786122940.1215281, "engine": "Claude Code CLI · default model", "aliases": ["adiabatic theorem of quantum mechanics", "Born–Fock theorem", "Kato's adiabatic theorem", "adiabatic approximation", "adiabatic following", "Ehrenfest's adiabatic hypothesis (the pre-quantum ancestor)", "Bohr's principle of mechanical transformability", "Adiabatensatz", "adiabatic invariance (classical ancestor)", "quantum adiabatic evolution / adiabatic quantum computation (applied descendant)"], "origin_story": "The adiabatic idea entered physics from thermodynamics and celestial mechanics, not from quantum theory. Rayleigh in 1902 [71] noticed that a pendulum whose string is slowly shortened conserves E/ν even though neither E nor ν is conserved — the first explicit adiabatic invariant, and it is purely classical. At the 1911 Solvay meeting Lorentz asked, apparently unaware of Rayleigh, what happens to a 'quantum pendulum' whose length is slowly changed, and Einstein answered the next day that E/ν stays fixed, so the oscillator stays in the same quantum state [72]. Ehrenfest — who was not at Solvay but had read Rayleigh — converted this into a general principle by way of Boltzmann's and Helmholtz's mechanical analogies of the second law: in 1913 he showed that Boltzmann's mechanical theorem picks out the phase integral as the adiabatically invariant quantity [73], and in 1916 he elevated it to the 'adiabatic hypothesis': quantities that are adiabatic invariants of the classical motion are precisely the ones eligible for quantization, and allowed motions transform into allowed motions under reversible adiabatic deformation [74]. This was a *selection rule*, the only principled answer the old quantum theory had to which classical quantity to set equal to nh. Its mathematical content was supplied not by Ehrenfest but by his student Burgers, who proved in 1917–18 that the action variables of a separable multiply-periodic system are adiabatic invariants [75][76]. The hypothesis only became mainstream when Bohr adopted it in 1918 under the name 'principle of mechanical transformability' [2]. When the new mechanics arrived the hypothesis had to be re-proved from the Schrödinger equation, and Fock — who had already cut his teeth on the Rayleigh pendulum with Krutkov in 1923 [77] — did that with Born in 1928 [79]: expand ψ(t) in instantaneous eigenstates of H(t), show that off-diagonal amplitudes are O(1/T) provided the eigenvalue is simple and separated, and hence that quantum numbers are conserved under slow deformation. That paper also produced the diagonal term ⟨n|∂ₜn⟩ — the geometric phase — which Fock showed could be gauged away, and which the community then discarded for fifty-five years. Kato reworked the whole thing as operator theory in 1950 [5], replacing eigenvectors by spectral projections, dropping the non-degeneracy and explicit-gauge assumptions, and inventing an auxiliary 'adiabatic dynamics' obeying [∂ₛP, P] generation for which the theorem is exact rather than asymptotic. Berry in 1984 [83] pointed out that on a closed loop in parameter space the discarded phase is gauge-invariant and geometric; Simon [82] had already, in 1983, identified it as holonomy in a Hermitian line bundle. Everything after — Avron–Elgart's gapless theorem [85], adiabatic quantum computation [86], and the Marzlin–Sanders counterexample controversy [87][88] — is argument about exactly which hypotheses the theorem needs.", "credit_audit": "Attribution here fails in four distinct places. (i) Ehrenfest gets the hypothesis; Burgers proved it. Ehrenfest's 1916 papers are a physical argument plus worked examples; the general invariance of the action variables for separable multiply-periodic systems is Burgers's 1917–18 result [75][76]. The old quantum theory's selection rule therefore rests on a theorem almost nobody attributes to its prover, whose name now attaches only to a nonlinear PDE. (ii) Rayleigh and Einstein get nothing. The invariant is Rayleigh's, 1902, classical [71]; its quantum reading is Einstein's Solvay reply to Lorentz in 1911 [72], which is invisible to citation indices because it was spoken, not published. Ehrenfest's own independence is genuine — he read Rayleigh, not the Solvay minutes — so this is under-crediting rather than misattribution. (iii) 'Born–Fock' is unstable in the physics literature: it drifts to Born alone (Born has a Nobel Prize, a textbook, and a name attached to five other things), while the technical work — the eigenfunction expansion, the O(1/T) estimate, the treatment of the phase — is Fock's territory, prepared by the Krutkov–Fock pendulum paper of 1923 [77]. More consequentially, when physicists state the theorem they almost always state *Kato's* version (isolated spectral subspace, degeneracy allowed) while citing *Born and Fock's* paper, which assumed a simple eigenvalue of a purely discrete spectrum. That is a straightforward attribution error, and it matters, because the two versions have different hypotheses. (iv) The geometric phase is the cleanest case of a term being present and deliberately discarded: Fock derived ⟨n|∂ₜn⟩ in 1928 and showed it gauge-removable [79] — correctly, for open paths. Berry's contribution in 1984 [83] was not deriving the term but noticing that on a *closed* loop it is gauge-invariant and equals a flux of curvature; Simon [82] published the fibre-bundle reading first, in 1983. And the Z₂ version had been sitting in the Jahn–Teller literature since 1958 [81], generalized by Mead and Truhlar in 1979. Berry's own 1990 Physics Today survey [84] is unusually candid about all of this, which makes the community's continued use of 'Berry phase' as an origin claim rather than a name a choice, not an oversight. Established record: Burgers's proof, Rayleigh's invariant, Kato's generalization, Fock's gauge argument. Plausible but disputed: the exact degree of Ehrenfest's dependence on Rayleigh versus Boltzmann/Helmholtz. Folklore: 'Born and Fock proved that slow evolution keeps you in the instantaneous eigenstate' — they proved something narrower, and the modern statement is Kato's.", "timeline": [{"year": 1902, "event": "Slowly shortened pendulum shown to conserve E/ν: the first explicit adiabatic invariant, entirely classical and pre-quantum", "who": "Lord Rayleigh (J. W. Strutt)", "work": "\"On the Pressure of Vibrations\", Philosophical Magazine 3, 338", "kind": "observation", "ref": 1}, {"year": 1911, "event": "Lorentz asks what becomes of a 'quantum pendulum' whose length is slowly changed; Einstein replies the next day that E/ν is constant, so the quantum state is preserved — the adiabatic principle stated conversationally before it was ever written down", "who": "H. A. Lorentz (question), Albert Einstein (answer)", "work": "First Solvay Council, Brussels; printed discussion in La théorie du rayonnement et les quanta (Gauthier-Villars, 1912)", "kind": "observation", "ref": 3}, {"year": 1913, "event": "Boltzmann's mechanical analogue of the second law identified as the source of adiabatic invariance, singling out the phase integral ∮p dq as the quantizable quantity", "who": "Paul Ehrenfest", "work": "\"A mechanical theorem of Boltzmann and its relation to the theory of energy quanta\", KNAW Proceedings Amsterdam 16 II, 591", "kind": "theory", "ref": 4}, {"year": 1916, "event": "The adiabatic hypothesis stated in general form and named: adiabatic invariants are exactly the quantities admitting quantization; allowed motions map to allowed motions under slow reversible deformation", "who": "Paul Ehrenfest", "work": "\"Adiabatische Invarianten und Quantentheorie\", Annalen der Physik 356 (51), 327 (English version, Phil. Mag. 33, 500, 1917)", "kind": "naming", "ref": 5}, {"year": 1917, "event": "The actual proof: phase integrals of separable, multiply-periodic systems shown to be adiabatic invariants under slow parameter change — the mathematical content Ehrenfest had only hypothesized", "who": "Johannes Martinus (Jan) Burgers", "work": "\"Adiabatic Invariants of Mechanical Systems\" I–III, KNAW Proceedings Amsterdam 20; companion in Philosophical Magazine 33, 514 (1917)", "kind": "formalization", "ref": 6}, {"year": 1918, "event": "Bohr absorbs the hypothesis into his quantum theory and renames it the 'principle of mechanical transformability', which is how most of the 1920s literature actually cites it", "who": "Niels Bohr", "work": "\"On the Quantum Theory of Line Spectra, Part I: On the General Theory\", Kgl. Danske Vid. Selsk. Skr.", "kind": "revival", "ref": 8}, {"year": 1923, "event": "Rayleigh's pendulum re-solved to settle the mechanical meaning of Ehrenfest's hypothesis; Fock's apprenticeship on the problem he would later quantize", "who": "Yuri A. Krutkov and Vladimir A. Fock", "work": "\"Über das Rayleighsche Pendel\", Zeitschrift für Physik 13, 195 (received 12 Dec 1922)", "kind": "theory", "ref": 9}, {"year": 1927, "event": "Nuclear/electronic separation built on slow-nuclear-motion adiabaticity — the theorem's most-used application, published a year before the theorem itself existed", "who": "Max Born and J. Robert Oppenheimer", "work": "\"Zur Quantentheorie der Molekeln\", Annalen der Physik 389 (84), 457", "kind": "theory", "ref": 22}, {"year": 1928, "event": "First proof from the time-dependent Schrödinger equation: simple, isolated eigenvalue ⇒ transition amplitudes O(1/T); the diagonal phase term ⟨n|∂ₜn⟩ appears and is gauged away", "who": "Max Born and Vladimir A. Fock", "work": "\"Beweis des Adiabatensatzes\", Zeitschrift für Physik 51, 165", "kind": "formalization", "ref": 2}, {"year": 1932, "event": "The controlled failure mode: transition probability at an avoided crossing computed as exp(−2πΓ), making 'how slow is slow' quantitative — independently by Landau, Zener, Stückelberg and Majorana in the same year", "who": "Clarence Zener (also L. D. Landau, E. C. G. Stückelberg, Ettore Majorana)", "work": "\"Non-adiabatic crossing of energy levels\", Proc. R. Soc. Lond. A 137, 696", "kind": "theory", "ref": 17}, {"year": 1950, "event": "Operator-theoretic recasting: spectral projections replace eigenvectors, degeneracy and gauge assumptions dropped, and an exactly-adiabatic auxiliary 'Kato dynamics' introduced — the version mathematicians actually use", "who": "Tosio Kato", "work": "\"On the Adiabatic Theorem of Quantum Mechanics\", J. Phys. Soc. Japan 5, 435", "kind": "formalization", "ref": 10}, {"year": 1958, "event": "Real adiabatic electronic wavefunctions shown to change sign on a circuit around a degeneracy (conical intersection) — Berry's phase, restricted to ±1, discovered in molecular spectroscopy 26 years early", "who": "H. C. Longuet-Higgins, U. Öpik, M. H. L. Pryce, R. A. Sack (also G. Herzberg \u0026 Longuet-Higgins 1963)", "work": "\"Studies of the Jahn–Teller effect. II. The dynamical problem\", Proc. R. Soc. Lond. A 244, 1", "kind": "observation", "ref": 18}, {"year": 1983, "event": "The adiabatic theorem identified as defining a connection on a Hermitian line bundle, with the cyclic phase as its holonomy — published before Berry's paper appeared, and linking the phase to TKNN Chern numbers", "who": "Barry Simon", "work": "\"Holonomy, the Quantum Adiabatic Theorem, and Berry's Phase\", Phys. Rev. Lett. 51, 2167", "kind": "formalization", "ref": 12}, {"year": 1984, "event": "The gauge-invariant cyclic phase γ(C) = i∮⟨n|∇_R n⟩·dR recognized as physical and geometric; the discarded term of Born–Fock becomes the subject", "who": "Michael V. Berry", "work": "\"Quantal phase factors accompanying adiabatic changes\", Proc. R. Soc. Lond. A 392, 45", "kind": "revival", "ref": 13}, {"year": 1999, "event": "Adiabatic theorem proved without any gap condition, requiring only a piecewise twice-differentiable finite-rank spectral projection — demolishing the folk claim that the gap is indispensable (at the price of no error rate)", "who": "Joseph E. Avron and Alexander Elgart", "work": "\"Adiabatic Theorem without a Gap Condition\", Commun. Math. Phys. 203, 445", "kind": "formalization", "ref": 14}, {"year": 2004, "event": "Explicit two-level counterexample: a Hamiltonian satisfying the textbook slowness criterion whose evolution is not adiabatic — showing the standard criterion is not sufficient, and triggering a decade of repair papers", "who": "Karl-Peter Marzlin and Barry C. Sanders (with the Tong–Singh–Kwek–Oh analysis)", "work": "\"Inconsistency in the Application of the Adiabatic Theorem\", Phys. Rev. Lett. 93, 160408", "kind": "theory", "ref": 15}], "neglected": [{"name": "Johannes Martinus (Jan) Burgers", "role": "Proved what Ehrenfest asserted. Ehrenfest's 1916 papers state the adiabatic hypothesis and give examples; Burgers, his doctoral student, supplied the general proof that the phase integrals (action variables) of separable multiply-periodic systems are invariant under slow deformation, and extended it in his 1918 Leiden dissertation on the Rutherford–Bohr atom. The theorem the old quantum theory actually leaned on is Burgers's, not Ehrenfest's; Burgers is now remembered almost exclusively for fluid turbulence and the Burgers equation.", "evidence": "His own three-part KNAW papers and Phil. Mag. 33, 514 (1917) [75]; his dissertation [76]; and the Navarro–Pérez history of the 1911–1918 period, which documents both the proof and the eclipse [90]", "ref": 6}, {"name": "Lord Rayleigh (John William Strutt)", "role": "Discovered adiabatic invariance itself, in 1902, in a purely classical acoustical context — the slowly shortened pendulum with E/ν constant. Every quantum statement of the adiabatic theorem is a descendant of this calculation, and it is almost never cited in quantum textbooks. Le Cornu (1895) had already treated parts of the mathematics.", "evidence": "\"On the Pressure of Vibrations\", Phil. Mag. 3, 338 (1902); acknowledged as Ehrenfest's direct source in the historical literature and in the Rayleigh–Lorentz pendulum literature [71]", "ref": 1}, {"name": "Albert Einstein (at Solvay 1911)", "role": "Stated the physical content of the adiabatic principle — that E/ν is preserved so the oscillator remains in the same quantum state — in reply to Lorentz's question, a full two years before Ehrenfest's 1913 paper and five before the 1916 one. Because it was a discussion remark rather than a paper, it is essentially never cited as a priority claim, and Ehrenfest (who was absent) reached the same conclusion independently from Rayleigh.", "evidence": "Printed discussion in the 1911 Solvay proceedings, La théorie du rayonnement et les quanta (1912) [72]", "ref": 3}, {"name": "Yuri Aleksandrovich Krutkov", "role": "Co-author with Fock of the 1923 analysis of the Rayleigh pendulum that clarified the mechanical meaning of Ehrenfest's hypothesis — the direct methodological ancestor of the 1928 quantum proof. Krutkov (later arrested in the 1936 Soviet purges of Leningrad physicists) vanished from the citation record entirely; the 1923 paper is cited, when at all, as 'Fock's early work'.", "evidence": "Krutkow \u0026 Fock, Z. Physik 13, 195 (1923) [77], which appears in Fock's own published bibliography with Krutkov as first author", "ref": 9}, {"name": "Vladimir Aleksandrovich Fock", "role": "Did the analysis in Born–Fock 1928 and, crucially, was the one who derived the diagonal phase ⟨n|∂ₜn⟩ and showed it removable by gauge for non-cyclic evolution. That precise (and correct) observation is why the geometric phase sat unexamined for 55 years — the closure of the loop, not the term itself, was the missing ingredient. The theorem is routinely shortened to 'Born's theorem' in physics texts, and Born collected the Nobel Prize; Fock did not.", "evidence": "Born \u0026 Fock, Z. Physik 51, 165 (1928) [79]; the gauge-removal step and its 50-year consequence are stated explicitly in the modern geometric-phase literature and in Berry's own historical account [84]", "ref": 2}, {"name": "H. C. Longuet-Higgins, U. Öpik, M. H. L. Pryce, R. A. Sack (and G. Herzberg)", "role": "Found the geometric phase — as the sign change of a real adiabatic electronic wavefunction transported around a conical intersection — in 1958/1963, in the Jahn–Teller literature. This is the Z₂ special case of Berry's γ(C). Mead and Truhlar (1979–1980) generalized it as the 'molecular Aharonov–Bohm effect' before Berry's paper. Chemists call it the Longuet-Higgins or Herzberg–Longuet-Higgins phase; physicists call the whole thing Berry's.", "evidence": "Proc. R. Soc. Lond. A 244, 1 (1958) [81]; Berry himself catalogued these anticipations [84]", "ref": 18}, {"name": "Tosio Kato", "role": "Produced the theorem's only rigorous general formulation — projection-valued, degeneracy-tolerant, gauge-free, with the exact 'Kato dynamics' as an intermediary — in 1950, in a Japanese journal, two decades before the mathematical-physics community took it up. Physics textbooks overwhelmingly cite Born–Fock 1928 for a statement whose actual hypotheses (isolated part of the spectrum, not merely a nondegenerate level) are Kato's.", "evidence": "J. Phys. Soc. Japan 5, 435 (1950) [5]; Barry Simon's survey of Kato's non-relativistic quantum mechanics work documents both the content and the delayed reception", "ref": 10}], "conflations": [{"claim": "'Adiabatic' means the same thing in thermodynamics and in the adiabatic theorem.", "clarification": "Thermodynamic adiabatic = no heat exchange (δQ = 0), and can be arbitrarily fast (a shock is adiabatic). Mechanical/quantum adiabatic = infinitely slow parameter change, and typically requires *maximal* coupling to the driving agent. The words are cognate only through Ehrenfest's deliberate analogy to Boltzmann's and Helmholtz's mechanical models of the second law. A fast adiabatic compression is thermodynamically adiabatic and quantum-mechanically the opposite."}, {"claim": "Ehrenfest's adiabatic hypothesis and the Born–Fock adiabatic theorem are the same statement, one classical and one quantum.", "clarification": "They are logically different objects. Ehrenfest's hypothesis is a *selection rule*: it says which classical quantities may be set to integer multiples of h. It is a rule for constructing a quantum theory. Born–Fock is a *theorem about solutions of a given differential equation*: given H(t) and the Schrödinger equation, ψ(t) stays near the instantaneous eigenvector. The theorem does not license the hypothesis and the hypothesis is not a corollary of the theorem."}, {"claim": "Adiabatic invariance and adiabatic following are the same phenomenon.", "clarification": "Classical adiabatic invariance of an action variable holds to all orders in the slowness parameter (Nekhoroshev/Neishtadt: errors exponentially small, exp(−c/ε), for analytic Hamiltonians), and concerns a *number*. Quantum adiabatic following concerns a *state* and is generically only O(ε) unless the driving is switched on and off smoothly, in which case one also gets superpolynomial or exponential suppression. Papers that quote 'exponentially small nonadiabatic transitions' as a generic fact are importing a smooth-switching result into a setting that may not have it."}, {"claim": "The adiabatic theorem and the adiabatic *criterion* T ≫ ħ‖∂ₜH‖/Δ² are equivalent statements.", "clarification": "They are not. The theorem is an asymptotic statement — the error tends to zero as the total time T → ∞ with the path in parameter space fixed. The criterion is an attempt to convert that into a finite-T error bound, and it is known to be neither necessary nor sufficient: Marzlin and Sanders [87] built an explicit two-level counterexample satisfying the criterion with non-adiabatic evolution, and Tong et al. [88] showed the standard condition guarantees adiabaticity only for a restricted class of systems. The failure mechanism is typically resonant accumulation of a small off-diagonal amplitude over a long time — a T-dependent effect that a pointwise instantaneous criterion cannot see. Rigorous finite-T bounds exist (Jansen–Ruskai–Seiler and successors) and involve integrals of ‖∂ₜH‖ and ‖∂ₜ²H‖ over the path, not a single instantaneous ratio."}, {"claim": "The gap condition is an essential hypothesis of the adiabatic theorem.", "clarification": "It is essential for *rates*, not for the theorem. Avron and Elgart [85] proved an adiabatic theorem with no gap condition at all, needing only that the relevant spectral projection be finite-rank and piecewise twice differentiable — the price is that one obtains convergence without a convergence rate. Conversely, a nonzero gap alone does not deliver adiabaticity at any specific finite T (see above). 'Gapped ⇒ adiabatic at T ≫ ħ/Δ²' is folklore in both directions."}, {"claim": "'Adiabatic' and 'nonadiabatic' in molecular physics refer to the adiabatic theorem's time evolution.", "clarification": "Two distinct usages. In Born–Oppenheimer language, 'adiabatic states' are the *instantaneous electronic eigenstates at fixed nuclear geometry* — a statement about a basis, not about a rate — and 'nonadiabatic coupling' is the derivative coupling ⟨m|∇_R n⟩, a static geometric object. In the adiabatic theorem, 'nonadiabatic transition' is a dynamical failure of following. Near a conical intersection the derivative coupling diverges and the gap closes: the basis is still well-defined (up to the sign ambiguity of [81]), but the theorem's hypotheses are violated outright. Papers that invoke 'the adiabatic theorem' to justify BO near a conical intersection are conflating the two."}, {"claim": "Berry's phase is a property of adiabatic evolution.", "clarification": "Berry's construction is adiabatic and cyclic, but the geometric phase is neither. Aharonov–Anandan (1987) removed adiabaticity, retaining only cyclicity in projective Hilbert space; Samuel–Bhandari removed cyclicity and unitarity. Adiabaticity is a sufficient condition for the parameter-space form γ(C) = −∮ Im⟨n|∇n⟩·dR, not a definition. Relatedly, the Pancharatnam phase (1956) is an interference phase between polarization states with no time evolution in sight."}, {"claim": "Open-system 'adiabatic master equations' are applications of the adiabatic theorem.", "clarification": "The Born–Fock/Kato theorem is a statement about unitary evolution generated by a self-adjoint H(t) with a spectral projection to follow. A Lindbladian has no eigenstate to be gap-protected in that sense; the relevant object is the instantaneous stationary state / kernel of the generator, and the relevant results are adiabatic theorems for generators of contracting evolutions (Avron–Fraas–Graf–Grech and successors), whose hypotheses (spectral gap of the *dissipative* generator, boundedness of the resolvent) are different and often unverified in practice. Citing Born–Fock 1928 for an open-system adiabatic elimination is a category error."}, {"claim": "Kato's adiabatic evolution is the physical evolution in the slow limit.", "clarification": "Kato's auxiliary dynamics — generated by i[∂ₛP(s), P(s)] and satisfying the intertwining relation exactly, not asymptotically — is a mathematical device: it is the parallel transport that makes the theorem an exact statement about a *different* propagator. The physical propagator converges to it, dressed by dynamical phases, as T → ∞. The two coincide only in the limit; 'Kato dynamics' is the geometric skeleton, not the Schrödinger evolution."}], "sections": [{"id": "pendulum-to-selection-rule", "title": "From a Shortened Pendulum to the Old Quantum Theory's Only Selection Rule", "markdown": "## From a Shortened Pendulum to the Old Quantum Theory's Only Selection Rule\n\nThe old quantum theory had a structural problem that is easy to forget now that it has been solved: it could quantize, but it could not say *what* to quantize. Planck set $E = nh\\nu$ for an oscillator; Bohr set $L = n\\hbar$ for a circular orbit; Sommerfeld and Wilson wrote $\\oint p_k\\,dq_k = n_k h$. Nothing in the framework explained why *those* quantities and not, say, $E$, or $E^2/\\nu$, or the orbital eccentricity. Worse, the choice had to be *stable*: if you deform a system continuously into another, the integers must not jump, or the theory assigns two different spectra to the same physical setup. Ehrenfest's adiabatic hypothesis was the only principled answer anyone produced to this question — the correspondence principle, which arrived later, answered a different one (transition intensities, not which coordinates carry integers).\n\n### Rayleigh, 1902\n\nThe invariant itself is classical, pre-quantum, and acoustical. In \"On the Pressure of Vibrations\" Rayleigh treated a pendulum whose string is drawn slowly through a fixed point, and showed that the energy and the frequency change together such that\n\n$$\\frac{E(t)}{\\nu(t)} = \\text{const}, \\qquad \\text{equivalently} \\qquad E\\sqrt{\\ell} = \\text{const},$$\n\nto leading order in the rate of shortening [1]. The mechanism is the work done against the tension's oscillation-averaged excess; the result is the first explicit adiabatic invariant in physics, and it is nearly never cited in quantum texts, which reach for [2] instead. Le Cornu (1895) had already handled parts of the same computation (verify). The modern name \"[Rayleigh–Lorentz pendulum](https://en.wikipedia.org/wiki/Rayleigh%E2%80%93Lorentz_pendulum)\" attaches Lorentz's name to a question he asked nine years after Rayleigh answered it.\n\n### Solvay, 1911: the principle stated out loud\n\nAt the first Solvay Council, Lorentz raised exactly Rayleigh's setup in quantum dress: shorten a \"quantum pendulum\" by sliding two fingers down the wire — what happens to $h\\nu$? Einstein's reply, printed in the discussion of the proceedings, is that if the change is infinitely slow the energy remains $h\\nu$ if it was $h\\nu$ [3]. That is the adiabatic principle: $E/\\nu$ invariant $\\Rightarrow$ the quantum number is preserved. It was spoken, not written as a paper, and is therefore invisible to citation indices — the earliest quantum statement of the principle has essentially zero priority weight in the literature.\n\n### Ehrenfest, 1913–1916: the hypothesis, and its Boltzmannian genealogy\n\nEhrenfest arrived independently and from a different direction. His 1913 KNAW paper identifies the source of adiabatic invariance in a mechanical theorem of Boltzmann's — the monocyclic-systems tradition running through Helmholtz and Clausius that sought a mechanical analogue of the second law — and singles out the phase integral $\\oint p\\,dq$ as the quantizable object [4]. The 1916 *Annalen* paper states the hypothesis in general form and fixes the vocabulary: *adiabatic invariants are exactly the quantities that may be set equal to integer multiples of $h$*, and reversible slow deformations map allowed motions to allowed motions [5]. Note what this is: a **selection rule for building a theory**, not a theorem about a differential equation. That distinction will matter for the rest of the dossier.\n\n### Burgers, 1917–18: the actual proof\n\nEhrenfest gave a physical argument and worked examples. The general theorem — that for separable, conditionally (multiply) periodic systems every action variable $J_k = \\oint p_k\\,dq_k$ is invariant under slow variation of parameters — was proved by his doctoral student Jan Burgers, using the canonical/angle-variable averaging machinery of celestial mechanics, in the KNAW Proceedings and *Philosophical Magazine* 33, 514 (1917) and extended in his Leiden dissertation on the Rutherford–Bohr atom [6][7] (a parallel *Annalen der Physik* 52 version also exists — verify). The old quantum theory's selection rule therefore rests on Burgers's theorem. Burgers is remembered for the Burgers equation and turbulence.\n\n### Bohr, 1918: rebranding\n\nBohr absorbed the hypothesis into the 1918 *Quantum Theory of Line Spectra* and renamed it the **principle of mechanical transformability**, explicitly to shed what he regarded as misleading thermodynamic connotations [8]. Under that name it became a load-bearing consistency principle rather than an unproved hypothesis — which is why much 1920s literature cites \"mechanical transformability\" and modern readers fail to recognize it as the same statement. See [Pérez \u0026 Valls](https://arxiv.org/abs/1502.03022) for the reception history.\n\n### Krutkov–Fock, 1923: the bridge\n\nKrutkov and Fock returned to Rayleigh's pendulum precisely to settle what Ehrenfest's hypothesis meant *mechanically*, treating the slowly varying length with the perturbative apparatus that Fock would carry into the quantum proof five years later [9]. This paper is the methodological ancestor of Born–Fock 1928 [2]; it is routinely cited, when cited at all, as \"Fock's early work.\" Krutkov was arrested in the 1936 Leningrad purges and disappeared from the record.\n\n### The four-way attribution failure\n\nThis dossier will cash out four separable defects, in ascending order of technical consequence:\n\n| # | Failure | Character |\n|---|---------|-----------|\n| 1 | Ehrenfest credited with a theorem Burgers proved [6][7] | under-crediting the prover |\n| 2 | Rayleigh's invariant [1] and Einstein's Solvay statement [3] absent from quantum citation practice | under-crediting the origin |\n| 3 | \"Born–Fock\" drifting to \"Born\"; Fock's gauge argument for $\\langle n\\mid\\partial_t n\\rangle$ [2] left unexamined for 55 years | erosion of a joint name |\n| 4 | Physicists state **Kato's** theorem — isolated spectral subspace, degeneracy permitted [10] — while citing **Born and Fock's** paper, which assumed a simple, discrete eigenvalue | outright attribution error with different hypotheses |\n\n**Established record:** Rayleigh's 1902 invariant; Burgers's proof; Bohr's renaming; the Krutkov–Fock lineage. **Plausible but disputed:** the weighting of Ehrenfest's sources — how much he took from Rayleigh's pendulum versus the Boltzmann–Helmholtz monocyclic tradition; [Navarro \u0026 Pérez](https://link.springer.com/article/10.1007/s00407-005-0105-1) [11] document both channels without settling their relative force. **Folklore:** that Ehrenfest \"proved\" adiabatic invariance, and that the adiabatic hypothesis and the adiabatic theorem are one statement in two languages."}, {"id": "derivation-with-numbered-assumptions", "title": "The Physics, Properly: Born–Fock's Expansion, Kato's Projections, and the Assumptions A1–A8", "markdown": "## The Physics, Properly: Born–Fock's Expansion, Kato's Projections, and the Assumptions A1–A8\n\nTwo derivations underlie every modern use of the theorem. They are not the same derivation, they do not have the same hypotheses, and the physics literature routinely states the second while citing the first.\n\n### The Born–Fock expansion\n\nFix a path $R(s)$ in parameter space, $s = t/T \\in $, and write $H(s)$ for the Hamiltonian along it. Let $H(s)\\lvert n(s)\\rangle = E_n(s)\\lvert n(s)\\rangle$ with the instantaneous eigenbasis complete and orthonormal. Expand the solution of $i\\hbar\\,\\partial_t\\psi = H(t)\\psi$ as\n\n$$\\lvert\\psi(t)\\rangle \\;=\\; \\sum_n c_n(t)\\,\\exp\\!\\Big[-\\tfrac{i}{\\hbar}\\!\\int_0^t\\! E_n(t')\\,dt'\\Big]\\,\\lvert n(t)\\rangle.$$\n\nSubstituting and projecting on $\\langle m\\rvert$ gives the exact coupled system that Born and Fock wrote down in 1928 [2]:\n\n$$\\dot c_m \\;=\\; -\\,c_m\\,\\langle m\\mid\\partial_t m\\rangle \\;-\\;\\sum_{n\\neq m} c_n\\,\\langle m\\mid\\partial_t n\\rangle\\; e^{-\\frac{i}{\\hbar}\\int_0^t (E_n-E_m)dt'}.$$\n\nDifferentiating the eigenvalue equation converts the off-diagonal overlap into the object every subsequent paper quotes,\n\n$$\\langle m\\mid\\partial_t n\\rangle \\;=\\; \\frac{\\langle m\\mid \\partial_t H\\mid n\\rangle}{E_n - E_m}, \\qquad m\\neq n,$$\n\nwhich under $t = Ts$ carries an explicit $1/T$. Integrating by parts against the rapidly oscillating exponential — the step where the gap $\\Delta = \\min_s\\lvert E_n - E_m\\rvert$ is *used*, not merely assumed — yields transition amplitudes $O(\\hbar\\,\\lVert\\partial_s H\\rVert/\\Delta^2 T)$ plus boundary terms at $s=0,1$. That is the entire content: **$O(1/T)$, with the constant set by the gap and the path, not by any instantaneous ratio.**\n\nThe first term is different in kind. The diagonal $\\langle n\\mid\\partial_t n\\rangle$ is pure imaginary, carries no $1/T$ suppression (it survives the limit), and Fock disposed of it by the gauge choice $\\lvert n(t)\\rangle \\to e^{i\\theta_n(t)}\\lvert n(t)\\rangle$ with $\\dot\\theta_n = i\\langle n\\mid\\partial_t n\\rangle$. For an open path this is exact and irreproachable. On a **closed** loop $C$ in parameter space the required $\\theta_n$ need not be single-valued, and the residue\n\n$$\\gamma_n(C) \\;=\\; i\\oint_C \\langle n\\mid\\nabla_R n\\rangle\\cdot dR$$\n\nis gauge-invariant. Simon [12] identified this as the holonomy of a connection on a Hermitian line bundle over parameter space; Berry [13] recognized it as physical. The term was never missing — it was correctly removed under an assumption (open path) that nobody had thought to relax for fifty-five years.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"12\" y=\"24\" fill=\"#e8e6e1\" font-size=\"16\" font-weight=\"bold\"\u003eThe two terms of the Born–Fock expansion\u003c/text\u003e\u003cline x1=\"40\" y1=\"70\" x2=\"300\" y2=\"70\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"310\" y=\"75\" fill=\"#7aa2ff\" font-size=\"15\"\u003eE_n(s) — followed level\u003c/text\u003e\u003cpath d=\"M40 150 C 140 150, 160 132, 200 128 C 240 132, 260 150, 300 150\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/
