\u003e\u003ctext x=\"310\" y=\"150\" fill=\"#ffb86b\" font-size=\"15\"\u003eE_m(s) — nearest neighbour\u003c/text\u003e\u003cline x1=\"200\" y1=\"70\" x2=\"200\" y2=\"128\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"206\" y=\"106\" fill=\"#e8e6e1\" font-size=\"14\"\u003eΔ\u003c/text\u003e\u003ctext x=\"40\" y=\"182\" fill=\"#e8e6e1\" font-size=\"14\"\u003es = 0\u003c/text\u003e\u003ctext x=\"272\" y=\"182\" fill=\"#e8e6e1\" font-size=\"14\"\u003es = 1\u003c/text\u003e\u003ctext x=\"40\" y=\"222\" fill=\"#ff7a90\" font-size=\"14\"\u003eoff-diagonal: ⟨m|∂H/∂t|n⟩ / (E_n − E_m)\u003c/text\u003e\u003ctext x=\"60\" y=\"244\" fill=\"#e8e6e1\" font-size=\"14\"\u003e→ amplitude O(1/T), killed by the gap [A3]\u003c/text\u003e\u003ctext x=\"40\" y=\"276\" fill=\"#7ee0a3\" font-size=\"14\"\u003ediagonal: ⟨n|∂_t n⟩ — NOT suppressed by 1/T\u003c/text\u003e\u003ctext x=\"60\" y=\"298\" fill=\"#e8e6e1\" font-size=\"14\"\u003eFock 1928: gauge it away (valid on an open path)\u003c/text\u003e\u003ccircle cx=\"560\" cy=\"300\" r=\"52\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cpath d=\"M600 272 l14 -6 -4 14\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"524\" y=\"305\" fill=\"#7ee0a3\" font-size=\"14\"\u003eC\u003c/text\u003e\u003ctext x=\"452\" y=\"372\" fill=\"#e8e6e1\" font-size=\"14\"\u003eclosed loop ⇒ residue γ(C) = i∮⟨n|∇n⟩·dR\u003c/text\u003e\u003ctext x=\"452\" y=\"392\" fill=\"#e8e6e1\" font-size=\"14\"\u003eis gauge-invariant [12][13]\u003c/text\u003e\u003ctext x=\"40\" y=\"330\" fill=\"#e8e6e1\" font-size=\"14\"\u003eTwo failure modes, two literatures: A3 governs the\u003c/text\u003e\u003ctext x=\"40\" y=\"350\" fill=\"#e8e6e1\" font-size=\"14\"\u003eleft column, A8 (open vs. cyclic path) the right.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: the same expansion split into the term that vanishes as $T\\to\\infty$ (gap-controlled, off-diagonal) and the term that does not (diagonal). Fock's gauge removal of the latter is valid precisely when the parameter path is not closed; closing it converts the discarded term into the geometric phase.*\n\n### Kato's recasting\n\nKato [10] removed the eigenvectors entirely. Let $P(s)$ be the spectral projection onto the isolated part $\\sigma_*(s)$ of the spectrum. Differentiating $P^2 = P$ gives $\\dot P = \\dot P P + P \\dot P$, hence $P\\dot P P = 0$ — the derivative is purely off-diagonal in the $P/(1-P)$ splitting. Kato then defines the generator\n\n$$K(s) \\;=\\; i\\,[\\dot P(s),\\, P(s)],$$\n\nwhose propagator $U_A(s)$ (the \"Kato dynamics\", or adiabatic intertwiner) satisfies **exactly**\n\n$$U_A(s)\\,P(0)\\,U_A(s)^{-1} \\;=\\; P(s),$$\n\nfor all $s$, with no error term at all. The theorem is then the statement that the *physical* propagator $U_T(s)$ generated by $H(Ts)/\\hbar$ satisfies $\\lVert (U_T - U_A)P(0)\\rVert = O(1/T)$. Nothing here requires a nondegenerate level, a choice of phase, or even a discrete spectrum outside $\\sigma_*$: $\\sigma_*$ may be a degenerate eigenvalue, a band, or a cluster, provided it stays separated from the rest. This is the version physicists actually state — and then cite Born–Fock for.\n\n### The hypotheses, numbered\n\nThese labels are used verbatim throughout §3–§6.\n\n| | Hypothesis | Used for |\n|---|---|---|\n| **A1** | $H(t)$ self-adjoint for each $t$, on a **$t$-independent domain** $D \\subset \\mathcal H$ | existence/uniqueness of $U_T$; silently violated by moving boundaries, expanding boxes, $\\delta$-couplings |\n| **A2** | $t\\mapsto H(t)$ (or $t\\mapsto P(t)$) is $C^k$, $k\\geq 2$, or piecewise so | integration by parts; $k=1$ gives convergence, $k\\ge2$ gives the $1/T$ rate |\n| **A3** | $\\sigma_*(s)$ is **isolated** from the rest of $\\sigma(H(s))$ by a gap $\\Delta \u003e 0$, uniformly in $s$ | the resolvent bound $\\lVert(H-z)^{-1}\\rVert\\le 1/\\Delta$; sets the $\\Delta^{-2}$ in every error estimate |\n| **A4** | $P(s)$ has fixed, finite rank (Born–Fock: rank one and simple) | rules out level crossings *inside* $\\sigma_*$ and rank changes; Avron–Elgart [14] keep A4, drop A3 |\n| **A5** | $\\partial_t H$ bounded, or $H$-bounded with uniform relative bound | makes $\\langle m\\mid\\partial_t H\\mid n\\rangle$ finite; fails for unbounded perturbations |\n| **A6** | The relevant spectrum is discrete near $\\sigma_*$ (Born–Fock assumed purely discrete) | legitimizes the eigenbasis expansion; continuous spectrum needs A3 in resolvent form |\n| **A7** | Closed-system, unitary generation by a self-adjoint $H$ | the entire proof; Lindbladians satisfy none of it |\n| **A8** | Fixed path in parameter space, asymptotics as $T\\to\\infty$; path open unless stated | this is an $\\varepsilon\\to 0$ statement, *not* a finite-$T$ bound — and closing the path resurrects $\\gamma(C)$ |\n\nBorn–Fock 1928 assume A1–A8 with A4 at rank one and A6 at \"purely discrete\" [2]. Kato 1950 needs only A1–A3, A5, A7, A8, with A4 weakened to finite rank and A6 dropped outright [10]. Avron–Elgart 1999 discard A3 [14]. The counterexample literature [15][16] attacks A8: every published pathology is a finite-$T$ statement dressed as a violation of a $T\\to\\infty$ theorem."}, {"id": "failure-modes-assumption-by-assumption", "title": "Where Each Hypothesis Breaks: Gaps, Crossings, Continuous Spectrum, and the Finite-T Problem", "markdown": "## Where Each Hypothesis Breaks: Gaps, Crossings, Continuous Spectrum, and the Finite-T Problem\n\nTake the assumptions in the order established in §2 and ask, for each, what the world does when it fails. The useful discipline is that every failure has a controlling parameter, and that parameter is not always the gap.\n\n**A1 (self-adjoint generator, unitary evolution).** This is the hypothesis that fails silently, because it fails outside the theorem's own language. A Lindbladian $\\mathcal{L}(t)$ has no spectral projection onto an eigenvector to be followed; what survives is the instantaneous kernel — the stationary state — and adiabatic theorems for generators of contracting evolutions require a gap in the *dissipative* spectrum plus resolvent bounds, hypotheses that are almost never checked in the papers that invoke them. Nothing in Born–Fock [2] or Kato [10] licenses this, and the extension is a genuinely different theorem, not a corollary.\n\n**A2 (smoothness of $H(s)$ in the scaled time $s = t/T$).** This is the hypothesis that controls the *exponent*, and it is the one most often left unstated. For $H \\in C^1$ with endpoints where $\\partial_s H \\neq 0$, the error is $O(1/T)$ and the leading term is a boundary contribution — the switching-on and switching-off transients, not the interior of the path. If $\\partial_s^k H$ vanishes at both endpoints for $k = 1,\\dots,m$, the error drops to $O(T^{-m-1})$; if $H(s)$ is $C^\\infty$ with all derivatives vanishing at the endpoints, one gets superpolynomial decay; if $H(s)$ is analytic in a strip of width $\\delta$ about the real axis, the error is $O(e^{-cT\\delta})$ (Nenciu; Joye–Pfister; Hagedorn–Joye) *(verify)*. The exponentially-small-transitions folklore is a statement about analyticity plus smooth switching, and it is routinely quoted as though it were the generic behavior of the theorem.\n\n**A3 (isolated eigenvalue / spectral gap).** The gap buys the *rate*, not the theorem. Avron and Elgart proved an adiabatic theorem with no gap condition whatsoever, requiring only that the relevant spectral projection $P(s)$ be finite-rank and piecewise twice differentiable [14]; the price is convergence without any error estimate — $\\|(1-P)U\\psi\\| \\to 0$ as $T\\to\\infty$, with no $T$ at which you may stop. So the textbook implication runs backwards in both directions: gaplessness does not kill adiabaticity, and a gap does not certify it at any finite $T$ (see A6). The gap's real role is dimensional: $\\Delta$ is what makes $\\hbar\\|\\partial_t H\\|/\\Delta^2$ a time.\n\n**A4 (nondegeneracy along the path) and gap closure.** When two levels approach and separate linearly in time with coupling $V$, Landau, Zener, Stückelberg and Majorana independently obtained in 1932 the transition probability $P = e^{-2\\pi\\Gamma}$ with\n$$\\Gamma = \\frac{|V|^2}{\\hbar\\,|d(E_1-E_2)/dt|},$$\nwhich is the theorem's failure made quantitative [17]. Note what $\\Gamma$ contains: the *rate of gap traversal*, not the minimum gap alone. This is the only regime where \"how slow is slow enough\" has a closed-form answer, which is why the whole subject leans on it well past its two-level, linear-sweep hypotheses.\n\nAt a genuine conical intersection the situation is worse than a small gap. The derivative coupling $\\langle m \\mid \\nabla_R n\\rangle$ diverges as $1/R$ as the intersection is approached, $P(s)$ is not differentiable, and the real adiabatic electronic wavefunction changes sign around a circuit — the $\\mathbb{Z}_2$ geometric phase found in the Jahn–Teller literature in 1958 [18]. A3, A4, and the differentiability required by A2 all fail simultaneously, and even Avron–Elgart's weakened hypothesis (piecewise $C^2$ projection) is not satisfied. Invoking \"the adiabatic theorem\" to justify Born–Oppenheimer near a conical intersection is not an approximation being pushed hard; it is the invocation of a theorem none of whose hypotheses hold.\n\n**A5 (discrete spectrum / spectral projection exists).** With continuous spectrum the object being followed may not exist. An eigenvalue embedded in the continuum generically dissolves under perturbation into a resonance with width $\\Gamma_{\\rm res}$; there is no rank-one $P(s)$ to transport, and the correct statement involves survival of the resonance pole with an additional decay factor $e^{-\\Gamma_{\\rm res} T/\\hbar}$ competing against the adiabatic suppression. The two limits do not commute: slowing down improves following but increases decay. Threshold points, where a bound state is absorbed into the continuum, break the theorem outright even though the \"gap\" to the rest of the discrete spectrum may be large.\n\n**A6 (finite $T$ vs. $T\\to\\infty$).** The theorem is asymptotic in $T$ along a *fixed* path; the folk criterion\n$$T \\gg \\frac{\\hbar\\,\\|\\partial_t H\\|}{\\Delta^2}$$\nis an attempt to read a finite-$T$ bound off an asymptotic statement, and it is neither necessary nor sufficient. Marzlin and Sanders built an explicit two-level Hamiltonian satisfying the criterion whose evolution is not adiabatic [15]; Tong, Singh, Kwek and Oh showed the standard quantitative condition secures adiabaticity only for a restricted class of systems [16]. The mechanism is structural, not pathological: a small off-diagonal amplitude accumulating resonantly over a long time is a $T$-dependent effect that any pointwise instantaneous ratio is blind to. The correct replacement is a Jansen–Ruskai–Seiler-type bound, of the schematic form\n$$\\|(1-P(1))U_T\\psi\\| \\;\\le\\; \\frac{C}{T}\\left[\\frac{\\|\\partial_s H(0)\\|}{\\Delta(0)^2} + \\frac{\\|\\partial_s H(1)\\|}{\\Delta(1)^2} + \\int_0^1\\!\\left(\\frac{\\|\\partial_s^2 H\\|}{\\Delta^2} + \\frac{\\|\\partial_s H\\|^2}{\\Delta^3}\\right)ds\\right],$$\nwhich contains second derivatives, an integral along the path, and separated boundary terms — none of which the instantaneous criterion has. Every feature of the counterexamples is visible in the structure of this bound.\n\n**The classical contrast.** Ehrenfest's and Burgers's invariance [6] and Born–Fock following [2] are not the same claim, and their error laws differ qualitatively. For an analytic one-frequency Hamiltonian, the classical action $I$ is conserved to $O(e^{-c/\\varepsilon})$ (Neishtadt; Nekhoroshev-type estimates) *(verify)*: a *number* is preserved to all orders. Quantum adiabatic following preserves a *state*, and generically only to $O(\\varepsilon)$, the improvement to exponential requiring the analyticity and smooth-switching hypotheses of A2. Quoting exponentially small nonadiabatic transitions as a general fact imports the classical result into a setting that has not earned it."}, {"id": "signatures-direct-and-circumstantial", "title": "Signatures: What Actually Demonstrates Adiabatic Following, and What Merely Looks Like It", "markdown": "## Signatures: What Actually Demonstrates Adiabatic Following, and What Merely Looks Like It\n\nThe claim \"the system followed adiabatically\" is, operationally, a claim about a *functional dependence*, not about an outcome. Population in the right state at the end of the pulse is compatible with at least six mechanisms, only one of which is the theorem. What distinguishes them is how the observable moves when you vary the knobs the theorem's hypotheses name: the sweep rate, the gap, the path in parameter space, the direction of traversal, and the coupling to the environment. Below: the signatures that are diagnostic, and the ones that only correlate.\n\n### Direct signatures\n\n**1. The Landau–Zener rate law and its Stückelberg fringes.** For a linear sweep through an avoided crossing with gap $\\Delta$ and sweep velocity $v = |\\partial_t(E_1-E_2)|$, the diabatic transition probability is\n\n$$P_{\\rm dia} = e^{-2\\pi\\Gamma}, \\qquad \\Gamma = \\frac{\\Delta^2}{4\\hbar v},$$\n\nso a plot of $\\ln P$ against $1/v$ must be a straight line of slope $-\\pi\\Delta^2/2\\hbar$ [17]. This is a two-parameter falsifiable prediction, not a fit: measure $\\Delta$ spectroscopically, then the slope is fixed. Traverse the crossing *twice* and the two adiabatic paths interfere, producing Stückelberg oscillations in $P$ versus the dwell phase — fringes whose spacing measures the accumulated dynamical phase between crossings. Fringes are the strong evidence, because incoherent leakage and heating reproduce a monotone $P(v)$ but cannot reproduce coherent interference. Note what the LZ law is *not*: it is a statement about one isolated crossing, and it is exact in a model with linearly swept, infinitely extended asymptotics. Applying $e^{-2\\pi\\Gamma}$ to a finite pulse with sharp switch-on imports edge effects that dominate at large $\\Gamma$.\n\n**2. Gap scaling at fixed rate.** The cleanest test, and the rarest. Hold the trajectory and the total time $T$ fixed and tune $\\Delta$ independently — in a superconducting qubit via a coupling drive amplitude, in a molecular beam via an applied field detuning. The theorem's content is that infidelity collapses as $\\Delta$ opens; if $\\Delta$ is varied by an order of magnitude and $1-F$ does not move, whatever produced the fidelity is not gap-protected following.\n\n**3. Gauge-invariant cyclic geometric phase.** Adiabatic transport around a closed loop $C$ in parameter space should produce, over and above the dynamical phase, $\\gamma(C) = -\\oint_C \\mathrm{Im}\\langle n|\\nabla_R n\\rangle\\cdot d\\mathbf{R}$, which for spin-$j$ in a slowly rotated field is $-j\\,\\Omega(C)$, the solid angle subtended [13]. The signature is *geometric*: $\\gamma$ must depend on the loop's shape and enclosed flux and be independent of how fast the loop is traversed, and must reverse sign when the loop is reversed while the dynamical phase does not. In the real-wavefunction case the phase collapses to $\\mathbb{Z}_2$: a circuit encircling a conical intersection flips the sign of the adiabatic electronic state — the Herzberg–Longuet-Higgins effect, visible as half-integer vibronic quantum numbers in Jahn–Teller spectra [18]. Half-integer level spacing is essentially unfakeable by any dynamical-phase artifact.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"10\" y=\"22\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"sans-serif\"\u003eDiscriminating adiabatic following: vary the knob, watch the scaling\u003c/text\u003e\u003cline x1=\"60\" y1=\"330\" x2=\"330\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"60\" y1=\"330\" x2=\"60\" y2=\"70\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"150\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003esweep time T →\u003c/text\u003e\u003ctext x=\"14\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003eln (1 − F)\u003c/text\u003e\u003cpath d=\"M70 100 L120 140 L170 185 L230 245 L300 315\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"196\" y=\"150\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"sans-serif\"\u003eadiabatic: slope ∝ −Δ²/ħ\u003c/text\u003e\u003cpath d=\"M70 150 C130 148 200 149 300 150\" stroke=\"#ffb86b\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"150\" y=\"140\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"sans-serif\"\u003eπ-pulse / STA: T-independent\u003c/text\u003e\u003cpath d=\"M70 300 C130 250 190 200 300 120\" stroke=\"#ff7a90\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"120\" y=\"310\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003edecoherence-limited: worsens\u003c/text\u003e\u003cline x1=\"420\" y1=\"330\" x2=\"690\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"420\" y1=\"330\" x2=\"420\" y2=\"70\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"500\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003egap Δ (T fixed) →\u003c/text\u003e\u003ctext x=\"374\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003e1 − F\u003c/text\u003e\u003cpath d=\"M430 100 C470 250 520 305 680 318\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"500\" y=\"140\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"sans-serif\"\u003egap-protected: collapses\u003c/text\u003e\u003cpath d=\"M430 220 C520 219 600 221 680 220\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"470\" y=\"208\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003edark state / degeneracy: flat in Δ\u003c/text\u003e\u003ctext x=\"60\" y=\"386\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003eLeft: rate scaling separates following from pulse-area effects. Right: gap scaling separates it from null-eigenvalue tracking.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The two scalings that carry the evidential weight. High fidelity at a single operating point sits on every curve at once; only the derivatives distinguish the mechanisms. A dark state (green) is exactly degenerate-eigenvalue tracking and is by construction insensitive to the Δ that gap-protected following depends on.*\n\n### Circumstantial signatures, and how to break them\n\n**High final-state fidelity alone.** Shortcuts to adiabaticity are engineered to reach the adiabatic *endpoint* while violating adiabaticity throughout — counterdiabatic driving adds $H_{\\rm CD} = i\\hbar\\sum_n(|\\partial_t n\\rangle\\langle n| - \\langle n|\\partial_t n\\rangle|n\\rangle\\langle n|)$ precisely to cancel the following error, and a well-tuned resonant $\\pi$-pulse reaches the same endpoint with no slowness at all. *Discriminator:* sample the state mid-sweep (interrupt the ramp and do tomography, or measure the spectroscopic response at intermediate times). Adiabatic following predicts the instantaneous eigenstate at every intermediate time; a $\\pi$-pulse or a counterdiabatic protocol does not. Failing that, the $T$-scaling: STA fidelity is flat in $T$, adiabatic fidelity is monotone.\n\n**Dark-state / STIRAP transfer.** Complete population transfer through a zero-eigenvalue dark state is the most frequently mislabeled case. What protects it is that $|D\\rangle$ is an exact null eigenvector of the coupling Hamiltonian for all pulse shapes; the relevant \"gap\" to the bright states is set by the *Rabi frequencies*, not by a spectral feature of a Hamiltonian being deformed. *Discriminator:* the transfer efficiency depends on $\\Omega_{\\rm rms}\\tau$ and on pulse ordering/overlap, and is famously insensitive to detuning from the intermediate state — including large one-photon detuning where the intermediate level is never populated. A genuine gap-protected process cannot be indifferent to the level it is supposedly gapped from.\n\n**Slow driving with a good result in an open system.** Dephasing in the instantaneous eigenbasis relaxes a system *into* the instantaneous ground state; slower is then better for reasons that have nothing to do with unitary following, and Born–Fock/Kato do not apply at all (this is the category error catalogued in §3). *Discriminator:* run the loop in reverse, and run it at fixed $T$ with the environment coupling varied. Unitary following is reversible — retracing the path returns you to the initial state — while dissipative pumping is not. Equivalently, check whether the final state depends on the initial state at all; a pumped system forgets it.\n\n**Geometric phase from an interferometric phase shift.** Any $\\gamma$ extracted by subtracting a separately measured dynamical phase inherits that measurement's systematics; a miscalibrated $\\int E\\,dt$ produces a spurious \"geometric\" offset that scales innocuously with loop area if the loop area and the traversal time were varied together. *Discriminator:* vary loop area at *fixed* traversal time and fixed $\\int E\\,dt$; or use spin-echo to cancel the dynamical phase identically rather than subtracting it; or reverse the loop orientation — $\\gamma \\to -\\gamma$ while the dynamical phase is unchanged. And demand the solid-angle functional form across a family of non-similar loops, not a single number.\n\nThe general rule: every one of these tests works by moving a variable that appears in the theorem's hypotheses and checking that the observable moves the way the hypothesis says it must. A demonstration that reports one operating point reports a coincidence, and — given the Marzlin–Sanders and Tong *et al.* counterexamples [15][16] — the instantaneous slowness criterion computed at that point is not a substitute for the scan."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: The Gapless Citation, the Instantaneous Criterion, and 'Adiabatic' as an Honorific", "markdown": "## Use \u0026 Abuse: The Gapless Citation, the Instantaneous Criterion, and 'Adiabatic' as an Honorific\n\nWhat follows is a field guide. Each entry names the assumption from §2 that is being quietly dropped, and the published result that forbids the drop.\n\n**(i) The gapless citation — A3 and A8 dropped together.** The most common failure is a sentence of the form \"by the adiabatic theorem, the system remains in its instantaneous ground state,\" with no $\\Delta$ named and no statement of what $T$ is large compared to. This is not merely informal: it is the deletion of both the isolation hypothesis A3 and the asymptotic structure A8. A3 fixes *which* spectral patch is being followed; A8 says the error vanishes as $T\\to\\infty$ along a *fixed* path in parameter space. A claim with neither is unfalsifiable — there is no $T$ at which it can be wrong. Note the asymmetry Avron and Elgart established [14]: dropping A3 does not destroy the theorem (a finite-rank, piecewise twice-differentiable projection suffices) but destroys the *rate*. So the gapless citation is doubly confused — it treats the gap as indispensable rhetorically while never bounding it numerically.\n\n**(ii) The instantaneous criterion mistaken for the theorem.** The ubiquitous condition\n\n$$\\max_t \\frac{\\hbar\\,\\bigl|\\langle m(t)\\mid \\partial_t H\\mid n(t)\\rangle\\bigr|}{\\bigl(E_m(t)-E_n(t)\\bigr)^2}\\ \\ll\\ 1$$\n\nis not the theorem, is not implied by it, and does not imply it. Marzlin and Sanders [15] made this concrete with a two-level construction: given $H(t)$ with propagator $U(t)$, the dual Hamiltonian $\\tilde H(t) = -U^\\dagger(t)H(t)U(t)$ has propagator $U^\\dagger(t)$ and — because the criterion is built from unitarily covariant matrix elements and gaps — satisfies the *identical* bound. The adiabatic conclusions drawn for the two are mutually contradictory. Tong, Singh, Kwek and Oh [16] then showed the standard condition is sufficient only for a restricted class. The mechanism is visible in the exact amplitude,\n\n$$c_m(T) \\;\\sim\\; -\\int_0^T\\! dt\\;\\frac{\\langle m\\mid \\partial_t H\\mid n\\rangle}{E_m-E_n}\\;\\exp\\!\\Bigl[\\tfrac{i}{\\hbar}\\!\\int_0^t\\!\\bigl(E_m-E_n\\bigr)dt'\\Bigr],$$\n\nwhose $O(1/T)$ size comes from integration by parts and therefore *presupposes* the phase is non-stationary. If $\\partial_t H$ carries a component oscillating at the instantaneous Bohr frequency with amplitude falling like $1/T$, the phase cancels, the integrand adds coherently over a window growing like $T$, and $c_m(T)=O(1)$ while the pointwise ratio is $O(1/T)$. A [later analysis](https://arxiv.org/abs/1111.5195) confirms the inconsistency arises precisely for Hamiltonians containing resonant terms whose amplitudes vanish asymptotically. A criterion evaluated pointwise in $t$ has no access to a resonance defined by accumulation over $t$ — this is structural, not a matter of sharpening constants. The honest finite-$T$ statements are integral bounds, e.g. [Jansen–Ruskai–Seiler](https://arxiv.org/abs/quant-ph/0603175), involving $\\int \\|\\partial_t H\\|/\\Delta^2$ *and* $\\int\\|\\partial_t^2 H\\|/\\Delta^2$, with exponentially small errors only under analyticity and smooth switching.\n\n**(iii) Citing Born–Fock for Kato's theorem.** Born and Fock [2] assumed a simple, isolated eigenvalue of a discrete spectrum with a differentiable eigenvector. Nearly every modern application follows a degenerate or high-dimensional spectral subspace — a ground-state manifold, a Landau level, a band. That is Kato's projection-valued theorem [10], with its own hypotheses. The citation is not a courtesy misattribution; it points the reader at a set of hypotheses the work does not satisfy.\n\n**(iv) Adiabatic quantum computing runtimes with an unbounded gap.** The Farhi–Goldstone–Gutmann–Sipser algorithm [19] has runtime governed by $\\Delta_{\\min}^{-2}$ (or better, under the integral bounds). A polynomial runtime claim is therefore a claim about $\\Delta_{\\min}(n)$ for the interpolating path on the specific instance family — typically an Ising encoding [20] — and this is the hard part, not a detail. Small-$n$ numerics do not bound it: first-order quantum phase transitions along the path drive $\\Delta_{\\min}$ exponentially small in $n$, and the transition need not be visible at accessible sizes. \"We verified adiabaticity up to 16 qubits\" is a statement about 16 qubits.\n\n**(v) Shortcuts marketed as theorem consequences.** STIRAP's robustness comes from the dark state $|D\\rangle \\propto \\cos\\theta|1\\rangle - \\sin\\theta|3\\rangle$, an exact zero-eigenvalue eigenvector whose *structural* decoupling from the lossy intermediate state does most of the work; the theorem supplies only the tracking of $\\theta(t)$. Counterdiabatic / transitionless driving (Demirplak–Rice; Berry 2009) goes further: it adds $H_{\\rm CD} = i\\hbar\\sum_n\\bigl(|\\partial_t n\\rangle\\langle n| - \\langle n|\\partial_t n\\rangle|n\\rangle\\langle n|\\bigr)$ precisely to make the evolution exact at *any* speed — the theorem is what is being circumvented, not invoked ([review](https://arxiv.org/abs/1212.6343)).\n\n**(vi) Open-system \"adiabatic master equations.\"** A Lindbladian is not self-adjoint and has no gap-protected eigenstate to follow; the object being tracked is the kernel of the instantaneous generator. The correct framework is adiabatic theory for generators of contracting evolutions ([Avron–Fraas–Graf–Grech](https://arxiv.org/abs/1106.4661)), where the lowest-order result is parallel transport in the manifold of instantaneous stationary states, with dissipative-gap and resolvent hypotheses. Citing [2] here is a category error, not a controlled approximation.\n\n**(vii) Born–Oppenheimer near conical intersections, and the two equivocations.** The derivative coupling $\\langle m|\\nabla_R n\\rangle = \\langle m|\\nabla_R H|n\\rangle/(E_n-E_m)$ diverges exactly where the gap closes [18]; invoking the adiabatic theorem there asserts the hypotheses at the one point they fail. Two word-level confusions feed this: the *adiabatic basis* (instantaneous electronic eigenstates — a static object) versus *adiabatic dynamics* (a rate claim); and thermodynamic adiabaticity ($\\delta Q=0$, arbitrarily fast) versus mechanical adiabaticity (slow, maximally coupled). A fast adiabatic compression is one and the negation of the other.\n\n### The tells\n\nA claim is hollow when: no $\\Delta$ or $\\Delta_{\\min}$ is quoted anywhere; no error-versus-$T$ scaling is exhibited, only a single simulation at one $T$; the bound cited contains $\\partial_t H$ but never $\\partial_t^2 H$ or the switching profile; the spectral object being followed is never identified as a level or a projection; and \"adiabatic\" appears as an honorific — a synonym for *we went slowly and it worked* — rather than as the name of a hypothesis someone could fail."}, {"id": "status-and-checklist", "title": "Status Today — Mutated, Not Superseded — and What AETHER Demands of a New Claim", "markdown": "## Status Today — Mutated, Not Superseded — and What AETHER Demands of a New Claim\n\nThe theorem is in the odd position of being simultaneously more rigorous and more abused than at any point in its history. Both trends are real, and they run on separate tracks: the mathematical physics literature has been repairing and extending the statement continuously since 1999, while the applied literature has largely frozen at a 1928 slogan that Born and Fock did not prove [2].\n\n**What has actually been built.** Five distinct lineages have grown out of Kato's projection formalism [10], and they are not interchangeable.\n\n*Finite-$T$ bounds.* [Jansen, Ruskai and Seiler (2007)](https://arxiv.org/abs/quant-ph/0603175) replaced the asymptotic statement with an explicit inequality: for a gapped path $H(s)$, $s = t/T$, the error obeys a bound of the schematic form\n$$\\|\\,P(1)-\\tilde P(1)\\,\\| \\;\\le\\; \\frac{C}{T}\\left[\\frac{\\|H'(0)\\|}{\\Delta(0)^2}+\\frac{\\|H'(1)\\|}{\\Delta(1)^2}+\\int_0^1\\!\\left(\\frac{\\|H''\\|}{\\Delta^2}+\\frac{\\|H'\\|^2}{\\Delta^3}\\right)ds\\right],$$\nwith computable constants. This — not $T \\gg \\hbar\\|\\partial_t H\\|/\\Delta^2$ — is the object that actually licenses a finite-time adiabatic claim. Note the $\\|H''\\|$ term: the criterion in circulation contains no second derivative at all, which is precisely the crack the counterexamples of Marzlin–Sanders [15] and Tong *et al.* [16] exploit.\n\n*Gapless and rate-free.* Avron–Elgart [14] survives intact, and has been complemented by results where the gap is replaced by something weaker: [Elgart and Hagedorn](https://arxiv.org/abs/1002.1741) proved adiabatic theorems for *resonances* rather than bound states, which is the right object when an eigenvalue is embedded in continuous spectrum and becomes metastable under perturbation. On timescales short compared with the resonance lifetime the two are operationally indistinguishable; on longer ones the theorem simply does not apply, and no amount of slowness helps.\n\n*Many-body.* This is the most consequential extension and the one most often misunderstood. For an extensive $H(s)=\\sum_x h_x(s)$, the total $\\|\\partial_s H\\|$ grows with volume while the gap does not, so the single-particle bounds above are vacuous in the thermodynamic limit. Hastings's quasi-adiabatic continuation, and then [Bachmann, De Roeck and Fraas (PRL 119, 060201, 2017)](https://arxiv.org/abs/1612.01505), fixed this by trading operator norms for locality: with Lieb–Robinson bounds supplying the causal structure, one obtains an adiabatic theorem uniform in system size, with a *density* of nonadiabatic excitations that is superpolynomially (in fact almost-exponentially, with a dimension-dependent exponent) small in the driving rate. This is what makes a mathematical proof of the Kubo formula possible for interacting gapped systems, and it is the correct citation for any claim about adiabatic state preparation on a lattice.\n\n*Discrete time.* Digital algorithms do not evolve under $H(s)$; they apply a sequence of unitaries. [Costa *et al.*, PRX Quantum 3, 040303 (2022)](https://arxiv.org/abs/2111.08152) proved an adiabatic theorem intrinsically for discrete-time walks, which is what delivered the optimal $O(\\kappa\\log(1/\\epsilon))$ linear-systems solver. Papers invoking Farhi *et al.* [19] for a gate-model circuit are citing a continuous-time statement for a discrete-time process.\n\n*Open systems.* [Avron, Fraas, Graf and Grech (2012)](https://arxiv.org/abs/1106.4661) built adiabatic theory for generators of contracting evolutions on Banach spaces, covering Lindbladians and classical stochastic generators in one framework. The transported object is the instantaneous *stationary state*, the kernel of the generator — not an eigenvector of a Hamiltonian — and the relevant gap is the dissipative one.\n\n**What is genuinely open.** Sharp constants for many-body gapped systems: the exponent in the excitation density is dimension-dependent and not known to be optimal, and the crossover to the Kibble–Zurek regime as the gap closes with system size is not covered by any single theorem. Adiabatic theorems in the presence of true embedded eigenvalues without a resonance approximation remain fragmentary. Honest, computable error control for driven Lindbladians — bounds whose ingredients an experimentalist can actually estimate — is largely missing; most \"adiabatic master equation\" papers verify no hypothesis at all. And no rigorous adiabatic theorem currently covers a gap that closes polynomially in $N$ at a first-order many-body transition, which is exactly the regime adiabatic quantum optimization lives in.\n\n### The AETHER checklist\n\nA claim of adiabaticity is admissible only if the paper answers all nine:\n\n1. **Which theorem.** Born–Fock [2], Kato [10], Avron–Elgart [14], Jansen–Ruskai–Seiler, discrete-time, many-body, or dissipative — named, not gestured at. State which of A1–A8 are verified and which are assumed.\n2. **The gap.** $\\Delta$ quantified, with its scaling in system size and in any parameter driven toward a critical point. \"Gapped\" without $\\Delta(N)$ is not a hypothesis.\n3. **A finite-$T$ bound, not a ratio.** Path integrals of $\\|\\partial_s H\\|$ and $\\|\\partial_s^2 H\\|$ against powers of $\\Delta$. The instantaneous criterion is neither necessary nor sufficient [15][16]; quoting it is a citation of folklore.\n4. **Rate scaling.** Measured or computed infidelity versus $T$ over at least a decade, with the exponent reported. One slow run is not evidence of following.\n5. **Smoothness class and switching profile.** $C^k$ or analytic; boundary derivatives specified. Exponential suppression is a *smooth-switching* result and is silently imported far too often.\n6. **Unitary or not.** If not, name the dissipative adiabatic theorem and its gap condition.\n7. **Extensivity.** For many-body claims, cite a locality-based theorem and report a *density* of excitations, not a global overlap.\n8. **Phase claims.** Gauge-invariant and cyclic, or else not a geometric phase [12][13]; open-path phases require a stated gauge convention.\n9. **Basis versus dynamics.** State explicitly whether \"adiabatic\" denotes the instantaneous eigenbasis or actual following. Near a crossing these are opposites [17]."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\n### What I will defend\n\nThree things, without qualification.\n\nFirst: **the theorem is true and it is Kato's, not Born and Fock's.** The object worth stating is the intertwining property of the Kato propagator — $U_A(s)P(0) = P(s)U_A(s)$ holding *exactly*, with the physical propagator converging to $U_A$ dressed by dynamical phases as $T \\to \\infty$. This survives degeneracy, survives level crossings *within* the followed subspace, and is the version every physicist actually means. Citing Born–Fock 1928 for it is not a venial sin; the 1928 hypotheses (simple eigenvalue, purely discrete spectrum) exclude most of what the citation is used to license.\n\nSecond: **the standard adiabatic criterion $T \\gg \\hbar\\|\\partial_t H\\|/\\Delta^2$ is not a theorem and should be treated as a heuristic with known counterexamples.** Marzlin and Sanders [15] closed this question with an explicit construction; Tong et al. [16] delimited when the condition is sufficient. A pointwise ratio cannot detect resonant accumulation of amplitude over long times, because the failure mode is $T$-dependent and the criterion is not. Anyone reporting an adiabatic protocol should quote a Jansen–Ruskai–Seiler-type bound — integrals of $\\|\\partial_s H\\|$ and $\\|\\partial_s^2 H\\|$ along the path, with boundary terms — or say plainly that they are using folklore.\n\nThird: **the gap is a hypothesis about rates, not about the conclusion.** Avron and Elgart [14] proved adiabatic following with no gap condition, at the cost of losing the rate. This cuts both ways and the community reliably gets both directions wrong: gapless does not mean the theorem fails, and gapped does not mean adiabaticity at any particular finite $T$.\n\n### What is shakier than advertised\n\n**A5 (the gap as a physical quantity in the thermodynamic limit).** Most many-body adiabatic claims — quantum annealing complexity arguments above all — require a gap that closes at worst polynomially in system size, and this is almost never established. The theorem is invoked to carry an assumption that is itself the hard open problem.\n\n**A7 (unitarity).** The Lindbladian case is the most widespread category error in the field. There is no eigenstate to gap-protect; the relevant object is the kernel of the generator, and the relevant hypotheses (spectral gap of the *dissipative* generator, resolvent bounds) are usually neither stated nor checked. \"Adiabatic elimination\" citing Born–Fock is not a loose citation, it is a citation to a theorem about a different mathematical object.\n\n**A3 (isolation of the spectral subspace, in the presence of a continuum).** Resonances are not eigenvalues. Adiabatic theorems in the presence of continuous spectrum exist but are delicate and regime-bound; the literature routinely uses the discrete-spectrum statement for metastable states embedded in a continuum, where the correct statement involves exponential decay competing with the sweep rate.\n\n**Error-scaling transfer.** The $\\exp(-c/\\varepsilon)$ results are classical-invariance results or smooth-switching results. Quoting them as generic quantum adiabatic behaviour imports a boundary-condition hypothesis silently — this is the invariance/following conflation doing real damage in numbers people publish.\n\n### The three questions I would work on\n\n1. **Verifiable finite-$T$ certificates for many-body adiabatic protocols.** We have rigorous bounds whose ingredients (the gap along the path) are uncomputable in exactly the cases we care about; a certificate using only measurable or variationally bounded quantities would change annealing from folklore to engineering.\n2. **A clean adiabatic theorem for Lindbladians with an explicit, checkable gap condition.** The existing results are correct and almost unused, because their hypotheses are stated in terms nobody verifies. Restating them in terms practitioners can test would eliminate an entire genre of error.\n3. **Adiabatic following through, not merely around, conical intersections.** The gap closes and the derivative coupling diverges simultaneously; the sign anomaly of [18] is well understood, the dynamics is not. This is where the theorem's failure is most physically consequential.\n\n**Reading path:**\n\n1. Rayleigh 1902 [1] — the invariant, classical, before quantum theory existed to complicate it; read it to see what the theorem is *about*.\n2. Ehrenfest's 1916 adiabatic-hypothesis papers with Burgers 1917–18 [6][7] side by side — physical argument versus actual proof; the credit gap is visible in one sitting.\n3. Born and Fock 1928 [2] — read for the eigenfunction expansion, the $O(1/T)$ estimate, and the gauge term Fock derived and discarded; note the hypotheses you are about to see cited away.\n4. Kato 1950 — the theorem as it is actually used; the intertwining relation makes clear that the physical propagator is not the geometric one.\n5. Berry 1990 [21] — the candid retrospective; read it *after* [2] so the discarded term and Simon's bundle reading [12] land as history rather than legend."}], "references": [{"n": 1, "title": "On the Pressure of Vibrations", "authors": ["John William Strutt (Lord Rayleigh)"], "year": 1902, "venue": "Philosophical Magazine, Series 6, vol. 3, 338–346", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Beweis des Adiabatensatzes", "authors": ["Max Born", "Vladimir A. Fock"], "year": 1928, "venue": "Zeitschrift für Physik 51 (3–4), 165–180", "url": "https://link.springer.com/article/10.1007/BF01343193", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "La théorie du rayonnement et les quanta: Rapports et discussions de la Réunion tenue à Bruxelles, du 30 octobre au 3 novembre 1911", "authors": ["Paul Langevin", "Maurice de Broglie (eds.)"], "year": 1912, "venue": "Gauthier-Villars, Paris (Proceedings of the First Solvay Council)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "A mechanical theorem of Boltzmann and its relation to the theory of energy quanta", "authors": ["Paul Ehrenfest"], "year": 1913, "venue": "KNAW Proceedings (Koninklijke Akademie van Wetenschappen te Amsterdam) 16 II, 591–597", "url": "https://dwc.knaw.nl/DL/publications/PU00012891.pdf", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Adiabatische Invarianten und Quantentheorie", "authors": ["Paul Ehrenfest"], "year": 1916, "venue": "Annalen der Physik 356 (51), 327–352 (English: 'Adiabatic invariants and the theory of quanta', Phil. Mag. 33, 500, 1917", "url": "https://doi.org/10.1002/andp.19163561905", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Adiabatic Invariants of Mechanical Systems. III", "authors": ["Johannes Martinus Burgers"], "year": 1918, "venue": "KNAW Proceedings Amsterdam 20 (companion: Philosophical Magazine 33, 514–520, 1917)", "url": "https://dwc.knaw.nl/DL/publications/PU00012208.pdf", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Het Atoommodel van Rutherford-Bohr", "authors": ["Johannes Martinus Burgers"], "year": 1918, "venue": "Doctoral dissertation, Rijksuniversiteit Leiden (supervisor: Paul Ehrenfest)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "On the quantum theory of line spectra, part I: On the general theory.", "authors": ["Niels Bohr"], "year": 1918, "venue": "Digital Library of the Belarusian State University (Belarusian State University)", "url": "https://openalex.org/W2492922877", "cited_by": 17, "bucket": "earliest"}, {"n": 9, "title": "Über das Rayleighsche Pendel", "authors": ["Georg (Yuri) Krutkow", "Vladimir A. Fock"], "year": 1923, "venue": "Zeitschrift für Physik 13, 195–202 (received 12 December 1922)", "url": "https://doi.org/10.1007/BF01328211", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "On the Adiabatic Theorem of Quantum Mechanics", "authors": ["Tosio Kato"], "year": 1950, "venue": "Journal of the Physical Society of Japan", "url": "https://doi.org/10.1143/jpsj.5.435", "cited_by": 1071, "bucket": "earliest"}, {"n": 11, "title": "Paul Ehrenfest: The Genesis of the Adiabatic Hypothesis, 1911–1914", "authors": ["Luis Navarro", "Enric Pérez"], "year": 2006, "venue": "Archive for History of Exact Sciences 60, 209–267 (companion: 'Ehrenfest's adiabatic theory and the old quantum theory,", "url": "https://doi.org/10.1007/s00407-005-0105-1", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Holonomy, the Quantum Adiabatic Theorem, and Berry's Phase", "authors": ["Barry Simon"], "year": 1983, "venue": "Physical Review Letters 51, 2167–2170", "url": "https://doi.org/10.1103/PhysRevLett.51.2167", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Quantal phase factors accompanying adiabatic changes", "authors": ["Michael V. Berry"], "year": 1984, "venue": "Proceedings of the Royal Society of London A 392 (1802), 45–57", "url": "https://royalsocietypublishing.org/doi/10.1098/rspa.1984.0023", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Adiabatic Theorem without a Gap Condition", "authors": ["Joseph E. Avron", "Alexander Elgart"], "year": 1999, "venue": "Communications in Mathematical Physics 203, 445–463", "url": "https://doi.org/10.1007/s002200050620", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Inconsistency in the Application of the Adiabatic Theorem", "authors": ["Karl-Peter Marzlin", "Barry C. Sanders"], "year": 2004, "venue": "Physical Review Letters 93, 160408", "url": "https://arxiv.org/abs/quant-ph/0404022", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "Quantitative Conditions Do Not Guarantee the Validity of the Adiabatic Approximation", "authors": ["D. M. Tong", "K. Singh", "L. C. Kwek", "C. H. Oh"], "year": 2005, "venue": "Physical Review Letters 95, 110407", "url": "https://arxiv.org/abs/quant-ph/0509073", "cited_by": null, "bucket": "archive"}, {"n": 17, "title": "Non-adiabatic crossing of energy levels", "authors": ["Clarence Zener"], "year": 1932, "venue": "Proceedings of the Royal Society of London A 137, 696–702", "url": "https://doi.org/10.1098/rspa.1932.0165", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "Studies of the Jahn–Teller effect. II. The dynamical problem", "authors": ["H. C. Longuet-Higgins", "U. Öpik", "M. H. L. Pryce", "R. A. Sack"], "year": 1958, "venue": "Proceedings of the Royal Society of London A 244, 1–16", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Quantum Computation by Adiabatic Evolution", "authors": ["Edward Farhi", "Jeffrey Goldstone", "Sam Gutmann", "Michael Sipser"], "year": 2000, "venue": "arXiv:quant-ph/0001106", "url": "https://arxiv.org/abs/quant-ph/0001106", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Ising formulations of many NP problems", "authors": ["Andrew Lucas"], "year": 2014, "venue": "Frontiers in Physics", "url": "https://doi.org/10.3389/fphy.2014.00005", "cited_by": 2520, "bucket": "canon"}, {"n": 21, "title": "Anticipations of the Geometric Phase", "authors": ["Michael V. Berry"], "year": 1990, "venue": "Physics Today 43 (12), 34–40", "url": "https://michaelberryphysics.wordpress.com/wp-content/uploads/2013/06/berry301.pdf", "cited_by": null, "bucket": "archive"}, {"n": 22, "title": "Zur Quantentheorie der Molekeln", "authors": ["Max Born", "J. Robert Oppenheimer"], "year": 1927, "venue": "Annalen der Physik 389 (84), 457–484", "url": "https://doi.org/10.1002/andp.19273892002", "cited_by": null, "bucket": "archive"}], "nsec": 7, "nref": 22, "teaser": "Rayleigh 1902 → Ehrenfest's hypothesis → Burgers's proof → Born–Fock → Kato's projections → Berry's discarded phase — and the folk criterion with published counterexamples."}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* ---- special blocks, rendered BEFORE the prose (as in the app) ---- */
  var hasTL=D.timeline&&D.timeline.length, hasNG=D.neglected&&D.neglected.length, hasCF=D.conflations&&D.conflations.length;
  var pre='';
  if(hasTL){
    pre+='<section class="block" id="blk-timeline"><h3>Origins timeline</h3><div class="lead">How the field actually arrived — scroll through it, with the paper that marks each turn.</div>'+
      '<div class="tslider" id="tslider">'+
      D.timeline.map(function(t){var ref=(t.ref?' <a class="cite" href="#ref-'+(+t.ref||0)+'">['+esc(t.ref)+']</a>':'');
        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+
      '</div><div class="thint">drag or scroll through time →</div></section>';
  }
  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+
      (D.credit_audit?'<div class="callout" style="margin-top:22px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>':'')+'</section>';

  }

        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);

      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
