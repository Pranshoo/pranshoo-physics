y": "Why this mattered: Thomson's debt and Onsager's payment Why this mattered: Thomson's debt and Onsager's payment In 1854 William Thomson read to the Royal Society of Edinburgh a paper that he himself did not believe . He argued that the Peltier coefficient \\Pi and the thermoelectric power S of a junction must satisfy — what we now call the first and second Kelvin relations. The derivation cycled current round a thermocouple, treated the Peltier and Thomson heats as reversible, and ignored the Joule dissipation \\rho J^{2} and the Fourier conduction \\kappa\\,\\nabla T that necessarily accompany them. Thomson conceded the move in print: the manipulation, he wrote, rested on a \"hypothesis\" that the reversible and irreversible currents could be separated, a hypothesis for which classical thermodynamics offered no warrant. The experimental fit was uncomfortably good. The argument was wrong. For seventy-five years the thermoelectric circuit was the embarrassment of phenomenological thermodynamics. Helmholtz tried to repair it from chemical-thermodynamic first principles and failed in the same way; the irreversible terms always recoiled into the energy balance and broke the proof. Bridgman in 1929 made the diagnosis explicit: no consistent derivation of the Kelvin relations existed within classical thermodynamics, and the relations themselves were almost certainly a special case of some unidentified universal symmetry connecting cross-coefficients of irreversible transport . He posed the problem cleanly and walked away from it. Onsager, then a 26-year-old assistant professor at Brown, read Bridgman and did not. The two 1931 Physical Review papers paid Thomson's debt with interest. Onsager's central postulate — that spontaneous fluctuations from equilibrium decay on average according to the same linear laws that govern macroscopic relaxation — is the regression hypothesis . Married to time-reversal symmetry of the equilibrium correlation \\langle \\alpha i(0)\\,\\alpha j(t) \\rangle and to a coarse-grained entropy S(\\alpha) whose gradients X i = \\partial S/\\partial \\alpha i furnish the thermodynamic forces conjugate to fluxes J i = \\dot{\\alpha} i, the linear constitutive law J i = \\sum j L {ij} X j acquires the symmetry Part I treats coupled scalar processes — chemical kinetics and thermal diffusion — and recovers Thomson's relations as the n=2 case, finally giving them a legitimate derivation. Part II extends to coupled vectorial processes in anisotropic media and re-derives Rayleigh's variational principle of least dissipation — older than Onsager by half a century — as a corollary of the regression hypothesis. The microscopic-reversibility axiom Onsager invoked by name is Tolman's 1925 quantum-statistical statement ; the chemical detailed-balance argument he leaned on in §3 of Part I is Wegscheider's 1901 result . Both are cited; neither is the kind of name a textbook will later remember. What we mean today by \"the Onsager relations\" is not actually Onsager 1931. Casimir's 1945 Reviews of Modern Physics paper rewrote the proof in the language that has survived: assign to each fluctuating variable \\alpha i a time-reversal parity \\varepsilon i = \\pm 1, allow the Hamiltonian to depend on time-reversal-odd parameters such as a magnetic field \\mathbf{B} or angular velocity \\boldsymbol{\\Omega}, and obtain The bare L {ij}=L {ji} is the special case \\varepsilon i \\varepsilon j = +1 at zero time-reversal-odd field — exactly the regime in which Onsager originally worked. Every Hall, Nernst, Ettingshausen and Righi–Leduc coefficient that condensed-matter physics now extracts from a magnetotransport tensor obeys Casimir's relation and violates the bare Onsager statement. Yet de Groot and Mazur's 1962 monograph — the book that wrote the modern notation, fixed the entropy-production bilinear \\sigma = \\sum i J i X i as the rule for identifying conjugate force-flux pairs, and pushed the whole apparatus into the graduate curriculum — printed the parity-corrected formula under the heading \"Onsager's theorem\" and gave Casimir a footnote. Callen's 1948 systematization of thermoelectric, thermomagnetic and galvanomagnetic effects did the same: it is Casimir's machinery, recovering Bridgman's eight-coefficient algebra as a closed theorem, badged as Onsager. So the textbook collapses four actors into one. Thomson posed the problem and guessed the n=2 answer. Tolman and Wegscheider supplied the microscopic axiom — time-reversal symmetry at the level of dynamics, detailed balance at the level of rate constants. Onsager elevated those axioms to a macroscopic theorem on linear-response matrices. Casimir supplied the parity correction that made the theorem usable in the laboratory. Miller's 1959–60 experimental compendium then canonized the symmetry empirically across thermoelectricity, isothermal diffusion, thermal diffusion and electrokinetics, fixing L {ij}=L {ji} in the chemists' working knowledge before most physicists noticed. The 1968 Nobel Prize in Chemistry cited Onsager \"for the discovery of the reciprocal relations bearing his name, which are fundamental for the thermodynamics of irreversible processes.\" His Nobel lecture, The Motion of Ions: Principles and Concepts , is about strong electrolytes — the subject of his 1935 Yale dissertation — and scarcely mentions the work that won him the prize. The Royal Society memoir by Longuet-Higgins and Fisher records his own view that the electrolyte theory was his major contribution and the reciprocal relations a youthful aside ; the Hemmer–Holden–Kjelstrup commentary in the Collected Works concurs . He was honoured, in short, for paying off Thomson's debt — a debt he had largely forgotten he owed. The physics, properly: regression of fluctuations and the numbered hypotheses The physics, properly: regression of fluctuations and the numbered hypotheses The 1931 derivation is best read as a six-axiom theorem. Stripping the axioms out makes visible exactly which transport problems get to claim L {ij}=L {ji} and which do not. (A1) Local equilibrium and Gaussian entropy. Let \\alpha=(\\alpha 1,\\dots,\\alpha n) be macroscopic deviations from a stable equilibrium state. Expand quadratic order being sufficient because Onsager works to linear order in deviations. The conjugate thermodynamic forces are and the Einstein relation fixes the equilibrium covariance \\langle\\alpha i\\alpha j\\rangle {eq}=k B(s^{-1}) {ij}. Without Gaussianity the higher cumulants couple in and the linear-response matrix ceases to be the whole story. (A2) Microscopic reversibility. The underlying Hamiltonian dynamics is time-reversal invariant in Tolman's sense : phase-space trajectories come in T-conjugate pairs of equal statistical weight. This — not detailed balance — is the load-bearing axiom (Gabrielli–Jona-Lasinio–Landim exhibit Onsager symmetry without detailed balance, severing what textbooks routinely weld). (A3) Linear constitutive law. Near equilibrium, Linearity demarcates the regime; the full nonlinear Boltzmann equation has no analogous symmetry. (A4) Conjugate pairing fixed by entropy production. The J i and X i are not free choices but are tied by the local entropy production rate . Coleman and Truesdell proved that any linear redefinition preserving \\sigma can be chosen to symmetrize L trivially, so L {ij}=L {ji} is vacuous unless the conjugate pairing is fixed by an independent thermodynamic identification — the assumption most often violated silently in engineering practice. (A5) Time-reversal parities. Under T, each \\alpha i\\mapsto\\varepsilon i\\alpha i with \\varepsilon i=\\pm1 — positions even, velocities and magnetizations odd. Onsager 1931 took every \\varepsilon i=+1; Casimir supplied the missing classification and the rule for T-odd external parameters (B, \\Omega). (A6) Markovian regression. A spontaneous fluctuation regresses on the average according to the same linear law as a macroscopically prepared deviation: This requires the slow variables to be well-separated in time scale from any microscopic memory kernel; long-time hydrodynamic tails, glassy aging, and anomalous diffusion break the hypothesis. The derivation in four lines Iterate (A6) to get the conditional mean \\langle\\alpha k(\\tau)\\mid\\alpha(0)=a\\rangle=(e^{-M\\tau}) {kl}a l, and form the equilibrium correlator Microscopic reversibility (A2) and parities (A5) demand Expand to first order in \\tau — the \\tau^0 piece is the Einstein relation and drops out — to obtain (Ms^{-1}) {ki}=\\varepsilon i\\varepsilon k(Ms^{-1}) {ik}. But Ms^{-1}=L. Hence the Onsager–Casimir relation which collapses to L {ij}=L {ji} only when \\varepsilon i\\varepsilon j=+1 and no T-odd parameter is present. Figure: The regression hypothesis (A6) converts the conditional mean \\langle\\alpha(\\tau)\\mid a\\rangle=e^{-M\\tau}a into a statement about the equilibrium two-point function C {ij}(\\tau); microscopic reversibility (A2) plus parities (A5) impose the exchange symmetry; the O(\\tau) coefficient is exactly L. The Onsager–Machlup Lagrangian and the Green–Kubo corollary With R\\equiv L^{-1} the resistance matrix, Onsager and Machlup showed that the path probability for a fluctuation history \\alpha(\\cdot) is Gaussian, Expanding the quadratic produces the Onsager–Machlup Lagrangian in which \\Phi is Rayleigh's dissipation function . Stationarity of \\int\\mathcal{L}\\,dt reproduces the linear law — Onsager's \"principle of least dissipation of energy\" is Rayleigh in macroscopic clothing. Kubo's 1957 reformulation encodes the same content as an equilibrium current correlator, making L {ij}=\\varepsilon i\\varepsilon j L {ji}(-B) an algebraic corollary of \\langle J i(0)J j(t)\\rangle=\\varepsilon i\\varepsilon j\\langle J j(0)J i(t)\\rangle {-B}. Onsager–Casimir is then not an independent theorem but a one-line consequence of time-reversal symmetry of the two-point function — the same input that drives the fluctuation–dissipation theorem, and the source of the persistent confusion that the FDT and Onsager reciprocity are separate facts. Strict conditions \u0026 failure modes: where each Ai breaks Strict conditions \u0026 failure modes: where each Ai breaks The six axioms isolated in §2 — (A1) existence of an entropy potential whose Hessian defines conjugate variables, (A2) time-reversal invariance of the microscopic dynamics, (A3) linearity of the regression equation \\dot\\alpha i = -\\sum j M {ij}\\,\\alpha j + \\xi i, (A4) conjugate force–flux pairing fixed by \\sigma = \\sum i J i X i, (A5) definite time-reversal parity \\varepsilon i = \\pm 1 for every state variable, (A6) Markovian regression on the coarse-grained timescale — are independent failure modes. Each has a characteristic experimental signature and a literature that, for the most part, names the breakdown without renaming the relation. A1 — No entropy potential: driven and active matter The 1931 derivation requires a thermodynamic equilibrium state with entropy S(\\alpha) such that X i = \\partial S/\\partial \\alpha i are restoring forces. In nonequilibrium steady states (NESS) — biased lattice gases, driven Brownian colloids, chemically active suspensions, chiral active fluids — no such global Lyapunov function exists, and the stationary distribution is generically non-Gibbsian. The macroscopic fluctuation theory of Bertini, De Sole, Gabrielli, Jona-Lasinio and Landim is the systematic replacement: a large-deviation rate functional \\mathcal{I}[\\rho,j] takes the role of S, and Onsager symmetry survives only in the limit of vanishing drive. Markovich and Lubensky make the consequence explicit in chiral active fluids: an \"odd viscosity\" \\eta^o appears in the stress tensor with \\eta^o {ijkl} = -\\eta^o {klij}, the exact antisymmetry forbidden by A1+A2 and made possible by the steady chemical drive. De Corato and Pagonabarraga document the same pathology in catalytic colloids: the chemo-mechanical coupling matrix obeys L {ij}=L {ji} only when the substrate concentration is at equilibrium with the bath; under sustained turnover the reciprocity is reduced to a ratio of stationary affinities. A2 — Time-reversal-odd parameters: B, \\Omega, spin–orbit A magnetic field, a rotation, or any explicitly T-odd coupling breaks the symmetry of \\langle \\alpha i(0)\\alpha j(t)\\rangle under t \\to -t at fixed Hamiltonian. Casimir's 1945 reconstruction is the correct universal statement: L {ij}(B,\\Omega) = \\varepsilon i \\varepsilon j\\, L {ji}(-B,-\\Omega). This is the relation Hall and Nernst tensors actually obey [11, 25]; the naïve L {ij}=L {ji} would force these off-diagonal coefficients to vanish. Guo, Li, Zhu and Behnia verified the field-reversed version in an anisotropic antiferromagnet to 1% by simultaneously measuring transverse thermoelectric and Nernst coefficients at \\pm B. Spin-orbit coupling enters as an effective T-odd term once spin is integrated out: Arakawa and Yonemitsu and Huang et al. derive the generalized charge–spin reciprocity, in which L {ij}^{\\text{charge,spin}} relates to L {ji}^{\\text{spin,charge}} only after a parity flip of the spin index. Dejene, Flipse and van Wees confirmed the Thomson–Onsager pair \\Pi S = T S S for spin caloritronics in lateral spin-valve devices — but only after the parity-corrected version was written down. A3 — Nonlinearity: high fields, Joule regime, hot carriers Onsager regression is the linear part of an expansion about equilibrium. Once X i is large enough that J i acquires a quadratic component, the coupling matrix L {ij}(X) generically loses its symmetry: \\partial J i/\\partial X j \\neq \\partial J j/\\partial X i. In high-field thermoelectrics this is the regime where the Kelvin relation \\Pi = TS acquires field-dependent corrections; in semiconductor transport hot-carrier effects shift the Peltier coefficient by terms cubic in the electric field that are not captured by any Onsager-symmetric kernel . Tokura and Nagaosa give the systematic taxonomy: nonlinear (rectification, second-harmonic) responses in non-centrosymmetric materials are precisely the channel through which the linear reciprocity is bypassed. The relation survives only as the leading term of a Volterra series in X. A4 — Coleman–Truesdell ambiguity: which fluxes, which forces A4 is the most easily overlooked. Coleman and Truesdell [19, 32] proved that any non-singular linear redefinition J' = AJ, X' = (A^T)^{-1}X preserves \\sigma, and one can always choose A to symmetrize L'. So \"L {ij}=L {ji}\" carries content only when the pair (J,X) is fixed by an independent thermodynamic identification — namely the local entropy production. Bearman documents the practical failure: multicomponent diffusion reported in mass-fixed versus molar-fixed frames produces matrices whose symmetry is an artifact of the frame choice. Miller's compendium is meticulous on this point — half the apparent \"violations\" of reciprocity in the 1940s electrokinetic literature were Coleman–Truesdell artifacts. Modern engineering thermodynamics still trips over it whenever coarse-grained temperatures or non-conjugate driving forces are used [34, 33]. A5 — Parity misassignment: Hall, Nernst, odd viscosity If the parity \\varepsilon i of a state variable is mis-assigned, the Casimir factor \\varepsilon i\\varepsilon j flips sign and a perfectly valid reciprocity is mistaken for a violation — or, worse, an invalid symmetry is imposed. The classic trap: treating current density as T-even (it is T-odd) gives \\sigma {xy} = \\sigma {yx} at B=0, which is correct, but the same mistake at finite B erases the Hall effect. Callen derived the two independent thermomagnetic Bridgman identities precisely by being careful with \\varepsilon. Carbone and Rondoni give the necessary-and-sufficient conditions on the parity assignment for time-reversal symmetry to be recoverable when B \\neq 0; the upshot is that internal angular-momentum degrees of freedom must be classified explicitly. Nettleton showed the analogous trap in viscoelastic liquids, where elastic strain (T-even) and viscous flux (T-odd) are easily conflated. A6 — Non-Markovian regression: glasses and memory A6 demands that on the coarse-grained timescale the regression \\dot\\alpha i \\approx -M {ij}\\alpha j has no kernel — i.e. \\langle\\alpha i(0)\\alpha j(t)\\rangle decays exponentially. In glassy systems, aging dynamics, mode-coupling regimes and rheology of complex fluids, the decay is non-exponential and the response is genuinely L {ij}(t-t') = \\int K {ij}(t-t'')X j(t'')dt'' with K {ij}(\\tau) non-Markovian. Reciprocity persists in the frequency-resolved Onsager–Casimir form L {ij}(\\omega,B) = \\varepsilon i\\varepsilon j L {ji}(-\\omega,-B) [9, 21], but the static \\omega \\to 0 limit can be ill-defined: in aging glasses the two-time correlator depends on the waiting time, and the fluctuation-dissipation ratio X(t,t w) \\neq 1 measures precisely how far the system has wandered from the regime where A6 holds. The same failure mode appears in viscoelastic liquids and in finite-temperature one-dimensional quantum lattice models with anomalous transport , where superdiffusive Kardar–Parisi–Zhang behaviour replaces ordinary Markovian regression and the very notion of a static Onsager coefficient dissolves. Signatures: smoking guns vs circumstantial evidence Signatures: smoking guns vs circumstantial evidence A transport experiment that looks compatible with Onsager–Casimir is not the same as a transport experiment that tests it. The literature is littered with the second kind paraded as the first. The discipline required is to ask, for every claimed signature, what else could produce the same observation. Reciprocity is falsifiable only when its alternative producers — crystal symmetry, gauge choice of conjugate variables, Lorentz reciprocity of the constitutive equations, accidental dimensionality — are independently ruled out. Smoking guns: direct tests of L {ij}=L {ji} A signature is direct when the two off-diagonal coefficients are measured by physically distinct protocols and their numerical agreement is not enforced by any symmetry other than time-reversal of the underlying dynamics. (S1) The Kelvin relation \\Pi = T\\,S. The Seebeck coefficient S=(\\nabla V/\\nabla T) {J=0} is measured open-circuit; the Peltier coefficient \\Pi = (Q/J) {\\nabla T=0} is measured isothermal. Two different circuits, two different instruments, two different sign conventions — and yet Onsager forces \\Pi/T = S. Thomson conjectured it in 1854, Bridgman confessed in 1929 that classical thermodynamics could not produce it, Onsager proved it in 1931, Uehling verified it from a Boltzmann calculation in 1932, and Callen rebuilt it as a theorem in 1948. The compendium tabulates the experimental agreement at the 0.1–1% level across metals and semiconductors. (S2) Cross-coefficient symmetry in coupled diffusion. In ternary isothermal diffusion the matrix J i = -\\sum j L {ij}\\nabla\\mu j is 2\\times 2 with two off-diagonals measured by independently prepared concentration gradients. The conjugate-frame condition matters: the test is meaningful only in the entropy-production frame (mass-frame for non-electrolytes, electrochemical-potential frame for ions). Miller's 1960 review is the empirical canonization: agreement to within \\sim 2\\% in KCl–H 2O, urea–water and similar systems. Coleman and Truesdell reminded the community that switching frames trivially destroys or restores the symmetry — a warning routinely ignored. (S3) Thermal diffusion (Soret/Dufour). The Soret coefficient (mass current under \\nabla T) and the Dufour coefficient (heat current under \\nabla\\mu) are reciprocal: L {qm}=L {mq}. They are measured in different cells with different boundary conditions . Agreement here is the cleanest case because the two effects involve different transducers and there is no plausible non-Onsager mechanism that would lock them together. (S4) The Bridgman count in thermomagnetic transport. Eight coefficients (Hall, Nernst, Ettingshausen, Righi–Leduc, isothermal/adiabatic versions of each) are connected by two independent Onsager–Casimir identities — Callen's reduction. The discriminating measurement is field reversal : Onsager–Casimir demands L {ij}(B) = \\varepsilon i\\varepsilon j L {ji}(-B), so the test is to measure L {ij} and L {ji} at +B and -B separately and check the parity-corrected equation. Dejene–Flipse–van Wees did exactly this for spin caloritronics; Guo et al. did it for anomalous transverse coefficients in an antiferromagnet. These are the modern smoking guns. Figure: the left column lists experimental observations whose only producer is time-reversal of the microscopic dynamics; the right column lists observations with at least one non-Onsager producer that must be excluded before reciprocity is implicated. Circumstantial: signatures that have other producers (C1) A symmetric conductivity tensor in an anisotropic crystal. That \\sigma {ij}=\\sigma {ji} in a quartz or rutile sample is not evidence of Onsager reciprocity. The Voigt–Neumann principle — material tensors inherit the point-group symmetry of the crystal — already forces symmetry of any rank-2 tensor in centrosymmetric classes, and in many non-centrosymmetric ones. The Onsager content is exactly the residual symmetry that survives once crystal symmetry is quotiented out: it forbids an antisymmetric piece in zero field even when the point group would permit one. The discriminator is to apply a time-reversal-odd perturbation (magnetic field, magnetization, rotation) and check the parity-corrected equation \\sigma {ij}(B)=\\sigma {ji}(-B). Tokura–Nagaosa catalogue exactly the non-centrosymmetric quantum materials where this becomes nontrivial. (C2) A symmetric elastic or dielectric matrix. These are forced by the existence of an energy potential (U(\\epsilon) or U(D)); the Maxwell relations \\partial^2 U/\\partial\\epsilon i\\partial\\epsilon j = \\partial^2 U/\\partial\\epsilon j\\partial\\epsilon i give symmetry without invoking irreversible thermodynamics. Treating C {ij}=C {ji} as a confirmation of Onsager is a category error: equilibrium response functions are symmetric because they are second derivatives of a state function, not because of microscopic reversibility. (C3) Lorentz reciprocity of scattering matrices in linear electromagnetics. That S {ij}=S {ji} between two antenna ports follows from the symmetry of Maxwell's equations under exchange of source and detector in a medium with symmetric \\varepsilon and \\mu — a classical-field statement that predates Onsager and is independent of any thermodynamic axiom. Sounas–Caloz–Alù explicitly engineer angular-momentum bias to break Lorentz reciprocity in a way that has nothing to do with thermodynamic detailed balance. Conflating \"reciprocity\" in the engineering sense with \"Onsager reciprocity\" in the thermodynamic sense is endemic in the metamaterials literature. (C4) Good agreement with a linear flux–force fit. A tensor that fits J=LX with symmetric L proves nothing unless the conjugate-pair identification was fixed before the fit: Coleman–Truesdell showed that any nondegenerate linear relabelling of forces and fluxes preserves \\sigma=\\sum J iX i and can be chosen to symmetrize L. The discriminator is to specify the conjugate pairing from an independent calculation of the entropy production (which frame? which reference velocity? which chemical potential definition?) and then test symmetry — not the other way around. Bearman's analysis of multicomponent diffusion makes this trap explicit. (C5) Cross-coefficient agreement in nonequilibrium steady states. Reports of \"Onsager symmetry\" in driven systems should be treated as circumstantial until detailed balance of the underlying dynamics is independently established. Gabrielli–Jona-Lasinio–Landim proved reciprocity can survive without microscopic reversibility under structural conditions, and Bertini et al. developed macroscopic fluctuation theory precisely because L {ij}=L {ji} does not in general hold off equilibrium. Markovich–Lubensky show that the \"odd-viscosity\" terms forbidden by Onsager are exactly what chiral active matter generates. A symmetric-looking transport matrix measured in a driven system is therefore evidence of an accidental algebraic cancellation, not of reciprocity. The discipline reduces to one rule. A signature counts as a smoking gun only when the alternative producer — Voigt–Neumann, Maxwell-relation symmetry, Lorentz reciprocity, frame redefinition, accidental cancellation — has been separately killed , typically by a field-reversal protocol, a frame transformation, or a parity-odd perturbation. Everything else is circumstantial and should be cited as such. Use \u0026 abuse: how L_ij = L_ji escaped its hypotheses Use \u0026 abuse: how L ij = L ji escaped its hypotheses The relations escaped because the symbol L {ij}=L {ji} is portable and the hypotheses behind it are not. Strip the six axioms of §2 from a derivation and the symmetry survives as a formal identity that can be asserted of any square matrix; what is lost is the right to interpret it as a constraint on physical measurements. The literature documents four recurring failure modes in which the formal identity is invoked while one or more axioms is silently false. Abuse 1 — Symmetry in B ≠ 0 without Casimir parity The bare statement L {ij}(\\mathbf B)=L {ji}(\\mathbf B) is not what Onsager proved and not what holds. Casimir's correction is so a Hall, Nernst, Ettingshausen, Righi–Leduc, anomalous-Hall or spin-Hall coefficient is reciprocity-constrained only after the field has been flipped. Cancellations of off-diagonal pieces between L {ij}(\\mathbf B) and L {ji}(\\mathbf B) at fixed field are not a test of reciprocity — they are an empirical statement about the antisymmetric part L {ij}^A(\\mathbf B)=-L {ji}^A(\\mathbf B), which Casimir explicitly allows to be nonzero. Recent careful work on anisotropic antiferromagnets pins the distinction down experimentally , and the spin-caloritronic literature verified the Thomson–Onsager relation only after the parity audit was done in full ; Brechet's recent re-derivation insists on the same point . Carbone and Rondoni sharpen what \"time-reversal in \\mathbf B\" actually requires, undermining a common shortcut that asserts symmetry under reversal of \\mathbf B alone without checking the parity of the conjugate variables. A particularly persistent textbook abuse is to credit the symmetry of the conductivity tensor in anisotropic crystals to Voigt–Neumann crystal symmetry. Crystal point-group operations symmetrize the reversible tensor; the dissipative part is symmetric only because Onsager–Casimir says so. Without a magnetic field this is a distinction without a difference, and the literature behaved as such for a half-century; with finite \\mathbf B the Voigt argument is wrong and Casimir's is right. Abuse 2 — Non-conjugate force–flux pairs Coleman and Truesdell proved that an arbitrary linear redefinition \\tilde J = AJ,\\ \\tilde X = (A^{-1})^{T} X preserves the entropy production \\sigma=\\sum i J i X i and can be chosen so that the resulting matrix \\tilde L is symmetric. The corollary they intended as a warning — that L {ij}=L {ji} has no content until the conjugate pairing is fixed by an independent thermodynamic identification — is now routinely cited as a license. Multicomponent diffusion is the canonical site. Reciprocity holds for the Stefan–Maxwell / Onsager L {ij} matrix written in the barycentric frame with chemical-potential gradients as forces; rewrite the same equations with molar-frame fluxes and concentration gradients and one obtains a Fickian matrix whose off-diagonal entries are not equal in general. Bearman worked the linear phenomenological equations out without invoking reciprocity precisely to disentangle the frame dependence, and the recurring confusion in thermodiffusion is exactly this . The same trap is set in heat transfer with coarse-grained temperatures: averaging T over a control volume destroys the local Gibbs identity that defined X=\\nabla(1/T) in the first place, after which \"Onsager reciprocity\" between the coarse-grained variables is wishful. Abuse 3 — Driven, active, and nonequilibrium-steady-state systems Onsager 1931 proves L {ij}=L {ji} for fluctuations around a true equilibrium where the steady distribution is Boltzmann and entropy is a Lyapunov function. Bias the system into a nonequilibrium steady state (chemical drive, shear, electrical current, illumination, activity) and the steady measure is no longer time-reversal symmetric; the regression hypothesis fails at the root. What survives are the Gallavotti–Cohen fluctuation theorem and the macroscopic fluctuation theory of Bertini, De Sole, Gabrielli, Jona-Lasinio and Landim — not L {ij}=L {ji}. The cleanest demonstrations come from chiral active fluids: Markovich and Lubensky show that the odd viscosity tensor is precisely the antisymmetric piece forbidden by Onsager and generated by the violation of detailed balance, and Tokura and Nagaosa catalogue the analogous non-centrosymmetric quantum nonreciprocities that the Onsager–Casimir relation rules out at equilibrium. Driven metamaterials engineer the same violation deliberately to obtain isolator-like response . Recent extensions to periodically driven (Floquet) systems require their own derivation; what looks like \"generalized Onsager reciprocity\" there is a Casimir-with-parity-of-the-drive statement, not the equilibrium theorem. Conversely, Gabrielli–Jona-Lasinio–Landim showed reciprocity can persist without microscopic reversibility under structural conditions — severing one more weld textbooks had taken for granted. Abuse 4 — Conflation with FDT, detailed balance, microscopic reversibility These four are routinely treated as synonyms; they are a strict hierarchy. Microscopic reversibility (Tolman ) is time-reversal symmetry of the Hamiltonian. Detailed balance is the stronger Markovian statement p {\\rm eq}(a)W(a\\to b)=p {\\rm eq}(b)W(b\\to a) (Wegscheider ). The fluctuation–dissipation theorem (Kubo ) relates the symmetric correlator to the antisymmetric response. Onsager–Casimir is the symmetry under index exchange of the linear-response matrix . FDT and Onsager share an input — time-reversal symmetry of \\langle\\alpha i(0)\\alpha j(t)\\rangle {\\rm eq} — but they are not the same statement: FDT pairs a fluctuation with a dissipation, Onsager pairs L {ij} with L {ji}. A claim that Onsager \"follows from FDT\" inverts the historical and logical order; Onsager is a corollary of the Green–Kubo formula, not its source. Linguistic tells of a hollow claim - \"By Onsager symmetry…\" with no entropy production \\sigma written, no force–flux pair identified, and no parity vector \\varepsilon i specified. - L {ij}(\\mathbf B)=L {ji}(\\mathbf B) asserted at fixed field, without the \\mathbf B\\to-\\mathbf B flip. - Reciprocity invoked for a driven, sheared, illuminated or active system without an argument that detailed balance is restored. - \"Onsager / FDT / detailed balance\" used as a single hyphenated authority. - A \"frame-independent\" reciprocity claim in multicomponent diffusion — the frame is the conjugate-variable choice, and the claim is empty without it. A clean statement satisfies the converse checklist: write \\sigma=\\sum J i X i with the Gibbs identity that produced it; list the parities \\varepsilon i; specify which time-reversal-odd parameters get flipped; and exhibit the equilibrium (not steady-state) ensemble under which microscopic reversibility holds. Anything else is borrowing the symbol and leaving the hypotheses behind. Status \u0026 the believer's checklist Status \u0026 the believer's checklist Ninety-five years after Part I , the reciprocal relations occupy three positions simultaneously, and the literature seldom marks which one is being invoked. Position 1 — canonical, in linear irreversible thermodynamics. The de Groot–Mazur monograph is still the operational reference: identify the entropy-production bilinear form \\sigma = \\sum i J i X i, classify each \\alpha i by its time-reversal parity \\varepsilon i, and write Every modern transport-coefficient derivation in thermoelectrics , spin caloritronics , anomalous Hall and Nernst tensors , and even the recently reformulated thermo-magnonic transport still rides on the Onsager–Casimir backbone of . The framework has not been replaced; it has been domesticated. Position 2 — demoted, by Kubo and the FDT. Once Kubo expressed transport coefficients as equilibrium current–current correlators, L {ij} = \\int 0^\\infty \\langle J i(0) J j(t)\\rangle \\text{eq}\\, dt, Onsager's symmetry became an algebraic consequence of the time-reversal symmetry of the two-point function — the same input that yields the fluctuation–dissipation theorem. In the linear-response logical order Onsager is now a corollary, even though historically he proved it first. Strictly, the symmetry remains more general than its Kubo derivation: requires only the regression hypothesis, not the full Hamiltonian linear-response machinery. Papers that derive reciprocity \"from Kubo\" are deriving a special case from a stronger hypothesis. Position 3 — generalized and partly superseded, far from equilibrium. Three programs have pushed past the original axioms: - Macroscopic fluctuation theory of Bertini, De Sole, Gabrielli, Jona‑Lasinio and Landim replaces the regression theorem by a large-deviation functional for currents and densities in driven diffusive systems. Onsager symmetry survives as the Hessian of the equilibrium quasi-potential; the genuinely nonequilibrium content lies in an antisymmetric \"Hamiltonian\" piece that obeys an Onsager–Machlup-like structure but is not the bare L {ij}=L {ji}. - Reciprocity without microscopic reversibility. Gabrielli, Jona‑Lasinio and Landim proved that an Onsager-form symmetry can hold for coarse-grained matrices even when the underlying Markov dynamics violates detailed balance — severing one of the welds the textbook story makes between Tolman , Wegscheider , and L {ij}=L {ji}. - Stochastic and active-matter mutations. Driven colloids and chemically active swimmers obey modified Onsager relations only after the chemical-potential force is included as a genuine conjugate variable ; chiral active fluids generate an \"odd viscosity\" that Markovich and Lubensky showed is exactly the term forbidden by Onsager , surviving because the non-vanishing angular-momentum density breaks the bilinear-form pairing on which the proof rests. Periodically driven and non-centrosymmetric quantum systems likewise require generalized reciprocity statements . The empirical situation has not improved as much as the theoretical one. Miller's 1960 compendium remains the most exhaustive experimental survey; the cleanest modern reciprocity test is the spin-Peltier/spin-Seebeck verification in YIG/Pt and Py/Cu/Py nanopillars , which also pinpoints where the relation breaks (Joule-dominated bias). Outside thermoelectrics, \"verifications\" are dominantly circumstantial — see §4. The AETHER checklist for any paper invoking Onsager reciprocity 1. Write the entropy production explicitly. Display \\sigma = \\sum i J i X i for the problem at hand. Without this factorization, \"forces\" and \"fluxes\" are conventions, and the symmetry claim is the empty content of Coleman–Truesdell . 2. Tag every variable with its time-reversal parity \\varepsilon i = \\pm 1. State whether each \\alpha i is a density, a current, a magnetization, or an angular momentum. The genuine statement is Onsager–Casimir, L {ij}(\\mathbf{B},\\boldsymbol{\\Omega}) = \\varepsilon i\\varepsilon j L {ji}(-\\mathbf{B},-\\boldsymbol{\\Omega}), not bare symmetry . 3. Reverse the field. If \\mathbf{B}\\neq 0 or the frame rotates with \\boldsymbol{\\Omega}\\neq 0, the two members of the reciprocity must be measured (or computed) at opposite fields. A single-field datum can be fit to reciprocity; it cannot test it. 4. Specify the linear regime. State the small parameter, give the bias window, and verify that quadratic and higher coefficients are below the reported precision. Reciprocity is a statement about the leading coefficient only; nonlinear coefficients have no Onsager symmetry . 5. Justify the conjugate pairing independently. The choice of (J i, X i) must come from the thermodynamic bilinear form, not from algebraic convenience or experimental access. Mass-frame vs molar-frame fluxes, lab vs co-moving currents, electrochemical vs electrostatic potentials are not interchangeable . 6. State the regime: equilibrium fluctuations, relaxation, or driven steady state. Onsager 1931 covers the first two. The third requires MFT , a Gallavotti–Cohen-type symmetry, or the structural conditions of Gabrielli–Jona‑Lasinio–Landim . Do not transplant the equilibrium symmetry without naming the replacement theorem. 7. Distinguish Onsager from FDT and from detailed balance. Microscopic reversibility (Tolman ), detailed balance of a master equation (Wegscheider ), Green–Kubo time-reversal of the correlator , and macroscopic L {ij}=L {ji} are four statements of decreasing strength. Cite the one you actually use; do not chain them silently. 8. Measure L {ij} and L {ji} independently. A reciprocity test requires two experiments — apply X j, measure J i; then apply X i, measure J j — under matched microscopic conditions. The spin-caloritronic protocol of Dejene, Flipse and van Wees is the template. Inferring one off-diagonal from the other and then announcing agreement is not a test. A paper that passes all eight has earned the symbol L {ij}=L {ji}. A paper that uses it without passing them has borrowed Onsager's name and Casimir's mathematics on credit. The AETHER Verdict The AETHER Verdict I have spent five sections trying to talk the reciprocal relations down from the pedestal the textbooks built for them. Here is where I am willing to plant a flag. (a) What I will defend The Onsager–Casimir relation in its parity-corrected form, is, given its six axioms, a theorem , not a heuristic. I will defend (i) Casimir's formulation as the canonical statement — the unsigned L {ij}=L {ji} taught to undergraduates is the special case and should be retired from general use; (ii) the historical reading that Thomson had the n=2 case in 1854 with a candid acknowledgement that his argument was unjustified, and that Tolman and Wegscheider supplied the microscopic-reversibility seed Onsager grew into a theorem; (iii) the claim, which the community still resists, that the symmetry of the steady-state conductivity tensor in dissipative anisotropic crystals is not a consequence of crystal point-group symmetry — Neumann's principle constrains the form, Onsager–Casimir constrains the symmetry, and the two are independent. I will also defend the unfashionable view that Onsager's own self-assessment in was right: the strong-electrolytes work is the deeper achievement; the Nobel committee picked the more quotable one. (b) What is shakier than the literature admits Three load-bearing assumptions are routinely smuggled through unexamined. (A3) Linearity around equilibrium. The 1931 papers prove reciprocity for the regression of equilibrium fluctuations. Every application to a nonequilibrium steady state — thermoelectric devices under finite bias, electrochemical cells, photovoltaic transport — is a leap of faith dressed as a theorem. Macroscopic fluctuation theory makes this explicit: away from equilibrium, the relevant object is a quasi-potential, not the entropy, and there is no general reason for its Hessian to be symmetric. We have decided to call the residual symmetry \"Onsager\" because the matrix is still square. (A2) Time-reversal of the relevant dynamics. Coarse-graining can manufacture or destroy time-reversal symmetry. Whenever a fast variable is integrated out — phonons in electron transport, solvent in colloidal dynamics, fast chemistry in reaction-diffusion — the effective dynamics inherit only the time-reversal symmetry of the retained sector. The standard derivation does not track this. Gabrielli–Jona-Lasinio–Landim is the cleanest demonstration that reciprocity and microscopic reversibility can be decoupled; we have not absorbed the lesson. Conjugacy of forces and fluxes. The Coleman–Truesdell observation that L {ij}=L {ji} is empty under arbitrary linear redefinitions of (J i,X i) is treated as a curiosity. It is not. In multicomponent diffusion, in irreversible thermodynamics of mixtures, and in any engineering use with \"effective\" driving forces, the conjugate pairing is fixed by convention, not by an independent thermodynamic identification. Half the reported \"violations of Onsager\" are misidentifications of the conjugate pair. (c) The three open questions I would work on 1. A sharp criterion for when reciprocity survives coarse-graining without microscopic reversibility. Generalize from lattice gases to continuum hydrodynamics with conserved currents — this would tell us a priori which effective theories must have symmetric Onsager matrices. 2. The status of L {ij}=L {ji} in nonequilibrium steady states with weak driving. Identify the leading correction to reciprocity in powers of the driving force; predict its sign and magnitude in a measurable system (thermoelectrics near room temperature are the obvious target). 3. Odd transport as the negative space of Onsager. Map the odd viscosity / odd elasticity / Hall viscosity literature onto a single classification of which parity factors \\varepsilon i\\varepsilon j they violate and why — Markichev–Lubensky is the start, not the end. Reading path 1. Thomson 1854 — read the original to see how candidly he flagged the gap Onsager would later fill. 2. Onsager 1931, Parts I \u0026 II — read for the axioms , not the result; underline every \"we assume.\" 3. Casimir 1945 — the proof people actually use; pay attention to the parity bookkeeping. 4. de Groot \u0026 Mazur — the canonical modern formulation, useful precisely because it shows how the hypotheses get quietly absorbed into notation. 5. Bertini et al., macroscopic fluctuation theory — read last, to see what replaces Onsager once equilibrium is dropped."}</script>
