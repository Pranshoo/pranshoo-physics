<script type="application/json" id="aether-data">{"slug": "the-symmetry-that-forgot-its-hypotheses-onsager-reciprocal-r", "topic": "Onsager reciprocal relations", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "The Symmetry That Forgot Its Hypotheses: Onsager Reciprocal Relations", "subtitle": "From Kelvin's illegal guess to Casimir's parity correction — and the four assumptions every transport tensor silently borrows.", "domain": "nonequilibrium statistical mechanics / irreversible thermodynamics", "era": "1931 (Onsager); canonized 1945–1960 via Casimir, de Groot, Mazur; Nobel 1968", "why_big": "Onsager's 1931 papers showed that the matrix of linear phenomenological coefficients L_ij relating fluxes J_i to thermodynamic forces X_j is symmetric, L_ij = L_ji, as a direct consequence of microscopic time-reversal invariance applied to equilibrium fluctuations — the first general theorem of nonequilibrium statistical mechanics, predating Green-Kubo and the fluctuation-dissipation theorem and effectively containing their linear-response kernel. It unified thermoelectricity (Thomson's 1854 unproven guess relating Seebeck and Peltier coefficients), thermal diffusion, cross-diffusion in multicomponent systems, and chemical-reaction coupling into a single regression-of-fluctuations principle, and it is the silent backbone of every modern transport calculation that writes a symmetric conductivity tensor without comment.", "abuse": "The relations are routinely invoked far outside their derivation: applied to nonlinear regimes, to systems without microscopic reversibility (magnetic fields, Coriolis forces, spin-orbit coupling — where the correct statement is the Onsager-Casimir antisymmetry L_ij(B) = L_ji(-B), not symmetry), to coarse-grained variables whose conjugate forces were never identified from the entropy production σ = Σ J_i X_i, and to active or driven systems where the very notion of an equilibrium fluctuation regressing to the mean does not apply. Textbooks repeat L_ij = L_ji as a universal symmetry while quietly stripping the time-reversal, near-equilibrium, and conjugate-pair assumptions that make it true.", "date": "June 19, 2026", "ts": 1781918874.376627, "engine": "Claude Code CLI · default model", "aliases": ["Onsager relations", "Onsager-Casimir relations", "reciprocal relations of irreversible thermodynamics", "Onsager symmetry", "fourth law of thermodynamics (rare)", "principle of microscopic reversibility applied to fluctuations"], "origin_story": "The relations close a 77-year hole opened by William Thomson (Kelvin) in 1854 [75]: confronted with the thermoelectric circuit, Thomson proposed that the Seebeck and Peltier coefficients must satisfy Π = TS — but admitted his derivation rested on an unjustified application of equilibrium thermodynamics to a process (Joule heating) that is irreversible. Helmholtz [81] reproduced the difficulty; by 1929 Bridgman could still report the Thomson relations as 'the most striking unproved result' of macroscopic physics [82]. The escape came not from thermodynamics but from statistical mechanics. Lars Onsager — then at Brown, no PhD yet — combined three ingredients already in the air: the principle of microscopic reversibility codified by Wegscheider [79] and Tolman [78], Einstein's 1910 Gaussian fluctuation theory, and the Markov regression of small disturbances. In two Physical Review papers of 1931 [71][72] he postulated that the average decay of a spontaneous fluctuation obeys the same linear law as a macroscopic disturbance, and derived L_ij = L_ji from time-reversal invariance of the equilibrium correlation function ⟨α_i(0)α_j(t)⟩. The papers were dense, formally idiosyncratic, and largely ignored for over a decade; Onsager's 1935 Yale thesis was on electrolytes, not on the reciprocal relations. Casimir's 1945 Reviews of Modern Physics paper [73] rewrote the proof, fixed the treatment of time-reversal-odd variables (magnetic field, Coriolis, angular momentum) giving L_ij(B) = L_ji(-B), and produced what every later textbook actually quotes. Prigogine's 1947 Brussels thesis [85], Onsager-Machlup 1953 [77], Kubo 1957 [84], and the de Groot-Mazur monograph of 1962 [76] together canonized the theory and erased its historical contingency. The 1968 Nobel Prize in Chemistry [74] is for the 1931 papers alone.", "credit_audit": "Textbook attribution credits Onsager with the relations and Onsager alone; the actual record is a four-actor play. Thomson [75] posed the problem and guessed the answer for thermoelectricity in 1854 — the 'Kelvin relations' he derived non-rigorously are the case n=2 of L_ij=L_ji. Tolman [78] and Wegscheider [79] supplied the microscopic-reversibility postulate Onsager [71][72] elevated to a general theorem in 1931. Casimir [73] in 1945 produced the modern proof — with parity factors and the magnetic-field antisymmetry — that is what physicists now quote as 'Onsager.' The collected-works commentary by Hemmer, Holden and Kjelstrup [80] documents that Onsager himself believed his strong-electrolytes work was his most important contribution and was somewhat surprised the Nobel committee singled out the reciprocal relations [74]; his Nobel lecture, on ion transport, scarcely mentions them. The de Groot-Mazur monograph [76] welded the modern formulation onto Onsager's name and crowded Casimir out of common usage. Two recurring misattributions: (i) the variational 'principle of least dissipation' is Rayleigh's [86], not Onsager's, even though Onsager Part II [72] is the standard citation; (ii) the symmetry of the conductivity tensor in anisotropic crystals is widely credited to crystal symmetry alone (Voigt/Neumann), whereas it is the n=3 case of Onsager-Casimir and only Onsager-Casimir guarantees it in the presence of dissipation. Finally, the Green-Kubo formula [84] is routinely presented as the source of the symmetry property, reversing the historical and logical order: the symmetry is more general than the linear-response derivation and was proved first.", "timeline": [{"year": 1854, "event": "Thomson conjectures Π = TS and σ_Thomson = T dS/dT for the thermoelectric circuit by a thermodynamic argument he himself flags as illegitimate (it ignores irreversible Joule and conduction heating).", "who": "William Thomson (Kelvin)", "work": "On a Mechanical Theory of Thermo-Electric Currents, Proc. Royal Soc. Edinburgh 3, 91", "kind": "observation", "ref": 1}, {"year": 1873, "event": "Rayleigh introduces the dissipation function F = ½ R_ij q̇_i q̇_j with symmetric R_ij from a least-dissipation variational principle for vibrating systems — the structural ancestor of Onsager's symmetric phenomenological matrix.", "who": "J. W. Strutt (Lord Rayleigh)", "work": "Some General Theorems Relating to Vibrations, Proc. London Math. Soc. s1-4, 357", "kind": "theory", "ref": 6}, {"year": 1901, "event": "Wegscheider's detailed-balance condition on chemical rate constants: at equilibrium each elementary reaction must balance its reverse, beyond what overall thermodynamic equilibrium requires.", "who": "Rudolf Wegscheider", "work": "Über simultane Gleichgewichte... Monatsh. Chem. 22, 849", "kind": "theory", "ref": 8}, {"year": 1925, "event": "Tolman generalizes detailed balance to a 'principle of microscopic reversibility' in quantum statistics — the explicit hypothesis Onsager will invoke six years later.", "who": "Richard C. Tolman", "work": "The Principle of Microscopic Reversibility, Proc. Natl. Acad. Sci. 11, 436", "kind": "formalization", "ref": 7}, {"year": 1929, "event": "Bridgman publishes a careful diagnosis that the Kelvin/Thomson relations cannot be derived from classical thermodynamics, framing the problem Onsager will solve.", "who": "P. W. Bridgman", "work": "On the application of thermodynamics to the thermo-electric circuit, Proc. Natl. Acad. Sci. 15, 765", "kind": "observation", "ref": 3}, {"year": 1931, "event": "Onsager Part I: states the regression hypothesis, proves L_ij = L_ji for scalar processes from time-reversal symmetry of equilibrium correlations, recovers Thomson and gives reciprocity for thermal diffusion and coupled chemical kinetics.", "who": "Lars Onsager", "work": "Reciprocal Relations in Irreversible Processes. I., Phys. Rev. 37, 405", "kind": "theory", "ref": 4}, {"year": 1931, "event": "Onsager Part II: extends to coupled vectorial processes (heat + mass diffusion in anisotropic media), introduces the variational 'principle of least dissipation' for the equations of motion.", "who": "Lars Onsager", "work": "Reciprocal Relations in Irreversible Processes. II., Phys. Rev. 38, 2265", "kind": "theory", "ref": 5}, {"year": 1932, "event": "First application: Uehling shows the Kelvin relations follow from detailed balancing in a transport calculation, with explicit reference to Onsager 1931.", "who": "Edwin A. Uehling", "work": "Kinetic Interpretation of the Kelvin Relations, Phys. Rev. 39, 821", "kind": "theory", "ref": 38}, {"year": 1945, "event": "Casimir rebuilds Onsager's proof, identifies the role of time-reversal parity of state variables, and derives L_ij(B,ω) = ε_i ε_j L_ji(-B,-ω) — the antisymmetric (Onsager-Casimir) relations that handle magnetic fields, Coriolis forces, and angular momentum.", "who": "Hendrik B. G. Casimir", "work": "On Onsager's Principle of Microscopic Reversibility, Rev. Mod. Phys. 17, 343", "kind": "formalization", "ref": 9}, {"year": 1947, "event": "Prigogine's Brussels thesis embeds Onsager's relations in a coherent macroscopic 'thermodynamics of irreversible processes', identifies entropy production σ = Σ J_i X_i as the defining bilinear form fixing the conjugate force-flux pairs, and proves the minimum-entropy-production theorem for the linear regime.", "who": "Ilya Prigogine", "work": "Étude thermodynamique des phénomènes irréversibles, Desoer/Dunod (thesis)", "kind": "formalization", "ref": 44}, {"year": 1948, "event": "Callen systematizes thermoelectric, thermomagnetic and galvanomagnetic effects via Onsager-Casimir, deriving two independent relations among the eight Bridgman coefficients and rescuing the Kelvin relations as a theorem.", "who": "Herbert B. Callen", "work": "Phys. Rev. 73, 1349", "kind": "theory", "ref": 11}, {"year": 1953, "event": "Onsager and Machlup recast the regression theorem as a path-probability functional P[α(t)] ∝ exp(-(1/2k) ∫(L̇ - L)dt) with Lagrangian built from the dissipation function and entropy-production rate, opening the route to stochastic and Lagrangian formulations.", "who": "Lars Onsager, Sigeji Machlup", "work": "Fluctuations and Irreversible Processes I, Phys. Rev. 91, 1505", "kind": "theory", "ref": 20}, {"year": 1957, "event": "Kubo's linear-response formalism: transport coefficients as equilibrium current-current correlators L_ij = ∫₀^∞⟨J_i(0)J_j(t)⟩_eq dt; Onsager symmetry becomes a corollary of time-reversal invariance of the correlator and the FDT becomes the parent theorem.", "who": "Ryogo Kubo", "work": "J. Phys. Soc. Jpn. 12, 570", "kind": "formalization", "ref": 21}, {"year": 1960, "event": "Miller's exhaustive experimental compendium establishes that within stated accuracies L_ij = L_ji holds in thermoelectricity, isothermal diffusion, thermal diffusion, electrokinetics and electrolytes — the empirical canonization of the relations.", "who": "Donald G. Miller", "work": "Chem. Rev. 60, 15", "kind": "observation", "ref": 13}, {"year": 1962, "event": "de Groot and Mazur publish 'Non-Equilibrium Thermodynamics', the definitive monograph that fixes notation (entropy production, phenomenological matrix, parity classification) and inserts Onsager-Casimir into every graduate curriculum.", "who": "S. R. de Groot, P. Mazur", "work": "Non-Equilibrium Thermodynamics, North-Holland (Dover reprint 1984)", "kind": "naming", "ref": 10}, {"year": 1968, "event": "Nobel Prize in Chemistry to Onsager for the 1931 reciprocal relations; his Nobel lecture is on electrolytes, not on the cited work — Onsager remarks he is being honoured for a contribution he had largely set aside.", "who": "Lars Onsager", "work": "Nobel Lecture: The Motion of Ions: Principles and Concepts, Dec 11 1968", "kind": "naming", "ref": 14}], "neglected": [{"name": "William Thomson (Lord Kelvin)", "role": "Stated the prototype reciprocity (Π = TS) for thermoelectricity in 1854 and explicitly conceded that no consistent thermodynamic derivation existed — i.e. he posed the exact problem Onsager solved. Modern citations almost always drop Thomson and present L_ij = L_ji as a Onsager invention sui generis.", "evidence": "Thomson's 1854 paper labels the derivation a 'hypothesis' contingent on neglect of irreversible heating; Bridgman 1929 quotes this passage and calls it the central open problem.", "ref": 1}, {"name": "Hendrik B. G. Casimir", "role": "The version of the relations actually used in physics — with parity factors ε_i, magnetic-field reversal, antisymmetric pieces, and the modern derivation from time-reversal symmetry of the correlation function — is Casimir's 1945 rewrite, not Onsager's 1931 originals. Many textbooks write 'Onsager relations' and quote Casimir's formulas without ever citing him.", "evidence": "Compare the formal structure of Casimir Rev. Mod. Phys. 17, 343 (1945) with what de Groot-Mazur ch. IV present as 'Onsager's theorem': they are line-by-line Casimir.", "ref": 9}, {"name": "Richard C. Tolman", "role": "Codified the principle of microscopic reversibility (the load-bearing axiom of the entire proof) six years before Onsager and supplied the explicit quantum-statistical statement Onsager invokes by name in the 1931 papers.", "evidence": "Onsager 1931 Part I cites Tolman 1925 PNAS explicitly as the source of the microscopic reversibility postulate.", "ref": 7}, {"name": "Rudolf Wegscheider", "role": "Established detailed balance for cyclic chemical reactions in 1901 against the prevailing 'overall equilibrium suffices' view; this is the chemical-kinetic root of Onsager's argument for cross-coupled reactions in Part I §3.", "evidence": "Onsager 1931 Part I attributes the chemical detailed-balance argument to Wegscheider; the Hemmer-Holden-Kjelstrup commentary identifies it as the chemical kinetics root of the 1931 derivation.", "ref": 17}, {"name": "Sigeji Machlup", "role": "Co-author of the 1953 path-probability/Lagrangian reformulation that underlies every modern stochastic-thermodynamic statement of the relations. The 'Onsager-Machlup functional' is universally used and almost as universally cited as 'Onsager' alone.", "evidence": "Phys. Rev. 91, 1505 and 91, 1512 (1953) — two-paper series; Machlup is first author of Part II.", "ref": 20}], "conflations": [{"claim": "'Onsager relations' meaning L_ij = L_ji as a universal symmetry of the phenomenological matrix.", "clarification": "The correct universal statement is the Onsager-Casimir relation L_ij(B,ω,Ω) = ε_i ε_j L_ji(-B,-ω,-Ω) where ε_i = ±1 is the time-reversal parity of variable α_i and (B,Ω) are time-reversal-odd parameters (magnetic field, angular velocity). Symmetry L_ij = L_ji is the special case ε_i ε_j = +1 with no time-reversal-odd fields. Conductivity in a magnetic field, Hall and Nernst tensors, Coriolis-coupled fluid transport, and any spin-orbit problem violate the bare 'symmetry' statement and obey only the parity-corrected one [73]."}, {"claim": "Any pair of 'flux' and 'force' in a transport equation obeys Onsager reciprocity if the matrix is square.", "clarification": "Reciprocity holds only when the J_i and X_i are conjugate in the sense σ = Σ_i J_i X_i with σ the local entropy production [76]. Coleman and Truesdell [16] showed that an arbitrary linear redefinition of forces and fluxes preserves σ and can be chosen to symmetrize the matrix trivially — so the statement L_ij = L_ji is empty unless the conjugate pairing is fixed by an independent thermodynamic identification. Many engineering applications (heat transfer with coarse-grained temperatures, multicomponent diffusion with mass- vs molar-frame fluxes) silently pick a non-conjugate pair and then report 'violations of Onsager.'"}, {"claim": "Onsager reciprocity and the fluctuation-dissipation theorem are independent results.", "clarification": "They share a single content: time-reversal symmetry of the equilibrium two-point function ⟨α_i(0)α_j(t)⟩. Onsager 1931 [71] derived L_ij = L_ji from this; Callen-Welton (1951) and Kubo 1957 [84] derived the FDT from the same input. Onsager is the symmetry under exchange (i↔j); FDT is the relation between the symmetrized correlator and the antisymmetric response (dissipation vs. fluctuation). The Green-Kubo formula L_ij = ∫⟨J_i J_j⟩ dt makes Onsager an algebraic corollary."}, {"claim": "Onsager reciprocity applies to nonequilibrium steady states.", "clarification": "Onsager 1931 [71][72] proves it for fluctuations about a true thermodynamic equilibrium state, where microscopic reversibility holds and entropy is a Lyapunov function. In nonequilibrium steady states (driven, biased, or active matter) there is no microscopic time-reversal symmetry of the steady distribution; what survives is the Gallavotti-Cohen fluctuation theorem and the macroscopic fluctuation theory of Bertini et al. [43], not L_ij = L_ji. The Markovich-Lubensky analysis [68] of chiral active fluids shows explicitly that 'odd viscosity' is precisely the term forbidden by Onsager but generated by violation of detailed balance."}, {"claim": "Microscopic reversibility = detailed balance = Onsager reciprocity, used interchangeably.", "clarification": "Microscopic reversibility is the time-reversal symmetry of the underlying Hamiltonian dynamics (Tolman [78]). Detailed balance is a stronger property of a Markovian master equation: p_eq(a) W(a→b) = p_eq(b) W(b→a). Onsager reciprocity is a still weaker macroscopic consequence: it is the symmetry of a coarse-grained linear-response matrix. Gabrielli, Jona-Lasinio and Landim [61] proved Onsager-type reciprocity can hold without microscopic reversibility under suitable structural conditions, severing what the textbooks had welded together."}], "sections": [{"id": "why-this-mattered", "title": "Why this mattered: Thomson's debt and Onsager's payment", "markdown": "## Why this mattered: Thomson's debt and Onsager's payment\n\nIn 1854 William Thomson read to the Royal Society of Edinburgh a paper that he himself did not believe [1]. He argued that the Peltier coefficient $\\Pi$ and the thermoelectric power $S$ of a junction must satisfy\n\n$$\\Pi = T S, \\qquad \\mu_{\\text{Th}} = T\\,\\frac{dS}{dT},$$\n\n— what we now call the first and second Kelvin relations. The derivation cycled current round a thermocouple, treated the Peltier and Thomson heats as reversible, and *ignored* the Joule dissipation $\\rho J^{2}$ and the Fourier conduction $\\kappa\\,\\nabla T$ that necessarily accompany them. Thomson conceded the move in print: the manipulation, he wrote, rested on a \"hypothesis\" that the reversible and irreversible currents could be separated, a hypothesis for which classical thermodynamics offered no warrant. The experimental fit was uncomfortably good. The argument was wrong.\n\nFor seventy-five years the thermoelectric circuit was the embarrassment of phenomenological thermodynamics. Helmholtz tried to repair it from chemical-thermodynamic first principles [2] and failed in the same way; the irreversible terms always recoiled into the energy balance and broke the proof. Bridgman in 1929 made the diagnosis explicit: no consistent derivation of the Kelvin relations existed within classical thermodynamics, and the relations themselves were almost certainly a special case of some unidentified universal symmetry connecting cross-coefficients of irreversible transport [3]. He posed the problem cleanly and walked away from it. Onsager, then a 26-year-old assistant professor at Brown, read Bridgman and did not.\n\nThe two 1931 *Physical Review* papers [4][5] paid Thomson's debt with interest. Onsager's central postulate — that spontaneous fluctuations from equilibrium decay on average according to the same linear laws that govern macroscopic relaxation — is the *regression hypothesis*. Married to time-reversal symmetry of the equilibrium correlation $\\langle \\alpha_i(0)\\,\\alpha_j(t) \\rangle$ and to a coarse-grained entropy $S(\\alpha)$ whose gradients $X_i = \\partial S/\\partial \\alpha_i$ furnish the thermodynamic forces conjugate to fluxes $J_i = \\dot{\\alpha}_i$, the linear constitutive law $J_i = \\sum_j L_{ij} X_j$ acquires the symmetry\n\n$$L_{ij} = L_{ji}.$$\n\nPart I treats coupled scalar processes — chemical kinetics and thermal diffusion — and recovers Thomson's relations as the $n=2$ case, finally giving them a legitimate derivation. Part II extends to coupled vectorial processes in anisotropic media and re-derives Rayleigh's variational *principle of least dissipation* [6] — older than Onsager by half a century — as a corollary of the regression hypothesis. The microscopic-reversibility axiom Onsager invoked by name is Tolman's 1925 quantum-statistical statement [7]; the chemical detailed-balance argument he leaned on in §3 of Part I is Wegscheider's 1901 result [8]. Both are cited; neither is the kind of name a textbook will later remember.\n\nWhat we mean today by \"the Onsager relations\" is not actually Onsager 1931. Casimir's 1945 *Reviews of Modern Physics* paper [9] rewrote the proof in the language that has survived: assign to each fluctuating variable $\\alpha_i$ a time-reversal parity $\\varepsilon_i = \\pm 1$, allow the Hamiltonian to depend on time-reversal-odd parameters such as a magnetic field $\\mathbf{B}$ or angular velocity $\\boldsymbol{\\Omega}$, and obtain\n\n$$L_{ij}(\\mathbf{B},\\boldsymbol{\\Omega}) = \\varepsilon_i \\varepsilon_j\\, L_{ji}(-\\mathbf{B},-\\boldsymbol{\\Omega}).$$\n\nThe bare $L_{ij}=L_{ji}$ is the special case $\\varepsilon_i \\varepsilon_j = +1$ at zero time-reversal-odd field — exactly the regime in which Onsager originally worked. Every Hall, Nernst, Ettingshausen and Righi–Leduc coefficient that condensed-matter physics now extracts from a magnetotransport tensor obeys Casimir's relation and violates the bare Onsager statement. Yet de Groot and Mazur's 1962 monograph [10] — the book that wrote the modern notation, fixed the entropy-production bilinear $\\sigma = \\sum_i J_i X_i$ as the rule for identifying conjugate force-flux pairs, and pushed the whole apparatus into the graduate curriculum — printed the parity-corrected formula under the heading \"Onsager's theorem\" and gave Casimir a footnote. Callen's 1948 systematization of thermoelectric, thermomagnetic and galvanomagnetic effects [11] did the same: it is Casimir's machinery, recovering Bridgman's eight-coefficient algebra as a closed theorem, badged as Onsager.\n\nSo the textbook collapses four actors into one. Thomson posed the problem and guessed the $n=2$ answer. Tolman and Wegscheider supplied the microscopic axiom — time-reversal symmetry at the level of dynamics, detailed balance at the level of rate constants. Onsager elevated those axioms to a macroscopic theorem on linear-response matrices. Casimir supplied the parity correction that made the theorem usable in the laboratory. Miller's 1959–60 experimental compendium [12][13] then canonized the symmetry empirically across thermoelectricity, isothermal diffusion, thermal diffusion and electrokinetics, fixing $L_{ij}=L_{ji}$ in the chemists' working knowledge before most physicists noticed.\n\nThe 1968 Nobel Prize in Chemistry [14] cited Onsager \"for the discovery of the reciprocal relations bearing his name, which are fundamental for the thermodynamics of irreversible processes.\" His Nobel lecture, *The Motion of Ions: Principles and Concepts*, is about strong electrolytes — the subject of his 1935 Yale dissertation [15] — and scarcely mentions the work that won him the prize. The Royal Society memoir by Longuet-Higgins and Fisher records his own view that the electrolyte theory was his major contribution and the reciprocal relations a youthful aside [16]; the Hemmer–Holden–Kjelstrup commentary in the *Collected Works* concurs [17]. He was honoured, in short, for paying off Thomson's debt — a debt he had largely forgotten he owed."}, {"id": "the-physics-properly", "title": "The physics, properly: regression of fluctuations and the numbered hypotheses", "markdown": "## The physics, properly: regression of fluctuations and the numbered hypotheses\n\nThe 1931 derivation [4][5] is best read as a six-axiom theorem. Stripping the axioms out makes visible exactly which transport problems get to claim $L_{ij}=L_{ji}$ and which do not.\n\n**(A1) Local equilibrium and Gaussian entropy.** Let $\\alpha=(\\alpha_1,\\dots,\\alpha_n)$ be macroscopic deviations from a stable equilibrium state. Expand\n$$S(\\alpha)=S_0-\\tfrac{1}{2}\\sum_{ij}s_{ij}\\,\\alpha_i\\alpha_j,\\qquad s_{ij}=s_{ji}\u003e0,$$\nquadratic order being sufficient because Onsager works to linear order in deviations. The conjugate thermodynamic forces are\n$$X_i=-\\frac{\\partial S}{\\partial\\alpha_i}=\\sum_j s_{ij}\\alpha_j,$$\nand the Einstein relation fixes the equilibrium covariance $\\langle\\alpha_i\\alpha_j\\rangle_{eq}=k_B(s^{-1})_{ij}$. Without Gaussianity the higher cumulants couple in and the linear-response matrix ceases to be the whole story.\n\n**(A2) Microscopic reversibility.** The underlying Hamiltonian dynamics is time-reversal invariant in Tolman's sense [7]: phase-space trajectories come in T-conjugate pairs of equal statistical weight. This — not detailed balance — is the load-bearing axiom (Gabrielli–Jona-Lasinio–Landim [18] exhibit Onsager symmetry without detailed balance, severing what textbooks routinely weld).\n\n**(A3) Linear constitutive law.** Near equilibrium,\n$$J_i\\equiv\\dot\\alpha_i=-\\sum_j L_{ij}X_j=-\\sum_k M_{ik}\\alpha_k,\\qquad M\\equiv Ls.$$\nLinearity demarcates the regime; the full nonlinear Boltzmann equation has no analogous symmetry.\n\n**(A4) Conjugate pairing fixed by entropy production.** The $J_i$ and $X_i$ are not free choices but are tied by\n$$\\sigma=T\\,(dS/dt)\\big|_{irr}=\\sum_i J_iX_i,$$\nthe local entropy production rate [10]. Coleman and Truesdell [19] proved that any linear redefinition preserving $\\sigma$ can be chosen to symmetrize $L$ trivially, so $L_{ij}=L_{ji}$ is vacuous unless the conjugate pairing is fixed by an independent thermodynamic identification — the assumption most often violated silently in engineering practice.\n\n**(A5) Time-reversal parities.** Under $T$, each $\\alpha_i\\mapsto\\varepsilon_i\\alpha_i$ with $\\varepsilon_i=\\pm1$ — positions even, velocities and magnetizations odd. Onsager 1931 took every $\\varepsilon_i=+1$; Casimir [9] supplied the missing classification and the rule for T-odd external parameters ($B$, $\\Omega$).\n\n**(A6) Markovian regression.** A spontaneous fluctuation regresses on the average according to the same linear law as a macroscopically prepared deviation:\n$$\\bigl\\langle\\dot\\alpha_i\\bigr\\rangle_{\\alpha(0)=a}=-\\sum_k M_{ik}\\,a_k.$$\nThis requires the slow variables to be well-separated in time scale from any microscopic memory kernel; long-time hydrodynamic tails, glassy aging, and anomalous diffusion break the hypothesis.\n\n### The derivation in four lines\n\nIterate (A6) to get the conditional mean $\\langle\\alpha_k(\\tau)\\mid\\alpha(0)=a\\rangle=(e^{-M\\tau})_{kl}a_l$, and form the equilibrium correlator\n$$C_{ik}(\\tau)\\equiv\\langle\\alpha_i(0)\\alpha_k(\\tau)\\rangle=\\sum_l(e^{-M\\tau})_{kl}\\,\\langle\\alpha_i\\alpha_l\\rangle_{eq}=k_B\\,(e^{-M\\tau}s^{-1})_{ki}.$$\nMicroscopic reversibility (A2) and parities (A5) demand\n$$C_{ik}(\\tau)=\\varepsilon_i\\varepsilon_k\\,C_{ki}(\\tau)\\big|_{B\\to-B,\\,\\Omega\\to-\\Omega}.$$\nExpand to first order in $\\tau$ — the $\\tau^0$ piece is the Einstein relation and drops out — to obtain $(Ms^{-1})_{ki}=\\varepsilon_i\\varepsilon_k(Ms^{-1})_{ik}$. But $Ms^{-1}=L$. Hence the **Onsager–Casimir relation**\n$$\\boxed{\\;L_{ij}(B,\\Omega)=\\varepsilon_i\\varepsilon_j\\,L_{ji}(-B,-\\Omega)\\;}$$\nwhich collapses to $L_{ij}=L_{ji}$ only when $\\varepsilon_i\\varepsilon_j=+1$ and no T-odd parameter is present.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\n\u003ctitle\u003eRegression of fluctuations and the Onsager–Casimir symmetry\u003c/title\u003e\n\u003cg transform=\"translate(30,30)\"\u003e\n\u003ctext x=\"155\" y=\"0\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eSpontaneous fluctuation, then regression\u003c/text\u003e\n\u003cline x1=\"0\" y1=\"220\" x2=\"310\" y2=\"220\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\n\u003cline x1=\"0\" y1=\"20\" x2=\"0\" y2=\"220\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\n\u003ctext x=\"310\" y=\"240\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003et\u003c/text\u003e\n\u003ctext x=\"-6\" y=\"34\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eα_i(t)\u003c/text\u003e\n\u003cline x1=\"0\" y1=\"160\" x2=\"310\" y2=\"160\" stroke=\"#e8e6e1\" stroke-dasharray=\"3,3\" stroke-width=\"1\"/\u003e\n\u003ctext x=\"316\" y=\"164\" fill=\"#e8e6e1\" font-size=\"14\"\u003e⟨α⟩=0\u003c/text\u003e\n\u003cpath d=\"M0,160 Q12,150 22,156 T44,162 T62,150 T82,158 T100,140 T118,118 T135,90 T148,60\" stroke=\"#7aa2ff\" fill=\"none\" stroke-width=\"1.5\"/\u003e\n\u003ccircle cx=\"148\" cy=\"60\" r=\"4.5\" fill=\"#ff7a90\"/\u003e\n\u003ctext x=\"120\" y=\"50\" fill=\"#ff7a90\" font-size=\"14\"\u003eα(0)=a\u003c/text\u003e\n\u003cpath d=\"M148,60 Q190,110 230,145 Q270,160 305,160\" stroke=\"#ffb86b\" fill=\"none\" stroke-width=\"2.2\"/\u003e\n\u003ctext x=\"200\" y=\"100\" fill=\"#ffb86b\" font-size=\"14\"\u003e⟨α(τ); a⟩ = (e^(-Mτ)a)\u003c/text\u003e\n\u003ctext x=\"245\" y=\"200\" fill=\"#7ee0a3\" font-size=\"14\"\u003eτ\u003c/text\u003e\n\u003cline x1=\"148\" y1=\"180\" x2=\"305\" y2=\"180\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\n\u003c/g\u003e\n\u003cg transform=\"translate(390,30)\"\u003e\n\u003ctext x=\"155\" y=\"0\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eTwo-point function symmetry\u003c/text\u003e\n\u003crect x=\"10\" y=\"20\" width=\"300\" height=\"200\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\n\u003ctext x=\"25\" y=\"55\" fill=\"#7ee0a3\" font-size=\"15\"\u003eC_ij(τ) ≡ ⟨α_i(0) α_j(τ)⟩\u003c/text\u003e\n\u003ctext x=\"160\" y=\"105\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\"\u003e↕ T-reversal (A2,A5) ↕\u003c/text\u003e\n\u003ctext x=\"25\" y=\"155\" fill=\"#7ee0a3\" font-size=\"15\"\u003e= ε_i ε_j ⟨α_j(0) α_i(τ)⟩_{-B}\u003c/text\u003e\n\u003ctext x=\"25\" y=\"185\" fill=\"#7ee0a3\" font-size=\"15\"\u003e≡ ε_i ε_j C_ji(τ; -B)\u003c/text\u003e\n\u003c/g\u003e\n\u003cg transform=\"translate(30,320)\"\u003e\n\u003crect x=\"0\" y=\"0\" width=\"670\" height=\"60\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\n\u003ctext x=\"335\" y=\"25\" fill=\"#ffb86b\" font-size=\"15\" text-anchor=\"middle\"\u003eexpand C_ij(τ) to O(τ); cancel Einstein term ⇒\u003c/text\u003e\n\u003ctext x=\"335\" y=\"48\" fill=\"#ffb86b\" font-size=\"16\" text-anchor=\"middle\"\u003eL_ij(B,Ω) = ε_i ε_j L_ji(−B,−Ω)\u003c/text\u003e\n\u003c/g\u003e\n\u003c/svg\u003e\n*Figure: The regression hypothesis (A6) converts the conditional mean $\\langle\\alpha(\\tau)\\mid a\\rangle=e^{-M\\tau}a$ into a statement about the equilibrium two-point function $C_{ij}(\\tau)$; microscopic reversibility (A2) plus parities (A5) impose the exchange symmetry; the $O(\\tau)$ coefficient is exactly $L$.*\n\n### The Onsager–Machlup Lagrangian and the Green–Kubo corollary\n\nWith $R\\equiv L^{-1}$ the resistance matrix, Onsager and Machlup [20] showed that the path probability for a fluctuation history $\\alpha(\\cdot)$ is Gaussian,\n$$P[\\alpha(\\cdot)]\\propto\\exp\\!\\left(-\\frac{1}{4k_B}\\!\\int dt\\sum_{ij}R_{ij}\\bigl(\\dot\\alpha_i+M_{ik}\\alpha_k\\bigr)\\bigl(\\dot\\alpha_j+M_{jl}\\alpha_l\\bigr)\\right).$$\nExpanding the quadratic produces the Onsager–Machlup Lagrangian\n$$\\mathcal{L}=\\Phi(\\dot\\alpha,\\dot\\alpha)+\\Psi(X,X)-\\dot S,\\qquad \\Phi=\\tfrac{1}{2}R_{ij}\\dot\\alpha_i\\dot\\alpha_j,\\quad \\Psi=\\tfrac{1}{2}L_{ij}X_iX_j,$$\nin which $\\Phi$ is Rayleigh's dissipation function [6]. Stationarity of $\\int\\mathcal{L}\\,dt$ reproduces the linear law — Onsager's \"principle of least dissipation of energy\" is Rayleigh in macroscopic clothing.\n\nKubo's 1957 reformulation [21] encodes the same content as an equilibrium current correlator,\n$$L_{ij}=\\frac{1}{k_B}\\int_0^\\infty\\langle J_i(0)J_j(t)\\rangle_{eq}\\,dt,$$\nmaking $L_{ij}=\\varepsilon_i\\varepsilon_j L_{ji}(-B)$ an algebraic corollary of $\\langle J_i(0)J_j(t)\\rangle=\\varepsilon_i\\varepsilon_j\\langle J_j(0)J_i(t)\\rangle_{-B}$. Onsager–Casimir is then not an independent theorem but a one-line consequence of time-reversal symmetry of the two-point function — the same input that drives the fluctuation–dissipation theorem, and the source of the persistent confusion that the FDT and Onsager reciprocity are separate facts."}, {"id": "strict-conditions-failure-modes", "title": "Strict conditions \u0026 failure modes: where each Ai breaks", "markdown": "## Strict conditions \u0026 failure modes: where each Ai breaks\n\nThe six axioms isolated in §2 — (A1) existence of an entropy potential whose Hessian defines conjugate variables, (A2) time-reversal invariance of the microscopic dynamics, (A3) linearity of the regression equation $\\dot\\alpha_i = -\\sum_j M_{ij}\\,\\alpha_j + \\xi_i$, (A4) conjugate force–flux pairing fixed by $\\sigma = \\sum_i J_i X_i$, (A5) definite time-reversal parity $\\varepsilon_i = \\pm 1$ for every state variable, (A6) Markovian regression on the coarse-grained timescale — are independent failure modes. Each has a characteristic experimental signature and a literature that, for the most part, names the breakdown without renaming the relation.\n\n### A1 — No entropy potential: driven and active matter\n\nThe 1931 derivation [4] requires a thermodynamic equilibrium state with entropy $S(\\alpha)$ such that $X_i = \\partial S/\\partial \\alpha_i$ are restoring forces. In nonequilibrium steady states (NESS) — biased lattice gases, driven Brownian colloids, chemically active suspensions, chiral active fluids — no such global Lyapunov function exists, and the stationary distribution is generically non-Gibbsian. The macroscopic fluctuation theory of Bertini, De Sole, Gabrielli, Jona-Lasinio and Landim [22] is the systematic replacement: a large-deviation rate functional $\\mathcal{I}[\\rho,j]$ takes the role of $S$, and Onsager symmetry survives only in the limit of vanishing drive. Markovich and Lubensky [23] make the consequence explicit in chiral active fluids: an \"odd viscosity\" $\\eta^o$ appears in the stress tensor with $\\eta^o_{ijkl} = -\\eta^o_{klij}$, the exact antisymmetry forbidden by A1+A2 and made possible by the steady chemical drive. De Corato and Pagonabarraga [24] document the same pathology in catalytic colloids: the chemo-mechanical coupling matrix obeys $L_{ij}=L_{ji}$ only when the substrate concentration is at equilibrium with the bath; under sustained turnover the reciprocity is reduced to a ratio of stationary affinities.\n\n### A2 — Time-reversal-odd parameters: $B$, $\\Omega$, spin–orbit\n\nA magnetic field, a rotation, or any explicitly $T$-odd coupling breaks the symmetry of $\\langle \\alpha_i(0)\\alpha_j(t)\\rangle$ under $t \\to -t$ at fixed Hamiltonian. Casimir's 1945 reconstruction [9] is the correct universal statement: $L_{ij}(B,\\Omega) = \\varepsilon_i \\varepsilon_j\\, L_{ji}(-B,-\\Omega)$. This is the relation Hall and Nernst tensors actually obey [11, 25]; the naïve $L_{ij}=L_{ji}$ would force these off-diagonal coefficients to vanish. Guo, Li, Zhu and Behnia [26] verified the field-reversed version in an anisotropic antiferromagnet to 1% by simultaneously measuring transverse thermoelectric and Nernst coefficients at $\\pm B$. Spin-orbit coupling enters as an effective $T$-odd term once spin is integrated out: Arakawa and Yonemitsu [27] and Huang et al. [28] derive the generalized charge–spin reciprocity, in which $L_{ij}^{\\text{charge,spin}}$ relates to $L_{ji}^{\\text{spin,charge}}$ only after a parity flip of the spin index. Dejene, Flipse and van Wees [29] confirmed the Thomson–Onsager pair $\\Pi_S = T S_S$ for spin caloritronics in lateral spin-valve devices — but only after the parity-corrected version was written down.\n\n### A3 — Nonlinearity: high fields, Joule regime, hot carriers\n\nOnsager regression is the linear part of an expansion about equilibrium. Once $X_i$ is large enough that $J_i$ acquires a quadratic component, the coupling matrix $L_{ij}(X)$ generically loses its symmetry: $\\partial J_i/\\partial X_j \\neq \\partial J_j/\\partial X_i$. In high-field thermoelectrics this is the regime where the Kelvin relation $\\Pi = TS$ acquires field-dependent corrections; in semiconductor transport hot-carrier effects shift the Peltier coefficient by terms cubic in the electric field that are not captured by any Onsager-symmetric kernel [30]. Tokura and Nagaosa [31] give the systematic taxonomy: nonlinear (rectification, second-harmonic) responses in non-centrosymmetric materials are precisely the channel through which the linear reciprocity is bypassed. The relation survives only as the leading term of a Volterra series in $X$.\n\n### A4 — Coleman–Truesdell ambiguity: which fluxes, which forces\n\nA4 is the most easily overlooked. Coleman and Truesdell [19, 32] proved that any non-singular linear redefinition $J' = AJ$, $X' = (A^T)^{-1}X$ preserves $\\sigma$, and one can always choose $A$ to symmetrize $L'$. So \"$L_{ij}=L_{ji}$\" carries content only when the pair $(J,X)$ is fixed by an independent thermodynamic identification — namely the local entropy production. Bearman [33] documents the practical failure: multicomponent diffusion reported in mass-fixed versus molar-fixed frames produces matrices whose symmetry is an artifact of the frame choice. Miller's compendium [13] is meticulous on this point — half the apparent \"violations\" of reciprocity in the 1940s electrokinetic literature were Coleman–Truesdell artifacts. Modern engineering thermodynamics still trips over it whenever coarse-grained temperatures or non-conjugate driving forces are used [34, 33].\n\n### A5 — Parity misassignment: Hall, Nernst, odd viscosity\n\nIf the parity $\\varepsilon_i$ of a state variable is mis-assigned, the Casimir factor $\\varepsilon_i\\varepsilon_j$ flips sign and a perfectly valid reciprocity is mistaken for a violation — or, worse, an invalid symmetry is imposed. The classic trap: treating current density as $T$-even (it is $T$-odd) gives $\\sigma_{xy} = \\sigma_{yx}$ at $B=0$, which is correct, but the same mistake at finite $B$ erases the Hall effect. Callen [11] derived the two independent thermomagnetic Bridgman identities precisely by being careful with $\\varepsilon$. Carbone and Rondoni [35] give the necessary-and-sufficient conditions on the parity assignment for time-reversal symmetry to be recoverable when $B \\neq 0$; the upshot is that internal angular-momentum degrees of freedom must be classified explicitly. Nettleton [36] showed the analogous trap in viscoelastic liquids, where elastic strain (T-even) and viscous flux (T-odd) are easily conflated.\n\n### A6 — Non-Markovian regression: glasses and memory\n\nA6 demands that on the coarse-grained timescale the regression $\\dot\\alpha_i \\approx -M_{ij}\\alpha_j$ has no kernel — i.e. $\\langle\\alpha_i(0)\\alpha_j(t)\\rangle$ decays exponentially. In glassy systems, aging dynamics, mode-coupling regimes and rheology of complex fluids, the decay is non-exponential and the response is genuinely $L_{ij}(t-t') = \\int K_{ij}(t-t'')X_j(t'')dt''$ with $K_{ij}(\\tau)$ non-Markovian. Reciprocity persists in the frequency-resolved Onsager–Casimir form $L_{ij}(\\omega,B) = \\varepsilon_i\\varepsilon_j L_{ji}(-\\omega,-B)$ [9, 21], but the static $\\omega \\to 0$ limit can be ill-defined: in aging glasses the two-time correlator depends on the waiting time, and the fluctuation-dissipation ratio $X(t,t_w) \\neq 1$ measures precisely how far the system has wandered from the regime where A6 holds. The same failure mode appears in viscoelastic liquids [36] and in finite-temperature one-dimensional quantum lattice models with anomalous transport [37], where superdiffusive Kardar–Parisi–Zhang behaviour replaces ordinary Markovian regression and the very notion of a static Onsager coefficient dissolves."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: smoking guns vs circumstantial evidence", "markdown": "## Signatures: smoking guns vs circumstantial evidence\n\nA transport experiment that *looks* compatible with Onsager–Casimir is not the same as a transport experiment that *tests* it. The literature is littered with the second kind paraded as the first. The discipline required is to ask, for every claimed signature, what *else* could produce the same observation. Reciprocity is falsifiable only when its alternative producers — crystal symmetry, gauge choice of conjugate variables, Lorentz reciprocity of the constitutive equations, accidental dimensionality — are independently ruled out.\n\n### Smoking guns: direct tests of $L_{ij}=L_{ji}$\n\nA signature is *direct* when the two off-diagonal coefficients are measured by physically distinct protocols and their numerical agreement is not enforced by any symmetry other than time-reversal of the underlying dynamics.\n\n**(S1) The Kelvin relation $\\Pi = T\\,S$.** The Seebeck coefficient $S=(\\nabla V/\\nabla T)_{J=0}$ is measured open-circuit; the Peltier coefficient $\\Pi = (Q/J)_{\\nabla T=0}$ is measured isothermal. Two different circuits, two different instruments, two different sign conventions — and yet Onsager forces $\\Pi/T = S$. Thomson [1] conjectured it in 1854, Bridgman [3] confessed in 1929 that classical thermodynamics could not produce it, Onsager [4] proved it in 1931, Uehling [38] verified it from a Boltzmann calculation in 1932, and Callen [11] rebuilt it as a theorem in 1948. The compendium [13] tabulates the experimental agreement at the 0.1–1% level across metals and semiconductors.\n\n**(S2) Cross-coefficient symmetry in coupled diffusion.** In ternary isothermal diffusion the matrix $J_i = -\\sum_j L_{ij}\\nabla\\mu_j$ is $2\\times 2$ with two off-diagonals measured by independently *prepared* concentration gradients. The conjugate-frame condition matters: the test is meaningful only in the entropy-production frame (mass-frame for non-electrolytes, electrochemical-potential frame for ions). Miller's 1960 review [13] is the empirical canonization: agreement to within $\\sim 2\\%$ in KCl–H$_2$O, urea–water and similar systems. Coleman and Truesdell [19] reminded the community that switching frames trivially destroys or restores the symmetry — a warning routinely ignored.\n\n**(S3) Thermal diffusion (Soret/Dufour).** The Soret coefficient (mass current under $\\nabla T$) and the Dufour coefficient (heat current under $\\nabla\\mu$) are reciprocal: $L_{qm}=L_{mq}$. They are measured in different cells with different boundary conditions [13]. Agreement here is the cleanest case because the two effects involve different transducers and there is no plausible non-Onsager mechanism that would lock them together.\n\n**(S4) The Bridgman count in thermomagnetic transport.** Eight coefficients (Hall, Nernst, Ettingshausen, Righi–Leduc, isothermal/adiabatic versions of each) are connected by two independent Onsager–Casimir identities — Callen's [11] reduction. The discriminating measurement is *field reversal*: Onsager–Casimir demands $L_{ij}(B) = \\varepsilon_i\\varepsilon_j L_{ji}(-B)$, so the test is to measure $L_{ij}$ and $L_{ji}$ at $+B$ and $-B$ separately and check the parity-corrected equation. Dejene–Flipse–van Wees [29] did exactly this for spin caloritronics; Guo et al. [26] did it for anomalous transverse coefficients in an antiferromagnet. These are the modern smoking guns.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDirect vs indirect signatures of Onsager-Casimir\u003c/title\u003e\u003ctext x=\"360\" y=\"26\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" font-family=\"serif\"\u003eDiscriminating direct from indirect signatures\u003c/text\u003e\u003cline x1=\"360\" y1=\"50\" x2=\"360\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"180\" y=\"70\" fill=\"#7ee0a3\" font-size=\"15\" text-anchor=\"middle\"\u003eSMOKING GUNS (direct)\u003c/text\u003e\u003ctext x=\"540\" y=\"70\" fill=\"#ffb86b\" font-size=\"15\" text-anchor=\"middle\"\u003eCIRCUMSTANTIAL (indirect)\u003c/text\u003e\u003crect x=\"40\" y=\"90\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"180\" y=\"110\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eΠ = T S (Kelvin)\u003c/text\u003e\u003ctext x=\"180\" y=\"130\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003etwo circuits, two protocols\u003c/text\u003e\u003crect x=\"40\" y=\"155\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"180\" y=\"175\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eSoret ↔ Dufour\u003c/text\u003e\u003ctext x=\"180\" y=\"195\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eheat-from-∇μ vs mass-from-∇T\u003c/text\u003e\u003crect x=\"40\" y=\"220\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"180\" y=\"240\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eL_ij(B) vs ε_iε_j L_ji(−B)\u003c/text\u003e\u003ctext x=\"180\" y=\"260\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003efield-reversal Hall/Nernst\u003c/text\u003e\u003crect x=\"40\" y=\"285\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"180\" y=\"305\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eBridgman 8 → 2 relations\u003c/text\u003e\u003ctext x=\"180\" y=\"325\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eCallen 1948 thermomagnetic\u003c/text\u003e\u003crect x=\"400\" y=\"90\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"540\" y=\"110\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003esymmetric σ_ij in crystal\u003c/text\u003e\u003ctext x=\"540\" y=\"130\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ealso from Voigt–Neumann\u003c/text\u003e\u003crect x=\"400\" y=\"155\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"540\" y=\"175\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003esymmetric elastic / dielectric\u003c/text\u003e\u003ctext x=\"540\" y=\"195\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ealso from energy potential\u003c/text\u003e\u003crect x=\"400\" y=\"220\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"540\" y=\"240\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ereciprocal scattering S_ij = S_ji\u003c/text\u003e\u003ctext x=\"540\" y=\"260\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ealso from Lorentz reciprocity\u003c/text\u003e\u003crect x=\"400\" y=\"285\" width=\"280\" height=\"55\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"540\" y=\"305\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003egood fit to L X = J data\u003c/text\u003e\u003ctext x=\"540\" y=\"325\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ealso from frame redefinition\u003c/text\u003e\u003ctext x=\"360\" y=\"370\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003eDiscriminator: break the alternative — reverse B, change frame, lift symmetry.\u003c/text\u003e\u003c/svg\u003e\n*Figure: the left column lists experimental observations whose only producer is time-reversal of the microscopic dynamics; the right column lists observations with at least one non-Onsager producer that must be excluded before reciprocity is implicated.*\n\n### Circumstantial: signatures that have other producers\n\n**(C1) A symmetric conductivity tensor in an anisotropic crystal.** That $\\sigma_{ij}=\\sigma_{ji}$ in a quartz or rutile sample is *not* evidence of Onsager reciprocity. The Voigt–Neumann principle — material tensors inherit the point-group symmetry of the crystal — already forces symmetry of any rank-2 tensor in centrosymmetric classes, and in many non-centrosymmetric ones. The Onsager content is exactly the *residual* symmetry that survives once crystal symmetry is quotiented out: it forbids an antisymmetric piece in zero field even when the point group would permit one. The discriminator is to apply a time-reversal-odd perturbation (magnetic field, magnetization, rotation) and check the parity-corrected equation $\\sigma_{ij}(B)=\\sigma_{ji}(-B)$. Tokura–Nagaosa [31] catalogue exactly the non-centrosymmetric quantum materials where this becomes nontrivial.\n\n**(C2) A symmetric elastic or dielectric matrix.** These are forced by the existence of an energy potential ($U(\\epsilon)$ or $U(D)$); the Maxwell relations $\\partial^2 U/\\partial\\epsilon_i\\partial\\epsilon_j = \\partial^2 U/\\partial\\epsilon_j\\partial\\epsilon_i$ give symmetry without invoking irreversible thermodynamics. Treating $C_{ij}=C_{ji}$ as a confirmation of Onsager is a category error: equilibrium response functions are symmetric because they are second derivatives of a state function, not because of microscopic reversibility.\n\n**(C3) Lorentz reciprocity of scattering matrices in linear electromagnetics.** That $S_{ij}=S_{ji}$ between two antenna ports follows from the symmetry of Maxwell's equations under exchange of source and detector in a medium with symmetric $\\varepsilon$ and $\\mu$ — a classical-field statement that predates Onsager and is independent of any thermodynamic axiom. Sounas–Caloz–Alù [39] explicitly engineer angular-momentum bias to break Lorentz reciprocity in a way that has nothing to do with thermodynamic detailed balance. Conflating \"reciprocity\" in the engineering sense with \"Onsager reciprocity\" in the thermodynamic sense is endemic in the metamaterials literature.\n\n**(C4) Good agreement with a linear flux–force fit.** A tensor that fits $J=LX$ with symmetric $L$ proves nothing unless the conjugate-pair identification was fixed *before* the fit: Coleman–Truesdell [19] showed that any nondegenerate linear relabelling of forces and fluxes preserves $\\sigma=\\sum J_iX_i$ and can be chosen to symmetrize $L$. The discriminator is to specify the conjugate pairing from an independent calculation of the entropy production (which frame? which reference velocity? which chemical potential definition?) and then test symmetry — not the other way around. Bearman's analysis [33] of multicomponent diffusion makes this trap explicit.\n\n**(C5) Cross-coefficient agreement in nonequilibrium steady states.** Reports of \"Onsager symmetry\" in driven systems should be treated as circumstantial until detailed balance of the underlying dynamics is independently established. Gabrielli–Jona-Lasinio–Landim [18] proved reciprocity can survive without microscopic reversibility under structural conditions, and Bertini et al. [22] developed macroscopic fluctuation theory precisely because $L_{ij}=L_{ji}$ does not in general hold off equilibrium. Markovich–Lubensky [23] show that the \"odd-viscosity\" terms forbidden by Onsager are exactly what chiral active matter generates. A symmetric-looking transport matrix measured in a driven system is therefore evidence of an accidental algebraic cancellation, not of reciprocity.\n\nThe discipline reduces to one rule. A signature counts as a smoking gun only when the alternative producer — Voigt–Neumann, Maxwell-relation symmetry, Lorentz reciprocity, frame redefinition, accidental cancellation — has been *separately killed*, typically by a field-reversal protocol, a frame transformation, or a parity-odd perturbation. Everything else is circumstantial and should be cited as such."}, {"id": "use-and-abuse", "title": "Use \u0026 abuse: how L_ij = L_ji escaped its hypotheses", "markdown": "## Use \u0026 abuse: how L_ij = L_ji escaped its hypotheses\n\nThe relations escaped because the symbol $L_{ij}=L_{ji}$ is portable and the hypotheses behind it are not. Strip the six axioms of §2 from a derivation and the symmetry survives as a *formal* identity that can be asserted of any square matrix; what is lost is the right to interpret it as a constraint on physical measurements. The literature documents four recurring failure modes in which the formal identity is invoked while one or more axioms is silently false.\n\n### Abuse 1 — Symmetry in B ≠ 0 without Casimir parity\n\nThe bare statement $L_{ij}(\\mathbf B)=L_{ji}(\\mathbf B)$ is not what Onsager proved and not what holds. Casimir's correction [9] is\n$$L_{ij}(\\mathbf B,\\boldsymbol\\Omega)=\\varepsilon_i\\varepsilon_j\\,L_{ji}(-\\mathbf B,-\\boldsymbol\\Omega),$$\nso a Hall, Nernst, Ettingshausen, Righi–Leduc, anomalous-Hall or spin-Hall coefficient is reciprocity-constrained only after the field has been flipped. Cancellations of off-diagonal pieces between $L_{ij}(\\mathbf B)$ and $L_{ji}(\\mathbf B)$ at fixed field are not a test of reciprocity — they are an empirical statement about the antisymmetric part $L_{ij}^A(\\mathbf B)=-L_{ji}^A(\\mathbf B)$, which Casimir explicitly allows to be nonzero. Recent careful work on anisotropic antiferromagnets pins the distinction down experimentally [26], and the spin-caloritronic literature verified the Thomson–Onsager relation only after the parity audit was done in full [29]; Brechet's recent re-derivation insists on the same point [40]. Carbone and Rondoni [35] sharpen what \"time-reversal in $\\mathbf B$\" actually requires, undermining a common shortcut that asserts symmetry under reversal of $\\mathbf B$ alone without checking the parity of the conjugate variables.\n\nA particularly persistent textbook abuse is to credit the symmetry of the conductivity tensor in anisotropic crystals to Voigt–Neumann crystal symmetry. Crystal point-group operations symmetrize the *reversible* tensor; the dissipative part is symmetric only because Onsager–Casimir says so. Without a magnetic field this is a distinction without a difference, and the literature behaved as such for a half-century; with finite $\\mathbf B$ the Voigt argument is wrong and Casimir's is right.\n\n### Abuse 2 — Non-conjugate force–flux pairs\n\nColeman and Truesdell [19][32] proved that an arbitrary linear redefinition $\\tilde J = AJ,\\ \\tilde X = (A^{-1})^{T} X$ preserves the entropy production $\\sigma=\\sum_i J_i X_i$ and can be chosen so that the resulting matrix $\\tilde L$ is symmetric. The corollary they intended as a *warning* — that $L_{ij}=L_{ji}$ has no content until the conjugate pairing is fixed by an independent thermodynamic identification — is now routinely cited as a license. Multicomponent diffusion is the canonical site. Reciprocity holds for the Stefan–Maxwell / Onsager $L_{ij}$ matrix written in the *barycentric* frame with chemical-potential gradients as forces; rewrite the same equations with molar-frame fluxes and concentration gradients and one obtains a Fickian matrix whose off-diagonal entries are *not* equal in general. Bearman [33] worked the linear phenomenological equations out without invoking reciprocity precisely to disentangle the frame dependence, and the recurring confusion in thermodiffusion is exactly this [41]. The same trap is set in heat transfer with coarse-grained temperatures: averaging $T$ over a control volume destroys the local Gibbs identity that defined $X=\\nabla(1/T)$ in the first place, after which \"Onsager reciprocity\" between the coarse-grained variables is wishful.\n\n### Abuse 3 — Driven, active, and nonequilibrium-steady-state systems\n\nOnsager 1931 [4][5] proves $L_{ij}=L_{ji}$ for fluctuations around a *true* equilibrium where the steady distribution is Boltzmann and entropy is a Lyapunov function. Bias the system into a nonequilibrium steady state (chemical drive, shear, electrical current, illumination, activity) and the steady measure is no longer time-reversal symmetric; the regression hypothesis fails at the root. What survives are the Gallavotti–Cohen fluctuation theorem and the macroscopic fluctuation theory of Bertini, De Sole, Gabrielli, Jona-Lasinio and Landim [22] — *not* $L_{ij}=L_{ji}$. The cleanest demonstrations come from chiral active fluids: Markovich and Lubensky [23] show that the *odd viscosity* tensor is precisely the antisymmetric piece forbidden by Onsager and generated by the violation of detailed balance, and Tokura and Nagaosa [31] catalogue the analogous non-centrosymmetric quantum nonreciprocities that the Onsager–Casimir relation rules out at equilibrium. Driven metamaterials engineer the same violation deliberately to obtain isolator-like response [39]. Recent extensions to periodically driven (Floquet) systems require their own derivation; what looks like \"generalized Onsager reciprocity\" there [27][28] is a Casimir-with-parity-of-the-drive statement, not the equilibrium theorem. Conversely, Gabrielli–Jona-Lasinio–Landim [18] showed reciprocity can persist *without* microscopic reversibility under structural conditions — severing one more weld textbooks had taken for granted.\n\n### Abuse 4 — Conflation with FDT, detailed balance, microscopic reversibility\n\nThese four are routinely treated as synonyms; they are a strict hierarchy. *Microscopic reversibility* (Tolman [7]) is time-reversal symmetry of the Hamiltonian. *Detailed balance* is the stronger Markovian statement $p_{\\rm eq}(a)W(a\\to b)=p_{\\rm eq}(b)W(b\\to a)$ (Wegscheider [8]). The *fluctuation–dissipation theorem* (Kubo [21]) relates the symmetric correlator to the antisymmetric response. *Onsager–Casimir* is the symmetry under index exchange of the linear-response matrix [9][10]. FDT and Onsager share an input — time-reversal symmetry of $\\langle\\alpha_i(0)\\alpha_j(t)\\rangle_{\\rm eq}$ — but they are not the same statement: FDT pairs a fluctuation with a dissipation, Onsager pairs $L_{ij}$ with $L_{ji}$. A claim that Onsager \"follows from FDT\" inverts the historical and logical order; Onsager is a corollary of the Green–Kubo formula, not its source.\n\n### Linguistic tells of a hollow claim\n\n- \"By Onsager symmetry…\" with no entropy production $\\sigma$ written, no force–flux pair identified, and no parity vector $\\varepsilon_i$ specified.\n- $L_{ij}(\\mathbf B)=L_{ji}(\\mathbf B)$ asserted at fixed field, without the $\\mathbf B\\to-\\mathbf B$ flip.\n- Reciprocity invoked for a driven, sheared, illuminated or active system without an argument that detailed balance is restored.\n- \"Onsager / FDT / detailed balance\" used as a single hyphenated authority.\n- A \"frame-independent\" reciprocity claim in multicomponent diffusion — the frame is the conjugate-variable choice, and the claim is empty without it.\n\nA clean statement satisfies the converse checklist: write $\\sigma=\\sum J_i X_i$ with the Gibbs identity that produced it; list the parities $\\varepsilon_i$; specify which time-reversal-odd parameters get flipped; and exhibit the equilibrium (not steady-state) ensemble under which microscopic reversibility holds. Anything else is borrowing the symbol and leaving the hypotheses behind."}, {"id": "status-believers-checklist", "title": "Status \u0026 the believer's checklist", "markdown": "## Status \u0026 the believer's checklist\n\nNinety-five years after Part I [4], the reciprocal relations occupy three positions simultaneously, and the literature seldom marks which one is being invoked.\n\n**Position 1 — canonical, in linear irreversible thermodynamics.** The de Groot–Mazur monograph [10] is still the operational reference: identify the entropy-production bilinear form $\\sigma = \\sum_i J_i X_i$, classify each $\\alpha_i$ by its time-reversal parity $\\varepsilon_i$, and write\n$$L_{ij}(\\mathbf{B},\\boldsymbol{\\Omega}) = \\varepsilon_i \\varepsilon_j \\, L_{ji}(-\\mathbf{B},-\\boldsymbol{\\Omega}).$$\nEvery modern transport-coefficient derivation in thermoelectrics [11][25], spin caloritronics [42][29], anomalous Hall and Nernst tensors [26], and even the recently reformulated thermo-magnonic transport [43] still rides on the Onsager–Casimir backbone of [9]. The framework has not been replaced; it has been domesticated.\n\n**Position 2 — demoted, by Kubo and the FDT.** Once Kubo [21] expressed transport coefficients as equilibrium current–current correlators, $L_{ij} = \\int_0^\\infty \\langle J_i(0) J_j(t)\\rangle_\\text{eq}\\, dt$, Onsager's symmetry became an algebraic consequence of the time-reversal symmetry of the two-point function — the same input that yields the fluctuation–dissipation theorem. In the linear-response logical order Onsager is now a corollary, even though historically he proved it first. Strictly, the symmetry remains *more general* than its Kubo derivation: [4] requires only the regression hypothesis, not the full Hamiltonian linear-response machinery. Papers that derive reciprocity \"from Kubo\" are deriving a special case from a stronger hypothesis.\n\n**Position 3 — generalized and partly superseded, far from equilibrium.** Three programs have pushed past the original axioms:\n\n- *Macroscopic fluctuation theory* of Bertini, De Sole, Gabrielli, Jona‑Lasinio and Landim [22] replaces the regression theorem by a large-deviation functional for currents and densities in driven diffusive systems. Onsager symmetry survives as the Hessian of the equilibrium quasi-potential; the genuinely nonequilibrium content lies in an antisymmetric \"Hamiltonian\" piece that obeys an Onsager–Machlup-like structure but is not the bare $L_{ij}=L_{ji}$.\n- *Reciprocity without microscopic reversibility.* Gabrielli, Jona‑Lasinio and Landim [18] proved that an Onsager-form symmetry can hold for coarse-grained matrices even when the underlying Markov dynamics violates detailed balance — severing one of the welds the textbook story makes between Tolman [7], Wegscheider [8], and $L_{ij}=L_{ji}$.\n- *Stochastic and active-matter mutations.* Driven colloids and chemically active swimmers obey modified Onsager relations only after the chemical-potential force is included as a genuine conjugate variable [24]; chiral active fluids generate an \"odd viscosity\" that [Markovich and Lubensky](https://www.pnas.org/doi/10.1073/pnas.2219385121) [23] showed *is exactly the term forbidden by Onsager*, surviving because the non-vanishing angular-momentum density breaks the bilinear-form pairing on which the proof rests. Periodically driven and non-centrosymmetric quantum systems likewise require generalized reciprocity statements [31][27][28].\n\nThe empirical situation has not improved as much as the theoretical one. Miller's 1960 compendium [13] remains the most exhaustive experimental survey; the cleanest modern reciprocity test is the spin-Peltier/spin-Seebeck verification in YIG/Pt and Py/Cu/Py nanopillars [29], which also pinpoints where the relation breaks (Joule-dominated bias). Outside thermoelectrics, \"verifications\" are dominantly circumstantial — see §4.\n\n### The AETHER checklist for any paper invoking Onsager reciprocity\n\n1. **Write the entropy production explicitly.** Display $\\sigma = \\sum_i J_i X_i$ for the problem at hand. Without this factorization, \"forces\" and \"fluxes\" are conventions, and the symmetry claim is the empty content of Coleman–Truesdell [19][32].\n2. **Tag every variable with its time-reversal parity $\\varepsilon_i = \\pm 1$.** State whether each $\\alpha_i$ is a density, a current, a magnetization, or an angular momentum. The genuine statement is Onsager–Casimir, $L_{ij}(\\mathbf{B},\\boldsymbol{\\Omega}) = \\varepsilon_i\\varepsilon_j L_{ji}(-\\mathbf{B},-\\boldsymbol{\\Omega})$, not bare symmetry [9].\n3. **Reverse the field.** If $\\mathbf{B}\\neq 0$ or the frame rotates with $\\boldsymbol{\\Omega}\\neq 0$, the two members of the reciprocity must be measured (or computed) at *opposite* fields. A single-field datum can be *fit* to reciprocity; it cannot *test* it.\n4. **Specify the linear regime.** State the small parameter, give the bias window, and verify that quadratic and higher coefficients are below the reported precision. Reciprocity is a statement about the leading coefficient only; nonlinear coefficients have no Onsager symmetry [29].\n5. **Justify the conjugate pairing independently.** The choice of $(J_i, X_i)$ must come from the thermodynamic bilinear form, not from algebraic convenience or experimental access. Mass-frame vs molar-frame fluxes, lab vs co-moving currents, electrochemical vs electrostatic potentials are not interchangeable [10][33].\n6. **State the regime: equilibrium fluctuations, relaxation, or driven steady state.** Onsager 1931 covers the first two. The third requires MFT [22], a Gallavotti–Cohen-type symmetry, or the structural conditions of Gabrielli–Jona‑Lasinio–Landim [18]. Do not transplant the equilibrium symmetry without naming the replacement theorem.\n7. **Distinguish Onsager from FDT and from detailed balance.** Microscopic reversibility (Tolman [7]), detailed balance of a master equation (Wegscheider [8]), Green–Kubo time-reversal of the correlator [21], and macroscopic $L_{ij}=L_{ji}$ are four statements of decreasing strength. Cite the one you actually use; do not chain them silently.\n8. **Measure $L_{ij}$ and $L_{ji}$ independently.** A reciprocity test requires two experiments — apply $X_j$, measure $J_i$; then apply $X_i$, measure $J_j$ — under matched microscopic conditions. The spin-caloritronic protocol of Dejene, Flipse and van Wees [29] is the template. Inferring one off-diagonal from the other and then announcing agreement is not a test.\n\nA paper that passes all eight has earned the symbol $L_{ij}=L_{ji}$. A paper that uses it without passing them has borrowed Onsager's name and Casimir's mathematics on credit."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent five sections trying to talk the reciprocal relations down from the pedestal the textbooks built for them. Here is where I am willing to plant a flag.\n\n### (a) What I will defend\n\nThe Onsager–Casimir relation in its parity-corrected form,\n$$L_{ij}(\\mathbf{B},\\boldsymbol{\\Omega}) \\;=\\; \\varepsilon_i\\varepsilon_j\\, L_{ji}(-\\mathbf{B},-\\boldsymbol{\\Omega}),$$\nis, given its six axioms, a *theorem*, not a heuristic. I will defend (i) Casimir's [9] formulation as the canonical statement — the unsigned $L_{ij}=L_{ji}$ taught to undergraduates is the special case and should be retired from general use; (ii) the historical reading that Thomson [1] had the n=2 case in 1854 with a candid acknowledgement that his argument was unjustified, and that Tolman [7] and Wegscheider [8] supplied the microscopic-reversibility seed Onsager [4][5] grew into a theorem; (iii) the claim, which the community still resists, that the symmetry of the steady-state conductivity tensor in dissipative anisotropic crystals is *not* a consequence of crystal point-group symmetry — Neumann's principle constrains the form, Onsager–Casimir constrains the symmetry, and the two are independent. I will also defend the unfashionable view that Onsager's own self-assessment in [17] was right: the strong-electrolytes work is the deeper achievement; the Nobel committee picked the more quotable one.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely smuggled through unexamined.\n\n**(A3) Linearity around equilibrium.** The 1931 papers prove reciprocity for the regression of *equilibrium* fluctuations. Every application to a nonequilibrium steady state — thermoelectric devices under finite bias, electrochemical cells, photovoltaic transport — is a leap of faith dressed as a theorem. Macroscopic fluctuation theory [22] makes this explicit: away from equilibrium, the relevant object is a quasi-potential, not the entropy, and there is no general reason for its Hessian to be symmetric. We have decided to call the residual symmetry \"Onsager\" because the matrix is still square.\n\n**(A2) Time-reversal of the relevant dynamics.** Coarse-graining can manufacture or destroy time-reversal symmetry. Whenever a fast variable is integrated out — phonons in electron transport, solvent in colloidal dynamics, fast chemistry in reaction-diffusion — the effective dynamics inherit only the time-reversal symmetry of the *retained* sector. The standard derivation does not track this. Gabrielli–Jona-Lasinio–Landim [18] is the cleanest demonstration that reciprocity and microscopic reversibility can be decoupled; we have not absorbed the lesson.\n\n**Conjugacy of forces and fluxes.** The Coleman–Truesdell [19] observation that $L_{ij}=L_{ji}$ is empty under arbitrary linear redefinitions of $(J_i,X_i)$ is treated as a curiosity. It is not. In multicomponent diffusion, in irreversible thermodynamics of mixtures, and in any engineering use with \"effective\" driving forces, the conjugate pairing is fixed by convention, not by an independent thermodynamic identification. Half the reported \"violations of Onsager\" are misidentifications of the conjugate pair.\n\n### (c) The three open questions I would work on\n\n1. **A sharp criterion for when reciprocity survives coarse-graining without microscopic reversibility.** Generalize [18] from lattice gases to continuum hydrodynamics with conserved currents — this would tell us *a priori* which effective theories must have symmetric Onsager matrices.\n2. **The status of $L_{ij}=L_{ji}$ in nonequilibrium steady states with weak driving.** Identify the leading correction to reciprocity in powers of the driving force; predict its sign and magnitude in a measurable system (thermoelectrics near room temperature are the obvious target).\n3. **Odd transport as the negative space of Onsager.** Map the odd viscosity / odd elasticity / Hall viscosity literature onto a single classification of which parity factors $\\varepsilon_i\\varepsilon_j$ they violate and why — Markichev–Lubensky [23] is the start, not the end.\n\n### Reading path\n\n1. Thomson 1854 [1] — read the original to see how candidly he flagged the gap Onsager would later fill.\n2. Onsager 1931, Parts I \u0026 II [4][5] — read for the *axioms*, not the result; underline every \"we assume.\"\n3. Casimir 1945 [9] — the proof people actually use; pay attention to the parity bookkeeping.\n4. de Groot \u0026 Mazur [10] — the canonical modern formulation, useful precisely because it shows how the hypotheses get quietly absorbed into notation.\n5. Bertini et al., macroscopic fluctuation theory [22] — read last, to see what replaces Onsager once equilibrium is dropped."}], "references": [{"n": 1, "title": "On a Mechanical Theory of Thermo-Electric Currents", "authors": ["William Thomson (Lord Kelvin)"], "year": 1854, "venue": "Proceedings of the Royal Society of Edinburgh 3, 91; reprinted in Mathematical and Physical Papers, vol. 1 (Cambridge UP", "url": "https://archive.org/details/mathematicaland01kelvgoog", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Die Thermodynamik chemischer Vorgä <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
