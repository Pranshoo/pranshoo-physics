pers in twentieth-century condensed-matter physics and one of the most polemical. Its physics is the construction of the normal component as a gas of low-lying excitations of the ground state — phonons at small $|\\mathbf{p}|$, \"rotons\" at a minimum $\\Delta/k_B \\sim 9\\,\\mathrm{K}$ near $p_0/\\hbar \\sim 2\\,\\text{Å}^{-1}$ — and the derivation of the critical velocity\n\n$$v_c = \\min_{\\mathbf{p}} \\frac{\\varepsilon(\\mathbf{p})}{|\\mathbf{p}|}$$\n\nfrom a Galilean boost of the excitation gas. From it follow two-fluid hydrodynamics, second sound, and the temperature dependence of $\\rho_n(T) = -\\tfrac{1}{3}\\int (\\partial f/\\partial \\varepsilon)\\,p^2\\,d^3p/(2\\pi\\hbar)^3$. None of this requires Bose statistics; the spectrum is treated as a property of the interacting many-body ground state.\n\nLandau then attacked. He dismissed London's identification of the λ-transition with BEC as \"irrelevant\"; he wrote that Tisza's two-fluid model contained \"a number of contradictions\" — the principal one being Tisza's assumption that the normal fluid is composed of *atoms* outside the condensate (so $\\rho_n \\to 0$ at $T \\to 0$ would require all atoms to condense, contradicting the strong interaction) rather than of *excitations* of the ground state. On this point Landau was right and Tisza was wrong: a sharper distinction between particles and excitations was needed, and Landau supplied it. On the question of whether the λ-transition is a Bose condensation, Landau was wrong; he insisted that the existence of a phonon–roton spectrum was logically independent of, and incompatible with, the BEC origin.\n\nThe rhetorical effect was disproportionate to the technical correction. In Soviet textbooks — Landau \u0026 Lifshitz, *Statistical Physics, Part 2* in particular — London is mentioned only to be rebutted, and Tisza is reduced to a footnote. Khalatnikov's 1965 monograph *Introduction to the Theory of Superfluidity*, the standard Soviet text, preserves the polemic verbatim. The same generation of Soviet students learned two-fluid hydrodynamics as \"Landau's theory\" with no antecedent.\n\n### 5. Penrose, Onsager, and the restoration through ODLRO\n\nThe restoration came in 1956. Penrose and Onsager [8] defined the order parameter of Bose condensation in an interacting liquid as the largest eigenvalue $n_0$ of the one-body density matrix\n\n$$\\rho_1(\\mathbf{r},\\mathbf{r}') = \\langle \\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(\\mathbf{r}')\\rangle \\;\\xrightarrow[|\\mathbf{r}-\\mathbf{r}'|\\to\\infty]{}\\; \\frac{n_0}{V}\\,\\phi^*(\\mathbf{r})\\phi(\\mathbf{r}'),$$\n\nwith $\\phi$ a macroscopic wave function and $n_0/N$ remaining finite in the thermodynamic limit. This is off-diagonal long-range order: the persistence of phase coherence over arbitrary separations, even when the diagonal density correlations are short-ranged and liquid-like. Their estimate, from a hard-sphere variational calculation, was $n_0/N \\simeq 0.08$ at $T = 0$, in striking agreement with later neutron-scattering measurements ($\\sim 0.07$, Glyde and Stirling, 1990s).\n\nODLRO did three things at once. It supplied a definition of \"BEC in an interacting liquid\" that did not depend on the existence of a single-particle eigenbasis. It made London's intuition precise: He II *is* a Bose condensate, with the order parameter $\\phi(\\mathbf{r})$ playing the role of the macroscopic wave function whose phase gradient is the superfluid velocity, $\\mathbf{v}_s = (\\hbar/m)\\nabla\\arg\\phi$. And it dissolved Landau's objection by exhibiting BEC and a phonon–roton spectrum as compatible — the excitations are Bogoliubov-like quasiparticles of the condensate, not an alternative to it. Bogoliubov's 1947 transformation, which Landau also under-cited, had already shown the same thing in the dilute limit.\n\nBy the early 1960s, with Vinen's direct observation of quantised circulation $\\kappa = h/m$ [10] confirming the macroscopic phase, the London–Tisza picture was the consensus picture. Feynman's 1957 review [11] in *Rev. Mod. Phys.* — written from outside the Soviet polemic — is the document in which the synthesis becomes textbook: London supplied the order parameter, Tisza the hydrodynamics, Landau the excitation spectrum and the microscopic justification of two-fluid kinematics, Bogoliubov the dilute-gas microscopics, Penrose–Onsager the rigorous order parameter. Each piece is necessary; none is sufficient.\n\n### 6. The credit ledger\n\n- **Bose-Einstein origin of the λ-transition**: London, 1938 [5]. Disputed by Landau 1941 [9]; vindicated by Penrose–Onsager 1956 [8].\n- **Two-fluid hydrodynamics**: Tisza, 1938 [4], from London's BEC. Reformulated and microscopically justified by Landau, 1941 [9]. The phrase \"Landau's two-fluid model\" is historically incorrect; \"Tisza–Landau two-fluid model\" is the honest attribution and is the form used by Khalatnikov's later editions, by Pitaevskii and Stringari, and by Balibar in his historical reviews.\n- **Excitation spectrum (phonon–roton)**: Landau 1941 [9], refined Landau 1947 (roton minimum at $\\Delta/k_B \\simeq 8.6\\,\\mathrm{K}$) and Landau 1949 [12]. Tisza's 1949 reply [13] conceded the spectrum and defended the BEC origin; Landau's 1949 paper conceded nothing.\n- **Microscopic dilute-gas theory**: Bogoliubov 1947 — absent from this corpus and routinely under-cited in Western texts that jump from Landau to Gross–Pitaevskii.\n- **Order parameter as ODLRO**: Penrose \u0026 Onsager 1956 [8]. The conceptual closure.\n\nThe lesson is not that Landau was wrong about helium — he was right about almost everything except its statistical origin — but that a single forceful polemic from a single dominant figure can suppress a correct theoretical identification for nearly two decades, in a discipline that prides itself on falsifiability. London died in 1954, two years before ODLRO; Tisza outlived the controversy by half a century and used the late editions of his own writings (notably *Physics Today* 52(10), 26, 1999) to set the record straight."}, {"id": "pedagogical-core", "title": "The Physics Itself: Two-Fluid Hydrodynamics, the Phonon–Roton Spectrum, and ODLRO", "markdown": "## The Physics Itself: Two-Fluid Hydrodynamics, the Phonon–Roton Spectrum, and ODLRO\n\n#1. The two-fluid construction\n\nThe working theory of $^4$He II is a hybrid: a hydrodynamic skeleton (Tisza 1938, refined by Landau 1941) wrapped around a microscopic excitation spectrum (Landau 1941, [9]; Bogoliubov 1947). The hydrodynamic ansatz partitions the mass density into two co-existing, interpenetrating components,\n$$\\rho = \\rho_n(T) + \\rho_s(T), \\qquad \\rho_s(T\\!=\\!0)=\\rho,\\ \\ \\rho_s(T_\\lambda)=0,$$\neach carrying its own velocity field $\\mathbf{v}_n$, $\\mathbf{v}_s$. Mass current and momentum density are\n$$\\mathbf{j} = \\rho_n \\mathbf{v}_n + \\rho_s \\mathbf{v}_s.$$\nThe superfluid is constrained to be irrotational and isentropic; the normal fluid carries all the entropy $s$ and viscosity $\\eta$:\n$$\\nabla\\!\\times\\!\\mathbf{v}_s = 0,\\qquad s_s=0,\\qquad \\eta_s=0.$$\nConservation of mass, entropy, and momentum, combined with the Josephson–Anderson relation\n$$\\partial_t \\mathbf{v}_s = -\\nabla\\!\\left(\\mu + \\tfrac{1}{2} v_s^2\\right),\\qquad \\mu = \\mu_0 - sT_n + \\cdots,$$\ncloses the system. The chemical-potential gradient drives the superfluid; a temperature gradient acts as an effective force on the superfluid through $-s\\,\\nabla T$, which is the microscopic origin of the fountain (thermomechanical) effect first seen by Allen \u0026 Jones [3]. The viscous, dissipative normal component obeys a Navier–Stokes-like equation; the superfluid does not. The decomposition is not a literal mixture of two species of helium atoms — it is a kinematic reorganization of the single quantum liquid into a condensate-like coherent flow and a thermal gas of elementary excitations [9, 12, 13].\n\n#2. The phonon–roton spectrum and Landau's critical velocity\n\nLandau's central move [9] was to treat the normal fluid as a non-interacting gas of quasiparticles with a phenomenological dispersion $\\varepsilon(p)$ exhibiting two branches: a linear (phonon) part at small $p$ with slope $c$ equal to the first-sound velocity, and a local minimum (the roton) at $p_0/\\hbar \\sim 2\\,\\text{Å}^{-1}$ with a gap $\\Delta$,\n$$\\varepsilon_{\\text{ph}}(p) = c\\,p,\\qquad \\varepsilon_{\\text{rot}}(p) \\simeq \\Delta + \\frac{(p-p_0)^2}{2\\mu^*}.$$\nA Galilean boost of the excitation gas with velocity $-\\mathbf{v}_s$ shows that a single quasiparticle can be created by a wall moving at velocity $\\mathbf{v}$ only if $\\varepsilon(p) - \\mathbf{p}\\!\\cdot\\!\\mathbf{v} \u003c 0$ for some $p$. The minimal $|\\mathbf v|$ that satisfies this is the Landau critical velocity,\n$$v_c^{\\text{Landau}} \\;=\\; \\min_{p}\\frac{\\varepsilon(p)}{p}.$$\nFor $^4$He the minimum sits at the roton, giving $v_c^{\\text{Landau}}\\!\\approx\\! 60$ m s$^{-1}$ — a number reached only in ion-propagation experiments and very narrow channels. In bulk flow the critical velocity is set instead by vortex nucleation and is one to three orders of magnitude smaller (Feynman [11], Vinen [10]); this is the first of several conflations the literature still tolerates.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePhonon–roton spectrum with Landau critical-velocity construction\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"690\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003emomentum p\u003c/text\u003e\u003ctext x=\"85\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\"\u003eenergy ε(p)\u003c/text\u003e\u003cpath d=\"M 80 340 Q 160 240 250 150 Q 320 90 360 110 Q 400 130 440 232 Q 480 150 560 70\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"660\" y2=\"160\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"220\" y2=\"170\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/\u003e\u003ccircle cx=\"440\" cy=\"232\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003cline x1=\"440\" y1=\"232\" x2=\"440\" y2=\"340\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/\u003e\u003cline x1=\"80\" y1=\"232\" x2=\"440\" y2=\"232\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/\u003e\u003ctext x=\"445\" y=\"225\" fill=\"#ff7a90\" font-size=\"14\"\u003eroton min (p₀, Δ)\u003c/text\u003e\u003ctext x=\"55\" y=\"236\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"end\"\u003eΔ\u003c/text\u003e\u003ctext x=\"440\" y=\"358\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003ep₀\u003c/text\u003e\u003ctext x=\"170\" y=\"210\" fill=\"#7ee0a3\" font-size=\"14\"\u003eslope c (phonon)\u003c/text\u003e\u003ctext x=\"500\" y=\"135\" fill=\"#ffb86b\" font-size=\"14\"\u003eslope v_c = min ε/p\u003c/text\u003e\u003ctext x=\"280\" y=\"100\" fill=\"#7aa2ff\" font-size=\"14\"\u003emaxon\u003c/text\u003e\u003ctext x=\"600\" y=\"60\" fill=\"#7aa2ff\" font-size=\"14\"\u003efree-particle tail\u003c/text\u003e\u003c/svg\u003e\n*Figure: Landau's phenomenological dispersion for $^4$He II. The linear phonon branch (slope $c$, first-sound velocity) joins the maxon and the roton minimum at $(p_0,\\Delta)$. The construction $v_c = \\min_p \\varepsilon(p)/p$ is the tangent from the origin grazing the roton minimum — the orange dashed line. Bulk superflow breaks down well below this value because vortex nucleation, not single-excitation creation, sets the actual threshold.*\n\n#3. Microscopic underpinning: Bogoliubov and Gross–Pitaevskii\n\nFor the dilute interacting Bose gas Bogoliubov (1947) diagonalized\n$$\\hat H = \\sum_{\\mathbf k}\\varepsilon_{\\mathbf k}^{0}\\,a_{\\mathbf k}^{\\dagger}a_{\\mathbf k} + \\tfrac{1}{2V}\\sum_{\\mathbf k\\mathbf q\\mathbf p}U(\\mathbf q)\\,a_{\\mathbf k+\\mathbf q}^{\\dagger}a_{\\mathbf p-\\mathbf q}^{\\dagger}a_{\\mathbf p}a_{\\mathbf k}$$\nby replacing $a_0,a_0^{\\dagger}\\to\\sqrt{N_0}$ (the c-number condensate) and keeping quadratic terms in the $\\mathbf k\\neq 0$ operators. The canonical $u$–$v$ transformation gives the spectrum\n$$\\boxed{\\;\\varepsilon(\\mathbf k) \\;=\\; \\sqrt{\\varepsilon_{\\mathbf k}^{0}\\bigl(\\varepsilon_{\\mathbf k}^{0}+2nU(\\mathbf k)\\bigr)},\\qquad \\varepsilon_{\\mathbf k}^{0}=\\frac{\\hbar^2 k^2}{2m}.\\;}$$\nIn the long-wavelength limit $\\varepsilon(\\mathbf k)\\to\\hbar c k$ with $c=\\sqrt{nU/m}$ — a phonon branch with $c$ playing the role of Landau's first sound. Above $k\\sim mc/\\hbar$ the spectrum crosses over to the free-particle parabola plus a mean-field shift. The Bogoliubov spectrum has no roton minimum: that feature is non-perturbative, requiring strong correlations of the dense liquid, and was reproduced microscopically only by Feynman's variational ansatz $\\Psi_k = \\rho_{\\mathbf k}^{\\dagger}|0\\rangle$ giving $\\varepsilon_F(k) = \\hbar^2 k^2 / 2m S(k)$, later improved by Feynman–Cohen backflow [11].\n\nThe hydrodynamic limit of the same condensate physics is the Gross–Pitaevskii equation (Gross 1961; Pitaevskii 1961),\n$$i\\hbar\\,\\partial_t \\psi(\\mathbf r,t) = \\left[-\\frac{\\hbar^2}{2m}\\nabla^2 + V_{\\text{ext}}(\\mathbf r) + g|\\psi|^2\\right]\\psi,\\qquad g=\\frac{4\\pi\\hbar^2 a_s}{m},$$\nwith $|\\psi|^2=n$, $\\mathbf v_s = (\\hbar/m)\\nabla\\arg\\psi$. The Madelung decomposition $\\psi=\\sqrt{n}\\,e^{i\\varphi}$ immediately yields irrotational superflow, the quantization of circulation $\\oint \\mathbf v_s\\!\\cdot\\!d\\boldsymbol\\ell = (h/m)\\,n_v$ (Onsager 1949; Feynman 1955 [11]), and reproduces the Bogoliubov spectrum by linearization around a uniform background. GPE is exact for the dilute condensate at $T=0$ and now underlies the quantitative theory of trapped atomic BECs [14].\n\n#4. ODLRO: the order parameter of an interacting Bose liquid\n\nLondon (1938) [5] argued that the $\\lambda$-transition was BEC dressed by interactions, but for an interacting liquid \"macroscopic occupation of $\\mathbf k\\!=\\!0$\" is ambiguous — particles are not momentum eigenstates. Penrose \u0026 Onsager (1956) [8] supplied the operationally clean criterion. The one-body density matrix\n$$\\rho_1(\\mathbf r,\\mathbf r') = \\langle\\hat\\psi^\\dagger(\\mathbf r)\\hat\\psi(\\mathbf r')\\rangle$$\nexhibits *off-diagonal long-range order* (ODLRO) if\n$$\\lim_{|\\mathbf r-\\mathbf r'|\\to\\infty}\\rho_1(\\mathbf r,\\mathbf r') = n_0 \\neq 0.$$\nThe non-vanishing limit defines the condensate density $n_0$, and its phase is the macroscopic phase $\\varphi$ of the order parameter $\\Psi(\\mathbf r) = \\sqrt{n_0}\\,e^{i\\varphi(\\mathbf r)}$. For $^4$He, neutron-scattering measurements of the momentum distribution give $n_0/n\\approx 0.07$ at $T\\!=\\!0$, yet $\\rho_s/\\rho\\to 1$ — the standing reminder that condensate fraction and superfluid fraction are not the same number. ODLRO generalizes to fermions as the long-range behavior of $\\langle \\hat\\psi^\\dagger_\\uparrow(\\mathbf r)\\hat\\psi^\\dagger_\\downarrow(\\mathbf r)\\hat\\psi_\\downarrow(\\mathbf r')\\hat\\psi_\\uparrow(\\mathbf r')\\rangle$ — the Cooper-pair amplitude — which is how the framework absorbs both BCS superconductors and superfluid $^3$He.\n\n#5. Second sound from the two-fluid equations\n\nLandau (1941) [9] noticed that the two-fluid system, having two independent velocity fields, must support two propagating modes. Linearizing the two-fluid equations around equilibrium in the incompressible-momentum-conserving regime and combining the continuity, entropy, and superfluid acceleration equations yields a wave equation for the temperature/entropy disturbance,\n$$\\partial_t^2 T \\;=\\; \\frac{\\rho_s}{\\rho_n}\\,\\frac{s^2 T}{C_v}\\,\\nabla^2 T,$$\nso that an entropy wave propagates at\n$$\\boxed{\\;u_2 \\;=\\; \\sqrt{\\dfrac{\\rho_s}{\\rho_n}\\dfrac{s^2 T}{C_v}}\\;}$$\n— *second sound*. The first sound is the ordinary pressure/density wave with both components moving in phase; second sound is an out-of-phase counterflow in which mass density is constant but entropy (and hence temperature) oscillates. Landau–Khalatnikov (1949) [12] generalized the construction to include dissipation, mutual friction between vortices and the normal component, and the full kinetic equation for the phonon–roton gas; the resulting predictions — that $u_2\\to c/\\sqrt 3$ in the phonon-dominated regime $T\\!\\ll\\!1\\,\\text{K}$, that it vanishes as $\\sqrt{\\rho_s}$ near $T_\\lambda$ — were confirmed by Peshkov (1944, 1946) and refined by Pellam [15]. The very existence of second sound is the cleanest experimental signature that two-fluid hydrodynamics is not a heuristic but a quantitative theory.\n\nThe four objects above — two-fluid equations, $\\varepsilon(p)$ with $v_c=\\min\\varepsilon/p$, the Bogoliubov/GPE microscopic skeleton, and ODLRO — are the apparatus. Their regimes of validity matter as much as their content: the two-fluid description fails when $\\rho_s$ varies on the scale of the coherence length (vortex cores, boundary layers); the Landau spectrum is a low-energy phenomenology, not derivable from first principles in dense $^4$He; the Bogoliubov spectrum applies only when $na_s^3\\ll 1$; ODLRO defines the condensate but does not by itself imply a non-zero $\\rho_s$, a distinction Leggett later sharpened and the next sections will exploit."}, {"id": "vortices-and-topology", "title": "Quantized Circulation and Topological Defects: Onsager's Remark, Feynman's Wave Function, Vinen's Wire", "markdown": "## Quantized Circulation and Topological Defects: Onsager's Remark, Feynman's Wave Function, Vinen's Wire\n\n#1. Onsager's Florence footnote\n\nThe textbook attribution of quantized circulation to Feynman is one of the cleaner cases of erased priority in 20th-century low-temperature physics. The original statement belongs to Lars Onsager and was made not in a paper but as a discussion remark at the September 1949 International Conference on Statistical Mechanics in Florence (proceedings: Nuovo Cimento Suppl. 6, 249–250). Following C. J. Gorter's talk on the two-fluid model, Onsager observed — almost in passing — that if the superfluid velocity is a gradient flow $\\mathbf{v}_s = (\\hbar/m_4)\\nabla\\varphi$, single-valuedness of the macroscopic order parameter forces\n\n$$\\oint_C \\mathbf{v}_s\\cdot d\\boldsymbol{\\ell} \\;=\\; n\\,\\frac{h}{m_4}\\;\\equiv\\; n\\kappa,\\qquad n\\in\\mathbb{Z},$$\n\nwith $m_4$ the bare $^4$He atomic mass and $C$ any closed loop in the superfluid. The integer $n$ is the winding number of $\\varphi$ and the statement is purely topological: it follows from $\\pi_1(U(1))=\\mathbb{Z}$ without any reference to dynamics, interactions, or temperature.\n\nOnsager never developed the remark in print. Feynman in 1955 independently rederived the result in the course of constructing his microscopic theory of rotons and vortex filaments, and in his Reviews of Modern Physics article [11] is scrupulous in crediting \"Onsager (private communication and the discussion remark at Florence).\" The phrase \"Feynman quantization condition\" is downstream of secondary sources, not of Feynman himself.\n\n#2. Feynman's wave function and the vortex ansatz\n\nFeynman's contribution was not the quantization rule but its embedding in a microscopic many-body wave function. His ansatz for an excited state of $N$ atoms is\n\n$$\\Psi_{\\text{exc}}=\\prod_{i=1}^{N} f(\\mathbf{r}_i)\\,\\Phi_0,$$\n\nwith $\\Phi_0$ the ground state (taken positive and nodeless) and $f$ a single-particle modulation. For a phonon, $f(\\mathbf{r})=e^{i\\mathbf{k}\\cdot\\mathbf{r}}$; for a roton, the Feynman–Cohen (1956) refinement adds a backflow factor, lowering the variational gap to the experimental $\\Delta_r/k_B\\approx 8.6$ K. For a straight vortex line along $\\hat{z}$ piercing the origin the appropriate choice is a multivalued phase\n\n$$\\Psi_{\\text{vortex}}=\\prod_i \\frac{x_i+i y_i}{|x_i+i y_i|}\\,\\Phi_0,$$\n\neach factor carrying unit winding. The macroscopic phase $\\varphi(\\mathbf{r})=\\arctan(y/x)$ produces a tangential velocity $v_s=\\hbar/(m_4 r)$ — the irrotational $1/r$ flow demanded by Onsager. The vortex *core*, where the condensate density depletes to zero over a healing length $\\xi\\sim(\\hbar^2/2m_4 \\mu)^{1/2}\\approx 1$ Å in bulk He II, regularizes the otherwise divergent kinetic energy at $r\\to 0$. The line energy per unit length is\n\n$$\\varepsilon_v=\\frac{\\rho_s\\kappa^2}{4\\pi}\\,\\ln\\!\\left(\\frac{b}{\\xi}\\right),$$\n\nlogarithmically infrared-sensitive to the outer cutoff $b$ — set by the container, by the nearest antivortex, or by the inter-vortex spacing in a Feynman array — already a hint of the two-dimensional physics below.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eQuantized circulation around a vortex line\u003c/title\u003e\u003ctext x=\"20\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003e(a) Vortex line: velocity field v_s = (ℏ/m₄)∇ϕ\u003c/text\u003e\u003ccircle cx=\"180\" cy=\"215\" r=\"22\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003ccircle cx=\"180\" cy=\"215\" r=\"55\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003ccircle cx=\"180\" cy=\"215\" r=\"95\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003ccircle cx=\"180\" cy=\"215\" r=\"135\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003ccircle cx=\"180\" cy=\"215\" r=\"6\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"192\" y=\"219\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003ecore ξ ~ 1 Å\u003c/text\u003e\u003cline x1=\"180\" y1=\"120\" x2=\"225\" y2=\"120\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"225,120 216,116 216,124\" fill=\"#ffb86b\"/\u003e\u003cline x1=\"280\" y1=\"215\" x2=\"280\" y2=\"260\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280,260 276,251 284,251\" fill=\"#ffb86b\"/\u003e\u003cline x1=\"180\" y1=\"310\" x2=\"135\" y2=\"310\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"135,310 144,306 144,314\" fill=\"#ffb86b\"/\u003e\u003cline x1=\"80\" y1=\"215\" x2=\"80\" y2=\"170\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"80,170 76,179 84,179\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"270\" y=\"170\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003e|v_s| ∝ 1/r\u003c/text\u003e\u003ctext x=\"390\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003e(b) Phase winds by 2πn around loop C\u003c/text\u003e\u003cellipse cx=\"550\" cy=\"215\" rx=\"125\" ry=\"85\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/\u003e\u003ctext x=\"600\" y=\"118\" fill=\"#7ee0a3\" font-size=\"13\" font-family=\"serif\"\u003econtour C\u003c/text\u003e\u003ctext x=\"535\" y=\"138\" fill=\"#e8e6e1\" font-size=\"13\" font-family=\"serif\"\u003eϕ = 0\u003c/text\u003e\u003ctext x=\"680\" y=\"219\" fill=\"#e8e6e1\" font-size=\"13\" font-family=\"serif\"\u003eπ/2\u003c/text\u003e\u003ctext x=\"540\" y=\"312\" fill=\"#e8e6e1\" font-size=\"13\" font-family=\"serif\"\u003eϕ = π\u003c/text\u003e\u003ctext x=\"395\" y=\"219\" fill=\"#e8e6e1\" font-size=\"13\" font-family=\"serif\"\u003e3π/2\u003c/text\u003e\u003ccircle cx=\"550\" cy=\"215\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"40\" y=\"378\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003e∮_C v_s · dℓ = (ℏ/m₄) ∮_C ∇ϕ · dℓ = n h/m₄ ≡ nκ (Onsager 1949; Feynman 1955)\u003c/text\u003e\u003c/svg\u003e\n*Figure: Geometric content of the quantization rule. (a) The irrotational $1/r$ velocity field around a vortex line, with depletion of the condensate inside the healing-length core. (b) The macroscopic phase $\\varphi$ winds by $2\\pi n$ on any contour $C$ enclosing the core; outside the core the flow is curl-free, and all the vorticity sits on a singular filament of dimension $d-2$.*\n\n#3. Vinen's wire: from prediction to single-quantum observation\n\nThrough the 1950s the quantum $\\kappa=h/m_4\\approx 9.97\\times 10^{-4}\\,\\text{cm}^2/\\text{s}$ remained theoretical. Hall and Vinen's 1956 mutual-friction measurements in rotating buckets showed that *rotation* of He II is sustained by an array of vortex lines of areal density $n_v=2\\Omega/\\kappa$ (Feynman's relation), but the experiment did not isolate a single quantum. The decisive measurement is W. F. Vinen's 1961 detection of a single quantum of circulation around a thin wire [10]: a fine ($\\sim 25\\ \\mu$m) phosphor-bronze wire stretched along the axis of a rotating container was set into transverse oscillation, and the circulation of the superfluid around it lifted the degeneracy of the two transverse polarizations. The observed beat frequency\n\n$$\\Delta\\nu=\\frac{\\rho_s\\kappa}{4\\pi M_w},$$\n\nwith $M_w$ the wire's mass per unit length, locked onto integer multiples of $\\kappa$ as the rotation rate was varied — direct, quantitative confirmation of Onsager's 1949 remark. Vinen reported clean $n=0$ and $n=1$ plateaux; higher $n$ became accessible only with later refinements (Whitmore and Zimmermann, 1968).\n\n#4. Landau's $v_c$ is an upper bound: Iordanskii, Langer, and Fisher\n\nLandau's critical velocity, derived from the phonon–roton spectrum [9, 12],\n\n$$v_c^{\\text{Landau}}=\\min_{p}\\,\\frac{\\varepsilon(p)}{p},$$\n\nis reached at the roton minimum and gives $v_c^{\\text{Landau}}\\approx 60$ m/s. Experimentally, persistent currents in bulk He II decay at velocities one to two orders of magnitude smaller; the discrepancy went unexplained until the early 1960s. The resolution — advanced independently by S. V. Iordanskii (1965) and by J. S. Langer and M. E. Fisher (1967) — is that the relevant excitations are not roton-like quasiparticles but *quantized vortex rings*, whose nucleation must cross a saddle-point free-energy barrier of order\n\n$$F^{*}(v)\\sim \\frac{\\rho_s\\kappa^3}{v}\\,\\ln\\!\\left(\\frac{R^{*}}{\\xi}\\right),\\qquad R^{*}\\sim\\frac{\\kappa}{4\\pi v}.$$\n\nThe flow is metastable, not absolutely stable, above the ring-nucleation threshold; dissipation enters through thermal or quantum tunnelling through $F^{*}(v)$. The phase-slip critical velocity that results lies many orders of magnitude below $v_c^{\\text{Landau}}$. The latter is recovered only in narrow channels (radii $\\lesssim 100$ Å) where the ring barrier is geometrically suppressed, or in ion-propagation experiments which directly probe the roton edge. Volovik [16] treats this as the canonical example of an order parameter whose dynamics is governed by topological defects rather than by its linear excitation spectrum.\n\n#5. Two dimensions: superfluidity without condensation\n\nThe Onsager–Feynman picture acquires its sharpest form in two dimensions. Mermin–Wagner forbids true long-range order of a continuous symmetry at $T\u003e0$, so a 2D Bose system has no BEC in the Penrose–Onsager sense (the one-body density matrix decays as a power law, $\\langle\\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(0)\\rangle\\sim r^{-\\eta(T)}$). Kosterlitz and Thouless [17] showed that *superfluidity nevertheless survives*, protected by an essential singularity in the vortex-unbinding free energy: below $T_{\\text{BKT}}$ vortices appear only as bound $\\pm 1$ pairs whose dipolar interaction leaves the algebraic phase coherence intact; above $T_{\\text{BKT}}$ free vortices proliferate and the superfluid stiffness collapses discontinuously to zero. The universal jump\n\n$$\\rho_s(T_{\\text{BKT}}^{-})=\\frac{2 m^2 k_B T_{\\text{BKT}}}{\\pi\\hbar^2}$$\n\n— derived by Nelson and Kosterlitz (1977) — was confirmed by the Bishop–Reppy torsional-oscillator experiments on $^4$He films (1978). BKT is the cleanest demonstration that *superfluidity is a topological property of the phase field*, not a synonym for Bose condensation. It severs the equivalence that London and Tisza had implicitly assumed and that Penrose–Onsager codified via ODLRO in three dimensions: in 2D, ODLRO is absent yet the helicity modulus (Fisher–Barber–Jasnow, 1973) — the natural diagnostic of phase rigidity — is finite.\n\nConflation watch. (i) \"Feynman quantization\": the condition is Onsager's; Feynman supplied the many-body wave function and the vortex-ring nucleation argument. (ii) \"Landau critical velocity in $^4$He\": almost never the operative bound — phase slips through vortex-ring nucleation dominate by 1–2 orders of magnitude. (iii) \"Superfluid = BEC\": false in 2D, where BKT decouples them; partially false in 3D $^4$He, where the condensate fraction is $\\sim 7\\%$ while $\\rho_s/\\rho\\to 1$ at $T=0$."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From Kapitza's Capillaries to Persistent Currents and Second Sound", "markdown": "## Landmark Experiments: From Kapitza's Capillaries to Persistent Currents and Second Sound\n\nThe phenomenology of ⁴He II and ³He A/B was not settled by a single experiment but by a chain of measurements each of which closed off a classical interpretation and forced acceptance of quantum two-fluid hydrodynamics. The textbook caricature of each is, with depressing regularity, weaker than what the original paper actually demonstrated. The point of this section is to recover that.\n\n### 1. Kapitza's capillaries and the Allen–Jones fountain (1938)\n\nKapitza's 1938 measurement [2] forced superfluid helium between two optically polished disks separated by a slit of order $0.5\\,\\mu$m and inferred an upper bound $\\eta \\lesssim 10^{-11}$ Pa·s — four orders of magnitude below the gas-kinetic minimum. The textbook reading \"He II has zero viscosity\" is too strong: Kapitza himself, and Allen–Misener in the back-to-back paper [1], emphasized that the inferred viscosity *depended on channel width*. Bowers and Mendelssohn [18] later quantified this in slits and capillaries; what Kapitza had measured was not a material constant but the absence of dissipative coupling between the superfluid component and the walls below a (geometry-dependent) critical velocity.\n\nThe Allen–Jones fountain effect [3], announced two months later, is the more conceptually decisive experiment and the one Tisza's two-fluid picture had effectively predicted. A bulb packed with emery powder (a superleak) is heated; helium *flows toward* the heater and jets from a capillary. The thermomechanical relation\n$$\\Delta P = \\rho\\, s\\, \\Delta T$$\n(the London equation) follows from a single assumption — the superfluid component carries no entropy — and was verified quantitatively within months. Caricature: \"heat pushes superfluid.\" Actual content: the entropy current and the mass current of the superfluid component are *independently* zero, which is the operational definition of a two-fluid system at the level of irreversible thermodynamics. The fountain effect, more than the vanishing viscosity, is what made Tisza's framework unavoidable.\n\n### 2. Andronikashvili's torsional oscillator (1946)\n\nE. L. Andronikashvili in Tbilisi suspended a stack of closely spaced aluminum disks (~0.2 mm separation, smaller than the normal-fluid viscous penetration depth) on a torsion fiber and immersed them in He II. The normal component is dragged with the disks; the superfluid component slips. The period of oscillation gives the *moment of inertia of the entrained fluid*, hence $\\rho_n(T)$. Below $\\sim 1$ K he recovered Landau's prediction\n$$\\rho_n(T) \\;=\\; \\frac{2\\pi^2}{45}\\,\\frac{(k_B T)^4}{\\hbar^3 c^3}$$\n— the phonon contribution — and at higher $T$ the additional Boltzmann-suppressed roton term [9]. This is the first direct quantitative validation of the Landau spectrum [9, 11].\n\nThe standard description \"measures the superfluid fraction\" elides what is being measured. Andronikashvili measured $\\rho_n$, the *transverse* current response to a slowly oscillating boundary; $\\rho_s = \\rho - \\rho_n$ is a subtraction. The deep identification — that $\\rho_s$ so defined coincides with the helicity modulus / longitudinal stiffness against a phase twist, and with the condensate-derived order-parameter weight — was only made later (Hohenberg–Martin, Leggett). What Andronikashvili proved is that the *excitation gas* has a well-defined inertial mass and that its temperature dependence matches Landau's quasiparticle dispersion to within a few percent.\n\n### 3. Peshkov and the direct detection of second sound (1944–46)\n\nLandau's 1941 paper [9] predicted a second propagating mode in He II — a temperature/entropy wave in which $\\rho_n$ and $\\rho_s$ oscillate in counterflow with the total density unchanged — with velocity\n$$c_2^2 \\;=\\; \\frac{\\rho_s}{\\rho_n}\\,\\frac{T s^2}{c_v}.$$\nV. P. Peshkov, working in Kapitza's institute under wartime conditions, built a resonant cavity with a heater at one end and a thermometric bolometer at the other and observed standing waves at $c_2 \\approx 19$ m s⁻¹ at $1.5$ K, falling to zero at $T_\\lambda$. The first attempt (1944) used a pulsed technique that Lifshits had pressed Peshkov to try; the definitive 1946 measurements scanned $c_2(T)$ across the entire He II range and matched Landau's formula once $\\rho_s/\\rho_n$ from Andronikashvili was inserted [9, 11].\n\nCaricature: \"Peshkov measured a temperature wave.\" The correct statement is sharper: he measured a counterflow oscillation whose existence requires (i) two independently conserved currents (mass and entropy), (ii) a finite restoring force for entropy redistribution, and (iii) negligible mutual friction below $T_\\lambda$. None of these can be inferred from viscosity measurements alone. Pellam's American replications shortly after [15] confirmed the velocity but used a less clean geometry; Peshkov's data remain the canonical reference.\n\n### 4. Hess–Fairbank and the Meissner-analog persistent current (1967)\n\nG. B. Hess and W. M. Fairbank rotated an annular cell of He II *above* $T_\\lambda$, cooled it through the transition while rotating slowly, then stopped the rotation. The angular momentum retained was strictly *less* than the classical rigid-body value: below a critical angular velocity\n$$\\Omega_c \\;=\\; \\frac{\\hbar}{m\\,R^2}\\ln(R/a)$$\nthe superfluid simply refuses to rotate. This is the rotational analog of the Meissner effect — the irrotational ground state expels external rotation just as a superconductor expels magnetic flux — and it is the *equilibrium* counterpart of the metastable persistent currents Reppy and collaborators had been studying in packed-powder geometries.\n\nCaricature: \"persistent current = supercurrent that doesn't decay.\" Sharper statement: Hess–Fairbank demonstrated that the superfluid response to a Galilean boost in a multiply connected geometry is topologically quantized; the \"current that does not decay\" is a *thermodynamic equilibrium state* at $\\Omega \u003c \\Omega_c$, not a metastable one. This distinction matters for the modern interpretation of supersolid candidates and toroidal cold-atom rings, where the two phenomena are routinely conflated.\n\n### 5. Vinen's wire and Packard's vortex array (1961, 1979)\n\nW. F. Vinen [10] vibrated a thin wire through rotating He II and detected discrete jumps in the wire's circular motion as single quanta of circulation $\\kappa = h/m_4 = 9.97\\times10^{-8}$ m² s⁻¹ attached and detached. This is the first direct observation of the Onsager–Feynman quantization. R. E. Packard's group, between 1974 and 1982, trapped electrons on vortex cores in rotating He II and imaged the resulting array photographically (Yarmchuk–Gordon–Packard, 1979). The number of vortices scaled with $\\Omega$ as $n_v = 2\\Omega/\\kappa$ (Feynman's relation), and the geometric arrangement followed the Tkachenko lattice prediction.\n\nWhat Vinen showed is *quantization of one vortex*; what Packard showed is that *many vortices behave as a rigid lattice* — a distinct and harder claim, because it requires that vortex–vortex interactions stabilize a triangular array against thermal fluctuations and finite-size effects.\n\n### 6. Osheroff, Richardson, Lee — and Leggett's diagnosis (1972)\n\nThe 1972 PRL \"Evidence for a New Phase of Solid ³He\" [19] in fact reported anomalies in Pomeranchuk-cell pressure traces at 2.7 mK and 1.8 mK that the authors initially attributed to the solid. The follow-up PRL [20] re-identified the cusps as transitions in the *liquid*, with NMR signatures (a frequency shift in the A phase that vanishes in the B phase) that no ordinary magnetic ordering could explain. Leggett's companion paper [21] showed that these signatures are diagnostic of a *spin-triplet, $p$-wave* order parameter with spontaneously broken relative spin–orbit rotation symmetry — the A phase being the Anderson–Brinkman–Morel state, the B phase the Balian–Werthamer state.\n\nCaricature: \"they discovered ³He superfluidity.\" Actual sequence: they discovered two transitions, misidentified the medium, then with Leggett's NMR theory established that ³He realizes a fundamentally richer order parameter than ⁴He — anisotropic, multi-component, with topologically distinct phases. The 1996 Nobel honored the experimental triad; Leggett's 2003 Nobel honored the theory. The 1973 confirmation by Wheatley's group and Greytak's neutron-scattering work cemented the identifications, but the conceptual leap — that a superfluid order parameter could be a matrix in spin and orbital indices — is what propagated into the theory of unconventional superconductors and topological superfluids covered in §6."}, {"id": "he3-and-unconventional-pairing", "title": "Superfluid ³He: Spin-Triplet p-Wave Pairing and the Multi-Component Order Parameter", "markdown": "## Superfluid ³He: Spin-Triplet p-Wave Pairing and the Multi-Component Order Parameter\n\n#1. Why ³He cannot be ⁴He\n\nThe folklore that \"superfluid ³He is like ⁴He at a lower temperature\" persists because both fluids share a hydrodynamic surface — persistent currents, quantized vortices, dissipationless film flow. The microscopics are unrelated. ⁴He is a scalar Bose liquid; its order parameter is a single complex number $\\Psi = |\\Psi| e^{i\\varphi}$ and the broken symmetry is $U(1)$. ³He is a Fermi liquid (nuclear spin $\\tfrac{1}{2}$, density $\\sim 1.6\\times 10^{22}\\,\\text{cm}^{-3}$), and any superfluid transition requires Cooper pairing. The strong short-range repulsion at the trinucleon scale suppresses the $s$-wave channel — the point first sharpened by Rice [22] and Buckingham when ³He superfluidity was still a theoretical conjecture, then made quantitative by the paramagnon (spin-fluctuation) calculations of the late 1960s. Pairing therefore proceeds in an odd channel with $L=1$ and $S=1$ jointly antisymmetric under exchange — a Fermi-system analogue of the nuclear pairing problem treated systematically in [23].\n\n#2. The d-vector order parameter\n\nA spin-triplet, $p$-wave gap is parameterised by a $3 \\times 3$ complex matrix in spin space,\n\n$$\\Delta_{\\alpha\\beta}(\\mathbf{k}) = \\sum_{\\mu} d_\\mu(\\mathbf{k})\\,(i\\sigma_\\mu \\sigma_y)_{\\alpha\\beta},\\qquad d_\\mu(\\mathbf{k}) = \\sum_i d_{\\mu i}\\,\\hat{k}_i.$$\n\nThe tensor $d_{\\mu i}$ has nine complex entries — eighteen real degrees of freedom modulo an overall phase, against the *one* phase of ⁴He. The vector $\\mathbf{d}(\\hat{\\mathbf{k}})$ has a direct reading: it is the axis along which the pair has vanishing spin projection, $(\\hat{\\mathbf{d}}\\cdot\\hat{\\mathbf{S}})|\\text{pair}\\rangle = 0$, so the pair spin lies in the plane $\\perp \\hat{\\mathbf{d}}$. The orbital structure is encoded in the $\\hat{\\mathbf{k}}$-dependence; the gap magnitude on the Fermi surface is $|\\Delta(\\hat{\\mathbf{k}})|^2 = \\mathbf{d}^*(\\hat{\\mathbf{k}})\\cdot\\mathbf{d}(\\hat{\\mathbf{k}})$ for unitary states.\n\n#3. The Anderson–Morel state (A phase)\n\nAnderson and Morel (1961) proposed the equal-spin-pairing (ESP) ansatz\n\n$$d_{\\mu i} = \\Delta_0\\,\\hat{d}_\\mu\\,(\\hat{m}_i + i\\hat{n}_i),\\qquad \\hat{l}\\equiv \\hat{m}\\times\\hat{n}.$$\n\nThe orbital factor $\\hat{m}+i\\hat{n}$ carries definite chirality $L_z = +\\hbar$ along $\\hat{l}$. The gap is $|\\Delta(\\hat{\\mathbf{k}})|^2 = \\Delta_0^2\\,(1-(\\hat{\\mathbf{k}}\\cdot\\hat{l})^2)$, with two point nodes at $\\hat{\\mathbf{k}} = \\pm\\hat{l}$ — the Fermi surface remains gapless on a measure-zero locus, and excitation densities scale as $T^3$ at low temperature. In spin space only $|\\!\\!\\uparrow\\uparrow\\rangle$ and $|\\!\\!\\downarrow\\downarrow\\rangle$ pairs appear (the $|\\!\\!\\uparrow\\downarrow\\!+\\!\\downarrow\\uparrow\\rangle$ component is empty when $\\hat{\\mathbf{d}}\\parallel\\hat{z}$). Time reversal is broken by $\\hat{l}$.\n\n#4. The Balian–Werthamer state (B phase)\n\nBalian and Werthamer (1963) found that within weak-coupling BCS the energetically preferred state is maximally isotropic,\n\n$$d_{\\mu i} = \\Delta_0\\,R_{\\mu i}(\\hat{\\mathbf{n}},\\theta),\\qquad R\\in SO(3).$$\n\nThe gap is fully isotropic, $|\\Delta(\\hat{\\mathbf{k}})|^2 = \\Delta_0^2$, and all three triplet substates participate coherently. The symmetry breaking is $SO(3)_S \\times SO(3)_L \\times U(1)\\to SO(3)_{L+S}\\times\\mathbb{Z}_2$: spin and orbital rotations are locked, leaving the relative angle $\\theta$ to be fixed dynamically by the nuclear dipole–dipole interaction at the Leggett angle $\\cos\\theta_L = -\\tfrac{1}{4}$.\n\n#5. The A₁ phase\n\nA magnetic field lifts the degeneracy of $|\\!\\!\\uparrow\\uparrow\\rangle$ and $|\\!\\!\\downarrow\\downarrow\\rangle$ pairs, selecting a single ESP component ($d_z=0$, one spin condensate absent). A₁ occupies a narrow sliver between the normal state and A, identified at Cornell within the same series of experiments that resolved B [20].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePhase diagram and gap structures of superfluid 3He\u003c/title\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eP–T phase diagram of ³He (schematic) and gap geometry on the Fermi sphere\u003c/text\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"380\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"220\" y=\"362\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eT (mK)\u003c/text\u003e\u003ctext x=\"32\" y=\"200\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\" transform=\"rotate(-90 32 200)\"\u003eP (bar)\u003c/text\u003e\u003ctext x=\"60\" y=\"355\" fill=\"#e8e6e1\" font-size=\"11\" text-anchor=\"middle\"\u003e0\u003c/text\u003e\u003ctext x=\"380\" y=\"355\" fill=\"#e8e6e1\" font-size=\"11\" text-anchor=\"middle\"\u003e2.7\u003c/text\u003e\u003ctext x=\"50\" y=\"343\" fill=\"#e8e6e1\" font-size=\"11\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"50\" y=\"80\" fill=\"#e8e6e1\" font-size=\"11\" text-anchor=\"end\"\u003e34\u003c/text\u003e\u003cpath d=\"M 60 320 Q 200 195 360 88\" stroke=\"#7aa2ff\" stroke-width=\"1.8\" fill=\"none\"/\u003e\u003cpath d=\"M 230 340 Q 250 240 305 150\" stroke=\"#ffb86b\" stroke-width=\"1.6\" fill=\"none\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"120\" y=\"220\" fill=\"#7ee0a3\" font-size=\"14\"\u003eB\u003c/text\u003e\u003ctext x=\"295\" y=\"190\" fill=\"#ffb86b\" font-size=\"14\"\u003eA\u003c/text\u003e\u003ctext x=\"335\" y=\"320\" fill=\"#e8e6e1\" font-size=\"13\"\u003enormal\u003c/text\u003e\u003ccircle cx=\"230\" cy=\"340\" r=\"3.5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"234\" y=\"335\" fill=\"#ff7a90\" font-size=\"11\"\u003ePCP\u003c/text\u003e\u003ctext x=\"200\" y=\"55\" fill=\"#7aa2ff\" font-size=\"12\"\u003eT_c (2nd-order line)\u003c/text\u003e\u003ctext x=\"252\" y=\"135\" fill=\"#ffb86b\" font-size=\"11\"\u003eA–B coex.\u003c/text\u003e\u003ccircle cx=\"540\" cy=\"180\" r=\"70\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cellipse cx=\"540\" cy=\"110\" rx=\"14\" ry=\"5\" fill=\"#ff7a90\"/\u003e\u003cellipse cx=\"540\" cy=\"250\" rx=\"14\" ry=\"5\" fill=\"#ff7a90\"/\u003e\u003cline x1=\"540\" y1=\"250\" x2=\"540\" y2=\"110\" stroke=\"#ffb86b\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/\u003e\u003ctext x=\"558\" y=\"145\" fill=\"#ffb86b\" font-size=\"12\"\u003el̂\u003c/text\u003e\u003ctext x=\"540\" y=\"100\" fill=\"#ff7a90\" font-size=\"11\" text-anchor=\"middle\"\u003enode\u003c/text\u003e\u003ctext x=\"540\" y=\"270\" fill=\"#ff7a90\" font-size=\"11\" text-anchor=\"middle\"\u003enode\u003c/text\u003e\u003ctext x=\"540\" y=\"320\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eA: |Δ|² ∝ sin²θ\u003c/text\u003e\u003ccircle cx=\"660\" cy=\"180\" r=\"50\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ccircle cx=\"660\" cy=\"180\" r=\"58\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"660\" y=\"110\" fill=\"#7ee0a3\" font-size=\"11\" text-anchor=\"middle\"\u003eisotropic gap\u003c/text\u003e\u003ctext x=\"660\" y=\"320\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eB: |Δ|² = Δ₀²\u003c/text\u003e\u003c/svg\u003e\n*Figure: Pressure–temperature phase diagram of bulk ³He (left; polycritical point PCP near 21 bar) and the gap magnitude on the Fermi sphere for each phase (right). The A phase, stable only above the PCP, carries two point nodes along the chiral axis $\\hat{l}$; the B phase has a fully isotropic gap. The A₁ sliver (omitted) opens between normal and A in finite magnetic field.*\n\n#6. Discovery and Leggett's NMR theory\n\nOsheroff, Richardson, and Lee at Cornell saw two anomalies near 2.7 mK and 1.9 mK along the Pomeranchuk melting curve and initially read them as solid-³He magnetic transitions [19]. The liquid identification followed when Osheroff, Gully, Richardson and Lee resolved the susceptibility signatures [20]: A has the unchanged Curie–Weiss susceptibility of the normal liquid (consistent with ESP, in which $\\chi$ is preserved along $\\hat{\\mathbf{d}}_\\perp$), while B shows a temperature-dependent drop characteristic of a fully gapped, all-triplet condensate. The decisive theoretical move was Leggett's [21]: in a spin-triplet condensate the tiny dipole–dipole interaction breaks the otherwise-massless relative spin–orbit rotation modes, generating a *longitudinal* NMR resonance at finite frequency $\\Omega_A(T)\\propto\\Delta_0(T)$ (impossible in any liquid with a rotation-invariant $\\chi$) and a positive *transverse* shift in B,\n\n$$\\omega_\\perp^2 = \\omega_L^2 + \\tfrac{1}{5}\\Omega_B^2(T).$$\n\nThe longitudinal resonance in A was the smoking-gun identification of the Anderson–Morel state — no scalar superfluid can possess one.\n\n#7. Topology, defects, and the surface spectrum\n\nThe residual symmetry group $H$ in each phase determines the defect spectrum and has no ⁴He analogue. In A, $H = U(1)_{S_z}\\times\\mathbb{Z}_2$ supports *half-quantum vortices* (a $\\pi$ flip in $\\hat{\\mathbf{d}}$ compensated by a $\\pi$ phase slip) and the singular surface point defect known as a boojum — where $\\hat{l}$ meets a wall. In B, the locked $SO(3)_{L+S}$ generates textures with non-trivial $\\pi_3$ (Anderson–Toulouse–Volovik solitons) and a richly structured surface layer. The topological classification of [24] places ³He-B in class DIII, with protected Majorana surface modes; Volovik's monograph [16] develops the full programme, including the chiral-Weyl character of A. A bosonic scalar superfluid hosts none of this.\n\n#8. Impurities, confinement, and what they reveal\n\nAnderson's theorem fails for non-$s$-wave channels: non-magnetic disorder is pair-breaking. The Ginzburg–Landau machinery developed by Thuneberg and collaborators for aerogel-confined ³He [25] quantifies the suppressed $T_c$, stabilises a *polar* phase between A and B (impossible in clean bulk), and gives controlled experimental access to the A–B transition. None of these phenomena exist in ⁴He, whose scalar order parameter is, by construction, robust against the same disorder.\n\n#9. Verdict on the conflation\n\nThe \"³He is like ⁴He\" reading retains a single shared fact — dissipationless flow — and erases everything that makes ³He distinct: a tensor order parameter; multiple ordered phases; broken time reversal in A; coupled spin–orbital dynamics observable as longitudinal NMR; nodal quasiparticles; topologically protected surface modes. The two superfluids stand together only as the simplest and the most intricate examples of the same broken-$U(1)$ phenomenology, joined through Leggett's analysis [21] and Volovik's later identification of ³He-A as a paired-fermion Weyl medium [16]. Microscopically they are not the same kind of thing, and the textbook habit of treating them as adjacent chapters of one story obscures the most interesting physics each contains."}, {"id": "validity-audit-and-conflations", "title": "What Still Holds, What Was Superseded, and Where the Literature Confuses Itself", "markdown": "## What Still Holds, What Was Superseded, and Where the Literature Confuses Itself\n\nThe seventy years since Landau's 1941 paper have produced a layered theoretical inheritance in which each generation of results has been partially preserved, partially absorbed into a wider framework, and partially mis-cited into folklore. The audit below sorts the surviving formulations from the superseded ones and, in each case, names the conflation that the modern literature still propagates.\n\n### 1. The Landau critical velocity: an upper bound, not the answer\n\nLandau's criterion\n\n$$v_c \\;=\\; \\min_{p} \\,\\frac{\\varepsilon(p)}{p}$$\n\nremains correct as a *kinematic upper bound*: a superflow that exceeds the minimum of $\\varepsilon(p)/p$ admits energy-conserving Cherenkov-like emission of an elementary excitation into the rest frame of the walls, and the flow must decay [9, 12]. For ⁴He the roton minimum sets $v_L \\approx 60$ m s$^{-1}$, a number confirmed by negative-ion mobility experiments near saturated vapour pressure (Ellis, McClintock; verify).\n\nWhat is wrong in the textbooks is the implication that $v_L$ is the *operative* critical velocity. In capillaries and rotating buckets, dissipation sets in at $v_c^{\\mathrm{vortex}} \\sim (\\hbar/m d)\\ln(d/a_0)$ with $d$ the channel width and $a_0 \\sim 1$ Å the vortex core, three to four orders of magnitude below $v_L$ [11, 10]. The breakdown mechanism is vortex nucleation — Feynman's prediction, Vinen's wire observation [10], and Iordanskii's barrier theory (verify). Landau's bound is touched only in narrow geometries (sub-µm orifices) and ion-bubble experiments where vortex nucleation is geometrically suppressed.\n\nThe honest statement is therefore: $v_L$ is the spectroscopic ceiling; the operative critical velocity is set by the nucleation rate of topological defects, which depends on geometry, surface roughness, and (in ³He) the order-parameter manifold.\n\n### 2. The Gross–Pitaevskii equation: dilute-gas regime only\n\n$$i\\hbar\\,\\partial_t \\Psi \\;=\\; \\Big[-\\frac{\\hbar^{2}}{2m}\\nabla^{2} + V_{\\mathrm{ext}} + g|\\Psi|^{2}\\Big]\\,\\Psi,\\qquad g=\\frac{4\\pi\\hbar^{2} a_s}{m}$$\n\nis exact only in the limit $n a_s^{3} \\to 0$, where $n$ is the density and $a_s$ the s-wave scattering length [14]. It is a mean-field equation for the condensate wavefunction; it presupposes that essentially all particles are condensed.\n\nFor ⁴He the diluteness parameter is $n a_s^{3} \\sim 0.2$ and the condensate fraction at $T=0$ is $n_0/n \\approx 0.07$–$0.09$ as measured by deep-inelastic neutron scattering (Sokol; Glyde; verify). GPE applied to ⁴He yields the right hydrodynamic skeleton (compressible Euler equation, quantized circulation, Bogoliubov-like sound) but the wrong roton minimum, the wrong static structure factor, and the wrong condensate depletion. Quantitative ⁴He theory needs path-integral Monte Carlo, correlated basis functions, or the Bijl–Feynman–Cohen variational ansatz [11]; the GPE is a cartoon.\n\nConversely for trapped alkali BECs $na_s^{3} \\sim 10^{-5}$–$10^{-3}$ and GPE is essentially exact for ground-state density, collective-mode frequencies, and vortex dynamics [14]. The conflation to flag: papers that present GPE solutions as \"superfluid helium dynamics\" — they are dilute-gas dynamics in helium's clothing.\n\n### 3. BEC $\\ne$ superfluidity (Leggett's theorem, the depleted condensate, BKT)\n\nThis is the most consequential conflation in the field, and it survives in textbooks because the dilute-gas / weakly-interacting case happens to make the two notions coincide.\n\nThe two definitions are inequivalent:\n\n| concept | order parameter | diagnostic |\n| --- | --- | --- |\n| BEC | macroscopic eigenvalue of $\\rho_1(\\mathbf{r},\\mathbf{r}')$; ODLRO | $\\lim_{\\mid \\mathbf{r}-\\mathbf{r}'\\mid \\to \\infty} \\rho_1 = n_0 \\ne 0$ |\n| superfluidity | nonclassical response to boundary motion; transverse current rigidity | $\\rho_s = \\lim_{q\\to 0} \\chi_{JJ}^{T}(q)$; persistent current, quantized circulation |\n\nThe ODLRO definition is Penrose–Onsager [8]. The superfluid-density definition (helicity modulus / two-fluid stiffness) is Hohenberg–Martin and was sharpened in the dynamic critical phenomena programme [26].\n\nThree counterexamples force the distinction:\n\n(i) **Ideal Bose gas.** Bose condenses below $T_c$ but has $\\rho_s = 0$: any infinitesimal moving wall drags the entire gas because the spectrum is $\\varepsilon(p) = p^{2}/2m$ and the Landau criterion gives $v_c = 0$. BEC without superfluidity [13, 27, 28].\n\n(ii) **⁴He at $T=0$.** $n_0/n \\approx 0.07$ but $\\rho_s/\\rho = 1$. Most of the fluid is *not* condensed in the single-particle sense, yet the entire fluid participates in irrotational potential flow. The interactions transfer rigidity from the condensate to the rest of the liquid; the ODLRO matrix element survives even though most particles sit in finite-momentum states [8, 11].\n\n(iii) **2D ⁴He films.** The Mermin–Wagner theorem forbids true BEC at $T\u003e0$ in two dimensions, yet thin ⁴He films exhibit a superfluid transition at the Kosterlitz–Thouless temperature with a universal jump $\\rho_s(T_{\\mathrm{BKT}})/T_{\\mathrm{BKT}} = 2m^{2}k_B/\\pi\\hbar^{2}$ [17]. The order is quasi-long-range (algebraic decay of $\\rho_1$), not ODLRO. Superfluidity without BEC.\n\nThe clean disentanglement: BEC is a statement about the *one-body density matrix*; superfluidity is a statement about the *current–current response function*. They coincide only in the weakly interacting 3D limit where Bogoliubov theory holds.\n\n### 4. \"He II\" $\\ne$ \"the superfluid component\"\n\nA thermodynamic phase and a hydrodynamic variable are routinely identified in popularizations and even in some research papers. They are different objects:\n\n- **He II** is the equilibrium phase of liquid ⁴He below $T_\\lambda = 2.17$ K at saturated vapour pressure. It is a single thermodynamic substance with a well-defined density $\\rho(T,P)$, entropy $s(T,P)$, and chemical potential. Above $T_\\lambda$ it is called He I.\n\n- **The superfluid component** is a *hydrodynamic variable* in the Tisza–Landau two-fluid theory, with its own velocity field $\\mathbf{v}_s = (\\hbar/m)\\nabla\\varphi$ and density $\\rho_s(T)$ such that $\\rho_n + \\rho_s = \\rho$. It is not a chemically separable fraction of atoms; it is a decomposition of the *momentum response* into a part that carries entropy ($\\rho_n \\mathbf{v}_n$) and a part that does not ($\\rho_s \\mathbf{v}_s$).\n\nThe ratio $\\rho_s/\\rho$ runs from 0 at $T_\\lambda$ to 1 at $T=0$ and is measured by Andronikashvili's torsional oscillator, by second sound velocity, and by the thermomechanical (fountain) effect [9, 3]. Saying \"I poured the superfluid component into a beaker\" is a category error; one pours He II.\n\n### 5. The two-fluid model: Tisza's framework, Landau's spectrum\n\nSection 3 established the priority; the audit point here is that the modern usage \"Landau's two-fluid model\" silently fuses two distinct contributions. Tisza (1938) gave the *kinematic decomposition* into two interpenetrating fluids and predicted thermomechanical effects and second sound [4]. Landau (1941) supplied (i) the phonon–roton excitation spectrum, (ii) the derivation of two-fluid hydrodynamics from a Galilean-invariant gas of excitations, (iii) the correct expression $\\rho_n(T) = -(1/3)\\int (\\partial f/\\partial \\varepsilon) p^{2}\\,d^{3}p/(2\\pi\\hbar)^{3}$ for the normal density [9, 12]. What was *superseded* in Landau's account was his rejection of the BEC origin: Penrose and Onsager restored it via ODLRO [8].\n\n### 6. Other conflations briefly disentangled\n\n- **\"Superfluid fraction\" vs. \"condensate fraction.\"** Distinct quantities; equal only in the ideal noninteracting weakly perturbed limit. ⁴He: $\\rho_s/\\rho \\to 1$, $n_0/n \\to 0.07$. Conflating them mis-states a factor of 14.\n\n- **\"Vortex\" in ⁴He vs. ³He-A.** ⁴He vortices are $U(1)$ defects with quantized circulation $\\kappa = h/m_4$. ³He-A admits half-quantum vortices, $\\pi$-disclinations of the $\\hat{\\mathbf{l}}$-vector, and continuous (Mermin–Ho) textures because $\\pi_1$ of the order-parameter manifold is nontrivial in a different way [16, 21]. The word \"vortex\" hides a topological multiplicity.\n\n- **\"Superfluid density\" outside helium.** In neutron-star pairing, \"superfluid density\" usually means the BCS pair condensate $\\langle\\psi_\\uparrow\\psi_\\downarrow\\rangle$; in spin superfluidity [29, 30, 31], it means the magnon-condensate stiffness $\\rho_M$; in dark-matter analogues [32], it means the soliton-supporting condensate of an ultralight scalar. Each invocation needs its own current–current response definition; importing the ⁴He intuition wholesale is the most common error.\n\n- **\"BEC–BCS crossover\" as a single phase.** It is a *crossover*, not a transition: the order parameter $\\langle\\psi_\\uparrow\\psi_\\downarrow\\rangle$ is nonzero throughout, and only its internal structure (Cooper pair vs. tightly-bound molecule) changes as $1/k_F a_s$ runs from $-\\infty$ to $+\\infty$. The literature occasionally treats the unitary point as a phase boundary; it is not.\n\nThe surviving core, then, is small and durable: ODLRO (or its quasi-long-range 2D analogue) plus a nonzero helicity modulus is what *defines* a superfluid; everything else — Landau's spectrum, GPE, two-fluid hydrodynamics, the BCS-pairing extensions — is the regime-specific machinery built on top."}, {"id": "frontier-and-open-problems", "title": "Current Frontier: BEC–BCS Crossover, Spin Superfluidity, Neutron Stars, and Dark-Matter Analogues", "markdown": "## Current Frontier: BEC–BCS Crossover, Spin Superfluidity, Neutron Stars, and Dark-Matter Analogues\n\nBy 2026 \"superfluidity\" has expanded from a property of one liquid below 2.17 K to a label attached to systems whose densities span many orders of magnitude and whose constituents range from neutral atoms to nucleons to hypothetical dark-sector relics. Each generalization carries its own operative definition of $\\rho_s$, and the literature is not always careful to specify which one is being measured.\n\n### 1. The unitary Fermi gas and the BEC–BCS crossover\n\nThe cleanest modern laboratory for superfluidity is a two-component balanced gas of $^{6}$Li or $^{40}$K tuned through a Feshbach resonance. As the s-wave scattering length $a$ moves from $a\\to 0^-$ (weak BCS) through $|a|\\to\\infty$ (unitarity) to $a\\to 0^+$ (deeply bound dimer BEC), one interpolates continuously between Cooper pairs of size $\\xi_{\\text{pair}}\\gg k_F^{-1}$ and tight bosonic molecules forming a BEC. The crossover was anticipated by Eagles (1969) and Leggett (1980)(verify) and made concrete by Nozières and Schmitt-Rink (1985)(verify); experimental confirmation followed in 2003–2005 (JILA, MIT, ENS, Innsbruck).\n\nAt unitarity all microscopic scales drop out and the only dimensionless parameters are $T/T_F$ and the polarization. The ground-state energy is parametrized by the Bertsch parameter $\\xi = E/(3/5)E_F \\approx 0.376$, known to better than a percent from QMC and from MIT measurements (Ku et al.); the superfluid transition sits at $T_c/T_F\\approx 0.167$.\n\nThe operative $\\rho_s$ here is supplied by two complementary procedures:\n\n1. The **helicity modulus** $\\Upsilon = (\\partial^2 F/\\partial\\phi^2)\\mid_{\\phi=0}$ obtained by twisting the condensate phase across a box — the natural lattice-Monte-Carlo definition.\n2. The **two-fluid Landau definition** read off the second-sound velocity, $c_2^2 = (T s^2/c_v)\\,(\\rho_s/\\rho_n)$, as in Sidorenkov et al. and the box-trap measurements of the Innsbruck and ENS groups.\n\nThe two definitions agree at the percent level when both are accessible. A recent direct route, [arXiv 2508.15626](http://arxiv.org/abs/2508.15626v2) [33], reads off the energy dissipation of a driven superfluid via the harmonic-potential theorem and bypasses the two-fluid decomposition entirely.\n\nOpen questions: the existence and extent of a **pseudogap** above $T_c$ remains contested (rf-spectroscopy, Bragg, and contact-based diagnostics still disagree). Spin- and mass-imbalanced gases probe Fulde–Ferrell–Larkin–Ovchinnikov modulations and the **breached-pair / Sarma** phases reviewed by Liu [34]; a clean FFLO image has still not been published. p-wave and strongly dipolar Fermi superfluids (erbium, dysprosium) are now within reach, but certifying the order-parameter symmetry is harder than in the s-wave case [35, 36].\n\n### 2. Spin superfluidity and magnon BEC\n\nA magnet can sustain a coherent superflow of magnetization if its order parameter has a $U(1)$ rotational symmetry about the field axis. The first demonstration was in $^{3}$He-B at the Kapitza Institute (Borovik-Romanov, Bunkov, Dmitriev, Fomin 1984)(verify): the **homogeneously precessing domain (HPD)**, a region in which the transverse magnetization precesses with a single phase across centimeters of fluid, sustaining a dissipationless spin current $j_s = \\rho_s^{\\text{(spin)}}\\nabla\\varphi$ with $\\varphi$ the phase of $M_\\perp$. Bunkov and Volovik [31] reframed the HPD as a magnon BEC, and Sonin's 2022 review [29] supplies the modern operative definition: a spin superfluid is a state in which the **spin-current rigidity** $\\rho_s^{\\text{(spin)}}$ is nonzero, supports persistent currents below a Landau-type critical gradient $|\\nabla\\varphi|_c$, and exhibits Josephson-like phase slippage at vortices of $M_\\perp$.\n\nThe extension to magnetic insulators — most prominently yttrium iron garnet at room temperature — is more contentious. Bozhko et al. (2016)(verify) and follow-ups report long-range spin transport that some authors call superfluidity and others, more cautiously, coherent magnon transport; the genuine question is whether the observed signal reflects a true $\\rho_s^{\\text{(spin)}}\\neq 0$ below a BKT-like transition or merely long-lived spin waves with finite intrinsic damping. Armaitis \u0026 Duine [30] catalogue the same distinction in spinor Bose gases, where mass and spin superfluidity coexist with independent critical velocities.\n\n### 3. Neutron-star pairing and pulsar glitches\n\nThat nucleons inside a neutron star should pair into BCS condensates was conjectured by Migdal in 1959(verify), before pulsars existed as a category. The standard picture recognizes at least three components: a singlet $^{1}S_0$ neutron condensate in the inner crust, a triplet $^{3}P_2$ neutron condensate in the outer core, and a singlet $^{1}S_0$ proton **superconductor** coexisting with it. The gap magnitudes are uncertain at the factor-of-several level; three-nucleon forces matter quantitatively, and Papakonstantinou \u0026 Clark [37] estimate that they reduce the $^{1}S_0$ neutron gap at $\\rho\\sim 0.5\\rho_0$ but leave the $^{3}P_2$ gap qualitatively intact.\n\nThe operative $\\rho_s$ is a hydrodynamic stiffness in the **Andreev–Bashkin** sense, with an entrainment matrix $\\rho_{np}$ mixing neutron and proton mass currents. Pulsar glitches — sudden spin-ups of Vela and Crab — were interpreted by Anderson \u0026 Itoh (1975)(verify) as catastrophic unpinning of quantized vortices from the inner-crust lattice. Modern analyses (Andersson, Chamel, Haskell) require the entrainment coefficient to be larger than the bare value, because dripped neutrons Bragg-scatter off the crustal lattice; whether Vela glitches tap the inner crust alone or also the core reservoir is still unsettled. Transport of superfluid phonons and its role in cooling (Cassiopeia A is the often-cited case) is reviewed by Manuel \u0026 Tolos [38]; the I–Love–Q quasi-universal relations extend to superfluid stars and acquire new branches [39]; exotic possibilities such as a kaon-condensed superfluid in the early universe are explored in [40].\n\n### 4. Exciton-polariton condensates\n\nMicrocavity exciton-polaritons are driven-dissipative bosons with effective mass $m^* \\sim 10^{-4}\\,m_e$, permitting condensation at tens of kelvin. Kasprzak et al. [41] reported the first unambiguous polariton condensate. The operative $\\rho_s$ is the long-wavelength response to a moving disorder: Amo and co-workers observed superflow past defects without scattering at small velocities, and the Bogoliubov spectrum has been mapped. But the system is intrinsically out of equilibrium — pumped by lasers, drained through mirrors — so the equilibrium identification of $\\rho_s$ with helicity modulus and inverse compressibility fails. The natural framework is **model F** of Hohenberg–Halperin [26] generalized to a non-equilibrium steady state, and in 2D the resulting transition is the KPZ-modified BKT identified by Altman, Sieberer, and Diehl(verify). Whether to call this state a \"true\" superfluid is partly a matter of definition; it is not the equilibrium one.\n\n### 5. Dark-matter superfluid analogues\n\nBerezhiani and Khoury [32] reframe the cold-dark-matter halo as a self-interacting Bose condensate of sub-eV bosons. Inside a galaxy, the de Broglie wavelength exceeds the inter-particle spacing, a coherent ground state forms, and **phonon excitations** of the condensate mediate an effective long-range force on baryons that reproduces the empirical MOND scaling at galactic scales while leaving cluster and cosmological scales CDM-like. The operative $\\rho_s$ is the Landau two-fluid one inherited from the Madelung representation of a Gross–Pitaevskii field.\n\nThe model lives or dies on quantitative tests: the Tully–Fisher relation, Bullet-Cluster offsets, Lyman-$\\alpha$ flux power, and ultra-faint dwarf kinematics. As of 2026 it is neither confirmed nor excluded. The sharpest theoretical issues are the thermodynamic stability of the condensate during halo mergers (in which the relative velocity exceeds the Landau critical velocity and the superfluid component should be destroyed locally) and the absence of a UV completion that yields the required $\\phi^6$ self-interaction without fine-tuning.\n\nAcross all five frontiers a common pattern is visible: the symbol $\\rho_s$ is read off five different correlation functions — helicity modulus, second-sound velocity, Andreev–Bashkin entrainment, polariton phase-twist response, Madelung stiffness — and only Leggett's theorem, together with explicit Galilean (or its analogue) invariance, guarantees that they coincide when they coincide. Outside that protected class, \"$\\rho_s$\" is a name for whichever rigidity the experimenter has actually measured; conflating them is the modern descendant of the Tisza–Landau confusion catalogued in §7."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nSeventy years after Penrose \u0026 Onsager and eighty-eight after the Allen–Misener–Kapitza triple, the field has the unusual luxury of a mature theoretical core surrounded by genuinely open territory. I will not pretend the balance is even.\n\n### (a) What I will defend with my reputation\n\nThe two-fluid hydrodynamics of $^4$He II, written as a Galilean-invariant excitation gas riding on a complex scalar order parameter $\\Psi = \\sqrt{\\rho_s}\\,e^{i\\varphi}$ with $\\mathbf{v}_s = (\\hbar/m)\\nabla\\varphi$, is correct and complete as a low-energy effective theory. Second sound, fourth sound, the Andronikashvili stack, the Hess–Fairbank persistent current, and the quantization $\\oint \\mathbf{v}_s\\cdot d\\boldsymbol{\\ell} = nh/m$ are all derivable consequences and have been measured to absurd precision. ODLRO (Penrose–Onsager 1956; Yang 1962) is the right *definition* of the order, and Leggett's separation of the condensate fraction $n_0$ from the superfluid fraction $\\rho_s/\\rho$ is not negotiable — the $\\sim 7\\%$ condensate / $100\\%$ superfluid disparity at $T=0$ in $^4$He is the cleanest empirical refutation of the BEC$=$superfluidity equation. For $^3$He, the Anderson–Brinkman–Morel A-phase and the Balian–Werthamer B-phase identifications survive every NMR, transverse-sound, and surface-Andreev-bound-state test thrown at them. I would stake a career on all of the above.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely smuggled past the reader:\n\n1. **The roton as a well-defined elementary excitation at finite $T$.** Landau's $\\epsilon(p)$ is a $T=0$ single-mode-approximation construct; above $\\sim 1.3\\,$K the roton width becomes comparable to its gap and the \"spectrum\" is a peak in $S(q,\\omega)$, not a quasiparticle. Textbooks plot a sharp curve up to $T_\\lambda$. That curve is a fiction above $\\sim 1.7\\,$K.\n2. **Critical-velocity universality.** The literature still cites $v_L \\approx 60\\,$m/s as \"the\" critical velocity. In bulk flow one observes $10^{-2}$–$10^0\\,$m/s, set by extrinsic vortex nucleation at surface asperities. The Iordanskii–Langer–Fisher thermal-activation picture is incomplete — quantum nucleation rates remain poorly constrained outside ion-mobility geometries.\n3. **The \"superfluid\" label in dark-matter and polariton contexts.** Helicity modulus, off-diagonal long-range order, two-fluid stiffness, and Landau-criterion stability are *distinct* probes that coincide in $^4$He and need not coincide elsewhere. Claims of \"superfluid dark matter\" that invoke only a coherent phase without a measurable rigidity-to-boundary-motion are using the word ornamentally.\n\n### (c) Three open questions I would actually work on\n\n1. **The $^3$He B-phase surface Majorana spectrum under controlled disorder** — the cleanest topological-superfluid laboratory we possess, and the gap between Volovik's predictions and Maissoneuve/Mizushima-era transverse-acoustic data is still ~30%.\n2. **Quantum vortex nucleation rates in sub-100-nm channels at $T \\lesssim 100\\,$mK** — would finally separate intrinsic Landau breakdown from extrinsic Iordanskii nucleation.\n3. **Spin-supercurrent dissipation in magnon BECs (Bunkov–Volovik HPD)** — the only superfluid where the conserved charge is not particle number, and the analogue of $\\rho_s$ is still operationally ambiguous.\n\n### Reading path\n\n1. F. London, *Nature* **141**, 643 (1938) — the two-page paper that connects $T_\\lambda$ to BEC and that Landau spent a decade rejecting. Read it first to see how thin the original argument actually was.\n2. L. Tisza, *Nature* **141**, 913 (1938) and *J. Phys. Radium* **1**, 165 (1940) — the real birth certificate of two-fluid hydrodynamics; restores the credit Soviet texts erased.\n3. L. D. Landau, *J. Phys. USSR* **5**, 71 (1941) — the phonon–roton spectrum, second sound, and the critical-velocity argument; note where the BEC connection is explicitly denied.\n4. O. Penrose and L. Onsager, *Phys. Rev.* **104**, 576 (1956) — ODLRO, and the quiet reconciliation of London and Landau three years before Yang made it general.\n5. A. J. Leggett, *Rev. Mod. Phys.* **47**, 331 (1975) — the canonical derivation of the $^3$He order parameter and, more importantly, the cleanest extant discussion of what \"superfluid density\" actually means across systems. If you read only one modern paper, read this one."}], "references": [{"n": 1, "title": "Flow of liquid helium II", "authors": ["J. F. Allen", "A. D. Misener"], "year": 1938, "venue": "Nature", "url": "https://doi.org/10.1038/141075a0", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Viscosity of liquid helium below the λ-point", "authors": ["P. Kapitza"], "year": 1938, "venue": "Nature", "url": "https://doi.org/10.1038/141074a0", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "New phenomena connected with heat flow in helium II", "authors": ["J. F. Allen", "H. Jones"], "year": 1938, "venue": "Nature", "url": "https://doi.org/10.1038/141243a0", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "The λ-transition of liquid helium", "authors": ["L. Tisza"], "year": 1938, "venue": "Nature", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "The λ-phenomenon of liquid helium and the Bose-Einstein degeneracy", "authors": ["F. London"], "year": 1938, "venue": "Nature", "url": "https://doi.org/10.1038/141643a0", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Heat Transfer and Superfluidity of Helium II", "authors": ["P. L. Kapitza"], "year": 1941, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.60.354", "cited_by": 292, "bucket": "earliest"}, {"n": 7, "title": "He <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
