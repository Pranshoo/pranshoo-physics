<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "Superfluidity: A Credit-Audited Monograph on the Quantum Liquid", "alternativeHeadline": "superfluidity", "name": "superfluidity", "description": "From the Leiden λ-anomaly to spin-triplet condensates and dark-matter analogues", "inLanguage": "en", "keywords": ["superfluidity", "Helium II behavior", "frictionless flow", "λ-phase of ⁴He", "quantum hydrodynamics (in early Soviet usage)", "superfluid phase of ³He (A, B, A₁ phases)"], "about": [{"@type": "Thing", "name": "superfluidity"}, {"@type": "Thing", "name": "Helium II behavior"}, {"@type": "Thing", "name": "frictionless flow"}, {"@type": "Thing", "name": "λ-phase of ⁴He"}, {"@type": "Thing", "name": "quantum hydrodynamics (in early Soviet usage)"}, {"@type": "Thing", "name": "superfluid phase of ³He (A, B, A₁ phases)"}], "articleSection": "DEEP DIVE", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/superfluidity-a-credit-audited-monograph-on-the-quantum-liqu.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/superfluidity-a-credit-audited-monograph-on-the-quantum-liqu.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins, Priority, and the Forgotten Pioneers (1908–1938) Origins, Priority, and the Forgotten Pioneers (1908–1938) The discovery of superfluidity is the textbook case in which a clean Nobel narrative — \"Kapitza, 1938\" — obscures a thirty-year chain of observation in which at least eight names belong, two of which (A. P. Keesom; A. D. Misener) the canonical record has effectively erased, and one of which (J. F. Allen) was deliberately omitted from the 1978 prize. 1908: Leiden, and an anomaly nobody could see On 10 July 1908 Heike Kamerlingh Onnes liquefied ⁴He for the first time, reaching ≈ 4.2 K and, by pumping on the vapor, ≈ 1.7 K within days. Onnes recorded that the liquid's meniscus vanished and that pumped helium became \"remarkably quiet\" near 2.2 K — observations buried in the Communications from the Physical Laboratory at Leiden and Onnes's notebooks. He attributed the quieting to \"a maximum of density\" (which is correct, but secondary) and did not pursue a phase transition. The 1908 paper is therefore the first observational document of the λ-anomaly, but not its identification: superfluidity was hiding in plain sight in Onnes's own data for two decades. 1927–1936: The Keesoms and the λ-point The identification belongs to Willem Hendrik Keesom and Mieczysław Wolfke, who in 1927–1928 mapped the dielectric constant and density of liquid helium across 2.17 K and concluded that two distinct phases — which they christened helium I and helium II — meet at a singular temperature (Comm. Leiden 190b; Proc. KNAW 31). In 1932 Keesom and Klaus Clusius measured a specific-heat curve whose shape resembled the Greek λ — the λ-point was named. From 1935 onward the Leiden experiments were carried out by W. H. Keesom together with his daughter, Anna Petronella (\"Mies\") Keesom , who co-authored the decisive papers on the heat capacity (Physica 2, 557, 1935) and the anomalous heat transport (Physica 3, 359, 1936). The 1936 paper reported a thermal conductivity in He II so large that it could not be fit by any ordinary diffusive ansatz — the first quantitative hint that transport in He II was non-Fourier. Textbooks routinely cite \"Keesom (1936)\" and drop the second author; van Delft's archival reconstruction ( Freezing Physics , KNAW 2007) restores her authorship and the lab notebooks that show her at the cryostat. 1936: Rollin's creeping film Bernard V. Rollin, working with Franz Simon's group in Oxford, reported in 1936 that liquid helium below the λ-point climbs the walls of its container and drains across thermal links: the Rollin film . The result appeared in Physica 2, 557 and in the proceedings of the 7th International Congress of Refrigeration (The Hague, 1936) — a venue obscure enough that the discovery was later misattributed in English-language reviews to Daunt and Mendelssohn (1939), who in fact only characterized the film's velocity. Rollin had no theoretical framework for the film, and the result drifted, uncited, for two years before the 1938 papers made it inescapable. January 1938: Two letters to Nature , posted from opposite poles The 8 January 1938 issue of Nature carried two back-to-back letters [1, 2]. Kapitza, working in Moscow with the Mond magnet he had brought from Cambridge, measured the flow of He II through a 0.5 µm gap between optical flats and found a viscosity ≲ 10⁻⁹ Pa·s — at least 1500× below He I. He coined the noun: \"By analogy with superconductors … helium below the λ-point enters a special state which might be called a superfluid .\" J. F. Allen and A. D. Misener, in Cambridge's Mond Laboratory (which Kapitza had run until 1934), pushed He II through capillaries of 0.05–0.5 mm and demonstrated that the apparent viscosity fell with decreasing channel width — a result no Newtonian fluid can produce, and a far stronger logical demonstration of frictionless flow than Kapitza's single-geometry measurement. The two papers were received by Nature within eight days of each other, and the editors set them in sequence with a joint editorial note acknowledging their independence. The fountain effect, and the asymmetry of the 1978 Nobel Six weeks later Allen, now with Harry Jones, reported the thermomechanical (fountain) effect : an applied heat pulse to a porous plug drives a jet of helium upward, the unmistakable signature of a counter-flow between two thermodynamically distinct components . This is the experimental phenomenon Tisza's two-fluid model was constructed to explain (Nature 141, 913 ); without it, neither London's BEC identification nor Tisza's hydrodynamics would have had a target. By any honest weighting of the evidence, the 1938 discovery was a three-laboratory, four-author achievement — Kapitza, Allen, Misener, Jones — with Allen contributing more independent phenomenology than anyone else. The 1978 Nobel Prize in Physics named Kapitza alone \"for his basic inventions and discoveries in the area of low-temperature physics.\" Allen was alive, at St Andrews, and active in the field. Misener, by then in Canada and never having returned to low-temperature work, was not considered. Sébastien Balibar has reconstructed the priority dispute in detail (J. Low Temp. Phys. 146, 441, 2007; C. R. Physique 18, 586, 2017) and concluded that the Stockholm decision was political: a half-prize for the discovery would have required pairing Kapitza with a non-Soviet co-laureate at the height of the Brezhnev era, and the citation was instead worded broadly enough (\"basic inventions and discoveries\") to elide the issue. The asymmetry is sharper still when one notes that Kapitza's 1941 paper cites Allen and Misener once and Allen and Jones twice, without dispute. What was actually known on the eve of theory By summer 1938 the experimental ledger read: a second-order-like transition at 2.17 K (Keesom \u0026 Wolfke 1927; Keesom \u0026 Clusius 1932), a λ-shaped specific heat (W. H. \u0026 A. P. Keesom 1935), an anomalous thermal conductivity that broke Fourier's law (W. H. \u0026 A. P. Keesom 1936), film creep over macroscopic barriers (Rollin 1936), vanishing viscosity in narrow gaps and a width-dependent apparent viscosity in capillaries (Kapitza; Allen \u0026 Misener, 1938), and a thermomechanical effect coupling heat flux to mass flux (Allen \u0026 Jones, 1938). Darrow's 1940 review was the first attempt to organize this catalogue in English, and it is striking that even at that late date the cause of any of these effects was, in print, entirely open — London's BEC identification and Tisza's two-fluid response had appeared but were not yet accepted. The credit ledger, then, is unambiguous on the experimental side and badly distorted in its public memory: Onnes saw the anomaly without identifying it; the Keesoms (father and daughter) and Wolfke named the phase and mapped its thermodynamics; Rollin found the film; Kapitza, Allen, Misener, and Jones — independently, in two laboratories, within a single calendar quarter — established the frictionless flow and the thermomechanical effect that together demanded a new physics. Section 2 takes up that physics, and the parallel erasure of London and Tisza. London, Tisza, and the Bose–Einstein Bridge: A Theory Erased and Restored London, Tisza, and the Bose–Einstein Bridge: A Theory Erased and Restored 1. The conceptual vacuum of spring 1938 By March 1938 the experimental situation was unambiguous and theoretically inert. Kapitza in Moscow and Allen \u0026 Misener in Cambridge had reported, in back-to-back Nature communications, a viscosity in He II below T \\lambda \\simeq 2.17\\,\\mathrm{K} that was either immeasurably small or unmeasurable in principle [1, 2]; Allen \u0026 Jones had added the fountain (thermomechanical) effect a few weeks later . Keesom's λ-anomaly in the specific heat had been on the books for a decade, and Rollin's creeping film flow for two years. There was no theory. The word \"superfluidity,\" coined by Kapitza in analogy with superconductivity, named a phenomenon rather than explained it. What was missing was a mechanism — a reason why a liquid, with a density of 0.145\\,\\mathrm{g\\,cm^{-3}} and a mean interparticle spacing of \\sim 3.6\\,\\text{Å}, comparable to the hard-core diameter, should behave as if a macroscopic fraction of its atoms had ceased to scatter. Two papers in Nature later that year, by Fritz London and László Tisza, supplied it. The papers were short, almost programmatic, and were promptly attacked by the most influential theorist of the next half-century. The full restoration of their picture required the off-diagonal long-range order (ODLRO) of Penrose and Onsager, eighteen years later . 2. London's bridge: the λ-transition as an interacting BEC London's contribution was to look at the Einstein 1925 condensation of an ideal Bose gas and recognise its numerology. For an ideal gas of ^4He atoms at the liquid density, the condensation temperature evaluates to \\simeq 3.13\\,\\mathrm{K}, within a factor close to T \\lambda = 2.17\\,\\mathrm{K}. No other low-temperature phenomenon — not the Debye model, not the rotational anomalies of \\mathrm{H} 2, not any of Kapitza's energy scales — produced a transition at the right place from first principles. London's claim was therefore double: (i) the λ-transition is the residue of Bose–Einstein statistics surviving in a strongly interacting liquid; (ii) the discrepancy between T {\\mathrm{BEC}} and T \\lambda is the work of interactions, which reduce the condensate fraction without destroying its existence. The second claim was unfalsifiable in 1938 and would remain so until ODLRO formalised the meaning of \"Bose condensation in a liquid\". The first was a leap: Einstein's 1925 argument required noninteracting bosons, and the consensus view, articulated most forcefully by Uhlenbeck in his 1927 thesis and softened only in 1937, was that the BEC singularity was an artefact of the ideal-gas limit. London's Nature note and his slightly longer Physical Review paper of the same year amounted to the assertion that the singularity is robust — a position vindicated only by Penrose and Onsager and, in full mathematical generality, by Lieb, Seiringer and Yngvason sixty years later. A subtlety routinely lost: London did not claim that the superfluid component is the condensate. He claimed that the λ-transition is a BEC. The identification of \\rho s with n 0 is a folk reading that survives in undergraduate texts and is wrong: in ^4He at T\\to 0 the condensate fraction is n 0/n \\simeq 0.07 from neutron scattering, while the superfluid fraction is \\rho s/\\rho \\to 1. 3. Tisza's two-fluid hydrodynamics Tisza, then in Paris and in close correspondence with London, drew the operational consequence. If a macroscopic fraction of the atoms occupies a single quantum state, that fraction cannot carry entropy; it constitutes a component with s = 0, \\eta = 0, locally irrotational. The rest of the fluid carries the entropy and the viscosity. The fluid obeys two coupled Euler equations, with \\rho = \\rho n + \\rho s and a temperature-dependent condensate fraction governing the partition. The thermomechanical (fountain) effect, the persistence of flow through narrow capillaries, and — as Tisza explicitly predicted — a second propagating mode in which \\rho s and \\rho n oscillate in counterphase at constant total density (later named second sound), all follow . The full hydrodynamic derivation appeared in Tisza's C. R. Acad. Sci. Paris notes (207, 1035 and 1186, 1938) and in J. Phys. Radium 1, 165 and 350 (1940). It is worth stating plainly what Tisza had and what he did not. He had a phenomenological two-fluid model, a microscopic interpretation (BEC à la London), correct predictions for the thermomechanical effects, and a qualitative prediction of second sound. He did not have an excitation spectrum, a derivation of \\rho s(T) from microscopic dynamics, or a Galilean-invariant formulation of the normal component's stress tensor. 4. Landau's 1941 polemic Landau's Theory of the Superfluidity of Helium II is one of the most consequential papers in twentieth-century condensed-matter physics and one of the most polemical. Its physics is the construction of the normal component as a gas of low-lying excitations of the ground state — phonons at small \\mathbf{p} , \"rotons\" at a minimum \\Delta/k B \\sim 9\\,\\mathrm{K} near p 0/\\hbar \\sim 2\\,\\text{Å}^{-1} — and the derivation of the critical velocity from a Galilean boost of the excitation gas. From it follow two-fluid hydrodynamics, second sound, and the temperature dependence of \\rho n(T) = -\\tfrac{1}{3}\\int (\\partial f/\\partial \\varepsilon)\\,p^2\\,d^3p/(2\\pi\\hbar)^3. None of this requires Bose statistics; the spectrum is treated as a property of the interacting many-body ground state. Landau then attacked. He dismissed London's identification of the λ-transition with BEC as \"irrelevant\"; he wrote that Tisza's two-fluid model contained \"a number of contradictions\" — the principal one being Tisza's assumption that the normal fluid is composed of atoms outside the condensate (so \\rho n \\to 0 at T \\to 0 would require all atoms to condense, contradicting the strong interaction) rather than of excitations of the ground state. On this point Landau was right and Tisza was wrong: a sharper distinction between particles and excitations was needed, and Landau supplied it. On the question of whether the λ-transition is a Bose condensation, Landau was wrong; he insisted that the existence of a phonon–roton spectrum was logically independent of, and incompatible with, the BEC origin. The rhetorical effect was disproportionate to the technical correction. In Soviet textbooks — Landau \u0026 Lifshitz, Statistical Physics, Part 2 in particular — London is mentioned only to be rebutted, and Tisza is reduced to a footnote. Khalatnikov's 1965 monograph Introduction to the Theory of Superfluidity , the standard Soviet text, preserves the polemic verbatim. The same generation of Soviet students learned two-fluid hydrodynamics as \"Landau's theory\" with no antecedent. 5. Penrose, Onsager, and the restoration through ODLRO The restoration came in 1956. Penrose and Onsager defined the order parameter of Bose condensation in an interacting liquid as the largest eigenvalue n 0 of the one-body density matrix with \\phi a macroscopic wave function and n 0/N remaining finite in the thermodynamic limit. This is off-diagonal long-range order: the persistence of phase coherence over arbitrary separations, even when the diagonal density correlations are short-ranged and liquid-like. Their estimate, from a hard-sphere variational calculation, was n 0/N \\simeq 0.08 at T = 0, in striking agreement with later neutron-scattering measurements (\\sim 0.07, Glyde and Stirling, 1990s). ODLRO did three things at once. It supplied a definition of \"BEC in an interacting liquid\" that did not depend on the existence of a single-particle eigenbasis. It made London's intuition precise: He II is a Bose condensate, with the order parameter \\phi(\\mathbf{r}) playing the role of the macroscopic wave function whose phase gradient is the superfluid velocity, \\mathbf{v} s = (\\hbar/m)\\nabla\\arg\\phi. And it dissolved Landau's objection by exhibiting BEC and a phonon–roton spectrum as compatible — the excitations are Bogoliubov-like quasiparticles of the condensate, not an alternative to it. Bogoliubov's 1947 transformation, which Landau also under-cited, had already shown the same thing in the dilute limit. By the early 1960s, with Vinen's direct observation of quantised circulation \\kappa = h/m confirming the macroscopic phase, the London–Tisza picture was the consensus picture. Feynman's 1957 review in Rev. Mod. Phys. — written from outside the Soviet polemic — is the document in which the synthesis becomes textbook: London supplied the order parameter, Tisza the hydrodynamics, Landau the excitation spectrum and the microscopic justification of two-fluid kinematics, Bogoliubov the dilute-gas microscopics, Penrose–Onsager the rigorous order parameter. Each piece is necessary; none is sufficient. 6. The credit ledger - Bose-Einstein origin of the λ-transition : London, 1938 . Disputed by Landau 1941 ; vindicated by Penrose–Onsager 1956 . - Two-fluid hydrodynamics : Tisza, 1938 , from London's BEC. Reformulated and microscopically justified by Landau, 1941 . The phrase \"Landau's two-fluid model\" is historically incorrect; \"Tisza–Landau two-fluid model\" is the honest attribution and is the form used by Khalatnikov's later editions, by Pitaevskii and Stringari, and by Balibar in his historical reviews. - Excitation spectrum (phonon–roton) : Landau 1941 , refined Landau 1947 (roton minimum at \\Delta/k B \\simeq 8.6\\,\\mathrm{K}) and Landau 1949 . Tisza's 1949 reply conceded the spectrum and defended the BEC origin; Landau's 1949 paper conceded nothing. - Microscopic dilute-gas theory : Bogoliubov 1947 — absent from this corpus and routinely under-cited in Western texts that jump from Landau to Gross–Pitaevskii. - Order parameter as ODLRO : Penrose \u0026 Onsager 1956 . The conceptual closure. The lesson is not that Landau was wrong about helium — he was right about almost everything except its statistical origin — but that a single forceful polemic from a single dominant figure can suppress a correct theoretical identification for nearly two decades, in a discipline that prides itself on falsifiability. London died in 1954, two years before ODLRO; Tisza outlived the controversy by half a century and used the late editions of his own writings (notably Physics Today 52(10), 26, 1999) to set the record straight. The Physics Itself: Two-Fluid Hydrodynamics, the Phonon–Roton Spectrum, and ODLRO The Physics Itself: Two-Fluid Hydrodynamics, the Phonon–Roton Spectrum, and ODLRO 1. The two-fluid construction The working theory of ^4He II is a hybrid: a hydrodynamic skeleton (Tisza 1938, refined by Landau 1941) wrapped around a microscopic excitation spectrum (Landau 1941, ; Bogoliubov 1947). The hydrodynamic ansatz partitions the mass density into two co-existing, interpenetrating components, each carrying its own velocity field \\mathbf{v} n, \\mathbf{v} s. Mass current and momentum density are The superfluid is constrained to be irrotational and isentropic; the normal fluid carries all the entropy s and viscosity \\eta: Conservation of mass, entropy, and momentum, combined with the Josephson–Anderson relation closes the system. The chemical-potential gradient drives the superfluid; a temperature gradient acts as an effective force on the superfluid through -s\\,\\nabla T, which is the microscopic origin of the fountain (thermomechanical) effect first seen by Allen \u0026 Jones . The viscous, dissipative normal component obeys a Navier–Stokes-like equation; the superfluid does not. The decomposition is not a literal mixture of two species of helium atoms — it is a kinematic reorganization of the single quantum liquid into a condensate-like coherent flow and a thermal gas of elementary excitations [9, 12, 13]. 2. The phonon–roton spectrum and Landau's critical velocity Landau's central move was to treat the normal fluid as a non-interacting gas of quasiparticles with a phenomenological dispersion \\varepsilon(p) exhibiting two branches: a linear (phonon) part at small p with slope c equal to the first-sound velocity, and a local minimum (the roton) at p 0/\\hbar \\sim 2\\,\\text{Å}^{-1} with a gap \\Delta, A Galilean boost of the excitation gas with velocity -\\mathbf{v} s shows that a single quasiparticle can be created by a wall moving at velocity \\mathbf{v} only if \\varepsilon(p) - \\mathbf{p}\\!\\cdot\\!\\mathbf{v} \u003c 0 for some p. The minimal \\mathbf v that satisfies this is the Landau critical velocity, For ^4He the minimum sits at the roton, giving v c^{\\text{Landau}}\\!\\approx\\! 60 m s^{-1} — a number reached only in ion-propagation experiments and very narrow channels. In bulk flow the critical velocity is set instead by vortex nucleation and is one to three orders of magnitude smaller (Feynman , Vinen ); this is the first of several conflations the literature still tolerates. Figure: Landau's phenomenological dispersion for ^4He II. The linear phonon branch (slope c, first-sound velocity) joins the maxon and the roton minimum at (p 0,\\Delta). The construction v c = \\min p \\varepsilon(p)/p is the tangent from the origin grazing the roton minimum — the orange dashed line. Bulk superflow breaks down well below this value because vortex nucleation, not single-excitation creation, sets the actual threshold. 3. Microscopic underpinning: Bogoliubov and Gross–Pitaevskii For the dilute interacting Bose gas Bogoliubov (1947) diagonalized by replacing a 0,a 0^{\\dagger}\\to\\sqrt{N 0} (the c-number condensate) and keeping quadratic terms in the \\mathbf k\\neq 0 operators. The canonical u–v transformation gives the spectrum In the long-wavelength limit \\varepsilon(\\mathbf k)\\to\\hbar c k with c=\\sqrt{nU/m} — a phonon branch with c playing the role of Landau's first sound. Above k\\sim mc/\\hbar the spectrum crosses over to the free-particle parabola plus a mean-field shift. The Bogoliubov spectrum has no roton minimum: that feature is non-perturbative, requiring strong correlations of the dense liquid, and was reproduced microscopically only by Feynman's variational ansatz \\Psi k = \\rho {\\mathbf k}^{\\dagger} 0\\rangle giving \\varepsilon F(k) = \\hbar^2 k^2 / 2m S(k), later improved by Feynman–Cohen backflow . The hydrodynamic limit of the same condensate physics is the Gross–Pitaevskii equation (Gross 1961; Pitaevskii 1961), with \\psi ^2=n, \\mathbf v s = (\\hbar/m)\\nabla\\arg\\psi. The Madelung decomposition \\psi=\\sqrt{n}\\,e^{i\\varphi} immediately yields irrotational superflow, the quantization of circulation \\oint \\mathbf v s\\!\\cdot\\!d\\boldsymbol\\ell = (h/m)\\,n v (Onsager 1949; Feynman 1955 ), and reproduces the Bogoliubov spectrum by linearization around a uniform background. GPE is exact for the dilute condensate at T=0 and now underlies the quantitative theory of trapped atomic BECs . 4. ODLRO: the order parameter of an interacting Bose liquid London (1938) argued that the \\lambda-transition was BEC dressed by interactions, but for an interacting liquid \"macroscopic occupation of \\mathbf k\\!=\\!0\" is ambiguous — particles are not momentum eigenstates. Penrose \u0026 Onsager (1956) supplied the operationally clean criterion. The one-body density matrix exhibits off-diagonal long-range order (ODLRO) if The non-vanishing limit defines the condensate density n 0, and its phase is the macroscopic phase \\varphi of the order parameter \\Psi(\\mathbf r) = \\sqrt{n 0}\\,e^{i\\varphi(\\mathbf r)}. For ^4He, neutron-scattering measurements of the momentum distribution give n 0/n\\approx 0.07 at T\\!=\\!0, yet \\rho s/\\rho\\to 1 — the standing reminder that condensate fraction and superfluid fraction are not the same number. ODLRO generalizes to fermions as the long-range behavior of \\langle \\hat\\psi^\\dagger \\uparrow(\\mathbf r)\\hat\\psi^\\dagger \\downarrow(\\mathbf r)\\hat\\psi \\downarrow(\\mathbf r')\\hat\\psi \\uparrow(\\mathbf r')\\rangle — the Cooper-pair amplitude — which is how the framework absorbs both BCS superconductors and superfluid ^3He. 5. Second sound from the two-fluid equations Landau (1941) noticed that the two-fluid system, having two independent velocity fields, must support two propagating modes. Linearizing the two-fluid equations around equilibrium in the incompressible-momentum-conserving regime and combining the continuity, entropy, and superfluid acceleration equations yields a wave equation for the temperature/entropy disturbance, so that an entropy wave propagates at — second sound . The first sound is the ordinary pressure/density wave with both components moving in phase; second sound is an out-of-phase counterflow in which mass density is constant but entropy (and hence temperature) oscillates. Landau–Khalatnikov (1949) generalized the construction to include dissipation, mutual friction between vortices and the normal component, and the full kinetic equation for the phonon–roton gas; the resulting predictions — that u 2\\to c/\\sqrt 3 in the phonon-dominated regime T\\!\\ll\\!1\\,\\text{K}, that it vanishes as \\sqrt{\\rho s} near T \\lambda — were confirmed by Peshkov (1944, 1946) and refined by Pellam . The very existence of second sound is the cleanest experimental signature that two-fluid hydrodynamics is not a heuristic but a quantitative theory. The four objects above — two-fluid equations, \\varepsilon(p) with v c=\\min\\varepsilon/p, the Bogoliubov/GPE microscopic skeleton, and ODLRO — are the apparatus. Their regimes of validity matter as much as their content: the two-fluid description fails when \\rho s varies on the scale of the coherence length (vortex cores, boundary layers); the Landau spectrum is a low-energy phenomenology, not derivable from first principles in dense ^4He; the Bogoliubov spectrum applies only when na s^3\\ll 1; ODLRO defines the condensate but does not by itself imply a non-zero \\rho s, a distinction Leggett later sharpened and the next sections will exploit. Quantized Circulation and Topological Defects: Onsager's Remark, Feynman's Wave Function, Vinen's Wire Quantized Circulation and Topological Defects: Onsager's Remark, Feynman's Wave Function, Vinen's Wire 1. Onsager's Florence footnote The textbook attribution of quantized circulation to Feynman is one of the cleaner cases of erased priority in 20th-century low-temperature physics. The original statement belongs to Lars Onsager and was made not in a paper but as a discussion remark at the September 1949 International Conference on Statistical Mechanics in Florence (proceedings: Nuovo Cimento Suppl. 6, 249–250). Following C. J. Gorter's talk on the two-fluid model, Onsager observed — almost in passing — that if the superfluid velocity is a gradient flow \\mathbf{v} s = (\\hbar/m 4)\\nabla\\varphi, single-valuedness of the macroscopic order parameter forces with m 4 the bare ^4He atomic mass and C any closed loop in the superfluid. The integer n is the winding number of \\varphi and the statement is purely topological: it follows from \\pi 1(U(1))=\\mathbb{Z} without any reference to dynamics, interactions, or temperature. Onsager never developed the remark in print. Feynman in 1955 independently rederived the result in the course of constructing his microscopic theory of rotons and vortex filaments, and in his Reviews of Modern Physics article is scrupulous in crediting \"Onsager (private communication and the discussion remark at Florence).\" The phrase \"Feynman quantization condition\" is downstream of secondary sources, not of Feynman himself. 2. Feynman's wave function and the vortex ansatz Feynman's contribution was not the quantization rule but its embedding in a microscopic many-body wave function. His ansatz for an excited state of N atoms is with \\Phi 0 the ground state (taken positive and nodeless) and f a single-particle modulation. For a phonon, f(\\mathbf{r})=e^{i\\mathbf{k}\\cdot\\mathbf{r}}; for a roton, the Feynman–Cohen (1956) refinement adds a backflow factor, lowering the variational gap to the experimental \\Delta r/k B\\approx 8.6 K. For a straight vortex line along \\hat{z} piercing the origin the appropriate choice is a multivalued phase each factor carrying unit winding. The macroscopic phase \\varphi(\\mathbf{r})=\\arctan(y/x) produces a tangential velocity v s=\\hbar/(m 4 r) — the irrotational 1/r flow demanded by Onsager. The vortex core , where the condensate density depletes to zero over a healing length \\xi\\sim(\\hbar^2/2m 4 \\mu)^{1/2}\\approx 1 Å in bulk He II, regularizes the otherwise divergent kinetic energy at r\\to 0. The line energy per unit length is logarithmically infrared-sensitive to the outer cutoff b — set by the container, by the nearest antivortex, or by the inter-vortex spacing in a Feynman array — already a hint of the two-dimensional physics below. Figure: Geometric content of the quantization rule. (a) The irrotational 1/r velocity field around a vortex line, with depletion of the condensate inside the healing-length core. (b) The macroscopic phase \\varphi winds by 2\\pi n on any contour C enclosing the tion enters through thermal or quantum tunnelling through F^{ }(v). The phase-slip critical velocity that results lies many orders of magnitude below v c^{\\text{Landau}}. The latter is recovered only in narrow channels (radii \\lesssim 100 Å) where the ring barrier is geometrically suppressed, or in ion-propagation experiments which directly probe the roton edge. Volovik treats this as the canonical example of an order parameter whose dynamics is governed by topological defects rather than by its linear excitation spectrum. 5. Two dimensions: superfluidity without condensation The Onsager–Feynman picture acquires its sharpest form in two dimensions. Mermin–Wagner forbids true long-range order of a continuous symmetry at T 0, so a 2D Bose system has no BEC in the Penrose–Onsager sense (the one-body density matrix decays as a power law, \\langle\\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(0)\\rangle\\sim r^{-\\eta(T)}). Kosterlitz and Thouless showed that superfluidity nevertheless survives , protected by an essential singularity in the vortex-unbinding free energy: below T {\\text{BKT}} vortices appear only as bound \\pm 1 pairs whose dipolar interaction leaves the algebraic phase coherence intact; above T {\\text{BKT}} free vortices proliferate and the superfluid stiffness collapses discontinuously to zero. The universal jump — derived by Nelson and Kosterlitz (1977) — was confirmed by the Bishop–Reppy torsional-oscillator experiments on ^4He films (1978). BKT is the cleanest demonstration that superfluidity is a topological property of the phase field , not a synonym for Bose condensation. It severs the equivalence that London and Tisza had implicitly assumed and that Penrose–Onsager codified via ODLRO in three dimensions: in 2D, ODLRO is absent yet the helicity modulus (Fisher–Barber–Jasnow, 1973) — the natural diagnostic of phase rigidity — is finite. Conflation watch. (i) \"Feynman quantization\": the condition is Onsager's; Feynman supplied the many-body wave function and the vortex-ring nucleation argument. (ii) \"Landau critical velocity in ^4He\": almost never the operative bound — phase slips through vortex-ring nucleation dominate by 1–2 orders of magnitude. (iii) \"Superfluid = BEC\": false in 2D, where BKT decouples them; partially false in 3D ^4He, where the condensate fraction is \\sim 7\\% while \\rho s/\\rho\\to 1 at T=0. Landmark Experiments: From Kapitza's Capillaries to Persistent Currents and Second Sound Landmark Experiments: From Kapitza's Capillaries to Persistent Currents and Second Sound The phenomenology of ⁴He II and ³He A/B was not settled by a single experiment but by a chain of measurements each of which closed off a classical interpretation and forced acceptance of quantum two-fluid hydrodynamics. The textbook caricature of each is, with depressing regularity, weaker than what the original paper actually demonstrated. The point of this section is to recover that. 1. Kapitza's capillaries and the Allen–Jones fountain (1938) Kapitza's 1938 measurement forced superfluid helium between two optically polished disks separated by a slit of order 0.5\\,\\mum and inferred an upper bound \\eta \\lesssim 10^{-11} Pa·s — four orders of magnitude below the gas-kinetic minimum. The textbook reading \"He II has zero viscosity\" is too strong: Kapitza himself, and Allen–Misener in the back-to-back paper , emphasized that the inferred viscosity depended on channel width . Bowers and Mendelssohn later quantified this in slits and capillaries; what Kapitza had measured was not a material constant but the absence of dissipative coupling between the superfluid component and the walls below a (geometry-dependent) critical velocity. The Allen–Jones fountain effect , announced two months later, is the more conceptually decisive experiment and the one Tisza's two-fluid picture had effectively predicted. A bulb packed with emery powder (a superleak) is heated; helium flows toward the heater and jets from a capillary. The thermomechanical relation (the London equation) follows from a single assumption — the superfluid component carries no entropy — and was verified quantitatively within months. Caricature: \"heat pushes superfluid.\" Actual content: the entropy current and the mass current of the superfluid component are independently zero, which is the operational definition of a two-fluid system at the level of irreversible thermodynamics. The fountain effect, more than the vanishing viscosity, is what made Tisza's framework unavoidable. 2. Andronikashvili's torsional oscillator (1946) E. L. Andronikashvili in Tbilisi suspended a stack of closely spaced aluminum disks ( 0.2 mm separation, smaller than the normal-fluid viscous penetration depth) on a torsion fiber and immersed them in He II. The normal component is dragged with the disks; the superfluid component slips. The period of oscillation gives the moment of inertia of the entrained fluid , hence \\rho n(T). Below \\sim 1 K he recovered Landau's prediction — the phonon contribution — and at higher T the additional Boltzmann-suppressed roton term . This is the first direct quantitative validation of the Landau spectrum [9, 11]. The standard description \"measures the superfluid fraction\" elides what is being measured. Andronikashvili measured \\rho n, the transverse current response to a slowly oscillating boundary; \\rho s = \\rho - \\rho n is a subtraction. The deep identification — that \\rho s so defined coincides with the helicity modulus / longitudinal stiffness against a phase twist, and with the condensate-derived order-parameter weight — was only made later (Hohenberg–Martin, Leggett). What Andronikashvili proved is that the excitation gas has a well-defined inertial mass and that its temperature dependence matches Landau's quasiparticle dispersion to within a few percent. 3. Peshkov and the direct detection of second sound (1944–46) Landau's 1941 paper predicted a second propagating mode in He II — a temperature/entropy wave in which \\rho n and \\rho s oscillate in counterflow with the total density unchanged — with velocity V. P. Peshkov, working in Kapitza's institute under wartime conditions, built a resonant cavity with a heater at one end and a thermometric bolometer at the other and observed standing waves at c 2 \\approx 19 m s⁻¹ at 1.5 K, falling to zero at T \\lambda. The first attempt (1944) used a pulsed technique that Lifshits had pressed Peshkov to try; the definitive 1946 measurements scanned c 2(T) across the entire He II range and matched Landau's formula once \\rho s/\\rho n from Andronikashvili was inserted [9, 11]. Caricature: \"Peshkov measured a temperature wave.\" The correct statement is sharper: he measured a counterflow oscillation whose existence requires (i) two independently conserved currents (mass and entropy), (ii) a finite restoring force for entropy redistribution, and (iii) negligible mutual friction below T \\lambda. None of these can be inferred from viscosity measurements alone. Pellam's American replications shortly after confirmed the velocity but used a less clean geometry; Peshkov's data remain the canonical reference. 4. Hess–Fairbank and the Meissner-analog persistent current (1967) G. B. Hess and W. M. Fairbank rotated an annular cell of He II above T \\lambda, cooled it through the transition while rotating slowly, then stopped the rotation. The angular momentum retained was strictly less than the classical rigid-body value: below a critical angular velocity the superfluid simply refuses to rotate. This is the rotational analog of the Meissner effect — the irrotational ground state expels external rotation just as a superconductor expels magnetic flux — and it is the equilibrium counterpart of the metastable persistent currents Reppy and collaborators had been studying in packed-powder geometries. Caricature: \"persistent current = supercurrent that doesn't decay.\" Sharper statement: Hess–Fairbank demonstrated that the superfluid response to a Galilean boost in a multiply connected geometry is topologically quantized; the \"current that does not decay\" is a thermodynamic equilibrium state at \\Omega \u003c \\Omega c, not a metastable one. This distinction matters for the modern interpretation of supersolid candidates and toroidal cold-atom rings, where the two phenomena are routinely conflated. 5. Vinen's wire and Packard's vortex array (1961, 1979) W. F. Vinen vibrated a thin wire through rotating He II and detected discrete jumps in the wire's circular motion as single quanta of circulation \\kappa = h/m 4 = 9.97\\times10^{-8} m² s⁻¹ attached and detached. This is the first direct observation of the Onsager–Feynman quantization. R. E. Packard's group, between 1974 and 1982, trapped electrons on vortex cores in rotating He II and imaged the resulting array photographically (Yarmchuk–Gordon–Packard, 1979). The number of vortices scaled with \\Omega as n v = 2\\Omega/\\kappa (Feynman's relation), and the geometric arrangement followed the Tkachenko lattice prediction. What Vinen showed is quantization of one vortex ; what Packard showed is that many vortices behave as a rigid lattice — a distinct and harder claim, because it requires that vortex–vortex interactions stabilize a triangular array against thermal fluctuations and finite-size effects. 6. Osheroff, Richardson, Lee — and Leggett's diagnosis (1972) The 1972 PRL \"Evidence for a New Phase of Solid ³He\" in fact reported anomalies in Pomeranchuk-cell pressure traces at 2.7 mK and 1.8 mK that the authors initially attributed to the solid. The follow-up PRL re-identified the cusps as transitions in the liquid , with NMR signatures (a frequency shift in the A phase that vanishes in the B phase) that no ordinary magnetic ordering could explain. Leggett's companion paper showed that these signatures are diagnostic of a spin-triplet, p-wave order parameter with spontaneously broken relative spin–orbit rotation symmetry — the A phase being the Anderson–Brinkman–Morel state, the B phase the Balian–Werthamer state. Caricature: \"they discovered ³He superfluidity.\" Actual sequence: they discovered two transitions, misidentified the medium, then with Leggett's NMR theory established that ³He realizes a fundamentally richer order parameter than ⁴He — anisotropic, multi-component, with topologically distinct phases. The 1996 Nobel honored the experimental triad; Leggett's 2003 Nobel honored the theory. The 1973 confirmation by Wheatley's group and Greytak's neutron-scattering work cemented the identifications, but the conceptual leap — that a superfluid order parameter could be a matrix in spin and orbital indices — is what propagated into the theory of unconventional superconductors and topological superfluids covered in §6. Superfluid ³He: Spin-Triplet p-Wave Pairing and the Multi-Component Order Parameter Superfluid ³He: Spin-Triplet p-Wave Pairing and the Multi-Component Order Parameter 1. Why ³He cannot be ⁴He The folklore that \"superfluid ³He is like ⁴He at a lower temperature\" persists because both fluids share a hydrodynamic surface — persistent currents, quantized vortices, dissipationless film flow. The microscopics are unrelated. ⁴He is a scalar Bose liquid; its order parameter is a single complex number \\Psi = \\Psi e^{i\\varphi} and the broken symmetry is U(1). ³He is a Fermi liquid (nuclear spin \\tfrac{1}{2}, density \\sim 1.6\\times 10^{22}\\,\\text{cm}^{-3}), and any superfluid transition requires Cooper pairing. The strong short-range repulsion at the trinucleon scale suppresses the s-wave channel — the point first sharpened by Rice and Buckingham when ³He superfluidity was still a theoretical conjecture, then made quantitative by the paramagnon (spin-fluctuation) calculations of the late 1960s. Pairing therefore proceeds in an odd channel with L=1 and S=1 jointly antisymmetric under exchange — a Fermi-system analogue of the nuclear pairing problem treated systematically in . 2. The d-vector order parameter A spin-triplet, p-wave gap is parameterised by a 3 \\times 3 complex matrix in spin space, The tensor d {\\mu i} has nine complex entries — eighteen real degrees of freedom modulo an overall phase, against the one phase of ⁴He. The vector \\mathbf{d}(\\hat{\\mathbf{k}}) has a direct reading: it is the axis along which the pair has vanishing spin projection, (\\hat{\\mathbf{d}}\\cdot\\hat{\\mathbf{S}}) \\text{pair}\\rangle = 0, so the pair spin lies in the plane \\perp \\hat{\\mathbf{d}}. The orbital structure is encoded in the \\hat{\\mathbf{k}}-dependence; the gap magnitude on the Fermi surface is \\Delta(\\hat{\\mathbf{k}}) ^2 = \\mathbf{d}^ (\\hat{\\mathbf{k}})\\cdot\\mathbf{d}(\\hat{\\mathbf{k}}) for unitary states. 3. The Anderson–Morel state (A phase) Anderson and Morel (1961) proposed the equal-spin-pairing (ESP) ansatz The orbital factor \\hat{m}+i\\hat{n} carries definite chirality L z = +\\hbar along \\hat{l}. The gap is \\Delta(\\hat{\\mathbf{k}}) ^2 = \\Delta 0^2\\,(1-(\\hat{\\mathbf{k}}\\cdot\\hat{l})^2), with two point nodes at \\hat{\\mathbf{k}} = \\pm\\hat{l} — the Fermi surface remains gapless on a measure-zero locus, and excitation densities scale as T^3 at low temperature. In spin space only \\!\\!\\uparrow\\uparrow\\rangle and \\!\\!\\downarrow\\downarrow\\rangle pairs appear (the \\!\\!\\uparrow\\downarrow\\!+\\!\\downarrow\\uparrow\\rangle component is empty when \\hat{\\mathbf{d}}\\parallel\\hat{z}). Time reversal is broken by \\hat{l}. 4. The Balian–Werthamer state (B phase) Balian and Werthamer (1963) found that within weak-coupling BCS the energetically preferred state is maximally isotropic, The gap is fully isotropic, \\Delta(\\hat{\\mathbf{k}}) ^2 = \\Delta 0^2, and all three triplet substates participate coherently. The symmetry breaking is SO(3) S \\times SO(3) L \\times U(1)\\to SO(3) {L+S}\\times\\mathbb{Z} 2: spin and orbital rotations are locked, leaving the relative angle \\theta to be fixed dynamically by the nuclear dipole–dipole interaction at the Leggett angle \\cos\\theta L = -\\tfrac{1}{4}. 5. The A₁ phase A magnetic field lifts the degeneracy of \\!\\!\\uparrow\\uparrow\\rangle and \\!\\!\\downarrow\\downarrow\\rangle pairs, selecting a single ESP component (d z=0, one spin condensate absent). A₁ occupies a narrow sliver between the normal state and A, identified at Cornell within the same series of experiments that resolved B . Figure: Pressure–temperature phase diagram of bulk ³He (left; polycritical point PCP near 21 bar) and the gap magnitude on the Fermi sphere for each phase (right). The A phase, stable only above the PCP, carries two point nodes along the chiral axis \\hat{l}; the B phase has a fully isotropic gap. The A₁ sliver (omitted) opens between normal and A in finite magnetic field. 6. Discovery and Leggett's NMR theory Osheroff, Richardson, and Lee at Cornell saw two anomalies near 2.7 mK and 1.9 mK along the Pomeranchuk melting curve and initially read them as solid-³He magnetic transitions . The liquid identification followed when Osheroff, Gully, Richardson and Lee resolved the susceptibility signatures : A has the unchanged Curie–Weiss susceptibility of the normal liquid (consistent with ESP, in which \\chi is preserved along \\hat{\\mathbf{d}} \\perp), while B shows a temperature-dependent drop characteristic of a fully gapped, all-triplet condensate. The decisive theoretical move was Leggett's : in a spin-triplet condensate the tiny dipole–dipole interaction breaks the otherwise-massless relative spin–orbit rotation modes, generating a longitudinal NMR resonance at finite frequency \\Omega A(T)\\propto\\Delta 0(T) (impossible in any liquid with a rotation-invariant \\chi) and a positive transverse shift in B, The longitudinal resonance in A was the smoking-gun identification of the Anderson–Morel state — no scalar superfluid can possess one. 7. Topology, defects, and the surface spectrum The residual symmetry group H in each phase determines the defect spectrum and has no ⁴He analogue. In A, H = U(1) {S z}\\times\\mathbb{Z} 2 supports half-quantum vortices (a \\pi flip in \\hat{\\mathbf{d}} compensated by a \\pi phase slip) and the singular surface point defect known as a boojum — where \\hat{l} meets a wall. In B, the locked SO(3) {L+S} generates textures with non-trivial \\pi 3 (Anderson–Toulouse–Volovik solitons) and a richly structured surface layer. The topological classification of places ³He-B in class DIII, with protected Majorana surface modes; Volovik's monograph develops the full programme, including the chiral-Weyl character of A. A bosonic scalar superfluid hosts none of this. 8. Impurities, confinement, and what they reveal Anderson's theorem fails for non-s-wave channels: non-magnetic disorder is pair-breaking. The Ginzburg–Landau machinery developed by Thuneberg and collaborators for aerogel-confined ³He quantifies the suppressed T c, stabilises a polar phase between A and B (impossible in clean bulk), and gives controlled experimental access to the A–B transition. None of these phenomena exist in ⁴He, whose scalar order parameter is, by construction, robust against the same disorder. 9. Verdict on the conflation The \"³He is like ⁴He\" reading retains a single shared fact — dissipationless flow — and erases everything that makes ³He distinct: a tensor order parameter; multiple ordered phases; broken time reversal in A; coupled spin–orbital dynamics observable as longitudinal NMR; nodal quasiparticles; topologically protected surface modes. The two superfluids stand together only as the simplest and the most intricate examples of the same broken-U(1) phenomenology, joined through Leggett's analysis and Volovik's later identification of ³He-A as a paired-fermion Weyl medium . Microscopically they are not the same kind of thing, and the textbook habit of treating them as adjacent chapters of one story obscures the most interesting physics each contains. What Still Holds, What Was Superseded, and Where the Literature Confuses Itself What Still Holds, What Was Superseded, and Where the Literature Confuses Itself The seventy years since Landau's 1941 paper have produced a layered theoretical inheritance in which each generation of results has been partially preserved, partially absorbed into a wider framework, and partially mis-cited into folklore. The audit below sorts the surviving formulations from the superseded ones and, in each case, names the conflation that the modern literature still propagates. 1. The Landau critical velocity: an upper bound, not the answer Landau's criterion remains correct as a kinematic upper bound : a superflow that exceeds the minimum of \\varepsilon(p)/p admits energy-conserving Cherenkov-like emission of an elementary excitation into the rest frame of the walls, and the flow must decay [9, 12]. For ⁴He the roton minimum sets v L \\approx 60 m s^{-1}, a number confirmed by negative-ion mobility experiments near saturated vapour pressure (Ellis, McClintock; verify). What is wrong in the textbooks is the implication that v L is the operative critical velocity. In capillaries and rotating buckets, dissipation sets in at v c^{\\mathrm{vortex}} \\sim (\\hbar/m d)\\ln(d/a 0) with d the channel width and a 0 \\sim 1 Å the vortex core, three to four orders of magnitude below v L [11, 10]. The breakdown mechanism is vortex nucleation — Feynman's prediction, Vinen's wire observation , and Iordanskii's barrier theory (verify). Landau's bound is touched only in narrow geometries (sub-µm orifices) and ion-bubble experiments where vortex nucleation is geometrically suppressed. The honest statement is therefore: v L is the spectroscopic ceiling; the operative critical velocity is set by the nucleation rate of topological defects, which depends on geometry, surface roughness, and (in ³He) the order-parameter manifold. 2. The Gross–Pitaevskii equation: dilute-gas regime only is exact only in the limit n a s^{3} \\to 0, where n is the density and a s the s-wave scattering length . It is a mean-field equation for the condensate wavefunction; it presupposes that essentially all particles are condensed. For ⁴He the diluteness parameter is n a s^{3} \\sim 0.2 and the condensate fraction at T=0 is n 0/n \\approx 0.07–0.09 as measured by deep-inelastic neutron scattering (Sokol; Glyde; verify). GPE applied to ⁴He yields the right hydrodynamic skeleton (compressible Euler equation, quantized circulation, Bogoliubov-like sound) but the wrong roton minimum, the wrong static structure factor, and the wrong condensate depletion. Quantitative ⁴He theory needs path-integral Monte Carlo, correlated basis functions, or the Bijl–Feynman–Cohen variational ansatz ; the GPE is a cartoon. Conversely for trapped alkali BECs na s^{3} \\sim 10^{-5}–10^{-3} and GPE is essentially exact for ground-state density, collective-mode frequencies, and vortex dynamics . The conflation to flag: papers that present GPE solutions as \"superfluid helium dynamics\" — they are dilute-gas dynamics in helium's clothing. 3. BEC \\ne superfluidity (Leggett's theorem, the depleted condensate, BKT) This is the most consequential conflation in the field, and it survives in textbooks because the dilute-gas / weakly-interacting case happens to make the two notions coincide. The two definitions are inequivalent: concept order parameter diagnostic --- --- --- BEC macroscopic eigenvalue of \\rho 1(\\mathbf{r},\\mathbf{r}'); ODLRO \\lim {\\mid \\mathbf{r}-\\mathbf{r}'\\mid \\to \\infty} \\rho 1 = n 0 \\ne 0 superfluidity nonclassical response to boundary motion; transverse current rigidity \\rho s = \\lim {q\\to 0} \\chi {JJ}^{T}(q); persistent current, quantized circulation The ODLRO definition is Penrose–Onsager . The superfluid-density definition (helicity modulus / two-fluid stiffness) is Hohenberg–Martin and was sharpened in the dynamic critical phenomena programme . Three counterexamples force the distinction: (i) Ideal Bose gas. Bose condenses below T c but has \\rho s = 0: any infinitesimal moving wall drags the entire gas because the spectrum is \\varepsilon(p) = p^{2}/2m and the Landau criterion gives v c = 0. BEC without superfluidity [13, 27, 28]. (ii) ⁴He at T=0. n 0/n \\approx 0.07 but \\rho s/\\rho = 1. Most of the fluid is not condensed in the single-particle sense, yet the entire fluid participates in irrotational potential flow. The interactions transfer rigidity from the condensate to the rest of the liquid; the ODLRO matrix element survives even though most particles sit in finite-momentum states [8, 11]. (iii) 2D ⁴He films. The Mermin–Wagner theorem forbids true BEC at T 0 in two dimensions, yet thin ⁴He films exhibit a superfluid transition at the Kosterlitz–Thouless temperature with a universal jump \\rho s(T {\\mathrm{BKT}})/T {\\mathrm{BKT}} = 2m^{2}k B/\\pi\\hbar^{2} . The order is quasi-long-range (algebraic decay of \\rho 1), not ODLRO. Superfluidity without BEC. The clean disentanglement: BEC is a statement about the one-body density matrix ; superfluidity is a statement about the current–current response function . They coincide only in the weakly interacting 3D limit where Bogoliubov theory holds. 4. \"He II\" \\ne \"the superfluid component\" A thermodynamic phase and a hydrodynamic variable are routinely identified in popularizations and even in some research papers. They are different objects: - He II is the equilibrium phase of liquid ⁴He below T \\lambda = 2.17 K at saturated vapour pressure. It is a single thermodynamic substance with a well-defined density \\rho(T,P), entropy s(T,P), and chemical potential. Above T \\lambda it is called He I. - The superfluid component is a hydrodynamic variable in the Tisza–Landau two-fluid theory, with its own velocity field \\mathbf{v} s = (\\hbar/m)\\nabla\\varphi and density \\rho s(T) such that \\rho n + \\rho s = \\rho. It is not a chemically separable fraction of atoms; it is a decomposition of the momentum response into a part that in superfluidity [29, 30, 31], it means the magnon-condensate stiffness \\rho M; in dark-matter analogues , it means the soliton-supporting condensate of an ultralight scalar. Each invocation needs its own current–current response definition; importing the ⁴He intuition wholesale is the most common error. - \"BEC–BCS crossover\" as a single phase. It is a crossover , not a transition: the order parameter \\langle\\psi \\uparrow\\psi \\downarrow\\rangle is nonzero throughout, and only its internal structure (Cooper pair vs. tightly-bound molecule) changes as 1/k F a s runs from -\\infty to +\\infty. The literature occasionally treats the unitary point as a phase boundary; it is not. The surviving core, then, is small and durable: ODLRO (or its quasi-long-range 2D analogue) plus a nonzero helicity modulus is what defines a superfluid; everything else — Landau's spectrum, GPE, two-fluid hydrodynamics, the BCS-pairing extensions — is the regime-specific machinery built on top. Current Frontier: BEC–BCS Crossover, Spin Superfluidity, Neutron Stars, and Dark-Matter Analogues Current Frontier: BEC–BCS Crossover, Spin Superfluidity, Neutron Stars, and Dark-Matter Analogues By 2026 \"superfluidity\" has expanded from a property of one liquid below 2.17 K to a label attached to systems whose densities span many orders of magnitude and whose constituents range from neutral atoms to nucleons to hypothetical dark-sector relics. Each generalization carries its own operative definition of \\rho s, and the literature is not always careful to specify which one is being measured. 1. The unitary Fermi gas and the BEC–BCS crossover The cleanest modern laboratory for superfluidity is a two-component balanced gas of ^{6}Li or ^{40}K tuned through a Feshbach resonance. As the s-wave scattering length a moves from a\\to 0^- (weak BCS) through a \\to\\infty (unitarity) to a\\to 0^+ (deeply bound dimer BEC), one interpolates continuously between Cooper pairs of size \\xi {\\text{pair}}\\gg k honon–roton excitation spectrum and a rigorous two-fluid hydrodynamics, predicting second sound. Bogoliubov's 1947 microscopic theory of the weakly interacting Bose gas, Penrose–Onsager's ODLRO criterion (1956), Onsager's and Feynman's quantization of circulation, and finally Osheroff–Richardson–Lee's 1972 discovery of superfluid ³He completed the canonical edifice.", "credit_audit": "The popular record collapses a multi-author discovery into 'Kapitza, 1938' and a multi-author theory into 'Landau, 1941'. The 1978 Nobel to Kapitza alone for the 1938 discovery is the canonical example: Allen and Misener's Nature paper was back-to-back with Kapitza's, Allen further discovered the fountain effect, and the priority is genuinely shared (Balibar has argued repeatedly that the Nobel decision was political — Allen was alive and active at the time of the award). The two-fluid hydrodynamics is Tisza's (1938), built on London's BEC interpretation; Landau (1941) supplied a superior microscopic justification (phonons + rotons, critical velocity from the spectrum) but explicitly rejected London's BEC connection — a position Penrose \u0026 Onsager (1956) later overturned with ODLRO. Soviet textbooks erased Tisza and London; Western textbooks tend to erase Bogoliubov from the dilute-gas theory and Onsager from the quantization of circulation (which is routinely called 'Feynman's' even though Feynman attributes it to Onsager). The lambda-transition discovery is W. H. Keesom's Leiden group (1927–1936), with his daughter A. P. Keesom a frequent co-author on the key papers — her name is often dropped. For ³He, the 1996 Nobel to Osheroff, Richardson and Lee is clean, but the theoretical identification of the A and B phases as anisotropic spin-triplet BCS states (Anderson–Morel, Balian–Werthamer, Leggett) is sometimes elided in popular accounts.", "timeline": [{"year": 1908, "event": "First liquefaction of ⁴He; boiling behavior near 2.2 K observed but unexplained", "who": "H. Kamerlingh Onnes", "work": "Communications from the Physical Laboratory at Leiden", "kind": "observation", "ref": null}, {"year": 1927, "event": "Identification of a phase transition at the λ-point; naming of 'He I' and 'He II'", "who": "W. H. Keesom, M. Wolfke", "work": "Comm. Phys. Lab. Leiden / Proc. Roy. Acad. Amsterdam", "kind": "observation", "ref": null}, {"year": 1932, "event": "λ-shaped specific-heat anomaly mapped; establishes the transition as second-order-like", "who": "W. H. Keesom, K. Clusius", "work": "Proc. Roy. Acad. Amsterdam", "kind": "observation", "ref": null}, {"year": 1936, "event": "Rollin film: creeping film flow over container walls reported", "who": "B. V. Rollin (with F. Simon)", "work": "Physica / Actes du 7e Congrès Int. du Froid", "kind": "observation", "ref": null}, {"year": 1938, "event": "Independent discovery of vanishing viscosity in He II; 'superfluidity' coined", "who": "P. L. Kapitza; J. F. Allen \u0026 A. D. Misener (back-to-back papers)", "work": "Nature 141, 74 and 141, 75", "kind": "observation", "ref": null}, {"year": 1938, "event": "Identification of the λ-transition as Bose–Einstein condensation in an interacting liquid", "who": "F. London", "work": "Nature 141, 643", "kind": "theory", "ref": null}, {"year": 1938, "event": "Two-fluid hydrodynamics proposed from London's BEC picture; prediction of thermomechanical effects", "who": "L. Tisza", "work": "Nature 141, 913 (also C.R. Acad. Sci. Paris 207)", "kind": "theory", "ref": null}, {"year": 1940, "event": "First broad English-language review consolidating the He II phenomenology", "who": "K. K. Darrow", "work": "Reviews of Modern Physics 12, 257", "kind": "formalization", "ref": 7}, {"year": 1941, "event": "Phonon–roton excitation spectrum, microscopic justification of two-fluid model, prediction of critical velocity and second sound", "who": "L. D. Landau", "work": "Phys. Rev. 60, 356 / J. Phys. USSR 5, 71", "kind": "theory", "ref": 9}, {"year": 1941, "event": "Kapitza thermal boundary resistance and definitive heat-transport measurements in He II", "who": "P. L. Kapitza", "work": "Phys. Rev. 60, 354 / J. Phys. USSR 4", "kind": "observation", "ref": 6}, {"year": 1947, "event": "Microscopic theory of the weakly interacting Bose gas; Bogoliubov transformation and excitation spectrum", "who": "N. N. Bogoliubov", "work": "J. Phys. USSR 11, 23", "kind": "formalization", "ref": null}, {"year": 1949, "event": "Quantization of circulation in a Bose superfluid (oral remark at the Florence low-temperature conference)", "who": "L. Onsager", "work": "Nuovo Cimento Suppl. 6, 249", "kind": "theory", "ref": null}, {"year": 1955, "event": "Feynman wave function for rotons; topological argument for vortex quantization", "who": "R. P. Feynman (with M. Cohen on rotons, 1956)", "work": "Progress in Low Temperature Physics, vol. 1 / Rev. Mod. Phys. 29, 205", "kind": "theory", "ref": 11}, {"year": 1956, "event": "Off-diagonal long-range order (ODLRO) as the order parameter of Bose condensation in an interacting liquid", "who": "O. Penrose, L. Onsager", "work": "Phys. Rev. 104, 576", "kind": "formalization", "ref": null}, {"year": 1961, "event": "Direct observation of single quanta of circulation in He II", "who": "W. F. Vinen", "work": "Proc. Roy. Soc. A 260, 218", "kind": "observation", "ref": null}, {"year": 1972, "event": "Discovery of superfluid phases of ³He (A, B); BCS-like pairing with anisotropic, spin-triplet order parameter", "who": "D. D. Osheroff, R. C. Richardson, D. M. Lee", "work": "Phys. Rev. Lett. 28, 885 and 29, 920", "kind": "observation", "ref": null}], "neglected": [{"name": "Jack F. Allen and A. Don Misener", "role": "Co-discoverers of superfluid flow in He II; their Nature paper (141, 75, 1938) was submitted alongside Kapitza's and was equally decisive — Allen also discovered the fountain (thermomechanical) effect with Jones — yet only Kapitza received the 1978 Nobel for the discovery", "evidence": "Nature 141, 75 (1938); Allen \u0026 Jones, Nature 141, 243 (1938); Sébastien Balibar's historical reviews (J. Low Temp. Phys. 146, 441, 2007) detail the priority dispute and the asymmetric Nobel decision", "ref": null}, {"name": "Anna Petronella ('Mies') Keesom", "role": "Co-author with her father W. H. Keesom on the heat-capacity and heat-conductivity measurements (1935–36) that revealed the λ-anomaly and the anomalous transport — sometimes erased to 'Keesom' alone in textbooks", "evidence": "Physica 2, 557 (1935); Physica 3, 359 (1936); see also van Delft, 'Freezing Physics' (KNAW, 2007)", "ref": null}, {"name": "László Tisza", "role": "First two-fluid model (1938), grounded in London's BEC picture; predicted the thermomechanical effects and second sound before Landau's reformulation. Landau's 1941 paper dismissed Tisza's derivation, and the model is routinely cited as 'Landau's two-fluid model'", "evidence": "Nature 141, 913 (1938); C.R. Acad. Sci. Paris 207, 1035 and 1186 (1938); Balibar, C. R. Physique 18, 586 (2017); Tisza's own historical account in Phys. Today 52(10), 26 (1999)", "ref": null}, {"name": "Fritz London", "role": "First to identify He II as an interacting BEC (1938); the conceptual bridge from atomic statistics to quantum hydrodynamics. Landau's polemic against the BEC interpretation suppressed London's contribution in Soviet textbooks for decades; vindicated only after Penrose–Onsager (1956)", "evidence": "Nature 141, 643 (1938); Phys. Rev. 54, 947 (1938); Gavroglu, 'Fritz London: A Scientific Biography' (CUP, 1995)", "ref": null}, {"name": "Nikolai N. Bogoliubov", "role": "1947 microscopic theory of the dilute interacting Bose gas — the Bogoliubov transformation and excitation spectrum that underlie every modern treatment of dilute superfluids", "evidence": "J. Phys. USSR 11, 23 (1947); cited as foundational in Pitaevskii–Stringari, 'Bose–Einstein Condensation' (OUP, 2003)", "ref": null}, {"name": "Lars Onsager", "role": "Stated quantization of circulation in a Bose superfluid in 1949, predating Feynman's vortex picture; the remark appeared only as a discussion comment and is often attributed solely to Feynman", "evidence": "Nuovo Cimento Suppl. 6, 249–250 (1949); discussed in Donnelly, 'Quantized Vortices in Helium II' (CUP, 1991)", "ref": null}, {"name": "Eugene P. Gross \u0026 Lev P. Pitaevskii", "role": "Independently derived (1961) the nonlinear Schrödinger equation for the condensate wave function — universally called the Gross–Pitaevskii equation, but in much of the cold-atom literature is simply 'GPE' with the names elided", "evidence": "Gross, Nuovo Cimento 20, 454 (1961); Pitaevskii, Sov. Phys. JETP 13, 451 (1961)", "ref": null}], "conflations": [{"claim": "Superfluidity = Bose–Einstein condensation.", "clarification": "BEC is a single-particle-density-matrix statement (macroscopic occupation of one mode / ODLRO); superfluidity is a transport property defined by a nonclassical response to boundary motion (Landau critical velocity, persistent currents, quantized circulation). Leggett's theorem (and the 2D BKT case) shows they are logically distinct: an ideal Bose gas BECs but is not a superfluid; a 2D film is superfluid without true BEC; ⁴He has a depleted condensate (~7%) yet a 100% superfluid fraction at T=0."}, {"claim": "Helium II = the superfluid component.", "clarification": "He II is the thermodynamic phase below T_λ; it is described by Tisza/Landau two-fluid hydrodynamics as a mixture of a normal and a superfluid component. The ratio is temperature-dependent (ρ_s/ρ → 1 only at T=0). 'He II' and 'superfluid' are not synonyms."}, {"claim": "Landau's two-fluid model.", "clarification": "The two-fluid construction is Tisza's (1938). Landau's contributions are the phonon–roton excitation spectrum, the derivation of two-fluid hydrodynamics from a Galilean-invariant excitation gas, and the prediction of second sound. He explicitly opposed the BEC origin Tisza assumed."}, {"claim": "The Landau critical velocity sets the breakdown of superflow.", "clarification": "Landau's v_c = min(ε(p)/p) is an upper bound from the excitation spectrum; in practice ⁴He breaks down at much lower velocities set by vortex nucleation (Feynman, Vinen, Iordanskii), and only in narrow channels or ion-propagation experiments does one approach the roton-limited Landau value."}, {"claim": "Superfluidity is a low-temperature phenomenon of helium.", "clarification": "Modern usage covers spin superfluidity (magnon condensates, Bunkov–Volovik), neutron-star pairing (Migdal 1959), fermionic atomic superfluids in the BEC–BCS crossover, exciton-polariton condensates, and proposed dark-matter superfluids. Each requires its own definition of the superfluid density (helicity modulus, Meissner-like response, two-fluid stiffness)."}, {"claim": "Superfluid ³He is 'like' superfluid ⁴He.", "clarification": "⁴He is a single-component scalar Bose superfluid; ³He is a spin-triplet, p-wave BCS-paired Fermi superfluid with a multi-component order parameter (A, B, A₁ phases distinguished by gap structure and time-reversal/spin-orbit properties). Their topological defects, NMR signatures, and excitation spectra are qualitatively different."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins, Priority, and the Forgotten Pioneers (1908–1938)", "markdown": "## Origins, Priority, and the Forgotten Pioneers (1908–1938)\n\nThe discovery of superfluidity is the textbook case in which a clean Nobel narrative — \"Kapitza, 1938\" — obscures a thirty-year chain of observation in which at least eight names belong, two of which (A. P. Keesom; A. D. Misener) the canonical record has effectively erased, and one of which (J. F. Allen) was deliberately omitted from the 1978 prize.\n\n### 1908: Leiden, and an anomaly nobody could see\n\nOn 10 July 1908 Heike Kamerlingh Onnes liquefied ⁴He for the first time, reaching ≈ 4.2 K and, by pumping on the vapor, ≈ 1.7 K within days. Onnes recorded that the liquid's meniscus *vanished* and that pumped helium became \"remarkably quiet\" near 2.2 K — observations buried in the *Communications from the Physical Laboratory at Leiden* and Onnes's notebooks. He attributed the quieting to \"a maximum of density\" (which is correct, but secondary) and did not pursue a phase transition. The 1908 paper is therefore the first observational document of the λ-anomaly, but not its identification: superfluidity was hiding in plain sight in Onnes's own data for two decades.\n\n### 1927–1936: The Keesoms and the λ-point\n\nThe identification belongs to Willem Hendrik Keesom and Mieczysław Wolfke, who in 1927–1928 mapped the dielectric constant and density of liquid helium across 2.17 K and concluded that two distinct phases — which they christened *helium I* and *helium II* — meet at a singular temperature (Comm. Leiden 190b; Proc. KNAW 31). In 1932 Keesom and Klaus Clusius measured a specific-heat curve whose shape resembled the Greek λ — the *λ-point* was named. From 1935 onward the Leiden experiments were carried out by W. H. Keesom together with his daughter, **Anna Petronella (\"Mies\") Keesom**, who co-authored the decisive papers on the heat capacity (Physica 2, 557, 1935) and the anomalous heat transport (Physica 3, 359, 1936). The 1936 paper reported a thermal conductivity in He II so large that it could not be fit by any ordinary diffusive ansatz — the first quantitative hint that transport in He II was non-Fourier. Textbooks routinely cite \"Keesom (1936)\" and drop the second author; van Delft's archival reconstruction (*Freezing Physics*, KNAW 2007) restores her authorship and the lab notebooks that show her at the cryostat.\n\n### 1936: Rollin's creeping film\n\nBernard V. Rollin, working with Franz Simon's group in Oxford, reported in 1936 that liquid helium below the λ-point climbs the walls of its container and drains across thermal links: the *Rollin film*. The result appeared in *Physica* 2, 557 and in the proceedings of the 7th International Congress of Refrigeration (The Hague, 1936) — a venue obscure enough that the discovery was later misattributed in English-language reviews to Daunt and Mendelssohn (1939), who in fact only characterized the film's velocity. Rollin had no theoretical framework for the film, and the result drifted, uncited, for two years before the 1938 papers made it inescapable.\n\n### January 1938: Two letters to *Nature*, posted from opposite poles\n\nThe 8 January 1938 issue of *Nature* carried two back-to-back letters [1, 2]. Kapitza, working in Moscow with the Mond magnet he had brought from Cambridge, measured the flow of He II through a 0.5 µm gap between optical flats and found a viscosity ≲ 10⁻⁹ Pa·s — at least 1500× below He I. He coined the noun: \"By analogy with superconductors … helium below the λ-point enters a special state which might be called a *superfluid*.\" J. F. Allen and A. D. Misener, in Cambridge's Mond Laboratory (which Kapitza had run until 1934), pushed He II through capillaries of 0.05–0.5 mm and demonstrated that the apparent viscosity *fell with decreasing channel width* — a result no Newtonian fluid can produce, and a far stronger logical demonstration of frictionless flow than Kapitza's single-geometry measurement. The two papers were received by *Nature* within eight days of each other, and the editors set them in sequence with a joint editorial note acknowledging their independence.\n\n### The fountain effect, and the asymmetry of the 1978 Nobel\n\nSix weeks later Allen, now with Harry Jones, reported the *thermomechanical (fountain) effect*: an applied heat pulse to a porous plug drives a jet of helium upward, the unmistakable signature of a counter-flow between two thermodynamically distinct components [3]. This is the experimental phenomenon Tisza's two-fluid model was constructed to explain (Nature 141, 913 [4]); without it, neither London's BEC identification [5] nor Tisza's hydrodynamics would have had a target. By any honest weighting of the evidence, the 1938 discovery was a *three-laboratory, four-author* achievement — Kapitza, Allen, Misener, Jones — with Allen contributing more independent phenomenology than anyone else.\n\nThe 1978 Nobel Prize in Physics named Kapitza alone \"for his basic inventions and discoveries in the area of low-temperature physics.\" Allen was alive, at St Andrews, and active in the field. Misener, by then in Canada and never having returned to low-temperature work, was not considered. Sébastien Balibar has reconstructed the priority dispute in detail (J. Low Temp. Phys. 146, 441, 2007; C. R. Physique 18, 586, 2017) and concluded that the Stockholm decision was political: a half-prize for the discovery would have required pairing Kapitza with a non-Soviet co-laureate at the height of the Brezhnev era, and the citation was instead worded broadly enough (\"basic inventions and discoveries\") to elide the issue. The asymmetry is sharper still when one notes that Kapitza's 1941 paper [6] cites Allen and Misener once and Allen and Jones twice, without dispute.\n\n### What was actually known on the eve of theory\n\nBy summer 1938 the experimental ledger read: a second-order-like transition at 2.17 K (Keesom \u0026 Wolfke 1927; Keesom \u0026 Clusius 1932), a λ-shaped specific heat (W. H. \u0026 A. P. Keesom 1935), an anomalous thermal conductivity that broke Fourier's law (W. H. \u0026 A. P. Keesom 1936), film creep over macroscopic barriers (Rollin 1936), vanishing viscosity in narrow gaps and a width-dependent apparent viscosity in capillaries (Kapitza; Allen \u0026 Misener, 1938), and a thermomechanical effect coupling heat flux to mass flux (Allen \u0026 Jones, 1938). Darrow's 1940 review [7] was the first attempt to organize this catalogue in English, and it is striking that even at that late date the *cause* of any of these effects was, in print, entirely open — London's BEC identification [5] and Tisza's two-fluid response [4] had appeared but were not yet accepted.\n\nThe credit ledger, then, is unambiguous on the experimental side and badly distorted in its public memory: Onnes saw the anomaly without identifying it; the Keesoms (father and daughter) and Wolfke named the phase and mapped its thermodynamics; Rollin found the film; Kapitza, Allen, Misener, and Jones — independently, in two laboratories, within a single calendar quarter — established the frictionless flow and the thermomechanical effect that together demanded a new physics. Section 2 takes up that physics, and the parallel erasure of London and Tisza."}, {"id": "london-tisza-and-the-bec-bridge", "title": "London, Tisza, and the Bose–Einstein Bridge: A Theory Erased and Restored", "markdown": "## London, Tisza, and the Bose–Einstein Bridge: A Theory Erased and Restored\n\n### 1. The conceptual vacuum of spring 1938\n\nBy March 1938 the experimental situation was unambiguous and theoretically inert. Kapitza in Moscow and Allen \u0026 Misener in Cambridge had reported, in back-to-back *Nature* communications, a viscosity in He II below $T_\\lambda \\simeq 2.17\\,\\mathrm{K}$ that was either immeasurably small or unmeasurable in principle [1, 2]; Allen \u0026 Jones had added the fountain (thermomechanical) effect a few weeks later [3]. Keesom's λ-anomaly in the specific heat had been on the books for a decade, and Rollin's creeping film flow for two years. There was no theory. The word \"superfluidity,\" coined by Kapitza in analogy with superconductivity, named a phenomenon rather than explained it.\n\nWhat was missing was a *mechanism* — a reason why a liquid, with a density of $0.145\\,\\mathrm{g\\,cm^{-3}}$ and a mean interparticle spacing of $\\sim 3.6\\,\\text{Å}$, comparable to the hard-core diameter, should behave as if a macroscopic fraction of its atoms had ceased to scatter. Two papers in *Nature* later that year, by Fritz London and László Tisza, supplied it. The papers were short, almost programmatic, and were promptly attacked by the most influential theorist of the next half-century. The full restoration of their picture required the off-diagonal long-range order (ODLRO) of Penrose and Onsager, eighteen years later [8].\n\n### 2. London's bridge: the λ-transition as an interacting BEC\n\nLondon's contribution was to look at the Einstein 1925 condensation of an ideal Bose gas and recognise its numerology. For an ideal gas of $^4$He atoms at the liquid density, the condensation temperature\n\n$$T_{\\mathrm{BEC}} = \\frac{2\\pi\\hbar^2}{m k_B}\\!\\left(\\frac{n}{\\zeta(3/2)}\\right)^{2/3}$$\n\nevaluates to $\\simeq 3.13\\,\\mathrm{K}$, within a factor close to $T_\\lambda = 2.17\\,\\mathrm{K}$. No other low-temperature phenomenon — not the Debye model, not the rotational anomalies of $\\mathrm{H}_2$, not any of Kapitza's energy scales — produced a transition at the right place from first principles. London's claim was therefore double: (i) the λ-transition is the residue of Bose–Einstein statistics surviving in a strongly interacting liquid; (ii) the discrepancy between $T_{\\mathrm{BEC}}$ and $T_\\lambda$ is the work of interactions, which reduce the condensate fraction without destroying its existence.\n\nThe second claim was unfalsifiable in 1938 and would remain so until ODLRO formalised the meaning of \"Bose condensation in a liquid\". The first was a leap: Einstein's 1925 argument required noninteracting bosons, and the consensus view, articulated most forcefully by Uhlenbeck in his 1927 thesis and softened only in 1937, was that the BEC singularity was an artefact of the ideal-gas limit. London's *Nature* note [5] and his slightly longer *Physical Review* paper of the same year amounted to the assertion that the singularity is robust — a position vindicated only by Penrose and Onsager and, in full mathematical generality, by Lieb, Seiringer and Yngvason sixty years later.\n\nA subtlety routinely lost: London did *not* claim that the superfluid component is the condensate. He claimed that the λ-transition is a BEC. The identification of $\\rho_s$ with $n_0$ is a folk reading that survives in undergraduate texts and is wrong: in $^4$He at $T\\to 0$ the condensate fraction is $n_0/n \\simeq 0.07$ from neutron scattering, while the superfluid fraction is $\\rho_s/\\rho \\to 1$.\n\n### 3. Tisza's two-fluid hydrodynamics\n\nTisza, then in Paris and in close correspondence with London, drew the operational consequence. If a macroscopic fraction of the atoms occupies a single quantum state, that fraction cannot carry entropy; it constitutes a component with $s = 0$, $\\eta = 0$, locally irrotational. The rest of the fluid carries the entropy and the viscosity. The fluid obeys two coupled Euler equations,\n\n$$\\rho_s \\partial_t \\mathbf{v}_s = -\\rho_s \\nabla\\!\\left(\\mu - s T\\right), \\qquad \\rho_n \\partial_t \\mathbf{v}_n + \\nabla\\!\\cdot\\!\\Pi_n = -\\rho_n \\nabla\\mu - \\rho_s s\\nabla T,$$\n\nwith $\\rho = \\rho_n + \\rho_s$ and a temperature-dependent condensate fraction governing the partition. The thermomechanical (fountain) effect, the persistence of flow through narrow capillaries, and — as Tisza explicitly predicted — a second propagating mode in which $\\rho_s$ and $\\rho_n$ oscillate in counterphase at constant total density (later named second sound), all follow [4]. The full hydrodynamic derivation appeared in Tisza's *C. R. Acad. Sci. Paris* notes (207, 1035 and 1186, 1938) and in *J. Phys. Radium* 1, 165 and 350 (1940).\n\nIt is worth stating plainly what Tisza had and what he did not. He had a phenomenological two-fluid model, a microscopic *interpretation* (BEC à la London), correct predictions for the thermomechanical effects, and a qualitative prediction of second sound. He did not have an excitation spectrum, a derivation of $\\rho_s(T)$ from microscopic dynamics, or a Galilean-invariant formulation of the normal component's stress tensor.\n\n### 4. Landau's 1941 polemic\n\nLandau's *Theory of the Superfluidity of Helium II* [9] is one of the most consequential pa
