abelian AB in neutral atoms](https://www.nature.com/articles/srep05992)\n- [Non-abelian AB caging in synthetic dimensions](https://arxiv.org/pdf/2602.13796)\n- [Marletto–Vedral, testing electric AB with superconductors](https://arxiv.org/pdf/1909.11668)\n- [Chiao et al., scalar AB in 3D Faraday cage](https://arxiv.org/abs/1411.3627)\n- [Hitachi R\u0026D — AB verification archive (Tonomura)](https://www.hitachi.com/rd/research/materials/quantum/aharonov-bohm/index.html)\n- [Aharonov oral-history interview, EPJ H 2025](https://link.springer.com/article/10.1140/epjh/s13129-025-00107-9)\n- [Wikipedia — Aharonov–Bohm effect (Nobel context)](https://en.wikipedia.org/wiki/Aharonov%E2%80%93Bohm_effect)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier excavating four discoveries buried under one name, six conflations buried under one phase, and a sixty-seven-year experimental program that the Nobel committee has somehow contrived not to notice. Here is where I plant my flag.\n\n### (a) What I will defend with my reputation\n\nThe gauge-invariant loop integral $\\exp\\!\\left[\\tfrac{iq}{\\hbar}\\oint \\mathbf{A}\\cdot d\\mathbf{l}\\right]$ is a physical observable of any quantum system whose configuration space is multiply connected, and this is the *correct* minimal statement of the magnetic AB effect [44]. The Wu–Yang nonintegrable phase factor [76] is the right ontological object: not $\\mathbf{A}$, not $\\mathbf{B}$, but the holonomy of the $U(1)$ connection on the bundle over $\\mathbb{R}^3\\setminus\\Gamma$. I will further defend that Tonomura's toroidal-superconductor experiments [60,61] closed the field-leakage loophole by *topology* — flux quantization plus Meissner expulsion — and not by precision, and that nothing serious in the literature since 1986 has reopened it. The historical record on priority — Dirac 1931, Franz 1939, Ehrenberg–Siday 1949 — is settled; the textbook attribution to AB alone is wrong and should be corrected in pedagogy.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions wobble.\n\nFirst: the *electric* AB effect is routinely presented as a sibling of the magnetic one. It is not. The Type-II case [55] is dynamical in disguise — it requires either a time-varying $\\varphi$ along the path or a temporal split of the wavepacket, and the \"field-free\" claim survives only because one is comparing wavepackets that traverse the potential at *different times*. The topological story breaks; the cleanest experiments (van Oudenaarden, Devoret) measure essentially a dynamical phase mislabeled.\n\nSecond: the often-repeated claim that AB experiments rule out action-at-a-distance reformulations [56,57]. They rule out *local field* reformulations in simply-connected regions, which is a weaker statement. Nonlocal-but-causal reformulations (Vaidman's source-current argument, Aharonov–Cohen–Rohrlich) remain logically live, and the community's dismissal of them has been more sociological than technical.\n\nThird: the nondispersive character of the AB phase is asserted in regimes where it has not been tested. The Becker–Batelaan force-free criterion [67] is a *necessary* condition, not a verified one for all geometries, and lateral-deflection bounds at the few-meV scale remain unmeasured.\n\n### (c) The three open questions I would actually work on\n\n1. **Nonabelian AB with synthetic $SU(2)$ gauge fields in cold-atom rings** — the only realistic platform where the Wilson-loop noncommutativity $\\mathcal{P}\\exp\\!\\oint A_\\mu^a T^a\\,dx^\\mu$ can be measured directly; everything else is analog.\n2. **A definitive electric-AB experiment with a genuinely time-independent $\\varphi$ along both arms** — the textbook claim has no clean experimental realization; the apparent successes all cheat on timing.\n3. **A force-resolved AB experiment at the $10^{-3}\\,\\mathrm{meV}$ scale** to bound any residual semiclassical lateral momentum transfer — the Becker–Batelaan analysis demands it and no one has done it.\n\n### (d) Reading path\n\n1. **Ehrenberg \u0026 Siday (1949)** [42] — read it first to see the effect derived plainly in electron-optical language, without the foundational scaffolding, and ask why this didn't suffice.\n2. **Aharonov \u0026 Bohm (1959)** [44] — then read the paper that reframed the same arithmetic as a statement about the ontology of gauge potentials.\n3. **Chambers (1960)** [50] — the first fringe shift; note the modesty of the claim and the residual leakage worry that haunted the next 25 years.\n4. **Wu \u0026 Yang (1975)** [76] — the cleanup: nonintegrable phase factors as the right invariant object, retiring the \"is $\\mathbf{A}$ real?\" question.\n5. **Tonomura et al. (1986)** [60] — read last to see why topology of the *source*, not precision of the *detector*, is what finally closed the case."}], "references": [{"n": 1, "title": "Single Electron Charging Effects in Quantum Dot Nanostructures.", "authors": ["Arvind Kumar"], "year": 1994, "venue": "DSpace@MIT (Massachusetts Institute of Technology)", "url": "https://openalex.org/W1675426612", "cited_by": 1, "bucket": "earliest"}, {"n": 2, "title": "Aspects of independence and determinacy in QM and realism", "authors": ["Philip W. Hoffmann"], "year": 1999, "venue": "PRISM (University of Calgary)", "url": "https://doi.org/10.11575/prism/23560", "cited_by": 0, "bucket": "earliest"}, {"n": 3, "title": "Geometric Phases and Topological Quantum Computation", "authors": ["Vlatko Vedral"], "year": 2002, "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.48550/arxiv.quant-ph/0212133", "cited_by": 0, "bucket": "earliest"}, {"n": 4, "title": "The de Broglie-Bohm Causal Interpretation of Quantum Mechanics and its Application to some Simple Systems", "authors": ["Caroline Colijn"], "year": 2003, "venue": "UWSpace (University of Waterloo)", "url": "https://openalex.org/W218229250", "cited_by": 2, "bucket": "e function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX

function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}

  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var aka=(D.aliases&&D.aliases.length)?'<div class="aka">'+D.aliases.map(function(a){return '<i>'+esc(a)+'</i>';}).join('')+'</div>':'';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
