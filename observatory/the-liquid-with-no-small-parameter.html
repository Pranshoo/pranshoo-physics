first line, because the coupling is not weak. And yet $\\gamma$ comes out within a factor of order unity of the free value, and the Fermi surface is not merely a bookkeeping device but a measurable object.\n\n### The 1941 move, transplanted\n\nLandau's answer does not come from diagrams. It comes from his own 1941 paper on helium II [2], and the descent is methodological, not technical. There, faced with a liquid at interparticle spacing comparable to the He–He hard core — no small parameter of any kind — Landau refused to compute the spectrum from the Hamiltonian and instead *postulated* it: a phonon branch plus a gapped roton minimum, with the parameters fixed by experiment, and thermodynamics obtained by treating the excitations as a dilute non-interacting gas obeying Bose statistics. Two-fluid hydrodynamics and second sound follow. The postulated-spectrum method was not a shortcut; it was a claim about what is knowable, and it survived quantitative test — by the early 1950s the measured second-sound velocity at low $T$ agreed with the 1941 spectrum and specifically failed to follow from London–Tisza condensate counting [3].\n\nTransplanting this to fermions requires one additional and much stronger assumption, which Landau states and does not defend: switching on the interaction adiabatically produces no level crossing, so the exact eigenstates remain labelled by the free gas's occupation numbers $\\delta n_{\\mathbf p \\sigma}$. The excitations are then *quasiparticles* — not particles, not perturbatively dressed particles, but the surviving one-to-one images of free-gas excitations — and the energy is a functional of their occupations, expanded to second order about the ground state,\n\n$$\\delta E = \\sum_{\\mathbf p \\sigma} \\varepsilon^{0}_{\\mathbf p}\\,\\delta n_{\\mathbf p \\sigma} + \\frac{1}{2}\\sum_{\\mathbf p \\sigma,\\, \\mathbf p' \\sigma'} f_{\\mathbf p \\sigma,\\, \\mathbf p' \\sigma'}\\, \\delta n_{\\mathbf p \\sigma}\\,\\delta n_{\\mathbf p' \\sigma'}.$$\n\nBecause $\\delta n$ is nonzero only in a shell of width $\\sim T$ about $p_F$, the neglected cubic term is small *even when the interaction is strong*. That is the whole trick, and it explains Sommerfeld: the electron liquid behaves like a gas not because the electrons barely interact but because the only states available for scattering are the ones Pauli exclusion has almost entirely eliminated. The first paper [4] extracts from this $m^*/m = 1 + F_1^s/3$, $C \\propto m^* T$, $\\chi \\propto m^*/(1+F_0^a)$, $\\kappa \\propto m^*/(1+F_0^s)$ — the interaction rescales the coefficients and leaves the temperature dependences alone.\n\n### The construction had at least seven authors\n\nWhat is universally called \"Landau Fermi liquid theory\" was assembled between 1956 and 1966 by distinct hands, and the division of labour is unusually clean:\n\n- **1956** — Landau: adiabatic continuity, the functional above, $m^*$, $F_l^{s,a}$, the thermodynamic relations [4].\n- **1957** — Landau: the collisionless kinetic equation solved; **zero sound** predicted at $\\omega/qv_F \u003e 1$ with an anisotropic Fermi-surface distortion, speed set by $F_0^s$, distinct from hydrodynamic first sound. A prediction with no experiment behind it [5].\n- **1957** — **Migdal**: the quasiparticle weight $Z$ identified as the *discontinuity of $n(k)$ at $k_F$* — the only sharp, in-principle-measurable test of whether a system is a Fermi liquid at all, and three years before Luttinger's better-known statement [6].\n- **1958** — **Silin**: the charged liquid. With a $1/r$ tail, $f$ acquires a singular Hartree piece, the $l=0$ zero-sound mode is pushed to $\\omega_p$, and the compressibility relation is modified. Landau's three papers contain no Coulomb treatment; every application to electrons in metals is Silin's structure [7].\n- **1958** — **Pomeranchuk**: stability requires $F_l^{s,a} \u003e -(2l+1)$ in every channel — the boundary of the theory's validity, derived from inside it [8].\n- **1958** — **Abrikosov \u0026 Khalatnikov**: the transport theory. Collision integral with its $1/\\cos(\\theta/2)$ weight, $\\eta \\propto T^{-2}$, $\\kappa \\propto T^{-1}$, the zero-sound↔first-sound crossover at $\\omega\\tau \\sim 1$, and the first systematic confrontation with ³He data. Their 1958 Uspekhi review, not the 1959 English version everyone cites, is the primary document [9].\n- **1959** — Landau, third paper, the one usually omitted from courses: the two-particle vertex $\\Gamma$, the non-commuting $\\omega$- and $q$-limits, the identification $f \\leftrightarrow \\Gamma^{\\omega}$, and the forward-scattering sum rule from antisymmetry [10]. This is why \"purely phenomenological, later justified by others\" is false as stated.\n- **1960 / 1962** — **Luttinger**: the Fermi volume is fixed by particle number to all orders [11]; then **Nozières \u0026 Luttinger** reconstruct the postulates as perturbation-theoretic identities, Coulomb case included [12].\n- **1966** — **Abel, Anderson \u0026 Wheatley** detect zero sound in liquid ³He: velocity rise and attenuation peak as $\\omega\\tau$ passes through unity [13]. Ten years from postulate to mode.\n- **1966** — **Pines \u0026 Nozières** canonize it in English; \"Landau parameters,\" \"Landau interaction function,\" \"normal Fermi liquid\" acquire their fixed meanings there, not in Landau's papers [14].\n\n### What the Nobel record actually says\n\nThe 1962 prize to Landau reads \"for his pioneering theories for condensed matter, especially liquid helium\" [15] — that is the 1941 He-II work [2], not the Fermi liquid papers, which were then four to six years old and whose microscopic status Luttinger and Nozières were still arguing over. After the 7 January 1962 car crash Landau could not travel; the medal was handed over at the Swedish Embassy in Moscow and **no Nobel lecture was ever delivered** [15, 16]. The archaeological consequence is severe and permanent: there exists no authorial retrospective in which Landau explains how he arrived at the quasiparticle construction. Every account of his reasoning — including the standard story that he generalized from He-II — is second-hand, transmitted through the Khalatnikov circle and the memorial literature [17].\n\nSources: [Nobel Prize in Physics 1962 — Presentation Speech](https://www.nobelprize.org/prizes/physics/1962/ceremony-speech/), [Larsson \u0026 Balatsky, arXiv:1606.04939](https://arxiv.org/pdf/1606.04939)"}, {"id": "the-construction", "title": "The Construction, Assumption by Assumption: δE = Σ ε⁰δn + ½Σ f δn δn", "markdown": "## The Construction, Assumption by Assumption: δE = Σ ε⁰δn + ½Σ f δn δn\n\nThe 1956 paper [4] contains no Hamiltonian. It contains a *labelling scheme* and a *functional*. Everything else — masses, susceptibilities, sound modes, lifetimes — is extracted from those two objects plus the Pauli principle. Below, the construction is rebuilt with each load-bearing premise numbered, because §3 dismantles them one at a time.\n\n### The labelling\n\n**A1 (adiabatic continuity).** Switch on the interaction at rate slow compared to $\\hbar/\\Delta E$ but fast compared to $\\hbar/\\Gamma$. Assume no level crossing occurs: each eigenstate of the interacting system inherits the quantum numbers $(\\mathbf{p},\\sigma)$ of a free-gas eigenstate. This is not weak coupling and not an expansion — Landau needed no small parameter precisely because he asserted this outright. The *name* is Anderson's [18]; Landau states the correspondence without christening it.\n\n**A2 (sharp Fermi surface, finite residue).** The single-particle Green function retains a pole, $G(\\mathbf{p},\\omega) \\simeq Z/(\\omega - \\xi_\\mathbf{p}^* + i\\,\\mathrm{sgn}\\,\\xi\\,\\Gamma)$, with\n$$Z^{-1} = 1 - \\left.\\frac{\\partial \\Sigma}{\\partial \\omega}\\right|_{\\mu},\\qquad Z = n(k_F^-) - n(k_F^+) \u003e 0.$$\nThe identification of $Z$ with the *jump in the ground-state momentum distribution* is Migdal's, 1957 [6] — three years before Luttinger's better-known version [11]. This is the theory's one sharp, in-principle-measurable diagnostic, and the only one the modern literature routinely skips.\n\nGiven A1–A2, the state is specified by $\\delta n_{\\mathbf{p}\\sigma} = n_{\\mathbf{p}\\sigma} - n^0_{\\mathbf{p}\\sigma}$, and one *postulates* the energy as a functional of it.\n\n### The functional\n\n**A3 (quadratic truncation).** Expand:\n$$\\delta E = \\sum_{\\mathbf{p}\\sigma}\\varepsilon^0_{\\mathbf{p}}\\,\\delta n_{\\mathbf{p}\\sigma} \\;+\\; \\tfrac12 \\sum_{\\mathbf{p}\\sigma,\\mathbf{p}'\\sigma'} f_{\\mathbf{p}\\sigma,\\mathbf{p}'\\sigma'}\\,\\delta n_{\\mathbf{p}\\sigma}\\,\\delta n_{\\mathbf{p}'\\sigma'} + O(\\delta n^3).$$\nCubic terms are down by a further $T/E_F$ *only because* $\\delta n$ is supported in a shell $|\\varepsilon - \\mu| \\lesssim T \\ll E_F$. Outside that shell the truncation has no justification whatsoever. The quasiparticle energy is the functional derivative $\\tilde\\varepsilon_\\mathbf{p} = \\delta E/\\delta n_\\mathbf{p}$ — so the \"energy\" is state-dependent, and the theory is intrinsically self-consistent, not a band structure.\n\n**A4 (short-ranged $f$).** With $|\\mathbf{p}|,|\\mathbf{p}'|$ pinned to $k_F$, $f$ depends only on the angle and spin: $f_{\\mathbf{p}\\sigma,\\mathbf{p}'\\sigma'} = f^s(\\theta) + \\boldsymbol\\sigma\\!\\cdot\\!\\boldsymbol\\sigma' f^a(\\theta)$, expandable in Legendre polynomials. A $1/r$ tail makes $f^s_{q\\to0}$ divergent and this expansion illegal; Silin's 1958 repair [7] splits off the singular Hartree piece and is what every metallic application actually uses.\n\n**A5 (rotational + Galilean invariance).** Dimensionless parameters $F_l^{s,a} = N(0) f_l^{s,a}$ with $N(0) = m^*k_F/\\pi^2\\hbar^3$. Galilean invariance gives the current-carrying identity $\\mathbf{p}/m = \\mathbf{v}_\\mathbf{p} + \\sum f\\,\\partial n/\\partial \\mathbf{p}'$, hence\n$$\\frac{m^*}{m} = 1 + \\frac{F_1^s}{3}.$$\nThis relation and this relation *alone* needs A5. In a lattice it is simply false; $\\chi$ and $\\kappa$ below survive without it.\n\n### The three thermodynamic ratios\n\nCounting states in the shell with the renormalized density of states gives $C = \\gamma T$, $\\gamma \\propto m^* $ — no $F_l$ at all, because $\\delta n$ is isotropic and averages against $f_0$ with zero net weight in the entropy. For the static responses, the shift in $\\tilde\\varepsilon$ back-reacts and screens the applied field:\n$$\\chi = \\frac{\\mu_B^2 N(0)}{1 + F_0^a}, \\qquad \\frac{1}{\\kappa} = n^2\\frac{\\partial\\mu}{\\partial n} = \\frac{n^2}{N(0)}\\big(1 + F_0^s\\big),$$\neach $\\propto m^*$ through $N(0)$. **A8 (stability):** Pomeranchuk [8] — positivity of these responses in every channel requires $F_l^{s,a} \u003e -(2l+1)$; at the boundary the Fermi surface spontaneously deforms ($l{=}0$ antisymmetric → ferromagnetism, $l{=}2$ → nematic).\n\n### Dynamics: the collisionless equation and zero sound\n\n**A6 (codimension-1 Fermi surface, $d \\ge 2$).** Pauli phase space for a decay $\\mathbf{p}\\to\\mathbf{p}_1\\mathbf{p}_2\\mathbf{p}_3$ restricted to a surface of codimension one yields\n$$\\frac{1}{\\tau_{qp}} \\propto (\\varepsilon-\\mu)^2 + (\\pi k_BT)^2,$$\nso $\\Gamma/\\tilde\\varepsilon \\to 0$ as $\\varepsilon\\to\\mu$: the excitation is asymptotically sharp. This is *self-consistency*, not derivation — the quasiparticle earns its own existence.\n\nLinearizing the transport equation and dropping the collision integral (valid when $\\omega\\tau \\gg 1$) gives Landau's 1957 kinetic equation [5]:\n$$(\\omega - \\mathbf{q}\\!\\cdot\\!\\mathbf{v}_F)\\,\\delta n_\\mathbf{p} = \\mathbf{q}\\!\\cdot\\!\\mathbf{v}_F\\,\\frac{\\partial n^0}{\\partial \\varepsilon}\\sum_{\\mathbf{p}'} f_{\\mathbf{p}\\mathbf{p}'}\\,\\delta n_{\\mathbf{p}'}.$$\nKeeping only $F_0^s$, the eigenvalue condition is\n$$\\frac{s}{2}\\ln\\frac{s+1}{s-1} - 1 = \\frac{1}{F_0^s},\\qquad s \\equiv \\frac{\\omega}{qv_F} \u003e 1,$$\nwhich has a solution only for $F_0^s \u003e 0$. The mode lies *outside* the particle–hole continuum — hence undamped — and its Fermi surface distortion is anisotropic (elongated along $\\mathbf{q}$), unlike first sound's rigid displacement. Observed in ³He in 1966 through the velocity rise and attenuation peak at $\\omega\\tau \\sim 1$ [13].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eZero sound outside the particle-hole continuum\u003c/title\u003e\u003cline x1=\"70\" y1=\"350\" x2=\"660\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"70\" y1=\"350\" x2=\"70\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"640\" y=\"378\" fill=\"#e8e6e1\" font-size=\"16\"\u003eq\u003c/text\u003e\u003ctext x=\"30\" y=\"50\" fill=\"#e8e6e1\" font-size=\"16\"\u003eω\u003c/text\u003e\u003cpath d=\"M70 350 L560 130 L560 350 Z\" fill=\"#7aa2ff\" fill-opacity=\"0.18\" stroke=\"none\"/\u003e\u003cline x1=\"70\" y1=\"350\" x2=\"560\" y2=\"130\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"330\" y=\"270\" fill=\"#7aa2ff\" font-size=\"15\"\u003eparticle–hole continuum\u003c/text\u003e\u003ctext x=\"330\" y=\"292\" fill=\"#7aa2ff\" font-size=\"15\"\u003e(Landau damping: ω \u0026lt; q v_F)\u003c/text\u003e\u003ctext x=\"415\" y=\"192\" fill=\"#7aa2ff\" font-size=\"14\"\u003eω = q v_F (s = 1)\u003c/text\u003e\u003cline x1=\"70\" y1=\"350\" x2=\"560\" y2=\"72\" stroke=\"#ffb86b\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"452\" y=\"88\" fill=\"#ffb86b\" font-size=\"15\"\u003ezero sound: ω = s q v_F, s \u0026gt; 1\u003c/text\u003e\u003cline x1=\"70\" y1=\"350\" x2=\"560\" y2=\"205\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"470\" y=\"238\" fill=\"#7ee0a3\" font-size=\"15\"\u003efirst sound (ωτ ≪ 1)\u003c/text\u003e\u003cline x1=\"250\" y1=\"350\" x2=\"250\" y2=\"60\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"150\" y=\"52\" fill=\"#ff7a90\" font-size=\"14\"\u003eωτ ~ 1 crossover\u003c/text\u003e\u003ctext x=\"88\" y=\"120\" fill=\"#e8e6e1\" font-size=\"14\"\u003ecollisionless\u003c/text\u003e\u003ctext x=\"88\" y=\"140\" fill=\"#e8e6e1\" font-size=\"14\"\u003e(A6 regime)\u003c/text\u003e\u003ctext x=\"272\" y=\"120\" fill=\"#e8e6e1\" font-size=\"14\"\u003ehydrodynamic\u003c/text\u003e\u003ctext x=\"272\" y=\"140\" fill=\"#e8e6e1\" font-size=\"14\"\u003e(collisions restore local equilibrium)\u003c/text\u003e\u003ctext x=\"70\" y=\"395\" fill=\"#e8e6e1\" font-size=\"14\"\u003eLeft of the red line: collisions too rare to equilibrate — the orange mode exists. Right: it is replaced by the green one.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The zero-sound branch must lie above $\\omega = qv_F$ (requires $F_0^s\u003e0$) to escape Landau damping in the shaded particle–hole continuum; first sound is the distinct hydrodynamic branch on the other side of $\\omega\\tau\\sim1$.*\n\n### $F_l$ versus $A_l$: the limits do not commute\n\nLandau's third paper [10] — the one usually omitted from courses — supplies the microscopic content. The two-particle vertex $\\Gamma(q,\\omega)$ has a non-commuting double limit from the particle–hole pair propagator:\n$$\\Gamma^\\omega = \\lim_{q\\to0}\\lim_{\\omega\\to0^{-1}}\\!\\!\\Gamma \\;\\;(\\text{take } q\\to 0 \\text{ first, } \\omega/qv_F\\to\\infty), \\qquad \\Gamma^q = \\lim_{\\omega\\to0}\\lim_{q\\to0}\\Gamma.$$\nThe Landau function is the $\\omega$-limit, $f = Z^2\\Gamma^\\omega$: it is the *interaction* between quasiparticles with no induced particle–hole rearrangement. The $q$-limit object is the physical forward-scattering *amplitude*, obtained by resumming the induced response:\n$$A_l^{s,a} = \\frac{F_l^{s,a}}{1 + F_l^{s,a}/(2l+1)}.$$\nThese are not interchangeable, and the distinction is where fits to data most often go wrong. Antisymmetry of the two-quasiparticle state at coincident momenta ($\\mathbf{p}=\\mathbf{p}'$, parallel spins) forces the forward-scattering sum rule\n$$\\sum_l \\left(A_l^{s} + A_l^{a}\\right) = 0,$$\na constraint on the **amplitudes**, never on the $F_l$. Imposing $\\sum_l(F_l^s+F_l^a)=0$ is a silently wrong \"constraint\" that appears in the fitting literature.\n\n**A7 (no new broken symmetry).** Nothing above survives if the true ground state breaks a symmetry the free gas possesses — and the BCS channel guarantees it does, for arbitrarily weak attraction. Landau's construction describes the *normal* state only, a fact invisible in his papers and made explicit only by the RG reformulation [19], where forward scattering is exactly marginal and pairing marginally relevant."}, {"id": "failure-modes", "title": "Where the Construction Voids Itself: A1–A8 Violated One at a Time", "markdown": "## Where the Construction Voids Itself: A1–A8 Violated One at a Time\n\nThe functional of §2 is not fragile in a uniform way. Some assumptions degrade smoothly and can be repaired by adding a term; others fail *categorically*, and when they do the entire labelling scheme — not just a coefficient — is void. The distinction matters because the literature routinely treats every failure as if it were the first kind.\n\n### A1 (adiabatic continuity): the categorical failures\n\nA1 asserts a one-to-one map between the eigenstates of $H_0$ and those of $H_0 + \\lambda V$ as $\\lambda: 0 \\to 1$, with no level crossing. It is not a weak-coupling statement and admits no expansion parameter, which is exactly why Landau needed none [4]. Its failures are therefore binary.\n\n**One dimension.** In $d=1$ the Fermi \"surface\" is two points, and the phase-space kinematics that suppress decay in 3D instead make particle–hole excitations degenerate with the single-particle pole. The pole is destroyed outright: $Z=0$ identically, and\n\n$$ n(k) - n(k_F) \\sim -\\,\\mathrm{sgn}(k-k_F)\\,|k-k_F|^{\\alpha}, \\qquad \\alpha = \\tfrac{1}{4}\\!\\left(K + K^{-1} - 2\\right), $$\n\na power law rather than a jump, with $K$ the Luttinger parameter ($K=1$ free, $K\u003c1$ repulsive). Charge and spin propagate at different velocities $v_\\rho \\neq v_\\sigma$, so a single-electron injection fractionalizes; there is no object that carries both quantum numbers at a common velocity. The physics is Tomonaga's (1950), rediscovered by Luttinger (1963) with an error in the Fermi-sea filling corrected by Mattis and Lieb (1965); the fixed point and its universality were named and stated by Haldane in 1981 [20]. Note the exponent's structure: $\\alpha \\geq 0$ with equality only at $K=1$, so *any* nonzero forward-scattering interaction kills $Z$. Nothing is \"almost\" a Fermi liquid in 1D. (See also the Anderson–Haldane dispute over how far the low-dimensional lesson extends [21].)\n\n**Quantum critical points.** Coupling the Fermi surface to a gapless bosonic order-parameter fluctuation gives, at the Hertz–Millis level, $\\mathrm{Im}\\,\\Sigma \\sim |\\omega|^{2/3}$ for a $z=3$ (Ising-nematic, gauge-field) problem in $d=2$ — the self-energy dominates the bare $\\omega$ term, so $Z \\to 0$ logarithmically or as a power on approach, and the quasiparticle is not merely short-lived but absent. Marginal Fermi liquid phenomenology, $\\mathrm{Im}\\,\\Sigma \\sim \\max(|\\omega|,T)$, is the borderline case: $Z \\sim 1/\\ln$, vanishing at the Fermi surface while the Fermi surface itself remains sharp. Luttinger's volume theorem [11] can survive where $Z$ does not — the two are logically independent, and conflating them is common.\n\n**Broken symmetry and topological order.** If the interacting ground state breaks a symmetry the free gas possesses (magnetism, CDW, superconductivity), the map to the free spectrum does not exist — the level crossing is the transition. In topologically ordered states the free gas's quantum numbers are not even the right labels: excitations carry fractional charge and anyonic statistics with no free-fermion preimage. Anderson's contribution was to name A1 as a *principle* and thereby make this catalogue statable [18].\n\n### A7 (no pairing instability): always false for attraction\n\nThe renormalization-group reformulation [19] settles this cleanly. Scale toward the Fermi surface with a shell $|\\varepsilon_k| \u003c \\Lambda$; tree-level power counting of four-fermion couplings $u(k_1,k_2,k_3,k_4)$ shows that generic couplings are *irrelevant* — the constraint that all four momenta lie in the shell costs phase space linearly in $\\Lambda$. Two exceptions survive:\n\n| channel | kinematics | scaling | identity |\n|---|---|---|---|\n| forward scattering | $k_3 = k_1,\\ k_4 = k_2$ | exactly marginal | the Landau parameters $F_l^{s,a}$ |\n| BCS | $k_2 = -k_1,\\ k_4 = -k_3$ | marginal at tree level | $V_l$, flowing at one loop |\n\nThe one-loop flow in the pairing channel is $dV_l/d\\ell = -V_l^2$, so $V_l \u003c 0$ (attractive) is *marginally relevant*: $V_l(\\ell) = V_l(0)/[1 + V_l(0)\\ell]$ diverges at $\\ell^* = 1/|V_l(0)|$, i.e. $T_c \\sim \\Lambda e^{-1/|V_l(0)|}$. However weak the attraction, however clean the $T^2$ transport above $T_c$, the Fermi liquid is not the $T=0$ state. A7 is not an assumption that sometimes fails; it is a statement that is false in any system with net attraction in *some* angular momentum channel, and only the exponentially small $T_c$ hides it.\n\nThe same calculation supplies what Landau lacked. The small parameter is $\\Lambda/k_F$ — the dimensionless shell thickness — furnished in 1994 [19], thirty-eight years after [4]. This both rescued and bounded the theory: rescued, because the Landau functional's quadratic truncation is now *derived* (cubic and higher terms in $\\delta n$ are irrelevant by the same power counting) rather than posited; bounded, because the derivation is a statement about an infinitesimal shell, and says nothing about physics at scale $k_F$ itself, nor about the two marginal directions it identifies.\n\n### A3, A4, A5, A6: the graded failures\n\n**A3 (quadratic truncation).** $\\delta E = \\sum \\varepsilon^0 \\delta n + \\tfrac12 \\sum f\\,\\delta n\\,\\delta n$ discards $O(\\delta n^3)$. RG justifies this when $\\delta n$ is confined to a thin shell, i.e. $T/T_F \\ll 1$ and no soft boson. Near a QCP the order-parameter fluctuation makes the effective $f$ itself $q$- and $\\omega$-dependent and singular — $f_{l}(q) \\sim 1/(q^2 + \\xi^{-2})$ — at which point the \"constants\" $F_l$ are not constants and the cubic terms are no longer small in the relevant channel. Fits that extract a single $F_0^s$ from data taken across a critical fan are extracting an average of a divergent function.\n\n**A4 (short-ranged $f$).** False in any metal. With a $1/r$ tail, $f_{\\mathbf{k}\\mathbf{k}'}^s$ acquires a singular Hartree piece $4\\pi e^2/q^2$ that has no Legendre expansion; Silin's resolution is to split $f = 4\\pi e^2/q^2 + \\tilde f$ and expand only $\\tilde f$ [7]. The consequences are structural: the $l=0$ charge mode is pushed to $\\omega_p$ (the metallic \"zero sound\" is the plasmon), the compressibility relation is modified, and what remains as a low-lying Landau collective mode lives in the spin channel ($F_0^a$) and at $l \\geq 1$. Everything called \"Landau theory of the electron liquid\" is Landau–Silin [7]; see also the systematic treatment in [22].\n\n**A5 (Galilean invariance).** $m^*/m = 1 + F_1^s/3$ is a *consequence of momentum conservation*, derived by equating the quasiparticle current to the total momentum. A lattice breaks continuous translation invariance; only quasi-momentum is conserved, the current operator is $\\partial \\varepsilon/\\partial \\mathbf{k}$ with a band structure in it, and the relation fails — $m^*$ then contains a band contribution and an interaction contribution that the $F_1^s$ formula cannot separate. Quoting $F_1^s = 3(m^*/m - 1)$ from a heavy-fermion specific heat is a category error. Note the corollary in the other direction: a Galilean-invariant Fermi liquid also has *zero* d.c. resistivity, so $\\rho \\propto T^2$ in a metal is a statement about umklapp, not about $Z$.\n\n**A6 (dimension $d \\geq 3$).** The Pauli phase-space argument giving $1/\\tau \\propto (\\varepsilon-\\mu)^2 + (\\pi T)^2$ is marginal at $d=2$: the integration over the final-state manifold picks up an extra logarithm, so $1/\\tau \\sim T^2 \\ln(T_F/T)$. This is a *correction*, not a breakdown — $Z$ stays finite, the pole survives, and $\\lim_{T\\to 0} (1/\\tau)/T \\to 0$ still holds, so 2D is a Fermi liquid with a log. The failure at $d=1$ is not the endpoint of this trend; it is a different mechanism.\n\n**A8 (stability).** Landau's construction is stable only where Pomeranchuk's conditions hold [8]:\n\n$$ F_l^{s,a} \u003e -(2l+1) \\quad \\text{for all } l. $$\n\nSaturation is a zero-energy Fermi-surface deformation in channel $l$. $F_0^a \\to -1$ is the ferromagnetic Stoner point ($\\chi \\propto m^*/(1+F_0^a)$ diverges); $F_0^s \\to -1$ is a compressibility divergence, i.e. phase separation; $F_2^s \\to -5$ is the electronic nematic — a spontaneous elliptical distortion breaking the point group while preserving translations. The important reading: A8 is the *only* assumption the theory audits internally. It tells you where the Fermi surface deforms, but says nothing about whether the quasiparticles survive the deformation, and in general — as the $z=3$ boson coupled to the Fermi surface at a nematic QCP shows — they do not. The instability that A8 predicts is precisely a place where A1 fails, which is why the two cannot be checked independently."}, {"id": "signatures", "title": "Smoking Guns and Circumstantial Evidence", "markdown": "## Smoking Guns and Circumstantial Evidence\n\nThe construction of §2 makes exactly four kinds of statement that can be falsified without auxiliary assumptions: (i) the ground-state momentum distribution has a finite jump at $k_F$; (ii) the volume enclosed by the Fermi surface is fixed by particle number alone; (iii) the collisionless limit supports a distinct collective mode with a specific crossover signature; (iv) the forward-scattering amplitudes obey an antisymmetry sum rule. Everything else routinely offered as evidence — $C/T$, $\\chi$, $m^*$, $AT^2$, Kadowaki–Woods — is a consequence the theory shares with several structurally different systems. The distinction is not pedantry: the direct tests fail *categorically* when the premise fails, while the circumstantial ones survive the failure intact. A Luttinger liquid has $C \\propto T$, a finite $\\chi$, and can be arranged to show a $T^2$ transport window; what it does not have is $Z \u003e 0$.\n\n### The four direct tests\n\n**Z, the jump in $n(k)$.** This is Migdal's definition, 1957 [6]: for a system with a quasiparticle pole,\n\n$$n(k_F^-) - n(k_F^+) = Z = \\left|1 - \\left.\\frac{\\partial \\Sigma}{\\partial\\omega}\\right|_{k_F,\\,\\omega=0}\\right|^{-1},$$\n\nand $Z = 0$ is not a small number but a different phase. In 1D the jump is replaced by $|k-k_F|^\\alpha$ with no discontinuity at all [20]. The measurement is hard because $n(k)$ is not a spectroscopic quantity: one measures the Compton profile $J(p_z) = \\int n(\\mathbf{k})\\,dk_x dk_y$, whose derivative carries the jump as a kink, and then must strip core electrons, final-state (Lock–Crisp–West) corrections, and the resolution smearing that turns a step into a broadened sigmoid. This was done to competitive precision in a metal only in 2010, on sodium, giving $Z \\approx 0.6$ in agreement with QMC and $G_0W_0$ for the electron gas at the same $r_s$ [23]. That is the entire experimental base for the theory's defining observable in a simple metal — one element, one paper, fifty-four years after [4].\n\n**Luttinger's volume.** The enclosed volume is interaction-independent to all orders [11], which makes it a null test: quantum oscillations or ARPES giving a Fermi volume inconsistent with the chemical count (after honest accounting for band folding, surface states, and the number of carriers actually donated) is a violation of a theorem, not a fitting discrepancy. The failure mode is well defined — a \"small\" Fermi surface in a Kondo-breakdown or fractionalized phase — and it is one of the very few places where the theory can be killed by a number rather than by an exponent.\n\n**Zero sound.** Landau predicted a collisionless mode with $\\omega/qv_F \u003e 1$ set by $F_0^s$, with an anisotropic Fermi-surface distortion [5]. The signature is not the mode's existence but the *crossover*: as $\\omega\\tau$ passes through unity the sound velocity rises from $c_1$ to $c_0$ and the attenuation peaks. That double signature — rise plus peak, both at the same $\\omega\\tau$ — is what Abel, Anderson and Wheatley measured in $^3$He in 1966 [13], and it is far harder to counterfeit than any thermodynamic exponent, because a spurious mechanism must reproduce a velocity change and a dissipation maximum at a single tunable point. In a charged liquid this test is unavailable in the $l=0$ charge channel: the Coulomb tail drives that mode to $\\omega_p$ [7]. Metals must look for it in the spin channel or at higher $l$.\n\n**The sum rule.** From antisymmetry of the forward-scattering vertex [10],\n\n$$\\sum_l \\left(A_l^s + A_l^a\\right) = 0, \\qquad A_l^{s,a} = \\frac{F_l^{s,a}}{1 + F_l^{s,a}/(2l+1)}.$$\n\nThis is a consistency test on an extracted parameter set, and it is imposed on the *amplitudes*, not the $F$'s — the standard error flagged in §3. A set of $F_l$ fitted to $C$, $\\chi$ and $\\kappa$ that cannot be completed to a sum-rule-satisfying $\\{A_l\\}$ is telling you the truncation is wrong.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDirect versus circumstantial evidence for a Fermi liquid\u003c/title\u003e\u003ctext x=\"20\" y=\"26\" fill=\"#e8e6e1\" font-size=\"16\" font-weight=\"bold\"\u003eDIRECT — void if adiabatic continuity fails\u003c/text\u003e\u003crect x=\"16\" y=\"38\" width=\"330\" height=\"196\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.6\" rx=\"6\"/\u003e\u003ctext x=\"30\" y=\"64\" fill=\"#7ee0a3\" font-size=\"15\"\u003eZ = jump in n(k) at k_F\u003c/text\u003e\u003ctext x=\"44\" y=\"84\" fill=\"#e8e6e1\" font-size=\"14\"\u003eCompton / ARPES pole weight [6, 23]\u003c/text\u003e\u003ctext x=\"30\" y=\"112\" fill=\"#7ee0a3\" font-size=\"15\"\u003eLuttinger volume = n\u003c/text\u003e\u003ctext x=\"44\" y=\"132\" fill=\"#e8e6e1\" font-size=\"14\"\u003edHvA frequencies vs carrier count [11]\u003c/text\u003e\u003ctext x=\"30\" y=\"160\" fill=\"#7ee0a3\" font-size=\"15\"\u003ezero → first sound at ωτ ~ 1\u003c/text\u003e\u003ctext x=\"44\" y=\"180\" fill=\"#e8e6e1\" font-size=\"14\"\u003evelocity rise AND attenuation peak [5, 13]\u003c/text\u003e\u003ctext x=\"30\" y=\"208\" fill=\"#7ee0a3\" font-size=\"15\"\u003eΣ(A_l^s + A_l^a) = 0 [10]\u003c/text\u003e\u003ctext x=\"374\" y=\"26\" fill=\"#e8e6e1\" font-size=\"16\" font-weight=\"bold\"\u003eCIRCUMSTANTIAL — survives the failure\u003c/text\u003e\u003crect x=\"370\" y=\"38\" width=\"334\" height=\"196\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.6\" rx=\"6\"/\u003e\u003ctext x=\"384\" y=\"64\" fill=\"#ffb86b\" font-size=\"15\"\u003eC = γT\u003c/text\u003e\u003ctext x=\"398\" y=\"84\" fill=\"#e8e6e1\" font-size=\"14\"\u003eany linear low-energy DOS; phonon subtraction\u003c/text\u003e\u003ctext x=\"384\" y=\"112\" fill=\"#ffb86b\" font-size=\"15\"\u003em* from γ\u003c/text\u003e\u003ctext x=\"398\" y=\"132\" fill=\"#e8e6e1\" font-size=\"14\"\u003eλ_ep, polaron, Kondo — three origins\u003c/text\u003e\u003ctext x=\"384\" y=\"160\" fill=\"#ffb86b\" font-size=\"15\"\u003ePauli-like χ\u003c/text\u003e\u003ctext x=\"398\" y=\"180\" fill=\"#e8e6e1\" font-size=\"14\"\u003eVan Vleck; Curie–Weiss with large θ\u003c/text\u003e\u003ctext x=\"384\" y=\"208\" fill=\"#ffb86b\" font-size=\"15\"\u003eρ = ρ₀ + AT²; A/γ² \u003c/text\u003e\u003cline x1=\"358\" y1=\"44\" x2=\"358\" y2=\"228\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"20\" y=\"272\" fill=\"#e8e6e1\" font-size=\"15\" font-weight=\"bold\"\u003eDiscriminators that promote circumstantial → direct:\u003c/text\u003e\u003ctext x=\"36\" y=\"298\" fill=\"#7aa2ff\" font-size=\"14\"\u003eisotope substitution → separates λ_ep from f-channel mass\u003c/text\u003e\u003ctext x=\"36\" y=\"320\" fill=\"#7aa2ff\" font-size=\"14\"\u003efield / pressure sweep → Schottky and Kondo scales move, γ does not\u003c/text\u003e\u003ctext x=\"36\" y=\"342\" fill=\"#7aa2ff\" font-size=\"14\"\u003edecade count of the ρ(T) fit → \u0026lt;1 decade constrains nothing\u003c/text\u003e\u003ctext x=\"36\" y=\"364\" fill=\"#7aa2ff\" font-size=\"14\"\u003esame F_l from two channels (χ vs zero-sound speed) → tests the functional\u003c/text\u003e\u003ctext x=\"36\" y=\"386\" fill=\"#ff7a90\" font-size=\"14\"\u003enone of these establishes a pole in G; only the green column does\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The evidentiary asymmetry. Left column: observables whose value is defined only if quasiparticles exist. Right column: observables with at least two structurally different producers. Blue lines: manipulations that break the degeneracy of the right column without ever reaching the left.*\n\n### The circumstantial set, and how to break each degeneracy\n\n**$C = \\gamma T$.** Any system with a density of low-energy states linear in energy gives this, fermionic or not — including gapless bosonic sectors and, notably, a Luttinger liquid. Experimentally the extraction is fragile: the lattice term must be subtracted over a range where $\\beta T^3$ is not yet the whole signal, hyperfine/nuclear Schottky tails contaminate the mK regime, and a broad Schottky anomaly from a low-lying doublet mimics an enhanced $\\gamma$ over a decade. *Discriminate by field*: a Schottky feature moves with $B$, a nuclear term scales as $B^2/T^2$, a genuine $\\gamma$ is field-insensitive at small $B$.\n\n**Enhanced $m^*$ from $\\gamma$.** Three unrelated mechanisms produce mass enhancement — electron–phonon $(1+\\lambda_{ep})$, polaronic band narrowing, and Kondo/heavy-fermion hybridization — and Landau's $m^*/m = 1 + F_1^s/3$ is none of them in origin. *Discriminate*: $\\lambda_{ep}$ has an isotope effect and disappears above $\\Theta_D$; the Kondo mass has a coherence temperature that tracks pressure steeply; the $F_1^s$ contribution should be reproducible from an independent measurement in the same channel. Quantum oscillation masses at $T \\ll T_{\\rm coh}$ versus $\\gamma$ is the standard cross-check, and disagreement between them is informative.\n\n**Pauli-like $\\chi$.** A temperature-independent susceptibility is not evidence of $1/(1+F_0^a)$; Van Vleck contributions are also flat, and Curie–Weiss with $|\\theta| \\gg T$ is flat over any narrow window. *Discriminate* by fitting over a range wide enough to expose curvature, and by Knight-shift-versus-$\\chi$ (Clogston–Jaccarino) analysis to isolate the conduction-electron part.\n\n**$\\rho = \\rho_0 + AT^2$.** As established in the credit audit, this tests momentum relaxation, not the pole. Contaminants: the $T^5$ phonon crossover leaves an intermediate window that fits $T^2$; two-band conduction with dissimilar scattering rates generates effective exponents between 1 and 5; weak localization and e-e interaction corrections add $\\pm\\sqrt{T}$ or $\\ln T$ pieces in disordered films. *Discriminate by decade count*: a fit spanning less than one decade in $T$ (equivalently less than two in $\\rho - \\rho_0$) constrains nothing. Report $\\rho_0$, the fit range, and the residuals — a claim of \"$T^2$ to 30 K\" with $\\rho_0$ half the total is a claim about the fitter.\n\n**Kadowaki–Woods $A/\\gamma^2$.** This tests internal coherence between two circumstantial quantities: it asks whether the same $m^*$ appears in transport and thermodynamics, which is a real and useful consistency check on the functional, but it is silent on whether $Z\u003e0$. Its value is diagnostic of *deviation*: an anomalous ratio flags an extra relaxation channel or an unaccounted degeneracy factor, not the absence of quasiparticles.\n\nThe methodological demand follows: extract the same Landau parameter from two independent channels. $F_0^s$ from compressibility and from the zero-sound velocity; $F_0^a$ from $\\chi$ and from the spin-wave/paramagnon dispersion; $F_1^s$ from $\\gamma$ and from de Haas–van Alphen. Agreement is evidence about the functional. Disagreement localizes the failure to a specific $l$ — which is far more information than any single exponent can carry."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: The Exponent That Isn't a Theorem", "markdown": "## Use \u0026 Abuse: The Exponent That Isn't a Theorem\n\nThe theorem is about $\\operatorname{Im}\\Sigma$. On a $(d-1)$-dimensional Fermi surface in $d=3$, Pauli blocking of the two-particle phase space gives\n\n$$\\frac{1}{\\tau_{\\rm qp}(\\varepsilon,T)} \\;=\\; \\frac{1}{\\tau_0}\\Big[(\\varepsilon-\\mu)^2 + (\\pi k_BT)^2\\Big],$$\n\nso that $\\hbar/\\tau_{\\rm qp} \\ll |\\varepsilon-\\mu|$ as $\\varepsilon \\to \\mu$ and the pole in $G$ outruns its own width. That is the self-consistency of assumption A1, and it is the *only* thing the $T^2$ derivation establishes. Nothing in it mentions charge, current, or a field.\n\nGetting from there to $\\rho = \\rho_0 + AT^2$ requires a second, logically independent ingredient: a channel that degrades **total momentum**. Electron–electron collisions conserve $\\sum_i \\mathbf{p}_i$; in a Galilean-invariant system the current operator is proportional to the total momentum, $\\mathbf{j} = (e/m)\\mathbf{P}$, so $[\\,\\mathbf{j}, H\\,]$ is unaffected by the interaction and $\\sigma_{\\rm dc} = \\infty$ no matter how sharp the quasiparticles are. Thermal conductivity and viscosity *do* inherit the $T^{-1}$ and $T^{-2}$ laws — that is exactly why Abrikosov and Khalatnikov could compute $\\eta$ and $\\kappa$ for a neutral ³He liquid [9] and could not have computed a resistivity. A metal acquires $A\u003e0$ only through umklapp, through multiband scattering with band-dependent rates, or through impurity-assisted e–e scattering; and even in a lattice, whether the $T^2$ term survives depends on Fermi-surface geometry — it vanishes identically for a single convex quadratic band in 2D and 3D ([Pal, Yudson \u0026 Maslov](https://arxiv.org/pdf/1204.3591)). Experiment has made the point concrete from the other side: dilute metallic Bi₂O₂Se and SrTiO₃ show clean $T^2$ resistivity with a Fermi surface too small to permit umklapp and no second band ([Wang *et al.*, Nat. Commun. 2020](https://www.nature.com/articles/s41467-020-17692-6); see [Behnia's survey of the amplitude problem](https://onlinelibrary.wiley.com/doi/full/10.1002/andp.202100588)).\n\nThe inferential consequence is blunt. An exponent $n \\neq 2$ in $\\rho \\sim T^n$ is a statement about the momentum-relaxation channel, not about the existence of the pole in $G$. A \"Fermi liquid restored\" announced from a $T^2$ window spanning half a decade in $T$ — 70–200 K, say, in overdoped cuprates whose low-$T$ resistivity carries a substantial $T$-linear term ([Legros *et al.* 2019](https://www.nature.com/articles/s41567-018-0334-2)) — is a fit, not a measurement of anything Landau asserted. The propositions that *are* falsifiable are the ones from §4: the discontinuity $Z$ in $n(k)$ [6, 23], Luttinger's volume [11], the forward-scattering sum rule [10], Kadowaki–Woods consistency between $A$ and $\\gamma^2$, and — sharper than an exponent — the first-Matsubara-frequency rule, which fixes $\\operatorname{Im}\\Sigma$ at $\\omega_n = \\pi T$ independently of the interaction strength (verify).\n\n### Six standing conflations\n\n**$F_l$ vs. $A_l$.** The interaction function lives in the $\\omega$-limit, the scattering amplitude in the $q$-limit, and they are related by\n$$A_l^{s,a} = \\frac{F_l^{s,a}}{1 + F_l^{s,a}/(2l+1)}.$$\nThe Pauli-principle constraint on forward scattering, $\\sum_l (A_l^s + A_l^a) = 0$, is a condition on the **amplitudes** [10]. It is regularly imposed on the $F$'s in fits — a different, and wrong, constraint. The same $\\omega/q$ non-commutation is what makes $m^*/m = 1 + F_1^s/3$ an $\\omega$-limit identity and Pomeranchuk's $F_l \u003e -(2l+1)$ [8] a statement about the pole of $A_l$.\n\n**$Z$ vs. $m^*/m$.** Not two views of \"how correlated\" a system is. With $Z = \\big[1-\\partial_\\omega\\Sigma\\big]^{-1}$ and\n$$\\frac{m}{m^*} = Z\\Big(1 + \\frac{\\partial \\Sigma'}{\\partial \\xi_k}\\Big),$$\nthe identification $Z = m/m^*$ holds only for local (momentum-independent) $\\Sigma$ — the DMFT limit, not a theorem. Momentum-dependent $\\Sigma$ permits $m^*\\to\\infty$ at finite $Z$ and $Z\\to 0$ at bounded $m^*$. In a Galilean-invariant liquid $m^*/m = 1+F_1^s/3$ contains no reference to $Z$ whatsoever [4, 14]. A large $\\gamma$ is not evidence of small spectral weight.\n\n| Conflated | Untangled |\n|---|---|\n| Zero sound = \"the\" Fermi-liquid collective mode | In a neutral liquid the $l=0$ mode is genuine, set by $F_0^s$, seen at $\\omega\\tau\\sim1$ [5, 13]. With a $1/r$ tail the singular Hartree term in $f$ pushes it to $\\omega_p$: in a metal the $l=0$ charge mode **is** the plasmon [7]. What survives at low energy is the spin channel ($F_0^a$, paramagnons) and higher $l$. |\n| \"Migdal's theorem\" | Two theorems, one author. The named one is the $\\omega_D/E_F$ suppression of e–ph vertex corrections; the prior and more foundational — $Z$ = jump in $n(k)$ at $k_F$, 1957 [6] — circulates unnamed. |\n| Luttinger's theorem ↔ Luttinger liquid | A support and a counterexample. The volume theorem [11] survives wherever a pole structure does, in any $d$; the 1D fixed point [20] is where the pole does not survive. Different papers, twenty-one years apart, and the model is Tomonaga's. |\n| Pomeranchuk instability ↔ Pomeranchuk effect | $F_l \u003c -(2l+1)$ Fermi-surface deformation [8] vs. the anomalous ³He melting curve, spin entropy of the solid exceeding the liquid — the latter now invoked for the [isospin Pomeranchuk effect in magic-angle graphene](https://www.nature.com/articles/s41586-021-03319-3). Papers cite one meaning the other. |\n\n### The silent abuse\n\nThe loudest misuse is an exponent; the costlier one is vocabulary. \"Effective mass\", \"Landau parameters\", \"quasiparticle weight\" are carried unchanged into 1D, where $Z=0$ *exactly* and $n(k)$ has a power-law rather than a jump [20, 21]; into the quantum-critical fan, where $Z\\to 0$ and the truncation of $\\delta E$ at second order in $\\delta n$ has no justification because $f$ acquires a singular $q$-dependence; and into symmetry-broken and topologically ordered phases, where no adiabatic map to the free spectrum exists and A1 is not weakened but void [18]. In those regimes the extracted numbers are fit parameters of a functional whose premise has been denied. The RG reformulation supplied the missing small parameter, $\\Lambda/k_F$ [19] — and in the same breath identified the one relevant coupling, BCS, that removes the fixed point for arbitrarily weak attraction. A clean $T^2$ window says nothing about either."}, {"id": "status-and-checklist", "title": "Status: Mutated, Not Dead — and What AETHER Demands", "markdown": "## Status: Mutated, Not Dead — and What AETHER Demands\n\nThe theory's present standing is not one claim but three, and they are usually conflated.\n\n**Canonical, as a fixed point.** Since Shankar and Polchinski, the Fermi liquid is not a postulate but the generic infrared fixed point of a fermionic system with a nonzero Fermi surface [19]. Modes are scaled toward a $(d-1)$-dimensional manifold, the shell thickness $\\Lambda/k_F$ supplies the small parameter Landau never had, and tree-level power counting sorts the four-fermion couplings: all irrelevant except zero-angular-momentum forward scattering — the Landau parameters, exactly marginal — and the BCS channel, marginally relevant for any sign of attraction. Two consequences are structural. First, \"why does the strongly coupled electron gas behave like a gas\" has an answer that is *kinematic*, not perturbative: phase space, not weak coupling. Second, a Fermi liquid is never the true $T=0$ state of an attractive system; the fixed point is unstable in exactly one channel, and it is the channel that produces superconductivity. Any paper reporting \"a clean Fermi liquid\" at $T \\to 0$ is reporting a preasymptotic regime unless it also states why the pairing instability is absent or preempted.\n\n**Mutated, in content.** The load-bearing modern statements are not the ones in the 1956 paper. What survives without qualification are (i) the RG fixed-point statement [19], (ii) Luttinger's volume theorem [11], now with flux-threading/topological proofs that outrun the original diagrammatic one, and (iii) $Z$ as the discontinuity of $n(k)$ at $k_F$ [6, 23]. The energy functional $\\delta E = \\sum \\varepsilon^0 \\delta n + \\tfrac12 \\sum f\\,\\delta n\\,\\delta n$ is best read now as the marginal-coupling parametrization of that fixed point rather than as an independent physical hypothesis. Meanwhile the construction has been extended in directions Landau's neutral $f$ cannot reach: Silin's charged liquid [7, 22]; the Landau–Migdal parameters of nuclear and neutron matter, where the same bookkeeping runs with chiral-Lagrangian input [24, 25]; and Berry Fermi liquid theory [26], where the semiclassical equations of motion acquire Berry curvature and orbital-moment corrections and the Landau kinetic equation is modified at the same order that generates anomalous transport. That last is the cleanest example of the framework mutating rather than dying: the labelling scheme survives, the equations of motion do not.\n\n**Contested, at the boundaries.** Open, honestly: whether strange-metal $T$-linear resistivity with $\\hbar/\\tau \\sim k_BT$ reflects a genuine bound on dissipation or a coincidence of scales — [the Hartnoll–Mackenzie colloquium](https://link.aps.org/doi/10.1103/RevModPhys.94.041002) is explicit that quasiparticle, transport, and many-body times are three different objects and that the \"Planckian bound\" is not a theorem; whether the cuprate pseudogap hosts a Luttinger-volume-*violating* metal, with the carrier count jumping from $p$ to $1+p$ at $p^*$ ([Badoux et al.](https://arxiv.org/pdf/1511.08162), [Kunisada/LvvFL analyses](https://arxiv.org/abs/1109.0406)); whether the 2D Hubbard model has a Fermi-liquid region at all near $1/8$ doping, where state-of-the-art AFQMC/DMRG/PEPS still argue over stripe versus superconducting ground states ([e.g.](https://arxiv.org/pdf/2112.02187), [2025 PEPS](https://arxiv.org/html/2502.13454)) — Anderson's claim that no adiabatic map exists there [18, 21] is neither established nor refuted. Settled: 1D is not a Fermi liquid, exactly and provably, $Z=0$ [20]; the Pomeranchuk conditions $F_l^{s,a} \u003e -(2l+1)$ bound the theory from inside [8]; zero sound exists in ³He [5, 13]; the quasiparticle decay rate $1/\\tau \\propto (\\varepsilon-\\mu)^2 + (\\pi T)^2$ follows from phase space alone.\n\nOn naming: for any charged system — every metal — the correct attribution is **Landau–Silin**. The singular Hartree piece in $f$, the displacement of the $l=0$ mode to $\\omega_p$, the modified compressibility relation, all come from [7], not [4, 5, 10]. The name survives in the Russian and plasma-kinetics literature and has been quietly dropped elsewhere. Similarly, the transport coefficients everyone fits are Abrikosov–Khalatnikov [9], and the canonical vocabulary is Pines–Nozières [14].\n\n### The AETHER checklist\n\nApplied to any manuscript asserting a Fermi liquid, or its death:\n\n1. **Which assumption?** Name which of A1–A8 is invoked and which is claimed violated. \"Non-Fermi liquid\" without an identified broken premise is a mood, not a result.\n2. **Has $Z$ been measured or bounded** — Compton profile [23], ARPES coherent-peak weight with a stated background subtraction, or a direct $n(k)$ — or merely assumed nonzero?\n3. **Luttinger's volume** [11]: does the quoted Fermi-surface area reproduce the stated carrier count, including spin and band degeneracy? If not, is the violation asserted, or an artefact?\n4. **Decades and error bars.** Over how many decades in $T$ does the power law hold, and what is the *fitted* exponent $\\pm$ its uncertainty? A factor of three in $T$ cannot distinguish $T^2$ from $T^{1.6}$.\n5. **Momentum relaxation.** For any $\\rho \\sim T^n$ claim: umklapp, multiband, or impurity-assisted? A Galilean-invariant Fermi liquid has $\\rho_{\\rm dc} = 0$.\n6. **$F_l$ versus $A_l$.** Are they distinguished, and is $\\sum_l (A_l^s + A_l^a) = 0$ applied to the amplitudes, not the interaction parameters [10]?\n7. **Kadowaki–Woods** with the correct degeneracy and dimensionality factors ([Jacko–Fjærestad–Powell](https://www.nature.com/articles/nphys1249)), not the bare $A/\\gamma^2 = 10^{-5}\\,\\mu\\Omega\\,{\\rm cm\\,(mol\\,K/mJ)^2}$.\n8. **Charged?** If yes, is Silin's $f$ used [7], or Landau's neutral one misapplied?\n9. **Collective modes.** Is a mode called \"zero sound\" actually the $l=0$ charge mode — and if so, why is it not the plasmon?\n10. **Adiabatic continuity.** With a broken symmetry or a QCP nearby [27], on what grounds is the one-to-one map to the free spectrum still claimed [18]?\n\nSources: [Hartnoll \u0026 Mackenzie, RMP 94, 041002 (2022)](https://link.aps.org/doi/10.1103/RevModPhys.94.041002); [Phillips, Hussey \u0026 Phillips, Science 377, eabh4273 (2022)](https://www.science.org/doi/10.1126/science.abh4273); [Jacko, Fjærestad \u0026 Powell, Nat. Phys. 5, 422 (2009)](https://www.nature.com/articles/nphys1249); [Badoux et al., arXiv:1511.08162](https://arxiv.org/pdf/1511.08162); [Xu et al., arXiv:2112.02187](https://arxiv.org/pdf/2112.02187)."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\n### (a) What I will defend\n\nThree propositions, and I would stake my name on them.\n\nFirst: **Luttinger's volume theorem [11] is the most robust statement in this entire subject** — more robust than the quasiparticle itself. It survives where the pole does not, it has a flux-threading argument independent of the perturbation expansion that Luttinger used, and its violations are informative rather than embarrassing. If I had to keep one equation from the whole edifice, it is $n = 2\\int_{\\varepsilon(\\mathbf k)\u003c\\mu} d^3k/(2\\pi)^3$, not $m^*/m = 1+F_1^s/3$.\n\nSecond: **the quasiparticle decay rate $\\operatorname{Im}\\Sigma \\propto \\max(\\varepsilon^2,(\\pi T)^2)$ is a phase-space theorem, not a model**, and it is the reason the construction is self-consistent at all: the width vanishes faster than the energy, so the labels of §2 refer to something. Landau's own third paper [10] already contains the analytic structure that makes this a statement about the vertex and not a hand-wave, which is why I reject the standard \"phenomenology later justified by others\" story.\n\nThird: **the RG reformulation [19] is the correct modern statement of what the theory is** — a fixed point with an explicit small parameter (the shell thickness $\\Lambda/k_F$) that Landau never had, and exactly one relevant coupling, the BCS channel. That last point is not a footnote. It means no attractive system is a Fermi liquid at $T=0$, however clean the $T^2$ looks.\n\nAnd I will defend the negative claim hardest of all: **$\\rho \\propto T^2$ is not a diagnostic of anything.** A Galilean-invariant Fermi liquid has zero d.c. resistivity. The exponent measures momentum-relaxation channels — umklapp, multiband, impurity-assisted — and the field's habit of reading $n$ in $\\rho \\sim T^n$ as a verdict on quasiparticle existence is the single most expensive error in correlated-electron experiment.\n\n### (b) What is shakier than admitted\n\nName the assumptions, not the mood.\n\n**A: The second-order truncation of $\\delta E$.** The functional keeps $f\\,\\delta n\\,\\delta n$ and drops everything higher. This is justified only if $\\delta n$ is confined to a shell $\\sim T/E_F$. Every application of \"Landau parameters\" at $T/T_F \\sim 0.1$ — most of the heavy-fermion literature — is outside the regime where the truncation is controlled, and nobody reports the neglected cubic term.\n\n**B: One-to-one labelling under adiabatic switching.** Not weak coupling, not an approximation: an assumption of no level crossing. It has never been proven for any interacting continuum model in $d\u003e1$. It is *assumed*, then confirmed a posteriori by the fact that the answers work. That is respectable physics and it is not a theorem.\n\n**C: $F_l \\to 0$ at large $l$.** Fits truncate at $l=1$, occasionally $l=2$, and the truncation is never justified — it is a fitting convenience wearing a theoretical costume. Combined with the routine misapplication of the Pauli sum rule $\\sum_l (A_l^s + A_l^a)=0$ to the $F$'s instead of the $A$'s [10], a substantial fraction of published \"Landau parameters\" are constrained by an identity that does not apply to them.\n\n**D: That $Z$ has been measured.** Once, competitively, in a simple metal, in 2010 [23]. The claim that Fermi liquid theory is \"experimentally established\" rests overwhelmingly on thermodynamic ratios that a non-quasiparticle state with a Fermi surface can also produce.\n\n**E: That $Z$ and $m^*/m$ track together.** They are independent — $Z^{-1} = 1-\\partial_\\omega\\Sigma$, while $m^*/m$ mixes $\\partial_\\omega\\Sigma$ and $\\partial_k\\Sigma$. Large $m^*$ is quoted as evidence of small $Z$ constantly, and it is a non sequitur.\n\n### (c) Three open questions, ranked\n\n1. **Is there a sharp criterion, measurable in a real material, distinguishing $Z\\to 0$ from $Z$ small?** Everything about quantum criticality hangs on whether the residue vanishes or merely shrinks, and no experiment now decides it.\n2. **What replaces the Landau functional when the shell is not thin — i.e. a controlled expansion valid to $T/T_F \\sim 0.1$?** This is where nearly all heavy-fermion and cold-atom data actually live, and we are extrapolating.\n3. **Does Luttinger's volume survive where the pole does not, generically?** If yes, the Fermi surface, not the quasiparticle, is the primitive object, and the theory should be rebuilt around it.\n\n**Reading path:**\n\n1. **Landau 1956 [4]** — read it for what is *absent*: no Hamiltonian, no small parameter, only a labelling and a functional.\n2. **Landau's third paper [10]** — the vertex analyticity and the $\\omega/q$ non-commutation; the refutation of the \"purely phenomenological\" story.\n3. **Silin 1958 [7]** — the charged case, where the $l=0$ mode becomes the plasmon; the paper whose name was absorbed into Landau's.\n4. **Abrikosov–Khalatnikov [9]** — all quantitative transport in the theory, with the $1/\\cos(\\theta/2)$ collision weight derived rather than quoted.\n5. **Shankar [19]** — the reformulation that supplies the missing small parameter and names the one relevant perturbation."}], "references": [{"n": 1, "title": "Zur Elektronentheorie der Metalle auf Grund der Fermischen Statistik", "authors": ["A. Sommerfeld"], "year": 1928, "venue": "Zeitschrift für Physik 47, 1–32", "url": "https://doi.org/10.1007/BF01391052", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Theory of the Superfluidity of Helium II", "authors": ["L. D. Landau"], "year": 1941, "venue": "Physical Review 60, 356 (1941); parallel Russian publication ZhETF 11, 592 (1941)", "url": "https://doi.org/10.1103/PhysRev.60.356", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "VII. On the velocity of second sound in liquid helium ii", "authors": ["H. N. V. Temperley"], "year": 1951, "venue": "The London Edinburgh and Dublin Philosophical Magazine and Journal of Science", <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
