<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Liquid With No Small Parameter", "alternativeHeadline": "Landau Fermi liquid theory", "name": "Landau Fermi liquid theory", "description": "Landau's quasiparticle construction, its five uncredited co-authors, and the one measurement almost nobody makes before pronouncing it dead.", "inLanguage": "en", "keywords": ["Landau Fermi liquid theory", "Fermi-liquid theory", "Landau Fermi liquid theory", "Landau theory of Fermi liquids", "normal Fermi liquid", "quasiparticle theory of metals", "Landau–Silin theory (charged Fermi liquid)", "Landau–Migdal theory of finite Fermi systems (nuclear matter)", "Fermi liquid fixed point (RG formulation)", "Landau kinetic equation / Landau–Boltzmann equation", "condensed matter theory / many-body physics"], "about": [{"@type": "Thing", "name": "Landau Fermi liquid theory"}, {"@type": "Thing", "name": "Fermi-liquid theory"}, {"@type": "Thing", "name": "Landau Fermi liquid theory"}, {"@type": "Thing", "name": "Landau theory of Fermi liquids"}, {"@type": "Thing", "name": "normal Fermi liquid"}, {"@type": "Thing", "name": "quasiparticle theory of metals"}, {"@type": "Thing", "name": "Landau–Silin theory (charged Fermi liquid)"}, {"@type": "Thing", "name": "Landau–Migdal theory of finite Fermi systems (nuclear matter)"}], "articleSection": "condensed matter theory / many-body physics", "datePublished": "2026-08-31", "dateModified": "2026-08-31", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-liquid-with-no-small-parameter.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-liquid-with-no-small-parameter.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Why a Strongly Coupled Electron Gas Behaves Like a Gas: 1941–1966 Why a Strongly Coupled Electron Gas Behaves Like a Gas: 1941–1966 The scandal is Sommerfeld's, and it is older than the theory that resolves it. In 1928 Sommerfeld replaced Drude's Maxwell–Boltzmann electrons with a degenerate Fermi–Dirac gas and immediately recovered the linear electronic specific heat C = \\gamma T, the temperature-independent Pauli susceptibility, and the Wiedemann–Franz ratio with the right Lorenz number . The model treats the conduction electrons as non-interacting . It has no business working. Take the uniform electron gas at metallic density. In rydbergs per particle, so the ratio of interaction to kinetic energy scales as r s itself. Sodium sits at r s \\simeq 3.9: kinetic energy \\approx 0.14 Ry, exchange alone \\approx -0.23 Ry, with correlation on top. The dimensionless coupling is not small — it is larger than one — and the Gell-Mann–Brueckner ring summation, the one honest perturbative treatment, is an expansion about r s \\to 0, i.e. about a density regime no metal occupies. Every attempt to derive Sommerfeld's success from weak coupling fails at the first line, because the coupling is not weak. And yet \\gamma comes out within a factor of order unity of the free value, and the Fermi surface is not merely a bookkeeping device but a measurable object. The 1941 move, transplanted Landau's answer does not come from diagrams. It comes from his own 1941 paper on helium II , and the descent is methodological, not technical. There, faced with a liquid at interparticle spacing comparable to the He–He hard core — no small parameter of any kind — Landau refused to compute the spectrum from the Hamiltonian and instead postulated it: a phonon branch plus a gapped roton minimum, with the parameters fixed by experiment, and thermodynamics obtained by treating the excitations as a dilute non-interacting gas obeying Bose statistics. Two-fluid hydrodynamics and second sound follow. The postulated-spectrum method was not a shortcut; it was a claim about what is knowable, and it survived quantitative test — by the early 1950s the measured second-sound velocity at low T agreed with the 1941 spectrum and specifically failed to follow from London–Tisza condensate counting . Transplanting this to fermions requires one additional and much stronger assumption, which Landau states and does not defend: switching on the interaction adiabatically produces no level crossing, so the exact eigenstates remain labelled by the free gas's occupation numbers \\delta n {\\mathbf p \\sigma}. The excitations are then quasiparticles — not particles, not perturbatively dressed particles, but the surviving one-to-one images of free-gas excitations — and the energy is a functional of their occupations, expanded to second order about the ground state, Because \\delta n is nonzero only in a shell of width \\sim T about p F, the neglected cubic term is small even when the interaction is strong . That is the whole trick, and it explains Sommerfeld: the electron liquid behaves like a gas not because the electrons barely interact but because the only states available for scattering are the ones Pauli exclusion has almost entirely eliminated. The first paper extracts from this m^ /m = 1 + F 1^s/3, C \\propto m^ T, \\chi \\propto m^ /(1+F 0^a), \\kappa \\propto m^ /(1+F 0^s) — the interaction rescales the coefficients and leaves the temperature dependences alone. The construction had at least seven authors What is universally called \"Landau Fermi liquid theory\" was assembled between 1956 and 1966 by distinct hands, and the division of labour is unusually clean: - 1956 — Landau: adiabatic continuity, the functional above, m^ , F l^{s,a}, the thermodynamic relations . - 1957 — Landau: the collisionless kinetic equation solved; zero sound predicted at \\omega/qv F 1 with an anisotropic Fermi-surface distortion, speed set by F 0^s, distinct from hydrodynamic first sound. A prediction with no experiment behind it . - 1957 — Migdal : the quasiparticle weight Z identified as the discontinuity of n(k) at k F — the only sharp, in-principle-measurable test of whether a system is a Fermi liquid at all, and three years before Luttinger's better-known statement . - 1958 — Silin : the charged liquid. With a 1/r tail, f acquires a singular Hartree piece, the l=0 zero-sound mode is pushed to \\omega p, and the compressibility relation is modified. Landau's three papers contain no Coulomb treatment; every application to electrons in metals is Silin's structure . - 1958 — Pomeranchuk : stability requires F l^{s,a} -(2l+1) in every channel — the boundary of the theory's validity, derived from inside it . - 1958 — Abrikosov \u0026 Khalatnikov : the transport theory. Collision integral with its 1/\\cos(\\theta/2) weight, \\eta \\propto T^{-2}, \\kappa \\propto T^{-1}, the zero-sound↔first-sound crossover at \\omega\\tau \\sim 1, and the first systematic confrontation with ³He data. Their 1958 Uspekhi review, not the 1959 English version everyone cites, is the primary document . - 1959 — Landau, third paper, the one usually omitted from courses: the two-particle vertex \\Gamma, the non-commuting \\omega- and q-limits, the identification f \\leftrightarrow \\Gamma^{\\omega}, and the forward-scattering sum rule from antisymmetry . This is why \"purely phenomenological, later justified by others\" is false as stated. - 1960 / 1962 — Luttinger : the Fermi volume is fixed by particle number to all orders ; then Nozières \u0026 Luttinger reconstruct the postulates as perturbation-theoretic identities, Coulomb case included . - 1966 — Abel, Anderson \u0026 Wheatley detect zero sound in liquid ³He: velocity rise and attenuation peak as \\omega\\tau passes through unity . Ten years from postulate to mode. - 1966 — Pines \u0026 Nozières canonize it in English; \"Landau parameters,\" \"Landau interaction function,\" \"normal Fermi liquid\" acquire their fixed meanings there, not in Landau's papers . What the Nobel record actually says The 1962 prize to Landau reads \"for his pioneering theories for condensed matter, especially liquid helium\" — that is the 1941 He-II work , not the Fermi liquid papers, which were then four to six years old and whose microscopic status Luttinger and Nozières were still arguing over. After the 7 January 1962 car crash Landau could not travel; the medal was handed over at the Swedish Embassy in Moscow and no Nobel lecture was ever delivered [15, 16]. The archaeological consequence is severe and permanent: there exists no authorial retrospective in which Landau explains how he arrived at the quasiparticle construction. Every account of his reasoning — including the standard story that he generalized from He-II — is second-hand, transmitted through the Khalatnikov circle and the memorial literature . Sources: Nobel Prize in Physics 1962 — Presentation Speech, Larsson \u0026 Balatsky, arXiv:1606.04939 The Construction, Assumption by Assumption: δE = Σ ε⁰δn + ½Σ f δn δn The Construction, Assumption by Assumption: δE = Σ ε⁰δn + ½Σ f δn δn The 1956 paper contains no Hamiltonian. It contains a labelling scheme and a functional . Everything else — masses, susceptibilities, sound modes, lifetimes — is extracted from those two objects plus the Pauli principle. Below, the construction is rebuilt with each load-bearing premise numbered, because §3 dismantles them one at a time. The labelling A1 (adiabatic continuity). Switch on the interaction at rate slow compared to \\hbar/\\Delta E but fast compared to \\hbar/\\Gamma. Assume no level crossing occurs: each eigenstate of the interacting system inherits the quantum numbers (\\mathbf{p},\\sigma) of a free-gas eigenstate. This is not weak coupling and not an expansion — Landau needed no small parameter precisely because he asserted this outright. The name is Anderson's ; Landau states the correspondence without christening it. A2 (sharp Fermi surface, finite residue). The single-particle Green function retains a pole, G(\\mathbf{p},\\omega) \\simeq Z/(\\omega - \\xi \\mathbf{p}^ + i\\,\\mathrm{sgn}\\,\\xi\\,\\Gamma), with The identification of Z with the jump in the ground-state momentum distribution is Migdal's, 1957 — three years before Luttinger's better-known version . This is the theory's one sharp, in-principle-measurable diagnostic, and the only one the modern literature routinely skips. Given A1–A2, the state is specified by \\delta n {\\mathbf{p}\\sigma} = n {\\mathbf{p}\\sigma} - n^0 {\\mathbf{p}\\sigma}, and one postulates the energy as a functional of it. The functional A3 (quadratic truncation). Expand: Cubic terms are down by a further T/E F only because \\delta n is supported in a shell \\varepsilon - \\mu \\lesssim T \\ll E F. Outside that shell the truncation has no justification whatsoever. The quasiparticle energy is the functional derivative \\tilde\\varepsilon \\mathbf{p} = \\delta E/\\delta n \\mathbf{p} — so the \"energy\" is state-dependent, and the theory is intrinsically self-consistent, not a band structure. A4 (short-ranged f). With \\mathbf{p} , \\mathbf{p}' pinned to k F, f depends only on the angle and spin: f {\\mathbf{p}\\sigma,\\mathbf{p}'\\sigma'} = f^s(\\theta) + \\boldsymbol\\sigma\\!\\cdot\\!\\boldsymbol\\sigma' f^a(\\theta), expandable in Legendre polynomials. A 1/r tail makes f^s {q\\to0} divergent and this expansion illegal; Silin's 1958 repair splits off the singular Hartree piece and is what every metallic application actually uses. A5 (rotational + Galilean invariance). Dimensionless parameters F l^{s,a} = N(0) f l^{s,a} with N(0) = m^ k F/\\pi^2\\hbar^3. Galilean invariance gives the current-carrying identity \\mathbf{p}/m = \\mathbf{v} \\mathbf{p} + \\sum f\\,\\partial n/\\partial \\mathbf{p}', hence This relation and this relation alone needs A5. In a lattice it is simply false; \\chi and \\kappa below survive without it. The three thermodynamic ratios Counting states in the shell with the renormalized density of states gives C = \\gamma T, \\gamma \\propto m^ — no F l at all, because \\delta n is isotropic and averages against f 0 with zero net weight in the entropy. For the static responses, the shift in \\tilde\\varepsilon back-reacts and screens the applied field: each \\propto m^ through N(0). A8 (stability): Pomeranchuk — positivity of these responses in every channel requires F l^{s,a} -(2l+1); at the boundary the Fermi surface spontaneously deforms (l{=}0 antisymmetric → ferromagnetism, l{=}2 → nematic). Dynamics: the collisionless equation and zero sound A6 (codimension-1 Fermi surface, d \\ge 2). Pauli phase space for a decay \\mathbf{p}\\to\\mathbf{p} 1\\mathbf{p} 2\\mathbf{p} 3 restricted to a surface of codimension one yields so \\Gamma/\\tilde\\varepsilon \\to 0 as \\varepsilon\\to\\mu: the excitation is asymptotically sharp. This is self-consistency , not derivation — the quasiparticle earns its own existence. Linearizing the transport equation and dropping the collision integral (valid when \\omega\\tau \\gg 1) gives Landau's 1957 kinetic equation : Keeping only F 0^s, the eigenvalue condition is which has a solution only for F 0^s 0. The mode lies outside the particle–hole continuum — hence undamped — and its Fermi surface distortion is anisotropic (elongated along \\mathbf{q}), unlike first sound's rigid displacement. Observed in ³He in 1966 through the velocity rise and attenuation peak at \\omega\\tau \\sim 1 . Figure: The zero-sound branch must lie above \\omega = qv F (requires F 0^s 0) to escape Landau damping in the shaded particle–hole continuum; first sound is the distinct hydrodynamic branch on the other side of \\omega\\tau\\sim1. F l versus A l: the limits do not commute Landau's third paper — the one usually omitted from courses — supplies the microscopic content. The two-particle vertex \\Gamma(q,\\omega) has a non-commuting double limit from the particle–hole pair propagator: The Landau function is the \\omega-limit, f = Z^2\\Gamma^\\omega: it is the interaction between quasiparticles with no induced particle–hole rearrangement. The q-limit object is the physical forward-scattering amplitude , obtained by resumming the induced response: These are not interchangeable, and the distinction is where fits to data most often go wrong. Antisymmetry of the two-quasiparticle state at coincident momenta (\\mathbf{p}=\\mathbf{p}', parallel spins) forces the forward-scattering sum rule a constraint on the amplitudes , never on the F l. Imposing \\sum l(F l^s+F l^a)=0 is a silently wrong \"constraint\" that appears in the fitting literature. A7 (no new broken symmetry). Nothing above survives if the true ground state breaks a symmetry the free gas possesses — and the BCS channel guarantees it does, for arbitrarily weak attraction. Landau's construction describes the normal state only, a fact invisible in his papers and made explicit only by the RG reformulation , where forward scattering is exactly marginal and pairing marginally relevant. Where the Construction Voids Itself: A1–A8 Violated One at a Time Where the Construction Voids Itself: A1–A8 Violated One at a Time The functional of §2 is not fragile in a uniform way. Some assumptions degrade smoothly and can be repaired by adding a term; others fail categorically , and when they do the entire labelling scheme — not just a coefficient — is void. The distinction matters because the literature routinely treats every failure as if it were the first kind. A1 (adiabatic continuity): the categorical failures A1 asserts a one-to-one map between the eigenstates of H 0 and those of H 0 + \\lambda V as \\lambda: 0 \\to 1, with no level crossing. It is not a weak-coupling statement and admits no expansion parameter, which is exactly why Landau needed none . Its failures are therefore binary. One dimension. In d=1 the Fermi \"surface\" is two points, and the phase-space kinematics that suppress decay in 3D instead make particle–hole excitations degenerate with the single-particle pole. The pole is destroyed outright: Z=0 identically, and a power law rather than a jump, with K the Luttinger parameter (K=1 free, K\u003c1 repulsive). Charge and spin propagate at different velocities v \\rho \\neq v \\sigma, so a single-electron injection fractionalizes; there is no object that carries both quantum numbers at a common velocity. The physics is Tomonaga's (1950), rediscovered by Luttinger (1963) with an error in the Fermi-sea filling corrected by Mattis and Lieb (1965); the fixed point and its universality were named and stated by Haldane in 1981 . Note the exponent's structure: \\alpha \\geq 0 with equality only at K=1, so any nonzero forward-scattering interaction kills Z. Nothing is \"almost\" a Fermi liquid in 1D. (See also the Anderson–Haldane dispute over how far the low-dimensional lesson extends .) Quantum critical points. Coupling the Fermi surface to a gapless bosonic order-parameter fluctuation gives, at the Hertz–Millis level, \\mathrm{Im}\\,\\Sigma \\sim \\omega ^{2/3} for a z=3 (Ising-nematic, gauge-field) problem in d=2 — the self-energy dominates the bare \\omega term, so Z \\to 0 logarithmically or as a power on approach, and the quasiparticle is not merely short-lived but absent. Marginal Fermi liquid phenomenology, \\mathrm{Im}\\,\\Sigma \\sim \\max( \\omega ,T), is the borderline case: Z \\sim 1/\\ln, vanishing at the Fermi surface while the Fermi surface itself remains sharp. Luttinger's volume theorem can survive where Z does not — the two are logically independent, and conflating them is common. Broken symmetry and topological order. If the interacting ground state breaks a symmetry the free gas possesses (magnetism, CDW, superconductivity), the map to the free spectrum does not exist — the level crossing is the transition. In topologically ordered states the free gas's quantum numbers are not even the right labels: excitations carry fractional charge and anyonic statistics with no free-fermion preimage. Anderson's contribution was to name A1 as a principle and thereby make this catalogue statable . A7 (no pairing instability): always false for attraction The renormalization-group reformulation settles this cleanly. Scale toward the Fermi surface with a shell \\varepsilon k \u003c \\Lambda; tree-level power counting of four-fermion couplings u(k 1,k 2,k 3,k 4) shows that generic couplings are irrelevant — the constraint that all four momenta lie in the shell costs phase space linearly in \\Lambda. Two exceptions survive: channel kinematics scaling identity --- --- --- --- forward scattering k 3 = k 1,\\ k 4 = k 2 exactly marginal the Landau parameters F l^{s,a} BCS k 2 = -k 1,\\ k 4 = -k 3 marginal at tree level V l, flowing at one loop The one-loop flow in the pairing channel is dV l/d\\ell = -V l^2, so V l \u003c 0 (attractive) is marginally relevant : V l(\\ell) = V l(0)/[1 + V l(0)\\ell] diverges at \\ell^ = 1/ V l(0) , i.e. T c \\sim \\Lambda e^{-1/ V l(0) }. However weak the attraction, however clean the T^2 transport above T c, the Fermi liquid is not the T=0 state. A7 is not an assumption that sometimes fails; it is a statement that is false in any system with net attraction in some angular momentum channel, and only the exponentially small T c hides it. The same calculation supplies what Landau lacked. The small parameter is \\Lambda/k F — the dimensionless shell thickness — furnished in 1994 , thirty-eight years after . This both rescued and bounded the theory: rescued, because the Landau functional's quadratic truncation is now derived (cubic and higher terms in \\delta n are irrelevant by the same power counting) rather than posited; bounded, because the derivation is a statement about an infinitesimal shell, and says nothing about physics at scale k F itself, nor about the two marginal directions it identifies. A3, A4, A5, A6: the graded failures A3 (quadratic truncation). \\delta E = \\sum \\varepsilon^0 \\delta n + \\tfrac12 \\sum f\\,\\delta n\\,\\delta n discards O(\\delta n^3). RG justifies this when \\delta n is confined to a thin shell, i.e. T/T F \\ll 1 and no soft boson. Near a QCP the order-parameter fluctuation makes the effective f itself q- and \\omega-dependent and singular — f {l}(q) \\sim 1/(q^2 + \\xi^{-2}) — at which point the \"constants\" F l are not constants and the cubic terms are no longer small in the relevant channel. Fits that extract a single F 0^s from data taken across a critical fan are extracting an average of a divergent function. A4 (short-ranged f). False in any metal. With a 1/r tail, f {\\mathbf{k}\\mathbf{k}'}^s acquires a singular Hartree piece 4\\pi e^2/q^2 that has no Legendre expansion; Silin's resolution is to split f = 4\\pi e^2/q^2 + \\tilde f and expand only \\tilde f . The consequences are structural: the l=0 charge mode is pushed to \\omega p (the metallic \"zero sound\" is the plasmon), the compressibility relation is modified, and what remains as a low-lying Landau collective mode lives in the spin channel (F 0^a) and at l \\geq 1. Everything called \"Landau theory of the electron liquid\" is Landau–Silin ; see also the systematic treatment in . A5 (Galilean invariance). m^ /m = 1 + F 1^s/3 is a consequence of momentum conservation , derived by equating the quasiparticle current to the total momentum. A lattice breaks continuous translation invariance; only quasi-momentum is conserved, the current operator is \\partial \\varepsilon/\\partial \\mathbf{k} with a band structure in it, and the relation fails — m^ then contains a band contribution and an interaction contribution that the F 1^s formula cannot separate. Quoting F 1^s = 3(m^ /m - 1) from a heavy-fermion specific heat is a category error. Note the corollary in the other direction: a Galilean-invariant Fermi liquid also has zero d.c. resistivity, so \\rho \\propto T^2 in a metal is a statement about umklapp, not about Z. A6 (dimension d \\geq 3). The Pauli phase-space argument giving 1/\\tau \\propto (\\varepsilon-\\mu)^2 + (\\pi T)^2 is marginal at d=2: the integration over the final-state manifold picks up an extra logarithm, so 1/\\tau \\sim T^2 \\ln(T F/T). This is a correction , not a breakdown — Z stays finite, the pole survives, and \\lim {T\\to 0} (1/\\tau)/T \\to 0 still holds, so 2D is a Fermi liquid with a log. The failure at d=1 is not the endpoint of this trend; it is a different mechanism. A8 (stability). Landau's construction is stable only where Pomeranchuk's conditions hold : Saturation is a zero-energy Fermi-surface deformation in channel l. F 0^a \\to -1 is the ferromagnetic Stoner point (\\chi \\propto m^ /(1+F 0^a) diverges); F 0^s \\to -1 is a compressibility divergence, i.e. phase separation; F 2^s \\to -5 is the electronic nematic — a spontaneous elliptical distortion breaking the point group while preserving translations. The important reading: A8 is the only assumption the theory audits internally. It tells you where the Fermi surface deforms, but says nothing about whether the quasiparticles survive the deformation, and in general — as the z=3 boson coupled to the Fermi surface at a nematic QCP shows — they do not. The instability that A8 predicts is precisely a place where A1 fails, which is why the two cannot be checked independently. Smoking Guns and Circumstantial Evidence Smoking Guns and Circumstantial Evidence The construction of §2 makes exactly four kinds of statement that can be falsified without auxiliary assumptions: (i) the ground-state momentum distribution has a finite jump at k F; (ii) the volume enclosed by the Fermi surface is fixed by particle number alone; (iii) the collisionless limit supports a distinct collective mode with a specific crossover signature; (iv) the forward-scattering amplitudes obey an antisymmetry sum rule. Everything else routinely offered as evidence — C/T, \\chi, m^ , AT^2, Kadowaki–Woods — is a consequence the theory shares with several structurally different systems. The distinction is not pedantry: the direct tests fail categorically when the premise fails, while the circumstantial ones survive the failure intact. A Luttinger liquid has C \\propto T, a finite \\chi, and can be arranged to show a T^2 transport window; what it does not have is Z 0. The four direct tests Z, the jump in n(k). This is Migdal's definition, 1957 : for a system with a quasiparticle pole, and Z = 0 is not a small number but a different phase. In 1D the jump is replaced by k-k F ^\\alpha with no discontinuity at all . The measurement is hard because n(k) is not a spectroscopic quantity: one measures the Compton profile J(p z) = \\int n(\\mathbf{k})\\,dk x dk y, whose derivative carries the jump as a kink, and then must strip core electrons, final-state (Lock–Crisp–West) corrections, and the resolution smearing that turns a step into a broadened sigmoid. This was done to competitive precision in a metal only in 2010, on sodium, giving Z \\approx 0.6 in agreement with QMC and G 0W 0 for the electron gas at the same r s . That is the entire experimental base for the theory's defining observable in a simple metal — one element, one paper, fifty-four years after . Luttinger's volume. The enclosed volume is interaction-independent to all orders , which makes it a null test: quantum oscillations or ARPES giving a Fermi volume inconsistent with the chemical count (after honest accounting for band folding, surface states, and the number of carriers actually donated) is a violation of a theorem, not a fitting discrepancy. The failure mode is well defined — a \"small\" Fermi surface in a Kondo-breakdown or fractionalized phase — and it is one of the very few places where the theory can be killed by a number rather than by an exponent. Zero sound. Landau predicted a collisionless mode with \\omega/qv F 1 set by F 0^s, with an anisotropic Fermi-surface distortion . The signature is not the mode's existence but the crossover : as \\omega\\tau passes through unity the sound velocity rises from c 1 to c 0 and the attenuation peaks. That double signature — rise plus peak, both at the same \\omega\\tau — is what Abel, Anderson and Wheatley measured in ^3He in 1966 , and it is far harder to counterfeit than any thermodynamic exponent, because a spurious mechanism must reproduce a velocity change and a dissipation maximum at a single tunable point. In a charged liquid this test is unavailable in the l=0 charge channel: the Coulomb tail drives that mode to \\omega p . Metals must look for it in the spin channel or at higher l. The sum rule. From antisymmetry of the forward-scattering vertex , This is a consistency test on an extracted parameter set, and it is imposed on the amplitudes , not the F's — the standard error flagged in §3. A set of F l fitted to C, \\chi and \\kappa that cannot be completed to a sum-rule-satisfying \\{A l\\} is telling you the truncation is wrong. Figure: The evidentiary asymmetry. Left column: observables whose value is defined only if quasiparticles exist. Right column: observables with at least two structurally different producers. Blue lines: manipulations that break the degeneracy of the right column without ever reaching the left. The circumstantial set, and how to break each degeneracy C = \\gamma T. Any system with a density of low-energy states linear in energy gives this, fermionic or not — including gapless bosonic sectors and, notably, a Luttinger liquid. Experimentally the extraction is fragile: the lattice term must be subtracted over a range where \\beta T^3 is not yet the whole signal, hyperfine/nuclear Schottky tails contaminate the mK regime, and a broad Schottky anomaly from a low-lying doublet mimics an enhanced \\gamma over a decade. Discriminate by field : a Schottky feature moves with B, a nuclear term scales as B^2/T^2, a genuine \\gamma is field-insensitive at small B. Enhanced m^ from \\gamma. Three unrelated mechanisms produce mass enhancement — electron–phonon (1+\\lambda {ep}), polaronic band narrowing, and Kondo/heavy-fermion hybridization — and Landau's m^ /m = 1 + F 1^s/3 is none of them in origin. Discriminate : \\lambda {ep} has an isotope effect and disappears above \\Theta D; the Kondo mass has a coherence temperature that tracks pressure steeply; the F 1^s contribution should be reproducible from an independent measurement in the same channel. Quantum oscillation masses at T \\ll T {\\rm coh} versus \\gamma is the standard cross-check, and disagreement between them is informative. Pauli-like \\chi. A temperature-independent susceptibility is not evidence of 1/(1+F 0^a); Van Vleck contributions are also flat, and Curie–Weiss with \\theta \\gg T is flat over any narrow window. Discriminate by fitting over a range wide enough to expose curvature, and by Knight-shift-versus-\\chi (Clogston–Jaccarino) analysis to isolate the conduction-electron part. \\rho = \\rho 0 + AT^2. As established in the credit audit, this tests momentum relaxation, not the pole. Contaminants: the T^5 phonon crossover leaves an intermediate window that fits T^2; two-band conduction with dissimilar scattering rates generates effective exponents between 1 and 5; weak localization and e-e interaction corrections add \\pm\\sqrt{T} or \\ln T pieces in disordered films. Discriminate by decade count : a fit spanning less than one decade in T (equivalently less than two in \\rho - \\rho 0) constrains nothing. Report \\rho 0, the fit range, and the residuals — a claim of \"T^2 to 30 K\" with \\rho 0 half the total is a claim about the fitter. Kadowaki–Woods A/\\gamma^2. This tests internal coherence between two circumstantial quantities: it asks whether the same m^ appears in transport and thermodynamics, which is a real and useful consistency check on the functional, but it is silent on whether Z 0. Its value is diagnostic of deviation : an anomalous ratio flags an extra relaxation channel or an unaccounted degeneracy factor, not the absence of quasiparticles. The methodological demand follows: extract the same Landau parameter from two independent channels. F 0^s from compressibility and from the zero-sound velocity; F 0^a from \\chi and from the spin-wave/paramagnon dispersion; F 1^s from \\gamma and from de Haas–van Alphen. Agreement is evidence about the functional. Disagreement localizes the failure to a specific l — which is far more information than any single exponent can carry. Use \u0026 Abuse: The Exponent That Isn't a Theorem Use \u0026 Abuse: The Exponent That Isn't a Theorem The theorem is about \\operatorname{Im}\\Sigma. On a (d-1)-dimensional Fermi surface in d=3, Pauli blocking of the two-particle phase space gives so that \\hbar/\\tau {\\rm qp} \\ll \\varepsilon-\\mu as \\varepsilon \\to \\mu and the pole in G outruns its own width. That is the self-consistency of assumption A1, and it is the only thing the T^2 derivation establishes. Nothing in it mentions charge, current, or a field. Getting from there to \\rho = \\rho 0 + AT^2 requires a second, logically independent ingredient: a channel that degrades total momentum . Electron–electron collisions conserve \\sum i \\mathbf{p} i; in a Galilean-invariant system the current operator is proportional to the total momentum, \\mathbf{j} = (e/m)\\mathbf{P}, so [\\,\\mathbf{j}, H\\,] is unaffected by the interaction and \\sigma {\\rm dc} = \\infty no matter how sharp the quasiparticles are. Thermal conductivity and viscosity do inherit the T^{-1} and T^{-2} laws — that is exactly why Abrikosov and Khalatnikov could compute \\eta and \\kappa for a neutral ³He liquid and could not have computed a resistivity. A metal acquires A 0 only through umklapp, through multiband scattering with band-dependent rates, or through impurity-assisted e–e scattering; and even in a lattice, whether the T^2 term survives depends on Fermi-surface geometry — it vanishes identically for a single convex quadratic band in 2D and 3D (Pal, Yudson \u0026 Maslov). Experiment has made the point concrete from the other side: dilute metallic Bi₂O₂Se and SrTiO₃ show clean T^2 resistivity with a Fermi surface too small to permit umklapp and no second band (Wang et al. , Nat. Commun. 2020; see Behnia's survey of the amplitude problem). The inferential consequence is blunt. An exponent n \\neq 2 in \\rho \\sim T^n is a statement about the momentum-relaxation channel, not about the existence of the pole in G. A \"Fermi liquid restored\" announced from a T^2 window spanning half a decade in T — 70–200 K, say, in overdoped cuprates whose low-T resistivity carries a substantial T-linear term (Legros et al. 2019) — is a fit, not a measurement of anything Landau asserted. The propositions that are falsifiable are the ones from §4: the discontinuity Z in n(k) [6, 23], Luttinger's volume , the forward-scattering sum rule , Kadowaki–Woods consistency between A and \\gamma^2, and — sharper than an exponent — the first-Matsubara-frequency rule, which fixes \\operatorname{Im}\\Sigma at \\omega n = \\pi T independently of the interaction strength (verify). Six standing conflations F l vs. A l. The interaction function lives in the \\omega-limit, the scattering amplitude in the q-limit, and they are related by The Pauli-principle constraint on forward scattering, \\sum l (A l^s + A l^a) = 0, is a condition on the amplitudes . It is regularly imposed on the F's in fits — a different, and wrong, constraint. The same \\omega/q non-commutation is what makes m^ /m = 1 + F 1^s/3 an \\omega-limit identity and Pomeranchuk's F l -(2l+1) a statement about the pole of A l. Z vs. m^ /m. Not two views of \"how correlated\" a system is. With Z = \\big[1-\\partial \\omega\\Sigma\\big]^{-1} and the identification Z = m/m^ holds only for local (momentum-independent) \\Sigma — the DMFT limit, not a theorem. Momentum-dependent \\Sigma permits m^ \\to\\infty at finite Z and Z\\to 0 at bounded m^ . In a Galilean-invariant liquid m^ /m = 1+F 1^s/3 contains no reference to Z whatsoever [4, 14]. A large \\gamma is not evidence of small spectral weight. Conflated Untangled --- --- Zero sound = \"the\" Fermi-liquid collective mode In a neutral liquid the l=0 mode is genuine, set by F 0^s, seen at \\omega\\tau\\sim1 [5, 13]. With a 1/r tail the singular Hartree term in f pushes it to \\omega p: in a metal the l=0 charge mode is the plasmon . What survives at low energy is the spin channel (F 0^a, paramagnons) and higher l. \"Migdal's theorem\" Two theorems, one author. The named one is the \\omega D/E F suppression of e–ph vertex corrections; the prior and more foundational — Z = jump in n(k) at k F, 1957 — circulates unnamed. Luttinger's theorem ↔ Luttinger liquid A support and a counterexample. The volume theorem survives wherever a pole structure does, in any d; the 1D fixed point is where the pole does not survive. Different papers, twenty-one years apart, and the model is Tomonaga's. Pomeranchuk instability ↔ Pomeranchuk effect F l \u003c -(2l+1) Fermi-surface deformation vs. the anomalous ³He melting curve, spin entropy of the solid exceeding the liquid — the latter now invoked for the isospin Pomeranchuk effect in magic-angle graphene. Papers cite one meaning the other. The silent abuse The loudest misuse is an exponent; the costlier one is vocabulary. \"Effective mass\", \"Landau parameters\", \"quasiparticle weight\" are carried unchanged into 1D, where Z=0 exactly and n(k) has a power-law rather than a jump [20, 21]; into the quantum-critical fan, where Z\\to 0 and the truncation of \\delta E at second order in \\delta n has no justification because f acquires a singular q-dependence; and into symmetry-broken and topologically ordered phases, where no adiabatic map to the free spectrum exists and A1 is not weakened but void . In those regimes the extracted numbers are fit parameters of a functional whose premise has been denied. The RG reformulation supplied the missing small parameter, \\Lambda/k F — and in the same breath identified the one relevant coupling, BCS, that removes the fixed point for arbitrarily weak attraction. A clean T^2 window says nothing about either. Status: Mutated, Not Dead — and What AETHER Demands Status: Mutated, Not Dead — and What AETHER Demands The theory's present standing is not one claim but three, and they are usually conflated. Canonical, as a fixed point. Since Shankar and Polchinski, the Fermi liquid is not a postulate but the generic infrared fixed point of a fermionic system with a nonzero Fermi surface . Modes are scaled toward a (d-1)-dimensional manifold, the shell thickness \\Lambda/k F supplies the small parameter Landau never had, and tree-level power counting sorts the four-fermion couplings: all irrelevant except zero-angular-momentum forward scattering — the Landau parameters, exactly marginal — and the BCS channel, marginally relevant for any sign of attraction. Two consequences are structural. First, \"why does the strongly coupled electron gas behave like a gas\" has an answer that is kinematic , not perturbative: phase space, not weak coupling. Second, a Fermi liquid is never the true T=0 state of an attractive system; the fixed point is unstable in exactly one channel, and it is the channel that produces superconductivity. Any paper reporting \"a clean Fermi liquid\" at T \\to 0 is reporting a preasymptotic regime unless it also states why the pairing instability is absent or preempted. Mutated, in content. The load-bearing modern statements are not the ones in the 1956 paper. What survives without qualification are (i) the RG fixed-point statement , (ii) Luttinger's volume theorem , now with flux-threading/topological proofs that outrun the original diagrammatic one, and (iii) Z as the discontinuity of n(k) at k F [6, 23]. The energy functional \\delta E = \\sum \\varepsilon^0 \\delta n + \\tfrac12 \\sum f\\,\\delta n\\,\\delta n is best read now as the marginal-coupling parametrization of that fixed point rather than as an independent physical hypothesis. Meanwhile the construction has been extended in directions Landau's neutral f cannot reach: Silin's charged liquid [7, 22]; the Landau–Migdal parameters of nuclear and neutron matter, where the same bookkeeping runs with chiral-Lagrangian input [24, 25]; and Berry Fermi liquid theory , where the semiclassical equations of motion acquire Berry curvature and orbital-moment corrections and the Landau kinetic equation is modified at the same order that generates anomalous transport. That last is the cleanest example of the framework mutating rather than dying: the labelling scheme survives, the equations of motion do not. Contested, at the boundaries. Open, honestly: whether strange-metal T-linear resistivity with \\hbar/\\tau \\sim k BT reflects a genuine bound on dissipation or a coincidence of scales — the Hartnoll–Mackenzie colloquium is explicit that quasiparticle, transport, and many-body times are three different objects and that the \"Planckian bound\" is not a theorem; whether the cuprate pseudogap hosts a Luttinger-volume- violating metal, with the carrier count jumping from p to 1+p at p^ (Badoux et al., Kunisada/LvvFL analyses); whether the 2D Hubbard model has a Fermi-liquid region at all near 1/8 doping, where state-of-the-art AFQMC/DMRG/PEPS still argue over stripe versus superconducting ground states (e.g., 2025 PEPS) — Anderson's claim that no adiabatic map exists there [18, 21] is neither established nor refuted. Settled: 1D is not a Fermi liquid, exactly and provably, Z=0 ; the Pomeranchuk conditions F l^{s,a} -(2l+1) bound the theory from inside ; zero sound exists in ³He [5, 13]; the quasiparticle decay rate 1/\\tau \\propto (\\varepsilon-\\mu)^2 + (\\pi T)^2 follows from phase space alone. On naming: for any charged system — every metal — the correct attribution is Landau–Silin . The singular Hartree piece in f, the displacement of the l=0 mode to \\omega p, the modified compressibility relation, all come from , not [4, 5, 10]. The name survives in the Russian and plasma-kinetics literature and has been quietly dropped elsewhere. Similarly, the transport coefficients everyone fits are Abrikosov–Khalatnikov , and the canonical vocabulary is Pines–Nozières . The AETHER checklist Applied to any manuscript asserting a Fermi liquid, or its death: 1. Which assumption? Name which of A1–A8 is invoked and which is claimed violated. \"Non-Fermi liquid\" without an identified broken premise is a mood, not a result. 2. Has Z been measured or bounded — Compton profile , ARPES coherent-peak weight with a stated background subtraction, or a direct n(k) — or merely assumed nonzero? 3. Luttinger's volume : does the quoted Fermi-surface area reproduce the stated carrier count, including spin and band degeneracy? If not, is the violation asserted, or an artefact? 4. Decades and error bars. Over how many decades in T does the power law hold, and what is the fitted exponent \\pm its uncertainty? A factor of three in T cannot distinguish T^2 from T^{1.6}. 5. Momentum relaxation. For any \\rho \\sim T^n claim: umklapp, multiband, or impurity-assisted? A Galilean-invariant Fermi liquid has \\rho {\\rm dc} = 0. 6. F l versus A l. Are they distinguished, and is \\sum l (A l^s + A l^a) = 0 applied to the amplitudes, not the interaction parameters ? 7. Kadowaki–Woods with the correct degeneracy and dimensionality factors (Jacko–Fjærestad–Powell), not the bare A/\\gamma^2 = 10^{-5}\\,\\mu\\Omega\\,{\\rm cm\\,(mol\\,K/mJ)^2}. 8. Charged? If yes, is Silin's f used , or Landau's neutral one misapplied? 9. Collective modes. Is a mode called \"zero sound\" actually the l=0 charge mode — and if so, why is it not the plasmon? 10. Adiabatic continuity. With a broken symmetry or a QCP nearby , on what grounds is the one-to-one map to the free spectrum still claimed ? Sources: Hartnoll \u0026 Mackenzie, RMP 94, 041002 (2022); Phillips, Hussey \u0026 Phillips, Science 377, eabh4273 (2022); Jacko, Fjærestad \u0026 Powell, Nat. Phys. 5, 422 (2009); Badoux et al., arXiv:1511.08162; Xu et al., arXiv:2112.02187. The AETHER Verdict The AETHER Verdict (a) What I will defend Three propositions, and I would stake my name on them. First: Luttinger's volume theorem is the most robust statement in this entire subject — more robust than the quasiparticle itself. It survives where the pole does not, it has a flux-threading argument independent of the perturbation expansion that Luttinger used, and its violations are informative rather than embarrassing. If I had to keep one equation from the whole edifice, it is n = 2\\int {\\varepsilon(\\mathbf k)\u003c\\mu} d^3k/(2\\pi)^3, not m^ /m = 1+F 1^s/3. Second: the quasiparticle decay rate \\operatorname{Im}\\Sigma \\propto \\max(\\varepsilon^2,(\\pi T)^2) is a phase-space theorem, not a model , and it is the reason the construction is self-consistent at all: the width vanishes faster than the energy, so the labels of §2 refer to something. Landau's own third paper already contains the analytic structure that makes this a statement about the vertex and not a hand-wave, which is why I reject the standard \"phenomenology later justified by others\" story. Third: the RG reformulation is the correct modern statement of what the theory is — a fixed point with an explicit small parameter (the shell thickness \\Lambda/k F) that Landau never had, and exactly one relevant coupling, the BCS channel. That last point is not a footnote. It means no attractive system is a Fermi liquid at T=0, however clean the T^2 looks. And I will defend the negative claim hardest of all: \\rho \\propto T^2 is not a diagnostic of anything. A Galilean-invariant Fermi liquid has zero d.c. resistivity. The exponent measures momentum-relaxation channels — umklapp, multiband, impurity-assisted — and the field's habit of reading n in \\rho \\sim T^n as a verdict on quasiparticle existence is the single most expensive error in correlated-electron experiment. (b) What is shakier than admitted Name the assumptions, not the mood. A: The second-order truncation of \\delta E. The functional keeps f\\,\\delta n\\,\\delta n and drops everything higher. This is justified only if \\delta n is confined to a shell \\sim T/E F. Every application of \"Landau parameters\" at T/T F \\sim 0.1 — most of the heavy-fermion literature — is outside the regime where the truncation is controlled, and nobody reports the neglected cubic term. B: One-to-one labelling under adiabatic switching. Not weak coupling, not an approximation: an assumption of no level crossing. It has never been proven for any interacting continuum model in d 1. It is assumed , then confirmed a posteriori by the fact that the answers work. That is respectable physics and it is not a theorem. C: F l \\to 0 at large l. Fits truncate at l=1, occasionally l=2, and the truncation is never justified — it is a fitting convenience wearing a theoretical costume. Combined with the routine misapplication of the Pauli sum rule \\sum l (A l^s + A l^a)=0 to the F's instead of the A's , a substantial fraction of published \"Landau parameters\" are constrained by an identity that does not apply to them. D: That Z has been measured. Once, competitively, in a simple metal, in 2010 . The claim that Fermi liquid theory is \"experimentally established\" rests overwhelmingly on thermodynamic ratios that a non-quasiparticle state with a Fermi surface can also produce. E: That Z and m^ /m track together. They are independent — Z^{-1} = 1-\\partial \\omega\\Sigma, while m^ /m mixes \\partial \\omega\\Sigma and \\partial k\\Sigma. Large m^ is quoted as evidence of small Z constantly, and it is a non sequitur. (c) Three open questions, ranked 1. Is there a sharp criterion, measurable in a real material, distinguishing Z\\to 0 from Z small? Everything about quantum criticality hangs on whether the residue vanishes or merely shrinks, and no experiment now decides it. 2. What replaces the Landau functional when the shell is not thin — i.e. a controlled expansion valid to T/T F \\sim 0.1? This is where nearly all heavy-fermion and cold-atom data actually live, and we are extrapolating. 3. Does Luttinger's volume survive where the pole does not, generically? If yes, the Fermi surface, not the quasiparticle, is the primitive object, and the theory should be rebuilt around it. Reading path: 1. Landau 1956 — read it for what is absent : no Hamiltonian, no small parameter, only a labelling and a functional. 2. Landau's third paper — the vertex analyticity and the \\omega/q non-commutation; the refutation of the \"purely phenomenological\" story. 3. Silin 1958 — the charged case, where the l=0 mode becomes the plasmon; the paper whose name was absorbed into Landau's. 4. Abrikosov–Khalatnikov — all quantitative transport in the theory, with the 1/\\cos(\\theta/2) collision weight derived rather than quoted. 5. Shankar — the reformulation that supplies the missing small parameter and names the one relevant perturbation."}</script>

<script type="application/json" id="aether-data">{"slug": "the-liquid-with-no-small-parameter", "topic": "Landau Fermi liquid theory", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "The Liquid With No Small Parameter", "subtitle": "Landau's quasiparticle construction, its five uncredited co-authors, and the one measurement almost nobody makes before pronouncing it dead.", "domain": "condensed matter theory / many-body physics", "era": "1956–1959 (Landau's three papers); dominant framework 1960s–1990s, still the default null hypothesis", "why_big": "Landau explained why a strongly interacting electron gas — Coulomb energies comparable to the kinetic energy — nonetheless behaves like a weakly interacting gas of quasiparticles with renormalized mass, and did so without a small parameter, by an adiabatic continuity argument plus a phenomenological energy functional δE = Σ ε⁰_p δn_p + ½Σ f_{pp'} δn_p δn_p'. It converted the puzzle of why the Sommerfeld free-electron model works at all into a controlled statement, and delivered concrete, falsifiable consequences: linear-T specific heat with m*, Pauli susceptibility with Landau parameter corrections χ ∝ m*/(1+F₀ᵃ), compressibility ∝ m*/(1+F₀ˢ), Γ ∝ T² transport, and the prediction of zero sound — a genuinely new collective mode found by Landau before anyone measured it, confirmed in ³He by Abel, Anderson and Wheatley (1966). Migdal, Luttinger and Nozières later supplied the microscopic underpinning: the quasiparticle residue Z as the jump in n(k) at k_F, and Luttinger's theorem fixing the Fermi volume by particle number alone, independent of interaction strength.", "abuse": "Nearly every 'non-Fermi-liquid' claim in the modern literature rests on a resistivity exponent — ρ ∼ T^n with n ≠ 2 — even though T² transport requires umklapp or multiband scattering and is not a theorem of the theory, while genuine tests (the n(k) discontinuity Z, Luttinger's volume, the f-sum-constrained Landau parameters, Kadowaki–Woods consistency) are almost never attempted; conversely, 'Fermi liquid restored' is announced from a single T² window over half a decade in temperature. The deeper abuse is the silent stripping of adiabatic continuity itself: the theory's construction presupposes that the interacting spectrum is in one-to-one correspondence with the free one, which fails outright in 1D, at a QCP where Z → 0, and in any state with a broken symmetry the free gas does not possess — yet the quasiparticle language, effective masses and all, is carried straight into those regimes.", "date": "August 31, 2026", "ts": 1788229132.662335, "engine": "Claude Code CLI · default model", "aliases": ["Fermi-liquid theory", "Landau Fermi liquid theory", "Landau theory of Fermi liquids", "normal Fermi liquid", "quasiparticle theory of metals", "Landau–Silin theory (charged Fermi liquid)", "Landau–Migdal theory of finite Fermi systems (nuclear matter)", "Fermi liquid fixed point (RG formulation)", "Landau kinetic equation / Landau–Boltzmann equation"], "origin_story": "The theory was born from an embarrassment, not a puzzle of principle: Sommerfeld's 1928 free-electron treatment of metals [74] reproduced the linear-T specific heat, the Pauli susceptibility and the Wiedemann–Franz ratio despite the Coulomb energy in a metal being comparable to E_F (r_s ~ 2–6), and nobody could say why. Landau's route to the answer ran not through metals but through helium. In 1941 he had replaced the microscopic dynamics of He-II by a postulated spectrum of 'elementary excitations' — phonons and rotons — and derived thermodynamics and a critical velocity from the spectrum alone [73]; the object of the theory was never the particles but the excitations. Fifteen years later, with liquid ³He newly available in millimole quantities and its low-temperature specific heat and susceptibility being measured, Landau transposed that move to a degenerate Fermi system: assume the interacting spectrum can be built by switching on the interaction adiabatically from the ideal gas, so that low-lying states are labelled by the *same* occupation numbers δn_p as the free gas, and expand the energy to second order in the deviation, δE = Σ ε⁰_p δn_p + ½ Σ f_{pp'} δn_p δn_p' [70]. There is no small parameter anywhere: the strength of the interaction is absorbed into m* and the function f, and the content of the theory is the *structure* of the expansion plus the Pauli phase space that makes 1/τ ∝ (ε−μ)² + (πT)², so that quasiparticles become well-defined precisely where they matter. Landau then did something a phenomenology has no right to do — he extracted a falsifiable novelty. In the second paper (1957) he showed the collisionless kinetic equation, with f as the restoring force, supports a propagating mode distinct from hydrodynamic sound, with a different speed and an anisotropic distortion of the Fermi surface: zero sound [71]. The third paper (1958/59) supplied the piece usually forgotten — a microscopic analysis of the analytic structure of the two-particle vertex, the non-commuting q→0 and ω→0 limits, and the identification of f with the ω-limit of the scattering amplitude [72] — so the 'purely phenomenological' label textbooks attach to Landau's construction is a later simplification. The theory then propagated in two directions at once: Silin extended it to charged fermions, where the long-range Coulomb tail moves the l=0 collective mode up to the plasma frequency [75]; Migdal identified the observable that makes 'quasiparticle' more than a word, the discontinuity Z of n(k) at k_F [76]; Pomeranchuk found the stability boundaries F_l \u003e −(2l+1) [77]; Abrikosov and Khalatnikov built the transport theory and wrote the review that actually taught the theory to the world [78]; Luttinger proved the Fermi volume is fixed by density alone [79]; Nozières and Luttinger reconstructed the whole thing from many-body perturbation theory [80]. Zero sound was measured in ³He by Abel, Anderson and Wheatley in 1966 [81], ten years after prediction. Thirty years later Shankar and Polchinski recast the whole structure as an RG statement — the Landau parameters are the marginal couplings of a fixed point whose only relevant perturbation is BCS pairing [87] — which is where the theory now sits.", "credit_audit": "The headline distortion is at the Nobel itself: Landau's 1962 citation reads 'for his pioneering theories for condensed matter, especially liquid helium' [82] — that is the 1941 He-II two-fluid/excitation-spectrum work [73], not the Fermi liquid papers, which were then four to six years old and whose microscopic status was still being argued over by Luttinger and Nozières. Because the 7 January 1962 crash left Landau unable to travel, the medal was handed over at the Swedish Embassy in Moscow and no Nobel lecture was delivered [82,83]; the consequence for archaeology is that there exists no authorial retrospective in which Landau explains his own reasoning about the Fermi liquid, so every account of 'how Landau got there' is second-hand, mostly from the Khalatnikov circle [84]. Inside the theory the misallocations are systematic and all run in the same direction — toward Landau. (i) The theory as applied to metals is Silin's [75]: Landau's papers treat a neutral liquid, and the entire Coulomb structure — singular Hartree term in f, plasmon in place of l=0 zero sound, modified compressibility relation — was added by Silin in 1958. 'Landau Fermi liquid theory of the electron gas' is a misnomer; 'Landau–Silin' is the accurate name and survives only in the Russian-language and plasma-physics traditions. (ii) The one sharp diagnostic of quasiparticle existence, Z as the jump in n(k), is Migdal 1957 [76], predating Luttinger 1960 [79]; Western textbooks generally present it as Luttinger's or as anonymous, while reserving 'Migdal's theorem' for his electron–phonon vertex result — one author, two theorems, and the wrong one gets the name. (iii) All quantitative transport in the theory — η ∝ T⁻², κ ∝ T⁻¹, the 1/cos(θ/2) collision weight, the zero-to-first-sound crossover — is Abrikosov–Khalatnikov [78], and their 1958 Uspekhi review, not the 1959 Rep. Prog. Phys. version usually cited, is the primary document. (iv) The stability boundaries are Pomeranchuk's [77]. (v) The conversion of the postulates into perturbation-theoretic identities is Nozières–Luttinger [80], and the Fermi-volume theorem is Luttinger's alone [79]. (vi) The textbook claim that 'Landau's theory is purely phenomenological, later justified microscopically by others' is contradicted by Landau's own third paper [72], where the vertex analyticity, the non-commuting ω/q limits and the forward-scattering sum rule are already present — the phenomenology story is a pedagogical convenience that under-credits Landau in the one place he is otherwise over-credited. (vii) 'Adiabatic continuity', the assumption on which everything rests, is Anderson's formulation as a named principle [86], not Landau's phrase. Finally, the modern practice of declaring Fermi liquid theory alive or dead almost never touches the propositions the founders actually proved. Γ ∝ T² is a statement about the quasiparticle decay rate from Pauli phase space; ρ ∝ T² is not, and requires umklapp, multiband, or impurity-assisted momentum relaxation — a Galilean-invariant Fermi liquid has no d.c. resistivity at all, so an exponent n ≠ 2 in ρ ~ T^n is evidence about momentum relaxation channels, not about the existence of quasiparticles. The genuinely diagnostic tests — the n(k) discontinuity Z [76,89], Luttinger's volume [79], the Pauli-principle sum rule on the forward-scattering amplitudes A_l (not on the F_l) [72], and Kadowaki–Woods consistency between A in ρ = ρ₀ + AT² and γ² — are attempted in a small minority of papers, and the Compton-scattering measurement of Z in a simple metal was only done to competitive precision in 2010 [89]. The deeper abuse is silent: the quasiparticle vocabulary, effective masses and Landau parameters and all, is carried unchanged into regimes where the construction's own premise is void — one dimension, where Z = 0 exactly [88]; the vicinity of a quantum critical point, where Z → 0 and the Landau functional's second-order truncation is not justified; and phases with symmetry broken relative to the free gas, where no adiabatic map to the free spectrum exists in the first place [86].", "timeline": [{"year": 1941, "event": "Elementary-excitation method invented: thermodynamics of He-II derived from a postulated quasiparticle spectrum rather than from the Hamiltonian. This is the methodological ancestor of the Fermi liquid; the phrase 'quasiparticle' and the strategy of labelling states by excitation occupation numbers both originate here.", "who": "L. D. Landau", "work": "'Theory of the Superfluidity of Helium II', Phys. Rev. 60, 356 (1941), and the parallel ZhETF 11, 592", "kind": "theory", "ref": 2}, {"year": 1956, "event": "First paper: adiabatic continuity postulated, the energy functional δE = Σ ε⁰δn + ½Σ f δn δn introduced, m*, F_l^s, F_l^a defined, and C ∝ m*T, χ ∝ m*/(1+F₀ᵃ), κ ∝ m*/(1+F₀ˢ), m*/m = 1 + F₁ˢ/3 derived. No small parameter is used or claimed.", "who": "L. D. Landau", "work": "'The Theory of a Fermi Liquid', ZhETF 30, 1058 (1956) / Sov. Phys. JETP 3, 920 (1957)", "kind": "theory", "ref": 4}, {"year": 1957, "event": "Second paper: the collisionless kinetic equation is solved and zero sound predicted — a genuinely new collective mode, ω/qv_F \u003e 1, with an anisotropic Fermi-surface distortion and a speed set by F₀ˢ, distinct from hydrodynamic first sound. A prediction with no experiment behind it.", "who": "L. D. Landau", "work": "'Oscillations in a Fermi Liquid', ZhETF 32, 59 (1957) / Sov. Phys. JETP 5, 101 (1957)", "kind": "theory", "ref": 5}, {"year": 1957, "event": "The quasiparticle weight Z is identified as the discontinuity of the ground-state momentum distribution n(k) at k_F — the only sharp, in-principle-measurable diagnostic of whether a system is a Fermi liquid at all. Predates Luttinger's 1960 statement by three years.", "who": "A. B. Migdal", "work": "'The Momentum Distribution of Interacting Fermi Particles', Sov. Phys. JETP 5, 333 (1957)", "kind": "formalization", "ref": 6}, {"year": 1958, "event": "Extension to the charged Fermi liquid: with a long-range 1/r tail, f acquires a singular Hartree piece, the l=0 zero-sound mode is pushed to ω_p, and the compressibility sum rule is modified. Essentially every application of 'Landau theory' to electrons in metals rests on this paper, not on Landau's.", "who": "V. P. Silin", "work": "'Theory of a Degenerate Electron Liquid', Sov. Phys. JETP 6, 387 (1958)", "kind": "theory", "ref": 7}, {"year": 1958, "event": "Stability conditions derived: the Fermi surface is stable only for F_l^{s,a} \u003e −(2l+1) in every channel; violation drives a Fermi-surface deformation (nematic for l=2, ferromagnetic for l=0 antisymmetric). The boundary of the theory's own validity, stated from inside it.", "who": "I. Ya. Pomeranchuk", "work": "'On the Stability of a Fermi Liquid', Sov. Phys. JETP 8, 361 (1958)", "kind": "theory", "ref": 8}, {"year": 1958, "event": "The transport theory: quasiparticle collision integral with the characteristic 1/cos(θ/2) angular weight, viscosity η ∝ T⁻², thermal conductivity κ ∝ T⁻¹, the zero-sound↔first-sound crossover at ωτ ~ 1, and a systematic comparison with ³He data. The Russian Uspekhi review predates the widely cited English Rep. Prog. Phys. 22, 329 (1959) version by a year.", "who": "A. A. Abrikosov, I. M. Khalatnikov", "work": "'Theory of the Fermi fluid (the properties of liquid He³ at low temperatures)', Uspekhi Fiz. Nauk 66, 177 (1958) / Sov. Phys. Uspekhi 1, 68 (1958)", "kind": "formalization", "ref": 9}, {"year": 1959, "event": "Third paper — the one usually omitted. Landau analyses the two-particle vertex Γ, shows the ω-limit and q-limit do not commute, identifies f with Γ^ω, and derives the forward-scattering (Pauli-principle) sum rule on the scattering amplitudes. This is the microscopic content that undercuts the standard claim that Landau's theory was 'only phenomenological'.", "who": "L. D. Landau", "work": "'On the Theory of the Fermi Liquid', ZhETF 35, 97 (1958) / Sov. Phys. JETP 8, 70 (1959)", "kind": "formalization", "ref": 10}, {"year": 1960, "event": "Luttinger's theorem: the volume enclosed by the surface of poles of G(k,0) equals the free-gas value fixed by particle number, to all orders in the interaction; and n(k) has a jump defining the Fermi surface. Interaction strength cannot change the Fermi volume — the second genuinely sharp, falsifiable statement in the subject.", "who": "J. M. Luttinger", "work": "'Fermi Surface and Some Simple Equilibrium Properties of a System of Interacting Fermions', Phys. Rev. 119, 1153 (1960)", "kind": "formalization", "ref": 11}, {"year": 1962, "event": "Landau's phenomenology reconstructed order by order from many-body perturbation theory: vertex identities, Ward identities, the ω/q limits, equilibrium properties and the transport equation recovered, including the Coulomb case. This is what converted Landau's postulates into a controlled diagrammatic statement for the Western community.", "who": "P. Nozières, J. M. Luttinger", "work": "'Derivation of the Landau Theory of Fermi Liquids. I \u0026 II', Phys. Rev. 127, 1423 and 1431 (1962)", "kind": "formalization", "ref": 12}, {"year": 1962, "event": "Nobel Prize in Physics to Landau 'for his pioneering theories for condensed matter, especially liquid helium' — i.e. for superfluid He-II and the two-fluid/excitation-spectrum work, NOT for the Fermi liquid papers, which were four to six years old and still contested. Following the 7 January 1962 car crash, the medal was delivered at the Swedish Embassy in Moscow and no Nobel lecture was ever given — there is no authorial retrospective on Fermi liquid theory from Landau.", "who": "Nobel Committee for Physics / Royal Swedish Academy of Sciences", "work": "Nobel Prize in Physics 1962, Presentation Speech (nobelprize.org); Nobel Archive nomination record analysed in [83]", "kind": "naming", "ref": 15}, {"year": 1966, "event": "Zero sound observed in liquid ³He: sound velocity rises and attenuation peaks as ωτ passes through unity, matching the predicted first→zero sound crossover. A collective mode predicted a decade earlier from a phenomenological energy functional with no small parameter.", "who": "W. R. Abel, A. C. Anderson, J. C. Wheatley", "work": "'Propagation of Zero Sound in Liquid He³ at Low Temperatures', Phys. Rev. Lett. 17, 74 (1966)", "kind": "observation", "ref": 13}, {"year": 1966, "event": "Canonization in English: the Landau construction, the F_l/A_l bookkeeping, the sum rules and the ³He data are assembled into a textbook framework. 'Landau parameters', 'Landau interaction function' and 'normal Fermi liquid' acquire their present fixed meanings here rather than in Landau's papers.", "who": "D. Pines, P. Nozières", "work": "The Theory of Quantum Liquids, Vol. I: Normal Fermi Liquids (W. A. Benjamin, 1966)", "kind": "naming", "ref": 14}, {"year": 1981, "event": "The clean counterexample is named: in 1D there is no quasiparticle pole, Z = 0, n(k) has a power-law singularity instead of a jump, and spin and charge separate. Haldane coins 'Luttinger liquid' and states its universality — establishing that adiabatic continuity is an assumption that can fail outright, not a theorem. Tomonaga (1950) had the solvable model thirteen years before Luttinger's 1963 version.", "who": "F. D. M. Haldane (building on S. Tomonaga, J. M. Luttinger, D. C. Mattis and E. H. Lieb)", "work": "\"'Luttinger liquid theory' of one-dimensional quantum fluids. I\", J. Phys. C: Solid State Phys. 14, 2585 (1981)", "kind": "theory", "ref": 20}, {"year": 1994, "event": "RG reformulation: with the Fermi surface as the IR manifold, tree-level scaling shows all four-fermion couplings are irrelevant except forward scattering (the Landau parameters, exactly marginal) and BCS pairing (marginally relevant). Fermi liquid theory becomes a fixed point with a controlled expansion in Λ/k_F — the small parameter Landau never had, supplied 38 years late.", "who": "R. Shankar (and, independently, J. Polchinski, TASI 1992 lectures)", "work": "'Renormalization-group approach to interacting fermions', Rev. Mod. Phys. 66, 129 (1994)", "kind": "revival", "ref": 19}, {"year": 2010, "event": "The theory's defining observable is finally measured in a metal rather than assumed: high-resolution x-ray Compton scattering on sodium extracts the discontinuity of n(k) at k_F, giving Z ≈ 0.6, consistent with QMC and G₀W₀ for the electron gas at the same r_s. Almost no 'non-Fermi liquid' or 'Fermi liquid restored' claim in the transport literature attempts this test.", "who": "S. Huotari, K. Hämäläinen, D. M. Ceperley, M. Holzmann, V. Olevano and co-workers", "work": "'Momentum Distribution and Renormalization Factor in Sodium and the Electron Gas', Phys. Rev. Lett. 105, 086403 (2010)", "kind": "observation", "ref": 23}], "neglected": [{"name": "Victor Pavlovich Silin", "role": "Created the charged Fermi liquid — the version actually used for metals. He showed that with a 1/r interaction the Landau function f splits into a singular Hartree part plus a regular remainder, that the l=0 collective mode is displaced to the plasma frequency (so a metal's 'zero sound' is the plasmon), and that the compressibility and screening relations must be modified accordingly. Every calculation that applies Landau parameters to electrons in a solid inherits Silin's structure, not Landau's neutral-liquid structure.", "evidence": "His own 1958 JETP paper on the degenerate electron liquid, plus companion papers on the anomalous skin effect and on the degenerate electron Fermi liquid in a magnetic field; the neutral-liquid papers of Landau [70,71,72] contain no Coulomb treatment at all.", "ref": 7}, {"name": "Arkady Beinusovich Migdal", "role": "Supplied the operational definition of a quasiparticle: Z = the discontinuity of n(k) at k_F, three years before Luttinger's better-known statement. He also, with Galitskii, built the field-theoretic apparatus (Green functions, spectral representation) in which the Landau postulates could be checked, and later transplanted the whole framework into nuclear physics as the theory of finite Fermi systems, where the interaction parameters are still called Landau–Migdal parameters.", "evidence": "Migdal, Sov. Phys. JETP 5, 333 (1957); the nuclear-matter branch is documented in the chiral-Lagrangian-to-Landau-Migdal literature [39,41,37,40]. In modern usage 'Migdal's theorem' almost always denotes his *other* result — the ω_D/E_F suppression of electron–phonon vertex corrections — so the n(k) result circulates largely unattributed.", "ref": 6}, {"name": "Isaak Markovich Khalatnikov and Alexei Alexeevich Abrikosov", "role": "Wrote the transport theory of the Fermi liquid — the collision integral with its 1/cos(θ/2) angular weight, η ∝ T⁻², κ ∝ T⁻¹, and the zero-sound/first-sound crossover formula that experimentalists actually fit — and authored the review through which the theory reached the international community. Landau's three papers contain no worked transport coefficients.", "evidence": "Abrikosov \u0026 Khalatnikov, Uspekhi Fiz. Nauk 66, 177 (1958) / Sov. Phys. Uspekhi 1, 68 (1958), and the expanded Rep. Prog. Phys. 22, 329 (1959); Khalatnikov's own recollections of the period in the Landau memorial volume he edited [84].", "ref": 9}, {"name": "Isaak Yakovlevich Pomeranchuk", "role": "Derived the stability conditions F_l^{s,a} \u003e −(2l+1), which fix where the Landau expansion ceases to describe a stable Fermi surface and which underlie the entire modern industry of nematic/ferromagnetic Fermi-surface instabilities and 'Pomeranchuk quantum criticality'.", "evidence": "Pomeranchuk, Sov. Phys. JETP 8, 361 (1958). The result is often quoted in modern papers without citation, or absorbed into 'Landau's theory'.", "ref": 8}, {"name": "John C. Wheatley, William R. Abel and Ansel C. Anderson", "role": "Ran the low-temperature ³He programme that turned Landau's construction from an elegant postulate into a tested theory: heat capacity, susceptibility, viscosity and finally the 1966 detection of zero sound via the sound-velocity rise and attenuation peak at ωτ ~ 1. Theory-side histories routinely say 'zero sound was confirmed' without naming who confirmed it.", "evidence": "Abel, Anderson \u0026 Wheatley, Phys. Rev. Lett. 17, 74 (1966); the surrounding Wheatley-group ³He thermodynamic and transport measurements that fixed the first few F_l for ³He at several pressures.", "ref": 13}, {"name": "Philippe Nozières and Joaquin Mazdak Luttinger", "role": "Converted Landau's postulates into theorems of many-body perturbation theory — the ω-limit/q-limit identities, Ward identities, and the derivation of both equilibrium relations and the transport equation, including the long-ranged Coulomb case. Most courses present 'Landau's theory' with these results silently folded in; the two-paper derivation itself is rarely assigned.", "evidence": "Nozières \u0026 Luttinger, Phys. Rev. 127, 1423 and 127, 1431 (1962); Luttinger's separate Fermi-volume theorem [79].", "ref": 12}, {"name": "Sin-Itiro Tomonaga", "role": "Solved the one-dimensional interacting fermion problem by bosonization in 1950 — the model that demonstrates the failure of quasiparticle labelling — thirteen years before Luttinger's rediscovery and thirty-one before the phrase 'Luttinger liquid'. The canonical counterexample to Fermi liquid theory carries the name of the second author to find it.", "evidence": "Haldane's 1981 paper, which introduces the name 'Luttinger liquid' in quotation marks while crediting the Tomonaga model and the Mattis–Lieb correction of Luttinger's flawed solution; see also the Anderson–Haldane discussion of low-dimensional fermion fluids [45].", "ref": 20}, {"name": "Philip W. Anderson", "role": "Named and isolated the load-bearing assumption. 'Adiabatic continuity' — the one-to-one correspondence between interacting and free eigenstates — is what the theory rests on, and it is Anderson's articulation of it as a *principle* (alongside broken symmetry and generalized rigidity) that made the failure modes discussable. Landau asserted the correspondence; he did not name it or catalogue when it breaks.", "evidence": "Anderson, Basic Notions of Condensed Matter Physics (Benjamin/Cummings, 1984), Ch. 3; his subsequent programme arguing that the 2D Hubbard model is not adiabatically continuable, and the Anderson–Haldane exchange on symmetries of fermion fluids in low dimensions [45].", "ref": 18}], "conflations": [{"claim": "'Fermi liquid' ≡ 'T² resistivity'; ρ ~ T^n with n ≠ 2 proves a non-Fermi liquid, and one decade of T² proves a Fermi liquid.", "clarification": "Two different objects. The theorem is 1/τ_qp ∝ (ε−μ)² + (πT)², a statement about the imaginary part of the self-energy forced by Pauli phase space on a 2D Fermi surface in 3D momentum space. Getting from that to ρ ∝ T² additionally requires a channel that degrades total momentum: umklapp, more than one band with different scattering rates, or impurity-assisted e-e scattering. A Galilean-invariant Fermi liquid conserves momentum and has zero d.c. resistivity regardless of how well-defined its quasiparticles are; conversely, marginal or non-quasiparticle systems can be arranged to give an apparent T² window. An exponent is a statement about the momentum-relaxation channel, not about the existence of the pole in G."}, {"claim": "Z (the quasiparticle residue) and m*/m measure the same 'strength of correlations'.", "clarification": "Independent quantities. Z = |1 − ∂Σ/∂ω|⁻¹ is the jump in n(k) at k_F and controls the spectral weight in the coherent peak; m*/m = (1 − ∂Σ/∂ω)/(1 + (m/k_F)∂Σ/∂k) mixes the frequency and momentum derivatives of Σ. In a Galilean-invariant system m*/m = 1 + F₁ˢ/3 with no reference to Z at all. There exist limits where m* diverges with Z finite (momentum-dependent Σ) and where Z → 0 with m* bounded. Quoting a large m* as evidence of 'small Z' is a non sequitur."}, {"claim": "Landau parameters F_l and Landau scattering amplitudes A_l are interchangeable; the Pauli-principle sum rule constrains the F's.", "clarification": "A_l^{s,a} = F_l^{s,a}/(1 + F_l^{s,a}/(2l+1)) — the amplitudes are the scattering-matrix (q-limit) objects, the F's the interaction-function (ω-limit) objects. The forward-scattering sum rule from antisymmetry, Σ_l (A_l^s + A_l^a) = 0, is a condition on the A's [72]. Applying it to the F's is a common and silently wrong 'constraint' in fits to experiment."}, {"claim": "Zero sound is 'the collective mode of a Fermi liquid', in metals as in ³He.", "clarification": "In a neutral liquid the l=0 zero sound is a genuine Landau mode whose speed is set by F₀ˢ and whose Fermi-surface distortion is anisotropic [71,81]. In a charged liquid the 1/r tail adds a singular Hartree contribution to f that drives the l=0 mode to ω_p: the metallic analogue of zero sound is the plasmon [75]. What survives in metals as a low-lying Landau collective mode is in the spin channel (paramagnon/spin-wave-like, controlled by F₀ᵃ) and in higher-l channels, not in the l=0 charge channel."}, {"claim": "'Pomeranchuk instability' and 'Pomeranchuk effect' are the same circle of ideas.", "clarification": "Same author, unrelated physics. The instability is F_l \u003c −(2l+1) driving spontaneous Fermi-surface deformation (the l=2 case being electronic nematicity) [77]. The Pomeranchuk *effect* is the anomalous ³He melting curve — solid having higher spin entropy than liquid, so adiabatic compression cools — a 1950 result about the phase diagram, used for refrigeration and recently invoked for magic-angle graphene. Papers regularly cite one when meaning the other."}, {"claim": "'Migdal's theorem' is a single result.", "clarification": "Two distinct theorems by A. B. Migdal. (a) 1957: Z equals the discontinuity of n(k) at k_F [76]. (b) The electron–phonon theorem: vertex corrections are suppressed by ~ω_D/E_F (√(m/M)), justifying the neglect of vertex diagrams in Eliashberg theory. Modern usage almost always means (b); the historically prior and conceptually foundational (a) circulates without a name."}, {"claim": "'Luttinger's theorem' and 'Luttinger liquid' are two faces of one thing.", "clarification": "Unconnected. Luttinger's theorem (1960 [79]) fixes the Fermi volume by particle number, interaction-independently, in *any* dimension where a pole structure survives — and is arguably the more robust statement of the two, later given a topological/flux-threading proof valid beyond perturbation theory. 'Luttinger liquid' (Haldane 1981 [88]) names the 1D fixed point where the quasiparticle pole is destroyed. They come from different papers, different decades, and the second is a counterexample to the framework the first supports, not a corollary."}, {"claim": "Adiabatic continuity is a controlled approximation — 'the interaction is weak enough'.", "clarification": "It is neither weak-coupling nor an approximation; it is a topological-in-spirit assumption that switching on the interaction produces no level crossing, so eigenstates carry the free gas's quantum numbers. Landau needed no small parameter precisely because he assumed this outright [70]. It fails categorically — not gradually — in 1D [88], at a QCP where Z → 0, in any state with a broken symmetry the free gas does not possess, and in topologically ordered states. The RG reformulation [87] later supplied the small parameter that was missing (the shell thickness Λ/k_F) and simultaneously identified the one relevant perturbation, BCS pairing, that destroys the fixed point for arbitrarily weak attraction — so a Fermi liquid is never the true T = 0 state of an attractive system, however clean its T² transport looks."}, {"claim": "'Non-Fermi liquid' is a statement about a material.", "clarification": "It is a statement about a ground state and a scaling regime, and the two are routinely swapped. A system can display non-Fermi-liquid transport over a decade of T above a coherence scale and be a perfectly ordinary Fermi liquid below it (heavy fermions are the standard case), or be a Fermi liquid at T = 0 in a regime unreachable by experiment. Declaring 'non-Fermi liquid' from a finite-T fit says nothing about Z, the Fermi volume, or adiabatic continuity."}], "sections": [{"id": "why-this-mattered", "title": "Why a Strongly Coupled Electron Gas Behaves Like a Gas: 1941–1966", "markdown": "## Why a Strongly Coupled Electron Gas Behaves Like a Gas: 1941–1966\n\nThe scandal is Sommerfeld's, and it is older than the theory that resolves it. In 1928 Sommerfeld replaced Drude's Maxwell–Boltzmann electrons with a degenerate Fermi–Dirac gas and immediately recovered the linear electronic specific heat $C = \\gamma T$, the temperature-independent Pauli susceptibility, and the Wiedemann–Franz ratio with the right Lorenz number [1]. The model treats the conduction electrons as *non-interacting*. It has no business working.\n\nTake the uniform electron gas at metallic density. In rydbergs per particle,\n\n$$\\frac{E_{\\rm kin}}{N} = \\frac{2.21}{r_s^{2}}, \\qquad \\frac{E_{x}}{N} = -\\frac{0.916}{r_s},$$\n\nso the ratio of interaction to kinetic energy scales as $r_s$ itself. Sodium sits at $r_s \\simeq 3.9$: kinetic energy $\\approx 0.14$ Ry, exchange alone $\\approx -0.23$ Ry, with correlation on top. The dimensionless coupling is not small — it is larger than one — and the Gell-Mann–Brueckner ring summation, the one honest perturbative treatment, is an expansion about $r_s \\to 0$, i.e. about a density regime no metal occupies. Every attempt to *derive* Sommerfeld's success from weak coupling fails at the
