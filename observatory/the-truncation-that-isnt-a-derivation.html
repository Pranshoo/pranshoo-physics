11}, {"year": 1967, "event": "Proves the structure theorem: by Cauchy-Schwarz on the jump moments, if D^(n) = 0 for a single even n \u003e 2 then D^(n) = 0 for all n \u003e= 3 — the expansion stops at 1 (deterministic), at 2 (diffusion), or never; any finite truncation above 2 yields a P(x,t) that goes negative. Stated generally in the IEEE paper; applied to the linear Boltzmann equation in the companion Physical Review paper [1]", "who": "R. F. Pawula", "work": "\"Generalizations and extensions of the Fokker-Planck-Kolmogorov equations\", IEEE Trans. Inf. Theory 13(1), 33-41; and Phys. Rev. 162, 186 (1967)", "kind": "theory", "ref": 9}, {"year": 1980, "event": "Reconnects the physics statement to its mathematical parent: truncating a cumulant hierarchy above second order is incompatible with a nonnegative probability density, by Marcinkiewicz's theorem. The Marcinkiewicz-Pawula link is essentially absent from the earlier physics literature and from Pawula's own citations", "who": "P. Hänggi, P. Talkner", "work": "\"A remark on truncation schemes of cumulant hierarchies\", J. Stat. Phys. 22, 65-67", "kind": "theory", "ref": 14}, {"year": 1984, "event": "Demonstrates quantitatively that a Fokker-Planck model built from the truncated KM expansion of a bistable master equation gets the metastable escape rate exponentially wrong, and constructs an alternative FP modeling that reproduces the correct rate; extended to shot-noise circuits in [9]", "who": "P. Hänggi, H. Grabert, P. Talkner, H. Thomas", "work": "\"Bistable systems: Master equation versus Fokker-Planck modeling\", Phys. Rev. A 29, 371", "kind": "theory", "ref": 19}, {"year": 1987, "event": "Exhibits explicit solutions of KM expansions truncated at n=4,6,... for continuum approximations to the Poisson process, showing exactly where and how negative probability appears — the concrete counterexamples behind Pawula's abstract statement; Doering, Hagan and Rosenau [8] simultaneously propose Padé-type resummations as the honest alternative to truncation", "who": "H. Risken, H. D. Vollmer", "work": "\"On solutions of truncated Kramers-Moyal expansions; continuum approximations to the Poisson process\", Z. Phys. B 66, 257", "kind": "theory", "ref": 13}, {"year": 1997, "event": "Revival as a data-analysis method: drift and diffusion coefficients estimated directly from experimental turbulence data by binning conditional increments, launching two decades of 'reconstruct the Fokker-Planck equation from a time series' work across turbulence, physiology, finance and climate", "who": "R. Friedrich, J. Peinke", "work": "\"Description of a Turbulent Cascade by a Fokker-Planck Equation\", Phys. Rev. Lett. 78, 863", "kind": "revival", "ref": 27}, {"year": 2001, "event": "Shows that KM coefficients estimated at finite sampling interval are systematically biased — the tau-\u003e0 limit is never taken in practice, so measured D^(1), D^(2) mix orders — and gives finite-time corrections. The claim was contested by Friedrich, Renner, Siefert and Peinke [84] with a reply from the original authors, the sharpest priority/validity dispute in the modern KM literature", "who": "M. Ragwitz, H. Kantz", "work": "\"Indispensable Finite Time Corrections for Fokker-Planck Equations from Time Series Data\", Phys. Rev. Lett. 87, 254501, with Comment and Reply at PRL 89, 149401/149402 (2002)", "kind": "theory", "ref": 24}, {"year": 2016, "event": "Supplies the test practitioners skip: a non-parametric criterion using the fourth KM coefficient to separate genuine diffusion from jump-driven dynamics, exploiting the fact that for a jump-diffusion D^(4)/D^(2) tends to a finite jump amplitude rather than to zero", "who": "M. Anvari, M. R. R. Tabar, J. Peinke, K. Lehnertz", "work": "\"Disentangling the stochastic behavior of complex time series\", Scientific Reports 6, 35435", "kind": "theory", "ref": 22}, {"year": 2019, "event": "Turnkey estimation of KM coefficients to arbitrary order from arbitrary-dimensional time series via kernel density estimation, making the n\u003c=2 fit the path of least resistance for any user who never inspects D^(4); estimation-and-inference reviews such as [38] and sparse-regression variants [41] entrench the same default", "who": "L. Rydin Gorjão, F. Meirinhos", "work": "\"kramersmoyal: Kramers--Moyal coefficients for stochastic processes\", J. Open Source Software 4(44), 1693", "kind": "revival", "ref": 26}], "neglected": [{"name": "Max Planck", "role": "Performed the truncated jump-moment expansion in 1917 — Taylor-expanding an integral master equation and cutting at second order — which is precisely the operation the modern literature calls the 'Kramers-Moyal truncation'. He also supplied the derivation Fokker had omitted in 1914, which is why the equation carries his name; but the *expansion* that generates it does not", "evidence": "The 1917 Akademie paper itself; standard historical accounts of the Fokker-Planck equation credit Planck with giving the general derivation from a short-time transition kernel characterized by its first two moments", "ref": 3}, {"name": "J. W. Strutt (Lord Rayleigh)", "role": "The 1891 piston calculation is the earliest expansion of a discrete collision kernel in the jump variable with truncation at second order; the resulting equation is the ancestor of both the Klein-Kramers equation and the KM scheme. Rayleigh's model is still the canonical case where the higher jump moments are computable and demonstrably nonzero", "evidence": "The Philosophical Magazine paper (reprinted in Scientific Papers vol. III); the exact infinite-order differential expansion of the same collision operator is reconstructed in Hoare and Rahman's spectral treatment of Rayleigh's piston [2]", "ref": 1}, {"name": "Józef Marcinkiewicz", "role": "Proved in 1939 the theorem that supplies the entire analytic content of Pawula's result: exp(polynomial of degree \u003e 2) cannot be a characteristic function, so a cumulant/moment hierarchy cannot terminate above second order without destroying positivity. He was murdered in the Katyn massacres in 1940 and the physics community rediscovered his result under another name 28 years later", "evidence": "Mathematische Zeitschrift 44, 612-618 (1939); the connection to truncation schemes in nonequilibrium physics is made explicitly only by Hänggi and Talkner [4], and Marcinkiewicz appears in neither of Pawula's 1967 papers nor in the standard Wikipedia/textbook framing of the theorem", "ref": 10}, {"name": "N. G. van Kampen", "role": "Made the load-bearing critique — that the KM series has no ordering parameter, hence 'truncation at second order' is not a controlled approximation but an assumption — and provided the legitimate alternative, the Omega^{-1/2} system-size expansion. Textbooks routinely present the KM truncation as 'the derivation of the Fokker-Planck equation' with his objection stripped out, and the linear-noise FPE is frequently confused with the KM-truncated one", "evidence": "The 1961 Canadian J. Phys. paper [75], the polemical chapter 'The Diffusion Approximation for Markov Processes' (1982), and Stochastic Processes in Physics and Chemistry [77]; van Kampen was Kramers' doctoral student at Leiden, documented in the Journal of Statistical Physics memorial [82]", "ref": 16}, {"name": "J. E. Moyal", "role": "Wrote the general infinite-order statement that makes the Fokker-Planck equation a truncation rather than a law, yet held no physics position at the time and published it in a statistics journal as a symposium survey. The hyphenated name misleads: Moyal and Kramers never collaborated, and readers routinely assume a joint paper. Moyal's parallel 1949 phase-space formulation of quantum mechanics was initially rejected by Dirac in a two-year correspondence", "evidence": "Ann Moyal's biography, which reproduces the 1944-1946 Dirac-Moyal correspondence in full as an appendix and documents Moyal's outsider status as an engineer/statistician; the JRSS B paper itself [69]", "ref": 8}, {"name": "R. L. Stratonovich", "role": "Developed the derivative-moment expansion, its higher-order corrections and the associated non-Gaussian noise theory independently in the Soviet radiophysics literature from the late 1950s; much of what Western texts present as novel higher-order KM machinery is anticipated there, but citation flows almost entirely through Risken [34] and Gardiner [78]", "evidence": "Topics in the Theory of Random Noise (Russian original 1961, English translation 1963); the systematic under-citation is visible in the reference lists of the standard Fokker-Planck monographs", "ref": 11}, {"name": "P. Hänggi, H. Grabert, P. Talkner and H. Thomas", "role": "Established the quantitative price of the illegitimate truncation — a KM-truncated Fokker-Planck model of a bistable master equation gives exponentially wrong escape rates — and built consistent alternatives. This result is far less cited than the abstract Pawula theorem it operationalizes, and is almost never invoked by practitioners fitting drift-diffusion pairs to data", "evidence": "Phys. Rev. A 29, 371 (1984) [6], with the shot-noise circuit application in IBM J. Res. Dev. 32, 119 (1988) [9]; the cumulant-hierarchy companion result is [4]", "ref": 19}], "conflations": [{"claim": "'Kramers-Moyal expansion' and 'Fokker-Planck equation' are used almost interchangeably, as if the first derives the second.", "clarification": "The KM expansion is an exact formal identity — a rewriting of the Chapman-Kolmogorov equation in terms of derivative moments — and derives nothing. The FPE is a truncation of it. An identity plus an unjustified truncation is not a derivation; it is an assumption about D^(n\u003e=3) that must be independently established (by Kolmogorov's jump condition, by a system-size parameter, or by measurement)."}, {"claim": "Pawula's theorem is cited as licensing truncation at n=2.", "clarification": "It says the opposite. The theorem constrains the exact jump moments: if D^(n) vanishes for one even n \u003e 2, then D^(n) = 0 for all n \u003e= 3. Contrapositively, if any D^(n\u003e2) is nonzero, all higher ones are, and no finite truncation above second order is admissible. It gives no license to truncate — it says truncation at 2 is legal only if nature already stopped there, which is an empirical claim about your system, not a corollary of the theorem."}, {"claim": "'The truncated equation is unphysical because P goes negative' is taken to mean it is useless.", "clarification": "Two different failures are being merged. Loss of positivity is a statement about the tails and about long times; a truncation at n=4 can reproduce low-order moments over finite times to controlled accuracy while producing a negative density where the density is exponentially small anyway [7]. The honest statement is that the truncated operator does not generate a Markov semigroup on probability measures — hence no rates, no stationary distribution, no large deviations — not that every number it produces is wrong. Resummation-type approximations [8] exist precisely to keep the accuracy without the pathology."}, {"claim": "The Marcinkiewicz theorem and Pawula's theorem are treated as the same statement.", "clarification": "They are cousins, not identicals. Marcinkiewicz constrains the cumulants of a single probability distribution: the cumulant generating function cannot be a polynomial of degree \u003e 2. Pawula constrains the jump moments of a Markov generator, i.e. the tau-\u003e0 rates, and is proved by an inequality on moments of the short-time transition density. The bridge — that truncating a cumulant *hierarchy* above second order violates positivity — is Hänggi-Talkner [4], and it is a third statement again."}, {"claim": "A process whose D^(n\u003e2) are nonzero is described as 'needing an infinite-order PDE'.", "clarification": "This mistakes a representation for the physics. The differential Chapman-Kolmogorov equation [78] splits the generator cleanly into drift, diffusion and an integral jump term W(x|x'); the divergent tower of D^(n) is just the Taylor moments of that jump kernel. The correct object is the integro-differential master equation (or, structurally, the Lévy-Itô decomposition: continuous paths + jumps), not a PDE with infinitely many derivatives. 'Keep all orders' and 'write the jump kernel' are the same statement, and only the second is computable."}, {"claim": "Measured 'Kramers-Moyal coefficients' are identified with the D^(n) of the theory.", "clarification": "D^(n)(x) = (1/n!) lim_{tau-\u003e0} ⟨(Delta x)^n⟩_x / tau. What an estimator returns at finite sampling interval Delta t is a finite-time coefficient in which the orders mix: a pure jump process yields a nonzero apparent D^(2), and genuine higher-order structure is smeared into the fitted drift and diffusion [83,84]. The tau-\u003e0 limit is precisely the thing the data cannot supply, and every Pawula-based argument is a statement about the limit, not about the estimate."}, {"claim": "The 'Fokker-Planck equation' obtained by KM truncation and the one obtained from van Kampen's Omega-expansion are treated as the same equation.", "clarification": "They are not. The leading order of the Omega^{-1/2} expansion is a linear Fokker-Planck (linear-noise) equation about the deterministic trajectory, with an explicit error order; the KM truncation retains nonlinear x-dependence in D^(2) with no error estimate. They agree on Gaussian fluctuations around a stable state and disagree exactly where it matters — barrier heights, escape rates, tails, bifurcations [6,9,76]."}, {"claim": "'Kramers equation', 'Klein-Kramers equation', 'Kramers rate' and 'Kramers-Moyal expansion' are treated as one cluster of results from one paper.", "clarification": "The 1940 Physica paper [68] contains the phase-space kinetic equation (Klein-Kramers, itself with a 1921 Klein antecedent) and the escape-rate formula, obtained *using* a truncated expansion. The general expansion is Moyal's 1949 statistics-journal paper. Citing 'Kramers 1940' for the Kramers-Moyal expansion attributes to Kramers a generality he never asserted."}], "sections": [{"id": "who-actually-stopped-at-two", "title": "Rayleigh's Piston to Moyal's Symposium: Who Actually Stopped at Second Order", "markdown": "## Rayleigh's Piston to Moyal's Symposium: Who Actually Stopped at Second Order\n\nThe object at issue is a formal identity. For a Markov process with transition density $P(x,t+\\tau\\mid x',t)$, define the derivative moments\n\n$$D^{(n)}(x,t)=\\frac{1}{n!}\\lim_{\\tau\\to0}\\frac{1}{\\tau}\\big\\langle (x(t+\\tau)-x)^n\\big\\rangle_{x(t)=x},$$\n\nand the Chapman–Kolmogorov equation rewrites exactly as\n\n$$\\partial_t P(x,t)=\\sum_{n=1}^{\\infty}\\left(-\\partial_x\\right)^n\\!\\left[D^{(n)}(x,t)\\,P(x,t)\\right].$$\n\nNothing has been approximated; nothing has been derived. The Fokker–Planck equation appears only when someone decides that $D^{(n)}=0$ for $n\\ge3$. The question this section answers is: who decided, when, and on what grounds — because the two names on the expansion belong to neither the first person to make the cut nor the person who established when it is allowed.\n\n**Rayleigh, 1891.** A heavy piston of mass $M$ in a one-dimensional gas of light particles of mass $m$ [1]. Rayleigh expands the collision kernel in the momentum transfer and retains two terms, obtaining a drift–diffusion equation for the piston's velocity distribution — the ancestor of the Klein–Kramers equation, half a century early. What matters is *why* he was entitled to stop: the mass ratio $\\gamma=m/M$ is an explicit ordering parameter, each collision changes $V$ by $\\mathcal{O}(\\gamma)$, and the higher jump moments are suppressed by powers of $\\gamma$ at fixed collision rate. Rayleigh's truncation is a controlled expansion in a small physical parameter. This is the last time in the lineage that it will be. The same collision operator, expanded to *all* orders, is reconstructed a century later in Hoare and Rahman's spectral treatment of the piston [2] — where the higher $D^{(n)}$ are explicitly computable and explicitly nonzero.\n\n**Planck, 1917.** Fokker's 1914 dipole calculation produced the equation; Planck supplied the general derivation, and the operation he performed is precisely the one now taught under another name: take an integral master equation with a short-time transition kernel, Taylor-expand in the jump variable, keep the first two moments, discard the rest [3]. That is the Kramers–Moyal truncation, in full, twenty-three years before Kramers and thirty-two before Moyal. Planck's name survives on the *equation* and not on the *expansion that produces it* — an inversion that is difficult to justify on any reading of the record. Note also what was lost between 1891 and 1917: Rayleigh's small parameter. Planck's derivation is general, and generality here means the truncation is now an assumption about the kernel rather than an order in an expansion.\n\n**Kolmogorov, 1931.** The conditions under which a Markov generator is *genuinely* second order are stated first in mathematics, not physics [4]. The forward equation appears as the special case in which a Lindeberg-type condition suppresses large jumps — roughly, $\\tau^{-1}\\!\\int_{|y-x|\u003e\\epsilon}P(y,\\tau\\mid x)\\,dy\\to0$ for every $\\epsilon\u003e0$ — which is exactly the hypothesis that makes $D^{(n\\ge3)}$ vanish. Everything the physics literature would later argue about was already available as a checkable condition on the process. It was checked by almost nobody.\n\n**Kramers, 1940.** Section 2 of the barrier-crossing paper [5] expands the Rayleigh-model collision integral in the momentum transfer and truncates at $n=2$ to reach the phase-space kinetic equation — which is the Klein–Kramers equation, with a 1921 Klein antecedent, not an expansion theorem. Kramers presents this as available technique en route to the escape rate the paper is actually famous for; he asserts no general result and claims no priority. The fifty-year retrospective [6] treats the 1940 paper the same way. Citing \"Kramers 1940\" for a general expansion over arbitrary Markov processes attributes to Kramers a generality he never stated.\n\n**Moyal, 1949.** The general statement — arbitrary order, arbitrary Markov process, discontinuous processes included, the Fokker–Planck equation exhibited as the $n=2$ truncation of an exact infinite-order equation — is Moyal's, and he owns it outright [7]. Its venue is the point. It appeared not in a physics journal but as a read-and-discussed survey in the Royal Statistical Society's Symposium on Stochastic Processes, sixty pages of *J. Roy. Statist. Soc. B* [7], written by someone with no physics position, trained as an engineer, and simultaneously being told by Dirac over a two-year correspondence that his phase-space formulation of quantum mechanics was not worth pursuing [8]. The statement most load-bearing for the whole subsequent literature was published outside the field it governs.\n\n### What the name records\n\nNeither half. The truncation is Planck's, with Rayleigh's piston as an explicit and better-justified precursor; the validity conditions are Kolmogorov's; Kramers supplied a worked instance inside a paper about something else; Moyal supplied the general identity but inherited the cut. The decisive theorem — that the truncation is not merely unjustified but, above second order, forbidden — is Pawula's 1967 result in an information-theory journal [9], itself anticipated in probability by Marcinkiewicz in 1939 [10], and neither appears in the name. Kramers and Moyal never collaborated, never co-authored, and the hyphen misleads readers into assuming a joint paper; Kramers died in 1952 and, so far as the record shows, never used the compound. The phrase is in circulation by the mid-1960s — it is already unremarked in Pawula's papers and standard by Stratonovich [11] and Risken [12] — but I have found no attestation of its first printed use (verify). Modern reference treatments still date the expansion to [Kramers 1940 and Moyal 1949](https://en.wikipedia.org/wiki/Kramers%E2%80%93Moyal_expansion) and mention neither Planck nor Kolmogorov."}, {"id": "the-identity-and-the-cut", "title": "The Physics, Properly: An Exact Identity, an Optional Cut, and a Theorem That Forbids Most Cuts", "markdown": "## The Physics, Properly: An Exact Identity, an Optional Cut, and a Theorem That Forbids Most Cuts\n\n### The identity\n\nTake a Markov process on $\\mathbb{R}$ with transition density $P(x,t+\\tau\\mid x',t)$ obeying Chapman–Kolmogorov. Nothing about what follows requires a physical model; it requires only that the process be Markov (**A1**) and that certain limits exist (**A2**, below).\n\nWrite the evolution of an arbitrary test function's average by inserting the trivial resolution of the identity in the jump variable $\\Delta = x - x'$. Using\n\n$$P(x,t+\\tau\\mid x',t)=\\int d\\Delta\\; \\delta(x-x'-\\Delta)\\,P(x'+\\Delta,t+\\tau\\mid x',t),$$\n\nand expanding the delta function as $\\delta(x-x'-\\Delta)=\\sum_{n\\ge 0}\\frac{(-\\Delta)^n}{n!}\\partial_x^n \\delta(x-x')$ (**A4**: the step is a formal Taylor operation whose convergence is *assumed*, not shown), the Chapman–Kolmogorov equation becomes, after integrating against $P(x',t)$ and dividing by $\\tau$,\n\n$$\\partial_t P(x,t)=\\sum_{n=1}^{\\infty}\\left(-\\partial_x\\right)^n \\big[D^{(n)}(x,t)\\,P(x,t)\\big],\\qquad D^{(n)}(x,t)=\\frac{1}{n!}\\lim_{\\tau\\to 0}\\frac{\\big\\langle (\\Delta x)^n\\big\\rangle_x}{\\tau}.$$\n\nThis is the Kramers–Moyal expansion in the form Moyal stated it in 1949 [7], generalizing the second-order truncation Planck had performed in 1917 [3] and Rayleigh, in effect, in 1891 [1]. **It is an identity.** Both sides are the same operator written twice; no approximation has been made and no physics has entered. In particular it *derives* nothing — least of all the Fokker–Planck equation, which appears only after one asserts $D^{(n)}=0$ for $n\\ge 3$. That assertion is an empirical claim about the process, external to the expansion.\n\nBoundary terms deserve a line: the surface contributions from repeated integration by parts vanish only if $P$ and all its derivatives decay fast enough, or the domain is unbounded, or the boundary conditions are natural (**A5**). On a finite interval with reflecting or absorbing walls this is a real constraint, and it is where the truncated and untruncated operators cease to agree even formally.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"360\" y=\"26\" fill=\"#e8e6e1\" font-size=\"17\" text-anchor=\"middle\" font-family=\"serif\"\u003eThe admissible generators, after Pawula\u003c/text\u003e\u003cline x1=\"60\" y1=\"330\" x2=\"670\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"60\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003en=1\u003c/text\u003e\u003ctext x=\"180\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003en=2\u003c/text\u003e\u003ctext x=\"300\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003en=3\u003c/text\u003e\u003ctext x=\"420\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003en=4\u003c/text\u003e\u003ctext x=\"540\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003en=5\u003c/text\u003e\u003ctext x=\"655\" y=\"356\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003en→∞\u003c/text\u003e\u003ctext x=\"365\" y=\"382\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eorder n of the derivative moment D⁽ⁿ⁾\u003c/text\u003e\u003ccircle cx=\"60\" cy=\"90\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"80\" y=\"95\" fill=\"#7ee0a3\" font-size=\"14\"\u003eLiouville / deterministic: only D⁽¹⁾ ≠ 0 — ALLOWED\u003c/text\u003e\u003ccircle cx=\"60\" cy=\"140\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"180\" cy=\"140\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"200\" y=\"145\" fill=\"#7ee0a3\" font-size=\"14\"\u003eFokker–Planck: D⁽¹⁾, D⁽²⁾ ≠ 0, all higher exactly zero — ALLOWED\u003c/text\u003e\u003ccircle cx=\"60\" cy=\"196\" r=\"7\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"180\" cy=\"196\" r=\"7\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"300\" cy=\"196\" r=\"7\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"420\" cy=\"196\" r=\"7\" fill=\"#ff7a90\"/\u003e\u003cline x1=\"440\" y1=\"182\" x2=\"470\" y2=\"210\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"470\" y1=\"182\" x2=\"440\" y2=\"210\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"495\" y=\"201\" fill=\"#ff7a90\" font-size=\"14\"\u003eany cut at finite n \u0026gt; 2 — FORBIDDEN (P goes negative)\u003c/text\u003e\u003ccircle cx=\"60\" cy=\"252\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"180\" cy=\"252\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"300\" cy=\"252\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"420\" cy=\"252\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"540\" cy=\"252\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"600\" cy=\"252\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"625\" cy=\"252\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"650\" cy=\"252\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"60\" y=\"292\" fill=\"#ffb86b\" font-size=\"14\"\u003ejump process: all D⁽ⁿ⁾ ≠ 0 — write the kernel W(x\\mid x\u0026#8242;), not the tower\u003c/text\u003e\u003cline x1=\"60\" y1=\"305\" x2=\"670\" y2=\"305\" stroke=\"#7aa2ff\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"360\" y=\"60\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003ePawula: one even D⁽ⁿ\u0026gt;²⁾ = 0 ⟹ D⁽ⁿ⁾ = 0 for all n ≥ 3\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Pawula's theorem does not select the second row — it deletes the third. The admissible Markov generators are exactly rows 1, 2 and 4; every finite truncation above second order (row 3) is excluded, so \"keep four terms for better accuracy\" is not a refinement of Fokker–Planck but a departure from probability theory.*\n\n### The theorem\n\nPawula's argument [9] is three lines of Cauchy–Schwarz on the short-time transition density. For the measure $P(x,t+\\tau\\mid x',t)\\,d x$ and integers $m$,\n\n$$\\big\\langle \\Delta^{2m}\\big\\rangle^2 \\;=\\; \\big\\langle \\Delta^{\\,m+k}\\,\\Delta^{\\,m-k}\\big\\rangle^2 \\;\\le\\; \\big\\langle \\Delta^{2(m+k)}\\big\\rangle\\,\\big\\langle \\Delta^{2(m-k)}\\big\\rangle.$$\n\nDivide by $\\tau^2$ and take $\\tau\\to 0$ (**A2**: the limits exist and are finite; **A5** again: the limit and the integration may be interchanged). If some even moment $D^{(2m)}$ vanishes while a lower even one does not, the inequality propagates the zero in both directions and collapses the entire hierarchy: $D^{(n)}=0$ for all $n\\ge 3$. Hence exactly three possibilities — stop at $n=1$ (deterministic), stop at $n=2$ (diffusion), or never stop. A truncation at $n=4$, $6$, … is not an improved approximation; it is an operator that does not generate a positivity-preserving semigroup, and Risken and Vollmer exhibited the negative densities explicitly for continuum approximations to the Poisson process [13].\n\nThe analytic parent is older and sharper. Marcinkiewicz proved in 1939 that $\\exp[P(\\lambda)]$ with $\\deg P \u003e 2$ is never a characteristic function [10]: a cumulant sequence cannot terminate above second order. Hänggi and Talkner made the bridge to truncation schemes in nonequilibrium physics explicit [14] — truncating a cumulant *hierarchy* above second order is incompatible with a nonnegative density (**A7**). Pawula's statement constrains the $\\tau\\to 0$ rates of a generator; Marcinkiewicz constrains a single distribution; Hänggi–Talkner is a third statement again. They are cousins, not synonyms.\n\n### The seven assumptions\n\n- **A1 — Markovianity.** No memory; Chapman–Kolmogorov holds exactly at the observed level of description.\n- **A2 — Existence of the derivative moments.** $\\lim_{\\tau\\to 0}\\langle \\Delta^n\\rangle_x/\\tau$ exists, is finite, and is approached uniformly enough in $x$ to be a coefficient function.\n- **A3 — Lindeberg/Kolmogorov suppression of large jumps.** $\\lim_{\\tau\\to 0}\\tau^{-1}\\int_{|\\Delta|\u003e\\epsilon} P\\,d\\Delta = 0$ for every $\\epsilon\u003e0$. This — Kolmogorov's 1931 condition [4] — is what makes the generator genuinely second order. It is a *hypothesis about the process*, and it is the one A-condition that, if satisfied, actually licenses the cut.\n- **A4 — Analyticity/convergence of the Taylor step.** The delta-expansion converges in the relevant function class; the reordering of sum and integral is legitimate.\n- **A5 — Boundary and interchange conditions.** Surface terms vanish; $\\tau\\to 0$ commutes with the spatial integrations.\n- **A6 — An ordering parameter.** Successive KM terms carry no intrinsic small parameter. Van Kampen's objection [15, 16, 17] is precisely that \"truncate at second order\" is meaningless without one; his $\\Omega^{-1/2}$ system-size expansion supplies it, and its leading order is the *linear*-noise equation, which is not the KM-truncated equation.\n- **A7 — Positivity of $P$.** The object being evolved must remain a probability density — the requirement Pawula and Marcinkiewicz enforce.\n\n**A1–A5** are needed for the identity; **A3** or **A6** for a controlled cut; **A7** forbids all other cuts. Kramers' 1940 use of the truncation [5] and Rayleigh's 1891 piston [1] both silently invoked A3 for a physical reason — small mass ratio, hence small momentum transfer per collision. That reason is a property of the model, not of the expansion. Absent it, the Fokker–Planck equation is not a derived consequence but a hypothesis: $D^{(4)}=0$, awaiting measurement."}, {"id": "where-each-assumption-dies", "title": "Strict Conditions \u0026 Failure Modes: What Breaks When A1–A7 Fail", "markdown": "## Strict Conditions \u0026 Failure Modes: What Breaks When A1–A7 Fail\n\nThe seven conditions of §2 are not a checklist of technical hygiene. Each one, when it fails, fails in a specific and quantifiable way, and the failures are not interchangeable. What follows walks them in order of how often they are violated silently.\n\n### A6 (an ordering parameter exists) — van Kampen's objection\n\nThis is the deepest failure because it is not a failure of the answer but of the question. Write the master equation for a one-step process with transition rates $W(x \\mid x')$ depending on jumps $r = x - x'$:\n\n$$D^{(n)}(x) = \\frac{1}{n!}\\int r^{n}\\, W(x+r \\mid x)\\, dr.$$\n\nNothing here is small. The $n$-th term of the KM series carries $\\partial_x^n D^{(n)}$, and no parameter multiplies it. Van Kampen's 1961 point [15] is that \"truncate at $n=2$\" is therefore not an approximation with a residual — there is nothing to compare the neglected terms *to*. His replacement introduces the system size $\\Omega$ explicitly, $x = \\Omega\\phi(t) + \\Omega^{1/2}\\xi$, under which the jump moments scale as $\\Omega^{1-n}$ after the transformation and the hierarchy becomes an honest power series in $\\Omega^{-1/2}$. Leading order is the *linear* Fokker–Planck (linear-noise) equation\n\n$$\\partial_t \\Pi = -\\alpha_1'(\\phi)\\,\\partial_\\xi(\\xi \\Pi) + \\tfrac12 \\alpha_2(\\phi)\\,\\partial_\\xi^2 \\Pi,$$\n\nwith drift linearized about the macroscopic trajectory and $\\alpha_2$ evaluated *on* that trajectory. Corrections are $O(\\Omega^{-1/2})$ and computable. The KM-truncated FPE keeps the full nonlinear $x$-dependence of $D^{(2)}(x)$ and carries no error estimate at all [16, 17].\n\nWhere do they disagree? Not on Gaussian fluctuations near a stable fixed point — there they agree to leading order, which is why the confusion survives. They disagree wherever the answer depends on the tail: barrier heights, escape rates, bimodal weights, behaviour near a bifurcation where $\\alpha_1'(\\phi) \\to 0$ and the $\\Omega^{-1/2}$ ordering itself collapses. Treating the two as the same equation is one of the standing conflations of the field.\n\n### A3 (jump suppression / Kolmogorov's Lindeberg-type condition) — Risken–Vollmer and negative $P$\n\nA3 demands that the short-time transition density concentrate: $\\lim_{\\tau\\to 0}\\tau^{-1}\\int_{|r|\u003e\\epsilon} P\\,dr = 0$. Fail it and you have a jump process, and Pawula forbids any finite cut above two. Risken and Vollmer made this concrete by taking a continuum approximation to the Poisson process — jump amplitudes all equal, so every $D^{(n)}$ is nonzero and comparable — and solving the KM expansion truncated at $n = 4$, $6$,... explicitly [13]. The truncated solutions do not merely lose accuracy: the density oscillates and goes negative, and the oscillation wavelength shrinks with the truncation order, so *higher* truncation is *worse*, not better. This is the diagnostic signature: a truncated-KM solution that is degrading as you add terms is telling you the series has no ordering parameter (A6) and no jump suppression (A3) simultaneously.\n\nDoering, Hagan and Rosenau, in the same year, gave the constructive response [18]: replace truncation with resummation. In Fourier space the exact generator is a symbol $\\hat{L}(k) = \\sum_n (ik)^n D^{(n)}$; a polynomial truncation of $\\hat L$ blows up at large $|k|$, whereas a Padé-type rational approximant stays bounded and preserves positivity of the semigroup while matching the same low-order moments the truncation was trying to capture. The lesson is that the pathology is an artefact of the *polynomial ansatz in $k$*, not of wanting a differential-operator approximation.\n\n### The two failures the literature merges\n\n\"Negative $P$\" is used to mean two things that must be separated.\n\n**Failure 1 — positivity loss in exponentially small tails.** A truncated operator can reproduce $\\langle x\\rangle$, $\\langle x^2\\rangle$, even $\\langle x^4\\rangle$ over finite times to controlled accuracy while producing $P \u003c 0$ in a region where $|P| \\sim e^{-S/\\epsilon}$ and nobody would measure it anyway [13]. This is ugly, not fatal; the numbers you extracted may be fine.\n\n**Failure 2 — loss of a Markov semigroup.** The truncated operator, for $n\u003e2$, is not the generator of a positivity-preserving contraction semigroup on probability measures. This kills a whole class of objects at once, not just tail values: there is no stationary distribution to speak of, no well-defined mean first-passage time, no large-deviation rate function, no detailed-balance argument, no Feynman–Kac representation. Anything defined by a $t\\to\\infty$ limit or by an optimization over the exponential tail is not merely inaccurate but undefined. Practitioners routinely commit Failure 2 while reassuring themselves about Failure 1.\n\n### A7 (the truncation must be accurate where the observable lives) — the exponential price\n\nFailure 2 has a number attached to it. Hänggi, Grabert, Talkner and Thomas took a bistable master equation and built the conventional KM-truncated FPE from it [19]. The escape rate is $k \\sim \\exp(-\\Phi_{\\rm b})$ with an exponent set by an integral of $D^{(1)}/D^{(2)}$ along the barrier path; the truncation gets $D^{(2)}$ wrong precisely in the low-population barrier region, so the *exponent* is wrong, and the rate error is exponential in the barrier height — orders of magnitude, not percent, and it does not improve with better statistics. They constructed an alternative FP modeling that matches the master equation's stationary distribution and long-time dynamics by construction; the same programme carried over to nonlinear shot noise in negative-differential-resistance circuits [20], with the same verdict on the conventional scheme. The rate-theory review [6] records the general principle: rates are exponential-tail observables, and A7 says an approximation valid near the wells is not thereby valid at the barrier.\n\n### The remaining conditions, briefly\n\nA1 (Markovianity) and A2 (existence of the $\\tau\\to0$ limits) fail together in practice, and their failure is invisible in a fit — which is why they belong to the estimation discussion rather than here. A4 (smoothness of $D^{(n)}$ in $x$) fails at absorbing boundaries and at reaction thresholds, where the \"coefficient\" is a distribution. A5 (stationarity of the coefficients over the fitting window) fails in every non-autonomous system fitted with pooled data; the pooling manufactures an apparent $D^{(2)}$ out of drift heterogeneity. That last mechanism is the subject of §5, because it is the failure mode that produces a *plausible* Fokker–Planck equation rather than a visibly broken one."}, {"id": "smoking-guns-for-genuine-diffusion", "title": "Signatures: Direct vs Indirect Evidence That Nature Stopped at Two", "markdown": "## Signatures: Direct vs Indirect Evidence That Nature Stopped at Two\n\nEverything in §2 and §3 reduces to one empirical question: is $D^{(n)}(x)=0$ for all $n\\ge 3$? Pawula's theorem makes this question binary — by the Cauchy–Schwarz argument [9, 21], the answer is \"all of them vanish\" or \"none of them do.\" There is no partial credit, no \"$D^{(4)}$ is small so we neglect it.\" A small nonzero $D^{(4)}$ means an infinite tower of nonzero coefficients, i.e. a jump kernel, i.e. a generator that is not a differential operator at all. So the measurement is well posed. The trouble is that the object to be measured is defined by a limit no dataset contains.\n\n### The direct test, and why it is a scaling test\n\nThe only direct evidence is the $\\tau$-dependence of the conditional moments themselves. Write the raw (unnormalized) moments\n\n$$M_n(x,\\tau)=\\big\\langle (X_{t+\\tau}-X_t)^n \\big\\rangle_{X_t=x},\\qquad D^{(n)}(x)=\\frac{1}{n!}\\lim_{\\tau\\to0}\\frac{M_n(x,\\tau)}{\\tau}.$$\n\nFor a genuine diffusion with continuous paths, $M_2\\sim 2D^{(2)}\\tau$ while $M_4 \\sim 3\\,(2D^{(2)}\\tau)^2 = O(\\tau^2)$ — the fourth moment is *Gaussian-slaved* to the second, and the ratio\n\n$$Q(x,\\tau)\\equiv\\frac{M_4(x,\\tau)}{3\\,M_2(x,\\tau)^2}\\to 1,\\qquad \\frac{D^{(4)}}{D^{(2)}}\\Big|_{\\tau}\\;\\propto\\;\\frac{M_4}{\\tau}\\Big/\\frac{M_2}{\\tau}\\;=\\;\\frac{M_4}{M_2}\\;\\xrightarrow{\\ \\tau\\to0\\ }0.$$\n\nFor a jump-diffusion with jump rate $\\lambda$ and jump-amplitude moments $\\langle \\xi^n\\rangle$, both $M_2$ and $M_4$ acquire terms *linear* in $\\tau$: $M_4 \\simeq \\lambda\\langle\\xi^4\\rangle\\tau$, so $M_4/M_2 \\to \\lambda\\langle\\xi^4\\rangle/(2D^{(2)}+\\lambda\\langle\\xi^2\\rangle)$, a finite constant with the dimensions of amplitude squared. This is precisely the Anvari–Tabar–Peinke–Lehnertz criterion [22]: the small-$\\tau$ plateau of $D^{(4)}/D^{(2)}$ estimates the mean-square jump amplitude, and its extrapolation to zero is the signature of pure diffusion. The test is non-parametric and it is a *scaling* test — a single value of $D^{(4)}$ at one $\\Delta t$ says nothing at all.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eScaling of the fourth-to-second moment ratio\u003c/title\u003e\u003cline x1=\"90\" y1=\"330\" x2=\"670\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"90\" y1=\"330\" x2=\"90\" y2=\"50\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"368\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\"\u003esampling interval τ → (log scale)\u003c/text\u003e\u003ctext x=\"30\" y=\"190\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" transform=\"rotate(-90 30 190)\"\u003eM₄ / M₂ [amplitude²]\u003c/text\u003e\u003ctext x=\"96\" y=\"348\" fill=\"#e8e6e1\" font-size=\"14\"\u003eτ→0 (inaccessible)\u003c/text\u003e\u003ctext x=\"600\" y=\"348\" fill=\"#e8e6e1\" font-size=\"14\"\u003eΔt of data\u003c/text\u003e\u003crect x=\"90\" y=\"50\" width=\"150\" height=\"280\" fill=\"#ff7a90\" opacity=\"0.10\"/\u003e\u003ctext x=\"165\" y=\"72\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003eno data here\u003c/text\u003e\u003ctext x=\"165\" y=\"92\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003e(Pawula lives here)\u003c/text\u003e\u003cpath d=\"M240 300 C 330 290, 430 270, 560 235\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cpath d=\"M240 300 C 200 305, 150 310, 92 316\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"575\" y=\"230\" fill=\"#7ee0a3\" font-size=\"15\"\u003ediffusion: M₄/M₂ ∝ τ → 0\u003c/text\u003e\u003cpath d=\"M240 150 C 330 152, 430 158, 560 172\" stroke=\"#ffb86b\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cpath d=\"M240 150 C 200 149, 150 148, 92 147\" stroke=\"#ffb86b\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"6 5\"/\u003e\u003cline x1=\"92\" y1=\"147\" x2=\"670\" y2=\"147\" stroke=\"#ffb86b\" stroke-width=\"1\" stroke-dasharray=\"3 6\" opacity=\"0.6\"/\u003e\u003ctext x=\"575\" y=\"168\" fill=\"#ffb86b\" font-size=\"15\"\u003ejump-diffusion: plateau ⟨ξ⁴⟩/⟨ξ²⟩\u003c/text\u003e\u003ctext x=\"100\" y=\"140\" fill=\"#ffb86b\" font-size=\"14\"\u003eλ⟨ξ⁴⟩ / (2D⁽²⁾+λ⟨ξ²⟩)\u003c/text\u003e\u003cpath d=\"M240 105 C 330 100, 430 92, 560 78\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cpath d=\"M240 105 C 200 112, 150 122, 92 136\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"575\" y=\"74\" fill=\"#7aa2ff\" font-size=\"15\"\u003etruncated Lévy: rises, then bends\u003c/text\u003e\u003ccircle cx=\"240\" cy=\"300\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"240\" cy=\"150\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"240\" cy=\"105\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003cline x1=\"240\" y1=\"50\" x2=\"240\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 4\" opacity=\"0.5\"/\u003e\u003ctext x=\"248\" y=\"64\" fill=\"#e8e6e1\" font-size=\"14\"\u003esmallest resolved τ\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The discriminating observable is the slope, not the value. All three processes can be tuned to give the same $M_4/M_2$ at the experimental $\\Delta t$ (dashed vertical); they separate only as $\\tau$ decreases, and the region where Pawula's theorem actually speaks (shaded) is the region no experiment reaches. Dashed curve segments are extrapolation, not measurement.*\n\n### The circumstantial signatures, and what else produces them\n\nEverything short of the $\\tau$-scaling of $M_4$ is compatible with a generator that is not second order. The recurring claims, and their impostors:\n\n| Signature offered as evidence | Also produced by | Discriminating measurement |\n|---|---|---|\n| Gaussian increment histogram at $\\Delta t$ | Compound Poisson with $\\lambda\\Delta t\\gg1$ (CLT washes out the jumps) | Vary $\\Delta t$: kurtosis excess must fall as $\\Delta t^{-1}$ for jumps, stay $0$ for diffusion |\n| Linear MSD, $\\langle\\Delta x^2\\rangle\\propto t$ | Any finite-variance jump process; truncated Lévy beyond the cutoff crossover | $M_4$ scaling; MSD is $n=2$ information only |\n| Exponential velocity autocorrelation | Ornstein–Uhlenbeck driven by *any* white noise, Gaussian or not — the ACF sees only $D^{(2)}$ | Higher-order structure functions; conditional moments at fixed $x$ |\n| Clean drift–diffusion fit, small residual | Hidden slow variable: projecting a 2D Markov process onto one coordinate leaves a non-Markov 1D process whose fitted $D^{(1)},D^{(2)}$ are $\\Delta t$-dependent [23] | Markov test on the conditional density; check $\\hat D^{(i)}$ stability vs $\\Delta t$ |\n| $\\hat D^{(4)}\\approx0$ from a fit | Insufficient statistics — $M_4$ needs $O(10^2)$ times the samples of $M_2$ per bin, and estimator variance biases $\\hat D^{(4)}$ toward zero | Bootstrap the bin-wise error bar before declaring a null |\n| Stationary density matches $P_s\\propto (D^{(2)})^{-1}\\exp\\!\\int\\! D^{(1)}/D^{(2)}$ | Nothing — but this is a consistency check, not a test: it uses only the fitted $D^{(1,2)}$ and is insensitive to the tower above | Escape rates / mean first-passage times, which *are* sensitive [19, 20] |\n\nThat last row deserves emphasis. The Hänggi–Grabert–Talkner–Thomas result [19] is the operational content of Pawula's theorem: two models agreeing on drift, diffusion and the stationary density can differ *exponentially* in barrier-crossing rate, because the rate is governed by the tails where $D^{(n\u003e2)}$ lives. If your application is a rate, a switching time, or a large deviation, the circumstantial signatures certify nothing.\n\n### The limit that data cannot supply\n\nEvery statement in this section about $D^{(n)}$ refers to $\\lim_{\\tau\\to0}$. Estimators return $\\hat D^{(n)}(x,\\Delta t)$ at the finite sampling interval, and at finite $\\Delta t$ the orders mix: Ragwitz and Kantz showed the leading finite-time corrections are $O(\\Delta t)$ and non-negligible in exactly the nonlinear regimes of interest, and gave a correction scheme [24]; Friedrich, Renner, Siefert and Peinke contested the generality of the claim, with a reply from the original authors [25]. The dispute was never fully resolved and its residue is a working convention: extrapolate $\\hat D^{(n)}(x,\\Delta t)$ linearly in $\\Delta t$ toward zero and quote the intercept, with the extrapolation range reported. Two structural obstructions remain and no amount of data removes them. First, the $\\Delta t\\to0$ end is bounded below by the measurement bandwidth — an anti-aliasing filter converts a jump process into a smooth one by construction, manufacturing continuity in the data that does not exist in the system. Second, $\\hat D^{(4)}$ is a statement about the fourth moment of a conditional distribution estimated in a bin, so its variance grows with the eighth moment; the null result \"$D^{(4)}$ is consistent with zero\" is usually a statement about sample size, not about nature. Software that computes coefficients to arbitrary order [26] makes the diagnostic cheap to run, which is welcome, but it does not make the extrapolation legitimate — and the $n\\le2$ fit remains the default for anyone who never plots $\\hat D^{(4)}/\\hat D^{(2)}$ against $\\Delta t$ at all."}, {"id": "pawula-as-a-permission-slip", "title": "Use \u0026 Abuse: Pawula's Theorem Cited Backwards, and the D⁽²⁾ That Is a Sampling Artifact", "markdown": "## Use \u0026 Abuse: Pawula's Theorem Cited Backwards, and the D⁽²⁾ That Is a Sampling Artifact\n\nThe modern pipeline is three lines long. Take a scalar time series sampled at $\\Delta t$; bin on the state $x$; form the conditional moments\n\n$$M^{(n)}(x,\\Delta t)=\\frac{1}{n!\\,\\Delta t}\\big\\langle [x(t+\\Delta t)-x(t)]^{n}\\big\\rangle_{x(t)=x};$$\n\nread $M^{(1)}\\to D^{(1)}$ as drift and $M^{(2)}\\to D^{(2)}$ as diffusion; write down $\\dot x = D^{(1)}(x)+\\sqrt{2D^{(2)}(x)}\\,\\Gamma(t)$ and call the system a Langevin process. Friedrich and Peinke's turbulence cascade paper [27] made this a method rather than a curiosity, and the packaged estimators — `kramersmoyal` [26], the sparse-regression variants [28], the inference reviews that present drift–diffusion fitting as the default model class [29] — made $n\\le 2$ the path of least resistance. Nothing in the pipeline requires the user to ever compute $D^{(4)}$, and the software will happily return it if asked, which is precisely why its absence from papers is diagnostic.\n\n### The theorem, run in reverse\n\nThe sentence that appears, in near-identical form, across turbulence, physiology, finance and climate papers is: *by Pawula's theorem, the vanishing of the fourth coefficient permits truncation of the Kramers–Moyal expansion after the second term.* Read literally this is true and useless; read as it is used — as a license — it is the theorem inverted. Pawula [9, 21] supplies a constraint, not a permission: the Cauchy–Schwarz inequality $M_{n+m}^{2}\\le M_{2n}M_{2m}$ on the short-time jump moments forces the sequence $D^{(n\\ge3)}$ to be identically zero or to have no zeros at all. The antecedent \"$D^{(4)}=0$\" is an empirical claim about the system, and it is the claim almost nobody establishes.\n\nWorse, the theorem is not continuous in the way practitioners assume. \"$D^{(4)}$ is small, therefore truncation is approximately valid\" has no support in the theorem and no accompanying error bound; the counterexamples of Risken and Vollmer [13] and the exponentially wrong escape rates of Hänggi *et al.* [19] are exactly cases where the higher coefficients are numerically small and the truncation is qualitatively wrong. What Pawula's inequality *does* license is quantitative and rarely used: at the same order,\n\n$$\\big[D^{(3)}(x)\\big]^{2}\\le \\tfrac{4}{3}\\,D^{(2)}(x)\\,D^{(4)}(x),$$\n\na bound on the leading non-Gaussian coefficient in terms of two measurable ones. That is a usable consistency check. \"Therefore we keep two terms\" is not.\n\n### Why $D^{(4)}$ is small no matter what\n\nThe deeper problem is that at fixed $\\Delta t$ the null hypothesis is nearly unfalsifiable. For a *genuine* diffusion, Gaussian increments give $\\langle \\Delta x^{4}\\rangle = 3\\langle\\Delta x^{2}\\rangle^{2}=12\\,[D^{(2)}]^{2}\\Delta t^{2}$, hence\n\n$$D^{(4)}(x,\\Delta t)\\simeq \\tfrac{1}{2}\\big[D^{(2)}(x)\\big]^{2}\\,\\Delta t \\;\\xrightarrow{\\ \\Delta t\\to0\\ }\\;0.$$\n\nFor a compound Poisson process of rate $\\lambda$ and jump amplitude $\\xi$, every coefficient is $\\Delta t$-independent, $D^{(n)}=\\lambda\\langle\\xi^{n}\\rangle/n!$, so $D^{(4)}/D^{(2)}=\\tfrac{1}{12}\\langle\\xi^{4}\\rangle/\\langle\\xi^{2}\\rangle$ tends to a finite jump scale. This is the Anvari–Tabar–Peinke–Lehnertz criterion [22], and it is the whole test: not the *value* of $D^{(4)}$ but its *scaling in $\\Delta t$*. A single-$\\Delta t$ measurement of \"$D^{(4)}\\approx 0$ within error bars\" distinguishes nothing, because the diffusive prediction is itself small and $O(\\Delta t)$. The estimator returns a small number for both hypotheses, and the practitioner reads it as confirmation.\n\nThe same logic manufactures the $D^{(2)}$ itself. A pure jump process has a perfectly finite second jump moment, $D^{(2)}=\\lambda\\langle\\xi^{2}\\rangle/2$, which the binning procedure returns as a smooth, state-dependent \"diffusion coefficient.\" Nothing in the fit reveals that the paths are discontinuous. Additive measurement noise of variance $\\sigma^{2}$ does the reverse damage, contributing $\\sim\\sigma^{2}/\\Delta t$ to $M^{(2)}$ and a spurious $-x/\\Delta t$ relaxation to $M^{(1)}$ — a diffusion that diverges as the sampling improves. Between them, a discontinuous process observed through a noisy instrument can present as a textbook Ornstein–Uhlenbeck process at every $\\Delta t$ anyone bothers to try.\n\n### The dispute that should have settled this\n\nRagwitz and Kantz [24] made the point sharply in 2001: the $\\tau\\to0$ limit defining $D^{(n)}$ is never taken, the finite-$\\Delta t$ coefficients mix orders — the leading correction to $M^{(2)}$ contains $\\tfrac{1}{2}[D^{(1)}]^{2}\\Delta t$, so drift leaks into diffusion at first order — and corrections are mandatory. Friedrich, Renner, Siefert and Peinke replied that the correct procedure is extrapolation of the measured $M^{(n)}(x,\\Delta t)$ to $\\Delta t\\to0$, with a full series rather than the specific first-order correction proposed, and disputed its application to their cascade data; Ragwitz and Kantz replied in turn [25]. It remains the sharpest validity dispute in the field, and it has been technically superseded rather than adjudicated — [Lade (2009)](https://arxiv.org/abs/0905.4324) and [Rydin Gorjão, Witthaut, Lehnertz and Lind (Entropy 2021)](https://doi.org/10.3390/e23050517) give finite-time corrections to arbitrary order via Bell polynomials, valid for discontinuous processes too. The corrections exist, are implemented, and are skipped.\n\n### Tells of a hollow claim\n\nApplied across turbulence, EEG and heart-rate physiology, financial returns and volatility, wind-power and climate indices, the phrase \"we reconstructed the Fokker–Planck equation\" is now weaker than it sounds. Three absences, any one of which voids the claim:\n\n| Missing | What it would have shown | Standard tool |\n|---|---|---|\n| Reported $D^{(4)}(x)$ with its $\\Delta t$-scaling | Diffusion ($\\propto\\Delta t$) vs. jumps (constant) | [22]; [`jumpdiff`](https://www.jstatsoft.org/article/view/v105i04) |\n| A $\\Delta t$-dependence study or $\\Delta t\\to0$ extrapolation | Whether $D^{(1)},D^{(2)}$ are limits or artifacts | [24, 25]; Bell-polynomial corrections |\n| A Markovianity test | Whether a KM expansion applies at all | Chapman–Kolmogorov / Wilcoxon; Markov–Einstein length |\n\nThe third is the most often forgotten and the most fundamental: the entire construction of §2 presupposes Chapman–Kolmogorov. Without a measured Markov–Einstein scale below which the process is *not* Markovian, the estimated $D^{(n)}$ are moments of nothing in particular. A paper reporting $D^{(1)}$ and $D^{(2)}$, a Pawula sentence, and none of these three has not measured that nature stopped at second order. It has measured that its sampling interval did.\n\n**Sources:** [Ragwitz \u0026 Kantz, PRL 87, 254501](https://link.aps.org/doi/10.1103/PhysRevLett.87.254501) · [Friedrich et al., Comment, PRL 89, 149401](https://doi.org/10.1103/PhysRevLett.89.149401) · [Lade, finite sampling interval effects](https://arxiv.org/abs/0905.4324) · [Rydin Gorjão et al., Entropy 23, 517](https://doi.org/10.3390/e23050517) · [jumpdiff, J. Stat. Soft. 105(4)](https://www.jstatsoft.org/article/view/v105i04) · [Chapman–Kolmogorov memory-length test, Sci. Rep. 2025](https://www.nature.com/articles/s41598-025-92238-8)"}, {"id": "mutated-and-the-checklist", "title": "Status \u0026 the Believer's Checklist: What AETHER Demands Before It Believes Your Fokker–Planck", "markdown": "## Status \u0026 the Believer's Checklist: What AETHER Demands Before It Believes Your Fokker–Planck\n\n### The theorem is fine; the tradition around it is not\n\nThere is no live controversy at the level of the mathematics. Pawula's structure theorem is stated correctly in Risken [12] — including the explicit negative-density counterexamples for truncation at $n=4,6$ [13] — and correctly in Gardiner [30], which additionally does the thing that most later texts do not: it presents the differential Chapman–Kolmogorov equation with drift, diffusion and an *integral* jump term $W(x\\mid x')$ as the primitive object, so that \"the KM series diverges\" is visibly a statement about a Taylor representation and not about the physics. Both books are three to four decades old and neither has been superseded on this point.\n\nWhat mutated is everything downstream. The pedagogical chain — lecture notes, methods sections, review articles — reduces §2 of this dossier to a single sentence (\"by Pawula's theorem we may truncate at second order\") that inverts the theorem's content, and deletes van Kampen's objection [15, 16, 17] entirely. The deletion is not incidental: van Kampen's point is that the KM series carries no ordering parameter, so the cut at $n=2$ is an assumption, and once that sentence is gone the truncation reads as a derivation. The $\\Omega^{-1/2}$ expansion survives in the stochastic-chemistry and population-dynamics literature — where the system size is unambiguous and the tutorial reviews keep the linear-noise approximation distinct from the KM-truncated FPE [29] — and has largely evaporated from the time-series-fitting literature, where no $\\Omega$ presents itself and none is invented.\n\nThe data-analysis branch has, to its credit, produced its own corrective machinery, most of it unused. Anvari *et al.* [22] give the fourth-moment criterion: for a jump-diffusion, $D^{(4)}/D^{(2)}$ tends to a finite jump amplitude rather than to zero. Lehnertz and collaborators sharpened this into the $Q$-ratio test on the $\\tau$-scaling of $D^{(6)}/D^{(4)}$ — linear in $\\tau$ for pure diffusion, flat for jumps — and [Rydin Gorjão, Witthaut, Lehnertz and Lind (2021)](https://arxiv.org/abs/2104.12813) derived finite-time corrections to the KM operator at arbitrary order, which is the constructive resolution of the Ragwitz–Kantz dispute [24, 25]: the bias is real, and it is now computable rather than merely lamented. A packaged jump-diffusion estimator exists ([jumpdiff](https://www.jstatsoft.org/article/view/v105i04), JSS 105(4), 2023) alongside the general-purpose `kramersmoyal` [26]. The asymmetry is stark: the tool that fits $D^{(1)},D^{(2)}$ and stops is one import away, and so is the tool that would falsify it.\n\n### The honest alternatives, and why there is really only one\n\nFour routes exist past the illegitimate cut, and they are not four ideas.\n\n- **Differential Chapman–Kolmogorov with an explicit kernel** [30]: write $W(x\\mid x')$, keep drift and diffusion for the continuous part, and integrate the rest.\n- **Lévy–Itô**: the same statement structurally — continuous paths plus a jump measure — with the decomposition guaranteed rather than assumed.\n- **Resummation**: Padé-type or quasicontinuum approximants to the KM operator [18], which retain finite-time accuracy without the positivity pathology; and the consistent Fokker–Planck modelings of Hänggi *et al.* [19, 20], which fix the observable that naive truncation destroys (the escape rate) rather than the equation's form.\n- **$\\Omega$-expansion** [15]: legitimate only when a system size exists.\n\n\"Keep all orders in $D^{(n)}$\" and \"write down the jump kernel\" are the same statement. Only the second is computable, only the second generates a Markov semigroup on probability measures, and only the second has an estimator. A paper that says \"higher orders are presumably small\" has chosen the uncomputable phrasing in order to avoid the estimation.\n\n### The checklist\n\nNothing below is exotic; every item is a few lines of the analysis you already ran.\n\n1. **Report $D^{(4)}(x)$.** Not \"we assumed it negligible\" — the estimate, with error bars, on the same $x$-grid as $D^{(2)}$. Defends **A5** ($D^{(n\\ge3)}=0$). An unreported $D^{(4)}$ is an unreported result, not an absent one.\n2. **Report its $\\tau$-scaling.** $D^{(4)}(x,\\tau)/D^{(2)}(x,\\tau)\\to 0$ as $\\tau\\to0$ for diffusion; $\\to$ finite for jump-diffusion [22]. Equivalently, the $Q$-ratio $D^{(6)}/D^{(4)}$: linear in $\\tau$ = diffusion, flat = jumps. Also **A5**.\n3. **Show every coefficient as a function of $\\Delta t$,** not at one sampling interval. Defends **A3** (the $\\tau\\to0$ limits exist). A $D^{(1)}$ that drifts with $\\Delta t$ is a finite-time coefficient with orders mixed in, not a drift [24], and finite-time corrections at arbitrary order are now available, so \"we used the smallest available $\\Delta t$\" is no longer an answer.\n4. **Test Markovianity explicitly** — Chapman–Kolmogorov on the estimated three-point densities, or a Wilcoxon/conditional-independence test — and report the Markov–Einstein time. Defends **A1**. Fitting $D^{(n)}$ to a non-Markov series returns numbers regardless.\n5. **State the ordering parameter.** $\\Omega^{-1/2}$, mass ratio, jump size over correlation length — name it, and give the order of the neglected term. Defends **A7**. If there is none, say so; that is van Kampen's objection reappearing in your own paper and it is not disqualifying, only unhedgeable.\n6. **Compare against the jump-diffusion null.** Fit drift, diffusion *and* jump amplitude/rate; report the likelihood or information-criterion gap. Defends **A5**. A pure diffusion that is not compared against jump-diffusion has not been tested.\n7. **Check positivity and normalization** of the propagated solution over the times you actually claim. Defends **A6**. Negativity in the far tail may be tolerable [13]; negativity where you compute rates is not.\n8. **Report the boundary/tail behaviour** used in the integrations by parts — natural, reflecting, absorbing — and confirm the stationary solution is normalizable. Also **A6**.\n9. **If you quote a rate, a stationary density, or a large-deviation exponent, justify the semigroup.** These are exactly the observables the truncation gets exponentially wrong [19, 20]. **A4/A6**.\n10. **Separate measurement noise from dynamical noise.** Additive observational noise inflates $D^{(2)}$ at small $\\tau$ and manufactures higher moments; report the estimate with and without deconvolution. **A2/A3**.\n11. **Bin-count and bandwidth sensitivity.** KDE-based estimators [26] and sparse-regression variants [28] have hyperparameters that move $D^{(2)}$; show it doesn't move much.\n12. **Say which theorem you are invoking.** Pawula [9] constrains jump moments; Marcinkiewicz [10] constrains a single distribution's cumulants; Hänggi–Talkner [14] bridge them for hierarchies. Citing the wrong one is the tell."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier separating an identity from an approximation. Here is where I stand.\n\n### (a) What I would defend with my reputation\n\nThree things.\n\nFirst: **the Kramers–Moyal expansion derives nothing.** It is a rewriting of Chapman–Kolmogorov in terms of derivative moments, exact wherever the moments exist and the series converges, and it is as true of a Poisson jump process as of Brownian motion. Every sentence of the form \"expanding to second order we obtain the Fokker–Planck equation\" is an assumption wearing a derivation's clothes. The assumption is $D^{(n)}=0$ for $n\\ge 3$, and it must be earned — from Kolmogorov's continuity condition [4], from a system-size parameter, or from measurement. Nowhere else.\n\nSecond: **Pawula's theorem is a prohibition, not a permit** [9]. Given the exact jump moments, either the tower terminates at two or it never terminates. The theorem therefore says that the truncation everyone performs is legal precisely when it was unnecessary — when nature already stopped. It cannot be invoked to justify stopping. I have seen it cited backwards often enough that I now treat the citation as a diagnostic: a paper that thanks Pawula for licensing its truncation has not read Pawula.\n\nThird: **the name is wrong twice over.** The truncated equation is Planck's [3] with Rayleigh's piston [1] behind it; the analytic condition is Kolmogorov's [4]; the general expansion is Moyal's [7]; and Kramers' 1940 paper [5] contains a phase-space kinetic equation and an escape rate, not a general expansion theorem. Kramers asserted no generality; the compound name assigns him one posthumously. And the theorem's mathematical content is Marcinkiewicz's [10] — a connection that entered physics only through Hänggi and Talkner [14], four decades late, because Pawula published the general result in an information-theory journal [9] while the physics community cited his *Phys. Rev.* application [21].\n\n### (b) What is shakier than the literature admits\n\nNot the mathematics — the epistemics around it. Four specific assumptions, all routinely silent:\n\n**The limit is not the estimate.** Every Pawula argument concerns $\\tau\\to 0$. Every measurement returns a finite-$\\Delta t$ coefficient in which the orders mix, and a pure jump process produces a perfectly respectable apparent $D^{(2)}$ [24, 25]. The inference \"$D^{(4)}$ came out small, so we truncate\" is not weak evidence for a mathematical statement about the limit; it is no evidence at all unless the $\\Delta t$-dependence is exhibited and extrapolated. This is the single most common unstated assumption in the field.\n\n**Convergence of the series is assumed, never checked.** The expansion presumes the short-time transition density is analytic in the moment sense. For heavy-tailed or Lévy-driven dynamics the moments defining $D^{(n)}$ diverge outright and the identity itself — not merely the truncation — fails. The right object was always the differential Chapman–Kolmogorov equation with its explicit jump kernel $W(x\\mid x')$ [30]; the divergent tower of $D^{(n)}$ is just that kernel's Taylor moments, and only the kernel is computable.\n\n**Markovianity is imported wholesale.** Everything above assumes it. Coarse-grained observables of Hamiltonian systems are generically non-Markovian, and a fitted $D^{(2)}(x)$ absorbs memory as state-dependent noise without complaint.\n\n**Truncation at fourth order is condemned by the wrong argument.** Loss of positivity is a statement about tails and long times. A fourth-order truncation can track low-order moments over finite times to controlled accuracy while producing a negative density where the density is $e^{-20}$ anyway [13]. The honest indictment is that the truncated operator generates no Markov semigroup — hence no rates, no stationary state, no large deviations — not that its every number is wrong. Resummation approaches [18] exist to keep the accuracy without the pathology.\n\n### (c) The three open questions I would work on\n\n1. **A finite-$\\Delta t$ inverse theory.** Given estimated $M^{(n)}(x,\\Delta t)$ over a range of $\\Delta t$, decide between \"diffusion\" and \"jumps + drift\" with a stated error bound. This is the bottleneck: it converts the entire Pawula discussion from unfalsifiable to testable, and it is a well-posed statistics problem nobody owns.\n\n2. **Error bounds for the KM truncation itself.** Van Kampen's $\\Omega$-expansion has an explicit small parameter [16]; the KM truncation has none. What controls the neglected $D^{(n\\ge3)}$ when there is no system size — and what functional of the jump kernel bounds the induced error in escape rates?\n\n3. **Positivity-preserving higher-order approximants.** Which resummations of the tower [18] generate a genuine Markov semigroup, and how do they compare to simply writing $W(x\\mid x')$? I suspect the honest answer is often \"they don't beat the kernel,\" which would be a useful result.\n\n**Reading path:**\n\n1. **Moyal (1949)** [7] — read the general expansion from its actual author, arbitrary order, jumps included, before any physics textbook edits it down to two terms.\n2. **Pawula, *IEEE Trans. Inf. Theory* (1967)** [9] — the general structure theorem in its real venue; the Cauchy–Schwarz argument is three lines and permanently inoculates you against the backwards citation.\n3. **Risken, *The Fokker–Planck Equation*** [12] — the faithful monograph treatment: it states the expansion and the theorem correctly, so you can see exactly which step the teaching tradition deleted.\n4. **Van Kampen** [16] — the standing critique from Kramers' own student: why a truncation without a small parameter is not an approximation scheme, and how $\\Omega^{-1/2}$ differs from KM precisely at barriers and bifurcations.\n5. **Hänggi and Talkner (1980)** [14] — the paper that finally connected Pawula to Marcinkiewicz [10], and the correct last word on what positivity forbids."}], "references": [{"n": 1, "title": "LIII. Dynamical problems in illustration of the theory of gases", "authors": ["Lord Rayleigh (J. W. Strutt)"], "year": 1891, "venue": "The London, Edinburgh and Dublin Philosophical Magazine ser. 5, 32(198), 424-445", "url": "https://doi.org/10.1080/14786449108620207", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "On the spectral theory of Rayleigh's piston. I. The discrete spectrum", "authors": ["M. R. Hoare", "M. Rahman"], "year": 1973, "venue": "Journal of Physics A Mathematical Nuclear and General", "url": "https://doi.org/10.1088/0305-4470/6/10/006", "cited_by": 14, "bucket": "earliest"}, {"n": 3, "title": "Über einen Satz der statistischen Dynamik und seine Erweiterung in der Quantentheorie", "authors": ["Max Planck"], "year": 1917, "venue": "Sitzungsberichte der Königlich function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+
      (D.credit_audit?'<div class="callout" style="margin-top:22px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>':'')+'</section>';
  }
  var langHtml='';
  if(hasCF){
    langHtml='<section class="block" id="blk-language"><h3>Watch your language</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></section>';
  }
  /* prose sections */
  var sectionsHtml=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* references (kept at the end) */
  var refsHtml='';
  if(D.references&&D.references.length){
    refsHtml='<div class="block" id="blk-refs"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
