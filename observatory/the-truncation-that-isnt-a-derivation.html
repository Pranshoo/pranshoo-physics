<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Truncation That Isn't a Derivation", "alternativeHeadline": "Kramers-Moyal expansion truncation", "name": "Kramers-Moyal expansion truncation", "description": "Kramers–Moyal, Pawula, and the second-order habit that survives because nobody measures D⁽⁴⁾.", "inLanguage": "en", "keywords": ["Kramers-Moyal expansion truncation", "Kramers-Moyal expansion", "KM expansion", "Moyal expansion", "jump-moment expansion", "derivative-moment expansion", "generalized Fokker-Planck equation", "differential Chapman-Kolmogorov expansion", "diffusion approximation (as the n=2 truncation)", "Kramers-Moyal coefficients D^(n)", "Pawula theorem", "nonequilibrium statistical mechanics / stochastic processes"], "about": [{"@type": "Thing", "name": "Kramers-Moyal expansion truncation"}, {"@type": "Thing", "name": "Kramers-Moyal expansion"}, {"@type": "Thing", "name": "KM expansion"}, {"@type": "Thing", "name": "Moyal expansion"}, {"@type": "Thing", "name": "jump-moment expansion"}, {"@type": "Thing", "name": "derivative-moment expansion"}, {"@type": "Thing", "name": "generalized Fokker-Planck equation"}, {"@type": "Thing", "name": "differential Chapman-Kolmogorov expansion"}], "articleSection": "nonequilibrium statistical mechanics / stochastic processes", "datePublished": "2026-09-04", "dateModified": "2026-09-04", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-truncation-that-isnt-a-derivation.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-truncation-that-isnt-a-derivation.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Rayleigh's Piston to Moyal's Symposium: Who Actually Stopped at Second Order Rayleigh's Piston to Moyal's Symposium: Who Actually Stopped at Second Order The object at issue is a formal identity. For a Markov process with transition density P(x,t+\\tau\\mid x',t), define the derivative moments and the Chapman–Kolmogorov equation rewrites exactly as Nothing has been approximated; nothing has been derived. The Fokker–Planck equation appears only when someone decides that D^{(n)}=0 for n\\ge3. The question this section answers is: who decided, when, and on what grounds — because the two names on the expansion belong to neither the first person to make the cut nor the person who established when it is allowed. Rayleigh, 1891. A heavy piston of mass M in a one-dimensional gas of light particles of mass m . Rayleigh expands the collision kernel in the momentum transfer and retains two terms, obtaining a drift–diffusion equation for the piston's velocity distribution — the ancestor of the Klein–Kramers equation, half a century early. What matters is why he was entitled to stop: the mass ratio \\gamma=m/M is an explicit ordering parameter, each collision changes V by \\mathcal{O}(\\gamma), and the higher jump moments are suppressed by powers of \\gamma at fixed collision rate. Rayleigh's truncation is a controlled expansion in a small physical parameter. This is the last time in the lineage that it will be. The same collision operator, expanded to all orders, is reconstructed a century later in Hoare and Rahman's spectral treatment of the piston — where the higher D^{(n)} are explicitly computable and explicitly nonzero. Planck, 1917. Fokker's 1914 dipole calculation produced the equation; Planck supplied the general derivation, and the operation he performed is precisely the one now taught under another name: take an integral master equation with a short-time transition kernel, Taylor-expand in the jump variable, keep the first two moments, discard the rest . That is the Kramers–Moyal truncation, in full, twenty-three years before Kramers and thirty-two before Moyal. Planck's name survives on the equation and not on the expansion that produces it — an inversion that is difficult to justify on any reading of the record. Note also what was lost between 1891 and 1917: Rayleigh's small parameter. Planck's derivation is general, and generality here means the truncation is now an assumption about the kernel rather than an order in an expansion. Kolmogorov, 1931. The conditions under which a Markov generator is genuinely second order are stated first in mathematics, not physics . The forward equation appears as the special case in which a Lindeberg-type condition suppresses large jumps — roughly, \\tau^{-1}\\!\\int { y-x \\epsilon}P(y,\\tau\\mid x)\\,dy\\to0 for every \\epsilon 0 — which is exactly the hypothesis that makes D^{(n\\ge3)} vanish. Everything the physics literature would later argue about was already available as a checkable condition on the process. It was checked by almost nobody. Kramers, 1940. Section 2 of the barrier-crossing paper expands the Rayleigh-model collision integral in the momentum transfer and truncates at n=2 to reach the phase-space kinetic equation — which is the Klein–Kramers equation, with a 1921 Klein antecedent, not an expansion theorem. Kramers presents this as available technique en route to the escape rate the paper is actually famous for; he asserts no general result and claims no priority. The fifty-year retrospective treats the 1940 paper the same way. Citing \"Kramers 1940\" for a general expansion over arbitrary Markov processes attributes to Kramers a generality he never stated. Moyal, 1949. The general statement — arbitrary order, arbitrary Markov process, discontinuous processes included, the Fokker–Planck equation exhibited as the n=2 truncation of an exact infinite-order equation — is Moyal's, and he owns it outright . Its venue is the point. It appeared not in a physics journal but as a read-and-discussed survey in the Royal Statistical Society's Symposium on Stochastic Processes, sixty pages of J. Roy. Statist. Soc. B , written by someone with no physics position, trained as an engineer, and simultaneously being told by Dirac over a two-year correspondence that his phase-space formulation of quantum mechanics was not worth pursuing . The statement most load-bearing for the whole subsequent literature was published outside the field it governs. What the name records Neither half. The truncation is Planck's, with Rayleigh's piston as an explicit and better-justified precursor; the validity conditions are Kolmogorov's; Kramers supplied a worked instance inside a paper about something else; Moyal supplied the general identity but inherited the cut. The decisive theorem — that the truncation is not merely unjustified but, above second order, forbidden — is Pawula's 1967 result in an information-theory journal , itself anticipated in probability by Marcinkiewicz in 1939 , and neither appears in the name. Kramers and Moyal never collaborated, never co-authored, and the hyphen misleads readers into assuming a joint paper; Kramers died in 1952 and, so far as the record shows, never used the compound. The phrase is in circulation by the mid-1960s — it is already unremarked in Pawula's papers and standard by Stratonovich and Risken — but I have found no attestation of its first printed use (verify). Modern reference treatments still date the expansion to Kramers 1940 and Moyal 1949 and mention neither Planck nor Kolmogorov. The Physics, Properly: An Exact Identity, an Optional Cut, and a Theorem That Forbids Most Cuts The Physics, Properly: An Exact Identity, an Optional Cut, and a Theorem That Forbids Most Cuts The identity Take a Markov process on \\mathbb{R} with transition density P(x,t+\\tau\\mid x',t) obeying Chapman–Kolmogorov. Nothing about what follows requires a physical model; it requires only that the process be Markov ( A1 ) and that certain limits exist ( A2 , below). Write the evolution of an arbitrary test function's average by inserting the trivial resolution of the identity in the jump variable \\Delta = x - x'. Using and expanding the delta function as \\delta(x-x'-\\Delta)=\\sum {n\\ge 0}\\frac{(-\\Delta)^n}{n!}\\partial x^n \\delta(x-x') ( A4 : the step is a formal Taylor operation whose convergence is assumed , not shown), the Chapman–Kolmogorov equation becomes, after integrating against P(x',t) and dividing by \\tau, This is the Kramers–Moyal expansion in the form Moyal stated it in 1949 , generalizing the second-order truncation Planck had performed in 1917 and Rayleigh, in effect, in 1891 . It is an identity. Both sides are the same operator written twice; no approximation has been made and no physics has entered. In particular it derives nothing — least of all the Fokker–Planck equation, which appears only after one asserts D^{(n)}=0 for n\\ge 3. That assertion is an empirical claim about the process, external to the expansion. Boundary terms deserve a line: the surface contributions from repeated integration by parts vanish only if P and all its derivatives decay fast enough, or the domain is unbounded, or the boundary conditions are natural ( A5 ). On a finite interval with reflecting or absorbing walls this is a real constraint, and it is where the truncated and untruncated operators cease to agree even formally. Figure: Pawula's theorem does not select the second row — it deletes the third. The admissible Markov generators are exactly rows 1, 2 and 4; every finite truncation above second order (row 3) is excluded, so \"keep four terms for better accuracy\" is not a refinement of Fokker–Planck but a departure from probability theory. The theorem Pawula's argument is three lines of Cauchy–Schwarz on the short-time transition density. For the measure P(x,t+\\tau\\mid x',t)\\,d x and integers m, Divide by \\tau^2 and take \\tau\\to 0 ( A2 : the limits exist and are finite; A5 again: the limit and the integration may be interchanged). If some even moment D^{(2m)} vanishes while a lower even one does not, the inequality propagates the zero in both directions and collapses the entire hierarchy: D^{(n)}=0 for all n\\ge 3. Hence exactly three possibilities — stop at n=1 (deterministic), stop at n=2 (diffusion), or never stop. A truncation at n=4, 6, … is not an improved approximation; it is an operator that does not generate a positivity-preserving semigroup, and Risken and Vollmer exhibited the negative densities explicitly for continuum approximations to the Poisson process . The analytic parent is older and sharper. Marcinkiewicz proved in 1939 that \\exp[P(\\lambda)] with \\deg P 2 is never a characteristic function : a cumulant sequence cannot terminate above second order. Hänggi and Talkner made the bridge to truncation schemes in nonequilibrium physics explicit — truncating a cumulant hierarchy above second order is incompatible with a nonnegative density ( A7 ). Pawula's statement constrains the \\tau\\to 0 rates of a generator; Marcinkiewicz constrains a single distribution; Hänggi–Talkner is a third statement again. They are cousins, not synonyms. The seven assumptions - A1 — Markovianity. No memory; Chapman–Kolmogorov holds exactly at the observed level of description. - A2 — Existence of the derivative moments. \\lim {\\tau\\to 0}\\langle \\Delta^n\\rangle x/\\tau exists, is finite, and is approached uniformly enough in x to be a coefficient function. - A3 — Lindeberg/Kolmogorov suppression of large jumps. \\lim {\\tau\\to 0}\\tau^{-1}\\int { \\Delta \\epsilon} P\\,d\\Delta = 0 for every \\epsilon 0. This — Kolmogorov's 1931 condition — is what makes the generator genuinely second order. It is a hypothesis about the process , and it is the one A-condition that, if satisfied, actually licenses the cut. - A4 — Analyticity/convergence of the Taylor step. The delta-expansion converges in the relevant function class; the reordering of sum and integral is legitimate. - A5 — Boundary and interchange conditions. Surface terms vanish; \\tau\\to 0 commutes with the spatial integrations. - A6 — An ordering parameter. Successive KM terms carry no intrinsic small parameter. Van Kampen's objection [15, 16, 17] is precisely that \"truncate at second order\" is meaningless without one; his \\Omega^{-1/2} system-size expansion supplies it, and its leading order is the linear -noise equation, which is not the KM-truncated equation. - A7 — Positivity of P. The object being evolved must remain a probability density — the requirement Pawula and Marcinkiewicz enforce. A1–A5 are needed for the identity; A3 or A6 for a controlled cut; A7 forbids all other cuts. Kramers' 1940 use of the truncation and Rayleigh's 1891 piston both silently invoked A3 for a physical reason — small mass ratio, hence small momentum transfer per collision. That reason is a property of the model, not of the expansion. Absent it, the Fokker–Planck equation is not a derived consequence but a hypothesis: D^{(4)}=0, awaiting measurement. Strict Conditions \u0026 Failure Modes: What Breaks When A1–A7 Fail Strict Conditions \u0026 Failure Modes: What Breaks When A1–A7 Fail The seven conditions of §2 are not a checklist of technical hygiene. Each one, when it fails, fails in a specific and quantifiable way, and the failures are not interchangeable. What follows walks them in order of how often they are violated silently. A6 (an ordering parameter exists) — van Kampen's objection This is the deepest failure because it is not a failure of the answer but of the question. Write the master equation for a one-step process with transition rates W(x \\mid x') depending on jumps r = x - x': Nothing here is small. The n-th term of the KM series carries \\partial x^n D^{(n)}, and no parameter multiplies it. Van Kampen's 1961 point is that \"truncate at n=2\" is therefore not an approximation with a residual — there is nothing to compare the neglected terms to . His replacement introduces the system size \\Omega explicitly, x = \\Omega\\phi(t) + \\Omega^{1/2}\\xi, under which the jump moments scale as \\Omega^{1-n} after the transformation and the hierarchy becomes an honest power series in \\Omega^{-1/2}. Leading order is the linear Fokker–Planck (linear-noise) equation with drift linearized about the macroscopic trajectory and \\alpha 2 evaluated on that trajectory. Corrections are O(\\Omega^{-1/2}) and computable. The KM-truncated FPE keeps the full nonlinear x-dependence of D^{(2)}(x) and carries no error estimate at all [16, 17]. Where do they disagree? Not on Gaussian fluctuations near a stable fixed point — there they agree to leading order, which is why the confusion survives. They disagree wherever the answer depends on the tail: barrier heights, escape rates, bimodal weights, behaviour near a bifurcation where \\alpha 1'(\\phi) \\to 0 and the \\Omega^{-1/2} ordering itself collapses. Treating the two as the same equation is one of the standing conflations of the field. A3 (jump suppression / Kolmogorov's Lindeberg-type condition) — Risken–Vollmer and negative P A3 demands that the short-time transition density concentrate: \\lim {\\tau\\to 0}\\tau^{-1}\\int { r \\epsilon} P\\,dr = 0. Fail it and you have a jump process, and Pawula forbids any finite cut above two. Risken and Vollmer made this concrete by taking a continuum approximation to the Poisson process — jump amplitudes all equal, so every D^{(n)} is nonzero and comparable — and solving the KM expansion truncated at n = 4, 6,... explicitly . The truncated solutions do not merely lose accuracy: the density oscillates and goes negative, and the oscillation wavelength shrinks with the truncation order, so higher truncation is worse , not better. This is the diagnostic signature: a truncated-KM solution that is degrading as you add terms is telling you the series has no ordering parameter (A6) and no jump suppression (A3) simultaneously. Doering, Hagan and Rosenau, in the same year, gave the constructive response : replace truncation with resummation. In Fourier space the exact generator is a symbol \\hat{L}(k) = \\sum n (ik)^n D^{(n)}; a polynomial truncation of \\hat L blows up at large k , whereas a Padé-type rational approximant stays bounded and preserves positivity of the semigroup while matching the same low-order moments the truncation was trying to capture. The lesson is that the pathology is an artefact of the polynomial ansatz in k , not of wanting a differential-operator approximation. The two failures the literature merges \"Negative P\" is used to mean two things that must be separated. Failure 1 — positivity loss in exponentially small tails. A truncated operator can reproduce \\langle x\\rangle, \\langle x^2\\rangle, even \\langle x^4\\rangle over finite times to controlled accuracy while producing P \u003c 0 in a region where P \\sim e^{-S/\\epsilon} and nobody would measure it anyway . This is ugly, not fatal; the numbers you extracted may be fine. Failure 2 — loss of a Markov semigroup. The truncated operator, for n 2, is not the generator of a positivity-preserving contraction semigroup on probability measures. This kills a whole class of objects at once, not just tail values: there is no stationary distribution to speak of, no well-defined mean first-passage time, no large-deviation rate function, no detailed-balance argument, no Feynman–Kac representation. Anything defined by a t\\to\\infty limit or by an optimization over the exponential tail is not merely inaccurate but undefined. Practitioners routinely commit Failure 2 while reassuring themselves about Failure 1. A7 (the truncation must be accurate where the observable lives) — the exponential price Failure 2 has a number attached to it. Hänggi, Grabert, Talkner and Thomas took a bistable master equation and built the conventional KM-truncated FPE from it . The escape rate is k \\sim \\exp(-\\Phi {\\rm b}) with an exponent set by an integral of D^{(1)}/D^{(2)} along the barrier path; the truncation gets D^{(2)} wrong precisely in the low-population barrier region, so the exponent is wrong, and the rate error is exponential in the barrier height — orders of magnitude, not percent, and it does not improve with better statistics. They constructed an alternative FP modeling that matches the master equation's stationary distribution and long-time dynamics by construction; the same programme carried over to nonlinear shot noise in negative-differential-resistance circuits , with the same verdict on the conventional scheme. The rate-theory review records the general principle: rates are exponential-tail observables, and A7 says an approximation valid near the wells is not thereby valid at the barrier. The remaining conditions, briefly A1 (Markovianity) and A2 (existence of the \\tau\\to0 limits) fail together in practice, and their failure is invisible in a fit — which is why they belong to the estimation discussion rather than here. A4 (smoothness of D^{(n)} in x) fails at absorbing boundaries and at reaction thresholds, where the \"coefficient\" is a distribution. A5 (stationarity of the coefficients over the fitting window) fails in every non-autonomous system fitted with pooled data; the pooling manufactures an apparent D^{(2)} out of drift heterogeneity. That last mechanism is the subject of §5, because it is the failure mode that produces a plausible Fokker–Planck equation rather than a visibly broken one. Signatures: Direct vs Indirect Evidence That Nature Stopped at Two Signatures: Direct vs Indirect Evidence That Nature Stopped at Two Everything in §2 and §3 reduces to one empirical question: is D^{(n)}(x)=0 for all n\\ge 3? Pawula's theorem makes this question binary — by the Cauchy–Schwarz argument [9, 21], the answer is \"all of them vanish\" or \"none of them do.\" There is no partial credit, no \"D^{(4)} is small so we neglect it.\" A small nonzero D^{(4)} means an infinite tower of nonzero coefficients, i.e. a jump kernel, i.e. a generator that is not a differential operator at all. So the measurement is well posed. The trouble is that the object to be measured is defined by a limit no dataset contains. The direct test, and why it is a scaling test The only direct evidence is the \\tau-dependence of the conditional moments themselves. Write the raw (unnormalized) moments For a genuine diffusion with continuous paths, M 2\\sim 2D^{(2)}\\tau while M 4 \\sim 3\\,(2D^{(2)}\\tau)^2 = O(\\tau^2) — the fourth moment is Gaussian-slaved to the second, and the ratio For a jump-diffusion with jump rate \\lambda and jump-amplitude moments \\langle \\xi^n\\rangle, both M 2 and M 4 acquire terms linear in \\tau: M 4 \\simeq \\lambda\\langle\\xi^4\\rangle\\tau, so M 4/M 2 \\to \\lambda\\langle\\xi^4\\rangle/(2D^{(2)}+\\lambda\\langle\\xi^2\\rangle), a finite constant with the dimensions of amplitude squared. This is precisely the Anvari–Tabar–Peinke–Lehnertz criterion : the small-\\tau plateau of D^{(4)}/D^{(2)} estimates the mean-square jump amplitude, and its extrapolation to zero is the signature of pure diffusion. The test is non-parametric and it is a scaling test — a single value of D^{(4)} at one \\Delta t says nothing at all. Figure: The discriminating observable is the slope, not the value. All three processes can be tuned to give the same M 4/M 2 at the experimental \\Delta t (dashed vertical); they separate only as \\tau decreases, and the region where Pawula's theorem actually speaks (shaded) is the region no experiment reaches. Dashed curve segments are extrapolation, not measurement. The circumstantial signatures, and what else produces them Everything short of the \\tau-scaling of M 4 is compatible with a generator that is not second order. The recurring claims, and their impostors: Signature offered as evidence Also produced by Discriminating measurement --- --- --- Gaussian increment histogram at \\Delta t Compound Poisson with \\lambda\\Delta t\\gg1 (CLT washes out the jumps) Vary \\Delta t: kurtosis excess must fall as \\Delta t^{-1} for jumps, stay 0 for diffusion Linear MSD, \\langle\\Delta x^2\\rangle\\propto t Any finite-variance jump process; truncated Lévy beyond the cutoff crossover M 4 scaling; MSD is n=2 information only Exponential velocity autocorrelation Ornstein–Uhlenbeck driven by any white noise, Gaussian or not — the ACF sees only D^{(2)} Higher-order structure functions; conditional moments at fixed x Clean drift–diffusion fit, small residual Hidden slow variable: projecting a 2D Markov process onto one coordinate leaves a non-Markov 1D process whose fitted D^{(1)},D^{(2)} are \\Delta t-dependent Markov test on the conditional density; check \\hat D^{(i)} stability vs \\Delta t \\hat D^{(4)}\\approx0 from a fit Insufficient statistics — M 4 needs O(10^2) times the samples of M 2 per bin, and estimator variance biases \\hat D^{(4)} toward zero Bootstrap the bin-wise error bar before declaring a null Stationary density matches P s\\propto (D^{(2)})^{-1}\\exp\\!\\int\\! D^{(1)}/D^{(2)} Nothing — but this is a consistency check, not a test: it uses only the fitted D^{(1,2)} and is insensitive to the tower above Escape rates / mean first-passage times, which are sensitive [19, 20] That last row deserves emphasis. The Hänggi–Grabert–Talkner–Thomas result is the operational content of Pawula's theorem: two models agreeing on drift, diffusion and the stationary density can differ exponentially in barrier-crossing rate, because the rate is governed by the tails where D^{(n 2)} lives. If your application is a rate, a switching time, or a large deviation, the circumstantial signatures certify nothing. The limit that data cannot supply Every statement in this section about D^{(n)} refers to \\lim {\\tau\\to0}. Estimators return \\hat D^{(n)}(x,\\Delta t) at the finite sampling interval, and at finite \\Delta t the orders mix: Ragwitz and Kantz showed the leading finite-time corrections are O(\\Delta t) and non-negligible in exactly the nonlinear regimes of interest, and gave a correction scheme ; Friedrich, Renner, Siefert and Peinke contested the generality of the claim, with a reply from the original authors . The dispute was never fully resolved and its residue is a working convention: extrapolate \\hat D^{(n)}(x,\\Delta t) linearly in \\Delta t toward zero and quote the intercept, with the extrapolation range reported. Two structural obstructions remain and no amount of data removes them. First, the \\Delta t\\to0 end is bounded below by the measurement bandwidth — an anti-aliasing filter converts a jump process into a smooth one by construction, manufacturing continuity in the data that does not exist in the system. Second, \\hat D^{(4)} is a statement about the fourth moment of a conditional distribution estimated in a bin, so its variance grows with the eighth moment; the null result \"D^{(4)} is consistent with zero\" is usually a statement about sample size, not about nature. Software that computes coefficients to arbitrary order makes the diagnostic cheap to run, which is welcome, but it does not make the extrapolation legitimate — and the n\\le2 fit remains the default for anyone who never plots \\hat D^{(4)}/\\hat D^{(2)} against \\Delta t at all. Use \u0026 Abuse: Pawula's Theorem Cited Backwards, and the D⁽²⁾ That Is a Sampling Artifact Use \u0026 Abuse: Pawula's Theorem Cited Backwards, and the D⁽²⁾ That Is a Sampling Artifact The modern pipeline is three lines long. Take a scalar time series sampled at \\Delta t; bin on the state x; form the conditional moments read M^{(1)}\\to D^{(1)} as drift and M^{(2)}\\to D^{(2)} as diffusion; write down \\dot x = D^{(1)}(x)+\\sqrt{2D^{(2)}(x)}\\,\\Gamma(t) and call the system a Langevin process. Friedrich and Peinke's turbulence cascade paper made this a method rather than a curiosity, and the packaged estimators — kramersmoyal , the sparse-regression variants , the inference reviews that present drift–diffusion fitting as the default model class — made n\\le 2 the path of least resistance. Nothing in the pipeline requires the user to ever compute D^{(4)}, and the software will happily return it if asked, which is precisely why its absence from papers is diagnostic. The theorem, run in reverse The sentence that appears, in near-identical form, across turbulence, physiology, finance and climate papers is: by Pawula's theorem, the vanishing of the fourth coefficient permits truncation of the Kramers–Moyal expansion after the second term. Read literally this is true and useless; read as it is used — as a license — it is the theorem inverted. Pawula [9, 21] supplies a constraint, not a permission: the Cauchy–Schwarz inequality M {n+m}^{2}\\le M {2n}M {2m} on the short-time jump moments forces the sequence D^{(n\\ge3)} to be identically zero or to have no zeros at all. The antecedent \"D^{(4)}=0\" is an empirical claim about the system, and it is the claim almost nobody establishes. Worse, the theorem is not continuous in the way practitioners assume. \"D^{(4)} is small, therefore truncation is approximately valid\" has no support in the theorem and no accompanying error bound; the counterexamples of Risken and Vollmer and the exponentially wrong escape rates of Hänggi et al. are exactly cases where the higher coefficients are numerically small and the truncation is qualitatively wrong. What Pawula's inequality does license is quantitative and rarely used: at the same order, a bound on the leading non-Gaussian coefficient in terms of two measurable ones. That is a usable consistency check. \"Therefore we keep two terms\" is not. Why D^{(4)} is small no matter what The deeper problem is that at fixed \\Delta t the null hypothesis is nearly unfalsifiable. For a genuine diffusion, Gaussian increments give \\langle \\Delta x^{4}\\rangle = 3\\langle\\Delta x^{2}\\rangle^{2}=12\\,[D^{(2)}]^{2}\\Delta t^{2}, hence For a compound Poisson process of rate \\lambda and jump amplitude \\xi, every coefficient is \\Delta t-independent, D^{(n)}=\\lambda\\langle\\xi^{n}\\rangle/n!, so D^{(4)}/D^{(2)}=\\tfrac{1}{12}\\langle\\xi^{4}\\rangle/\\langle\\xi^{2}\\rangle tends to a finite jump scale. This is the Anvari–Tabar–Peinke–Lehnertz criterion , and it is the whole test: not the value of D^{(4)} but its scaling in \\Delta t . A single-\\Delta t measurement of \"D^{(4)}\\approx 0 within error bars\" distinguishes nothing, because the diffusive prediction is itself small and O(\\Delta t). The estimator returns a small number for both hypotheses, and the practitioner reads it as confirmation. The same logic manufactures the D^{(2)} itself. A pure jump process has a perfectly finite second jump moment, D^{(2)}=\\lambda\\langle\\xi^{2}\\rangle/2, which the binning procedure returns as a smooth, state-dependent \"diffusion coefficient.\" Nothing in the fit reveals that the paths are discontinuous. Additive measurement noise of variance \\sigma^{2} does the reverse damage, contributing \\sim\\sigma^{2}/\\Delta t to M^{(2)} and a spurious -x/\\Delta t relaxation to M^{(1)} — a diffusion that diverges as the sampling improves. Between them, a discontinuous process observed through a noisy instrument can present as a textbook Ornstein–Uhlenbeck process at every \\Delta t anyone bothers to try. The dispute that should have settled this Ragwitz and Kantz made the point sharply in 2001: the \\tau\\to0 limit defining D^{(n)} is never taken, the finite-\\Delta t coefficients mix orders — the leading correction to M^{(2)} contains \\tfrac{1}{2}[D^{(1)}]^{2}\\Delta t, so drift leaks into diffusion at first order — and corrections are mandatory. Friedrich, Renner, Siefert and Peinke replied that the correct procedure is extrapolation of the measured M^{(n)}(x,\\Delta t) to \\Delta t\\to0, with a full series rather than the specific first-order correction proposed, and disputed its application to their cascade data; Ragwitz and Kantz replied in turn . It remains the sharpest validity dispute in the field, and it has been technically superseded rather than adjudicated — Lade (2009) and Rydin Gorjão, Witthaut, Lehnertz and Lind (Entropy 2021) give finite-time corrections to arbitrary order via Bell polynomials, valid for discontinuous processes too. The corrections exist, are implemented, and are skipped. Tells of a hollow claim Applied across turbulence, EEG and heart-rate physiology, financial returns and volatility, wind-power and climate indices, the phrase \"we reconstructed the Fokker–Planck equation\" is now weaker than it sounds. Three absences, any one of which voids the claim: Missing What it would have shown Standard tool --- --- --- Reported D^{(4)}(x) with its \\Delta t-scaling Diffusion (\\propto\\Delta t) vs. jumps (constant) ; jumpdiff A \\Delta t-dependence study or \\Delta t\\to0 extrapolation Whether D^{(1)},D^{(2)} are limits or artifacts [24, 25]; Bell-polynomial corrections A Markovianity test Whether a KM expansion applies at all Chapman–Kolmogorov / Wilcoxon; Markov–Einstein length The third is the most often forgotten and the most fundamental: the entire construction of §2 presupposes Chapman–Kolmogorov. Without a measured Markov–Einstein scale below which the process is not Markovian, the estimated D^{(n)} are moments of nothing in particular. A paper reporting D^{(1)} and D^{(2)}, a Pawula sentence, and none of these three has not measured that nature stopped at second order. It has measured that its sampling interval did. Sources: Ragwitz \u0026 Kantz, PRL 87, 254501 · Friedrich et al., Comment, PRL 89, 149401 · Lade, finite sampling interval effects · Rydin Gorjão et al., Entropy 23, 517 · jumpdiff, J. Stat. Soft. 105(4) · Chapman–Kolmogorov memory-length test, Sci. Rep. 2025 Status \u0026 the Believer's Checklist: What AETHER Demands Before It Believes Your Fokker–Planck Status \u0026 the Believer's Checklist: What AETHER Demands Before It Believes Your Fokker–Planck The theorem is fine; the tradition around it is not There is no live controversy at the level of the mathematics. Pawula's structure theorem is stated correctly in Risken — including the explicit negative-density counterexamples for truncation at n=4,6 — and correctly in Gardiner , which additionally does the thing that most later texts do not: it presents the differential Chapman–Kolmogorov equation with drift, diffusion and an integral jump term W(x\\mid x') as the primitive object, so that \"the KM series diverges\" is visibly a statement about a Taylor representation and not about the physics. Both books are three to four decades old and neither has been superseded on this point. What mutated is everything downstream. The pedagogical chain — lecture notes, methods sections, review articles — reduces §2 of this dossier to a single sentence (\"by Pawula's theorem we may truncate at second order\") that inverts the theorem's content, and deletes van Kampen's objection [15, 16, 17] entirely. The deletion is not incidental: van Kampen's point is that the KM series carries no ordering parameter, so the cut at n=2 is an assumption, and once that sentence is gone the truncation reads as a derivation. The \\Omega^{-1/2} expansion survives in the stochastic-chemistry and population-dynamics literature — where the system size is unambiguous and the tutorial reviews keep the linear-noise approximation distinct from the KM-truncated FPE — and has largely evaporated from the time-series-fitting literature, where no \\Omega presents itself and none is invented. The data-analysis branch has, to its credit, produced its own corrective machinery, most of it unused. Anvari et al. give the fourth-moment criterion: for a jump-diffusion, D^{(4)}/D^{(2)} tends to a finite jump amplitude rather than to zero. Lehnertz and collaborators sharpened this into the Q-ratio test on the \\tau-scaling of D^{(6)}/D^{(4)} — linear in \\tau for pure diffusion, flat for jumps — and Rydin Gorjão, Witthaut, Lehnertz and Lind (2021) derived finite-time corrections to the KM operator at arbitrary order, which is the constructive resolution of the Ragwitz–Kantz dispute [24, 25]: the bias is real, and it is now computable rather than merely lamented. A packaged jump-diffusion estimator exists (jumpdiff, JSS 105(4), 2023) alongside the general-purpose kramersmoyal . The asymmetry is stark: the tool that fits D^{(1)},D^{(2)} and stops is one import away, and so is the tool that would falsify it. The honest alternatives, and why there is really only one Four routes exist past the illegitimate cut, and they are not four ideas. - Differential Chapman–Kolmogorov with an explicit kernel : write W(x\\mid x'), keep drift and diffusion for the continuous part, and integrate the rest. - Lévy–Itô : the same statement structurally — continuous paths plus a jump measure — with the decomposition guaranteed rather than assumed. - Resummation : Padé-type or quasicontinuum approximants to the KM operator , which retain finite-time accuracy without the positivity pathology; and the consistent Fokker–Planck modelings of Hänggi et al. [19, 20], which fix the observable that naive truncation destroys (the escape rate) rather than the equation's form. - \\Omega-expansion : legitimate only when a system size exists. \"Keep all orders in D^{(n)}\" and \"write down the jump kernel\" are the same statement. Only the second is computable, only the second generates a Markov semigroup on probability measures, and only the second has an estimator. A paper that says \"higher orders are presumably small\" has chosen the uncomputable phrasing in order to avoid the estimation. The checklist Nothing below is exotic; every item is a few lines of the analysis you already ran. 1. Report D^{(4)}(x). Not \"we assumed it negligible\" — the estimate, with error bars, on the same x-grid as D^{(2)}. Defends A5 (D^{(n\\ge3)}=0). An unreported D^{(4)} is an unreported result, not an absent one. 2. Report its \\tau-scaling. D^{(4)}(x,\\tau)/D^{(2)}(x,\\tau)\\to 0 as \\tau\\to0 for diffusion; \\to finite for jump-diffusion . Equivalently, the Q-ratio D^{(6)}/D^{(4)}: linear in \\tau = diffusion, flat = jumps. Also A5 . 3. Show every coefficient as a function of \\Delta t, not at one sampling interval. Defends A3 (the \\tau\\to0 limits exist). A D^{(1)} that drifts with \\Delta t is a finite-time coefficient with orders mixed in, not a drift , and finite-time corrections at arbitrary order are now available, so \"we used the smallest available \\Delta t\" is no longer an answer. 4. Test Markovianity explicitly — Chapman–Kolmogorov on the estimated three-point densities, or a Wilcoxon/conditional-independence test — and report the Markov–Einstein time. Defends A1 . Fitting D^{(n)} to a non-Markov series returns numbers regardless. 5. State the ordering parameter. \\Omega^{-1/2}, mass ratio, jump size over correlation length — name it, and give the order of the neglected term. Defends A7 . If there is none, say so; that is van Kampen's objection reappearing in your own paper and it is not disqualifying, only unhedgeable. 6. Compare against the jump-diffusion null. Fit drift, diffusion and jump amplitude/rate; report the likelihood or information-criterion gap. Defends A5 . A pure diffusion that is not compared against jump-diffusion has not been tested. 7. Check positivity and normalization of the propagated solution over the times you actually claim. Defends A6 . Negativity in the far tail may be tolerable ; negativity where you compute rates is not. 8. Report the boundary/tail behaviour used in the integrations by parts — natural, reflecting, absorbing — and confirm the stationary solution is normalizable. Also A6 . 9. If you quote a rate, a stationary density, or a large-deviation exponent, justify the semigroup. These are exactly the observables the truncation gets exponentially wrong [19, 20]. A4/A6 . 10. Separate measurement noise from dynamical noise. Additive observational noise inflates D^{(2)} at small \\tau and manufactures higher moments; report the estimate with and without deconvolution. A2/A3 . 11. Bin-count and bandwidth sensitivity. KDE-based estimators and sparse-regression variants have hyperparameters that move D^{(2)}; show it doesn't move much. 12. Say which theorem you are invoking. Pawula constrains jump moments; Marcinkiewicz constrains a single distribution's cumulants; Hänggi–Talkner bridge them for hierarchies. Citing the wrong one is the tell. The AETHER Verdict The AETHER Verdict I have spent this dossier separating an identity from an approximation. Here is where I stand. (a) What I would defend with my reputation Three things. First: the Kramers–Moyal expansion derives nothing. It is a rewriting of Chapman–Kolmogorov in terms of derivative moments, exact wherever the moments exist and the series converges, and it is as true of a Poisson jump process as of Brownian motion. Every sentence of the form \"expanding to second order we obtain the Fokker–Planck equation\" is an assumption wearing a derivation's clothes. The assumption is D^{(n)}=0 for n\\ge 3, and it must be earned — from Kolmogorov's continuity condition , from a system-size parameter, or from measurement. Nowhere else. Second: Pawula's theorem is a prohibition, not a permit . Given the exact jump moments, either the tower terminates at two or it never terminates. The theorem therefore says that the truncation everyone performs is legal precisely when it was unnecessary — when nature already stopped. It cannot be invoked to justify stopping. I have seen it cited backwards often enough that I now treat the citation as a diagnostic: a paper that thanks Pawula for licensing its truncation has not read Pawula. Third: the name is wrong twice over. The truncated equation is Planck's with Rayleigh's piston behind it; the analytic condition is Kolmogorov's ; the general expansion is Moyal's ; and Kramers' 1940 paper contains a phase-space kinetic equation and an escape rate, not a general expansion theorem. Kramers asserted no generality; the compound name assigns him one posthumously. And the theorem's mathematical content is Marcinkiewicz's — a connection that entered physics only through Hänggi and Talkner , four decades late, because Pawula published the general result in an information-theory journal while the physics community cited his Phys. Rev. application . (b) What is shakier than the literature admits Not the mathematics — the epistemics around it. Four specific assumptions, all routinely silent: The limit is not the estimate. Every Pawula argument concerns \\tau\\to 0. Every measurement returns a finite-\\Delta t coefficient in which the orders mix, and a pure jump process produces a perfectly respectable apparent D^{(2)} [24, 25]. The inference \"D^{(4)} came out small, so we truncate\" is not weak evidence for a mathematical statement about the limit; it is no evidence at all unless the \\Delta t-dependence is exhibited and extrapolated. This is the single most common unstated assumption in the field. Convergence of the series is assumed, never checked. The expansion presumes the short-time transition density is analytic in the moment sense. For heavy-tailed or Lévy-driven dynamics the moments defining D^{(n)} diverge outright and the identity itself — not merely the truncation — fails. The right object was always the differential Chapman–Kolmogorov equation with its explicit jump kernel W(x\\mid x') ; the divergent tower of D^{(n)} is just that kernel's Taylor moments, and only the kernel is computable. Markovianity is imported wholesale. Everything above assumes it. Coarse-grained observables of Hamiltonian systems are generically non-Markovian, and a fitted D^{(2)}(x) absorbs memory as state-dependent noise without complaint. Truncation at fourth order is condemned by the wrong argument. Loss of positivity is a statement about tails and long times. A fourth-order truncation can track low-order moments over finite times to controlled accuracy while producing a negative density where the density is e^{-20} anyway . The honest indictment is that the truncated operator generates no Markov semigroup — hence no rates, no stationary state, no large deviations — not that its every number is wrong. Resummation approaches exist to keep the accuracy without the pathology. (c) The three open questions I would work on 1. A finite-\\Delta t inverse theory. Given estimated M^{(n)}(x,\\Delta t) over a range of \\Delta t, decide between \"diffusion\" and \"jumps + drift\" with a stated error bound. This is the bottleneck: it converts the entire Pawula discussion from unfalsifiable to testable, and it is a well-posed statistics problem nobody owns. 2. Error bounds for the KM truncation itself. Van Kampen's \\Omega-expansion has an explicit small parameter ; the KM truncation has none. What controls the neglected D^{(n\\ge3)} when there is no system size — and what functional of the jump kernel bounds the induced error in escape rates? 3. Positivity-preserving higher-order approximants. Which resummations of the tower generate a genuine Markov semigroup, and how do they compare to simply writing W(x\\mid x')? I suspect the honest answer is often \"they don't beat the kernel,\" which would be a useful result. Reading path: 1. Moyal (1949) — read the general expansion from its actual author, arbitrary order, jumps included, before any physics textbook edits it down to two terms. 2. Pawula, IEEE Trans. Inf. Theory (1967) — the general structure theorem in its real venue; the Cauchy–Schwarz argument is three lines and permanently inoculates you against the backwards citation. 3. Risken, The Fokker–Planck Equation — the faithful monograph treatment: it states the expansion and the theorem correctly, so you can see exactly which step the teaching tradition deleted. 4. Van Kampen — the standing critique from Kramers' own student: why a truncation without a small parameter is not an approximation scheme, and how \\Omega^{-1/2} differs from KM precisely at barriers and bifurcations. 5. Hänggi and Talkner (1980) — the paper that finally connected Pawula to Marcinkiewicz , and the correct last word on what positivity forbids."}</script>

<script type="application/json" id="aether-data">{"slug": "the-truncation-that-isnt-a-derivation", "topic": "Kramers-Moyal expansion truncation", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "The Truncation That Isn't a Derivation", "subtitle": "Kramers–Moyal, Pawula, and the second-order habit that survives because nobody measures D⁽⁴⁾.", "domain": "nonequilibrium statistical mechanics / stochastic processes", "era": "1940 (Kramers) – 1949 (Moyal); dominant through the 1960s–80s Fokker-Planck era (van Kampen, Risken, Gardiner)", "why_big": "Kramers (1940) and Moyal (1949) showed that any Markov process obeys an exact infinite-order differential Chapman-Kolmogorov expansion in the jump moments M_n(x,t) = lim_{τ→0} (1/τ)⟨(Δx)^n⟩, and that the Fokker-Planck equation is nothing but its truncation at n=2. Pawula's theorem then supplied the sharp structural statement: if any M_n with n\u003e2 vanishes, all M_n for n≥3 must vanish — so the expansion either stops at 2 (genuine diffusion) or must be kept to infinite order; truncating anywhere else generically produces a P(x,t) that goes negative. This is the load-bearing bridge between microscopic master equations and every Langevin/Fokker-Planck model in physics, chemistry, and finance, and it is what makes the diffusion approximation a controlled limit rather than a guess — van Kampen's system-size expansion in Ω^{-1/2} exists precisely because the naive KM truncation is uncontrolled.", "abuse": "Modern practice routinely estimates M_1 and M_2 from finite-Δt time series and declares the system 'a Langevin/Fokker-Planck process' without ever testing M_4 ∝ M_2² or checking that higher jump moments vanish in the τ→0 limit — Pawula's theorem is cited as a license to truncate when it says the opposite. The finite-sampling bias (M_n measured at nonzero Δt mixes orders, so a pure jump process fakes a small but nonzero M_2) is widely ignored, letting genuinely non-Gaussian, heavy-tailed, or jump-driven dynamics be fitted with a drift-and-diffusion pair whose 'noise' is an artifact of the sampling rate.", "date": "September 4, 2026", "ts": 1788570246.583236, "engine": "Claude Code CLI · default model", "aliases": ["Kramers-Moyal expansion", "KM expansion", "Moyal expansion", "jump-moment expansion", "derivative-moment expansion", "generalized Fokker-Planck equation", "differential Chapman-Kolmogorov expansion", "diffusion approximation (as the n=2 truncation)", "Kramers-Moyal coefficients D^(n)", "Pawula theorem"], "origin_story": "The object now called the Kramers–Moyal expansion entered physics three times before it acquired its name, and each time as a technique rather than a theorem. Rayleigh (1891) [73], treating a massive piston bombarded by light gas particles, expanded the discrete collision kernel in powers of the small momentum transfer and kept two terms, producing a drift–diffusion equation for the velocity distribution — the first truncated jump-moment expansion in physics. Planck (1917) [72], supplying the derivation that Fokker (1914) had not, took an integral (master) equation for a slowly-varying distribution, Taylor-expanded the kernel, and cut it at second order to obtain ∂P/∂t = -∂_x(A P) + ½∂²_x(B P); this is literally the Kramers–Moyal truncation, twenty-three years early, and Planck is not in the name. Kolmogorov (1931) [74] then made the structure mathematics: the forward equation is the second-order case of a general analytic theory of Markov transition functions, with explicit conditions (a Lindeberg-type condition killing large jumps) under which the generator is a second-order differential operator at all. Kramers (1940) [68], in a paper remembered for something else entirely — the escape rate over a barrier — needed the Rayleigh-model kinetic equation and re-derived it by expanding the collision integral in the momentum transfer and truncating at n=2, giving the Klein–Kramers equation as §2 machinery on the way to the rate formula. Moyal (1949) [69], an engineer-turned-statistician outside the physics establishment, wrote the general statement in a Royal Statistical Society symposium paper: for *any* Markov process the transition density obeys ∂_t P = Σ_{n≥1} (-∂_x)^n [D^(n)(x,t) P], with D^(n) = (1/n!) lim_{τ→0} ⟨(Δx)^n⟩/τ, exact and of infinite order, the Fokker–Planck equation being its truncation. The expansion was thereby demoted from derivation to identity — and the question of when you may stop was left open until R. F. Pawula (1967) [70,1] closed it with a Cauchy–Schwarz argument on the jump moments: if D^(n) vanishes for one even n\u003e2, it vanishes for all n≥3. Either nature stopped at two, or you must keep everything; stopping anywhere else generically drives P(x,t) negative. The mathematical content of that statement had existed since 1939, in Marcinkiewicz's theorem [71] that exp(polynomial of degree \u003e2) is never a characteristic function — a fact Pawula did not cite and which the physics literature only wired back in with Hänggi and Talkner (1980) [4]. Meanwhile van Kampen (1961) [75] had already made the deeper point that the KM series is not an expansion in anything: its terms carry no ordering parameter, so 'truncate at second order' is not an approximation scheme but a hope, which he replaced with the system-size (Ω^{-1/2}) expansion in which the small parameter is explicit [76,77].", "credit_audit": "The name records neither the first derivation nor the decisive theorem. The truncated expansion is Planck's (1917) [72], with Rayleigh's piston calculation (1891) [73] as an explicit precursor; the analytic conditions under which a Markov generator may be second order are Kolmogorov's (1931) [74]. Kramers' contribution (1940) [68] is a re-derivation of the Rayleigh-model kinetic equation occupying a section of a paper whose fame rests entirely on the barrier-crossing rate — the 'Kramers equation' of that paper is the Klein-Kramers equation, not an expansion, and Kramers made no claim to a general expansion theorem. Moyal (1949) [69] genuinely owns the general statement — arbitrary order, arbitrary Markov process, jumps included — and deserves the second half of the name; what he does not own is the truncation, which he inherited. The compound 'Kramers-Moyal expansion' is a coinage of the 1950s-60s in circulation by the time of Pawula's 1967 papers; Kramers died in 1952 and, so far as the record shows, never used it, and the two men never collaborated (verify: I have found no attestation of the first printed use of the phrase). The sharpest divergence is Pawula's theorem. Its mathematical content is Marcinkiewicz's 1939 theorem on characteristic functions [71]; Pawula's 1967 proof is an independent Cauchy-Schwarz argument on jump moments and cites, so far as I can determine, no probability-theoretic antecedent (verify), and the Marcinkiewicz connection enters the physics literature only with Hänggi and Talkner in 1980 [4]. Textbook practice compounds this by attributing the theorem to Pawula's Physical Review paper [1], which is an application to the linear Boltzmann equation; the general theorem is in the IEEE Transactions on Information Theory paper [70] — an engineering venue, which is part of why the probability-theory lineage was never traced. Finally, the standing critique that the truncation is uncontrolled belongs to van Kampen [75,76,77], Kramers' own student, and is the piece most consistently deleted from pedagogical presentations: Risken's monograph [34] presents the expansion and Pawula's theorem faithfully, but the derived teaching tradition tends to reduce both to 'and therefore we keep two terms'.", "timeline": [{"year": 1891, "event": "Expands the collision kernel for a heavy piston in a light gas in powers of the momentum transfer and keeps two terms, obtaining a drift-diffusion equation for the velocity distribution — the first truncated jump-moment expansion in physics; the model is still the standard KM test case (cf. the spectral analysis of Rayleigh's piston in [2])", "who": "J. W. Strutt (Lord Rayleigh)", "work": "\"LIII. Dynamical problems in illustration of the theory of gases\", Philosophical Magazine ser. 5, 32, 424-445", "kind": "theory", "ref": 1}, {"year": 1917, "event": "Supplies the derivation Fokker (1914) lacked: Taylor-expands an integral master equation in the jump variable and truncates at second order, obtaining the Fokker-Planck equation. This is the Kramers-Moyal truncation in full, 23 years before Kramers and 32 before Moyal", "who": "Max Planck", "work": "\"Über einen Satz der statistischen Dynamik und seine Erweiterung in der Quantentheorie\", Sitzungsberichte der Preussischen Akademie der Wissenschaften, 324-341", "kind": "theory", "ref": 3}, {"year": 1931, "event": "Formalizes Markov transition functions analytically; the forward ('Fokker-Planck') equation appears as the special case in which a Lindeberg-type condition suppresses large jumps and the generator is genuinely second order. The conditions under which truncation at n=2 is legitimate are stated here first, in mathematics, not physics", "who": "A. N. Kolmogorov", "work": "\"Über die analytischen Methoden in der Wahrscheinlichkeitsrechnung\", Mathematische Annalen 104, 415-458", "kind": "formalization", "ref": 4}, {"year": 1939, "event": "Proves that exp(P(λ)) with deg P \u003e 2 is never a characteristic function — equivalently, a cumulant sequence cannot terminate above second order. This is the analytic core of what physics would later call Pawula's theorem. Marcinkiewicz was murdered by the NKVD in the Katyn massacres the following spring", "who": "Józef Marcinkiewicz", "work": "\"Sur une propriété de la loi de Gauß\", Mathematische Zeitschrift 44, 612-618", "kind": "theory", "ref": 10}, {"year": 1940, "event": "In §2 of the barrier-crossing paper, expands the Rayleigh-model collision integral in the momentum transfer and truncates at n=2 t
