asurement-problem-and-the-de-broglieb.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-shifty-split-the-measurement-problem-and-the-de-broglieb.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins of the Cut: Schrödinger, Born, and the Pioneers Written Out Origins of the Cut: Schrödinger, Born, and the Pioneers Written Out 1.1 Schrödinger 1926: a deterministic field, no measurement The first of the four \"Quantisierung als Eigenwertproblem\" communications introduced an equation of unambiguous mathematical character: a linear, deterministic, first-order-in-time PDE for a complex field \\psi(q,t) on configuration space. Crucially, the 1926 papers contain no measurement postulate, no projection rule, and no probabilistic interpretation of \\psi ^2 . Schrödinger himself, in the fourth communication and in his lectures of that year, attempted a charge-density reading, treating \\psi as a physical wave on \\mathbb{R}^3 for the one-electron problem. The dimensional embarrassment — that for N particles \\psi lives on \\mathbb{R}^{3N}, not on space — was already apparent to him and is the first crack from which the entire measurement problem grows: the equation is a wave equation, but not in the world. 1.2 Born 1926: probability grafted on by hand A few months later, in Zur Quantenmechanik der Stoßvorgänge , Born — analyzing scattering amplitudes — proposed that \\psi n ^2 gives the probability of finding the system in state n. The famous footnote inverting the original \"\\psi\" to \" \\psi ^2\" was added in proof; Born initially wrote \\psi n, then corrected himself. Three points the textbooks routinely smooth over: 1. Born's rule was advanced as an interpretive hypothesis , not derived. There is no proof in that \\psi ^2 rather than some other functional of \\psi is the right density. 2. It is incompatible with Schrödinger's own charge-density reading: \\psi ^2 is a probability on \\mathbb{R}^{3N}, not a charge density on \\mathbb{R}^3. 3. It introduces a second dynamical law by stealth : at \"measurement,\" \\psi is to be replaced by an eigenstate. The unitary law of and the projection of coexist without a rule for which applies when. This is the structural defect that von Neumann would later name and that Bell would call the shifty split sixty-four years later . The measurement problem, in embryo, is already complete at the close of 1926 — written between two papers separated by a single issue of Zeitschrift für Physik . 1.3 De Broglie 1927: a deterministic completion, suppressed at Solvay The October 1927 fifth Solvay Council is now widely portrayed as the canonization of Copenhagen orthodoxy. The proceedings themselves , reconstructed and translated in their entirety by Bacciagaluppi and Valentini , tell a different story: de Broglie presented a complete pilot-wave theory in which particles possess definite positions Q k(t) guided by and in which the Born statistics emerge automatically from an equilibrium distribution \\rho= \\psi ^2 over hidden positions. The guidance equation now universally labelled \"Bohmian\" appears, with this functional form, in de Broglie's Rapport of 1927 — five years before , twenty-five before . Why did the theory vanish from the literature for a quarter-century? The Solvay record shows Pauli's objection on inelastic scattering — which de Broglie could not answer on his feet — combined with Einstein's silence, Lorentz's death the next year, and Heisenberg and Bohr's united front. De Broglie's own Nobel lecture two years later is conspicuously cautious, retreating to \"duality\" and saying almost nothing about trajectories. The retraction was sociological, not mathematical. When Bell, half a century later, insisted on writing \"de Broglie–Bohm\" he was correcting a documented historical erasure, not performing courtesy. A second, finer point: de Broglie's programme of 1927 was the théorie de la double solution — a singular u-wave (the particle as a localized non-linear field) accompanied by the regular linear \\psi. The Solvay talk presented only the reduced pilot-wave, the version that has survived. The double-solution programme continued with Vigier into the 1960s and never reached completion; conflating it with the pilot-wave theory (frequent in popular accounts) is the first major confusion the literature still propagates. 1.4 Von Neumann 1932: two processes and a movable cut performs three distinct services, which textbooks routinely fuse. First, the rigorous Hilbert-space formalism (self-adjoint operators, spectral theorem, density operators). Second, the two-process dichotomy : Prozess 1, the non-unitary projection upon measurement, and Prozess 2, the unitary i\\hbar\\partial t\\hat{\\rho} = [\\hat H,\\hat\\rho]. Third, the impossibility proof for dispersion-free hidden-variable states, resting on the assumption that the expectation functional is linear on all observables, \\langle A+B\\rangle = \\langle A\\rangle + \\langle B\\rangle, even when [A,B]\\neq 0 . Two attributions that need straightening. (a) The Heisenberg cut — the boundary between quantum system and classical apparatus — is not in as a sharp notion; it is implicit, and the canonical statement is in London \u0026 Bauer 1939 . (b) The projection postulate as a rule for post-measurement state preparation is sharpened by Lüders (1951), not by von Neumann. The \"von Neumann–Lüders rule\" elision is itself a credit failure. 1.5 Grete Hermann 1935: Bell's argument, three decades early In Die naturphilosophischen Grundlagen der Quantenmechanik , Grete Hermann identified the load-bearing flaw in : the assumption \\langle A+B\\rangle=\\langle A\\rangle+\\langle B\\rangle for non-commuting A,B is a property of quantum expectation values — it cannot be imposed a priori on any hidden-variable state without assuming what the proof sets out to demonstrate . This is, line for line, Bell's critique of 1966 ; Mermin's 1993 review gives Hermann full priority and notes that Bell himself acknowledged her in his later writings. Why was she written out? Three reasons converged: publication in a neo-Kantian philosophy series outside physicists' reading radius; Nazi-era disruption of her Göttingen circle; and the institutional weight of , which made challenging it professionally costly. Jammer recovered her in 1974, Mermin again in 1993; she remains absent from most quantum-foundations textbooks. 1.6 London \u0026 Bauer 1939: the cut named, the chain stated is the cleanest pre-war articulation of what is now called the measurement problem: a system S, apparatus A, and observer O form a chain in which unitary evolution produces and the Heisenberg cut between \"described quantum-mechanically\" and \"treated classically\" can be moved arbitrarily up the chain. London \u0026 Bauer locate the inevitable collapse at the observer's conscious reading — a position usually attributed to Wigner 1961 , who in fact reformulated their argument with explicit credit (often dropped by his readers). 1.7 Vigier and the unfinished post-war pilot-wave Jean-Pierre Vigier, working with de Broglie at the Institut Henri Poincaré from 1948 onward, supplied much of the stochastic and relativistic machinery that the 1927 talk had lacked. His chapters in de Broglie's 1956 Une tentative d'interprétation causale et non linéaire de la mécanique ondulatoire develop the double-solution programme — stochastic ether, non-linear u-wave equations — that runs in parallel to, and predates, the Bohm–Hiley quantum-potential reformulation of the same era . Anglophone summaries that present \"Bohmian mechanics, 1952\" as a one-shot creation elide both the 1927 origin and the continuous French line through Vigier. What is in place by 1939, then, is not yet a \"measurement problem\" with a name, but the entire apparatus that makes one inevitable: a deterministic linear law (Schrödinger), a non-linear probabilistic rule applied by fiat (Born), an existence proof that the linear law alone suffices given hidden variables (de Broglie), a rigorous formalism that makes the contradiction explicit (von Neumann), an early demolition of the proof that buried the existence proof (Hermann), and the cleanest statement of the chain whose closure the formalism cannot specify (London \u0026 Bauer). The next section dissects the contradiction itself. The Physics: Prozess 1 vs Prozess 2, the von Neumann Chain, and Why Linearity Forbids Outcomes The Physics: Prozess 1 vs Prozess 2, the von Neumann Chain, and Why Linearity Forbids Outcomes Von Neumann's Mathematische Grundlagen is the source of nearly every framing the textbook tradition still uses, and also of the disease that framing introduces. The text isolates two distinct dynamical laws and never reconciles them. Prozess 1 (the collapse postulate). Upon measurement of an observable A=\\sum n a n P n on a system in state \\rho, the state updates discontinuously and stochastically, where p n is the Born probability . This map is non-linear in \\rho, non-unitary, and irreversible. Prozess 2 (Schrödinger evolution). Between measurements, linear, deterministic, unitary, time-reversible. The measurement problem is the question of how a theory can consistently contain both, given that they are incompatible at the level of formal structure. Von Neumann never answers this; he stipulates that Prozess 1 applies \"during measurement\" and Prozess 2 otherwise — the cut between them being what Bell would later mock as \"the shifty split\" . The von Neumann chain Consider a system S with orthonormal eigenstates \\{ s n\\rangle\\} of A and an apparatus \\mathcal{A} initialized in a \"ready\" state A 0\\rangle whose pointer can take values \\{ A n\\rangle\\}. A good measurement coupling is one for which Prozess 2 implements If the system is in an eigenstate of A, the apparatus reliably records it. Feed the apparatus a superposition . Linearity of U {\\rm meas} forces The right-hand side is an entangled pure state. It is not the classical-looking mixture \\sum n c n ^2\\, s n\\rangle\\langle s n \\otimes A n\\rangle\\langle A n . Those density matrices share diagonals in the pointer basis but differ on the off-diagonals, and are operationally distinct under any Hermitian observable sensitive to coherence between A n\\rangle and A m\\rangle. The chain continues. Couple the apparatus to an observer O, the environment E, a colleague F: At no point does Prozess 2 select a branch. London and Bauer made this transparent in 1939 : the cut can be moved arbitrarily far up the chain without the formalism telling us where to plant it. Wigner's friend is the same chain drawn around a consciousness. Schrödinger's cat is the same chain with a poison vial in place of the apparatus and a mammal in place of the pointer. Figure: The Heisenberg–von Neumann chain. Unitary evolution entangles each successive stage; the boundary between Prozess 1 and Prozess 2 is movable but, within the orthodox formalism, never derivable. Biorthogonal decomposition and the preferred-basis problem Any pure bipartite state admits a Schmidt decomposition, with \\{ \\tilde s n\\rangle\\}, \\{ \\tilde A n\\rangle\\} orthonormal. When the Schmidt coefficients are non-degenerate the decomposition is unique , and one might hope the basis \\{ \\tilde A n\\rangle\\} is the \"objectively correct\" pointer basis. The hope fails twice. First, equation (\\star) generically has degenerate Schmidt spectra (take c 1=c 2=1/\\sqrt{2} in a two-outcome experiment); the decomposition is then ambiguous up to an arbitrary unitary rotation in the degenerate sector, and any basis of that subspace is mathematically as good as any other — the apparatus could just as well \"be measuring\" A 1\\rangle\\pm A 2\\rangle. Second, even when the spectrum is non-degenerate, the Schmidt basis is fixed by the state rather than by the apparatus and drifts as the state evolves, so it does not single out a stable, robust set of macroscopically distinguishable outcomes. This is the small (preferred-basis) measurement problem. Environmental decoherence answers it partially — pointer states are those quasi-classical states robust under monitoring by E, so \\rho {S\\mathcal{A}}^{\\rm red} becomes effectively diagonal in a unique basis on the decoherence timescale \\tau D . But the reduced density matrix is still a mixture, not an eigenstate, and the big problem (a single actualized outcome) is untouched. Maudlin's trilemma The structural impossibility is sharpest stated as a three-way inconsistency (Maudlin 1995, verify ) among three propositions any one of which alone is unobjectionable. (M1) Completeness. The wave function \\psi\\rangle specifies all there is to specify about a physical system. (M2) Linearity. \\psi\\rangle always evolves by a linear, deterministic Schrödinger-type law. (M3) Definiteness. Measurements have unique definite outcomes. The argument from (\\star) is a syllogism. By (M1) the post-measurement state of S+\\mathcal{A} is exhausted by \\sum n c n s n\\rangle A n\\rangle. By (M2) that state is the unique successor of the initial product state. But that state is a superposition of macroscopically distinct pointer configurations, contradicting (M3). The three living programs drop exactly one premise apiece: spontaneous-collapse theories (GRW-type) deny (M2) by adding a stochastic non-linear term to the dynamics; Everett denies (M3) by accepting all branches as actual; de Broglie–Bohm [4, 7] denies (M1) by adjoining the actual configuration Q(t) as supplementary ontology. Copenhagen, when pressed, denies (M1) operationally — by treating \\psi\\rangle as predictive bookkeeping rather than a state of the system — but only by importing a primitive notion of \"measurement\" that the chain shows it cannot define. Why linearity forbids outcomes It is occasionally suggested that a subtle non-linear interpretation of Prozess 2, without supplementing the ontology, could yield outcomes. It cannot, and the obstruction is purely algebraic. Let \\mathcal{E} be the linear isometry s n\\rangle A 0\\rangle\\mapsto s n\\rangle A n\\rangle. For any superposition \\psi\\rangle = \\sum n c n s n\\rangle, linearity gives \\mathcal{E}( \\psi\\rangle A 0\\rangle) = \\sum n c n s n\\rangle A n\\rangle, and no choice of \\mathcal{E} within the unitary group can produce a single product s k\\rangle A k\\rangle on the right unless c n=\\delta {nk} on the left. Outcomes require either non-linearity in the dynamics, or non-completeness of the state, or a reinterpretation of what an \"outcome\" is. This is also where von Neumann's \"impossibility proof\" against hidden variables collapses. He assumes that any hidden-variable extension must satisfy on dispersion-free states \\lambda even for non-commuting A, B. Quantum ensemble expectations obey this by linearity of the trace; individual hidden-variable states carry no such obligation, since simultaneous eigenvalues of non-commuting operators need not even be defined. Hermann saw this in 1935 ; Bell proved it again, with explicit counterexample, in 1966 ; Mermin gives the definitive credit-restoration. The lesson is sharper than the historical scandal: the very property of Prozess 2 that creates the measurement problem — strict linearity at the level of the state — was tacitly imported into the proof that no other state-description could exist. The proof assumed away the only viable escape route. That escape route, in the de Broglie–Bohm formulation, is what §3 constructs. The de Broglie–Bohm Construction: Guidance Equation, Quantum Potential, and Effective Collapse The de Broglie–Bohm Construction: Guidance Equation, Quantum Potential, and Effective Collapse Two formally distinct but empirically equivalent presentations dominate. De Broglie's 1927 derivation is first-order in time and reads guidance directly off the phase of \\psi . Bohm's 1952 derivation is second-order, with a Newton-like equation modified by an extra term he named the quantum potential . Both are deduced from the Schrödinger equation alone — neither adds a new dynamical postulate to the wave function. What both add is an additional ontological variable: the actual configuration Q(t)=(\\mathbf{Q} 1,\\ldots,\\mathbf{Q} N) of the N particles. The polar decomposition and the two equations of motion Write the wave function in polar form, Substituted into i\\hbar\\,\\partial t\\psi = -\\frac{\\hbar^2}{2m}\\nabla^2\\psi + V\\psi and separated into real and imaginary parts, this yields two coupled real equations: Equation (2) is a continuity equation for \\rho=R^2= \\psi ^2 with current \\mathbf{j}=\\rho\\,\\nabla S/m. The natural reading is that an ensemble distributed as \\psi ^2 flows along the velocity field \\mathbf{v}=\\nabla S/m. That is precisely de Broglie's guidance law , presented as the nouvelle dynamique des quanta at the fifth Solvay Council : It is well defined wherever \\psi\\neq 0; trajectories generically avoid the nodal set, which is a measure-zero subvariety. The theory is first-order: initial positions plus the universal wave function determine the future. Bohm reorganized (1) as a Hamilton–Jacobi equation with a modified potential and took the gradient. Using \\mathbf{v} i=\\nabla i S/m i along a trajectory yields This Newton-with-extra-force form is what made the 1952 papers digestible to a Newton-trained readership. It is also what introduced the famous quantum potential which depends on the form of R, not its magnitude, can be large where \\psi is small, and is irreducibly non-local for N\\ge 2 — it couples particles instantaneously through the joint \\psi. The whole nonclassical content (interference, tunneling, entanglement-mediated correlations) resides in Q. Equations (3) and (4) are not independent dynamics: (3) is a first integral of (4), so choosing \\dot{\\mathbf{Q}} i=\\nabla i S/m i once is preserved by (4). Contemporary \"minimalist\" Bohmians take (3) as fundamental and treat Q as derived bookkeeping; Bohm and Hiley continued to read Q as an active information potential , a genuinely ontological field. Measurement as a derived process The von Neumann measurement scheme evolves with \\Phi n\\rangle a macroscopic pointer state. In configuration-space language the post-interaction joint wave function is and the pointer packets \\Phi n(\\mathbf{q} a) are macroscopically displaced , so their supports in \\mathbf{q} a are disjoint to overwhelming accuracy. The actual apparatus configuration \\mathbf{Q} a(t) falls into the support of one packet, say \\Phi k. Insert this into (3): contributions from n\\neq k vanish in both numerator and denominator there, leaving The other branches still exist in Hilbert space; they simply no longer steer anything. Bohmians call \\psi {\\mathrm{eff}}(\\mathbf{q} s,t)=\\psi k(\\mathbf{q} s) the effective wave function of the system. \"Collapse\" is the operational replacement \\Psi\\mapsto\\psi {\\mathrm{eff}}\\,\\Phi k — a theorem about subsystems, not a postulate about state reduction. Bohm proved a paradigm case in §6 of ; the modern, rigorous formulation is due to Dürr, Goldstein, and Zanghì (verify), who also recovered Born statistics as the typical empirical distribution under quantum equilibrium \\rho= \\psi ^2 rather than postulating it. The persistence of the empty branches has empirical content only if they later interfere with the occupied one — which decoherence makes astronomically unlikely for macroscopic apparatuses but does not strictly forbid. This is the precise sense in which pilot-wave theory dissolves Bell's \"shifty split\" : there is no cut, because there is no Prozess 1. Figure: Joint configuration space (system × apparatus). Before the interaction a single packet guides the actual configuration Q (orange). After it, the support splits into macroscopically disjoint branches; Q enters one (blue), so the other (dashed pink) persists in Hilbert space but, sharing no overlap with Q in \\mathbf{q} a, contributes nothing to (3). Collapse is effective, not fundamental. The reduced pilot wave is not the théorie de la double solution A persistent conflation deserves dismantling. De Broglie's deeper, lifelong program was the théorie de la double solution [9, 8]. There, \\psi is only the statistical, normalizable wave; the particle itself is a separate singular, soliton-like solution u of an underlying nonlinear wave equation, phase-locked to \\psi so that the guidance velocity (3) emerges as a consequence — the principle of the guidage . The 1927 Solvay report presented only the truncated version: drop the u-wave, reinstate the particle as a point with velocity \\nabla S/m, and proceed. De Broglie called this provisional, a calculational stand-in for the unfinished double-solution program ; Bacciagaluppi and Valentini's reconstruction of the Solvay proceedings makes the two-tier strategy explicit . Bohm 1952 adopted the reduced version straight: point particles with definite positions, guided by \\psi on configuration space, no u-wave, no nonlinear field equation. De Broglie and Vigier continued the double-solution program into the 1960s, but a nonlinear wave equation with stable, \\psi-locked solitons compatible with relativistic invariance was never produced. What is today called \"Bohmian mechanics\" — including the Bohm–Hiley ontological interpretation — descends from the reduced theory. Calling it \"de Broglie's theory\" without qualification erases the half-century in which de Broglie himself regarded the reduced form as a placeholder for an ontology he had not yet finished writing. Landmark Experiments: From Stern–Gerlach to Weak Measurement of Bohmian Trajectories Landmark Experiments: From Stern–Gerlach to Weak Measurement of Bohmian Trajectories The measurement problem is a problem about experiments, not one solved by them — no observation has ever produced a definite outcome in violation of unitary evolution, because unitary evolution has nothing to say about outcomes . What experiments have done is sharpen the contradiction: each generation has closed a loophole, pushed the von Neumann cut further into the macroscopic regime, or read off a quantity that orthodox phrasing says does not exist. The list below is a validity audit of those landmarks. Stern–Gerlach (1922): the prototype that is misremembered The Frankfurt experiment of Stern and Gerlach — silver atoms through an inhomogeneous magnetic field splitting into two beams on a glass plate — was performed to test Bohr–Sommerfeld spatial quantization of orbital angular momentum. Spin had not yet been proposed; Uhlenbeck and Goudsmit posit it only in 1925. The numerical agreement with \\mu z = \\pm \\mu B was right for the wrong reason: silver's 5s ground state has \\ell = 0, and the splitting is electron spin patched in retroactively. Folklore that \"Stern–Gerlach measured spin\" inverts the history; it was the first observation of any discrete projection of an internal degree of freedom. For the measurement problem the apparatus is the minimal case where Prozess 1 acquires a concrete spatial signature: the centre-of-mass coordinate becomes entangled with the spin projection, and the two wave-packets separate in configuration space. In the de Broglie–Bohm reading [4, 7], the atom's trajectory is fixed at every instant by the guidance equation; the two emerging beams are not superpositions but two disjoint regions of \\mathbb{R}^3, only one occupied. Bohm, Schiller and Tiomno (1955) (verify) showed that \"the spin value\" is contextually produced — which beam is taken depends on the atom's initial transverse position. The conflation of measurement with revelation of a pre-existing property fails cleanly here, decades before Kochen–Specker. Mott (1929): the straight track from a spherical wave Mott's analysis of why an s-wave \\alpha particle ionizes along a straight track in a cloud chamber — given a spherically symmetric initial \\psi — is the first calculation in which the linear theory yields a definite-looking outcome without invoking collapse. The joint wavefunction of \\alpha-plus-vapour develops support only on configurations whose ionizations lie on a common ray. This is the prototype of what was reinvented as decoherence-induced einselection of a pointer basis. It dissolves the small problem (why a track and not a sphere of glints) without touching the big problem (which ray) [3, 17]. Neutron interferometry (1974–): Prozess 2 made macroscopic Helmut Rauch's silicon perfect-crystal interferometer at Vienna and Grenoble demonstrated single-neutron self-interference over centimetre path separations, the 4\\pi rotation symmetry of spin-\\tfrac{1}{2} (Werner–Colella–Overhauser, 1975), and the gravitationally induced phase shift \\Delta\\varphi g = -m^2 g A \\lambda / \\hbar^2 (Colella–Overhauser–Werner, 1975). These results make Schrödinger evolution visible at scales where intuition expects classical trajectories, pushing the cut . They are also the cleanest test of the empty-packet ontology of pilot-wave theory: because the guidance equation depends on the full \\psi and not on the occupied branch, the empty wave must be physically retained until recombination — a non-trivial commitment that the data are consistent with. Delayed choice and the quantum eraser Wheeler's delayed-choice gedankenexperiment (1978) and its photonic realizations — Jacques et al. (2007) being the canonical loophole-poor version — confront the idea that the experimenter can \"decide after the fact\" whether a photon was wave or particle. The Bohmian reading is unambiguous and undramatic: the photon has, at every moment, a definite effective trajectory; the late switch only selects which branch of the apparatus wavefunction the trajectory inhabits. Scully–Drühl's quantum eraser (1982) and Kim et al.'s delayed-choice eraser (1999) make the same point — fringes appear and disappear with which-path entanglement, not with retrocausation. What these experiments do constrain: any picture in which the photon \"chooses\" wave or particle behaviour as a property carried in flight. What they do not constrain: the measurement problem itself, since both copies-of-an-occurrence (MWI) and effective-collapse (Bohm) reproduce the data. Bell tests: Aspect (1982) → loophole-free (2015) Aspect, Dalibard and Roger violated CHSH with time-varying polarizer settings, closing the locality loophole at the photon-flight scale. The loophole-free generation — Hensen et al. (NV centres, Delft, 2015), Giustina et al. (Vienna, 2015), Shalm et al. (NIST, 2015) — closed locality, fair-sampling and measurement-independence simultaneously. What is constrained: any theory reproducing quantum predictions while respecting setting independence must be non-local in Bell's precise sense, killing the EPR-style local-hidden-variable completion. Mermin's review and Bell's own 1966 paper make the inferential chain explicit. What is not constrained: the measurement problem. Bohmian mechanics passes — it is overtly non-local at the level of the guidance equation — and so do GRW, Everett , and Copenhagen. Bell tests discriminate classes of interpretation, not interpretations of an outcome. Kocsis et al. (2011): weak measurement of average Bohmian trajectories Kocsis and collaborators (Science 332, 1170) used weak measurement of transverse momentum followed by strong position post-selection to reconstruct the ensemble-averaged trajectories of single photons in a two-slit interferometer. The streamlines match the Bohmian velocity field computed from the photon guidance prescription (Wiseman, NJP 2007). This does not prove pilot-wave theory: the experiment yields the imaginary part of the weak value \\mathrm{Im}\\,\\langle x \\hat p \\psi\\rangle / \\langle x \\psi\\rangle, which by construction equals \\partial x S(x)/m and is therefore a prediction of standard quantum mechanics. What it falsifies is the rhetorical position — orthodox since Heisenberg — that talking about trajectories in interference experiments is operationally meaningless. The trajectories are operationally meaningful in the weak-measurement sense regardless of interpretation; Bohmians take them as ontic, Copenhageners as a curious functional of \\psi, but they exist on the bench. Extended Wigner's-friend experiments The Frauchiger–Renner construction (Nature Comm. 9:3711, 2018) sharpens Wigner's 1961 friend into a formal no-go: no single-world interpretation can simultaneously satisfy (i) universal unitarity, (ii) single outcomes for observers, and (iii) consistency across nested observers reasoning about each other. Bong, Utreras-Alarcón et al. (Nature Phys. 16, 1199, 2020) gave a photonic realization of the related Local Friendliness inequalities and reported a violation. These experiments are not solutions; they are a forced choice. What they constrain: any survivor must abandon at least one of universality, absoluteness of observed events, locality, or freedom of choice. What they entail for the catalogue: Bohmian mechanics surrenders locality (already known and quantified by Bell); MWI surrenders absoluteness of events; QBism surrenders observer-independence of facts; orthodox Copenhagen survives only by refusing to apply \\psi to the friend — Bell's \"shifty split\" crystallized in a single Bell-type inequality. The pattern across the century is consistent. Each experimental milestone — Stern–Gerlach, Mott, Rauch, Aspect, Hensen–Giustina–Shalm, Kocsis, Frauchiger–Renner — has narrowed the space of viable accounts without selecting one. The data are interpretation-neutral; the measurement problem is interpretation-forced. That asymmetry is itself an empirical fact about the structure of the theory. What Superseded What: From von Neumann's No-Go to Bell, GRW, Everett, and Decoherence What Superseded What: From von Neumann's No-Go to Bell, GRW, Everett, and Decoherence The measurement problem has no settled solution, but it has a settled graveyard : a sequence of formal moves each of which closed one escape route and forced the next. Tracking what was actually superseded — as opposed to what merely fell out of fashion — is the only way to see why the live options in 2026 are still essentially the ones on the table in 1957. 1932 → 1966: the impossibility proof that wasn't Von Neumann's Grundlagen proved that no hidden-variable assignment \\lambda \\mapsto v \\lambda(A) can satisfy for all self-adjoint A,B, commuting or not, while reproducing quantum expectation values upon averaging over \\lambda. The theorem itself is correct; what was wrong was the implicit claim that the additivity premise is forced on any hidden-variable theory. For non-commuting A,B the operator A+B refers to a different experimental procedure than either A or B alone — there is no a priori reason individual outcomes should add when the measurements cannot be performed jointly. Grete Hermann saw this in 1935 and said so in print; the venue (a neo-Kantian philosophy series) and the era buried the result. Bell rediscovered the same flaw three decades later and, crucially, exhibited a counterexample — Bohm's theory — that violated the additivity assumption while reproducing all quantum predictions. The supersession here is total: the von Neumann no-go is no longer cited by anyone who has read either Hermann or Bell. What survives of the 1932 architecture is the Prozess 1 / Prozess 2 split, not the impossibility theorem. 1952: existence as refutation Bohm's two-paper construction superseded the no-go in the strongest possible sense: by being. Once a deterministic, empirically equivalent completion existed, the question shifted from can it be done to which choice of ontology is preferable . Bohm's own framing — quantum potential Q = -(\\hbar^2/2m)\\,\\nabla^2 R/R as a new physical field — has not aged uniformly well; the minimalist reading favoured by Bell, Dürr–Goldstein–Zanghì, and Goldstein after 1990 keeps only \\psi and the particle configuration Q 1,\\dots,Q N, with the guidance law The quantum-potential formulation is now best regarded as a bookkeeping device — convenient for visualizing tunneling and interference, ontologically dispensable. 1957: cutting the cut Everett's relative-state formulation removed Prozess 1 as a separate axiom by reading the universal \\psi literally and identifying each measurement record with a branch of the post-interaction state. The supersession is real but partial: Everett eliminated the collapse postulate but inherited two new burdens — the preferred-basis problem (why pointer states?) and the probability problem (what does c i ^2 mean when every branch occurs?). DeWitt's 1970s \"many worlds\" reading, the 1990s Oxford program (Saunders, Wallace, Deutsch) attempting a decision-theoretic derivation of the Born rule, and the Zurek \"envariance\" argument are all attempts to discharge those debts. None has produced consensus that the Born rule emerges from within a no-collapse unitary theory without smuggling probability in via the choice of measure. 1961: the consciousness clause Wigner's friend essay sharpened London \u0026 Bauer's observation that the cut must terminate somewhere by placing it at consciousness. This was never a formal theory — there is no Hamiltonian, no dynamical equation, no prediction distinct from orthodox QM — and it has been quietly abandoned by working physicists. It survives as a pedagogical scenario (Frauchhiger–Renner 2018 is its modern descendant (verify)) rather than as a candidate ontology. 1986: making Prozess 1 dynamical Ghirardi–Rimini–Weber replaced the ad hoc collapse with a stochastic modification of the Schrödinger equation: each particle undergoes spontaneous localization at rate \\lambda \\sim 10^{-16}\\,\\mathrm{s}^{-1} with width \\sigma \\sim 10^{-7}\\,\\mathrm{m}, giving an amplification factor N\\lambda for N-particle systems that suppresses macroscopic superpositions on millisecond timescales. GRW supersedes the Copenhagen postulate by making it a physical law with testable consequences — narrowing the parameter window via cantilever, X-ray, and matter-wave experiments has been the principal experimental thread for forty years. Continuous Spontaneous Localization (Pearle 1989; Ghirardi–Pearle–Rimini 1990 (verify)) generalized GRW to identical particles. The 1986 theory remains live : it is empirically distinguishable from unitary QM, and current cold-atom and gravitational-wave-interferometer bounds have not closed the original parameter window. 1970s–90s: decoherence as a separate question Zeh (1970) and Zurek (1981–) (verify) shifted attention to the reduced density matrix \\rho S = \\mathrm{Tr} E\\, \\Psi\\rangle\\langle\\Psi and showed that environmental interactions diagonalize it in a basis selected by the system–environment Hamiltonian (the pointer basis). This is genuine progress — it superseded a generation of preferred-basis hand-waving — but it does not supersede the outcome problem. Schlosshauer's RMP review is unusually clear on this: decoherence solves what he calls the \"small\" problem (preferred basis, suppression of interference) and leaves the \"big\" problem (single outcome) untouched. Bell's \"Against Measurement\" anticipated the confusion: \"FAPP\" — for all practical purposes — was sarcasm, not endorsement. A density matrix near-diagonal in the pointer basis is not a mixture of outcomes; it is an improper mixture, and reading it as a proper one is precisely the move under dispute. 1992: typicality and the Born rule from within pilot-wave theory Dürr, Goldstein, and Zanghì's \"Quantum Equilibrium and the Origin of Absolute Uncertainty\" (verify; not in the supplied corpus) reconstructed the empirical content of Bohmian mechanics on a non-probabilistic foundation. The \\psi ^2 distribution is not a postulate but a typicality result: the overwhelming majority — under the equivariant measure on initial configurations — of universes governed by the guidance law exhibit empirical frequencies matching \\psi ^2. This supersedes Bohm's original 1952 appeal to a postulated \"quantum equilibrium\" and parallels Boltzmann's statistical-mechanical derivation of thermodynamics. It also clarifies why pilot-wave non-locality cannot be exploited for signaling: signaling would require systematic departure from equilibrium, which is atypical. What remains live in 2026 Programme Status What it superseded What it owes --- --- --- --- Pilot-wave / Bohmian live von Neumann no-go [6, 12]; ad hoc collapse relativistic / QFT extension GRW \u0026 CSL live postulated Prozess 1 empirical bounds on \\lambda,\\sigma Everettian (Oxford) live the cut itself probability, preferred basis Decoherence (as foundation) superseded as solution; retained as kinematics naive preferred-basis stories the outcome problem Wigner consciousness historical nothing formal a dynamical law Copenhagen (orthodox) residual; still the working dialect of labs — every foundational question it brackets von Neumann no-go superseded — — The honest summary is that the formal landscape narrowed by 1990 to three live programmes — Bohm, GRW/CSL, Everett — plus decoherence as a tool applicable inside any of them. Everything else has either been folded into one of these (London–Bauer's moveable cut is preserved in Bohm's effective collapse, Wigner's clause vestigial in observer-centric Everettian readings) or quietly retired. Validity Audit: Five Conflations the Literature Still Repeats Validity Audit: Five Conflations the Literature Still Repeats Five claims circulate in the modern measurement-problem literature with the qualifications that warranted them silently stripped. For each: the equation, the assumption dropped, and the regime in which the claim survives. 1. \"Decoherence solves the measurement problem.\" The mathematics. For a system S coupled to environment E via n\\rangle S E 0\\rangle \\to n\\rangle S E n\\rangle with \\langle E m \\mid E n\\rangle \\to \\delta {mn}, the reduced state is Off-diagonal coherences decay on \\tau D \\ll \\tau {\\mathrm{relax}}; the diagonal basis is fixed by the interaction Hamiltonian (Zurek's einselection). The assumption dropped. \\rho S is an improper mixture: the global \\Psi {SE}\\rangle remains pure. No partial trace converts a coherent global superposition into a statistical ensemble of definite outcomes; that step requires either an interpretive postulate (Bohmian configuration, Everettian branching) or extra dynamics (GRW). Bell said it plainly: a \"for all practical purposes\" diagonalization is not an answer to what happens . Regime of validity. Decoherence solves the small problem (preferred-basis selection): why pointer states are quasi-classical and macro-interference is suppressed. It does not solve the big problem (a single outcome). Schlosshauer's RMP partitions the two explicitly; the textbook conflation collapses them. 2. \"Von Neumann proved hidden variables are impossible.\" The theorem. Grundlagen , Ch. IV §2, requires any state \\phi on the algebra of observables to satisfy including [\\hat A,\\hat B]\\neq 0. No dispersion-free \\phi then exists. The assumption dropped. Linearity of expectations is a theorem for quantum states (a consequence of \\phi(\\cdot) = \\mathrm{Tr}(\\rho \\,\\cdot)), not a constraint that hidden-variable states must respect. The eigenvalues of \\hat A + \\hat B for non-commuting operators are not sums of separate eigenvalues. Take \\hat A = \\sigma x, \\hat B = \\sigma y: each has spectrum \\{\\pm 1\\}, but (\\sigma x + \\sigma y)/\\sqrt{2} has spectrum \\{\\pm 1\\}, not \\{\\pm\\sqrt{2}\\}. A consistent hidden-variable assignment may give v(\\sigma x), v(\\sigma y) \\in \\{\\pm 1\\} without v(\\sigma x + \\sigma y) = v(\\sigma x) + v(\\sigma y). Hermann saw this in 1935 ; Bell rederived and publicized it in 1966 ; Mermin's review formally restores priority. Bohmian mechanics is the explicit counterexample. Regime of validity. The theorem holds where additivity is physically motivated — on ensemble expectation values reproducing QM. As a no-go on individual hidden-variable assignments it has no force. The substantive constraints are Kochen–Specker (contextuality) and Bell (locality), neither of which appears in . 3. \"Pilot-wave non-locality contradicts relativity.\" The guidance law. For N particles with \\psi(\\mathbf q 1,\\ldots,\\mathbf q N, t) on configuration space, so the velocity of particle k depends instantaneously on the positions of all entangled partners. The assumption dropped. Dynamical non-locality does not entail signaling. For the equivariant measure \\rho = \\psi ^2 (quantum equilibrium, derivable as typicality on the universal configuration), every sub-ensemble's statistics reproduce QM exactly; observable predictions are Lorentz-invariant. The Lorentz-violating substructure is operationally inaccessible. More importantly, Bell's theorem applies to any empirically adequate single-world theory. Collapse interpretations bury non-locality inside Prozess 1; pilot-wave displays it. The complaint that pilot-wave is uniquely non-local identifies a property all such theories share. Regime of validity. The claim survives only in the sharper form: no manifestly Lorentz-covariant pilot-wave field theory has yet been constructed . Relativistic pilot-wave QFT (Bohm–Hiley , later Dürr et al.) requires a preferred foliation or multi-time \\psi; neither has reached the empirical maturity of standard QFT. That is treated in §7. 4. \"Bohmian mechanics = de Broglie's pilot wave.\" Two distinct programs. De Broglie's 1927 Solvay report presented the reduced pilot wave: particle position guided by \\psi. His ambition — before and after Solvay — was the théorie de la double solution : a nonlinear wave equation admitting a singular soliton-like solution u (the particle as localized field concentration) alongside a regular statistical \\psi, with a phase-matching u \\sim C\\psi in the appropriate regime. The reduced guidance equation was the statistical limit of the double-solution dynamics, not the fundamental ontology. Bohm 1952 takes only linear Schrödinger \\psi plus particle position \\mathbf Q, plus quantum potential Q. No nonlinear u-wave: particles are autonomous point beables, not singularities of a self-consistent field. The assumption dropped. Treating de Broglie 1927 = Bohm 1952 erases the nonlinear-field program de Broglie and Vigier pursued through the 1950s–60s. Bacciagaluppi \u0026 Valentini reconstruct the Solvay version; documents the continuation. Regime of validity. As empirical theories the reduced 1927 pilot wave and 1952 Bohmian mechanics make the same predictions; \"de Broglie–Bohm\" (Bell's preferred phrase) is then accurate. As interpretive programs they are distinct. The double-solution program remains formally incomplete. 5. \"The quantum potential is a real force.\" The expression. Writing \\psi = R\\,e^{iS/\\hbar}, the real part of the Schrödinger equation gives and a Newton-like second-order law m\\ddot{\\mathbf q} = -\\nabla(V + Q) follows along the trajectory. The assumptions silently dropped. Three properties distinguish Q from any Newtonian field. (i) Form, not magnitude : Q is invariant under \\psi \\to \\lambda\\psi for \\lambda \\in \\mathbb{C}^\\times; its strength depends on the curvature of R, not on the amplitude. A wave packet of arbitrarily small \\psi can exert finite \"force.\" (ii) No independent source : \\psi obeys its own linear equation; Q is a functional of \\psi, not a field with its own dynamics or stress–energy tensor. (iii) No energy–momentum carrier : Q enters the configuration's energy balance only as bookkeeping; there is no Noether current associated with it. The minimalist position (Bell , Dürr–Goldstein–Zanghì, Goldstein) accordingly drops Q entirely, retains only the first-order guidance equation, and treats Q as a derived artifact of the polar decomposition. Bohm–Hiley retained Q but reinterpreted it as carrying \"active information,\" explicitly not Newtonian force. Regime of validity. Q is exact and useful as the Hamilton–Jacobi correction term in the polar representation, and as a heuristic for non-classical phenomena (tunneling residence times, the two-slit trajectories). It is not a field with sources, energy, or autonomous existence. Reading Q as a Newtonian force imports an ontology Bohm himself recognized as nonstandard — and it is the reading most responsible for pilot-wave theory's spooky reputation in introductory accounts. The Frontier: Relativistic Pilot Waves, Quantum Field Theory, and the Shifty Split Today The Frontier: Relativistic Pilot Waves, Quantum Field Theory, and the Shifty Split Today The measurement problem in 2026 is not where Bell left it in 1990 . Four fronts have sharpened: a Lorentz-covariant pilot-wave dynamics, its embedding in quantum field theory, the experimental noose around dynamical collapse, and the second-generation Wigner's-friend theorems. None is closed, and the residual options are now narrow enough that each deserves an honest accounting. Relativistic pilot waves and the preferred foliation Non-relativistic guidance, is manifestly non-local: \\dot{\\mathbf{q}} k at time t depends on the simultaneous positions of all other particles. Bell's theorem guarantees this is structural, not a flaw to be polished away. The frontier question is whether the simultaneity can be made Lorentz invariant. Dürr, Goldstein, Tumulka and Zanghì proposed equipping spacetime with a covariant foliation \\mathcal{F} — a Lorentz-invariant family of spacelike leaves — along which a Bohm–Dirac multi-time velocity is defined, and showed that if \\mathcal{F} is itself determined by a Lorentz-covariant law (for instance, derived from \\psi via a covariant functional), the theory is fully Lorentz invariant even though no inertial frame is preferred (Dürr et al., 2014). The price is a foliation that is empirically inaccessible: quantum equilibrium \\rho= \\psi ^2 blocks any experiment from revealing which leaf is \"now.\" This is a Lorentz invariance without Lorentz symmetry of the beables — a position that is consistent but bites a real bullet, and is rejected by adherents of the \"block universe\" reading of relativity. Hypersurface Bohm–Dirac (Berndl–Dürr–Goldstein–Zanghì, 1996) and the Tumulka 2007 fully covariant construction remain the cleanest existence proofs. Bohmian quantum field theory There are two live strategies. (i) Field beables : ψ guides a configuration of bosonic field values on a spatial slice, in the spirit of Bohm's own 1952 treatment of the electromagnetic field and developed by Struyve and Westman for the standard model gauge sector. Fermions resist this construction (no positive-definite local density for Dirac spinors), so field-beable models typically keep bosons as fields and treat fermions implicitly via charge currents. (ii) Particle beables on a stochastic lattice : Bell's 1984 model promoted particle number at each lattice site to the beable and replaced unitary creation/annihilation by a Markov jump process whose rates are fixed by \\psi. The Dürr–Goldstein–Tumulka–Zanghì \"Bell-type QFT\" generalizes Bell's construction to the continuum and to any QFT with a positive interaction Hamiltonian density, producing trajectories that include particle creation and annihilation as actual stochastic events (Dürr et al., 2005). Neither programme has produced renormalised interacting predictions matching the Standard Model; both are existence proofs that the measurement problem in QFT can be addressed without invoking observers, not yet a competitor to lattice QCD. Bohm and Hiley's \"pre-space\" / implicate-order programme sits orthogonally — algebraic, suggestive, and so far without a calculational core. Quantum non-equilibrium and the empirical horizon Antony Valentini's programme treats \\rho= \\psi ^2 as a contingent equilibrium, analogous to thermal equilibrium, reached by an H-theorem-like relaxation in pilot-wave dynamics. If non-equilibrium \\rho\\neq \\psi ^2 ever held — say, in the very early universe — it would in principle permit superluminal signalling and statistical anomalies. Valentini and Colin have argued for possible signatures in the CMB low-multipole power spectrum; the bounds are consistent with equilibrium but the parameter space is not closed (Valentini, 2010). This is the only proposal that turns the foundational status of \\psi ^2 into an empirical question rather than a postulate. Dynamical collapse on the rack GRW and its mass-proportional descendant CSL turn Born's Prozess 1 into a stochastic modification of the Schrödinger equation, governed by two parameters: a localization rate \\lambda and a correlation length r C. CSL predicts spontaneous photon emission from charged particles — a free side-effect of the noise — and the X-ray window 10–100 keV is exquisitely sensitive. The IGEX, Majorana and underground Gran Sasso runs analysed by Piscicchia, Donadi, Curceanu, Bassi and collaborators (Piscicchia et al., PRL 132, 250203, 2024) now exclude the originally proposed GRW value of \\lambda for mass-proportional CSL across most of the cosmologically motivated r C range, while leaving Adler's enhanced rate \\lambda\\sim 10^{-8\\pm 2}\\,\\mathrm{s}^{-1} at the edge of viability. Figure: Schematic CSL parameter plane. The 2024 underground X-ray bounds push the upper exclusion boundary down through Adler's enhanced rate; the GRW point sits in a still-allowed region but produces no testable amplification on laboratory timescales. The viable strip is now a few decades wide. The interferometric front (Arndt-group macromolecules; Vinante-group magnetometry) and the non-interferometric one (X-ray, phonon excess in cryogenic detectors) now bracket the parameter space from opposite sides. A full closure is plausible within a decade. Frauchiger–Renner and the limits of single-world consistency Frauchiger and Renner (2018) constructed an extended Wigner's-friend scenario in which the assumptions (Q) unitary quantum mechanics applies to agents, (C) different agents' inferences are consistent, and (S) a measurement has a single outcome cannot all hold. Brukner's \"no-go for observer-independent facts\" (2018) is a sibling. Bohmian mechanics evades the theorem by denying Q applied naively to the friend's record — the friend's beables have definite values that Wigner's superposed description fails to capture — while Everett denies (S) and QBism denies that \"outcome\" is observer-independent. A May 2025 reassessment argues the theorem's force is weaker than usually claimed, turning on a specific composition of conditional statements rather than universal validity of QM (Lazarovici \u0026 Hubert, Entropy 27, 563, 2025). The dust has not settled, but the moral is clear: the cut Bell called \"shifty\" is now formally pinned — every consistent interpretation must violate one specific premise of the Frauchiger–Renner inferential chain, and which one it sacrifices is its metaphysical signature. What an honest physicist owes the problem in 2026 Three things. First, do not cite von Neumann's no-go as if Bell and Mermin had not happened; the existence of pilot-wave theory [4, 7] settles the formal question. Second, do not claim decoherence solves anything beyond the preferred-basis problem — the \"big\" measurement problem requires a beable, a branching, or a collapse, and the choice is not free. Third, treat the Lorentz-covariant foliation, the Bell-type QFT, the CSL parameter strip, and the Wigner-friend chain as the genuine open frontier: each is a falsifiable or formally answerable question, not a matter of taste. The shifty split survives in 2026 not because it is unsolvable, but because the community has not yet decided which of three roughly viable resolutions — Bohmian beables, Everettian branching, or dynamical collapse — to take seriously enough to test to destruction. The AETHER Verdict The AETHER Verdict I have been asked to render judgment, not to balance views. Here it is. (a) What I defend with my reputation The measurement problem is real, unsolved, and not a pseudo-problem of philosophical taste. Unitary evolution applied to a closed system containing apparatus + observer cannot, by linearity alone, yield a single pointer reading; this is not a subtle claim, it is one line of algebra and has been since von Neumann . Any framework that denies this is either (i) silently adding a collapse postulate, (ii) silently adding branches, or (iii) silently adding hidden variables. There is no fourth option, and \"decoherence\" is none of the three — Adler and Schlosshauer are correct and the textbook tradition is wrong [9, 20]. I will also defend the historical record: the pilot-wave ontology is de Broglie's, demonstrated at Solvay 1927 ; Bohm's contribution is the measurement theory and the courage to publish it, not the basic picture. Bell wrote \"de Broglie–Bohm\" deliberately and we should keep doing so. And von Neumann's \"impossibility proof\" was killed by Hermann in 1935 , not by Bell in 1966 — Bell himself said so. The three-decade suppression of Hermann is a sociological failure of our field, not a technical one. (b) What is shakier than the literature admits Three things, named precisely. First, quantum equilibrium . The Born rule in pilot-wave theory is derived [\\ not\\ postulated\\ ] from \\rho = \\psi ^2 as an attractor under typicality measures (Dürr–Goldstein–Zanghì 1992 ). The assumption that the universe began in or rapidly approached this measure is a cosmological-initial-condition claim of the same epistemic status as the past hypothesis in statistical mechanics. It is not a theorem about generic initial data; the relaxation dynamics on coarse-grained scales is delicate and the absolute-uncertainty argument has soft edges in the non-equilibrium regime that Valentini has long flagged but the community has filed away. Second, the Bohmian field-theory program . The Dürr–Goldstein–Tumulka–Zanghì \"Bell-type\" QFT picks a preferred foliation ; the Struyve–Westman bosonic-only ontology drops fermion beables. Neither is empirically equivalent to interacting QFT as a theorem ; both are model constructions with finite-rank cutoffs. The claim \"pilot-wave extends straightforwardly to QFT\" is folklore. It extends to toy QFT. Third, decoherence as basis selection . Pointer-basis arguments via einselection assume a system/environment factorization. That factorization is chosen , not derived; without an external criterion (a Bohmian configuration, a GRW hit-rate, a Wallace-style decision-theoretic agent) there is no preferred basis. Zurek's program is beautiful and partial. (c) The three open questions I would work on, ranked 1. Relativistic guidance without a preferred foliation. If Tumulka's hypersurface-Bohm–Dirac or a multi-time pilot-wave can be made fully covariant without extra structure, the strongest objection to de Broglie–Bohm dies. This is the only place I see a decisive technical advance possible. 2. Experimental access to quantum non-equilibrium. Valentini's prediction that primordial \\rho \\neq \\psi ^2 relics could survive in the CMB or in relic neutrinos is testable in principle; the analysis chain is underdeveloped and the bounds are weak. 3. Operational distinguishability of GRW vs decoherent histories vs Bohm at mesoscopic mass. The interferometry frontier (LIGO-scale mirrors, levitated nanospheres) is closing in on the GRW window; the analysis frameworks still mix incompatible assumptions about what \"collapse\" means. Reading path 1. Bell, Speakable and Unspeakable — especially \"Against Measurement\" and \"On the Impossible Pilot Wave\" . Start here; nothing else is calibrated until you have. 2. von Neumann, Mathematische Grundlagen Ch. VI . Read Prozess 1/Prozess 2 in the original; the textbook digest distorts it. 3. London \u0026 Bauer 1939 . The cleanest statement of the moveable cut, almost never cited in English-language QM courses. 4. Bohm 1952, Parts I \u0026 II . The measurement theory, not just the trajectories — Part II is the half people skip. 5. Dürr, Goldstein, Zanghì, \"Quantum Equilibrium and the Origin of Absolute Uncertainty\" 1992 . The proof that Born statistics are emergent, not postulated; the modern foundation of the program."}</script>

es in Quantum Mechanics, Rev. Mod. Phys. 38", "kind": "theory", "ref": 12}, {"year": 1986, "event": "Dynamical collapse (GRW) — spontaneous localization makes Prozess 1 a stochastic modification of Prozess 2", "who": "Ghirardi, Rimini, Weber", "work": "Unified Dynamics for Microscopic and Macroscopic Systems, Phys. Rev. D 34", "kind": "theory", "ref": 5}, {"year": 1993, "event": "Comprehensive systematization of pilot-wave/Bohmian mechanics, including measurement and the quantum equilibrium hypothesis", "who": "Peter R. Holland", "work": "The Quantum Theory of Motion (Cambridge University Press)", "kind": "formalization", "ref": 9}, {"year": 1993, "event": "Bohmian measurement theory rebuilt rigorously: quantum equilibrium |ψ|² derived as typicality, not postulated; effective wave functions and effective collapse", "who": "D. Dürr, S. Goldstein, N. Zanghì", "work": "Quantum Equilibrium and the Origin of Absolute Uncertainty, J. Stat. Phys. 67", "kind": "formalization", "ref": 20}, {"year": 2014, "event": "Modern review of the measurement problem distinguishing 'big' (definite outcomes) from 'small' (preferred basis) problems and surveying GRW/MWI/Bohm", "who": "Maximilian Schlosshauer", "work": "The Quantum-to-Classical Transition (Springer); and earlier RMP review", "kind": "revival", "ref": 15}], "neglected": [{"name": "Grete Hermann", "role": "Demonstrated in 1935 that von Neumann's no-hidden-variables proof assumes what it sets out to prove — three decades before Bell's celebrated rediscovery of the same flaw. Suppressed by the Nazi era and her publication venue (a neo-Kantian philosophy series), her critique was effectively unknown until Max Jammer and later Mermin recovered it.", "evidence": "Abh. der Fries'schen Schule (1935); Bell (1982) himself credits her in passing; Mermin's 1993 RMP review 'Hidden variables and the two theorems of John Bell' explicitly restores priority.", "ref": 11}, {"name": "Louis de Broglie (his 1927 pilot wave)", "role": "Built a complete deterministic, non-collapse theory five years before von Neumann's Grundlagen and 25 before Bohm; abandoned it after the Solvay Council under pressure from Pauli and the prevailing Copenhagen current. Textbooks routinely call the theory 'Bohm's' or 'Bohmian'.", "evidence": "Bacciagaluppi \u0026 Valentini's reconstruction Quantum Theory at the Crossroads (2009) translates and analyzes the 1927 Solvay proceedings, including de Broglie's full report; Bell repeatedly insists on 'de Broglie–Bohm'.", "ref": 3}, {"name": "Fritz London \u0026 Edmond Bauer", "role": "Their 1939 monograph gave the cleanest pre-war statement of the measurement chain, the moveable Heisenberg cut, and the role of the observer — material that Wigner essentially reformulated in 1961 and that von Neumann's text only sketches.", "evidence": "La théorie de l'observation en mécanique quantique (Hermann, 1939); reprinted/translated in Wheeler \u0026 Zurek's Quantum Theory and Measurement (Princeton, 1983).", "ref": 10}, {"name": "Jean-Pierre Vigier", "role": "Co-developed the relativistic and stochastic extensions of pilot-wave theory with de Broglie at the Institut Henri Poincaré through the 1950s–60s; nearly invisible in Anglophone textbooks despite producing much of the post-1952 de Broglie revival.", "evidence": "de Broglie, Une tentative d'interprétation causale et non linéaire de la mécanique ondulatoire: la théorie de la double solution (Gauthier-Villars, 1956), with Vigier's collaborative chapters and acknowledgments.", "ref": 8}, {"name": "Hans Reichenbach", "role": "His 1944 Philosophic Foundations of Quantum Mechanics anticipated discussion of 'causal anomalies' and the interpretive role of measurement well before Wigner; rarely cited in the physics measurement-problem literature.", "evidence": "Reichenbach, Philosophic Foundations of Quantum Mechanics (University of California Press, 1944).", "ref": 13}, {"name": "Basil Hiley", "role": "Bohm's principal collaborator from the 1960s onward; co-developed the ontological interpretation, the quantum potential program, and the algebraic 'pre-space' reformulation — frequently elided when Bohmian mechanics is summarized as a 1952 one-shot.", "evidence": "Bohm \u0026 Hiley, The Undivided Universe: An Ontological Interpretation of Quantum Theory (Routledge, 1993).", "ref": 17}], "conflations": [{"claim": "Decoherence solves the measurement problem.", "clarification": "Environmental decoherence diagonalizes the reduced density matrix in a preferred (pointer) basis, solving the 'small' problem of basis selection. It does NOT pick out a single outcome from the diagonal — the global state is still a superposition. The 'big' problem (why we see definite outcomes) requires either an interpretive postulate (MWI's branching, Bohm's actual configuration, GRW's spontaneous localization). Adler (2003) and Schlosshauer (2005) make this explicit."}, {"claim": "Von Neumann proved hidden-variables theories are impossible.", "clarification": "Von Neumann (1932) proved only that hidden-variable theories satisfying his assumption ⟨A+B⟩=⟨A⟩+⟨B⟩ for non-commuting A,B are impossible. This linearity is a property of quantum expectation values, not a constraint a hidden-variable theory must respect. Hermann (1935) and Bell (1966) identified this as question-begging. Bohmian mechanics is the existence proof."}, {"claim": "Pilot-wave theory is non-local in a way relativity forbids.", "clarification": "Pilot-wave theory has a non-local guidance equation (the velocity of particle i depends on the positions of all particles via ∇Sᵢ of the joint ψ). But this non-locality cannot be used for signaling, given quantum equilibrium ρ=|ψ|² (Dürr–Goldstein–Zanghì 1992). Bell's theorem shows ANY interpretation reproducing QM predictions must have this kind of non-locality; pilot-wave theory is honest about it rather than hiding it in collapse."}, {"claim": "Bohmian mechanics and de Broglie's pilot-wave theory are the same theory.", "clarification": "De Broglie's 'théorie de la double solution' posited TWO solutions: a singular u-wave (the particle itself, a localized field) and a regular ψ-wave (statistical). His 1927 Solvay talk presented only the reduced 'pilot-wave' version. Bohm's 1952 theory uses only ψ + particle positions and adds the quantum potential Q = -(ℏ²/2m)∇²R/R. The double-solution program (continued by de Broglie and Vigier into the 1960s) is a distinct, never-completed project."}, {"claim": "The measurement problem is solved 'for all practical purposes' (FAPP).", "clarification": "Bell's coinage in 'Against Measurement' (1990) [40] was sarcastic. FAPP-solutions (decoherence, environment-induced superselection) tell you when you can stop worrying for an experiment, not what is actually happening when a pointer reads '5'. The problem is what counts as a measurement at all; that 'shifty split' (Bell) is the unresolved residue."}, {"claim": "The quantum potential Q is a real physical field carrying energy.", "clarification": "In Bohm 1952 [28] Q = -ℏ²∇²R/(2mR) appears as a term in the Hamilton-Jacobi-like equation for S, with R=|ψ|. It has no source, falls off non-classically (depends on form, not magnitude of ψ), and carries no energy/momentum in the usual sense — Bell, Dürr–Goldstein–Zanghì, and Holland emphasize it is a derived bookkeeping quantity, not a Newtonian force field. Treating Q as ontologically primary (as Bohm sometimes did) is one valid reading; minimalist Bohmians treat ψ as nomological and particles + guidance equation as the ontology."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins of the Cut: Schrödinger, Born, and the Pioneers Written Out", "markdown": "## Origins of the Cut: Schrödinger, Born, and the Pioneers Written Out\n\n### 1.1 Schrödinger 1926: a deterministic field, no measurement\n\nThe first of the four \"Quantisierung als Eigenwertproblem\" communications [1] introduced an equation of unambiguous mathematical character: a linear, deterministic, first-order-in-time PDE for a complex field $\\psi(q,t)$ on configuration space. Crucially, the 1926 papers contain **no measurement postulate, no projection rule, and no probabilistic interpretation of $|\\psi|^2$**. Schrödinger himself, in the fourth communication and in his lectures of that year, attempted a charge-density reading,\n\n$$\\rho(\\mathbf{x},t) \\;=\\; e\\,|\\psi(\\mathbf{x},t)|^2,$$\n\ntreating $\\psi$ as a physical wave on $\\mathbb{R}^3$ for the one-electron problem. The dimensional embarrassment — that for $N$ particles $\\psi$ lives on $\\mathbb{R}^{3N}$, not on space — was already apparent to him and is the first crack from which the entire measurement problem grows: the equation is a wave equation, but not in the world.\n\n### 1.2 Born 1926: probability grafted on by hand\n\nA few months later, in *Zur Quantenmechanik der Stoßvorgänge* [2], Born — analyzing scattering amplitudes — proposed that $|\\psi_n|^2$ gives the probability of finding the system in state $n$. The famous footnote inverting the original \"$\\psi$\" to \"$|\\psi|^2$\" was added in proof; Born initially wrote $\\psi_n$, then corrected himself. Three points the textbooks routinely smooth over:\n\n1. Born's rule was advanced **as an interpretive hypothesis**, not derived. There is no proof in [2] that $|\\psi|^2$ rather than some other functional of $\\psi$ is the right density.\n2. It is **incompatible with Schrödinger's own** charge-density reading: $|\\psi|^2$ is a probability on $\\mathbb{R}^{3N}$, not a charge density on $\\mathbb{R}^3$.\n3. It introduces a **second dynamical law by stealth**: at \"measurement,\" $\\psi$ is to be replaced by an eigenstate. The unitary law of [1] and the projection of [2] coexist without a rule for which applies when. This is the structural defect that von Neumann would later name and that Bell would call the *shifty split* sixty-four years later [3].\n\nThe measurement problem, in embryo, is already complete at the close of 1926 — written between two papers separated by a single issue of *Zeitschrift für Physik*.\n\n### 1.3 De Broglie 1927: a deterministic completion, suppressed at Solvay\n\nThe October 1927 fifth Solvay Council is now widely portrayed as the canonization of Copenhagen orthodoxy. The proceedings themselves [4], reconstructed and translated in their entirety by Bacciagaluppi and Valentini [5], tell a different story: de Broglie presented a **complete pilot-wave theory** in which particles possess definite positions $Q_k(t)$ guided by\n\n$$\\frac{dQ_k}{dt} \\;=\\; \\frac{1}{m_k}\\,\\nabla_k S(Q_1,\\dots,Q_N,t), \\qquad \\psi = R\\,e^{iS/\\hbar},$$\n\nand in which the Born statistics emerge automatically from an equilibrium distribution $\\rho=|\\psi|^2$ over hidden positions. The guidance equation now universally labelled \"Bohmian\" appears, with this functional form, in de Broglie's *Rapport* of 1927 — five years before [6], twenty-five before [7].\n\nWhy did the theory vanish from the literature for a quarter-century? The Solvay record shows Pauli's objection on inelastic scattering — which de Broglie could not answer on his feet — combined with Einstein's silence, Lorentz's death the next year, and Heisenberg and Bohr's united front. De Broglie's own Nobel lecture two years later [8] is conspicuously cautious, retreating to \"duality\" and saying almost nothing about trajectories. The retraction was sociological, not mathematical. When Bell, half a century later, insisted on writing \"de Broglie–Bohm\" he was correcting a documented historical erasure, not performing courtesy.\n\nA second, finer point: de Broglie's *programme* of 1927 was the *théorie de la double solution* — a singular u-wave (the particle as a localized non-linear field) accompanied by the regular linear $\\psi$. The Solvay talk presented only the reduced pilot-wave, the version that has survived. The double-solution programme continued with Vigier into the 1960s [9] and never reached completion; conflating it with the pilot-wave theory (frequent in popular accounts) is the first major confusion the literature still propagates.\n\n### 1.4 Von Neumann 1932: two processes and a movable cut\n\n[6] performs three distinct services, which textbooks routinely fuse. First, the **rigorous Hilbert-space formalism** (self-adjoint operators, spectral theorem, density operators). Second, the **two-process dichotomy**: Prozess 1, the non-unitary projection upon measurement,\n\n$$\\hat{\\rho} \\;\\longmapsto\\; \\sum_n \\hat{P}_n\\,\\hat{\\rho}\\,\\hat{P}_n,$$\n\nand Prozess 2, the unitary $i\\hbar\\partial_t\\hat{\\rho} = [\\hat H,\\hat\\rho]$. Third, the **impossibility proof** for dispersion-free hidden-variable states, resting on the assumption that the expectation functional is linear on *all* observables, $\\langle A+B\\rangle = \\langle A\\rangle + \\langle B\\rangle$, **even when $[A,B]\\neq 0$**.\n\nTwo attributions that need straightening. (a) The *Heisenberg cut* — the boundary between quantum system and classical apparatus — is not in [6] as a sharp notion; it is implicit, and the canonical statement is in London \u0026 Bauer 1939 [10]. (b) The *projection postulate* as a rule for post-measurement state preparation is sharpened by Lüders (1951), not by von Neumann. The \"von Neumann–Lüders rule\" elision is itself a credit failure.\n\n### 1.5 Grete Hermann 1935: Bell's argument, three decades early\n\nIn *Die naturphilosophischen Grundlagen der Quantenmechanik* [11], Grete Hermann identified the load-bearing flaw in [6]: the assumption $\\langle A+B\\rangle=\\langle A\\rangle+\\langle B\\rangle$ for non-commuting $A,B$ is a property of *quantum* expectation values — it cannot be imposed *a priori* on any hidden-variable state without **assuming what the proof sets out to demonstrate**. This is, line for line, Bell's critique of 1966 [12]; Mermin's 1993 review [13] gives Hermann full priority and notes that Bell himself acknowledged her in his later writings.\n\nWhy was she written out? Three reasons converged: publication in a neo-Kantian philosophy series outside physicists' reading radius; Nazi-era disruption of her Göttingen circle; and the institutional weight of [6], which made challenging it professionally costly. Jammer recovered her in 1974, Mermin again in 1993; she remains absent from most quantum-foundations textbooks.\n\n### 1.6 London \u0026 Bauer 1939: the cut named, the chain stated\n\n[10] is the cleanest pre-war articulation of what is *now* called the measurement problem: a system $S$, apparatus $A$, and observer $O$ form a chain in which unitary evolution produces\n\n$$|\\psi\\rangle_S \\otimes |A_0\\rangle \\otimes |O_0\\rangle \\;\\longrightarrow\\; \\sum_n c_n\\,|s_n\\rangle \\otimes |A_n\\rangle \\otimes |O_n\\rangle,$$\n\nand the Heisenberg cut between \"described quantum-mechanically\" and \"treated classically\" can be moved arbitrarily up the chain. London \u0026 Bauer locate the inevitable collapse at the observer's *conscious* reading — a position usually attributed to Wigner 1961 [14], who in fact reformulated their argument with explicit credit (often dropped by his readers).\n\n### 1.7 Vigier and the unfinished post-war pilot-wave\n\nJean-Pierre Vigier, working with de Broglie at the Institut Henri Poincaré from 1948 onward, supplied much of the stochastic and relativistic machinery that the 1927 talk had lacked. His chapters in de Broglie's 1956 *Une tentative d'interprétation causale et non linéaire de la mécanique ondulatoire* [9] develop the double-solution programme — stochastic ether, non-linear u-wave equations — that runs in parallel to, and predates, the Bohm–Hiley quantum-potential reformulation of the same era [15]. Anglophone summaries that present \"Bohmian mechanics, 1952\" as a one-shot creation elide both the 1927 origin and the continuous French line through Vigier.\n\nWhat is in place by 1939, then, is not yet a \"measurement problem\" with a name, but the entire apparatus that makes one inevitable: a deterministic linear law (Schrödinger), a non-linear probabilistic rule applied by fiat (Born), an existence proof that the linear law alone suffices given hidden variables (de Broglie), a rigorous formalism that makes the contradiction explicit (von Neumann), an early demolition of the proof that buried the existence proof (Hermann), and the cleanest statement of the chain whose closure the formalism cannot specify (London \u0026 Bauer). The next section dissects the contradiction itself."}, {"id": "physics-of-the-problem", "title": "The Physics: Prozess 1 vs Prozess 2, the von Neumann Chain, and Why Linearity Forbids Outcomes", "markdown": "## The Physics: Prozess 1 vs Prozess 2, the von Neumann Chain, and Why Linearity Forbids Outcomes\n\nVon Neumann's *Mathematische Grundlagen* [6] is the source of nearly every framing the textbook tradition still uses, and also of the disease that framing introduces. The text isolates two distinct dynamical laws and never reconciles them.\n\n**Prozess 1 (the collapse postulate).** Upon measurement of an observable $A=\\sum_n a_n P_n$ on a system in state $\\rho$, the state updates discontinuously and stochastically,\n$$\\rho \\;\\longrightarrow\\; \\rho' \\;=\\; \\frac{P_n\\,\\rho\\,P_n}{\\operatorname{tr}(P_n\\rho)}, \\qquad p_n \\;=\\; \\operatorname{tr}(P_n\\rho),$$\nwhere $p_n$ is the Born probability [2]. This map is non-linear in $\\rho$, non-unitary, and irreversible.\n\n**Prozess 2 (Schrödinger evolution).** Between measurements,\n$$i\\hbar\\,\\partial_t\\,|\\psi\\rangle \\;=\\; H\\,|\\psi\\rangle, \\qquad |\\psi(t)\\rangle \\;=\\; U(t)\\,|\\psi(0)\\rangle,$$\nlinear, deterministic, unitary, time-reversible.\n\nThe measurement problem is the question of how a theory can consistently contain both, given that they are incompatible at the level of formal structure. Von Neumann never answers this; he stipulates that Prozess 1 applies \"during measurement\" and Prozess 2 otherwise — the cut between them being what Bell would later mock as \"the shifty split\" [3].\n\n### The von Neumann chain\n\nConsider a system $S$ with orthonormal eigenstates $\\{|s_n\\rangle\\}$ of $A$ and an apparatus $\\mathcal{A}$ initialized in a \"ready\" state $|A_0\\rangle$ whose pointer can take values $\\{|A_n\\rangle\\}$. A *good* measurement coupling is one for which Prozess 2 implements\n$$|s_n\\rangle\\,|A_0\\rangle \\;\\xrightarrow{U_{\\rm meas}}\\; |s_n\\rangle\\,|A_n\\rangle.$$\nIf the system is in an eigenstate of $A$, the apparatus reliably records it. Feed the apparatus a *superposition*. Linearity of $U_{\\rm meas}$ forces\n$$\\Big(\\sum_n c_n\\,|s_n\\rangle\\Big)\\,|A_0\\rangle \\;\\xrightarrow{U_{\\rm meas}}\\; \\sum_n c_n\\,|s_n\\rangle\\,|A_n\\rangle. \\tag{$\\star$}$$\nThe right-hand side is an entangled pure state. It is *not* the classical-looking mixture $\\sum_n |c_n|^2\\,|s_n\\rangle\\langle s_n|\\otimes|A_n\\rangle\\langle A_n|$. Those density matrices share diagonals in the pointer basis but differ on the off-diagonals, and are operationally distinct under any Hermitian observable sensitive to coherence between $|A_n\\rangle$ and $|A_m\\rangle$.\n\nThe chain continues. Couple the apparatus to an observer $O$, the environment $E$, a colleague $F$:\n$$\\sum_n c_n\\,|s_n\\rangle\\,|A_0\\rangle\\,|O_0\\rangle\\,|E_0\\rangle\\,|F_0\\rangle \\;\\longrightarrow\\; \\sum_n c_n\\,|s_n\\rangle\\,|A_n\\rangle\\,|O_n\\rangle\\,|E_n\\rangle\\,|F_n\\rangle.$$\nAt no point does Prozess 2 select a branch. London and Bauer made this transparent in 1939 [10]: the cut can be moved arbitrarily far up the chain without the formalism telling us where to plant it. Wigner's friend [14] is the same chain drawn around a consciousness. Schrödinger's cat [16] is the same chain with a poison vial in place of the apparatus and a mammal in place of the pointer.\n\u003csvg viewBox=\"0 0 720 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eThe von Neumann chain: where do you plant the cut?\u003c/text\u003e\u003cg font-family=\"serif\" font-size=\"14\" fill=\"#e8e6e1\"\u003e\u003crect x=\"20\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"75\" y=\"95\" text-anchor=\"middle\"\u003eSystem S\u003c/text\u003e\u003ctext x=\"75\" y=\"115\" text-anchor=\"middle\" font-size=\"12\"\u003eΣ c_n |s_n⟩\u003c/text\u003e\u003crect x=\"160\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"215\" y=\"95\" text-anchor=\"middle\"\u003eApparatus A\u003c/text\u003e\u003ctext x=\"215\" y=\"115\" text-anchor=\"middle\" font-size=\"12\"\u003epointer |A_n⟩\u003c/text\u003e\u003crect x=\"300\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"355\" y=\"95\" text-anchor=\"middle\"\u003eObserver O\u003c/text\u003e\u003ctext x=\"355\" y=\"115\" text-anchor=\"middle\" font-size=\"12\"\u003ebrain |O_n⟩\u003c/text\u003e\u003crect x=\"440\" y=\"70\" width=\"120\" height=\"60\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"500\" y=\"95\" text-anchor=\"middle\"\u003eEnvironment E\u003c/text\u003e\u003ctext x=\"500\" y=\"115\" text-anchor=\"middle\" font-size=\"12\"\u003ephotons |E_n⟩\u003c/text\u003e\u003crect x=\"590\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"645\" y=\"95\" text-anchor=\"middle\"\u003eFriend F …\u003c/text\u003e\u003ctext x=\"645\" y=\"115\" text-anchor=\"middle\" font-size=\"12\"\u003e|F_n⟩ …\u003c/text\u003e\u003cline x1=\"130\" y1=\"100\" x2=\"160\" y2=\"100\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"270\" y1=\"100\" x2=\"300\" y2=\"100\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"410\" y1=\
