"100\" x2=\"440\" y2=\"100\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"560\" y1=\"100\" x2=\"590\" y2=\"100\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"360\" y=\"175\" text-anchor=\"middle\" fill=\"#ffb86b\" font-size=\"14\"\u003eProzess 2 (unitary) propagates entanglement rightward:\u003c/text\u003e\u003ctext x=\"360\" y=\"200\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"13\"\u003e|Ψ⟩ = Σ c_n |s_n⟩|A_n⟩|O_n⟩|E_n⟩|F_n⟩ …\u003c/text\u003e\u003cline x1=\"145\" y1=\"235\" x2=\"145\" y2=\"300\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"145\" y=\"320\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"13\"\u003ecut at A\u003c/text\u003e\u003ctext x=\"145\" y=\"338\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"12\"\u003e(Bohr)\u003c/text\u003e\u003cline x1=\"285\" y1=\"235\" x2=\"285\" y2=\"300\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"285\" y=\"320\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"13\"\u003ecut at O\u003c/text\u003e\u003ctext x=\"285\" y=\"338\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"12\"\u003e(vN / Wigner)\u003c/text\u003e\u003cline x1=\"425\" y1=\"235\" x2=\"425\" y2=\"300\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"425\" y=\"320\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"13\"\u003ecut at E\u003c/text\u003e\u003ctext x=\"425\" y=\"338\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"12\"\u003e(decoherence FAPP)\u003c/text\u003e\u003cline x1=\"640\" y1=\"235\" x2=\"640\" y2=\"300\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"640\" y=\"320\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"13\"\u003eno cut\u003c/text\u003e\u003ctext x=\"640\" y=\"338\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"12\"\u003e(Everett, Bohm)\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\n*Figure: The Heisenberg–von Neumann chain. Unitary evolution entangles each successive stage; the boundary between Prozess 1 and Prozess 2 is movable but, within the orthodox formalism, never derivable.*\n\n### Biorthogonal decomposition and the preferred-basis problem\n\nAny pure bipartite state admits a Schmidt decomposition,\n$$|\\Psi\\rangle_{S\\mathcal{A}} \\;=\\; \\sum_n \\lambda_n\\,|\\tilde s_n\\rangle\\,|\\tilde A_n\\rangle, \\qquad \\lambda_n \\geq 0,$$\nwith $\\{|\\tilde s_n\\rangle\\}, \\{|\\tilde A_n\\rangle\\}$ orthonormal. When the Schmidt coefficients are non-degenerate the decomposition is *unique*, and one might hope the basis $\\{|\\tilde A_n\\rangle\\}$ is the \"objectively correct\" pointer basis. The hope fails twice. First, equation $(\\star)$ generically has degenerate Schmidt spectra (take $c_1=c_2=1/\\sqrt{2}$ in a two-outcome experiment); the decomposition is then ambiguous up to an arbitrary unitary rotation in the degenerate sector, and *any* basis of that subspace is mathematically as good as any other — the apparatus could just as well \"be measuring\" $|A_1\\rangle\\pm|A_2\\rangle$. Second, even when the spectrum is non-degenerate, the Schmidt basis is fixed by the *state* rather than by the apparatus and drifts as the state evolves, so it does not single out a stable, robust set of macroscopically distinguishable outcomes. This is the *small* (preferred-basis) measurement problem. Environmental decoherence answers it partially — pointer states are those quasi-classical states robust under monitoring by $E$, so $\\rho_{S\\mathcal{A}}^{\\rm red}$ becomes effectively diagonal in a unique basis on the decoherence timescale $\\tau_D$ [17]. But the reduced density matrix is still a mixture, not an eigenstate, and the *big* problem (a single actualized outcome) is untouched.\n\n### Maudlin's trilemma\n\nThe structural impossibility is sharpest stated as a three-way inconsistency (Maudlin 1995, *verify*) among three propositions any one of which alone is unobjectionable.\n\n(M1) **Completeness.** The wave function $|\\psi\\rangle$ specifies all there is to specify about a physical system.\n\n(M2) **Linearity.** $|\\psi\\rangle$ always evolves by a linear, deterministic Schrödinger-type law.\n\n(M3) **Definiteness.** Measurements have unique definite outcomes.\n\nThe argument from $(\\star)$ is a syllogism. By (M1) the post-measurement state of $S+\\mathcal{A}$ is *exhausted* by $\\sum_n c_n|s_n\\rangle|A_n\\rangle$. By (M2) that state is the unique successor of the initial product state. But that state is a superposition of macroscopically distinct pointer configurations, contradicting (M3). The three living programs drop exactly one premise apiece: spontaneous-collapse theories (GRW-type) deny (M2) by adding a stochastic non-linear term to the dynamics; Everett [18] denies (M3) by accepting all branches as actual; de Broglie–Bohm [4, 7] denies (M1) by adjoining the actual configuration $Q(t)$ as supplementary ontology. Copenhagen, when pressed, denies (M1) operationally — by treating $|\\psi\\rangle$ as predictive bookkeeping rather than a state of the system — but only by importing a primitive notion of \"measurement\" that the chain shows it cannot define.\n\n### Why linearity forbids outcomes\n\nIt is occasionally suggested that a subtle non-linear *interpretation* of Prozess 2, without supplementing the ontology, could yield outcomes. It cannot, and the obstruction is purely algebraic. Let $\\mathcal{E}$ be the linear isometry $|s_n\\rangle|A_0\\rangle\\mapsto|s_n\\rangle|A_n\\rangle$. For any superposition $|\\psi\\rangle = \\sum_n c_n|s_n\\rangle$, linearity gives $\\mathcal{E}(|\\psi\\rangle|A_0\\rangle) = \\sum_n c_n|s_n\\rangle|A_n\\rangle$, and no choice of $\\mathcal{E}$ within the unitary group can produce a single product $|s_k\\rangle|A_k\\rangle$ on the right unless $c_n=\\delta_{nk}$ on the left. Outcomes require either non-linearity in the dynamics, or non-completeness of the state, or a reinterpretation of what an \"outcome\" is.\n\nThis is also where von Neumann's \"impossibility proof\" against hidden variables collapses. He assumes that any hidden-variable extension must satisfy\n$$\\langle A+B \\rangle_\\lambda \\;=\\; \\langle A \\rangle_\\lambda + \\langle B \\rangle_\\lambda$$\non dispersion-free states $\\lambda$ even for non-commuting $A, B$. Quantum *ensemble* expectations obey this by linearity of the trace; *individual* hidden-variable states carry no such obligation, since simultaneous eigenvalues of non-commuting operators need not even be defined. Hermann saw this in 1935 [11]; Bell proved it again, with explicit counterexample, in 1966 [12]; Mermin [13] gives the definitive credit-restoration. The lesson is sharper than the historical scandal: the very property of Prozess 2 that *creates* the measurement problem — strict linearity at the level of the state — was tacitly imported into the proof that no other state-description could exist. The proof assumed away the only viable escape route. That escape route, in the de Broglie–Bohm formulation, is what §3 constructs."}, {"id": "de-broglie-bohm-construction", "title": "The de Broglie–Bohm Construction: Guidance Equation, Quantum Potential, and Effective Collapse", "markdown": "## The de Broglie–Bohm Construction: Guidance Equation, Quantum Potential, and Effective Collapse\n\nTwo formally distinct but empirically equivalent presentations dominate. De Broglie's 1927 derivation is first-order in time and reads guidance directly off the phase of $\\psi$ [4]. Bohm's 1952 derivation is second-order, with a Newton-like equation modified by an extra term he named the *quantum potential* [7]. Both are deduced from the Schrödinger equation alone — neither adds a new dynamical postulate to the wave function. What both add is an additional ontological variable: the actual configuration $Q(t)=(\\mathbf{Q}_1,\\ldots,\\mathbf{Q}_N)$ of the $N$ particles.\n\n### The polar decomposition and the two equations of motion\n\nWrite the wave function in polar form,\n$$\\psi(\\mathbf{q},t) = R(\\mathbf{q},t)\\,e^{iS(\\mathbf{q},t)/\\hbar}, \\qquad R\\ge 0.$$\n\nSubstituted into $i\\hbar\\,\\partial_t\\psi = -\\frac{\\hbar^2}{2m}\\nabla^2\\psi + V\\psi$ and separated into real and imaginary parts, this yields two coupled real equations:\n$$\\partial_t S + \\frac{(\\nabla S)^2}{2m} + V + Q = 0, \\qquad Q \\equiv -\\frac{\\hbar^2}{2m}\\frac{\\nabla^2 R}{R}, \\tag{1}$$\n$$\\partial_t R^2 + \\nabla\\!\\cdot\\!\\Big(R^2\\,\\tfrac{\\nabla S}{m}\\Big) = 0. \\tag{2}$$\n\nEquation (2) is a continuity equation for $\\rho=R^2=|\\psi|^2$ with current $\\mathbf{j}=\\rho\\,\\nabla S/m$. The natural reading is that an ensemble distributed as $|\\psi|^2$ flows along the velocity field $\\mathbf{v}=\\nabla S/m$. That is precisely **de Broglie's guidance law**, presented as the *nouvelle dynamique des quanta* at the fifth Solvay Council [4]:\n$$\\frac{d\\mathbf{Q}_i}{dt} \\;=\\; \\frac{1}{m_i}\\nabla_i S(\\mathbf{Q},t) \\;=\\; \\frac{\\hbar}{m_i}\\,\\mathrm{Im}\\!\\left(\\frac{\\nabla_i \\psi}{\\psi}\\right)_{\\!\\mathbf{q}=\\mathbf{Q}}. \\tag{3}$$\n\nIt is well defined wherever $\\psi\\neq 0$; trajectories generically avoid the nodal set, which is a measure-zero subvariety. The theory is first-order: initial positions plus the universal wave function determine the future.\n\nBohm [7] reorganized (1) as a Hamilton–Jacobi equation with a *modified* potential and took the gradient. Using $\\mathbf{v}_i=\\nabla_i S/m_i$ along a trajectory yields\n$$m_i\\,\\ddot{\\mathbf{Q}}_i = -\\nabla_i\\!\\big(V+Q\\big). \\tag{4}$$\n\nThis Newton-with-extra-force form is what made the 1952 papers digestible to a Newton-trained readership. It is also what introduced the famous quantum potential\n$$Q(\\mathbf{q},t) = -\\sum_i \\frac{\\hbar^2}{2m_i}\\,\\frac{\\nabla_i^2 R}{R},$$\nwhich depends on the *form* of $R$, not its magnitude, can be large where $|\\psi|$ is small, and is irreducibly non-local for $N\\ge 2$ — it couples particles instantaneously through the joint $\\psi$. The whole nonclassical content (interference, tunneling, entanglement-mediated correlations) resides in $Q$. Equations (3) and (4) are not independent dynamics: (3) is a first integral of (4), so choosing $\\dot{\\mathbf{Q}}_i=\\nabla_i S/m_i$ once is preserved by (4). Contemporary \"minimalist\" Bohmians take (3) as fundamental and treat $Q$ as derived bookkeeping; Bohm and Hiley [15] continued to read $Q$ as an active *information potential*, a genuinely ontological field.\n\n### Measurement as a derived process\n\nThe von Neumann measurement scheme [6] evolves\n$$\\Big(\\sum_n c_n|s_n\\rangle\\Big)|\\Phi_0\\rangle \\;\\longrightarrow\\; \\sum_n c_n\\,|s_n\\rangle\\,|\\Phi_n\\rangle,$$\nwith $|\\Phi_n\\rangle$ a macroscopic pointer state. In configuration-space language the post-interaction joint wave function is\n$$\\Psi(\\mathbf{q}_s,\\mathbf{q}_a,t) = \\sum_n c_n\\,\\psi_n(\\mathbf{q}_s)\\,\\Phi_n(\\mathbf{q}_a),$$\nand the pointer packets $\\Phi_n(\\mathbf{q}_a)$ are *macroscopically displaced*, so their supports in $\\mathbf{q}_a$ are disjoint to overwhelming accuracy.\n\nThe actual apparatus configuration $\\mathbf{Q}_a(t)$ falls into the support of one packet, say $\\Phi_k$. Insert this into (3): contributions from $n\\neq k$ vanish in both numerator and denominator there, leaving\n$$\\dot{\\mathbf{Q}}_i \\;=\\; \\frac{\\hbar}{m_i}\\,\\mathrm{Im}\\,\\frac{\\nabla_i\\!\\big[c_k\\,\\psi_k(\\mathbf{q}_s)\\,\\Phi_k(\\mathbf{q}_a)\\big]}{c_k\\,\\psi_k(\\mathbf{q}_s)\\,\\Phi_k(\\mathbf{q}_a)}\\bigg|_{\\mathbf{q}=\\mathbf{Q}}.$$\n\nThe other branches still exist in Hilbert space; they simply no longer steer anything. Bohmians call $\\psi_{\\mathrm{eff}}(\\mathbf{q}_s,t)=\\psi_k(\\mathbf{q}_s)$ the *effective wave function* of the system. \"Collapse\" is the operational replacement $\\Psi\\mapsto\\psi_{\\mathrm{eff}}\\,\\Phi_k$ — a theorem about subsystems, not a postulate about state reduction. Bohm proved a paradigm case in §6 of [7]; the modern, rigorous formulation is due to Dürr, Goldstein, and Zanghì (verify), who also recovered Born statistics as the typical empirical distribution under quantum equilibrium $\\rho=|\\psi|^2$ rather than postulating it. The persistence of the empty branches has empirical content only if they later interfere with the occupied one — which decoherence makes astronomically unlikely for macroscopic apparatuses but does not strictly forbid. This is the precise sense in which pilot-wave theory dissolves Bell's \"shifty split\" [3]: there is no cut, because there is no Prozess 1.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eBranching of the joint configuration-space wave function and the effective-collapse mechanism\u003c/title\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"340\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"200\" y=\"370\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003esystem coord q_s\u003c/text\u003e\u003ctext x=\"35\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 35 200)\"\u003eapparatus coord q_a\u003c/text\u003e\u003ctext x=\"200\" y=\"48\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003ebefore interaction\u003c/text\u003e\u003cellipse cx=\"180\" cy=\"245\" rx=\"75\" ry=\"38\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"248\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003eΨ = (Σ cₙ ψₙ) · Φ₀\u003c/text\u003e\u003ccircle cx=\"158\" cy=\"255\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"158\" y=\"295\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003eQ(t₀)\u003c/text\u003e\u003cline x1=\"400\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"400\" y1=\"60\" x2=\"400\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"540\" y=\"370\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003esystem coord q_s\u003c/text\u003e\u003ctext x=\"540\" y=\"48\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eafter interaction\u003c/text\u003e\u003cellipse cx=\"485\" cy=\"130\" rx=\"55\" ry=\"28\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"485\" y=\"134\" fill=\"#7aa2ff\" font-size=\"12\" text-anchor=\"middle\"\u003ec₁ ψ₁ Φ₁\u003c/text\u003e\u003cellipse cx=\"620\" cy=\"285\" rx=\"55\" ry=\"28\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"620\" y=\"289\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ec₂ ψ₂ Φ₂\u003c/text\u003e\u003cpath d=\"M 158 255 Q 330 240 485 130\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ccircle cx=\"485\" cy=\"130\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"485\" y=\"170\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003eQ(t₁)\u003c/text\u003e\u003ctext x=\"630\" y=\"325\" fill=\"#ff7a90\" font-size=\"11\" text-anchor=\"middle\"\u003eempty branch (no overlap with Q)\u003c/text\u003e\u003ctext x=\"540\" y=\"393\" fill=\"#7ee0a3\" font-size=\"11\" text-anchor=\"middle\"\u003etrajectory selects one branch\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Joint configuration space (system × apparatus). Before the interaction a single packet guides the actual configuration $Q$ (orange). After it, the support splits into macroscopically disjoint branches; $Q$ enters one (blue), so the other (dashed pink) persists in Hilbert space but, sharing no overlap with $Q$ in $\\mathbf{q}_a$, contributes nothing to (3). Collapse is effective, not fundamental.*\n\n### The reduced pilot wave is not the *théorie de la double solution*\n\nA persistent conflation deserves dismantling. De Broglie's deeper, lifelong program was the *théorie de la double solution* [9, 8]. There, $\\psi$ is only the statistical, normalizable wave; the particle itself is a separate *singular, soliton-like* solution $u$ of an underlying nonlinear wave equation, phase-locked to $\\psi$ so that the guidance velocity (3) emerges as a *consequence* — the principle of the *guidage*. The 1927 Solvay report [4] presented only the truncated version: drop the $u$-wave, reinstate the particle as a point with velocity $\\nabla S/m$, and proceed. De Broglie called this provisional, a calculational stand-in for the unfinished double-solution program [9]; Bacciagaluppi and Valentini's reconstruction of the Solvay proceedings makes the two-tier strategy explicit [5].\n\nBohm 1952 [7] adopted the reduced version straight: point particles with definite positions, guided by $\\psi$ on configuration space, no $u$-wave, no nonlinear field equation. De Broglie and Vigier continued the double-solution program into the 1960s, but a nonlinear wave equation with stable, $\\psi$-locked solitons compatible with relativistic invariance was never produced. What is today called \"Bohmian mechanics\" — including the Bohm–Hiley ontological interpretation [15] — descends from the reduced theory. Calling it \"de Broglie's theory\" without qualification erases the half-century in which de Broglie himself regarded the reduced form as a placeholder for an ontology he had not yet finished writing."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From Stern–Gerlach to Weak Measurement of Bohmian Trajectories", "markdown": "## Landmark Experiments: From Stern–Gerlach to Weak Measurement of Bohmian Trajectories\n\nThe measurement problem is a problem *about* experiments, not one solved *by* them — no observation has ever produced a definite outcome in violation of unitary evolution, because unitary evolution has nothing to say about outcomes [3]. What experiments have done is sharpen the contradiction: each generation has closed a loophole, pushed the von Neumann cut [6] further into the macroscopic regime, or read off a quantity that orthodox phrasing says does not exist. The list below is a validity audit of those landmarks.\n\n### Stern–Gerlach (1922): the prototype that is misremembered\n\nThe Frankfurt experiment of Stern and Gerlach — silver atoms through an inhomogeneous magnetic field splitting into two beams on a glass plate — was performed to test Bohr–Sommerfeld *spatial quantization* of orbital angular momentum. Spin had not yet been proposed; Uhlenbeck and Goudsmit posit it only in 1925. The numerical agreement with $\\mu_z = \\pm \\mu_B$ was right for the wrong reason: silver's $5s$ ground state has $\\ell = 0$, and the splitting is electron spin patched in retroactively. Folklore that \"Stern–Gerlach measured spin\" inverts the history; it was the first observation of *any* discrete projection of an internal degree of freedom.\n\nFor the measurement problem the apparatus is the minimal case where Prozess 1 acquires a concrete spatial signature: the centre-of-mass coordinate becomes entangled with the spin projection, and the two wave-packets separate in configuration space. In the de Broglie–Bohm reading [4, 7], the atom's trajectory is fixed at every instant by the guidance equation; the two emerging beams are not superpositions but two disjoint regions of $\\mathbb{R}^3$, only one occupied. Bohm, Schiller and Tiomno (1955) (verify) showed that \"the spin value\" is contextually produced — which beam is taken depends on the atom's initial transverse position. The conflation of *measurement* with *revelation of a pre-existing property* fails cleanly here, decades before Kochen–Specker.\n\n### Mott (1929): the straight track from a spherical wave\n\nMott's analysis of why an $s$-wave $\\alpha$ particle ionizes along a *straight* track in a cloud chamber — given a spherically symmetric initial $\\psi$ — is the first calculation in which the linear theory yields a definite-looking outcome without invoking collapse. The joint wavefunction of $\\alpha$-plus-vapour develops support only on configurations whose ionizations lie on a common ray. This is the prototype of what was reinvented as decoherence-induced einselection of a pointer basis. It dissolves the *small* problem (why a track and not a sphere of glints) without touching the *big* problem (which ray) [3, 17].\n\n### Neutron interferometry (1974–): Prozess 2 made macroscopic\n\nHelmut Rauch's silicon perfect-crystal interferometer at Vienna and Grenoble demonstrated single-neutron self-interference over centimetre path separations, the $4\\pi$ rotation symmetry of spin-$\\tfrac{1}{2}$ (Werner–Colella–Overhauser, 1975), and the gravitationally induced phase shift $\\Delta\\varphi_g = -m^2 g A \\lambda / \\hbar^2$ (Colella–Overhauser–Werner, 1975). These results make Schrödinger evolution visible at scales where intuition expects classical trajectories, pushing the cut [10]. They are also the cleanest test of the empty-packet ontology of pilot-wave theory: because the guidance equation depends on the *full* $\\psi$ and not on the occupied branch, the empty wave must be physically retained until recombination — a non-trivial commitment that the data are consistent with.\n\n### Delayed choice and the quantum eraser\n\nWheeler's delayed-choice gedankenexperiment (1978) and its photonic realizations — Jacques et al. (2007) being the canonical loophole-poor version — confront the idea that the experimenter can \"decide after the fact\" whether a photon was wave or particle. The Bohmian reading is unambiguous and undramatic: the photon has, at every moment, a definite effective trajectory; the late switch only selects which branch of the apparatus wavefunction the trajectory inhabits. Scully–Drühl's quantum eraser (1982) and Kim et al.'s delayed-choice eraser (1999) make the same point — fringes appear and disappear with which-path entanglement, not with retrocausation. What these experiments *do* constrain: any picture in which the photon \"chooses\" wave or particle behaviour as a property carried in flight. What they do *not* constrain: the measurement problem itself, since both copies-of-an-occurrence (MWI) and effective-collapse (Bohm) reproduce the data.\n\n### Bell tests: Aspect (1982) → loophole-free (2015)\n\nAspect, Dalibard and Roger violated CHSH with time-varying polarizer settings, closing the locality loophole at the photon-flight scale. The loophole-free generation — Hensen et al. (NV centres, Delft, 2015), Giustina et al. (Vienna, 2015), Shalm et al. (NIST, 2015) — closed locality, fair-sampling and measurement-independence simultaneously. *What is constrained:* any theory reproducing quantum predictions while respecting setting independence must be non-local in Bell's precise sense, killing the EPR-style [19] local-hidden-variable completion. Mermin's review [13] and Bell's own 1966 paper [12] make the inferential chain explicit. *What is not constrained:* the measurement problem. Bohmian mechanics passes — it is overtly non-local at the level of the guidance equation — and so do GRW, Everett [18], and Copenhagen. Bell tests discriminate classes of interpretation, not interpretations of an outcome.\n\n### Kocsis et al. (2011): weak measurement of average Bohmian trajectories\n\nKocsis and collaborators (Science 332, 1170) used weak measurement of transverse momentum followed by strong position post-selection to reconstruct the *ensemble-averaged* trajectories of single photons in a two-slit interferometer. The streamlines match the Bohmian velocity field computed from the photon guidance prescription (Wiseman, NJP 2007). This does *not* prove pilot-wave theory: the experiment yields the imaginary part of the weak value $\\mathrm{Im}\\,\\langle x|\\hat p|\\psi\\rangle / \\langle x|\\psi\\rangle$, which by construction equals $\\partial_x S(x)/m$ and is therefore a prediction of *standard* quantum mechanics. What it falsifies is the rhetorical position — orthodox since Heisenberg — that talking about trajectories in interference experiments is operationally meaningless. The trajectories are operationally meaningful in the weak-measurement sense regardless of interpretation; Bohmians take them as ontic, Copenhageners as a curious functional of $\\psi$, but they exist on the bench.\n\n### Extended Wigner's-friend experiments\n\nThe Frauchiger–Renner construction (Nature Comm. 9:3711, 2018) sharpens Wigner's 1961 friend [14] into a formal no-go: no single-world interpretation can simultaneously satisfy (i) universal unitarity, (ii) single outcomes for observers, and (iii) consistency across nested observers reasoning about each other. Bong, Utreras-Alarcón et al. (Nature Phys. 16, 1199, 2020) gave a photonic realization of the related Local Friendliness inequalities and reported a violation. These experiments are not solutions; they are a forced choice. *What they constrain:* any survivor must abandon at least one of universality, absoluteness of observed events, locality, or freedom of choice. *What they entail for the catalogue:* Bohmian mechanics surrenders locality (already known and quantified by Bell); MWI surrenders absoluteness of events; QBism surrenders observer-independence of facts; orthodox Copenhagen survives only by refusing to apply $\\psi$ to the friend — Bell's \"shifty split\" [3] crystallized in a single Bell-type inequality.\n\nThe pattern across the century is consistent. Each experimental milestone — Stern–Gerlach, Mott, Rauch, Aspect, Hensen–Giustina–Shalm, Kocsis, Frauchiger–Renner — has *narrowed* the space of viable accounts without *selecting* one. The data are interpretation-neutral; the measurement problem is interpretation-forced. That asymmetry is itself an empirical fact about the structure of the theory."}, {"id": "evolution-and-supersession", "title": "What Superseded What: From von Neumann's No-Go to Bell, GRW, Everett, and Decoherence", "markdown": "## What Superseded What: From von Neumann's No-Go to Bell, GRW, Everett, and Decoherence\n\nThe measurement problem has no settled solution, but it has a settled *graveyard*: a sequence of formal moves each of which closed one escape route and forced the next. Tracking what was actually superseded — as opposed to what merely fell out of fashion — is the only way to see why the live options in 2026 are still essentially the ones on the table in 1957.\n\n### 1932 → 1966: the impossibility proof that wasn't\n\nVon Neumann's *Grundlagen* [6] proved that no hidden-variable assignment $\\lambda \\mapsto v_\\lambda(A)$ can satisfy\n\n$$v_\\lambda(\\alpha A + \\beta B) = \\alpha\\, v_\\lambda(A) + \\beta\\, v_\\lambda(B)$$\n\nfor *all* self-adjoint $A,B$, commuting or not, while reproducing quantum expectation values upon averaging over $\\lambda$. The theorem itself is correct; what was wrong was the implicit claim that the additivity premise is forced on any hidden-variable theory. For non-commuting $A,B$ the operator $A+B$ refers to a *different* experimental procedure than either $A$ or $B$ alone — there is no a priori reason individual outcomes should add when the measurements cannot be performed jointly. Grete Hermann saw this in 1935 [11] and said so in print; the venue (a neo-Kantian philosophy series) and the era buried the result. Bell rediscovered the same flaw three decades later [12] and, crucially, exhibited a counterexample — Bohm's theory [7] — that violated the additivity assumption while reproducing all quantum predictions. The supersession here is total: the von Neumann no-go is no longer cited by anyone who has read either Hermann or Bell. What survives of the 1932 architecture is the Prozess 1 / Prozess 2 split, not the impossibility theorem.\n\n### 1952: existence as refutation\n\nBohm's two-paper construction [7] superseded the no-go in the strongest possible sense: by being. Once a deterministic, empirically equivalent completion existed, the question shifted from *can it be done* to *which choice of ontology is preferable*. Bohm's own framing — quantum potential $Q = -(\\hbar^2/2m)\\,\\nabla^2 R/R$ as a new physical field — has *not* aged uniformly well; the minimalist reading favoured by Bell, Dürr–Goldstein–Zanghì, and Goldstein after 1990 keeps only $\\psi$ and the particle configuration $Q_1,\\dots,Q_N$, with the guidance law\n\n$$\\frac{dQ_k}{dt} = \\frac{\\hbar}{m_k}\\,\\mathrm{Im}\\,\\frac{\\nabla_k \\psi}{\\psi}\\bigg|_{(Q_1,\\dots,Q_N)}.$$\n\nThe quantum-potential formulation is now best regarded as a bookkeeping device — convenient for visualizing tunneling and interference, ontologically dispensable.\n\n### 1957: cutting the cut\n\nEverett's relative-state formulation [18] removed Prozess 1 *as a separate axiom* by reading the universal $\\psi$ literally and identifying each measurement record with a branch of the post-interaction state. The supersession is real but partial: Everett eliminated the *collapse postulate* but inherited two new burdens — the preferred-basis problem (why pointer states?) and the probability problem (what does $|c_i|^2$ mean when every branch occurs?). DeWitt's 1970s \"many worlds\" reading, the 1990s Oxford program (Saunders, Wallace, Deutsch) attempting a decision-theoretic derivation of the Born rule, and the Zurek \"envariance\" argument are all attempts to discharge those debts. None has produced consensus that the Born rule emerges *from within* a no-collapse unitary theory without smuggling probability in via the choice of measure.\n\n### 1961: the consciousness clause\n\nWigner's friend essay [14] sharpened London \u0026 Bauer's [10] observation that the cut must terminate *somewhere* by placing it at consciousness. This was never a formal theory — there is no Hamiltonian, no dynamical equation, no prediction distinct from orthodox QM — and it has been quietly abandoned by working physicists. It survives as a pedagogical scenario (Frauchhiger–Renner 2018 is its modern descendant (verify)) rather than as a candidate ontology.\n\n### 1986: making Prozess 1 dynamical\n\nGhirardi–Rimini–Weber replaced the *ad hoc* collapse with a stochastic modification of the Schrödinger equation: each particle undergoes spontaneous localization at rate $\\lambda \\sim 10^{-16}\\,\\mathrm{s}^{-1}$ with width $\\sigma \\sim 10^{-7}\\,\\mathrm{m}$, giving an amplification factor $N\\lambda$ for $N$-particle systems that suppresses macroscopic superpositions on millisecond timescales. GRW supersedes the Copenhagen postulate by making it a *physical* law with testable consequences — narrowing the parameter window via cantilever, X-ray, and matter-wave experiments has been the principal experimental thread for forty years. Continuous Spontaneous Localization (Pearle 1989; Ghirardi–Pearle–Rimini 1990 (verify)) generalized GRW to identical particles. The 1986 theory remains *live*: it is empirically distinguishable from unitary QM, and current cold-atom and gravitational-wave-interferometer bounds have not closed the original parameter window.\n\n### 1970s–90s: decoherence as a separate question\n\nZeh (1970) and Zurek (1981–) (verify) shifted attention to the reduced density matrix $\\rho_S = \\mathrm{Tr}_E\\, |\\Psi\\rangle\\langle\\Psi|$ and showed that environmental interactions diagonalize it in a basis selected by the system–environment Hamiltonian (the pointer basis). This is genuine progress — it superseded a generation of preferred-basis hand-waving — but it does *not* supersede the outcome problem. Schlosshauer's RMP review [17] is unusually clear on this: decoherence solves what he calls the \"small\" problem (preferred basis, suppression of interference) and leaves the \"big\" problem (single outcome) untouched. Bell's \"Against Measurement\" [3] anticipated the confusion: \"FAPP\" — for all practical purposes — was sarcasm, not endorsement. A density matrix near-diagonal in the pointer basis is *not* a mixture of outcomes; it is an improper mixture, and reading it as a proper one is precisely the move under dispute.\n\n### 1992: typicality and the Born rule from within pilot-wave theory\n\nDürr, Goldstein, and Zanghì's \"Quantum Equilibrium and the Origin of Absolute Uncertainty\" (verify; not in the supplied corpus) reconstructed the empirical content of Bohmian mechanics on a non-probabilistic foundation. The $|\\psi|^2$ distribution is not a postulate but a *typicality* result: the overwhelming majority — under the equivariant measure on initial configurations — of universes governed by the guidance law exhibit empirical frequencies matching $|\\psi|^2$. This supersedes Bohm's original 1952 appeal to a postulated \"quantum equilibrium\" and parallels Boltzmann's statistical-mechanical derivation of thermodynamics. It also clarifies why pilot-wave non-locality cannot be exploited for signaling: signaling would require *systematic* departure from equilibrium, which is atypical.\n\n### What remains live in 2026\n\n| Programme | Status | What it superseded | What it owes |\n|---|---|---|---|\n| Pilot-wave / Bohmian | live | von Neumann no-go [6, 12]; ad hoc collapse | relativistic / QFT extension |\n| GRW \u0026 CSL | live | postulated Prozess 1 | empirical bounds on $\\lambda,\\sigma$ |\n| Everettian (Oxford) | live | the cut itself | probability, preferred basis |\n| Decoherence (as foundation) | superseded as solution; retained as kinematics | naive preferred-basis stories | the outcome problem |\n| Wigner consciousness | historical | nothing formal | a dynamical law |\n| Copenhagen (orthodox) | residual; still the working dialect of labs | — | every foundational question it brackets |\n| von Neumann no-go | superseded | — | — |\n\nThe honest summary is that the formal landscape narrowed by 1990 to three live programmes — Bohm, GRW/CSL, Everett — plus decoherence as a *tool* applicable inside any of them. Everything else has either been folded into one of these (London–Bauer's moveable cut is preserved in Bohm's effective collapse, Wigner's clause vestigial in observer-centric Everettian readings) or quietly retired."}, {"id": "ambiguities-and-conflations", "title": "Validity Audit: Five Conflations the Literature Still Repeats", "markdown": "## Validity Audit: Five Conflations the Literature Still Repeats\n\nFive claims circulate in the modern measurement-problem literature with the qualifications that warranted them silently stripped. For each: the equation, the assumption dropped, and the regime in which the claim survives.\n\n### 1. \"Decoherence solves the measurement problem.\"\n\nThe mathematics. For a system $S$ coupled to environment $E$ via $|n\\rangle_S|E_0\\rangle \\to |n\\rangle_S|E_n\\rangle$ with $\\langle E_m \\mid E_n\\rangle \\to \\delta_{mn}$, the reduced state is\n\n$$\\rho_S(t) = \\mathrm{Tr}_E\\!\\left[|\\Psi_{SE}(t)\\rangle\\langle\\Psi_{SE}(t)|\\right] \\longrightarrow \\sum_n |c_n|^2 \\, |n\\rangle\\langle n|.$$\n\nOff-diagonal coherences decay on $\\tau_D \\ll \\tau_{\\mathrm{relax}}$; the diagonal basis is fixed by the interaction Hamiltonian (Zurek's einselection).\n\nThe assumption dropped. $\\rho_S$ is an *improper* mixture: the global $|\\Psi_{SE}\\rangle$ remains pure. No partial trace converts a coherent global superposition into a statistical ensemble of definite outcomes; that step requires either an interpretive postulate (Bohmian configuration, Everettian branching) or extra dynamics (GRW). Bell [3] said it plainly: a \"for all practical purposes\" diagonalization is not an answer to *what happens*.\n\nRegime of validity. Decoherence solves the **small** problem (preferred-basis selection): why pointer states are quasi-classical and macro-interference is suppressed. It does not solve the **big** problem (a single outcome). Schlosshauer's RMP [17] partitions the two explicitly; the textbook conflation collapses them.\n\n### 2. \"Von Neumann proved hidden variables are impossible.\"\n\nThe theorem. *Grundlagen* [6], Ch. IV §2, requires any state $\\phi$ on the algebra of observables to satisfy\n\n$$\\phi(\\hat A + \\hat B) = \\phi(\\hat A) + \\phi(\\hat B) \\quad \\text{for all self-adjoint } \\hat A, \\hat B,$$\n\nincluding $[\\hat A,\\hat B]\\neq 0$. No dispersion-free $\\phi$ then exists.\n\nThe assumption dropped. Linearity of expectations is a *theorem* for quantum states (a consequence of $\\phi(\\cdot) = \\mathrm{Tr}(\\rho \\,\\cdot)$), not a constraint that hidden-variable states must respect. The eigenvalues of $\\hat A + \\hat B$ for non-commuting operators are not sums of separate eigenvalues. Take $\\hat A = \\sigma_x$, $\\hat B = \\sigma_y$: each has spectrum $\\{\\pm 1\\}$, but $(\\sigma_x + \\sigma_y)/\\sqrt{2}$ has spectrum $\\{\\pm 1\\}$, not $\\{\\pm\\sqrt{2}\\}$. A consistent hidden-variable assignment may give $v(\\sigma_x), v(\\sigma_y) \\in \\{\\pm 1\\}$ without $v(\\sigma_x + \\sigma_y) = v(\\sigma_x) + v(\\sigma_y)$.\n\nHermann saw this in 1935 [11]; Bell rederived and publicized it in 1966 [12]; Mermin's review [13] formally restores priority. Bohmian mechanics [7] is the explicit counterexample.\n\nRegime of validity. The theorem holds where additivity is physically motivated — on *ensemble* expectation values reproducing QM. As a no-go on individual hidden-variable assignments it has no force. The substantive constraints are Kochen–Specker (contextuality) and Bell (locality), neither of which appears in [6].\n\n### 3. \"Pilot-wave non-locality contradicts relativity.\"\n\nThe guidance law. For $N$ particles with $\\psi(\\mathbf q_1,\\ldots,\\mathbf q_N, t)$ on configuration space,\n\n$$\\frac{d\\mathbf q_k}{dt} = \\frac{\\hbar}{m_k}\\,\\mathrm{Im}\\,\\frac{\\nabla_k \\psi}{\\psi}\\bigg|_{\\mathbf q=\\mathbf Q(t)},$$\n\nso the velocity of particle $k$ depends instantaneously on the positions of all entangled partners.\n\nThe assumption dropped. Dynamical non-locality does not entail signaling. For the equivariant measure $\\rho = |\\psi|^2$ (quantum equilibrium, derivable as typicality on the universal configuration), every sub-ensemble's statistics reproduce QM exactly; observable predictions are Lorentz-invariant. The Lorentz-violating substructure is operationally inaccessible.\n\nMore importantly, Bell's theorem applies to *any* empirically adequate single-world theory. Collapse interpretations bury non-locality inside Prozess 1; pilot-wave displays it. The complaint that pilot-wave is uniquely non-local identifies a property all such theories share.\n\nRegime of validity. The claim survives only in the sharper form: *no manifestly Lorentz-covariant pilot-wave field theory has yet been constructed*. Relativistic pilot-wave QFT (Bohm–Hiley [15], later Dürr et al.) requires a preferred foliation or multi-time $\\psi$; neither has reached the empirical maturity of standard QFT. That is treated in §7.\n\n### 4. \"Bohmian mechanics = de Broglie's pilot wave.\"\n\nTwo distinct programs. De Broglie's 1927 Solvay report [4] presented the *reduced* pilot wave: particle position guided by $\\psi$. His ambition — before and after Solvay — was the **théorie de la double solution** [9]: a *nonlinear* wave equation admitting a singular soliton-like solution $u$ (the particle as localized field concentration) alongside a regular statistical $\\psi$, with a phase-matching $u \\sim C\\psi$ in the appropriate regime. The reduced guidance equation was the statistical *limit* of the double-solution dynamics, not the fundamental ontology.\n\nBohm 1952 [7] takes only linear Schrödinger $\\psi$ plus particle position $\\mathbf Q$, plus quantum potential $Q$. No nonlinear $u$-wave: particles are autonomous point beables, not singularities of a self-consistent field.\n\nThe assumption dropped. Treating de Broglie 1927 = Bohm 1952 erases the nonlinear-field program de Broglie and Vigier pursued through the 1950s–60s. Bacciagaluppi \u0026 Valentini [5] reconstruct the Solvay version; [9] documents the continuation.\n\nRegime of validity. As empirical theories the reduced 1927 pilot wave and 1952 Bohmian mechanics make the same predictions; \"de Broglie–Bohm\" (Bell's preferred phrase) is then accurate. As *interpretive programs* they are distinct. The double-solution program remains formally incomplete.\n\n### 5. \"The quantum potential is a real force.\"\n\nThe expression. Writing $\\psi = R\\,e^{iS/\\hbar}$, the real part of the Schrödinger equation gives\n\n$$\\frac{\\partial S}{\\partial t} + \\frac{(\\nabla S)^2}{2m} + V + Q = 0, \\qquad Q = -\\frac{\\hbar^2}{2m}\\,\\frac{\\nabla^2 R}{R},$$\n\nand a Newton-like second-order law $m\\ddot{\\mathbf q} = -\\nabla(V + Q)$ follows along the trajectory.\n\nThe assumptions silently dropped. Three properties distinguish $Q$ from any Newtonian field. (i) **Form, not magnitude**: $Q$ is invariant under $\\psi \\to \\lambda\\psi$ for $\\lambda \\in \\mathbb{C}^\\times$; its strength depends on the curvature of $R$, not on the amplitude. A wave packet of arbitrarily small $|\\psi|$ can exert finite \"force.\" (ii) **No independent source**: $\\psi$ obeys its own linear equation; $Q$ is a functional of $\\psi$, not a field with its own dynamics or stress–energy tensor. (iii) **No energy–momentum carrier**: $Q$ enters the configuration's energy balance only as bookkeeping; there is no Noether current associated with it.\n\nThe minimalist position (Bell [3], Dürr–Goldstein–Zanghì, Goldstein) accordingly drops $Q$ entirely, retains only the first-order guidance equation, and treats $Q$ as a derived artifact of the polar decomposition. Bohm–Hiley [15] retained $Q$ but reinterpreted it as carrying \"active information,\" explicitly *not* Newtonian force.\n\nRegime of validity. $Q$ is exact and useful as the Hamilton–Jacobi correction term in the polar representation, and as a heuristic for non-classical phenomena (tunneling residence times, the two-slit trajectories). It is *not* a field with sources, energy, or autonomous existence. Reading $Q$ as a Newtonian force imports an ontology Bohm himself recognized as nonstandard — and it is the reading most responsible for pilot-wave theory's spooky reputation in introductory accounts."}, {"id": "frontier-and-open-problems", "title": "The Frontier: Relativistic Pilot Waves, Quantum Field Theory, and the Shifty Split Today", "markdown": "## The Frontier: Relativistic Pilot Waves, Quantum Field Theory, and the Shifty Split Today\n\nThe measurement problem in 2026 is not where Bell left it in 1990 [3]. Four fronts have sharpened: a Lorentz-covariant pilot-wave dynamics, its embedding in quantum field theory, the experimental noose around dynamical collapse, and the second-generation Wigner's-friend theorems. None is closed, and the residual options are now narrow enough that each deserves an honest accounting.\n\n### Relativistic pilot waves and the preferred foliation\n\nNon-relativistic guidance,\n$$\\dot{\\mathbf{q}}_k = \\frac{\\hbar}{m_k}\\,\\mathrm{Im}\\,\\frac{\\nabla_k\\psi}{\\psi}\\bigg|_{(\\mathbf{q}_1,\\ldots,\\mathbf{q}_N)},$$\nis manifestly non-local: $\\dot{\\mathbf{q}}_k$ at time $t$ depends on the simultaneous positions of all other particles. Bell's theorem guarantees this is structural, not a flaw to be polished away. The frontier question is whether the simultaneity can be made Lorentz invariant. Dürr, Goldstein, Tumulka and Zanghì proposed equipping spacetime with a *covariant foliation* $\\mathcal{F}$ — a Lorentz-invariant family of spacelike leaves — along which a Bohm–Dirac multi-time velocity is defined, and showed that if $\\mathcal{F}$ is itself determined by a Lorentz-covariant law (for instance, derived from $\\psi$ via a covariant functional), the theory is fully Lorentz invariant even though no inertial frame is preferred ([Dürr et al., 2014](https://arxiv.org/abs/1307.1714)). The price is a foliation that is empirically inaccessible: quantum equilibrium $\\rho=|\\psi|^2$ blocks any experiment from revealing which leaf is \"now.\" This is a Lorentz invariance without Lorentz symmetry of the beables — a position that is consistent but bites a real bullet, and is rejected by adherents of the \"block universe\" reading of relativity. Hypersurface Bohm–Dirac (Berndl–Dürr–Goldstein–Zanghì, 1996) and the Tumulka 2007 fully covariant construction remain the cleanest existence proofs.\n\n### Bohmian quantum field theory\n\nThere are two live strategies. (i) *Field beables*: ψ guides a configuration of bosonic field values on a spatial slice, in the spirit of Bohm's own 1952 treatment of the electromagnetic field [7] and developed by Struyve and Westman for the standard model gauge sector. Fermions resist this construction (no positive-definite local density for Dirac spinors), so field-beable models typically keep bosons as fields and treat fermions implicitly via charge currents. (ii) *Particle beables on a stochastic lattice*: Bell's 1984 model promoted particle number at each lattice site to the beable and replaced unitary creation/annihilation by a Markov jump process whose rates are fixed by $\\psi$. The Dürr–Goldstein–Tumulka–Zanghì \"Bell-type QFT\" generalizes Bell's construction to the continuum and to any QFT with a positive interaction Hamiltonian density, producing trajectories that include particle creation and annihilation as actual stochastic events ([Dürr et al., 2005](https://arxiv.org/abs/quant-ph/0407116)). Neither programme has produced renormalised interacting predictions matching the Standard Model; both are existence proofs that the *measurement* problem in QFT can be addressed without invoking observers, not yet a competitor to lattice QCD. Bohm and Hiley's \"pre-space\" / implicate-order programme [15] sits orthogonally — algebraic, suggestive, and so far without a calculational core.\n\n### Quantum non-equilibrium and the empirical horizon\n\nAntony Valentini's programme treats $\\rho=|\\psi|^2$ as a contingent equilibrium, analogous to thermal equilibrium, reached by an H-theorem-like relaxation in pilot-wave dynamics. If non-equilibrium $\\rho\\neq|\\psi|^2$ ever held — say, in the very early universe — it would in principle permit superluminal signalling and statistical anomalies. Valentini and Colin have argued for possible signatures in the CMB low-multipole power spectrum; the bounds are consistent with equilibrium but the parameter space is not closed ([Valentini, 2010](https://arxiv.org/abs/0805.0163)). This is the only proposal that turns the foundational status of $|\\psi|^2$ into an empirical question rather than a postulate.\n\n### Dynamical collapse on the rack\n\nGRW and its mass-proportional descendant CSL turn Born's Prozess 1 into a stochastic modification of the Schrödinger equation, governed by two parameters: a localization rate $\\lambda$ and a correlation length $r_C$. CSL predicts spontaneous photon emission from charged particles — a free side-effect of the noise — and the X-ray window 10–100 keV is exquisitely sensitive. The IGEX, Majorana and underground Gran Sasso runs analysed by Piscicchia, Donadi, Curceanu, Bassi and collaborators ([Piscicchia et al., PRL 132, 250203, 2024](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.132.250203)) now exclude the originally proposed GRW value of $\\lambda$ for mass-proportional CSL across most of the cosmologically motivated $r_C$ range, while leaving Adler's enhanced rate $\\lambda\\sim 10^{-8\\pm 2}\\,\\mathrm{s}^{-1}$ at the edge of viability.\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eCSL parameter space with current bounds\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003cline x1=\"90\" y1=\"350\" x2=\"680\" y2=\"350\"/\u003e\u003cline x1=\"90\" y1=\"350\" x2=\"90\" y2=\"40\"/\u003e\u003c/g\u003e\u003cg fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e\u003ctext x=\"370\" y=\"385\" text-anchor=\"middle\"\u003elog₁₀(r_C / m)\u003c/text\u003e\u003ctext x=\"30\" y=\"195\" text-anchor=\"middle\" transform=\"rotate(-90 30 195)\"\u003elog₁₀(λ / s⁻¹)\u003c/text\u003e\u003ctext x=\"90\" y=\"370\" text-anchor=\"middle\"\u003e−8\u003c/text\u003e\u003ctext x=\"220\" y=\"370\" text-anchor=\"middle\"\u003e−7\u003c/text\u003e\u003ctext x=\"350\" y=\"370\" text-anchor=\"middle\"\u003e−6\u003c/text\u003e\u003ctext x=\"480\" y=\"370\" text-anchor=\"middle\"\u003e−5\u003c/text\u003e\u003ctext x=\"610\" y=\"370\" text-anchor=\"middle\"\u003e−4\u003c/text\u003e\u003ctext x=\"75\" y=\"354\" text-anchor=\"end\"\u003e−18\u003c/text\u003e\u003ctext x=\"75\" y=\"280\" text-anchor=\"end\"\u003e−14\u003c/text\u003e\u003ctext x=\"75\" y=\"206\" text-anchor=\"end\"\u003e−10\u003c/text\u003e\u003ctext x=\"75\" y=\"132\" text-anchor=\"end\"\u003e−6\u003c/text\u003e\u003ctext x=\"75\" y=\"58\" text-anchor=\"end\"\u003e−2\u003c/text\u003e\u003c/g\u003e\u003cpath d=\"M 90 95 C 200 110, 320 140, 680 200 L 680 40 L 90 40 Z\" fill=\"#ff7a90\" fill-opacity=\"0.18\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"430\" y=\"80\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003eExcluded: X-ray emission (Piscicchia et al. 2024)\u003c/text\u003e\u003cpath d=\"M 90 320 C 250 305, 420 285, 680 250\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\" fill=\"none\"/\u003e\u003ctext x=\"430\" y=\"310\" fill=\"#ffb86b\" font-size=\"13\" font-family=\"serif\"\u003eTheoretical lower bound (macro-amplification)\u003c/text\u003e\u003ccircle cx=\"220\" cy=\"317\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"232\" y=\"321\" fill=\"#7aa2ff\" font-size=\"13\" font-family=\"serif\"\u003eGRW 1986: (r_C,λ)=(10⁻⁷ m, 10⁻¹⁶ s⁻¹)\u003c/text\u003e\u003ccircle cx=\"220\" cy=\"169\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"232\" y=\"173\" fill=\"#7ee0a3\" font-size=\"13\" font-family=\"serif\"\u003eAdler 2007: λ ~ 10⁻⁸ s⁻¹\u003c/text\u003e\u003ctext x=\"100\" y=\"55\" fill=\"#e8e6e1\" font-size=\"12\" font-family=\"serif\"\u003eexcluded region (schematic; mass-proportional CSL)\u003c/text\u003e\u003c/svg\u003e\n*Figure: Schematic CSL parameter plane. The 2024 underground X-ray bounds push the upper exclusion boundary down through Adler's enhanced rate; the GRW point sits in a still-allowed region but produces no testable amplification on laboratory timescales. The viable strip is now a few decades wide.*\n\nThe interferometric front (Arndt-group macromolecules; Vinante-group magnetometry) and the non-interferometric one (X-ray, phonon excess in cryogenic detectors) now bracket the parameter space from opposite sides. A full closure is plausible within a decade.\n\n### Frauchiger–Renner and the limits of single-world consistency\n\nFrauchiger and Renner (2018) constructed an extended Wigner's-friend scenario in which the assumptions (Q) unitary quantum mechanics applies to agents, (C) different agents' inferences are consistent, and (S) a measurement has a single outcome cannot all hold. Brukner's \"no-go for observer-independent facts\" (2018) is a sibling. Bohmian mechanics evades the theorem by *denying* Q applied naively to the friend's record — the friend's beables have definite values that Wigner's superposed description fails to capture — while Everett denies (S) and QBism denies that \"outcome\" is observer-independent. A May 2025 reassessment argues the theorem's force is weaker than usually claimed, turning on a specific composition of conditional statements rather than universal validity of QM ([Lazarovici \u0026 Hubert, *Entropy* 27, 563, 2025](https://www.mdpi.com/1099-4300/27/6/563)). The dust has not settled, but the moral is clear: the cut Bell called \"shifty\" [3] is now formally pinned — every consistent interpretation must violate one specific premise of the Frauchiger–Renner inferential chain, and which one it sacrifices is its metaphysical signature.\n\n### What an honest physicist owes the problem in 2026\n\nThree things. First, do not cite von Neumann's no-go [6] as if Bell [12] and Mermin [13] had not happened; the existence of pilot-wave theory [4, 7] settles the formal question. Second, do not claim decoherence solves anything beyond the preferred-basis problem [17] — the \"big\" measurement problem requires a beable, a branching, or a collapse, and the choice is not free. Third, treat the Lorentz-covariant foliation, the Bell-type QFT, the CSL parameter strip, and the Wigner-friend chain as the genuine open frontier: each is a falsifiable or formally answerable question, not a matter of taste. The shifty split survives in 2026 not because it is unsolvable, but because the community has not yet decided which of three roughly viable resolutions — Bohmian beables, Everettian branching, or dynamical collapse — to take seriously enough to test to destruction."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have been asked to render judgment, not to balance views. Here it is.\n\n### (a) What I defend with my reputation\n\nThe measurement problem is real, unsolved, and not a pseudo-problem of philosophical taste. Unitary evolution applied to a closed system containing apparatus + observer cannot, by linearity alone, yield a single pointer reading; this is not a subtle claim, it is one line of algebra and has been since von Neumann [6]. Any framework that denies this is either (i) silently adding a collapse postulate, (ii) silently adding branches, or (iii) silently adding hidden variables. There is no fourth option, and \"decoherence\" is none of the three — Adler and Schlosshauer are correct and the textbook tradition is wrong [9, 20].\n\nI will also defend the historical record: the pilot-wave ontology is de Broglie's, demonstrated at Solvay 1927 [4]; Bohm's contribution [7] is the measurement theory and the courage to publish it, not the basic picture. Bell wrote \"de Broglie–Bohm\" deliberately and we should keep doing so. And von Neumann's \"impossibility proof\" was killed by Hermann in 1935 [11], not by Bell in 1966 [12] — Bell himself said so. The three-decade suppression of Hermann is a sociological failure of our field, not a technical one.\n\n### (b) What is shakier than the literature admits\n\nThree things, named precisely.\n\nFirst, **quantum equilibrium**. The Born rule in pilot-wave theory is derived [\\*not\\* postulated\\*] from $\\rho = |\\psi|^2$ as an attractor under typicality measures (Dürr–Goldstein–Zanghì 1992 [5]). The assumption that the universe began in or rapidly approached this measure is a cosmological-initial-condition claim of the same epistemic status as the past hypothesis in statistical mechanics. It is not a theorem about generic initial data; the relaxation dynamics on coarse-grained scales is delicate and the absolute-uncertainty argument has soft edges in the non-equilibrium regime that Valentini has long flagged but the community has filed away.\n\nSecond, **the Bohmian field-theory program**. The Dürr–Goldstein–Tumulka–Zanghì \"Bell-type\" QFT picks a preferred foliation [8]; the Struyve–Westman bosonic-only ontology drops fermion beables. Neither is empirically equivalent to interacting QFT *as a theorem*; both are model constructions with finite-rank cutoffs. The claim \"pilot-wave extends straightforwardly to QFT\" is folklore. It extends to *toy* QFT.\n\nThird, **decoherence as basis selection**. Pointer-basis arguments via einselection assume a system/environment factorization. That factorization is *chosen*, not derived; without an external criterion (a Bohmian configuration, a GRW hit-rate, a Wallace-style decision-theoretic agent) there is no preferred basis. Zurek's program is beautiful and partial.\n\n### (c) The three open questions I would work on, ranked\n\n1. **Relativistic guidance without a preferred foliation.** If Tumulka's hypersurface-Bohm–Dirac [13] or a multi-time pilot-wave can be made fully covariant *without* extra structure, the strongest objection to de Broglie–Bohm dies. This is the only place I see a decisive technical advance possible.\n2. **Experimental access to quantum non-equilibrium.** Valentini's prediction that primordial $\\rho \\neq |\\psi|^2$ relics could survive in the CMB or in relic neutrinos is testable in principle; the analysis chain is underdeveloped and the bounds are weak.\n3. **Operational distinguishability of GRW vs decoherent histories vs Bohm at mesoscopic mass.** The interferometry frontier (LIGO-scale mirrors, levitated nanospheres) is closing in on the GRW window; the analysis frameworks still mix incompatible assumptions about what \"collapse\" means.\n\n### Reading path\n\n1. Bell, *Speakable and Unspeakable* — especially \"Against Measurement\" and \"On the Impossible Pilot Wave\" [12]. Start here; nothing else is calibrated until you have.\n2. von Neumann, *Mathematische Grundlagen* Ch. VI [6]. Read Prozess 1/Prozess 2 in the original; the textbook digest distorts it.\n3. London \u0026 Bauer 1939 [10]. The cleanest statement of the moveable cut, almost never cited in English-language QM courses.\n4. Bohm 1952, Parts I \u0026 II [7]. The measurement theory, not just the trajectories — Part II is the half people skip.\n5. Dürr, Goldstein, Zanghì, \"Quantum Equilibrium and the Origin of Absolute Uncertainty\" 1992 [5]. The proof that Born statistics are emergent, not postulated; the modern foundation of the program."}], "references": [{"n": 1, "title": "Quantisierung als Eigenwertproblem (Erste Mitteilung)", "authors": ["Erwin Schrödinger"], "year": 1926, "venue": "Annalen der Physik 384(4), 361–376", "url": "https://doi.org/10.1002/andp.19263840404", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Zur Quantenmechanik der Stoßvorgänge", "authors": ["Max Born"], "year": 1926, "venue": "Zeitschrift für Physik 37, 863–867", "url": "https://doi.org/10.1007/BF01397477", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Against 'Measurement'", "authors": ["John S. Bell"], "year": 1990, "venue": "Physics World 3(8), 33–40 (and in Sixty-Two Years of Uncertainty, ed. Miller, Plenum 1990)", "url": "https://physicsworld.com/a/against-measurement/", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "La nouvelle dynamique des quanta (Rapport au cinquième Conseil de Physique Solvay, Bruxelles, 1927)", "authors": ["Louis de Broglie"], "year": 1928, "venue": "Électrons et photons: Rapports et discussions du cinquième Conseil de physique, Gauthier-Villars, Paris", "url": "https://www.solvayinstitutes.be/en/about/history/the-solvay-councils", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Quantum Theory at the Crossroads: Reconsidering the 1927 Solvay Conference", "authors": ["Guido Bacciagaluppi", "Antony Valentini"], "year": 2009, "venue": "Cambridge University Press", "url": "https://arxiv.org/abs/quant-ph/0609184", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Mathematische Grundlagen der Quantenmechanik", "authors": ["John von Neumann"], "year": 1932, "venue": "Springer, Berlin (English: Princeton UP, 1955)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "A Suggested Interpretation of the Quantum Theory in Terms of 'Hidden' Variables. I \u0026 II", "authors": ["David Bohm"], "year": 1952, "venue": "Physical Review 85, 166–179 and 180–193", "url": "https://doi.org/10.1103/PhysRev.85.166", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Wave-particle duality (Nobel Lecture, December 12, 1929)", "authors": ["Louis de Broglie"], "year": 1929, "venue": "Nobel Foundation, nobelprize.org", "url": "https://www.nobelprize.org/prizes/physics/1929/broglie/lecture/", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Une tentative d'interprétation causale et non linéaire de la mécanique ondulatoire: la théorie de la double solution", "authors": ["Louis de Broglie"], "year": 1956, "venue": "Gauthier-Villars, Paris", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "La théorie 5", "url": "https://doi.org/10.1103/RevModPhys.76.1267", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "'Relative State' Formulation of Quantum Mechanics", "authors": ["Hugh Everett III"], "year": 1957, "venue": "Reviews of Modern Physics 29, 454–462", "url": "https://doi.org/10.1103/RevModPhys.29.454", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Can Quantum-Mechanical Description of Physical Reality Be Considered Complete?", "authors": ["A. Einstein", "B. Podolsky", "N. Rosen"], "year": 1935, "venue": "Physical Review 47, 777–780", "url": "https://doi.org/10.1103/PhysRev.47.777", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Philosophic Foundations of Quantum Mechanics", "authors": ["Hans Reichenbach"], "year": 1944, "venue": "University of California Press, Berkeley", "url": "", "cited_by": null, "bucket": "archive"}], "nsec": 8, "nref": 20, "teaser": "A historical, mathematical, and ontological audit of quantum measurement from Born to Bohmian mechanics"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* ---- special blocks, rendered BEFORE the prose (as in the app) ---- */
  var hasTL=D.timeline&&D.timeline.length, hasNG=D.neglected&&D.neglected.length, hasCF=D.conflations&&D.conflations.length;
  var pre='';
  if(hasTL){
    pre+='<section class="block" id="blk-timeline"><h3>Origins timeline</h3><div class="lead">How the field actually arrived — scroll through it, with the paper that marks each turn.</div>'+
      '<div class="tslider" id="tslider">'+
      D.timeline.map(function(t){var ref=(t.ref?' <a class="cite" href="#ref-'+(+t.ref||0)+'">['+esc(t.ref)+']</a>':'');
        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+
      '</div><div class="thint">drag or scroll through time →</div></section>';
  }
  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+
      (D.credit_audit?'<div class="callout" style="margin-top:22px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>':'')+'</section>';
  }
  var langHtml='';
  if(hasCF){
    langHtml='<section class="block" id="blk-language"><h3>Watch your language</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></section>';
  }
  /* prose sections */
  var sectionsHtml=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* references (kept at the end) */
  var refsHtml='';

    refsHtml='<div class="block" id="blk-refs"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);

      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
