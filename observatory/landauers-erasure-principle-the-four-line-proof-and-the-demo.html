n D. Norton", "work": "Studies in History and Philosophy of Modern Physics 42, 184 — 'Waiting for Landauer'", "kind": "theory", "ref": 14}, {"year": 2012, "event": "First single-particle 'verification': a colloidal bead in a double-well shows mean dissipation approaching kT ln 2 — widely reported as confirmation though it tests a Sagawa–Ueda-style protocol", "who": "A. Bérut, A. Arakelyan, A. Petrosyan, S. Ciliberto, R. Dillenschneider, E. Lutz", "work": "Nature 483, 187", "kind": "observation", "ref": 23}, {"year": 2014, "event": "Rigorous finite-bath equality replacing the asymptotic inequality: explicit finite-size corrections derived in quantum statistical mechanics", "who": "David Reeb \u0026 Michael M. Wolf", "work": "New Journal of Physics 16, 103011 — 'An improved Landauer principle with finite-size corrections'", "kind": "formalization", "ref": 33}], "neglected": [{"name": "Marian von Smoluchowski", "role": "Gave the first physical refutation of automatic Maxwell demons in 1912 — seventeen years before Szilard. His argument (the demon-device must itself fluctuate at the same temperature) is logically anterior to any information-theoretic move and undermines the 'information is the only exorcism' framing that the Landauer–Bennett school endorses. Routinely skipped in textbook genealogies that leap from Maxwell straight to Szilard.", "evidence": "Acknowledged as 'first' by Bennett's own 1988 historiography [ref 79] and by Earman \u0026 Norton Part I [ref 81]; the lecture is reprinted in Leff \u0026 Rex's anthology [ref 84].", "ref": 2}, {"name": "Oliver Penrose", "role": "His 1970 monograph independently developed phase-space contraction and computational-state reduction arguments closely parallel to Landauer's, with a more careful statistical-mechanical foundation. Cited only in passing in the SEP entry and in Bennett 1988; absent from most physics references.", "evidence": "Maroney's SEP entry [ref 85] groups 'Landauer (1961), Penrose (1970), and Bennett (1982)' as the three independent foundational treatments; Bennett 1988 [ref 79] acknowledges the precedence.", "ref": 9}, {"name": "John von Neumann", "role": "Credited orally (in the Illinois lectures) with the very first 'kT ln 2 per elementary information act' estimate, twelve years before Landauer. But the attribution is folkloric: the lectures were not published until Burks's 1966 transcription, von Neumann's bound was for processing not erasure, and Landauer himself was careful not to claim it as a derivation. The 'von Neumann–Landauer bound' phrasing that occasionally appears in the engineering literature is a back-projection.", "evidence": "Burks's posthumous edition [ref 74] is the only primary source for the lecture content; Bennett 1988 [ref 79] flags this as 'a bound stated without proof' and notes the Szilard/Brillouin tradition charged the cost to measurement, not erasure.", "ref": 6}, {"name": "Léon Brillouin", "role": "His 1956 'negentropy of information' framework was the dominant pre-Landauer formulation; it locates the cost at measurement, not erasure. The modern habit of treating Brillouin and Landauer as 'two ways of saying the same thing' is wrong — they make different physical claims about which step in the demon's cycle is dissipative, and recent work has shown Brillouin's bound is independently sound and complementary, not redundant.", "evidence": "See [ref 86] (Maruyama-style disentangling) explicitly arguing the two principles are distinct; [ref 75] is the original.", "ref": 7}, {"name": "John Earman, John D. Norton, Orly Shenker, Meir Hemmo", "role": "The most serious philosophical critics of the standard exorcism narrative. They argue (i) Landauer's derivation assumes what it sets out to prove; (ii) the identification of Shannon entropy of the memory state with thermodynamic entropy is unjustified outside equilibrium; (iii) the Bennett–Landauer story is a sociological consensus, not a theorem. Their work is universally cited in the philosophy literature and almost never in the physics literature.", "evidence": "Earman \u0026 Norton Parts I \u0026 II [ref 81]; Norton 'Waiting for Landauer' [ref 82]; Hemmo \u0026 Shenker 2012 monograph [ref 87].", "ref": 32}], "conflations": [{"claim": "Landauer's principle says computation costs kT ln 2 per bit", "clarification": "It says erasure (or any logically irreversible operation) of a bit, when the memory is in equilibrium with a single bath at temperature T and the protocol is quasi-static, costs at least kT ln 2 of heat. Reversible computation (Bennett 1973) costs nothing in this idealised limit. Conflating 'computation' with 'erasure' is the single most common abuse of the principle."}, {"claim": "Landauer's principle is Brillouin's negentropy principle restated", "clarification": "They locate the cost at different steps of the demon's cycle: Brillouin at measurement, Landauer at erasure. In a full Maxwell-demon cycle one of the two must be operative for the Second Law to hold, but they are not equivalent and they make distinct predictions for partial cycles. Recent work [ref 86] argues both are independently valid and complementary."}, {"claim": "The Bérut et al. 2012 colloidal experiment 'verified' Landauer's 1961 bound", "clarification": "It measured the mean dissipated work in an erasure protocol on a Brownian bit and showed it asymptoted to kT ln 2 from above as the protocol became quasi-static — exactly what the Sagawa–Ueda generalised Jarzynski relation predicts. It does not test, and cannot test, Landauer's bound as an inequality independent of fluctuation theorems."}, {"claim": "Shannon (information) entropy = Boltzmann/Gibbs (thermodynamic) entropy", "clarification": "They have the same functional form (−Σ p log p) but different referents. The identification is automatic only when the memory's macrostates are in canonical equilibrium and the probabilities are objective phase-space measures. Earman \u0026 Norton, and Shenker \u0026 Hemmo, argue that the standard proof of Landauer's principle smuggles this identification in as a premise."}, {"claim": "Logical irreversibility implies thermodynamic irreversibility", "clarification": "Only if the logical states are realised by macroscopically distinguishable phase-space regions of fixed volume, the device is in contact with a single equilibrium bath, and the protocol is quasi-static. Strip any of these and the implication fails. Many 'derivations' of the principle silently assume the conclusion via this implication."}, {"claim": "The bound is a universal lower limit on the energy cost of any 'observation' or 'irreversible' process", "clarification": "It is a lower limit, in a single-bath equilibrium setting, on the heat dissipated when a bit of information about an unknown state is destroyed. It says nothing about quantum measurement of pure states, multi-bath setups (where you can do work against a temperature gradient), or processes where the bit's prior distribution is non-uniform — in which the bound becomes kT·H(p), not kT ln 2."}], "sections": [{"id": "why-this-mattered", "title": "1. Why This Mattered: Maxwell's Demon, Szilard's Engine, and the Long Road to 1961", "markdown": "## 1. Why This Mattered: Maxwell's Demon, Szilard's Engine, and the Long Road to 1961\n\nThe line \"Landauer 1961 erased Maxwell's demon\" is a textbook compression of nearly a century of contested bookkeeping. Five distinct claims about *where* the thermodynamic cost of intelligence sits — observation, measurement, computation, memory, erasure — were made by five different physicists, each correcting the previous one, before Landauer's four-line argument finally pinned the cost to logical irreversibility. Recovering that genealogy is not antiquarianism: each contributor was right about something specific and wrong about something else, and the modern \"information is physical\" slogan glosses over disagreements that are still live.\n\n### Maxwell (1867): the puzzle, not a principle\n\nMaxwell's \"demon\" is a casual aside in a private letter to P. G. Tait on 11 December 1867, written to explain the statistical character of the Second Law — never published as a research paper, and never named \"demon\" by Maxwell himself (Thomson coined that label in 1874). The being is \"very observant and neat-fingered,\" operates a frictionless slide between two gas chambers, and lets fast molecules pass one way and slow ones the other. The point Maxwell drew was epistemic: the Second Law is a statistical truth, not a mechanical one, and is \"founded on the assumption that we cannot get hold of individual molecules\" [1]. Maxwell offered no exorcism because he did not see the demon as a paradox needing one. He saw it as evidence that thermodynamic irreversibility lives in our coarse-graining.\n\n### Smoluchowski (1912): the first mechanical exorcism\n\nThe leap from Maxwell to Szilard, which is the standard textbook genealogy, skips the most important step. Marian von Smoluchowski's Münster lecture *Experimentell nachweisbare, der üblichen Thermodynamik widersprechende Molekularphänomene* — delivered in 1912, published in expanded form 1914 in his *Vorträge über die kinetische Theorie der Materie und Elektrizität* — gave the first physical proof that *automatic* demons cannot work [2]. A spring-loaded trapdoor placed between two gas chambers, light enough to flip on single-molecule impact, will not rectify the flux: it is itself a thermodynamic system at the same temperature $T$, and its thermal fluctuations randomise its open/closed history precisely enough to wash out the would-be sorting effect. This is a purely mechanical argument: no information theory, no observer, no measurement. It is logically anterior to any informational exorcism, because it shows the demon must be *intelligent* (i.e. genuinely outside the bath) for the puzzle to bite at all. Bennett's own 1988 historiography acknowledges this priority [3]; Earman and Norton single it out as the still-unsuperseded core of the negative result [4]. Yet Smoluchowski's name is missing from most physics textbook accounts.\n\n### Szilard (1929): cost localised at measurement\n\nSzilard's *Über die Entropieverminderung in einem thermodynamischen System bei Eingriffen intelligenter Wesen* introduces the single-molecule engine, identifies a closed cycle that would extract $kT \\ln 2$ of work from a bath, and concludes that a compensating $k \\ln 2$ of entropy must be produced — and locates that production in the *measurement* step by which the demon ascertains which side of the piston the molecule occupies [5]. Szilard does not derive an energetic cost of $kT \\ln 2$ from microphysics; he infers an entropic debit from the requirement that the Second Law survive the cycle. The result is canonically read as the first information-theoretic exorcism, but its mechanism — that observation/measurement is the dissipative step — is the one Bennett would later overturn.\n\n### Von Neumann (1949) and Brillouin (1956): the measurement-cost tradition\n\nVon Neumann's December 1949 University of Illinois lectures, preserved only through Burks's 1966 posthumous transcription [6], contain the earliest stated estimate that \"an elementary act of information\" should cost on the order of $kT \\ln 2$. The bound is asserted, not proved, and the lectures attach it to thermodynamic *processing* in general — neither to measurement specifically (Szilard's locus) nor to erasure specifically (Landauer's). The phrase \"von Neumann–Landauer bound,\" which still surfaces in the engineering literature, is a back-projection: Burks's transcript will not support attributing a derivation to von Neumann, and Landauer himself never claimed it [3].\n\nBrillouin's *Science and Information Theory* (1956) [7] systematised the Szilardian instinct into a \"negentropy of information\" bookkeeping in which the demon must consume free energy — Brillouin focused on the photon cost of *seeing* the molecule — to acquire the bit. The cost again sits at measurement. This was the orthodoxy Landauer inherited and inverted.\n\n### Landauer (1961) and Penrose (1970): cost localised at erasure\n\nLandauer's IBM JRD paper [8] makes the original move that the principle now bears his name for: not measurement, not computation in general, but the *logically irreversible* step — typically the resetting of a memory cell to a standard state — is the dissipative one. A bit-erasing operation contracts a two-cell phase-space volume to one cell; the missing $k \\ln 2$ of statistical entropy must be exported as heat to the bath, hence $\\geq kT \\ln 2$ per bit. Independently, Oliver Penrose's 1970 *Foundations of Statistical Mechanics* [9] developed the phase-space-contraction argument for computational state-reduction with a more careful statistical-mechanical apparatus; Maroney's SEP article [10] correctly lists \"Landauer (1961), Penrose (1970), and Bennett (1982)\" as the three foundational treatments, but Penrose is essentially absent from physics reading lists.\n\n### Bennett (1973, 1982): reversibility, and the demon's real exorcism\n\nTwo papers complete the architecture. Bennett (1973) [11] proved that any computation can be embedded in a logically reversible Turing machine, demonstrating that dissipation is not intrinsic to computing — it is intrinsic only to throwing information away. Bennett (1982) [12] then closed the Maxwell-demon loop: he showed Szilard and Brillouin had charged the wrong step. Measurement *can* be performed reversibly (no $kT \\ln 2$ debt at acquisition); the unavoidable cost arises when the demon, having used the bit to extract work, must *reset its memory* to be ready for the next cycle. That reset is a Landauer erasure. The Second Law is rescued not by paying at the input but by paying at the recycle. Landauer's 1991 *Physics Today* essay \"Information is physical\" [13] then turned the formal result into a research-program manifesto, and the philosophical critique of the entire exorcism strategy — Earman \u0026 Norton [4], Norton [14], Hemmo \u0026 Shenker [15] — opened the modern debate about whether the proof is circular, which Section 6 will address."}, {"id": "the-physics-properly", "title": "2. The Physics, Properly: The Four-Line Derivation with Every Assumption Numbered", "markdown": "## 2. The Physics, Properly: The Four-Line Derivation with Every Assumption Numbered\n\n### 2.1 The four-line phase-space-contraction proof\n\nTake a one-bit memory whose logical states $0$ and $1$ are encoded as two disjoint regions $\\Gamma_0,\\Gamma_1\\subset\\Gamma$ of the memory's classical phase space. Erasure is the protocol $\\mathrm{RESET\\text{-}TO\\text{-}0}$: regardless of the input, the final macrostate is $0$. Assume:\n\n- **A1.** A single heat bath at temperature $T$, weakly coupled.\n- **A2.** Quasi-static execution (reversible in the thermodynamic sense; entropy production by the protocol vanishes).\n- **A3.** Logical states $\\leftrightarrow$ disjoint phase-space cells of *equal* Liouville volume, $\\lvert\\Gamma_0\\rvert=\\lvert\\Gamma_1\\rvert\\equiv V$.\n- **A4.** Uniform prior on the input bit, $p_0=p_1=\\tfrac12$, so the Shannon entropy of the memory is $H=\\ln 2$.\n- **A5.** Identification of the Shannon entropy of the memory's logical distribution with its Gibbs/Boltzmann thermodynamic entropy, $S_{\\mathrm{thermo}}=k\\,H_{\\mathrm{Shannon}}+S_{\\mathrm{internal}}$, where $S_{\\mathrm{internal}}$ is the entropy of fast degrees inside a cell.\n- **A6.** Closed memory cycle: the protocol returns *the memory* (not the bath) to a standard physical state; no auxiliary tape carries away the record.\n- **A7.** Classical, or weakly coupled quantum regime in which a Gibbs state factorises as $\\rho_{\\mathrm{mem}}\\otimes\\rho_{\\mathrm{bath}}$ to leading order.\n\nUnder A1–A7 the derivation is four lines.\n\n**(L1)** Before erasure the accessible Liouville volume is $\\lvert\\Gamma_0\\rvert+\\lvert\\Gamma_1\\rvert=2V$; after erasure it is $V$. The Gibbs entropy of the memory therefore changes by\n$$\\Delta S_{\\mathrm{mem}}=k\\ln\\frac{V}{2V}=-k\\ln 2.$$\n\n**(L2)** A1+A2 imply that any entropy lost by the memory must reappear in the bath: $\\Delta S_{\\mathrm{bath}}=-\\Delta S_{\\mathrm{mem}}=k\\ln 2$ (in the reversible limit; otherwise strictly greater).\n\n**(L3)** A1 also gives Clausius for the bath, $\\Delta S_{\\mathrm{bath}}=\\langle Q_{\\mathrm{bath}}\\rangle/T$, where $\\langle Q_{\\mathrm{bath}}\\rangle$ is the mean heat *received* by the bath.\n\n**(L4)** Combining,\n$$\\boxed{\\;\\langle Q\\rangle\\;\\ge\\;kT\\ln 2,\\qquad \\langle W_{\\mathrm{diss}}\\rangle\\;\\ge\\;kT\\ln 2\\;}$$\nwith equality iff the protocol is quasi-static (A2 tight). This is Landauer's bound exactly as it appears in [8] and is recapitulated in modern reviews [16, 17, 18].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePhase-space contraction during bit erasure\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"24\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\"\u003eErasure as phase-space contraction (A3 + A4)\u003c/text\u003e\u003ctext x=\"120\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eBefore: p0 = p1 = 1/2\u003c/text\u003e\u003crect x=\"40\" y=\"80\" width=\"160\" height=\"220\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003crect x=\"50\" y=\"100\" width=\"140\" height=\"90\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"120\" y=\"148\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eΓ0 (vol V)\u003c/text\u003e\u003crect x=\"50\" y=\"200\" width=\"140\" height=\"90\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"120\" y=\"248\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\"\u003eΓ1 (vol V)\u003c/text\u003e\u003ctext x=\"120\" y=\"320\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eaccessible volume = 2V\u003c/text\u003e\u003ctext x=\"120\" y=\"340\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eS_mem = k ln(2V)\u003c/text\u003e\u003cpath d=\"M 230 200 L 360 200\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arr)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7ee0a3\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"295\" y=\"190\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eRESET (A2 quasi-static)\u003c/text\u003e\u003ctext x=\"295\" y=\"216\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003econtact with bath @ T (A1)\u003c/text\u003e\u003ctext x=\"480\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eAfter: p0 = 1\u003c/text\u003e\u003crect x=\"400\" y=\"80\" width=\"160\" height=\"220\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003crect x=\"410\" y=\"100\" width=\"140\" height=\"90\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"480\" y=\"148\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eΓ0 (vol V)\u003c/text\u003e\u003crect x=\"410\" y=\"200\" width=\"140\" height=\"90\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"480\" y=\"248\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\" opacity=\"0.5\"\u003eΓ1 emptied\u003c/text\u003e\u003ctext x=\"480\" y=\"320\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eaccessible volume = V\u003c/text\u003e\u003ctext x=\"480\" y=\"340\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eS_mem = k ln V\u003c/text\u003e\u003cline x1=\"600\" y1=\"120\" x2=\"690\" y2=\"120\" stroke=\"#ff7a90\" stroke-width=\"2\" marker-end=\"url(#arr2)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#ff7a90\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"645\" y=\"110\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003e⟨Q⟩ to bath\u003c/text\u003e\u003ctext x=\"645\" y=\"150\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003e≥ kT ln 2\u003c/text\u003e\u003ctext x=\"645\" y=\"172\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003e(L3, L4)\u003c/text\u003e\u003ctext x=\"360\" y=\"385\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eΔS_mem = −k ln 2 ⇒ ΔS_bath = +k ln 2 ⇒ ⟨Q⟩ = T ΔS_bath ≥ kT ln 2\u003c/text\u003e\u003c/svg\u003e\n*Figure: Erasure contracts the memory's accessible Liouville volume from $2V$ to $V$ (A3, A4). Under A1–A2 this entropy deficit is paid to a single bath at $T$; Clausius then fixes the mean heat.*\n\n### 2.2 The Clausius rewrite — where A5 enters\n\nLines (L1)–(L4) silently use A5 twice. In (L1) the Gibbs entropy $S=-k\\sum_i p_i\\ln p_i + \\langle S_{\\mathrm{internal}}\\rangle$ is split into a *logical* contribution $k H_{\\mathrm{Shannon}}$ and a within-cell contribution that A3 forces to be common to $\\Gamma_0$ and $\\Gamma_1$ (they have equal volume and, by A1 plus weak coupling, the same conditional Gibbs measure). In (L2)–(L3) the equilibrium relation $dS=\\delta Q_{\\mathrm{rev}}/T$ for the bath presupposes that the bath remains canonical throughout — formally A1 in its strong form. Strip A3 (unequal cells) and the coefficient becomes $kT\\ln(V_0/V_{\\mathrm{final}})$, not $kT\\ln 2$; strip A4 (biased prior $p$) and the bound becomes\n$$\\langle Q\\rangle\\ge kT\\,H(p)=-kT\\!\\left[p\\ln p+(1-p)\\ln(1-p)\\right],$$\nwhich collapses to zero as $p\\to 0$ or $1$ — a perfectly biased memory holds no information to erase. This generalised form is already implicit in Landauer 1961 [8] and made explicit in Plenio–Vitelli and the Goold *et al.* review [18].\n\n### 2.3 The Reeb–Wolf upgrade: an equality, with finite-bath corrections\n\nThe textbook proof is asymptotic and one-sided. Reeb and Wolf [19] tightened it into an *equality* by treating memory M and bath B quantum-mechanically and imposing only:\n\n- **R1.** Joint initial product state $\\rho_M\\otimes\\tau_B$ with $\\tau_B=e^{-H_B/kT}/Z_B$.\n- **R2.** Erasure implemented as a global unitary $U$ on $MB$ (no implicit ancilla).\n- **R3.** Energy conservation $[U,H_M+H_B]=0$.\n\nTheir result is\n$$\\beta\\langle Q\\rangle - \\Delta S_M = I(M\\!:\\!B')_{\\rho'} + S\\!\\left(\\rho_{B'}\\,\\|\\,\\tau_B\\right)\\;\\ge 0,$$\nwhere primes denote post-protocol states, $I$ is the quantum mutual information, and $S(\\cdot\\|\\cdot)$ is relative entropy. Both right-hand terms are non-negative and vanish iff the bath is left untouched and uncorrelated — i.e. iff A2 is exact and the bath is infinite. For a finite bath of dimension $d_B$ they extract the explicit lower bound\n$$\\beta\\langle Q\\rangle\\ge \\ln 2 - \\frac{1}{\\,d_B\\,}\\cdot O(1),$$\nshowing that $kT\\ln 2$ is approached, but provably *not reached*, at any finite bath size. The Reeb–Wolf identity is the cleanest available statement: it replaces A2 and A5 by R1–R3, exhibits the two non-negative slack terms one usually hides, and reduces to the four-line proof in the appropriate limit.\n\n### 2.4 What each assumption is doing\n\n| Assumption | Step it enables | What breaks without it (→ §3) |\n|---|---|---|\n| A1 single bath at $T$ | (L2)–(L3), R1 | multi-bath demons evade the bound |\n| A2 quasi-static | equality in (L4) | dissipation diverges with speed |\n| A3 equal cells | $\\ln 2$ coefficient | coefficient becomes $\\ln(V_0/V_f)$ |\n| A4 uniform prior | $H=\\ln 2$ | bound becomes $kT H(p)$ |\n| A5 Shannon $\\equiv$ Gibbs | identification of $\\Delta S_{\\mathrm{mem}}$ | Norton's circularity charge [14] |\n| A6 closed memory cycle | erasure is the *only* irreversibility | record stored on a tape costs zero |\n| A7 weak coupling | factorised initial state R1 | strong-coupling corrections of order $\\lambda^2$ |\n\nLandauer himself stated only A1–A2 explicitly; A3–A7 are buried in the prose of [8] and were articulated piecemeal over the following four decades — by Bennett [20, 17, 3], Piechocińska's fluctuation-theorem derivation [21], the Plenio–Vitelli review, and Reeb–Wolf [19]. Every \"violation\" of Landauer's principle in the literature is, on inspection, a violation of one of A1–A7; every tightening is a quantification of the slack the listed assumption hides."}, {"id": "strict-conditions-failure-modes", "title": "3. Strict Conditions and Failure Modes: What Breaks When Each Ai Is Violated", "markdown": "## 3. Strict Conditions and Failure Modes: What Breaks When Each Ai Is Violated\n\nThe four-line derivation of §2 was bought at the price of seven assumptions A1–A7. Each is load-bearing: relax it and either the coefficient changes, the inequality reverses, or the proof structure collapses entirely. The pedagogical scandal is that all seven are routinely stripped in casual citation, leaving \"$kT \\ln 2$\" floating free of the regime in which it was derived.\n\n### A1 — Single thermal bath at temperature $T$\n\nIf the memory exchanges heat with two reservoirs at $T_h\u003eT_c$, the erasure protocol is no longer constrained by a single Clausius inequality. Coupling the bit to the cold bath during state contraction and to the hot bath during volume re-expansion turns the \"erasure\" cycle into a Carnot-like engine: net heat $Q_h-Q_c$ can be *extracted* while still resetting the bit. The Landauer bound generalises to\n$$ W_{\\mathrm{min}} \\;\\geq\\; k T_c \\ln 2 \\;-\\; k T_h \\ln 2 \\cdot \\eta_C^{-1}\\,, $$\nand in particular vanishes — or becomes negative — when the cycle harvests the gradient. Vaccaro–Barnett-type schemes with an angular-momentum reservoir make the same point in a different conserved quantity: the cost is paid in spin, not energy, and \"$kT \\ln 2$\" is replaced by $\\hbar \\omega \\ln 2$ in the appropriate units. Janzing *et al.* [22] formalised the multi-resource generalisation: each conserved charge carried by the bath gives its own bound, and the cheapest erasure picks whichever charge is most abundant.\n\n### A2 — Quasi-static protocol ($\\tau \\to \\infty$)\n\nFor finite protocol time $\\tau$, the dissipated work in overdamped Langevin dynamics scales as\n$$ \\langle W_{\\mathrm{diss}} \\rangle \\;=\\; k T \\ln 2 \\;+\\; \\frac{\\mathcal{A}}{\\tau} \\;+\\; \\mathcal{O}(\\tau^{-2})\\,, $$\nwhere $\\mathcal{A}$ is the thermodynamic length of the optimal protocol — Sekimoto's stochastic-energetics result, sharpened by Aurell and collaborators into the geodesic on the Wasserstein-2 manifold of probability densities. The Bérut experiment [23] and the Jun–Gavrilov–Bechhoefer follow-up [24] explicitly map out this $1/\\tau$ tail and confirm that the bound is approached *from above* only as $\\tau \\to \\infty$. Reading the single-realisation work from a fast erasure as a \"violation\" of Landauer — a common error in the popular literature on stochastic thermodynamics — confuses the mean of a finite-time process with its asymptotic limit.\n\n### A3 — Equal cell volumes, disjoint supports\n\nIf $|\\Gamma_0|\\neq|\\Gamma_1|$, or the two logical regions overlap, the phase-space-contraction argument yields the relative-entropy bound\n$$ \\langle Q \\rangle \\;\\geq\\; k T\\, D(p_{\\mathrm{final}} \\,\\|\\, p_{\\mathrm{initial}})\\,, $$\nwhich is the Reeb–Wolf finite-bath equality [19] truncated to its dominant term. For overlapping supports the bit is not even well-defined as a classical macrostate, and \"erasure\" becomes a coarse-graining whose cost depends on the chosen partition — a subtlety Maroney's SEP entry [10] highlights as the geometric origin of the cell-volume assumption.\n\n### A4 — Uniform prior ($p_0 = p_1 = 1/2$)\n\nThis is the most frequently stripped assumption. For a biased bit with prior $p$, the contraction $\\{p, 1-p\\} \\to \\{1, 0\\}$ reduces the Shannon entropy by $H(p) = -p\\log p - (1-p)\\log(1-p)$ rather than $\\ln 2$, so\n$$ \\langle Q \\rangle \\;\\geq\\; k T \\, H(p)\\,, $$\nwhich vanishes as $p \\to 0$ or $p \\to 1$ — an already-known bit costs nothing to \"erase\". Calling the universal bound \"$kT \\ln 2$\" rather than \"$kT \\, H(p)$\" is the silent assumption behind nearly every back-of-envelope calculation that purports to apply Landauer to real computing hardware, where the data is overwhelmingly correlated and $H \\ll \\ln 2$ per nominal bit.\n\n### A5 — Identification of Shannon $H$ with thermodynamic $S$\n\nThe step $\\Delta S_{\\mathrm{thermo}} = k \\Delta H_{\\mathrm{Shannon}}$ requires that the logical-state probabilities coincide with objective phase-space measures of a canonical equilibrium ensemble. Earman \u0026 Norton [4], Norton [14], and Hemmo \u0026 Shenker [15] argue that no derivation of Landauer's principle succeeds without smuggling this identification in as a premise — making the principle either an instance of, or a restatement of, the Second Law it claims to vindicate. The standard reply, that the identification is *forced* once the memory equilibrates with the bath between operations, is precisely the move Norton calls question-begging: equilibration is what one must show, not assume.\n\n### A6 — Closed cycle, no side-channel correlations\n\nIf the memory shares mutual information $I(M\\!:\\!R)$ with a reference system $R$ — another memory, a measurement record, a quantum ancilla — the bound becomes the Sagawa–Ueda form\n$$ \\langle W \\rangle \\;\\geq\\; k T (\\ln 2 - I(M\\!:\\!R))\\,, $$\n[25, 26]. With sufficient prior correlation, $I \\geq \\ln 2$ and erasure can be performed at zero or negative work cost: the bit is \"reset\" by transferring its entropy to $R$, which now carries the cost. Bennett's 1982 framing of the demon's exorcism [17, 12] is the special case where $R$ is the demon's own measurement record and the cost is repaid in a subsequent reset.\n\n### A7 — Weak coupling, classical states\n\nFor strong system–bath coupling the bath's internal energy depends on the system state, and the partition of total energy into \"system\" and \"bath\" parts becomes gauge-dependent. Esposito-style corrections [27, 28] re-express the bound in terms of a non-equilibrium free-energy difference of the joint state. Quantum coherence in the memory permits a sharper failure: when the bit is correlated with a quantum reference whose conditional entropy $S(M\\!\\mid\\! R)$ is *negative*, the bound becomes\n$$ \\langle W \\rangle \\;\\geq\\; k T \\ln 2 \\cdot S(M\\!\\mid\\! R)\\,, $$\nand the right-hand side is negative — del Rio *et al.* [29] showed that erasure can release work, with the apparent violation paid for by the entanglement consumed. This is not a loophole in Landauer's reasoning; it is the natural extension once the classical Shannon entropy in A5 is replaced by the von Neumann entropy and conditional entropies are allowed their quantum sign.\n\nThe pattern across A1–A7 is uniform: every weakening of the assumptions either generalises $\\ln 2 \\to H$, $\\ln 2 \\to D(p\\|q)$, or $\\ln 2 \\to S(M\\!\\mid\\! R)$, or replaces the inequality with a fluctuation-theorem equality. The number \"$kT \\ln 2$\" is the value of these expressions at a single, sharply defined corner of the parameter space — uniform prior, single bath, quasi-static, weak coupling, classical, closed cycle, equal cells. Outside that corner, the symbol survives in the literature long after the physics has moved on."}, {"id": "signatures-direct-vs-indirect", "title": "4. Signatures: What Would Actually Constitute a Measurement of Landauer's Bound", "markdown": "## 4. Signatures: What Would Actually Constitute a Measurement of Landauer's Bound\n\nThe literature contains roughly a dozen experiments that claim to \"verify\" or \"test\" Landauer's principle. None of them measures the 1961 inequality directly. They cannot, because the 1961 inequality is a statement about a quasi-static limit that no finite-time experiment realises. What they actually measure is one of three distinct things: (i) the mean of a heat distribution in a single bit-erasure protocol, (ii) an integral fluctuation theorem of the Sagawa–Ueda type [25, 26] that contains Landauer as a corollary, or (iii) a Jarzynski/Crooks tail whose ensemble average asymptotes to $k_BT\\ln 2$. The conflation of these three is the dominant pathology in this corner of the field.\n\n### 4.1 What a clean signature would have to show\n\nA protocol $\\lambda(t)$, $t\\in[0,\\tau]$, that takes a one-bit memory from the equal-prior mixture $p_0=p_1=1/2$ to a reset state $p_0=1$ produces, on each realisation, a stochastic heat $Q$ delivered to the bath. A genuine test of Landauer's bound requires four things simultaneously:\n\n1. **Prior control.** The pre-erasure distribution must be demonstrably uniform; otherwise the bound is $k_BT\\,H(p)$, not $k_BT\\ln 2$, and one is measuring the wrong number.\n2. **Reset fidelity.** The post-erasure error probability $\\varepsilon$ must be measured independently and the data corrected by the Reeb–Wolf finite-size term [19], $\\Delta Q \\geq k_BT[\\ln 2 - h(\\varepsilon)] - O(1/N)$.\n3. **The full distribution $P(Q)$.** Not just $\\langle Q\\rangle$. The Crooks symmetry $P(Q)/\\tilde P(-Q)=\\exp(\\beta Q-\\Delta S_{\\text{sys}})$ must be checked tail-to-tail, because finite-time realisations routinely show $Q\u003ck_BT\\ln 2$ on individual trajectories — a signature of the inequality being a statement about means.\n4. **The asymptotic approach.** A scan of $\\langle Q\\rangle(\\tau)$ with $\\tau\\to\\infty$ that approaches $k_BT\\ln 2$ **from above**, with the leading correction $\\sim 1/\\tau$ predicted by linear-response theory.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eMean dissipation vs protocol time\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"380\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eprotocol duration τ (log scale)\u003c/text\u003e\u003ctext x=\"30\" y=\"200\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 30 200)\"\u003e⟨Q⟩ / k_B T\u003c/text\u003e\u003cline x1=\"80\" y1=\"240\" x2=\"680\" y2=\"240\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"690\" y=\"244\" fill=\"#7ee0a3\" font-size=\"14\"\u003eln 2 (Landauer)\u003c/text\u003e\u003cpath d=\"M 100 90 Q 200 150 300 200 T 600 240\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"610\" y=\"232\" fill=\"#7aa2ff\" font-size=\"14\"\u003equasi-static\u003c/text\u003e\u003cpath d=\"M 100 70 Q 250 110 400 160 T 660 200\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"670\" y=\"196\" fill=\"#ffb86b\" font-size=\"14\"\u003efriction\u003c/text\u003e\u003cpath d=\"M 100 130 L 660 130\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"670\" y=\"134\" fill=\"#ff7a90\" font-size=\"14\"\u003enon-uniform prior\u003c/text\u003e\u003ccircle cx=\"600\" cy=\"240\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"520\" cy=\"244\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"440\" cy=\"252\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"380\" y=\"60\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003esmoking-gun: approach from above, with 1/τ tail\u003c/text\u003e\u003c/svg\u003e\n*Figure: Three protocols that produce nearly identical $\\langle Q\\rangle\\sim k_BT\\ln 2$ at one operating point but reveal themselves as Landauer (blue), residual friction (orange), or biased prior (red) only when $\\tau$ is scanned and the asymptote is examined.*\n\n### 4.2 Audit of the canonical experiments\n\n**Bérut et al. 2012 [23]** — colloidal bead in a dual optical trap. Reported $\\langle Q\\rangle\\to k_BT\\ln 2$ as the barrier-tilting protocol slowed to $\\tau\\sim 30$ s. What was actually tested: the integral fluctuation relation $\\langle e^{-\\beta(W-\\Delta F)}\\rangle=1$ under the tilted protocol, with feedback set by the experimenter's preparation of equal priors. The data approach the bound from above with a leading correction empirically consistent with $\\sim B/\\tau$, $B\\sim 8\\,k_BT\\cdot$s — exactly the Sekimoto–Sasa linear-response form. The experiment does not control reset fidelity stringently (error probability $\\sim 10\\%$ at the fastest runs), and the prior distribution was set by long pre-equilibration rather than measured trajectory-by-trajectory.\n\n**Jun, Gavrilov \u0026 Bechhoefer 2014 [24]** — virtual double-well realised by a feedback trap. This is the cleanest of the four. The prior is engineered by the controller (so $H(p)$ is known exactly), the protocol can be tuned and varied, and the authors plot $\\langle Q\\rangle$ versus reset error $\\varepsilon$ and verify the Reeb–Wolf finite-size correction $h(\\varepsilon)$ explicitly. The asymptote $\\langle Q\\rangle\\to k_BT[\\ln 2 - h(\\varepsilon)]$ is recovered to within a few percent. This is the only single-bit experiment that simultaneously satisfies criteria (1), (2), and (4) above; the full $P(Q)$ histogram is reported but not used for a Crooks tail-tail test.\n\n**Hong, Lambson, Dhuey \u0026 Bokor 2016 [30]** — nanomagnetic memory bits driven by an external field. Reported dissipation per erasure near $k_BT\\ln 2$. The protocol is hysteretic, the bath is the magnonic environment plus the substrate phonons (effective $T$ ambiguous), and the prior is not controlled trajectory-by-trajectory. The result is consistent with Landauer but does not discriminate it from a generic Joule-heating estimate of the same order — the \"agreement\" exploits a single-point coincidence rather than scanning $\\tau$ or $\\varepsilon$.\n\n**Yan et al. 2018 (single-electron box, Aalto group)** (verify) — reported a sub-$k_BT\\ln 2$ tail in $P(Q)$ consistent with Jarzynski, and a mean asymptoting from above. The discriminating feature is the explicit measurement of the distribution, not the mean.\n\n### 4.3 Alternative explanations that fake the signature\n\nA single number $\\langle Q\\rangle\\approx k_BT\\ln 2$ is, by itself, evidence of nothing. The same mean is produced by:\n\n- **Residual viscous dissipation** in an under-damped protocol — falsified by scanning $\\tau$ and observing whether the asymptote is $k_BT\\ln 2$ or something protocol-dependent.\n- **Non-uniform prior**: if the experimenter has unwittingly biased $p_0\\neq 1/2$, the bound drops to $k_BT\\,H(p)\u003ck_BT\\ln 2$, and an over-driven protocol can hit the lower target. Falsified by independent measurement of the pre-protocol occupation.\n- **Incomplete reset** with error $\\varepsilon$ — the bound becomes $k_BT[\\ln 2 - h(\\varepsilon)]$. Falsified by Reeb–Wolf-corrected plotting [19] and the Jun–Gavrilov–Bechhoefer error scan [24].\n- **Mis-identified bath temperature** in driven systems (especially nanomagnets) where the effective $T$ of the relevant mode differs from ambient.\n\nThe discriminants that separate Landauer from its impostors are therefore not a single dissipation number but: (a) the $1/\\tau$ approach to the asymptote, (b) the explicit error-rate scan against $h(\\varepsilon)$, (c) the Crooks symmetry of $P(Q)$, and (d) trajectory-level prior control. Only [24] satisfies (a), (b), and (d) at once; no published single-bit experiment to date satisfies all four simultaneously."}, {"id": "use-and-abuse", "title": "5. Use and Abuse: How kT ln 2 Escaped Its Premises", "markdown": "## 5. Use and Abuse: How kT ln 2 Escaped Its Premises\n\nThe cleanest statement of Landauer's bound — \"erasing one bit dissipates at least $kT \\ln 2$ of heat\" — fits on a slide. Stripped of its seven assumptions A1–A7 (single thermal bath at temperature $T$; uniform Bernoulli prior on the bit; logical many-to-one map; quasi-static protocol; classical phase-space partition into equal-volume regions; weak system–bath coupling; well-defined initial equilibrium of the memory), the slogan migrates freely. Each migration produces a characteristic misuse, and each misuse violates a specific $A_i$. Cataloguing them is not pedantry — it is how one separates the principle's actual content from its marketing.\n\n### 5.1 \"Computation costs $kT \\ln 2$ per bit\"\n\nThe most common abstract claim — that every logic gate must dissipate at least $kT \\ln 2$ — silently violates A3. Bennett's 1973 construction of reversible Turing machines [11] and the subsequent reversible-logic literature established that any computation can in principle be embedded in a sequence of one-to-one operations whose Landauer dissipation is zero; only the eventual reset of intermediate \"garbage\" bits incurs the bound, and even that is amortisable by uncomputation. The misreading conflates \"computation in current CMOS architectures\" (which dissipates $\\sim 10^{4}\\!-\\!10^{6}\\, kT$ per gate for noise-margin reasons unrelated to Landauer) with \"computation in principle.\" When a paper invokes a \"Landauer limit\" for silicon, ask whether it means the thermodynamic floor or the irreversibility-induced floor; the two differ by orders of magnitude and by physics.\n\n### 5.2 \"Observation costs $kT \\ln 2$\"\n\nThis is the Szilard–Brillouin residue (§1). It locates the dissipative step of the demon's cycle at the measurement act, not the erasure of the resulting record. Modern theory since Bennett 1982 [12] inverts that location: measurement of a classical macroscopic pointer can in principle be thermodynamically reversible, while resetting the pointer cannot. Sagawa \u0026 Ueda's generalised second law for feedback [25, 26] tracks both contributions cleanly and shows they are not interchangeable. The slogan \"measurement costs $kT \\ln 2$\" is wrong; \"an irreversible measurement–record–reset cycle costs at least $kT \\ln 2$ somewhere\" is right but uninformative.\n\n### 5.3 \"The bound is universal\"\n\nUniversality claims drop A1 and A4. With two baths at temperatures $T_h \u003e T_c$, a Maxwell-demon-style protocol can extract net work while erasing the demon's record — the \"cost\" is then bounded below by $kT_c \\ln 2$, but the engine's bottom line is positive. With non-equilibrium reservoirs (squeezed states, generalised Gibbs ensembles, spin-only reservoirs), the cost can be denominated in angular momentum rather than energy — the Vaccaro–Barnett line traced in. With finite-time protocols the actual dissipation is generically much larger than $kT \\ln 2$ by a Sekimoto-style excess-work term, and the bound becomes a useless lower limit. Reeb \u0026 Wolf [19] make the finite-bath corrections explicit and quantitative: the universality holds *only* within the equilibrium single-bath Gibbs-canonical scaffolding.\n\n### 5.4 \"Bérut et al. verified Landauer\"\n\nThe 2012 colloidal-bead experiment [23] is universally cited as the experimental confirmation. As established in §4, what it actually verified is the Sagawa–Ueda integral fluctuation relation for an erasure protocol, with mean dissipated heat approaching $kT \\ln 2$ from above as the protocol is slowed toward quasi-static. This is consistent with Landauer's 1961 inequality but does not isolate it: a successful test of the Sagawa–Ueda equality automatically implies a successful test of any inequality it bounds. The same critique applies in modified form to Jun–Gavrilov–Bechhoefer [24] and Hong et al. [30]. None of these is wrong; what is wrong is reading them as direct tests of A1–A7.\n\n### 5.5 Biology and neuroscience as a $kT \\ln 2$ abuser\n\nPapers quoting $kT \\ln 2 \\approx 2.9 \\times 10^{-21}\\,\\mathrm{J}$ as a metabolic floor for synaptic events, neural spikes, or ribosomal proofreading violate A4 (cellular processes are not quasi-static) and A6 (synapses and ribosomes are not in canonical equilibrium with a well-defined memory partition). Mehta \u0026 Schwab's PNAS treatment of kinetic proofreading [31] is itself careful, drawing the bound only where the assumptions are approximately met and finding an answer several orders of magnitude *below* the actual ATP cost — the correct conclusion. The abuse occurs in the citation chain: subsequent reviews routinely cite Mehta–Schwab as showing the cell \"operates near the Landauer limit,\" when in fact it shows the opposite. Any biological process operating $\\gg kT \\ln 2$ per bit is not \"near the Landauer limit\"; it is dominated by irreversibility, noise margins, and chemical-potential drops that the Landauer bookkeeping does not capture.\n\n### 5.6 The \"von Neumann–Landauer\" engineering brand\n\nSemiconductor roadmap documents and low-power-computing manifestos occasionally invoke a \"von Neumann–Landauer limit,\" traced to the 1949 Illinois lectures (§1) and the 1961 IBM paper. The historiography is unsound: von Neumann's remark, preserved only through Burks's 1966 transcription [6], stated $kT \\ln 2$ as a bound without proof and applied it to processing rather than erasure. The \"von Neumann–Landauer\" branding is a back-attribution that conflates two distinct claims and obscures Bennett's actual contribution. Use it only with a footnote, if at all.\n\n### 5.7 A six-point sniff test\n\nConfronted with an abstract that invokes Landauer's principle, ask:\n\n1. **Erasure or computation?** If the claim is about computation in general, A3 is violated — reversible computing zeros the bound.\n2. **One bath or many?** If a temperature gradient or non-equilibrium reservoir is in play, A1 is violated and the coefficient is not $kT \\ln 2$.\n3. **Uniform prior?** If the bit's initial distribution is biased, the correct bound is $kT \\cdot H(p)$, not $kT \\ln 2$ — an A2 violation.\n4. **Quasi-static?** If the protocol time is finite, dissipation exceeds the Landauer floor by an excess-work term that often dominates — an A4 violation.\n5. **What is the memory?** If the \"bit\" is encoded in modes without a clean phase-space partition (a neural firing rate, a chemical concentration, a synaptic strength), A5 fails and the bound is rhetorical.\n6. **Fluctuation theorem or inequality?** If the experimental backing is Bérut, Jun, or Hong, the work has tested a Sagawa–Ueda equality, not Landauer's inequality independently.\n\nA paper passing all six checks is rare and worth reading. A paper failing four or more is invoking the slogan, not the principle."}, {"id": "status-and-believers-checklist", "title": "6. Status and the Believer's Checklist", "markdown": "## 6. Status and the Believer's Checklist\n\n### 6.1 Where the principle stands in 2026\n\nTwo communities have absorbed Landauer's bound in entirely different ways, and a third has refused to absorb it on the terms offered.\n\nIn *stochastic and quantum information thermodynamics*, the principle has matured into a family of rigorous equalities. Reeb–Wolf [19] replaced the 1961 asymptotic inequality with a tight, finite-bath quantum statement carrying explicit $1/\\dim(\\mathcal H_R)$ corrections, so that\n\n$$\\beta \\langle Q \\rangle \\;\\geq\\; \\Delta S(\\rho_S) \\;+\\; I(S{:}R')_{\\rho'} \\;+\\; D\\!\\left(\\rho_R' \\,\\Vert\\, \\rho_R\\right)$$\n\nwith every term operationally identifiable. The Sagawa–Ueda generalised Jarzynski relation [25, 26] sits underneath the modern experimental \"verifications\" [23, 24, 30] and recasts Landauer as a corollary of a feedback-controlled fluctuation theorem. The role of side information was secured by del Rio et al. [29]: erasure of a bit correlated with a quantum reference can extract work, with bound $kT\\!\\cdot\\!H(S\\mid R)$ that can be *negative*. The Faist–Dupuis–Oppenheim–Renner one-shot framework (verify) replaces von Neumann entropy with smooth max-entropy in the small-sample regime. Modern reviews [18, 27, 28] treat Landauer 1961 as a thermodynamic-limit corner of a richer resource theory.\n\nIn *engineering and popular discourse*, the principle has mutated into a folk theorem. The \"Landauer wall\" rhetoric quotes $kT \\ln 2$ per *gate operation* — fusing computation with erasure and ignoring Bennett's 1973 reversibility theorem [11]. Actual CMOS dissipation sits roughly $10^4$–$10^5$ above the Landauer scale; the bound is not the relevant constraint on near-term silicon, and using it that way is marketing language dressed as physics.\n\nThe third community — *philosophy of physics* — holds an unrefuted critique. Earman–Norton's \"Exorcist XIV\" [4], Norton's \"Waiting for Landauer\" [14], and Hemmo–Shenker's monograph [15] argue that every standard derivation either tacitly assumes the Second Law it claims to vindicate, or smuggles in the identification of Shannon with Gibbs entropy that holds only at canonical equilibrium. Maroney's SEP entry [10] is the canonical synthesis; Rioul's disentangling of Brillouin negentropy from Landauer erasure [32] reinforces that these are distinct, complementary principles, not restatements. None of this stream is engaged in standard physics pedagogy — a quantum-information student will encounter Landauer as theorem, not as contested foundation.\n\n### 6.2 The Believer's Checklist\n\nWhat AETHER demands of any paper claiming to measure, derive, or invoke Landauer's principle. Each item names the §3 assumption $A_i$ it guards and the historical confusion it prevents.\n\n1. **State the temperature and verify a single bath.** Guards **A1** (single equilibrium reservoir at $T$). Prevents the multi-bath sleight where work extracted against a gradient is misread as a \"Landauer violation.\" *Required datum:* measured bath temperature(s); bath equilibration timescale relative to protocol duration.\n\n2. **Report the prior distribution of the bit; do not assume uniformity.** Guards **A4** (uniform initial measure on $\\Gamma_0 \\cup \\Gamma_1$). The bound is $kT\\!\\cdot\\!H(p)$; the slogan $kT \\ln 2$ is the special case $p=\\tfrac12$. Prevents the \"any irreversible operation costs $kT \\ln 2$\" abuse. *Required datum:* empirical histogram of the initial logical state across runs.\n\n3. **Distinguish $\\langle W_\\mathrm{diss}\\rangle$ from the trajectory-wise bound.** Guards **A5** (quasi-static limit). The Sagawa–Ueda relation [26] guarantees $\\langle e^{-\\beta(W-\\Delta F)}\\rangle = 1$; single-trajectory excursions below $kT\\ln 2$ are *expected*, not anomalies. *Required datum:* the full distribution $P(W_\\mathrm{diss})$, not just its mean.\n\n4. **Extrapolate to the quasi-static limit explicitly.** Guards **A5**. Bérut et al. [23] reached $kT\\ln 2$ only as $\\tau \\to \\infty$. Prevents the engineering misreading that a single fast operation achieved the bound. *Required datum:* $\\langle W_\\mathrm{diss}\\rangle$ as a function of protocol duration with the extrapolation shown.\n\n5. **Verify the memory's initial equilibration in each well.** Guards **A2** (initial Gibbs state on each $\\Gamma_i$). Norton's critique [14] turns precisely on whether thermal fluctuations in the memory have been honestly accounted before the protocol begins. *Required datum:* dwell-time and position statistics in each well versus Boltzmann predictions.\n\n6. **State which operation was performed: erasure, copying, or measurement.** Guards the §1 credit audit. Brillouin [7] charges measurement; Landauer [8] charges erasure; Bennett 1982 [12] relocated the demon's exorcism for exactly this reason. *Required datum:* the logical truth table of the protocol's action on $\\{0,1\\}$.\n\n7. **Compute finite-size and finite-time corrections.** Guards **A1** and **A5** jointly. The Reeb–Wolf corrections [19] are nontrivial whenever the bath is small or the protocol is short; omitting them spuriously inflates agreement with the 1961 inequality. *Required datum:* effective bath dimension or heat capacity, with the correction term included in the predicted bound.\n\n8. **Run a logically reversible control.** Guards **A6** (Hamiltonian/Liouville dynamics) and the logical/thermodynamic conflation. Bennett 1973 [11] implies that a logically reversible protocol of comparable complexity should dissipate well below $kT\\ln 2$. *Required control:* a paired logically reversible run, with measured dissipation.\n\n9. **Engage the philosophical critique.** Guards intellectual honesty rather than an $A_i$. Any paper claiming \"experimental verification of Landauer\" without citing [4, 14, 15, 10] is asserting consensus where the foundations are contested. *Required:* explicit response to the circularity charge, or honest acknowledgement that the experiment tests a fluctuation-theorem framing, not the 1961 inequality.\n\n10. **Distinguish classical from quantum erasure, and characterise correlations.** Guards **A3** (macroscopically disjoint phase-space regions) and the del Rio extension [29]. With a quantum reference, \"erasure\" can extract work — the bound becomes $kT\\!\\cdot\\!H(S\\mid R)$, possibly negative. *Required datum:* in the quantum case, explicit characterisation of system–reference correlations and the conditional entropy actually being erased.\n\nA paper that survives these ten cuts is genuinely about Landauer's principle. A paper that fails any one of them is about something else — and should be made to say what."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough of this dossier in referee mode. Here is where I actually stand.\n\n### (a) What I will defend with my reputation\n\nThe **phase-space-contraction argument** of §2 is correct and, within its seven assumptions, tight. If you grant me (A1) a single canonical bath at temperature $T$, (A2) two macroscopically disjoint, equal-volume memory regions $\\Gamma_0,\\Gamma_1$, (A3) a Hamiltonian protocol that maps $\\Gamma_0\\cup\\Gamma_1 \\to \\Gamma_0$ quasi-statically while remaining in instantaneous Gibbs equilibrium, and (A4–A7) the standard fluctuation-dissipation scaffolding, then\n\n$$\\langle Q\\rangle \\;\\geq\\; k_B T \\ln 2$$\n\nis a theorem of equilibrium statistical mechanics, not a hypothesis. I will also defend Bennett's 1982 inversion as the *correct* exorcism of Maxwell's demon — relocating the dissipative step from measurement (Szilard–Brillouin) to memory reset is the move that makes the bookkeeping close without invoking a quantum measurement postulate. And I will defend, as a matter of historical record, that **Landauer's specific contribution is the identification of *logical* irreversibility as the locus of cost** — not the coefficient, not the demon, not the bound itself. Strip that and you are left with Szilard 1929 and von Neumann's Illinois remark, neither of which gives the modern principle.\n\n### (b) What is shakier than the literature admits\n\nThree things are advertised as settled and are not.\n\nFirst, the **Shannon–Gibbs identification** (Conflation 4). The standard derivation assumes that the memory's logical macrostates are realised by phase-space regions whose Gibbs entropy is $k_B \\ln |\\Gamma_i|$ and whose probabilities are the same probabilities that appear in $H(p)=-\\sum p_i \\log p_i$. Earman \u0026 Norton's \"sound and complete\" critique and the Hemmo–Shenker line have *not* been refuted on their own terms; they have been ignored. The principle's status as a *theorem* depends on a premise that is itself contested.\n\nSecond, the **experimental record does not test the 1961 inequality.** Every \"verification\" since Bérut 2012 measures a Sagawa–Ueda or Jarzynski-style mean-work statement on a Brownian (or NV, or qubit) bit, then quotes the asymptote. That is consistent with Landauer's bound; it is not a measurement of it. The community has quietly weakened the claim from \"lower bound on heat\" to \"mean dissipated work in a near-quasi-static realization\" and not flagged the change. A genuine test would require a *protocol-independent* lower-bound measurement, which we do not have.\n\nThird, the **prior-distribution dependence** ($k_B T\\, H(p)$ rather than $k_B T \\ln 2$) is treated as a minor generalisation. It is not. It implies that a memory holding $p\\neq 1/2$ has *less* erasure cost, which means the bound an engineer faces depends on what they believe about the bit they are erasing — a deeply Bayesian intrusion into a thermodynamic statement that almost no pedagogical treatment grapples with.\n\n### (c) Three open questions I would actually work on\n\n1. **Operational test of Landauer as an inequality, not a Jarzynski mean.** Design a single-shot erasure protocol whose minimum-heat statistic is bounded below, not on average. This is the only experiment that would settle the foundational debate.\n2. **Multi-bath erasure and the demon at a temperature gradient.** $k_B T \\ln 2$ collapses when $T$ is not unique; the correct generalisation (and its relation to autonomous Maxwell demons in non-equilibrium steady states) is open and physically realisable in mesoscopic circuits.\n3. **Quantum erasure with coherent encodings.** When $\\Gamma_0,\\Gamma_1$ are non-orthogonal quantum states, the \"logical irreversibility $\\Rightarrow$ heat\" chain breaks at the no-cloning step; the right bound is not $k_B T \\ln 2$ and the Reeb–Wolf 2014 inequality is only the first word.\n\n### Reading path\n\n1. **Landauer (1961)** — read first, before any commentary, to see how narrow the original claim actually was.\n2. **Bennett (1982)** — the demon exorcism; read second, because the 1961 paper does not yet contain it.\n3. **Earman \u0026 Norton, \"Exorcist XIV\" (1999)** — the philosophical critique that physics has not answered; read to inoculate against the textbook compression.\n4. **Sagawa \u0026 Ueda (2010, 2012)** — the fluctuation-theorem framework that every modern \"Landauer experiment\" actually tests.\n5. **Bérut et al. (2012)** — read last, with the previous four in hand, to see precisely what was and was not measured."}], "references": [{"n": 1, "title": "Letter to Peter Guthrie Tait, 11 December 1867 (introducing the 'finite being' that sorts molecules)", "authors": ["James Clerk Maxwell"], "year": 1867, "venue": "Reprinted in C. G. Knott, Life and Scientific Work of Peter Guthrie Tait (Cambridge UP, 1911), pp. 213–214; and in Leff", "url": "https://archive.org/details/lifescientificwo00knotuoft", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Experimentell nachweisbare, der üblichen Thermodynamik widersprechende Molekularphänomene", "authors": ["Marian von Smoluchowski"], "year": 1912, "venue": "Physikalische Zeitschrift 13, 1069; expanded 1914 in Vorträge über die kinetische Theorie der Materie und Elektrizität (", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Notes on the history of reversible computation", "authors": ["Charles H. Bennett"], "year": 1988, "venue": "IBM Journal of Research and Development 32(1), 16–23", "url": "https://worrydream.com/refs/Bennett_1988_-_Notes_on_the_history_of_reversible_computation.pdf", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Exorcist XIV: The wrath of Maxwell's demon. Part I — From Maxwell to Szilard; Part II — From Szilard to Landauer and beyond", "authors": ["John Earman", "John D. Norton"], "year": 1998, "venue": "Studies in History and Philosophy of Modern Physics 29(4), 435–471 (Part I); 30(1), 1–40 (1999, Part II)", "url": "https://philpapers.org/rec/EAREXT-3", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Über die Entropieverminderung in einem thermodynamischen System bei Eingriffen intelligenter Wesen", "authors": ["Leo Szilard"], "year": 1929, "venue": "Zeitschrift für Physik 53, 840–856", "url": "https://fab.cba.mit.edu/classes/863. function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});

  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
