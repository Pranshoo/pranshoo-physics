"1. Why This Mattered: From Bochkov–Kuzovlev to Single-Molecule Pulling 1. Why This Mattered: From Bochkov–Kuzovlev to Single-Molecule Pulling For half a century after Onsager, the second law remained essentially an inequality . The Clausius bound \\Delta F \\le \\langle W\\rangle told you that work performed on a system held at temperature T = (k B\\beta)^{-1} was bounded below by the equilibrium free-energy change, the slack absorbing all dissipation. That bound is saturated only in the quasi-static limit; for any finite-rate protocol it gives you neither a way to equate equilibrium and nonequilibrium quantities, nor a recipe to extract the former from the latter. The Jarzynski equality closed that gap. With the ensemble started in the canonical distribution of H(\\lambda 0), the average runs over an arbitrary protocol \\lambda(t) for t\\in[0,\\tau] — there is no quasi-static limit, no near-equilibrium expansion, no restriction on driving speed. As a category-shift for the second law this cannot be overstated: a sixty-year-old asymmetry between thermodynamic and statistical-mechanical accounting collapsed into a one-line identity, and an entire generation of single-molecule experiments acquired a license to extract \\Delta F from trajectories that never came near equilibrium. The genealogy, however, predates 1997 by two decades, and the credit ledger is not what most reviews claim. The Soviet ancestor In 1977, Bochkov and Kuzovlev derived the first exponential work identity inside a nonlinear fluctuation–dissipation framework , and in 1981 stated it in fully general form across two Physica A papers : Here f(t) is an external mechanical force acting on a system whose intrinsic Hamiltonian H 0 is not modified by the perturbation — the exclusive -work convention. The right-hand side is unity because the bare Hamiltonian is unchanged; there is no \\Delta F to recover. The result then sat in the Soviet literature, unread by the Western nonequilibrium community that would later build stochastic thermodynamics on top of it. Jarzynski's own 2007 Comptes Rendus paper is the cleanest acknowledgment: the Bochkov–Kuzovlev identity is structurally JE, but in the exclusive-work convention, and the difference — to which §2 and §5 return repeatedly — is exactly the boundary term that conjures \\Delta F out of unity. The Australian–Italian fluctuation-theorem branch A parallel lineage came from deterministic-thermostat molecular dynamics. Evans, Cohen and Morriss noticed in 1993, simulating a sheared fluid, that trajectories violating the second law occurred with a probability exponentially suppressed in their entropy production . Gallavotti and Cohen lifted this to a theorem in 1995 under their chaotic hypothesis for thermostatted systems in nonequilibrium steady states . The Evans–Searles 1994 transient fluctuation theorem (verify) gave the analogous transient statement. None of this spoke of free energy; the exponent was entropy production. But the structural lesson — that finite-time nonequilibrium statistics enforce an equality between forward and time-reversed trajectory probabilities — is precisely the one Crooks would soon import into the work-functional setting. Jarzynski 1997 and the Hamiltonian core The PRL derived \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F} from microscopic Hamiltonian dynamics with W the inclusive work, evaluated along each trajectory. The companion PRE re-derived the identity inside a master-equation framework, decoupling the result from Hamiltonian flow and showing that Markovian stochastic dynamics with detailed balance at every frozen \\lambda suffice. That second derivation is what travels into the single-molecule literature: nobody computes Hamiltonian flow for 10^{23} bath degrees of freedom; Langevin dynamics is the working model. A later, sharper Hamiltonian derivation foreshadowed the detailed fluctuation theorem. Crooks's path-ensemble bridge Crooks's 1998 J. Stat. Phys. paper — written as a Berkeley graduate student and routinely under-cited relative to the 1999 PRE — recast JE as a statement about path-ensemble averages under a time-reversed measure. The 1999 PRE proved the strictly stronger detailed fluctuation theorem from which JE drops out by integrating the numerator. Crooks made explicit what Jarzynski had implicitly assumed: microscopic reversibility plus an initial canonical distribution. Stated this way, the Evans–Cohen–Morriss and Gallavotti–Cohen results became visible as the steady-state cousins of the same identity, not a separate chapter. From identity to instrument Two papers turned the equality into a usable tool. Hummer and Szabo (2001) inverted nonequilibrium pulling trajectories into the underlying potential of mean force G(x) via the position-resolved reweighting still the operational backbone of every modern JE-based analysis of single-molecule force data . Liphardt, Dumont, Smith, Tinoco and Bustamante (2002) then mechanically unfolded a single RNA hairpin with optical tweezers and recovered the equilibrium \\Delta G to within k BT even when driven well above the molecule's relaxation rate. The instrument had teeth almost immediately: by 2003, Gore, Ritort and Bustamante had quantified the catastrophic finite-sample bias — the exponential average is dominated by rare low-work trajectories, and the JE estimator's variance scales like e^{\\beta\\sigma^2}/N in the work variance, even though the equality itself is exact. Two years later Collin et al. verified the Crooks symmetry on RNA and showed that the forward/reverse histogram crossing yields \\Delta F in regimes where raw JE fails to converge. Seifert's integral fluctuation theorem for trajectory entropy production then embedded the whole structure inside what his 2012 review consolidated as stochastic thermodynamics , fixing the modern vocabulary. The arc from Bochkov–Kuzovlev's exclusive-work identity to a quantitative RNA folding free energy took twenty-five years and three independent traditions — Soviet nonlinear FDR, deterministic-thermostat MD, and the Hamiltonian–path-ensemble line — that almost never spoke to each other in real time. That they collapse onto a single one-line identity is what made the seminar worth holding. 2. The Physics, Properly: Hamiltonian Derivation with Numbered Assumptions 2. The Physics, Properly: Hamiltonian Derivation with Numbered Assumptions Fix the cleanest possible setting: a classical system with phase-space point z=(q,p) and Hamiltonian H(z;\\lambda) depending parametrically on an externally controlled scalar \\lambda. The protocol \\lambda(t) runs from \\lambda 0 at t=0 to \\lambda \\tau at t=\\tau. The two equilibrium ensembles that bookend the protocol have The identity to derive is The six assumptions, named once and for all A1 — Canonical initial state. \\rho 0(z) = e^{-\\beta H(z;\\lambda 0)}/Z(\\lambda 0). JE is a statement about an ensemble of trajectories that start exactly here; nothing about the final state is assumed [6, 8]. A2 — Microscopically reversible dynamics. Either (a) closed Hamiltonian flow on an extended system+bath phase space, or (b) Markovian system-only dynamics with a kernel P t(z\\!\\to\\! z';\\lambda) that satisfies instantaneous detailed balance with respect to e^{-\\beta H(\\cdot;\\lambda)} at every fixed \\lambda [7, 8]. The master-equation route of confirms that JE does not hinge on any particular microscopic model. A3 — Prescribed external protocol. \\lambda(t) is a deterministic function of time, not a dynamical variable; it carries no thermal noise and does not respond to z(t). A4 — Inclusive (Hamiltonian) work. Work is not mechanical force times displacement [6, 3]. This is the choice that puts \\Delta F on the right-hand side. A5 — No feedback. The protocol is fixed before the trajectory begins; no measurement on z(t) feeds back into \\lambda(t). With feedback one gets the Sagawa–Ueda generalisation, not JE itself . A6 — Technical regularity. The phase space carries an involution \\mathcal T implementing time-reversal, Z(\\lambda) is finite at every \\lambda visited, and H(\\cdot;\\lambda) is bounded below. These are the hypotheses that make the partition-function manipulations below legitimate. Crooks first, Jarzynski as the first moment It is cleaner — and historically honest — to derive Crooks's detailed fluctuation theorem first and obtain JE as its first exponential moment [10, 9]. Let \\mathcal P F[z(\\cdot)] denote the path measure for the forward protocol, z(0)\\sim\\rho 0. Let \\bar z(t)=\\mathcal T z(\\tau-t) and run the reverse protocol \\bar\\lambda(t)=\\lambda(\\tau-t) with \\bar z(0) drawn from the equilibrium end-state \\rho \\tau^{\\rm eq}(z)=e^{-\\beta H(z;\\lambda \\tau)}/Z(\\lambda \\tau). Under A2 — in either Hamiltonian or stochastic incarnation — the path weights obey microscopic reversibility: Energy bookkeeping closes the loop. For closed Hamiltonian flow, since \\{H,H\\}=0 on the flow. (In the Markov form, the heat absorbed from the bath, Q, cancels in exactly the same place once detailed balance is invoked, giving W = \\Delta H - Q.) Substituting and using Z(\\lambda \\tau)/Z(\\lambda 0)=e^{-\\beta\\Delta F} gives Multiplying both sides by e^{-\\beta W}P R(-W) and integrating, with the final equality just the normalisation of P R. JE is the first exponential moment of Crooks's identity, no more and no less; Jensen's inequality immediately recovers \\langle W\\rangle\\ge\\Delta F, the Clausius bound, as a corollary. Figure: The Jarzynski (inclusive) and Bochkov–Kuzovlev (exclusive) work definitions differ by a single boundary contribution. That boundary term is exactly the \\Delta F that appears on the right of (JE) and is absent from (BK), so the two identities are not the same statement — conflating them is the source of recurrent sign and factor-of-two errors in single-molecule analyses . What A4 buys, and what it costs The exclusive form (BK) of [1, 2] uses W 0=\\int f\\,\\dot x\\, dt with H 0 time-independent, so there is simply no \\Delta F to recover — the system Hamiltonian itself is not dragged. The inclusive form (JE) folds the coupling -f(t)x into H(z;\\lambda) and treats \\lambda=f as the protocol; the cost of that bookkeeping is an extra boundary term that pulls \\Delta F down from the partition-function ratio. Jarzynski's 2007 side-by-side reading is unambiguous; the textbook literature has still not absorbed it. Quantum and strong-coupling caveats to A4 and A6 For quantum systems A4 must be sharpened: there is no Hermitian \\hat W whose eigenvalues are trajectory works, and JE survives only when work is defined by the two-projective-measurement (TPM) protocol W=E n^{\\lambda \\tau}-E m^{\\lambda 0} on the energy bases of H(\\lambda 0) and H(\\lambda \\tau) [19, 20, 21]. Under strong coupling, the decomposition H {\\rm tot}=H S+H B+H {SB}(\\lambda) forces \\Delta F to be the bare-system free-energy difference computed from a Hamiltonian of mean force; using the naive F S derived from H S alone breaks JE by a coupling-energy boundary term that is again of the inclusive/exclusive type [22, 23]. These are not refinements — they are the price of stating A1–A6 honestly. 3. Strict Conditions \u0026 Failure Modes: Where Each Aᵢ Breaks 3. Strict Conditions \u0026 Failure Modes: Where Each Aᵢ Breaks The derivation of §2 looks pristine, but it rests on six load-bearing assumptions A1–A6. Each can — and routinely does — fail in real experiments and simulations. I take them in order, name the regime in which the fracture opens, and quote the correction term where one is known. A1 — Canonical initial preparation The identity is anchored at t=0 by \\rho(0)\\propto e^{-\\beta H(\\lambda 0)}. Replace this with an arbitrary \\rho 0 and the derivation acquires a relative-entropy defect: with D(\\cdot\\ \\cdot) the Kullback–Leibler divergence. For a quenched glassy state, an aged colloid, or a biopolymer pulled directly out of its growth buffer, this defect is unknown and can be many k BT, so the naïve estimator returns \\Delta F + k BT\\,D — an upper bound, not a measurement. The fix is operational: bracket each pull with a dwell longer than the slowest relaxation time of H(\\lambda 0). The bracketing protocol used in [13, 15] exists for precisely this reason. A2 — Markovian thermal bath at fixed \\beta The master-equation and Hamiltonian [6, 8] proofs both require auxiliary degrees of freedom obeying detailed balance at one and the same \\beta. Three breakages dominate the literature. 1. Athermal noise / active matter. A bath with a non-Boltzmann steady state (run-and-tumble swimmers, vibrated granulars, motor-driven cytoskeleton) injects energy by channels that do not appear in H. JE must be replaced by the integral fluctuation theorem for total entropy production [16, 17]; \\Delta F is no longer extractable. 2. Non-Markovian memory. Coloured noise with correlation time \\tau c comparable to or longer than the protocol time breaks the chain rule that turns W into a sum of independent kernel contributions. JE survives only after augmenting the state space with bath-memory variables that are usually unmeasurable. 3. Time-dependent temperature. A bath whose \\beta(t) drifts during the protocol invalidates the canonical anchor at every instant; the strong-coupling formulation with a Hamiltonian of mean force is then required, and the \"work\" of A4 ceases to coincide with \\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt. A3 — Protocol \\lambda(t) prescribed in advance If the experimenter measures the trajectory and steers \\lambda in response, the path measure ceases to be \\lambda-independent and the time-reversed protocol acquires a non-trivial Jacobian. The Sagawa–Ueda generalization replaces JE by where I is the mutual information acquired by the controller; the colloidal \"Szilárd staircase\" of Toyabe et al. is the canonical experimental check. Unintentional feedback through a finite-bandwidth force clamp — endemic to high-bandwidth optical tweezers — is a soft A3 violation that biases \\Delta F by roughly k BT per bit of inadvertent measurement. A4 — Inclusive (Hamiltonian) work convention Substituting the mechanical work W 0=\\int f\\cdot dx for the Hamiltonian work W=\\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt does not give JE — it gives Bochkov–Kuzovlev \\langle e^{-\\beta W 0}\\rangle=1 [1, 2]. The two differ by a boundary term, which for a harmonic trap of stiffness k pulled at constant velocity is \\tfrac12 k(x \\tau-\\lambda \\tau)^2-\\tfrac12 k(x 0-\\lambda 0)^2 — typically several k BT in tweezer geometries. Liphardt et al. and Collin et al. subtract this trap term explicitly; methods sections that omit it report a \\Delta F off by exactly \\langle W-W 0\\rangle. Jarzynski's 2007 reconciliation is the definitive untangling. A5 — Classical trajectory (or two-point quantum work) Quantum mechanically there is no Hermitian operator \\hat W whose eigenvalues are trajectory works . JE survives only when W is defined by two projective energy measurements at t=0 and t=\\tau . Replace projective by continuous, weak, or quantum-non-demolition monitoring and the identity fails: measurement back-action generates a stochastic entropy contribution absent in the classical proof. Any open-system extension to non-projective work protocols requires the full counting-statistics machinery, not JE. A6 — Bounded phase space and time-reversal symmetry The Hamiltonian proof integrates by parts over phase space, demanding either compactness or fast decay of \\rho {\\text{eq}}. Protocols that uncage the system (e.g., a tether detached without an outer confining potential) lose normalization on the reverse leg, and \\langle e^{-\\beta W}\\rangle diverges in expectation. Time-reversal antisymmetry under an external magnetic field \\vec B is the subtler failure: the reverse trajectory used by Crooks [10, 9] must be run at -\\vec B — the Casimir conjugate. Forgetting the field reversal turns the detailed FT into an approximate identity with a \\vec B-dependent error term, and JE inherits a systematic bias proportional to the Lorentz-asymmetric part of the dynamics. Absorbing states (irreversible chemistry, single-molecule rupture without rebinding) similarly destroy the involution \\theta^2=\\mathbf{1} underlying the path-ensemble derivation and require the surgery of . A7 (de facto) — Statistical convergence even when A1–A6 hold A theorem about a population average is not yet an estimator. The empirical is biased; Gore, Ritort \u0026 Bustamante showed the leading-order bias scales as with convergence demanding N\\gtrsim e^{\\beta W {\\text{diss}}}, where W {\\text{diss}}=\\langle W\\rangle-\\Delta F. For \\beta W {\\text{diss}}\\gtrsim 4\\!-\\!5 — routine in RNA pulling at experimentally accessible rates — one needs N\\gtrsim 10^2\\!-\\!10^4 trajectories merely to get within a k BT, and for \\beta W {\\text{diss}}\\gtrsim 10 the estimator is hopeless. This is why the Hummer–Szabo reweighting and the Crooks-symmetry / Bennett-acceptance-ratio analysis of forward+reverse data are the operational tools of the field; raw JE is a theorem about an estimator nobody can afford to sample. A1–A6 buy you the right to write the identity; A7 decides whether you ever measure it. 4. Signatures: Direct vs Indirect — Smoking Guns and Impostors 4. Signatures: Direct vs Indirect — Smoking Guns and Impostors A practitioner reading a paper that claims to have \"verified the Jarzynski equality\" or \"extracted ΔF from nonequilibrium pulls\" needs a triage rule: which observations actually pin down the identity, and which are consistent with it but equally consistent with garden-variety quasi-static thermodynamics, sampling noise, or outright artifact? The answer turns on whether the signature constrains the full work distribution or merely a moment of it. The direct signature: Crooks crossing The unambiguous smoking gun is the Crooks detailed fluctuation theorem [10, 9], verified over a window of work values that brackets \\Delta F. Two features make it diagnostic in a way no integral identity can match. First, the ratio is a pointwise statement: it must hold at every W in the overlap region, not only on average. Second, at W=\\Delta F the forward and reverse histograms must cross , P F(\\Delta F)=P R(-\\Delta F), and this crossing locates \\Delta F geometrically without exponential reweighting. Collin et al. (2005) is the canonical demonstration: an RNA hairpin (P5abc) pulled in both directions through its folding transition produced P F(W) and P R(-W) whose log-ratio was linear in W with slope \\beta and intercept -\\beta\\Delta F, and whose crossing reproduced the equilibrium \\Delta G obtained from quasi-static pulls to within \\sim 0.6\\,k BT. Crucially, their fastest protocol was demonstrably out of equilibrium — \\langle W F\\rangle - \\langle W R\\rangle comprised many k BT of dissipation — yet the crossing point did not move. That invariance under protocol speed is the part no equilibrium identity can mimic. Figure: The Crooks-crossing diagnostic. The forward work histogram P F(W) (blue) and the reflected reverse histogram P R(-W) (orange) intersect at W=\\Delta F regardless of protocol speed; the log-ratio must be linear in W with slope \\beta. The rare-event tails (red) are the trajectories that dominate the JE exponential average and are precisely where the histograms have the worst statistics. Indirect signatures and their impostors (i) \\langle W\\rangle \\approx \\Delta F for slow pulls. This is the weakest indirect signature, because the Clausius inequality \\langle W\\rangle \\geq \\Delta F becomes tight quasi-statically by definition . Observing it in the slow limit confirms only that you have approached equilibrium, not that the equality \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F} holds away from it. The distinguishing test is the variance : in the linear-response regime \\langle W\\rangle - \\Delta F = \\beta\\sigma W^2/2 (fluctuation–dissipation in disguise [24, 3]), so a paper claiming JE verification by mean-work matching alone, without reporting \\sigma W^2 and checking this relation, is not reporting evidence for the equality — it is reporting evidence for thermodynamics. (ii) Negative-work events observed. Headlines about \"transient second-law violations\" misidentify the signature. Negative work — trajectories with W\u003c\\Delta F, or even W\u003c0 — must occur for \\langle e^{-\\beta W}\\rangle to equal e^{-\\beta\\Delta F} when \\langle W\\rangle \\Delta F; their absence falsifies JE. But their presence is not a smoking gun. Position-detector drift, miscalibrated trap stiffness, and low-pass filtering of force traces all manufacture apparent negative-work events with no thermodynamic content. The discriminating check is symmetry under protocol reversal: genuine fluctuation events satisfy P(W)/P R(-W) = e^{\\beta(W-\\Delta F)} across the negative-W tail, while drift-induced events do not — they sit asymmetrically in the forward histogram and have no counterpart in the reverse one. A reverse protocol with the same calibration is therefore mandatory; a single-direction measurement cannot distinguish a Bochkov–Kuzovlev-style fluctuation from a baseline offset. (iii) Hummer–Szabo reweighted profiles matching equilibrium. The weighted-histogram reconstruction turns trajectory ensembles into a position-dependent PMF G(x). When the resulting G(x) agrees with an equilibrium PMF obtained by umbrella sampling or by very slow pulls, this is consistent with JE but does not isolate it: umbrella sampling reproduces the same G(x) by construction, and a poorly converged HS reconstruction can also agree by accident if the bias kernel washes out the rare-event contribution. The diagnostic that separates a real JE-based reconstruction from a lucky overlap is the work histogram itself: the trajectory-by-trajectory P(W;x) at each pulling coordinate must exhibit a low-W tail rich enough that the reweighting is not dominated by a handful of samples. The Gore–Ritort–Bustamante bias bound \\Delta F {\\text{est}} - \\Delta F \\sim \\beta\\sigma W^2/(2N) must be reported and shown to be sub-k BT; otherwise the agreement is fortuitous. The non-negotiable triage rule A single forward-only JE estimate, without a reverse protocol, without a Crooks-crossing check, and without a reported work-variance budget, is not a verification of the equality. It is at best an estimator that may or may not have converged. The literature contains many such reports — \\Delta F extracted from -k BT\\ln\\langle e^{-\\beta W}\\rangle over \\mathcal{O}(10^2) pulls with \\sigma W \\gtrsim 3\\,k BT — and the bias bound [14, 25] shows these are statistically indistinguishable from the trivial estimate \\langle W\\rangle minus a fudge factor. The smoking gun is the Crooks crossing; everything else is circumstantial. 5. Use \u0026 Abuse: Meaning Drift in the Stochastic-Thermodynamics Literature 5. Use \u0026 Abuse: Meaning Drift in the Stochastic-Thermodynamics Literature The equality \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F} has acquired the worst kind of fame: it is invoked far more often than it is satisfied. Below is a field guide to the five abuse patterns I see most reliably in published work, followed by a triage checklist for the reader. 5.1 The unidirectional-with-N≈10³ paper A typical offender reports \\Delta F as -\\beta^{-1}\\ln(N^{-1}\\sum i e^{-\\beta W i}) from N \\sim 10^2–10^3 forward pulls and quotes a standard-error-of-the-mean as if the estimator were Gaussian. Gore, Ritort \u0026 Bustamante showed in 2003 that the bias of the JE estimator in the large-N Gaussian-work limit goes as so for \\beta\\sigma W of order a few — routine in SMD pulls of biomolecules — even N=10^3 is wildly insufficient and the bias dwarfs the reported error bar. The estimator is dominated by the rare W \\lesssim \\Delta F trajectories, whose sampling probability falls as \\sim e^{-\\beta\\sigma W^{2}/2}. The diagnostic that should accompany every JE-based \\Delta F — but rarely does — is a side-by-side plot of \\sigma W^{2}/2 against \\langle W\\rangle - \\Delta F to demonstrate that the dissipation is small enough for the estimator to have converged, or, failing that, the use of Bennett acceptance ratio on paired forward/reverse work [10, 11] instead of the bare JE average. 5.2 Mechanical-work substitution: the silent Bochkov–Kuzovlev slip The work in \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F} is the Hamiltonian (inclusive) work not the mechanical work W 0 = \\int F\\cdot dx done by the external force on the system's coordinate. The two differ by the boundary term \\Delta(\\lambda\\,\\partial H/\\partial\\lambda)\\rvert {0}^{\\tau} — for a harmonic trap of stiffness k pulled from \\lambda 0 to \\lambda \\tau, this is \\tfrac{1}{2}k(\\lambda \\tau^{2}-\\lambda 0^{2}) minus cross terms in the trap–molecule extension. Plug W 0 in where W should be and the relation you have actually evaluated is the Bochkov–Kuzovlev identity \\langle e^{-\\beta W 0}\\rangle = 1 [1, 2], not Jarzynski's. The \"free energy\" you recover is shifted by exactly that boundary term, and the discrepancy is silent because both sides of the identity remain self-consistent. Jarzynski's own 2007 Comptes Rendus clarification singled out this conflation as the source of the priority confusion; the methods sections of single-molecule pulling papers continue to be vague about which convention is in use. 5.3 \"Quantum Jarzynski\" via continuous weak measurement Kurchan and Tasaki defined quantum work through two projective energy measurements at t=0 and t=\\tau on H(\\lambda 0) and H(\\lambda \\tau) [20, 21]; Talkner, Lutz \u0026 Hänggi later made the point sharp: there is no Hermitian operator \\hat W whose eigenvalues are trajectory works — work is not an observable . Schemes that build a \"quantum work distribution\" from continuous weak measurement, quantum-jump unravellings, or post-selected trajectories satisfy the equality only when they are demonstrably equivalent to the two-projective-measurement (TPM) protocol — generically they are not, because weak monitoring backaction destroys the coherences whose energy content is precisely what the TPM construction integrates over. Reviews [26, 27, 28, 29] take care to flag this; experimental papers claiming to \"verify the quantum Jarzynski equality\" with continuous monitoring typically do not, and one should check whether their estimator is built from TPM-equivalent statistics before crediting the result. 5.4 \"Generalized second law\" inflation JE is not a generalization of the second law to arbitrary initial conditions. It is an exact identity for a system prepared in the canonical distribution of H(\\lambda 0) at temperature \\beta^{-1}, then driven along an arbitrary \\lambda(t). Strip that initial condition — start from a non-equilibrium steady state, a pure state, a microcanonical shell, or anything with feedback-induced correlations between system and protocol — and the bare identity fails. The correct generalization for measurement-and-feedback protocols is Sagawa \u0026 Ueda's relation , where I is the stochastic mutual information acquired by the controller (Sagawa \u0026 Ueda, PRL 2010, arXiv:0907.4914). Toyabe et al. verified this experimentally on a Maxwell-demon colloidal system; papers reporting \"violations of the second law\" while quoting bare JE in feedback experiments have simply omitted the I term. 5.5 Triage checklist for a hollow claim When a paper asserts a JE-based result, check in this order. (i) Initial state: is the system explicitly equilibrated to H(\\lambda 0) at the stated \\beta? Absence of an equilibration step or a starting-state characterization is a red flag for A1 failure. (ii) Work convention: does the methods section specify W = \\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt, or is it silent and showing F\\cdot v integrals? Silence almost always means mechanical work — re-derive \\Delta F with the boundary correction before trusting the number. (iii) Convergence diagnostic: are \\sigma W^{2} and the Gore–Ritort–Bustamante bias bound reported, or only a SEM? (iv) Reverse protocol or BAR: is the result cross-checked against reverse pulls via the Crooks symmetry [10, 15] or BAR , or is it a single-direction average? (v) For quantum claims, is the work definition TPM, and if not, is equivalence to TPM proven? (vi) For feedback experiments, does the exponent include the measurement-information term I? A paper that fails (i)–(iii) is reporting a number whose error bar is fictional; a paper that fails (iv)–(vi) is reporting the wrong identity. 6. Status \u0026 the Believer's Checklist 6. Status \u0026 the Believer's Checklist As a theorem , \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F} is settled. The Hamiltonian derivation , the master-equation proof , the Langevin proof , the path-ensemble derivation , the Crooks parent identity , the quantum two-measurement extensions [20, 21, 31], and the Hamiltonian detailed FT are mutually consistent and have been independently re-derived from microscopic reversibility, from the integral fluctuation theorem for total entropy production , and from the Bochkov–Kuzovlev exclusive-work identity once the inclusive/exclusive boundary term is taken into account [1, 2, 3]. Seifert's 2012 review enshrined JE/Crooks as foundational identities of stochastic thermodynamics, and Sekimoto's monograph embedded them in the energetics framework. No one seriously contests the equality at the level of theorems. As practice , the situation is more honest if one admits that the field has quietly moved on. The dominant operational estimator in single-molecule pulling and in alchemical molecular dynamics is no longer the bare forward exponential average — it is the Bennett acceptance ratio (BAR) applied to bidirectional work data, justified by the Crooks symmetry [10, 15] and by the Gore–Ritort–Bustamante bias analysis . The reason is the one written into the equation itself: \\langle e^{-\\beta W}\\rangle N has finite-sample bias of order e^{\\beta\\sigma^2/2}/N, dominated by trajectories in the negative-work tail of P F(W), whose probability decays exponentially in the dissipation [14, 25]. BAR uses both histograms simultaneously and saturates the Cramér–Rao bound for the work-distribution estimator class; the Crooks crossing P F(W)=P R(-W) at W=\\Delta F further provides a low-variance graphical estimator centered on the peaks rather than the tails . A 2025 optical-tweezers review confirms this consolidation: bidirectional CFT/BAR is the recommended practice; the unidirectional JE estimator is retained only as a diagnostic (Ribezzi-Crivellari \u0026 Ritort, arXiv:2503.20894). The same migration has happened in alchemical free-energy calculations, where pmx-style bidirectional pipelines built on CHARMM and similar force fields default to BAR or MBAR. Yet methods sections continue to advertise the analysis as \"Jarzynski.\" That is not entirely wrong — BAR is a maximum-likelihood estimator for \\Delta F derived from Crooks, which contains JE as its first cumulant — but it conflates a theorem with an estimator and obscures which assumptions are actually being tested. The result is a body of literature in which the brand name \"Jarzynski equality\" travels far beyond the regime where the equality itself is the workhorse. The Believer's Checklist AETHER demands the following eight items, explicitly, of any paper claiming \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F} or extracting \\Delta F from nonequilibrium work data. Their absence is not a stylistic complaint; each one is a documented failure mode (§§3–5). 1. Work convention, stated up front. Inclusive Hamiltonian W=\\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt (gives \\Delta F on the RHS) versus exclusive mechanical W 0=\\int f\\cdot\\dot x\\,dt (gives 1 on the RHS, à la Bochkov–Kuzovlev). The two differ by a boundary term that is not small at large extensions [1, 2, 3]. If the paper does not write the equation it actually integrated, the result cannot be audited. 2. Initial canonical preparation, documented at the stated \\beta. JE requires the initial ensemble to be the Gibbs distribution of H(\\lambda 0) at the specified temperature. Equilibration time, thermometry, and the test used to confirm equilibrium (e.g., reversibility of a slow back-and-forth cycle, agreement of forward and reverse mean works with \\Delta F) must be reported. 3. Forward and reverse work histograms, with a Crooks-crossing test. P F(W) and P R(-W) should be plotted together; the crossing must lie within statistical error of \\Delta F. Absence of a reverse protocol is a red flag, not a methodological convenience [10, 15]. 4. Reported work variance \\sigma^2 and the bias estimate \\sim e^{\\beta\\sigma^2/2}/N. If \\sigma exceeds \\sim 3\\,k BT at the available N, the bare forward JE estimator is uncontrolled [14, 25]. The paper should either show that \\beta\\sigma^2/2 \\ll \\ln N or explain why it does not need to. 5. BAR (or Hummer–Szabo weighted-histogram reweighting) cross-check, not the bare \\langle e^{-\\beta W}\\rangle N. BAR on bidirectional data is the operational gold standard [14, 11, 15]; Hummer–Szabo PMF reconstruction is the standard for spatial profiles . Reporting only the forward exponential average without one of these is, in 2026, an anachronism. 6. For quantum claims, an explicit two-projective-measurement protocol. Energy measurements at t=0 and t=\\tau on the system + bath (or appropriate decomposition for open systems ), with the work distribution defined as the difference of measured eigenvalues [19, 20, 21]. Continuous-monitoring or weak-measurement \"work\" does not in general satisfy JE. 7. For feedback or information-driven protocols, the explicit mutual-information term. Sagawa–Ueda type generalizations add I inside the exponential; the bare JE form is invalid under measurement-conditioned protocols. The paper must state which mutual information is being tracked and how it was estimated. 8. A statement of which assumptions A1–A6 from §2 are assumed and which are tested. Time-reversal symmetry, canonical initial state, controlled \\lambda(t), weak coupling or strong-coupling correction , Markovian bath (or absence thereof), and finite work moments. Papers that test some and assume others should say which is which. A paper that satisfies all eight is doing stochastic thermodynamics. A paper that satisfies fewer than four is, charitably, doing branding. The AETHER Verdict The AETHER Verdict I will state my position cleanly. The Jarzynski equality is one of the few results in modern statistical mechanics that is simultaneously a genuine theorem, a practical disappointment, and a sociological case study in citation drift. All three things are true and the literature usually picks one. (a) What I defend with my reputation The identity itself , in the inclusive-work convention, on a classical system prepared in the canonical ensemble of H(\\lambda 0) and evolved by a Hamiltonian (or detailed-balanced Markov) dynamics with a deterministic protocol \\lambda(t), is rigorously true. The Hamiltonian derivation , the Markov derivation , the Langevin derivation , and the path-ensemble derivation are mutually consistent and leave no wiggle room. I also defend the Crooks fluctuation theorem as the structurally correct object: P F(W)/P R(-W) = e^{\\beta(W-\\Delta F)} is the parent statement, JE is its first moment, and Jensen on JE returns Clausius. Anyone teaching this material should derive Crooks first and present JE as a corollary, not the reverse. I will also defend, against considerable folklore to the contrary, that Bochkov–Kuzovlev (1977, 1981) and Jarzynski (1997) are not the same theorem . They differ by the boundary term \\lambda\\cdot\\partial \\lambda H\\big 0^\\tau; one lives in the exclusive-work convention with \\langle e^{-\\beta W 0}\\rangle=1, the other in the inclusive-work convention with \\Delta F on the right. Conflating them is a substantive error, not a notational one. (b) What is shakier than the literature admits 1. Initial-state preparation (A1). Almost every \"verification\" presumes a true canonical \\rho 0\\propto e^{-\\beta H(\\lambda 0)}. In single-molecule pulling the initial state is whatever the trap–bead–handle composite relaxes to, which is canonical for the composite , not for the molecular coordinate of interest. The reported \\Delta F is then the free-energy difference of the composite system, and the handle-stiffness correction is rarely propagated honestly. 2. Finite-sampling bias (A5/A6 in disguise). The Gore–Ritort–Bustamante scaling \\text{bias}\\sim e^{\\beta\\sigma^2/2}/N is treated as a footnote when it is the headline. For \\sigma\\gtrsim 4\\,k BT the raw JE estimator is statistical fiction; what people actually use, and should cite, is Hummer–Szabo reweighting or Bennett acceptance ratio on bidirectional data. 3. The quantum extension. The two-projective-measurement construction is internally consistent but it is not a measurement of work in any operational sense compatible with continuous monitoring, weak measurement, or open-system protocols. Calling the resulting object \"quantum work\" papers over the absence of a Hermitian \\hat W. The \"quantum JE is settled\" consensus is premature. 4. Strong coupling. Once the system–bath coupling is non-negligible, \\Delta F has to be defined via a Hamiltonian of mean force, and the equality only holds for that free energy — a distinction routinely lost between Eq. (1) and the discussion section. (c) Three open questions I would actually work on, ranked 1. An operational, measurement-model-independent definition of quantum work that reduces to TPM in the projective limit and to stochastic-thermodynamic work classically. — Because without it, every quantum-JE experiment is measuring an artifact of its detector. 2. Sharp finite-sample bounds on \\Delta F estimators under known tail behavior of P(W) , replacing the Gore–Ritort heuristic with a concentration inequality. — Because experimentalists need a stopping rule, not an asymptotic. 3. Jarzynski-type identities under genuine non-Markovian baths with memory kernels K(t) not derivable from a Caldeira–Leggett embedding. — Because biological environments are exactly this case and current proofs route through embeddings that beg the question. (d) Reading path 1. Bochkov \u0026 Kuzovlev (1977, 1981) — to see the exclusive-work identity in its original form and understand what Jarzynski did not rediscover. 2. Jarzynski, PRL 1997 — the inclusive-work statement, read carefully for the canonical-initial-state assumption that the abstract elides. 3. Crooks, J. Stat. Phys. 1998 — the path-ensemble derivation, which is the right conceptual home; the 1999 PRE is a cleaner write-up but this is where the structure is. 4. Jarzynski, C. R. Physique 2007 — his own priority-clarifying paper distinguishing the two work conventions; the single most useful document in the credit audit. 5. Talkner, Lutz \u0026 Hänggi, PRE 2007 — the TPM construction and, read against Kurchan (cond-mat/0007360), the place where you decide whether you believe quantum work is a thing."}</script>
