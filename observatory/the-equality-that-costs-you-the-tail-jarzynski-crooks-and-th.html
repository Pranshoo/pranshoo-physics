orithm for the underlying free-energy profile from pulling trajectories", "who": "G. Hummer, A. Szabo", "work": "‘Free energy reconstruction from nonequilibrium single-molecule pulling experiments’, PNAS 98, 3658", "kind": "formalization", "ref": 11}, {"year": 2002, "event": "First experimental verification: an RNA hairpin pulled with optical tweezers reproduces ΔG to within k_BT even when driven far from equilibrium", "who": "J. Liphardt, S. Dumont, S. B. Smith, I. Tinoco Jr., C. Bustamante", "work": "Science 296, 1832", "kind": "observation", "ref": 13}, {"year": 2003, "event": "Gore, Ritort \u0026 Bustamante quantify the catastrophic finite-sample bias of the JE estimator — exponential averaging is dominated by rare negative-work trajectories, and a few hundred trials are typically not enough", "who": "J. Gore, F. Ritort, C. Bustamante", "work": "PNAS 100, 12564", "kind": "theory", "ref": 14}, {"year": 2005, "event": "Collin, Ritort, Jarzynski, Smith, Tinoco \u0026 Bustamante experimentally verify the Crooks symmetry on RNA, demonstrating that ΔF can be extracted from forward/reverse work histograms even where JE alone fails to converge", "who": "D. Collin et al.", "work": "Nature 437, 231", "kind": "observation", "ref": 17}, {"year": 2007, "event": "Jarzynski publishes a side-by-side reading of Bochkov–Kuzovlev and his own relation, identifying the inclusive vs exclusive work distinction as the source of the apparent priority dispute — the two identities are NOT the same statement", "who": "C. Jarzynski", "work": "‘Comparison of far-from-equilibrium work relations’, C. R. Physique 8, 495", "kind": "revival", "ref": 4}, {"year": 2005, "event": "Seifert states the integral fluctuation theorem for total entropy production along a single stochastic trajectory, embedding JE in the broader edifice of stochastic thermodynamics", "who": "U. Seifert", "work": "Phys. Rev. Lett. 95, 040602", "kind": "theory", "ref": 24}, {"year": 2012, "event": "Seifert's Rep. Prog. Phys. review consolidates stochastic thermodynamics with JE/Crooks as foundational identities, fixing the modern vocabulary used in the field", "who": "U. Seifert", "work": "Rep. Prog. Phys. 75, 126001", "kind": "naming", "ref": 21}], "neglected": [{"name": "G. N. Bochkov \u0026 Yu. E. Kuzovlev", "role": "Derived an exponential work identity ⟨e^{−βW₀}⟩ = 1 (exclusive-work form) in 1977 and a fully general nonlinear FDR hierarchy in 1981; the structural antecedent of JE, missed by Western literature until Jarzynski's own 2007 acknowledgment", "evidence": "Jarzynski's 2007 ‘Comparison of far-from-equilibrium work relations’ explicitly compares the two formulations and identifies the inclusive/exclusive work distinction as the only substantive difference", "ref": 4}, {"name": "Gavin E. Crooks", "role": "Author of the strictly stronger detailed fluctuation theorem from which JE follows by simple integration; his J. Stat. Phys. 1998 paper, written while he was still a Berkeley graduate student, is often skipped over in favor of the 1999 PRE", "evidence": "His J. Stat. Phys. paper predates the PRE and contains the path-ensemble logic the field eventually standardized on", "ref": 9}, {"name": "Gerhard Hummer \u0026 Attila Szabo", "role": "Converted the abstract identity into the weighted-histogram estimator that single-molecule experimentalists actually use; without their reweighting the equality would have stayed a theorist's curiosity", "evidence": "Their PNAS 2001 paper is the operational backbone of every modern JE/Crooks-based pulling analysis", "ref": 11}, {"name": "Jorge Kurchan \u0026 Hal Tasaki", "role": "Independently constructed the quantum two-projective-measurement work statistics in 2000, predating the heavily-cited Talkner–Lutz–Hänggi 2007 ‘work is not an observable’ formalization", "evidence": "Kurchan cond-mat/0007360 and Tasaki cond-mat/0009244 both appeared in summer 2000; [42] in the corpus is the later canonical clarification", "ref": 16}, {"name": "Denis J. Evans \u0026 Debra J. Searles", "role": "Their 1994 transient fluctuation theorem is the conceptual precursor of Crooks's relation in the deterministic-thermostat setting and is regularly omitted in favor of the Gallavotti–Cohen steady-state version", "evidence": "Evans–Cohen–Morriss PRL 1993 (numerical) and Evans–Searles 1994 (theory) collectively predate Jarzynski and Crooks", "ref": 5}], "conflations": [{"claim": "‘Jarzynski's equality is just the Bochkov–Kuzovlev identity rediscovered.'", "clarification": "They are NOT the same statement. Bochkov–Kuzovlev's ⟨e^{−βW₀}⟩ = 1 uses the EXCLUSIVE work W₀ = ∫ f·dx done by the external force, with f the mechanical perturbation and the Hamiltonian unchanged. Jarzynski's ⟨e^{−βW}⟩ = e^{−βΔF} uses the INCLUSIVE work W = ∫(∂H/∂λ)λ̇ dt computed with the time-dependent λ inside H. The two definitions differ by the boundary term Δ(λ·conjugate variable), which is precisely what makes ΔF appear on the right-hand side of Jarzynski but not Bochkov–Kuzovlev. Conflating the two has produced sign errors and factor-of-two confusions in the literature."}, {"claim": "‘The Jarzynski equality lets you extract ΔF from any far-from-equilibrium experiment.'", "clarification": "Formally yes, statistically no. The exponential average is dominated by trajectories whose work lies in the LOW-W tail at order ΔF − O(k_BT), and the probability of sampling such trajectories falls exponentially in the protocol's dissipation. The Gore–Ritort–Bustamante 2003 analysis shows the JE estimator's bias scales like e^{βσ²/2}/N (σ² the work variance) — for σ ≳ a few k_BT it is unusable. The Crooks symmetry (overlap of forward/reverse work histograms) is a better diagnostic; Bennett acceptance ratio applied to forward+reverse data is the correct estimator."}, {"claim": "‘Work in JE is the mechanical work F·dx done on the system.'", "clarification": "It is the Hamiltonian work W = ∫(∂H/∂λ)λ̇ dt evaluated along the trajectory, NOT mechanical force times displacement and NOT heat. For a harmonic trap pulled at constant velocity, these differ by a boundary energy that becomes the trap-stiffness × extension² difference between endpoints. Single-molecule analyses that conflate the two recover the wrong ΔF by exactly that boundary term."}, {"claim": "‘JE is a generalization of the second law.'", "clarification": "JE is a stronger statement than ⟨W⟩ ≥ ΔF, which follows by Jensen's inequality. But JE itself follows from microscopic reversibility plus an initial canonical distribution; it does not survive arbitrary initial conditions or non-Markovian feedback. The ‘generalization’ language obscures that JE is a statement specifically about systems whose initial state is the equilibrium Gibbs distribution of H(λ_0)."}, {"claim": "‘The quantum Jarzynski equality is straightforward.'", "clarification": "It holds only when work is defined via two projective energy measurements (Talkner–Lutz–Hänggi 2007). Continuous-monitoring or weak-measurement definitions of quantum work do NOT in general satisfy the equality, because quantum work is not an observable in the operator sense — there is no Hermitian Ŵ whose eigenvalues are the trajectory works."}], "sections": [{"id": "why-this-mattered", "title": "1. Why This Mattered: From Bochkov–Kuzovlev to Single-Molecule Pulling", "markdown": "## 1. Why This Mattered: From Bochkov–Kuzovlev to Single-Molecule Pulling\n\nFor half a century after Onsager, the second law remained essentially an *inequality*. The Clausius bound $\\Delta F \\le \\langle W\\rangle$ told you that work performed on a system held at temperature $T = (k_B\\beta)^{-1}$ was bounded below by the equilibrium free-energy change, the slack absorbing all dissipation. That bound is saturated only in the quasi-static limit; for any finite-rate protocol it gives you neither a way to *equate* equilibrium and nonequilibrium quantities, nor a recipe to extract the former from the latter. The Jarzynski equality\n\n$$\\big\\langle e^{-\\beta W}\\big\\rangle \\;=\\; e^{-\\beta\\Delta F}$$\n\nclosed that gap. With the ensemble started in the canonical distribution of $H(\\lambda_0)$, the average runs over an arbitrary protocol $\\lambda(t)$ for $t\\in[0,\\tau]$ — there is no quasi-static limit, no near-equilibrium expansion, no restriction on driving speed. As a category-shift for the second law this cannot be overstated: a sixty-year-old asymmetry between thermodynamic and statistical-mechanical accounting collapsed into a one-line identity, and an entire generation of single-molecule experiments acquired a license to extract $\\Delta F$ from trajectories that never came near equilibrium.\n\nThe genealogy, however, predates 1997 by two decades, and the credit ledger is not what most reviews claim.\n\n### The Soviet ancestor\n\nIn 1977, Bochkov and Kuzovlev derived the first exponential work identity inside a nonlinear fluctuation–dissipation framework [1], and in 1981 stated it in fully general form across two Physica A papers [2]:\n\n$$\\big\\langle \\exp[-\\beta W_0]\\big\\rangle = 1, \\qquad W_0 \\;=\\; \\int_0^\\tau f(t)\\,\\dot{x}(t)\\,dt.$$\n\nHere $f(t)$ is an external mechanical force acting on a system whose intrinsic Hamiltonian $H_0$ is *not* modified by the perturbation — the **exclusive**-work convention. The right-hand side is unity because the bare Hamiltonian is unchanged; there is no $\\Delta F$ to recover. The result then sat in the Soviet literature, unread by the Western nonequilibrium community that would later build stochastic thermodynamics on top of it. Jarzynski's own 2007 *Comptes Rendus* paper [3] is the cleanest acknowledgment: the Bochkov–Kuzovlev identity is structurally JE, but in the exclusive-work convention, and the difference — to which §2 and §5 return repeatedly — is exactly the boundary term that conjures $\\Delta F$ out of unity.\n\n### The Australian–Italian fluctuation-theorem branch\n\nA parallel lineage came from deterministic-thermostat molecular dynamics. Evans, Cohen and Morriss noticed in 1993, simulating a sheared fluid, that trajectories violating the second law occurred with a probability exponentially suppressed in their entropy production [4]. Gallavotti and Cohen lifted this to a theorem in 1995 under their *chaotic hypothesis* for thermostatted systems in nonequilibrium steady states [5]. The Evans–Searles 1994 transient fluctuation theorem (verify) gave the analogous transient statement. None of this spoke of free energy; the exponent was entropy production. But the structural lesson — that finite-time nonequilibrium statistics enforce an *equality* between forward and time-reversed trajectory probabilities — is precisely the one Crooks would soon import into the work-functional setting.\n\n### Jarzynski 1997 and the Hamiltonian core\n\nThe PRL [6] derived $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ from microscopic Hamiltonian dynamics with $W$ the **inclusive** work,\n\n$$W \\;=\\; \\int_0^\\tau \\frac{\\partial H}{\\partial \\lambda}\\,\\dot\\lambda(t)\\,dt,$$\n\nevaluated along each trajectory. The companion PRE [7] re-derived the identity inside a master-equation framework, decoupling the result from Hamiltonian flow and showing that Markovian stochastic dynamics with detailed balance at every frozen $\\lambda$ suffice. That second derivation is what travels into the single-molecule literature: nobody computes Hamiltonian flow for $10^{23}$ bath degrees of freedom; Langevin dynamics is the working model. A later, sharper Hamiltonian derivation [8] foreshadowed the detailed fluctuation theorem.\n\n### Crooks's path-ensemble bridge\n\nCrooks's 1998 *J. Stat. Phys.* paper [9] — written as a Berkeley graduate student and routinely under-cited relative to the 1999 PRE — recast JE as a statement about path-ensemble averages under a time-reversed measure. The 1999 PRE [10] proved the strictly stronger detailed fluctuation theorem\n\n$$\\frac{P_F(W)}{P_R(-W)} \\;=\\; e^{\\beta(W-\\Delta F)},$$\n\nfrom which JE drops out by integrating the numerator. Crooks made explicit what Jarzynski had implicitly assumed: microscopic reversibility plus an initial canonical distribution. Stated this way, the Evans–Cohen–Morriss and Gallavotti–Cohen results became visible as the steady-state cousins of the same identity, not a separate chapter.\n\n### From identity to instrument\n\nTwo papers turned the equality into a usable tool. Hummer and Szabo (2001) [11] inverted nonequilibrium pulling trajectories into the underlying potential of mean force $G(x)$ via the position-resolved reweighting\n\n$$e^{-\\beta G(x)} \\;\\propto\\; \\Big\\langle \\delta\\!\\big(x - x_t\\big)\\,e^{-\\beta W_t}\\Big\\rangle,$$\n\nstill the operational backbone of every modern JE-based analysis of single-molecule force data [12]. Liphardt, Dumont, Smith, Tinoco and Bustamante (2002) [13] then mechanically unfolded a single RNA hairpin with optical tweezers and recovered the equilibrium $\\Delta G$ to within $k_BT$ even when driven well above the molecule's relaxation rate. The instrument had teeth almost immediately: by 2003, Gore, Ritort and Bustamante [14] had quantified the catastrophic finite-sample bias — the exponential average is dominated by rare low-work trajectories, and the JE *estimator's* variance scales like $e^{\\beta\\sigma^2}/N$ in the work variance, even though the equality itself is exact. Two years later Collin et al. [15] verified the Crooks symmetry on RNA and showed that the forward/reverse histogram crossing yields $\\Delta F$ in regimes where raw JE fails to converge. Seifert's integral fluctuation theorem for trajectory entropy production [16] then embedded the whole structure inside what his 2012 review [17] consolidated as *stochastic thermodynamics*, fixing the modern vocabulary.\n\nThe arc from Bochkov–Kuzovlev's exclusive-work identity to a quantitative RNA folding free energy took twenty-five years and three independent traditions — Soviet nonlinear FDR, deterministic-thermostat MD, and the Hamiltonian–path-ensemble line — that almost never spoke to each other in real time. That they collapse onto a single one-line identity is what made the seminar worth holding."}, {"id": "the-physics-properly", "title": "2. The Physics, Properly: Hamiltonian Derivation with Numbered Assumptions", "markdown": "## 2. The Physics, Properly: Hamiltonian Derivation with Numbered Assumptions\n\nFix the cleanest possible setting: a classical system with phase-space point $z=(q,p)$ and Hamiltonian $H(z;\\lambda)$ depending parametrically on an externally controlled scalar $\\lambda$. The protocol $\\lambda(t)$ runs from $\\lambda_0$ at $t=0$ to $\\lambda_\\tau$ at $t=\\tau$. The two equilibrium ensembles that bookend the protocol have\n\n$$Z(\\lambda) = \\int dz\\, e^{-\\beta H(z;\\lambda)}, \\qquad F(\\lambda) = -\\beta^{-1}\\ln Z(\\lambda).$$\n\nThe identity to derive is\n\n$$\\big\\langle e^{-\\beta W}\\big\\rangle_{F} = e^{-\\beta \\Delta F}, \\qquad \\Delta F \\equiv F(\\lambda_\\tau)-F(\\lambda_0). \\tag{JE}$$\n\n### The six assumptions, named once and for all\n\n**A1 — Canonical initial state.** $\\rho_0(z) = e^{-\\beta H(z;\\lambda_0)}/Z(\\lambda_0)$. JE is a statement about an ensemble of trajectories that *start* exactly here; nothing about the final state is assumed [6, 8].\n\n**A2 — Microscopically reversible dynamics.** Either (a) closed Hamiltonian flow on an extended system+bath phase space, or (b) Markovian system-only dynamics with a kernel $P_t(z\\!\\to\\! z';\\lambda)$ that satisfies instantaneous detailed balance with respect to $e^{-\\beta H(\\cdot;\\lambda)}$ at every fixed $\\lambda$ [7, 8]. The master-equation route of [7] confirms that JE does not hinge on any particular microscopic model.\n\n**A3 — Prescribed external protocol.** $\\lambda(t)$ is a deterministic function of time, not a dynamical variable; it carries no thermal noise and does not respond to $z(t)$.\n\n**A4 — Inclusive (Hamiltonian) work.** Work is\n\n$$W[z(\\cdot)] = \\int_0^\\tau \\frac{\\partial H}{\\partial \\lambda}\\!\\big(z(t);\\lambda(t)\\big)\\,\\dot\\lambda(t)\\, dt, \\tag{1}$$\n\n*not* mechanical force times displacement [6, 3]. This is the choice that puts $\\Delta F$ on the right-hand side.\n\n**A5 — No feedback.** The protocol is fixed before the trajectory begins; no measurement on $z(t)$ feeds back into $\\lambda(t)$. With feedback one gets the Sagawa–Ueda generalisation, not JE itself [18].\n\n**A6 — Technical regularity.** The phase space carries an involution $\\mathcal T$ implementing time-reversal, $Z(\\lambda)$ is finite at every $\\lambda$ visited, and $H(\\cdot;\\lambda)$ is bounded below. These are the hypotheses that make the partition-function manipulations below legitimate.\n\n### Crooks first, Jarzynski as the first moment\n\nIt is cleaner — and historically honest — to derive Crooks's detailed fluctuation theorem first and obtain JE as its first exponential moment [10, 9]. Let $\\mathcal P_F[z(\\cdot)]$ denote the path measure for the *forward* protocol, $z(0)\\sim\\rho_0$. Let $\\bar z(t)=\\mathcal T z(\\tau-t)$ and run the *reverse* protocol $\\bar\\lambda(t)=\\lambda(\\tau-t)$ with $\\bar z(0)$ drawn from the *equilibrium* end-state $\\rho_\\tau^{\\rm eq}(z)=e^{-\\beta H(z;\\lambda_\\tau)}/Z(\\lambda_\\tau)$.\n\nUnder A2 — in either Hamiltonian or stochastic incarnation — the path weights obey microscopic reversibility:\n\n$$\\frac{\\mathcal P_F[z(\\cdot)]}{\\mathcal P_R[\\bar z(\\cdot)]} = \\frac{e^{-\\beta H(z(0);\\lambda_0)}/Z(\\lambda_0)}{e^{-\\beta H(z(\\tau);\\lambda_\\tau)}/Z(\\lambda_\\tau)}.$$\n\nEnergy bookkeeping closes the loop. For closed Hamiltonian flow,\n\n$$H(z(\\tau);\\lambda_\\tau)-H(z(0);\\lambda_0)=\\int_0^\\tau\\!\\!\\frac{dH}{dt}\\,dt=\\int_0^\\tau\\!\\!\\frac{\\partial H}{\\partial \\lambda}\\dot\\lambda\\, dt = W,$$\n\nsince $\\{H,H\\}=0$ on the flow. (In the Markov form, the heat absorbed from the bath, $Q$, cancels in exactly the same place once detailed balance is invoked, giving $W = \\Delta H - Q$.) Substituting and using $Z(\\lambda_\\tau)/Z(\\lambda_0)=e^{-\\beta\\Delta F}$ gives\n\n$$\\boxed{\\;\\frac{P_F(W)}{P_R(-W)} = e^{\\beta(W-\\Delta F)}\\;} \\tag{Crooks}$$\n\nMultiplying both sides by $e^{-\\beta W}P_R(-W)$ and integrating,\n\n$$\\big\\langle e^{-\\beta W}\\big\\rangle_F = e^{-\\beta\\Delta F}\\!\\int\\! dW\\, P_R(-W) = e^{-\\beta\\Delta F},$$\n\nwith the final equality just the normalisation of $P_R$. JE is the first exponential moment of Crooks's identity, no more and no less; Jensen's inequality immediately recovers $\\langle W\\rangle\\ge\\Delta F$, the Clausius bound, as a corollary.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eInclusive (Jarzynski) vs exclusive (Bochkov–Kuzovlev) work bookkeeping\u003c/title\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"660\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ccircle cx=\"60\" cy=\"60\" r=\"6\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"660\" cy=\"60\" r=\"6\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"60\" y=\"40\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003et = 0, λ = λ₀\u003c/text\u003e\u003ctext x=\"660\" y=\"40\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003et = τ, λ = λ_τ\u003c/text\u003e\u003ctext x=\"360\" y=\"40\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eexternally driven protocol λ(t) (A3)\u003c/text\u003e\u003crect x=\"40\" y=\"100\" width=\"310\" height=\"150\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"55\" y=\"125\" fill=\"#7ee0a3\" font-size=\"16\"\u003eInclusive — Jarzynski\u003c/text\u003e\u003ctext x=\"55\" y=\"155\" fill=\"#e8e6e1\" font-size=\"14\"\u003eH(z; λ) carries the perturbation\u003c/text\u003e\u003ctext x=\"55\" y=\"185\" fill=\"#e8e6e1\" font-size=\"15\"\u003eW = ∫₀^τ (∂H/∂λ) λ̇ dt\u003c/text\u003e\u003ctext x=\"55\" y=\"215\" fill=\"#e8e6e1\" font-size=\"14\"\u003eΔF = F(λ_τ) − F(λ₀) ≠ 0\u003c/text\u003e\u003ctext x=\"55\" y=\"240\" fill=\"#e8e6e1\" font-size=\"15\"\u003e⟨e^(−βW)⟩ = e^(−βΔF)\u003c/text\u003e\u003crect x=\"370\" y=\"100\" width=\"310\" height=\"150\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"385\" y=\"125\" fill=\"#ffb86b\" font-size=\"16\"\u003eExclusive — Bochkov–Kuzovlev\u003c/text\u003e\u003ctext x=\"385\" y=\"155\" fill=\"#e8e6e1\" font-size=\"14\"\u003eH₀ fixed; H_tot = H₀ − f(t) x\u003c/text\u003e\u003ctext x=\"385\" y=\"185\" fill=\"#e8e6e1\" font-size=\"15\"\u003eW₀ = ∫₀^τ f(t) ẋ dt\u003c/text\u003e\u003ctext x=\"385\" y=\"215\" fill=\"#e8e6e1\" font-size=\"14\"\u003eno parameter in H₀ → ΔF = 0\u003c/text\u003e\u003ctext x=\"385\" y=\"240\" fill=\"#e8e6e1\" font-size=\"15\"\u003e⟨e^(−βW₀)⟩ = 1\u003c/text\u003e\u003cline x1=\"350\" y1=\"175\" x2=\"370\" y2=\"175\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"370,175 360,170 360,180\" fill=\"#ff7a90\"/\u003e\u003cline x1=\"370\" y1=\"175\" x2=\"350\" y2=\"175\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"350,175 360,170 360,180\" fill=\"#ff7a90\"/\u003e\u003crect x=\"60\" y=\"285\" width=\"600\" height=\"90\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"360\" y=\"312\" fill=\"#ff7a90\" font-size=\"16\" text-anchor=\"middle\"\u003eBoundary term linking the two conventions\u003c/text\u003e\u003ctext x=\"360\" y=\"340\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eW − W₀ = − [ f(t) · x(t) ]₀^τ\u003c/text\u003e\u003ctext x=\"360\" y=\"365\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eprecisely the term that turns ⟨e^(−βW₀)⟩ = 1 into ⟨e^(−βW)⟩ = e^(−βΔF)\u003c/text\u003e\u003c/svg\u003e\n*Figure: The Jarzynski (inclusive) and Bochkov–Kuzovlev (exclusive) work definitions differ by a single boundary contribution. That boundary term is exactly the $\\Delta F$ that appears on the right of (JE) and is absent from (BK), so the two identities are not the same statement — conflating them is the source of recurrent sign and factor-of-two errors in single-molecule analyses [3].*\n\n### What A4 buys, and what it costs\n\nThe exclusive form (BK) of [1, 2] uses $W_0=\\int f\\,\\dot x\\, dt$ with $H_0$ time-independent, so there is simply no $\\Delta F$ to recover — the system Hamiltonian itself is not dragged. The inclusive form (JE) folds the coupling $-f(t)x$ into $H(z;\\lambda)$ and treats $\\lambda=f$ as the protocol; the cost of that bookkeeping is an extra boundary term that pulls $\\Delta F$ down from the partition-function ratio. Jarzynski's 2007 side-by-side reading [3] is unambiguous; the textbook literature has still not absorbed it.\n\n### Quantum and strong-coupling caveats to A4 and A6\n\nFor quantum systems A4 must be sharpened: there is no Hermitian $\\hat W$ whose eigenvalues are trajectory works, and JE survives only when work is defined by the *two-projective-measurement* (TPM) protocol $W=E_n^{\\lambda_\\tau}-E_m^{\\lambda_0}$ on the energy bases of $H(\\lambda_0)$ and $H(\\lambda_\\tau)$ [19, 20, 21]. Under strong coupling, the decomposition $H_{\\rm tot}=H_S+H_B+H_{SB}(\\lambda)$ forces $\\Delta F$ to be the *bare-system* free-energy difference computed from a Hamiltonian of mean force; using the naive $F_S$ derived from $H_S$ alone breaks JE by a coupling-energy boundary term that is again of the inclusive/exclusive type [22, 23]. These are not refinements — they are the price of stating A1–A6 honestly."}, {"id": "strict-conditions-failure-modes", "title": "3. Strict Conditions \u0026 Failure Modes: Where Each Aᵢ Breaks", "markdown": "## 3. Strict Conditions \u0026 Failure Modes: Where Each Aᵢ Breaks\n\nThe derivation of §2 looks pristine, but it rests on six load-bearing assumptions A1–A6. Each can — and routinely does — fail in real experiments and simulations. I take them in order, name the regime in which the fracture opens, and quote the correction term where one is known.\n\n### A1 — Canonical initial preparation\n\nThe identity is anchored at $t=0$ by $\\rho(0)\\propto e^{-\\beta H(\\lambda_0)}$. Replace this with an arbitrary $\\rho_0$ and the derivation acquires a relative-entropy defect:\n$$\\langle e^{-\\beta W}\\rangle_{\\rho_0}=e^{-\\beta\\Delta F}\\,e^{-D(\\rho_0\\|\\rho_{\\text{eq}})},$$\nwith $D(\\cdot\\|\\cdot)$ the Kullback–Leibler divergence. For a quenched glassy state, an aged colloid, or a biopolymer pulled directly out of its growth buffer, this defect is unknown and can be many $k_BT$, so the naïve estimator returns $\\Delta F + k_BT\\,D$ — an upper bound, not a measurement. The fix is operational: bracket each pull with a dwell longer than the slowest relaxation time of $H(\\lambda_0)$. The bracketing protocol used in [13, 15] exists for precisely this reason.\n\n### A2 — Markovian thermal bath at fixed $\\beta$\n\nThe master-equation [7] and Hamiltonian [6, 8] proofs both require auxiliary degrees of freedom obeying detailed balance at one and the same $\\beta$. Three breakages dominate the literature.\n\n1. **Athermal noise / active matter.** A bath with a non-Boltzmann steady state (run-and-tumble swimmers, vibrated granulars, motor-driven cytoskeleton) injects energy by channels that do not appear in $H$. JE must be replaced by the integral fluctuation theorem for total entropy production [16, 17]; $\\Delta F$ is no longer extractable.\n2. **Non-Markovian memory.** Coloured noise with correlation time $\\tau_c$ comparable to or longer than the protocol time breaks the chain rule that turns $W$ into a sum of independent kernel contributions. JE survives only after augmenting the state space with bath-memory variables that are usually unmeasurable.\n3. **Time-dependent temperature.** A bath whose $\\beta(t)$ drifts during the protocol invalidates the canonical anchor at every instant; the strong-coupling formulation [22] with a Hamiltonian of mean force is then required, and the \"work\" of A4 ceases to coincide with $\\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt$.\n\n### A3 — Protocol $\\lambda(t)$ prescribed in advance\n\nIf the experimenter measures the trajectory and steers $\\lambda$ in response, the path measure ceases to be $\\lambda$-independent and the time-reversed protocol acquires a non-trivial Jacobian. The Sagawa–Ueda generalization replaces JE by\n$$\\langle e^{-\\beta(W-\\Delta F)-I}\\rangle=1,\\qquad \\langle W\\rangle\\ge\\Delta F-k_BT\\,\\langle I\\rangle,$$\nwhere $I$ is the mutual information acquired by the controller; the colloidal \"Szilárd staircase\" of Toyabe et al. [18] is the canonical experimental check. *Unintentional* feedback through a finite-bandwidth force clamp — endemic to high-bandwidth optical tweezers — is a soft A3 violation that biases $\\Delta F$ by roughly $k_BT$ per bit of inadvertent measurement.\n\n### A4 — Inclusive (Hamiltonian) work convention\n\nSubstituting the mechanical work $W_0=\\int f\\cdot dx$ for the Hamiltonian work $W=\\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt$ does not give JE — it gives Bochkov–Kuzovlev $\\langle e^{-\\beta W_0}\\rangle=1$ [1, 2]. The two differ by a boundary term,\n$$W-W_0=\\Delta\\bigl(\\lambda\\,\\partial H/\\partial\\lambda\\bigr)\\Big|_0^\\tau,$$\nwhich for a harmonic trap of stiffness $k$ pulled at constant velocity is $\\tfrac12 k(x_\\tau-\\lambda_\\tau)^2-\\tfrac12 k(x_0-\\lambda_0)^2$ — typically several $k_BT$ in tweezer geometries. Liphardt et al. [13] and Collin et al. [15] subtract this trap term explicitly; methods sections that omit it report a $\\Delta F$ off by exactly $\\langle W-W_0\\rangle$. Jarzynski's 2007 reconciliation [3] is the definitive untangling.\n\n### A5 — Classical trajectory (or two-point quantum work)\n\nQuantum mechanically there is no Hermitian operator $\\hat W$ whose eigenvalues are trajectory works [19]. JE survives only when $W$ is defined by two projective energy measurements at $t=0$ and $t=\\tau$ [23]. Replace projective by continuous, weak, or quantum-non-demolition monitoring and the identity fails: measurement back-action generates a stochastic entropy contribution absent in the classical proof. Any open-system extension to non-projective work protocols requires the full counting-statistics machinery, not JE.\n\n### A6 — Bounded phase space and time-reversal symmetry\n\nThe Hamiltonian proof integrates by parts over phase space, demanding either compactness or fast decay of $\\rho_{\\text{eq}}$. Protocols that uncage the system (e.g., a tether detached without an outer confining potential) lose normalization on the reverse leg, and $\\langle e^{-\\beta W}\\rangle$ diverges in expectation. Time-reversal antisymmetry under an external magnetic field $\\vec B$ is the subtler failure: the reverse trajectory used by Crooks [10, 9] must be run at $-\\vec B$ — the Casimir conjugate. Forgetting the field reversal turns the detailed FT into an approximate identity with a $\\vec B$-dependent error term, and JE inherits a systematic bias proportional to the Lorentz-asymmetric part of the dynamics. Absorbing states (irreversible chemistry, single-molecule rupture without rebinding) similarly destroy the involution $\\theta^2=\\mathbf{1}$ underlying the path-ensemble derivation and require the surgery of [9].\n\n### A7 (de facto) — Statistical convergence even when A1–A6 hold\n\nA theorem about a population average is not yet an estimator. The empirical\n$$\\widehat{\\Delta F}_N=-k_BT\\,\\ln\\!\\frac{1}{N}\\sum_{i=1}^N e^{-\\beta W_i}$$\nis biased; Gore, Ritort \u0026 Bustamante [14] showed the leading-order bias scales as\n$$\\langle\\widehat{\\Delta F}_N\\rangle-\\Delta F\\;\\sim\\;\\frac{k_BT}{2N}\\bigl(e^{\\beta^2\\sigma_W^2}-1\\bigr),$$\nwith convergence demanding $N\\gtrsim e^{\\beta W_{\\text{diss}}}$, where $W_{\\text{diss}}=\\langle W\\rangle-\\Delta F$. For $\\beta W_{\\text{diss}}\\gtrsim 4\\!-\\!5$ — routine in RNA pulling at experimentally accessible rates — one needs $N\\gtrsim 10^2\\!-\\!10^4$ trajectories merely to get within a $k_BT$, and for $\\beta W_{\\text{diss}}\\gtrsim 10$ the estimator is hopeless. This is why the Hummer–Szabo reweighting [11] and the Crooks-symmetry / Bennett-acceptance-ratio analysis of forward+reverse data [15] are the *operational* tools of the field; raw JE is a theorem about an estimator nobody can afford to sample. A1–A6 buy you the right to write the identity; A7 decides whether you ever measure it."}, {"id": "signatures-direct-vs-indirect", "title": "4. Signatures: Direct vs Indirect — Smoking Guns and Impostors", "markdown": "## 4. Signatures: Direct vs Indirect — Smoking Guns and Impostors\n\nA practitioner reading a paper that claims to have \"verified the Jarzynski equality\" or \"extracted ΔF from nonequilibrium pulls\" needs a triage rule: which observations actually pin down the identity, and which are consistent with it but equally consistent with garden-variety quasi-static thermodynamics, sampling noise, or outright artifact? The answer turns on whether the signature constrains the *full work distribution* or merely a moment of it.\n\n### The direct signature: Crooks crossing\n\nThe unambiguous smoking gun is the Crooks detailed fluctuation theorem [10, 9],\n\n$$\\frac{P_F(W)}{P_R(-W)} \\;=\\; e^{\\beta(W-\\Delta F)},$$\n\nverified over a window of work values that *brackets* $\\Delta F$. Two features make it diagnostic in a way no integral identity can match. First, the ratio is a pointwise statement: it must hold at every $W$ in the overlap region, not only on average. Second, at $W=\\Delta F$ the forward and reverse histograms must *cross*, $P_F(\\Delta F)=P_R(-\\Delta F)$, and this crossing locates $\\Delta F$ geometrically without exponential reweighting.\n\nCollin *et al.* (2005) [15] is the canonical demonstration: an RNA hairpin (P5abc) pulled in both directions through its folding transition produced $P_F(W)$ and $P_R(-W)$ whose log-ratio was linear in $W$ with slope $\\beta$ and intercept $-\\beta\\Delta F$, and whose crossing reproduced the equilibrium $\\Delta G$ obtained from quasi-static pulls to within $\\sim 0.6\\,k_BT$. Crucially, their fastest protocol was demonstrably *out of equilibrium* — $\\langle W_F\\rangle - \\langle W_R\\rangle$ comprised many $k_BT$ of dissipation — yet the crossing point did not move. That invariance under protocol speed is the part no equilibrium identity can mimic.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"60\" y1=\"40\" x2=\"60\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"370\" y=\"380\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003ework W (k_BT)\u003c/text\u003e\u003ctext x=\"20\" y=\"190\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 20 190)\"\u003eP(W)\u003c/text\u003e\u003cpath d=\"M 110 340 Q 200 320 240 240 Q 290 120 360 80 Q 420 130 470 260 Q 510 320 560 340\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.4\"/\u003e\u003cpath d=\"M 110 340 Q 170 320 220 250 Q 280 130 360 80 Q 430 130 480 250 Q 540 320 620 340\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.4\" stroke-dasharray=\"6 4\"/\u003e\u003cline x1=\"360\" y1=\"60\" x2=\"360\" y2=\"340\" stroke=\"#7ee0a3\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/\u003e\u003ccircle cx=\"360\" cy=\"80\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"360\" y=\"55\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003ecrossing at W = ΔF\u003c/text\u003e\u003ctext x=\"240\" y=\"200\" fill=\"#7aa2ff\" font-size=\"14\"\u003eP_F(W)\u003c/text\u003e\u003ctext x=\"470\" y=\"200\" fill=\"#ffb86b\" font-size=\"14\"\u003eP_R(−W)\u003c/text\u003e\u003ctext x=\"160\" y=\"330\" fill=\"#ff7a90\" font-size=\"13\"\u003erare neg-W tail\u003c/text\u003e\u003cline x1=\"155\" y1=\"325\" x2=\"200\" y2=\"305\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003ctext x=\"600\" y=\"330\" fill=\"#ff7a90\" font-size=\"13\"\u003erare large-W tail\u003c/text\u003e\u003cline x1=\"600\" y1=\"325\" x2=\"555\" y2=\"305\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003ctext x=\"105\" y=\"100\" fill=\"#e8e6e1\" font-size=\"13\"\u003elog P_F/P_R = β(W−ΔF)\u003c/text\u003e\u003ctext x=\"105\" y=\"120\" fill=\"#e8e6e1\" font-size=\"13\"\u003emust be straight, slope β\u003c/text\u003e\u003c/svg\u003e\n*Figure: The Crooks-crossing diagnostic. The forward work histogram $P_F(W)$ (blue) and the reflected reverse histogram $P_R(-W)$ (orange) intersect at $W=\\Delta F$ regardless of protocol speed; the log-ratio must be linear in $W$ with slope $\\beta$. The rare-event tails (red) are the trajectories that dominate the JE exponential average and are precisely where the histograms have the worst statistics.*\n\n### Indirect signatures and their impostors\n\n**(i) $\\langle W\\rangle \\approx \\Delta F$ for slow pulls.** This is the weakest indirect signature, because the Clausius inequality $\\langle W\\rangle \\geq \\Delta F$ becomes tight quasi-statically *by definition*. Observing it in the slow limit confirms only that you have approached equilibrium, not that the equality $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ holds away from it. The distinguishing test is the *variance*: in the linear-response regime $\\langle W\\rangle - \\Delta F = \\beta\\sigma_W^2/2$ (fluctuation–dissipation in disguise [24, 3]), so a paper claiming JE verification by mean-work matching alone, without reporting $\\sigma_W^2$ and checking this relation, is not reporting evidence for the equality — it is reporting evidence for thermodynamics.\n\n**(ii) Negative-work events observed.** Headlines about \"transient second-law violations\" misidentify the signature. Negative work — trajectories with $W\u003c\\Delta F$, or even $W\u003c0$ — must occur for $\\langle e^{-\\beta W}\\rangle$ to equal $e^{-\\beta\\Delta F}$ when $\\langle W\\rangle \u003e \\Delta F$; their absence falsifies JE. But their *presence* is not a smoking gun. Position-detector drift, miscalibrated trap stiffness, and low-pass filtering of force traces all manufacture apparent negative-work events with no thermodynamic content. The discriminating check is symmetry under protocol reversal: genuine fluctuation events satisfy $P(W)/P_R(-W) = e^{\\beta(W-\\Delta F)}$ across the negative-$W$ tail, while drift-induced events do not — they sit asymmetrically in the forward histogram and have no counterpart in the reverse one. A reverse protocol with the *same* calibration is therefore mandatory; a single-direction measurement cannot distinguish a Bochkov–Kuzovlev-style fluctuation from a baseline offset.\n\n**(iii) Hummer–Szabo reweighted profiles matching equilibrium.** The weighted-histogram reconstruction [11] turns trajectory ensembles into a position-dependent PMF $G(x)$. When the resulting $G(x)$ agrees with an equilibrium PMF obtained by umbrella sampling or by very slow pulls, this is *consistent* with JE but does not isolate it: umbrella sampling reproduces the same $G(x)$ by construction, and a poorly converged HS reconstruction can also agree by accident if the bias kernel washes out the rare-event contribution. The diagnostic that separates a real JE-based reconstruction from a lucky overlap is the work histogram itself: the trajectory-by-trajectory $P(W;x)$ at each pulling coordinate must exhibit a low-$W$ tail rich enough that the reweighting is not dominated by a handful of samples. The Gore–Ritort–Bustamante bias bound $\\Delta F_{\\text{est}} - \\Delta F \\sim \\beta\\sigma_W^2/(2N)$ [14] must be reported and shown to be sub-$k_BT$; otherwise the agreement is fortuitous.\n\n### The non-negotiable triage rule\n\nA single forward-only JE estimate, without a reverse protocol, without a Crooks-crossing check, and without a reported work-variance budget, is *not* a verification of the equality. It is at best an estimator that may or may not have converged. The literature contains many such reports — $\\Delta F$ extracted from $-k_BT\\ln\\langle e^{-\\beta W}\\rangle$ over $\\mathcal{O}(10^2)$ pulls with $\\sigma_W \\gtrsim 3\\,k_BT$ — and the bias bound [14, 25] shows these are statistically indistinguishable from the trivial estimate $\\langle W\\rangle$ minus a fudge factor. The smoking gun is the Crooks crossing; everything else is circumstantial."}, {"id": "use-and-abuse", "title": "5. Use \u0026 Abuse: Meaning Drift in the Stochastic-Thermodynamics Literature", "markdown": "## 5. Use \u0026 Abuse: Meaning Drift in the Stochastic-Thermodynamics Literature\n\nThe equality $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ has acquired the worst kind of fame: it is invoked far more often than it is satisfied. Below is a field guide to the five abuse patterns I see most reliably in published work, followed by a triage checklist for the reader.\n\n### 5.1 The unidirectional-with-N≈10³ paper\n\nA typical offender reports $\\Delta F$ as $-\\beta^{-1}\\ln(N^{-1}\\sum_i e^{-\\beta W_i})$ from $N \\sim 10^2$–$10^3$ forward pulls and quotes a standard-error-of-the-mean as if the estimator were Gaussian. Gore, Ritort \u0026 Bustamante [14] showed in 2003 that the bias of the JE estimator in the large-$N$ Gaussian-work limit goes as\n$$\n\\text{Bias} \\;\\approx\\; \\frac{1}{2N\\beta}\\!\\left(e^{\\beta^{2}\\sigma_{W}^{2}}-1\\right),\n$$\nso for $\\beta\\sigma_W$ of order a few — routine in SMD pulls of biomolecules — even $N=10^3$ is wildly insufficient and the bias dwarfs the reported error bar. The estimator is dominated by the rare $W \\lesssim \\Delta F$ trajectories, whose sampling probability falls as $\\sim e^{-\\beta\\sigma_W^{2}/2}$. The diagnostic that *should* accompany every JE-based $\\Delta F$ — but rarely does — is a side-by-side plot of $\\sigma_W^{2}/2$ against $\\langle W\\rangle - \\Delta F$ to demonstrate that the dissipation is small enough for the estimator to have converged, or, failing that, the use of Bennett acceptance ratio on paired forward/reverse work [10, 11] instead of the bare JE average.\n\n### 5.2 Mechanical-work substitution: the silent Bochkov–Kuzovlev slip\n\nThe work in $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ is the *Hamiltonian* (inclusive) work\n$$\nW \\;=\\; \\int_{0}^{\\tau} \\!\\frac{\\partial H}{\\partial \\lambda}\\,\\dot\\lambda\\,dt,\n$$\nnot the mechanical work $W_0 = \\int F\\cdot dx$ done by the external force on the system's coordinate. The two differ by the boundary term $\\Delta(\\lambda\\,\\partial H/\\partial\\lambda)\\rvert_{0}^{\\tau}$ — for a harmonic trap of stiffness $k$ pulled from $\\lambda_0$ to $\\lambda_\\tau$, this is $\\tfrac{1}{2}k(\\lambda_\\tau^{2}-\\lambda_0^{2})$ minus cross terms in the trap–molecule extension. Plug $W_0$ in where $W$ should be and the relation you have actually evaluated is the Bochkov–Kuzovlev identity $\\langle e^{-\\beta W_0}\\rangle = 1$ [1, 2], not Jarzynski's. The \"free energy\" you recover is shifted by exactly that boundary term, and the discrepancy is silent because both sides of the identity remain self-consistent. Jarzynski's own 2007 *Comptes Rendus* clarification [3] singled out this conflation as the source of the priority confusion; the methods sections of single-molecule pulling papers continue to be vague about which convention is in use.\n\n### 5.3 \"Quantum Jarzynski\" via continuous weak measurement\n\nKurchan and Tasaki defined quantum work through two projective energy measurements at $t=0$ and $t=\\tau$ on $H(\\lambda_0)$ and $H(\\lambda_\\tau)$ [20, 21]; Talkner, Lutz \u0026 Hänggi later made the point sharp: there is no Hermitian operator $\\hat W$ whose eigenvalues are trajectory works — work is not an observable [19]. Schemes that build a \"quantum work distribution\" from continuous weak measurement, quantum-jump unravellings, or post-selected trajectories satisfy the equality only when they are demonstrably equivalent to the two-projective-measurement (TPM) protocol — generically they are not, because weak monitoring backaction destroys the coherences whose energy content is precisely what the TPM construction integrates over. Reviews [26, 27, 28, 29] take care to flag this; experimental papers claiming to \"verify the quantum Jarzynski equality\" with continuous monitoring typically do not, and one should check whether their estimator is built from TPM-equivalent statistics before crediting the result.\n\n### 5.4 \"Generalized second law\" inflation\n\nJE is *not* a generalization of the second law to arbitrary initial conditions. It is an exact identity for a system prepared in the canonical distribution of $H(\\lambda_0)$ at temperature $\\beta^{-1}$, then driven along an arbitrary $\\lambda(t)$. Strip that initial condition — start from a non-equilibrium steady state, a pure state, a microcanonical shell, or anything with feedback-induced correlations between system and protocol — and the bare identity fails. The correct generalization for measurement-and-feedback protocols is Sagawa \u0026 Ueda's relation [18],\n$$\n\\langle e^{-\\beta(W-\\Delta F) - I}\\rangle = 1,\n$$\nwhere $I$ is the stochastic mutual information acquired by the controller ([Sagawa \u0026 Ueda, PRL 2010, arXiv:0907.4914](https://arxiv.org/abs/0907.4914)). Toyabe *et al.* [18] verified this experimentally on a Maxwell-demon colloidal system; papers reporting \"violations of the second law\" while quoting bare JE in feedback experiments have simply omitted the $I$ term.\n\n### 5.5 Triage checklist for a hollow claim\n\nWhen a paper asserts a JE-based result, check in this order. (i) Initial state: is the system explicitly equilibrated to $H(\\lambda_0)$ at the stated $\\beta$? Absence of an equilibration step or a starting-state characterization is a red flag for A1 failure. (ii) Work convention: does the methods section specify $W = \\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt$, or is it silent and showing $F\\cdot v$ integrals? Silence almost always means mechanical work — re-derive $\\Delta F$ with the boundary correction before trusting the number. (iii) Convergence diagnostic: are $\\sigma_W^{2}$ and the Gore–Ritort–Bustamante bias bound reported, or only a SEM? (iv) Reverse protocol or BAR: is the result cross-checked against reverse pulls via the Crooks symmetry [10, 15] or BAR [11], or is it a single-direction average? (v) For quantum claims, is the work definition TPM, and if not, is equivalence to TPM proven? (vi) For feedback experiments, does the exponent include the measurement-information term $I$? A paper that fails (i)–(iii) is reporting a number whose error bar is fictional; a paper that fails (iv)–(vi) is reporting the wrong identity."}, {"id": "status-and-believers-checklist", "title": "6. Status \u0026 the Believer's Checklist", "markdown": "## 6. Status \u0026 the Believer's Checklist\n\nAs a **theorem**, $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ is settled. The Hamiltonian derivation [6], the master-equation proof [7], the Langevin proof [30], the path-ensemble derivation [9], the Crooks parent identity [10], the quantum two-measurement extensions [20, 21, 31], and the Hamiltonian detailed FT [8] are mutually consistent and have been independently re-derived from microscopic reversibility, from the integral fluctuation theorem for total entropy production [16], and from the Bochkov–Kuzovlev exclusive-work identity once the inclusive/exclusive boundary term is taken into account [1, 2, 3]. Seifert's 2012 review [17] enshrined JE/Crooks as foundational identities of stochastic thermodynamics, and Sekimoto's monograph [32] embedded them in the energetics framework. No one seriously contests the equality at the level of theorems.\n\nAs **practice**, the situation is more honest if one admits that the field has quietly moved on. The dominant operational estimator in single-molecule pulling and in alchemical molecular dynamics is no longer the bare forward exponential average — it is the Bennett acceptance ratio (BAR) applied to bidirectional work data, justified by the Crooks symmetry [10, 15] and by the Gore–Ritort–Bustamante bias analysis [14]. The reason is the one written into the equation itself: $\\langle e^{-\\beta W}\\rangle_N$ has finite-sample bias of order $e^{\\beta\\sigma^2/2}/N$, dominated by trajectories in the negative-work tail of $P_F(W)$, whose probability decays exponentially in the dissipation [14, 25]. BAR uses both histograms simultaneously and saturates the Cramér–Rao bound for the work-distribution estimator class; the Crooks crossing $P_F(W)=P_R(-W)$ at $W=\\Delta F$ further provides a low-variance graphical estimator centered on the peaks rather than the tails [15]. A 2025 optical-tweezers review confirms this consolidation: bidirectional CFT/BAR is the recommended practice; the unidirectional JE estimator is retained only as a diagnostic ([Ribezzi-Crivellari \u0026 Ritort, arXiv:2503.20894](https://arxiv.org/abs/2503.20894)). The same migration has happened in alchemical free-energy calculations, where pmx-style bidirectional pipelines built on CHARMM [33] and similar force fields default to BAR or MBAR.\n\nYet methods sections continue to advertise the analysis as \"Jarzynski.\" That is not entirely wrong — BAR is a maximum-likelihood estimator for $\\Delta F$ derived from Crooks, which contains JE as its first cumulant — but it conflates a theorem with an estimator and obscures which assumptions are actually being tested. The result is a body of literature in which the brand name \"Jarzynski equality\" travels far beyond the regime where the equality itself is the workhorse.\n\n### The Believer's Checklist\n\nAETHER demands the following eight items, explicitly, of any paper claiming $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ or extracting $\\Delta F$ from nonequilibrium work data. Their absence is not a stylistic complaint; each one is a documented failure mode (§§3–5).\n\n1. **Work convention, stated up front.** Inclusive Hamiltonian $W=\\int(\\partial H/\\partial\\lambda)\\dot\\lambda\\,dt$ (gives $\\Delta F$ on the RHS) versus exclusive mechanical $W_0=\\int f\\cdot\\dot x\\,dt$ (gives $1$ on the RHS, à la Bochkov–Kuzovlev). The two differ by a boundary term that is *not* small at large extensions [1, 2, 3]. If the paper does not write the equation it actually integrated, the result cannot be audited.\n\n2. **Initial canonical preparation, documented at the stated $\\beta$.** JE requires the initial ensemble to be the Gibbs distribution of $H(\\lambda_0)$ at the specified temperature. Equilibration time, thermometry, and the test used to confirm equilibrium (e.g., reversibility of a slow back-and-forth cycle, agreement of forward and reverse mean works with $\\Delta F$) must be reported.\n\n3. **Forward *and* reverse work histograms, with a Crooks-crossing test.** $P_F(W)$ and $P_R(-W)$ should be plotted together; the crossing must lie within statistical error of $\\Delta F$. Absence of a reverse protocol is a red flag, not a methodological convenience [10, 15].\n\n4. **Reported work variance $\\sigma^2$ and the bias estimate $\\sim e^{\\beta\\sigma^2/2}/N$.** If $\\sigma$ exceeds $\\sim 3\\,k_BT$ at the available $N$, the bare forward JE estimator is uncontrolled [14, 25]. The paper should either show that $\\beta\\sigma^2/2 \\ll \\ln N$ or explain why it does not need to.\n\n5. **BAR (or Hummer–Szabo weighted-histogram reweighting) cross-check, not the bare $\\langle e^{-\\beta W}\\rangle_N$.** BAR on bidirectional data is the operational gold standard [14, 11, 15]; Hummer–Szabo PMF reconstruction is the standard for spatial profiles [11]. Reporting only the forward exponential average without one of these is, in 2026, an anachronism.\n\n6. **For quantum claims, an explicit two-projective-measurement protocol.** Energy measurements at $t=0$ and $t=\\tau$ on the system + bath (or appropriate decomposition for open systems [23]), with the work distribution defined as the difference of measured eigenvalues [19, 20, 21]. Continuous-monitoring or weak-measurement \"work\" does *not* in general satisfy JE.\n\n7. **For feedback or information-driven protocols, the explicit mutual-information term.** Sagawa–Ueda type generalizations [18] add $I$ inside the exponential; the bare JE form is invalid under measurement-conditioned protocols. The paper must state which mutual information is being tracked and how it was estimated.\n\n8. **A statement of which assumptions A1–A6 from §2 are assumed and which are tested.** Time-reversal symmetry, canonical initial state, controlled $\\lambda(t)$, weak coupling or strong-coupling correction [22], Markovian bath (or absence thereof), and finite work moments. Papers that test some and assume others should say which is which.\n\nA paper that satisfies all eight is doing stochastic thermodynamics. A paper that satisfies fewer than four is, charitably, doing branding."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI will state my position cleanly. The Jarzynski equality is one of the few results in modern statistical mechanics that is simultaneously a genuine theorem, a practical disappointment, and a sociological case study in citation drift. All three things are true and the literature usually picks one.\n\n### (a) What I defend with my reputation\n\nThe **identity itself**, in the inclusive-work convention, on a classical system prepared in the canonical ensemble of $H(\\lambda_0)$ and evolved by a Hamiltonian (or detailed-balanced Markov) dynamics with a deterministic protocol $\\lambda(t)$, is rigorously true. The Hamiltonian derivation [6], the Markov derivation [7], the Langevin derivation [30], and the path-ensemble derivation [9] are mutually consistent and leave no wiggle room. I also defend the **Crooks fluctuation theorem** as the structurally correct object: $P_F(W)/P_R(-W) = e^{\\beta(W-\\Delta F)}$ is the parent statement, JE is its first moment, and Jensen on JE returns Clausius. Anyone teaching this material should derive Crooks first and present JE as a corollary, not the reverse.\n\nI will also defend, against considerable folklore to the contrary, that **Bochkov–Kuzovlev (1977, 1981) and Jarzynski (1997) are not the same theorem**. They differ by the boundary term $\\lambda\\cdot\\partial_\\lambda H\\big|_0^\\tau$; one lives in the exclusive-work convention with $\\langle e^{-\\beta W_0}\\rangle=1$, the other in the inclusive-work convention with $\\Delta F$ on the right. Conflating them is a substantive error, not a notational one.\n\n### (b) What is shakier than the literature admits\n\n1. **Initial-state preparation (A1).** Almost every \"verification\" presumes a true canonical $\\rho_0\\propto e^{-\\beta H(\\lambda_0)}$. In single-molecule pulling the initial state is whatever the trap–bead–handle composite relaxes to, which is canonical for the *composite*, not for the molecular coordinate of interest. The reported $\\Delta F$ is then the free-energy difference of the composite system, and the handle-stiffness correction is rarely propagated honestly.\n2. **Finite-sampling bias (A5/A6 in disguise).** The Gore–Ritort–Bustamante scaling $\\text{bias}\\sim e^{\\beta\\sigma^2/2}/N$ is treated as a footnote when it is the headline. For $\\sigma\\gtrsim 4\\,k_BT$ the raw JE estimator is statistical fiction; what people actually use, and should cite, is Hummer–Szabo reweighting or Bennett acceptance ratio on bidirectional data.\n3. **The quantum extension.** The two-projective-measurement construction is internally consistent but it is *not* a measurement of work in any operational sense compatible with continuous monitoring, weak measurement, or open-system protocols. Calling the resulting object \"quantum work\" papers over the absence of a Hermitian $\\hat W$. The \"quantum JE is settled\" consensus is premature.\n4. **Strong coupling.** Once the system–bath coupling is non-negligible, $\\Delta F$ has to be defined via a Hamiltonian of mean force, and the equality only holds for *that* free energy — a distinction routinely lost between Eq. (1) and the discussion section.\n\n### (c) Three open questions I would actually work on, ranked\n\n1. **An operational, measurement-model-independent definition of quantum work** that reduces to TPM in the projective limit and to stochastic-thermodynamic work classically. — Because without it, every quantum-JE experiment is measuring an artifact of its detector.\n2. **Sharp finite-sample bounds on $\\Delta F$ estimators under known tail behavior of $P(W)$**, replacing the Gore–Ritort heuristic with a concentration inequality. — Because experimentalists need a stopping rule, not an asymptotic.\n3. **Jarzynski-type identities under genuine non-Markovian baths with memory kernels $K(t)$ not derivable from a Caldeira–Leggett embedding.** — Because biological environments are exactly this case and current proofs route through embeddings that beg the question.\n\n### (d) Reading path\n\n1. **Bochkov \u0026 Kuzovlev (1977, 1981)** — to see the exclusive-work identity in its original form and understand what Jarzynski did *not* rediscover.\n2. **Jarzynski, PRL 1997 [6]** — the inclusive-work statement, read carefully for the canonical-initial-state assumption that the abstract elides.\n3. **Crooks, J. Stat. Phys. 1998 [9]** — the path-ensemble derivation, which is the right conceptual home; the 1999 PRE is a cleaner write-up but this is where the structure is.\n4. **Jarzynski, C. R. Physique 2007** — his own priority-clarifying paper distinguishing the two work conventions; the single most useful document in the credit audit.\n5. **Talkner, Lutz \u0026 Hänggi, PRE 2007** — the TPM construction and, read against Kurchan (cond-mat/0007360), the place where you decide whether you believe quantum work is a thing."}], "references": [{"n": 1, "title": "General theory of thermal fluctuations in nonlinear systems", "authors": ["G. N. Bochkov", "Yu. E. Kuzovlev"], "year": 1977, "venue": "Zh. Eksp. Teor. Fiz. 72, 238 (Sov. Phys. JETP 45, 125)", "url": "http://jetp.ras.ru/cgi-bin/e/index/e/45/1/p125?a=list", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Nonlinear fluctuation–dissipation relations and stochastic models in nonequilibrium thermodynamics: I. Generalized fluctuation–dissipation theorem", "authors": ["G. N. Bochkov", "Yu. E. Kuzovlev"], "year": 1981, "venue": "Physica A 106, 443", "url": "https://doi.org/10.1016/0378-4371(81)90122-9", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Comparison of far-from-equilibrium work relations", "authors": ["Christopher Jarzynski"], "year": 2007, "venue": "Comptes Rendus Physique 8, 495", "url": "https://doi.org/10.1016/j.crhy.2007.04.010", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Probability of second law violations in shearing steady states", "authors": ["Denis J. Evans", "E. G. D. Cohen", "G. P. Morriss"], "year": 1993, "venue": "Physical Review Letters 71, 2401", "url": "https://doi.org/10.1103/PhysRevLett.71.2401", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Dynamical ensembles in nonequilibrium statistical mechanics", "authors": ["Giovanni Gallavotti", "E. G. D. Cohen"], "year": 1995, "venue": "Physical Review Letters 74, 2694", "url": "https://doi.org/10.1103/PhysRevLett.74.2694", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Nonequilibrium equality for free energy differences", "authors": ["Christopher Jarzynski"], "year": 1997, "venue": "Physical Review Letters 78, 2690", "url": "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.78.2690", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Equilibrium free-energy differences from nonequilibrium measurements: A master-equation approa ], "year": 2002, "venue": "Science", "url": "https://doi.org/10.1126/science.1071152", "cited_by": 1252, "bucket": "earliest"}, {"n": 14, "title": "Bias and error in estimates of equilibrium free-energy differences from nonequilibrium measurements", "authors": ["J Gore", "Félix Ritort", "Carlos Bustamante"], "year": 2003, "venue": "Proceedings of the National Academy of Sciences", "url": "https://doi.org/10.1073/pnas.1635159100", "cited_by": 339, "bucket": "earliest"}, {"n": 15, "title": "Verification of the Crooks fluctuation theorem and recovery of RNA folding free energies", "authors": ["Delphine Collin", "Felix Ritort", "Christopher Jarzynski", "Steven B. Smith", "Ignacio Tinoco Jr.", "Carlos Bustamante"], "year": 2005, "venue": "Nature 437, 231", "url": "https://doi.org/10.1038/nature04061", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "Entropy production along a stochastic trajectory and an integral fluctuation theorem", "authors": ["Udo Seifert"], "year": 2005, "venue": "Physical Review Letters 95, 040602", "url": "https://doi.org/10.1103/PhysRevLett.95.040602", "cited_by": null, "bucket": "archive"}, {"n": 17, "title": "Stochastic thermodynamics, fluctuation theorems and molecular machines", "authors": ["Udo Seifert"], "year": 2012, "venue": "Reports on Progress in Physics 75, 126001", "url": "https://doi.org/10.1088/0034-4885/75/12/126001", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "Experimental demonstration of information-to-energy conversion and validation of the generalized Jarzynski equality", "authors": ["Shoichi Toyabe", "Takahiro Sagawa", "Masahito Ueda", "Eiro Muneyuki", "Masaki Sano"], "year": 2010, "venue": "Nature Physics", "url": "https://doi.org/10.1038/nphys1821", "cited_by": 979, "bucket": "canon"}, {"n": 19, "title": "Fluctuation theorems: Work is not an observable", "authors": ["Peter Talkner", "Eric Lutz", "Peter Hänggi"], "year": 2007, "venue": "Physical Review E", "url": "https://doi.org/10.1103/physreve.7 <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* ---- special blocks, rendered BEFORE the prose (as in the app) ---- */
  var hasTL=D.timeline&&D.timeline.length, hasNG=D.neglected&&D.neglected.length, hasCF=D.conflations&&D.conflations.length;
  var pre='';
  if(hasTL){
    pre+='<section class="block" id="blk-timeline"><h3>Origins timeline</h3><div class="lead">How the field actually arrived — scroll through it, with the paper that marks each turn.</div>'+
      '<div class="tslider" id="tslider">'+
      D.timeline.map(function(t){var ref=(t.ref?' <a class="cite" href="#ref-'+(+t.ref||0)+'">['+esc(t.ref)+']</a>':'');
        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+
      '</div><div class="thint">drag or scroll through time →</div></section>';
  }
  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+
      (D.credit_audit?'<div class="callout" style="margin-top:22px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>':'')+'</section>';
  }
  var langHtml='';
  if(hasCF){
    langHtml='<section class="block" id="blk-language"><h3>Watch your language</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></section>';
  }
  /* prose sections */
  var sectionsHtml=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* references (kept at the end) */
  var refsHtml='';
  if(D.references&&D.references.length){
    refsHtml='<div class="block" id="blk-refs"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
