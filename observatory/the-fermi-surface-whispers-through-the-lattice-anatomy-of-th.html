a literal image of the surface in k-space where the electronic occupation jumps from one to zero. To a 1959 reader this was startling. To a 2026 reader who routinely reads graphene's Fermi energy off a Raman G-line shift, it is the foundation of an entire diagnostic. The lineage of how that image came to be recognized, derived, observed, and weaponized is more tangled than the textbook compression \"Kohn 1959\" suggests. The mathematical seed is older than the name. In 1954 Lindhard, in a Copenhagen monograph that no English-speaking solid-state course assigns and few cite past the formula it produced, computed the static density response of the degenerate electron gas . The function that now carries his name, is smooth in \\mathbf{q} except at q = 2k F, where its derivative diverges logarithmically. This is the non-analyticity that everything downstream rests on. Kohn's 1959 PRL does not derive it; it takes Lindhard's result as input and asks what it does to the phonon spectrum when one screens the bare ion–ion interaction by \\varepsilon(\\mathbf{q}) = 1 + v q\\chi 0(\\mathbf{q}). The same year as Lindhard's monograph, Fröhlich and (in book form a year later) Peierls showed independently that in one dimension the same divergence is catastrophic: the susceptibility diverges, the phonon at 2k F goes soft to zero, and the lattice dimerizes. The connection is not a metaphor — the Peierls instability is what the Kohn anomaly becomes when dimension and coupling let it complete the trajectory to symmetry breaking. What was still missing was the right to identify the phonon self-energy with the electronic polarization bubble. Migdal supplied it in 1958 . His theorem — that vertex corrections to the electron–phonon coupling are suppressed by \\sqrt{m/M} — is what allows the renormalized phonon frequency to be written as with \\Omega the bare frequency and g \\mathbf{q} the electron–phonon matrix element. Without Migdal, Kohn's argument is heuristic. Strictly speaking the effect should carry both names; calling it the Migdal–Kohn anomaly would be honest. No one does. Kohn's 1959 PRL is a page and a half — qualitative, with a single illustrative integral. The working machinery that every later experimental paper actually uses is in Woll and Kohn's 1962 Physical Review : the explicit slope-divergence shape of the kink in \\omega(\\mathbf{q}), the geometric prefactor, the visibility criterion, and the crucial generalization to nondiametral spanning vectors — pairs of Fermi-surface points connected by \\mathbf{q} that happen to have parallel tangent planes without being antipodal. That generalization is what made the program of Fermi-surface tomography from phonon dispersions tractable for non-spherical surfaces. Independently, and almost simultaneously, Afanas'ev and Kagan derived essentially the same machinery for arbitrary Fermi-surface topology in Soviet Physics JETP . Their paper is cited in the Russian-language tradition and in careful experimental work , and almost nowhere else. The credit audit is straightforward: Lindhard supplied the singularity, Migdal supplied the right to use it on phonons, Kohn (1959) proposed the experimental signature, Woll–Kohn (1962) and Afanas'ev–Kagan (1963) supplied the equations. The \"Kohn 1959\" attribution is correct in spirit and inaccurate in detail. The experimental record clarifies in 1962. Brockhouse's Chalk River team, using the triple-axis spectrometer Brockhouse himself had built, resolved kinks in the [00\\zeta] and [\\zeta\\zeta 0] branches of lead at \\mathbf{q}-values consistent with Fermi-surface spanning vectors . Within months Paskin and Weiss confirmed the same kinks by X-ray thermal diffuse scattering — an independent probe that ruled out the possibility of neutron-resolution artefacts and is rarely given the weight it deserves in retrospective accounts. By 1967 Stedman, Almqvist, Nilsson, and Raunio had resolved dozens of anomalies in Pb and assigned each to a specific spanning vector, including nondiametral ones . The program Kohn had proposed in a page and a half was, within eight years, an operating tool for reading off Fermi-surface geometry from phonon dispersion curves. Brockhouse's 1994 Nobel lecture singles it out as one of the early triumphs of three-axis spectroscopy . Two later jumps explain why the concept has not aged into a footnote. The \"giant Kohn anomaly\" observed by Renker, Rietschel, Pintschovius and the Karlsruhe group in 1973 — a complete softening of the LA branch to zero at 2k F in the quasi-1D conductor \\text{K} 2\\text{Pt}(\\text{CN}) 4\\text{Br} {0.3}\\!\\cdot\\!3\\text{H} 2\\text{O} — provided the textbook image, and bridged the Kohn anomaly explicitly to CDW physics codified by Grüner and Wilson–Di Salvo–Mahajan . The 2004 revival by Piscanec, Lazzeri, Mauri, Ferrari, and Robertson showed that the kinks in graphite's highest optical branches at \\Gamma and K are Kohn anomalies of the Dirac point — the structural reason a Raman G-line in a graphene device shifts logarithmically with gate voltage . The lineage that started with a footnote in a Copenhagen susceptibility calculation is now the explanation for one of the most-measured numbers in 2D-materials laboratories. The Physics, Properly: Phonon Self-Energy from the Polarization Bubble The Physics, Properly: Phonon Self-Energy from the Polarization Bubble Write the electron–phonon Hamiltonian in the standard form with a bare (purely ionic) phonon propagator D^{0} \\nu(\\mathbf{q},\\omega) = 2\\Omega {\\mathbf{q}\\nu}/(\\omega^{2}-\\Omega {\\mathbf{q}\\nu}^{2}+i0^{+}). Migdal's theorem, applied to a normal metal with \\omega {\\text{D}}/E F \\ll 1, suppresses vertex corrections by \\sqrt{m/M} and licenses identifying the phonon self-energy with the bare electronic polarization bubble : The dressed phonon pole then satisfies, to leading order in g ^{2}, where the static replacement \\chi(\\mathbf{q},\\omega)\\to\\chi(\\mathbf{q},0) uses adiabaticity (A1) — assumption to which we shall return when graphene refuses to obey it. Equation (1) is the entire engine: every Kohn anomaly is a non-analyticity of \\chi(\\mathbf{q},0) inherited by \\omega \\nu^{2}(\\mathbf{q}), modulated by the matrix element g {\\mathbf{q}\\nu} ^{2}. The Lindhard function for a free-electron gas, with x = q/2k F, has dimension-dependent singular structure. With N d(E F) the density of states per spin at E F: At x=1: in d=1, \\chi itself diverges logarithmically; in d=2, \\chi is continuous but \\partial q\\chi \\sim (q-2k F)^{-1/2}\\,\\Theta(q-2k F) — a one-sided square-root branch point; in d=3, \\chi\\in C^{0} with \\partial q\\chi \\sim \\ln q-2k F , the celebrated kink whose explicit form (slope divergence with the right geometric prefactor) is in Woll \u0026 Kohn and, independently, in Afanas'ev \u0026 Kagan — not in Kohn's 1959 sketch . The 1D case is the soft-mode engine of the Fröhlich / Peierls instability; the 3D case is parametrically the mildest, which is why in clean Pb the kink is a few-percent slope change [9, 10, 8] rather than a phonon collapse. Figure: Left — the bubble self-energy that renormalizes the phonon via Eq. (1). Right — the qualitative shape of \\chi(q,0) near q=2k F for d=1,2,3. The strength of the singularity falls off sharply with dimension; the 3D kink is a logarithm in the slope, not in the function. For a generic Fermi surface, the integral in \\chi(\\mathbf{q},0) is dominated by pairs (\\mathbf{k},\\mathbf{k}+\\mathbf{q}) on the surface where the denominator vanishes linearly along the surface but quadratically across it. Stationary phase over the joint density of states gives the Woll–Kohn condition: singularities of \\chi(\\mathbf{q},0) occur at every \\mathbf{q} that connects two Fermi-surface points with parallel tangent planes — including nondiametral spanning vectors, which is the analytic statement of the empirical Pb catalog [8, 17] and the Nb d-band nesting story [18, 19]. Convex pieces give the canonical Woll–Kohn kink; locally cylindrical pieces (open orbits, nesting) promote the kink toward the 2D and 1D forms — the route by which \"ordinary\" Kohn anomalies in transition metals turn into deep softenings [20, 19] and, in KCP, into a complete soft-mode collapse . Equation (1) is honest only under a sharply delimited set of conditions. Label them once and reuse: - A1 — Adiabatic (Migdal) limit. \\omega \\nu(\\mathbf{q}) \\ll v F q, so \\chi(\\mathbf{q},\\omega)\\simeq \\chi(\\mathbf{q},0) and vertex corrections are \\mathcal{O}(\\sqrt{m/M}) . - A2 — Bare-bubble susceptibility. Single band, non-interacting Lindhard \\chi ; no exchange-correlation kernel, no multi-band mixing. - A3 — Smooth matrix element. g {\\mathbf{q}\\nu} has no non-analyticity at 2k F, so all kinks live in \\chi. - A4 — Sharp Fermi surface. k B T \\ll E F and elastic mean-free path \\ell \\gg 1/ q-2k F ; otherwise the logarithm is smeared at the scale \\max(T/v F,\\,1/\\ell). - A5 — Perturbative coupling. \\lambda \\equiv 2 N(E F) g ^{2}/(\\hbar\\Omega) \\ll 1, so Eq. (1) may be linearized in \\chi rather than iterated to the soft-mode pole. - A6 — Generic (incommensurate) 2k F. No reciprocal-lattice vector competes, so umklapp does not gap the response. - A7 — Three-dimensional bulk with convex Fermi-surface patches. The Woll–Kohn slope-divergence formula applies; lower-dimensional or nested geometries demand the d=2 or d=1 forms of Eq. (2). These seven assumptions are the load-bearing walls. Section 3 dismantles them one at a time and prices each failure; section 6 returns to them as the believer's checklist. Strict Conditions \u0026 Failure Modes: What Each Assumption Costs You Strict Conditions \u0026 Failure Modes: What Each Assumption Costs You The Kohn-anomaly machinery of §2 rests on seven load-bearing assumptions. None is innocuous. Each fails in a real material of current interest, and the failure mode is usually more instructive than the textbook success. A1 — Adiabaticity (Migdal). Required so that the phonon self-energy can be written with the static susceptibility \\chi(\\mathbf{q},0). Validity needs \\hbar\\omega {\\mathbf{q}\\nu}/\\varepsilon F \\to 0 and, more sharply, \\hbar\\omega {\\mathbf{q}\\nu} \\ll \\hbar/\\tau {\\text{el}} where \\tau {\\text{el}} is the quasiparticle decoherence time at the relevant electronic states. Failure mode: graphene's \\Gamma-E {2g} and K-A' 1 phonons. With \\hbar\\omega G \\approx 196 meV and Dirac quasiparticle broadening \\Gamma {\\text{Dirac}} that can be tens of meV at modest doping, \\hbar\\omega {\\text{ph}} \\gtrsim \\Gamma is the generic regime, not the exception. The adiabatic DFPT result then over -softens the G mode and, worse, predicts the wrong sign of the doping derivative \\partial\\omega G/\\partial E F near the Dirac point: the static \\chi(\\mathbf{q}=0,0) is finite and dopes monotonically, whereas the dynamic \\text{Re}\\,\\chi(\\mathbf{q}\\to 0,\\omega G) has the logarithmic non-analyticity at E F =\\hbar\\omega G/2 that produces the observed log-stiffening of \\omega G with gate voltage [16, 15]. The fix is to keep \\omega in the bubble: The cost of dropping A1 in graphene is the entire quantitative content of the Raman-vs-gate experiment. A2 — Weak coupling / lowest-order self-energy. The Migdal expansion is in \\lambda\\,(\\omega {\\text{ph}}/\\varepsilon F)^{1/2}; vertex corrections are suppressed by the same factor. Failure mode: d-band transition metals. In Nb, NbSe 2, Mo, V, and the A15 superconductors, \\lambda \\sim 1, electronic states near \\varepsilon F are correlated, and the renormalized vertex differs from the bare g {\\mathbf{q}\\nu} by O(1) factors [21, 18, 20, 19]. Anomalies are still present (Sharp's Nb identification , Sinha–Harmon's d-band nesting interpretation ) but the amplitude of the kink cannot be read off from \\chi^{(0)} alone, and the geometric program of inverting the kink positions to map 2k F vectors is robust while the line-shape program is not. A3 — Smooth deformation potential. The matrix element g {\\mathbf{q}\\nu} is treated as analytic at \\mathbf{q}=2\\mathbf{k} F, so that all non-analyticity comes from \\chi. This is reliable for simple metals but fails when symmetry forces g {\\mathbf{q}\\nu} ^2 to vanish on the very spanning vector that satisfies the geometric Kohn condition — selection rules then erase an anomaly that the polarization bubble would otherwise produce. Cu's missing kinks on certain branches are the classical example. A4 — Sharp Fermi surface (T\\to 0, clean limit). The 2k F non-analyticity is washed out by (i) thermal smearing k BT and (ii) impurity broadening \\hbar/\\tau. In 3D, replacing \\chi^{(0)} {\\text{3D}}(\\mathbf{q}) \\sim N(\\varepsilon F)\\bigl[\\tfrac{1}{2}+\\tfrac{1-x^2}{4x}\\ln \\tfrac{1+x}{1-x} \\bigr] (x=q/2k F) with a finite-\\tau version turns the slope divergence into a smooth crossover over \\delta q \\sim \\max(k BT,\\hbar/\\tau)/\\hbar v F. The kink is invisible once \\hbar/\\tau \\gtrsim (intrinsic singularity width); for Pb at 100 K this is roughly the threshold the Chalk River measurements actually operated at . Operational consequence: a \"no Kohn anomaly observed\" claim in a sample with \\hbar/\\tau \\sim 1 meV is consistent with the anomaly being present and merely smeared — null results constrain \\tau as much as they constrain electronic structure. A5 — Perturbative regime: \\Pi/M\\omega 0^2 \\ll 1. When the polarization correction is no longer small compared with the bare phonon energy, the linearized kink picture collapses into a full softening — the Peierls endpoint . KCP is the canonical realization: the LA branch reaches \\omega(2k F)=0 and the lattice dimerizes . The term giant Kohn anomaly properly belongs to this borderline regime and not to the few-percent dips in 3D simple metals; conflating the two erases the only quantitative distinction the literature offers between a renormalization and a transition. A6 — Single-band, single-Fermi-surface. With multiple sheets, the bubble is a sum \\sum {n,n'}\\chi {nn'} and inter-band terms can either reinforce a kink (nesting between distinct sheets, e.g. the Cr SDW vector ) or cancel it. The \"image the Fermi surface\" program needs the sheet decomposition before it can assign \\mathbf{q}^\\ast to a 2k F vector. A7 — Three-dimensional Fermi surface with finite curvature. This is the assumption most often imported uncritically. The functional forms differ qualitatively with dimension: Dim. \\chi^{(0)}(\\mathbf{q}) near 2k F Phonon kink FS-geometry caveat --- --- --- --- 1 \\chi \\propto -\\ln\\mid q-2k F\\mid (divergent) full softening at any finite g always nests perfectly 2 finite jump in \\partial\\chi/\\partial q at 2k F \\partial\\omega/\\partial q jumps convex FS required; concavity smears 3 \\chi-\\chi(2k F) \\propto (q-2k F)\\ln\\mid q-2k F\\mid slope-divergence kink (Woll–Kohn) parallel tangent planes In strict 1D the perturbative kink does not exist as a separate object — the divergence is the instability, and Fröhlich's 1954 model together with Peierls' 1955 argument already contains everything Kohn's 1959 note would later sharpen for 3D . In 2D the anomaly survives but only on convex Fermi surfaces; a hyperbolic patch contributes a real-part feature that is not a non-analyticity. Quasi-1D and quasi-2D materials (KCP, NbSe 2, TaSe 2, the cuprates) interpolate: the cleaner the nesting, the closer the system sits to A5's failure, and the more the \"anomaly\" is in fact a precursor to a CDW [13, 14]. Importing the 3D Woll–Kohn slope-divergence machinery into a quasi-1D analysis and reporting the resulting fit as a \"Kohn anomaly\" is the most common abuse of the term — it is at best a CDW precursor and at worst a strong-coupling lattice instability that owes little to the perturbative polarization bubble. Signatures: Smoking Guns vs Circumstantial Evidence Signatures: Smoking Guns vs Circumstantial Evidence A Kohn anomaly is one of those features that everyone claims to see and few actually demonstrate. The literature is littered with phonon dips labelled \"Kohn-like\" on the strength of a single softened branch in a single direction. The Pb 1962 standard [9, 10] is harder than that, and the standard is worth restating: a genuine identification requires (i) the right wavevector, (ii) the right functional form, (iii) the right dimensional scaling, and (iv) a corroborating probe that rules out instrumental and lattice-only explanations. Anything less is circumstantial. The four smoking guns (1) Wavevector match to an independently measured FS spanning vector. The anomaly must sit at a \\mathbf{q} that connects two FS sheets with parallel tangent planes — diametral or non-diametral, per Woll–Kohn and Afanas'ev–Kagan . The 1967 Stedman mapping in Pb is the gold standard: dozens of kinks across multiple branches, every one assigned to a specific spanning vector consistent with the de Haas–van Alphen Fermi surface . A dip at a \\mathbf{q} that does not correspond to any FS caliper is, by definition, not a Kohn anomaly. (2) Correct non-analytic form. In 3D, the singular contribution to \\omega^2(\\mathbf{q}) scales as q-2k F \\ln q-2k F , so \\partial\\omega/\\partial q diverges logarithmically — a slope kink, not a dip. In 2D (convex FS), \\chi(q) acquires a finite slope discontinuity at 2k F, weaker still. In quasi-1D, \\chi(q)\\sim \\ln(\\Lambda/ q-2k F ) diverges, and one can drive \\omega(2k F)\\to 0 — the KCP \"giant\" case . Plotting \\omega(q) and fitting the predicted functional form, not just locating a minimum, is the actual test. The Pb data fit the log-times-linear template; KCP fits the log divergence; a Slater–Pauling-type ferroelectric soft mode does neither. (3) Dimensional and geometric scaling. The kink amplitude carries the geometry: a curvature prefactor \\kappa 1\\kappa 2 ^{-1/2} from the FS caliper, and a matrix element g {\\mathbf{q}\\nu} ^2 that selects which branches respond. Longitudinal modes typically dominate in simple metals; in graphene, symmetry restricts the effect to the E {2g} (G) and A 1' (K) branches . A \"Kohn anomaly\" claimed for a transverse acoustic branch with no symmetry-allowed coupling is suspect. (4) Independent probe agreement. Neutron TAS measures \\omega(\\mathbf{q}); X-ray TDS measures \\sum \\nu \\mathrm{coth}(\\hbar\\omega/2k BT)/\\omega^2, weighted differently. Paskin \u0026 Weiss confirmed the Pb kinks via TDS in the same year as Brockhouse's neutron data [10, 9], precisely to defeat the \"resolution artefact\" objection. Modern equivalents: IXS plus INS; or DFPT plus Raman with electrostatic gating, which decouples E F from strain [16, 15]. Figure: Discriminating a genuine Kohn anomaly from its look-alikes. The Pb 1962 case passes every node [9, 10]; KCP passes them in the quasi-1D limit ; many claimed \"Kohn anomalies\" in 3D transition-metal alloys stop at the second node. The circumstantial cases — and how to upgrade them A bare dip or softening. Could be a ferroelectric soft mode (driven by long-range dipole forces, not by \\chi e), an anharmonic instability (intrinsically temperature-driven, no FS signature), a zone-boundary folding artefact, or a Jahn–Teller distortion. Discriminating test: does the dip move with E F? Gating, alloying, or pressure that shifts k F should shift q^ accordingly. A ferroelectric soft mode does not care about E F. Raman line shift with doping or strain. The G-line stiffening in gated graphene is the modern poster child. But strain alone shifts the G line, and anharmonic renormalization can mimic the trend. Discriminating test: the Kohn contribution is non-analytic — logarithmic in E F — and changes sign across E F =\\hbar\\omega G/2 (the nonadiabatic threshold). Mechanical strain gives a linear, monotonic shift with no log feature and no Pauli-blocking kink. Lee et al.'s \\omega G–\\omega {2D} decomposition exploits exactly this orthogonality . Linewidth enhancement. A broad phonon could be Kohn-driven (decay into electron–hole pairs at the FS) or just defect-scattering broadened. Discriminating test: the electron–phonon FWHM is set by g ^2 and the joint DOS, both of which respond to E F; defect broadening does not. It should also be isotope-independent — the electronic part of the self-energy does not see ion mass, while anharmonic broadening scales with M^{-1/2}. An isotope-substitution series separates the two cleanly. Pressure- or temperature-driven softening. Strong-coupling Migdal–Eliashberg theory predicts that a near-CDW Kohn anomaly should deepen with cooling (Fermi function sharpens) and shift with pressure (FS reshapes). A purely structural soft mode is governed by Cochran-style \\omega^2\\propto (T-T c) Curie behavior with no \\mathbf{q}^ tracking. Buyers et al.'s temperature-dependent Mo anomaly is the clean example of the Kohn signature passing this test. The honest summary: of the dozens of phonon dips labelled \"Kohn anomaly\" in the post-1970 transition-metal and dichalcogenide literature, only a minority survive all four tests. The Pb [8, 9, 10], Mo , graphite/graphene [15, 16], and KCP cases are unambiguous. Most others are at best circumstantial — useful clues, not closed cases. Use \u0026 Abuse: How the Term Lost Its Edges Use \u0026 Abuse: How the Term Lost Its Edges The phrase \"Kohn anomaly\" enjoys the kind of currency that erodes meaning. By 2026 a literature search returns the term applied to almost any concavity in a phonon branch — frequently with no demonstration that the relevant \\mathbf{q} is a Fermi-surface spanning vector, no test of the predicted functional form, and no discussion of whether the adiabatic recipe being used is even legitimate. Four abuse patterns recur. Pattern I — \"It dips, therefore it is\" The Woll–Kohn singularity has a specific signature : in 3D the dynamical matrix carries a contribution \\propto q-2k F \\,\\ln q-2k F , producing a slope discontinuity in \\omega(q) — not a broad valley. In 2D with a convex Fermi surface the contribution to \\omega^2(q) is a square-root cusp \\propto \\sqrt{q-2k F}\\,\\Theta(q-2k F) on one side; in quasi-1D the divergence is logarithmic in \\omega^2 itself, and only then strong enough to collapse the mode . A genuine identification therefore requires (a) an independent determination that \\mathbf{q}^ matches a Fermi-surface caliper, including the nondiametral spanning vectors with parallel tangent planes that Woll \u0026 Kohn emphasized and Stedman et al. exploited in Pb ; (b) a functional-form test against ln, square-root, or step, not a quadratic fit; (c) evidence that the feature sharpens as T\\to 0 and broadens with disorder, as k F smearing demands. The Stedman programme in Pb and Al [8, 17] still sets the bar; a single softened point in a DFPT dispersion does not clear it. Pattern II — Quasi-1D cartoon imported into 3D The textbook image — a soft mode collapsing to zero at 2k F, driving a Peierls transition — is the KCP \"giant\" anomaly of Renker et al. , not anything Kohn predicted for a generic metal. In 3D the kink is parametrically a few percent at best, easily wiped out by \\sim1 meV of impurity broadening or anharmonic linewidth. Yet papers routinely cite a 5–10% softening in a 3D itinerant magnet or transition-metal compound as \"evidence of incipient CDW order.\" The Pines–Nozières arithmetic is unkind: with \\lambda \\lesssim 0.5 the fractional dip \\delta\\omega/\\omega at 2k F scales as \\lambda \\times (\\text{geometric factor of order } 0.1\\text{–}0.3) — large dips need either flat-band nesting or strong coupling, not casual handwaving. Pattern III — Kohn ≡ Peierls ≡ CDW These three labels mark distinct points along the electron–phonon axis. The Kohn anomaly is the perturbative polarization-bubble correction to \\omega(\\mathbf{q}). The Peierls instability is the strong-coupling endpoint at which \\omega(2k F)\\to 0 and the lattice dimerizes [4, 3]. The CDW is the broken-symmetry state with finite order parameter [13, 14]. The renormalization-group flow connecting them is nontrivial: many 2D and quasi-2D systems display Kohn-like kinks that never reach the Peierls fixed point because competing instabilities (superconductivity, magnetism, lattice anharmonicity) preempt it. Treating the three terms as synonyms confuses what was measured (a kink), what is being claimed (an instability), and what is being asserted (a phase transition). Pattern IV — Adiabatic recipe in nonadiabatic regimes The Migdal theorem underwrites the polarization-bubble formula only when \\omega {\\mathrm{ph}} \\ll \\varepsilon F and the electronic quasiparticles equilibrate faster than the lattice oscillates. In graphene the relevant optical phonons (G at \\sim200 meV, A' 1 at K at \\sim160 meV) violate this near the Dirac point; the static DFPT polarization over-softens the modes, and only the dynamical \\chi(\\mathbf{q},\\omega) reproduces the doping-dependent stiffening of the G line [15, 16]. Calandra's group made this explicit; Li-decorated graphene inherits the same caveat. Nevertheless one still finds claims of \"Kohn anomalies\" in twisted-bilayer and other flat-band systems supported by static-DFPT phonons alone — a regime where the small electronic bandwidth W \\lesssim 10 meV is below the optical phonon frequencies, and Migdal's small parameter is not small. Where the loose usage is endemic (2020–2026) - Twisted bilayer and moiré graphene. Flat-band correlated metals with W \\sim \\omega {\\mathrm{ph}}; static-DFPT \"Kohn anomalies\" are routinely reported without dynamical or nonadiabatic checks. Treat with extreme skepticism unless time-dependent \\chi(\\mathbf{q},\\omega) is computed. - Kagome metals (AV 3Sb 5 family). CDW-adjacent transitions are reflexively labelled Kohn-driven from a single DFPT softening at M or L, even where the Fermi-surface caliper does not match the ordering wavevector and where sublattice-interference-driven instabilities are competing explanations (verify). - High-pressure hydride superconductors. Strong electron–phonon coupling makes everything look anomalous; papers occasionally call any soft branch \"Kohn\" without demonstrating 2k F nesting [26, 27]. Strong coupling and phonon softening are not the same as a Kohn anomaly. Heuristics for the abstract-scanner A title that promises \"Kohn anomaly and superconductivity in [material]\" deserves the following triage: 1. Does the paper give the spanning vector and overlay it on the Fermi surface? If not — discount. 2. Does it test a functional form (log, \\sqrt{\\,}) against the dispersion, or only show a dip? Dip-only — discount. 3. Does it distinguish the Kohn contribution from anharmonic, magnetic, or band-Jahn–Teller softening? If \"we attribute the softening to\" appears without ruling out alternatives — discount. 4. For Dirac / flat-band / correlated systems: is the polarization computed dynamically ? Static DFPT only — discount the strength estimate. 5. Does an inferred \"CDW tendency\" rest on a single \\lesssim 10\\% 3D dip? If yes — discount the inference, not necessarily the data. A Kohn anomaly is a falsifiable claim with a definite shape, a definite location, and a definite regime of validity. Papers that treat it as a synonym for \"interesting phonon feature\" forfeit the prediction's value and inherit none of its rigor. Status \u0026 the Believer's Checklist Status \u0026 the Believer's Checklist The Kohn anomaly is a concept that has aged unevenly. Three distinct sub-categories now travel under the name, and they sit at very different points in the life cycle of an idea. The closed chapter. The original 3D problem — perturbative kinks in the phonon branches of a clean elemental metal, mapped by triple-axis spectroscopy back onto Fermi-surface spanning vectors — is finished physics. Pb, Al, Nb, Mo, Y, and a few others were systematically Kohn-imaged between 1962 and the mid-1970s [9, 8, 17, 18, 28, 20], the Woll–Kohn slope-divergence formula and its Soviet companion were shown to be quantitatively faithful where the experimental resolution permitted, and Migdal–Eliashberg practice [5, 29] absorbed the anomaly as a routine ingredient of \\alpha^2F(\\omega). Nothing about this corner of the field is under active dispute. Brockhouse's Nobel lecture is its retrospective epitaph. The textbook misattribution. The image that survives in undergraduate condensed-matter texts — a phonon branch collapsing to zero at 2k F and dragging the lattice into a Peierls dimerization — is not Kohn's 3D prediction. It is the 1973 Karlsruhe KCP experiment , read through the lens of the Fröhlich–Peierls 1D divergence [3, 4] and packaged in Grüner's CDW monograph . The strict Kohn anomaly in 3D Pb is a few-percent kink; the \"giant\" version in quasi-1D is a different beast living in a different singularity class of the Lindhard function. Conflating them is the single most common pedagogical sin in the area, and it propagates into the literature whenever a small dip in a 3D phonon branch is reported as evidence of \"incipient CDW.\" It usually isn't. The live frontier. Where the concept is genuinely productive in 2026 is in low-dimensional and multiband systems where the adiabatic approximation breaks. Three exemplars: - Graphene G and 2D modes. The E {2g} phonon at \\Gamma and the A' 1 phonon at K are Kohn anomalies of the Dirac point . Their doping dependence is logarithmic and nonadiabatic : adiabatic DFPT over-softens the G mode, while time-dependent perturbation theory reproduces the measured stiffening with E F , Lazzeri \u0026 Mauri, PRL 97, 266407 (2006). This is the cleanest experimentally verified nonadiabatic Kohn anomaly on record. - MgB 2 E {2g}. The in-plane boron stretch sits in a small-E F, two-band \\sigma/\\pi pocket structure where the phonon energy is comparable to the relevant electronic scale. The Kohn softening and broadening were resolved by inelastic X-ray scattering Baron et al., PRL 92, 197004 (2004) and now anchor the modern theory of the electron-mediated anharmonicity that controls T c. - Phonon-mediated superconductivity by design. The Profeta–Calandra–Mauri proposal for Li-decorated graphene uses a Kohn-anomaly-enhanced matrix element as a design knob — a representative example of the concept being treated as an engineerable quantity in \\alpha^2F rather than a curiosity in a dispersion plot. Heavily B-doped diamond is the same idea in a 3D Dirac-like host (Hoesch et al., PRB 75, 144508 (2007)). The lesson is that \"Kohn anomaly\" is no longer a single observable. It is a family of phenomena indexed by dimensionality, by adiabaticity, and by coupling strength. Treat it that way and the literature stops looking confused. The believer's checklist A claim of Kohn anomaly in a new system should pass all eight tests below. The bracketed labels refer to the seven load-bearing assumptions A1–A7 of §3. 1. Spanning vector matches. The anomalous \\mathbf{q}^\\ coincides, within experimental error, with a measured Fermi-surface spanning vector — not a vector \"consistent with\" a band-structure calculation. [A6] 2. Parallel tangent planes. The two FS patches connected by \\mathbf{q}^\\ have demonstrably parallel tangent planes, including the nondiametral case of Woll \u0026 Kohn and Afanas'ev–Kagan . A bare nesting peak in \\chi(\\mathbf{q}) is not the same statement. [A6] 3. Right functional form. The fit to \\omega(\\mathbf{q}) near \\mathbf{q}^\\ is the dimension-appropriate Lindhard non-analyticity: q-2k F \\ln q-2k F slope divergence in 3D , a slope jump in 2D (convex FS), a logarithmic softening in quasi-1D [3, 13]. A generic concavity is not evidence. [A3, A5] 4. Adiabatic regime declared. The work states whether \\omega {\\mathbf{q}\\nu} is small or large compared with the electronic broadening of the states being connected, and uses static \\chi(\\mathbf{q}) or dynamic \\chi(\\mathbf{q},\\omega) accordingly. Graphene-G–style nonadiabatic systems require the time-dependent treatment [16, 15]. [A1] 5. Independent corroboration. The FS geometry implicated is confirmed by an independent probe — thermal-diffuse X-ray scattering , ARPES nesting maps, dHvA, IXS. The Pb programme [8, 17] is the gold standard. [A6] 6. Broadening budget. Impurity and thermal broadening are estimated and shown not to wash out the singularity at the temperature and sample quality used. A kink invisible above 10 K cannot be reported from a 300 K dataset. [A3] 7. Coupling-strength honesty. Either \\lambda is small enough for the perturbative self-energy of §2 to apply, or the work explicitly invokes the giant-anomaly / incipient-Peierls regime [12, 13] and uses strong-coupling tools. The middle ground is where most of the misuses live. [A2, A7] 8. Alternatives excluded. Anharmonic soft modes, ferroelectric instabilities, structural soft modes from zone-boundary band-Jahn–Teller physics, and CDW-from-correlations scenarios are explicitly ruled out before \"Kohn anomaly\" is asserted. [A4] A feature that passes 1–8 is a Kohn anomaly in the strict sense. A feature that passes only a subset should be reported with the subset declared. The current literature would be quieter, sharper, and more useful if every author asked which of these eight boxes their data actually ticks. Sources: - Lazzeri \u0026 Mauri, Nonadiabatic Kohn anomaly in a doped graphene monolayer , PRL 97, 266407 (2006) - Baron et al., Kohn Anomaly in MgB 2 by Inelastic X-Ray Scattering , PRL 92, 197004 (2004) - Hoesch et al., Nonadiabatic Kohn anomaly in heavily boron-doped diamond , PRB 75, 144508 (2007) The AETHER Verdict The AETHER Verdict I have spent enough of this dossier in the historian's chair. Here is where I plant the flag. What I will defend The Kohn anomaly, as originally constructed , is one of the cleanest examples of analytical structure in many-body physics surviving contact with experiment. The chain — Lindhard's \\chi 0(\\mathbf{q}) has a non-analyticity at 2k F wherever the Fermi surface admits parallel tangent planes; that non-analyticity is inherited by the phonon self-energy through g {\\mathbf q\\nu} ^2 \\chi 0(\\mathbf q); the kink is therefore a geometrical probe of the Fermi surface, independent of the detailed band structure away from it — is correct, calculable, and has been verified non-trivially in Pb, in 2H-NbSe 2, in Cr, and (with the nonadiabatic correction) in graphene. I will defend the proposition that the slope-divergence formula of Woll \u0026 Kohn (1962) is the operational definition of the effect, and that any usage divorced from a specified spanning vector \\mathbf{Q}^ = 2\\mathbf{k} F with parallel-tangent geometry is sloppy. I will also defend, against the textbook compression, that the singularity belongs to Lindhard (1954); Kohn's contribution was to recognize its observable consequence in the lattice. The credit reallocation is not pedantry — it matters because every modern misuse begins by forgetting that \\chi 0 is the object with the singularity. What is shakier than the literature admits Four specific load-bearing assumptions are routinely smuggled past the reader: 1. The adiabatic approximation. Migdal's theorem requires \\omega {\\mathbf{q}\\nu} \\ll \\varepsilon F, but for Kohn-anomaly visibility the relevant scale is the quasiparticle decay rate at 2k F. In Dirac and nodal systems this comparison routinely fails; DFPT results in those materials are quantitatively wrong, not qualitatively suggestive. The community knows this for graphene and pretends it does not apply to TMDs and twisted bilayers. 2. A well-defined Fermi surface. Half the materials currently labelled as hosting \"Kohn anomalies\" are strongly correlated or pseudogapped, where the very object 2\\mathbf{k} F is ill-defined. Calling a dip at the nesting vector of a bare band a Kohn anomaly in a Mott-adjacent system is a category error. 3. Constant matrix element. The geometric statement about \\chi 0 becomes a statement about \\omega^2(\\mathbf{q}) only after multiplying by g {\\mathbf{q}\\nu} ^2. In layered transition-metal dichalcogenides g varies as fast across the Brillouin zone as \\chi 0 does; the \"Kohn-anomaly position\" people quote is the position of a product , not of the Fermi-surface feature. 4. CDW \\Leftrightarrow Kohn-anomaly softening. The 2H-NbSe 2 literature has, I believe, been quietly demoting this equivalence for fifteen years; the textbooks have not noticed. Three open questions, ranked 1. A clean theory of the nonadiabatic Kohn anomaly in nodal-line and Weyl metals — the static-\\chi 0 recipe is provably wrong here and no replacement is canonical. 2. Disentangling matrix-element structure from \\chi 0(\\mathbf{q}) structure in TMD softenings — without this, every \"nesting-driven CDW\" claim in the family is unfalsifiable. 3. Operational criteria for a 2D logarithmic Kohn anomaly in moiré flat bands — the bandwidth/phonon-frequency ratio is in the wrong regime for any existing framework. Reading path 1. Woll \u0026 Kohn (1962), Phys. Rev. 126 , 1693 — the actual derivation, including the parallel-tangent-plane rule. Start here, not at the 1959 PRL. 2. Brockhouse et al. (1962) on Pb — the first detection, motivated explicitly by Kohn's prediction; pair with Paskin \u0026 Weiss's X-ray TDS confirmation . 3. Afanas'ev \u0026 Kagan (1963), JETP 16 , 1030 — the parallel Soviet derivation for arbitrary Fermi-surface topology; rarely cited, fully equivalent. 4. Piscanec, Lazzeri, Mauri, Ferrari \u0026 Robertson (2004), Phys. Rev. Lett. 93 , 185503 — the modern reframing: Kohn anomalies as nonadiabatic, observable in Raman, in a 2D Dirac metal. 5. Weber et al. on 2H-NbSe 2 inelastic X-ray scattering (2011, PRL 107 , 107403) — the cleanest contemporary case where the anomaly is real, the nesting story is not , and the matrix element does the work."}</script>

nk with infinite slope), the screened ion–ion interaction inherits the same singularity and therefore the phonon dispersion ω(q) must show a corresponding kink at those q. The result was conceptually downstream of Lindhard's 1954 calculation of the dielectric response of an electron gas and Migdal's 1958 adiabatic electron–phonon theory, but Kohn's stroke was to point out that the singularity is sharp enough to be visible in inelastic neutron scattering and, crucially, to invert the logic: by mapping the kinks one images the Fermi surface from the lattice side. Brockhouse, Arase, Caglioti, Rao and Woods reported the first kinks in Pb the same year as Woll \u0026 Kohn worked out the general 3D form (1962), and through the late 1960s neutron groups in Chalk River, Harwell, Studsvik and Argonne systematically extracted Fermi surfaces of Pb, Al, Nb, Mo and the noble metals from phonon dispersions. The idea then mutated: in quasi-1D conductors (KCP, TTF–TCNQ) it became the 'giant Kohn anomaly' that drives the Peierls/CDW transition; after 2004 Piscanec, Lazzeri, Mauri and Ferrari resurrected it as the explanation for the anomalous slopes of the highest optical branches of graphite/graphene at Γ and K, turning the G and 2D Raman lines into a contactless probe of doping and strain.", "credit_audit": "Textbook attribution ('Kohn 1959') is correct in spirit but compresses three distinct contributions. (i) The singularity itself belongs to Lindhard (1954); Kohn's PRL takes χ(2k_F) as given. (ii) The quantitative theory used in every later experimental paper — explicit kink shape, parallel-tangent-plane spanning condition, visibility estimates — is Woll \u0026 Kohn 1962, not the 1959 note. (iii) The Soviet derivation by Afanas'ev \u0026 Kagan (1963) covers essentially the same ground for arbitrary Fermi-surface topology and was independently developed; it is almost never cited in Western reviews. The first detection in Pb was a Chalk River team led by Brockhouse (1962), explic
