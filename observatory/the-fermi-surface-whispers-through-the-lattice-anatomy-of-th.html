t. 93, 185503", "kind": "revival", "ref": 15}, {"year": 2007, "event": "Logarithmic stiffening of the G line in electrochemically top-gated graphene as a function of E_F — quantitative confirmation of the Kohn-anomaly origin of the G phonon and of nonadiabatic corrections beyond Migdal", "who": "A. Das, S. Pisana, B. Chakraborty, S. Piscanec, S. K. Saha, U. V. Waghmare et al.", "work": "Nat. Nanotechnol. 3, 210", "kind": "observation", "ref": 16}, {"year": 2012, "event": "Predicted phonon-mediated superconductivity in Li-decorated graphene, with T_c set by a Kohn-anomaly-enhanced electron–phonon matrix element — the modern materials-design use of the concept", "who": "G. Profeta, M. Calandra, F. Mauri", "work": "Nat. Phys. 8, 131", "kind": "revival", "ref": 25}], "neglected": [{"name": "E. J. Woll Jr.", "role": "First author of the 1962 paper that actually contains the explicit 3D form of the singularity, the parallel-tangent-plane condition for arbitrary Fermi surfaces, and the visibility estimates — what most textbooks attribute simply to 'Kohn 1959'. The 1959 PRL is qualitative; the working machinery is Woll \u0026 Kohn 1962", "evidence": "Phys. Rev. 126, 1693 (1962) — see derivations of the singular contribution to the dynamical matrix and the catalog of spanning-vector geometries", "ref": 6}, {"name": "A. M. Afanas'ev \u0026 Yu. Kagan", "role": "Independent Soviet derivation (1963) of the phonon-spectrum singularities for general Fermi-surface geometry, including curvature dependence and the regime where the kink turns into a deeper softening — rarely cited outside the Russian-language literature", "evidence": "Sov. Phys. JETP 16, 1030 (1963); cited by Stedman et al. (corpus [3]) and by Grüner's CDW monograph", "ref": 7}, {"name": "J. Lindhard", "role": "Computed (1954) the static susceptibility whose 2k_F non-analyticity is the actual mathematical origin of the anomaly. Kohn's 1959 paper takes Lindhard's result as input; modern reviews drop the attribution", "evidence": "Mat. Fys. Medd. Dan. Vid. Selsk. 28(8), 1954 — the source of the 'Lindhard function' that Kohn differentiates to get his kink", "ref": 1}, {"name": "A. B. Migdal", "role": "Provided (1958) the adiabatic many-body framework that legitimates identifying the phonon self-energy with the electronic polarization bubble — without Migdal's theorem the Kohn argument is heuristic. The 'Kohn anomaly' is, strictly, a Migdal–Kohn anomaly", "evidence": "Sov. Phys. JETP 7, 996 (1958); explicit dependence acknowledged in Allen \u0026 Mitrović and in Grimvall's electron–phonon monograph", "ref": 5}, {"name": "B. Renker, H. Rietschel, L. Pintschovius and coworkers (Karlsruhe)", "role": "The 'giant Kohn anomaly' image that dominates undergraduate textbooks — a soft mode collapsing to zero at 2k_F driving a Peierls transition — is their KCP experiment, not anything Kohn predicted. The 3D kink Kohn actually derived is parametrically much weaker", "evidence": "Phys. Rev. Lett. 30, 1144 (1973)", "ref": 12}], "conflations": [{"claim": "Any soft mode or kink in a phonon branch is called a 'Kohn anomaly'", "clarification": "A genuine Kohn anomaly has a specific signature: a non-analytic feature in ω(q) at q equal to a Fermi-surface spanning vector with parallel tangent planes, with a definite functional form — in 3D a slope divergence (Woll \u0026 Kohn 1962), in 2D a logarithm in ω^2, in quasi-1D a logarithmic singularity that can drive a full Peierls instability. A generic soft mode from anharmonicity, from a ferroelectric instability, or from a structural-soft-mode transition is not a Kohn anomaly even if it looks superficially similar."}, {"claim": "Kohn anomaly = Peierls instability = CDW formation", "clarification": "The Kohn anomaly is the perturbative phonon-self-energy correction from χ(q); the Peierls instability is the strong-coupling endpoint where ω(2k_F)→0 and the lattice dimerizes; the CDW is the broken-symmetry state itself. They are points on the same axis but are not identical: a 3D Kohn anomaly (a few-percent kink) does not by itself imply CDW formation. The 'giant Kohn anomaly' label introduced for KCP is precisely the borderline case where the anomaly has become strong enough to drive the transition."}, {"claim": "Kohn anomalies are equally prominent in any dimension", "clarification": "The strength of the singularity depends sharply on dimension and Fermi-surface geometry. In strict 1D the Lindhard function diverges logarithmically at 2k_F. In 2D it has a finite jump in slope (and only if the Fermi surface is convex). In 3D it is a much milder kink — Kohn's original 'singularity' is ∝ |q−2k_F| ln|q−2k_F| corrections, easily smeared by impurities, temperature, anharmonicity. Treatments that import the 1D textbook cartoon into 3D analyses (or claim a CDW from a few-percent dip in a 3D metal) misuse the concept."}, {"claim": "The standard adiabatic (Migdal) treatment captures Kohn anomalies in low-dimensional Dirac systems", "clarification": "In graphene the G and K-point Kohn anomalies are nonadiabatic: the relevant phonon frequency is comparable to or larger than the relaxation rate of the photoexcited Dirac quasiparticles probing them, so Migdal's adiabatic theorem fails and the phonon self-energy must be computed with the full dynamical χ(q,ω). This is exactly why DFPT (which is static) over-softens the G mode while the time-dependent calculation reproduces the experimental stiffening with doping. Calling these 'Kohn anomalies' is correct but the standard adiabatic recipe is not."}, {"claim": "Folklore: the 1959 paper contains the calculation", "clarification": "It does not. Kohn's 1959 PRL is a one-and-a-half-page sketch with a single illustrative integral. The derivation that experimentalists actually use — slope-divergence formula, geometric prefactor, the rule that anomalies appear at spanning vectors with parallel tangent planes including nondiametral ones — is in Woll \u0026 Kohn 1962 (and independently in Afanas'ev–Kagan 1963)."}], "sections": [{"id": "why-this-mattered", "title": "Why This Mattered: A Phonon That Remembers the Fermi Sea", "markdown": "## Why This Mattered: A Phonon That Remembers the Fermi Sea\n\nA phonon is, naively, a property of ions. The Fermi sea is a property of electrons. The Kohn anomaly is the statement that this separation is a lie: the lattice modes carry, in their non-analytic structure at specific wavevectors, a literal image of the surface in $k$-space where the electronic occupation jumps from one to zero. To a 1959 reader this was startling. To a 2026 reader who routinely reads graphene's Fermi energy off a Raman G-line shift, it is the foundation of an entire diagnostic. The lineage of how that image came to be recognized, derived, observed, and weaponized is more tangled than the textbook compression \"Kohn 1959\" suggests.\n\nThe mathematical seed is older than the name. In 1954 Lindhard, in a Copenhagen monograph that no English-speaking solid-state course assigns and few cite past the formula it produced, computed the static density response of the degenerate electron gas [1]. The function that now carries his name,\n\n$$\\chi_0(\\mathbf{q}) = -\\frac{m k_F}{2\\pi^2 \\hbar^2}\\left[1 + \\frac{1-x^2}{2x}\\ln\\left|\\frac{1+x}{1-x}\\right|\\right],\\qquad x \\equiv q/2k_F,$$\n\nis smooth in $\\mathbf{q}$ except at $q = 2k_F$, where its derivative diverges logarithmically. This is the non-analyticity that everything downstream rests on. Kohn's 1959 PRL [2] does not derive it; it takes Lindhard's result as input and asks what it does to the phonon spectrum when one screens the bare ion–ion interaction by $\\varepsilon(\\mathbf{q}) = 1 + v_q\\chi_0(\\mathbf{q})$. The same year as Lindhard's monograph, Fröhlich [3] and (in book form a year later) Peierls [4] showed independently that in one dimension the same divergence is catastrophic: the susceptibility diverges, the phonon at $2k_F$ goes soft to zero, and the lattice dimerizes. The connection is not a metaphor — the Peierls instability is what the Kohn anomaly becomes when dimension and coupling let it complete the trajectory to symmetry breaking.\n\nWhat was still missing was the right to identify the phonon self-energy with the electronic polarization bubble. Migdal supplied it in 1958 [5]. His theorem — that vertex corrections to the electron–phonon coupling are suppressed by $\\sqrt{m/M}$ — is what allows the renormalized phonon frequency to be written as\n\n$$\\omega^2(\\mathbf{q}) = \\Omega^2(\\mathbf{q}) + 2\\Omega(\\mathbf{q})\\,|g_\\mathbf{q}|^2\\,\\chi_0(\\mathbf{q}),$$\n\nwith $\\Omega$ the bare frequency and $g_\\mathbf{q}$ the electron–phonon matrix element. Without Migdal, Kohn's argument is heuristic. Strictly speaking the effect should carry both names; calling it the Migdal–Kohn anomaly would be honest. No one does.\n\nKohn's 1959 PRL [2] is a page and a half — qualitative, with a single illustrative integral. The working machinery that every later experimental paper actually uses is in Woll and Kohn's 1962 *Physical Review* [6]: the explicit slope-divergence shape of the kink in $\\omega(\\mathbf{q})$, the geometric prefactor, the visibility criterion, and the crucial generalization to *nondiametral* spanning vectors — pairs of Fermi-surface points connected by $\\mathbf{q}$ that happen to have parallel tangent planes without being antipodal. That generalization is what made the program of Fermi-surface tomography from phonon dispersions tractable for non-spherical surfaces. Independently, and almost simultaneously, Afanas'ev and Kagan derived essentially the same machinery for arbitrary Fermi-surface topology in *Soviet Physics JETP* [7]. Their paper is cited in the Russian-language tradition and in careful experimental work [8], and almost nowhere else. The credit audit is straightforward: Lindhard supplied the singularity, Migdal supplied the right to use it on phonons, Kohn (1959) proposed the experimental signature, Woll–Kohn (1962) and Afanas'ev–Kagan (1963) supplied the equations. The \"Kohn 1959\" attribution is correct in spirit and inaccurate in detail.\n\nThe experimental record clarifies in 1962. Brockhouse's Chalk River team, using the triple-axis spectrometer Brockhouse himself had built, resolved kinks in the $[00\\zeta]$ and $[\\zeta\\zeta 0]$ branches of lead at $\\mathbf{q}$-values consistent with Fermi-surface spanning vectors [9]. Within months Paskin and Weiss confirmed the same kinks by X-ray thermal diffuse scattering [10] — an independent probe that ruled out the possibility of neutron-resolution artefacts and is rarely given the weight it deserves in retrospective accounts. By 1967 Stedman, Almqvist, Nilsson, and Raunio had resolved dozens of anomalies in Pb and assigned each to a specific spanning vector, including nondiametral ones [8]. The program Kohn had proposed in a page and a half was, within eight years, an operating tool for reading off Fermi-surface geometry from phonon dispersion curves. Brockhouse's 1994 Nobel lecture singles it out as one of the early triumphs of three-axis spectroscopy [11].\n\nTwo later jumps explain why the concept has not aged into a footnote. The \"giant Kohn anomaly\" observed by Renker, Rietschel, Pintschovius and the Karlsruhe group in 1973 [12] — a complete softening of the LA branch to zero at $2k_F$ in the quasi-1D conductor $\\text{K}_2\\text{Pt}(\\text{CN})_4\\text{Br}_{0.3}\\!\\cdot\\!3\\text{H}_2\\text{O}$ — provided the textbook image, and bridged the Kohn anomaly explicitly to CDW physics codified by Grüner [13] and Wilson–Di Salvo–Mahajan [14]. The 2004 revival by Piscanec, Lazzeri, Mauri, Ferrari, and Robertson [15] showed that the kinks in graphite's highest optical branches at $\\Gamma$ and $K$ are Kohn anomalies of the Dirac point — the structural reason a Raman G-line in a graphene device shifts logarithmically with gate voltage [16]. The lineage that started with a footnote in a Copenhagen susceptibility calculation is now the explanation for one of the most-measured numbers in 2D-materials laboratories."}, {"id": "the-physics-properly", "title": "The Physics, Properly: Phonon Self-Energy from the Polarization Bubble", "markdown": "## The Physics, Properly: Phonon Self-Energy from the Polarization Bubble\n\nWrite the electron–phonon Hamiltonian in the standard form\n$$H_{ep} = \\sum_{\\mathbf{k},\\mathbf{q},\\nu} g_{\\mathbf{q}\\nu}\\, c^\\dagger_{\\mathbf{k}+\\mathbf{q}} c_{\\mathbf{k}} \\bigl(b_{\\mathbf{q}\\nu} + b^\\dagger_{-\\mathbf{q}\\nu}\\bigr),$$\nwith a bare (purely ionic) phonon propagator $D^{0}_\\nu(\\mathbf{q},\\omega) = 2\\Omega_{\\mathbf{q}\\nu}/(\\omega^{2}-\\Omega_{\\mathbf{q}\\nu}^{2}+i0^{+})$. Migdal's theorem, applied to a normal metal with $\\omega_{\\text{D}}/E_F \\ll 1$, suppresses vertex corrections by $\\sqrt{m/M}$ and licenses identifying the phonon self-energy with the bare electronic polarization bubble [5]:\n$$\\Pi_\\nu(\\mathbf{q},\\omega) = |g_{\\mathbf{q}\\nu}|^{2}\\,\\chi(\\mathbf{q},\\omega), \\qquad \\chi(\\mathbf{q},\\omega) = -\\sum_{\\mathbf{k}}\\frac{f_{\\mathbf{k}+\\mathbf{q}}-f_{\\mathbf{k}}}{\\hbar\\omega + \\epsilon_{\\mathbf{k}+\\mathbf{q}}-\\epsilon_{\\mathbf{k}} + i0^{+}}.$$\nThe dressed phonon pole then satisfies, to leading order in $|g|^{2}$,\n$$\\boxed{\\;\\omega_\\nu^{2}(\\mathbf{q}) \\;=\\; \\Omega_\\nu^{2}(\\mathbf{q}) \\;+\\; \\frac{2\\,\\Omega_\\nu(\\mathbf{q})}{\\hbar}\\, |g_{\\mathbf{q}\\nu}|^{2}\\,\\chi(\\mathbf{q},0)\\;}\\tag{1}$$\nwhere the static replacement $\\chi(\\mathbf{q},\\omega)\\to\\chi(\\mathbf{q},0)$ uses adiabaticity (A1) — assumption to which we shall return when graphene refuses to obey it. Equation (1) is the entire engine: every Kohn anomaly is a non-analyticity of $\\chi(\\mathbf{q},0)$ inherited by $\\omega_\\nu^{2}(\\mathbf{q})$, modulated by the matrix element $|g_{\\mathbf{q}\\nu}|^{2}$.\n\nThe Lindhard function [1] for a free-electron gas, with $x = q/2k_F$, has dimension-dependent singular structure. With $N_d(E_F)$ the density of states per spin at $E_F$:\n$$\\chi^{(1)}(q,0) \\;=\\; -\\frac{N_1(E_F)}{2}\\,\\ln\\!\\left|\\frac{1+x}{1-x}\\right|, \\tag{2a}$$\n$$\\chi^{(2)}(q,0) \\;=\\; -N_2(E_F)\\Bigl[\\,1 - \\Theta(x-1)\\sqrt{1-x^{-2}}\\,\\Bigr], \\tag{2b}$$\n$$\\chi^{(3)}(q,0) \\;=\\; -N_3(E_F)\\Bigl[\\,\\tfrac{1}{2} + \\tfrac{1-x^{2}}{4x}\\,\\ln\\!\\left|\\tfrac{1+x}{1-x}\\right|\\,\\Bigr]. \\tag{2c}$$\nAt $x=1$: in $d=1$, $\\chi$ itself diverges logarithmically; in $d=2$, $\\chi$ is continuous but $\\partial_q\\chi \\sim (q-2k_F)^{-1/2}\\,\\Theta(q-2k_F)$ — a one-sided square-root branch point; in $d=3$, $\\chi\\in C^{0}$ with $\\partial_q\\chi \\sim \\ln|q-2k_F|$, the celebrated kink whose explicit form (slope divergence with the right geometric prefactor) is in Woll \u0026 Kohn [6] and, independently, in Afanas'ev \u0026 Kagan [7] — not in Kohn's 1959 sketch [2]. The 1D case is the soft-mode engine of the Fröhlich [3] / Peierls [4] instability; the 3D case is parametrically the mildest, which is why in clean Pb the kink is a few-percent slope change [9, 10, 8] rather than a phonon collapse.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePolarization bubble and Lindhard non-analyticities in d=1,2,3\u003c/title\u003e\u003cg fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"\u003e\u003cpath d=\"M40 70 Q 90 50 140 70\" stroke-dasharray=\"5,4\"/\u003e\u003cpath d=\"M180 70 Q 230 50 280 70\" stroke-dasharray=\"5,4\"/\u003e\u003cellipse cx=\"160\" cy=\"70\" rx=\"20\" ry=\"14\"/\u003e\u003cpath d=\"M140 70 Q 160 30 180 70\"/\u003e\u003cpath d=\"M140 70 Q 160 110 180 70\"/\u003e\u003cpolygon points=\"155,57 165,57 160,50\" fill=\"#7aa2ff\" stroke=\"none\"/\u003e\u003cpolygon points=\"165,83 155,83 160,90\" fill=\"#7aa2ff\" stroke=\"none\"/\u003e\u003c/g\u003e\u003ctext x=\"40\" y=\"105\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eD = D⁰ + D⁰ · |g|² χ(q,0) · D⁰ +...\u003c/text\u003e\u003ctext x=\"55\" y=\"55\" fill=\"#ffb86b\" font-size=\"14\"\u003eq,ν\u003c/text\u003e\u003ctext x=\"155\" y=\"35\" fill=\"#7aa2ff\" font-size=\"14\"\u003ek+q\u003c/text\u003e\u003ctext x=\"155\" y=\"105\" fill=\"#7aa2ff\" font-size=\"14\"\u003ek\u003c/text\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1.5\" fill=\"none\"\u003e\u003cline x1=\"380\" y1=\"340\" x2=\"700\" y2=\"340\"/\u003e\u003cline x1=\"380\" y1=\"340\" x2=\"380\" y2=\"120\"/\u003e\u003cline x1=\"540\" y1=\"335\" x2=\"540\" y2=\"345\"/\u003e\u003c/g\u003e\u003ctext x=\"525\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\"\u003e2k_F\u003c/text\u003e\u003ctext x=\"680\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\"\u003eq\u003c/text\u003e\u003ctext x=\"355\" y=\"130\" fill=\"#e8e6e1\" font-size=\"14\"\u003e−χ\u003c/text\u003e\u003cpath d=\"M400 200 L520 200 Q 538 200 539 130\" stroke=\"#ff7a90\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpath d=\"M541 130 Q 542 200 560 240 L700 240\" stroke=\"#ff7a90\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ctext x=\"600\" y=\"195\" fill=\"#ff7a90\" font-size=\"14\"\u003ed = 1 (log div.)\u003c/text\u003e\u003cpath d=\"M400 250 L538 250 Q 560 250 600 290 L700 295\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ctext x=\"600\" y=\"245\" fill=\"#7ee0a3\" font-size=\"14\"\u003ed = 2 (√ cusp)\u003c/text\u003e\u003cpath d=\"M400 280 C 470 280 520 285 540 295 C 560 305 620 318 700 320\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ccircle cx=\"540\" cy=\"295\" r=\"3\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"600\" y=\"285\" fill=\"#7aa2ff\" font-size=\"14\"\u003ed = 3 (log kink in dχ/dq)\u003c/text\u003e\u003ctext x=\"380\" y=\"380\" fill=\"#e8e6e1\" font-size=\"13\"\u003eStatic Lindhard χ(q,0): non-analyticity at every Fermi-surface spanning vector\u003c/text\u003e\u003c/svg\u003e\n*Figure: Left — the bubble self-energy that renormalizes the phonon via Eq. (1). Right — the qualitative shape of $\\chi(q,0)$ near $q=2k_F$ for $d=1,2,3$. The strength of the singularity falls off sharply with dimension; the 3D kink is a logarithm in the slope, not in the function.*\n\nFor a generic Fermi surface, the integral in $\\chi(\\mathbf{q},0)$ is dominated by pairs $(\\mathbf{k},\\mathbf{k}+\\mathbf{q})$ on the surface where the denominator vanishes linearly along the surface but quadratically across it. Stationary phase over the joint density of states gives the Woll–Kohn condition: singularities of $\\chi(\\mathbf{q},0)$ occur at every $\\mathbf{q}$ that connects two Fermi-surface points with **parallel tangent planes** — including nondiametral spanning vectors, which is the analytic statement of the empirical Pb catalog [8, 17] and the Nb $d$-band nesting story [18, 19]. Convex pieces give the canonical Woll–Kohn kink; locally cylindrical pieces (open orbits, nesting) promote the kink toward the 2D and 1D forms — the route by which \"ordinary\" Kohn anomalies in transition metals turn into deep softenings [20, 19] and, in KCP, into a complete soft-mode collapse [12].\n\nEquation (1) is honest only under a sharply delimited set of conditions. Label them once and reuse:\n\n- **A1 — Adiabatic (Migdal) limit.** $\\omega_\\nu(\\mathbf{q}) \\ll v_F q$, so $\\chi(\\mathbf{q},\\omega)\\simeq \\chi(\\mathbf{q},0)$ and vertex corrections are $\\mathcal{O}(\\sqrt{m/M})$ [5].\n- **A2 — Bare-bubble susceptibility.** Single band, non-interacting Lindhard $\\chi$ [1]; no exchange-correlation kernel, no multi-band mixing.\n- **A3 — Smooth matrix element.** $g_{\\mathbf{q}\\nu}$ has no non-analyticity at $2k_F$, so all kinks live in $\\chi$.\n- **A4 — Sharp Fermi surface.** $k_B T \\ll E_F$ and elastic mean-free path $\\ell \\gg 1/|q-2k_F|$; otherwise the logarithm is smeared at the scale $\\max(T/v_F,\\,1/\\ell)$.\n- **A5 — Perturbative coupling.** $\\lambda \\equiv 2 N(E_F)|g|^{2}/(\\hbar\\Omega) \\ll 1$, so Eq. (1) may be linearized in $\\chi$ rather than iterated to the soft-mode pole.\n- **A6 — Generic (incommensurate) $2k_F$.** No reciprocal-lattice vector competes, so umklapp does not gap the response.\n- **A7 — Three-dimensional bulk with convex Fermi-surface patches.** The Woll–Kohn slope-divergence formula applies; lower-dimensional or nested geometries demand the $d=2$ or $d=1$ forms of Eq. (2).\n\nThese seven assumptions are the load-bearing walls. Section 3 dismantles them one at a time and prices each failure; section 6 returns to them as the believer's checklist."}, {"id": "strict-conditions-failure-modes", "title": "Strict Conditions \u0026 Failure Modes: What Each Assumption Costs You", "markdown": "## Strict Conditions \u0026 Failure Modes: What Each Assumption Costs You\n\nThe Kohn-anomaly machinery of §2 rests on seven load-bearing assumptions. None is innocuous. Each fails in a real material of current interest, and the failure mode is usually more instructive than the textbook success.\n\n**A1 — Adiabaticity (Migdal).** Required so that the phonon self-energy can be written with the *static* susceptibility $\\chi(\\mathbf{q},0)$. Validity needs $\\hbar\\omega_{\\mathbf{q}\\nu}/\\varepsilon_F \\to 0$ and, more sharply, $\\hbar\\omega_{\\mathbf{q}\\nu} \\ll \\hbar/\\tau_{\\text{el}}$ where $\\tau_{\\text{el}}$ is the quasiparticle decoherence time at the relevant electronic states. **Failure mode: graphene's $\\Gamma$-E$_{2g}$ and K-A$'_1$ phonons.** With $\\hbar\\omega_G \\approx 196$ meV and Dirac quasiparticle broadening $\\Gamma_{\\text{Dirac}}$ that can be tens of meV at modest doping, $\\hbar\\omega_{\\text{ph}} \\gtrsim \\Gamma$ is the *generic* regime, not the exception. The adiabatic DFPT result then *over*-softens the G mode and, worse, predicts the wrong sign of the doping derivative $\\partial\\omega_G/\\partial E_F$ near the Dirac point: the static $\\chi(\\mathbf{q}=0,0)$ is finite and dopes monotonically, whereas the dynamic $\\text{Re}\\,\\chi(\\mathbf{q}\\to 0,\\omega_G)$ has the logarithmic non-analyticity at $|E_F|=\\hbar\\omega_G/2$ that produces the observed log-stiffening of $\\omega_G$ with gate voltage [16, 15]. The fix is to keep $\\omega$ in the bubble:\n$$\\Pi_{\\nu}(\\mathbf{q},\\omega) = \\sum_{\\mathbf{k}}|g_{\\mathbf{q}\\nu}|^2\\,\\frac{f_{\\mathbf{k}}-f_{\\mathbf{k}+\\mathbf{q}}}{\\varepsilon_{\\mathbf{k}+\\mathbf{q}}-\\varepsilon_{\\mathbf{k}}-\\hbar\\omega - i0^+}.$$\nThe cost of dropping A1 in graphene is the entire quantitative content of the Raman-vs-gate experiment.\n\n**A2 — Weak coupling / lowest-order self-energy.** The Migdal expansion is in $\\lambda\\,(\\omega_{\\text{ph}}/\\varepsilon_F)^{1/2}$; vertex corrections are suppressed by the same factor. **Failure mode: d-band transition metals.** In Nb, NbSe$_2$, Mo, V, and the A15 superconductors, $\\lambda \\sim 1$, electronic states near $\\varepsilon_F$ are correlated, and the renormalized vertex differs from the bare $g_{\\mathbf{q}\\nu}$ by O(1) factors [21, 18, 20, 19]. Anomalies are still present (Sharp's Nb identification [18], Sinha–Harmon's d-band nesting interpretation [19]) but the *amplitude* of the kink cannot be read off from $\\chi^{(0)}$ alone, and the geometric program of inverting the kink positions to map $2k_F$ vectors is robust while the line-shape program is not.\n\n**A3 — Smooth deformation potential.** The matrix element $g_{\\mathbf{q}\\nu}$ is treated as analytic at $\\mathbf{q}=2\\mathbf{k}_F$, so that all non-analyticity comes from $\\chi$. This is reliable for simple metals but fails when symmetry forces $|g_{\\mathbf{q}\\nu}|^2$ to vanish on the very spanning vector that satisfies the geometric Kohn condition — selection rules then erase an anomaly that the polarization bubble would otherwise produce. Cu's missing kinks on certain branches are the classical example.\n\n**A4 — Sharp Fermi surface ($T\\to 0$, clean limit).** The 2$k_F$ non-analyticity is washed out by (i) thermal smearing $k_BT$ and (ii) impurity broadening $\\hbar/\\tau$. In 3D, replacing $\\chi^{(0)}_{\\text{3D}}(\\mathbf{q}) \\sim N(\\varepsilon_F)\\bigl[\\tfrac{1}{2}+\\tfrac{1-x^2}{4x}\\ln|\\tfrac{1+x}{1-x}|\\bigr]$ ($x=q/2k_F$) with a finite-$\\tau$ version turns the slope divergence into a smooth crossover over $\\delta q \\sim \\max(k_BT,\\hbar/\\tau)/\\hbar v_F$. The kink is invisible once $\\hbar/\\tau \\gtrsim$ (intrinsic singularity width); for Pb at 100 K this is roughly the threshold the Chalk River measurements actually operated at [9]. **Operational consequence:** a \"no Kohn anomaly observed\" claim in a sample with $\\hbar/\\tau \\sim 1$ meV is consistent with the anomaly being present and merely smeared — null results constrain $\\tau$ as much as they constrain electronic structure.\n\n**A5 — Perturbative regime: $\\Pi/M\\omega_0^2 \\ll 1$.** When the polarization correction is no longer small compared with the bare phonon energy, the linearized kink picture collapses into a full softening — the **Peierls endpoint**. KCP is the canonical realization: the LA branch reaches $\\omega(2k_F)=0$ and the lattice dimerizes [12]. The term **giant Kohn anomaly** properly belongs to this borderline regime and not to the few-percent dips in 3D simple metals; conflating the two erases the only quantitative distinction the literature offers between a renormalization and a transition.\n\n**A6 — Single-band, single-Fermi-surface.** With multiple sheets, the bubble is a sum $\\sum_{n,n'}\\chi_{nn'}$ and inter-band terms can either reinforce a kink (nesting between distinct sheets, e.g. the Cr SDW vector [22]) or cancel it. The \"image the Fermi surface\" program needs the sheet decomposition before it can assign $\\mathbf{q}^\\ast$ to a $2k_F$ vector.\n\n**A7 — Three-dimensional Fermi surface with finite curvature.** This is the assumption most often imported uncritically. The functional forms differ qualitatively with dimension:\n\n| Dim. | $\\chi^{(0)}(\\mathbf{q})$ near $2k_F$ | Phonon kink | FS-geometry caveat |\n|---|---|---|---|\n| 1 | $\\chi \\propto -\\ln\\mid q-2k_F\\mid$ (divergent) | full softening at any finite $g$ | always nests perfectly |\n| 2 | finite jump in $\\partial\\chi/\\partial q$ at $2k_F$ | $\\partial\\omega/\\partial q$ jumps | convex FS required; concavity smears |\n| 3 | $\\chi-\\chi(2k_F) \\propto (q-2k_F)\\ln\\mid q-2k_F\\mid$ | slope-divergence kink (Woll–Kohn) | parallel tangent planes [6] |\n\nIn strict 1D the perturbative kink does not exist as a separate object — the divergence is the instability, and Fröhlich's 1954 model [3] together with Peierls' 1955 argument [4] already contains everything Kohn's 1959 note would later sharpen for 3D [2]. In 2D the anomaly survives but only on convex Fermi surfaces; a hyperbolic patch contributes a real-part feature that is not a non-analyticity. Quasi-1D and quasi-2D materials (KCP, NbSe$_2$, TaSe$_2$, the cuprates) interpolate: the cleaner the nesting, the closer the system sits to A5's failure, and the more the \"anomaly\" is in fact a precursor to a CDW [13, 14]. Importing the 3D Woll–Kohn slope-divergence machinery into a quasi-1D analysis and reporting the resulting fit as a \"Kohn anomaly\" is the most common abuse of the term — it is at best a CDW precursor and at worst a strong-coupling lattice instability that owes little to the perturbative polarization bubble."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Smoking Guns vs Circumstantial Evidence", "markdown": "## Signatures: Smoking Guns vs Circumstantial Evidence\n\nA Kohn anomaly is one of those features that everyone claims to see and few actually demonstrate. The literature is littered with phonon dips labelled \"Kohn-like\" on the strength of a single softened branch in a single direction. The Pb 1962 standard [9, 10] is harder than that, and the standard is worth restating: a genuine identification requires (i) the right wavevector, (ii) the right functional form, (iii) the right dimensional scaling, and (iv) a corroborating probe that rules out instrumental and lattice-only explanations. Anything less is circumstantial.\n\n### The four smoking guns\n\n**(1) Wavevector match to an independently measured FS spanning vector.** The anomaly must sit at a $\\mathbf{q}$ that connects two FS sheets with parallel tangent planes — diametral or non-diametral, per Woll–Kohn [6] and Afanas'ev–Kagan [7]. The 1967 Stedman mapping in Pb is the gold standard: dozens of kinks across multiple branches, every one assigned to a specific spanning vector consistent with the de Haas–van Alphen Fermi surface [8]. A dip at a $\\mathbf{q}$ that does *not* correspond to any FS caliper is, by definition, not a Kohn anomaly.\n\n**(2) Correct non-analytic form.** In 3D, the singular contribution to $\\omega^2(\\mathbf{q})$ scales as $|q-2k_F|\\ln|q-2k_F|$, so $\\partial\\omega/\\partial q$ diverges logarithmically — a *slope* kink, not a dip. In 2D (convex FS), $\\chi(q)$ acquires a finite slope discontinuity at $2k_F$, weaker still. In quasi-1D, $\\chi(q)\\sim \\ln(\\Lambda/|q-2k_F|)$ diverges, and one can drive $\\omega(2k_F)\\to 0$ — the KCP \"giant\" case [12]. Plotting $\\omega(q)$ and fitting the predicted functional form, not just locating a minimum, is the actual test. The Pb data fit the log-times-linear template; KCP fits the log divergence; a Slater–Pauling-type ferroelectric soft mode does neither.\n\n**(3) Dimensional and geometric scaling.** The kink amplitude carries the geometry: a curvature prefactor $|\\kappa_1\\kappa_2|^{-1/2}$ from the FS caliper, and a matrix element $|g_{\\mathbf{q}\\nu}|^2$ that selects which branches respond. Longitudinal modes typically dominate in simple metals; in graphene, symmetry restricts the effect to the $E_{2g}$ (G) and $A_1'$ (K) branches [15]. A \"Kohn anomaly\" claimed for a transverse acoustic branch with no symmetry-allowed coupling is suspect.\n\n**(4) Independent probe agreement.** Neutron TAS measures $\\omega(\\mathbf{q})$; X-ray TDS measures $\\sum_\\nu \\mathrm{coth}(\\hbar\\omega/2k_BT)/\\omega^2$, weighted differently. Paskin \u0026 Weiss confirmed the Pb kinks via TDS in the same year as Brockhouse's neutron data [10, 9], precisely to defeat the \"resolution artefact\" objection. Modern equivalents: IXS plus INS; or DFPT plus Raman with electrostatic gating, which decouples $E_F$ from strain [16, 15].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDecision tree separating Kohn anomalies from look-alikes\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eObserved phonon dip / softening at wavevector q*\u003c/text\u003e\u003crect x=\"280\" y=\"40\" width=\"160\" height=\"36\" fill=\"none\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"360\" y=\"63\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eDoes q* = FS caliper?\u003c/text\u003e\u003cline x1=\"360\" y1=\"76\" x2=\"180\" y2=\"110\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"360\" y1=\"76\" x2=\"540\" y2=\"110\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"240\" y=\"98\" fill=\"#7ee0a3\" font-size=\"13\"\u003eyes\u003c/text\u003e\u003ctext x=\"470\" y=\"98\" fill=\"#ff7a90\" font-size=\"13\"\u003eno\u003c/text\u003e\u003crect x=\"80\" y=\"112\" width=\"200\" height=\"36\" fill=\"none\" stroke=\"#7ee0a3\"/\u003e\u003ctext x=\"180\" y=\"135\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eSlope kink, not just a dip?\u003c/text\u003e\u003crect x=\"440\" y=\"112\" width=\"200\" height=\"36\" fill=\"none\" stroke=\"#ff7a90\"/\u003e\u003ctext x=\"540\" y=\"129\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eNot a Kohn anomaly:\u003c/text\u003e\u003ctext x=\"540\" y=\"144\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003esoft mode / anharmonic / zone-fold\u003c/text\u003e\u003cline x1=\"180\" y1=\"148\" x2=\"100\" y2=\"182\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"180\" y1=\"148\" x2=\"260\" y2=\"182\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"120\" y=\"170\" fill=\"#7ee0a3\" font-size=\"12\"\u003eyes\u003c/text\u003e\u003ctext x=\"240\" y=\"170\" fill=\"#ffb86b\" font-size=\"12\"\u003eno\u003c/text\u003e\u003crect x=\"20\" y=\"184\" width=\"170\" height=\"36\" fill=\"none\" stroke=\"#7ee0a3\"/\u003e\u003ctext x=\"105\" y=\"207\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003eRight d-dependent shape?\u003c/text\u003e\u003crect x=\"200\" y=\"184\" width=\"170\" height=\"36\" fill=\"none\" stroke=\"#ffb86b\"/\u003e\u003ctext x=\"285\" y=\"201\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003ePossibly Kohn, but\u003c/text\u003e\u003ctext x=\"285\" y=\"215\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003echeck anharmonic background\u003c/text\u003e\u003cline x1=\"105\" y1=\"220\" x2=\"60\" y2=\"254\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"105\" y1=\"220\" x2=\"150\" y2=\"254\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"70\" y=\"244\" fill=\"#7ee0a3\" font-size=\"12\"\u003eyes\u003c/text\u003e\u003ctext x=\"140\" y=\"244\" fill=\"#ff7a90\" font-size=\"12\"\u003eno\u003c/text\u003e\u003crect x=\"10\" y=\"256\" width=\"100\" height=\"36\" fill=\"none\" stroke=\"#7aa2ff\"/\u003e\u003ctext x=\"60\" y=\"279\" fill=\"#7aa2ff\" font-size=\"12\" text-anchor=\"middle\"\u003e2nd probe?\u003c/text\u003e\u003crect x=\"120\" y=\"256\" width=\"160\" height=\"36\" fill=\"none\" stroke=\"#ff7a90\"/\u003e\u003ctext x=\"200\" y=\"279\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ewrong dimensionality\u003c/text\u003e\u003cline x1=\"60\" y1=\"292\" x2=\"40\" y2=\"326\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"60\" y1=\"292\" x2=\"80\" y2=\"326\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"30\" y=\"316\" fill=\"#7ee0a3\" font-size=\"12\"\u003eyes\u003c/text\u003e\u003ctext x=\"90\" y=\"316\" fill=\"#ffb86b\" font-size=\"12\"\u003eno\u003c/text\u003e\u003crect x=\"0\" y=\"328\" width=\"80\" height=\"40\" fill=\"none\" stroke=\"#7ee0a3\"/\u003e\u003ctext x=\"40\" y=\"346\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003eSmoking\u003c/text\u003e\u003ctext x=\"40\" y=\"361\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003egun\u003c/text\u003e\u003crect x=\"90\" y=\"328\" width=\"100\" height=\"40\" fill=\"none\" stroke=\"#ffb86b\"/\u003e\u003ctext x=\"140\" y=\"346\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003eCircumstantial\u003c/text\u003e\u003ctext x=\"140\" y=\"361\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003e(needs more)\u003c/text\u003e\u003ctext x=\"360\" y=\"388\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\"\u003egreen = pass; orange = unresolved; red = look-alike\u003c/text\u003e\u003c/svg\u003e\n*Figure: Discriminating a genuine Kohn anomaly from its look-alikes. The Pb 1962 case passes every node [9, 10]; KCP passes them in the quasi-1D limit [12]; many claimed \"Kohn anomalies\" in 3D transition-metal alloys stop at the second node.*\n\n### The circumstantial cases — and how to upgrade them\n\n**A bare dip or softening.** Could be a ferroelectric soft mode (driven by long-range dipole forces, not by $\\chi_e$), an anharmonic instability (intrinsically temperature-driven, no FS signature), a zone-boundary folding artefact, or a Jahn–Teller distortion. *Discriminating test:* does the dip *move* with $E_F$? Gating, alloying, or pressure that shifts $k_F$ should shift $q^*$ accordingly. A ferroelectric soft mode does not care about $E_F$.\n\n**Raman line shift with doping or strain.** The G-line stiffening in gated graphene [16] is the modern poster child. But strain alone shifts the G line, and anharmonic renormalization can mimic the trend. *Discriminating test:* the Kohn contribution is *non-analytic* — logarithmic in $|E_F|$ — and changes sign across $|E_F|=\\hbar\\omega_G/2$ (the nonadiabatic threshold). Mechanical strain gives a linear, monotonic shift with no log feature and no Pauli-blocking kink. Lee et al.'s $\\omega_G$–$\\omega_{2D}$ decomposition exploits exactly this orthogonality [23].\n\n**Linewidth enhancement.** A broad phonon could be Kohn-driven (decay into electron–hole pairs at the FS) or just defect-scattering broadened. *Discriminating test:* the electron–phonon FWHM is set by $|g|^2$ and the joint DOS, both of which respond to $E_F$; defect broadening does not. It should also be *isotope-independent* — the electronic part of the self-energy does not see ion mass, while anharmonic broadening scales with $M^{-1/2}$. An isotope-substitution series separates the two cleanly.\n\n**Pressure- or temperature-driven softening.** Strong-coupling Migdal–Eliashberg theory predicts that a near-CDW Kohn anomaly should *deepen with cooling* (Fermi function sharpens) and *shift with pressure* (FS reshapes). A purely structural soft mode is governed by Cochran-style $\\omega^2\\propto (T-T_c)$ Curie behavior with no $\\mathbf{q}^*$ tracking. Buyers et al.'s temperature-dependent Mo anomaly [20] is the clean example of the Kohn signature passing this test.\n\nThe honest summary: of the dozens of phonon dips labelled \"Kohn anomaly\" in the post-1970 transition-metal and dichalcogenide literature, only a minority survive all four tests. The Pb [8, 9, 10], Mo [20], graphite/graphene [15, 16], and KCP [12] cases are unambiguous. Most others are at best circumstantial — useful clues, not closed cases."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: How the Term Lost Its Edges", "markdown": "## Use \u0026 Abuse: How the Term Lost Its Edges\n\nThe phrase \"Kohn anomaly\" enjoys the kind of currency that erodes meaning. By 2026 a literature search returns the term applied to almost any concavity in a phonon branch — frequently with no demonstration that the relevant $\\mathbf{q}$ is a Fermi-surface spanning vector, no test of the predicted functional form, and no discussion of whether the adiabatic recipe being used is even legitimate. Four abuse patterns recur.\n\n### Pattern I — \"It dips, therefore it is\"\n\nThe Woll–Kohn singularity has a specific signature [6]: in 3D the dynamical matrix carries a contribution $\\propto |q-2k_F|\\,\\ln|q-2k_F|$, producing a *slope* discontinuity in $\\omega(q)$ — not a broad valley. In 2D with a convex Fermi surface the contribution to $\\omega^2(q)$ is a square-root cusp $\\propto \\sqrt{q-2k_F}\\,\\Theta(q-2k_F)$ on one side; in quasi-1D the divergence is logarithmic in $\\omega^2$ itself, and only then strong enough to collapse the mode [13]. A genuine identification therefore requires (a) an independent determination that $\\mathbf{q}^*$ matches a Fermi-surface caliper, including the *nondiametral* spanning vectors with parallel tangent planes that Woll \u0026 Kohn emphasized [6] and Stedman et al. exploited in Pb [8]; (b) a functional-form test against ln, square-root, or step, not a quadratic fit; (c) evidence that the feature sharpens as $T\\to 0$ and broadens with disorder, as $k_F$ smearing demands. The Stedman programme in Pb and Al [8, 17] still sets the bar; a single softened point in a DFPT dispersion does not clear it.\n\n### Pattern II — Quasi-1D cartoon imported into 3D\n\nThe textbook image — a soft mode collapsing to zero at $2k_F$, driving a Peierls transition — is the KCP \"giant\" anomaly of Renker et al. [12], not anything Kohn predicted for a generic metal. In 3D the kink is *parametrically* a few percent at best, easily wiped out by $\\sim$1 meV of impurity broadening or anharmonic linewidth. Yet papers routinely cite a 5–10% softening in a 3D itinerant magnet or transition-metal compound as \"evidence of incipient CDW order.\" The Pines–Nozières arithmetic [24] is unkind: with $\\lambda \\lesssim 0.5$ the fractional dip $\\delta\\omega/\\omega$ at $2k_F$ scales as $\\lambda \\times (\\text{geometric factor of order } 0.1\\text{–}0.3)$ — large dips need either flat-band nesting or strong coupling, not casual handwaving.\n\n### Pattern III — Kohn ≡ Peierls ≡ CDW\n\nThese three labels mark distinct points along the electron–phonon axis. The Kohn anomaly is the *perturbative* polarization-bubble correction to $\\omega(\\mathbf{q})$. The Peierls instability is the *strong-coupling endpoint* at which $\\omega(2k_F)\\to 0$ and the lattice dimerizes [4, 3]. The CDW is the *broken-symmetry state* with finite order parameter [13, 14]. The renormalization-group flow connecting them is nontrivial: many 2D and quasi-2D systems display Kohn-like kinks that never reach the Peierls fixed point because competing instabilities (superconductivity, magnetism, lattice anharmonicity) preempt it. Treating the three terms as synonyms confuses what was measured (a kink), what is being claimed (an instability), and what is being asserted (a phase transition).\n\n### Pattern IV — Adiabatic recipe in nonadiabatic regimes\n\nThe Migdal theorem [5] underwrites the polarization-bubble formula only when $\\omega_{\\mathrm{ph}} \\ll \\varepsilon_F$ and the electronic quasiparticles equilibrate faster than the lattice oscillates. In graphene the relevant optical phonons (G at $\\sim$200 meV, A$'_1$ at K at $\\sim$160 meV) violate this near the Dirac point; the static DFPT polarization over-softens the modes, and only the *dynamical* $\\chi(\\mathbf{q},\\omega)$ reproduces the doping-dependent stiffening of the G line [15, 16]. Calandra's group made this explicit; Li-decorated graphene [25] inherits the same caveat. Nevertheless one still finds claims of \"Kohn anomalies\" in twisted-bilayer and other flat-band systems supported by static-DFPT phonons alone — a regime where the small electronic bandwidth $W \\lesssim 10$ meV is *below* the optical phonon frequencies, and Migdal's small parameter is not small.\n\n### Where the loose usage is endemic (2020–2026)\n\n- **Twisted bilayer and moiré graphene.** Flat-band correlated metals with $W \\sim \\omega_{\\mathrm{ph}}$; static-DFPT \"Kohn anomalies\" are routinely reported without dynamical or nonadiabatic checks. Treat with extreme skepticism unless time-dependent $\\chi(\\mathbf{q},\\omega)$ is computed.\n- **Kagome metals (AV$_3$Sb$_5$ family).** CDW-adjacent transitions are reflexively labelled Kohn-driven from a single DFPT softening at M or L, even where the Fermi-surface caliper does not match the ordering wavevector and where sublattice-interference-driven instabilities are competing explanations (verify).\n- **High-pressure hydride superconductors.** Strong electron–phonon coupling makes everything look anomalous; papers occasionally call any soft branch \"Kohn\" without demonstrating $2k_F$ nesting [26, 27]. Strong coupling and phonon softening are not the same as a Kohn anomaly.\n\n### Heuristics for the abstract-scanner\n\nA title that promises \"Kohn anomaly and superconductivity in [material]\" deserves the following triage:\n\n1. Does the paper give the *spanning vector* and overlay it on the Fermi surface? If not — discount.\n2. Does it test a *functional form* (log, $\\sqrt{\\,}$) against the dispersion, or only show a dip? Dip-only — discount.\n3. Does it distinguish the Kohn contribution from anharmonic, magnetic, or band-Jahn–Teller softening? If \"we attribute the softening to\" appears without ruling out alternatives — discount.\n4. For Dirac / flat-band / correlated systems: is the polarization computed *dynamically*? Static DFPT only — discount the strength estimate.\n5. Does an inferred \"CDW tendency\" rest on a single $\\lesssim 10\\%$ 3D dip? If yes — discount the inference, not necessarily the data.\n\nA Kohn anomaly is a falsifiable claim with a definite shape, a definite location, and a definite regime of validity. Papers that treat it as a synonym for \"interesting phonon feature\" forfeit the prediction's value and inherit none of its rigor."}, {"id": "status-and-believers-checklist", "title": "Status \u0026 the Believer's Checklist", "markdown": "## Status \u0026 the Believer's Checklist\n\nThe Kohn anomaly is a concept that has aged unevenly. Three distinct sub-categories now travel under the name, and they sit at very different points in the life cycle of an idea.\n\n**The closed chapter.** The original 3D problem — perturbative kinks in the phonon branches of a clean elemental metal, mapped by triple-axis spectroscopy back onto Fermi-surface spanning vectors — is finished physics. Pb, Al, Nb, Mo, Y, and a few others were systematically Kohn-imaged between 1962 and the mid-1970s [9, 8, 17, 18, 28, 20], the Woll–Kohn slope-divergence formula [6] and its Soviet companion [7] were shown to be quantitatively faithful where the experimental resolution permitted, and Migdal–Eliashberg practice [5, 29] absorbed the anomaly as a routine ingredient of $\\alpha^2F(\\omega)$. Nothing about this corner of the field is under active dispute. Brockhouse's Nobel lecture [11] is its retrospective epitaph.\n\n**The textbook misattribution.** The image that survives in undergraduate condensed-matter texts — a phonon branch collapsing to zero at $2k_F$ and dragging the lattice into a Peierls dimerization — is not Kohn's 3D prediction. It is the 1973 Karlsruhe KCP experiment [12], read through the lens of the Fröhlich–Peierls 1D divergence [3, 4] and packaged in Grüner's CDW monograph [13]. The strict Kohn anomaly in 3D Pb is a few-percent kink; the \"giant\" version in quasi-1D is a different beast living in a different singularity class of the Lindhard function. Conflating them is the single most common pedagogical sin in the area, and it propagates into the literature whenever a small dip in a 3D phonon branch is reported as evidence of \"incipient CDW.\" It usually isn't.\n\n**The live frontier.** Where the concept is genuinely productive in 2026 is in low-dimensional and multiband systems where the adiabatic approximation breaks. Three exemplars:\n\n- *Graphene G and 2D modes.* The $E_{2g}$ phonon at $\\Gamma$ and the $A'_1$ phonon at $K$ are Kohn anomalies of the Dirac point [15]. Their doping dependence is logarithmic and *nonadiabatic*: adiabatic DFPT over-softens the G mode, while time-dependent perturbation theory reproduces the measured stiffening with $|E_F|$ [16], [Lazzeri \u0026 Mauri, PRL 97, 266407 (2006)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.97.266407). This is the cleanest experimentally verified nonadiabatic Kohn anomaly on record.\n- *MgB$_2$ $E_{2g}$.* The in-plane boron stretch sits in a small-$E_F$, two-band $\\sigma/\\pi$ pocket structure where the phonon energy is comparable to the relevant electronic scale. The Kohn softening and broadening were resolved by inelastic X-ray scattering [Baron et al., PRL 92, 197004 (2004)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.92.197004) and now anchor the modern theory of the electron-mediated anharmonicity that controls $T_c$.\n- *Phonon-mediated superconductivity by design.* The Profeta–Calandra–Mauri proposal for Li-decorated graphene [25] uses a Kohn-anomaly-enhanced matrix element as a design knob — a representative example of the concept being treated as an engineerable quantity in $\\alpha^2F$ rather than a curiosity in a dispersion plot. Heavily B-doped diamond is the same idea in a 3D Dirac-like host ([Hoesch et al., PRB 75, 144508 (2007)](https://journals.aps.org/prb/abstract/10.1103/PhysRevB.75.144508)).\n\nThe lesson is that \"Kohn anomaly\" is no longer a single observable. It is a family of phenomena indexed by dimensionality, by adiabaticity, and by coupling strength. Treat it that way and the literature stops looking confused.\n\n### The believer's checklist\n\nA claim of *Kohn anomaly* in a new system should pass all eight tests below. The bracketed labels refer to the seven load-bearing assumptions A1–A7 of §3.\n\n1. **Spanning vector matches.** The anomalous $\\mathbf{q}^\\*$ coincides, within experimental error, with a measured Fermi-surface spanning vector — not a vector \"consistent with\" a band-structure calculation. [A6]\n2. **Parallel tangent planes.** The two FS patches connected by $\\mathbf{q}^\\*$ have demonstrably parallel tangent planes, including the nondiametral case of Woll \u0026 Kohn [6] and Afanas'ev–Kagan [7]. A bare nesting peak in $\\chi(\\mathbf{q})$ is not the same statement. [A6]\n3. **Right functional form.** The fit to $\\omega(\\mathbf{q})$ near $\\mathbf{q}^\\*$ is the dimension-appropriate Lindhard non-analyticity: $|q-2k_F|\\ln|q-2k_F|$ slope divergence in 3D [6], a slope jump in 2D (convex FS), a logarithmic softening in quasi-1D [3, 13]. A generic concavity is not evidence. [A3, A5]\n4. **Adiabatic regime declared.** The work states whether $\\omega_{\\mathbf{q}\\nu}$ is small or large compared with the electronic broadening of the states being connected, and uses static $\\chi(\\mathbf{q})$ or dynamic $\\chi(\\mathbf{q},\\omega)$ accordingly. Graphene-G–style nonadiabatic systems require the time-dependent treatment [16, 15]. [A1]\n5. **Independent corroboration.** The FS geometry implicated is confirmed by an independent probe — thermal-diffuse X-ray scattering [10], ARPES nesting maps, dHvA, IXS. The Pb programme [8, 17] is the gold standard. [A6]\n6. **Broadening budget.** Impurity and thermal broadening are estimated and shown not to wash out the singularity at the temperature and sample quality used. A kink invisible above 10 K cannot be reported from a 300 K dataset. [A3]\n7. **Coupling-strength honesty.** Either $\\lambda$ is small enough for the perturbative self-energy of §2 to apply, or the work explicitly invokes the giant-anomaly / incipient-Peierls regime [12, 13] and uses strong-coupling tools. The middle ground is where most of the misuses live. [A2, A7]\n8. **Alternatives excluded.** Anharmonic soft modes, ferroelectric instabilities, structural soft modes from zone-boundary band-Jahn–Teller physics, and CDW-from-correlations scenarios [14] are explicitly ruled out before \"Kohn anomaly\" is asserted. [A4]\n\nA feature that passes 1–8 is a Kohn anomaly in the strict sense. A feature that passes only a subset should be reported with the subset declared. The current literature would be quieter, sharper, and more useful if every author asked which of these eight boxes their data actually ticks.\n\nSources:\n- [Lazzeri \u0026 Mauri, *Nonadiabatic Kohn anomaly in a doped graphene monolayer*, PRL 97, 266407 (2006)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.97.266407)\n- [Baron et al., *Kohn Anomaly in MgB$_2$ by Inelastic X-Ray Scattering*, PRL 92, 197004 (2004)](https://pubmed.ncbi.nlm.nih.gov/15169439/)\n- [Hoesch et al., *Nonadiabatic Kohn anomaly in heavily boron-doped diamond*, PRB 75, 144508 (2007)](https://www.researchgate.net/publication/317399566_Nonadiabatic_Kohn_Anomaly_in_Heavily_Boron-Doped_Diamond)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough of this dossier in the historian's chair. Here is where I plant the flag.\n\n### What I will defend\n\nThe Kohn anomaly, *as originally constructed*, is one of the cleanest examples of analytical structure in many-body physics surviving contact with experiment. The chain — Lindhard's $\\chi_0(\\mathbf{q})$ has a non-analyticity at $2k_F$ wherever the Fermi surface admits parallel tangent planes; that non-analyticity is inherited by the phonon self-energy through $|g_{\\mathbf q\\nu}|^2 \\chi_0(\\mathbf q)$; the kink is therefore a *geometrical* probe of the Fermi surface, independent of the detailed band structure away from it — is correct, calculable, and has been verified non-trivially in Pb, in 2H-NbSe$_2$, in Cr, and (with the nonadiabatic correction) in graphene. I will defend the proposition that the slope-divergence formula of Woll \u0026 Kohn (1962) is the *operational* definition of the effect, and that any usage divorced from a specified spanning vector $\\mathbf{Q}^* = 2\\mathbf{k}_F$ with parallel-tangent geometry is sloppy.\n\nI will also defend, against the textbook compression, that the singularity belongs to Lindhard (1954); Kohn's contribution was to recognize its observable consequence in the lattice. The credit reallocation is not pedantry — it matters because every modern misuse begins by forgetting that $\\chi_0$ is the object with the singularity.\n\n### What is shakier than the literature admits\n\nFour specific load-bearing assumptions are routinely smuggled past the reader:\n\n1. **The adiabatic approximation.** Migdal's theorem requires $\\omega_{\\mathbf{q}\\nu} \\ll \\varepsilon_F$, but for Kohn-anomaly *visibility* the relevant scale is the quasiparticle decay rate at $2k_F$. In Dirac and nodal systems this comparison routinely fails; DFPT results in those materials are quantitatively wrong, not qualitatively suggestive. The community knows this for graphene and pretends it does not apply to TMDs and twisted bilayers.\n2. **A well-defined Fermi surface.** Half the materials currently labelled as hosting \"Kohn anomalies\" are strongly correlated or pseudogapped, where the very object $2\\mathbf{k}_F$ is ill-defined. Calling a dip at the nesting vector of a *bare* band a Kohn anomaly in a Mott-adjacent system is a category error.\n3. **Constant matrix element.** The geometric statement about $\\chi_0$ becomes a statement about $\\omega^2(\\mathbf{q})$ only after multiplying by $|g_{\\mathbf{q}\\nu}|^2$. In layered transition-metal dichalcogenides $g$ varies as fast across the Brillouin zone as $\\chi_0$ does; the \"Kohn-anomaly position\" people quote is the position of a *product*, not of the Fermi-surface feature.\n4. **CDW $\\Leftrightarrow$ Kohn-anomaly softening.** The 2H-NbSe$_2$ literature has, I believe, been quietly demoting this equivalence for fifteen years; the textbooks have not noticed.\n\n### Three open questions, ranked\n\n1. **A clean theory of the nonadiabatic Kohn anomaly in nodal-line and Weyl metals** — the static-$\\chi_0$ recipe is provably wrong here and no replacement is canonical.\n2. **Disentangling matrix-element structure from $\\chi_0(\\mathbf{q})$ structure in TMD softenings** — without this, every \"nesting-driven CDW\" claim in the family is unfalsifiable.\n3. **Operational criteria for a 2D logarithmic Kohn anomaly in moiré flat bands** — the bandwidth/phonon-frequency ratio is in the wrong regime for any existing framework.\n\n### Reading path\n\n1. Woll \u0026 Kohn (1962), *Phys. Rev.* **126**, 1693 — the actual derivation, including the parallel-tangent-plane rule. Start here, not at the 1959 PRL.\n2. Brockhouse *et al.* (1962) on Pb — the first detection, motivated explicitly by Kohn's prediction; pair with Paskin \u0026 Weiss's X-ray TDS confirmation [10].\n3. Afanas'ev \u0026 Kagan (1963), *JETP* **16**, 1030 — the parallel Soviet derivation for arbitrary Fermi-surface topology; rarely cited, fully equivalent.\n4. Piscanec, Lazzeri, Mauri, Ferrari \u0026 Robertson (2004), *Phys. Rev. Lett.* **93**, 185503 — the modern reframing: Kohn anomalies as nonadiabatic, observable in Raman, in a 2D Dirac metal.\n5. Weber *et al.* on 2H-NbSe$_2$ inelastic X-ray scattering (2011, *PRL* **107**, 107403) — the cleanest contemporary case where the anomaly is real, the nesting story is *not*, and the matrix element does the work."}], "references": [{"n": 1, "title": "On the properties of a gas of charged particles", "authors": ["J. Lindhard"], "year": 1954, "venue": "Mat. Fys. Medd. Dan. Vid. Selsk. 28, no. 8", "url": "https://www.osti.gov/biblio/4405425", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Image of the Fermi Surface in the Vibration Spectrum of a Metal", "authors": ["W. Kohn"], "year": 1959, "venue": "Physical Review Letters 2, 393", "url": "https://doi.org/10.1103/PhysRevLett.2.393", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "On the theory of superconductivity: the one-dimensional case", "authors": ["H. Fröhlich"], "year": 1954, "venue": "Proceedings of the Royal Society A 223, 296", "url": "https:/ n"], "year": 1970, "venue": "Physical review. B, Solid state", "url": "https://doi.org/10.1103/physrevb.2.4743", "cited_by": 27, "bucket": "earliest"}, {"n": 18, "title": "The lattice dynamics of niobium II. Kohn anomalies in niobium", "authors": ["R I Sharp"], "year": 1969, "venue": "Journal of Physics C Solid State Physics", "url": "https://doi.org/10.1088/0022-3719/2/3/307", "cited_by": 21, "bucket": "earliest"}, {"n": 19, "title": "Lattice dynamics of niobium-molybdenum alloys (and the Kohn-anomaly interpretation of d-band nesting)", "authors": ["S. K. Sinha", "B. N. Harmon"], "year": 1975, "venue": "Phys. Rev. Lett. 35, 1515", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Temperature Dependence of a Kohn Anomaly in Molybdenum", "authors": ["W. J. L. Buyers", "B. M. Powell", "A. D. B. Woods"], "year": 1972, "venue": "Canadian Journal of Physics", "url": "https://doi.org/10.1139/p72-398", "cited_by": 8, "bucket": "earliest"}, {"n": 21, "title": "Lattice Dynamics of Niobium-Molybdenum Alloys", "authors": ["B. M. Powell", "P. Martel", "A. D. B. Woods"], "year": 1968, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.171.727", "cited_by": 181, "bucket": "earliest"}, {"n": 22, "title": "Thermal Diffuse X-Ray Scattering Measurements of the Fermi Surface of Chromium", "authors": ["James Costello", "John W. Weymouth"], "year": 1969, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.184.694", "cited_by": 8, "bucket": "earliest"}, {"n": 23, "title": "Optical separation of mechanical strain from charge doping in graphene", "authors": ["Ji Eun Lee", "Gwanghyun Ahn", "Jihye Shim", "Young Sik Lee", "Sunmin Ryu"], "year": 2012, "venue": "Nature Communications", "url": "https://doi.org/10.1038/ncomms2022", "cited_by": 1072, "bucket": "canon"}, {"n": 24, "title": "The Theory of Quantum Liquids, Vol. I: Normal Fermi Liquids", "authors": ["D. Pines", "P. Nozières"], "year": 1966, "venue": "W. A. Benjamin", "url": "", "ci <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
