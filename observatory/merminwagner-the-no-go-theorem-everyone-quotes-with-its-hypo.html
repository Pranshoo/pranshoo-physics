 13}, {"year": 1973, "event": "QFT version: in 1+1 spacetime dimensions a quantum field theory cannot have a normalizable Goldstone boson; spontaneous breaking of a continuous internal symmetry is impossible. Sometimes called the Coleman theorem and conflated with Mermin–Wagner although the operator-algebra setting differs.", "who": "Sidney Coleman", "work": "‘There are no Goldstone bosons in two dimensions’, Commun. Math. Phys. 31, 259", "kind": "formalization", "ref": 16}, {"year": 1977, "event": "Sharper rigorous statement: in 2D O(N≥2) ferromagnets the two-point correlation decays at least as a power, not faster. Complementary upper bound to the Mermin–Wagner lower bound on disorder.", "who": "Oliver A. McBryan \u0026 Thomas Spencer", "work": "‘On the decay of correlations in SO(n)-symmetric ferromagnets’, Commun. Math. Phys. 53, 299", "kind": "theory", "ref": 11}, {"year": 2017, "event": "Discovery of ferromagnetism in monolayer CrI₃ — widely (and badly) reported as ‘breaking Mermin–Wagner’. The theorem's hypotheses fail here because of strong single-ion anisotropy (Ising-like gap), so it never forbade order in this system to begin with.", "who": "Gong et al.", "work": "Nature 546, 270", "kind": "revival", "ref": 17}, {"year": 2018, "event": "Re-examination of what the Hohenberg–Mermin–Wagner theorem actually says vs. how it is invoked: enumerates the hypotheses (short-range, isotropy, equilibrium, infinite size, T \u003e 0) and the standard abuses. The single best modern reference on misuse.", "who": "Bertrand I. Halperin", "work": "‘On the Hohenberg–Mermin–Wagner theorem and its limitations’, arXiv:1812.00220 / J. Stat. Phys. 175, 521 (2019)", "kind": "revival", "ref": 10}], "neglected": [{"name": "Felix Bloch (1930)", "role": "First to identify the infrared spin-wave divergence ∫ d^d k / k² that kills 2D ferromagnetic order — the entire physical content of Mermin–Wagner at spin-wave level. The 1966 paper [71] cites him in its second paragraph; textbooks almost never do.", "evidence": "Mermin \u0026 Wagner themselves credit Bloch's 1930 magnon argument in the opening of their PRL [71]; the original Z. Phys. paper [75] contains the divergence explicitly.", "ref": 1}, {"name": "Rudolf Peierls (1934/35)", "role": "Gave the analogous argument for 2D crystals — long-wavelength acoustic phonons destroy Bragg peaks — three decades before Mermin's 1968 rigorous version [73]. Mermin's 1968 paper opens by attributing the heuristic to Peierls and Landau.", "evidence": "Peierls's two papers [76][77] state the conclusion; Mermin [73] explicitly notes that his theorem rigorizes Peierls's argument.", "ref": 2}, {"name": "Lev Landau (1937)", "role": "Independent of Peierls, argued from the structure factor that a 2D solid cannot show true δ-Bragg peaks. Frequently dropped when the result is shortened to ‘Peierls argument’.", "evidence": "Phys. Z. Sowjetunion 11, 26 (1937) [78]; reproduced in the Landau Collected Papers and cited in Mermin's 1968 paper.", "ref": 4}, {"name": "N. N. Bogoliubov (1961)", "role": "Provided the inequality that is the entire technical content of the proof. Mermin and Wagner contributed the physical choice of operators; the mathematical machinery is Bogoliubov's. Many condensed-matter textbooks state the theorem with no mention of him.", "evidence": "The PRL [71] devotes its central equation (their eq. 2) to citing the Bogoliubov inequality; the inequality is derived in Bogoliubov's quasi-averages preprint [79].", "ref": 5}, {"name": "Pierre C. Hohenberg (1967)", "role": "Proved the same statement, independently, for BEC and superconducting ODLRO in d ≤ 2 — published in the same year for the same reason using the same technique. Halperin (his collaborator and friend) argues forcefully [48] that the proper name is Hohenberg–Mermin–Wagner. In the magnetism community Hohenberg is often dropped.", "evidence": "Phys. Rev. 158, 383 (1967) [72]; Halperin's historical reassessment [48] explicitly addresses the naming and credit question.", "ref": 8}, {"name": "Herbert Wagner (1966, alone)", "role": "Wagner's solo Z. Phys. paper — the broader Goldstone-theorem version — appeared the same year as the PRL but is rarely cited. As the junior co-author on the PRL his solo extension is largely invisible outside Germany.", "evidence": "Z. Phys. 195, 273 (1966) [74]: Bogoliubov-inequality bound for any spontaneously broken continuous internal symmetry, not just SU(2)-Heisenberg.", "ref": 7}, {"name": "Sidney Coleman (1973)", "role": "Operator-algebra proof in 1+1 D QFT: no normalizable Goldstone modes, so no spontaneous breaking of continuous internal symmetry. Often informally called ‘Mermin–Wagner in field theory’ but is a logically distinct theorem (Wightman axioms, not statistical-mechanics partition functions). The conflation costs Coleman his own credit.", "evidence": "Commun. Math. Phys. 31, 259 (1973) [82] — derivation uses positivity of the two-point Wightman function, not Bogoliubov's inequality.", "ref": 16}], "conflations": [{"claim": "Mermin–Wagner ‘forbids 2D order’.", "clarification": "It forbids spontaneous breaking of a continuous internal symmetry at T \u003e 0 in the thermodynamic limit with short-range, isotropic, equilibrium interactions. It says nothing about (a) discrete-symmetry order (2D Ising orders fine — Onsager), (b) anisotropic systems where the continuous symmetry is explicitly broken to a discrete subgroup by even an infinitesimal single-ion D or exchange anisotropy (which opens a gap in the would-be Goldstone mode and renders the integral finite — this is why CrI₃ [21] is allowed), (c) topological/quasi-LRO phases with algebraic correlations (BKT), (d) finite-size systems on accessible times, or (e) driven non-equilibrium order (Toner–Tu flocking [26][28])."}, {"claim": "Mermin–Wagner and Coleman's theorem are the same statement.", "clarification": "They are not. Mermin–Wagner is a finite-T statistical-mechanics theorem about Gibbs states of local lattice Hamiltonians, proved with the Bogoliubov inequality. Coleman's theorem [82] is a zero-T QFT statement in 1+1 D about Wightman fields, proved from positivity of two-point functions and the impossibility of a normalizable massless scalar in 1+1 D. The conclusions parallel each other for the same infrared reason but the regimes, axioms, and operator algebras differ."}, {"claim": "Long-range order is the same thing as a phase transition.", "clarification": "Mermin–Wagner forbids LRO; it does not forbid a phase transition. The BKT transition [81] is a thermodynamic singularity with no symmetry breaking and no nonzero order parameter — only a change in the asymptotic decay of correlations from exponential to algebraic. Authors who say ‘Mermin–Wagner forbids a phase transition in 2D’ are wrong."}, {"claim": "The theorem applies to any 2D interaction.", "clarification": "The Bogoliubov-inequality proof requires Σ_R |R|² |J(R)| \u003c ∞ — a second-moment condition on the exchange. Dipolar interactions (1/r³), unscreened Coulomb interactions, and RKKY in metals can violate this. The McBryan–Spencer [83] bounds also use short-range hypotheses. ‘2D ferromagnetism via dipolar coupling’ is not a Mermin–Wagner violation."}, {"claim": "‘Mermin–Wagner’ explains why monolayer magnets are hard.", "clarification": "Real 2D magnets (CrI₃, CrGeTe₃, Fe₃GeTe₂ [21][23]) always have spin-orbit-induced anisotropy. The relevant physics is the magnon gap Δ that anisotropy opens: T_c is suppressed only logarithmically, T_c ∼ J / ln(J/Δ), and finite at any Δ \u003e 0. Saying ‘Mermin–Wagner forbids order’ in these systems is a category error — the theorem's isotropy hypothesis fails."}, {"claim": "Mermin–Wagner applies to ‘2D systems’ generically.", "clarification": "It applies to systems with exactly two spatial dimensions in the thermodynamic limit at strictly positive T. Thin films of finite thickness can show 3D-like behavior; finite-size 2D samples can show effective LRO over the experimental window because the logarithm only diverges slowly (⟨u²⟩ ∼ ln(L/a)); driven steady states (Toner–Tu) circumvent it by violating detailed balance."}, {"claim": "The theorem is named for its discoverers.", "clarification": "Hohenberg's [72] independent and contemporaneous proof for superfluid/superconductor ODLRO is excluded by the colloquial name. Halperin [48] makes the historical case that ‘Hohenberg–Mermin–Wagner’ is the correct attribution; the cold-atom community largely uses it."}], "sections": [{"id": "why-this-mattered", "title": "Why this mattered: closing four decades of confusion about 2D order", "markdown": "## Why this mattered: closing four decades of confusion about 2D order\n\nBy 1965 every condensed-matter theorist who had thought carefully about reduced dimensionality had reached the same private conclusion and could prove none of it. Bloch had shown in 1930 that the magnon density of states in $d$ spatial dimensions made the thermal spin deviation\n\n$$\\langle S^z_0 - S \\rangle \\;\\sim\\; \\int\\!\\frac{d^d k}{(2\\pi)^d}\\,\\frac{1}{e^{\\beta\\hbar\\omega_k}-1}, \\qquad \\hbar\\omega_k \\approx Dk^2,$$\n\nlogarithmically divergent in $d=2$ and power-divergent in $d=1$ [1]. Read literally, the integral consumed the entire ground-state magnetization at any $T\u003e0$. But the calculation begged its own question: it assumed a spin-wave expansion around a broken-symmetry state whose existence was precisely what one wanted to establish. The argument was a self-consistency failure dressed as a proof, and Bloch himself was careful about that.\n\nPeierls, four years later in a Solvay-style volume that almost nobody outside continental Europe owned [2], and again in 1935 in a more leisurely French exposition [3], gave the structural analogue: in two dimensions the mean-square displacement of a harmonic crystal grows as\n\n$$\\langle u^2 \\rangle \\;\\sim\\; \\frac{k_B T}{\\rho c_s^2}\\int_{1/L}^{1/a}\\!\\frac{dk}{k} \\;\\sim\\; \\ln(L/a),$$\n\nso Bragg peaks are smeared to power-law singularities and a strictly 2D solid has no long-range translational order. Landau, working independently in 1937, recast the same conclusion in order-parameter language: the structure factor cannot show $\\delta$-function Bragg components, the long-wavelength fluctuations of the displacement field guarantee it [4]. Three eminent people, three correct heuristics, and not one rigorous theorem. The arguments all leaned on harmonic approximations of objects whose existence was the question at issue. Worse, they were physically *suggestive* in a way that invited skepticism: the divergence was logarithmic, very slow, and the laboratory window between $1/L$ and $1/a$ was always finite. Maybe the integrals were artifacts of the linearization. Maybe nonlinear corrections healed them. There were no nonperturbative inequalities to settle the matter.\n\nThe instrument that ended this stalemate was supplied not by a magnetism theorist but by Bogoliubov, who in his 1961 Dubna preprint on quasi-averages [5] derived the inequality\n\n$$\\tfrac{1}{2}\\langle\\{A,A^\\dagger\\}\\rangle\\,\\langle[[C,H],C^\\dagger]\\rangle \\;\\geq\\; \\frac{k_B T\\,|\\langle[C,A]\\rangle|^2}{\\,\\langle[[C,H],C^\\dagger]\\rangle\\,}\\cdot\\;\\text{(after a Schwarz step)},$$\n\n— the exact form usually quoted as \"$\\langle A A^\\dagger\\rangle\\,\\langle [[C,H],C^\\dagger]\\rangle \\ge k_B T\\,|\\langle[C,A]\\rangle|^2$\". With the right choice of $A$ (an order parameter at wavevector ${\\bf k}$) and $C$ (the symmetry-restoring mode), the right-hand side scales as the square of the magnetization and the left-hand side is controlled by the magnon dispersion's small-$k$ behavior. Mermin and Wagner saw what the inequality was for. In a single one-and-a-half-page PRL [6] they chose $A = S^+(\\mathbf{k})$ and $C = S^-(-\\mathbf{k}-\\mathbf{K})$, summed, integrated, and produced the bound\n\n$$|M(T)|^2 \\;\\leq\\; \\text{const}\\cdot \\frac{T}{\\bigl[\\ln(\\text{const}/|M|)\\bigr]} \\quad (d=2),$$\n\nself-consistently forcing $M=0$ at every $T\u003e0$ in the isotropic, short-range Heisenberg model in one and two dimensions. The same 1966 volume of *Zeitschrift für Physik* carried Wagner's solo paper [7] extending the argument to *any* spontaneously broken continuous internal symmetry — the Goldstone-theorem version that QFT-minded readers should have been quoting all along, and that the senior-author effect erased. A year later, in *Physical Review*, Hohenberg [8] redid the calculation for the off-diagonal long-range order of superfluids and superconductors. Two years after that, Mermin alone [9] closed the Peierls–Landau loop with a fully rigorous proof of the absence of crystalline LRO in 2D, choosing $A = \\rho_{\\mathbf{G}}$, the Fourier component of the density at a reciprocal-lattice vector. Three theorems, one inequality, the same infrared verdict. Halperin's 2018 retrospective [10] argues — correctly — that the honest name is **Hohenberg–Mermin–Wagner**.\n\nWhat had been a generation of heuristics was now a chain of inequalities, and the template generalized. Within a decade McBryan and Spencer [11] sharpened the result to a *power-law upper bound* on correlations in 2D O($N{\\ge}2$) ferromagnets, complementing the Mermin–Wagner lower bound on disorder. Berezinskii had already noted the escape valve — quasi-long-range order with algebraic correlations and a topological transition driven by vortex unbinding [12] — and Kosterlitz and Thouless turned the valve into a theory [13], for which they would share the 2016 Nobel [14][15]. Coleman, working in a completely different formalism, proved the field-theoretic analogue in 1+1 D using Wightman positivity rather than Bogoliubov's inequality [16]; the parallel conclusion has been a source of confusion ever since, because the regimes (thermal Gibbs state vs. zero-temperature vacuum) and the operator algebras (local lattice vs. Wightman field) are not the same, even though the infrared physics rhymes.\n\nThis is the cast and this is why it mattered: the 1966–68 cascade did not merely \"prove what people already believed.\" It supplied the analytic machine on which essentially every subsequent equilibrium no-go result in statistical mechanics is built, and it drew the line between what dimensionality forbids (continuous-symmetry breaking with short-range interactions in thermal equilibrium) and what dimensionality permits (discrete-symmetry order, quasi-LRO, anisotropy-stabilized order [17][18], non-equilibrium order). The four decades of confusion were closed. The four decades of misquotation were about to begin."}, {"id": "the-physics-properly", "title": "The physics, properly: the Bogoliubov inequality and the infrared verdict", "markdown": "## The physics, properly: the Bogoliubov inequality and the infrared verdict\n\nThe Heisenberg Hamiltonian with an explicit symmetry-breaking field along an ordering wavevector $\\vec K$ ($\\vec K=0$ ferromagnet, $\\vec K$ on the AF zone-corner for the staggered case) is\n\n$$H \\;=\\; -\\tfrac{1}{2}\\sum_{\\vec R,\\vec R'} J(\\vec R-\\vec R')\\,\\vec S_{\\vec R}\\!\\cdot\\!\\vec S_{\\vec R'} \\;-\\; h\\sum_{\\vec R} e^{i\\vec K\\cdot\\vec R}\\,S^{z}_{\\vec R}.$$\n\nThe order parameter is $M(T,h)=N^{-1}\\langle S^{z}_{-\\vec K}\\rangle$ where $S^{\\alpha}_{\\vec k}=\\sum_{\\vec R}e^{i\\vec k\\cdot\\vec R}S^{\\alpha}_{\\vec R}$. The whole proof is one inequality applied with one inspired pair of operators.\n\nFor any operators $A,C$ and any Gibbs state $\\rho=e^{-\\beta H}/Z$,\n\n$$\\tfrac{1}{2}\\bigl\\langle\\{A,A^{\\dagger}\\}\\bigr\\rangle\\;\\bigl\\langle\\bigl[[C,H],C^{\\dagger}\\bigr]\\bigr\\rangle \\;\\geq\\; k_{B}T\\,\\bigl|\\langle[C,A]\\rangle\\bigr|^{2}. \\qquad(\\star)$$\n\nThis is Bogoliubov's inequality [5]. It is a Cauchy–Schwarz statement in the Duhamel inner product $(X,Y)\\equiv\\int_{0}^{\\beta}\\!d\\tau\\,\\langle X^{\\dagger}e^{-\\tau H}Ye^{\\tau H}\\rangle/\\beta$: the anticommutator on the left controls the susceptibility, the double commutator controls the spectral first moment (an *f*-sum rule), and the commutator on the right is the would-be order parameter. The inequality is exact, finite-volume, and makes no spin-wave or saddle-point assumption.\n\nChoose\n\n$$A \\;=\\; S^{-}_{-\\vec k-\\vec K}, \\qquad C \\;=\\; S^{+}_{\\vec k}.$$\n\nThen $[C,A]=[S^{+}_{\\vec k},S^{-}_{-\\vec k-\\vec K}]=2\\,S^{z}_{-\\vec K}$, so\n\n$$\\bigl|\\langle[C,A]\\rangle\\bigr|^{2} \\;=\\; 4N^{2}\\,|M(T,h)|^{2}.$$\n\nThe right-hand side of $(\\star)$ therefore *knows about the order parameter at every $\\vec k$*. The trick is to make the left-hand side know almost nothing.\n\nThe double commutator is bounded by the *f*-sum rule. Using $1-\\cos(\\vec k\\!\\cdot\\!\\vec R)\\le \\tfrac{1}{2}|\\vec k|^{2}|\\vec R|^{2}$ and the same for the field term,\n\n$$\\bigl\\langle\\bigl[[S^{+}_{\\vec k},H],S^{-}_{-\\vec k}\\bigr]\\bigr\\rangle \\;\\leq\\; N\\Bigl[\\,\\vec k^{2}\\,Q\\;+\\;2h\\,|M|\\,\\Bigr], \\qquad Q \\equiv S(S+1)\\!\\sum_{\\vec R}|\\vec R|^{2}|J(\\vec R)|.$$\n\nThe crucial step is $Q\u003c\\infty$ — assumption **A1** (short-range exchange, $\\sum_{\\vec R}|\\vec R|^{2}|J(\\vec R)|\u003c\\infty$). Dipolar $1/r^{3}$, unscreened Coulomb, and metallic RKKY tails all break it [10].\n\nSum $(\\star)$ over the first Brillouin zone. The anticommutator obeys the exact sum rule $\\sum_{\\vec k}\\langle\\{S^{-}_{-\\vec k},S^{+}_{\\vec k}\\}\\rangle=N^{2}\\langle\\{S^{-}_{R},S^{+}_{R}\\}\\rangle\\leq 2N^{2}S(S+1)$, independent of $T$, $h$, and dimension. So\n\n$$N\\,S(S+1)\\;\\geq\\;4\\,k_{B}T\\,|M|^{2}\\sum_{\\vec k}\\frac{1}{\\vec k^{2}Q+2h|M|}.$$\n\nThe Riemann sum becomes $N v_{0}(2\\pi)^{-d}\\!\\int\\! d^{d}k$ in the thermodynamic limit (**A4**), and the integral is dominated by its infrared end. In $d=2$,\n\n$$\\int\\!\\frac{d^{2}k}{\\vec k^{2}Q+2h|M|}\\;=\\;\\frac{\\pi}{Q}\\ln\\!\\Bigl(1+\\tfrac{k_{\\max}^{2}Q}{2h|M|}\\Bigr)\\;\\xrightarrow[h\\to 0]{}\\;\\frac{\\pi}{Q}\\,|\\ln h|.$$\n\nCombining and inverting:\n\n$$\\boxed{\\;|M(T,h)|^{2}\\;\\leq\\;\\frac{C\\,T}{|\\ln h|}\\;}\\qquad (d=2,\\;\\text{Heisenberg},\\;h\\to 0^{+}). $$\n\nThe constant $C=\\pi Q S(S+1)/(v_{0}k_{B})$ absorbs lattice geometry and the second moment of $J$. In $d=1$ the integral grows as $1/\\sqrt{h}$ rather than $\\ln h$, giving the stronger bound $|M|^{2}\\lesssim T h^{1/2}$. In $d\\geq 3$ the integral is finite as $h\\to 0$ and the bound is empty — order is *allowed*, though not required.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eInfrared behaviour of the Mermin-Wagner integral in dimensions 1, 2, 3\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"378\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003einfrared regulator m² = 2h|M|/Q (decreasing →)\u003c/text\u003e\u003ctext x=\"35\" y=\"190\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\" transform=\"rotate(-90 35 190)\"\u003e∫ d^d k /(k² + m²)\u003c/text\u003e\u003ctext x=\"660\" y=\"358\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003eh → 0\u003c/text\u003e\u003ctext x=\"90\" y=\"358\" fill=\"#e8e6e1\" font-size=\"13\"\u003eh ~ 1\u003c/text\u003e\u003cpath d=\"M 120 320 Q 250 310 400 305 T 670 300\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"600\" y=\"290\" fill=\"#7ee0a3\" font-size=\"14\"\u003ed=3: finite (order permitted)\u003c/text\u003e\u003cpath d=\"M 120 310 L 200 280 L 300 250 L 400 215 L 500 175 L 600 130 L 660 95\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"500\" y=\"155\" fill=\"#7aa2ff\" font-size=\"14\"\u003ed=2: ~ |ln h| (marginal — forbids LRO)\u003c/text\u003e\u003cpath d=\"M 120 305 Q 200 260 280 200 T 420 110 T 560 55 T 640 30\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"370\" y=\"80\" fill=\"#ff7a90\" font-size=\"14\"\u003ed=1: ~ 1/√h (forbids LRO strongly)\u003c/text\u003e\u003cline x1=\"80\" y1=\"100\" x2=\"680\" y2=\"100\" stroke=\"#ffb86b\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"105\" y=\"94\" fill=\"#ffb86b\" font-size=\"13\"\u003esum-rule ceiling ∝ S(S+1)\u003c/text\u003e\u003ctext x=\"380\" y=\"22\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\"\u003eThe 2D curve crosses the ceiling at any T \u0026gt; 0 ⇒ |M|² → 0.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The Bogoliubov sum rule places a $T$-independent ceiling on the anticommutator. The right-hand integral grows without bound as $h\\to 0$ in $d\\leq 2$; in $d=2$ this growth is the logarithm $|\\ln h|$, marginal but lethal. In $d=3$ the integral saturates and the inequality places no constraint on $M$.*\n\nThe verdict $M(T,h\\!\\to\\!0^{+})=0$ at any $T\u003e0$ requires *every* one of the following:\n\n- **A1** Short-range exchange, $\\sum_{\\vec R}|\\vec R|^{2}|J(\\vec R)|\u003c\\infty$ — needed to bound the double commutator [6][10].\n- **A2** A continuous internal symmetry — the operators $S^{\\pm}$ generate the broken group; a discrete symmetry has no $\\vec k\\to 0$ soft mode [7][16].\n- **A3** Strict isotropy. Any single-ion or exchange anisotropy adds a $\\vec k$-independent gap $\\Delta$ to the double commutator: $\\vec k^{2}Q\\to\\vec k^{2}Q+\\Delta$, the IR integral converges at $h=0$, and the bound *vanishes*.\n- **A4** The thermodynamic limit. The Riemann sum becomes an integral only as $N\\to\\infty$.\n- **A5** $T\u003e0$ strictly. The Duhamel inner product collapses to the ordinary one at $T=0$ and $(\\star)$ becomes vacuous; ground-state order is unforbidden.\n- **A6** Equilibrium Gibbs state. $(\\star)$ uses $\\rho=e^{-\\beta H}/Z$; for driven or non-equilibrium steady states the inequality has no analogue [19][20].\n- **A7** Spatial dimension exactly $d\\leq 2$ in the bulk sense — finite-thickness slabs eventually crossover to 3D [10].\n- **A8** A local lattice Hamiltonian with translation invariance — needed for the Fourier decomposition and the *f*-sum rule.\n\nWagner's solo 1966 paper [7] proves that the choice $A=Q^{-}_{\\vec k}$, $C=Q^{+}_{\\vec k}$ with $Q^{\\pm}$ the broken-symmetry generators makes (**A2**) explicit: *any* spontaneously broken continuous internal symmetry has a soft mode whose IR weight kills the order parameter. Hohenberg's contemporaneous proof [8] just replaces $S^{\\pm}$ with $\\hat\\rho_{\\vec k}$ and the particle-current; the inequality and the verdict are identical. The eight labels A1–A8 are the load-bearing hypotheses; §3 walks through what fails when each is relaxed, and §6 recasts them as a checklist for experimental claims."}, {"id": "strict-conditions-failure-modes", "title": "Strict conditions and failure modes: where each Ai breaks", "markdown": "## Strict conditions and failure modes: where each Ai breaks\n\nThe Hohenberg–Mermin–Wagner proof is a chain of eight hypotheses welded to one infrared integral. Snap any link and the conclusion lapses — sometimes trivially, sometimes with a calculable replacement scale. Label the assumptions as they appear in the Bogoliubov-inequality derivation: **A1** short-range exchange (finite second moment $\\sum_R |R|^2 |J(R)| \u003c \\infty$); **A2** the broken symmetry is continuous; **A3** the symmetry is *exact*, i.e. no anisotropy in $\\mathcal H$; **A4** equilibrium Gibbs state; **A5** thermodynamic limit; **A6** strictly $d \\le 2$ spatial dimensions; **A7** $T \u003e 0$; **A8** local Hamiltonian (operators with bounded commutators on a lattice). Each failure mode below is the textbook counterexample.\n\n**A1 — second moment of the exchange.** The proof bounds $|M|^2$ by an integral $\\int d^d k \\, T / [k^2 \\, \\tilde J(k) \\, (\\text{const})]$, where the $k^2$ in the denominator comes from expanding $\\tilde J(0) - \\tilde J(k)$ to leading order. That expansion requires $\\sum_R |R|^2 |J(R)| \u003c \\infty$. Dipolar coupling $\\sim 1/r^3$ in $d=2$ marginally violates this ($\\sum r^2 / r^3 \\sim \\ln L$ in 2D, divergent), and the long-wavelength dispersion acquires a non-analytic $|k|$ piece that *gaps* (for out-of-plane easy axis) or stiffens the Goldstone mode. The Maleev–Bruno result — dipolar 2D ferromagnets order at finite $T_c \\sim J S^2 / \\ln(J/E_{\\rm dip})$ — is not a violation of Mermin–Wagner; it is a failure of A1. Unscreened 2D Coulomb (Wigner crystals on liquid helium) and RKKY in a 2D metal (oscillatory $\\cos(2k_F r)/r^2$) likewise lie outside the proof's hypotheses; the rigorous 2D Wigner-crystal stability follows a separate argument that exploits exactly the long-range Coulomb tail Mermin–Wagner excludes.\n\n**A2 — continuous symmetry.** The infrared catastrophe needs a gapless Goldstone mode, which needs a continuous broken symmetry. Discrete symmetries are exempt outright: Onsager's 2D Ising solution gives $T_c = 2J/\\ln(1+\\sqrt 2)$ with genuine spontaneous magnetization. The $q$-state Potts model, $\\mathbb Z_q$ clock models for $q \\le 4$, and the Ising-anisotropic XXZ chain in 2D all order at finite $T$. ‘Mermin–Wagner forbids 2D order’ said without qualification is wrong by Onsager.\n\n**A3 — exact isotropy.** This is the failure mode of *every* real 2D magnet [17][18][21][22][23]. An easy-axis single-ion term $-D\\sum_i (S^z_i)^2$ or exchange anisotropy $\\Delta = J_\\parallel - J_\\perp$ breaks SU(2) (or U(1)) to $\\mathbb Z_2$ and opens a magnon gap $\\Delta_m \\sim \\sqrt{D J} S$ (single-ion, easy-axis) or $\\sim 2 S \\sqrt{\\Delta(J+\\Delta)}$ (exchange). The infrared integral\n\n$$\\langle S^2_\\perp \\rangle_{\\rm thermal} \\;\\sim\\; \\frac{T}{2\\pi \\rho_s} \\int_{\\Delta_m / c}^{\\Lambda} \\frac{k\\,dk}{k^2 + (\\Delta_m/c)^2}$$\n\nis now finite for any $\\Delta_m \u003e 0$, and standard renormalized-classical analysis (Chakravarty–Halperin–Nelson logic transplanted) gives\n\n$$T_c \\;\\sim\\; \\frac{4\\pi \\rho_s}{\\ln(\\rho_s / \\Delta_m)},$$\n\ni.e. logarithmically small in the anisotropy but *finite at any anisotropy*. For CrI₃ $\\Delta_m \\approx 0.3$ meV, $J \\sim 2$ meV; the prediction $T_c \\sim 30$ K matches experiment [17]. CrGeTe₃ (XXZ-anisotropic, smaller gap) sits in the same regime; NiPS$_3$, with weaker out-of-plane anisotropy and easy-plane XXZ character, shows the suppression that the same formula predicts [22]. Calling these systems ‘Mermin–Wagner violations’ is a category error: A3 fails, so the theorem never applied. Halperin [10] makes exactly this point.\n\n**A4 — equilibrium.** The proof manipulates a Gibbs state $\\rho \\propto e^{-\\beta H}$ and uses KMS positivity. Driven non-equilibrium steady states violate detailed balance and can support true LRO of a continuous order parameter in $d=2$. The Toner–Tu hydrodynamic theory of flocking [19][20] is the canonical demonstration: a polar order parameter $\\langle \\vec v\\rangle \\ne 0$ in 2D, stabilized by non-linear advective couplings absent from any equilibrium spin Hamiltonian. Numerical Vicsek-model studies [24] confirm the LRO; non-equilibrium two-temperature XY models exhibit the same phenomenology [25]. None of these contradict Mermin–Wagner — they violate A4.\n\n**A5–A7 — thermodynamic limit, dimensionality, finite $T$.** Finite systems are unconstrained: the divergence is logarithmic, $\\langle (\\delta\\phi)^2\\rangle \\sim (T/2\\pi\\rho_s)\\ln(L/a)$, so over any realistic $L$ the suppression of $\\langle M\\rangle$ is a numerical prefactor of order $T/\\rho_s$, not zero. A 2D XY model with $\\rho_s/T = 5$ and $L = 10^4 a$ has order parameter $\\sim L^{-T/4\\pi\\rho_s} \\approx 0.6$ — measurable, even though the strict $L\\to\\infty$ value is zero. The thin-film case (finite thickness $N_z$, lateral $L\\to\\infty$) crosses over to 3D behavior at a Ginzburg-like scale; the rigorous statement still requires $N_z = 1$. At $T = 0$ the Bogoliubov bound vanishes identically and quantum 2D antiferromagnets (square-lattice Heisenberg) order — Néel order at $T = 0$ in 2D is allowed and observed. Strict $d \u003e 2$ removes the IR divergence ($\\int d^d k / k^2$ converges at $d \u003e 2$): the textbook 3D Heisenberg ferromagnet is fine.\n\n**A8 — local lattice Hamiltonian with bounded commutators.** The Bogoliubov inequality requires double commutators $\\langle [[A,H],A^\\dagger]\\rangle$ to be finite — a locality/boundedness condition. Long-range Hamiltonians with $J(r) \\sim 1/r^{d+\\sigma}$ for $\\sigma \\le 2$ evade the proof (this is the A1 statement in dual form), and so do non-local interactions in synthetic settings: trapped-ion crystals with power-law $1/r^\\alpha$ couplings, cavity-QED mediated all-to-all exchange, and Rydberg arrays with controllable range. Whenever the engineered range pushes the second moment to infinity, 2D LRO at $T \u003e 0$ is permitted — and is observed in cold-atom experiments where the engineered interaction tail decides whether the BKT or true-LRO scenario obtains [26].\n\nThe audit closes a useful inverse [27]: *all eight* hypotheses are needed. Each known ‘violation’ in the literature is the failure of exactly one — usually A3, occasionally A1 or A4 — and the violation is quantitative, with a calculable replacement scale ($\\Delta_m$, $E_{\\rm dip}$, $L$, or the drive amplitude) that controls how the would-be ordered phase reappears."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: direct vs indirect — telling absence from suppression", "markdown": "## Signatures: direct vs indirect — telling absence from suppression\n\nMermin–Wagner forbids order only in the thermodynamic limit; every experiment is finite. The question that matters at the bench is therefore not \"did we see a Curie step?\" — many 2D systems do — but \"does the candidate magnetisation obey the way the theorem says it must under extrapolation?\" Telling genuine absence of LRO from a small-but-extant order parameter requires watching how $M$, $\\chi$, and $G(r)$ depend on size, anisotropy, and microscopic interaction range — not on the bare existence of a feature in $\\chi(T)$.\n\n### Direct signatures: the smoking guns\n\n**(D1) Logarithmic finite-size collapse of M(T,L).** Bogoliubov's inequality applied at fixed $L$ gives [6][7][10]\n\n$$|M(T,L)|^2 \\;\\le\\; \\frac{c\\,T}{\\rho_s\\,\\ln(L/a)},$$\n\nwith $\\rho_s$ the spin stiffness, $a$ the lattice spacing, $c$ an $O(1)$ constant set by the second moment of $J(R)$. The smoking gun is a one-parameter collapse: $M(T,L)\\sqrt{\\ln(L/a)}$ plotted vs $T$ for several $L$ should overlay, and the $L\\to\\infty$ extrapolation at any fixed $T\u003e0$ must hit zero. The slow logarithm is exactly why apparent order survives out to $L \\sim 10^2$ lattice constants in classical Monte Carlo on the isotropic $d=2$ Heisenberg model; only sequences spanning at least a decade in $L$ resolve the trend, and a single $M(T)$ curve on a single sample is *evidentially useless*.\n\n**(D2) BKT escape signatures.** When Goldstone modes destroy $M$ but a topological transition survives [12][13], the diagnostic is paired:\n\n$$\\xi(T)\\sim\\exp\\!\\Big[b/\\sqrt{T-T_{\\rm BKT}}\\Big],\\qquad G(r)\\sim r^{-\\eta(T)},\\quad \\eta(T_{\\rm BKT})=\\tfrac14.$$\n\nThe universal exponent $\\eta=1/4$ at the transition — equivalently the helicity-modulus jump of magnitude $2T_{\\rm BKT}/\\pi$ — is the strictest experimentally accessible mark that the system has thrown away $M=0$ *and* saved itself topologically. McBryan–Spencer [11] guarantees algebraic upper bounds on $G(r)$ in any $d=2$ O$(N\\!\\ge\\!2)$ ferromagnet, so observing $G(r)\\sim r^{-\\eta}$ is consistent with — not a violation of — Mermin–Wagner.\n\n### Indirect signatures and their confounders\n\nA broad susceptibility maximum without divergence, a Curie–Weiss tail with $|\\Theta_{\\rm CW}|\\gg T^\\ast$, or exponential $G(r)\\sim e^{-r/\\xi}$ with large but finite $\\xi$ above a thermal crossover scale are all consistent with Mermin–Wagner suppression. None is diagnostic. Four physically distinct mechanisms produce the same circumstantial picture.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDiscriminating Mermin-Wagner from confounders\u003c/title\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\"\u003e\"Suppressed M, broad χ peak in 2D\" — which mechanism?\u003c/text\u003e\u003cline x1=\"360\" y1=\"30\" x2=\"360\" y2=\"44\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"100\" y1=\"44\" x2=\"640\" y2=\"44\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"100\" y1=\"44\" x2=\"100\" y2=\"58\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"280\" y1=\"44\" x2=\"280\" y2=\"58\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"460\" y1=\"44\" x2=\"460\" y2=\"58\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"640\" y1=\"44\" x2=\"640\" y2=\"58\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003crect x=\"25\" y=\"58\" width=\"150\" height=\"46\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" rx=\"4\"/\u003e\u003ctext x=\"100\" y=\"78\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\"\u003eGenuine MW\u003c/text\u003e\u003ctext x=\"100\" y=\"96\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eisotropic, T \u0026gt; 0\u003c/text\u003e\u003crect x=\"205\" y=\"58\" width=\"150\" height=\"46\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\" rx=\"4\"/\u003e\u003ctext x=\"280\" y=\"78\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\"\u003eAnisotropy gap\u003c/text\u003e\u003ctext x=\"280\" y=\"96\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eΔ in magnons\u003c/text\u003e\u003crect x=\"385\" y=\"58\" width=\"150\" height=\"46\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" rx=\"4\"/\u003e\u003ctext x=\"460\" y=\"78\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\"\u003eDipolar 1/R³\u003c/text\u003e\u003ctext x=\"460\" y=\"96\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003elong-range J(R)\u003c/text\u003e\u003crect x=\"565\" y=\"58\" width=\"150\" height=\"46\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\" rx=\"4\"/\u003e\u003ctext x=\"640\" y=\"78\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\"\u003eQuasi-2D film\u003c/text\u003e\u003ctext x=\"640\" y=\"96\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e3D crossover\u003c/text\u003e\u003ctext x=\"360\" y=\"125\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\"\u003ePredicted signature\u003c/text\u003e\u003ctext x=\"100\" y=\"148\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eM·√ln L → 0\u003c/text\u003e\u003ctext x=\"100\" y=\"166\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003egapless ω(k)\u003c/text\u003e\u003ctext x=\"280\" y=\"148\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003esharp T_c, full M(0)\u003c/text\u003e\u003ctext x=\"280\" y=\"166\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eT_c ∼ J/ln(J/Δ)\u003c/text\u003e\u003ctext x=\"460\" y=\"148\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ein-plane T_c \u0026gt; 0\u003c/text\u003e\u003ctext x=\"460\" y=\"166\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eω ∝ √k branch\u003c/text\u003e\u003ctext x=\"640\" y=\"148\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eT_c(d) saturates\u003c/text\u003e\u003ctext x=\"640\" y=\"166\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e3D scaling, large d\u003c/text\u003e\u003cline x1=\"20\" y1=\"186\" x2=\"700\" y2=\"186\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"4,3\"/\u003e\u003ctext x=\"360\" y=\"206\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\"\u003eDiscriminator (what to measure)\u003c/text\u003e\u003ctext x=\"100\" y=\"232\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eM(T,L)·√ln L\u003c/text\u003e\u003ctext x=\"100\" y=\"250\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ecollapse over\u003c/text\u003e\u003ctext x=\"100\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003edecade in L\u003c/text\u003e\u003ctext x=\"280\" y=\"232\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eINS / FMR sees Δ\u003c/text\u003e\u003ctext x=\"280\" y=\"250\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eIsing exponents\u003c/text\u003e\u003ctext x=\"280\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eat T_c\u003c/text\u003e\u003ctext x=\"460\" y=\"232\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eangular G(r) tail\u003c/text\u003e\u003ctext x=\"460\" y=\"250\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eshape-dep T_c\u003c/text\u003e\u003ctext x=\"460\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e√k INS branch\u003c/text\u003e\u003ctext x=\"640\" y=\"232\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eT_c(d) fit:\u003c/text\u003e\u003ctext x=\"640\" y=\"250\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1 − (d₀/d)^(1/ν)\u003c/text\u003e\u003ctext x=\"640\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e3D Heisenberg ν ≈ 0.71\u003c/text\u003e\u003cline x1=\"20\" y1=\"290\" x2=\"700\" y2=\"290\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"4,3\"/\u003e\u003ctext x=\"360\" y=\"312\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\"\u003eSeparate confounder: disorder-rounded transition\u003c/text\u003e\u003ctext x=\"360\" y=\"332\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eHarris criterion νd ≥ 2; smearing ∝ disorder^(1/(2−νd)), not 1/ln L\u003c/text\u003e\u003ctext x=\"360\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eOnly the green branch is a genuine Mermin–Wagner verdict.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Four mechanisms that produce a suppressed-but-finite $\\chi$ in a 2D sample, with the experimental observable that distinguishes each. Three branches correspond to a hypothesis of the theorem failing (isotropy, short range, $d=2$); only the green branch is a genuine Mermin–Wagner verdict.*\n\n**Anisotropy-gapped 2D system.** Any single-ion $D$-tensor or symmetric exchange anisotropy that reduces $\\mathrm{SO}(3)\\to\\mathbb Z_2$ opens a magnon gap $\\Delta$. The infrared integral $\\int d^2k/(k^2+\\Delta/\\rho_s)$ is finite, and a 2D-Ising transition appears at $T_c\\sim J/\\ln(J/\\Delta)$ — only logarithmically suppressed below 3D values [18][10]. *Discriminator:* a gap in inelastic neutron scattering or ferromagnetic resonance. Monolayer CrI₃ exhibits $\\Delta\\!\\approx\\!0.3$ meV from INS, which is precisely why the theorem never forbade order there [17][10]. NiPS₃, with much weaker out-of-plane anisotropy, sits on the other side of the same dial [22].\n\n**Dipolar (long-range) coupling.** The Bogoliubov-inequality proof requires $\\sum_R|R|^2|J(R)|\u003c\\infty$; dipolar $1/R^3$ is borderline in 2D and renormalises the small-$k$ magnon dispersion from $\\omega\\propto k^2$ to $\\omega\\propto\\sqrt{k}$ for in-plane modes, making $\\int d^2k/\\omega$ convergent. *Discriminators:* (i) angular anisotropy of $G(r)$ inherited from the dipolar kernel, (ii) the characteristic $\\sqrt{k}$ branch in INS, (iii) shape-dependent $T_c$ at fixed thickness. \"2D ferromagnetism by dipolar coupling\" in ultrathin Fe films is not a Mermin–Wagner violation — the second-moment hypothesis fails.\n\n**Finite-thickness / quasi-2D crossover.** A film of $d$ layers shows 3D Heisenberg behaviour at wavelengths $\\lambda\\gg da$ and 2D behaviour for $\\lambda\\ll da$; the infrared integral is regulated at $k_{\\min}\\sim 1/(da)$, giving $T_c(d)$ saturating from below as $d$ grows. *Discriminator:* the shift-exponent scaling $T_c(d)=T_c^\\infty[1-(d_0/d)^{1/\\nu}]$ with 3D Heisenberg $\\nu\\!\\approx\\!0.71$. Superlattice studies of LaFeO₃/SrTiO₃ used precisely this scaling to argue for Mermin–Wagner behaviour in the few-layer limit [28].\n\n**Disorder-rounded transition.** Quenched bond or site disorder smears the singularity by an amount scaling as a power of disorder strength, not as $1/\\ln L$. *Discriminator:* the Harris criterion $\\nu d\\ge 2$; if violated, the transition is destabilised toward a disorder-controlled fixed point, with $\\chi$ broadening symmetric in $T-T_c$. Confusing this with Mermin–Wagner suppression is endemic in dilute monolayer magnets, where both effects can be present.\n\n### The verdict criterion\n\nA claim of \"Mermin–Wagner behaviour\" in a 2D material is credible only when (i) a gapless magnon branch is seen in INS or FMR (the isotropy hypothesis holds), (ii) $M(T,L)$ exhibits the logarithmic-in-$L$ collapse over at least a decade in $L$ (the prediction is verified, not merely assumed), and (iii) the dominant interactions satisfy $\\sum_R|R|^2|J(R)|\u003c\\infty$ (the second-moment hypothesis holds). Absent (i)–(iii), what is being reported is a *suppression* signature — anisotropy-gapped, dipolar-stabilised, finite-thickness, or disorder-rounded — and the appropriate citation is not [6] but the corresponding mechanism."}, {"id": "use-and-abuse", "title": "Use and abuse: how 'Mermin–Wagner forbids' became a hollow incantation", "markdown": "## Use and abuse: how 'Mermin–Wagner forbids' became a hollow incantation\n\nBy the late 1990s \"Mermin–Wagner forbids it\" had hardened into a referee's reflex — invoked satisfyingly against any claim of 2D order and almost never accompanied by a check of the hypotheses A1–A8 the theorem actually requires. Six misuse patterns dominate the literature; each is diagnosable by asking which $A_i$ the author silently dropped.\n\n### Pattern 1 — Anisotropy invisibilized (A3 dropped)\n\nThe post-2017 monolayer-magnet boom — CrI₃ [17], CrGeTe₃ [17], Fe₃GeTe₂, CrTe₂ [23] — was almost universally introduced as \"breaking\" or \"evading\" Mermin–Wagner. It does neither. CrI₃ has single-ion easy-axis anisotropy $D \\approx 0.3$ meV; CrGeTe₃ has weaker anisotropy and consequently a lower $T_c$; Fe₃GeTe₂ is strongly Ising-like. The continuous SU(2) of A3 is broken explicitly down to $\\mathbb{Z}_2$ at the Hamiltonian level. The magnon dispersion acquires a gap $\\Delta \\sim 2 S \\sqrt{D J}$, the offending integral $\\int d^2k\\,(k^2+\\Delta^2/(2SJ))^{-1}$ becomes finite, and one recovers $k_B T_c \\sim J / \\ln(J/\\Delta)$ — finite for any $\\Delta\u003e0$ and logarithmically robust to small anisotropy. Halperin's retrospective [10] puts it bluntly: the theorem forbade nothing in these materials to begin with [18]. **Diagnostic: is the order-parameter manifold continuous in the Hamiltonian, not just in an idealized cartoon?** If a $D S_z^2$ term, XXZ exchange anisotropy [22], or a Kitaev bond-directional term [29] is present, A3 is gone.\n\n### Pattern 2 — Long-range exchange ignored (A1 dropped)\n\nThe Bogoliubov-inequality proof requires $\\sum_{\\vec R} |\\vec R|^2 |J(\\vec R)| \u003c \\infty$. Dipolar coupling projected into a 2D layer is marginal once the angular structure is included; the second moment generically diverges. Unscreened Coulomb fails outright. RKKY in a 2D metal oscillates as $\\cos(2 k_F r)/r^2$ — second moment ill-defined. Citing Mermin–Wagner against a dipolar 2D ferromagnet, a Wigner crystal, or a 2D RKKY lattice is a hypothesis-skipping error. The modern $4f$-layered-magnet literature occasionally rediscovers this with surprise. **Diagnostic: does the dominant exchange decay faster than $1/r^{d+2}$?** If not, A1 is gone.\n\n### Pattern 3 — LRO conflated with phase transition (the conclusion misread)\n\nMermin–Wagner forbids a nonzero order parameter; it does not forbid a thermodynamic singularity. The Berezinskii–Kosterlitz–Thouless transition [12][13][14][15] is a phase transition by every reasonable definition — a vortex-unbinding singularity with a universal jump in the helicity modulus and a crossover from exponential to algebraic correlations — yet $\\langle e^{i\\theta}\\rangle = 0$ on both sides. Sentences of the form \"Mermin–Wagner forbids a phase transition in this 2D XY system\" are simply wrong. The McBryan–Spencer bound [11] sharpens the point: it pins the decay as *at most* power-law, leaving quasi-LRO untouched. **Diagnostic: is the author equating \"order parameter\" with \"phase\"?** Quasi-LRO is a phase, just not a symmetry-broken one.\n\n### Pattern 4 — Coleman conflation (wrong axioms, wrong regime)\n\nColeman's 1973 theorem [16] is routinely cited as \"Mermin–Wagner in field theory.\" It is not the same theorem. Coleman's proof uses positivity of the Wightman two-point function in $1{+}1$ D Minkowski QFT and rules out a normalizable massless Goldstone scalar; the setting is $T=0$, Lorentz-invariant, infinite system, Wightman axioms. Mermin–Wagner is $T\u003e0$, non-relativistic, lattice, Gibbs-state statistical mechanics, Bogoliubov inequality [5]. The infrared catastrophe coincides in spirit and dimension-counting; the operator algebras differ. Conflating them lets authors invoke \"Mermin–Wagner\" against $T=0$ quantum critical points in $2{+}1$ D — where the relativistic analogue does not bite — or against gauge-theory roughening [30], where the relevant constraint is different again. **Diagnostic: thermal-lattice or zero-temperature relativistic?** They demand different theorems.\n\n### Pattern 5 — Non-equilibrium and finite size (A4–A6 dropped)\n\nToner and Tu showed that 2D flocks support true long-range orientational order [19][20]; this does not violate the theorem because detailed balance fails — A4 is gone, and the active-matter literature [24] has industrialized the workaround. Active nematics, driven steady states, externally pumped condensates, and two-temperature XY models [25] all live outside the regime; invoking the theorem against them is a category error. The finite-size escape is the symmetric abuse: the disorder-producing logarithm $\\langle\\phi^2\\rangle \\sim (T/2\\pi J)\\ln(L/a)$ grows so slowly that experimentally relevant 2D samples display effective order over their probed window. Kiaba et al.'s LaFeO₃/SrTiO₃ superlattice data [28] are advertised as \"observation of Mermin–Wagner behavior\" precisely because finite thickness and finite lateral size make the asymptotic statement compatible with the measured $M(T)$ curve only because A5 (thermodynamic limit) is never reached. **Diagnostic: does the experiment access $L\\to\\infty$ at $T\u003e0$ in true 2D under detailed balance?** If any one fails, the theorem is silent.\n\n### Pattern 6 — The truncated citation chain\n\nThe standard citation \"Mermin and Wagner 1966\" elides at least five contributions. Bloch [1] supplied the infrared spin-wave divergence in 1930; Peierls [2][3] and Landau [4] supplied the structure-factor argument for crystals in the 1930s — Mermin's own 1968 paper [9] credits both; Bogoliubov [5] supplied the inequality that is the entire technical content of the proof; Hohenberg [8] proved the same statement contemporaneously for ODLRO in superfluids and superconductors; Wagner's solo paper [7] extended to arbitrary broken continuous internal symmetries. Halperin [10] is the most explicit modern push to restore \"Hohenberg–Mermin–Wagner\" as the honest minimal name. **Diagnostic: does the bibliography contain Hohenberg [8] and Bogoliubov [5]?** If not, the author is citing the slogan, not the theorem."}, {"id": "status-and-believers-checklist", "title": "Status today and the believer's checklist", "markdown": "## Status today and the believer's checklist\n\nAs a mathematical statement the Hohenberg–Mermin–Wagner theorem is closed. The Bogoliubov-inequality core [6][8][5], the McBryan–Spencer upper bound on correlation decay [11], Berezinskii–Kosterlitz–Thouless quasi-LRO as the licensed escape valve [12][13], and Coleman's $1\\!+\\!1$ D QFT analogue [16] all sit in their finished forms. No serious proof has been overturned, none of the hypotheses has been quietly loosened, and the rigorous-statistical-mechanics community treats the result as part of the bedrock — visible most recently in Bauerschmidt–Helmuth–Swan's hyperbolic-$\\sigma$-model extension [31] and in Taggi–Wu's dimer / monomer-double-dimer generalization [32]. Halperin's 2018 retrospective [10] is the standing corrective: it re-derives the bound, makes the hypothesis list explicit, extends the theorem to itinerant electron systems without spin–orbit coupling, and flags the standard abuses. It should be required reading for anyone writing the phrase \"Mermin–Wagner\" into a manuscript.\n\nThe sociological status is the opposite. \"Mermin–Wagner forbids it\" now appears in introductions, referee reports, and DFT-paper concluding paragraphs without the slightest accompanying check that any of the hypotheses $A_1\\!-\\!A_8$ actually holds. The pattern is stable across two decades and has only worsened with the 2D-materials boom: Gong's 2017 monolayer-CrI₃ discovery [17] was packaged as \"breaking Mermin–Wagner\" despite the theorem never having forbidden order in a system with strong single-ion anisotropy [18]; Zhang et al.'s 2021 CrTe₂ ultrathin films [23] inherited the same headline. The escape clause is sociologically invisible: the anisotropy gap $\\Delta$ that is doing the work renders the magnon integral\n$$\\langle S^{x,y}_{\\perp}\\rangle^{2}_{T}\\;\\lesssim\\;T\\!\\int\\!\\!\\frac{d^{2}k}{(2\\pi)^{2}}\\;\\frac{1}{Jk^{2}+\\Delta}\\;\\sim\\;\\frac{T}{4\\pi J}\\,\\ln\\!\\frac{J\\Lambda^{2}}{\\Delta}$$\nfinite for any $\\Delta\u003e0$, giving the now-standard estimate $T_c \\sim J/\\ln(J/\\Delta)$ that fits the CrI₃, CrGeTe₃ and Fe₃GeTe₂ data quantitatively [18][23]. The theorem is not violated; it never applied.\n\nTwo recent results sharpen the picture. Kiaba et al. used muon-spin rotation on LaFeO₃/SrTiO₃ superlattices to compare 1-, 2- and 3-monolayer LaFeO₃ slabs and observed exactly what the theorem demands: static Néel order in the multilayers; dynamical fluctuations down to the lowest measured $T$ in the monolayer where the residual single-ion anisotropy is small enough that the logarithm has not yet won [28] — the cleanest positive observation of HMW physics on record. Conversely Fischetti and Vandenberghe applied the inequality to flexural ZA modes in 2D crystals with broken horizontal-mirror symmetry [33], showing that suspended graphene-like sheets must ripple — an HMW corollary buried for a decade inside the carrier-mobility literature. The theorem cuts both ways: when its hypotheses are satisfied the prediction is sharp and experimentally visible; when they are not, invoking the name is decoration.\n\nA residue of unfinished business persists. Itinerant ferromagnetism without spin–orbit coupling is now rigorously proved absent [10], yet Stoner arguments still appear in metal-magnetism manuscripts as though the issue were settled the other way. The dipolar case ($J(R)\\sim |R|^{-3}$, second-moment divergent) is not covered — and is precisely the interaction that stabilizes ultrathin Fe films, repeatedly described in the wrong language. Non-equilibrium order — Toner–Tu flocking [19][20], two-temperature driven XY [25] — sits entirely outside the equilibrium hypothesis and is the canonical illustration that \"2D\" alone determines nothing.\n\n### The AETHER checklist\n\nBefore publishing or believing any paper that invokes Mermin–Wagner:\n\n1. **Which hypotheses $A_1$–$A_8$ are satisfied — explicitly?** Short range, isotropy of a continuous symmetry, equilibrium Gibbs state, thermodynamic limit, $T\u003e0$, local Hamiltonian, bounded local Hilbert space, second-moment finite exchange. If any is unstated, the invocation is decorative.\n2. **Is the symmetry actually continuous in the Hamiltonian?** Single-ion $D(S^z)^2$, exchange anisotropy, Dzyaloshinskii–Moriya, Zeeman — quantify the resulting magnon gap $\\Delta$ and the estimate $T_c \\sim J/\\ln(J/\\Delta)$. An anisotropy budget is not optional.\n3. **Is the interaction range second-moment finite?** $\\sum_R |R|^{2}\\,|J(R)|\u003c\\infty$. Unscreened dipolar in 2D, bare Coulomb, and RKKY fail this and lie outside the proof and outside [11].\n4. **Equilibrium and thermodynamic limit on the relevant scale?** Finite samples show effective LRO via the slow logarithm $\\langle u^{2}\\rangle\\sim\\ln(L/a)$; driven steady states violate detailed balance. Both are routinely mislabeled.\n5. **Is the claim about LRO or about a phase transition?** HMW kills the order parameter, not the singularity — BKT [12][13] is a thermodynamic transition with $\\langle\\psi\\rangle\\equiv 0$.\n6. **Is Coleman's theorem [16] being invoked in disguise?** Wightman axioms, $T=0$, $(1\\!+\\!1)$ spacetime — a distinct theorem with a distinct proof; routinely miscredited.\n7. **Are Hohenberg, Bogoliubov, Bloch, Peierls and Landau credited where due?** [8][5][1][2][3][4]. The PRL [6] cites them all; the secondary literature does not. Halperin [10] makes the modern case for \"Hohenberg–Mermin–Wagner\".\n8. **Is the experimental signature direct or circumstantial?** Direct: finite-size scaling of $\\langle M\\rangle(L,T)$, the BKT essential singularity $\\xi\\sim\\exp(b/\\sqrt{T-T_{\\rm BKT}})$, the $2k_{B}T_{\\rm BKT}/\\pi$ universal stiffness jump, muon-spin-rotation absence-of-static-order as in [28]. Circumstantial: a missing Curie step in low-statistics susceptibility on a finite flake. The first proves what the theorem permits; the second proves nothing."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough nights staring at the Bogoliubov inequality to have formed strong views about which parts of this edifice are load-bearing and which parts are decorative. Here they are, without apology.\n\n### (a) What I would defend with my reputation\n\nThe theorem itself, stated correctly, is bulletproof. Given a lattice Hamiltonian with (i) a strictly continuous internal symmetry, (ii) finite-range or second-moment-bounded interactions $\\sum_R |R|^2 |J(R)| \u003c \\infty$, (iii) a Gibbs state at $T\u003e0$, and (iv) the thermodynamic limit taken in $d\\le 2$, the order parameter vanishes. The Bogoliubov-inequality core [6][8][5] is a four-line calculation once the auxiliary operator $A_{\\vec k}$ and the symmetry-breaking field are chosen correctly; the IR divergence $\\int d^2k / k^2$ is the entire physics. I will also defend, equally firmly, the McBryan–Spencer upper bound on correlation decay [11] as the *sharp* refinement — it tells you not merely that LRO is forbidden but that correlations decay at least as fast as a power law set by temperature, which is what BKT [12][13] then saturates from below. Together these are one of the cleanest constructions in equilibrium statistical mechanics.\n\nI will also defend the historical reattribution. The honest name is **Bloch–Peierls–Landau–Bogoliubov–Hohenberg–Mermin–Wagner**, with Coleman [16] as a logically distinct sibling. Halperin's 2018 case for restoring Hohenberg [10] is correct and overdue.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely waved through.\n\n**The short-range hypothesis.** The second-moment condition fails for dipolar magnets ($1/r^3$ in 2D is marginal), for unscreened Coulomb systems, and for RKKY in metallic monolayers. The community's habit of invoking Mermin–Wagner against any 2D magnetic claim ignores that the proof's IR integral is not the only IR integral in the problem — long-range couplings reshape it. The Bruno-style extensions tightening the dipolar case exist but are not in the textbook chain.\n\n**The \"isotropic\" hypothesis as an idealization.** No real spin Hamiltonian is rigorously isotropic. Single-ion anisotropy of order $D \\sim 10^{-2}\\,\\mathrm{meV}$ — undetectable in many measurements — already opens a magnon gap and restores order with $T_c \\sim J/\\ln(J/\\Delta)$. The honest statement is that Mermin–Wagner is a statement about a *measure-zero* point in coupling space, and real materials live near it, not on it. Calling CrI$_3$ a Mermin–Wagner violation is a category error in both directions.\n\n**The equilibrium / detailed-balance hypothesis.** Active and driven 2D systems (Toner–Tu flocks, driven-dissipative condensates) order genuinely, and the proof has nothing to say about them because the Gibbs state is gone. The literature still occasionally writes \"Mermin–Wagner forbids\" in non-equilibrium contexts; it does not.\n\n### (c) Three open questions I would actually work on\n\n1. **Sharp anisotropy-crossover scaling in real 2D magnets.** Is $T_c \\sim J/\\ln(J/\\Delta)$ the true asymptotic, or does the exchange-anisotropy class (XXZ vs. single-ion vs. Kitaev) change the prefactor in a measurable way? The cleanest test bed is CrI$_3$/CrBr$_3$ pressure-tuning [17].\n2. **Mermin–Wagner with genuinely long-range exchange.** A rigorous interpolation between $1/r^\\alpha$ exponents giving the phase boundary $\\alpha_c(d=2)$ for spontaneous breaking, beyond Bruno's estimates. The dipolar marginal case is the prize.\n3. **Goldstone-mode lifetime, not just existence, in finite 2D samples.** Mermin–Wagner is a statement about the static order parameter; the dynamical question — over what timescale does the magnon-mediated decorrelation actually destroy a prepared ordered state at given $L$, $T$ — is what experiments measure and what theory underspecifies.\n\n### (d) Reading path\n\n1. **Bloch, 1930 [1]** — the original IR argument for spin waves; read it to see the physics before the formalism arrived.\n2. **Mermin \u0026 Wagner, PRL 1966 [6]** — four pages, the proof in its native compactness; note their explicit credit to Bogoliubov.\n3. **Hohenberg, 1967 [8]** — the same theorem for ODLRO; reading it cements that the result is about IR integrals, not about magnetism.\n4. **McBryan \u0026 Spencer, 1977 [11]** — the upper bound that turns the no-go into a quantitative correlation-decay statement and meets BKT halfway.\n5. **Halperin, 2018 [10]** — the retrospective that names the credit problem and surveys what the theorem does and does not forbid in modern 2D materials."}], "references": [{"n": 1, "title": "Zur Theorie des Ferromagnetismus", "authors": ["F. Bloch"], "year": 1930, "venue": "Zeitschrift für Physik 61, 206", "url": "https://doi.org/10.1007/BF01339661", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Bemerkungen über Umwandlungstemperaturen", "authors": ["R. Peierls"], "year": 1934, "venue": "Helvetica Physica Acta 7, Supplement II, 81 (Solvay-style proceedings)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Quelques propriétés typiques des corps solides", "authors": ["R. Peierls"], "year": 1935, "venue": "Annales de l'Institut Henri Poincaré 5, 177", "url": "http://www.numdam.org/item/AIHP_1935__5_3_177_0/", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Zur Theorie der Phasenumwandlungen II", "authors": ["L. D. Landau"], "year": 1937, "venue": "Physikalische Zeitschrift der Sowjetunion 11, 26 (reprinted in Collected Papers of L. D. Landau, Pergamon, 1965)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Quasi-Averages in Problems of Statistical Mechanics", "authors": ["N. N. Bogoliubov"], "year": 1961, "venue": "JINR preprint D-781, Dubna (Russian); English in Lectures on Quantum Statistics, vol. 2, Gordon \u0026 Breach (1970)", "url": function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.

  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});

  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});

  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
