fusion about 2D order By 1965 every condensed-matter theorist who had thought carefully about reduced dimensionality had reached the same private conclusion and could prove none of it. Bloch had shown in 1930 that the magnon density of states in d spatial dimensions made the thermal spin deviation logarithmically divergent in d=2 and power-divergent in d=1 . Read literally, the integral consumed the entire ground-state magnetization at any T 0. But the calculation begged its own question: it assumed a spin-wave expansion around a broken-symmetry state whose existence was precisely what one wanted to establish. The argument was a self-consistency failure dressed as a proof, and Bloch himself was careful about that. Peierls, four years later in a Solvay-style volume that almost nobody outside continental Europe owned , and again in 1935 in a more leisurely French exposition , gave the structural analogue: in two dimensions the mean-square displacement of a harmonic crystal grows as so Bragg peaks are smeared to power-law singularities and a strictly 2D solid has no long-range translational order. Landau, working independently in 1937, recast the same conclusion in order-parameter language: the structure factor cannot show \\delta-function Bragg components, the long-wavelength fluctuations of the displacement field guarantee it . Three eminent people, three correct heuristics, and not one rigorous theorem. The arguments all leaned on harmonic approximations of objects whose existence was the question at issue. Worse, they were physically suggestive in a way that invited skepticism: the divergence was logarithmic, very slow, and the laboratory window between 1/L and 1/a was always finite. Maybe the integrals were artifacts of the linearization. Maybe nonlinear corrections healed them. There were no nonperturbative inequalities to settle the matter. The instrument that ended this stalemate was supplied not by a magnetism theorist but by Bogoliubov, who in his 1961 Dubna preprint on quasi-averages derived the inequality — the exact form usually quoted as \"\\langle A A^\\dagger\\rangle\\,\\langle [[C,H],C^\\dagger]\\rangle \\ge k B T\\, \\langle[C,A]\\rangle ^2\". With the right choice of A (an order parameter at wavevector {\\bf k}) and C (the symmetry-restoring mode), the right-hand side scales as the square of the magnetization and the left-hand side is controlled by the magnon dispersion's small-k behavior. Mermin and Wagner saw what the inequality was for. In a single one-and-a-half-page PRL they chose A = S^+(\\mathbf{k}) and C = S^-(-\\mathbf{k}-\\mathbf{K}), summed, integrated, and produced the bound self-consistently forcing M=0 at every T 0 in the isotropic, short-range Heisenberg model in one and two dimensions. The same 1966 volume of Zeitschrift für Physik carried Wagner's solo paper extending the argument to any spontaneously broken continuous internal symmetry — the Goldstone-theorem version that QFT-minded readers should have been quoting all along, and that the senior-author effect erased. A year later, in Physical Review , Hohenberg redid the calculation for the off-diagonal long-range order of superfluids and superconductors. Two years after that, Mermin alone closed the Peierls–Landau loop with a fully rigorous proof of the absence of crystalline LRO in 2D, choosing A = \\rho {\\mathbf{G}}, the Fourier component of the density at a reciprocal-lattice vector. Three theorems, one inequality, the same infrared verdict. Halperin's 2018 retrospective argues — correctly — that the honest name is Hohenberg–Mermin–Wagner . What had been a generation of heuristics was now a chain of inequalities, and the template generalized. Within a decade McBryan and Spencer sharpened the result to a power-law upper bound on correlations in 2D O(N{\\ge}2) ferromagnets, complementing the Mermin–Wagner lower bound on disorder. Berezinskii had already noted the escape valve — quasi-long-range order with algebraic correlations and a topological transition driven by vortex unbinding — and Kosterlitz and Thouless turned the valve into a theory , for which they would share the 2016 Nobel . Coleman, working in a completely different formalism, proved the field-theoretic analogue in 1+1 D using Wightman positivity rather than Bogoliubov's inequality ; the parallel conclusion has been a source of confusion ever since, because the regimes (thermal Gibbs state vs. zero-temperature vacuum) and the operator algebras (local lattice vs. Wightman field) are not the same, even though the infrared physics rhymes. This is the cast and this is why it mattered: the 1966–68 cascade did not merely \"prove what people already believed.\" It supplied the analytic machine on which essentially every subsequent equilibrium no-go result in statistical mechanics is built, and it drew the line between what dimensionality forbids (continuous-symmetry breaking with short-range interactions in thermal equilibrium) and what dimensionality permits (discrete-symmetry order, quasi-LRO, anisotropy-stabilized order , non-equilibrium order). The four decades of confusion were closed. The four decades of misquotation were about to begin. The physics, properly: the Bogoliubov inequality and the infrared verdict The physics, properly: the Bogoliubov inequality and the infrared verdict The Heisenberg Hamiltonian with an explicit symmetry-breaking field along an ordering wavevector \\vec K (\\vec K=0 ferromagnet, \\vec K on the AF zone-corner for the staggered case) is The order parameter is M(T,h)=N^{-1}\\langle S^{z} {-\\vec K}\\rangle where S^{\\alpha} {\\vec k}=\\sum {\\vec R}e^{i\\vec k\\cdot\\vec R}S^{\\alpha} {\\vec R}. The whole proof is one inequality applied with one inspired pair of operators. For any operators A,C and any Gibbs state \\rho=e^{-\\beta H}/Z, This is Bogoliubov's inequality . It is a Cauchy–Schwarz statement in the Duhamel inner product (X,Y)\\equiv\\int {0}^{\\beta}\\!d\\tau\\,\\langle X^{\\dagger}e^{-\\tau H}Ye^{\\tau H}\\rangle/\\beta: the anticommutator on the left controls the susceptibility, the double commutator controls the spectral first moment (an f -sum rule), and the commutator on the right is the would-be order parameter. The inequality is exact, finite-volume, and makes no spin-wave or saddle-point assumption. Choose Then [C,A]=[S^{+} {\\vec k},S^{-} {-\\vec k-\\vec K}]=2\\,S^{z} {-\\vec K}, so The right-hand side of (\\star) therefore knows about the order parameter at every \\vec k . The trick is to make the left-hand side know almost nothing. The double commutator is bounded by the f -sum rule. Using 1-\\cos(\\vec k\\!\\cdot\\!\\vec R)\\le \\tfrac{1}{2} \\vec k ^{2} \\vec R ^{2} and the same for the field term, The crucial step is Q\u003c\\infty — assumption A1 (short-range exchange, \\sum {\\vec R} \\vec R ^{2} J(\\vec R) \u003c\\infty). Dipolar 1/r^{3}, unscreened Coulomb, and metallic RKKY tails all break it . Sum (\\star) over the first Brillouin zone. The anticommutator obeys the exact sum rule \\sum {\\vec k}\\langle\\{S^{-} {-\\vec k},S^{+} {\\vec k}\\}\\rangle=N^{2}\\langle\\{S^{-} {R},S^{+} {R}\\}\\rangle\\leq 2N^{2}S(S+1), independent of T, h, and dimension. So The Riemann sum becomes N v {0}(2\\pi)^{-d}\\!\\int\\! d^{d}k in the thermodynamic limit ( A4 ), and the integral is dominated by its infrared end. In d=2, Combining and inverting: The constant C=\\pi Q S(S+1)/(v {0}k {B}) absorbs lattice geometry and the second moment of J. In d=1 the integral grows as 1/\\sqrt{h} rather than \\ln h, giving the stronger bound M ^{2}\\lesssim T h^{1/2}. In d\\geq 3 the integral is finite as h\\to 0 and the bound is empty — order is allowed , though not required. Figure: The Bogoliubov sum rule places a T-independent ceiling on the anticommutator. The right-hand integral grows without bound as h\\to 0 in d\\leq 2; in d=2 this growth is the logarithm \\ln h , marginal but lethal. In d=3 the integral saturates and the inequality places no constraint on M. The verdict M(T,h\\!\\to\\!0^{+})=0 at any T 0 requires every one of the following: - A1 Short-range exchange, \\sum {\\vec R} \\vec R ^{2} J(\\vec R) \u003c\\infty — needed to bound the double commutator . - A2 A continuous internal symmetry — the operators S^{\\pm} generate the broken group; a discrete symmetry has no \\vec k\\to 0 soft mode . - A3 Strict isotropy. Any single-ion or exchange anisotropy adds a \\vec k-independent gap \\Delta to the double commutator: \\vec k^{2}Q\\to\\vec k^{2}Q+\\Delta, the IR integral converges at h=0, and the bound vanishes . - A4 The thermodynamic limit. The Riemann sum becomes an integral only as N\\to\\infty. - A5 T 0 strictly. The Duhamel inner product collapses to the ordinary one at T=0 and (\\star) becomes vacuous; ground-state order is unforbidden. - A6 Equilibrium Gibbs state. (\\star) uses \\rho=e^{-\\beta H}/Z; for driven or non-equilibrium steady states the inequality has no analogue . - A7 Spatial dimension exactly d\\leq 2 in the bulk sense — finite-thickness slabs eventually crossover to 3D . - A8 A local lattice Hamiltonian with translation invariance — needed for the Fourier decomposition and the f -sum rule. Wagner's solo 1966 paper proves that the choice A=Q^{-} {\\vec k}, C=Q^{+} {\\vec k} with Q^{\\pm} the broken-symmetry generators makes ( A2 ) explicit: any spontaneously broken continuous internal symmetry has a soft mode whose IR weight kills the order parameter. Hohenberg's contemporaneous proof just replaces S^{\\pm} with \\hat\\rho {\\vec k} and the particle-current; the inequality and the verdict are identical. The eight labels A1–A8 are the load-bearing hypotheses; §3 walks through what fails when each is relaxed, and §6 recasts them as a checklist for experimental claims. Strict conditions and failure modes: where each Ai breaks Strict conditions and failure modes: where each Ai breaks The Hohenberg–Mermin–Wagner proof is a chain of eight hypotheses welded to one infrared integral. Snap any link and the conclusion lapses — sometimes trivially, sometimes with a calculable replacement scale. Label the assumptions as they appear in the Bogoliubov-inequality derivation: A1 short-range exchange (finite second moment \\sum R R ^2 J(R) \u003c \\infty); A2 the broken symmetry is continuous; A3 the symmetry is exact , i.e. no anisotropy in \\mathcal H; A4 equilibrium Gibbs state; A5 thermodynamic limit; A6 strictly d \\le 2 spatial dimensions; A7 T 0; A8 local Hamiltonian (operators with bounded commutators on a lattice). Each failure mode below is the textbook counterexample. A1 — second moment of the exchange. The proof bounds M ^2 by an integral \\int d^d k \\, T / [k^2 \\, \\tilde J(k) \\, (\\text{const})], where the k^2 in the denominator comes from expanding \\tilde J(0) - \\tilde J(k) to leading order. That expansion requires \\sum R R ^2 J(R) \u003c \\infty. Dipolar coupling \\sim 1/r^3 in d=2 marginally violates this (\\sum r^2 / r^3 \\sim \\ln L in 2D, divergent), and the long-wavelength dispersion acquires a non-analytic k piece that gaps (for out-of-plane easy axis) or stiffens the Goldstone mode. The Maleev–Bruno result — dipolar 2D ferromagnets order at finite T c \\sim J S^2 / \\ln(J/E {\\rm dip}) — is not a violation of Mermin–Wagner; it is a failure of A1. Unscreened 2D Coulomb (Wigner crystals on liquid helium) and RKKY in a 2D metal (oscillatory \\cos(2k F r)/r^2) likewise lie outside the proof's hypotheses; the rigorous 2D Wigner-crystal stability follows a separate argument that exploits exactly the long-range Coulomb tail Mermin–Wagner excludes. A2 — continuous symmetry. The infrared catastrophe needs a gapless Goldstone mode, which needs a continuous broken symmetry. Discrete symmetries are exempt outright: Onsager's 2D Ising solution gives T c = 2J/\\ln(1+\\sqrt 2) with genuine spontaneous magnetization. The q-state Potts model, \\mathbb Z q clock models for q \\le 4, and the Ising-anisotropic XXZ chain in 2D all order at finite T. ‘Mermin–Wagner forbids 2D order’ said without qualification is wrong by Onsager. A3 — exact isotropy. This is the failure mode of every real 2D magnet . An easy-axis single-ion term -D\\sum i (S^z i)^2 or exchange anisotropy \\Delta = J \\parallel - J \\perp breaks SU(2) (or U(1)) to \\mathbb Z 2 and opens a magnon gap \\Delta m \\sim \\sqrt{D J} S (single-ion, easy-axis) or \\sim 2 S \\sqrt{\\Delta(J+\\Delta)} (exchange). The infrared integral is now finite for any \\Delta m 0, and standard renormalized-classical analysis (Chakravarty–Halperin–Nelson logic transplanted) gives i.e. logarithmically small in the anisotropy but finite at any anisotropy . For CrI₃ \\Delta m \\approx 0.3 meV, J \\sim 2 meV; the prediction T c \\sim 30 K matches experiment . CrGeTe₃ (XXZ-anisotropic, smaller gap) sits in the same regime; NiPS 3, with weaker out-of-plane anisotropy and easy-plane XXZ character, shows the suppression that the same formula predicts . Calling these systems ‘Mermin–Wagner violations’ is a category error: A3 fails, so the theorem never applied. Halperin makes exactly this point. A4 — equilibrium. The proof manipulates a Gibbs state \\rho \\propto e^{-\\beta H} and uses KMS positivity. Driven non-equilibrium steady states violate detailed balance and can support true LRO of a continuous order parameter in d=2. The Toner–Tu hydrodynamic theory of flocking is the canonical demonstration: a polar order parameter \\langle \\vec v\\rangle \\ne 0 in 2D, stabilized by non-linear advective couplings absent from any equilibrium spin Hamiltonian. Numerical Vicsek-model studies confirm the LRO; non-equilibrium two-temperature XY models exhibit the same phenomenology . None of these contradict Mermin–Wagner — they violate A4. A5–A7 — thermodynamic limit, dimensionality, finite T. Finite systems are unconstrained: the divergence is logarithmic, \\langle (\\delta\\phi)^2\\rangle \\sim (T/2\\pi\\rho s)\\ln(L/a), so over any realistic L the suppression of \\langle M\\rangle is a numerical prefactor of order T/\\rho s, not zero. A 2D XY model with \\rho s/T = 5 and L = 10^4 a has order parameter \\sim L^{-T/4\\pi\\rho s} \\approx 0.6 — measurable, even though the strict L\\to\\infty value is zero. The thin-film case (finite thickness N z, lateral L\\to\\infty) crosses over to 3D behavior at a Ginzburg-like scale; the rigorous statement still requires N z = 1. At T = 0 the Bogoliubov bound vanishes identically and quantum 2D antiferromagnets (square-lattice Heisenberg) order — Néel order at T = 0 in 2D is allowed and observed. Strict d 2 removes the IR divergence (\\int d^d k / k^2 converges at d 2): the textbook 3D Heisenberg ferromagnet is fine. A8 — local lattice Hamiltonian with bounded commutators. The Bogoliubov inequality requires double commutators \\langle [[A,H],A^\\dagger]\\rangle to be finite — a locality/boundedness condition. Long-range Hamiltonians with J(r) \\sim 1/r^{d+\\sigma} for \\sigma \\le 2 evade the proof (this is the A1 statement in dual form), and so do non-local interactions in synthetic settings: trapped-ion crystals with power-law 1/r^\\alpha couplings, cavity-QED mediated all-to-all exchange, and Rydberg arrays with controllable range. Whenever the engineered range pushes the second moment to infinity, 2D LRO at T 0 is permitted — and is observed in cold-atom experiments where the engineered interaction tail decides whether the BKT or true-LRO scenario obtains . The audit closes a useful inverse : all eight hypotheses are needed. Each known ‘violation’ in the literature is the failure of exactly one — usually A3, occasionally A1 or A4 — and the violation is quantitative, with a calculable replacement scale (\\Delta m, E {\\rm dip}, L, or the drive amplitude) that controls how the would-be ordered phase reappears. Signatures: direct vs indirect — telling absence from suppression Signatures: direct vs indirect — telling absence from suppression Mermin–Wagner forbids order only in the thermodynamic limit; every experiment is finite. The question that matters at the bench is therefore not \"did we see a Curie step?\" — many 2D systems do — but \"does the candidate magnetisation obey the way the theorem says it must under extrapolation?\" Telling genuine absence of LRO from a small-but-extant order parameter requires watching how M, \\chi, and G(r) depend on size, anisotropy, and microscopic interaction range — not on the bare existence of a feature in \\chi(T). Direct signatures: the smoking guns (D1) Logarithmic finite-size collapse of M(T,L). Bogoliubov's inequality applied at fixed L gives with \\rho s the spin stiffness, a the lattice spacing, c an O(1) constant set by the second moment of J(R). The smoking gun is a one-parameter collapse: M(T,L)\\sqrt{\\ln(L/a)} plotted vs T for several L should overlay, and the L\\to\\infty extrapolation at any fixed T 0 must hit zero. The slow logarithm is exactly why apparent order survives out to L \\sim 10^2 lattice constants in classical Monte Carlo on the isotropic d=2 Heisenberg model; only sequences spanning at least a decade in L resolve the trend, and a single M(T) curve on a single sample is evidentially useless . (D2) BKT escape signatures. When Goldstone modes destroy M but a topological transition survives , the diagnostic is paired: The universal exponent \\eta=1/4 at the transition — equivalently the helicity-modulus jump of magnitude 2T {\\rm BKT}/\\pi — is the strictest experimentally accessible mark that the system has thrown away M=0 and saved itself topologically. McBryan–Spencer guarantees algebraic upper bounds on G(r) in any d=2 O(N\\!\\ge\\!2) ferromagnet, so observing G(r)\\sim r^{-\\eta} is consistent with — not a violation of — Mermin–Wagner. Indirect signatures and their confounders A broad susceptibility maximum without divergence, a Curie–Weiss tail with \\Theta {\\rm CW} \\gg T^\\ast, or exponential G(r)\\sim e^{-r/\\xi} with large but finite \\xi above a thermal crossover scale are all consistent with Mermin–Wagner suppression. None is diagnostic. Four physically distinct mechanisms produce the same circumstantial picture. Figure: Four mechanisms that produce a suppressed-but-finite \\chi in a 2D sample, with the experimental observable that distinguishes each. Three branches correspond to a hypothesis of the theorem failing (isotropy, short range, d=2); only the green branch is a genuine Mermin–Wagner verdict. Anisotropy-gapped 2D system. Any single-ion D-tensor or symmetric exchange anisotropy that reduces \\mathrm{SO}(3)\\to\\mathbb Z 2 opens a magnon gap \\Delta. The infrared integral \\int d^2k/(k^2+\\Delta/\\rho s) is finite, and a 2D-Ising transition appears at T c\\sim J/\\ln(J/\\Delta) — only logarithmically suppressed below 3D values . Discriminator: a gap in inelastic neutron scattering or ferromagnetic resonance. Monolayer CrI₃ exhibits \\Delta\\!\\approx\\!0.3 meV from INS, which is precisely why the theorem never forbade order there . NiPS₃, with much weaker out-of-plane anisotropy, sits on the other side of the same dial . Dipolar (long-range) coupling. The Bogoliubov-inequality proof requires \\sum R R ^2 J(R) \u003c\\infty; dipolar 1/R^3 is borderline in 2D and renormalises the small-k magnon dispersion from \\omega\\propto k^2 to \\omega\\propto\\sqrt{k} for in-plane modes, making \\int d^2k/\\omega convergent. Discriminators: (i) angular anisotropy of G(r) inherited from the dipolar kernel, (ii) the characteristic \\sqrt{k} branch in INS, (iii) shape-dependent T c at fixed thickness. \"2D ferromagnetism by dipolar coupling\" in ultrathin Fe films is not a Mermin–Wagner violation — the second-moment hypothesis fails. Finite-thickness / quasi-2D crossover. A film of d layers shows 3D Heisenberg behaviour at wavelengths \\lambda\\gg da and 2D behaviour for \\lambda\\ll da; the infrared integral is regulated at k {\\min}\\sim 1/(da), giving T c(d) saturating from below as d grows. Discriminator: the shift-exponent scaling T c(d)=T c^\\infty[1-(d 0/d)^{1/\\nu}] with 3D Heisenberg \\nu\\!\\approx\\!0.71. Superlattice studies of LaFeO₃/SrTiO₃ used precisely this scaling to argue for Mermin–Wagner behaviour in the few-layer limit . Disorder-rounded transition. Quenched bond or site disorder smears the singularity by an amount scaling as a power of disorder strength, not as 1/\\ln L. Discriminator: the Harris criterion \\nu d\\ge 2; if violated, the transition is destabilised toward a disorder-controlled fixed point, with \\chi broadening symmetric in T-T c. Confusing this with Mermin–Wagner suppression is endemic in dilute monolayer magnets, where both effects can be present. The verdict criterion A claim of \"Mermin–Wagner behaviour\" in a 2D material is credible only when (i) a gapless magnon branch is seen in INS or FMR (the isotropy hypothesis holds), (ii) M(T,L) exhibits the logarithmic-in-L collapse over at least a decade in L (the prediction is verified, not merely assumed), and (iii) the dominant interactions satisfy \\sum R R ^2 J(R) \u003c\\infty (the second-moment hypothesis holds). Absent (i)–(iii), what is being reported is a suppression signature — anisotropy-gapped, dipolar-stabilised, finite-thickness, or disorder-rounded — and the appropriate citation is not but the corresponding mechanism. Use and abuse: how 'Mermin–Wagner forbids' became a hollow incantation Use and abuse: how 'Mermin–Wagner forbids' became a hollow incantation By the late 1990s \"Mermin–Wagner forbids it\" had hardened into a referee's reflex — invoked satisfyingly against any claim of 2D order and almost never accompanied by a check of the hypotheses A1–A8 the theorem actually requires. Six misuse patterns dominate the literature; each is diagnosable by asking which A i the author silently dropped. Pattern 1 — Anisotropy invisibilized (A3 dropped) The post-2017 monolayer-magnet boom — CrI₃ , CrGeTe₃ , Fe₃GeTe₂, CrTe₂ — was almost universally introduced as \"breaking\" or \"evading\" Mermin–Wagner. It does neither. CrI₃ has single-ion easy-axis anisotropy D \\approx 0.3 meV; CrGeTe₃ has weaker anisotropy and consequently a lower T c; Fe₃GeTe₂ is strongly Ising-like. The continuous SU(2) of A3 is broken explicitly down to \\mathbb{Z} 2 at the Hamiltonian level. The magnon dispersion acquires a gap \\Delta \\sim 2 S \\sqrt{D J}, the offending integral \\int d^2k\\,(k^2+\\Delta^2/(2SJ))^{-1} becomes finite, and one recovers k B T c \\sim J / \\ln(J/\\Delta) — finite for any \\Delta 0 and logarithmically robust to small anisotropy. Halperin's retrospective puts it bluntly: the theorem forbade nothing in these materials to begin with . Diagnostic: is the order-parameter manifold continuous in the Hamiltonian, not just in an idealized cartoon? If a D S z^2 term, XXZ exchange anisotropy , or a Kitaev bond-directional term is present, A3 is gone. Pattern 2 — Long-range exchange ignored (A1 dropped) The Bogoliubov-inequality proof requires \\sum {\\vec R} \\vec R ^2 J(\\vec R) \u003c \\infty. Dipolar coupling projected into a 2D layer is marginal once the angular structure is included; the second moment generically diverges. Unscreened Coulomb fails outright. RKKY in a 2D metal oscillates as \\cos(2 k F r)/r^2 — second moment ill-defined. Citing Mermin–Wagner against a dipolar 2D ferromagnet, a Wigner crystal, or a 2D RKKY lattice is a hypothesis-skipping error. The modern 4f-layered-magnet literature occasionally rediscovers this with surprise. Diagnostic: does the dominant exchange decay faster than 1/r^{d+2}? If not, A1 is gone. Pattern 3 — LRO conflated with phase transition (the conclusion misread) Mermin–Wagner forbids a nonzero order parameter; it does not forbid a thermodynamic singularity. The Berezinskii–Kosterlitz–Thouless transition is a phase transition by every reasonable definition — a vortex-unbinding singularity with a universal jump in the helicity modulus and a crossover from exponential to algebraic correlations — yet \\langle e^{i\\theta}\\rangle = 0 on both sides. Sentences of the form \"Mermin–Wagner forbids a phase transition in this 2D XY system\" are simply wrong. The McBryan–Spencer bound sharpens the point: it pins the decay as at most power-law, leaving quasi-LRO untouched. Diagnostic: is the author equating \"order parameter\" with \"phase\"? Quasi-LRO is a phase, just not a symmetry-broken one. Pattern 4 — Coleman conflation (wrong axioms, wrong regime) Coleman's 1973 theorem is routinely cited as \"Mermin–Wagner in field theory.\" It is not the same theorem. Coleman's proof uses positivity of the Wightman two-point function in 1{+}1 D Minkowski QFT and rules out a normalizable massless Goldstone scalar; the setting is T=0, Lorentz-invariant, infinite system, Wightman axioms. Mermin–Wagner is T 0, non-relativistic, lattice, Gibbs-state statistical mechanics, Bogoliubov inequality . The infrared catastrophe coincides in spirit and dimension-counting; the operator algebras differ. Conflating them lets authors invoke \"Mermin–Wagner\" against T=0 quantum critical points in 2{+}1 D — where the relativistic analogue does not bite — or against gauge-theory roughening , where the relevant constraint is different again. Diagnostic: thermal-lattice or zero-temperature relativistic? They demand different theorems. Pattern 5 — Non-equilibrium and finite size (A4–A6 dropped) Toner and Tu showed that 2D flocks support true long-range orientational order ; this does not violate the theorem because detailed balance fails — A4 is gone, and the active-matter literature has industrialized the workaround. Active nematics, driven steady states, externally pumped condensates, and two-temperature XY models all live outside the regime; invoking the theorem against them is a category error. The finite-size escape is the symmetric abuse: the disorder-producing logarithm \\langle\\phi^2\\rangle \\sim (T/2\\pi J)\\ln(L/a) grows so slowly that experimentally relevant 2D samples display effective order over their probed window. Kiaba et al.'s LaFeO₃/SrTiO₃ superlattice data are advertised as \"observation of Mermin–Wagner behavior\" precisely because finite thickness and finite lateral size make the asymptotic statement compatible with the measured M(T) curve only because A5 (thermodynamic limit) is never reached. Diagnostic: does the experiment access L\\to\\infty at T 0 in true 2D under detailed balance? If any one fails, the theorem is silent. Pattern 6 — The truncated citation chain The standard citation \"Mermin and Wagner 1966\" elides at least five contributions. Bloch supplied the infrared spin-wave divergence in 1930; Peierls and Landau supplied the structure-factor argument for crystals in the 1930s — Mermin's own 1968 paper credits both; Bogoliubov supplied the inequality that is the entire technical content of the proof; Hohenberg proved the same statement contemporaneously for ODLRO in superfluids and superconductors; Wagner's solo paper extended to arbitrary broken continuous internal symmetries. Halperin is the most explicit modern push to restore \"Hohenberg–Mermin–Wagner\" as the honest minimal name. Diagnostic: does the bibliography contain Hohenberg and Bogoliubov ? If not, the author is citing the slogan, not the theorem. Status today and the believer's checklist Status today and the believer's checklist As a mathematical statement the Hohenberg–Mermin–Wagner theorem is closed. The Bogoliubov-inequality core , the McBryan–Spencer upper bound on correlation decay , Berezinskii–Kosterlitz–Thouless quasi-LRO as the licensed escape valve , and Coleman's 1\\!+\\!1 D QFT analogue all sit in their finished forms. No serious proof has been overturned, none of the hypotheses has been quietly loosened, and the rigorous-statistical-mechanics community treats the result as part of the bedrock — visible most recently in Bauerschmidt–Helmuth–Swan's hyperbolic-\\sigma-model extension and in Taggi–Wu's dimer / monomer-double-dimer generalization . Halperin's 2018 retrospective is the standing corrective: it re-derives the bound, makes the hypothesis list explicit, extends the theorem to itinerant electron systems without spin–orbit coupling, and flags the standard abuses. It should be required reading for anyone writing the phrase \"Mermin–Wagner\" into a manuscript. The sociological status is the opposite. \"Mermin–Wagner forbids it\" now appears in introductions, referee reports, and DFT-paper concluding paragraphs without the slightest accompanying check that any of the hypotheses A 1\\!-\\!A 8 actually holds. The pattern is stable across two decades and has only worsened with the 2D-materials boom: Gong's 2017 monolayer-CrI₃ discovery was packaged as \"breaking Mermin–Wagner\" despite the theorem never having forbidden order in a system with strong single-ion anisotropy ; Zhang et al.'s 2021 CrTe₂ ultrathin films inherited the same headline. The escape clause is sociologically invisible: the anisotropy gap \\Delta that is doing the work renders the magnon integral finite for any \\Delta 0, giving the now-standard estimate T c \\sim J/\\ln(J/\\Delta) that fits the CrI₃, CrGeTe₃ and Fe₃GeTe₂ data quantitatively . The theorem is not violated; it never applied. Two recent results sharpen the picture. Kiaba et al. used muon-spin rotation on LaFeO₃/SrTiO₃ superlattices to compare 1-, 2- and 3-monolayer LaFeO₃ slabs and observed exactly what the theorem demands: static Néel order in the multilayers; dynamical fluctuations down to the lowest measured T in the monolayer where the residual single-ion anisotropy is small enough that the logarithm has not yet won — the cleanest positive observation of HMW physics on record. Conversely Fischetti and Vandenberghe applied the inequality to flexural ZA modes in 2D crystals with broken horizontal-mirror symmetry , showing that suspended graphene-like sheets must ripple — an HMW corollary buried for a decade inside the carrier-mobility literature. The theorem cuts both ways: when its hypotheses are satisfied the prediction is sharp and experimentally visible; when they are not, invoking the name is decoration. A residue of unfinished business persists. Itinerant ferromagnetism without spin–orbit coupling is now rigorously proved absent , yet Stoner arguments still appear in metal-magnetism manuscripts as though the issue were settled the other way. The dipolar case (J(R)\\sim R ^{-3}, second-moment divergent) is not covered — and is precisely the interaction that stabilizes ultrathin Fe films, repeatedly described in the wrong language. Non-equilibrium order — Toner–Tu flocking , two-temperature driven XY — sits entirely outside the equilibrium hypothesis and is the canonical illustration that \"2D\" alone determines nothing. The AETHER checklist Before publishing or believing any paper that invokes Mermin–Wagner: 1. Which hypotheses A 1–A 8 are satisfied — explicitly? Short range, isotropy of a continuous symmetry, equilibrium Gibbs state, thermodynamic limit, T 0, local Hamiltonian, bounded local Hilbert space, second-moment finite exchange. If any is unstated, the invocation is decorative. 2. Is the symmetry actually continuous in the Hamiltonian? Single-ion D(S^z)^2, exchange anisotropy, Dzyaloshinskii–Moriya, Zeeman — quantify the resulting magnon gap \\Delta and the estimate T c \\sim J/\\ln(J/\\Delta). An anisotropy budget is not optional. 3. Is the interaction range second-moment finite? \\sum R R ^{2}\\, J(R) \u003c\\infty. Unscreened dipolar in 2D, bare Coulomb, and RKKY fail this and lie outside the proof and outside . 4. Equilibrium and thermodynamic limit on the relevant scale? Finite samples show effective LRO via the slow logarithm \\langle u^{2}\\rangle\\sim\\ln(L/a); driven steady states violate detailed balance. Both are routinely mislabeled. 5. Is the claim about LRO or about a phase transition? HMW kills the order parameter, not the singularity — BKT is a thermodynamic transition with \\langle\\psi\\rangle\\equiv 0. 6. Is Coleman's theorem being invoked in disguise? Wightman axioms, T=0, (1\\!+\\!1) spacetime — a distinct theorem with a distinct proof; routinely miscredited. 7. Are Hohenberg, Bogoliubov, Bloch, Peierls and Landau credited where due? . The PRL cites them all; the secondary literature does not. Halperin makes the modern case for \"Hohenberg–Mermin–Wagner\". 8. Is the experimental signature direct or circumstantial? Direct: finite-size scaling of \\langle M\\rangle(L,T), the BKT essential singularity \\xi\\sim\\exp(b/\\sqrt{T-T {\\rm BKT}}), the 2k {B}T {\\rm BKT}/\\pi universal stiffness jump, muon-spin-rotation absence-of-static-order as in . Circumstantial: a missing Curie step in low-statistics susceptibility on a finite flake. The first proves what the theorem permits; the second proves nothing. The AETHER Verdict The AETHER Verdict I have spent enough nights staring at the Bogoliubov inequality to have formed strong views about which parts of this edifice are load-bearing and which parts are decorative. Here they are, without apology. (a) What I would defend with my reputation The theorem itself, stated correctly, is bulletproof. Given a lattice Hamiltonian with (i) a strictly continuous internal symmetry, (ii) finite-range or second-moment-bounded interactions \\sum R R ^2 J(R) \u003c \\infty, (iii) a Gibbs state at T 0, and (iv) the thermodynamic limit taken in d\\le 2, the order parameter vanishes. The Bogoliubov-inequality core is a four-line calculation once the auxiliary operator A {\\vec k} and the symmetry-breaking field are chosen correctly; the IR divergence \\int d^2k / k^2 is the entire physics. I will also defend, equally firmly, the McBryan–Spencer upper bound on correlation decay as the sharp refinement — it tells you not merely that LRO is forbidden but that correlations decay at least as fast as a power law set by temperature, which is what BKT then saturates from below. Together these are one of the cleanest constructions in equilibrium statistical mechanics. I will also defend the historical reattribution. The honest name is Bloch–Peierls–Landau–Bogoliubov–Hohenberg–Mermin–Wagner , with Coleman as a logically distinct sibling. Halperin's 2018 case for restoring Hohenberg is correct and overdue. (b) What is shakier than the literature admits Three load-bearing assumptions are routinely waved through. The short-range hypothesis. The second-moment condition fails for dipolar magnets (1/r^3 in 2D is marginal), for unscreened Coulomb systems, and for RKKY in metallic monolayers. The community's habit of invoking Mermin–Wagner against any 2D magnetic claim ignores that the proof's IR integral is not the only IR integral in the problem — long-range couplings reshape it. The Bruno-style extensions tightening the dipolar case exist but are not in the textbook chain. The \"isotropic\" hypothesis as an idealization. No real spin Hamiltonian is rigorously isotropic. Single-ion anisotropy of order D \\sim 10^{-2}\\,\\mathrm{meV} — undetectable in many measurements — already opens a magnon gap and restores order with T c \\sim J/\\ln(J/\\Delta). The honest statement is that Mermin–Wagner is a statement about a measure-zero point in coupling space, and real materials live near it, not on it. Calling CrI 3 a Mermin–Wagner violation is a category error in both directions. The equilibrium / detailed-balance hypothesis. Active and driven 2D systems (Toner–Tu flocks, driven-dissipative condensates) order genuinely, and the proof has nothing to say about them because the Gibbs state is gone. The literature still occasionally writes \"Mermin–Wagner forbids\" in non-equilibrium contexts; it does not. (c) Three open questions I would actually work on 1. Sharp anisotropy-crossover scaling in real 2D magnets. Is T c \\sim J/\\ln(J/\\Delta) the true asymptotic, or does the exchange-anisotropy class (XXZ vs. single-ion vs. Kitaev) change the prefactor in a measurable way? The cleanest test bed is CrI 3/CrBr 3 pressure-tuning . 2. Mermin–Wagner with genuinely long-range exchange. A rigorous interpolation between 1/r^\\alpha exponents giving the phase boundary \\alpha c(d=2) for spontaneous breaking, beyond Bruno's estimates. The dipolar marginal case is the prize. 3. Goldstone-mode lifetime, not just existence, in finite 2D samples. Mermin–Wagner is a statement about the static order parameter; the dynamical question — over what timescale does the magnon-mediated decorrelation actually destroy a prepared ordered state at given L, T — is what experiments measure and what theory underspecifies. (d) Reading path 1. Bloch, 1930 — the original IR argument for spin waves; read it to see the physics before the formalism arrived. 2. Mermin \u0026 Wagner, PRL 1966 — four pages, the proof in its native compactness; note their explicit credit to Bogoliubov. 3. Hohenberg, 1967 — the same theorem for ODLRO; reading it cements that the result is about IR integrals, not about magnetism. 4. McBryan \u0026 Spencer, 1977 — the upper bound that turns the no-go into a quantitative correlation-decay statement and meets BKT halfway. 5. Halperin, 2018 — the retrospective that names the credit problem and surveys what the theorem does and does not forbid in modern 2D materials."}</script>
