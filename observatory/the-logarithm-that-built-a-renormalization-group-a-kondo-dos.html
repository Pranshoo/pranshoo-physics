<script type="application/json" id="aether-data">{"slug": "the-logarithm-that-built-a-renormalization-group-a-kondo-dos", "topic": "Kondo effect", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "The Logarithm That Built a Renormalization Group: A Kondo Dossier", "subtitle": "From a 1934 Leiden resistance minimum to the modern abuse of zero-bias peaks", "domain": "condensed matter", "era": "anomaly observed 1934 (de Haas–de Boer–van den Berg); explained 1964 (Kondo); resolved 1974–80 (Wilson NRG)", "why_big": "The resistance minimum in dilute magnetic alloys was a thirty-year embarrassment until Kondo's 1964 third-order perturbation calculation produced a logarithmic divergence in T, immediately exposing a genuine infrared catastrophe in a fermionic problem. Its resolution forced the invention of Wilson's numerical renormalization group, gave the first non-perturbative strong-coupling fixed point in many-body theory, and seeded the entire program connecting impurity problems, asymptotic freedom, and heavy-fermion physics.", "abuse": "'Kondo' is now slapped onto any zero-bias conductance peak in a quantum dot or molecular junction, often with no check on the universal G(T/T_K) scaling curve, no Fermi-liquid coefficient ratio, and no demonstration that the local moment is actually screened rather than merely fluctuating.", "date": "June 13, 2026", "ts": 1781403569.103895, "engine": "Claude Code CLI · default model", "aliases": ["s-d exchange anomaly", "resistance minimum problem", "Kondo problem", "antiferromagnetic exchange scattering anomaly"], "origin_story": "In 1934 the Leiden group of W. J. de Haas, J. de Boer, and G. J. van den Berg reported a resistance minimum near 10 K in nominally pure gold, an anomaly soon reproduced in copper, silver, and many host metals and inconsistent with Bloch–Grüneisen monotonicity. For three decades the minimum lived in the literature as a sample-quality embarrassment. By the early 1960s Sarachik, Corenzwit, and Matthias at Bell Labs had empirically tied the minimum to localized magnetic moments — Fe in Mo–Nb showed the anomaly only when the impurity carried a moment — fingering exchange rather than potential scattering. Anderson's 1961 model of localized magnetic states in metals supplied the microscopic stage; Kasuya–Yosida s-d exchange supplied the projected Hamiltonian. In 1964 Jun Kondo computed the third Born term for s-d exchange with a quantum impurity spin and discovered that the spin-non-commutativity vertex correction generated a ln(D/T) that grew without bound as T → 0; perturbation theory devoured itself in a way that quantitatively reproduced the empirical −ln T resistivity rise and the location of the minimum. The 'Kondo problem' thereby became the first fermionic many-body system exhibiting asymptotic freedom — weak coupling in the UV, strong coupling in the IR — and forced the inventions that resolved it: Abrikosov's parquet, Nagaoka's decoupling, Anderson–Yuval–Hamann's poor man's scaling, Nozières's local Fermi liquid, Wilson's numerical renormalization group (1975, 1982 Nobel motivation), and the Andrei–Wiegmann Bethe-ansatz exact solutions of 1980.", "credit_audit": "Textbook attribution flattens roughly a half-century of work to two names — Kondo and Wilson — and the historical record disagrees on almost every step. The 1934 observation paper is consistently cited as 'de Haas–van den Berg' with J. de Boer dropped. The empirical bridge from anomaly to magnetism (Sarachik–Corenzwit–Matthias 1964) almost never appears in pedagogy, which jumps from a 30-year mystery to Kondo's calculation as if the magnetic interpretation were a free gift. Kondo's logarithm extended a programme — s-d exchange resistivity — that Yosida and Kasuya had already developed; Kondo's actual contribution was recognising that the third-order spin-non-commutativity diagram produces a logarithm, not introducing the model. The Wilson eclipse is the largest distortion. Abrikosov (1965) and Nagaoka (1965) gave the first non-trivial summations; Anderson–Yuval–Hamann (1970) introduced the scaling concept and the strong-coupling fixed-point picture before Wilson; Nozières (1974) structurally predicted the low-T fixed point (Wilson ratio, phase shift, leading T² corrections) using only Fermi-liquid phenomenology; and Andrei (1980) and Wiegmann (1980) independently solved the model exactly by Bethe ansatz. Wilson's NRG is canonical because it is constructive and trustworthy across the whole crossover — not because it was first, unique, or analytically deeper. Wilson's 1982 Nobel rewarded the renormalization group as a tool; the Kondo problem was the load-bearing example, but the citation makes clear that the prize is for the method, not the problem.", "timeline": [{"year": 1934, "event": "Resistance minimum in gold, copper, lead reported at ~10 K; the empirical anomaly that defines the problem.", "who": "W. J. de Haas, J. de Boer, G. J. van den Berg", "work": "Physica 1, 1115 — 'The electrical resistance of gold, copper and lead at low temperatures'", "kind": "observation", "ref": 1}, {"year": 1957, "event": "s-d exchange Hamiltonian deployed to compute anomalous resistivity and magnetoresistance of Cu–Mn — second-order Born already extant, log not yet seen.", "who": "Kei Yosida", "work": "Phys. Rev. 107, 396", "kind": "theory", "ref": 3}, {"year": 1961, "event": "Anderson impurity model — local d level hybridizing with a Fermi sea, on-site U; the microscopic parent of the Kondo model.", "who": "P. W. Anderson", "work": "Phys. Rev. 124, 41 — 'Localized Magnetic States in Metals'", "kind": "formalization", "ref": 7}, {"year": 1964, "event": "Empirical demonstration that the resistance minimum tracks the presence of a localized moment (Fe in Mo–Nb hosts), pointing experiment at magnetic exchange.", "who": "Myriam P. Sarachik, E. Corenzwit, B. T. Matthias", "work": "Phys. Rev. 135, A1041", "kind": "observation", "ref": 4}, {"year": 1964, "event": "Third-order Born calculation of s-d exchange resistivity yields ρ ~ −J³ρ ln(D/T); the perturbative log that exposes the IR strong-coupling problem.", "who": "Jun Kondo", "work": "Prog. Theor. Phys. 32, 37 — 'Resistance Minimum in Dilute Magnetic Alloys'", "kind": "theory", "ref": 5}, {"year": 1965, "event": "Parquet diagram summation gives a divergent T-matrix at the (perturbative) Kondo scale — first attempt to sum the leading logs.", "who": "A. A. Abrikosov", "work": "Physics 2, 5", "kind": "theory", "ref": 10}, {"year": 1965, "event": "Self-consistent decoupling of equations of motion; reproduces the log and predicts a bound state at T_K, an early signpost of strong-coupling.", "who": "Yosuke Nagaoka", "work": "Phys. Rev. 138, A1112", "kind": "theory", "ref": 11}, {"year": 1966, "event": "Canonical transformation mapping the Anderson model onto the Kondo (s-d) model in the local-moment limit, fixing J = 2V²U/[|ε_d|(U−|ε_d|)] and resolving the 'two models' question.", "who": "J. R. Schrieffer, P. A. Wolff", "work": "Phys. Rev. 149, 491", "kind": "formalization", "ref": 8}, {"year": 1970, "event": "'Poor man's scaling': iterative elimination of band-edge states generates a running J(D) flowing to strong coupling; the first scaling-theoretic statement of the Kondo problem.", "who": "P. W. Anderson, G. Yuval, D. R. Hamann", "work": "Phys. Rev. B 1, 4464 — 'Exact Results in the Kondo Problem. II.'", "kind": "theory", "ref": 12}, {"year": 1974, "event": "Local Fermi-liquid description of the T ≪ T_K regime: phase shift π/2, Wilson ratio R = 2, specific-heat γ and susceptibility χ in fixed ratio; identifies the strong-coupling fixed point structurally.", "who": "Philippe Nozières", "work": "J. Low Temp. Phys. 17, 31", "kind": "theory", "ref": 16}, {"year": 1975, "event": "Numerical renormalization group: logarithmic energy-shell discretization plus iterative diagonalization tracks flow from weak to strong coupling across the crossover; f.", "ref": 1}, {"name": "Myriam P. Sarachik (with Corenzwit and Matthias)", "role": "Provided the empirical bridge — minimum correlates with local-moment formation — that turned a 30-year mystery into a well-posed theoretical question; textbooks routinely jump from de Haas to Kondo as if the magnetic interpretation were obvious.", "evidence": "Phys. Rev. 135, A1041 (1964).", "ref": 4}, {"name": "Kei Yosida", "role": "Developed the s-d exchange resistivity programme that Kondo's third-order calculation extended; second-order results were Yosida–Kasuya territory before 1964.", "evidence": "Phys. Rev. 107, 396 (1957) and the subsequent Kasuya–Yosida line.", "ref": 3}, {"name": "A. A. Abrikosov", "role": "First non-trivial summation (parquet) of the leading logs; eclipsed by Wilson's NRG but historically the first 'strong-coupling' attack.", "evidence": "Physics 2, 5 (1965); credited in Hewson Ch. 4.", "ref": 10}, {"name": "Yosuke Nagaoka", "role": "Independent 1965 decoupling-of-equations-of-motion treatment recovering the log and signaling a bound state at T_K; almost never named in pedagogy.", "evidence": "Phys. Rev. 138, A1112 (1965).", "ref": 11}, {"name": "P. W. Anderson, G. Yuval, D. R. Hamann", "role": "Introduced scaling and the strong-coupling fixed point concept (poor man's scaling) five years before Wilson; the conceptual scaffold of NRG is theirs.", "evidence": "Phys. Rev. B 1, 4464 (1970); Anderson's own Nobel Lecture explicitly cites this line.", "ref": 9}, {"name": "Philippe Nozières", "role": "Predicted Wilson's strong-coupling fixed point structure — phase shift π/2, Wilson ratio 2, Fermi-liquid coefficient ratios — purely from low-energy phenomenology; Wilson's NRG confirmed Nozières numerically.", "evidence": "J. Low Temp. Phys. 17, 31 (1974); discussed at length in Hewson Ch. 5.", "ref": 16}, {"name": "Natan Andrei and Paul B. Wiegmann", "role": "Independently solved the Kondo model exactly by Bethe ansatz in 1980, recovering the entire universal crossover with no RG machinery. Less famous than Wilson's NRG because constructive numerics dominated the textbook story.", "evidence": "Phys. Rev. Lett. 45, 379 (1980); JETP Lett. 31, 392 (1980); reviewed in Hewson Ch. 6.", "ref": 14}, {"name": "J. R. Schrieffer and P. A. Wolff", "role": "The transformation is named but the conceptual point — that 'Anderson' and 'Kondo' are the same theory only in the local-moment limit, with J fixed by V, U, ε_d — is regularly muddled by reviewers who use the names interchangeably outside that regime.", "evidence": "Phys. Rev. 149, 491 (1966).", "ref": 8}], "conflations": [{"claim": "'Kondo temperature T_K'", "clarification": "Two inequivalent definitions circulate. (i) Perturbative T_K^{pert} ≈ D exp(−1/2Jρ), the scale at which Kondo's third-order logarithm breaks down — a sign of one's expansion failing, not a physical scale. (ii) Wilson's T_K^W, defined as the RG-invariant crossover scale via e.g. χ_imp(0) ≡ (gμ_B)²/(4T_K), or equivalently by a fixed value of the universal scaling function. They differ by O(1) constants; mixing them propagates 20–30% errors into 'measured T_K' values quoted in quantum-dot papers."}, {"claim": "'Kondo effect in any zero-bias conductance peak (ZBP) in a quantum dot or molecular junction'", "clarification": "A genuine Kondo identification requires: (a) a demonstrated local moment in the dot (odd occupation, S = 1/2 plateau in Coulomb-blockade map); (b) universal G(T/T_K) collapse onto the empirical NRG curve over at least a decade in T/T_K; (c) splitting of the ZBP by an applied Zeeman field with ΔE = 2gμ_B B; (d) approach to the unitary-limit conductance 2e²/h as T → 0 in the symmetric single-channel case; (e) the Fermi-liquid ratio T²/B² coefficient α/β tied at α/β = π²/(3·(gμ_B)²) up to channel-dependent corrections. A single Lorentzian at V = 0 satisfies none of these and is not, by itself, evidence of Kondo physics."}, {"claim": "'Anderson model = Kondo model'", "clarification": "Equivalent only in the local-moment limit |ε_d|, U−|ε_d| ≫ V²ρ, where Schrieffer–Wolff projection gives J = 2V²U/[|ε_d|(U−|ε_d|)]. Away from this regime — mixed-valent dots, asymmetric quantum dots, narrow band gaps — the Anderson model contains charge fluctuations and a finite renormalised hybridisation Δ that the spin-only Kondo Hamiltonian cannot represent. Universal G(T/T_K) curves derived from the Kondo model do not, strictly, apply to mixed-valent quantum dots."}, {"claim": "'Logarithmic divergence = infrared catastrophe'", "clarification": "Kondo's ln(D/T) is not a divergence in any observable. It is the perturbative signal that the running antiferromagnetic coupling becomes O(1) at T_K; below T_K perturbation theory in J fails and the system is a perfectly finite, smooth local Fermi liquid. Calling T_K a 'singularity' is folklore; it is a crossover scale, not a phase transition."}, {"claim": "'Local-moment screening = spin fluctuation'", "clarification": "The Kondo ground state is an entangled many-body singlet of the impurity spin with a conduction-electron screening cloud of extent ξ_K = ℏv_F/T_K, with χ_imp(0) finite and γ_imp finite. It is not the average over a fluctuating classical impurity spin, and mean-field 'spin-fluctuation' treatments that replace ⟨S⟩ by a self-consistent field miss the singlet entirely (and predict the wrong Wilson ratio)."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: A Leiden Anomaly and the Thirty-Year Embarrassment", "markdown": "## Origins: A Leiden Anomaly and the Thirty-Year Embarrassment\n\n### The Leiden curve, and a missing co-author\n\nThe Kondo problem begins not with a theorist but with a thermometer. In the early 1930s the Kamerlingh Onnes Laboratory in Leiden was the only place on earth where one could routinely measure the resistance of metals at liquid-helium temperatures with the precision needed to see a few-percent anomaly riding on top of a phonon background. In that environment W. J. de Haas, J. de Boer, and G. J. van den Berg published, in the first volume of the newly founded journal *Physica*, what is now the canonical first observation: the electrical resistivity of \"pure\" gold, copper, and lead samples did not saturate at the residual-resistance plateau predicted by Bloch–Grüneisen theory, but instead passed through a shallow minimum near 10 K and rose again as $T \\to 0$ [1].\n\nIt is worth restoring the byline. The textbook formula \"de Haas–van den Berg\" — propagated by Hewson [2] and by essentially every introductory solid-state text — silently drops J. de Boer, the middle author of the 1934 paper. De Boer was at that point a young theorist at Leiden (later a major figure in statistical mechanics of quantum fluids), and the experimental campaign he was attached to was emphatically a collaboration: the resistance curves carry his name on the cover sheet alongside de Haas's and van den Berg's, and the data analysis — which had to disentangle a small upturn from a much larger residual term and from the inevitable thermometry drift of a 1930s gas thermometer — reflects more than one set of hands. The casual elision of \"de Boer\" is a small injustice with a long half-life; it is also a useful diagnostic of how much of the early Kondo literature is repeated from secondary sources rather than read.\n\nWhat de Haas, de Boer, and van den Berg actually reported was a phenomenon, not an explanation. The minima sat at $T_\\min \\sim 5$–$20\\,\\text{K}$ depending on the sample, with a logarithmic-looking rise on the low-$T$ side of a few percent of the residual resistivity. They suspected impurities — the samples were 99.99% pure at best — but they could not, in 1934, identify the specific impurity, and they certainly did not connect the anomaly to localized magnetic moments. The Bloch picture of an electron–phonon resistivity $\\rho \\propto T^5$ at low $T$, falling onto a temperature-independent residual term, was the gold standard; the Leiden curve was simply, and stubbornly, wrong against it.\n\n### Thirty years of misdiagnosis\n\nWhat followed is the thirty-year embarrassment. Between 1934 and 1964 the resistance minimum was explained, variously, by: an exotic phonon mechanism at low $T$; an electron–electron Umklapp tail; some form of incipient superconducting fluctuation; oxide-layer surface scattering; and — most persistently — a \"two-band\" picture in which a narrow $d$-band tail intruded into the Fermi sea. None of these survived contact with experiment, but each was published, defended, and (in some cases) entered the early textbooks. The defining feature of this period is that nobody systematically varied the *magnetic* content of the samples. The Leiden experiments, and most of their immediate successors, used commercial-purity metals whose impurity content was poorly characterised. A curve that depends, as we now know, linearly on the concentration $c$ of a magnetic impurity and logarithmically on $T$ — $\\rho_\\text{imp}(T) \\propto c[1 - 2J\\rho\\ln(D/T) + \\dots]$ — is invisible until one is willing both to dope on purpose and to measure $c$.\n\nThe theoretical line that *would* eventually carry the argument was meanwhile developing in parallel, with no contact to the Leiden data. Zener (1951) introduced the $s$–$d$ exchange interaction for transition-metal ferromagnets — a contact coupling $-2J\\,\\mathbf{S}\\!\\cdot\\!\\mathbf{s}$ between a localized $d$-electron spin and conduction electrons (verify: Zener, Phys. Rev. 81, 440, 1951). Kasuya (1956) and then Yosida applied the same Hamiltonian to dilute magnetic alloys, computing in second-order Born approximation the impurity resistivity, magnetoresistance, and the RKKY interaction (Kasuya 1956 (verify); Yosida 1957 [3]). Yosida's calculation reproduced the *magnitude* of the residual resistivity of Cu–Mn and the sign of its magnetoresistance, but at second order in $J\\rho$ the result is a temperature-independent constant. No logarithm appears. The $s$–$d$ machinery was there; the diagram that gives the log was not yet drawn.\n\nIn retrospect — and this is the part the pedagogy erases — the obstacle was not theoretical sophistication but a missing experimental fact. As long as the resistance minimum was a curiosity of *nominally pure* gold and copper, no theorist had any reason to deploy the $s$–$d$ Hamiltonian against it. The $s$–$d$ programme of Zener, Kasuya, and Yosida lived in a different journal section: ferromagnetism, RKKY, the magnetic alloys of Bethe and Néel. The two literatures had to be soldered together.\n\n### The Sarachik bridge\n\nThat solder is Sarachik, Corenzwit, and Matthias, 1964 [4]. Working at Bell Labs in the Matthias group, Sarachik systematically studied dilute iron in a series of Mo–Nb and Mo–Re host matrices and demonstrated two things at once. First, the resistance minimum appeared *only* in those hosts in which a localized moment on the Fe impurity was thermodynamically stable, as judged independently by Curie–Weiss susceptibility; in hosts where the Fe moment was quenched, the resistivity was monotonic. Second, the depth of the minimum, and the slope of the logarithmic rise below it, scaled with the Fe concentration in the way one would expect for single-impurity scattering. The conclusion was inescapable: the Leiden anomaly was a *magnetic* anomaly, and it lived on isolated local moments, not on the band structure of the host.\n\nThis is the step the textbook tradition systematically erases. The standard pedagogical line moves directly from \"1934: de Haas observes a minimum\" to \"1964: Kondo computes a logarithm\", as if the *magnetic* interpretation were obvious from inspection. It was not. It became obvious only after Sarachik–Corenzwit–Matthias correlated the anomaly with local-moment stability in a controlled series of alloys, three months before Kondo's *Progress of Theoretical Physics* paper went to press [5]. Kondo himself acknowledges this in his book [6], but Hewson, who shapes most of what is taught, mentions Sarachik in passing in a single sentence; most graduate notes mention her not at all.\n\nThe reason matters. Without the Sarachik bridge, Kondo's third-order calculation is a clever exercise on a Hamiltonian no one had any particular reason to pick. With it, his calculation is the natural next step in a programme: the $s$–$d$ exchange Hamiltonian of Zener–Kasuya–Yosida [3], now experimentally certified as the correct microscopic description of the Mn-in-Cu and Fe-in-Mo systems, applied to the resistivity of the Leiden alloys at one order beyond Yosida. That a third-order spin-non-commutativity diagram produces a logarithmic temperature dependence — the engine of everything that follows — is then no longer a bolt from the blue but the resolution of a thirty-year empirical embarrassment to which two experimental traditions and one theoretical programme had at last been brought to bear.\n\nAnderson's 1961 paper on localized magnetic states in metals [7] should be read in the same spirit: not as an answer to the Leiden problem, which Anderson does not cite, but as the microscopic question — when does an impurity *have* a local moment at all? — whose answer is the missing precondition for Sarachik's diagnostic, and ultimately for Kondo's logarithm. The Anderson model and the $s$–$d$ Hamiltonian will only be welded together by Schrieffer and Wolff two years after Kondo [8], and that weld is the subject of the next section."}, {"id": "the-physics", "title": "The Pedagogical Core: s-d Exchange, Kondo's Logarithm, and the Anderson Parent", "markdown": "## The Pedagogical Core: s-d Exchange, Kondo's Logarithm, and the Anderson Parent\n\nBefore the historical sequel — Abrikosov's parquets, Nagaoka's decoupling, Anderson–Yuval–Hamann scaling, Wilson's NRG — comes a small mountain of algebra that every Kondo veteran is supposed to know cold and that every textbook compresses into a sentence. This section unpacks it: the two Hamiltonians, the third-order calculation that produces the famous logarithm, the canonical transformation that ties them together, and the precise sense in which $T_K^{\\text{pert}}$ is not a temperature but an obituary for perturbation theory in $J$.\n\n### The two Hamiltonians\n\nThe **Kondo (s-d exchange) model** is\n\n$$H_K = \\sum_{k\\sigma}\\varepsilon_k\\, c^{\\dagger}_{k\\sigma}c_{k\\sigma} + J\\,\\mathbf{S}\\cdot\\mathbf{s}(0),\\qquad \\mathbf{s}(0)=\\tfrac{1}{2}\\sum_{kk'}\\sum_{\\alpha\\beta} c^{\\dagger}_{k\\alpha}\\,\\boldsymbol{\\sigma}_{\\alpha\\beta}\\, c_{k'\\beta},$$\n\nwith $\\mathbf{S}$ a localized spin-$\\tfrac{1}{2}$ operator (no charge dynamics on the impurity) and a flat conduction band of half-width $D$ and Fermi-level density of states $\\rho$. The convention $J\u003e0$ is *antiferromagnetic* exchange; this sign is what makes the running coupling flow to strong coupling. The model is not Kondo's invention — it is the local-moment limit of the s-d exchange Hamiltonian deployed by Zener, Kasuya, and Yosida in the 1950s, where Yosida had already computed the spin-scattering resistivity to second Born and seen *no* anomaly [3].\n\nThe **Anderson model** [7] is the microscopic parent:\n\n$$H_A=\\sum_{k\\sigma}\\varepsilon_k\\, c^{\\dagger}_{k\\sigma}c_{k\\sigma} + \\varepsilon_d\\sum_{\\sigma}n_{d\\sigma} + U\\,n_{d\\uparrow}n_{d\\downarrow} + \\sum_{k\\sigma}\\!\\bigl(V_k\\, c^{\\dagger}_{k\\sigma}d_\\sigma + \\text{h.c.}\\bigr).$$\n\nFour scales: $\\varepsilon_d\u003c0$ (singly occupied at the mean field level), $\\varepsilon_d+U\u003e0$ (doubly occupied costs $U$), the hybridization $\\Delta=\\pi\\rho|V|^2$, and the bandwidth $D$. In the **local-moment regime** $|\\varepsilon_d|,\\,U-|\\varepsilon_d|\\gg\\Delta$, charge fluctuations on the impurity are frozen and only the spin survives at low energies — and then $H_A$ projects onto $H_K$ via Schrieffer–Wolff.\n\n\u003csvg viewBox=\"0 0 760 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"360\" fill=\"none\"/\u003e\u003ctext x=\"120\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eAnderson model\u003c/text\u003e\u003ctext x=\"640\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eKondo (s-d) model\u003c/text\u003e\u003cline x1=\"40\" y1=\"180\" x2=\"220\" y2=\"180\" stroke=\"#e8e6e1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"32\" y=\"184\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eE_F\u003c/text\u003e\u003crect x=\"50\" y=\"170\" width=\"160\" height=\"14\" fill=\"#7aa2ff\" opacity=\"0.25\"/\u003e\u003ctext x=\"130\" y=\"210\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003eFermi sea, half-width D\u003c/text\u003e\u003cline x1=\"100\" y1=\"240\" x2=\"170\" y2=\"240\" stroke=\"#ffb86b\" stroke-width=\"3\"/\u003e\u003ctext x=\"60\" y=\"244\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"end\"\u003eε_d\u003c/text\u003e\u003cline x1=\"100\" y1=\"110\" x2=\"170\" y2=\"110\" stroke=\"#ff7a90\" stroke-width=\"3\"/\u003e\u003ctext x=\"60\" y=\"114\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"end\"\u003eε_d+U\u003c/text\u003e\u003cpath d=\"M 135 235 Q 90 180 135 115\" fill=\"none\" stroke=\"#7ee0a3\" stroke-dasharray=\"3 3\"/\u003e\u003cpath d=\"M 135 115 Q 180 180 135 235\" fill=\"none\" stroke=\"#7ee0a3\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"245\" y=\"180\" fill=\"#7ee0a3\" font-size=\"13\"\u003eV\u003c/text\u003e\u003ctext x=\"100\" y=\"290\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eU: on-site repulsion\u003c/text\u003e\u003ctext x=\"100\" y=\"306\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eΔ = πρ|V|²: hybridization\u003c/text\u003e\u003cpath d=\"M 290 180 L 380 180\" stroke=\"#e8e6e1\" stroke-width=\"2\" marker-end=\"url(#ah)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"335\" y=\"170\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eSchrieffer–Wolff\u003c/text\u003e\u003ctext x=\"335\" y=\"200\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e|ε_d|, U−|ε_d| ≫ Δ\u003c/text\u003e\u003cline x1=\"450\" y1=\"180\" x2=\"630\" y2=\"180\" stroke=\"#e8e6e1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"540\" y=\"210\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003econduction band, s(0)\u003c/text\u003e\u003ccircle cx=\"600\" cy=\"120\" r=\"14\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"600\" y=\"125\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eS\u003c/text\u003e\u003cline x1=\"600\" y1=\"135\" x2=\"600\" y2=\"175\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"620\" y=\"160\" fill=\"#ff7a90\" font-size=\"13\"\u003eJ S·s(0)\u003c/text\u003e\u003ctext x=\"540\" y=\"260\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eJ = 2V² U / [|ε_d|(U−|ε_d|)]\u003c/text\u003e\u003ctext x=\"540\" y=\"278\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003esymmetric point ε_d = −U/2 ⇒ J = 8V²/U\u003c/text\u003e\u003ctext x=\"380\" y=\"340\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003echarge fluctuations frozen out; only the spin survives at low energy\u003c/text\u003e\u003c/svg\u003e\n*Figure: Anderson → Kondo. Two charge-transfer virtual processes — electron hops d → band (cost $|\\varepsilon_d|$) and electron hops band → d (cost $U-|\\varepsilon_d|$) — combine to produce a single antiferromagnetic exchange $J$ on the spin sector after Schrieffer–Wolff projection [8].*\n\n### Kondo's third-order log and where spin non-commutativity enters\n\nCompute the $T$-matrix for a single impurity in powers of $J$. Second-order Born is just the spin-rotation-averaged cross section: $|T^{(2)}|^2\\propto J^2 S(S+1)$, constant in energy, contributing $\\rho_{\\text{imp}}^{(2)}=\\rho_0\\,c_{\\text{imp}}$ with no temperature structure. The drama starts at $J^3$, where the intermediate state carries a spin operator that *cannot be commuted past* the others without picking up extra terms.\n\nSchematically, two third-order amplitudes contribute. In one (particle channel) a band electron $q$ is created in the intermediate state:\n\n$$T^{(3)}_{\\text{p}} \\propto J^3\\sum_q \\frac{1-f(\\varepsilon_q)}{\\omega-\\varepsilon_q+i0}\\;S^a S^b S^c\\,(\\sigma^a\\sigma^b\\sigma^c)_{\\alpha\\beta}.$$\n\nIn the other (hole channel) a hole is created and the same vertex order is reversed:\n\n$$T^{(3)}_{\\text{h}} \\propto J^3\\sum_q \\frac{f(\\varepsilon_q)}{\\omega+\\varepsilon_q-i0}\\;S^c S^b S^a\\,(\\sigma^c\\sigma^b\\sigma^a)_{\\alpha\\beta}.$$\n\nFor a non-magnetic (potential) scatterer, $S$ commutes with itself, the two orderings are identical, and the $f$ and $1-f$ pieces conspire to *cancel* the log — this is the well-known absence of a logarithmic resistivity from spinless impurities. With a quantum spin the orderings differ. Use $S^aS^b=\\tfrac{1}{2}\\{S^a,S^b\\}+\\tfrac{i}{2}\\varepsilon^{abc}S^c$; the symmetric piece still cancels between channels, while the *antisymmetric* commutator piece adds, leaving a residue $\\propto S^a$ times\n\n$$\\int\\!d\\varepsilon\\,\\rho(\\varepsilon)\\,\\frac{1-2f(\\varepsilon)}{\\omega-\\varepsilon}\\;\\xrightarrow[\\,T\\ll D\\,]{}\\;\\rho\\,\\ln\\!\\frac{D}{\\max(|\\omega|,T)}.$$\n\nRestoring prefactors, the spin-flip cross section acquires the multiplicative correction $1-2J\\rho\\,\\ln(D/T)$, and the impurity resistivity reads\n\n$$\\boxed{\\;\\rho_{\\text{imp}}(T)= c_{\\text{imp}}\\,\\frac{3\\pi m\\, J^2 S(S+1)}{2 e^2 \\hbar\\,\\varepsilon_F}\\Bigl[\\,1-4J\\rho\\,\\ln(T/D)+\\mathcal O(J^2\\rho^2)\\Bigr]\\;}$$\n\nwhich for antiferromagnetic $J\u003e0$ grows as $T$ decreases — the resistance minimum, finally, has a microscopic origin in spin-exchange scattering [5]. Adding a phonon $T^5$ background gives the textbook minimum at $T_{\\min}\\sim(J\\rho/5)^{1/5}\\Theta_D$.\n\nThe lesson is structural: the log is not a band-structure artefact, not a Fermi-surface curvature effect, not a many-body collective. It is the imprint of *non-commuting spin operators in the intermediate state of a single impurity-scattering process*. Take $\\mathbf{S}\\to$ classical vector and the log dies. This is the central reason mean-field \"spin fluctuation\" treatments mishandle Kondo physics — they kill the very algebra that produces the effect.\n\n### Schrieffer–Wolff: where $J$ actually comes from\n\nSchrieffer and Wolff [8] turned the local-moment limit of $H_A$ into $H_K$ by a single canonical transformation $\\tilde H = e^{S}H_Ae^{-S}$ with the generator $S$ chosen to annihilate the hybridization at first order, $[S,H_0]=-H_{\\text{hyb}}$. Solving in the singly-occupied subspace gives\n\n$$S=\\sum_{k\\sigma}V_k\\!\\left[\\frac{1-n_{d\\bar\\sigma}}{\\varepsilon_k-\\varepsilon_d}+\\frac{n_{d\\bar\\sigma}}{\\varepsilon_k-\\varepsilon_d-U}\\right]c^{\\dagger}_{k\\sigma}d_\\sigma - \\text{h.c.},$$\n\nand the effective Hamiltonian to $\\mathcal O(V^2)$, projected onto the single-occupancy sector $P_1$, becomes $P_1\\tilde H P_1 = H_{\\text{band}} + J\\,\\mathbf{S}\\cdot\\mathbf{s}(0) + K\\,n(0)$, with\n\n$$J=2|V|^2\\!\\left[\\frac{1}{|\\varepsilon_d|}+\\frac{1}{U-|\\varepsilon_d|}\\right]=\\frac{2|V|^2\\,U}{|\\varepsilon_d|\\,(U-|\\varepsilon_d|)}.$$\n\nThe two denominators are the two virtual processes drawn in the figure: $d\\to k$ (cost $|\\varepsilon_d|$) and $k\\to d$ on top of an already-occupied site (cost $U-|\\varepsilon_d|$). At the particle–hole symmetric point $\\varepsilon_d=-U/2$ this reduces to $J=8|V|^2/U$, exposing the famous *Anderson superexchange*: the exchange interaction in a Mott insulator and the exchange coupling at a magnetic impurity are the same combinatorial object [9]. The potential scattering $K$ is non-zero away from particle–hole symmetry; it is irrelevant to the Kondo problem in the RG sense, which is why most pedagogy omits it.\n\n### The death of perturbation theory: $T_K^{\\text{pert}}$\n\nThe third-order log is the first sign that the expansion in $J$ has a finite radius of convergence in temperature. Resumming the leading logs — which Abrikosov [10] and Nagaoka [11] did within a year — gives an effective coupling $J_{\\text{eff}}(T)=J/[1-2J\\rho\\ln(D/T)]$ that *blows up* at\n\n$$T_K^{\\text{pert}}\\;\\approx\\;D\\,\\exp\\!\\Bigl(-\\tfrac{1}{2J\\rho}\\Bigr).$$\n\nThis is **not** a phase-transition temperature. It is the scale at which the perturbative resummation diverges and the bare expansion fails, and nothing about its appearance implies any physical singularity. The exact theories that came later — poor man's scaling [12], NRG [13], and Bethe ansatz [14, 15] — recover the *same exponential parametric dependence* on $J\\rho$, but redefine $T_K$ as a finite RG-invariant crossover scale on which the universal scaling functions $\\chi_{\\text{imp}}(T/T_K)$ and $C_{\\text{imp}}(T/T_K)$ collapse. The two definitions differ by $\\mathcal O(1)$ multiplicative constants (the Wilson scheme fixes $T_K^W$ via $\\chi_{\\text{imp}}(0)\\equiv(g\\mu_B)^2/(4T_K^W)$), and this difference is the source of the 20–30 % spread in \"measured $T_K$\" values quoted across quantum-dot experiments [2]. Before any of that machinery, what Kondo's calculation actually delivered was a logarithm, a sign change, and a notice: below $T_K^{\\text{pert}}$ the spin and the Fermi sea need a non-perturbative theory."}, {"id": "from-parquet-to-nrg", "title": "Resummation, Scaling, and the Wilson Eclipse", "markdown": "## Resummation, Scaling, and the Wilson Eclipse\n\nKondo's third-order calculation [5] left the problem in an embarrassing posture: a perturbative answer that diverged logarithmically precisely where the expansion was supposed to be reliable. The next decade was a contest among three styles of attack — parquet resummation, equation-of-motion decoupling, and scaling — terminated, but not closed, by Wilson's numerical renormalisation group. The standard pedagogy collapses this contest into a two-name story (Kondo, Wilson); the historical record names at least five.\n\n### Abrikosov's parquet: the first sum\n\nAbrikosov in 1965 [10] noticed that the leading logarithms organise themselves into a parquet structure: at every order $n$ in the antiferromagnetic coupling, the dominant contribution is of the form $J^n [\\rho \\ln(D/|\\omega|)]^{n-1}$, with all subdominant terms suppressed by inverse powers of $\\ln(D/|\\omega|)$. The parquet equations sum the leading-log contributions in both particle–hole and particle–particle channels self-consistently. For the spin-1/2 antiferromagnetic s–d model the resulting on-shell T-matrix takes the schematic form\n\n$$T(\\omega) \\;\\sim\\; \\frac{J}{1 - 2\\rho J \\,\\ln\\!\\big(D/|\\omega|\\big)},$$\n\nwith an apparent pole at $|\\omega| \\approx D \\exp(-1/2\\rho J) \\equiv T_K^{\\text{pert}}$. Abrikosov read this as the signature of a bound state, but parquet is only a leading-log sum — subleading logs are uncontrolled, and as $|\\omega| \\to T_K^{\\text{pert}}$ the denominator vanishing is a statement about the truncation, not about the spectrum. What survives is the energy scale itself, which already carries the non-perturbative form $D \\exp(-1/2\\rho J)$: the running coupling has eaten the small parameter.\n\n### Nagaoka, Suhl, Hamann: a bound state from decoupling\n\nNagaoka in the same year [11] reached the same scale by a different route: he wrote Green-function equations of motion for the impurity propagator and truncated them by a Hartree–Fock-style decoupling that respects the spin algebra. The result is an integral equation whose self-consistent solution exhibits a resonance pinned at the Fermi level with width set by $T_K^{\\text{pert}}$ — the first analytic prediction of what one would now call the Abrikosov–Suhl resonance. Suhl's dispersion-theoretic formulation appeared in parallel; Hamann's 1967 closed-form refined the line shape and the asymptotic thermodynamics. Nagaoka is rarely named in undergraduate treatments, which is unjust: the bound-state-at-$T_K$ picture, the singlet language, and the resonance at the Fermi energy entered the field through him.\n\nWhat both routes missed is that the perturbative log is not a divergence of any observable — it is the perturbation series announcing its own demise. The required reframing is renormalisation-group, and the parquet/EOM machinery cannot supply it.\n\n### Anderson–Yuval–Hamann: scaling as ontology, 1970\n\nThe conceptual break belongs to Anderson and his collaborators five years before Wilson. In the third paper of the \"Exact Results in the Kondo Problem\" series [12], and in Anderson's standalone \"poor man's\" companion paper of the same year, the band edge is treated as an adjustable cutoff. One integrates out conduction states in shells $D - dD \u003c |\\epsilon| \u003c D$; virtual excitations into the band edge dress the impurity-electron vertex; demanding low-energy invariance under this elimination yields the celebrated flow equation\n\n$$\\frac{dJ}{d\\ln D} \\;=\\; -2\\rho J^2 \\;+\\; \\mathcal{O}(J^3).$$\n\nIntegrating with bare values $(J_0, D_0)$,\n\n$$\\frac{1}{\\rho J(D)} \\;=\\; \\frac{1}{\\rho J_0} \\;-\\; 2\\ln(D_0/D), \\qquad T_K \\;\\equiv\\; D_0\\,e^{-1/2\\rho J_0},$$\n\nso the antiferromagnetic coupling $J\u003e0$ runs to strong coupling at the scale $T_K$ — the same exponential as Abrikosov's pole, but now interpreted: $T_K$ is the RG-invariant scale at which weak-coupling perturbation theory fails. For ferromagnetic $J\u003c0$ the flow is toward $J=0$, an immediate qualitative prediction (asymmetric infrared fates of the two signs of exchange) that no parquet sum had registered. The strong-coupling fixed point, the runaway flow, and the language of relevant operators are all on the page in 1970. Anderson's 1977 Nobel lecture [9] reads, in part, as a polite priority assertion on exactly this point.\n\nThe poor man's scaling stops at $J(D) \\sim 1$. It cannot follow the flow through the crossover, and it cannot compute the thermodynamic functions on the strong-coupling side. The conceptual scaffold is complete; the constructive computation is not.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003cline x1=\"60\" y1=\"350\" x2=\"680\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"60\" y1=\"50\" x2=\"60\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"370\" y=\"386\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003edecreasing bandwidth D → flow toward the infrared\u003c/text\u003e\u003ctext x=\"80\" y=\"370\" fill=\"#e8e6e1\" font-size=\"14\"\u003eD = D₀\u003c/text\u003e\u003ctext x=\"500\" y=\"370\" fill=\"#ff7a90\" font-size=\"14\"\u003eD = T_K\u003c/text\u003e\u003ctext x=\"22\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" transform=\"rotate(-90 22 200)\" text-anchor=\"middle\"\u003erunning coupling ρJ(D)\u003c/text\u003e\u003cpath d=\"M 80 320 Q 240 305 320 280 T 460 200 T 525 95\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cline x1=\"540\" y1=\"60\" x2=\"540\" y2=\"350\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003cline x1=\"60\" y1=\"180\" x2=\"680\" y2=\"180\" stroke=\"#7ee0a3\" stroke-width=\"0.8\" stroke-dasharray=\"2 3\" opacity=\"0.55\"/\u003e\u003ctext x=\"690\" y=\"184\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"end\"\u003eρJ ~ 1\u003c/text\u003e\u003ctext x=\"130\" y=\"258\" fill=\"#ffb86b\" font-size=\"14\"\u003eKondo log (PT)\u003c/text\u003e\u003ctext x=\"130\" y=\"278\" fill=\"#e8e6e1\" font-size=\"14\"\u003e3rd-order Born [5]\u003c/text\u003e\u003ctext x=\"265\" y=\"148\" fill=\"#ffb86b\" font-size=\"14\"\u003eParquet / EOM\u003c/text\u003e\u003ctext x=\"265\" y=\"168\" fill=\"#e8e6e1\" font-size=\"14\"\u003eAbrikosov [10], Nagaoka [11]\u003c/text\u003e\u003ctext x=\"370\" y=\"110\" fill=\"#ffb86b\" font-size=\"14\"\u003ePoor man's scaling\u003c/text\u003e\u003ctext x=\"370\" y=\"130\" fill=\"#e8e6e1\" font-size=\"14\"\u003eAYH [12]: dJ/d ln D = −2ρJ²\u003c/text\u003e\u003ctext x=\"560\" y=\"200\" fill=\"#7ee0a3\" font-size=\"14\"\u003elocal Fermi liquid\u003c/text\u003e\u003ctext x=\"560\" y=\"220\" fill=\"#e8e6e1\" font-size=\"14\"\u003eNozières [16]\u003c/text\u003e\u003cline x1=\"80\" y1=\"68\" x2=\"660\" y2=\"68\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"62\" x2=\"80\" y2=\"74\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"660\" y1=\"62\" x2=\"660\" y2=\"74\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"370\" y=\"40\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003eWilson NRG [13] — constructive across the entire crossover\u003c/text\u003e\u003c/svg\u003e\n*Figure: Each pre-Wilson technique illuminates one energy window of the running coupling $\\rho J(D)$; none crosses the crossover at $\\rho J \\sim 1$. Wilson's NRG is the bracket spanning weak and strong coupling. Below $T_K$, Nozières's Fermi-liquid description takes over (§4).*\n\n### Wilson 1975: the constructive crossing\n\nWilson's NRG [13] is engineered around two design choices. First, the conduction band is discretised on a logarithmic grid: intervals $D\\Lambda^{-(n+1)} \u003c |\\epsilon| \u003c D\\Lambda^{-n}$ for some $\\Lambda \u003e 1$ (typically $2$–$3$), one fermion mode kept per interval. Second, the resulting impurity-plus-bath Hamiltonian is rotated by Lanczos tridiagonalisation onto a semi-infinite \"Wilson chain\",\n\n$$H \\;=\\; J\\,\\mathbf{S}\\!\\cdot\\! f_0^{\\dagger}\\boldsymbol{\\sigma} f_0 \\;+\\; \\sum_{n=0}^{\\infty} t_n\\big(f_n^{\\dagger}f_{n+1} + \\text{h.c.}\\big), \\qquad t_n \\;\\sim\\; D\\,\\Lambda^{-n/2}.$$\n\nThe hoppings decay exponentially with site index. Site $n$ therefore probes temperature $T_N \\sim D\\Lambda^{-N/2}$, and the renormalisation step is literal: diagonalise $H_N$, keep the lowest ~$10^3$ states, append site $N+1$, rescale by $\\Lambda^{1/2}$, repeat. The spectrum of $H_N$ at large $N$ flows from a free-orbital fixed point through a local-moment plateau into a strong-coupling fixed point whose level spacing is precisely Nozières's frozen-impurity spectrum. Wilson read off $T_K$ from the crossover, computed the impurity susceptibility $\\chi_{\\text{imp}}(T)$ and specific heat $C_{\\text{imp}}(T)$ across six decades of $T/T_K$, and verified the Wilson ratio $R = (4\\pi^2/3)\\chi_{\\text{imp}}/\\gamma_{\\text{imp}}\\cdot(g\\mu_B)^{-2} = 2$ numerically. The universal crossover function is, in practice, a Wilson curve [2].\n\n### Credit verdict: what the eclipse hides\n\nThe textbook story compresses 1965–1975 into \"Wilson solved the Kondo problem\", with AYH demoted to a footnote and Abrikosov/Nagaoka to ancestor-veneration. The record disagrees on each point.\n\n- **Scaling.** Introduced by AYH and by Anderson alone in 1970 [12, 9]. Wilson's NRG implements scaling constructively; it does not originate it.\n- **Strong-coupling fixed point.** Identified, named, and qualitatively analysed by AYH (asymptotic freedom of the antiferromagnetic flow) and structurally predicted by Nozières [16] (next section). Wilson confirmed it numerically and computed the approach.\n- **Exact solution.** Not Wilson. Andrei and Wiegmann independently, by Bethe ansatz [14, 15] — five years after the NRG.\n- **First non-trivial summation of the logs.** Abrikosov [10] and Nagaoka [11], a decade before Wilson.\n\nWhat Wilson did, and what no one else did, is build a single calculational machine that crosses the $\\rho J \\sim 1$ barrier with controlled, convergent thermodynamics. NRG is canonical not because it was first, not because it was analytically deepest, and not because it was unique — it is canonical because it is *trustworthy across the whole crossover*. The 1982 Nobel citation [17] is careful: the prize is for the renormalisation group as a method. The Kondo problem is the worked example carrying the lecture, but the prize is not \"for solving the Kondo problem\". That phrase is folklore, and it has cost five collaborators their textbook share."}, {"id": "fixed-point-fermi-liquid-and-bethe-ansatz", "title": "The Strong-Coupling Fixed Point: Nozières's Fermi Liquid and the Andrei–Wiegmann Exact Solution", "markdown": "## The Strong-Coupling Fixed Point: Nozières's Fermi Liquid and the Andrei–Wiegmann Exact Solution\n\nWilson's NRG [13] settled the existence of a strong-coupling fixed point and computed the crossover numerically. Two years before the NRG output table reached print, and four years after Anderson–Yuval–Hamann had drawn the flow diagram [12], Nozières asked a sharper question: *given* that $J(D) \\to \\infty$ in the IR, what must the low-energy theory look like, on symmetry grounds alone? The answer [16] is a local Fermi liquid whose entire low-energy content is fixed by one phase shift and two Landau parameters — and whose ratios are universal. Six years after Nozières, Andrei [14] and Wiegmann [15] independently produced the *exact* eigenstates of the Kondo Hamiltonian by Bethe ansatz, recovering every Nozières ratio analytically and supplying closed-form thermodynamics for arbitrary $T/T_K$ and $B/T_K$.\n\n### Nozières's argument: a phase shift, two derivatives, done\n\nThe starting observation is that as $J \\to \\infty$ the impurity binds one conduction electron into a singlet that is inert. The remaining electrons see an effectively *removed* site: their wave functions must vanish on the impurity, which is the same boundary condition as scattering from an infinitely strong potential. In a single channel of $s$-wave, particle-hole-symmetric conduction electrons at the Fermi level, this fixes\n\n$$\\delta_\\sigma(\\epsilon_F) = \\pi/2 \\qquad (\\text{Friedel sum rule: } n_d = \\sum_\\sigma \\delta_\\sigma/\\pi = 1).$$\n\nThat single number — a $\\pi/2$ phase shift at the Fermi surface for each spin — is the entire mean-field content of the strong-coupling fixed point. Everything else is corrections in $\\epsilon/T_K$ and $B/T_K$.\n\nNozières then expands the phase shift around the fixed point in two small parameters: the energy of the scattering electron $\\epsilon$ measured from $\\epsilon_F$, and the local density $\\delta n_\\sigma$ of the other electrons at the impurity. Particle-hole and spin-rotation symmetry collapse the expansion to two independent coefficients,\n\n$$\\delta_\\sigma(\\epsilon, \\{n\\}) = \\frac{\\pi}{2} + \\alpha\\,\\epsilon + \\phi\\,\\delta n_{-\\sigma} + \\tfrac{1}{2}\\alpha_1\\,\\epsilon^2 + \\cdots,$$\n\nwith $\\alpha$ an elastic single-particle slope and $\\phi$ a *quasiparticle interaction* — induced by virtual breaking of the singlet, but local. Dimensional analysis and the requirement that $T_K$ be the *only* low-energy scale impose $\\alpha \\sim \\phi \\sim 1/T_K$; the universal content is the ratio. Particle-hole symmetry forces\n\n$$\\phi = \\alpha \\qquad (\\text{Nozières's identity}),$$\n\nso a *single* dimensionful number controls everything.\n\nFrom there the low-$T$ thermodynamics is mechanical. The impurity-induced density of states is $\\rho_{\\rm imp} = \\alpha/\\pi$ per spin, giving\n\n$$\\gamma_{\\rm imp} \\equiv \\lim_{T\\to 0}\\frac{C_{\\rm imp}}{T} = \\frac{2\\pi^2 k_B^2}{3}\\,\\rho_{\\rm imp} = \\frac{2\\pi k_B^2}{3}\\,\\alpha.$$\n\nFor the susceptibility one must include the Landau correction: a Zeeman field shifts the two spin Fermi levels oppositely, and the $\\phi$ interaction adds in phase rather than cancelling, doubling the bare answer,\n\n$$\\chi_{\\rm imp} = (g\\mu_B)^2\\,\\rho_{\\rm imp}\\,(1 + \\phi/\\alpha) = \\frac{2(g\\mu_B)^2}{\\pi}\\,\\alpha.$$\n\nForm the Wilson ratio:\n\n$$R \\equiv \\frac{\\chi_{\\rm imp}/\\gamma_{\\rm imp}}{\\chi_{\\rm free}/\\gamma_{\\rm free}} = \\frac{4\\pi^2 k_B^2}{3(g\\mu_B)^2}\\cdot\\frac{\\chi_{\\rm imp}}{\\gamma_{\\rm imp}} = 2.$$\n\nThe factor of 2 is the entire physical statement: the impurity contribution to $\\chi$ is enhanced relative to $\\gamma$ by exactly the Landau factor a screened *spin-only* impurity must produce. There is no free parameter; $R = 2$ is a symmetry consequence, not a fit.\n\nThe same expansion gives the leading transport corrections. The $T$-matrix at low energy has imaginary part\n\n$$\\mathrm{Im}\\,t(\\epsilon,T) \\propto 1 - \\left[\\alpha_T\\!\\left(\\frac{\\pi T}{T_K}\\right)^{\\!2} + \\alpha_V\\!\\left(\\frac{eV}{T_K}\\right)^{\\!2} + \\alpha_B\\!\\left(\\frac{g\\mu_B B}{T_K}\\right)^{\\!2}\\right],$$\n\nand Nozières's two-parameter expansion forces *ratios* among $\\alpha_T, \\alpha_V, \\alpha_B$ that are independent of microscopic detail. In particular the linear conductance in a Kondo dot obeys\n\n$$G(T,B) = \\frac{2e^2}{h}\\!\\left[1 - c_T(T/T_K)^2 - c_B(g\\mu_B B/T_K)^2 + \\cdots\\right], \\qquad \\frac{c_T}{c_B} = \\frac{\\pi^2}{3}\\cdot\\frac{1}{(\\text{channel factor})}.$$\n\nThis is the $\\alpha/\\beta$ relation routinely abused in the quantum-dot literature when authors quote a \"Kondo $T_K$\" without checking that the *ratio* of curvatures matches; see Grobis *et al.* [18] and the Pustilnik–Glazman programme [19] for the form that should be tested. Oguri's nonequilibrium extension [20] supplies the matching Fermi-liquid relations at finite bias, including the cross-term between $V$ and $T$ that pure thermodynamic Nozières does not see. Kontani–Yamada [21] give the same skeleton in the language of microscopic Fermi-liquid theory.\n\nWhat Nozières's analysis does *not* give: $T_K$ itself, or the universal function interpolating from $T \\gg T_K$ to $T \\ll T_K$. It fixes the IR; the UV input is one number.\n\n### Andrei (1980) and Wiegmann (1980): the model is integrable\n\nAnderson–Yuval–Hamann's mapping of the anisotropic Kondo problem onto a 1D Coulomb gas had already suggested that the s–d model carries a hidden integrable structure. In 1980 Andrei [14] linearised the conduction band around $\\epsilon_F$, reducing the problem to an effectively 1D scattering problem on the half-line, and constructed an exact eigenbasis via the nested Bethe ansatz. Wiegmann, independently and almost simultaneously [15], gave a closely related construction. The two solutions agree where they overlap and are usually cited together (Andrei–Fateev–Lowenstein 1983 then unified the algebraic content and extended to $SU(N)$).\n\nThe output is a set of Bethe equations whose thermodynamic (TBA) limit yields the impurity free energy $F_{\\rm imp}(T,B)$ as a coupled integral equation. From it one extracts, *analytically*:\n\n- the impurity susceptibility at $T=0$, $\\chi_{\\rm imp}(0,B=0) = (g\\mu_B)^2/(2\\pi T_K)$ with $T_K$ defined by a specific Bethe-ansatz convention (the Wiegmann/Tsvelik scale);\n- the linear specific-heat coefficient $\\gamma_{\\rm imp}$ such that the Wilson ratio comes out *exactly* $R = 2$, matching Nozières;\n- the full magnetisation curve $M(B)/M_\\infty = \\mathcal{M}(B/T_H)$ — universal, with $T_H = T_K\\sqrt{\\pi/e}/2$ (a representative O(1) conversion factor; the \"two $T_K$'s\" conflation in the dossier preamble lives here);\n- the $T$-dependent susceptibility and entropy curves, with the asymptotics $S_{\\rm imp}(T\\to 0) \\to 0$ (singlet ground state) and $S_{\\rm imp}(T\\to\\infty) \\to k_B\\ln 2$ (free spin).\n\nThese are the *same* curves Wilson's NRG produced numerically in 1975 [13, 2], now in closed form. The agreement is quantitative to NRG precision: Wilson's \"magic number\" $w = 0.4128\\ldots$ for $4T_K\\chi_{\\rm imp}/(g\\mu_B)^2$ became, in the Bethe-ansatz framing, a specific Gamma-function ratio.\n\n### Why constructive numerics won the textbook\n\nA naïve reading of the timeline — Nozières fixes the fixed point in 1974, Wilson confirms it numerically in 1975, Andrei–Wiegmann solve the model exactly in 1980 — would predict that the Bethe-ansatz solution becomes canonical and NRG is remembered as the brute-force precursor. The opposite happened. Three reasons, all defensible:\n\n1. **NRG generalises; the Bethe ansatz does not.** Integrability of the single-channel, spin-$\\tfrac{1}{2}$, linear-dispersion Kondo model is fragile. Add a second channel, anisotropy beyond the Toulouse line, finite bandwidth curvature, a magnetic field with non-uniform $g$, or a phonon mode, and the Bethe equations cease to exist. NRG simply redoes the iterative diagonalisation. Every modern Kondo variant in the dossier corpus — multichannel, mesoscopic-disorder [22], skutterudite CEF [23], nonequilibrium dot [20, 24, 18], topological symplectic [25], cavity-coupled [26] — is an NRG problem, not a Bethe-ansatz problem.\n2. **NRG outputs dynamics; the Bethe ansatz outputs thermodynamics.** Spectral functions $A(\\omega,T)$, the Kondo peak in the $T$-matrix, and finite-bias quantities come out of NRG with controlled error and out of the Bethe ansatz only via heroic form-factor expansions that were not in place in 1980. Experimentalists wanted spectra.\n3. **Pedagogy follows trustworthy crossovers.** Wilson's logarithmic discretisation makes the RG *visible* — one literally watches a tower of levels reorganise from a free-spin doublet through a free-orbital fixed point into the strong-coupling singlet. A graduate student internalises the renormalization group from one NRG flow diagram; the Bethe-ansatz derivation, however elegant, teaches integrability rather than the RG. Wilson's 1982 Nobel Lecture [17] makes the choice explicit: the Kondo problem is the load-bearing example *because* it is constructive.\n\nThe honest summary is that Andrei and Wiegmann are analytically deeper and NRG is operationally more useful, and the textbook record has chosen utility. Hewson [2] treats both fairly; most condensed-matter courses do not."}, {"id": "landmark-experiments", "title": "Landmarks: From Cu–Mn Dilution to the Single-Electron Transistor Revival", "markdown": "## Landmarks: From Cu–Mn Dilution to the Single-Electron Transistor Revival\n\nThe theoretical chain from §1–§4 — Kondo's logarithm, Anderson–Yuval–Hamann scaling, Wilson's NRG, Nozières's Fermi liquid, Andrei–Wiegmann Bethe ansatz — would be of merely historical interest had it not been tied, one quantity at a time, to a bench. The experimental landmarks that did the tying span sixty‑four years and three platforms: bulk dilute alloys, gate‑tuned semiconductor quantum dots, and scanning probes on metal surfaces. Each landmark resolves one specific prediction of the strong‑coupling fixed point.\n\n### Bulk alloys: the anomaly, the moment, the saturation\n\nThe starting datum is the Leiden curve itself — $\\rho(T)$ for nominally pure Au, Cu, Pb passing through a minimum near $\\sim 10\\,\\mathrm{K}$ and rising as $T\\to 0$ [1]. It tests nothing about a fixed point; it merely *defines* the problem and falsifies the Bloch–Grüneisen picture, in which $\\rho$ is monotone. The decisive empirical refinement came thirty years later with Sarachik–Corenzwit–Matthias: the minimum is *present* with Fe in Mo–Nb hosts that develop a local moment and *absent* in Mo–Re hosts where the same Fe sits non‑magnetic [4]. This is the experiment textbooks ought to cite immediately after de Haas. It promotes the anomaly from a transport curiosity to a magnetic problem and underwrites Yosida's s–d Hamiltonian retroactively [3].\n\nOnce Kondo's logarithm was in print [5], a series of measurements on dilute Cu–Fe, Au–Fe, and Cu–Mn pursued the predictions that perturbation theory could not deliver but Wilson's NRG and Nozières's Fermi liquid could:\n\n- **Resistivity shape.** $\\rho_{\\rm imp}(T)$ rises as $-\\ln(T)$ at $T\\gtrsim T_K$, rolls over, and *saturates* at the unitary value $\\rho_0 = 2 n_{\\rm imp}/(\\pi \\hbar v_F^2 \\nu)$ as $T\\to 0$. The high‑$T$ branch tests Kondo's third‑order coefficient; the low‑$T$ saturation tests the Friedel sum rule $\\delta(\\epsilon_F) = \\pi/2$ at the strong‑coupling fixed point, equivalent to maximal s‑wave scattering. Au–Fe and Cu–Fe data of the late 1960s and early 1970s are the canonical demonstrations (verify).\n- **Specific heat.** $C_{\\rm imp}/T \\to \\gamma_{\\rm imp}$ at $T\\ll T_K$ with $\\gamma_{\\rm imp} \\sim 1/T_K$ per impurity. This tests the existence of a *local* Fermi liquid: a renormalised level pinned at $E_F$ generating a finite linear term, with $T_K$ extracted independently from the entropy released $\\int_0^\\infty (C_{\\rm imp}/T)\\,dT = k_B \\ln 2$ [16].\n- **Susceptibility.** $\\chi_{\\rm imp}(T)$ crosses over from a Curie tail $C/T$ above $T_K$ to a finite Pauli‑like value $\\chi_{\\rm imp}(0) = (g\\mu_B)^2 \\,w/(4\\,T_K)$, with $w$ the Wilson number $w \\simeq 0.4128$ for $S=1/2$ as fixed by NRG [13] and confirmed by Bethe ansatz [14, 15].\n- **The Wilson ratio.** The dimensionless combination\n $$ R \\equiv \\frac{4\\pi^2 k_B^2}{3 (g\\mu_B)^2}\\,\\frac{\\chi_{\\rm imp}(0)}{\\gamma_{\\rm imp}} = 2 $$\n is the cleanest test of the Nozières fixed‑point structure — independent of $T_K$, of band cutoffs, and of overall impurity density [16, 2]. Au–Fe and Cu–Fe thermodynamics confirmed $R \\approx 2$ within ~10% by the early 1980s (verify), tying $\\gamma$ and $\\chi$ to the *same* renormalised level.\n- **Universal scaling.** Plotted as $\\rho_{\\rm imp}/\\rho_0$, $\\chi_{\\rm imp} T_K$, and $C_{\\rm imp}/T \\cdot T_K$ versus $T/T_K$, alloys with $T_K$ varying over decades collapse onto single curves predicted parameter‑free by NRG [13]. The collapse is the empirical embodiment of one‑parameter universality and the cleanest defence against ad‑hoc fits.\n\n### 1998: Kondo in a single‑electron transistor\n\nBy 1988 Glazman and Raikh, and independently Ng and Lee, had pointed out that an odd‑occupancy Coulomb‑blockaded quantum dot is a *gate‑tunable* realisation of the symmetric Anderson model: $\\epsilon_d$, $U$, and the lead–dot hybridisation $\\Gamma$ all become controllable [27]. Kondo's $J = 2V^2 U/[|\\epsilon_d|(U-|\\epsilon_d|)]$ [8] is no longer a fixed property of an alloy; it can be swept through the dot's gate voltage.\n\nGoldhaber‑Gordon and collaborators delivered the experiment a decade later in a GaAs/AlGaAs single‑electron transistor [28]: in odd Coulomb‑blockade valleys the differential conductance $dI/dV$ acquired a zero‑bias peak whose width set $T_K$, whose amplitude rose monotonically as $T$ was lowered, and which *vanished* in adjacent even valleys. Three checks lifted this from \"another zero‑bias peak\" to a Kondo identification: (i) the peak split by $\\Delta = 2 g\\mu_B B$ in an applied Zeeman field, (ii) $G(T)/G(0)$ from several valleys collapsed onto the empirical NRG curve when plotted against $T/T_K$, and (iii) $T_K$ tracked gate voltage as predicted by Schrieffer–Wolff. The 1998 paper is the experimental revival; the 1988 Glazman–Raikh and Ng–Lee proposals are the under‑credited theory predecessors [29].\n\n### The unitary limit: testing Nozières's phase shift\n\nA subtler prediction of the strong‑coupling fixed point is quantitative, not just structural. At $T \\ll T_K$ in the particle–hole‑symmetric case, each spin channel contributes $\\sin^2\\delta = 1$ to scattering, so a symmetrically coupled dot should reach\n$$ G(0) = \\frac{2e^2}{h}. $$\nThis *is* the Friedel sum rule made into a transport observable. The plateau was measured in symmetric GaAs dots in the early 2000s (van der Wiel et al., 2000 — verify; reviewed in [18, 29]) and is the bench test of $\\delta(\\epsilon_F) = \\pi/2$. The leading deviations are Nozières's $T^2$ and $V^2$ Fermi‑liquid corrections,\n$$ G(T,V) = \\frac{2e^2}{h}\\left[\\,1 - \\alpha\\left(\\frac{T}{T_K}\\right)^2 - \\beta\\left(\\frac{eV}{T_K}\\right)^2 + \\dots\\right], $$\nwith the universal ratio $\\alpha/\\beta$ fixed by the single Fermi‑liquid parameter [16, 2]. Modern non‑equilibrium Fermi‑liquid analyses sharpen the prediction to a tight numerical ratio testable in tunable dots [20].\n\n### Two‑channel realisations: probing a non‑Fermi‑liquid fixed point\n\nA single under‑screened spin‑½ moves the system to the Nozières Fermi liquid; two equally coupled channels move it instead to the over‑screened fixed point with leading thermodynamic singularity $C_{\\rm imp}/T \\sim \\ln(T_K/T)$ and conductance scaling\n$$ G(T) - G(0) \\propto \\sqrt{T/T_K}. $$\nPotok–Rau–Shtrikman–Mahalu–Goldhaber‑Gordon (2007 — verify) engineered the two‑channel geometry by coupling a small dot to one open lead and one large‑dot reservoir, tuned through the non‑Fermi‑liquid critical point by detuning channel asymmetry. The $\\sqrt{T}$ scaling — not $T^2$ — is the diagnostic; the Fermi‑liquid Wilson ratio $R=2$ is replaced by a *different* universal number characteristic of the over‑screened fixed point [2]. This is the experimental discriminator between screened and over‑screened universality classes.\n\n### STM landmarks: Fano lineshapes, mirages, and Kondo holes\n\nMadhavan–Chen–Jamneala–Crommie–Wingreen (1998 — verify) and Li–Schneider–Berndt–Delley (1998 — verify) imaged single Co adatoms on Au(111) and Ce on Ag(111) with the scanning tunnelling microscope, finding a narrow Fano feature in $dI/dV$ at the Fermi energy. The asymmetric Fano shape reflects interference between tunnelling into the conduction continuum and into the Kondo resonance — i.e., what one is seeing is the *Abrikosov–Suhl resonance* in the spectral function, not the bulk resistivity log. The width again sets $T_K$.\n\nManoharan–Lutz–Eigler's \"quantum mirage\" (Nature 403, 512, 2000 — verify) placed a Co atom at one focus of an elliptical Cu corral and observed a phantom Kondo signal at the *empty* focus. The amplitude of the mirage probes the spatial coherence of the screening cloud over distances of order $\\xi_K = \\hbar v_F/T_K$ — a direct, if indirect, measurement of the cloud whose very existence had been disputed for two decades [2]. \"Kondo holes\" — a missing Ce in a CeCoIn$_5$ Kondo lattice imaged by STM (Hamidian/Davis circa 2011 — verify) — extend the same physics to the dense‑lattice problem, where each removed moment perturbs the heavy‑fermion coherence.\n\nAcross these landmarks the unifying logic is one prediction, one observable: $-\\ln T$ tests the log; saturation at $\\rho_0$ and $G = 2e^2/h$ tests the unitary phase shift; the Wilson ratio $R=2$ tests the Fermi‑liquid structure; the empirical $G(T/T_K)$ curve tests universality; field splitting tests the screened‑moment character; $\\sqrt{T}$ scaling tests over‑screened non‑Fermi‑liquid universality; and the mirage tests the spatial cloud. The strong‑coupling fixed point is now over‑determined by experiment — and that, not Wilson's NRG alone, is why the Kondo problem is considered solved."}, {"id": "conflations-and-the-abuse-of-kondo", "title": "What the Literature Confuses Itself About: Five Conflations and the ZBP Epidemic", "markdown": "## What the Literature Confuses Itself About: Five Conflations and the ZBP Epidemic\n\nThe Kondo problem has accumulated a vocabulary that conceals more than it reveals. Five conflations recur with such regularity in textbooks, quantum-dot papers, and review articles that they have become folklore; they should be named and untangled before any modern experimental claim is taken seriously.\n\n### Conflation 1 — Two inequivalent Kondo temperatures\n\nThe literature uses \"$T_K$\" for two objects that are not the same. The first is *perturbative*: the scale at which Kondo's third-order series [5] becomes unreliable,\n$$T_K^{\\text{pert}} \\;\\approx\\; D\\,\\exp\\!\\left(-\\frac{1}{2J\\rho}\\right),$$\nthe location where the running coupling generated by poor-man's scaling [12] crosses order unity. This is a property of one's *expansion*, not of the system. The second is *Wilsonian*: an RG-invariant crossover scale defined by a property of the exact solution — most commonly through the zero-temperature impurity susceptibility,\n$$\\chi_{\\text{imp}}(0) \\;\\equiv\\; \\frac{(g\\mu_B)^2 w}{4 T_K^{W}}, \\qquad w = 0.4128\\ldots,$$\nwith $w$ the Wilson number computed numerically in NRG [13] and recovered analytically from the Bethe ansatz [14, 15]. The two differ by an $\\mathcal{O}(1)$ multiplicative constant whose exact value depends on the chosen definition (susceptibility, specific heat, half-width of $G(T)$, the Kondo resonance FWHM). When quantum-dot papers fit $G(T)/G(0)$ to the empirical NRG curve [28] they extract $T_K^{W}$; when they then compare to a Schrieffer–Wolff-projected $J\\rho$ via the perturbative formula, they implicitly equate the two. The resulting $20$–$30\\%$ confusion in reported $T_K$ values is endemic. Hewson devotes much of his Chapter 4 to disentangling the various definitions [2]; few experimental papers cite them carefully.\n\n### Conflation 2 — The Anderson model is *not* the Kondo model away from the local-moment limit\n\nSchrieffer and Wolff showed [8] that the symmetric Anderson Hamiltonian projects onto the Kondo $s$-$d$ Hamiltonian with\n$$J \\;=\\; \\frac{2V^{2}\\,U}{|\\varepsilon_d|\\,(U-|\\varepsilon_d|)}$$\n*provided* the local-moment regime $|\\varepsilon_d|,\\,U-|\\varepsilon_d| \\gg \\pi V^{2}\\rho \\equiv \\Delta$ is realised, so that charge fluctuations on the impurity are gapped out. Outside that window — for mixed-valent dots tuned near a charge-degeneracy point, asymmetric dots with $|\\varepsilon_d|\\ll U$, or molecular junctions in narrow-band hosts — the Anderson model retains a finite renormalised hybridisation and dynamical charge degrees of freedom that the spin-only Kondo Hamiltonian cannot encode. The universal $G(T/T_K)$ scaling curve, derived for the $S=1/2$ Kondo fixed point [16, 13], does not strictly apply in this regime; mixed-valent dots cross over to a different (non-universal) profile [18, 19, 29], a fact regularly elided in quantum-dot fits. Calling something a \"Kondo dot\" when $V^{2}\\rho$ is comparable to $|\\varepsilon_d|$ is, at best, a shorthand.\n\n### Conflation 3 — $\\ln(D/T)$ is not a divergence in any observable\n\nThe logarithm appearing in Kondo's third-order resistivity [5],\n$$\\rho_{\\text{imp}}(T) \\;\\simeq\\; \\rho_0\\Big[1 - 4 J\\rho\\,\\ln(D/T) + \\mathcal{O}(J^{2}\\rho^{2})\\Big],$$\nis repeatedly described as an \"infrared divergence\" or a \"catastrophe.\" It is neither. The exact impurity resistivity is finite at all temperatures, monotonically interpolating between $\\rho_{\\text{imp}}(T \\gg T_K)$ — where the perturbative log is a good approximation — and the unitary-limit residual resistivity $\\rho_{\\text{imp}}(0) = (2/\\pi)\\,n_i / (n e^{2} \\tau_0)$ set by $\\pi/2$ scattering at the Fermi-liquid fixed point [16, 13]. The logarithm is a diagnostic that the *expansion variable* $J\\rho\\ln(D/T)$ has gone to unity, not a statement about the system. Calling $T_K$ a \"singularity\" is a category error that should be flagged whenever it appears: it is a crossover scale of an analytic crossover, not a phase transition. Wilson's NRG flow [13], Nozières's Fermi-liquid expansion [16], and the Bethe-ansatz free energy [14, 15] all confirm this analyticity explicitly.\n\n### Conflation 4 — The screening singlet is not a \"spin fluctuation\"\n\nMean-field treatments that replace $\\langle S^{z}_{\\text{imp}}\\rangle$ by a self-consistent classical field — fluctuating Weiss-style — miss the Kondo ground state entirely. The actual state at $T \\ll T_K$ is a many-body singlet of the impurity spin entangled with a conduction-electron screening cloud of spatial extent\n$$\\xi_K \\;=\\; \\hbar v_F / T_K,$$\nexhibiting a *finite* impurity susceptibility $\\chi_{\\text{imp}}(0)$ and a *finite* linear specific-heat coefficient $\\gamma_{\\text{imp}}$ whose ratio defines the Wilson ratio $R = 2$ [16, 13]. There is no order parameter, no symmetry breaking, and crucially no fluctuating local moment that survives below $T_K$. \"Spin-fluctuation\" language carried over from itinerant-magnet contexts predicts the wrong Wilson ratio (it gives $R$ near unity), the wrong low-$T$ resistivity coefficient, and a non-existent crossover from quantum to thermal regimes. Folklore tolerates the phrase; pedagogy should not.\n\n### Conflation 5 — A zero-bias peak is not a Kondo effect\n\nThe most consequential conflation of the modern era. Since the quantum-dot revival [28, 27], an extensive industry has interpreted any zero-bias conductance peak (ZBP) in a small device as a Kondo resonance. A peak at $V=0$ is necessary but vastly insufficient. The following five-point checklist, distilled from [18, 19, 29, 2], is what a genuine identification requires.\n\n1. **Established local moment.** The dot must occupy a Coulomb-blockade valley with odd electron number, with the $S = 1/2$ plateau visible in the charging diagram. Without this, charge-Kondo, two-level systems, and Fano resonances can mimic the lineshape.\n\n2. **Universal scaling collapse.** Conductance data taken at multiple temperatures must collapse onto the empirical NRG curve [13, 28],\n$$\\frac{G(T)}{G(0)} \\;=\\; \\left[1 + (2^{1/s}-1)\\left(\\frac{T}{T_K^{W}}\\right)^{2}\\right]^{-s},\\qquad s \\approx 0.22,$$\nover at least a decade in $T/T_K^{W}$. A single-temperature fit proves nothing — it always succeeds.\n\n3. **Zeeman splitting.** An applied field must split the ZBP linearly into two satellites at $eV = \\pm g\\mu_B B$, i.e. with total splitting\n$$\\Delta E \\;=\\; 2 g\\mu_B B$$\nfor $B \\gtrsim T_K/g\\mu_B$, with $g$ matching the independently measured dot $g$-factor [18, 29]. A field-insensitive ZBP is not Kondo.\n\n4. **Unitary-limit approach.** As $T \\to 0$ the linear conductance in the symmetric single-channel geometry must approach $G_0 = 2 e^{2}/h$, i.e. saturate at $\\delta = \\pi/2$ phase shift [16, 28]. Falling well short is consistent with asymmetric coupling, multichannel screening, or simply not being Kondo.\n\n5. **Fermi-liquid ratio.** The leading low-energy corrections must satisfy Nozières's identities [16, 20]. With $G(T,V)/G_0 = 1 - \\alpha\\,(T/T_K)^{2} - \\beta\\,(eV/T_K)^{2} + \\cdots$ in the particle–hole-symmetric single-channel case, the universal ratio is\n$$\\frac{\\alpha}{\\beta} \\;=\\; \\frac{\\pi^{2}}{3},$$\nrecast as $\\alpha/\\beta = \\pi^{2}/[3(g\\mu_B)^{2}]$ when the bias scale is referred to the equivalent Zeeman energy, with channel- and asymmetry-dependent corrections computable from the exact solution [20, 2]. Mixed-valent dots violate this; two-channel candidates have a different ratio entirely.\n\nA device that satisfies (1)–(5) is Kondo. A device that satisfies only (1) and shows a peak is a dot with a peak. The literature's habit of reporting (2)–(5) as occasional bonuses, rather than as requirements, is the engine of the ZBP epidemic — and the reason any modern claim of \"Kondo physics\" in a new platform deserves to be read with the checklist in hand."}, {"id": "signatures-and-quantitative-tests", "title": "Signatures: What T_K, R, and the Universal Curve Actually Pin Down", "markdown": "## Signatures: What T_K, R, and the Universal Curve Actually Pin Down\n\nA measurement labelled \"Kondo\" is, in practice, an attempt to fit data onto one of a small set of universal functions whose shape is fixed once $T_K$ is chosen and whose amplitudes are constrained by Fermi-liquid identities. The literature treats these signatures as a menu from which any single item suffices for identification; the historical record (and any honest read of the NRG output [13], the Bethe-ansatz thermodynamics [14, 15], and the local Fermi-liquid algebra [16]) says the opposite — each observable pins down a different combination of parameters, each has a narrow regime of strict validity, and the consistency relations between them are what actually distinguish Kondo physics from a coincidence.\n\n### The thermodynamic anchors: $\\chi_{\\rm imp}(T)$, $C_{\\rm imp}(T)/T$, and the Wilson ratio\n\nThe first and least ambiguous signature is the impurity susceptibility. Wilson's NRG [13] established that for the symmetric, single-channel, spin-$\\tfrac{1}{2}$ Kondo model the dimensionless combination $T\\chi_{\\rm imp}(T)/(g\\mu_B)^2$ is a universal function of $T/T_K$, monotonically decreasing from the free-moment Curie value $\\tfrac{1}{4}$ at $T\\gg T_K$ to a finite value at $T=0$. Wilson exploited this universality to *define* the Kondo temperature operationally:\n\n$$\\chi_{\\rm imp}(T=0) \\;=\\; \\frac{(g\\mu_B)^2\\,W}{4 k_B T_K^{\\rm W}},\\qquad W = 0.4128\\ldots$$\n\nwith the Wilson number $W$ fixed by the Bethe-ansatz analytic continuation [14, 15]. Any other scale called $T_K$ — for instance the perturbative $T_K^{\\rm pert} \\sim D\\, e^{-1/2J\\rho}$ at which Kondo's logarithm [5] formally blows up — differs from $T_K^{\\rm W}$ by a multiplicative $\\mathcal{O}(1)$ constant whose value depends on the bandwidth cutoff scheme. This is the source of the 20–30% scatter in \"extracted $T_K$\" values across quantum-dot papers.\n\nThe impurity specific heat $C_{\\rm imp}(T)$ is the second anchor. The universal curve $C_{\\rm imp}/T$ exhibits a broad maximum at $T \\approx 0.6\\,T_K^{\\rm W}$ and a linear-in-$T$ tail at low temperature with slope\n\n$$\\gamma_{\\rm imp} \\;\\equiv\\; \\lim_{T\\to 0} \\frac{C_{\\rm imp}}{T} \\;=\\; \\frac{\\pi^2}{3}\\,\\frac{W}{T_K^{\\rm W}}\\cdot\\frac{2}{\\pi}$$\n\n(Hewson [2], Ch. 4–5). The combination of $\\chi_{\\rm imp}(0)$ and $\\gamma_{\\rm imp}$ defines the Wilson ratio\n\n$$R \\;\\equiv\\; \\frac{4\\pi^2 k_B^2}{3(g\\mu_B)^2}\\,\\frac{\\chi_{\\rm imp}}{\\gamma_{\\rm imp}} \\;=\\; 2,$$\n\na parameter-free prediction for the symmetric single-channel $S=\\tfrac{1}{2}$ case, derivable from Nozières's Fermi-liquid phenomenology [16] before any NRG number is computed. $R=2$ is what makes a Kondo identification falsifiable; \"consistent with Kondo\" on the strength of $\\chi_{\\rm imp}$ alone is not.\n\n### The conductance curve $G(T/T_K)$ and the Goldhaber-Gordon fit\n\nFor a symmetric, single-orbital quantum dot in the Kondo regime, the linear conductance has the dual signature: it *grows* logarithmically as the temperature is lowered through $T_K$ and saturates at the unitary limit\n\n$$G(T=0) \\;=\\; \\frac{2e^2}{h}\\,\\sin^2(\\pi n_d/2) \\;\\xrightarrow{\\,n_d \\to 1\\,}\\; \\frac{2e^2}{h},$$\n\nthe second equality following from the Friedel sum rule and the phase shift $\\delta = \\pi/2$ that Nozières [16] identified with the strong-coupling fixed point. The Goldhaber-Gordon group [28] introduced the empirical form\n\n$$\\frac{G(T)}{G_0} \\;=\\; \\left[1 + \\bigl(2^{1/s}-1\\bigr)(T/T_K)^2\\right]^{-s},\\qquad s = 0.22$$\n\nwhich collapses NRG output to better than a few percent across two decades in $T/T_K$. Universal collapse of $G(T)$ data from physically different dots onto this single curve — not merely a fit, but a *collapse* — is the cleanest experimental Kondo signature. The 1998 SET observation [28] was decisive partly because the curve worked.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eUniversal Kondo conductance and its breakdowns\u003c/title\u003e\u003cline x1=\"80\" y1=\"320\" x2=\"680\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"80\" y1=\"320\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"80\" y1=\"70\" x2=\"680\" y2=\"70\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"3,4\"/\u003e\u003cline x1=\"80\" y1=\"195\" x2=\"680\" y2=\"195\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"3,4\"/\u003e\u003cline x1=\"380\" y1=\"320\" x2=\"380\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"3,4\"/\u003e\u003ctext x=\"74\" y=\"74\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e1 (2e²/h)\u003c/text\u003e\u003ctext x=\"74\" y=\"199\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e½\u003c/text\u003e\u003ctext x=\"74\" y=\"324\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"80\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10⁻²\u003c/text\u003e\u003ctext x=\"230\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10⁻¹\u003c/text\u003e\u003ctext x=\"380\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1\u003c/text\u003e\u003ctext x=\"530\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10¹\u003c/text\u003e\u003ctext x=\"680\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10²\u003c/text\u003e\u003ctext x=\"380\" y=\"375\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eT / T_K (log scale)\u003c/text\u003e\u003ctext x=\"30\" y=\"180\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 30 180)\"\u003eG / (2e²/h)\u003c/text\u003e\u003cpolyline points=\"80,71 155,71 200,72 230,73 280,79 305,89 340,135 380,195 420,243 455,275 495,295 530,304 580,311 630,315 680,317\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.2\"/\u003e\u003cpolyline points=\"80,182 155,184 200,188 230,193 280,210 305,222 340,250 380,278 420,295 455,304 495,310 530,313 580,316 630,318 680,319\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/\u003e\u003cpolyline points=\"80,71 155,71 200,71.4 230,72.5 280,76 305,80\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"155\" y=\"60\" fill=\"#7ee0a3\" font-size=\"13\"\u003eFermi liquid: 1 − c_T (πT/T_K)²\u003c/text\u003e\u003ctext x=\"305\" y=\"135\" fill=\"#7aa2ff\" font-size=\"13\"\u003esingle-channel S=½\u003c/text\u003e\u003ctext x=\"305\" y=\"151\" fill=\"#7aa2ff\" font-size=\"13\"\u003e(Goldhaber-Gordon fit, s=0.22)\u003c/text\u003e\u003ctext x=\"180\" y=\"172\" fill=\"#ff7a90\" font-size=\"13\"\u003e2-channel: G → ½ G₀, ΔG ∝ √T\u003c/text\u003e\u003ctext x=\"495\" y=\"270\" fill=\"#ffb86b\" font-size=\"13\"\u003eweak-coupling tail\u003c/text\u003e\u003ctext x=\"495\" y=\"286\" fill=\"#ffb86b\" font-size=\"13\"\u003e∼ 1/ln²(T/T_K)\u003c/text\u003e\u003cpolyline points=\"455,275 480,272\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"384\" y=\"55\" fill=\"#e8e6e1\" font-size=\"13\"\u003eT_K (Wilson)\u003c/text\u003e\u003c/svg\u003e\n*Figure: universal conductance $G(T/T_K)$ for the symmetric single-channel $S=\\tfrac{1}{2}$ Kondo dot (blue, Goldhaber-Gordon empirical form [28] with $s=0.22$), its low-$T$ Fermi-liquid tail (green), and the two-channel overscreened curve (red dashed) that saturates at $\\tfrac{1}{2}G_0$ with a $\\sqrt{T}$ approach — non-Fermi-liquid, and the diagnostic that 2CK requires.*\n\n### Magnetic field: Zeeman splitting of the zero-bias peak\n\nA correctly identified Kondo resonance splits under an applied field. NRG [13] and FL theory [16] both predict that for $g\\mu_B B \\gtrsim 0.5\\,k_B T_K$ the zero-bias peak in $dI/dV$ separates into two satellites at $eV_{\\rm peak} = \\pm g\\mu_B B$ asymptotically, with logarithmic corrections at intermediate fields that have been computed by Rosch *et al.* [24]. Below this threshold the peak merely broadens; the splitting is invisible. A single Lorentzian at $V=0$ that fails to split under a Zeeman field of magnitude $\\sim T_K/\\mu_B$ is, by this test, not Kondo.\n\n### Fermi-liquid coefficients: $T^2$, $V^2$, $B^2$\n\nNozières's local Fermi liquid [16] dictates that for $T,\\,eV,\\,g\\mu_B B \\ll k_B T_K$ the conductance expansion is\n\n$$\\frac{G(T,V,B)}{G_0} \\;=\\; 1 \\;-\\; c_T\\!\\left(\\frac{\\pi k_B T}{k_B T_K}\\right)^2 \\;-\\; c_V\\!\\left(\\frac{eV}{k_B T_K}\\right)^2 \\;-\\; c_B\\!\\left(\\frac{g\\mu_B B}{k_B T_K}\\right)^2 \\;+\\;\\cdots$$\n\nwith the coefficients tied by universal ratios that Oguri's nonequilibrium FL treatment [20] worked out explicitly. For the
