 particle-hole symmetric SU(2) $S=\\tfrac{1}{2}$ case the celebrated identity is\n\n$$\\frac{c_V}{c_T} \\;=\\; \\frac{3}{2}\\quad\\text{(particle-hole symmetric, single-channel)},$$\n\nindependent of the microscopic $J$ and the specific definition of $T_K$ provided the same $T_K$ enters both terms. Away from particle-hole symmetry the ratio shifts and acquires an asymmetry coefficient proportional to the dot occupancy [20, 18]. Measuring all three coefficients and checking the ratio — not just fitting one of them — is what distinguishes a Kondo Fermi liquid from any other resonance whose width happens to be $\\sim T_K$.\n\n### Where the menu breaks\n\nEach of the above signatures has assumptions that vanish under mild perturbations.\n\n**Mixed valence.** When $|\\varepsilon_d|, U-|\\varepsilon_d| \\sim V^2\\rho$, the Schrieffer-Wolff projection [8] fails: charge fluctuations are not integrated out, the local moment is partially formed, and $\\chi_{\\rm imp}(0)$ no longer maps cleanly onto a $1/T_K$. The Wilson ratio interpolates from $R = 2$ (deep Kondo) toward $R = 1$ (empty/full orbital) [2]; the $G(T/T_K)$ collapse is not universal but acquires a non-universal correction set by the dimensionless mixed-valence parameter $\\Delta/|\\varepsilon_d|$.\n\n**Multichannel overscreening.** Nozières and Blandin's two-channel $S=\\tfrac{1}{2}$ generalisation flows to a non-Fermi-liquid fixed point: $\\chi_{\\rm imp}(T) \\sim \\ln(T_K/T)$, $C_{\\rm imp}/T \\sim \\ln(T_K/T)$, a residual entropy $\\tfrac{1}{2}\\ln 2$, conductance saturating at $\\tfrac{1}{2} G_0$ with $\\Delta G \\sim \\sqrt{T/T_K}$, and a modified Wilson ratio. The very existence of a $T^2$ regime would falsify a 2CK identification.\n\n**Higher spin.** For impurity spin $S \\geq 1$ the underscreened model ($k \u003c 2S$) flows to a singular Fermi liquid with logarithmic corrections to $\\chi_{\\rm imp}$ and $G(T)$, and the Friedel phase shift is no longer $\\pi/2$ per channel. Universal $G(T/T_K)$ collapse onto the $s=0.22$ form fails by construction.\n\n**Non-equilibrium decoherence.** At $eV \\gtrsim k_B T_K$ the perturbative renormalisation group of Rosch–Paaske–Kroha–Wölfle [24] takes over: the running coupling is cut off by current-induced decoherence rather than by temperature, and the conductance peak narrows non-thermally. The Fermi-liquid $V^2$ law applies only inside $eV \\ll k_B T_K$, a regime that in many SET measurements covers less than half a decade.\n\nThe working physicist's checklist, then, is not \"did I see a zero-bias peak\" but: a universal-curve collapse of $\\chi_{\\rm imp}$ or $G(T)$ over at least a decade in $T/T_K$, a Wilson ratio compatible with $2$, a Zeeman splitting at $g\\mu_B B$, and three Fermi-liquid coefficients whose ratios match Oguri's identities [20]. Anything short of two of these is suggestive; anything short of one is folklore."}, {"id": "frontier-and-open-problems", "title": "Frontier: Multichannel, Heavy Fermions, Topological Kondo, and the SYK Cousin", "markdown": "## Frontier: Multichannel, Heavy Fermions, Topological Kondo, and the SYK Cousin\n\nThe single-channel spin-½ Kondo problem is, in the strict technical sense, *closed*: Wilson [13], Nozières [16], and the Andrei–Wiegmann Bethe ansatz [14, 15] pin the entire crossover, and the screening cloud — long the one dangling experimental thread — was finally imaged in 2020. Everything still alive on the Kondo frontier in 2026 is a deformation of that fixed point: more channels, more impurities, a non-Fermi-sea host, a topological boundary, or a holographic dual. The first task in this section is to separate what is rigorously established from what survives only as scaling-hypothesis extrapolation.\n\n### Overscreened multichannel Kondo and the Affleck–Ludwig CFT\n\nNozières and Blandin (1980) (verify) generalised the problem to $k$ identical conduction-channel flavours coupled to an impurity spin $S$. The strong-coupling fixed point depends on the sign of $k - 2S$: fully compensated ($k=2S$) reproduces the local Fermi liquid; underscreened ($k\u003c2S$) leaves a residual spin and a singular susceptibility; *overscreened* ($k\u003e2S$) is the interesting case — the flow runs to an *intermediate-coupling* fixed point with non-Fermi-liquid signatures.\n\nFor $k=2,\\,S=1/2$ the spectrum was recognised analytically by Affleck and Ludwig (1991–1994) (verify) as the boundary fixed point of an SU(2)$_k$ Wess–Zumino–Witten conformal field theory. The CFT machinery gives, without further input,\n\n$$\\chi_{\\rm imp}(T) \\sim \\frac{1}{T_K}\\ln(T_K/T),\\qquad C_{\\rm imp}(T)/T \\sim \\ln(T_K/T),\\qquad S_{\\rm imp}(T\\!\\to\\!0) = \\tfrac{1}{2}\\ln 2,$$\n\nwith the residual entropy $\\tfrac12\\ln 2$ encoding a non-integer quantum dimension $\\sqrt 2$. The Wilson ratio is no longer 2, and unitary scattering is replaced by a universal half-transmission. This is rigorous CFT, not extrapolation — but its laboratory realisation required twenty-five years. The two-channel spin Kondo proved exquisitely sensitive to channel asymmetry; the breakthrough came in the *charge*-Kondo realisation by Iftikhar, Anthore, Mitchell, *et al.*, with a quantum-Hall edge-mode quantum dot tuned to $k=2$ ([Nature 526, 233 (2015)](https://www.nature.com/articles/nature15384)) and then $k=3$ ([Science 360, 1315 (2018)](https://www.science.org/doi/10.1126/science.aan5592)), where the conductance flow collapsed onto the predicted SU(2)$_3$ non-Fermi-liquid curves. The CFT verdict here is solid; the analogous spin-Kondo realisation in standard quantum dots remains elusive.\n\n### Kondo lattices, Doniach, and the heavy-fermion coherence problem\n\nWhen the impurities form a dense periodic array, the conduction sea cannot simultaneously screen every spin and mediate RKKY exchange between them. Doniach's 1977 argument compared the two scales, $T_{\\rm RKKY} \\sim J^2\\rho$ and $T_K \\sim D\\,e^{-1/J\\rho}$, and predicted a quantum critical point at the coupling where the two cross — antiferromagnet on the weak-coupling side, *heavy* paramagnet on the strong-coupling side, with $m^*/m_e \\sim 10^2$–$10^3$ for Ce-, Yb-, U- based intermetallics ([Coleman, arXiv:cond-mat/0612006](https://arxiv.org/abs/cond-mat/0612006)). The microscopic mechanism in the heavy phase is collective Kondo screening which *enlarges* the Fermi surface to include the $f$-electrons (large-FS Luttinger count), as opposed to the small Fermi surface that obtains on the magnetic side.\n\nWhat remains open is the nature of the transition itself. The conventional Hertz–Millis–Moriya scenario treats the antiferromagnet as a spin-density-wave instability of the heavy quasiparticles; the Kondo-breakdown scenario (Si, Senthil, Coleman, Pépin) instead has the Kondo entanglement collapse *at* the QCP, with the Fermi surface discontinuously jumping from large to small. The two predict different scaling exponents and different evolution of $\\rho_{xy}$ across the QCP, and the experimental record on YbRh$_2$Si$_2$, CeRhIn$_5$, and related materials is still genuinely disputed. The Doniach diagram is a useful sketch; quantitative theory at the QCP rests on extrapolation rather than controlled computation.\n\n### Pseudogap and topological hosts\n\nReplacing the constant Fermi-level density of states $\\rho(0)$ by $\\rho(\\varepsilon)\\sim|\\varepsilon|^r$ destroys the BCS-like exponential scale. Withoff and Fradkin (1990) (verify) showed that pseudogapped Kondo flows to weak coupling for $J\u003cJ_c$ — screening simply fails — with a critical fixed point at $J_c$ that is itself non-Fermi-liquid. Graphene ($r=1$), $d$-wave superconductors ($r=1$), and 3D Dirac/Weyl nodes ($r=2$) all instantiate the problem; the structure is reviewed in [30] and the surrounding pseudogap-Kondo literature.\n\nTopological insulator surfaces, with their helical Dirac dispersion plus broken spin-SU(2), give an *anisotropic* pseudogap Kondo problem; spin–momentum locking pins the screening cloud's spin texture and modifies the impurity susceptibility. The harder cousin is the topological Kondo *insulator* (Dzero–Sun–Galitski–Coleman 2010 (verify)), where lattice coherence opens a hybridisation gap with non-trivial $\\mathbb{Z}_2$ index — SmB$_6$ being the candidate that has carried the bulk of the experimental controversy.\n\nA genuinely new structure is the Béri–Cooper *topological* Kondo effect (2012) (verify): $M$ semi-infinite leads connected to a Coulomb-blockaded superconducting island hosting Majorana zero modes realise an SO($M$) Kondo model whose strong-coupling fixed point has *fractional* residual entropy and topologically protected non-Fermi-liquid exponents — the impurity \"spin\" is the Majorana parity operator. The symplectic generalisation pushed further by [25] organises a whole family of Lie-algebraic Kondo problems indexed by $\\mathfrak{so}, \\mathfrak{sp}, \\mathfrak{su}$ — the ABCD classification surveyed in [31]. The CFT statements are clean; the experimental realisation requires a Majorana platform that itself remains contested, so the \"topological Kondo\" label currently rests on theoretical solidity plus experimental aspiration. QCD analogues — Kondo physics in dense quark matter and charm/bottom nuclei [32, 33] — are mathematically the same fixed-point structure with isospin replacing electronic spin; they are theoretical exercises, not measurements.\n\n### SYK as a strong-coupling cousin\n\nThe Sachdev–Ye–Kitaev model — $N$ Majorana fermions with all-to-all random four-fermion couplings — develops an emergent conformal symmetry in the IR with Green's function $G(\\tau)\\sim |\\tau|^{-1/2}$, saturates the chaos bound, and admits a Schwarzian-mode dual to Jackiw–Teitelboim gravity on AdS$_2$ ([JHEP 07 (2016) 007](https://link.springer.com/article/10.1007/JHEP07(2016)007)). The relevance to Kondo is structural: SYK realises in closed form what the multichannel Kondo fixed point realises with one impurity site — a strongly coupled, non-Fermi-liquid, conformally invariant IR with calculable anomalous dimensions. Hybrid SYK–Fermi-liquid lead models behave as a controlled non-Fermi-liquid \"impurity\" coupled to a clean bath; the Kondo–holography programme (Erdmenger, O'Bannon, *et al.*) (verify) builds AdS$_2$ probe-brane duals of the single-channel and two-channel Kondo problems, recovering the universal crossover from a gravity calculation. As of 2026, holographic Kondo is a *consistency check* on the CFT picture, not an independent prediction; it has yet to compute something that NRG cannot.\n\n### The screening cloud, finally seen\n\nThe half-century-old prediction $\\xi_K = \\hbar v_F/T_K$ — micrometres for typical dot $T_K$ — was directly measured by Borzenets *et al.* using a quantum dot threaded into a Fabry–Pérot-style 1D channel: the conductance through the screened impurity oscillated with the cavity length on the scale $\\xi_K$, and the universal collapse against $L/\\xi_K$ matched NRG within experimental error ([Nature 579, 210 (2020)](https://www.nature.com/articles/s41586-020-2058-6)). The cloud is no longer a theoretical inference — it is a measured length. This is the cleanest piece of solid ground on the entire post-1998 frontier.\n\n### What rests on what\n\nSolid: the single-channel Fermi-liquid fixed point [16, 13, 14]; the Affleck–Ludwig CFT of overscreened fixed points; the three-channel charge-Kondo realisation; the screening-cloud measurement; the Schrieffer–Wolff mapping in its proper regime [8]. Scaling-hypothesis extrapolation: Doniach's QCP scenario, Kondo-breakdown vs Hertz–Millis at the heavy-fermion QCP, the entire topological-Kondo experimental programme, and Kondo holography as a predictive (rather than illustrative) tool. The Kondo problem, sixty years after [5], still produces well-posed questions whose answers are not yet in.\n\nSources:\n- [Borzenets et al., *Observation of the Kondo screening cloud*, Nature 579, 210 (2020)](https://www.nature.com/articles/s41586-020-2058-6)\n- [Iftikhar et al., *Tunable quantum criticality and super-ballistic transport in a \"charge\" Kondo circuit*, Science 360, 1315 (2018)](https://www.science.org/doi/10.1126/science.aan5592)\n- [Iftikhar et al., *Two-channel Kondo effect and renormalization flow with macroscopic quantum charge states*, Nature 526, 233 (2015)](https://www.nature.com/articles/nature15384)\n- [Coleman, *Heavy Fermions: electrons at the edge of magnetism*, arXiv:cond-mat/0612006](https://arxiv.org/abs/cond-mat/0612006)\n- [Jevicki, Suzuki, Yoon, *Bi-local holography in the SYK model*, JHEP 07 (2016) 007](https://link.springer.com/article/10.1007/JHEP07(2016)007)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nThe single-channel spin-½ Kondo problem is one of the few non-trivial many-body problems in condensed matter that I regard as *closed* in the strict sense: the thermodynamics is known analytically (Andrei [14], Wiegmann [15]); the crossover is known numerically to arbitrary precision (Wilson [13]); the low-$T$ fixed point is known structurally from a one-parameter Fermi liquid (Nozières [16]); and the universal scaling function $G(T/T_K)$, $\\chi_{\\rm imp}(T/T_K)$, $C_{\\rm imp}(T/T_K)$ collapses experimental data from Cu–Mn alloys, semiconductor dots, and single-molecule junctions onto the same curve. The Wilson ratio $R = 2$, the unitary conductance $2e^2/h$, and the Friedel sum-rule phase shift $\\delta = \\pi/2$ at particle–hole symmetry I would defend without qualification. That a *third-order* perturbative logarithm in an apparently innocuous exchange Hamiltonian forced the invention of the numerical RG remains, for my money, the most consequential pedagogical episode in 20th-century many-body theory.\n\nWhat is shakier than the literature admits is almost everything *around* that core. Three specific assumptions get smuggled in:\n\n1. **\"$T_K$ is a property of the sample.\"** It is a property of a *model fit*. The perturbative $T_K^{\\rm pert} \\approx D\\,e^{-1/2J\\rho}$ and Wilson's $T_K^W$ defined through $\\chi_{\\rm imp}(0) = (g\\mu_B)^2/(4 T_K)$ disagree by O(1) factors that propagate into the 20–30% scatter one sees in quantum-dot $T_K$ values quoted across groups. The \"measured $T_K$\" in a quantum-dot paper without a stated definition is closer to a vibe than a number.\n2. **\"Universal $G(T/T_K)$ applies to the dot in front of me.\"** It applies to the symmetric single-channel Kondo Hamiltonian. Mixed-valent dots, asymmetric leads, finite bandwidth $D \\not\\gg U$, weak Zeeman fields, and finite source–drain bias each violate the conditions under which Costi–Hewson–Zlatić's NRG curve was generated. The collapse one sees in published figures is often achieved by treating $T_K$ as a *fit parameter per trace*, which is not a test of universality.\n3. **\"Bethe ansatz solved the Kondo model.\"** It solved a *linearised, infinite-bandwidth, particle–hole-symmetric* version of it. Dynamical correlators (the spectral function $A(\\omega)$ at finite $\\omega$, the non-equilibrium current at finite $V$) are not delivered by Andrei–Wiegmann — they are delivered by NRG, fRG, and tDMRG, with their own systematic errors.\n\n### Three open questions I would actually work on\n\n1. **Non-equilibrium decoherence of the Kondo singlet at finite bias.** The crossover from coherent screening to bias-induced spin decoherence at $eV \\sim T_K$ is the cleanest place to test whether the Fermi-liquid fixed point survives an explicit time-translation-symmetry breaking — and the experimental handle (split ZBP, shot noise $F$-factor) exists.\n2. **Two-channel Kondo in real devices, with the channel asymmetry as the relevant perturbation.** Potok–Goldhaber-Gordon's realisation [114(verify)] showed the non-Fermi-liquid fixed point is reachable; the open question is whether its $\\sqrt{T}$ universality survives at amplitudes large enough to be useful — i.e., whether 2CK is a *physical* fixed point or a fine-tuned one.\n3. **The SYK–Kondo bridge.** SYK is a $q$-body random-coupling problem with a conformal IR; Kondo is a 4-body single-impurity problem with a Fermi-liquid IR. The shared feature — a marginal coupling driving the system to a strong-coupling fixed point governed by emergent reparametrisation modes — deserves a sharper statement than the analogies currently in circulation.\n\n**Reading path:**\n\n1. de Haas, de Boer, van den Berg (1934) — read the original resistance minimum data, with J. de Boer's name restored, before any theory.\n2. Kondo (1964) [5] — eight pages, one diagram, one logarithm; the entire problem is visible.\n3. Anderson (1970) \"Poor man's scaling\" [8] — the scaling idea in its cleanest form, prior to Wilson's machinery.\n4. Nozières (1974) [16] — the Fermi-liquid fixed point reconstructed from three phenomenological parameters; the most underrated paper in the chain.\n5. Wilson (1975) [13] — the NRG construction itself; read last, because only then do you appreciate what it had to do."}], "references": [{"n": 1, "title": "The electrical resistance of gold, copper and lead at low temperatures", "authors": ["W. J. de Haas", "J. de Boer", "G. J. van den Berg"], "year": 1934, "venue": "Physica 1, 1115", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "The Kondo Problem to Heavy Fermions", "authors": ["A. C. Hewson"], "year": 1993, "venue": "Cambridge University Press", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Anomalous electrical resistivity and magnetoresistance due to an s-d interaction in Cu-Mn alloys", "authors": ["Kei Yosida"], "year": 1957, "venue": "Physical Review 107, 396", "url": "https://doi.org/10.1103/PhysRev.107.396", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Resistivity of Mo-Nb and Mo-Re Alloys Containing 1% Fe", "authors": ["Myriam P. Sarachik", "E. Corenzwit", "B. T. Matthias"], "year": 1964, "venue": "Physical Review 135, A1041", "url": "https://doi.org/10. R. Hamann"], "year": 1970, "venue": "Physical Review B 1, 4464", "url": "https://doi.org/10.1103/PhysRevB.1.4464", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "The renormalization group: Critical phenomena and the Kondo problem", "authors": ["Kenneth G. Wilson"], "year": 1975, "venue": "Reviews of Modern Physics 47, 773", "url": "https://doi.org/10.1103/RevModPhys.47.773", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Diagonalization of the Kondo Hamiltonian", "authors": ["Natan Andrei"], "year": 1980, "venue": "Physical Review Letters 45, 379", "url": "https://doi.org/10.1103/PhysRevLett.45.379", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Exact solution of s-d exchange model at T = 0", "authors": ["P. B. Wiegmann"], "year": 1980, "venue": "JETP Letters 31, 392", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "A 'Fermi-liquid' description of the Kondo problem at low temperatures", "authors": ["Philippe Nozières"], "year": 1974, "venue": "Journal of Low Temperature Physics 17, 31", "url": "https://doi.org/10.1007/BF00654541", "cited_by": null, "bucket": "archive"}, {"n": 17, "title": "The Renormalization Group and Critical Phenomena (Nobel Lecture)", "authors": ["Kenneth G. Wilson"], "year": 1982, "venue": "Nobel Foundation", "url": "https://www.nobelprize.org/prizes/physics/1982/wilson/lecture/", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "Kondo Effect in Mesoscopic Quantum Dots", "authors": ["M. Grobis", "I. G. Rau", "R. M. Potok", "D. Goldhaber-Gordon"], "year": 2006, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0611480v1", "cited_by": null, "bucket": "arXiv"}, {"n": 19, "title": "Kondo effect in nanostructures", "authors": ["M. Pustilnik"], "year": 2005, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0512671v2", "cited_by": null, "bucket": "arXiv"}, {"n": 20, "title": "Fermi liquid theory for the nonequilibrium Kondo effect at low bias voltages", "authors": ["Akira Oguri"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0412220v2", "cited_by": null, "bucket": "arXiv"}, {"n": 21, "title": "From Kondo Effect to Fermi Liquid", "authors": ["Hiroshi Kontani", "Kosaku Yamada"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0409565v1", "cited_by": null, "bucket": "arXiv"}, {"n": 22, "title": "Disorder-quenched Kondo effect in mesosocopic electronic systems", "authors": ["Stefan Kettemann", "Eduardo R. Mucciolo"], "year": 2006, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0609279v3", "cited_by": null, "bucket": "arXiv"}, {"n": 23, "title": "Theory of Crystalline Electric Field and Kondo Effect in Pr Skutterudites", "authors": ["Junya Otsuki", "Hiroaki Kusunose", "Yoshio Kuramoto"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0410461v1", "cited_by": null, "bucket": "arXiv"}, {"n": 24, "title": "The Kondo Effect in Non-Equilibrium Quantum Dots: Perturbative Renormalization Group", "authors": ["A. Rosch", "J. Paaske", "J. Kroha", "P. Wölfle"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0408506v2", "cited_by": null, "bucket": "arXiv"}, {"n": 25, "title": "Topological symplectic Kondo effect", "authors": ["Guangjie Li", "Elio J. König", "Jukka I. Väyrynen"], "year": 2022, "venue": "arXiv", "url": "http://arxiv.org/abs/2210.16614v2", "cited_by": null, "bucket": "arXiv"}, {"n": 26, "title": "Cavity-enhanced Kondo effect", "authors": ["Jun Mochida", "Yuto Ashida"], "year": 2024, "venue": "arXiv", "url": "http://arxiv.org/abs/2404.14148v1", "cited_by": null, "bucket": "arXiv"}, {"n": 27, "title": "Resonant Kondo transparency of a barrier with quasilocal impurity states", "authors": ["L. I. Glazman", "M. É. Raikh"], "year": 1988, "venue": "JETP Letters 47, 452", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 28, "title": "Kondo effect in a single-electron transistor", "authors": ["D. Goldhaber-Gordon", "H. Shtrikman", " <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+
      '</div><div class="thint">drag or scroll through time →</div></section>';

  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+

  }

    langHtml='<section class="block" id="blk-language"><h3>Watch your language</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></section>';
  }

    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* references (kept at the end) */
  var refsHtml='';
  if(D.references&&D.references.length){
    refsHtml='<div class="block" id="blk-refs"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
