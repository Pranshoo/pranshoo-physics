hy is the right field-theoretic language [-], and Sudarshan's diagonal-$P$ representation is mathematically equivalent on the operator level; the 2005 Nobel citation is, on the technical merits, half-right. The Jennison–Das Gupta 1953 Cyg A measurement is the first working intensity interferometer and the anglophone literature still under-cites it. None of this is controversial inside the community that knows the primary sources; it is controversial only because the textbook caricature has displaced them.\n\n### (b) What is shakier than the literature admits\n\nThree specific load-bearing assumptions are routinely silent.\n\nFirst, almost every \"$g^{(2)}(0)\u003c0.5$, therefore single-photon source\" claim assumes (i) stationarity of the emission, (ii) a detection bandwidth wider than the emitter linewidth, and (iii) that the Hanbury Brown–Twiss start–stop histogram has been jitter-deconvolved and background-corrected at the dark-count level — *not* the raw dip. Drop any one and the inequality is decorative. The number $0.5$ is itself only a second-moment witness; it does not bound higher-order multi-photon contamination, and a source can pass $g^{(2)}(0)\u003c0.5$ while emitting two-photon Fock components at the few-percent level.\n\nSecond, the Siegert relation is invoked far outside its regime. Pulsed sources, transient laser dynamics, mode-hopping, and multi-mode squeezed fields can all return $g^{(2)}(0)\u003e2$ without being \"thermal\" in any sense that the 1956 derivation would recognise. The literature on super-bunching in cascaded SPDC and in microresonator combs uses \"thermal-like\" to mean \"Gaussian-statistics-like in some marginal\", which is not the same thing.\n\nThird, the equation between HBT and \"two-photon interference\" — repeated in introductions to HOM-style experiments — is wrong as stated. HBT is a second-order *intensity* correlation that is fully reproduced by classical Gaussian fields; HOM is a fourth-order *amplitude* effect with no classical limit. They share a beamsplitter geometry and nothing else.\n\nA fourth, smaller, item: the historiographic certainty around \"Dirac said photons do not interfere with one another\" as the obstacle to HBT is overstated. Dirac never published a counter-argument. The actual public opposition came from Brannen and Ferguson and, earlier, from Ádám, Jánossy and Varga [-] — the latter routinely deleted from anglophone retellings.\n\n### (c) Three open questions I would actually work on, ranked\n\n1. **Air-Cherenkov stellar intensity interferometry beyond two telescopes.** A genuine $g^{(n\\geq 3)}$ closure-phase reconstruction on a real $\\mu$as stellar surface would do for SII what closure phases did for VLBI; the photon budget is finally there.\n2. **Model-independent calibration of $g^{(2)}(0)$ for solid-state single emitters with spectral diffusion.** The whole single-photon-source figure of merit needs a non-stationary reformulation; current numbers are not comparable between labs.\n3. **The \"HBT\" label in heavy-ion femtoscopy.** Whether the Koonin–Pratt formalism actually recovers a source function when final-state interactions and collective flow are co-fitted is, in my reading, an unresolved inverse problem, not a solved measurement.\n\n### (d) Reading path\n\n1. Hanbury Brown \u0026 Twiss, *Nature* 1956 [1] — read the table-top mercury-arc paper first; the Sirius paper is downstream.\n2. Purcell, *Nature* 1956 [7] — one page; the argument every textbook now reproduces without attribution.\n3. Glauber, *Phys. Rev.* 1963 (the $g^{(n)}$ hierarchy paper) — the operator-ordered definition that fixed the language.\n4. Sudarshan, *Phys. Rev. Lett.* 1963 — the diagonal-$P$ representation; read alongside Glauber, not after.\n5. Kimble, Dagenais \u0026 Mandel, *PRL* 1977 — the first $g^{(2)}(0)\u003c1$ measurement; the moment the field crossed the classical/nonclassical boundary in the lab."}], "references": [{"n": 1, "title": "Correlation between Photons in two function protectInline(s,maths){
  var out='',i=0,n=s.length;

    if(c==='$'){

      while(j<n){

        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }

  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
