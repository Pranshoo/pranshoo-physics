d is precisely the physics HBT then exploited: the photocurrent carries the intensity envelope $|E|^2$, and that envelope carries the partial coherence the source's optical phase has thrown away.\n\n### The Budapest null result, 1955\n\nIn the same year, Ádám, Jánossy and Varga in Budapest ran a direct photon-coincidence experiment on a chaotic optical source and reported *no* excess coincidences. The work appeared in *Annalen der Physik* (Vol. 16, 408, 1955) (verify) and circulated as evidence that HBT-style correlation either did not exist or had been overstated. The mistake was instrumental, not interpretational: their coherence time $\\tau_c$ was on the order of $10^{-14}\\,\\mathrm{s}$ while their coincidence resolving time was nanoseconds, so the expected excess scaled as $\\tau_c/\\tau_{\\rm res}\\sim 10^{-5}$ and was buried in shot noise by roughly eight orders of magnitude. Anglophone reviews routinely omit this work, but it is the experiment Hanbury Brown and Twiss were implicitly arguing against when they insisted on degeneracy-parameter accounting in the 1956 papers, and Jánossy continued writing on the question for years. The lesson — that an HBT measurement is meaningless without the ratio $\\tau_c/\\tau_{\\rm res}$ and the source's mode occupation $\\bar n$ — is one the modern single-photon-source literature still relearns.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"40\" y1=\"220\" x2=\"700\" y2=\"220\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"40\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e1949\u003c/text\u003e\u003ctext x=\"180\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e1953\u003c/text\u003e\u003ctext x=\"290\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e1954\u003c/text\u003e\u003ctext x=\"395\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e1955\u003c/text\u003e\u003ctext x=\"540\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e1956\u003c/text\u003e\u003ctext x=\"660\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e1957\u003c/text\u003e\u003ccircle cx=\"50\" cy=\"220\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"190\" cy=\"220\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"300\" cy=\"220\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"400\" cy=\"220\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"430\" cy=\"220\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"540\" cy=\"220\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"570\" cy=\"220\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"605\" cy=\"220\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"670\" cy=\"220\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003cline x1=\"50\" y1=\"220\" x2=\"50\" y2=\"125\" stroke=\"#7aa2ff\" stroke-width=\"1\"/\u003e\u003ctext x=\"55\" y=\"115\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003eHBr: ionospheric\u003c/text\u003e\u003ctext x=\"55\" y=\"130\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003escintillation idea\u003c/text\u003e\u003cline x1=\"190\" y1=\"220\" x2=\"190\" y2=\"85\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"155\" y=\"75\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eJennison \u0026amp; Das Gupta:\u003c/text\u003e\u003ctext x=\"155\" y=\"90\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eCygnus A radio (125 MHz)\u003c/text\u003e\u003cline x1=\"300\" y1=\"220\" x2=\"300\" y2=\"165\" stroke=\"#7aa2ff\" stroke-width=\"1\"/\u003e\u003ctext x=\"305\" y=\"155\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003eHBT Phil. Mag.\u003c/text\u003e\u003ctext x=\"305\" y=\"170\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003eradio theory [3]\u003c/text\u003e\u003cline x1=\"400\" y1=\"220\" x2=\"400\" y2=\"305\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"270\" y=\"325\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eForrester+Gudmundsen+Johnson:\u003c/text\u003e\u003ctext x=\"270\" y=\"340\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eHg Zeeman beat at photocathode [4]\u003c/text\u003e\u003cline x1=\"430\" y1=\"220\" x2=\"430\" y2=\"365\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003ctext x=\"270\" y=\"385\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003eÁdám–Jánossy–Varga: null coincidence\u003c/text\u003e\u003cline x1=\"540\" y1=\"220\" x2=\"540\" y2=\"125\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"498\" y=\"115\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eHBT Hg arc\u003c/text\u003e\u003ctext x=\"498\" y=\"130\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003etabletop [1]\u003c/text\u003e\u003cline x1=\"570\" y1=\"220\" x2=\"570\" y2=\"180\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"578\" y=\"170\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eHBT Sirius [5]\u003c/text\u003e\u003cline x1=\"605\" y1=\"220\" x2=\"605\" y2=\"305\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003ctext x=\"525\" y=\"325\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003eBrannen–Ferguson [6];\u003c/text\u003e\u003ctext x=\"525\" y=\"340\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003ePurcell rebuttal [7]\u003c/text\u003e\u003cline x1=\"670\" y1=\"220\" x2=\"670\" y2=\"180\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"600\" y=\"170\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003eHBT Proc. Roy. Soc.\u003c/text\u003e\u003ctext x=\"600\" y=\"155\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003efull theory [8]\u003c/text\u003e\u003ctext x=\"40\" y=\"35\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003e● theory\u003c/text\u003e\u003ctext x=\"135\" y=\"35\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003e● observation\u003c/text\u003e\u003ctext x=\"265\" y=\"35\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003e● controversy\u003c/text\u003e\u003ctext x=\"390\" y=\"35\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003e● formalization\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The actual chronology of intensity interferometry, 1949–1957. The radio result (Jennison \u0026 Das Gupta, Cyg A) precedes the formal theory paper [3]; the Berkeley microwave-beat precursor [4] and the Budapest null replication are simultaneous in 1955; the famous 1956 Nature letter [1] is a tabletop demonstration; the Sirius measurement [5] and the Brannen–Ferguson/Purcell exchange [6, 7] follow within months, and the full classical theory [8] arrives in 1957.*\n\n### The 1956 mercury arc, then Sirius\n\nThe paper that opens every quantum-optics textbook [1] is a *tabletop* experiment. A high-pressure mercury arc was passed through a pinhole, mode-filtered, split on a half-silvered mirror, and the photocurrents of two photomultipliers were correlated. The reported normalized excess $\\langle\\Delta i_1 \\Delta i_2\\rangle/(\\langle i_1\\rangle\\langle i_2\\rangle)$ was small but unambiguous and scaled with the geometric degeneracy of the source as the partial-coherence calculus predicted. This was not the stellar measurement. The stellar measurement followed within months: two 1.5 m searchlight reflectors at Jodrell Bank, photomultipliers at their foci, baselines of 2.6 to 8.9 m, Sirius resolved at $0.0063''$ [5]. The angular diameter so obtained survived later recalibration and is still consistent with modern long-baseline values.\n\n### Brannen, Ferguson, Purcell — and the absent Dirac\n\nThe community's first reaction was disbelief. Brannen and Ferguson in Canada repeated the tabletop experiment and reported a null [6]. Their argument from the quantum side — that two photons \"cannot interfere\" except in the sense Dirac had laid out in 1930 — embodied the same coherence-volume miscalculation as the Budapest experiment. In the same volume of *Nature* Purcell closed the question with a one-page note [7]: in a single mode of a chaotic field the photon-number distribution is Bose–Einstein, so $\\langle n(n-1)\\rangle = 2\\langle n\\rangle^{2}$, and the factor of two is exactly the bunching HBT measured. The dramatized \"Dirac objection\" of later popularizations is largely apocryphal; Dirac published nothing against HBT. Purcell's argument is what every textbook now reproduces under the heading \"why chaotic light bunches,\" and Purcell is the single most under-credited name in the standard HBT story.\n\n### Twiss, separately\n\nWithin the partnership the analytic load was carried by Twiss. The 1957 *Proc. Roy. Soc.* papers [8] — bandwidth, polarization, shot-noise budget, the full classical-Gaussian-field calculation — read in Twiss's voice and lay out the calculus that any modern $g^{(2)}$ measurement, from cold-atom noise correlations to single-photon-source benchmarking, still inherits. His 1969 *Optica Acta* retrospective [9] is the most lucid single source on what the technique can and cannot measure, and is essentially uncited in modern quantum-optics work. Baym's 1998 review [10] is the only widely-read modern essay that restores the radio-to-pion arc with anything like the proper attributions.\n\nWhat the phrase \"the Hanbury Brown–Twiss effect\" silently collapses, then, is at least four distinct contributions: Jennison and Das Gupta's instrument, Hanbury Brown's astrophysical motivation, Twiss's classical-coherence theory, and Purcell's single-mode quantum-statistical closure. It also writes out two negative experiments — Ádám–Jánossy–Varga and Brannen–Ferguson — whose mistakes encoded the very lesson the field needed to learn about coherence volume. That lesson, made quantitative, is the Siegert relation; Section 2 takes it up."}, {"id": "physics-of-intensity-correlations", "title": "The Physics: Intensity Correlations, the Siegert Relation, and Why Chaotic Light Bunches", "markdown": "## The Physics: Intensity Correlations, the Siegert Relation, and Why Chaotic Light Bunches\n\nStrip the instrument away and the Hanbury Brown–Twiss measurement reduces to a single statistical question: given a stationary optical field $E(t)$, how does the joint probability of registering a photodetection at time $t$ and a second at time $t+\\tau$ deviate from the product of the singles rates? The normalized second-order correlation that answers it,\n\n$$g^{(2)}(\\tau) \\;=\\; \\frac{\\langle I(t)\\,I(t+\\tau)\\rangle}{\\langle I(t)\\rangle^{2}} \\;=\\; \\frac{\\langle E^{*}(t)E^{*}(t+\\tau)E(t+\\tau)E(t)\\rangle}{\\langle |E(t)|^{2}\\rangle^{2}},$$\n\nis the only object the geometry actually measures. Hanbury Brown and Twiss did not write it this way in 1956 — they worked with rectified photocurrents and a low-pass filter at the back end — but the 1957 Proc. Roy. Soc. theory paper [8] is, modulo notation, the classical-field derivation of exactly this quantity.\n\n### Gaussian fields and the Siegert factorization\n\nFor a stationary thermal source, $E(t)$ at any point in space is a sum of contributions from an astronomical number of independent radiators. The central limit theorem makes $E(t)$ a circular complex Gaussian process with zero mean. For such a process the moments factorize by Isserlis' theorem (the optics community calls it the Gaussian moment theorem):\n\n$$\\langle E^{*}_{1}E^{*}_{2}E_{3}E_{4}\\rangle \\;=\\; \\langle E^{*}_{1}E_{3}\\rangle\\langle E^{*}_{2}E_{4}\\rangle + \\langle E^{*}_{1}E_{4}\\rangle\\langle E^{*}_{2}E_{3}\\rangle.$$\n\nWith the indices read as $(t,\\,t+\\tau,\\,t+\\tau,\\,t)$ and the first-order coherence $g^{(1)}(\\tau) = \\langle E^{*}(t)E(t+\\tau)\\rangle/\\langle |E|^{2}\\rangle$, this collapses to the **Siegert relation**:\n\n$$\\boxed{\\;g^{(2)}(\\tau) \\;=\\; 1 + |g^{(1)}(\\tau)|^{2}\\;}$$\n\nAt $\\tau = 0$, $|g^{(1)}(0)| = 1$ and $g^{(2)}(0) = 2$. This is the entire content of \"thermal bunching\". It assumes (i) stationarity, (ii) ergodicity, (iii) circular Gaussian statistics, and (iv) a single polarization mode at the detector — strip any of these and the factor of two evaporates [11].\n\nFor two polarization modes summed incoherently at the detector,\n\n$$g^{(2)}(0) \\;=\\; 1 + \\tfrac{1}{2}\\,|g^{(1)}_{\\parallel}(0)|^{2}\\quad\\Longrightarrow\\quad g^{(2)}(0) = \\tfrac{3}{2},$$\n\nwhich is why HBT used a polarizer at Narrabri and why a clumsy unpolarized measurement halves the contrast before any instrumental degradation has even been counted.\n\n### Purcell's one-page closure\n\nE. M. Purcell's 1956 letter [7] gave the corpuscular reading that ended the Brannen–Ferguson [6] dispute. Take a single quantized mode of the radiation field at thermal equilibrium with mean occupation $\\bar{n}$. The probability of $n$ photons in that mode is geometric:\n\n$$p(n) \\;=\\; \\frac{\\bar{n}^{n}}{(1+\\bar{n})^{n+1}},\\qquad \\langle n\\rangle = \\bar{n},\\qquad \\langle n(n-1)\\rangle = 2\\bar{n}^{2}.$$\n\nThe normally ordered second-order correlation for a single mode is\n\n$$g^{(2)}(0) \\;=\\; \\frac{\\langle n(n-1)\\rangle}{\\langle n\\rangle^{2}} \\;=\\; 2.$$\n\nThe factor of two is Bose–Einstein variance, $\\mathrm{Var}(n) = \\bar{n} + \\bar{n}^{2}$, with the $\\bar{n}^{2}$ \"wave-noise\" piece dominating in the highly degenerate regime $\\bar{n}\\gg 1$ that defines classical chaotic light. Purcell's contribution was to note that this is *all there is*: the same factor falls out of the photon counting picture and of the Gaussian-field picture, and no extra \"force between photons\" is required to make them arrive in lumps. The HBT result is a statement about the variance of the occupation of a single mode, period.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eg^(2)(tau) for chaotic and coherent light\u003c/title\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.4\"/\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"70\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"380\" y=\"380\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\"\u003edelay τ (units of coherence time τ_c)\u003c/text\u003e\u003ctext x=\"20\" y=\"190\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" transform=\"rotate(-90 20 190)\"\u003eg⁽²⁾(τ)\u003c/text\u003e\u003cline x1=\"70\" y1=\"240\" x2=\"690\" y2=\"240\" stroke=\"#e8e6e1\" stroke-width=\"0.7\" stroke-dasharray=\"4 4\"/\u003e\u003cline x1=\"70\" y1=\"140\" x2=\"690\" y2=\"140\" stroke=\"#e8e6e1\" stroke-width=\"0.7\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"60\" y=\"245\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003e1\u003c/text\u003e\u003ctext x=\"60\" y=\"145\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003e2\u003c/text\u003e\u003cpath d=\"M70 140 Q 130 240 250 240 L 690 240\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.4\"/\u003e\u003cpath d=\"M70 240 L 690 240\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.4\" stroke-dasharray=\"8 4\"/\u003e\u003cpath d=\"M70 340 Q 130 240 250 240 L 690 240\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.4\"/\u003e\u003ccircle cx=\"70\" cy=\"140\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"70\" cy=\"240\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"70\" cy=\"340\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"320\" y=\"120\" fill=\"#7aa2ff\" font-size=\"14\"\u003echaotic (single-mode): g⁽²⁾(0)=2\u003c/text\u003e\u003ctext x=\"320\" y=\"220\" fill=\"#ffb86b\" font-size=\"14\"\u003ecoherent laser: g⁽²⁾(τ)=1\u003c/text\u003e\u003ctext x=\"320\" y=\"330\" fill=\"#7ee0a3\" font-size=\"14\"\u003eantibunched single emitter: g⁽²⁾(0)\u0026lt;1\u003c/text\u003e\u003cline x1=\"130\" y1=\"335\" x2=\"130\" y2=\"345\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"130\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eτ_c\u003c/text\u003e\u003ctext x=\"450\" y=\"70\" fill=\"#e8e6e1\" font-size=\"14\"\u003eSiegert: g⁽²⁾(τ) = 1 + |g⁽¹⁾(τ)|²\u003c/text\u003e\u003c/svg\u003e\n*Figure: The three operational regimes of $g^{(2)}(\\tau)$. Chaotic light decays from 2 to 1 on the coherence time $\\tau_c$; a coherent laser is flat at 1; an isolated emitter has $g^{(2)}(0)\u003c1$, a genuinely nonclassical signature. Only the chaotic curve is the \"HBT bunching peak\" of 1956.*\n\n### Bandwidth, polarization, and the mode-volume bookkeeping\n\nThe 1957 paper's quantitative achievement was to track the signal through a real instrument. Write the source spectrum $S(\\omega)$ normalized so that $g^{(1)}(\\tau) = \\int S(\\omega)\\,e^{-i\\omega\\tau}\\,d\\omega$. The Siegert relation makes the *visible* bunching peak\n\n$$g^{(2)}(\\tau) - 1 \\;=\\; |g^{(1)}(\\tau)|^{2},$$\n\nan autocorrelation of width $\\tau_{c} \\sim 1/\\Delta\\nu$. A counter with integration time $T \\gg \\tau_{c}$ averages over $T/\\tau_{c}$ independent coherence cells, so the *measured* excess over Poissonian shot noise scales as\n\n$$\\frac{\\langle\\Delta N_{1}\\Delta N_{2}\\rangle}{\\langle N_{1}\\rangle\\langle N_{2}\\rangle} \\;\\sim\\; \\frac{\\tau_{c}}{T}\\,\\frac{1}{M_{\\mathrm{pol}}M_{\\mathrm{spatial}}},$$\n\nwith $M_{\\mathrm{pol}}\\in\\{1,2\\}$ and $M_{\\mathrm{spatial}}$ the number of transverse modes accepted by the detector aperture. For the optical bunching to survive, one needs the *single-mode degeneracy parameter* — mean photons per mode — to satisfy $\\delta = \\bar{n}\\gtrsim 1$, which for a thermal blackbody requires either the Wien tail to be avoided or, as Martienssen and Spiller engineered [12], a quasi-thermal source built by passing laser light through a slowly rotating ground-glass diffuser whose coherence time is set by the rotation speed and whose $\\delta$ is enormous.\n\n### Why Budapest 1955 saw nothing\n\nÁdám, Jánossy and Varga used a discharge lamp filtered to $\\Delta\\lambda \\sim 1$ Å around 5460 Å, giving $\\Delta\\nu \\sim 10^{10}$ Hz and $\\tau_{c} \\sim 10^{-10}$ s. Their photomultiplier resolving time was on the order of $T \\sim 10^{-8}$ s, so a single coincidence window already averaged over $\\sim 10^{2}$ coherence cells. Worse, the source degeneracy was $\\delta \\sim 10^{-3}$ — well into the shot-noise-dominated regime where the \"wave-noise\" excess $\\bar{n}^{2}$ is dwarfed by $\\bar{n}$. The expected bunching contrast in their geometry was a few parts in $10^{6}$, against a counting noise that, for the totals reported, was about three orders of magnitude larger. The null was numerically inevitable; the lesson is not that the effect is absent but that intensity interferometry is a degeneracy-thresholded measurement.\n\nHBT's 1956 mercury arc was selected through a 4358 Å filter with an aperture stop that delivered roughly a single transverse mode, $\\delta\\sim 10^{-3}$ in their original report, and their integration time was 90 minutes — enough to push the statistical error on the correlated rate below the predicted 1 part in $10^{4}$ excess. They did not beat shot noise; they out-integrated it. Forrester, Gudmundsen and Johnson's 1955 beat experiment [4] had already shown the same statistical regime was accessible at microwave frequencies, where $\\delta$ is naturally astronomical.\n\n### What the classical derivation does not tell you\n\nEverything above is positive-P; nothing in it requires field quantization. The factor of two is wave noise enhanced by the Bose denominator $(1+\\bar n)$ in a single mode, but the same denominator appears in a classical Gaussian process. The Siegert relation breaks the moment you leave the Gaussian regime: a heralded single-photon Fock state has $g^{(2)}(0)=0$, in flat violation of $g^{(2)}\\geq 1$, and no rearrangement of $g^{(1)}$ saves the identity. That asymmetry — Gaussianity gives bunching for free; non-Gaussianity gives antibunching as an operational nonclassicality witness — is the wedge that Glauber [13] and Sudarshan [14] drove through the formalism in 1963, and that Kimble, Dagenais and Mandel [15] exploited fourteen years later to take an HBT geometry past the classical boundary for the first time."}, {"id": "the-controversy-and-its-resolution", "title": "Dirac's Ghost, Brannen–Ferguson, and Purcell's One-Page Closure", "markdown": "## Dirac's Ghost, Brannen–Ferguson, and Purcell's One-Page Closure\n\nThe 1956 Nature paper [1] landed in a community that had already been told, by the highest possible authority, that the result was impossible. The authority was a single sentence in Dirac's *Principles of Quantum Mechanics* (4th ed., 1958, but unchanged in spirit from the 1930 first edition): *\"Each photon then interferes only with itself. Interference between two different photons never occurs.\"* Stripped of context, read aloud at a Cavendish tea room, this sounds like a flat prohibition on any joint two-detector observable that depends on the simultaneous arrival of distinguishable quanta. If photons cannot \"interfere\" with one another, how can the rectified photocurrent at detector A be correlated with the rectified photocurrent at detector B?\n\nThe trap is that Dirac was making a statement about *first-order* (amplitude) interference of an *individual* one-photon state with itself across alternative paths — the Young's-slits sense — and the HBT observable is something else entirely: a *second-order* moment $\\langle I_A I_B \\rangle$ of the field, which in the quantised theory is $\\langle \\hat a_A^\\dagger \\hat a_B^\\dagger \\hat a_B \\hat a_A \\rangle$, a four-operator expectation that mixes two photons and is sensitive to the *symmetrisation* of the two-quantum state across detectors. Dirac's dictum and the HBT correlation live at different orders of the Glauber hierarchy [13], and the elision between them is what generated the controversy. Dirac, importantly, never published any objection. The \"Dirac vs HBT\" framing in popular accounts is folklore; what existed was a widespread *assumption*, downstream of the textbook sentence, that HBT had to be wrong.\n\n### The two negative experiments\n\nTwo laboratory attempts to falsify HBT actually made it into print, and both are routinely misremembered.\n\nThe earlier, and more invisible in the anglophone literature, was Ádám, Jánossy and Varga in Budapest in 1955. They mounted two photomultipliers on the two outputs of a beamsplitter illuminated by a filtered incandescent source and looked for a coincidence excess above accidentals. They found none and reported a null. The experiment was reported in *Annalen der Physik* and in Hungarian-language venues, and the null was occasionally cited through the late 1950s as evidence that the HBT effect was an artefact. The actual physics of their null is mundane and instructive: the degeneracy parameter — the mean photon occupation per coherence cell — was hopelessly small. The signal-to-noise of a chaotic-light HBT measurement on a detector pair scales as\n\n$$ \\mathrm{SNR} \\;\\sim\\; \\alpha^2\\, \\bar n\\, \\sqrt{T_\\text{int}\\,\\Delta\\nu_\\text{opt}}, $$\n\nwith $\\alpha$ the quantum efficiency, $\\bar n$ the mean photon number per mode (the degeneracy parameter $\\delta = \\bar n$), $\\Delta\\nu_\\text{opt}$ the optical bandwidth admitted *into a single transverse and polarisation mode*, and $T_\\text{int}$ the integration time. A broadband filtered tungsten lamp coupled into a multimode geometry gives $\\delta \\ll 10^{-2}$; the prefactor $\\delta^2$ buries the bunching signal under shot noise unless one integrates impractically long. HBT's whole instrumental art — narrow optical filtering, spatial-mode selection by aperture, AC coupling of the photocurrents, long integration — was directed precisely at fighting this $\\delta^2$. Ádám, Jánossy and Varga did none of it. Their null was a measurement of their own coherence volume, not of the universe.\n\nThe Brannen–Ferguson letter in *Nature* later in 1956 [6] was the more visible challenge. They used a mercury arc, a beamsplitter, two photomultipliers and a coincidence circuit, and reported no excess coincidences within their resolving time. Their interpretive paragraph went further than their data warranted: they argued that if the HBT effect were real, then by their numbers the coincidence rate \"should be many orders of magnitude larger than that actually observed\" — and concluded that the HBT claim was therefore untenable. Hanbury Brown and Twiss replied immediately in the same volume of *Nature*, pointing out that the Brannen–Ferguson setup combined a coherence time $\\tau_c$ of order $10^{-11}$ s with a coincidence-circuit resolving time $\\tau_r$ of order $10^{-8}$ s, so the bunching contrast they should have expected was diluted by $\\tau_c/\\tau_r \\sim 10^{-3}$, exactly the factor by which their null undershot the HBT prediction. There was no disagreement on the underlying field theory; there was a disagreement on what counts as resolved.\n\n### Purcell's letter\n\nInto this back-and-forth Purcell dropped a single page in *Nature* later that same year [7]. The argument is so compact it can be reproduced almost in full. Consider a single radiation mode of a chaotic source with mean occupation $\\bar n$. The Bose–Einstein distribution gives the photon-number variance\n\n$$ \\langle (\\Delta n)^2 \\rangle \\;=\\; \\bar n + \\bar n^2, $$\n\nthe first term shot noise (the Poisson contribution one would have from any sub-Poissonian or coherent illumination of the same mean), the second the *excess* fluctuation characteristic of thermal occupation. Split the mode at a 50/50 beamsplitter; the two outputs are independent classical-noise replicas at long times but at short times share the same mode fluctuation, and the cross-correlation between their intensities recovers exactly the $\\bar n^2$ term. Equivalently, with $g^{(2)}(\\tau)$ defined as the normalised intensity correlation,\n\n$$ g^{(2)}(0) \\;=\\; 1 + \\frac{\\langle(\\Delta n)^2\\rangle - \\bar n}{\\bar n^2} \\;=\\; 2 $$\n\nfor a single Bose-occupied mode, and the bunching contrast at finite $\\tau$ degrades smoothly to unity over $\\tau_c$. No \"interference between two photons\" is invoked. Nothing is said that Dirac would have disputed. The result is forced by Bose statistics applied to *one* mode and by the elementary identity $\\mathrm{Var}(n) = \\bar n + \\bar n^2$ for thermal occupation. Purcell additionally noted that the same arithmetic, with $\\langle (\\Delta n)^2 \\rangle = \\bar n - \\bar n^2$ for a single fermion mode, predicts *anti-bunching* of electrons in a degenerate beam — a prediction that took four decades to test but is now standard in mesoscopic transport.\n\nPurcell's letter dissolved the controversy. It is what Dirac was reportedly shown afterwards, what convinced editors and referees that the Brannen–Ferguson null was instrumental, and what every modern textbook now reproduces — verbatim in structure if not in attribution — under the heading \"why thermal light bunches\". Glauber's 1963 quantised-field reconstruction [13] supplies the operator formalism; Sudarshan's diagonal-P [14] supplies the classical/nonclassical boundary; but the *physics* of bunching as a single-mode Bose-occupation phenomenon is on that one page.\n\n### Why Purcell is under-credited\n\nThree structural reasons, none of them about merit. First, the *Nature* letter is one page, untitled in the sense of carrying no equations the reader can grep on, and attributable in modern citation indices only as \"E. M. Purcell, *Nature* 178, 1449 (1956)\". It is not a \"paper\" by the metric a citation-counting reviewer applies. Second, Purcell was already famous for NMR (1952 Nobel) and his name attaches more strongly in the collective memory to the Purcell effect in cavity QED than to a one-page letter on photon statistics. The marginal cost of forgetting the HBT letter is low. Third, and most importantly, the *narrative* of HBT was set by Hanbury Brown himself, in his autobiography *Boffin* (1991) and in his 1974 monograph *The Intensity Interferometer*, both of which (understandably) frame the 1956 controversy as a vindication of the experimental program rather than as a theoretical closure by an outside party. The Glauber–Sudarshan formalisation arrived seven years later and absorbed the conceptual credit upward, into the quantum-optics canon. Purcell's letter fell into the gap between \"what HBT did\" and \"what Glauber proved\", and the gap closed over it. A fair textbook attribution for the bunching of chaotic light reads: *observed by Hanbury Brown and Twiss (1956); explained by Purcell (1956); quantised by Glauber and Sudarshan (1963)* — and the middle clause is the one routinely dropped."}, {"id": "from-classical-fields-to-glauber-sudarshan", "title": "Quantization: Glauber's g^(n), Sudarshan's P, and the Classical/Nonclassical Boundary", "markdown": "## Quantization: Glauber's g^(n), Sudarshan's P, and the Classical/Nonclassical Boundary\n\nPurcell had closed the 1956 controversy with a sentence about Bose statistics in a single mode [7], but his argument was a thermodynamic plausibility, not a calculus. It told you *why* a chaotic beam bunches; it did not tell you how to write down the correlation function of an arbitrary quantum field, nor how to decide, given an experimental g^{(2)}, whether the underlying state had any classical analogue at all. Closing that gap is what Glauber and Sudarshan did in 1963, working independently and — by the standards the optics community would later adopt — co-equally. The result was the framework in which every modern HBT measurement, from a single nitrogen-vacancy centre [16] to a phonon mode of a nanomechanical resonator [17], is now reported.\n\n### Normal ordering and the n-th order coherence function\n\nGlauber's starting move [13] was to recognise that a photodetector does not measure $\\langle E^2 \\rangle$. It measures absorption: the rate at which the field destroys a photon and the atom transitions upward. The correct response function is therefore not symmetric in $E^{(+)}$ and $E^{(-)}$ but *normal-ordered*, with all annihilation operators to the right of all creation operators. For a single mode at a single space-time point this gives the hierarchy\n\n$$g^{(n)}(t_1,\\ldots,t_n;t_n,\\ldots,t_1) \\;=\\; \\frac{\\langle:\\!\\hat{I}(t_1)\\cdots \\hat{I}(t_n)\\!:\\rangle}{\\prod_{j=1}^{n}\\langle \\hat{I}(t_j)\\rangle}$$\n\nwith $\\hat{I}(t)=\\hat{E}^{(-)}(t)\\hat{E}^{(+)}(t)$ and the colons denoting normal ordering. The two-point version,\n\n$$g^{(2)}(\\tau) \\;=\\; \\frac{\\langle \\hat{a}^\\dagger(t)\\hat{a}^\\dagger(t+\\tau)\\hat{a}(t+\\tau)\\hat{a}(t)\\rangle}{\\langle \\hat{a}^\\dagger(t)\\hat{a}(t)\\rangle^2},$$\n\nis what every quantum-optics laboratory now reports, with $\\hat{a}$ standing for the detected mode (spatial, spectral, or polarization) selected by the apparatus. The crucial structural point — easy to miss because the symbol $g^{(2)}$ is reused from the classical theory of §2 — is that the *operator ordering*, not the algebraic form, carries the quantum content. For a coherent state $|\\alpha\\rangle$, an eigenstate of $\\hat{a}$, the normal-ordered moments factor: $g^{(n)}(0)=1$ for all $n$. A laser well above threshold therefore sits at the Poissonian point of the hierarchy; a thermal source at $g^{(2)}(0)=2$, $g^{(n)}(0)=n!$; and anything below 1 is, by construction, outside the reach of coherent-state mixtures.\n\n### Sudarshan's diagonal-P and the sharpness of the boundary\n\nWhy is $g^{(2)}(0)\\ge 1$ a sharp inequality for \"classical\" fields? The answer is Sudarshan's [14]. Any density operator of a single mode admits the diagonal expansion\n\n$$\\hat{\\rho} \\;=\\; \\int P(\\alpha)\\,|\\alpha\\rangle\\langle\\alpha|\\,d^2\\alpha,$$\n\nwhere $P(\\alpha)$ is, in general, a tempered distribution on phase space. When $P(\\alpha)\\ge 0$ and integrable, the state is a probabilistic mixture of coherent states, and every normal-ordered moment reduces to a classical average over $|\\alpha|^2$. Then\n\n$$\\langle:\\!\\hat{I}^2\\!:\\rangle - \\langle \\hat{I}\\rangle^2 \\;=\\; \\int P(\\alpha)\\,\\big(|\\alpha|^2-\\langle |\\alpha|^2\\rangle\\big)^2\\,d^2\\alpha \\;\\ge\\; 0,$$\n\nby Cauchy–Schwarz applied to a positive measure, and therefore $g^{(2)}(0)\\ge 1$. The chain of inequalities continues up the hierarchy: $g^{(n)}(0)\\ge \\big[g^{(2)}(0)\\big]^{n/2}$ and $g^{(n+1)}(0)\\,g^{(n-1)}(0)\\ge \\big[g^{(n)}(0)\\big]^2$ all follow from positivity of $P$. *Antibunching* — $g^{(2)}(0)\u003c1$ — and *sub-Poissonian* number statistics — Mandel $Q\u003c0$ — are then formally identical statements: $P$ cannot be a probability density, the state has no classical analogue, and one is forced into the language of Fock states and operator algebras. Kimble, Dagenais and Mandel's 1977 result on a single sodium atom [15] is the first observation that demanded the diagonal-P framework rather than merely permitting it.\n\nA cautionary technicality, often lost in the sales pitch: the Glauber–Sudarshan correspondence is not unique to coherent states. The Wigner, Husimi and *P* distributions are different quasiprobabilities, and \"nonclassical\" in the P-sense (negative or singular P) is strictly stronger than \"nonclassical\" in the Wigner-sense (negative W). Squeezed vacuum has a negative-W and a worse-than-negative *P* (a derivative of a delta function); a thermal state has a perfectly classical positive Gaussian P. When a paper says \"the state is nonclassical\", the diagonal-P criterion is the one HBT data can falsify; the Wigner-negativity criterion generally cannot be reached from $g^{(2)}$ alone.\n\n### The credit audit\n\nGlauber's [13] and Sudarshan's [14] were submitted within months of each other in 1963. Sudarshan's PRL proves *existence* of the diagonal-P expansion for all density operators (modulo distributional pathologies) and uses it to demonstrate that any quantum optical experiment whose statistics can be reproduced by a classical stochastic field corresponds to $P\\ge 0$ — the operationally sharpest formulation of the classical/nonclassical boundary the optics community has. Glauber's Phys. Rev. 130 and the companion 131, 2766 develop the coherent-state machinery, the n-th order correlation functions, and the photodetection theory in full. The two results are logically complementary: Glauber gives you the observables, Sudarshan tells you which density operators reproduce a classical observer. The 2005 Nobel citation for \"the quantum theory of optical coherence\" went to Glauber alone, with the Stockholm prize-winning text crediting \"the P-representation\" without naming Sudarshan. An open letter signed by a substantial fraction of the optics community circulated shortly after the announcement; the formal result is, in every textbook of any seriousness, the *Glauber–Sudarshan* P-representation. The single-name attribution survives only in Nobel-derivative writing and in a few histories that follow the citation rather than the physics. The record here is unambiguous on priority — both submissions are 1963 — and contested only on the meta-question of who should have shared the medal. AETHER's verdict: any modern review that writes \"Glauber's P\" without naming Sudarshan is repeating a Stockholm error, not a physics one.\n\n### What the framework actually buys an experimenter\n\nThree things, all of which §6 will revisit critically. First, an unambiguous nonclassicality witness: $g^{(2)}(0)\u003c1$ on a properly mode-selected, background-corrected dataset rules out every positive-P description, full stop. Second, a hierarchy of inequalities — $g^{(n)}(0)\\ge 1$ for classical fields, equality only for coherent states — that lets one bound multi-photon contamination in heralded sources [18, 19]. Third, an operator-level cleanup of the Siegert relation: $g^{(2)}_{\\text{chaotic}}(\\tau)=1+\\,|g^{(1)}(\\tau)|^2$ is now a statement about normal-ordered moments of a Gaussian *quantum* field, valid whenever the density operator is a Gaussian mixture of coherent states with zero mean — the only regime in which classical and quantum HBT formally coincide. Every deviation from Siegert — pulsed sources, super-bunched twin beams, transient laser dynamics, single emitters — is a deviation from that Gaussian-positive-P null hypothesis, and the language for naming the deviation is the language Glauber and Sudarshan built in 1963."}, {"id": "landmark-experiments", "title": "Landmarks: From Sirius to Narrabri to Antibunching to Cold-Atom Noise Correlations", "markdown": "## Landmarks: From Sirius to Narrabri to Antibunching to Cold-Atom Noise Correlations\n\nThe previous sections fixed the classical theory (§2) and its quantization (§4). What follows is the experimental record — the actual instruments and the actual numbers that turned $g^{(2)}(\\tau)$ from a formal object into a working observable across five orders of magnitude in source size and twelve orders of magnitude in coherence time.\n\n### Sirius, 1956: HBT goes stellar\n\nThe mercury-arc demonstration [1] was a tabletop proof of principle. The instrument that mattered was assembled later the same year on the lawn of the Jodrell Bank site (and moved to Narrabri only a decade later): two ex-Army anti-aircraft searchlight mirrors of 1.5 m diameter on baselines from 2.6 to 8.9 m, each with an EMI 9514S photomultiplier at the prime focus and an electronic mixer correlating the AC components of the photocurrents in real time [5]. Pointed at $\\alpha$ CMa they recovered a uniform-disk angular diameter of $0.0063 \\pm 0.0006$ arcsec — consistent with the spectroscopic effective temperature and a factor of three beyond the Michelson amplitude interferometer's stellar reach, because intensity correlation is immune to atmospheric path-length jitter (a phase fluctuation common to the two arms cancels in the modulus).\n\nThat immunity is the entire reason for the program. The 125 MHz radio version (§1) worked through the troposphere because at metre wavelengths the atmosphere is essentially rigid. At 440 nm the equivalent demand on a Michelson amplitude interferometer is sub-wavelength mechanical stability of optical paths over hundreds of metres of baseline; the intensity interferometer relaxes this to nanosecond electronic timing of two photocurrents and pays the price in signal-to-noise through the famous prefactor $\\alpha\\, n\\, \\tau_c \\sqrt{T/\\tau_c}$, where $\\alpha$ is quantum efficiency, $n$ the photon count rate per coherence cell, $\\tau_c$ the optical coherence time, and $T$ the integration time [8, 9].\n\n### Narrabri, 1965–1972: a survey instrument\n\nThe Narrabri Stellar Intensity Interferometer (NSII) was the production version. Built at a dark site near Narrabri Creek in NSW, it consisted of two 6.5 m mosaic reflectors — 252 hexagonal mirror tiles each, optical quality more flashlight than telescope — mounted on trolleys that rolled on a 188 m diameter circular rail so that the projected baseline tracked the source and stayed perpendicular to the line of sight as the Earth rotated [20]. Over seven years the program measured limb-darkened angular diameters of 32 hot stars down to about $0.4$ milliarcsec. The sample was deliberately stacked on the B/O/A main sequence, because those targets have effective temperatures above 7000 K — only there does the Planck spectrum still produce enough photons per coherence cell to overcome the $\\sqrt{T/\\tau_c}$ noise penalty.\n\nThe data product was not the angular diameters themselves but the empirical calibration of the effective-temperature scale from $T_\\text{eff} = (F_\\text{bol}/\\sigma \\theta^2)^{1/4}$ — a model-independent radiometric anchor for stellar atmospheres that propagated into every subsequent fundamental-parameter compilation for hot stars [21, 22]. Narrabri also pinned down orbital parameters and mass ratios in spectroscopic binaries (Spica is the canonical example) at angular scales no amplitude interferometer of the era could reach [21]. The instrument was retired in 1972 not because the technique had been superseded — it had not, in its sensitivity regime — but because the program had drained the available bright hot-star targets and going fainter demanded larger mirrors and longer integrations than the budget supported.\n\n### Kimble, Dagenais, Mandel, 1977: operational nonclassicality\n\nEvery measurement above sits at $g^{(2)}(0) \\approx 2$ for a single chaotic mode (Siegert, §2). To cross into the regime forbidden by any positive-$P$ classical field one needs $g^{(2)}(0) \u003c 1$. The first instance was Kimble, Dagenais, and Mandel at Rochester [15]: a low-density sodium atomic beam crossed by a near-resonant cw dye laser, with the resonance-fluorescence photons collected on a Hanbury-Brown–Twiss start–stop coincidence circuit. A single two-level atom, having just emitted a photon, must re-excite before it can emit again — the conditional emission probability is suppressed at $\\tau = 0$ and recovers on the Rabi timescale, modulated by oscillations whose envelope decays at the spontaneous-emission rate $\\Gamma/2$.\n\nThe raw data were ambiguous because the atomic beam carried a finite mean number $\\bar n$ of atoms in the focal volume and $g^{(2)}(0)$ from $N$ uncorrelated emitters approaches $1 - 1/N$ from below; KDM reported a residual dip after extrapolation to $\\bar n \\to 0$. The result is operationally nonclassical in a way the entire HBT corpus before it was not — no diagonal-$P$ distribution can reproduce $g^{(2)}(0) \u003c 1$ [13, 14]. It is the first time the intensity-correlation geometry produced a measurement that the Glauber–Sudarshan framework could not have predicted from any classical field, and it is what made HBT, retroactively, an instrument of quantum optics rather than of statistical optics.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eg-squared(0) landscape of HBT landmarks\u003c/title\u003e\u003ctext x=\"360\" y=\"24\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eLandmark intensity-correlation measurements — g²(0) signature\u003c/text\u003e\u003cline x1=\"100\" y1=\"320\" x2=\"690\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"100\" y1=\"60\" x2=\"100\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"60\" y=\"64\" fill=\"#e8e6e1\" font-size=\"14\"\u003eg²(0)\u003c/text\u003e\u003cline x1=\"100\" y1=\"100\" x2=\"690\" y2=\"100\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/\u003e\u003cline x1=\"100\" y1=\"180\" x2=\"690\" y2=\"180\" stroke=\"#ffb86b\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/\u003e\u003cline x1=\"100\" y1=\"260\" x2=\"690\" y2=\"260\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/\u003e\u003ctext x=\"95\" y=\"104\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"end\"\u003e2\u003c/text\u003e\u003ctext x=\"95\" y=\"184\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"end\"\u003e1\u003c/text\u003e\u003ctext x=\"95\" y=\"264\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"690\" y=\"92\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"end\"\u003ethermal bunching\u003c/text\u003e\u003ctext x=\"690\" y=\"172\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"end\"\u003ecoherent (Poisson)\u003c/text\u003e\u003ctext x=\"690\" y=\"252\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"end\"\u003eclassical lower bound\u003c/text\u003e\u003ccircle cx=\"170\" cy=\"110\" r=\"7\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"170\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1956\u003c/text\u003e\u003ctext x=\"170\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eSirius\u003c/text\u003e\u003ctext x=\"170\" y=\"376\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eθ=6.3 mas\u003c/text\u003e\u003ccircle cx=\"290\" cy=\"110\" r=\"7\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"290\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1960\u003c/text\u003e\u003ctext x=\"290\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eGGLP π±π±\u003c/text\u003e\u003ctext x=\"290\" y=\"376\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eR ~ 1 fm\u003c/text\u003e\u003ccircle cx=\"410\" cy=\"110\" r=\"7\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"410\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1972\u003c/text\u003e\u003ctext x=\"410\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eNarrabri\u003c/text\u003e\u003ctext x=\"410\" y=\"376\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e32 OBA stars\u003c/text\u003e\u003ccircle cx=\"530\" cy=\"220\" r=\"7\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"530\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1977\u003c/text\u003e\u003ctext x=\"530\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eKDM Na beam\u003c/text\u003e\u003ctext x=\"530\" y=\"376\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eantibunching\u003c/text\u003e\u003ccircle cx=\"650\" cy=\"110\" r=\"7\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"650\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2005\u003c/text\u003e\u003ctext x=\"650\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eFölling\u003c/text\u003e\u003ctext x=\"650\" y=\"376\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e⁸⁷Rb lattice\u003c/text\u003e\u003c/svg\u003e\n*Figure: Where each landmark sits on the $g^{(2)}(0)$ axis. The four bunching measurements (Sirius, GGLP, Narrabri, Fölling) all live near the chaotic value of 2 — they differ only in the kind of \"source\" they image (a star, a fireball, a hot star again, an atomic Mott insulator). KDM is the lone entry below the classical bound, and the only one of the five that cannot be reproduced by any positive-$P$ classical field.*\n\n### GGLP, 1960: HBT for hadrons\n\nThe hadronic analog was found independently and almost without apparent debt to HBT. At the Berkeley Bevatron, Goldhaber, Goldhaber, Lee, and Pais analyzed like-sign pion pairs from $\\bar p p$ annihilation and reported a small-relative-momentum enhancement in $\\pi^\\pm\\pi^\\pm$ that was absent in $\\pi^+\\pi^-$ [23]. They explained it by symmetrizing the multi-pion outgoing wavefunction over an extended emission region — a $\\sim 1$ fm \"fireball\" — and recovered a Fourier-transform relation\n$$C_2(\\mathbf q) \\;=\\; 1 + |\\tilde\\rho(\\mathbf q)|^2$$\nbetween the pair correlation function and the source density $\\rho(x)$, formally identical to the HBT van Cittert–Zernike kernel. Goldhaber's later retrospective [24] makes clear that the link to HBT was made by others years afterward; the original GGLP paper cites neither Hanbury Brown nor Twiss. Sixty years on, every heavy-ion experiment runs HBT-style femtoscopy as a standard tool [10, 25, 26, 27], and the cottage industry of dynamics-vs-symmetrization caveats begun by Gyulassy [28] remains active in modern phenomenology [29].\n\n### Fölling et al., 2005: HBT for many-body cold atoms\n\nThe final landmark is a wholesale transplant of the geometry into ultracold matter. Fölling and collaborators released a $^{87}$Rb cloud from a three-dimensional optical lattice, imaged the expanded density on a CCD, and computed shot-to-shot the *spatial* noise correlator\n$$\\mathcal{C}(\\mathbf r_1, \\mathbf r_2) \\;=\\; \\frac{\\langle \\delta n(\\mathbf r_1)\\,\\delta n(\\mathbf r_2)\\rangle}{\\langle n(\\mathbf r_1)\\rangle\\langle n(\\mathbf r_2)\\rangle}$$\non the time-of-flight images [30]. For a Mott insulator with one atom per site, $\\mathcal{C}$ displays sharp positive peaks at separations $\\Delta \\mathbf r = (\\hbar t_\\text{tof}/m)\\,\\mathbf G$, with $\\mathbf G$ running over reciprocal-lattice vectors — the bosonic-bunching analog of Bragg diffraction, with $g^{(2)}$ doing the imaging that the single-shot density cannot. The superfluid shows no such peaks because the long-range phase coherence is already encoded in $\\langle n(\\mathbf r)\\rangle$ itself.\n\nThis was the moment HBT escaped quantum optics proper. The same noise-correlation idea now drives fermionic-pair detection in $^{40}$K, momentum-space Bell tests in molecular dissociation, and spatially resolved Hanbury-Brown–Twiss measurements on *phonons* in nanomechanical resonators [17]. The geometry — two detectors, fourth-order observable, $g^{(2)}$ as the data product — is by this point indifferent to whether the \"field\" being correlated is light, matter, or vibration."}, {"id": "signatures-uses-and-abuses", "title": "Use and Abuse: What g^(2)(0) Actually Certifies — and What It Does Not", "markdown": "## Use and Abuse: What g^(2)(0) Actually Certifies — and What It Does Not\n\nGlauber's hierarchy (§4) gave the single number $g^{(2)}(0)$ a precise field-theoretic meaning. Forty years of single-emitter spectroscopy then promoted that number to a stand-alone certificate of nonclassicality. The promotion is not entirely earned. In the modern literature $g^{(2)}(0)$ is asked to do three jobs simultaneously — \"this emitter is a single-photon source\", \"this light is thermal\", \"this experiment is a quantum-optics experiment\" — and the inequality is routinely reported with neither the corrections nor the regime assumptions that would make it mean what is claimed.\n\n### The single-emitter threshold is 1/2, not 1\n\nFor $N$ independent identical emitters of equal brightness, photon-number bookkeeping gives\n$$g^{(2)}(0) = 1 - \\frac{1}{N}.$$\nSo $g^{(2)}(0)=1/2$ corresponds exactly to two emitters, $2/3$ to three, and the inequality\n$$g^{(2)}(0) \u003c \\tfrac{1}{2}$$\nis what excludes the two-emitter scenario from the *raw* coincidence trace. The figure of merit \"$g^{(2)}(0)\u003c1/2$\" was emphasised by the Mandel and Walther groups in the late 1980s for exactly this reason. A modern paper that reports $g^{(2)}(0)=0.7$ from a quantum dot and concludes \"antibunching observed, single-photon source verified\" has at best demonstrated that fewer than four emitters contribute — it has not excluded a small cluster, and it has certainly not certified a single quantum emitter [19, 16, 31].\n\nEven $g^{(2)}(0)\u003c1/2$ is necessary, not sufficient. It constrains the second factorial moment of the photocount distribution and nothing else. A statistical mixture of a single emitter with a dim coherent background or with a second weak emitter can reproduce any value in $[0,1/2)$ without the joint state being $|1\\rangle$. Operational single-photon certification needs higher-order correlations or, for on-demand sources, full reconstruction of the photon-number distribution.\n\n### What contaminates raw $g^{(2)}(0)$\n\nThree corrections are non-negotiable before any nonclassicality claim, and all three are routinely skipped.\n\n**Background.** With an emitter fraction $\\rho = S/(S+B)$ in the detected stream (signal $S$, uncorrelated background $B$),\n$$g^{(2)}_{\\text{meas}}(0) = 1 - \\rho^{2}\\bigl[\\,1 - g^{(2)}_{\\text{emitter}}(0)\\,\\bigr],$$\nso a true Fock emitter ($g^{(2)}_{\\text{emitter}}=0$) at 70 % purity gives only $g^{(2)}_{\\text{meas}}\\!\\approx\\!0.51$ [16, 31, 32]. Reporting a background-corrected number without the raw number — or vice versa — is the most common provenance failure in single-photon-source datasheets.\n\n**Detector jitter.** The measurement is the convolution of $g^{(2)}(\\tau)$ with the start–stop instrument response function (IRF). When the emitter lifetime $T_1$ is shorter than the IRF FWHM — typical for plasmonically enhanced emitters and many group-IV diamond defects [16, 33] — the dip at $\\tau=0$ is fundamentally smeared. A deconvolved $g^{(2)}(0)$ can legitimately differ from the raw value by an order of magnitude; reporting only one of the two, without the IRF, makes cross-comparison between groups impossible.\n\n**Dark counts and afterpulsing.** SPADs produce a stationary Poissonian dark floor (adds to $B$) *and* afterpulses — a non-Poissonian, dead-time-correlated excess of counts that builds a spurious bunching feature at delays of tens to hundreds of nanoseconds. In pulsed $g^{(2)}$ this inflates the zero-delay peak directly. Superconducting-nanowire detectors remove afterpulsing but bring their own latching pathologies.\n\nFor pulsed excitation the appropriate observable is the *area ratio* of the zero-delay peak to the side peaks; $A_{0}/A_{\\text{side}}\u003c1/2$ is the pulsed analogue of $g^{(2)}(0)\u003c1/2$ and is the form in which single-photon claims should be stated [19].\n\n### The Siegert relation is not a definition of thermal light\n\nThe textbook identity\n$$g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^{2}$$\nis the *Siegert relation*. It holds when the field is (i) stationary, (ii) ergodic, (iii) Gaussian-distributed (a many-mode, central-limit consequence), and (iv) detected with temporal resolution finer than the coherence time $\\tau_c$. Strip any of these and \"$g^{(2)}(0)=2$\" is no longer the marker of chaotic light.\n\n- *Bandwidth.* If $\\tau_R \\gg \\tau_c$ the bunching peak averages out and the apparent zero-delay value collapses to $1+(\\tau_c/\\tau_R)$. The Ádám–Jánossy–Varga (1955) null was exactly this regime: $\\tau_c/\\tau_R\\!\\sim\\!10^{-8}$. \"No bunching from a tungsten lamp through a 10 nm filter and a 1 ns gate\" is a measurement of $\\tau_c/\\tau_R$, not of photon statistics.\n- *Stationarity.* Pulsed sources, transient laser dynamics, switched LEDs and Q-switched amplifiers violate stationarity. Their unnormalised $G^{(2)}(\\tau)$ carries a deterministic envelope that drives the normalised $g^{(2)}(0)$ to values $\u003e2$ — sometimes $\\gg 10$ — without the microscopic state being thermal. The envelope must be divided out before any chaotic-statistics claim [34].\n- *Gaussianity.* Single-mode squeezed vacuum has $g^{(2)}(0)$ that diverges with the squeezing parameter and is *nonclassical*; low-gain SPDC has $g^{(2)}(0)\\!\\sim\\!1+1/\\bar{n}$ reaching $10^{4}$. Tagging these \"thermal-like\" because $g^{(2)}(0)\u003e2$ misses that they sit *above* the classical positive-$P$ upper bound on $g^{(2)}$ at given $g^{(1)}$ [18].\n- *Ergodicity.* A slowly drifting source (mechanical instability, mode hopping) gives time averages that do not converge to the ensemble average over reasonable integration windows. The Martienssen–Spiller rotating-ground-glass lamp [12] was engineered precisely to enforce ergodicity on a laboratory timescale; many ad-hoc pseudo-thermal sources (LED + scatterer + slow rotor) are not.\n\nGeneralised Siegert relations for partially polarised, non-Gaussian or multi-mode fields were laid out by Pedersen and recently revisited for non-stationary illumination [11]. The bare \"$g^{(2)}(0)=2$\" statement is a one-mode-Gaussian special case that the literature still treats as universal.\n\n\u003csvg viewBox=\"0 0 720 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003cline x1=\"40\" y1=\"170\" x2=\"700\" y2=\"170\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"40\" y1=\"165\" x2=\"40\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"200\" y1=\"165\" x2=\"200\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"360\" y1=\"165\" x2=\"360\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"520\" y1=\"165\" x2=\"520\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"680\" y1=\"165\" x2=\"680\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"40\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e0\u003c/text\u003e\u003ctext x=\"200\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1/2\u003c/text\u003e\u003ctext x=\"360\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1\u003c/text\u003e\u003ctext x=\"520\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2\u003c/text\u003e\u003ctext x=\"680\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e≫2\u003c/text\u003e\u003ctext x=\"370\" y=\"225\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eg⁽²⁾(0)\u003c/text\u003e\u003crect x=\"40\" y=\"105\" width=\"160\" height=\"34\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"120\" y=\"127\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003esingle emitter\u003c/text\u003e\u003crect x=\"40\" y=\"55\" width=\"320\" height=\"34\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"200\" y=\"77\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003esub-Poissonian (nonclassical)\u003c/text\u003e\u003cline x1=\"360\" y1=\"40\" x2=\"360\" y2=\"180\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/\u003e\u003ctext x=\"360\" y=\"30\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\"\u003ecoherent\u003c/text\u003e\u003crect x=\"360\" y=\"55\" width=\"160\" height=\"34\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"440\" y=\"77\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003eclassical Gaussian (Siegert)\u003c/text\u003e\u003crect x=\"520\" y=\"105\" width=\"180\" height=\"34\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/\u003e\u003ctext x=\"610\" y=\"127\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003esqueezed / SPDC / pulsed\u003c/text\u003e\u003c/svg\u003e\n*Figure: The $g^{(2)}(0)$ axis with its actual regime boundaries. The 1/2 threshold separates \"definitely fewer than two emitters\" from generic sub-Poissonian; values well above 2 are not synonymous with thermal light and routinely come from nonclassical or non-stationary sources.*\n\n### HBT is not Hong–Ou–Mandel, and neither is biphoton interference\n\nA persistent terminological drift calls any \"two photons at two detectors\" measurement \"HBT\" — or, worse, \"two-photon interference\". Three distinct phenomena live in that geometry.\n\n1. **HBT.** Second-order intensity correlation $G^{(2)}(\\tau) = \\langle I_1(t)I_2(t+\\tau)\\rangle$ measured by a splitter and two counters, sensitive to the squared modulus of the field correlation. Fully classical for chaotic light; nonclassical only when $g^{(2)}(0)\u003c1$ or when the classical Cauchy–Schwarz bound on cross-correlations is violated.\n2. **Hong–Ou–Mandel.** Two indistinguishable single photons entering opposite ports of a 50:50 beamsplitter produce $(|2,0\\rangle-|0,2\\rangle)/\\sqrt{2}$ at the outputs, so the coincidence rate vanishes at zero delay [18, 19]. This is a *fourth-order amplitude* interference: the two-photon probability amplitude has two indistinguishable paths (transmit–transmit and reflect–reflect) that cancel. No classical analogue. The dip *visibility* measures indistinguishability; the dip *width* is the single-photon wavepacket overlap, not the source coherence in the HBT sense.\n3. **Biphoton interference.** SPDC and other entangled pair sources produce states whose joint correlation $\\langle E^{(-)}_1 E^{(-)}_2 E^{(+)}_2 E^{(+)}_1\\rangle$ exhibits nonlocal fringes (Franson interferometry, ghost imaging) not captured by either $g^{(1)}$ or the conventionally normalised HBT $G^{(2)}$. The observable is the joint detection rate as a function of two independently controlled phases, not a time-delay autocorrelation.\n\nThe geometric similarity — splitter, two counters, delay axis — is the entire reason the conflation persists. The physical distinction is unambiguous: HBT lives in the photon-number-statistics sector of the theory, HOM and biphoton interference in the indistinguishability/amplitude sector. Stankus and collaborators' recent revival of two-photon amplitude interferometry for astrometry [35] is explicit on this point: the proposed instrument is *not* HBT, even with two telescopes and two detectors, because the observable is the biphoton amplitude after path-distinguishability erasure, not $\\langle I_1 I_2\\rangle$. The literature would be cleaner if every \"HBT-style\" paper began by stating which sector it is in."}, {"id": "descendants-femtoscopy-and-many-body", "title": "Descendants: Bose–Einstein Correlations in Heavy Ions, Femtoscopy, and Noise Interferometry in Quantum Matter", "markdown": "## Descendants: Bose–Einstein Correlations in Heavy Ions, Femtoscopy, and Noise Interferometry in Quantum Matter\n\nBy the late 1960s the optical question was effectively settled — Glauber and Sudarshan had quantised the observable, Narrabri was running, and the original 1956 controversy had migrated to the appendices. The HBT *geometry*, however — two detectors, one second-order correlator, one source of unknown extent — turned out to be portable in a way the optical pioneers cannot have anticipated. Wherever the first-order field is inaccessible, either because the \"field\" is a probability amplitude with no measurable phase (multi-particle final states) or because the source is incoherent at every wavelength of interest (a many-body lattice state), the second-order correlator survives as a structural probe. The next forty years are the history of that portability.\n\n### From GGLP to femtoscopy\n\nThe transplant was not anticipated. In 1959 the Goldhaber–Goldhaber–Lee–Pais collaboration was looking for a $\\rho$-like resonance in like-sign pion pairs produced in $\\bar p p$ annihilation at the Bevatron; what they found, instead, was a smooth enhancement at small relative momentum $q = p_1 - p_2$, present in identical-charge pairs and absent in opposite-charge pairs [23]. Their 1960 paper attributed the effect to the symmetrisation of the multi-pion wavefunction with no reference to Hanbury Brown or Twiss [24, 23]. The optical pedigree was attached *post hoc*: the same Gaussian source of root-mean-square radius $R$ gives, for chaotic emission of identical bosons,\n\n$$C_2(q) \\;=\\; \\frac{P(p_1,p_2)}{P(p_1)P(p_2)} \\;=\\; 1 + \\lambda\\,\\big|\\tilde\\rho(q)\\big|^2,$$\n\nwith $\\tilde\\rho$ the Fourier transform of the (normalised) emission density and $\\lambda \\in [12]$ a phenomenological \"chaoticity\" that absorbs coherent emission, long-lived resonance decays, and pair-purity losses. This is the Siegert relation of §2 with a relativistic kinematic relabelling; the bosons are pions, the \"intensity\" is the inclusive single-particle spectrum, the \"coherence area\" is the source.\n\nThe formalism became quantitative in two steps. Kopylov and Podgoretsky in the early 1970s introduced the now-standard decomposition of $q$ into longitudinal, outward, and sideward components (along the beam, along the pair transverse momentum, perpendicular to both) so that the three Gaussian radii $R_{\\rm long}, R_{\\rm out}, R_{\\rm side}$ become separately fittable from a single dataset. Koonin (1977) and Pratt (1984/1986) then closed the loop by including final-state Coulomb and strong interactions explicitly: the observed correlation function becomes a convolution of the emission source $S(x,p)$ with the squared two-particle relative wavefunction,\n\n$$C_2(q) - 1 \\;=\\; \\int d^4x_1\\,d^4x_2\\; S(x_1,p_1)\\,S(x_2,p_2)\\,\\big[\\,|\\Psi(q,r)|^2 - 1\\,\\big],$$\n\na relation that holds for any pair (identical or not, bosonic or fermionic, with or without final-state interaction). This Koonin–Pratt kernel is what subatomic physicists today call *femtoscopy*, and it is what makes the technique usable for non-identical pairs — $K^0_{\\rm s} K^0_{\\rm s}$, $p\\Lambda$, $\\Lambda\\Lambda$, and recently charmed mesons [36] — where ordinary HBT bunching is invisible but the wavefunction encodes a measurable source-size dependence.\n\nThe synthesis was crystallised in the 1990 Boal–Gelbke–Jennings *Reviews of Modern Physics* article [25], which is still the canonical reference; the Baym 1998 lectures [10] are the cleanest exposition of the bridge back to optics, and Florkowski's monograph [29] gives the modern AA-collision treatment. The technique is now built into every major heavy-ion experiment: the STAR collaboration's $\\sqrt{s_{NN}}=130$ GeV and 200 GeV Au+Au analyses [26, 27] report $R_{\\rm out}, R_{\\rm side}, R_{\\rm long} \\sim 5{-}7$ fm — sub-femtoscale by their own internal precision — and have produced the only quantitative measurements of the freeze-out hypersurface in QGP-forming collisions. The Frodermann–Heinz photon-HBT calculation [37] extends the same machinery to direct photons, and Dusling–Li–Schenke [38] document the migration of the technique into small ($p+p$, $p+A$) systems where collectivity was historically considered impossible.\n\n### What the heavy-ion practitioners spent twenty years fixing\n\nThree conflations from §6 acquired specifically subatomic forms. First, the Siegert assumption of a *stationary chaotic* source fails for an exploding fireball: collective flow correlates the emission point with the emitted momentum, so the apparent source seen by a pair at $K = (p_1+p_2)/2$ is the *homogeneity region* at that $K$, not the full source. Wong's flow-corrected kernel [39] and the Frodermann–Heinz treatment make this explicit. Second, Gyulassy's 1982 PRL [28] is the standard early warning that not every two-particle correlation enhancement at small $q$ is HBT — dynamical correlations from minijets, resonance feeddown, and energy-momentum conservation all generate look-alike signals. Third, the famous *RHIC HBT puzzle* — the ratio $R_{\\rm out}/R_{\\rm side}\\simeq 1$ rather than the hydrodynamically predicted $\\gtrsim 1.5$ — is now understood as the failure of older fireball codes to handle a stiff equation of state and viscous corrections together, not a failure of the HBT formalism itself. The observable was telling the truth; the model was wrong.\n\n### Noise interferometry in quantum matter\n\nThe cold-atom revival was an act of deliberate import. In 2005 Altman, Demler and Lukin pointed out that for an interacting many-body state expanded ballistically into a time-of-flight cloud, the *density* at a TOF point $\\mathbf{r}$ samples the *momentum-space* occupation $n(\\mathbf{k})$ at $\\mathbf{k} = m\\mathbf{r}/\\hbar t$, so a second-order intensity correlation across the cloud is — exactly — a momentum-space $g^{(2)}$:\n\n$$G^{(2)}(\\mathbf{k},\\mathbf{k}') \\;=\\; \\langle\\,\\hat n_\\mathbf{k}\\,\\hat n_{\\mathbf{k}'}\\,\\rangle.$$\n\nFölling et al. [30] implemented this within months for $^{87}$Rb in a 3-D optical lattice and demonstrated the structural payoff: a superfluid shows the smooth Bose-bunching peak, while a Mott insulator shows sharp $\\delta$-function spikes at reciprocal-lattice vectors, because each lattice site is a number-squeezed mini-condensate and the correlation function picks up the Bragg structure of the underlying crystal. The first-order interference pattern — which a deep Mott state by construction *cannot* show — is replaced by a second-order pattern that is in fact richer.\n\nThe fermionic counterpart followed: $^3$He on a microchannel-plate detector exhibits the Pauli dip $g^{(2)}(0)\u003c1$ where $^4$He shows the bosonic bunching peak, in one of the cleanest single-experiment demonstrations of quantum statistics ever recorded. Electron analogues had been seen earlier in mesoscopic conductors — antibunching at a beamsplitter in a 2DEG — and the optomechanical extension came with Cohen et al.'s phonon HBT on a nanomechanical mode [17], which measures $g^{(2)}(0)$ of mechanical quanta via Raman side-band detection. Across all of these, the underlying logic is identical to Purcell's 1956 sentence: bunching for chaotic bosons, $g^{(2)}(0)=1$ for coherent modes, sub-unity for fermions or for engineered nonclassical states. What changes is only the carrier — pions, phonons, atoms, electrons — and the substitute for the missing first-order interferometer.\n\nThe lesson the subatomic and many-body extensions share is the one §2 implied and §4 made formal: $g^{(2)}$ is a *statistical* observable that requires only ensemble stationarity (or its experimental surrogate, repeated cold-shot preparation) plus an emission model. It does not require phase stability, a coherent reference, or a working first-order interferometer. Wherever those are unavailable — relativistic final states, strongly correlated cold gases, sub-wavelength stellar disks — HBT remains the second-order machinery that survives."}, {"id": "frontier-and-open-problems", "title": "Frontier: Stellar Intensity Interferometry with Cherenkov Arrays, Multi-Photon g^(n), and Nonstationary Sources", "markdown": "## Frontier: Stellar Intensity Interferometry with Cherenkov Arrays, Multi-Photon g^(n), and Nonstationary Sources\n\nFor three decades after Narrabri (§5) the intensity interferometer was the technique that had outlived its niche. The field rests on four live problems now: large-aperture sub-mas optical astronomy on infrastructure built for $\\gamma$-rays; photon-counting distributions $P(n)$ and $g^{(n)}$ as nonclassicality witnesses that go strictly beyond Hong–Ou–Mandel and beyond $g^{(2)}$; a sharpening of what \"second-order coherence\" even means once the source is pulsed, transient, or non-Gaussian and the Siegert relation no longer applies; and the generalisation of $g^{(2)}$ to structured, twisted, and multi-mode fields where the relevant correlation is no longer between two scalar amplitudes at two points.\n\n### Stellar SII on Cherenkov arrays\n\nThe revival is the cleanest case where modern hardware reopened a closed problem. The driver is technological — sub-nanosecond timing, GHz photon counting, and GPU correlation — rather than conceptual: the physics is still the Narrabri physics of §5. VERITAS adapted its four 12 m IACTs at the Fred Lawrence Whipple Observatory into a stellar intensity interferometer (SII) in 2019, first reporting sub-milliarcsecond diameters of $\\beta$ CMa and $\\epsilon$ Ori with $\u003e5\\%$ precision in [Abeysekara *et al.* 2020](https://www.nature.com/articles/s41550-020-1143-y) and a $1.07 \\pm 0.04_\\mathrm{stat} \\pm 0.05_\\mathrm{sys}$ mas limb-darkened diameter of $\\beta$ UMa at 416 nm in [Acharyya *et al.* 2024](https://iopscience.iop.org/article/10.3847/1538-4357/ad2b68); ~48 targets have been surveyed at the time of writing. MAGIC at La Palma has done the analogous job with two 17 m dishes and a real-time, dead-time-free GPU correlator: 22 angular diameters in [Abe *et al.* 2024](https://academic.oup.com/mnras/article/529/4/4387/7625603) (13 of them previously unmeasured), and an extension that pulls in CTAO-LST1 as a third aperture for binary resolution at mas separations ([Will *et al.* 2025](https://arxiv.org/abs/2506.04994)). The forward projection is on the CTA design baselines [40]: $\\sim$ km between O(100) IACTs gives $\\sim 30~\\mu$as at 350 nm with thousands of simultaneous (u,v) samples, an angular resolution no amplitude interferometer can plausibly reach in the optical. The remaining systematic is not photon noise but the squared signal-to-noise scaling: $\\mathrm{SNR}\\propto A\\,\\alpha\\,n\\sqrt{\\Delta f\\,T}$, so the gain comes from $A\\,n$ — aperture times spectral degeneracy — not from $\\Delta f$. Atmospheric piston is irrelevant by construction; atmospheric photon-arrival statistics are not, and Cavazzani *et al.* have flagged that even free-atmosphere intensity fluctuations enter the SNR budget when integration times approach the outer-scale crossing time [34].\n\n### Beyond $g^{(2)}$: $g^{(n)}$ and full-counting statistics\n\nThe single number $g^{(2)}(0)$ is a marginal of the photon-counting distribution $P(n)$. SNSPDs that genuinely resolve photon number — kinetic-inductance arrays now reach $\\sim$ 100 click-resolution at near-unit efficiency ([Eaton *et al.* 2023](https://www.nature.com/articles/s41566-022-01119-3)) — make the full distribution measurable and have already pushed direct factorial-moment estimation of $g^{(n)}$ up to $n \\sim 15$ in waveguide-integrated sources. The witnesses that decisively need $n\u003e2$ are the higher Klyshko / Lee non-classicality inequalities\n\n$$g^{(n)}(0) \u003c \\frac{n-1}{n}\\,g^{(n-1)}(0), \\qquad n \\ge 2,$$\n\nwhich are strict implications of a positive Glauber–Sudarshan $P$ (§4) and to which $g^{(2)}(0)\u003c1$ is the $n=2$ instance. Single-emitter sources that pass the $n=2$ bound can still fail the $n=3$ one, exposing residual multi-photon leakage that single-coincidence HBT setups never see; conversely twin-beam and squeezed-vacuum sources fail the $n=2$ bound the other way (super-bunching) but exhibit characteristic $g^{(n)}$ ladders that flag *which* P-function is positive. The mechanical analogue carries through: Cohen *et al.* did intensity interferometry on the phonon side of an optomechanical crystal, confirming thermal $g^{(2)}(0)\\approx 2$ Bose statistics for the phonon mode and laying the protocol for $g^{(n)}$ on long-lived non-photonic excitations [17]. Hybrid light-matter integrated circuits — quantum-dot–photonic-crystal platforms with on-chip multiplexed counting — are now the workhorse for full $P(n)$ characterisation of pulsed emission [41].\n\n### Nonstationary, non-Gaussian, and what \"Siegert\" survives\n\nThe Siegert relation $g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2$ (§2) requires stationarity, ergodicity, and Gaussian-circular field statistics. Each of these fails in a different and increasingly common regime. Pulsed single-emitter spectroscopy is non-stationary by construction: one must define the windowed quantity\n\n$$g^{(2)}_p(\\tau) = \\frac{\\int\\!dt\\,\\langle:\\!\\hat n(t)\\hat n(t+\\tau)\\!:\\rangle}{\\bigl[\\int\\!dt\\,\\langle \\hat n(t)\\rangle\\bigr]^2}$$\n\nand read off peak ratios in a coincidence histogram, not an autocorrelation in $\\tau$. Driven atomic clouds give $g^{(2)}(0)\u003c2$ chaotic light at threshold-like crossover points — the residual coherent component is non-zero, the fourth cumulant is non-zero, and the Siegert identity becomes a one-sided bound rather than an equality ([Ferioli *et al.* 2020](https://arxiv.org/abs/2002.05425); see also the nanolaser-regime revision in [Lebreton *et al.* 2013](https://www.researchgate.net/publication/359786099_Revisiting_the_Siegert_relation_for_the_partially_coherent_regime_of_nanolasers)). Recent work proposes generalised Siegert identities that hold for broader random-light classes by separating coherent and incoherent backgrounds in the field correlator [11]; ultracold superradiant arrays push the question further, where the relevant emission is pulsed, sub-radiant-tailed and has $g^{(2)}(\\tau)$ structure that encodes the cooperative decay spectrum rather than a stationary first-order coherence [42]. The operational lesson — recurrent in §6 — is that any $g^{(2)}$ value reported without a stated assumption about stationarity and Gaussian statistics is uninterpretable, and the literature is increasingly disciplined about which formulation is being used [43].\n\n### Structured light: HBT in the OAM basis\n\nFor paraxial fields that carry orbital angular momentum $\\ell\\hbar$ per photon [44], the natural second-order observable is not a two-point spatial correlator but a correlator between OAM-mode populations. For pseudothermal vortex light one finds an azimuthal HBT effect:\n\n$$\\langle \\hat n_{\\ell_1}\\hat n_{\\ell_2}\\rangle - \\langle \\hat n_{\\ell_1}\\rangle\\langle \\hat n_{\\ell_2}\\rangle \\;\\propto\\; |\\langle a^\\dagger_{\\ell_1} a_{\\ell_2}\\rangle|^2,$$\n\nso that bunching shows up as a sharp peak along $\\ell_1=\\ell_2$ in the joint OAM spectrum, with width set by the coherence in the azimuthal degree of freedom rather than the transverse coordinate ([Magaña-Loaiza *et al.* 2016](https://www.science.org/doi/10.1126/sciadv.1501143)). This is more than a curio: it gives a basis-independent route to second-order coherence in fields with structured modal content (vector beams, Laguerre–Gauss, twisted spinor light), and it cleanly separates the *modal* second-order coherence from the spatial coherence the original HBT geometry measured. The same logic carries over to entangled multi-mode sources, where $g^{(2)}$ measured between specific spatial or polarization modes diagnoses inter-modal coherence the scalar HBT collapses out.\n\n### Two-photon amplitude interferometry — the quantum-astrometry alternative\n\nA parallel descendant deserves a clean separation from HBT, because the conflation flagged in §6 keeps reappearing in proposals. Stankus *et al.* have developed a scheme in which photons from two unrelated stars are mixed pairwise at two stations linked only by a classical timing channel; the observable is the *two-photon amplitude* interference fringe, not an intensity-intensity correlation, and the projected astrometric precision is $\\sim 10~\\mu$as in a night between bright sources [35]. This is operationally close to Tsang-style two-source super-resolution [45] and is sometimes mis-marketed as \"next-generation HBT\" — it is not. HBT measures $|g^{(1)}|^2$ envelope; the Stankus scheme measures the *complex* two-photon biphoton amplitude and so carries phase information HBT discards. Whether the proposal survives the engineering — entangled-pair distribution, kHz heralding rates over kilometre baselines — is still open.\n\n### Where the open frontiers actually sit\n\nThree lines of work seem live enough to mention without prediction. First, intensity interferometry as a *microlensing diagnostic*: a recent proposal uses HBT visibility on lensed quasar micro-images to disentangle individual micro-source contributions that collective photometric monitoring cannot separate [46] — an unexpected reuse of the Narrabri visibility curve at cosmological scales. Second, HBT-style correlators as a probe of *quantum-matter dynamics*, where the field is reflected, scattered, or down-converted off a strongly correlated electronic system: photon correlation microscopy now resolves spatial intensity correlations on van der Waals heterostructures with sufficient stability to map exciton-dynamics coherence in 2D semiconductors [47]. Third, the methodological clean-up — generalised Siegert identities for non-Gaussian and non-stationary regimes [11], explicit warnings against the $g^{(2)}(0)\u003c1$ folk-rule for single-emitter certification [43], and standardised reporting of stationarity, gating, jitter deconvolution and background subtraction — is the slow, citation-poor work that keeps the literature interpretable.\n\nSeventy years after the mercury arc, the apparatus is unrecognisable; the question is exactly the one Hanbury Brown and Twiss asked: given two detectors, what does the joint click statistics tell you about the field — and which of those statements survive when the field is not what your textbook assumed?"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough words on this dossier to owe the reader an editorial position. Here it is, unhedged.\n\n### (a) What I will defend with my reputation\n\nThe Siegert relation $g^{(2)}(\\tau)=1+\\beta|g^{(1)}(\\tau)|^{2}$ is correct, derivable in three lines from Gaussian moment factorisation, and the single most useful identity in the field. Purcell's 1956 letter [7] is the conceptual closure of the \"Dirac paradox\" — every modern textbook derivation of thermal bunching is a paraphrase of his single-mode Bose argument, and the credit asymmetry between Purcell and the HBT pair is a historical embarrassment. Glauber's hierarc
