<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Two-Page Hamiltonian: Jaynes–Cummings and the Rotating-Wave Sleight of Hand", "alternativeHeadline": "Jaynes-Cummings model", "name": "Jaynes-Cummings model", "description": "From a 1963 polemic against field quantization to the Rosetta stone — and routine misuse — of strong-coupling QED", "inLanguage": "en", "keywords": ["Jaynes-Cummings model", "JCM", "Jaynes–Cummings Hamiltonian", "single-mode RWA two-level atom–field model", "Jaynes–Cummings–Paul model (German usage)", "dressed-atom model (closely related limit)", "quantum optics"], "about": [{"@type": "Thing", "name": "Jaynes-Cummings model"}, {"@type": "Thing", "name": "JCM"}, {"@type": "Thing", "name": "Jaynes–Cummings Hamiltonian"}, {"@type": "Thing", "name": "single-mode RWA two-level atom–field model"}, {"@type": "Thing", "name": "Jaynes–Cummings–Paul model (German usage)"}, {"@type": "Thing", "name": "dressed-atom model (closely related limit)"}], "articleSection": "quantum optics", "datePublished": "2026-06-11", "dateModified": "2026-06-11", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-two-page-hamiltonian-jaynescummings-and-the-rotating-wav.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-two-page-hamiltonian-jaynescummings-and-the-rotating-wav.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Why This Mattered: A Polemic That Became the Canon Why This Mattered: A Polemic That Became the Canon The Jaynes–Cummings model was not born as a neutral piece of formalism. It was written down to lose an argument — Jaynes's argument, that the electromagnetic field need not be quantized. The 1963 Proceedings of the IEEE paper by E. T. Jaynes and his student F. W. Cummings is, read straight, a brief for the prosecution against orthodox QED. Its strategy was almost cynical in its rigor: take the simplest possible problem in which the predictions of full field quantization and of Jaynes's \"neoclassical\" theory could be put side by side — a single two-level atom interacting with a single resonator mode under the rotating-wave approximation — and ask where they differ. The answer was discrete-photon structure: the \\sqrt{n+1} ladder, the dressed-state splitting at vacuum level (n=0), and ultimately the collapse–revival sequence that no c-number drive can mimic. Jaynes set the trap; the model snapped shut on him. By the late 1980s it had become the textbook proof that the electromagnetic field really is quantized — exactly the opposite of what its author intended. The biographical note on the Bayesian/Jaynes archive at Washington University and the historical retrospective by Larson and Mavrogordatos (arXiv:2202.00330) record that Cummings began the project as a thesis topic around 1957; publication was held up until Jaynes was invited into a special issue of Proc. IEEE on quantum electronics, where the paper was timed to function as a manifesto, not a model paper. That polemic register matters because it sets the model's place in a longer arc. Provenance: Rabi (1936), Dicke (1954), and a quiet German cousin (1963) The c-number skeleton was already there. Rabi's 1936 treatment of magnetic resonance gave the formula for population oscillation between two levels driven on resonance — what we now call the Rabi formula — under exactly the approximation later dignified as the RWA. Dicke's 1954 paper on superradiance went further and wrote down N two-level atoms coupled to a single quantized mode, with counter-rotating terms still in place; the single-atom restriction of Dicke's Hamiltonian, with the RWA applied, is the JCM. Neither Rabi nor Dicke isolated the one-atom one-mode object as a clean exactly-solvable quantum problem. Jaynes and Cummings did, and they did so for a particular polemical reason — they needed an exactly soluble fully quantized benchmark to compare against neoclassical theory. The credit drift here is not in attaching the names of Jaynes and Cummings — that is faithful to who wrote the 1963 paper — but in erasing Harry Paul. Paul, working in East Berlin, published in 1963 in Annalen der Physik (Leipzig) a derivation of essentially the same RWA atom–mode Hamiltonian ; the paper appeared in German under the title \"Die Kohärenz der induzierten Strahlung\" (Wiley record). It was almost invisible to the Anglophone laser-physics community then and largely remains so. In DDR-era and several European pedagogical traditions the object is still called the Jaynes–Cummings–Paul model — and that is the historically correct attribution. The corpus already names Paul's contemporaneity , Stenholm's Bargmann-representation refinement , and the Tavis–Cummings N-atom extension ; the broader point is that the 1963 Hamiltonian sits at a confluence, not at an origin point. From bench oddity to canon: 1965 → 1980 → 1987 What turned a polemical exhibit into a paradigm was a sequence in three movements. In 1965 Cummings, working alone, showed that for an initial coherent field the atomic inversion collapses on a time scale t c \\sim 1/g — already a non-semiclassical feature, since a classical noisy field can reproduce the collapse alone. This single-author result is missing from almost every textbook telling that ascribes the entire collapse–revival saga to Eberly. In 1980 Eberly, Narozhny, and Sánchez-Mondragón showed that the collapse is followed by periodic revivals at t r \\sim 2\\pi\\sqrt{\\bar n}/g, a structure with no semiclassical analog whatsoever, dictated entirely by the discreteness of the photon number distribution and the irrational \\sqrt{n+1} frequencies on the JCM ladder. The 1981–82 burst of work — Sukumar–Buck's multi-photon extension , Knight and Radmore on coherent-state dephasing and revival [24, 25], Meystre–Zubairy on squeezing , Singh on field statistics , Sánchez-Mondragón, Narozhny, and Eberly on the spontaneous-emission line shape inside an ideal cavity [13, 74] — established that the model was not a curiosity but a generator of distinctively quantum signatures across the observables of quantum optics. Yoo and Eberly's 1985 Physics Reports review codified the framework; Shore and Knight's 1993 monograph-length article , titled simply \"The Jaynes–Cummings Model,\" fixed the name. Then Garching closed the loop. Rempe, Walther, and Klein's 1987 observation of collapse and revival of Rabi nutation in a one-atom maser was, in a clean sense, the first experimental signature of field quantization beyond the photoelectric effect — and it confirmed the model whose author had built it as a weapon against quantization. Within a decade the ENS group resolved the \\sqrt{n+1} ladder directly via vacuum Rabi oscillations with Rydberg atoms in a superconducting cavity , and by 2004 the Yale circuit-QED program had ported the same Hamiltonian into superconducting circuits [77, 80]. That portability — atom–photon, ion–phonon, transmon–microwave, quantum-dot–exciton-polariton — is why a two-page Hamiltonian became a Rosetta stone. Every strong-coupling platform of the last forty years describes itself, at zeroth order, by writing H {\\text{JC}} = \\omega c a^\\dagger a + \\tfrac{1}{2}\\omega q \\sigma z + g(a\\sigma + + a^\\dagger \\sigma -) on the board. The remainder of this dossier is about exactly what gets lost when one stops at zeroth order. Sources: - Larson \u0026 Mavrogordatos, \"The Jaynes–Cummings model and its descendants\" (arXiv:2202.00330) - E. T. Jaynes bibliography, Washington University - H. Paul, \"Die Kohärenz der induzierten Strahlung,\" Annalen der Physik 467, 290 (1963) The Physics, Properly: Hamiltonian, Dressed Ladder, Collapse and Revival The Physics, Properly: Hamiltonian, Dressed Ladder, Collapse and Revival Start with minimal coupling for a bound electron in V(\\mathbf{r}) and a single transverse cavity mode, The Jaynes–Cummings Hamiltonian is what survives after seven approximations, each of which deserves a name and a domain of validity. - A1 — Two-level truncation. Project the matter onto \\{ g\\rangle, e\\rangle\\} at splitting \\hbar\\omega 0; the dipole becomes \\mathbf{d}=\\mathbf{d} {eg}(\\sigma {+}+\\sigma {-}). Valid when no other transition is near-resonant and the field is too weak to drive interband leakage. - A2 — Single-mode quantization. Keep one cavity mode: \\mathbf{A}(0)=\\boldsymbol{\\varepsilon}\\sqrt{\\hbar/2\\varepsilon 0\\omega V}\\,(a+a^{\\dagger}). Valid when only one mode lies within the coupling bandwidth. - A3 — Dipole / long wavelength. \\mathbf{A}(\\mathbf{r})\\to\\mathbf{A}(0), i.e. k a {\\text{atom}}\\!\\ll\\!1. - A4 — Rotating-wave. The bilinear coupling g(\\sigma {+}+\\sigma {-})(a+a^{\\dagger}) yields four terms; discard \\sigma {+}a^{\\dagger} and \\sigma {-}a, which rotate at \\omega {0}+\\omega. Valid for g, \\Delta \\ll\\omega+\\omega {0} with \\Delta\\equiv\\omega {0}-\\omega. - A5 — Drop A^{2} (diamagnetic / TRK). Removes a c-number cavity-frequency renormalization and the term that, retained, blocks an equilibrium superradiant transition. Admissible only when g/\\omega\\!\\ll\\!1. - A6 — Fixed gauge. Work consistently in dipole (Power–Zienau–Woolley) gauge throughout. Mixing gauges after A1/A4 produces spurious answers — the gauge-invariance literature on ultrastrong coupling is essentially a catalog of A6 violations. - A7 — Closed, lossless, zero-temperature cavity. No \\kappa, \\gamma, \\bar n {\\text{th}}. Reintroduce as Lindbladians before comparing to experiment. What remains is the two-page Hamiltonian, with single-photon vacuum Rabi coupling g=-\\mathbf{d} {eg}\\!\\cdot\\!\\boldsymbol{\\varepsilon}\\sqrt{\\omega/2\\varepsilon {0}\\hbar V}. The structural payoff of A4 is a conservation law. The excitation operator commutes with H {\\text{JC}}: throwing away the counter-rotators promotes the Rabi-model's \\mathbb{Z} {2} parity to a continuous U(1) symmetry. This is the genuine difference between Jaynes–Cummings and quantum Rabi physics — not solvability, since Braak proved the Rabi model integrable. Inside each fixed-N subspace \\{ e,n\\rangle, g,n+1\\rangle\\} the Hamiltonian is a 2\\!\\times\\!2 block, with eigenvalues and eigenvectors n,+\\rangle=\\cos\\tfrac{\\theta n}{2} e,n\\rangle+\\sin\\tfrac{\\theta n}{2} g,n+1\\rangle, n,-\\rangle=-\\sin\\tfrac{\\theta n}{2} e,n\\rangle+\\cos\\tfrac{\\theta n}{2} g,n+1\\rangle, with \\tan\\theta {n}=2g\\sqrt{n+1}/\\Delta. At resonance the splitting on rung n collapses to 2g\\sqrt{n+1}. The n=0 rung — splitting 2g in the absence of photons — is the vacuum Rabi splitting . The \\sqrt{n+1} scaling of higher rungs is the strictly quantum content: a coupled-oscillator Lorentz model reproduces the n=0 peak but not the ladder spacing. Figure: Eigenspectrum of H {\\text{JC}} at \\Delta=0. Each fixed-N doublet (blue, dashed) hybridizes into a pair of dressed states n,\\pm\\rangle (orange) split by 2g\\sqrt{n+1} (red). The lone ground state g,0\\rangle (green) is decoupled. The \\sqrt{n+1} rung scaling — not the existence of an n=0 splitting — is the strictly quantum content. For dynamics, take \\psi(0)\\rangle= e\\rangle\\otimes \\alpha\\rangle with \\bar n= \\alpha ^{2}. At resonance the inversion is The Poisson distribution has width \\Delta n=\\sqrt{\\bar n}. The dressed Rabi frequencies 2g\\sqrt{n+1} span a band \\Delta\\Omega \\simeq (2g\\cdot\\tfrac{1}{2}/\\sqrt{\\bar n})\\cdot\\sqrt{\\bar n}=g, so incoherent dephasing produces the collapse identified by Cummings already in 1965 and routinely miscredited. For large \\bar n the adjacent-rung spacing is and the discrete sum rephases when this spacing times t crosses 2\\pi, yielding the revival of Eberly–Narozhny–Sánchez-Mondragón . The ratio t {R}/t {c}\\sim\\sqrt{\\bar n} controls visibility: roughly \\sqrt{\\bar n} revivals survive before nonlinearity of \\sqrt{n+1} smears them into a quasi-stationary signal. No semiclassical theory — Jaynes's neoclassical included — produces a revival; their observation in the Garching one-atom maser is what turned the model from polemic into canon. Strict Conditions and Failure Modes: Where Each Assumption Dies Strict Conditions and Failure Modes: Where Each Assumption Dies The Hamiltonian written in §2 sits on seven load-bearing assumptions (A1–A7). Each fails in a specific, calibrated way in modern hardware; reading \"JCM physics\" out of an experiment that has crossed one of these lines is the standard way a result quietly stops being about the Jaynes–Cummings model. A1 — Atom truncated to two levels JCM uses a single g\\rangle\\!\\leftrightarrow\\! e\\rangle doublet under the premise that the next dipole-allowed transition is detuned by far more than g. This dies as soon as the anharmonicity \\alpha = \\omega {ef}-\\omega {ge} becomes comparable to g. Transmons sit precisely in that danger zone — weakly anharmonic by design, with \\alpha/2\\pi \\approx -E C/h \\approx -200 to -300\\ \\text{MHz}, while couplings in circuit QED routinely reach g/2\\pi \\in [50, 300]\\ \\text{MHz} [77, 80, 57]. The ratio g/ \\alpha \\in [0.2, 1.5] means the f\\rangle rung is dressed on the same timescale as e\\rangle: leakage out of the computational subspace is not a perturbation but part of the dynamics. The correct minimal Hamiltonian is then a Duffing/Kerr-oscillator JC ladder (often written down as a multilevel generalized JCM), or — when several emitters share the mode — the Tavis–Cummings model , which preserves U(1) and the \\sqrt{N} collective enhancement. A2 — Single-mode field Replacing the EM continuum by one mode demands that no other cavity mode lies within \\sim g of \\omega c and that the free-space continuum is suppressed. Two corrections appear. (i) Purcell decay: residual coupling to the dispersive cavity tail gives \\gamma P = \\kappa\\, g^2/\\Delta^2, the dominant T 1 channel for detuned transmons. (ii) The Lamb shift: integrating out distant modes renormalizes \\omega {ge} by \\sum k g k^2/(\\omega {ge}-\\omega k). In open-cavity Rydberg geometries and in optical free-space coupling, the multimode bath is precisely the structure one cannot delete; the correct object is the input–output multimode JC, reducing in the broad-band limit to a Wigner–Weisskopf Lindbladian. A3 — Dipole approximation The replacement e^{i\\mathbf{k}\\cdot\\mathbf{r}}\\!\\to\\!1 requires \\lambda\\gg a {\\rm emitter}. Cavity QED with Rydbergs or trapped atoms satisfies this by orders of magnitude; plasmonic nanocavities do not. Chikkaraddy et al.'s single-molecule strong coupling at room temperature operates with effective mode volumes V {\\rm eff}\\sim 40\\ \\text{nm}^3 \\sim 10^{-7}\\lambda^3 inside a \\sim 1\\ \\text{nm} NPoM gap, so the field varies appreciably across a molecule of \\sim 0.5 nm. The \"two-level dipole\" reading then underestimates the coupling, ignores higher multipole channels and quenching, and treats g as a phenomenological fit parameter rather than a derived dipole matrix element . A4 — Rotating-wave approximation The RWA discards g(a^\\dagger\\sigma + + a\\sigma -) on the grounds that they oscillate at \\omega a+\\omega c and average to zero for g\\ll \\omega {a,c}. The leading correction is the Bloch–Siegert shift \\delta {\\rm BS}\\simeq g^2/(2\\omega) together with virtual-photon dressing of 0,g\\rangle. Niemczyk et al. resolved the first explicit Bloch–Siegert signature in a flux-qubit/LC oscillator at g/\\omega \\approx 0.12; Forn-Díaz et al. reached the same threshold in a coplanar architecture. Above the ultrastrong threshold g/\\omega\\gtrsim 0.1, the quantum Rabi Hamiltonian — integrable in Braak's transcendental sense but with only \\mathbb{Z} 2 parity, not U(1) excitation number — is mandatory; above g/\\omega\\gtrsim 1 (deep-strong) the ground state is a polaron-dressed two-mode squeezed vacuum, and \"atom\" and \"photon\" cease to be useful asymptotic labels . A5 and A6 — Gauge choice and the A^2 term A5 chooses a gauge (typically multipolar/Power–Zienau–Woolley after a Göppert-Mayer transform) so that H {\\rm int}\\propto \\mathbf{d}\\cdot\\mathbf{E}. A6 discards the diamagnetic q^2\\mathbf{A}^2/2m that appears in \\mathbf{p}\\cdot\\mathbf{A}. Both are harmless in the strong-coupling regime and gauge-ambiguous once one truncates to two atomic levels in the USC regime: \\mathbf{p}\\cdot\\mathbf{A} and \\mathbf{d}\\cdot\\mathbf{E} projected onto a doublet yield different spectra. The Thomas–Reiche–Kuhn sum rule fixes the \\mathbf{A}^2 coefficient so that, in the untruncated theory, a no-go theorem (Rzążewski–Wódkiewicz–Żakowicz, 1975) (verify) forbids a superradiant phase transition; truncation breaks this and one must restore it by hand. Di Stefano, Settineri, Macrì, Garziano, Stassi, Savasta \u0026 Nori (Nat. Phys. 15, 803, 2019) (verify) showed that the consistent procedure is to truncate in the dipole gauge and let \\mathbf{A}^2 be absorbed by the gauge transformation; doing it the other way around produces spurious ground-state photons of order (g/\\omega)^2, which inflates predicted vacuum populations by tens of percent at g/\\omega\\sim 0.3 . A7 — Closed system, sharp dressed ladder The JCM eigenvalues are \\delta-functions; experiment resolves lines of width \\sim(\\kappa+\\gamma)/2. The strong-coupling criterion g (\\kappa,\\gamma)/4 — the threshold Wallraff et al. crossed and Brune et al. sat well inside — guarantees that the vacuum Rabi doublet 2g and the anharmonic \\sqrt{n+1} spacing are resolved. As \\kappa,\\gamma\\to g, the doublet collapses into a single polariton lineshape and \"JC ladder spectroscopy\" reduces to a Fano-style transmission feature already produced by classical coupled oscillators — the conflation flagged in §1. The correct framework is the dissipative JC master equation, analyzed most cleanly via the quantum-jump unraveling . In the bad-cavity limit \\kappa\\gg g it adiabatically reduces to Purcell-enhanced spontaneous emission and the dressed-state picture is gone; in the bad-emitter limit \\gamma\\gg g the cavity sees a structureless absorber and revivals are erased before the first one arrives — which is why the 1987 Garching observation , with g\\gg\\kappa,\\gamma over many revival periods, remains the cleanest existence proof of A1–A7 holding simultaneously. Signatures: Smoking Guns vs Circumstantial Evidence Signatures: Smoking Guns vs Circumstantial Evidence The literature catalogs many \"signatures of the JCM.\" Most are circumstantial — observable but reproducible by linear-response or semiclassical models with one or two tuning knobs. Only a handful are diagnostic. The organizing question is whether the observation requires the discreteness of cavity photon number, or whether it survives the substitution a \\to \\alpha(t) \\in \\mathbb{C} with suitable noise added. By that criterion the experimental case for JCM physics rests on two pillars; everything else is corroboration. Smoking guns (1) The \\sqrt{n+1} anharmonic dressed ladder. On the n-th excitation manifold the JCM splits the bare doublet \\{\\lvert e,n\\rangle,\\lvert g,n+1\\rangle\\} by 2g\\sqrt{n+1}. The splitting itself is unremarkable — any two coupled oscillators give a doublet. What is unforgeable is the anharmonicity : the ratio of the n=1 to the n=0 splitting is \\sqrt{2}, the n=2 to the n=0 is \\sqrt{3}, and so on. A linear theory — Hopfield polariton, classical Lorentz oscillator coupled to a cavity, any input–output network of harmonic modes — gives the same splitting on every rung, because linearity is exactly the statement that excitations do not interact. Brune et al. resolved this in the time domain for microwave cavity QED with Rydberg atoms, reading off 2g and 2g\\sqrt{2} in successive Rabi nutations after preparing n=0 and n=1 Fock states. Fink and collaborators (Nature 454, 315, 2008) (verify) did the spectroscopic counterpart in a transmon–resonator circuit, mapping the \\sqrt{n} scaling up to n\\sim 5. The discriminating measurement is therefore not \"is there a vacuum Rabi peak?\" but: as the drive is increased, do new transmission lines appear at the predicted \\sqrt{n+1} positions, and do they sharpen rather than broaden? If the doublet remains a doublet that scales linearly with probe amplitude, the data are agnostic about quantization. (2) Collapse and revival with T R\\propto\\sqrt{\\bar n}/g. The Cummings collapse alone — \\langle\\sigma z(t)\\rangle decaying on \\tau c\\sim 1/g — is not diagnostic. The revival at T R\\simeq 2\\pi\\sqrt{\\bar n}/g is. It exists because the spectrum of Rabi frequencies \\{g\\sqrt{n+1}\\} is discrete ; the partial rephasing at T R is the constructive interference of nearest-neighbor beat frequencies g(\\sqrt{n+1}-\\sqrt{n})\\to g/(2\\sqrt{\\bar n}). No classical amplitude distribution — Poisson, Gaussian, Lorentzian — reproduces this rephasing, because integrating over a continuum of Rabi frequencies kills coherence permanently. Rempe, Walther \u0026 Klein caught the full sequence in the Garching one-atom maser in 1987; that figure is the experimental canonization of the JCM. The requirements are uncomfortably steep: a near-coherent intracavity field of well-defined \\bar n, atomic dephasing slower than T R, and statistics enough to see a feature whose visibility is already \\lesssim 30\\% for \\bar n \\sim 5. Figure: The discriminating measurement is rung-by-rung spectroscopy. A doublet at n=0 alone (vacuum Rabi splitting) is reproduced by classical coupled oscillators or Hopfield polaritons; verifying the \\sqrt{n+1} scaling on n\\geq 1 manifolds is what falsifies the linear-response mimic. Circumstantial evidence — and the measurement that promotes it Vacuum Rabi splitting in linear transmission. Two normal-mode peaks separated by 2g in a weak-probe scan are the most reported \"JCM signature\" in the literature and the weakest. Two coupled classical Lorentz oscillators with susceptibilities \\chi a(\\omega), \\chi c(\\omega) generate the same spectrum; so do Hopfield polaritons in linear response. Discriminator: power saturation. A linear system rescales while its peak positions are pinned; the JCM, in cooperativity C\\gtrsim 1, develops photon blockade with new transmission lines at the \\sqrt{n+1} ladder positions and antibunching g^{(2)}(0)\u003c1. Without nonlinear-in-n data the conservative reading is \"strongly coupled,\" not \"field quantized.\" Cummings-style partial collapse of the inversion. The Gaussian envelope \\exp[-(gt)^2/2] on \\langle\\sigma z\\rangle for a coherent state, with collapse time independent of \\bar n, was the heart of Jaynes's neoclassical reading : any classical drive with a broad enough amplitude distribution dephases the Rabi nutation by ensemble averaging over Rabi frequencies, and Knight \u0026 Radmore mapped explicitly how the envelope shape tracks the photon statistics. Discriminator: integration time. Classical noise gives monotonic relaxation; the JCM revives at T R. An inversion-decay experiment terminated at t\\lesssim 1/g is consistent with neoclassical theory and proves nothing. Dispersive shifts. Off-resonance the cavity shifts by \\chi=g^2/\\Delta per atom, and the qubit experiences an ac-Stark shift 2\\chi\\langle n\\rangle. Both are also outputs of a semiclassical polarizability calculation. Discriminator: photon-number resolution. When 2\\chi \\kappa, the qubit spectrum splits into a comb of equally spaced peaks, each labelled by a Fock photon number (Schuster et al., Nature 445, 515, 2007 (verify)). A continuous shift proportional to drive intensity is semiclassical; a discrete comb is JCM. Purcell-enhanced spontaneous emission. Increased decay rate inside a cavity follows from any modified mode density (Goy–Raimond–Gross–Haroche is the cleanest early demonstration). The classical EM-density-of-states calculation suffices; the JCM is unnecessary to explain it, and citing Purcell enhancement as evidence for JCM physics conflates cavity engineering with field quantization. The pattern repeats: each individual \"JCM signature\" has a linear or semiclassical impostor that fits the weak-probe data. Quantization announces itself only through nonlinearity in n — the \\sqrt{n+1} ladder in spectroscopy, the discrete comb in dispersive readout, the revival in time-domain dynamics. Any experimental claim of \"JCM physics\" that lives entirely inside the linear-response regime is, strictly, a claim about strong coupling, not about field quantization. Use and Abuse: How 'JCM Physics' Is Invoked Where It No Longer Holds Use and Abuse: How 'JCM Physics' Is Invoked Where It No Longer Holds The JCM has become a verbal shorthand far broader than its Hamiltonian. The cost is concrete: experiments are sold as \"demonstrations of JCM physics\" in regimes where the JCM is the wrong Hamiltonian, and predictions are imported from it that its assumptions no longer support. Five drift patterns recur. (i) \"Jaynes–Cummings\" pasted onto ultrastrong-coupling spectra In the ultrastrong (USC, g/\\omega c \\gtrsim 0.1) and deep-strong (g/\\omega c \\gtrsim 1) regimes, the counter-rotating term g(a\\sigma - + a^\\dagger\\sigma +) and the diamagnetic A^2 \\propto (a+a^\\dagger)^2 contribution restructure the spectrum and, crucially, the ground state. The new vacuum is a squeezed, virtual-photon-dressed state G\\rangle = \\mathcal{N}\\sum n c n n, \\pm\\rangle with \\langle G a^\\dagger a G \\rangle 0; nothing in the JCM ladder predicts this, because in the JCM 0,g\\rangle is exact and bare. Niemczyk et al. and Forn-Díaz et al. resolved Bloch–Siegert shifts of order g^2/\\omega c that the RWA Hamiltonian cannot reproduce by construction, and the Kockum–Miranowicz–De Liberato–Savasta–Nori review is explicit that \"JCM dressed states\" cease to be eigenstates already at the few-percent level of g/\\omega c. Yet \"Jaynes–Cummings ladder\" still appears in USC titles where what is plotted is a numerical diagonalization of the quantum Rabi or Hopfield Hamiltonian. The diagnostic tell: an experimental paper that quotes g/\\omega c \\gtrsim 0.05 and then writes \"E n = \\omega c n \\pm g\\sqrt{n+1}\" without a Bloch–Siegert correction term. (ii) Cohen-Tannoudji–Reynaud dressed states quietly identified with JCM dressed states The \"dressed atom\" of the Cohen-Tannoudji–Reynaud semiclassical theory dresses the atom with a coherent c-number drive of Rabi frequency \\Omega = dE 0/\\hbar; the level splitting is \\sqrt{\\Delta^2+\\Omega^2}, set by the field amplitude. The JCM dressed states n,\\pm\\rangle split by g\\sqrt{n+1}, set by photon number. The two pictures agree only in the \\bar n \\to \\infty classical limit, where g\\sqrt{\\bar n+1} \\to \\Omega/2. Conflation appears in two characteristic forms: (a) Mollow-triplet measurements in free-space resonance fluorescence described as \"JCM-like sidebands\" — they are not, they are CTR sidebands and require no field quantization; (b) AC-Stark shifts in cavity-QED setups reported as \"evidence of the JCM ladder\" when the measured shift scales linearly with drive power, the CTR signature, rather than with intracavity photon number per the JCM. The honest test is the photon-number dependence of the splitting, not the splitting itself. (iii) \"Vacuum Rabi splitting therefore field quantization\" A doublet in the cavity transmission spectrum at \\omega = \\omega c \\pm g requires only two coupled linear oscillators — the Hopfield polariton and the Fano coupled-oscillator picture both produce it, as does a classical Lorentz model with appropriate susceptibility. The Brune et al. ENS experiment is canonical precisely because it resolved the \\sqrt{n+1} ladder, not because it found a splitting. Yet single-emitter plasmonic-cavity claims of \"strong coupling\" routinely report a vacuum doublet of width \\sim 2g and infer JCM physics from it. The exemplar Chikkaraddy et al. nanocavity result is careful about this — they explicitly discuss the linewidths and the g \\gtrsim (\\gamma+\\kappa)/2 criterion — but the downstream literature is not. Diagnostic phrases that mark a hollow claim: \"observation of vacuum Rabi splitting and hence the JCM regime\"; \"the splitting confirms field quantization\"; any spectrum showing only the n=0 \\to 1 doublet sold as a JCM test without an anharmonic rung at g(\\sqrt{2}-1). (iv) Transmon circuit-QED where \\alpha \\sim g The Blais et al. and Wallraff et al. circuit-QED architecture is described by the JCM in the regime g \\ll \\alpha \\ll \\Delta, where \\alpha = E C/\\hbar is the transmon anharmonicity. Modern transmons frequently operate with \\alpha/2\\pi \\sim 200{-}300 MHz and g/2\\pi \\sim 100{-}200 MHz: the two-level truncation is not benign. Leakage to the f\\rangle state, qubit-induced Kerr on the resonator, and the breakdown of the dispersive Schrieffer–Wolff expansion at \\bar n {\\text{crit}} = (\\Delta/2g)^2 are routinely absorbed into \"non-ideal JCM\" language. The You–Nori review flags exactly this slippage. The diagnostic phrase: a paper that writes the JCM Hamiltonian and then immediately introduces a Kerr term -\\chi (a^\\dagger a)^2 \"from the higher transmon levels\" without noting that this is not a JCM correction but a signal that the JCM was the wrong starting Hamiltonian for that observable. (v) The quiet promotion of Rabi/Hopfield to \"JCM\" The most damaging drift is the cleanest: a Hamiltonian with counter-rotating and A^2 terms is diagonalized numerically, the lowest two excited states are tracked, and the result is labeled \"JCM dressed states.\" Braak's exact solution showed the quantum Rabi model has its own integrability structure built on \\mathbb{Z} 2 parity, distinct from the JCM's U(1) excitation-number conservation. Once \\langle a^\\dagger a \\rangle G \\neq 0, excitation number is not conserved and the polariton ladder is not the JCM ladder — even when the lowest doublet looks similar. Diagnostic phrase: any claim of \"JCM behavior\" that survives turning off the RWA in the simulation, since by construction the JCM is the RWA limit. Hollow-claim phrasebook A paper deserves scepticism when it contains any of: \"we observe JCM physics\" with no \\sqrt{n+1} scaling reported; \"the dressed states split by \\Omega R\" with no specification of whether \\Omega R scales with drive amplitude or photon number; \"ultrastrong JCM coupling\"; \"vacuum Rabi splitting confirms the quantum nature of the field\"; \"JCM ground state\" in a system where g/\\omega c 0.05. Each is, in the strict sense established in §3, a category error. Status and the Believer's Checklist Status and the Believer's Checklist The Jaynes–Cummings model occupies an awkward, productive position in 2026: it is simultaneously the correct effective Hamiltonian over a wide swath of cavity and circuit QED, demonstrably wrong in regimes now routinely accessed, and pedagogically over‑extended into experiments where neither its spectrum nor its dynamics apply. The diagnosis depends entirely on the dimensionless ratios g/\\omega, g/\\kappa, g/\\gamma, and the anharmonicity \\alpha /g — none of which the model itself supplies. Where the JCM is still load-bearing Cavity QED with Rydberg atoms and trapped ions. Here g/\\omega \\lesssim 10^{-5}, A1–A7 hold cleanly, and the model is exact to spectroscopic precision. The Garching collapse–revival sequence and the ENS \\sqrt{n+1} ladder remain the cleanest tests of field quantization on record. Weak‑to‑strong dispersive circuit QED. The transmon–resonator system, truncated to the lowest two transmon levels, is described by the JCM with anharmonicity \\alpha /2\\pi \\sim 200–350 MHz, i.e. \\alpha /\\omega \\approx 0.05–0.08 for E J/E C \\in [20,50] (typical transmon regime). Higher levels enter as perturbative Kerr and dispersive shifts. The dressed‑state language is not a metaphor; it is the basis for every dispersive readout deployed today. Where it visibly breaks Ultrastrong (USC, g/\\omega \\gtrsim 0.1) and deep-strong (DSC, g/\\omega \\gtrsim 1) coupling. The JCM conserves \\hat N = a^\\dagger a + \\sigma +\\sigma -; the real Hamiltonian does not. The vacuum 0,g\\rangle is replaced by a virtual‑photon‑dressed ground state, \\mathrm{U}(1) is broken down to \\mathbb{Z} 2 parity, and Bloch–Siegert shifts and counter-rotating selection rules appear at the percent level [56, 67]. The Kockum–Miranowicz–De Liberato–Savasta–Nori review now classifies a perturbative USC window — Bloch–Siegert‑corrected JCM still usable — extending to roughly g/\\omega \\approx 0.4 for the lowest eigenstates, beyond which the spectrum is non‑perturbative and the Braak transcendental function is unavoidable. Plasmonic and molecular polaritonics at the single‑emitter limit. Splittings of 2g \\sim 100–400 meV at \\omega \\sim 1–2 eV put these platforms at g/\\omega = 0.05–0.20 in environments where the cavity linewidth \\kappa rivals or exceeds g and the mode is strongly non‑Hermitian . A classical coupled‑oscillator / Lorentz‑dielectric model reproduces the observed transmission doublet at the linear‑response level (explicit demonstrations in plasmonic single‑emitter systems). \"JCM physics\" is invoked far more often here than the data warrant. The Believer's Checklist Before AETHER will accept a claim of \"Jaynes–Cummings physics,\" the paper must: 1. Report g/\\omega and g/(\\kappa,\\gamma). The first locates the system on the JCM / USC / DSC axis; the second certifies whether coherent dynamics survive at all. Adjectives (\"strong coupling\") are not numbers. 2. Justify A1 (two‑level truncation) with a measured anharmonicity. State \\alpha and show \\alpha \\gg g, \\kappa, \\gamma and bigger than drive‑induced ac‑Stark and dispersive shifts on the experimental timescale , not in the bare spectrum. 3. Justify A4 (RWA) by bounding the Bloch–Siegert shift. The leading correction \\delta {\\mathrm{BS}} \\approx g^2/[2(\\omega 0+\\omega)] must be smaller than the linewidth or absorbed into the fit. \"RWA assumed\" is not a justification. 4. State the gauge (Coulomb vs dipole) and whether A^2 is included. The TRK sum rule forbids the no‑go-violating superradiant phase transition in the dipole gauge once A^2 is kept; dropping it silently has produced retracted predictions and is the modal error in polaritonic chemistry. 5. Distinguish \\sqrt{n+1} ladder evidence from linear vacuum Rabi splitting. A transmission doublet proves only a coupled‑oscillator regime — Lorentz dielectrics reproduce it. Quantization claims require the nonlinear ladder, photon‑blockade antibunching, or single‑photon Fock-state preparation . 6. For revival claims, show t R scales as 2\\pi\\sqrt{\\bar n}/g. The Cummings (1965) partial collapse alone is reproducible by classical amplitude noise; quantization is in the revival , with the correct \\sqrt{\\bar n} scaling and the predicted modulation envelope [54, 73]. 7. Name Paul, Cummings (1965), Narozhny, and Sánchez-Mondragón where their results are used. Paul's independent 1963 derivation , Cummings's 1965 collapse , and the joint Eberly–Narozhny–Sánchez-Mondragón revival prediction vanish from textbook accounts. Citing them is the difference between physics history and folklore. 8. If g/\\omega \\gtrsim 0.1, do not invoke the JCM. Use the quantum Rabi or Hopfield Hamiltonian, say so, and acknowledge that 0,g\\rangle is not the ground state. \"JCM with ultrastrong corrections\" is an oxymoron once \\mathrm{U}(1) is broken — the residual symmetry is \\mathbb{Z} 2 parity and the spectrum is the Braak transcendental determinant , not the harmonic ladder [55, 69, 81]. The model passes the checklist where the physics is genuinely two‑level, weakly coupled, and rotating‑wave; it fails where modern hardware actually lives. Both facts are equally important, and both are why the 1963 polemic [71, 82] survives as the most-cited two-page Hamiltonian in quantum optics — and the most-misapplied. Sources: - Kockum et al., Nat. Rev. Phys. (USC review) - Fluxonium / transmon dispersive theory, anharmonicity ranges - Single-emitter plasmonic vacuum Rabi splitting The AETHER Verdict The AETHER Verdict I will stake my reputation on a narrow, sharp claim: the Jaynes–Cummings Hamiltonian is the correct effective theory for a single dipole-coupled two-level transition resonantly exchanging excitations with one electromagnetic mode, provided g \\ll \\omega c, \\omega a, the spectator levels lie outside a window of order g\\sqrt{\\bar n}, and the mode lifetime is long compared to g^{-1}. In that window the U(1) symmetry [H, N] = 0 is not a calculational convenience — it is the physical content. The \\sqrt{n+1} ladder, the \\sqrt{\\bar n}-scaled revival at t R = 2\\pi\\sqrt{\\bar n}/g, and the dispersive shift \\chi = g^2/\\Delta have all survived four decades of progressively cleaner experimental assault. I will also defend, against periodic revisionism, that Rempe–Walther–Klein (1987) plus Brune et al. (1996) constitute genuine field-quantization tests — the revival, not the collapse, is what carries the burden. What is shakier than the literature admits, in descending order of how often I have to argue about it: (b1) The A^2 term is harmless. It is not. Once one is honest about the TRK sum rule, dropping \\frac{q^2 A^2}{2m} in the Coulomb gauge while simultaneously taking g/\\omega \\gtrsim 0.1 is internally inconsistent and gauge-fixed answers diverge between Coulomb and dipole gauges in exactly the regime where people now claim \"ultrastrong JCM.\" This is the assumption A4–A5 pair in §3 and it fails silently : the spectrum still looks JCM-like to leading order. (b2) The two-level truncation commutes with the RWA. It does not. Truncating first and rotating-frame-approximating second versus the reverse order gives different gauge-invariant predictions when the bare anharmonicity is not large compared to g. Most transmon papers truncate first by habit; the error is small but not parametrically suppressed. (b3) \"Vacuum Rabi splitting observed\" \\Rightarrow \"JCM verified.\" A linear-response transmission doublet is reproduced by a classical Lorentz oscillator coupled to a cavity. The quantum content lives in the \\sqrt{n} anharmonicity of the ladder, which a single-quadrature linear measurement cannot see. I would retire this sloppy headline tomorrow. (b4) The Markovian master equation respects the JCM symmetry. The standard Lindblad dissipators \\mathcal{D}[a] and \\mathcal{D}[\\sigma -] are derived assuming the bath sees the bare operators; in strong coupling the dressed-basis dissipators differ, and \"thermal equilibrium\" of the JCM under naive Lindblad is not the Gibbs state of H {\\rm JCM}. The three open problems I would actually put my own postdocs on, ranked: 1. Gauge-invariant truncation in deep-strong coupling. Because the entire ultrastrong-coupling industry rests on resolving (b1)–(b2) without sleight of hand. 2. Operational distinguishers between JCM, Rabi, and Hopfield ground states using photon-number-resolved homodyne in circuit QED. The virtual-photon vacuum is the cleanest place quantum field theory ever met an experiment in a fridge. 3. Revival spectroscopy at \\bar n \\sim 1. The \\bar n \\to 0 corner is where collapse–revival, quantum jumps, and measurement back-action interfere — and where Cummings's 1965 single-author calculation has never been pushed to its honest limit. Reading path: 1. Jaynes \u0026 Cummings, Proc. IEEE 51, 89 (1963) — the original, read it once knowing it was written to argue against itself. 2. Paul, Ann. Phys. Leipzig 11, 411 (1963) — the missing co-discoverer; the derivation is cleaner. 3. Eberly, Narozhny \u0026 Sánchez-Mondragón, PRL 44, 1323 (1980) — collapse and revival, with all three authors visible. 4. Rempe, Walther \u0026 Klein, PRL 58, 353 (1987) — the experiment that turned a polemic into canon. 5. Braak, PRL 107, 100401 (2011) — the integrability proof that finally drew the line between JCM and Rabi correctly."}</script>
