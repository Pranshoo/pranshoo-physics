side — a single two-level atom interacting with a single resonator mode under the rotating-wave approximation — and ask where they differ. The answer was discrete-photon structure: the $\\sqrt{n+1}$ ladder, the dressed-state splitting at vacuum level ($n=0$), and ultimately the collapse–revival sequence that no c-number drive can mimic. Jaynes set the trap; the model snapped shut on him. By the late 1980s it had become the textbook proof that the electromagnetic field really is quantized — exactly the opposite of what its author intended. The biographical note on the [Bayesian/Jaynes archive at Washington University](https://bayes.wustl.edu/etj/node1.html) and the historical retrospective by [Larson and Mavrogordatos (arXiv:2202.00330)](https://arxiv.org/pdf/2202.00330) record that Cummings began the project as a thesis topic around 1957; publication was held up until Jaynes was invited into a special issue of Proc. IEEE on quantum electronics, where the paper was timed to function as a manifesto, not a model paper.\n\nThat polemic register matters because it sets the model's place in a longer arc.\n\n### Provenance: Rabi (1936), Dicke (1954), and a quiet German cousin (1963)\n\nThe c-number skeleton was already there. Rabi's 1936 treatment of magnetic resonance gave the formula for population oscillation between two levels driven on resonance — what we now call the Rabi formula — under exactly the approximation later dignified as the RWA. Dicke's 1954 paper on superradiance went further and wrote down $N$ two-level atoms coupled to a single quantized mode, with counter-rotating terms still in place; the single-atom restriction of Dicke's Hamiltonian, with the RWA applied, *is* the JCM. Neither Rabi nor Dicke isolated the one-atom one-mode object as a clean exactly-solvable quantum problem. Jaynes and Cummings did, and they did so for a particular polemical reason — they needed an exactly soluble fully quantized benchmark to compare against neoclassical theory.\n\nThe credit drift here is not in attaching the names of Jaynes and Cummings — that is faithful to who wrote the 1963 paper — but in erasing Harry Paul. Paul, working in East Berlin, published in 1963 in *Annalen der Physik (Leipzig)* a derivation of essentially the same RWA atom–mode Hamiltonian [82]; the paper appeared in German under the title \"Die Kohärenz der induzierten Strahlung\" ([Wiley record](https://onlinelibrary.wiley.com/doi/abs/10.1002/andp.19634670507)). It was almost invisible to the Anglophone laser-physics community then and largely remains so. In DDR-era and several European pedagogical traditions the object is still called the **Jaynes–Cummings–Paul model** — and that is the historically correct attribution. The corpus already names Paul's contemporaneity [82], Stenholm's Bargmann-representation refinement [15], and the Tavis–Cummings $N$-atom extension [79]; the broader point is that the 1963 Hamiltonian sits at a confluence, not at an origin point.\n\n### From bench oddity to canon: 1965 → 1980 → 1987\n\nWhat turned a polemical exhibit into a paradigm was a sequence in three movements. In 1965 Cummings, working alone, showed [72] that for an initial coherent field the atomic inversion *collapses* on a time scale $t_c \\sim 1/g$ — already a non-semiclassical feature, since a classical noisy field can reproduce the collapse alone. This single-author result is missing from almost every textbook telling that ascribes the entire collapse–revival saga to Eberly. In 1980 Eberly, Narozhny, and Sánchez-Mondragón [73] showed that the collapse is followed by *periodic revivals* at $t_r \\sim 2\\pi\\sqrt{\\bar n}/g$, a structure with no semiclassical analog whatsoever, dictated entirely by the discreteness of the photon number distribution and the irrational $\\sqrt{n+1}$ frequencies on the JCM ladder. The 1981–82 burst of work — Sukumar–Buck's multi-photon extension [17], Knight and Radmore on coherent-state dephasing and revival [24, 25], Meystre–Zubairy on squeezing [23], Singh on field statistics [22], Sánchez-Mondragón, Narozhny, and Eberly on the spontaneous-emission line shape inside an ideal cavity [13, 74] — established that the model was not a curiosity but a generator of distinctively quantum signatures across the observables of quantum optics. Yoo and Eberly's 1985 *Physics Reports* review [69] codified the framework; Shore and Knight's 1993 monograph-length article [55], titled simply \"The Jaynes–Cummings Model,\" fixed the name.\n\nThen Garching closed the loop. Rempe, Walther, and Klein's 1987 observation of collapse and revival of Rabi nutation in a one-atom maser [54] was, in a clean sense, the first experimental signature of field quantization beyond the photoelectric effect — and it confirmed the model whose author had built it as a weapon against quantization. Within a decade the ENS group resolved the $\\sqrt{n+1}$ ladder directly via vacuum Rabi oscillations with Rydberg atoms in a superconducting cavity [62], and by 2004 the Yale circuit-QED program had ported the same Hamiltonian into superconducting circuits [77, 80].\n\nThat portability — atom–photon, ion–phonon, transmon–microwave, quantum-dot–exciton-polariton — is why a two-page Hamiltonian became a Rosetta stone. Every strong-coupling platform of the last forty years describes itself, at zeroth order, by writing $H_{\\text{JC}} = \\omega_c a^\\dagger a + \\tfrac{1}{2}\\omega_q \\sigma_z + g(a\\sigma_+ + a^\\dagger \\sigma_-)$ on the board. The remainder of this dossier is about exactly what gets lost when one stops at zeroth order.\n\nSources:\n- [Larson \u0026 Mavrogordatos, \"The Jaynes–Cummings model and its descendants\" (arXiv:2202.00330)](https://arxiv.org/pdf/2202.00330)\n- [E. T. Jaynes bibliography, Washington University](https://bayes.wustl.edu/etj/node1.html)\n- [H. Paul, \"Die Kohärenz der induzierten Strahlung,\" Annalen der Physik 467, 290 (1963)](https://onlinelibrary.wiley.com/doi/abs/10.1002/andp.19634670507)"}, {"id": "the-physics-properly", "title": "The Physics, Properly: Hamiltonian, Dressed Ladder, Collapse and Revival", "markdown": "## The Physics, Properly: Hamiltonian, Dressed Ladder, Collapse and Revival\n\nStart with minimal coupling for a bound electron in $V(\\mathbf{r})$ and a single transverse cavity mode,\n$$H \\;=\\; \\frac{1}{2m}\\bigl(\\mathbf{p}-q\\mathbf{A}(\\mathbf{r},t)\\bigr)^{2} + V(\\mathbf{r}) + H_{\\text{rad}} \\;=\\; \\frac{p^{2}}{2m}+V - \\frac{q}{m}\\mathbf{A}\\!\\cdot\\!\\mathbf{p} + \\frac{q^{2}}{2m}A^{2} + H_{\\text{rad}}.$$\nThe Jaynes–Cummings Hamiltonian is what survives after seven approximations, each of which deserves a name and a domain of validity.\n\n- **A1 — Two-level truncation.** Project the matter onto $\\{|g\\rangle,|e\\rangle\\}$ at splitting $\\hbar\\omega_0$; the dipole becomes $\\mathbf{d}=\\mathbf{d}_{eg}(\\sigma_{+}+\\sigma_{-})$. Valid when no other transition is near-resonant and the field is too weak to drive interband leakage.\n- **A2 — Single-mode quantization.** Keep one cavity mode: $\\mathbf{A}(0)=\\boldsymbol{\\varepsilon}\\sqrt{\\hbar/2\\varepsilon_0\\omega V}\\,(a+a^{\\dagger})$. Valid when only one mode lies within the coupling bandwidth.\n- **A3 — Dipole / long wavelength.** $\\mathbf{A}(\\mathbf{r})\\to\\mathbf{A}(0)$, i.e. $k a_{\\text{atom}}\\!\\ll\\!1$.\n- **A4 — Rotating-wave.** The bilinear coupling $g(\\sigma_{+}+\\sigma_{-})(a+a^{\\dagger})$ yields four terms; discard $\\sigma_{+}a^{\\dagger}$ and $\\sigma_{-}a$, which rotate at $\\omega_{0}+\\omega$. Valid for $g,|\\Delta|\\ll\\omega+\\omega_{0}$ with $\\Delta\\equiv\\omega_{0}-\\omega$.\n- **A5 — Drop $A^{2}$ (diamagnetic / TRK).** Removes a c-number cavity-frequency renormalization and the term that, retained, blocks an equilibrium superradiant transition. Admissible only when $g/\\omega\\!\\ll\\!1$.\n- **A6 — Fixed gauge.** Work consistently in dipole (Power–Zienau–Woolley) gauge throughout. Mixing gauges after A1/A4 produces spurious answers — the gauge-invariance literature on ultrastrong coupling is essentially a catalog of A6 violations.\n- **A7 — Closed, lossless, zero-temperature cavity.** No $\\kappa$, $\\gamma$, $\\bar n_{\\text{th}}$. Reintroduce as Lindbladians before comparing to experiment.\n\nWhat remains is the two-page Hamiltonian,\n$$\\boxed{\\;H_{\\text{JC}} \\;=\\; \\tfrac{1}{2}\\hbar\\omega_{0}\\,\\sigma_{z} \\;+\\; \\hbar\\omega\\, a^{\\dagger}a \\;+\\; \\hbar g\\bigl(\\sigma_{+}a + \\sigma_{-}a^{\\dagger}\\bigr),\\;}$$\nwith single-photon vacuum Rabi coupling $g=-\\mathbf{d}_{eg}\\!\\cdot\\!\\boldsymbol{\\varepsilon}\\sqrt{\\omega/2\\varepsilon_{0}\\hbar V}$.\n\nThe structural payoff of A4 is a conservation law. The excitation operator\n$$\\hat N \\;=\\; a^{\\dagger}a + \\sigma_{+}\\sigma_{-}$$\ncommutes with $H_{\\text{JC}}$: throwing away the counter-rotators promotes the Rabi-model's $\\mathbb{Z}_{2}$ parity to a continuous $U(1)$ symmetry. This is the genuine difference between Jaynes–Cummings and quantum Rabi physics — *not* solvability, since Braak [75] proved the Rabi model integrable.\n\nInside each fixed-$N$ subspace $\\{|e,n\\rangle,|g,n+1\\rangle\\}$ the Hamiltonian is a $2\\!\\times\\!2$ block,\n$$H_{n} \\;=\\; \\hbar\\omega\\!\\left(n+\\tfrac{1}{2}\\right)\\mathbb{1} \\;+\\; \\begin{pmatrix} \\Delta/2 \u0026 g\\sqrt{n+1} \\\\ g\\sqrt{n+1} \u0026 -\\Delta/2 \\end{pmatrix},$$\nwith eigenvalues\n$$E_{n,\\pm} \\;=\\; \\hbar\\omega\\!\\left(n+\\tfrac{1}{2}\\right)\\;\\pm\\;\\tfrac{\\hbar}{2}\\Omega_{n},\\qquad \\Omega_{n}=\\sqrt{\\Delta^{2}+4g^{2}(n+1)},$$\nand eigenvectors $|n,+\\rangle=\\cos\\tfrac{\\theta_n}{2}|e,n\\rangle+\\sin\\tfrac{\\theta_n}{2}|g,n+1\\rangle$, $|n,-\\rangle=-\\sin\\tfrac{\\theta_n}{2}|e,n\\rangle+\\cos\\tfrac{\\theta_n}{2}|g,n+1\\rangle$, with $\\tan\\theta_{n}=2g\\sqrt{n+1}/\\Delta$. At resonance the splitting on rung $n$ collapses to $2g\\sqrt{n+1}$. The $n=0$ rung — splitting $2g$ in the absence of photons — is the **vacuum Rabi splitting**. The $\\sqrt{n+1}$ scaling of higher rungs is the strictly quantum content: a coupled-oscillator Lorentz model reproduces the $n=0$ peak but not the ladder spacing.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eJCM dressed-state ladder at resonance\u003c/title\u003e\u003ctext x=\"360\" y=\"20\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eDressed-state ladder of H_JC at resonance (Δ = 0)\u003c/text\u003e\u003ctext x=\"360\" y=\"42\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003erung-n splitting = 2g√(n+1)  —  the U(1)-conserving quantum signature\u003c/text\u003e\u003cline x1=\"40\" y1=\"60\" x2=\"40\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cpolygon points=\"36,60 44,60 40,52\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"22\" y=\"80\" fill=\"#e8e6e1\" font-size=\"14\"\u003eE\u003c/text\u003e\u003ctext x=\"180\" y=\"68\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ebare basis\u003c/text\u003e\u003ctext x=\"540\" y=\"68\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eJCM eigenstates\u003c/text\u003e\u003cline x1=\"120\" y1=\"370\" x2=\"240\" y2=\"370\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"388\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003e|g,0⟩   (N = 0, uncoupled)\u003c/text\u003e\u003cline x1=\"480\" y1=\"370\" x2=\"600\" y2=\"370\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"540\" y=\"388\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003e|g,0⟩\u003c/text\u003e\u003cline x1=\"120\" y1=\"300\" x2=\"240\" y2=\"300\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/\u003e\u003ctext x=\"180\" y=\"293\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003e|e,0⟩ , |g,1⟩   (N = 1)\u003c/text\u003e\u003cline x1=\"480\" y1=\"285\" x2=\"600\" y2=\"285\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"610\" y=\"289\" fill=\"#ffb86b\" font-size=\"13\"\u003e|0,+⟩\u003c/text\u003e\u003cline x1=\"480\" y1=\"315\" x2=\"600\" y2=\"315\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"610\" y=\"319\" fill=\"#ffb86b\" font-size=\"13\"\u003e|0,−⟩\u003c/text\u003e\u003cline x1=\"468\" y1=\"285\" x2=\"468\" y2=\"315\" stroke=\"#ff7a90\" stroke-width=\"1.2\"/\u003e\u003cpolygon points=\"464,285 472,285 468,279\" fill=\"#ff7a90\"/\u003e\u003cpolygon points=\"464,315 472,315 468,321\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"438\" y=\"304\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003e2g\u003c/text\u003e\u003cline x1=\"240\" y1=\"300\" x2=\"478\" y2=\"285\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"2,3\"/\u003e\u003cline x1=\"240\" y1=\"300\" x2=\"478\" y2=\"315\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"2,3\"/\u003e\u003cline x1=\"120\" y1=\"210\" x2=\"240\" y2=\"210\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/\u003e\u003ctext x=\"180\" y=\"203\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003e|e,1⟩ , |g,2⟩   (N = 2)\u003c/text\u003e\u003cline x1=\"480\" y1=\"190\" x2=\"600\" y2=\"190\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"610\" y=\"194\" fill=\"#ffb86b\" font-size=\"13\"\u003e|1,+⟩\u003c/text\u003e\u003cline x1=\"480\" y1=\"230\" x2=\"600\" y2=\"230\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"610\" y=\"234\" fill=\"#ffb86b\" font-size=\"13\"\u003e|1,−⟩\u003c/text\u003e\u003cline x1=\"468\" y1=\"190\" x2=\"468\" y2=\"230\" stroke=\"#ff7a90\" stroke-width=\"1.2\"/\u003e\u003cpolygon points=\"464,190 472,190 468,184\" fill=\"#ff7a90\"/\u003e\u003cpolygon points=\"464,230 472,230 468,236\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"432\" y=\"213\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003e2g√2\u003c/text\u003e\u003cline x1=\"240\" y1=\"210\" x2=\"478\" y2=\"190\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"2,3\"/\u003e\u003cline x1=\"240\" y1=\"210\" x2=\"478\" y2=\"230\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"2,3\"/\u003e\u003cline x1=\"120\" y1=\"120\" x2=\"240\" y2=\"120\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/\u003e\u003ctext x=\"180\" y=\"113\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003e|e,2⟩ , |g,3⟩   (N = 3)\u003c/text\u003e\u003cline x1=\"480\" y1=\"95\" x2=\"600\" y2=\"95\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"610\" y=\"99\" fill=\"#ffb86b\" font-size=\"13\"\u003e|2,+⟩\u003c/text\u003e\u003cline x1=\"480\" y1=\"145\" x2=\"600\" y2=\"145\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"610\" y=\"149\" fill=\"#ffb86b\" font-size=\"13\"\u003e|2,−⟩\u003c/text\u003e\u003cline x1=\"468\" y1=\"95\" x2=\"468\" y2=\"145\" stroke=\"#ff7a90\" stroke-width=\"1.2\"/\u003e\u003cpolygon points=\"464,95 472,95 468,89\" fill=\"#ff7a90\"/\u003e\u003cpolygon points=\"464,145 472,145 468,151\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"432\" y=\"123\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003e2g√3\u003c/text\u003e\u003cline x1=\"240\" y1=\"120\" x2=\"478\" y2=\"95\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"2,3\"/\u003e\u003cline x1=\"240\" y1=\"120\" x2=\"478\" y2=\"145\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"2,3\"/\u003e\u003c/svg\u003e\n*Figure: Eigenspectrum of $H_{\\text{JC}}$ at $\\Delta=0$. Each fixed-$N$ doublet (blue, dashed) hybridizes into a pair of dressed states $|n,\\pm\\rangle$ (orange) split by $2g\\sqrt{n+1}$ (red). The lone ground state $|g,0\\rangle$ (green) is decoupled. The $\\sqrt{n+1}$ rung scaling — not the existence of an $n=0$ splitting — is the strictly quantum content.*\n\nFor dynamics, take $|\\psi(0)\\rangle=|e\\rangle\\otimes|\\alpha\\rangle$ with $\\bar n=|\\alpha|^{2}$. At resonance the inversion is\n$$\\langle\\sigma_{z}(t)\\rangle \\;=\\; \\sum_{n=0}^{\\infty} P_{n}\\,\\cos\\!\\bigl(2g\\sqrt{n+1}\\,t\\bigr),\\qquad P_{n}=e^{-\\bar n}\\frac{\\bar n^{\\,n}}{n!}.$$\nThe Poisson distribution has width $\\Delta n=\\sqrt{\\bar n}$. The dressed Rabi frequencies $2g\\sqrt{n+1}$ span a band $\\Delta\\Omega \\simeq (2g\\cdot\\tfrac{1}{2}/\\sqrt{\\bar n})\\cdot\\sqrt{\\bar n}=g$, so incoherent dephasing produces the **collapse**\n$$t_{c}\\;\\sim\\;1/g\\qquad\\text{(independent of }\\bar n\\text{)},$$\nidentified by Cummings already in 1965 [72] and routinely miscredited. For large $\\bar n$ the adjacent-rung spacing is\n$$2g\\bigl[\\sqrt{n+2}-\\sqrt{n+1}\\bigr]\\Big|_{n=\\bar n}\\;\\approx\\;\\frac{g}{\\sqrt{\\bar n}},$$\nand the discrete sum rephases when this spacing times $t$ crosses $2\\pi$, yielding the **revival**\n$$\\boxed{\\;t_{R}\\;\\approx\\;\\frac{2\\pi\\sqrt{\\bar n}}{g}\\;}$$\nof Eberly–Narozhny–Sánchez-Mondragón [73]. The ratio $t_{R}/t_{c}\\sim\\sqrt{\\bar n}$ controls visibility: roughly $\\sqrt{\\bar n}$ revivals survive before nonlinearity of $\\sqrt{n+1}$ smears them into a quasi-stationary signal. No semiclassical theory — Jaynes's neoclassical included — produces a revival; their observation in the Garching one-atom maser [54] is what turned the model from polemic into canon."}, {"id": "strict-conditions-and-failure", "title": "Strict Conditions and Failure Modes: Where Each Assumption Dies", "markdown": "## Strict Conditions and Failure Modes: Where Each Assumption Dies\n\nThe Hamiltonian written in §2 sits on seven load-bearing assumptions (A1–A7). Each fails in a specific, calibrated way in modern hardware; reading \"JCM physics\" out of an experiment that has crossed one of these lines is the standard way a result quietly stops being about the Jaynes–Cummings model.\n\n### A1 — Atom truncated to two levels\n\nJCM uses a single $|g\\rangle\\!\\leftrightarrow\\!|e\\rangle$ doublet under the premise that the next dipole-allowed transition is detuned by far more than $g$. This dies as soon as the anharmonicity $|\\alpha|=|\\omega_{ef}-\\omega_{ge}|$ becomes comparable to $g$. Transmons sit precisely in that danger zone — weakly anharmonic by design, with $\\alpha/2\\pi \\approx -E_C/h \\approx -200$ to $-300\\ \\text{MHz}$, while couplings in circuit QED routinely reach $g/2\\pi \\in [50, 300]\\ \\text{MHz}$ [77, 80, 57]. The ratio $g/|\\alpha| \\in [0.2, 1.5]$ means the $|f\\rangle$ rung is dressed on the same timescale as $|e\\rangle$: leakage out of the computational subspace is not a perturbation but part of the dynamics. The correct minimal Hamiltonian is then a Duffing/Kerr-oscillator JC ladder (often written down as a multilevel generalized JCM), or — when several emitters share the mode — the Tavis–Cummings model [79], which preserves U(1) and the $\\sqrt{N}$ collective enhancement.\n\n### A2 — Single-mode field\n\nReplacing the EM continuum by one mode demands that no other cavity mode lies within $\\sim g$ of $\\omega_c$ and that the free-space continuum is suppressed. Two corrections appear. (i) Purcell decay: residual coupling to the dispersive cavity tail gives $\\gamma_P = \\kappa\\, g^2/\\Delta^2$, the dominant $T_1$ channel for detuned transmons. (ii) The Lamb shift: integrating out distant modes renormalizes $\\omega_{ge}$ by $\\sum_k g_k^2/(\\omega_{ge}-\\omega_k)$. In open-cavity Rydberg geometries [78] and in optical free-space coupling, the multimode bath is precisely the structure one cannot delete; the correct object is the input–output multimode JC, reducing in the broad-band limit to a Wigner–Weisskopf Lindbladian.\n\n### A3 — Dipole approximation\n\nThe replacement $e^{i\\mathbf{k}\\cdot\\mathbf{r}}\\!\\to\\!1$ requires $\\lambda\\gg a_{\\rm emitter}$. Cavity QED with Rydbergs or trapped atoms satisfies this by orders of magnitude; plasmonic nanocavities do not. Chikkaraddy et al.'s single-molecule strong coupling at room temperature [50] operates with effective mode volumes $V_{\\rm eff}\\sim 40\\ \\text{nm}^3 \\sim 10^{-7}\\lambda^3$ inside a $\\sim 1\\ \\text{nm}$ NPoM gap, so the field varies appreciably across a molecule of $\\sim 0.5$ nm. The \"two-level dipole\" reading then underestimates the coupling, ignores higher multipole channels and quenching, and treats $g$ as a phenomenological fit parameter rather than a derived dipole matrix element [65].\n\n### A4 — Rotating-wave approximation\n\nThe RWA discards $g(a^\\dagger\\sigma_+ + a\\sigma_-)$ on the grounds that they oscillate at $\\omega_a+\\omega_c$ and average to zero for $g\\ll \\omega_{a,c}$. The leading correction is the Bloch–Siegert shift $\\delta_{\\rm BS}\\simeq g^2/(2\\omega)$ together with virtual-photon dressing of $|0,g\\rangle$. Niemczyk et al. [56] resolved the first explicit Bloch–Siegert signature in a flux-qubit/LC oscillator at $g/\\omega \\approx 0.12$; Forn-Díaz et al. [67] reached the same threshold in a coplanar architecture. Above the ultrastrong threshold $g/\\omega\\gtrsim 0.1$, the quantum Rabi Hamiltonian — integrable in Braak's transcendental sense [75] but with only $\\mathbb{Z}_2$ parity, not U(1) excitation number — is mandatory; above $g/\\omega\\gtrsim 1$ (deep-strong) the ground state is a polaron-dressed two-mode squeezed vacuum, and \"atom\" and \"photon\" cease to be useful asymptotic labels [81].\n\n### A5 and A6 — Gauge choice and the $A^2$ term\n\nA5 chooses a gauge (typically multipolar/Power–Zienau–Woolley after a Göppert-Mayer transform) so that $H_{\\rm int}\\propto \\mathbf{d}\\cdot\\mathbf{E}$. A6 discards the diamagnetic $q^2\\mathbf{A}^2/2m$ that appears in $\\mathbf{p}\\cdot\\mathbf{A}$. Both are harmless in the strong-coupling regime and *gauge-ambiguous* once one truncates to two atomic levels in the USC regime: $\\mathbf{p}\\cdot\\mathbf{A}$ and $\\mathbf{d}\\cdot\\mathbf{E}$ projected onto a doublet yield different spectra. The Thomas–Reiche–Kuhn sum rule fixes the $\\mathbf{A}^2$ coefficient so that, in the *untruncated* theory, a no-go theorem (Rzążewski–Wódkiewicz–Żakowicz, 1975) (verify) forbids a superradiant phase transition; truncation breaks this and one must restore it by hand. Di Stefano, Settineri, Macrì, Garziano, Stassi, Savasta \u0026 Nori (Nat. Phys. 15, 803, 2019) (verify) showed that the consistent procedure is to truncate in the dipole gauge and let $\\mathbf{A}^2$ be absorbed by the gauge transformation; doing it the other way around produces spurious ground-state photons of order $(g/\\omega)^2$, which inflates predicted vacuum populations by tens of percent at $g/\\omega\\sim 0.3$ [81].\n\n### A7 — Closed system, sharp dressed ladder\n\nThe JCM eigenvalues are $\\delta$-functions; experiment resolves lines of width $\\sim(\\kappa+\\gamma)/2$. The strong-coupling criterion $g \u003e (\\kappa,\\gamma)/4$ — the threshold Wallraff et al. [77] crossed and Brune et al. [62] sat well inside — guarantees that the vacuum Rabi doublet $2g$ and the anharmonic $\\sqrt{n+1}$ spacing are resolved. As $\\kappa,\\gamma\\to g$, the doublet collapses into a single polariton lineshape and \"JC ladder spectroscopy\" reduces to a Fano-style transmission feature already produced by classical coupled oscillators — the conflation flagged in §1. The correct framework is the dissipative JC master equation,\n$$\\dot\\rho \\;=\\; -\\tfrac{i}{\\hbar}[H_{\\rm JC},\\rho] \\;+\\; \\kappa\\,\\mathcal{D}[a]\\rho \\;+\\; \\gamma\\,\\mathcal{D}[\\sigma_-]\\rho,$$\nanalyzed most cleanly via the quantum-jump unraveling [52]. In the bad-cavity limit $\\kappa\\gg g$ it adiabatically reduces to Purcell-enhanced spontaneous emission and the dressed-state picture is gone; in the bad-emitter limit $\\gamma\\gg g$ the cavity sees a structureless absorber and revivals are erased before the first one arrives — which is why the 1987 Garching observation [54], with $g\\gg\\kappa,\\gamma$ over many revival periods, remains the cleanest existence proof of A1–A7 holding simultaneously."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Smoking Guns vs Circumstantial Evidence", "markdown": "## Signatures: Smoking Guns vs Circumstantial Evidence\n\nThe literature catalogs many \"signatures of the JCM.\" Most are circumstantial — observable but reproducible by linear-response or semiclassical models with one or two tuning knobs. Only a handful are diagnostic. The organizing question is whether the observation requires the *discreteness* of cavity photon number, or whether it survives the substitution $a \\to \\alpha(t) \\in \\mathbb{C}$ with suitable noise added. By that criterion the experimental case for JCM physics rests on two pillars; everything else is corroboration.\n\n### Smoking guns\n\n**(1) The $\\sqrt{n+1}$ anharmonic dressed ladder.** On the $n$-th excitation manifold the JCM splits the bare doublet $\\{\\lvert e,n\\rangle,\\lvert g,n+1\\rangle\\}$ by $2g\\sqrt{n+1}$. The splitting itself is unremarkable — any two coupled oscillators give a doublet. What is unforgeable is the *anharmonicity*: the ratio of the $n=1$ to the $n=0$ splitting is $\\sqrt{2}$, the $n=2$ to the $n=0$ is $\\sqrt{3}$, and so on. A linear theory — Hopfield polariton, classical Lorentz oscillator coupled to a cavity, any input–output network of harmonic modes — gives the *same* splitting on every rung, because linearity is exactly the statement that excitations do not interact.\n\nBrune et al. [62] resolved this in the time domain for microwave cavity QED with Rydberg atoms, reading off $2g$ and $2g\\sqrt{2}$ in successive Rabi nutations after preparing $n=0$ and $n=1$ Fock states. Fink and collaborators (Nature 454, 315, 2008) (verify) did the spectroscopic counterpart in a transmon–resonator circuit, mapping the $\\sqrt{n}$ scaling up to $n\\sim 5$. The discriminating measurement is therefore not \"is there a vacuum Rabi peak?\" but: as the drive is increased, do new transmission lines appear at the predicted $\\sqrt{n+1}$ positions, and do they sharpen rather than broaden? If the doublet remains a doublet that scales linearly with probe amplitude, the data are agnostic about quantization.\n\n**(2) Collapse *and* revival with $T_R\\propto\\sqrt{\\bar n}/g$.** The Cummings collapse alone [72] — $\\langle\\sigma_z(t)\\rangle$ decaying on $\\tau_c\\sim 1/g$ — is not diagnostic. The revival at $T_R\\simeq 2\\pi\\sqrt{\\bar n}/g$ is. It exists because the spectrum of Rabi frequencies $\\{g\\sqrt{n+1}\\}$ is *discrete*; the partial rephasing at $T_R$ is the constructive interference of nearest-neighbor beat frequencies $g(\\sqrt{n+1}-\\sqrt{n})\\to g/(2\\sqrt{\\bar n})$. No classical amplitude distribution — Poisson, Gaussian, Lorentzian — reproduces this rephasing, because integrating over a *continuum* of Rabi frequencies kills coherence permanently. Rempe, Walther \u0026 Klein [54] caught the full sequence in the Garching one-atom maser in 1987; that figure is the experimental canonization of the JCM. The requirements are uncomfortably steep: a near-coherent intracavity field of well-defined $\\bar n$, atomic dephasing slower than $T_R$, and statistics enough to see a feature whose visibility is already $\\lesssim 30\\%$ for $\\bar n \\sim 5$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"360\" y=\"22\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"15\"\u003eAnharmonicity of the dressed ladder: smoking gun vs classical mimic\u003c/text\u003e\u003ctext x=\"170\" y=\"52\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003eJCM dressed manifolds — splitting 2g√(n+1)\u003c/text\u003e\u003cline x1=\"120\" y1=\"370\" x2=\"220\" y2=\"370\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"110\" y=\"374\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"12\"\u003e|g,0⟩\u003c/text\u003e\u003cline x1=\"120\" y1=\"290\" x2=\"220\" y2=\"290\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"120\" y1=\"250\" x2=\"220\" y2=\"250\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"240\" y1=\"290\" x2=\"240\" y2=\"250\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"234\" y1=\"290\" x2=\"246\" y2=\"290\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"234\" y1=\"250\" x2=\"246\" y2=\"250\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"255\" y=\"274\" fill=\"#7ee0a3\" font-size=\"12\"\u003e2g\u003c/text\u003e\u003ctext x=\"110\" y=\"274\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"12\"\u003en=1\u003c/text\u003e\u003cline x1=\"120\" y1=\"195\" x2=\"220\" y2=\"195\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"120\" y1=\"139\" x2=\"220\" y2=\"139\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"240\" y1=\"195\" x2=\"240\" y2=\"139\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"234\" y1=\"195\" x2=\"246\" y2=\"195\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"234\" y1=\"139\" x2=\"246\" y2=\"139\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"255\" y=\"171\" fill=\"#7ee0a3\" font-size=\"12\"\u003e2√2 g\u003c/text\u003e\u003ctext x=\"110\" y=\"170\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"12\"\u003en=2\u003c/text\u003e\u003cline x1=\"120\" y1=\"95\" x2=\"220\" y2=\"95\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"120\" y1=\"27\" x2=\"220\" y2=\"27\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"240\" y1=\"95\" x2=\"240\" y2=\"27\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"234\" y1=\"95\" x2=\"246\" y2=\"95\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"234\" y1=\"27\" x2=\"246\" y2=\"27\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"255\" y=\"63\" fill=\"#7ee0a3\" font-size=\"12\"\u003e2√3 g\u003c/text\u003e\u003ctext x=\"110\" y=\"63\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"12\"\u003en=3\u003c/text\u003e\u003cline x1=\"370\" y1=\"40\" x2=\"370\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"3,4\"/\u003e\u003ctext x=\"540\" y=\"52\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003eLinear coupled oscillators — splitting 2g for every n\u003c/text\u003e\u003cline x1=\"490\" y1=\"370\" x2=\"590\" y2=\"370\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"480\" y=\"374\" text-anchor=\"end\" fill=\"#e8e6e1\" font-size=\"12\"\u003e|0⟩\u003c/text\u003e\u003cline x1=\"490\" y1=\"290\" x2=\"590\" y2=\"290\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"490\" y1=\"250\" x2=\"590\" y2=\"250\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"610\" y1=\"290\" x2=\"610\" y2=\"250\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"604\" y1=\"290\" x2=\"616\" y2=\"290\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"604\" y1=\"250\" x2=\"616\" y2=\"250\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"625\" y=\"274\" fill=\"#7ee0a3\" font-size=\"12\"\u003e2g\u003c/text\u003e\u003cline x1=\"490\" y1=\"195\" x2=\"590\" y2=\"195\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"490\" y1=\"155\" x2=\"590\" y2=\"155\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"610\" y1=\"195\" x2=\"610\" y2=\"155\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"604\" y1=\"195\" x2=\"616\" y2=\"195\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"604\" y1=\"155\" x2=\"616\" y2=\"155\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"625\" y=\"178\" fill=\"#7ee0a3\" font-size=\"12\"\u003e2g\u003c/text\u003e\u003cline x1=\"490\" y1=\"100\" x2=\"590\" y2=\"100\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"490\" y1=\"60\" x2=\"590\" y2=\"60\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"610\" y1=\"100\" x2=\"610\" y2=\"60\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"604\" y1=\"100\" x2=\"616\" y2=\"100\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"604\" y1=\"60\" x2=\"616\" y2=\"60\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"625\" y=\"83\" fill=\"#7ee0a3\" font-size=\"12\"\u003e2g\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The discriminating measurement is rung-by-rung spectroscopy. A doublet at $n=0$ alone (vacuum Rabi splitting) is reproduced by classical coupled oscillators or Hopfield polaritons; verifying the $\\sqrt{n+1}$ scaling on $n\\geq 1$ manifolds is what falsifies the linear-response mimic.*\n\n### Circumstantial evidence — and the measurement that promotes it\n\n**Vacuum Rabi splitting in linear transmission.** Two normal-mode peaks separated by $2g$ in a weak-probe scan are the most reported \"JCM signature\" in the literature and the weakest. Two coupled classical Lorentz oscillators with susceptibilities $\\chi_a(\\omega), \\chi_c(\\omega)$ generate the same spectrum; so do Hopfield polaritons in linear response. *Discriminator:* power saturation. A linear system rescales while its peak positions are pinned; the JCM, in cooperativity $C\\gtrsim 1$, develops photon blockade with new transmission lines at the $\\sqrt{n+1}$ ladder positions and antibunching $g^{(2)}(0)\u003c1$. Without nonlinear-in-$n$ data the conservative reading is \"strongly coupled,\" not \"field quantized.\"\n\n**Cummings-style partial collapse of the inversion.** The Gaussian envelope $\\exp[-(gt)^2/2]$ on $\\langle\\sigma_z\\rangle$ for a coherent state, with collapse time independent of $\\bar n$, was the heart of Jaynes's neoclassical reading [71]: any classical drive with a broad enough amplitude distribution dephases the Rabi nutation by ensemble averaging over Rabi frequencies, and Knight \u0026 Radmore [24] mapped explicitly how the envelope shape tracks the photon statistics. *Discriminator:* integration time. Classical noise gives monotonic relaxation; the JCM revives at $T_R$. An inversion-decay experiment terminated at $t\\lesssim 1/g$ is consistent with neoclassical theory and proves nothing.\n\n**Dispersive shifts.** Off-resonance the cavity shifts by $\\chi=g^2/\\Delta$ per atom, and the qubit experiences an ac-Stark shift $2\\chi\\langle n\\rangle$. Both are also outputs of a semiclassical polarizability calculation. *Discriminator:* photon-number resolution. When $2\\chi\u003e\\kappa$, the qubit spectrum splits into a comb of equally spaced peaks, each labelled by a Fock photon number (Schuster et al., Nature 445, 515, 2007 (verify)). A *continuous* shift proportional to drive intensity is semiclassical; a *discrete comb* is JCM.\n\n**Purcell-enhanced spontaneous emission.** Increased decay rate inside a cavity follows from any modified mode density (Goy–Raimond–Gross–Haroche [78] is the cleanest early demonstration). The classical EM-density-of-states calculation suffices; the JCM is unnecessary to explain it, and citing Purcell enhancement as evidence for JCM physics conflates cavity engineering with field quantization.\n\nThe pattern repeats: each individual \"JCM signature\" has a linear or semiclassical impostor that fits the weak-probe data. Quantization announces itself only through *nonlinearity in $n$* — the $\\sqrt{n+1}$ ladder in spectroscopy, the discrete comb in dispersive readout, the revival in time-domain dynamics. Any experimental claim of \"JCM physics\" that lives entirely inside the linear-response regime is, strictly, a claim about strong coupling, not about field quantization."}, {"id": "use-and-abuse", "title": "Use and Abuse: How 'JCM Physics' Is Invoked Where It No Longer Holds", "markdown": "## Use and Abuse: How 'JCM Physics' Is Invoked Where It No Longer Holds\n\nThe JCM has become a verbal shorthand far broader than its Hamiltonian. The cost is concrete: experiments are sold as \"demonstrations of JCM physics\" in regimes where the JCM is the wrong Hamiltonian, and predictions are imported from it that its assumptions no longer support. Five drift patterns recur.\n\n### (i) \"Jaynes–Cummings\" pasted onto ultrastrong-coupling spectra\n\nIn the ultrastrong (USC, $g/\\omega_c \\gtrsim 0.1$) and deep-strong ($g/\\omega_c \\gtrsim 1$) regimes, the counter-rotating term $g(a\\sigma_- + a^\\dagger\\sigma_+)$ and the diamagnetic $A^2 \\propto (a+a^\\dagger)^2$ contribution restructure the spectrum and, crucially, the ground state. The new vacuum is a squeezed, virtual-photon-dressed state $|G\\rangle = \\mathcal{N}\\sum_n c_n |n, \\pm\\rangle$ with $\\langle G | a^\\dagger a | G \\rangle \u003e 0$; nothing in the JCM ladder predicts this, because in the JCM $|0,g\\rangle$ is exact and bare. Niemczyk et al. [56] and Forn-Díaz et al. [67] resolved Bloch–Siegert shifts of order $g^2/\\omega_c$ that the RWA Hamiltonian cannot reproduce by construction, and the Kockum–Miranowicz–De Liberato–Savasta–Nori review [81] is explicit that \"JCM dressed states\" cease to be eigenstates already at the few-percent level of $g/\\omega_c$. Yet \"Jaynes–Cummings ladder\" still appears in USC titles where what is plotted is a numerical diagonalization of the quantum Rabi or Hopfield Hamiltonian. The diagnostic tell: an experimental paper that quotes $g/\\omega_c \\gtrsim 0.05$ and then writes \"$E_n = \\omega_c n \\pm g\\sqrt{n+1}$\" without a Bloch–Siegert correction term.\n\n### (ii) Cohen-Tannoudji–Reynaud dressed states quietly identified with JCM dressed states\n\nThe \"dressed atom\" of the Cohen-Tannoudji–Reynaud semiclassical theory dresses the atom with a coherent c-number drive of Rabi frequency $\\Omega = dE_0/\\hbar$; the level splitting is $\\sqrt{\\Delta^2+\\Omega^2}$, set by the field amplitude. The JCM dressed states $|n,\\pm\\rangle$ split by $g\\sqrt{n+1}$, set by photon number. The two pictures agree only in the $\\bar n \\to \\infty$ classical limit, where $g\\sqrt{\\bar n+1} \\to \\Omega/2$. Conflation appears in two characteristic forms: (a) Mollow-triplet measurements in free-space resonance fluorescence described as \"JCM-like sidebands\" — they are not, they are CTR sidebands and require no field quantization; (b) AC-Stark shifts in cavity-QED setups reported as \"evidence of the JCM ladder\" when the measured shift scales linearly with drive power, the CTR signature, rather than with intracavity photon number per the JCM. The honest test is the photon-number dependence of the splitting, not the splitting itself.\n\n### (iii) \"Vacuum Rabi splitting therefore field quantization\"\n\nA doublet in the cavity transmission spectrum at $\\omega = \\omega_c \\pm g$ requires only two coupled linear oscillators — the Hopfield polariton and the Fano coupled-oscillator picture both produce it, as does a classical Lorentz model with appropriate susceptibility. The Brune et al. ENS experiment [62] is canonical precisely because it resolved the $\\sqrt{n+1}$ ladder, not because it found a splitting. Yet single-emitter plasmonic-cavity claims of \"strong coupling\" routinely report a vacuum doublet of width $\\sim 2g$ and infer JCM physics from it. The exemplar Chikkaraddy et al. nanocavity result [50] is careful about this — they explicitly discuss the linewidths and the $g \\gtrsim (\\gamma+\\kappa)/2$ criterion — but the downstream literature is not. Diagnostic phrases that mark a hollow claim: \"observation of vacuum Rabi splitting and hence the JCM regime\"; \"the splitting confirms field quantization\"; any spectrum showing only the $n=0 \\to 1$ doublet sold as a JCM test without an anharmonic rung at $g(\\sqrt{2}-1)$.\n\n### (iv) Transmon circuit-QED where $\\alpha \\sim g$\n\nThe Blais et al. [80] and Wallraff et al. [77] circuit-QED architecture is described by the JCM in the regime $g \\ll \\alpha \\ll \\Delta$, where $\\alpha = E_C/\\hbar$ is the transmon anharmonicity. Modern transmons frequently operate with $\\alpha/2\\pi \\sim 200{-}300$ MHz and $g/2\\pi \\sim 100{-}200$ MHz: the two-level truncation is not benign. Leakage to the $|f\\rangle$ state, qubit-induced Kerr on the resonator, and the breakdown of the dispersive Schrieffer–Wolff expansion at $\\bar n_{\\text{crit}} = (\\Delta/2g)^2$ are routinely absorbed into \"non-ideal JCM\" language. The You–Nori review [57] flags exactly this slippage. The diagnostic phrase: a paper that writes the JCM Hamiltonian and then immediately introduces a Kerr term $-\\chi (a^\\dagger a)^2$ \"from the higher transmon levels\" without noting that this is not a JCM correction but a signal that the JCM was the wrong starting Hamiltonian for that observable.\n\n### (v) The quiet promotion of Rabi/Hopfield to \"JCM\"\n\nThe most damaging drift is the cleanest: a Hamiltonian with counter-rotating and $A^2$ terms is diagonalized numerically, the lowest two excited states are tracked, and the result is labeled \"JCM dressed states.\" Braak's exact solution [75] showed the quantum Rabi model has its own integrability structure built on $\\mathbb{Z}_2$ parity, distinct from the JCM's $U(1)$ excitation-number conservation. Once $\\langle a^\\dagger a \\rangle_G \\neq 0$, excitation number is not conserved and the polariton ladder is not the JCM ladder — even when the lowest doublet looks similar. Diagnostic phrase: any claim of \"JCM behavior\" that survives turning off the RWA in the simulation, since by construction the JCM *is* the RWA limit.\n\n### Hollow-claim phrasebook\n\nA paper deserves scepticism when it contains any of: \"we observe JCM physics\" with no $\\sqrt{n+1}$ scaling reported; \"the dressed states split by $\\Omega_R$\" with no specification of whether $\\Omega_R$ scales with drive amplitude or photon number; \"ultrastrong JCM coupling\"; \"vacuum Rabi splitting confirms the quantum nature of the field\"; \"JCM ground state\" in a system where $g/\\omega_c \u003e 0.05$. Each is, in the strict sense established in §3, a category error."}, {"id": "status-and-checklist", "title": "Status and the Believer's Checklist", "markdown": "## Status and the Believer's Checklist\n\nThe Jaynes–Cummings model occupies an awkward, productive position in 2026: it is simultaneously the *correct* effective Hamiltonian over a wide swath of cavity and circuit QED, *demonstrably wrong* in regimes now routinely accessed, and *pedagogically over‑extended* into experiments where neither its spectrum nor its dynamics apply. The diagnosis depends entirely on the dimensionless ratios $g/\\omega$, $g/\\kappa$, $g/\\gamma$, and the anharmonicity $|\\alpha|/g$ — none of which the model itself supplies.\n\n### Where the JCM is still load-bearing\n\n**Cavity QED with Rydberg atoms and trapped ions.** Here $g/\\omega \\lesssim 10^{-5}$, A1–A7 hold cleanly, and the model is exact to spectroscopic precision. The Garching collapse–revival sequence [54] and the ENS $\\sqrt{n+1}$ ladder [62] remain the cleanest tests of field quantization on record.\n\n**Weak‑to‑strong dispersive circuit QED.** The transmon–resonator system, truncated to the lowest two transmon levels, is described by the JCM with anharmonicity $|\\alpha|/2\\pi \\sim 200$–$350$ MHz, i.e. $|\\alpha|/\\omega \\approx 0.05$–$0.08$ for $E_J/E_C \\in [20,50]$ ([typical transmon regime](https://arxiv.org/pdf/1210.1605)). Higher levels enter as perturbative Kerr and dispersive shifts. The dressed‑state language is not a metaphor; it is the basis for every dispersive readout deployed today.\n\n### Where it visibly breaks\n\n**Ultrastrong (USC, $g/\\omega \\gtrsim 0.1$) and deep-strong (DSC, $g/\\omega \\gtrsim 1$) coupling.** The JCM conserves $\\hat N = a^\\dagger a + \\sigma_+\\sigma_-$; the real Hamiltonian does not. The vacuum $|0,g\\rangle$ is replaced by a virtual‑photon‑dressed ground state, $\\mathrm{U}(1)$ is broken down to $\\mathbb{Z}_2$ parity, and Bloch–Siegert shifts and counter-rotating selection rules appear at the percent level [56, 67]. The Kockum–Miranowicz–De Liberato–Savasta–Nori review [81] now classifies a *perturbative* USC window — Bloch–Siegert‑corrected JCM still usable — extending to roughly [$g/\\omega \\approx 0.4$ for the lowest eigenstates](https://link.aps.org/doi/10.1103/RevModPhys.91.025005), beyond which the spectrum is non‑perturbative and the Braak transcendental function [75] is unavoidable.\n\n**Plasmonic and molecular polaritonics at the single‑emitter limit.** Splittings of $2g \\sim 100$–$400$ meV at $\\omega \\sim 1$–$2$ eV put these platforms at $g/\\omega = 0.05$–$0.20$ in environments where the cavity linewidth $\\kappa$ rivals or exceeds $g$ and the mode is strongly non‑Hermitian [50]. A classical coupled‑oscillator / Lorentz‑dielectric model reproduces the observed transmission doublet at the linear‑response level ([explicit demonstrations in plasmonic single‑emitter systems](https://www.nature.com/articles/ncomms11823)). \"JCM physics\" is invoked far more often here than the data warrant.\n\n### The Believer's Checklist\n\nBefore AETHER will accept a claim of \"Jaynes–Cummings physics,\" the paper must:\n\n1. **Report $g/\\omega$ and $g/(\\kappa,\\gamma)$.** The first locates the system on the JCM / USC / DSC axis; the second certifies whether coherent dynamics survive at all. Adjectives (\"strong coupling\") are not numbers.\n2. **Justify A1 (two‑level truncation) with a measured anharmonicity.** State $|\\alpha|$ and show $|\\alpha| \\gg g, \\kappa, \\gamma$ and bigger than drive‑induced ac‑Stark and dispersive shifts *on the experimental timescale*, not in the bare spectrum.\n3. **Justify A4 (RWA) by bounding the Bloch–Siegert shift.** The leading correction $\\delta_{\\mathrm{BS}} \\approx g^2/[2(\\omega_0+\\omega)]$ must be smaller than the linewidth or absorbed into the fit. \"RWA assumed\" is not a justification.\n4. **State the gauge (Coulomb vs dipole) and whether $A^2$ is included.** The TRK sum rule forbids the no‑go-violating superradiant phase transition in the dipole gauge once $A^2$ is kept; dropping it silently has produced retracted predictions and is the modal error in polaritonic chemistry.\n5. **Distinguish $\\sqrt{n+1}$ ladder evidence from linear vacuum Rabi splitting.** A transmission doublet proves only a coupled‑oscillator regime — Lorentz dielectrics reproduce it. Quantization claims require the nonlinear ladder, photon‑blockade antibunching, or single‑photon Fock-state preparation [62].\n6. **For revival claims, show $t_R$ scales as $2\\pi\\sqrt{\\bar n}/g$.** The Cummings (1965) partial collapse [72] alone is reproducible by classical amplitude noise; quantization is in the *revival*, with the correct $\\sqrt{\\bar n}$ scaling and the predicted modulation envelope [54, 73].\n7. **Name Paul, Cummings (1965), Narozhny, and Sánchez-Mondragón where their results are used.** Paul's independent 1963 derivation [82], Cummings's 1965 collapse [72], and the joint Eberly–Narozhny–Sánchez-Mondragón revival prediction [73] vanish from textbook accounts. Citing them is the difference between physics history and folklore.\n8. **If $g/\\omega \\gtrsim 0.1$, do not invoke the JCM.** Use the quantum Rabi or Hopfield Hamiltonian, say so, and acknowledge that $|0,g\\rangle$ is not the ground state. \"JCM with ultrastrong corrections\" is an oxymoron once $\\mathrm{U}(1)$ is broken — the residual symmetry is $\\mathbb{Z}_2$ parity and the spectrum is the Braak transcendental determinant [75], not the harmonic ladder [55, 69, 81].\n\nThe model passes the checklist where the physics is genuinely two‑level, weakly coupled, and rotating‑wave; it fails where modern hardware actually lives. Both facts are equally important, and both are why the 1963 polemic [71, 82] survives as the most-cited two-page Hamiltonian in quantum optics — and the most-misapplied.\n\nSources:\n- [Kockum et al., Nat. Rev. Phys. (USC review)](https://link.aps.org/doi/10.1103/RevModPhys.91.025005)\n- [Fluxonium / transmon dispersive theory, anharmonicity ranges](https://arxiv.org/pdf/1210.1605)\n- [Single-emitter plasmonic vacuum Rabi splitting](https://www.nature.com/articles/ncomms11823)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI will stake my reputation on a narrow, sharp claim: the Jaynes–Cummings Hamiltonian is the correct effective theory for a single dipole-coupled two-level transition resonantly exchanging excitations with one electromagnetic mode, provided $g \\ll \\omega_c, \\omega_a$, the spectator levels lie outside a window of order $g\\sqrt{\\bar n}$, and the mode lifetime is long compared to $g^{-1}$. In that window the U(1) symmetry $[H, N] = 0$ is not a calculational convenience — it is the physical content. The $\\sqrt{n+1}$ ladder, the $\\sqrt{\\bar n}$-scaled revival at $t_R = 2\\pi\\sqrt{\\bar n}/g$, and the dispersive shift $\\chi = g^2/\\Delta$ have all survived four decades of progressively cleaner experimental assault. I will also defend, against periodic revisionism, that Rempe–Walther–Klein (1987) plus Brune *et al.* (1996) constitute genuine field-quantization tests — the revival, not the collapse, is what carries the burden.\n\nWhat is shakier than the literature admits, in descending order of how often I have to argue about it:\n\n**(b1)** *The $A^2$ term is harmless.* It is not. Once one is honest about the TRK sum rule, dropping $\\frac{q^2 A^2}{2m}$ in the Coulomb gauge while simultaneously taking $g/\\omega \\gtrsim 0.1$ is internally inconsistent and gauge-fixed answers diverge between Coulomb and dipole gauges in exactly the regime where people now claim \"ultrastrong JCM.\" This is the assumption A4–A5 pair in §3 and it fails *silently*: the spectrum still looks JCM-like to leading order.\n\n**(b2)** *The two-level truncation commutes with the RWA.* It does not. Truncating first and rotating-frame-approximating second versus the reverse order gives different gauge-invariant predictions when the bare anharmonicity is not large compared to $g$. Most transmon papers truncate first by habit; the error is small but not parametrically suppressed.\n\n**(b3)** *\"Vacuum Rabi splitting observed\" $\\Rightarrow$ \"JCM verified.\"* A linear-response transmission doublet is reproduced by a classical Lorentz oscillator coupled to a cavity. The quantum content lives in the $\\sqrt{n}$ anharmonicity of the ladder, which a single-quadrature linear measurement cannot see. I would retire this sloppy headline tomorrow.\n\n**(b4)** *The Markovian master equation respects the JCM symmetry.* The standard Lindblad dissipators $\\mathcal{D}[a]$ and $\\mathcal{D}[\\sigma_-]$ are derived assuming the bath sees the *bare* operators; in strong coupling the dressed-basis dissipators differ, and \"thermal equilibrium\" of the JCM under naive Lindblad is not the Gibbs state of $H_{\\rm JCM}$.\n\nThe three open problems I would actually put my own postdocs on, ranked:\n\n1. **Gauge-invariant truncation in deep-strong coupling.** Because the entire ultrastrong-coupling industry rests on resolving (b1)–(b2) without sleight of hand.\n2. **Operational distinguishers between JCM, Rabi, and Hopfield ground states using photon-number-resolved homodyne in circuit QED.** The virtual-photon vacuum is the cleanest place quantum field theory ever met an experiment in a fridge.\n3. **Revival spectroscopy at $\\bar n \\sim 1$.** The $\\bar n \\to 0$ corner is where collapse–revival, quantum jumps, and measurement back-action interfere — and where Cummings's 1965 single-author calculation has never been pushed to its honest limit.\n\n**Reading path:**\n1. Jaynes \u0026 Cummings, *Proc. IEEE* 51, 89 (1963) [1] — the original, read it once knowing it was written to argue against itself.\n2. Paul, *Ann. Phys. Leipzig* 11, 411 (1963) [2] — the missing co-discoverer; the derivation is cleaner.\n3. Eberly, Narozhny \u0026 Sánchez-Mondragón, *PRL* 44, 1323 (1980) [5] — collapse *and* revival, with all three authors visible.\n4. Rempe, Walther \u0026 Klein, *PRL* 58, 353 (1987) [9] — the experiment that turned a polemic into canon.\n5. Braak, *PRL* 107, 100401 (2011) [14] — the integrability proof that finally drew the line between JCM and Rabi correctly."}], "references": [{"n": 1, "title": "Proceedings of the Association of American Anatomists", "authors": ["G Stheeter", "G Ross", "G Harrison", "Huber", "G Streeter", "Norman Gehring"], <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
