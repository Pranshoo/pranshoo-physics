rs that quote SOD-corrected isomer shifts to $10^{-9}$ precision while extracting $\\Theta_D$ from $f(T)$ in a separate fit are double-counting information.\n\n**Third**, \"Mössbauer neutrinos\" and most claims of recoilless emission outside the $E_R \\ll \\hbar\\omega_D$ regime. The Lamb–Dicke parameter $\\eta = k x_0$ small is *not* the same condition as $f \\sim 1$ for a γ-ray; the energy scales differ by six orders of magnitude. Optical zero-phonon lines are an electronic analogue, not a nuclear one, and the mass scale that makes nuclear $f$ exceptional is silently dropped when authors invoke the comparison.\n\n### (c) Three open questions, ranked\n\n1. **The $^{229}\\text{Th}$ 8 eV isomer in a host lattice: is there a recoilless fraction at all?** $E_R/k_B\\Theta_D$ is favorable, but the transition is so low-energy that the host's electronic environment dominates — this is the cleanest test of whether the Lamb–Mössbauer framework survives outside the keV regime.\n2. **Nuclear forward scattering with single-photon wavepackets from XFELs.** The transition from ensemble-averaged $f$ to single-emitter coherence has never been cleanly disentangled; this is where nuclear quantum optics either becomes a discipline or doesn't.\n3. **Site-resolved $\\langle u^2\\rangle$ in disordered magnetic systems via $f$-anisotropy.** The texture information in single-crystal $f(\\hat{\\mathbf{k}})$ is underused; spin-glass and frustrated-magnet communities have left this on the table.\n\n### Reading path\n\n1. Lamb, *Phys. Rev.* **55**, 190 (1939) — the entire nuclear formalism, a generation before the experiment. Read first to see what Mössbauer \"discovered.\"\n2. Mössbauer's Nobel lecture (1961) — his own credit assignment, which the textbooks proceeded to ignore.\n3. Frauenfelder, *The Mössbauer Effect* (1962) — the cleanest derivation of $f$ from the Van Hove correlation function before the chemistry community took over the pedagogy.\n4. Singwi \u0026 Sjölander, *Phys. Rev.* **120**, 1093 (1960) — diffusion, anharmonicity, and the correct treatment of $S(\\mathbf{k},\\omega)$; required before reading any modern NFS paper.\n5. Röhlsberger, *Nuclear Condensed Matter Physics with Synchrotron Radiation* (2004) — the bridge from kinematic Mössbauer to coherent nuclear scattering; ends the reading list at the current frontier."}], "references": [{"n": 1, "title": "Über die Bewegung der Atome in Kristallgittern", "authors": ["P. Debye"], "year": 1913, "venue": "Verhandlungen der Deutschen Physikalischen Gesellschaft 15, 678–689", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "The m$ouml$ssbauer effect", "authors": ["A J F Boyle", "H. E. Hall"], "year": 1962, "venue": "Reports on Progress in Physics", "url": "https://doi.org/10.1088/0034-4885/25/1/311", "cited_by": 218, "bucket": "earliest"}, {"n": 3, "title": "The Mössbauer Effect and its Application in Chemistry", "authors": ["E. Fluck"], "year": 1964, "venue": "Advances in inorganic chemistry and radiochemistry", "url": "https://doi.org/10.1016/s0065-2792(08)60231-9", "cited_by": 83, "bucket": "earliest"}, {"n": 4, "title": "The Mössbauer Effect and Its Application in Chemistry", "authors": ["R.H. Herber"], "year": 1967, "venue": "Advances in chemistry series", "url": "https://doi.org/10.1021/ba-1967-0068.ch001", "cited_by": 4, "bucket": "earliest"}, {"n": 5, "title": "The Mössbauer Effect", "authors": ["Harry Lustig"], "year": 1961, "venue": "American Journal of Physics", "url": "https://doi.org/10.1119/1.1937662", "cited_by": 18, "bucket": "earliest"}, {"n": 6, "title": "Physics of the Mössbauer Effect", "authors": ["Leonard Eyges"], "year": 1965, "venue": "American Journal of Physics", "url": "https://doi.org/10.1119/1.1970986", "cited_by": 11, "bucket": "earliest"}, {"n": 7, "title": "Capture of Neutrons by Atoms in a Crystal", "authors": ["W. E. Lamb Jr."], "year": 1939, "venue": "Physical Review 55, 190–197", "url": "https://doi.org/10.1103/PhysRev.55.190", "cited <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
