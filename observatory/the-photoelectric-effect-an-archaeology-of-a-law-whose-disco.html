chin [8], ran on Elster–Geitel cells or their direct descendants. Their decades-long series in the *Annalen* is the experimental substrate of the field. They appear in no introductory textbook.\n\n### J. J. Thomson, 1899 — naming the carriers\n\nThe closing act of the pre-Einstein decade was Thomson's determination that the carriers liberated by UV light from a zinc surface had the same $e/m$ as the cathode-ray corpuscles he had measured two years earlier [9]. Only at this point — twelve years after Hertz — did it become legitimate to say that *light ejects electrons from metals*. Before 1897 there were no electrons to eject; before 1899 there was no proof the photoelectric carriers were the same particles. The *Hertz-Effekt* and *Hallwachs-Effekt* of the German literature now had a common microscopic agent, and the two names began their slow merger into the single Anglophone *photoelectric effect*. The unification was therefore neither Hertz's nor Hallwachs's: it was Thomson's identification of the carrier that retroactively collapsed two distinct discharge phenomena into one. The empirical law — intensity proportionality plus, after Lenard, a frequency threshold — was already complete by 1902, with Einstein's manuscript still three years away."}, {"id": "lenard-1902", "title": "II. Lenard 1902: The Law Einstein Explained", "markdown": "## II. Lenard 1902: The Law Einstein Explained\n\nBy the time Philipp Lenard sat down to write his 198-page treatise *Ueber die lichtelektrische Wirkung* [5], the qualitative phenomenon had been mature for fourteen years. Hertz [1] had seen UV shorten the spark gap; Hallwachs [2] had stripped negative charge from zinc; Stoletov [3] had drawn the first $i(V)$ characteristic of a photocell and established the proportionality of saturation current to incident flux; Elster and Geitel [10] had built alkali-metal cathodes whose sensitivities ran from the near-UV well into the visible; and J. J. Thomson [9] had, in 1899, weighed the emitted carriers and found $e/m$ identical to that of cathode rays. What was *missing* was a quantitative kinematic statement about the *energies* of the ejected electrons. Lenard supplied it.\n\n### The apparatus: a retarding-potential spectrometer for slow electrons\n\nLenard's instrument was not the schematic \"vacuum diode with a battery\" of the textbooks. It was a differential energy analyzer purpose-built for sub-volt electrons, exploiting a geometry that decoupled emission, drift, and analysis.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eLenard 1902: retarding-potential photoelectric spectrometer (schematic)\u003c/text\u003e\u003cline x1=\"40\" y1=\"60\" x2=\"40\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cline x1=\"680\" y1=\"60\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cline x1=\"40\" y1=\"60\" x2=\"680\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cline x1=\"40\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"60\" y=\"55\" fill=\"#e8e6e1\" font-size=\"12\"\u003eevacuated tube (~10⁻⁵ Torr, Gaede pump)\u003c/text\u003e\u003cline x1=\"120\" y1=\"120\" x2=\"120\" y2=\"280\" stroke=\"#7aa2ff\" stroke-width=\"4\"/\u003e\u003ctext x=\"100\" y=\"115\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003ecathode U\u003c/text\u003e\u003ctext x=\"100\" y=\"300\" fill=\"#7aa2ff\" font-size=\"12\" text-anchor=\"middle\"\u003e(Al, Zn, Cu, Pt)\u003c/text\u003e\u003cpath d=\"M 60 180 L 115 180\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#a1)\"/\u003e\u003cpath d=\"M 60 200 L 115 200\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#a1)\"/\u003e\u003cpath d=\"M 60 220 L 115 220\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#a1)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"a1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 8 4, 0 8\" fill=\"#ffb86b\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"70\" y=\"170\" fill=\"#ffb86b\" font-size=\"13\"\u003ehν (arc)\u003c/text\u003e\u003cline x1=\"280\" y1=\"100\" x2=\"280\" y2=\"300\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"280\" y=\"95\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eaperture A\u003c/text\u003e\u003ccircle cx=\"200\" cy=\"200\" r=\"3\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"240\" cy=\"195\" r=\"3\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"280\" cy=\"200\" r=\"3\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"340\" cy=\"198\" r=\"3\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"400\" cy=\"202\" r=\"3\" fill=\"#7ee0a3\"/\u003e\u003cpath d=\"M 180 200 L 470 200\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/\u003e\u003ctext x=\"240\" y=\"180\" fill=\"#7ee0a3\" font-size=\"12\"\u003ephotoelectrons, KE ≤ E_max\u003c/text\u003e\u003cline x1=\"470\" y1=\"120\" x2=\"470\" y2=\"280\" stroke=\"#ff7a90\" stroke-width=\"3\"/\u003e\u003ctext x=\"470\" y=\"115\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003egrid G\u003c/text\u003e\u003ctext x=\"470\" y=\"300\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003eretarder −V\u003c/text\u003e\u003cline x1=\"600\" y1=\"120\" x2=\"600\" y2=\"280\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003ctext x=\"600\" y=\"115\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003ecollector C\u003c/text\u003e\u003ctext x=\"600\" y=\"300\" fill=\"#7aa2ff\" font-size=\"12\" text-anchor=\"middle\"\u003e→ electrometer\u003c/text\u003e\u003cpath d=\"M 100 350 L 100 365 L 600 365 L 600 350\" stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"/\u003e\u003ccircle cx=\"350\" cy=\"365\" r=\"10\" fill=\"none\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"350\" y=\"370\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eG\u003c/text\u003e\u003ctext x=\"360\" y=\"385\" fill=\"#e8e6e1\" font-size=\"11\" text-anchor=\"middle\"\u003equadrant electrometer i(V)\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Lenard's retarding-potential geometry. UV from a carbon or zinc-spark arc illuminates the cathode U; emitted electrons drift field-free to an aperture A and then climb (or fail to climb) a retarding potential −V between grid G and collector C. The collector current $i(V)$ measured by a quadrant electrometer is the integrated energy distribution of the photoelectrons.*\n\nSeveral features of this design — almost none of which survive in the textbook compression — were essential to the result. First, the cathode-to-grid space was held at zero field, so the electrons emerged with their *kinetic energies as ejected*, unmodified by accelerating bias. Second, the retarder $V$ was a small, calibrated, *reversible* voltage of order 0.1–10 V, not a battery in series with the photocurrent. Third, Lenard worked in the best vacuum he could reach (Gaede rotary mercury pumps, ~$10^{-5}$ Torr) precisely because Stoletov's earlier work had shown the current was pressure-dependent — an effect we now recognize as gas-phase ionization amplification. Fourth, Lenard cycled cathode materials and surface preparations (Al, Zn, Cu, Pt; freshly turned, polished, oxidized), discovering already that the relevant energetic offset depended on the surface state, not the bulk identity, of the metal — the *Verunreinigungsproblem* he flags repeatedly and which is the conceptual ancestor of the modern facet-dependent work function (corpus [11] reasserts this against a century of neglect).\n\nThe measured quantity was the *stopping potential* $V_s$ at which $i(V_s) \\to 0$:\n\n$$e\\,V_s \\;=\\; E_{\\max}.$$\n\n### The three regularities\n\nFrom the family of curves $i(V; I, \\nu, \\text{material})$ — where $I$ is intensity, $\\nu$ frequency — Lenard extracted three statements that the 1905 heuristic would later have to reproduce.\n\n**(L1) Saturation current is proportional to intensity, but $E_{\\max}$ is not.** At $V \\ll -V_s$ the collector floor is flat at zero; at $V \\gg 0$ it saturates at $i_{\\text{sat}}\\propto I$. Crucially, the *foot* of the curve — the point at which $i$ first vanishes — does not move with $I$. Doubling the arc brightness doubled the number of electrons but did not raise the energy of the fastest among them by a measurable amount. This was the most surprising single result of the paper, because it explicitly contradicts the resonance picture of light absorption that every classical theorist (Thomson, Lenard included) had been working with: in a resonant oscillator driven by a continuous wave, kinetic energy at saturation must scale with field amplitude squared, i.e. with intensity.\n\n**(L2) $E_{\\max}$ grows with frequency.** Substituting the spark source from a zinc arc to a cadmium arc to a carbon arc — Lenard had no monochromator in the modern sense and worked with a small number of line-rich UV emitters dispersed by quartz prism — he found that $V_s$ shifted monotonically with the dominant wavelength: shorter $\\lambda$ gave higher $V_s$. He did not fit a linear $E_{\\max}(\\nu)$; his wavelength coverage was too sparse and his sources too contaminated by lines for that. He reported the *qualitative monotonicity* and bounded the slope.\n\n**(L3) A threshold $\\nu_0$ exists, below which no current flows at any intensity.** For each cathode material there was a long-wavelength cutoff; light of $\\nu \u003c \\nu_0(\\text{material})$ produced no measurable photoemission no matter how intense. This was, in Lenard's own framing, the single observation hardest to square with any wave picture, because in a wave theory enough intensity must eventually drive any oscillator over any barrier.\n\nTogether (L1)–(L3) are *the* law Einstein explained. The 1905 paper [12] cites Lenard explicitly and approvingly; its experimental input is essentially the contents of §§17–25 of [5]. Einstein's contribution was not to derive these regularities from a continuous-field model — no such derivation exists — but to propose a *single* organizing relation,\n\n$$E_{\\max}\\;=\\;h\\nu\\;-\\;W,\\qquad \\nu_0\\;=\\;W/h,$$\n\nin which (L1) follows because one quantum interacts with one electron, (L2) because the quantum's energy is $h\\nu$, and (L3) because no quantum below $W/h$ can liberate an electron at all. The slope of $E_{\\max}(\\nu)$ is universal — equal to Planck's constant divided by the electronic charge — and the intercept is material-specific. That slope was *not* in Lenard's data; the *existence* of a positive slope was. Demonstrating the linearity, and measuring $h/e$ to the half-percent level, would wait fourteen more years for Millikan [7].\n\n### Lenard's own interpretation, and the \"trigger hypothesis\"\n\nIt is important to register that Lenard did not believe (L1)–(L3) implied light quanta. His preferred explanation in [5] and again in his 1906 Nobel lecture [13] was the *Auslösungshypothese* — the trigger hypothesis: the light merely *releases* electrons that were already in motion inside the metal, with kinetic energies set by *intra-atomic* dynamics. The frequency dependence then arose because different frequencies coupled to different bound states. The intensity-independence followed because the trigger simply opened a gate. This was a perfectly coherent classical reading of his own data; it failed not on the photoelectric measurements themselves but, much later, on the Compton effect [14] and on the temporal correlations forbidden by the Bohr–Kramers–Slater collapse [15]. The point worth keeping is that the experimentalist who discovered the law explainable by photons resisted the photon interpretation for two decades, and the textbook narrative that contracts \"Einstein predicted, Millikan confirmed\" silently elides the fact that what Einstein *explained* was already, in 1905, a published, peer-reviewed, and broadly-known body of work — and that the man who measured it died (in 1947) still insisting it required no quanta.\n\nThere is a final, often-missed subtlety in [5] that earns Lenard credit modern texts do not give: he noticed that the *number* of emitted electrons per absorbed unit of energy was anomalously small — orders of magnitude below what any classical resonance estimate predicted. He did not turn this into a quantum-yield argument, but it sits in his paper as a measured fact, and Wheaton [16] reads it as the empirical anomaly to which Einstein's \"concentration of energy into points\" was the natural answer. The \"law Einstein explained\" is therefore richer than the three bullet points: it includes a *fourth* clue — the dramatic inefficiency of light-to-electron conversion under a continuous-field picture — that the textbooks omit altogether."}, {"id": "einstein-heuristic", "title": "III. The 1905 Heuristic: What Einstein Actually Derived (and Did Not)", "markdown": "## III. The 1905 Heuristic: What Einstein Actually Derived (and Did Not)\n\nThe 1905 paper [12] is routinely cited as \"the derivation of the photoelectric equation.\" It is nothing of the sort. Einstein himself called it a *heuristischer Gesichtspunkt* — a heuristic viewpoint — and the word is doing real work in the title. The paper contains exactly one piece of original quantitative reasoning: a thermodynamic-fluctuation argument that the entropy of monochromatic radiation *in the Wien regime* mimics the entropy of a dilute ideal gas. Everything after §6 — including the famous equation $E_{\\max} = h\\nu - W$ — is plausibility argument grafted onto Lenard's empirical law [5]. Pais [82, ch. 19] is unambiguous on this point and so is Wheaton [16]; the textbooks are not.\n\n### The entropic core (§§1–6)\n\nEinstein begins from Wien's distribution, which he treats not as an approximation to Planck's law (he is at pains in 1905 to avoid Planck's resonator combinatorics) but as an *empirically given* high-frequency limit:\n\n$$\\rho(\\nu, T)\\, d\\nu = \\alpha\\,\\nu^{3}\\, e^{-\\beta\\nu / T}\\, d\\nu.$$\n\nFrom this he extracts the entropy density $\\varphi(\\rho,\\nu)$ via $\\partial\\varphi/\\partial\\rho = 1/T$. A short calculation gives\n\n$$\\varphi = -\\frac{\\rho}{\\beta\\nu}\\left[\\ln\\!\\frac{\\rho}{\\alpha\\nu^{3}} - 1\\right].$$\n\nHe then integrates over a volume $V$ and a narrow frequency band to obtain the entropy $S(E,V,\\nu)$ of radiation of energy $E$ in the band $d\\nu$, and compares its $V$-dependence to that of an ideal gas of $N$ particles:\n\n$$S(E,V) - S(E,V_{0}) = \\frac{E}{\\beta\\nu}\\,\\ln\\!\\frac{V}{V_{0}}\n\\quad\\Longleftrightarrow\\quad\nS_{\\text{gas}}(N,V) - S_{\\text{gas}}(N,V_{0}) = N k_{\\mathrm{B}} \\ln\\!\\frac{V}{V_{0}}.$$\n\nMatching coefficients — and this is the entire move — forces\n\n$$E = N \\cdot \\frac{k_{\\mathrm{B}}}{(\\,1/\\beta\\,)}\\,\\nu \\;\\equiv\\; N\\,h\\nu,$$\n\nwith $h = \\beta k_{\\mathrm{B}}$ identified after the fact with Planck's constant. The conclusion of §6 is therefore a statistical-mechanical *analogy*: monochromatic Wien-regime radiation behaves, thermodynamically, as though it consisted of $N = E/(h\\nu)$ independent localized energy parcels. Einstein nowhere claims this proves the field is quantized; he claims only that *some* observables look as if it were.\n\nThree caveats are essential and routinely lost in transmission:\n\n1. The argument is valid only in the Wien regime $h\\nu / k_{\\mathrm{B}}T \\gg 1$. In the Rayleigh–Jeans limit the same calculation yields the entropy of a *wave* system with no particle analogue. Einstein knew this; the 1909 Salzburg lecture makes the wave–particle duality of fluctuations explicit, six years before anyone else.\n2. It is a statement about *entropy*, not about photon localization in space. Nothing in §§1–6 forbids the energy parcels from being spread over many wavelengths; the spatial-localization reading is a later overlay, largely from the Compton period [14].\n3. No matrix element, no Hamiltonian, no electron appears anywhere in the derivation. The argument is pure equilibrium thermodynamics of the radiation field alone.\n\n### §§7–9: the photoelectric grafting\n\nSections 7–9 then apply the §§1–6 picture to three phenomena: Stokes' rule of fluorescence, the photoelectric effect, and the photoionization of gases. The photoelectric section is barely two pages. The reasoning is:\n\n*If* a quantum $h\\nu$ is absorbed by a single bound electron, *and if* a fixed amount of work $W$ (Einstein writes $P$, for *Austrittsarbeit*) is required to extract the electron from the metal, *then* energy balance for the single-quantum event gives\n\n$$E_{\\max} = h\\nu - W.$$\n\nThat is the whole argument. It assumes:\n\n- one-photon absorption (multiphoton processes are tacitly excluded; in 1905 there was no way to reach intensities where they matter);\n- the absorbing electron is treated as essentially free, with $W$ a scalar constant of the surface;\n- no momentum bookkeeping (the lattice silently absorbs whatever momentum is required, since a free electron cannot absorb a photon without a third body);\n- the *frequency dependence* of Lenard's data is taken as the boundary condition to be matched, not as a prediction to be tested.\n\nThe last point is the one most often misrepresented. Lenard's 1902 paper [5] had already established that $E_{\\max}$ depends on $\\nu$ and is independent of intensity, and that a threshold $\\nu_{0}$ exists. Einstein's contribution was to supply a *value* for the slope — namely $h$, the same constant that appears in Planck's blackbody law — and a *physical interpretation* for the intercept. He did not derive Lenard's law; he reproduced it parameter-free up to the surface constant $W$. As Pais puts it [17], \"the photoelectric equation is Lenard's law with Einstein's slope.\"\n\n### What a derivation would actually require\n\nA genuine first-principles derivation of the photoemission rate must compute the matrix element for a bound-state-to-continuum transition driven by the radiation field. For an electron in a state $|i\\rangle$ of binding energy $W_{i}$ absorbing a photon of mode $\\mathbf{k},\\lambda$, Fermi's golden rule gives\n\n$$\\Gamma_{i\\to\\mathbf{p}} = \\frac{2\\pi}{\\hbar}\\,\n\\left| \\langle \\mathbf{p} \\mid \\hat{H}_{\\text{int}} \\mid i \\rangle \\right|^{2}\n\\,\\delta\\!\\left(\\,\\frac{p^{2}}{2m} - W_{i} - \\hbar\\omega\\right),$$\n\nwith $\\hat{H}_{\\text{int}} = -(e/mc)\\,\\mathbf{A}\\!\\cdot\\!\\hat{\\mathbf{p}}$ in the Coulomb gauge. The $\\delta$-function enforces $E_{\\max} = \\hbar\\omega - W_{i}$ as a *kinematic consequence* of energy conservation, not as a postulate. The frequency dependence, the angular distribution, the cross-section, and the existence of Cooper minima all then follow from the matrix element rather than being added by hand.\n\nThis program was carried out by Sommerfeld and Schur in 1930 for the hydrogenic K-shell (verify), giving the canonical $Z^{5}/(\\hbar\\omega)^{7/2}$ scaling of the atomic photoelectric cross-section still used in dosimetry codes [18] and in Geant4's `G4PEEffectFluoModel` [19]. Rigorous mathematical treatment of the *external* photoelectric effect — proving that an atom in a quantized electromagnetic field actually ionizes with the rate above — required another seventy years and is the content of Bach–Klopp–Zenk [20] and Zenk [21]. The Bracher–Delos–Kleber–Kramer line [22] extends this to photoemission in external static fields, where the simple energy-conservation $\\delta$-function is replaced by the imaginary part of a Green's function.\n\nNone of this machinery is in the 1905 paper, nor could it have been: neither second quantization of the field nor a proper continuum normalization of the electronic final state existed yet. What Einstein supplied, and all he supplied, was the observation that *if* one took the §§1–6 fluctuation analogy seriously enough to grant individual energy parcels $h\\nu$, *then* Lenard's already-measured law fell out of one line of energy conservation.\n\n### A diagnostic: the 1905 paper without §7\n\nStrip §§7–9 from the 1905 paper and the argument for light quanta in §§1–6 stands or falls untouched. Strip §§1–6 and §7 becomes empty: \"assume light energy comes in lumps $h\\nu$\" with no motivation at all. The photoelectric equation is the *application* in the paper, not the *evidence*. The evidence is Wien-regime entropy. This ordering — which the title makes plain by listing *Erzeugung und Verwandlung des Lichtes* (production and transformation of light) before any mention of photoelectric currents — is the one the textbook caricature inverts, and it is why Lamb and Scully [23] could later reproduce the photoelectric law with a *classical* electromagnetic field and a quantized atom: the photoelectric effect by itself does not require, and historically did not produce, field quantization."}, {"id": "millikan-reluctance", "title": "IV. Millikan as Doubter: The Confirmer Who Set Out to Refute", "markdown": "## IV. Millikan as Doubter: The Confirmer Who Set Out to Refute\n\nThe standard pedagogical sequence — *Einstein predicted, Millikan confirmed* — is one of the more durable inversions in twentieth-century physics. Read the 1916 paper [7] as a working document rather than as the source of a textbook headline, and Millikan's posture is unmistakable: he undertook the decade-long measurement programme to *kill* the light-quantum, and was visibly unconvinced even as he tabulated the cleanest possible verification of Einstein's linear relation. The historiographic correction has been available for forty years — Pais devotes a careful section to it [17], Stuewer reconstructs the surrounding episode in detail [6], Wheaton anchors it inside the broader empirical roots of wave–particle dualism [16] — yet the inverted narrative continues to propagate through introductory textbooks.\n\n### The 1916 paper as adversarial verification\n\nMillikan's \"A Direct Photoelectric Determination of Planck's 'h'\" [7] runs 34 pages, the last six of which are an extended discussion that reads as a hostile witness's reluctant testimony. He had spent roughly ten years on the experiment, motivated initially — as he states explicitly in the discussion — by a conviction that the linear $E_\\text{max}(\\nu)$ relation could not survive at low frequencies, that the threshold $\\nu_0$ would prove apparatus-dependent, that contact-potential effects would corrupt any apparent universality of the slope $h/e$, and that careful work on freshly-machined alkali surfaces in high vacuum would expose the photon as an artefact of dirty cathodes. None of this came to pass. The slope came out as $h/e$, the same $h$ inferred from Planck's blackbody fit and from Rutherford–Geiger β-statistics, to within his stated $\\sim 0.5\\%$ uncertainty:\n\n$$h_\\text{photoelectric} = (6.57 \\pm 0.03) \\times 10^{-27}\\,\\text{erg}\\cdot\\text{s},$$\n\nagainst Planck's blackbody value of $6.55 \\times 10^{-27}$. Linearity of $V_\\text{stop}(\\nu)$ held over the entire accessible alkali range. The $y$-intercept gave a work function consistent across multiple preparations of the same metal once contact-potential corrections were applied — a correction Millikan himself had to invent the technique to handle (the rotating-knife apparatus in ultra-high vacuum that scraped fresh sodium, potassium, and lithium surfaces *in situ* before each measurement; he called it his \"machine shop in vacuo\").\n\nWhat is striking is the discussion section's refusal to grant the obvious inference. Millikan writes that Einstein's equation appears \"to predict accurately all of the facts which have been tested\" but that the *theoretical basis* — the localized light-quantum hypothesis — is \"a bold, not to say reckless, hypothesis of an electromagnetic light corpuscle of energy $h\\nu$, which flies in the face of the thoroughly established facts of interference.\" He notes the contradiction between a quantized energy parcel and the spatial spreading needed to explain diffraction, and concludes that despite \"its apparent complete success\" the photon \"seems untenable.\" He proposes instead that the equation $E_\\text{max} = h\\nu - W$ might be derivable from a continuous-wave picture in which an atomic resonance condition selects the quantum of energy released — an attempt to keep the field classical and put the discreteness inside the matter, anticipating by half a century the semiclassical analysis that Lamb and Scully [23] would eventually formalize. That instinct was not foolish; what was wrong was Millikan's reading of his own data as compatible with it. The data, on his own account, fixed $h$ from a photoelectric experiment to the same value Planck had extracted from a thermodynamic one — a coincidence that ought to have been decisive and which Millikan, to his credit and his discomfort, reported in full while refusing to be convinced.\n\n### The conversion: Compton 1923 and the Nobel lecture\n\nWhat ultimately moved Millikan was not his own experiment but Compton's [14]. The scattering of X-rays off light elements with a wavelength shift\n\n$$\\Delta\\lambda = \\frac{h}{m_e c}(1 - \\cos\\theta)$$\n\nrequired treating the photon as a kinematic object with momentum $p = h\\nu/c$, not merely an energy parcel; energy–momentum conservation in a single scattering event was incompatible with any continuous-field interpretation that could also explain photoemission. The Bohr–Kramers–Slater paper of 1924 [15] is the dying ember of the continuous-field programme: it preserved the classical field by abandoning energy conservation in individual events, and was killed within months by the Bothe–Geiger coincidence experiment showing event-by-event conservation. Millikan's 1923 Nobel lecture [24] documents the conversion in his own voice. He there describes his decade of photoelectric work as having \"compelled me in 1915 to assert its unambiguous experimental verification in spite of its unreasonableness\" and acknowledges that the Compton result has now \"removed the last vestige of doubt\" — phrasing that quietly relocates the moment of acceptance from 1916 to 1923, eight years after the data and seventeen years after Einstein's paper [12].\n\n### The Nobel-committee anomaly: 1921, the photoelectric law, and the careful sidestep\n\nThe committee that awarded Einstein the 1921 prize was acting under two interlocking constraints. General relativity remained, in the Stockholm assessors' eyes, insufficiently confirmed: Eddington's 1919 eclipse measurement had partisans and detractors in roughly equal measure, and the committee's principal evaluator on the question, Allvar Gullstrand, was openly hostile to it. The light-quantum hypothesis was, if anything, in worse standing — Bohr, Sommerfeld, and Planck himself were on record against it. The chairman, Svante Arrhenius, and the rapporteur on theoretical physics, Carl Wilhelm Oseen, engineered a citation that honored Einstein while committing the Academy to neither doctrine: \"for his services to theoretical physics, and especially for his discovery of the *law* of the photoelectric effect.\" The wording is deliberate. *Law*, not *hypothesis*; *photoelectric effect*, not *light-quantum*.\n\nTwo anomalies follow. The first is attributional: the *law* — meaning the empirical regularities of frequency-determined maximum energy, threshold, and intensity-independence — is Lenard's, not Einstein's. It was Lenard who, in the 1902 paper [5], established the qualitative dependences that Einstein then quantified by hypothesis in 1905. The Nobel citation therefore credits Einstein for a result whose experimental authorship belongs, by the committee's own standard of evidence, to the prior laureate (Lenard, 1905, for cathode rays [13]). The second anomaly is documentary: the official presentation speech by Arrhenius [25] dwells at length on Einstein's services to Brownian motion, specific heats, and theoretical physics broadly, treats the photoelectric equation as a mathematical relation that has been \"rigorously tested by the American Millikan,\" and pointedly avoids any endorsement of the quantum *interpretation*. Arrhenius even remarks that \"Einstein's theory of relativity… does not, in essentials, concern physics, but belongs in epistemology,\" a polite excision that the modern reader can read in only one way.\n\nEinstein himself completed the choreography. His Nobel lecture, delivered in Gothenburg on 11 July 1923 [26], was on relativity, not the photoelectric effect — a deliberate refusal to pretend that the prize had been for the work he had actually done. He did not lecture on photons in Stockholm because the committee had not, in any meaningful sense, given him a prize for photons. By the time he might have, Compton had made the question moot."}, {"id": "landmarks-and-closure", "title": "V. Landmark Experiments and the Closure of the Light-Quantum Debate", "markdown": "## V. Landmark Experiments and the Closure of the Light-Quantum Debate\n\nSection II showed that Lenard [5] had established the photoelectric law by 1902; section III that Einstein's 1905 paper [12] was a heuristic, not a derivation; section IV that Millikan [7] published in 1916 the experiment he had designed to refute. The pedagogically tidy story stops there — photoelectric measurements are said to have proved the photon. They did not. As Lamb and Scully would later make explicit [23], the entire photoelectric corpus admits a semiclassical reading: quantized atom, classical field. The light-quantum was settled by a different experiment on a different process — Compton scattering, and specifically the coincidence test by Bothe and Geiger that killed the last continuous-field counter-model. The photoelectric line fixed the empirical canon; the Compton line forced field quantization.\n\n### Enabling technology: the Elster–Geitel alkali photocells\n\nThe experimental sequence from Lenard to Millikan rested on an instrumentation advance rarely named in textbooks. Julius Elster and Hans Geitel, from 1889 onward [10], systematically built and improved sealed-glass photocells using alkali-metal cathodes — first sodium and potassium, later rubidium and caesium — exploiting the empirical fact (which they themselves established) that the threshold wavelength shifts steadily to the red as one descends the alkali column. Their cells opened the visible-light regime: a Cs cathode responds usefully to $\\lambda \\lesssim 600$ nm, where Lenard's spark-illuminated zinc plates were dead. Millikan's 1916 apparatus depends on that lineage. His rotating cylinder carried sodium, potassium, and lithium surfaces freshly shaved in vacuo precisely because Elster and Geitel had already shown which alkalis reached deep enough into the visible to span a wide range of $h\\nu - W$. Without alkali photocathodes, there is no clean linear fit of stopping potential against frequency.\n\n### Millikan 1916: precision under hostile premises\n\nThe 1916 *Physical Review* paper [7] is the apex of the photoelectric measurement programme. Retarding-potential geometry made the stopping potential $V_s$ a directly measured quantity, and the vacuum knife — shaving the alkali surface inside the evacuated cell to expose a clean facet — defeated the oxide-contamination problem that had distorted Lenard's earlier work-function estimates. The result was\n\n$$eV_s = h\\nu - W,$$\n\nverified linearly across the visible and near-UV, with $h$ extracted from the slope to about $0.5\\%$ — at the time the cleanest direct determination of Planck's constant. As §IV documented, Millikan in 1916 still rejected the photon: pp. 384–388 of [7] dismiss the light-quantum as \"a bold, not to say reckless, hypothesis.\" Pais [17] and Stuewer [6] both note this is the documentary fingerprint of an experiment that fixes an empirical law without persuading its author of the underlying ontology. The photoelectric line, even at its most precise, was empirically conclusive and theoretically inert.\n\n### Compton 1923: per-event momentum conservation\n\nWhat forced the photon was a different observable. In late 1922 Arthur Compton submitted to *Physical Review* the kinematic analysis of X-ray scattering from light-element targets [14], deriving the wavelength shift\n\n$$\\Delta\\lambda = \\lambda' - \\lambda = \\frac{h}{m_e c}\\,(1 - \\cos\\theta)$$\n\nfrom per-event four-momentum conservation between a quantum of energy $h\\nu$ and momentum $h\\nu/c$ and a quasi-free electron. The crucial novelty over the photoelectric effect is the momentum. Einstein's 1905 heuristic assigns only energy to the quantum; Compton's analysis requires that each quantum carry a definite three-momentum that is exchanged with one electron in one event. Stuewer's monograph [6] traces ledger by ledger how Compton's data — together with Debye's independent derivation the same year — closed off the wave-picture alternatives (Doppler shifts on accelerated free electrons, multi-wavelength fluorescence). The shift matched experiment within error and depended on Planck's constant in a way no continuous-field model could replicate without ad hoc additions.\n\n### Bohr–Kramers–Slater 1924: the last continuous-field counter-model\n\nThose ad hoc additions were supplied — once — by Bohr, Kramers, and Slater [15]. The BKS proposal sought to retain a classical, continuous electromagnetic field while accommodating the discrete spectroscopic events of atomic physics. Its price was severe: energy and momentum were to be conserved only statistically, not in individual processes. Each excited atom radiated a \"virtual field\" inducing transitions in distant atoms with appropriate probabilities, but no individual emission–absorption pair needed to balance. For Compton scattering specifically, BKS predicted that the scattered X-ray quantum and the recoil electron should be statistically independent: no coincidence between a scattered photon at angle $\\theta$ and a recoil electron at the kinematically conjugate angle $\\varphi$. The theory was internally consistent and was taken seriously precisely because Bohr was its principal author.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"20\" y=\"180\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"50\" y=\"205\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eX-ray\u003c/text\u003e\u003ctext x=\"50\" y=\"222\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003esource\u003c/text\u003e\u003cline x1=\"85\" y1=\"200\" x2=\"275\" y2=\"200\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"278,200 268,196 268,204\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"170\" y=\"190\" fill=\"#ffb86b\" font-size=\"14\"\u003ehν, p = hν/c\u003c/text\u003e\u003ccircle cx=\"290\" cy=\"200\" r=\"6\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"290\" y=\"170\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003etarget electron\u003c/text\u003e\u003cline x1=\"296\" y1=\"196\" x2=\"475\" y2=\"92\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"478,90 468,89 470,99\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"370\" y=\"130\" fill=\"#ffb86b\" font-size=\"14\"\u003ehν′, θ\u003c/text\u003e\u003cline x1=\"296\" y1=\"206\" x2=\"475\" y2=\"308\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"478,310 468,302 466,311\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"370\" y=\"285\" fill=\"#7aa2ff\" font-size=\"14\"\u003erecoil e⁻, φ\u003c/text\u003e\u003crect x=\"485\" y=\"60\" width=\"90\" height=\"60\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"530\" y=\"85\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eGeiger A\u003c/text\u003e\u003ctext x=\"530\" y=\"105\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003e(scattered γ)\u003c/text\u003e\u003crect x=\"485\" y=\"280\" width=\"90\" height=\"60\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"530\" y=\"305\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eGeiger B\u003c/text\u003e\u003ctext x=\"530\" y=\"325\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003e(recoil e⁻)\u003c/text\u003e\u003cline x1=\"575\" y1=\"90\" x2=\"635\" y2=\"188\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"575\" y1=\"310\" x2=\"635\" y2=\"212\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003crect x=\"635\" y=\"180\" width=\"70\" height=\"40\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"670\" y=\"197\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003ecoincidence\u003c/text\u003e\u003ctext x=\"670\" y=\"213\" fill=\"#ff7a90\" font-size=\"12\" text-anchor=\"middle\"\u003eA ∧ B\u003c/text\u003e\u003ctext x=\"20\" y=\"365\" fill=\"#e8e6e1\" font-size=\"13\"\u003eCompton (1923): per-event hν = hν′ + T_e, Δλ = (h/m_e c)(1 − cos θ)\u003c/text\u003e\u003ctext x=\"20\" y=\"385\" fill=\"#ff7a90\" font-size=\"13\"\u003eBKS (1924): A,B statistically independent. Bothe–Geiger (1925): coincidences observed.\u003c/text\u003e\u003c/svg\u003e\n*Figure: Compton scattering as the closure experiment. BKS predicted no correlation between the scattered-quantum detector A and the recoil-electron detector B; Bothe–Geiger found the conjugate-angle coincidence rate demanded by per-event four-momentum conservation, killing the last continuous-field model.*\n\n### Bothe–Geiger 1925 and Compton–Simon 1925: the falsification\n\nWalther Bothe and Hans Geiger built the coincidence experiment BKS demanded, using two Geiger needle counters gated by a mechanical commutator with a coincidence window of order $10^{-3}$ s (verify on exact figure). Their result, published in *Zeitschrift für Physik* in 1925 (verify: Bothe \u0026 Geiger, ZS Phys. 32, 639), was unambiguous: coincidence rates between the scattered X-ray and the recoil electron exceeded chance by orders of magnitude and matched the per-event prediction of [14]. Independently, A. H. Compton and A. W. Simon (verify: *Phys. Rev.* 26, 289 (1925)), using cloud-chamber recoils together with the angles of secondary photo-electrons made by the scattered X-rays, verified that $\\theta$ and $\\varphi$ were kinematically conjugate event-by-event. BKS collapsed within months; Bohr himself withdrew it. From this point the light-quantum was experimental fact, even if the word *photon* had to wait for Lewis [27] in 1926, and the rigorous matrix-element treatment of bound→continuum photoemission for the late 1920s. The Nobel committee's careful avoidance — Arrhenius's 1922 presentation [25] honoring Einstein's \"law\" without endorsing the quantum — was, by 1926, an evasion of nothing.\n\n### Hughes–DuBridge 1932: the empirical canon fixed\n\nThe interwar synthesis is Hughes and DuBridge, *Photoelectric Phenomena* [4]. The book is rarely opened now, but it is the document that fixed what counted as the canonical photoelectric corpus: the linear $V_s(\\nu)$ law verified on every clean metal and alkali; the work-function spread across crystallographic facets; the temperature dependence near threshold (the Fowler tail); the dependence of quantum yield on surface preparation. Their tabulations were the empirical reference for surface physics for two decades and remain the cleanest summary of the pre-band-structure, pre-attosecond era. They are also the source for one of the persistent textbook conflations §VI will untangle — the use of a single scalar $W$ for what is in fact a facet- and adsorbate-dependent surface quantity Lenard had already flagged in 1902."}, {"id": "four-effects-one-name", "title": "VI. Four Effects, One Name: Conflations the Modern Literature Still Carries", "markdown": "## VI. Four Effects, One Name: Conflations the Modern Literature Still Carries\n\nThe phrase \"photoelectric effect\" is a piece of nineteenth-century naming that has outlived its referent. By 1905 the term already covered phenomena that we now know to involve distinct Hamiltonians, distinct selection rules, distinct experimental signatures, and distinct industrial applications. The modern textbook treats them as one entry because Einstein's 1905 paper [12] is the lecturer's favorite vehicle for introducing $h\\nu$, and the historical pedagogy has rewarded compression. What follows is the untangling.\n\n### VI.1 Four physically distinct effects\n\n**(i) External photoelectric effect (photoemission).** This is Lenard's effect [5] and Einstein's effect [12]: a photon of energy $h\\nu \u003e W$ ejects an electron from a condensed-matter surface into vacuum, with maximum kinetic energy\n$$E_{\\max} = h\\nu - W.$$\nThe matrix element is $\\langle \\mathbf{k}_f \\mid \\hat{H}_{\\mathrm{int}} \\mid \\psi_i \\rangle$ with $\\hat{H}_{\\mathrm{int}} = -(e/mc)\\,\\mathbf{A}\\cdot\\mathbf{p}$, the initial state $\\psi_i$ is a bound or band state, and the final state $\\mathbf{k}_f$ is a free-electron continuum state matched to a Bloch state inside the solid (the three-step model: optical excitation, transport to the surface, transmission across the surface barrier). The phenomenon is surface-physics-dominated; the bulk absorption depth ($\\sim 10\\,\\mathrm{nm}$ in the UV) is large compared to the electron escape depth ($\\sim 1\\,\\mathrm{nm}$), which is why ARPES is a surface technique.\n\n**(ii) Internal photoelectric effect (photoconductivity).** No electron leaves the solid. A photon of energy exceeding the band gap (or an impurity ionization energy) promotes a carrier from valence to conduction band, increasing the conductivity. Willoughby Smith's 1873 observation that the resistance of selenium drops under illumination is the founding observation; Minchin's 1890 paper [28] and his 1908 *Nature* note [8] are firmly in this tradition — Minchin was building astronomical photometers from selenium cells, exploiting photoconductivity. The relevant law is not $E_{\\max} = h\\nu - W$ but\n$$\\sigma(\\nu) = e\\bigl[\\mu_n \\Delta n(\\nu) + \\mu_p \\Delta p(\\nu)\\bigr], \\qquad \\Delta n(\\nu) \\propto \\alpha(\\nu) \\tau \\Phi(\\nu),$$\nwith $\\alpha$ the absorption coefficient, $\\tau$ the carrier lifetime, $\\Phi$ the photon flux. The \"threshold\" here is the band gap, not the work function; the work function does not enter at all. To call Minchin's selenium experiments \"photoelectric\" is correct in 1890 vocabulary and badly misleading in 2026 vocabulary.\n\n**(iii) Atomic photoelectric effect (X-ray K- and L-shell ionization).** A photon with $h\\nu$ from a few keV to a few MeV ejects a bound atomic electron (preferentially K-shell, when energetically allowed). This is the dominant photon interaction at low energy in high-$Z$ materials and the workhorse process of dosimetry, radiography, and PET. The non-relativistic K-shell cross section per atom, derived by Sauter (1931) from Sommerfeld's bound-state wavefunctions, scales as\n$$\\sigma_{\\mathrm{ph}}^{K} \\;\\approx\\; \\frac{32\\sqrt{2}\\,\\pi}{3}\\,\\alpha^{4}\\, Z^{5}\\, \\sigma_{T}\\, \\left(\\frac{m_e c^2}{h\\nu}\\right)^{7/2}, \\qquad h\\nu \\ll m_e c^2,$$\nwith the characteristic $Z^{n}/(h\\nu)^{7/2}$ behaviour and saw-tooth absorption edges at the K, L, M binding energies. The Geant4 toolkit [19] and its PET specialization GATE [29], together with the Hubbell–Seltzer NIST tables [18], compute exactly this process under the name `G4PhotoElectricEffect`. There is no work function, no surface, no band structure; the relevant energy scale is the atomic binding energy $E_B$ of the ionized shell, and the emitted electron carries $h\\nu - E_B$ followed by Auger or fluorescence relaxation of the hole. Calling this \"Einstein's effect\" — as many medical-physics texts do — confuses a single-atom QED process with a many-body condensed-matter process.\n\n**(iv) Photovoltaic effect.** Edmond Becquerel's 1839 observation of a photo-induced EMF across an electrolyte/electrode interface is the founding event; the modern manifestation is the $p$–$n$ junction solar cell, in which absorption creates electron–hole pairs that are separated by the built-in field of the depletion region. The relevant physics is the Shockley diode equation with an added photocurrent term:\n$$J = J_{0}\\!\\left[\\exp\\!\\left(\\frac{eV}{nk_{B}T}\\right)-1\\right] - J_{\\mathrm{ph}}(\\nu).$$\nKesterite-cell papers like [30] and back-contact-cell texturing studies like [31] live in this domain. The threshold is again the band gap; the work function enters only as a contact-engineering parameter, not as the photothreshold. Becquerel preceded Hertz by 48 years and Einstein by 66, and his effect is closer in spirit to a battery than to a vacuum photodiode.\n\nThe four effects share the property \"current proportional to light intensity\" and almost nothing else. The matrix elements differ, the threshold energies differ, the relevant materials differ, the dominant range of $h\\nu$ differs by six orders of magnitude.\n\n### VI.2 \"The photoelectric effect proves light is quantized\" — it does not\n\nThis is the most persistent confusion in undergraduate teaching. The Lamb–Scully semiclassical analysis [23] takes a *classical* electromagnetic field $\\mathbf{E}(t) = \\mathbf{E}_0 \\cos\\omega t$ and a quantized atomic Hamiltonian, evaluates first-order time-dependent perturbation theory, and obtains an ionization rate\n$$\\Gamma_{i\\to f}(\\omega) \\;\\propto\\; \\lvert \\langle f \\mid \\mathbf{d}\\cdot\\mathbf{E}_0 \\mid i \\rangle \\rvert^{2}\\, \\delta(E_f - E_i - \\hbar\\omega),$$\nwhich reproduces (a) a sharp frequency threshold at $\\hbar\\omega = E_B$, (b) photocurrent linear in intensity $\\lvert E_0 \\rvert^2$, and (c) maximum kinetic energy $\\hbar\\omega - E_B$ — the entire Einstein–Lenard phenomenology. The atom enforces the energy quantum; the field does not need to. Mandel's later analyses confirmed this and located the *genuine* signatures of field quantization elsewhere: antibunching ($g^{(2)}(0) \u003c 1$), sub-Poissonian photon statistics, and the violation of Bell-type inequalities by entangled-photon pairs. None of these is a photoelectric experiment. The rigorous mathematical re-derivations in the QED setting [20, 21] are technical refinements of Lamb–Scully's point, not refutations of it. The honest pedagogical statement is: the photoelectric effect is *consistent* with field quantization, *inspired* the photon, and *cannot distinguish* it from a quantized atom in a classical field.\n\n### VI.3 The work function is not \"the binding energy of the most weakly bound electron\"\n\nThe textbook gloss is wrong by construction. The work function is\n$$W = -e\\phi(\\infty) - \\mu_{\\bar e},$$\nthe difference between the vacuum electrostatic potential just outside the surface and the bulk electrochemical potential of the electron. The first term contains the surface dipole layer $D$, which depends on how electron density spills out of the lattice — and that spill depends on the crystallographic facet. For tungsten the measured facet-dependent values are $W(110) \\approx 5.25\\,\\mathrm{eV}$, $W(100) \\approx 4.63\\,\\mathrm{eV}$, $W(111) \\approx 4.47\\,\\mathrm{eV}$; for copper the spread is $\\sim 0.7\\,\\mathrm{eV}$. Submonolayer adsorbates (Cs on W reduces $W$ by $\\sim 3\\,\\mathrm{eV}$; oxygen on most metals raises it) shift $W$ further. Lenard already knew this empirically — his obsessive surface-cleaning protocols in [5] are why his stopping potentials were reproducible — and Millikan's \"machine-shop in vacuo\" scraping apparatus [7] was an explicit engineering response to the same fact. Modern reassessments [11] continue to find $\\sim 0.1\\,\\mathrm{eV}$ scatter between nominally equivalent measurements. The bulk electronic structure fixes $\\mu_{\\bar e}$; the surface fixes $W$. Conflating them turns photoemission into a bulk probe, which it is not.\n\n### VI.4 \"Millikan first measured $h$\"\n\nPlanck inferred $h \\approx 6.55\\times 10^{-34}\\,\\mathrm{J\\,s}$ in 1900 from the blackbody fit, accurate to $\\sim 1\\%$. Rutherford and Geiger (1908) bounded it from $\\beta$-spectrum endpoints. What Millikan did in 1916 [7] was provide the cleanest *direct* photoelectric determination, obtaining $h$ to $\\sim 0.5\\%$ via the slope $dV_{\\mathrm{stop}}/d\\nu = h/e$ and an independent electronic charge from his own oil-drop work. That is a precision triumph and a methodological vindication of Einstein's linear law; it is not the first measurement of $h$. The textbook elision of Planck's blackbody value compresses a sixteen-year history into a single name, in exactly the same way the elision of Lenard compresses thirteen years of experimental work into Einstein's heuristic paper."}, {"id": "valid-superseded", "title": "VII. What Still Holds, What Was Superseded, and in Which Regime", "markdown": "## VII. What Still Holds, What Was Superseded, and in Which Regime\n\nThe Einstein–Lenard relation\n\n$$E_{\\max} = h\\nu - W$$\n\nis a regime-limited statement masquerading in textbooks as a universal law. Its operational domain is narrow but enormously important; outside it, the formula is replaced by structures of greater richness. The audit below is regime-by-regime, kept honest about which observables are genuinely quantum-optical and which the semiclassical theory of Lamb and Scully [23] already reproduces.\n\n### 1. The single-photon perturbative regime: still exact\n\nConditions: weak monochromatic field, $h\\nu$ a few eV above $W$, ponderomotive energy $U_p = e^2 E_0^2/(4m\\omega^2) \\ll h\\nu - W$, Keldysh parameter\n\n$$\\gamma = \\frac{\\omega \\sqrt{2 m W}}{e E_0} \\gg 1.$$\n\nIn this regime $E_{\\max} = h\\nu - W$ is operationally exact and remains the workhorse of angle-resolved photoemission spectroscopy (ARPES): the photoemission cut-off above the Fermi level *is* the Einstein edge, and the inferred binding-energy axis is calibrated by it. The Fowler tail at $T \u003e 0$ — photocurrent rising as $T^2 f((h\\nu - h\\nu_0)/k_B T)$ for $h\\nu$ near threshold — is the only routine correction; the Lenard–Einstein law remains the high-$\\nu$ asymptote. Spicer's three-step decomposition (optical excitation, transport, surface escape) refines $W$ and the matrix element but leaves Einstein's spectral edge untouched. Rigorous mathematical derivations of the law in this regime, with the EM field quantized and the atom treated non-perturbatively, are in Bach–Klopp–Zenk [20] and Zenk [21]: they show that $E_{\\max} = h\\nu - W$ follows from QED in the long-time, weak-coupling limit — exactly the regime in which Fermi's golden rule applies.\n\n### 2. Multiphoton ionization and above-threshold ionization (ATI)\n\nWhen $h\\nu \u003c W$ but the intensity is high enough that the perturbative expansion in $E_0$ still converges, the leading process is $n$-photon absorption. The Einstein edge becomes a *comb*:\n\n$$E_{\\max}^{(n)} = n h\\nu - W - U_p, \\quad n = n_{\\min}, n_{\\min}+1, \\dots$$\n\nwith $n_{\\min} = \\lceil W/h\\nu \\rceil$. The $-U_p$ shift is the AC Stark elevation of the continuum threshold — invisible to the original photoelectric experiments because $U_p \\sim 10^{-6}$ eV at Lenard's intensities, but the dominant correction in modern table-top experiments. The Agostini–Fabre 1979 observation of ATI peaks separated by $h\\nu$ above the naive threshold is the modern signature; the Einstein formula is its $n=1$ entry. Sub-photon-energy photoemission reports such as [32] are best read as multiphoton signals at the lowest detectable $n=2$, not as failures of the Einstein relation. The corpus also contains entries (e.g. [33] on zero-energy photoelectrons) that probe the structure of the comb at $E_{\\max}^{(n)} \\to 0^+$, where Coulomb focusing and Freeman resonances dominate.\n\n### 3. The Keldysh crossover and the tunneling regime ($\\gamma \\lesssim 1$)\n\nKeldysh's 1965 paper unified the photoelectric and field-emission limits in a single non-perturbative theory: the ionization rate of an electron bound by $W$ in a field $E_0 \\cos\\omega t$ scales as\n\n$$\\Gamma \\sim \\exp\\!\\left[-\\frac{2 W}{\\hbar\\omega} f(\\gamma)\\right],$$\n\nwith $f(\\gamma) \\to \\ln(2\\gamma) - 1$ in the multiphoton limit and $f(\\gamma) \\to 2/3 \\cdot \\gamma^{-1}$ recovering the DC Fowler–Nordheim tunneling exponent as $\\gamma \\to 0$. The Einstein equation is a property of the $\\gamma \\gg 1$ multiphoton wing; in the $\\gamma \\ll 1$ tunneling regime there is no \"absorbed photon\" at all — the bound state tilts and the electron leaks through a quasi-static barrier — and the kinetic-energy distribution is set by the vector potential $A(t_i)$ at the instant of tunneling, not by $h\\nu$. The strong-field approximation (SFA), the Lewenstein model, and Coulomb-corrected SFA are the descendant frameworks. Bracher *et al.* [22] is a useful corpus entry on the related photoionization-in-external-fields problem, where the Einstein edge is dressed by the static field into a quasi-Landau ladder.\n\n### 4. Attosecond streaking: timing replaces energetics as the observable\n\nThe arrival of carrier-envelope-phase-stable few-cycle IR pulses and isolated attosecond XUV pulses turned the photoelectric effect into a *clock* rather than a spectrometer. In attosecond streaking, an XUV pump photoemits at time $t_0$; the IR streak field translates the final momentum by $\\Delta p = -eA(t_0)/c$; the measured spectrogram inverts to give an Eisenbud–Wigner–Smith group delay. Cheng *et al.* [34] is a corpus example of this time-domain manipulation. The notable conceptual point: the streaking delay is *not* \"how long the electron took to escape\" in any classical sense; it is the energy derivative of the scattering phase plus a Coulomb–laser coupling correction, and its interpretation cost more than a decade of literature to settle. The Einstein equation survives here only as the spectral centroid of the unstreaked photoelectron; the physics of interest lives in the phase.\n\n### 5. Semiclassical equivalence and the genuinely quantum-optical residue\n\nThe methodological caution from §VI bears repeating in the audit. The single-photon law, the threshold, the linear $E_{\\max}(\\nu)$, the Poisson photocount distribution in a coherent beam, and indeed the entire Lenard–Einstein–Millikan dataset are reproduced by a *semiclassical* theory in which only the atom is quantized and the field is a c-number [23]. The photoelectric effect therefore demonstrates the quantization of *atomic energy levels*, not of the field. Genuinely quantum-optical observables — antibunching $g^{(2)}(0) \u003c 1$, sub-Poissonian photocount variance, two-photon interference, heralded single-photon detection — require photon-statistics measurements that no nineteenth- or early-twentieth-century photoelectric experiment performed. Modern photodetection theory cleanly separates these: the click-rate is universally semiclassical; the click-*correlations* are not.\n\n### 6. Surface physics: $W$ is the regime variable\n\nThe Einstein law treats $W$ as a material constant. It is not. The work function depends on crystallographic facet (up to $\\sim 1$ eV variation between Cu(100), (110), (111)), surface dipole, adsorbates, band-bending in semiconductors, image-charge corrections at finite distance, and the electrochemical potential of the contact through which the photocurrent returns. Lenard already noticed the polish/oxidation pathology; modern reassertions are explicit in [11]. Two corollaries: (i) $W$ measured photoelectrically and $W$ measured by Kelvin probe agree only when the same reference level is used; (ii) the \"vectorial photoelectric effect\" — a polarization-dependent surface contribution where $p$-polarized light couples to the surface dipole through the longitudinal field component — is a genuine extension of the law, not a violation: [35] documents it on Cu. The in-plane photoelectric effect in 2D electron systems [36] is a further regime where the bulk three-step picture breaks down because there is no bulk.\n\n### 7. The atomic (X-ray) photoelectric channel\n\nWhat dosimetry and Monte Carlo codes call the \"PhotoElectric\" process [19, 29, 18] is the bound-electron ejection cross-section for $h\\nu \\gg W$ but $h\\nu$ comparable to inner-shell binding energies. The relevant law is not Einstein's but the Sauter–Stobbe–Pratt cross-section, scaling as $\\sigma_K \\propto Z^n/(h\\nu)^{7/2}$ for the K-shell well above its edge, with sharp absorption edges replacing any notion of \"threshold.\" Einstein's $h\\nu - W$ survives only as the kinetic-energy of the photoelectron, with $W$ now the shell binding energy. This is the regime in which XPS and PET attenuation modelling live; it shares its name with the surface photoemission problem and almost nothing else.\n\n### Regime summary\n\n| Regime | Controlling parameter | Status of $E_{\\max} = h\\nu - W$ | Replacement / extension |\n|---|---|---|---|\n| Single-photon, perturbative | $\\gamma \\gg 1$, $U_p \\ll h\\nu - W$ | exact | Fermi's golden rule, Spicer three-step |\n| Multiphoton / ATI | $\\gamma \\gtrsim 1$ | $n h\\nu - W - U_p$ comb | LOPT, SFA |\n| Strong-field tunneling | $\\gamma \\ll 1$ | inapplicable | Keldysh 1965, Lewenstein model |\n| Attosecond timing | streak-field $A(t)$ | spectral centroid only | Eisenbud–Wigner–Smith delay, TDDFT |\n| Atomic (X-ray) | $h\\nu \\gg W$ inner-shell | edge structure, not threshold | Sauter–Stobbe–Pratt; codes [19, 29, 18] |\n| 2D / surface-engineered | reduced dimensionality, facet | $W$ is not a material constant | vectorial effect [35], in-plane [36] |\n\nThe pedagogical lesson the modern literature still under-stresses: Einstein's formula is not the photoelectric law; it is *one spectral edge of one regime* of a far richer family of light–matter coupling processes, and its survival in textbooks owes as much to its historical canonization as to its operational range."}, {"id": "frontier", "title": "VIII. Frontier: Attosecond Photoemission, Surface Work Functions, and Open Problems", "markdown": "## VIII. Frontier: Attosecond Photoemission, Surface Work Functions, and Open Problems\n\nA century after the heuristic [12], the photoelectric effect is no longer a problem of *whether* light is quantized — it is a problem of *when*, *from where*, and *with what cross section*. Three research programs occupy the live frontier: (a) the chronometry of photoemission on the attosecond scale and the meaning of the Wigner–Smith delay in interacting systems; (b) the ab initio prediction of work functions and quantum efficiencies for photocathodes and surface catalysis; (c) the bound-state → continuum matrix element entering the atomic photoelectric cross section used by Geant4 [19] and its successors for dosimetry and PET reconstruction. Each program has a different mix of \"genuinely open\" and \"merely technically hard,\" and the distinction is worth keeping straight.\n\n### 1. The Eisenbud–Wigner–Smith delay and the Schultze controversy\n\nThe natural object in one-photon photoemission from a bound state $|i\\rangle$ into continuum channel $|f, E\\rangle$ is the complex dipole matrix element\n\n$$M_{fi}(E) = \\langle f, E\\,|\\,\\hat{d}\\,|\\,i\\rangle = |M_{fi}(E)|\\, e^{i\\eta_{fi}(E)}.$$\n\nThe Eisenbud–Wigner–Smith (EWS) delay is the energy derivative of the scattering phase,\n\n$$\\tau_{\\mathrm{EWS}} = \\hbar\\, \\frac{d\\eta_{fi}}{dE},$$\n\ninherited from half-collision theory (Wigner 1955; Smith 1960). For a Coulombic continuum the long-range logarithmic phase diverges, so physical measurement reports only *relative* delays between channels — plus a Coulomb–laser coupling correction systematized by Pazourek, Nagele and Burgdörfer.\n\nIn 2010, Schultze et al. used isolated ~100 eV XUV attopulses with an IR streaking field to measure $\\Delta\\tau_{2p-2s} = 21 \\pm 5$ as in neon — the first attosecond chronometry of photoemission. Independent-particle theory predicted ~4 as; RPAE with intershell correlation reached ~6–10 as. The disagreement persisted through several iterations and resolution did not arrive until [Isinger et al. (Science 358, 893, 2017)](https://www.science.org/doi/10.1126/science.aao7043) showed that **unresolved 2s shake-up satellites** had contaminated the 2s photoline; with shake-up resolved, the experimental delay drops to ~10 as and lands on theory. The episode is now read as a warning about the implicit channel assumption in streaking: the measured $\\tau$ is whatever superposition of final states is spectrally unresolved, *not* the EWS delay of a clean channel. [34] is representative of subsequent work on controlling these channels in the time domain; [22] embeds the photoelectric matrix element in external fields.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eAttosecond streaking spectrogram for Ne 2s and 2p\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"368\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eXUV–IR delay τ →\u003c/text\u003e\u003ctext x=\"35\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 35 200)\"\u003ephotoelectron E_kin →\u003c/text\u003e\u003cpolyline points=\"80,120 110,103 140,95 170,101 200,117 230,135 260,144 290,141 320,126 350,107 380,96 410,97 440,110 470,129 500,143 530,144 560,131 590,112 620,97 650,97 680,109\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.5\"/\u003e\u003cpolyline points=\"80,247 110,230 140,213 170,205 200,211 230,227 260,245 290,254 320,251 350,236 380,218 410,206 440,207 470,220 500,239 530,253 560,254 590,241 620,222 650,207 680,207\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"688\" y=\"98\" fill=\"#ffb86b\" font-size=\"14\"\u003e2p band\u003c/text\u003e\u003ctext x=\"688\" y=\"208\" fill=\"#7aa2ff\" font-size=\"14\"\u003e2s band\u003c/text\u003e\u003cline x1=\"142\" y1=\"58\" x2=\"142\" y2=\"90\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/\u003e\u003cline x1=\"172\" y1=\"58\" x2=\"172\" y2=\"200\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/\u003e\u003cline x1=\"142\" y1=\"58\" x2=\"172\" y2=\"58\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"142,58 149,54 149,62\" fill=\"#7ee0a3\"/\u003e\u003cpolygon points=\"172,58 165,54 165,62\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"157\" y=\"48\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eΔτ (2p−2s)\u003c/text\u003e\u003ctext x=\"600\" y=\"60\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"end\"\u003e⟨E_kin⟩ ≈ 85 eV\u003c/text\u003e\u003ctext x=\"600\" y=\"180\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"end\"\u003e⟨E_kin⟩ ≈ 58 eV\u003c/text\u003e\u003ctext x=\"380\" y=\"318\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eτ_EWS = ℏ · dη(E)/dE Schultze 2010: 21±5 as → Isinger 2017: ~10 as\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Attosecond streaking of Ne 2s and 2p. The IR vector potential modulates the kinetic energy of each photoelectron line in phase with the carrier; a relative shift Δτ in the streaking trace gives the channel-resolved EWS delay (plus Coulomb-laser coupling). The original ~21 as discrepancy was traced to unresolved 2s shake-up satellites. IR period ~2.5 fs; Δτ shown exaggerated for visibility.*\n\nWhat is *not* settled is conceptual. The EWS delay is a property of an *outgoing wave packet's group delay relative to a Coulombic reference*, not the \"instant of ionization.\" In strongly correlated channels — Cooper minima, autoionizing resonances, the giant 4d resonance in Xe — $d\\eta/dE$ changes sign and the very notion of a localized emission event becomes ill-defined; see the [Kheifets (2023) review](https://iopscience.iop.org/article/10.1088/1361-6455/acb188). Whether \"the time photoemission takes\" is operationally meaningful beyond a specific measurement protocol is genuinely open. Rigorous QED treatments [20, 21] reproduce the rate but say nothing about a delay observable.\n\n### 2. Surface work functions: facets, dipoles, and the photocathode problem\n\nSection VII flagged that $W$ is not a bulk quantity. The Smoluchowski mechanism — surface charge spilling into vacuum smooths the electron density and generates a dipole barrier — produces facet-resolved values that differ by ~0.5 eV on the same metal: Cu(111) ≈ 4.94 eV, Cu(100) ≈ 4.59 eV, Cu(110) ≈ 4.48 eV. Adsorbates shift these further. Cs at sub-monolayer coverage drops Cu(100) below 2.0 eV; co-deposition of Cs and O on GaAs produces *negative electron affinity* (NEA) cathodes used in spin-polarized electron sources at CEBAF and planned for the EIC. [11] is one of many attempts to make a photoelectric measurement of $W$ truly reliable; the difficulty is that the measurement averages over whatever facet and adsorbate distribution the sample actually presents.\n\nFor accelerator photocathodes the engineering target is high quantum efficiency at a chosen drive-laser wavelength with picosecond response and small thermal emittance. Alkali antimonides (Cs$_3$Sb, K$_2$CsSb, Na$_2$KSb) deliver QE \u003e 5% in the green but suffer vacuum-limited lifetimes and poor spatial $W$ uniformity. Ab initio PBE-DFT underestimates $W$ for these compounds by 0.3–0.6 eV; hybrid functionals and GW improve agreement at a cost that does not yet scale to reconstructed surfaces with realistic adsorbate coverage. This is *technically hard, not conceptually open*: exchange–correlation in inhomogeneous interacting electron systems near a vacuum boundary is understood; sub-50-meV ab initio $W$ for a real photocathode is not.\n\nTwo adjacent frontiers are conceptually richer. **Plasmon-assisted hot-carrier photoemission** [37] exploits sub-threshold ($h\\nu \u003c W$) emission via plasmon decay into a non-thermal electron distribution; the transport and momentum-matching steps that govern the external yield are not captured by Spicer's three-step model and remain genuinely contested. **Vectorial / in-plane photoemission** [35, 36] — where emission depends on the polarization component normal to the surface in ways the Fowler–DuBridge formulation does not predict — sits in a similar grey zone between interface-corrected single-particle theory and many-body response.\n\n### 3. Atomic photoelectric cross sections for dosimetry, PET, and radiotherapy\n\nIn the 1 keV – 1 MeV regime relevant to medical and nuclear instrumentation, the relevant object is the atomic K-shell cross section. Sauter's 1931 closed form, $\\sigma_K \\propto Z^5 (\\alpha/\\hbar\\omega)^{7/2}$ at $\\hbar\\omega \\gg E_K$, fails both near threshold (final-state Coulomb wave) and at high energies (relativistic, retardation, and binding corrections). Reference tabulations — Scofield's relativistic Hartree–Slater calculations, Hubbell and Seltzer's compilation [18] — are interpolated at run time by Geant4 [19] and GATE [29]; both still show ≥10% disagreement with measurements within ~50 eV of an absorption edge, where solid-state EXAFS/XANES structure and many-body shake-up redistribute oscillator strength outside the single-active-electron, free-atom approximation. For PET dose this is a few-percent systematic on low-Z scatter; for K-edge subtraction synchrotron imaging it dominates. Recent ab initio work [38] revisits DFT and post-DFT computation of one-photon photoelectric cross sections in few-electron systems but does not yet deliver sub-percent accuracy across the full keV–MeV range.\n\n### What is genuinely open versus technically hard\n\n- *Genuinely open.* The operational meaning of \"time of photoemission\" in strongly correlated channels; whether plasmonic and vectorial sub-threshold emission requires beyond-single-particle theory; the role of shake-up and inner-shell correlation in apparent attosecond delays.\n- *Technically hard but understood.* Ab initio work functions for compound photocathodes with realistic adsorbates; atomic photoelectric cross sections to sub-percent accuracy near edges and at high $Z$; full-pulse streaking simulations with every final-state channel resolved.\n\nThe 1905 heuristic [12] answered a question that is, on the modern frontier, no longer the question being asked. What remains of the Einstein–Lenard [5] law is a regime statement of remarkable robustness; what is being pursued is the structure of $M_{fi}(E)$ — its phase, its many-body content, its surface and adsorbate dressing — and the chronometry of the transition itself."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier dismantling a textbook story. Here is what I think survives, what does not, and where I would put my own time.\n\n### What I will defend\n\nThe historical claim that **Lenard, not Einstein, established the photoelectric law** is not revisionist mischief; it is what the 1902 *Annalen* paper [5] actually contains. Einstein [12] explained a regularity Lenard had already measured to within his (considerable) systematic error. I will also defend, against a still-popular undergraduate slogan, that **the photoelectric effect does not by itself prove field quantization**. The semiclassical reduction (Lamb–Scully, Mandel) is mathematically clean: a quantized atom in a c-number field reproduces threshold, linearity, and even the apparent \"instantaneity\" once you treat the matrix element honestly. The genuine quantum-optical signatures are antibunching and sub-Poissonian counting, not a stopping-potential plot. Finally, I will defend the position that **Millikan was a hostile witness**, not a vindicator — his 1916 paper [7] and his own Nobel lecture say so in plain English, and the pedagogical inversion of this is one of the more embarrassing pieces of folklore the community still teaches.\n\n### What is shakier than the literature admits\n\nThree assumptions deserve more skepticism than they get.\n\nFirst, the **work function as a material constant**. $W$ is a surface-dipole quantity; the same crystal can show $\\Delta W \\sim 1\\ \\text{eV}$ across facets, and adsorbate-induced shifts of comparable magnitude. Every \"measurement of $h/e$ from the photoelectric effect\" is really a measurement of $h/e$ *plus a model of the surface dipole during the experiment*. Lenard knew this; modern undergraduate labs pretend not to.\n\nSecond, the **photon as a free-space particle picture of photoemission**. The 1905 heuristic [12] treats the absorber as a single electron receiving one quantum. The actual transition is a many-body process: the photohole, the screening cloud, the image-state ladder, and (at femtosecond resolution) the build-up of the asymptotic Coulomb tail are all part of \"absorbing the photon.\" The Sommerfeld–Schur matrix element captures the kinematics; it does not address the dynamics that attosecond streaking now resolves.\n\nThird, the **\"instantaneous\" emission assumption** $\\tau_{\\text{emit}} \\to 0$. Streaking and RABBITT measurements give finite, regime-dependent Wigner–Eisenbud delays of order $10$–$100\\ \\text{as}$ from atoms and surfaces. These are small, but they are not zero, and they decisively falsify the strict $\\delta(t)$ picture used in every \"Einstein versus classical\" pedagogical comparison.\n\n### Three open problems I would actually work on\n\n1. **Absolute, gauge-invariant photoemission time delays from solids.** What does \"when did the electron leave\" mean when initial and final states are both delocalized? The Eisenbud–Wigner–Smith definition is not obviously the right observable for a band electron.\n2. **Strong-field/multiphoton regime as a continuous deformation of the Einstein law.** Keldysh $\\gamma \\sim 1$ is where photoemission stops being one-photon and starts being tunnelling; the crossover is a clean testbed for non-perturbative QED in condensed matter.\n3. **Surface-dipole engineering of $W$ for precision metrology.** If we want photoemission-based realizations of $h/e$ at the $10^{-9}$ level, the limiting uncertainty is now $W$, not $h$. This is a materials-science problem masquerading as a fundamental-constants problem.\n\nRanked by what I think is *tractable and decisive*: (3) \u003e (2) \u003e (1).\n\n**Reading path:**\n1. Lenard, *Ueber die lichtelektrische Wirkung*, 1902 [5] — the actual law, in the actual prose, before the legend.\n2. Einstein, *Ann. Phys.* 17, 132 (1905) [12] — read it as a heuristic, not a derivation; notice what it does not prove.\n3. Millikan, *Phys. Rev.* 7, 355 (1916) [7] — read the introduction; he tells you he is trying to refute Einstein.\n4. The rigorous Sommerfeld–Schur-style matrix-element treatment in the modern mathematical-physics line [20], [21] — what a real derivation of the law looks like.\n5. A current attosecond-photoemission review or work-function audit [11] — where the field actually lives now, and why $W$ is the bottleneck."}], "references": [{"n": 1, "title": "Ueber einen Einfluss des ultravioletten Lichtes auf die electrische Entladung", "authors": ["Heinrich Hertz"], "year": 1887, "venue": "Annalen der Physik 267(8): 983–1000", "url": "https://doi.org/10.1002/andp.18872670827", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Ueber den Einfluss des Lichtes auf electrostatisch geladene Körper", "authors": ["Wilhelm Hallwachs"], "year": 1888, "venue": "Annalen der Physik 269(2): 301–312", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Sur une sorte de function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
