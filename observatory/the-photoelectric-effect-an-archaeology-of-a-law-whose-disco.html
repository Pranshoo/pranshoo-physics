<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Photoelectric Effect: An Archaeology of a Law Whose Discoverers Were Edited Out", "alternativeHeadline": "photoelectric effect", "name": "photoelectric effect", "description": "From Hertz's spark gap to QED matrix elements — and the four phenomena hiding under one name", "inLanguage": "en", "keywords": ["photoelectric effect", "Hertz effect (1887 spark-gap observation)", "Hallwachs effect (UV discharge of negative metals)", "Stoletov effect / Stoletov's laws", "lichtelektrischer Effekt (German literature)", "external photoeffect (to distinguish from inner/photoconductive effect)", "photoemission"], "about": [{"@type": "Thing", "name": "photoelectric effect"}, {"@type": "Thing", "name": "Hertz effect (1887 spark-gap observation)"}, {"@type": "Thing", "name": "Hallwachs effect (UV discharge of negative metals)"}, {"@type": "Thing", "name": "Stoletov effect / Stoletov's laws"}, {"@type": "Thing", "name": "lichtelektrischer Effekt (German literature)"}, {"@type": "Thing", "name": "external photoeffect (to distinguish from inner/photoconductive effect)"}, {"@type": "Thing", "name": "photoemission"}], "articleSection": "DEEP DIVE", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-photoelectric-effect-an-archaeology-of-a-law-whose-disco.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-photoelectric-effect-an-archaeology-of-a-law-whose-disco.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "I. Hertz, Hallwachs, Stoletov, Righi: The Decade Before Einstein I. Hertz, Hallwachs, Stoletov, Righi: The Decade Before Einstein The standard pedagogical compression — \"Hertz noticed sparks, Einstein explained, Millikan confirmed\" — telescopes a dense decade of experimental work into a single anecdote. What actually happened between November 1886 and 1899 is the construction, by four laboratories working largely independently, of the empirical scaffold onto which Einstein's 1905 heuristic was later bolted. Three of those four men are systematically under-credited in Anglophone textbooks; the fourth — Hertz — is credited for the wrong reason. The German literature of the period, moreover, distinguished cleanly between two named effects ( Hertz-Effekt and Hallwachs-Effekt ) that modern writing has fused under a single umbrella. We reconstruct the actual sequence. Hertz, November 1886 — an obstruction noticed, not a phenomenon sought Hertz was not investigating photoemission. He was running the receiver loop of his electromagnetic-wave apparatus, trying to detect the micrometer sparks induced by an oscillating primary discharge, and he found that placing an opaque screen between the primary spark and the receiver gap reduced the receiver's spark length. By systematically swapping screens — glass, quartz, fluorite — he isolated the effective agent as the ultraviolet component of the primary's own light, and demonstrated that UV falling on the negative receiver electrode lowered the breakdown threshold of the gap . The paper, \"Ueber einen Einfluss des ultravioletten Lichtes auf die electrische Entladung\" (Annalen 267, 1887), is meticulous about the optics — Hertz tabulates the transmission cutoffs of his screens — but explicitly disclaims any theoretical interpretation: he reports an Einfluss , an influence, and leaves the mechanism open. Two things should be emphasized. First, Hertz had no notion of electron emission; the electron was a decade in the future. Second, his geometry — a spark-gap with both electrodes simultaneously illuminated in an ambient gas — is not the geometry of any modern photoelectric experiment. The \"Hertz effect\" of the German literature, narrowly construed, is the UV-assisted breakdown of a discharge gap, a gas-discharge phenomenon as much as a surface one. The unification with photoemission proper came later and required other experimentalists. Hallwachs, February 1888 — the bulk-metal effect Wilhelm Hallwachs, working in Dresden, performed the cleanest possible reduction of Hertz's geometry: he removed the spark entirely. A negatively charged, freshly polished zinc plate connected to a Hankel electroscope was illuminated by an arc lamp; the leaves collapsed. A positively charged plate, illuminated identically, did not. The discharge was therefore one-sided — light removed negative charge from metal surfaces — and required neither a counter-electrode nor a gas discharge to manifest . In Hallwachs's own framing the question was electrostatic, not corpuscular: what does light do to the surface charge of an isolated conductor? The carriers were anonymous. This is the phenomenon that the German literature, including the bibliographies of Lenard (1902) and the older volumes of Wiedemann's Elektricität , called Hallwachs-Effekt — distinct from Hertz-Effekt . The distinction is not pedantic. Hertz's geometry confounds gas-phase ionization with surface emission; Hallwachs's geometry isolates the surface contribution. When the photocell industry eventually emerged it was Hallwachs's configuration, not Hertz's, that became the prototype. Stoletov, summer 1888 — the first quantitative law and the first photocell Aleksandr Grigorievich Stoletov in Moscow read both Hertz and Hallwachs by early 1888 and within months produced the decisive quantitative work that the Anglophone tradition almost entirely omits. Publishing in French in the Comptes Rendus to maximize Western reach , Stoletov made three contributions, each of which independently deserves textbook status: 1. He replaced the floating electroscope geometry with a circuit: an illuminated metal cathode, a transparent mesh anode held at variable positive potential by an external EMF, and a sensitive galvanometer in the loop. This is the topology of the modern phototube and, with the polarity flipped, of the photodiode. 2. He measured the saturation current as a function of incident UV intensity and established what later Soviet textbooks codify as Stoletov's first law : at fixed spectral composition and sufficient anode bias, the photocurrent is proportional to the incident radiant flux, 3. He characterized the role of gas pressure in the cell, demonstrating that the photocurrent rose to a maximum near a specific reduced pressure (the so-called Stoletovsche Konstante , p/E \\approx 0.4\\text{ mm Hg / V cm}^{-1} for air) and fell at both higher and lower pressures — implicitly distinguishing the genuine surface emission from secondary gas amplification. The proportionality (1) is one of the two empirical pillars of the photoelectric law; Lenard's 1902 frequency dependence is the other. In the Russian, Polish, and older French literature the laws of 1888 and 1902 are routinely co-credited as Stoletov–Lenard. The Anglophone displacement of Stoletov — visible already in the 1932 Hughes \u0026 DuBridge monograph , which treats him as a footnote — is partly a Cold-War artefact, partly a consequence of his publishing venue (the Comptes Rendus notes are short and bibliographically inconspicuous), and partly because Lenard's apparatus was an order of magnitude more sensitive. But priority on the intensity law is unambiguous. Righi, 1888 — independent confirmation and the word itself Working in Bologna, Augusto Righi reproduced the discharge phenomenon and the polarity dependence independently and almost simultaneously, communicating his results to the Accademia dei Lincei and subsequently in Nuovo Cimento . His lasting contribution is linguistic: he introduced the Italian adjective fotoelettrico , which entered French as photoélectrique and English as photoelectric . The German term lichtelektrisch — used by Lenard in his 1902 title, Ueber die lichtelektrische Wirkung — is a calque, but the cognate that ultimately won internationally is Righi's. The credit audit summarized in our verified archaeology makes the point bluntly: the modern name of the effect is Italian (verify, for the precise date of Righi's coinage I rely on the Wheaton reconstruction and biographical sources rather than direct inspection of the Lincei communications). Elster and Geitel — the missing instrument-builders A parallel programme is essential to acknowledge here even though its detailed analysis belongs to later sections. From 1889 onward Julius Elster and Hans Geitel in Wolfenbüttel built progressively more sensitive cells using alkali-metal cathodes — sodium, then potassium, then rubidium and caesium — and discovered, empirically and decades before any electronic theory could rationalize it, that the threshold wavelength moved into the visible as one descended the alkali column. Every precision photoelectric measurement of the next thirty years, including Lenard's 1902 work, Millikan's 1916 h determination , and the astronomical photometry of Minchin , ran on Elster–Geitel cells or their direct descendants. Their decades-long series in the Annalen is the experimental substrate of the field. They appear in no introductory textbook. J. J. Thomson, 1899 — naming the carriers The closing act of the pre-Einstein decade was Thomson's determination that the carriers liberated by UV light from a zinc surface had the same e/m as the cathode-ray corpuscles he had measured two years earlier . Only at this point — twelve years after Hertz — did it become legitimate to say that light ejects electrons from metals . Before 1897 there were no electrons to eject; before 1899 there was no proof the photoelectric carriers were the same particles. The Hertz-Effekt and Hallwachs-Effekt of the German literature now had a common microscopic agent, and the two names began their slow merger into the single Anglophone photoelectric effect . The unification was therefore neither Hertz's nor Hallwachs's: it was Thomson's identification of the carrier that retroactively collapsed two distinct discharge phenomena into one. The empirical law — intensity proportionality plus, after Lenard, a frequency threshold — was already complete by 1902, with Einstein's manuscript still three years away. II. Lenard 1902: The Law Einstein Explained II. Lenard 1902: The Law Einstein Explained By the time Philipp Lenard sat down to write his 198-page treatise Ueber die lichtelektrische Wirkung , the qualitative phenomenon had been mature for fourteen years. Hertz had seen UV shorten the spark gap; Hallwachs had stripped negative charge from zinc; Stoletov had drawn the first i(V) characteristic of a photocell and established the proportionality of saturation current to incident flux; Elster and Geitel had built alkali-metal cathodes whose sensitivities ran from the near-UV well into the visible; and J. J. Thomson had, in 1899, weighed the emitted carriers and found e/m identical to that of cathode rays. What was missing was a quantitative kinematic statement about the energies of the ejected electrons. Lenard supplied it. The apparatus: a retarding-potential spectrometer for slow electrons Lenard's instrument was not the schematic \"vacuum diode with a battery\" of the textbooks. It was a differential energy analyzer purpose-built for sub-volt electrons, exploiting a geometry that decoupled emission, drift, and analysis. Figure: Lenard's retarding-potential geometry. UV from a carbon or zinc-spark arc illuminates the cathode U; emitted electrons drift field-free to an aperture A and then climb (or fail to climb) a retarding potential −V between grid G and collector C. The collector current i(V) measured by a quadrant electrometer is the integrated energy distribution of the photoelectrons. Several features of this design — almost none of which survive in the textbook compression — were essential to the result. First, the cathode-to-grid space was held at zero field, so the electrons emerged with their kinetic energies as ejected , unmodified by accelerating bias. Second, the retarder V was a small, calibrated, reversible voltage of order 0.1–10 V, not a battery in series with the photocurrent. Third, Lenard worked in the best vacuum he could reach (Gaede rotary mercury pumps, 10^{-5} Torr) precisely because Stoletov's earlier work had shown the current was pressure-dependent — an effect we now recognize as gas-phase ionization amplification. Fourth, Lenard cycled cathode materials and surface preparations (Al, Zn, Cu, Pt; freshly turned, polished, oxidized), discovering already that the relevant energetic offset depended on the surface state, not the bulk identity, of the metal — the Verunreinigungsproblem he flags repeatedly and which is the conceptual ancestor of the modern facet-dependent work function (corpus reasserts this against a century of neglect). The measured quantity was the stopping potential V s at which i(V s) \\to 0: The three regularities From the family of curves i(V; I, \\nu, \\text{material}) — where I is intensity, \\nu frequency — Lenard extracted three statements that the 1905 heuristic would later have to reproduce. (L1) Saturation current is proportional to intensity, but E {\\max} is not. At V \\ll -V s the collector floor is flat at zero; at V \\gg 0 it saturates at i {\\text{sat}}\\propto I. Crucially, the foot of the curve — the point at which i first vanishes — does not move with I. Doubling the arc brightness doubled the number of electrons but did not raise the energy of the fastest among them by a measurable amount. This was the most surprising single result of the paper, because it explicitly contradicts the resonance picture of light absorption that every classical theorist (Thomson, Lenard included) had been working with: in a resonant oscillator driven by a continuous wave, kinetic energy at saturation must scale with field amplitude squared, i.e. with intensity. (L2) E {\\max} grows with frequency. Substituting the spark source from a zinc arc to a cadmium arc to a carbon arc — Lenard had no monochromator in the modern sense and worked with a small number of line-rich UV emitters dispersed by quartz prism — he found that V s shifted monotonically with the dominant wavelength: shorter \\lambda gave higher V s. He did not fit a linear E {\\max}(\\nu); his wavelength coverage was too sparse and his sources too contaminated by lines for that. He reported the qualitative monotonicity and bounded the slope. (L3) A threshold \\nu 0 exists, below which no current flows at any intensity. For each cathode material there was a long-wavelength cutoff; light of \\nu \u003c \\nu 0(\\text{material}) produced no measurable photoemission no matter how intense. This was, in Lenard's own framing, the single observation hardest to square with any wave picture, because in a wave theory enough intensity must eventually drive any oscillator over any barrier. Together (L1)–(L3) are the law Einstein explained. The 1905 paper cites Lenard explicitly and approvingly; its experimental input is essentially the contents of §§17–25 of . Einstein's contribution was not to derive these regularities from a continuous-field model — no such derivation exists — but to propose a single organizing relation, in which (L1) follows because one quantum interacts with one electron, (L2) because the quantum's energy is h\\nu, and (L3) because no quantum below W/h can liberate an electron at all. The slope of E {\\max}(\\nu) is universal — equal to Planck's constant divided by the electronic charge — and the intercept is material-specific. That slope was not in Lenard's data; the existence of a positive slope was. Demonstrating the linearity, and measuring h/e to the half-percent level, would wait fourteen more years for Millikan . Lenard's own interpretation, and the \"trigger hypothesis\" It is important to register that Lenard did not believe (L1)–(L3) implied light quanta. His preferred explanation in and again in his 1906 Nobel lecture was the Auslösungshypothese — the trigger hypothesis: the light merely releases electrons that were already in motion inside the metal, with kinetic energies set by intra-atomic dynamics. The frequency dependence then arose because different frequencies coupled to different bound states. The intensity-independence followed because the trigger simply opened a gate. This was a perfectly coherent classical reading of his own data; it failed not on the photoelectric measurements themselves but, much later, on the Compton effect and on the temporal correlations forbidden by the Bohr–Kramers–Slater collapse . The point worth keeping is that the experimentalist who discovered the law explainable by photons resisted the photon interpretation for two decades, and the textbook narrative that contracts \"Einstein predicted, Millikan confirmed\" silently elides the fact that what Einstein explained was already, in 1905, a published, peer-reviewed, and broadly-known body of work — and that the man who measured it died (in 1947) still insisting it required no quanta. There is a final, often-missed subtlety in that earns Lenard credit modern texts do not give: he noticed that the number of emitted electrons per absorbed unit of energy was anomalously small — orders of magnitude below what any classical resonance estimate predicted. He did not turn this into a quantum-yield argument, but it sits in his paper as a measured fact, and Wheaton reads it as the empirical anomaly to which Einstein's \"concentration of energy into points\" was the natural answer. The \"law Einstein explained\" is therefore richer than the three bullet points: it includes a fourth clue — the dramatic inefficiency of light-to-electron conversion under a continuous-field picture — that the textbooks omit altogether. III. The 1905 Heuristic: What Einstein Actually Derived (and Did Not) III. The 1905 Heuristic: What Einstein Actually Derived (and Did Not) The 1905 paper is routinely cited as \"the derivation of the photoelectric equation.\" It is nothing of the sort. Einstein himself called it a heuristischer Gesichtspunkt — a heuristic viewpoint — and the word is doing real work in the title. The paper contains exactly one piece of original quantitative reasoning: a thermodynamic-fluctuation argument that the entropy of monochromatic radiation in the Wien regime mimics the entropy of a dilute ideal gas. Everything after §6 — including the famous equation E {\\max} = h\\nu - W — is plausibility argument grafted onto Lenard's empirical law . Pais [82, ch. 19] is unambiguous on this point and so is Wheaton ; the textbooks are not. The entropic core (§§1–6) Einstein begins from Wien's distribution, which he treats not as an approximation to Planck's law (he is at pains in 1905 to avoid Planck's resonator combinatorics) but as an empirically given high-frequency limit: From this he extracts the entropy density \\varphi(\\rho,\\nu) via \\partial\\varphi/\\partial\\rho = 1/T. A short calculation gives He then integrates over a volume V and a narrow frequency band to obtain the entropy S(E,V,\\nu) of radiation of energy E in the band d\\nu, and compares its V-dependence to that of an ideal gas of N particles: Matching coefficients — and this is the entire move — forces with h = \\beta k {\\mathrm{B}} identified after the fact with Planck's constant. The conclusion of §6 is therefore a statistical-mechanical analogy : monochromatic Wien-regime radiation behaves, thermodynamically, as though it consisted of N = E/(h\\nu) independent localized energy parcels. Einstein nowhere claims this proves the field is quantized; he claims only that some observables look as if it were. Three caveats are essential and routinely lost in transmission: 1. The argument is valid only in the Wien regime h\\nu / k {\\mathrm{B}}T \\gg 1. In the Rayleigh–Jeans limit the same calculation yields the entropy of a wave system with no particle analogue. Einstein knew this; the 1909 Salzburg lecture makes the wave–particle duality of fluctuations explicit, six years before anyone else. 2. It is a statement about entropy , not about photon localization in space. Nothing in §§1–6 forbids the energy parcels from being spread over many wavelengths; the spatial-localization reading is a later overlay, largely from the Compton period . 3. No matrix element, no Hamiltonian, no electron appears anywhere in the derivation. The argument is pure equilibrium thermodynamics of the radiation field alone. §§7–9: the photoelectric grafting Sections 7–9 then apply the §§1–6 picture to three phenomena: Stokes' rule of fluorescence, the photoelectric effect, and the photoionization of gases. The photoelectric section is barely two pages. The reasoning is: If a quantum h\\nu is absorbed by a single bound electron, and if a fixed amount of work W (Einstein writes P, for Austrittsarbeit ) is required to extract the electron from the metal, then energy balance for the single-quantum event gives That is the whole argument. It assumes: - one-photon absorption (multiphoton processes are tacitly excluded; in 1905 there was no way to reach intensities where they matter); - the absorbing electron is treated as essentially free, with W a scalar constant of the surface; - no momentum bookkeeping (the lattice silently absorbs whatever momentum is required, since a free electron cannot absorb a photon without a third body); - the frequency dependence of Lenard's data is taken as the boundary condition to be matched, not as a prediction to be tested. The last point is the one most often misrepresented. Lenard's 1902 paper had already established that E {\\max} depends on \\nu and is independent of intensity, and that a threshold \\nu {0} exists. Einstein's contribution was to supply a value for the slope — namely h, the same constant that appears in Planck's blackbody law — and a physical interpretation for the intercept. He did not derive Lenard's law; he reproduced it parameter-free up to the surface constant W. As Pais puts it , \"the photoelectric equation is Lenard's law with Einstein's slope.\" What a derivation would actually require A genuine first-principles derivation of the photoemission rate must compute the matrix element for a bound-state-to-continuum transition driven by the radiation field. For an electron in a state i\\rangle of binding energy W {i} absorbing a photon of mode \\mathbf{k},\\lambda, Fermi's golden rule gives with \\hat{H} {\\text{int}} = -(e/mc)\\,\\mathbf{A}\\!\\cdot\\!\\hat{\\mathbf{p}} in the Coulomb gauge. The \\delta-function enforces E {\\max} = \\hbar\\omega - W {i} as a kinematic consequence of energy conservation, not as a postulate. The frequency dependence, the angular distribution, the cross-section, and the existence of Cooper minima all then follow from the matrix element rather than being added by hand. This program was carried out by Sommerfeld and Schur in 1930 for the hydrogenic K-shell (verify), giving the canonical Z^{5}/(\\hbar\\omega)^{7/2} scaling of the atomic photoelectric cross-section still used in dosimetry codes and in Geant4's G4PEEffectFluoModel . Rigorous mathematical treatment of the external photoelectric effect — proving that an atom in a quantized electromagnetic field actually ionizes with the rate above — required another seventy years and is the content of Bach–Klopp–Zenk and Zenk . The Bracher–Delos–Kleber–Kramer line extends this to photoemission in external static fields, where the simple energy-conservation \\delta-function is replaced by the imaginary part of a Green's function. None of this machinery is in the 1905 paper, nor could it have been: neither second quantization of the field nor a proper continuum normalization of the electronic final state existed yet. What Einstein supplied, and all he supplied, was the observation that if one took the §§1–6 fluctuation analogy seriously enough to grant individual energy parcels h\\nu, then Lenard's already-measured law fell out of one line of energy conservation. A diagnostic: the 1905 paper without §7 Strip §§7–9 from the 1905 paper and the argument for light quanta in §§1–6 stands or falls untouched. Strip §§1–6 and §7 becomes empty: \"assume light energy comes in lumps h\\nu\" with no motivation at all. The photoelectric equation is the application in the paper, not the evidence . The evidence is Wien-regime entropy. This ordering — which the title makes plain by listing Erzeugung und Verwandlung des Lichtes (production and transformation of light) before any mention of photoelectric currents — is the one the textbook caricature inverts, and it is why Lamb and Scully could later reproduce the photoelectric law with a classical electromagnetic field and a quantized atom: the photoelectric effect by itself does not require, and historically did not produce, field quantization. IV. Millikan as Doubter: The Confirmer Who Set Out to Refute IV. Millikan as Doubter: The Confirmer Who Set Out to Refute The standard pedagogical sequence — Einstein predicted, Millikan confirmed — is one of the more durable inversions in twentieth-century physics. Read the 1916 paper as a working document rather than as the source of a textbook headline, and Millikan's posture is unmistakable: he undertook the decade-long measurement programme to kill the light-quantum, and was visibly unconvinced even as he tabulated the cleanest possible verification of Einstein's linear relation. The historiographic correction has been available for forty years — Pais devotes a careful section to it , Stuewer reconstructs the surrounding episode in detail , Wheaton anchors it inside the broader empirical roots of wave–particle dualism — yet the inverted narrative continues to propagate through introductory textbooks. The 1916 paper as adversarial verification Millikan's \"A Direct Photoelectric Determination of Planck's 'h'\" runs 34 pages, the last six of which are an extended discussion that reads as a hostile witness's reluctant testimony. He had spent roughly ten years on the experiment, motivated initially — as he states explicitly in the discussion — by a conviction that the linear E \\text{max}(\\nu) relation could not survive at low frequencies, that the threshold \\nu 0 would prove apparatus-dependent, that contact-potential effects would corrupt any apparent universality of the slope h/e, and that careful work on freshly-machined alkali surfaces in high vacuum would expose the photon as an artefact of dirty cathodes. None of this came to pass. The slope came out as h/e, the same h inferred from Planck's blackbody fit and from Rutherford–Geiger β-statistics, to within his stated \\sim 0.5\\% uncertainty: against Planck's blackbody value of 6.55 \\times 10^{-27}. Linearity of V \\text{stop}(\\nu) held over the entire accessible alkali range. The y-intercept gave a work function consistent across multiple preparations of the same metal once contact-potential corrections were applied — a correction Millikan himself had to invent the technique to handle (the rotating-knife apparatus in ultra-high vacuum that scraped fresh sodium, potassium, and lithium surfaces in situ before each measurement; he called it his \"machine shop in vacuo\"). What is striking is the discussion section's refusal to grant the obvious inference. Millikan writes that Einstein's equation appears \"to predict accurately all of the facts which have been tested\" but that the theoretical basis — the localized light-quantum hypothesis — is \"a bold, not to say reckless, hypothesis of an electromagnetic light corpuscle of energy h\\nu, which flies in the face of the thoroughly established facts of interference.\" He notes the contradiction between a quantized energy parcel and the spatial spreading needed to explain diffraction, and concludes that despite \"its apparent complete success\" the photon \"seems untenable.\" He proposes instead that the equation E \\text{max} = h\\nu - W might be derivable from a continuous-wave picture in which an atomic resonance condition selects the quantum of energy released — an attempt to keep the field classical and put the discreteness inside the matter, anticipating by half a century the semiclassical analysis that Lamb and Scully would eventually formalize. That instinct was not foolish; what was wrong was Millikan's reading of his own data as compatible with it. The data, on his own account, fixed h from a photoelectric experiment to the same value Planck had extracted from a thermodynamic one — a coincidence that ought to have been decisive and which Millikan, to his credit and his discomfort, reported in full while refusing to be convinced. The conversion: Compton 1923 and the Nobel lecture What ultimately moved Millikan was not his own experiment but Compton's . The scattering of X-rays off light elements with a wavelength shift required treating the photon as a kinematic object with momentum p = h\\nu/c, not merely an energy parcel; energy–momentum conservation in a single scattering event was incompatible with any continuous-field interpretation that could also explain photoemission. The Bohr–Kramers–Slater paper of 1924 is the dying ember of the continuous-field programme: it preserved the classical field by abandoning energy conservation in individual events, and was killed within months by the Bothe–Geiger coincidence experiment showing event-by-event conservation. Millikan's 1923 Nobel lecture documents the conversion in his own voice. He there describes his decade of photoelectric work as having \"compelled me in 1915 to assert its unambiguous experimental verification in spite of its unreasonableness\" and acknowledges that the Compton result has now \"removed the last vestige of doubt\" — phrasing that quietly relocates the moment of acceptance from 1916 to 1923, eight years after the data and seventeen years after Einstein's paper . The Nobel-committee anomaly: 1921, the photoelectric law, and the careful sidestep The committee that awarded Einstein the 1921 prize was acting under two interlocking constraints. General relativity remained, in the Stockholm assessors' eyes, insufficiently confirmed: Eddington's 1919 eclipse measurement had partisans and detractors in roughly equal measure, and the committee's principal evaluator on the question, Allvar Gullstrand, was openly hostile to it. The light-quantum hypothesis was, if anything, in worse standing — Bohr, Sommerfeld, and Planck himself were on record against it. The chairman, Svante Arrhenius, and the rapporteur on theoretical physics, Carl Wilhelm Oseen, engineered a citation that honored Einstein while committing the Academy to neither doctrine: \"for his services to theoretical physics, and especially for his discovery of the law of the photoelectric effect.\" The wording is deliberate. Law , not hypothesis ; photoelectric effect , not light-quantum . Two anomalies follow. The first is attributional: the law — meaning the empirical regularities of frequency-determined maximum energy, threshold, and intensity-independence — is Lenard's, not Einstein's. It was Lenard who, in the 1902 paper , established the qualitative dependences that Einstein then quantified by hypothesis in 1905. The Nobel citation therefore credits Einstein for a result whose experimental authorship belongs, by the committee's own standard of evidence, to the prior laureate (Lenard, 1905, for cathode rays ). The second anomaly is documentary: the official presentation speech by Arrhenius dwells at length on Einstein's services to Brownian motion, specific heats, and theoretical physics broadly, treats the photoelectric equation as a mathematical relation that has been \"rigorously tested by the American Millikan,\" and pointedly avoids any endorsement of the quantum interpretation . Arrhenius even remarks that \"Einstein's theory of relativity… does not, in essentials, concern physics, but belongs in epistemology,\" a polite excision that the modern reader can read in only one way. Einstein himself completed the choreography. His Nobel lecture, delivered in Gothenburg on 11 July 1923 , was on relativity, not the photoelectric effect — a deliberate refusal to pretend that the prize had been for the work he had actually done. He did not lecture on photons in Stockholm because the committee had not, in any meaningful sense, given him a prize for photons. By the time he might have, Compton had made the question moot. V. Landmark Experiments and the Closure of the Light-Quantum Debate V. Landmark Experiments and the Closure of the Light-Quantum Debate Section II showed that Lenard had established the photoelectric law by 1902; section III that Einstein's 1905 paper was a heuristic, not a derivation; section IV that Millikan published in 1916 the experiment he had designed to refute. The pedagogically tidy story stops there — photoelectric measurements are said to have proved the photon. They did not. As Lamb and Scully would later make explicit , the entire photoelectric corpus admits a semiclassical reading: quantized atom, classical field. The light-quantum was settled by a different experiment on a different process — Compton scattering, and specifically the coincidence test by Bothe and Geiger that killed the last continuous-field counter-model. The photoelectric line fixed the empirical canon; the Compton line forced field quantization. Enabling technology: the Elster–Geitel alkali photocells The experimental sequence from Lenard to Millikan rested on an instrumentation advance rarely named in textbooks. Julius Elster and Hans Geitel, from 1889 onward , systematically built and improved sealed-glass photocells using alkali-metal cathodes — first sodium and potassium, later rubidium and caesium — exploiting the empirical fact (which they themselves established) that the threshold wavelength shifts steadily to the red as one descends the alkali column. Their cells opened the visible-light regime: a Cs cathode responds usefully to \\lambda \\lesssim 600 nm, where Lenard's spark-illuminated zinc plates were dead. Millikan's 1916 apparatus depends on that lineage. His rotating cylinder carried sodium, potassium, and lithium surfaces freshly shaved in vacuo precisely because Elster and Geitel had already shown which alkalis reached deep enough into the visible to span a wide range of h\\nu - W. Without alkali photocathodes, there is no clean linear fit of stopping potential against frequency. Millikan 1916: precision under hostile premises The 1916 Physical Review paper is the apex of the photoelectric measurement programme. Retarding-potential geometry made the stopping potential V s a directly measured quantity, and the vacuum knife — shaving the alkali surface inside the evacuated cell to expose a clean facet — defeated the oxide-contamination problem that had distorted Lenard's earlier work-function estimates. The result was verified linearly across the visible and near-UV, with h extracted from the slope to about 0.5\\% — at the time the cleanest direct determination of Planck's constant. As §IV documented, Millikan in 1916 still rejected the photon: pp. 384–388 of dismiss the light-quantum as \"a bold, not to say reckless, hypothesis.\" Pais and Stuewer both note this is the documentary fingerprint of an experiment that fixes an empirical law without persuading its author of the underlying ontology. The photoelectric line, even at its most precise, was empirically conclusive and theoretically inert. Compton 1923: per-event momentum conservation What forced the photon was a different observable. In late 1922 Arthur Compton submitted to Physical Review the kinematic analysis of X-ray scattering from light-element targets , deriving the wavelength shift from per-event four-momentum conservation between a quantum of energy h\\nu and momentum h\\nu/c and a quasi-free electron. The crucial novelty over the photoelectric effect is the momentum. Einstein's 1905 heuristic assigns only energy to the quantum; Compton's analysis requires that each quantum carry a definite three-momentum that is exchanged with one electron in one event. Stuewer's monograph traces ledger by ledger how Compton's data — together with Debye's independent derivation the same year — closed off the wave-picture alternatives (Doppler shifts on accelerated free electrons, multi-wavelength fluorescence). The shift matched experiment within error and depended on Planck's constant in a way no continuous-field model could replicate without ad hoc additions. Bohr–Kramers–Slater 1924: the last continuous-field counter-model Those ad hoc additions were supplied — once — by Bohr, Kramers, and Slater . The BKS proposal sought to retain a classical, continuous electromagnetic field while accommodating the discrete spectroscopic events of atomic physics. Its price was severe: energy and momentum were to be conserved only statistically, not in individual processes. Each excited atom radiated a \"virtual field\" inducing transitions in distant atoms with appropriate probabilities, but no individual emission–absorption pair needed to balance. For Compton scattering specifically, BKS predicted that the scattered X-ray quantum and the recoil electron should be statistically independent: no coincidence between a scattered photon at angle \\theta and a recoil electron at the kinematically conjugate angle \\varphi. The theory was internally consistent and was taken seriously precisely because Bohr was its principal author. Figure: Compton scattering as the closure experiment. BKS predicted no correlation between the scattered-quantum detector A and the recoil-electron detector B; Bothe–Geiger found the conjugate-angle coincidence rate demanded by per-event four-momentum conservation, killing the last continuous-field model. Bothe–Geiger 1925 and Compton–Simon 1925: the falsification Walther Bothe and Hans Geiger built the coincidence experiment BKS demanded, using two Geiger needle counters gated by a mechanical commutator with a coincidence window of order 10^{-3} s (verify on exact figure). Their result, published in Zeitschrift für Physik in 1925 (verify: Bothe \u0026 Geiger, ZS Phys. 32, 639), was unambiguous: coincidence rates between the scattered X-ray and the recoil electron exceeded chance by orders of magnitude and matched the per-event prediction of . Independently, A. H. Compton and A. W. Simon (verify: Phys. Rev. 26, 289 (1925)), using cloud-chamber recoils together with the angles of secondary photo-electrons made by the scattered X-rays, verified that \\theta and \\varphi were kinematically conjugate event-by-event. BKS collapsed within months; Bohr himself withdrew it. From this point the light-quantum was experimental fact, even if the word photon had to wait for Lewis in 1926, and the rigorous matrix-element treatment of bound→continuum photoemission for the late 1920s. The Nobel committee's careful avoidance — Arrhenius's 1922 presentation honoring Einstein's \"law\" without endorsing the quantum — was, by 1926, an evasion of nothing. Hughes–DuBridge 1932: the empirical canon fixed The interwar synthesis is Hughes and DuBridge, Photoelectric Phenomena . The book is rarely opened now, but it is the document that fixed what counted as the canonical photoelectric corpus: the linear V s(\\nu) law verified on every clean metal and alkali; the work-function spread across crystallographic facets; the temperature dependence near threshold (the Fowler tail); the dependence of quantum yield on surface preparation. Their tabulations were the empirical reference for surface physics for two decades and remain the cleanest summary of the pre-band-structure, pre-attosecond era. They are also the source for one of the persistent textbook conflations §VI will untangle — the use of a single scalar W for what is in fact a facet- and adsorbate-dependent surface quantity Lenard had already flagged in 1902. VI. Four Effects, One Name: Conflations the Modern Literature Still Carries VI. Four Effects, One Name: Conflations the Modern Literature Still Carries The phrase \"photoelectric effect\" is a piece of nineteenth-century naming that has outlived its referent. By 1905 the term already covered phenomena that we now know to involve distinct Hamiltonians, distinct selection rules, distinct experimental signatures, and distinct industrial applications. The modern textbook treats them as one entry because Einstein's 1905 paper is the lecturer's favorite vehicle for introducing h\\nu, and the historical pedagogy has rewarded compression. What follows is the untangling. VI.1 Four physically distinct effects (i) External photoelectric effect (photoemission). This is Lenard's effect and Einstein's effect : a photon of energy h\\nu W ejects an electron from a condensed-matter surface into vacuum, with maximum kinetic energy The matrix element is \\langle \\mathbf{k} f \\mid \\hat{H} {\\mathrm{int}} \\mid \\psi i \\rangle with \\hat{H} {\\mathrm{int}} = -(e/mc)\\,\\mathbf{A}\\cdot\\mathbf{p}, the initial state \\psi i is a bound or band state, and the final state \\mathbf{k} f is a free-electron continuum state matched to a Bloch state inside the solid (the three-step model: optical excitation, transport to the surface, transmission across the surface barrier). The phenomenon is surface-physics-dominated; the bulk absorption depth (\\sim 10\\,\\mathrm{nm} in the UV) is large compared to the electron escape depth (\\sim 1\\,\\mathrm{nm}), which is why ARPES is a surface technique. (ii) Internal photoelectric effect (photoconductivity). No electron leaves the solid. A photon of energy exceeding the band gap (or an impurity ionization energy) promotes a carrier from valence to conduction band, increasing the conductivity. Willoughby Smith's 1873 observation that the resistance of selenium drops under illumination is the founding observation; Minchin's 1890 paper and his 1908 Nature note are firmly in this tradition — Minchin was building astronomical photometers from selenium cells, exploiting photoconductivity. The relevant law is not E {\\max} = h\\nu - W but with \\alpha the absorption coefficient, \\tau the carrier lifetime, \\Phi the photon flux. The \"threshold\" here is the band gap, not the work function; the work function does not enter at all. To call Minchin's selenium experiments \"photoelectric\" is correct in 1890 vocabulary and badly misleading in 2026 vocabulary. (iii) Atomic photoelectric effect (X-ray K- and L-shell ionization). A photon with h\\nu from a few keV to a few MeV ejects a bound atomic electron (preferentially K-shell, when energetically allowed). This is the dominant photon interaction at low energy in high-Z materials and the workhorse process of dosimetry, radiography, and PET. The non-relativistic K-shell cross section per atom, derived by Sauter (1931) from Sommerfeld's bound-state wavefunctions, scales as with the characteristic Z^{n}/(h\\nu)^{7/2} behaviour and saw-tooth absorption edges at the K, L, M binding energies. The Geant4 toolkit and its PET specialization GATE , together with the Hubbell–Seltzer NIST tables , compute exactly this process under the name G4PhotoElectricEffect . There is no work function, no surface, no band structure; the relevant energy scale is the atomic binding energy E B of the ionized shell, and the emitted electron carries h\\nu - E B followed by Auger or fluorescence relaxation of the hole. Calling this \"Einstein's effect\" — as many medical-physics texts do — confuses a single-atom QED process with a many-body condensed-matter process. (iv) Photovoltaic effect. Edmond Becquerel's 1839 observation of a photo-induced EMF across an electrolyte/electrode interface is the founding event; the modern manifestation is the p–n junction solar cell, in which absorption creates electron–hole pairs that are separated by the built-in field of the depletion region. The relevant physics is the Shockley diode equation with an added photocurrent term: Kesterite-cell papers like and back-contact-cell texturing studies like live in this domain. The threshold is again the band gap; the work function enters only as a contact-engineering parameter, not as the photothreshold. Becquerel preceded Hertz by 48 years and Einstein by 66, and his effect is closer in spirit to a battery than to a vacuum photodiode. The four effects share the property \"current proportional to light intensity\" and almost nothing else. The matrix elements differ, the threshold energies differ, the relevant materials differ, the dominant range of h\\nu differs by six orders of magnitude. VI.2 \"The photoelectric effect proves light is quantized\" — it does not This is the most persistent confusion in undergraduate teaching. The Lamb–Scully semiclassical analysis takes a classical electromagnetic field \\mathbf{E}(t) = \\mathbf{E} 0 \\cos\\omega t and a quantized atomic Hamiltonian, evaluates first-order time-dependent perturbation theory, and obtains an ionization rate which reproduces (a) a sharp frequency threshold at \\hbar\\omega = E B, (b) photocurrent linear in intensity \\lvert E 0 \\rvert^2, and (c) maximum kinetic energy \\hbar\\omega - E B — the entire Einstein–Lenard phenomenology. The atom enforces the energy quantum; the field does not need to. Mandel's later analyses confirmed this and located the genuine signatures of field quantization elsewhere: antibunching (g^{(2)}(0) \u003c 1), sub-Poissonian photon statistics, and the violation of Bell-type inequalities by entangled-photon pairs. None of these is a photoelectric experiment. The rigorous mathematical re-derivations in the QED setting [20, 21] are technical refinements of Lamb–Scully's point, not refutations of it. The honest pedagogical statement is: the photoelectric effect is consistent with field quantization, inspired the photon, and cannot distinguish it from a quantized atom in a classical field. VI.3 The work function is not \"the binding energy of the most weakly bound electron\" The textbook gloss is wrong by construction. The work function is the difference between the vacuum electrostatic potential just outside the surface and the bulk electrochemical potential of the electron. The first term contains the surface dipole layer D, which depends on how electron density spills out of the lattice — and that spill depends on the crystallographic facet. For tungsten the measured facet-dependent values are W(110) \\approx 5.25\\,\\mathrm{eV}, W(100) \\approx 4.63\\,\\mathrm{eV}, W(111) \\approx 4.47\\,\\mathrm{eV}; for copper the spread is \\sim 0.7\\,\\mathrm{eV}. Submonolayer adsorbates (Cs on W reduces W by \\sim 3\\,\\mathrm{eV}; oxygen on most metals raises it) shift W further. Lenard already knew this empirically — his obsessive surface-cleaning protocols in are why his stopping potentials were reproducible — and Millikan's \"machine-shop in vacuo\" scraping apparatus was an explicit engineering response to the same fact. Modern reassessments continue to find \\sim 0.1\\,\\mathrm{eV} scatter between nominally equivalent measurements. The bulk electronic structure fixes \\mu {\\bar e}; the surface fixes W. Conflating them turns photoemission into a bulk probe, which it is not. VI.4 \"Millikan first measured h\" Planck inferred h \\approx 6.55\\times 10^{-34}\\,\\mathrm{J\\,s} in 1900 from the blackbody fit, accurate to \\sim 1\\%. Rutherford and Geiger (1908) bounded it from \\beta-spectrum endpoints. What Millikan did in 1916 was provide the cleanest direct photoelectric determination, obtaining h to \\sim 0.5\\% via the slope dV {\\mathrm{stop}}/d\\nu = h/e and an independent electronic charge from his own oil-drop work. That is a precision triumph and a methodological vindication of Einstein's linear law; it is not the first measurement of h. The textbook elision of Planck's blackbody value compresses a sixteen-year history into a single name, in exactly the same way the elision of Lenard compresses thirteen years of experimental work into Einstein's heuristic paper. VII. What Still Holds, What Was Superseded, and in Which Regime VII. What Still Holds, What Was Superseded, and in Which Regime The Einstein–Lenard relation is a regime-limited statement masquerading in textbooks as a universal law. Its operational domain is narrow but enormously important; outside it, the formula is replaced by structures of greater richness. The audit below is regime-by-regime, kept honest about which observables are genuinely quantum-optical and which the semiclassical theory of Lamb and Scully already reproduces. 1. The single-photon perturbative regime: still exact Conditions: weak monochromatic field, h\\nu a few eV above W, ponderomotive energy U p = e^2 E 0^2/(4m\\omega^2) \\ll h\\nu - W, Keldysh parameter In this regime E {\\max} = h\\nu - W is operationally exact and remains the workhorse of angle-resolved photoemission spectroscopy (ARPES): the photoemission cut-off above the Fermi level is the Einstein edge, and the inferred binding-energy axis is calibrated by it. The Fowler tail at T 0 — photocurrent rising as T^2 f((h\\nu - h\\nu 0)/k B T) for h\\nu near threshold — is the only routine correction; the Lenard–Einstein law remains the high-\\nu asymptote. Spicer's three-step decomposition (optical excitation, transport, surface escape) refines W and the matrix element but leaves Einstein's spectral edge untouched. Rigorous mathematical derivations of the law in this regime, with the EM field quantized and the atom treated non-perturbatively, are in Bach–Klopp–Zenk and Zenk : they show that E {\\max} = h\\nu - W follows from QED in the long-time, weak-coupling limit — exactly the regime in which Fermi's golden rule applies. 2. Multiphoton ionization and above-threshold ionization (ATI) When h\\nu \u003c W but the intensity is high enough that the perturbative expansion in E 0 still converges, the leading process is n-photon absorption. The Einstein edge becomes a comb : with n {\\min} = \\lceil W/h\\nu \\rceil. The -U p shift is the AC Stark elevation of the continuum threshold — invisible to the original photoelectric experiments because U p \\sim 10^{-6} eV at Lenard's intensities, but the dominant correction in modern table-top experiments. The Agostini–Fabre 1979 observation of ATI peaks separated by h\\nu above the naive threshold is the modern signature; the Einstein formula is its n=1 entry. Sub-photon-energy photoemission reports such as are best read as multiphoton signals at the lowest detectable n=2, not as failures of the Einstein relation. The corpus also contains entries (e.g. on zero-energy photoelectrons) that probe the structure of the comb at E {\\max}^{(n)} \\to 0^+, where Coulomb focusing and Freeman resonances dominate. 3. The Keldysh crossover and the tunneling regime (\\gamma \\lesssim 1) Keldysh's 1965 paper unified the photoelectric and field-emission limits in a single non-perturbative theory: the ionization rate of an electron bound by W in a field E 0 \\cos\\omega t scales as with f(\\gamma) \\to \\ln(2\\gamma) - 1 in the multiphoton limit and f(\\gamma) \\to 2/3 \\cdot \\gamma^{-1} recovering the DC Fowler–Nordheim tunneling exponent as \\gamma \\to 0. The Einstein equation is a property of the \\gamma \\gg 1 multiphoton wing; in the \\gamma \\ll 1 tunneling regime there is no \"absorbed photon\" at all — the bound state tilts and the electron leaks through a quasi-static barrier — and the kinetic-energy distribution is set by the vector potential A(t i) at the instant of tunneling, not by h\\nu. The strong-field approximation (SFA), the Lewenstein model, and Coulomb-corrected SFA are the descendant frameworks. Bracher et al. is a useful corpus entry on the related photoionization-in-external-fields problem, where the Einstein edge is dressed by the static field into a quasi-Landau ladder. 4. Attosecond streaking: timing replaces energetics as the observable The arrival of carrier-envelope-phase-stable few-cycle IR pulses and isolated attosecond XUV pulses turned the photoelectric effect into a clock rather than a spectrometer. In attosecond streaking, an XUV pump photoemits at time t 0; the IR streak field translates the final momentum by \\Delta p = -eA(t 0)/c; the measured spectrogram inverts to give an Eisenbud–Wigner–Smith group delay. Cheng et al. is a corpus example of this time-domain manipulation. The notable conceptual point: the streaking delay is not \"how long the electron took to escape\" in any classical sense; it is the energy derivative of the scattering phase plus a Coulomb–laser coupling correction, and its interpretation cost more than a decade of literature to settle. The Einstein equation survives here only as the spectral centroid of the unstreaked photoelectron; the physics of interest lives in the phase. 5. Semiclassical equivalence and the genuinely quantum-optical residue The methodological caution from §VI bears repeating in the audit. The single-photon law, the threshold, the linear E {\\max}(\\nu), the Poisson photocount distribution in a coherent beam, and indeed the entire Lenard–Einstein–Millikan dataset are reproduced by a semiclassical theory in which only the atom is quantized and the field is a c-number . The photoelectric effect therefore demonstrates the quantization of atomic energy levels , not of the field. Genuinely quantum-optical observables — antibunching g^{(2)}(0) \u003c 1, sub-Poissonian photocount variance, two-photon interference, heralded single-photon detection — require photon-statistics measurements that no nineteenth- or early-twentieth-century photoelectric experiment performed. Modern photodetection theory cleanly separates these: the click-rate is universally semiclassical; the click- correlations are not. 6. Surface physics: W is the regime variable The Einstein law treats W as a material constant. It is not. The work function depends on crystallographic facet (up to \\sim 1 eV variation between Cu(100), (110), (111)), surface dipole, adsorbates, band-bending in semiconductors, image-charge corrections at finite distance, and the electrochemical potential of the contact through which the photocurrent returns. Lenard already noticed the polish/oxidation pathology; modern reassertions are explicit in . Two corollaries: (i) W measured photoelectrically and W measured by Kelvin probe agree only when the same reference level is used; (ii) the \"vectorial photoelectric effect\" — a polarization-dependent surface contribution where p-polarized light couples to the surface dipole through the longitudinal field component — is a genuine extension of the law, not a violation: documents it on Cu. The in-plane photoelectric effect in 2D electron systems is a further regime where the bulk three-step picture breaks down because there is no bulk. 7. The atomic (X-ray) photoelectric channel What dosimetry and Monte Carlo codes call the \"PhotoElectric\" process [19, 29, 18] is the bound-electron ejection cross-section for h\\nu \\gg W but h\\nu comparable to inner-shell binding energies. The relevant law is not Einstein's but the Sauter–Stobbe–Pratt cross-section, scaling as \\sigma K \\propto Z^n/(h\\nu)^{7/2} for the K-shell well above its edge, with sharp absorption edges replacing any notion of \"threshold.\" Einstein's h\\nu - W survives only as the kinetic-energy of the photoelectron, with W now the shell binding energy. This is the regime in which XPS and PET attenuation modelling live; it shares its name with the surface photoemission problem and almost nothing else. Regime summary Regime Controlling parameter Status of E {\\max} = h\\nu - W Replacement / extension --- --- --- --- Single-photon, perturbative \\gamma \\gg 1, U p \\ll h\\nu - W exact Fermi's golden rule, Spicer three-step Multiphoton / ATI \\gamma \\gtrsim 1 n h\\nu - W - U p comb LOPT, SFA Strong-field tunneling \\gamma \\ll 1 inapplicable Keldysh 1965, Lewenstein model Attosecond timing streak-field A(t) spectral centroid only Eisenbud–Wigner–Smith delay, TDDFT Atomic (X-ray) h\\nu \\gg W inner-shell edge structure, not threshold Sauter–Stobbe–Pratt; codes [19, 29, 18] 2D / surface-engineered reduced dimensionality, facet W is not a material constant vectorial effect , in-plane The pedagogical lesson the modern literature still under-stresses: Einstein's formula is not the photoelectric law; it is one spectral edge of one regime of a far richer family of light–matter coupling processes, and its survival in textbooks owes as much to its historical canonization as to its operational range. VIII. Frontier: Attosecond Photoemission, Surface Work Functions, and Open Problems VIII. Frontier: Attosecond Photoemission, Surface Work Functions, and Open Problems A century after the heuristic , the photoelectric effect is no longer a problem of whether light is quantized — it is a problem of when , from where , and with what cross section . Three research programs occupy the live frontier: (a) the chronometry of photoemission on the attosecond scale and the meaning of the Wigner–Smith delay in interacting systems; (b) the ab initio prediction of work functions and quantum efficiencies for photocathodes and surface catalysis; (c) the bound-state → continuum matrix element entering the atomic photoelectric cross section used by Geant4 and its successors for dosimetry and PET reconstruction. Each program has a different mix of \"genuinely open\" and \"merely technically hard,\" and the distinction is worth keeping straight. 1. The Eisenbud–Wigner–Smith delay and the Schultze controversy The natural object in one-photon photoemission from a bound state i\\rangle into continuum channel f, E\\rangle is the complex dipole matrix element The Eisenbud–Wigner–Smith (EWS) delay is the energy derivative of the scattering phase, inherited from half-collision theory (Wigner 1955; Smith 1960). For a Coulombic continuum the long-range logarithmic phase diverges, so physical measurement reports only relative delays between channels — plus a Coulomb–laser coupling correction systematized by Pazourek, Nagele and Burgdörfer. In 2010, Schultze et al. used isolated 100 eV XUV attopulses with an IR streaking field to measure \\Delta\\tau {2p-2s} = 21 \\pm 5 as in neon — the first attosecond chronometry of photoemission. Independent-particle theory predicted 4 as; RPAE with intershell correlation reached 6–10 as. The disagreement persisted through several iterations and resolution did not arrive until Isinger et al. (Science 358, 893, 2017) showed that unresolved 2s shake-up satellites had contaminated the 2s photoline; with shake-up resolved, the experimental delay drops to 10 as and lands on theory. The episode is now read as a warning about the implicit channel assumption in streaking: the measured \\tau is whatever superposition of final states is spectrally unresolved, not the EWS delay of a clean channel. is representative of subsequent work on controlling these channels in the time domain; embeds the photoelectric matrix element in external fields. Figure: Attosecond streaking of Ne 2s and 2p. The IR vector potential modulates the kinetic energy of each photoelectron line in phase with the carrier; a relative shift Δτ in the streaking trace gives the channel-resolved EWS delay (plus Coulomb-laser coupling). The original 21 as discrepancy was traced to unresolved 2s shake-up satellites. IR period 2.5 fs; Δτ shown exaggerated for visibility. What is not settled is conceptual. The EWS delay is a property of an outgoing wave packet's group delay relative to a Coulombic reference , not the \"instant of ionization.\" In strongly correlated channels — Cooper minima, autoionizing resonances, the giant 4d resonance in Xe — d\\eta/dE changes sign and the very notion of a localized emission event becomes ill-defined; see the Kheifets (2023) review. Whether \"the time photoemission takes\" is operationally meaningful beyond a specific measurement protocol is genuinely open. Rigorous QED treatments [20, 21] reproduce the rate but say nothing about a delay observable. 2. Surface work functions: facets, dipoles, and the photocathode problem Section VII flagged that W is not a bulk quantity. The Smoluchowski mechanism — surface charge spilling into vacuum smooths the electron density and generates a dipole barrier — produces facet-resolved values that differ by 0.5 eV on the same metal: Cu(111) ≈ 4.94 eV, Cu(100) ≈ 4.59 eV, Cu(110) ≈ 4.48 eV. Adsorbates shift these further. Cs at sub-monolayer coverage drops Cu(100) below 2.0 eV; co-deposition of Cs and O on GaAs produces negative electron affinity (NEA) cathodes used in spin-polarized electron sources at CEBAF and planned for the EIC. is one of many attempts to make a photoelectric measurement of W truly reliable; the difficulty is that the measurement averages over whatever facet and adsorbate distribution the sample actually presents. For accelerator photocathodes the engineering target is high quantum efficiency at a chosen drive-laser wavelength with picosecond response and small thermal emittance. Alkali antimonides (Cs 3Sb, K 2CsSb, Na 2KSb) deliver QE 5% in the green but suffer vacuum-limited lifetimes and poor spatial W uniformity. Ab initio PBE-DFT underestimates W for these compounds by 0.3–0.6 eV; hybrid functionals and GW improve agreement at a cost that does not yet scale to reconstructed surfaces with realistic adsorbate coverage. This is technically hard, not conceptually open : exchange–correlation in inhomogeneous interacting electron systems near a vacuum boundary is understood; sub-50-meV ab initio W for a real photocathode is not. Two adjacent frontiers are conceptually richer. Plasmon-assisted hot-carrier photoemission exploits sub-threshold (h\\nu \u003c W) emission via plasmon decay into a non-thermal electron distribution; the transport and momentum-matching steps that govern the external yield are not captured by Spicer's three-step model and remain genuinely contested. Vectorial / in-plane photoemission [35, 36] — where emission depend"}</script>

 Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt', Annalen der Physik 322(6): 132–148", "kind": "theory", "ref": 12}, {"year": 1906, "event": "Nobel lecture frames cathode-ray and photoelectric work as one programme; presents Lenard's quantitative measurements", "who": "Philipp Lenard", "work": "'On cathode rays', Nobel Lecture, 28 May 1906", "kind": "revival", "ref": 13}, {"year": 1916, "event": "Precise verification of Einstein's linear law and measurement of h to ~0.5%; author still disputes 'reckless' quantum hypothesis", "who": "Robert A. Millikan", "work": "'A Direct Photoelectric Determination of Planck's h', Physical Review 7(3): 355–388", "kind": "formalization", "ref": 7}, {"year": 1923, "event": "Compton scattering: independent kinematic evidence for photon momentum hν/c; closes debate over light-quanta", "who": "Arthur H. Compton", "work": "'A Quantum Theory of the Scattering of X-Rays by Light Elements', Physical Review 21(5): 483–502", "kind": "theory", "ref": 24}, {"year": 1923, "event": "Nobel lecture: 'The electron and the light-quant from the experimental point of view' — Millikan now accepts the photon", "who": "Robert A. Millikan", "work": "Nobel Lecture, 23 May 1924, Stockholm", "kind": "revival", "ref": 26}, {"year": 1923, "event": "Einstein's Nobel lecture in Gothenburg is on relativity, NOT the photoelectric effect — a deliberate sidestep of the still-controversial light-quantum", "who": "Albert Einstein", "work": "'Fundamental ideas and problems of the theory of relativity', Nordic Assembly of Naturalists, 11 July 1923", "kind": "revival", "ref": 14}, {"year": 1924, "event": "Bohr–Kramers–Slater theory: last serious attempt to preserve a continuous-field interpretation, abandoning energy conservation in individual photoelectric acts; falsified by Bothe–Geiger 1925", "who": "N. Bohr, H. A. Kramers, J. C. Slater", "work": "'The Quantum Theory of Radiation', Philosophical Magazine 47: 785–802", "kind": "theory", "ref": 15}, {"year": 1926, "event": "Word 'photon' coined", "who": "Gilbert N. Lewis", "work": "'The Conservation of Photons', Nature 118: 874–875", "kind": "naming", "ref": 17}, {"year": 1932, "event": "Definitive interwar monograph synthesizing the empirical photoelectric corpus and surface-physics complications", "who": "Arthur Llewelyn Hughes, Lee A. DuBridge", "work": "'Photoelectric Phenomena', McGraw–Hill, New York", "kind": "formalization", "ref": 16}, {"year": 1983, "event": "Definitive historical reconstruction of the light-quantum, including Millikan's reluctance and the Lenard precursor", "who": "Bruce R. Wheaton", "work": "'The Tiger and the Shark: Empirical Roots of Wave–Particle Dualism', Cambridge University Press", "kind": "revival", "ref": 6}], "neglected": [{"name": "Aleksandr Grigorievich Stoletov", "role": "Established the first quantitative law (photocurrent ∝ intensity at saturation), built the first photoelectric cell circuit with an external EMF (the modern photodiode topology), and identified the role of gas pressure. Western textbooks routinely jump Hertz → Hallwachs → Lenard, omitting him entirely; in Russian and older European literature these are 'Stoletov's laws'.", "evidence": "His three Comptes Rendus notes of 1888 (he published in French to reach Western readers); Lenard cites him explicitly; modern reconstruction in Wheaton (1983) ch. 4.", "ref": 3}, {"name": "Wilhelm Hallwachs", "role": "First showed that the effect required no spark and worked on bulk metal surfaces; the phenomenon was 'der Hallwachs-Effekt' in the German literature for ~20 years before being subsumed under 'photoelectric'.", "evidence": "Hallwachs (1888) Annalen der Physik; Lenard's 1906 Nobel lecture treats the effect as 'Hertz–Hallwachs'.", "ref": 2}, {"name": "Philipp Lenard", "role": "Performed the precision experiments that ESTABLISHED the two empirical facts Einstein then explained — frequency-dependent E_max and the threshold. Modern textbook narratives often state 'Einstein predicted, Millikan confirmed', skipping the 13-year gap in which Lenard had already MEASURED the qualitative laws Einstein quantified.", "evidence": "Lenard (1902) Annalen der Physik 313: 149; his 1906 Nobel lecture devotes a major section to the photoelectric measurements; Pais (1982) 'Subtle is the Lord' ch. 19 explicitly credits him.", "ref": 5}, {"name": "Julius Elster and Hans Geitel", "role": "From 1889 onward built the first usable alkali-metal photocells (Na, K, Rb, Cs cathodes), discovering that work functions decrease down the alkali column. Their cells were the experimental platform on which Lenard, Millikan, and the photoelectric astronomy of Minchin (corpus [1], [3]) all relied; rarely named in physics textbooks.", "evidence": "Elster \u0026 Geitel series in Annalen der Physik 1890–1916; obituary by Pohl in Physikalische Zeitschrift 24 (1923): 49.", "ref": 4}, {"name": "Augusto Righi", "role": "Independent 1888 confirmation and coined the term 'fotoelettrico' — the linguistic origin of the modern name is Italian, not German or English.", "evidence": "Righi's Lincei communications 1888; biographical entry in Dizionario Biografico degli Italiani; cited in Wheaton (1983).", "ref": 27}, {"name": "Robert Millikan (as DOUBTER, not confirmer)", "role": "The textbook image — Millikan as Einstein's vindicator — inverts his actual stance. He explicitly designed the 1916 experiment to DISPROVE the light-quantum and called it 'a bold, not to say reckless, hypothesis' even while publishing the data that confirmed it. He did not accept photons until ~1923.", "evidence": "Millikan (1916) Phys. Rev. 7: 355, pp. 384–388 (discussion); his 1923 Nobel lecture for the explicit conversion narrative; Stuewer's 'Compton Effect' book ch. 2.", "ref": 7}], "conflations": [{"claim": "'Photoelectric effect' as a single phenomenon", "clarification": "The phrase covers at least four physically distinct processes that the modern literature routinely blurs: (i) the EXTERNAL photoelectric effect / photoemission (Einstein's E_max = hν − W, requires hν \u003e W); (ii) the INTERNAL photoelectric effect / photoconductivity (Smith 1873 on selenium, no electron ejection from solid); (iii) the ATOMIC photoelectric effect in X-ray physics (bound-electron ejection with cross-section ∝ Z^n/(hν)^{7/2} for K-shell, used in dosimetry and PET — corpus [22], [26]); and (iv) PHOTOVOLTAIC junction effects (Becquerel 1839, electrochemical). Lenard's 1902 paper is about (i); Minchin's 1890 paper [1] is about (ii); the Geant4 'PhotoElectric' process [14] is (iii). They share a name and almost nothing else."}, {"claim": "'Einstein's photoelectric equation derives the law from first principles'", "clarification": "It does not. The 1905 paper offers a HEURISTIC argument: assume light energy is concentrated in quanta hν, then a single quantum imparts ≤ hν to a surface electron, giving E_max = hν − W. Lenard's experimental law is INPUT, not output. A genuine derivation requires QED matrix elements for the bound-state → continuum transition; that's Sommerfeld–Schur (1930) and the work in corpus [35], [47] for the rigorous mathematical version."}, {"claim": "'The photoelectric effect proves light is quantized'", "clarification": "It doesn't. Lamb \u0026 Scully (1969) and Mandel (1976) showed that a semiclassical model with a quantized atom and a classical EM field reproduces all photoelectric observables including the threshold and the linear E_max(ν) relation. Genuine demonstrations of field quantization require photon antibunching (Kimble–Dagenais–Mandel 1977) or sub-Poissonian statistics, not the photoelectric effect."}, {"claim": "'Work function W is the binding energy of the most weakly bound electron'", "clarification": "W is the difference between the electrochemical potential and the vacuum level just outside the surface; it depends on surface dipole, crystallographic facet, and adsorbates, NOT just bulk electronic structure. The same metal can have W differing by ~1 eV between facets — a fact Lenard already noticed (the polished/oxidized contamination problem) and corpus [48] reasserts."}, {"claim": "'Millikan's 1916 measurement of h was the first'", "clarification": "Planck had inferred h from blackbody fits in 1900; Rutherford \u0026 Geiger (1908) bounded it via β-spectra; the photoelectric route gave the cleanest direct measurement, but it was not the discovery of h's value."}], "sections": [{"id": "forgotten-pioneers", "title": "I. Hertz, Hallwachs, Stoletov, Righi: The Decade Before Einstein", "markdown": "## I. Hertz, Hallwachs, Stoletov, Righi: The Decade Before Einstein\n\nThe standard pedagogical compression — \"Hertz noticed sparks, Einstein explained, Millikan confirmed\" — telescopes a dense decade of experimental work into a single anecdote. What actually happened between November 1886 and 1899 is the construction, by four laboratories working largely independently, of the empirical scaffold onto which Einstein's 1905 heuristic was later bolted. Three of those four men are systematically under-credited in Anglophone textbooks; the fourth — Hertz — is credited for the wrong reason. The German literature of the period, moreover, distinguished cleanly between two named effects (*Hertz-Effekt* and *Hallwachs-Effekt*) that modern writing has fused under a single umbrella. We reconstruct the actual sequence.\n\n### Hertz, November 1886 — an obstruction noticed, not a phenomenon sought\n\nHertz was not investigating photoemission. He was running the receiver loop of his electromagnetic-wave apparatus, trying to detect the micrometer sparks induced by an oscillating primary discharge, and he found that placing an opaque screen between the primary spark and the receiver gap reduced the receiver's spark length. By systematically swapping screens — glass, quartz, fluorite — he isolated the effective agent as the ultraviolet component of the primary's own light, and demonstrated that UV falling on the negative receiver electrode lowered the breakdown threshold of the gap [1]. The paper, \"Ueber einen Einfluss des ultravioletten Lichtes auf die electrische Entladung\" (Annalen 267, 1887), is meticulous about the optics — Hertz tabulates the transmission cutoffs of his screens — but explicitly disclaims any theoretical interpretation: he reports an *Einfluss*, an influence, and leaves the mechanism open.\n\nTwo things should be emphasized. First, Hertz had no notion of electron emission; the electron was a decade in the future. Second, his geometry — a spark-gap with both electrodes simultaneously illuminated in an ambient gas — is *not* the geometry of any modern photoelectric experiment. The \"Hertz effect\" of the German literature, narrowly construed, is the UV-assisted breakdown of a discharge gap, a gas-discharge phenomenon as much as a surface one. The unification with photoemission proper came later and required other experimentalists.\n\n### Hallwachs, February 1888 — the bulk-metal effect\n\nWilhelm Hallwachs, working in Dresden, performed the cleanest possible reduction of Hertz's geometry: he removed the spark entirely. A negatively charged, freshly polished zinc plate connected to a Hankel electroscope was illuminated by an arc lamp; the leaves collapsed. A positively charged plate, illuminated identically, did not. The discharge was therefore one-sided — light removed negative charge from metal surfaces — and required neither a counter-electrode nor a gas discharge to manifest [2]. In Hallwachs's own framing the question was electrostatic, not corpuscular: *what does light do to the surface charge of an isolated conductor?* The carriers were anonymous.\n\nThis is the phenomenon that the German literature, including the bibliographies of Lenard (1902) and the older volumes of Wiedemann's *Elektricität*, called *Hallwachs-Effekt* — distinct from *Hertz-Effekt*. The distinction is not pedantic. Hertz's geometry confounds gas-phase ionization with surface emission; Hallwachs's geometry isolates the surface contribution. When the photocell industry eventually emerged it was Hallwachs's configuration, not Hertz's, that became the prototype.\n\n### Stoletov, summer 1888 — the first quantitative law and the first photocell\n\nAleksandr Grigorievich Stoletov in Moscow read both Hertz and Hallwachs by early 1888 and within months produced the decisive quantitative work that the Anglophone tradition almost entirely omits. Publishing in French in the *Comptes Rendus* to maximize Western reach [3], Stoletov made three contributions, each of which independently deserves textbook status:\n\n1. He replaced the floating electroscope geometry with a circuit: an illuminated metal cathode, a transparent mesh anode held at variable positive potential by an external EMF, and a sensitive galvanometer in the loop. This is the topology of the modern phototube and, with the polarity flipped, of the photodiode.\n2. He measured the *saturation current* as a function of incident UV intensity and established what later Soviet textbooks codify as *Stoletov's first law*: at fixed spectral composition and sufficient anode bias, the photocurrent is proportional to the incident radiant flux,\n$$i_{\\text{sat}} = k\\,\\Phi.$$\n3. He characterized the role of gas pressure in the cell, demonstrating that the photocurrent rose to a maximum near a specific reduced pressure (the so-called *Stoletovsche Konstante*, $p/E \\approx 0.4\\text{ mm Hg / V cm}^{-1}$ for air) and fell at both higher and lower pressures — implicitly distinguishing the genuine surface emission from secondary gas amplification.\n\nThe proportionality (1) is one of the two empirical pillars of the photoelectric law; Lenard's 1902 frequency dependence is the other. In the Russian, Polish, and older French literature the laws of 1888 and 1902 are routinely co-credited as Stoletov–Lenard. The Anglophone displacement of Stoletov — visible already in the 1932 Hughes \u0026 DuBridge monograph [4], which treats him as a footnote — is partly a Cold-War artefact, partly a consequence of his publishing venue (the *Comptes Rendus* notes are short and bibliographically inconspicuous), and partly because Lenard's apparatus was an order of magnitude more sensitive. But priority on the intensity law is unambiguous.\n\n### Righi, 1888 — independent confirmation and the word itself\n\nWorking in Bologna, Augusto Righi reproduced the discharge phenomenon and the polarity dependence independently and almost simultaneously, communicating his results to the Accademia dei Lincei and subsequently in *Nuovo Cimento*. His lasting contribution is linguistic: he introduced the Italian adjective *fotoelettrico*, which entered French as *photoélectrique* and English as *photoelectric*. The German term *lichtelektrisch* — used by Lenard in his 1902 title, *Ueber die lichtelektrische Wirkung* [5] — is a calque, but the cognate that ultimately won internationally is Righi's. The credit audit summarized in our verified archaeology makes the point bluntly: the modern *name* of the effect is Italian (verify, for the precise date of Righi's coinage I rely on the Wheaton reconstruction [6] and biographical sources rather than direct inspection of the *Lincei* communications).\n\n### Elster and Geitel — the missing instrument-builders\n\nA parallel programme is essential to acknowledge here even though its detailed analysis belongs to later sections. From 1889 onward Julius Elster and Hans Geitel in Wolfenbüttel built progressively more sensitive cells using alkali-metal cathodes — sodium, then potassium, then rubidium and caesium — and discovered, empirically and decades before any electronic theory could rationalize it, that the threshold wavelength moved into the visible as one descended the alkali column. Every precision photoelectric measurement of the next thirty years, including Lenard's 1902 work, Millikan's 1916 *h* determination [7], and the astronomical photometry of Min
