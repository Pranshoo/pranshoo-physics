rge with anomalous spin. To see charge $e/2$ in a polyacetylene-like chain one must break the spin degeneracy or work with spinless fermions — a point routinely elided when SSH is presented as \"the observation of charge $e/2$\". What the trans-polyacetylene experiments actually established is the reversed spin–charge assignment (neutral spin-$1/2$ solitons visible in ESR alongside spinless charged carriers), which is the same index theorem doing the same work.\n\n### Goldstone–Wilczek: irrational charge from adiabatic spectral flow\n\nThe index-theorem argument gives halves because $C$ symmetry pins the mode to $E=0$. Break that symmetry and the induced charge becomes continuously tunable. Goldstone and Wilczek (Phys. Rev. Lett. 47, 986 (1981)) (verify) coupled the 1+1D fermion to a two-component background, $\\phi_1 + i\\phi_2 = \\rho\\, e^{i\\theta(x)}$, integrated out the fermion, and obtained the induced current\n\n$$j^\\mu = \\frac{1}{2\\pi}\\,\\varepsilon^{\\mu\\nu}\\partial_\\nu\\theta,$$\n\nvalid to leading order in gradients and for $\\rho$ large compared to the scale of variation of $\\theta$. The induced charge in a region is then\n\n$$Q = \\int dx\\, j^0 = \\frac{\\Delta\\theta}{2\\pi},$$\n\nwith $\\Delta\\theta$ the change in the chiral angle across the defect. A soliton interpolating by $\\Delta\\theta = \\pi$ recovers $Q = 1/2$; $\\Delta\\theta = 2\\pi/3$ gives $Q = 1/3$; a generic $\\Delta\\theta$ gives an **irrational** charge, which no index theorem can produce and no degeneracy counting anticipates. The interpretation is spectral flow: adiabatically advancing $\\theta$ by $2\\pi$ pumps exactly one fermion across the gap from the negative-energy sea to the positive branch — this is Thouless pumping, and the same formula reappears as the polarization of a band insulator, $P = e\\,\\gamma_{\\rm Zak}/2\\pi$.\n\nTwo caveats that the literature strips silently. First, *irrational* induced charge is not a sharp eigenvalue in the same sense as the half-integer case: for generic $\\Delta\\theta$ the charge variance does not vanish, because there is no symmetry protecting a degeneracy. The state is a superposition, and $Q = \\Delta\\theta/2\\pi$ is a well-defined mean with residual fluctuation. Sharpness is restored only when a symmetry (charge conjugation, or a $\\mathbb{Z}_n$ discrete chiral symmetry making $\\Delta\\theta = 2\\pi k/n$) forces exact degeneracy. Second, the formula is the leading term of a derivative expansion; it is exact only in the adiabatic limit, and the higher-gradient corrections are not universal.\n\n### The logical separation\n\nEverything above is 1+1 dimensional. The configuration space of $N$ identical particles on a line is not multiply connected in the way $\\mathbb{R}^2$ is — $\\pi_1$ gives no braid group, exchange is not even a continuous operation without passing particles through each other, and the phrase \"statistics of the soliton\" has no topological content. Yet the charge is fractional, sharply so, with vanishing variance and index-theorem protection.\n\nThe converse holds too: fractional statistics does not require fractional charge. The neutral fermion $\\psi$ of the Moore–Read state carries integer (zero) charge and nontrivial braiding [12]; $\\mathbb{Z}_2$ visons in the toric code are electrically neutral and braid with the electric charge to $-1$ [13]. Two logically independent phenomena, joined in the Laughlin state only because flux attachment ties $\\theta = \\pi\\nu$ to $Q = \\nu e$ through the same Chern–Simons coefficient — a feature of one class of effective theory, not a law of nature."}, {"id": "braid-group-kinematics", "title": "The Pedagogical Core I — Configuration-Space Topology and the Braid Group", "markdown": "## The Pedagogical Core I — Configuration-Space Topology and the Braid Group\n\nEverything in this subject follows from one refusal: do not put the symmetrization postulate in by hand. Ask instead what quantum mechanics on the *correct* configuration space of $N$ indistinguishable particles permits. The answer is dimension-dependent, and the dimension enters through $\\pi_1$.\n\n### The space\n\nFor $N$ indistinguishable particles on a manifold $M$, the physical configuration space is\n\n$$Q_N(M) \\;=\\; \\frac{M^N - \\Delta}{S_N}, \\qquad \\Delta = \\{(x_1,\\dots,x_N): x_i = x_j \\text{ for some } i \\neq j\\}.$$\n\nTwo deletions matter and are logically independent. Quotienting by $S_N$ encodes indistinguishability: a permuted list is not a new configuration but the same point. Removing the diagonal $\\Delta$ encodes hard-core exclusion; without it the quotient is an orbifold with singular strata and the quotient map is not a covering. Leinaas and Myrheim are explicit that this excision is a physical assumption, not a technicality [2] — it is what makes $Q_N$ a manifold and what makes the topology nontrivial.\n\nGiven a multiply-connected $Q_N$, the Feynman propagator does not have a unique definition. Paths from $q_i$ to $q_f$ fall into homotopy classes labelled by elements of $\\pi_1(Q_N)$, and the sum over paths must be assembled class by class:\n\n$$K(q_f,t_f;q_i,t_i) \\;=\\; \\sum_{\\alpha \\in \\pi_1(Q_N)} \\chi(\\alpha)\\, K^{\\alpha}(q_f,t_f;q_i,t_i).$$\n\nAssociativity of propagation (composing two intervals must reproduce the third) forces the weights $\\chi$ to form a one-dimensional unitary representation of $\\pi_1(Q_N)$; for multi-component wavefunctions the weights are unitary matrices and $\\chi$ becomes a representation of dimension $\u003e1$. This is the Laidlaw–DeWitt-Morette theorem [1], and it is worth being precise about what it does and does not say. It says: *quantizations are classified by unitary representations of $\\pi_1$*. It then specializes to $M = \\mathbb{R}^3$, finds $\\pi_1 = S_N$, notes that the one-dimensional characters of $S_N$ are exhausted by the trivial and alternating ones, and concludes Bose or Fermi — no parastatistics. The $\\mathbb{R}^3$ restriction is stated in the paper and stripped in most citations. The theorem is general; the conclusion is not.\n\n### $S_N$ versus $B_N$\n\nWhy does $\\pi_1$ care about $d$? Consider $N=2$ and pass to the relative coordinate $\\mathbf{r} = \\mathbf{x}_1 - \\mathbf{x}_2$, which lives in $(\\mathbb{R}^d - \\{0\\})/\\mathbb{Z}_2$, i.e. real projective space $\\mathbb{RP}^{d-1}$ up to the radial factor. For $d \\ge 3$, $\\mathbb{RP}^{d-1}$ has $\\pi_1 = \\mathbb{Z}_2$: an exchange path is a half-loop, and doing it twice gives a closed loop that can be lifted off itself in the third dimension and contracted. Hence $\\sigma^2 = 1$ and there are exactly two options, $\\pm 1$. For $d = 2$ the relative space retracts to a circle, $\\pi_1(\\mathbb{RP}^1) = \\pi_1(S^1) = \\mathbb{Z}$: winding is an integer that no continuous deformation can undo, because the excluded point $\\mathbf{r}=0$ blocks the contraction and there is no extra direction to escape into. The exchange has infinite order.\n\nFor general $N$ in $d=2$ this generalizes to Artin's braid group:\n\n$$B_N = \\Big\\langle \\sigma_1,\\dots,\\sigma_{N-1} \\;\\Big|\\; \\sigma_i\\sigma_{i+1}\\sigma_i = \\sigma_{i+1}\\sigma_i\\sigma_{i+1},\\quad \\sigma_i\\sigma_j = \\sigma_j\\sigma_i \\ \\ (|i-j|\\ge 2) \\Big\\rangle,$$\n\nwith $\\sigma_i^2 \\neq 1$ — that single omitted relation is the entire subject. $S_N$ is the quotient $B_N/\\langle \\sigma_i^2 \\rangle$. $B_N$ is infinite for $N \\ge 2$, torsion-free, and its elements are genuine worldline braids in $2+1$ dimensions: strands that pass over and under, not merely permute.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"20\" y=\"26\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003ed ≥ 3: relative space ≃ RP^{d−1}, π₁ = ℤ₂\u003c/text\u003e\u003ctext x=\"400\" y=\"26\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003ed = 2: relative space ≃ S¹, π₁ = ℤ\u003c/text\u003e\u003cline x1=\"20\" y1=\"40\" x2=\"20\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1\" opacity=\"0.3\"/\u003e\u003ctext x=\"30\" y=\"60\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003eworldlines can lift off in the 3rd direction\u003c/text\u003e\u003cpath d=\"M60 90 C 60 150, 200 150, 200 210\" stroke=\"#7aa2ff\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M200 90 C 200 130, 130 150, 110 150\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M90 150 C 70 150, 60 170, 60 210\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M60 210 C 60 270, 200 270, 200 330\" stroke=\"#7aa2ff\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M200 210 C 200 250, 130 270, 110 270\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M90 270 C 70 270, 60 290, 60 330\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003ctext x=\"230\" y=\"215\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eσ² \u003c/text\u003e\u003ctext x=\"252\" y=\"215\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003e= 1\u003c/text\u003e\u003ctext x=\"230\" y=\"235\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003econtractible ⇒ ±1 only\u003c/text\u003e\u003ctext x=\"30\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eBose / Fermi\u003c/text\u003e\u003ctext x=\"410\" y=\"60\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003estrands are stuck in the plane × time\u003c/text\u003e\u003cpath d=\"M440 90 C 440 150, 580 150, 580 210\" stroke=\"#7aa2ff\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M580 90 C 580 130, 510 150, 490 150\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M470 150 C 450 150, 440 170, 440 210\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M440 210 C 440 270, 580 270, 580 330\" stroke=\"#7aa2ff\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M580 210 C 580 250, 510 270, 490 270\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M470 270 C 450 270, 440 290, 440 330\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003ctext x=\"610\" y=\"215\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eσ² \u003c/text\u003e\u003ctext x=\"632\" y=\"215\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003e≠ 1\u003c/text\u003e\u003ctext x=\"600\" y=\"235\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e= full monodromy\u003c/text\u003e\u003ctext x=\"600\" y=\"253\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003ephase e^{2iθ}\u003c/text\u003e\u003ctext x=\"410\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eanyons: σ ↦ e^{iθ}, θ ∈ [0,2π)\u003c/text\u003e\u003ctext x=\"410\" y=\"380\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eor σ ↦ U (dim \u0026gt; 1): non-abelian\u003c/text\u003e\u003ctext x=\"30\" y=\"380\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eσ ↦ +1 or −1 exhausts the 1D characters of S_N\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: the same double exchange in $d\\ge3$ and $d=2$. On the left the doubled braid can be undone by lifting one strand out of the page, so $\\sigma^2=1$ and only $\\pm1$ survives; on the right the strands are confined to the plane, the double exchange is a nontrivial winding, and $\\sigma$ acquires an arbitrary phase (abelian) or matrix (non-abelian).*\n\n### The abelian sector\n\nOne-dimensional unitary representations of $B_N$ are trivially classified. The braid relation $\\sigma_i\\sigma_{i+1}\\sigma_i = \\sigma_{i+1}\\sigma_i\\sigma_{i+1}$ forces all generators to the same scalar $e^{i\\theta_i} = e^{i\\theta}$ when $N\\ge3$ (the relation gives $\\theta_i = \\theta_{i+1}$ directly); the far-commutation relations are then automatic. Hence\n\n$$\\rho_\\theta:\\; \\sigma_i \\mapsto e^{i\\theta}, \\qquad \\theta \\in [0,2\\pi),$$\n\na continuum interpolating between bosons ($\\theta=0$) and fermions ($\\theta=\\pi$). That is the anyon prediction, and it is in Leinaas–Myrheim [2] in 1977, five years before the word; Goldin, Menikoff and Sharp reached the same continuum from unitary representations of local current algebras, with no path integral anywhere [4]. Wu's 1984 papers gave the explicit $N$-body braid-group formulation now used as standard [10].\n\nTwo equivalent descriptions of the same physics, and the dictionary between them:\n\n**Multivalued gauge.** Keep the Hamiltonian free and let $\\psi$ be a section of a flat line bundle over $Q_N$ with holonomy $e^{i\\theta}$ per elementary braid — equivalently, a multivalued function on $M^N-\\Delta$ obeying $\\psi(\\dots,z_j,\\dots,z_i,\\dots) = e^{i\\theta}\\psi(\\dots,z_i,\\dots,z_j,\\dots)$ along a specified exchange path.\n\n**Singular gauge.** Strip the multivaluedness with $\\psi \\to \\Big(\\prod_{i\u003cj} \\frac{z_i-z_j}{|z_i-z_j|}\\Big)^{-\\theta/\\pi}\\psi$, making the wavefunction single-valued and bosonic at the cost of a *statistical vector potential*\n\n$$\\mathbf{a}(\\mathbf{r}_i) = \\frac{\\theta}{\\pi}\\frac{\\Phi_0}{2\\pi}\\sum_{j\\neq i} \\frac{\\hat{z}\\times(\\mathbf{r}_i-\\mathbf{r}_j)}{|\\mathbf{r}_i-\\mathbf{r}_j|^2},$$\n\na pure gauge everywhere except at the punctures, where each particle carries a flux tube $\\Phi = (\\theta/\\pi)\\Phi_0$. This is flux attachment, and it is why the Chern–Simons construction of Wilczek's charge–flux composite [5] and the configuration-space argument are the *same statement in two coordinate systems*, not two independent discoveries. The topology is primary; the gauge field is a representation of it. The Berry-phase computation of Arovas–Schrieffer–Wilczek for Laughlin quasiholes [14] lands in the multivalued gauge and must be read with that in mind.\n\n### The open door\n\nNothing in the classification restricts $\\rho$ to dimension one. If the $N$-quasiparticle Hilbert space at fixed positions is $g$-fold degenerate with $g\u003e1$, adiabatic braiding realizes a unitary $\\rho:B_N \\to U(g)$, and the images of $\\sigma_i$ generically do not commute. This is precisely the possibility Wu's analysis leaves standing when he notes that $e^{i\\theta}$ exhausts only the *one-dimensional* representations [10]. It was walked through from the axiomatic side by Fredenhagen, Rehren and Schroer, whose superselection sectors with non-integer statistical dimension are non-abelian anyons in all but name [15], and from the wavefunction side by Moore and Read, whose conformal blocks supply the degenerate multiplet explicitly [12]. The degeneracy must be topological — locally indistinguishable, exponentially split at most — or the \"representation\" is an artifact of fine tuning.\n\n### Chirality and framing: where the factors of two come from\n\nThree separate conventions are routinely collapsed, and every $\\theta$-vs-$2\\theta$ discrepancy in the literature traces to one of them.\n\n*Chirality.* $\\sigma_i^{-1} \\neq \\sigma_i$. A counterclockwise exchange gives $e^{i\\theta}$, clockwise $e^{-i\\theta}$. An anyonic theory with $\\theta \\notin \\{0,\\pi\\}$ therefore breaks $P$ and $T$; this is not an extra assumption but a corollary of $B_N$'s non-involutivity.\n\n*Exchange versus monodromy.* Half-exchange (one $\\sigma$) gives $\\theta$; full monodromy (one particle taken around another, $\\sigma^2$) gives $2\\theta$. Authors who define \"the statistical phase\" as the monodromy report $2\\pi/m$ where the exchange convention reports $\\pi/m$ at $\\nu=1/m$. Both are correct; only one is stated. The Nakamura interferometry result reads a monodromy — the phase jump as one quasiparticle is added inside the loop — and quotes $2\\pi/3$ accordingly [16].\n\n*Framing/spin.* $\\theta$ and $\\theta+2\\pi$ label the same one-dimensional representation of $B_N$ but not the same topological theory: the spin–statistics relation $s = \\theta/2\\pi$ ties the exchange phase to a self-rotation, and untangling a self-twist requires a framing of the worldline (a ribbon, not a line). The topological spin $\\theta_a = e^{2\\pi i s_a}$ is the framing-dependent object; the braiding $\\sigma$ is not fully specified until the ribbon convention is fixed. Wilczek's $\\theta = q\\Phi/2\\hbar c$ with spin $\\theta/2\\pi$ is a statement in a definite framing, and a nonzero fraction of the disagreements in the older literature are two authors using opposite ribbon twists rather than disputing physics [7]."}, {"id": "laughlin-berry-phase-chern-simons", "title": "The Pedagogical Core II — Laughlin Quasiholes, the Arovas–Schrieffer–Wilczek Phase, and Chern–Simons Flux Attachment", "markdown": "## The Pedagogical Core II — Laughlin Quasiholes, the Arovas–Schrieffer–Wilczek Phase, and Chern–Simons Flux Attachment\n\n### The trial state and what it is a solution to\n\nWork in the symmetric gauge, $\\mathbf{A} = \\tfrac{B}{2}(-y,x)$, magnetic length $\\ell = \\sqrt{\\hbar c/eB}$, complex coordinate $z = x - iy$. The lowest-Landau-level (LLL) constraint is exhausted by holomorphy: every LLL state is $f(\\{z_i\\})\\,e^{-\\sum_i |z_i|^2/4\\ell^2}$ with $f$ entire. Laughlin's ansatz [17] fixes $f$ by three requirements — analyticity, total angular momentum $M = mN(N-1)/2$, and odd relative exponent for antisymmetry:\n\n$$\\Psi_m(\\{z_i\\}) \\;=\\; \\prod_{i\u003cj}(z_i - z_j)^m \\, \\exp\\!\\Big(-\\frac{1}{4\\ell^2}\\sum_k |z_k|^2\\Big), \\qquad m \\ \\text{odd},$$\n\nwith filling $\\nu = 1/m$ read off from the maximal single-particle angular momentum $m(N-1)$, i.e. $N_\\phi = m(N-1)+1$ flux quanta. This is a *variational* wavefunction, not a derived ground state — though it is the exact zero-energy ground state of the Haldane pseudopotential Hamiltonian truncated at $V_1$ (and $V_1, V_3$ for $m=5$), which is the modern sense in which \"Laughlin state\" is a sharply defined phase label rather than an ansatz.\n\n### The plasma analogy and the assumption inside it\n\nWrite $|\\Psi_m|^2 = e^{-\\beta U}$ with $\\beta = 2/m$ and\n\n$$U = -m^2 \\sum_{i\u003cj} \\ln|z_i - z_j| \\;+\\; \\frac{m}{4\\ell^2}\\sum_k |z_k|^2.$$\n\nThis is the classical statistical mechanics of a 2D one-component plasma: particles of charge $q=m$ interacting logarithmically, in a uniform neutralizing background of density $\\rho_b = 1/(2\\pi m \\ell^2)$. The plasma is in its screening phase for $\\Gamma = 2m \\lesssim 140$, hence charge-neutral and locally incompressible; the electron density is pinned at $\\rho = \\nu/(2\\pi\\ell^2)$.\n\nThe screening assumption is not decorative — it is what makes every subsequent statement true. Exponential screening is what gives the quasihole a *sharply localized*, *quantized* deficit charge; it is also what makes the Berry-connection integrals below converge to their topological values with corrections suppressed as $e^{-|\\eta_1-\\eta_2|/\\lambda_D}$. If the plasma froze (Wigner crystallization at large $\\Gamma$), the norm $\\langle\\Psi\\mid\\Psi\\rangle$ would no longer be a screening-phase partition function and the charge and statistics arguments would both fail. Textbook presentations quote the results and drop the hypothesis.\n\n### Quasihole by adiabatic flux insertion\n\nPierce the fluid at $\\eta$ with an infinitely thin solenoid and adiabatically thread one flux quantum $\\Phi_0 = hc/e$. By Faraday, the azimuthal EMF drives a radial Hall current $j_r = \\sigma_{xy} E_\\theta$, transporting\n\n$$\\Delta Q = \\int\\! dt \\oint j_r \\, d\\ell = \\sigma_{xy}\\frac{\\Phi_0}{c} = \\frac{\\nu e^2}{h}\\cdot\\frac{h}{e} = \\nu e = \\frac{e}{m}$$\n\nout of the puncture. A large gauge transformation removes the solenoid, and the final state is a LLL state of the original Hamiltonian:\n\n$$\\Psi_m^{\\text{qh}}(\\eta) = \\prod_i (z_i - \\eta)\\, \\Psi_m.$$\n\nThe Jastrow zero repels exactly $1/m$ of an electron. In plasma language, $|\\Psi^{\\rm qh}|^2$ adds an impurity of charge $1$ to a plasma of charge-$m$ particles; screening produces a compensating cloud of $1/m$ particle, i.e. a deficit $e/m$. Laughlin's paper states the charge and — as the credit audit records — says nothing at all about statistics.\n\n### The Arovas–Schrieffer–Wilczek Berry phase\n\nNow move the quasihole slowly around a closed loop and compute the Berry phase [14]. With normalized $|\\Psi(\\eta)\\rangle$,\n\n$$\\gamma = i\\oint \\langle \\Psi \\mid \\partial_\\eta \\Psi\\rangle\\, d\\eta + \\text{c.c.}$$\n\nThe key step is that $\\ln\\langle\\Psi^{\\rm qh}\\mid\\Psi^{\\rm qh}\\rangle$ is the free energy of the plasma with one impurity, and screening makes it $\\eta$-independent up to the boundary. Using $\\partial_\\eta \\ln \\Psi^{\\rm qh} = -\\sum_i (z_i-\\eta)^{-1}$ and the plasma sum rule $\\langle \\sum_i \\delta^2(z-z_i)\\rangle = \\rho$,\n\n$$\\gamma_1 = -2\\pi \\frac{\\rho}{\\,} \\cdot \\frac{A}{2\\pi}\\cdot\\frac{1}{m}\\Big|_{\\text{per unit}} \\;\\Longrightarrow\\; \\gamma_1 = -2\\pi\\,\\frac{\\langle N_{\\rm enc}\\rangle}{m} = -2\\pi \\frac{\\rho A}{m},$$\n\nwhich is precisely the Aharonov–Bohm phase $ (e^*/\\hbar c)\\oint \\mathbf{A}\\cdot d\\boldsymbol\\ell = 2\\pi (e^*/e)\\,(\\Phi_{\\rm enc}/\\Phi_0)$ for a charge $e^* = e/m$ enclosing flux $\\Phi_{\\rm enc} = BA$. This is the *charge* piece and contains no statistics.\n\nPut a second quasihole inside the loop. The enclosed charge is reduced by $e/m$, so the mean density inside the contour drops by exactly one $1/m$-deficit, and\n\n$$\\Delta\\gamma = \\gamma_2 - \\gamma_1 = +\\frac{2\\pi}{m}.$$\n\nThat is the *monodromy* — a full circuit, one quasihole around another. A single exchange is half of it:\n\n$$\\boxed{\\;\\theta = \\frac{\\pi}{m}\\;}$$\n\nso $m=3$ gives $\\theta = \\pi/3$, one third of the fermionic $\\pi$. Two caveats that the derivation makes visible and the pedagogy suppresses. First, the split into \"AB piece\" and \"statistical piece\" is *definitional*: the total measured phase is $\\gamma_2$, and calling $2\\pi/m$ \"statistics\" presumes you subtract a reference AB phase computed with the same enclosed area. Second, this is a Berry-phase calculation, and identifying it with the topological monodromy requires the Berry connection in the *relative* coordinate to vanish — which holds here because the $\\eta$-dependence is holomorphic and the norm is $\\eta$-independent by screening. It is a theorem under conditions, not a definition.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDecomposition of the ASW Berry phase\u003c/title\u003e\u003ctext x=\"20\" y=\"26\" fill=\"#e8e6e1\" font-size=\"17\" font-family=\"serif\"\u003eQuasihole 1 transported around loop C: total phase = AB piece + statistical piece\u003c/text\u003e\u003cellipse cx=\"185\" cy=\"215\" rx=\"140\" ry=\"115\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"140\" y=\"345\" fill=\"#7aa2ff\" font-size=\"15\"\u003eloop C, area A\u003c/text\u003e\u003ccircle cx=\"325\" cy=\"150\" r=\"8\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"340\" y=\"146\" fill=\"#ffb86b\" font-size=\"15\"\u003equasihole 1 (e/m)\u003c/text\u003e\u003cpath d=\"M325 150 L340 128\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" opacity=\"0.55\"\u003e\u003cline x1=\"90\" y1=\"160\" x2=\"90\" y2=\"176\"/\u003e\u003cline x1=\"130\" y1=\"200\" x2=\"130\" y2=\"216\"/\u003e\u003cline x1=\"170\" y1=\"150\" x2=\"170\" y2=\"166\"/\u003e\u003cline x1=\"210\" y1=\"245\" x2=\"210\" y2=\"261\"/\u003e\u003cline x1=\"250\" y1=\"185\" x2=\"250\" y2=\"201\"/\u003e\u003cline x1=\"110\" y1=\"265\" x2=\"110\" y2=\"281\"/\u003e\u003cline x1=\"230\" y1=\"130\" x2=\"230\" y2=\"146\"/\u003e\u003cline x1=\"165\" y1=\"290\" x2=\"165\" y2=\"306\"/\u003e\u003c/g\u003e\u003ctext x=\"60\" y=\"130\" fill=\"#e8e6e1\" font-size=\"14\" opacity=\"0.75\"\u003euniform fluid, density ρ = ν/2πℓ²\u003c/text\u003e\u003ccircle cx=\"185\" cy=\"220\" r=\"9\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003ccircle cx=\"185\" cy=\"220\" r=\"26\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/\u003e\u003ctext x=\"205\" y=\"240\" fill=\"#ff7a90\" font-size=\"15\"\u003equasihole 2: removes e/m\u003c/text\u003e\u003ctext x=\"205\" y=\"258\" fill=\"#ff7a90\" font-size=\"15\"\u003eof enclosed charge\u003c/text\u003e\u003cline x1=\"380\" y1=\"60\" x2=\"380\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1\" opacity=\"0.4\"/\u003e\u003ctext x=\"410\" y=\"95\" fill=\"#e8e6e1\" font-size=\"16\"\u003eempty loop:\u003c/text\u003e\u003ctext x=\"410\" y=\"120\" fill=\"#7aa2ff\" font-size=\"16\"\u003eγ₁ = −2π (ρA)/m [pure Aharonov–Bohm]\u003c/text\u003e\u003ctext x=\"410\" y=\"165\" fill=\"#e8e6e1\" font-size=\"16\"\u003eone quasihole inside:\u003c/text\u003e\u003ctext x=\"410\" y=\"190\" fill=\"#7aa2ff\" font-size=\"16\"\u003eγ₂ = −2π (ρA − 1/m·?)/m\u003c/text\u003e\u003ctext x=\"410\" y=\"235\" fill=\"#e8e6e1\" font-size=\"16\"\u003edifference = monodromy:\u003c/text\u003e\u003ctext x=\"410\" y=\"262\" fill=\"#7ee0a3\" font-size=\"18\"\u003eΔγ = +2π/m\u003c/text\u003e\u003ctext x=\"410\" y=\"300\" fill=\"#e8e6e1\" font-size=\"16\"\u003esingle exchange = half:\u003c/text\u003e\u003ctext x=\"410\" y=\"327\" fill=\"#7ee0a3\" font-size=\"18\"\u003eθ = π/m\u003c/text\u003e\u003ctext x=\"410\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" opacity=\"0.8\"\u003evalid only if the plasma screens (Γ = 2m below freezing)\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The ASW computation as a subtraction. Transporting a quasihole around an empty loop gives the pure Aharonov–Bohm phase set by the enclosed charge $\\rho A$; inserting a second quasihole removes exactly $e/m$ of that enclosed charge, and the resulting deficit in the AB phase is the statistical monodromy $2\\pi/m$. Note that the \"statistics\" is defined by the difference, not measured independently — and that screening is what makes the enclosed-charge bookkeeping exact.*\n\n### Halperin's hierarchy\n\nHalperin [18] made the identification $\\theta = \\pi/m$ before the Berry-phase derivation existed and used it as machinery, not decoration: if quasiparticles are anyons with statistics $\\theta$, they can themselves condense into a Laughlin-like state of their own, generating daughter fillings\n\n$$\\nu = \\cfrac{1}{p_1 + \\cfrac{\\alpha_1}{p_2 + \\cfrac{\\alpha_2}{p_3 + \\cdots}}}, \\qquad \\alpha_i = \\pm 1,$$\n\nwith $p_1$ odd and $p_{i\u003e1}$ even, which reproduces the observed $2/5, 3/7, 2/7, \\ldots$ sequence. The statistics parameter is the input, not the output. This is the paper that first says FQH quasiparticles are anyons — Laughlin 1983 does not, and neither does the 1998 Nobel motivation, which is scrupulously about charge [17][19].\n\n### Flux attachment and the K-matrix\n\nThe effective theory makes the whole structure algebraic. Bind $m$ flux quanta to each electron via a statistical gauge field $a_\\mu$ with a Chern–Simons term; the composite is a boson, condenses, and integrating out the matter leaves\n\n$$\\mathcal{L} = -\\frac{m}{4\\pi}\\,\\epsilon^{\\mu\\nu\\lambda} a_\\mu \\partial_\\nu a_\\lambda \\;+\\; \\frac{1}{2\\pi}\\,\\epsilon^{\\mu\\nu\\lambda} A_\\mu \\partial_\\nu a_\\lambda \\;-\\; a_\\mu j^\\mu_{\\rm qp}.$$\n\nThe $a_0$ equation of motion is the flux-attachment constraint $\\frac{m}{2\\pi}\\,b = \\rho_{\\rm qp}$; integrating out $a$ gives $\\sigma_{xy} = \\frac{1}{m}\\frac{e^2}{h}$, and a quasiparticle of unit statistical charge carries physical charge $e/m$ and acquires monodromy $2\\pi/m$ with another. Generalized to multiple condensates, $\\mathcal L = -\\frac{1}{4\\pi}K_{IJ}\\,a^I \\partial a^J + \\frac{1}{2\\pi}t_I A\\,\\partial a^I$, and quasiparticles labelled by integer vectors $\\ell$ obey\n\n$$Q_\\ell = e\\, t^{T} K^{-1}\\ell, \\qquad \\theta_{\\ell\\ell'} = \\pi\\, \\ell^{T} K^{-1}\\ell', \\qquad \\nu = t^T K^{-1} t.$$\n\nFor $K = (m)$, $t=1$: $Q = e/m$, $\\theta = \\pi/m$, $\\nu = 1/m$ — the locking $Q = \\nu e \\Leftrightarrow \\theta = \\pi\\nu$ falls out as a single matrix identity.\n\nThat identity is a property of *abelian Chern–Simons theory with $K=(m)$*, not a law of nature. It fails as soon as $K$ is not $1\\times1$: in Halperin's $(m,m',n)$ bilayer states, or in the hierarchy $K$-matrices, distinct quasiparticles have charges and mutual statistics that are unrelated numbers, and the theory contains neutral quasiparticles ($t^TK^{-1}\\ell = 0$) with nontrivial braiding. It fails in the other direction for $\\mathbb{Z}_2$ topological order, where the vison is electrically neutral and mutually semionic with the spinon. And it fails entirely for non-abelian orders [12], where $\\theta$ is not a number. The reader who has internalized \"fractional charge $\\nu e$ therefore statistics $\\pi\\nu$\" has memorized the $1\\times1$ case of a matrix formula."}, {"id": "non-abelian-two-lineages", "title": "Non-Abelian Statistics: Two Independent Derivations, Two Literatures", "markdown": "## Non-Abelian Statistics: Two Independent Derivations, Two Literatures\n\nThe statement \"non-abelian anyons were introduced by Moore and Read in 1991\" is the second textbook sentence in this dossier that fails on the historical record — and it fails differently from the first. Nobody was misnamed. Two communities derived the same structure from incompatible starting points, published two years apart, and then proceeded for three decades with a cross-citation rate close to zero. The result is a field in which the same mathematical object carries two names, and the priority question is not contested so much as invisible.\n\n### Route A: braid statistics from the DHR axioms\n\nThe algebraic route begins with Doplicher–Haag–Roberts superselection theory, whose object of study is not a wavefunction but the net of local observable algebras $\\mathcal{A}(\\mathcal{O})$ over spacetime regions. A charged sector is a representation $\\pi$ that becomes equivalent to the vacuum representation when restricted to the causal complement of a bounded region; equivalently, it is generated by a localized transportable endomorphism $\\rho: \\mathcal{A} \\to \\mathcal{A}$. Composition of endomorphisms defines fusion, $\\rho_1 \\rho_2$, and the statistics operator arises entirely from the ambiguity in commuting two spacelike-separated endomorphisms:\n\n$$\\varepsilon(\\rho_1,\\rho_2) \\equiv U^*_{2}U^*_{1}\\,\\rho_1(U_2)\\,\\rho_2(U_1),$$\n\nwith $U_i$ the charge transporters moving $\\rho_i$ out to spacelike infinity. In $d \\ge 3+1$ the space of spacelike directions is simply connected, the choice of transport path is immaterial, and $\\varepsilon^2 = 1$: one recovers a representation of the permutation group $S_N$, hence Bose/Fermi/para statistics. In $d \\le 2+1$ the relevant space of spacelike separations is *not* simply connected — left and right are inequivalent — and the transport ambiguity survives. What one obtains is a representation of Artin's braid group $B_N$, with $\\varepsilon$ satisfying the Yang–Baxter relation rather than $\\varepsilon^2 = 1$. This is precisely the same topological fact as §3, arrived at without ever writing a configuration space: the multiple connectivity now lives in the causal structure rather than in $Q_N$.\n\nThe decisive quantity is the *statistical dimension*. DHR assign to each sector a statistics parameter $\\lambda_\\rho$, extracted from the trace of $\\varepsilon$ in the left inverse of $\\rho$; in higher dimensions $\\lambda_\\rho = \\pm 1/d$ with $d$ a positive integer (the para-Bose/para-Fermi order) and $|\\lambda_\\rho|^{-1} = d$ is the multiplicity of the para-statistics. Fredenhagen, Rehren and Schroer [15] showed that in low dimensions this integrality constraint dissolves: sectors exist with\n\n$$d_\\rho = |\\lambda_\\rho|^{-1} \\in \\{2\\cos(\\pi/n)\\} \\cup [2,\\infty),$$\n\nthe Jones index spectrum, so $d_\\rho$ need not be an integer. A sector of non-integer statistical dimension cannot have a one-dimensional braid representation — the exchange of two such charges necessarily acts as a matrix on a multiplicity space. **That is non-abelian statistics, derived from axioms, in 1989** [15], with Fröhlich and Gabbiani reaching the same structure independently by the same route. Neither paper mentions the fractional quantum Hall effect. The exchange algebra, the fusion rules, the $R$- and $F$-matrices, and the Verlinde-type modular data all appear there or in the immediate follow-ups [20].\n\n### Route B: conformal blocks and the Pfaffian\n\nThe wavefunction route starts from a completely different intuition: the observation that Laughlin's state is, term by term, a chiral correlator. With $\\mathcal{V}_e(z) =:e^{i\\sqrt{m}\\varphi(z)}:$ a vertex operator of a free chiral boson,\n\n$$\\langle \\mathcal{V}_e(z_1)\\cdots\\mathcal{V}_e(z_N)\\,\\mathcal{O}_{\\rm bg}\\rangle \\;\\propto\\; \\prod_{i\u003cj}(z_i-z_j)^m,$$\n\nand the quasihole is the vertex operator $\\mathcal{V}_{qh} =:e^{i\\varphi/\\sqrt{m}}:$ of conformal weight $h = 1/2m$, whose braiding phase is fixed by the OPE monodromy — reproducing $\\theta = \\pi/m$ without any Berry-phase integral. Moore and Read [12] took this dictionary seriously and asked what happens when the chiral algebra is *not* a lattice boson, so that the space of conformal blocks is more than one-dimensional. Their answer at $\\nu = 5/2$: pair the composite fermions with an Ising sector, giving\n\n$$\\Psi_{\\rm MR} = {\\rm Pf}\\!\\left(\\frac{1}{z_i - z_j}\\right)\\prod_{i\u003cj}(z_i-z_j)^{2}\\,e^{-\\sum|z_i|^2/4},$$\n\nthe Pfaffian being the chiral correlator $\\langle \\psi(z_1)\\cdots\\psi(z_N)\\rangle$ of the Ising Majorana. Quasiholes are $\\sigma$ vertex operators of weight $1/16$, and the $2n$-point $\\sigma$ block space has dimension $2^{n/2-1}$ — the well-known degeneracy of the Ising fusion $\\sigma \\times \\sigma = 1 + \\psi$ with fixed total parity. Exchange therefore cannot be a phase; it is a unitary on a $2^{n/2-1}$-dimensional space with no local operator to distinguish its basis states. Moore and Read called them *nonabelions*. Wen's effective-theory paper the same year (Phys. Rev. Lett. 66, 802) reached the non-abelian statement from the Chern–Simons/edge side, defining the topological order by the degeneracy structure rather than by the block counting (verify — not in the corpus).\n\n### The same object, twice named\n\nThe identification is exact and worth stating flatly: **the modern quantum dimension $d_a$ of a modular tensor category is the DHR statistical dimension $d_\\rho$.** Both are defined as the Perron–Frobenius eigenvalue of the fusion matrix $(N_a)_{bc} = N^c_{ab}$, both satisfy $d_a d_b = \\sum_c N^c_{ab} d_c$, both give the ground-state degeneracy growth $\\sim d_a^n$ for $n$ quasiparticles, and both equal $|\\lambda|^{-1}$ in the algebraic normalization. For Ising, $d_\\sigma = \\sqrt 2 = 2\\cos(\\pi/4)$ — the first non-trivial Jones index, sitting exactly where [15] said the non-integer sectors begin. The $S$-matrix that condensed-matter papers obtain from Wilson-loop expectation values in Chern–Simons theory is the same $S$ that appears in [15] and its sequels as a charge-transport matrix on intertwiner subalgebras [20]. Nothing about the correspondence is loose or analogical.\n\nThe cross-citation, however, is thin in a documentable way. Moore–Read [12] is a Nuclear Physics B paper written by two string theorists who cite the rational-CFT literature heavily — and the Commun. Math. Phys. braid-statistics papers essentially not at all. Modern condensed-matter reviews of non-abelian anyons routinely date the concept to 1991, define $d_a$ categorically, and proceed without a single reference to algebraic QFT; conversely the AQFT literature reconstructs modular data with no mention of $\\nu = 5/2$. Where the two do meet, it is through Kitaev's route [13] — the toric code and the anyon-model axioms of the appendix to *Anyons in an exactly solved model* — which is written in the categorical language and is the common ancestor of nearly every subsequent condensed-matter treatment, including symmetry fractionalization and gauging [21] and the anyon-condensation program [22].\n\nTwo caveats before the record closes. First, the CFT construction *asserts* rather than proves that block monodromy equals the adiabatic Berry holonomy; that equality holds only under conditions on the plasma screening and holomorphy of the trial states (see the Conflation Watch, §7), and Moore–Read state it as a physical hypothesis. Second, \"$\\nu = 5/2$ is the Pfaffian\" is a 1991 shorthand the data have not ratified: the anti-Pfaffian and PH-Pfaffian carry different chiral central charges ($c_- = -1/2$, $+1/2$) and different topological orders, so the $\\sigma$-anyon content of the physical $5/2$ state remains an open experimental question, not a settled corollary of [12]. The mathematics of non-abelian braiding is secure in both derivations; its material realization is not."}, {"id": "modern-formalism-and-tqc", "title": "What Superseded What: Modular Tensor Categories, the Toric Code, and Topological Quantum Computation", "markdown": "## What Superseded What: Modular Tensor Categories, the Toric Code, and Topological Quantum Computation\n\nEverything up to this point in the dossier was model-specific. Laughlin's $\\prod(z_i-z_j)^m$ is an ansatz for a particular Hamiltonian in a particular Landau level; the Arovas–Schrieffer–Wilczek Berry phase [14] is a calculation performed on that ansatz; Chern–Simons flux attachment is an effective field theory with a coupling constant fixed by hand to reproduce it. None of these tells you what an anyon *is* independent of the medium carrying it. The modern answer — that the universal data of a 2+1D gapped phase is a unitary modular tensor category (MTC), and that everything else is representation-dependent scaffolding — is what superseded them, and it is worth being precise about what \"superseded\" means here: the old formulations were not falsified, they were shown to be *presentations* of a finite algebraic object.\n\n### The axiomatic object\n\nFix a finite label set $\\{a,b,c,\\dots\\}$ of superselection sectors (topological charges), with a distinguished vacuum $1$ and an involution $a\\mapsto\\bar a$. The data are:\n\n**Fusion.** Nonnegative integers $N_{ab}^{c}$ with $a\\times b=\\sum_c N_{ab}^{c}\\,c$, associative and commutative, with $N_{a\\bar a}^{1}=1$. The multiplicity spaces $V_{ab}^{c}$ have $\\dim V_{ab}^{c}=N_{ab}^{c}$; the $n$-quasiparticle Hilbert space at fixed total charge is $\\bigoplus$ of fusion-tree bases, and its dimension grows as $d_a^{\\,n}$ where $d_a$ is the Perron–Frobenius eigenvalue of the matrix $(N_a)_{b}^{\\,c}$. Abelian anyons are exactly those with $d_a=1$ — one fusion channel, hence a phase and nothing more. This is the precise sense in which abelian statistics is a degenerate case rather than a different phenomenon.\n\n**Associativity and braiding.** The two ways of decomposing $a\\times b\\times c$ are related by $F^{abc}_{d}:\\bigoplus_e V^e_{ab}\\otimes V^d_{ec}\\to\\bigoplus_f V^f_{bc}\\otimes V^d_{af}$, and exchange acts by $R^{ab}_c$ on $V^c_{ab}$. Consistency is not optional: the pentagon equation (five ways of reassociating four charges) and the two hexagons ($F$–$R$ compatibility) are polynomial constraints whose solutions, by Ocneanu rigidity, are finite in number for fixed fusion rules, up to gauge. This is the replacement for \"write down a trial wavefunction and compute a monodromy\": the statistics are fixed by algebra, and the wavefunction is one realization.\n\n**Modularity.** With the topological twist $\\theta_a=e^{2\\pi i h_a}$ (a phase; $h_a$ the conformal weight in the CFT realization) and the total quantum dimension $\\mathcal{D}=\\sqrt{\\sum_a d_a^{2}}$, define\n\n$$S_{ab}=\\frac{1}{\\mathcal{D}}\\sum_{c}N_{\\bar a b}^{c}\\,\\frac{\\theta_c}{\\theta_a\\theta_b}\\,d_c,\\qquad T_{ab}=\\delta_{ab}\\,\\theta_a\\,e^{-2\\pi i c_-/24}.$$\n\nThe category is *modular* when $S$ is invertible — equivalently, when the only anyon braiding trivially with everything is the vacuum (no transparent particles). Then $S,T$ generate a projective representation of $SL(2,\\mathbb{Z})$, Verlinde's formula $N_{ab}^{c}=\\sum_x S_{ax}S_{bx}S^{*}_{cx}/S_{1x}$ recovers the fusion rules from $S$ alone, and $\\mathcal{D}$ appears as the universal subleading term $-\\gamma=-\\log\\mathcal{D}$ in the entanglement entropy. The chiral central charge $c_-$ is *not* fixed by the MTC — only $c_-\\bmod 8$ is, via the Gauss sum $\\frac{1}{\\mathcal{D}}\\sum_a d_a^{2}\\theta_a=e^{2\\pi i c_-/8}$. This is exactly why the $\\nu=5/2$ candidates (Pfaffian, anti-Pfaffian, PH-Pfaffian) can share Ising-like fusion and still be distinguished by thermal Hall transport.\n\n**What survives as a special case.** Abelian Chern–Simons at level $K$ survives intact: it is the MTC built from the discriminant group $\\mathbb{Z}^n/K\\mathbb{Z}^n$ with quadratic form $q(l)=\\pi l^{T}K^{-1}l$, so $\\theta$ and $Q$ are the diagonal and off-diagonal entries of one $K$-matrix — which is the structural reason charge and statistics are locked in the Laughlin state and not in general. Moore–Read's conformal-block construction [12] survives as a *realization functor*: the blocks of a chiral CFT with a given chiral algebra furnish an MTC, so Ising$\\times$U(1) is the category and the Pfaffian is a wavefunction for it. Wu's braid-group representation theory [10] survives as the statement that the $B_n$ action is generated by $F$ and $R$ — his 1D reps are precisely the $d_a=1$ sector. What did *not* survive is the idea that the wavefunction is the invariant: two ansätze in the same phase give the same $(N,F,R,S,T)$ and are otherwise unrelated, and this is where the monodromy-versus-Berry-phase subtlety of §5 gets its resolution — the category records monodromy, and the Berry connection is a gauge choice one must show is flat.\n\n### Kitaev's inversion: anyons as error correction\n\nThe reframing that changed the field's funding profile is Kitaev's 1997 preprint [13]. Its move is not to find a new anyon model but to read the existing structure as a *code*. The toric code is a spin-$1/2$ model on the links of a lattice with commuting stabilizers $A_v=\\prod_{l\\ni v}\\sigma^x_l$, $B_p=\\prod_{l\\in p}\\sigma^z_l$; its ground space on a genus-$g$ surface is $4^g$-fold degenerate, and its excitations are the $\\mathbb{Z}_2$ anyons $\\{1,e,m,\\varepsilon\\}$ with mutual statistics $-1$ between $e$ and $m$. Three claims are packed together and are worth separating:\n\n1. **Degeneracy as memory.** The topological degeneracy is a qubit that no local operator can read or rotate; the logical operators are non-contractible Wilson loops. Protection is *not* symmetry — it is the gap plus the locality of the noise.\n2. **Anyons as syndromes.** Local errors create anyon pairs; measuring stabilizers is measuring topological charge; correction is pairing up defects. Error correction stops being an add-on protocol and becomes the physics of the phase.\n3. **Braiding as gates.** Unitary evolution is generated by moving charges around each other, so the gate is determined by a homotopy class, not by a pulse shape — the immunity to control error is topological.\n\nThe toric code is $\\mathbb{Z}_2$ gauge theory, known in that language for years; the code-theoretic reading is what was new, and it is why the $e$–$m$ anyons of a spin liquid [23][24] and the syndrome graph of a surface-code processor are literally the same object.\n\n### Which anyons compute\n\nBraiding alone is a finite-image or infinite-image representation of $B_n$ depending on the model, and this is a theorem, not a heuristic. Freedman, Kitaev, Larsen and Wang established (i) that a topological quantum computer is polynomially equivalent to the quantum circuit model — no more and no less powerful — and (ii) density criteria for the braid-group image in the fusion-space unitary group. The consequences:\n\n| Model | $d_\\sigma$ | Braid group image | Computational power |\n|---|---|---|---|\n| Abelian (Laughlin) | $1$ | Abelian phases | Nothing; braiding is a global phase |\n| Ising / Moore–Read | $\\sqrt{2}$ | Finite (Clifford, via a metaplectic rep) | Clifford only — classically simulable by Gottesman–Knill |\n| Fibonacci ($\\tau\\times\\tau=1+\\tau$) | $\\varphi=\\frac{1+\\sqrt5}{2}$ | Dense in $SU(2)$ (Jones rep at $q=e^{i\\pi/5}$) | Universal by braiding alone |\n\nIsing anyons — hence Majorana zero modes — are *not* universal: the missing $\\pi/8$ gate must be supplied non-topologically (magic-state distillation, measurement-assisted schemes) [25][26], which is precisely the protection one was trying to buy. Fibonacci anyons, whose density follows from the Jones representation being dense at a non-lattice root of unity, are universal, and the Solovay–Kitaev theorem then gives efficient compilation of any target gate to $\\mathrm{polylog}(1/\\epsilon)$ braids — still the compilation problem attacked in current work on Ising-type and non-semisimple models [27].\n\n### The chronology, stated correctly\n\nReviews and program documents routinely present topological quantum computation as an outgrowth of the Majorana-nanowire effort. The order is the reverse. Kitaev's fault-tolerance paper is 1997 [13]; the universality theorems are 2000–2002; Kitaev's honeycomb model and its non-abelian phase are 2006. The Majorana-nanowire proposals (Fu–Kane 2008, Lutchyn/Oreg 2010) and the $\\nu=5/2$ qubit designs [28] are *applications* of a target that had already been specified categorically — Ising anyons were known to be non-universal before anyone tried to grow one. The npj/RMP-era reviews [29], the milestone roadmaps [26], and the poisoning-protected architectures [25] are engineering downstream of a theorem, and treating them as the origin of topological qubits inverts a fifteen-year gap. The same inversion makes it easy to forget that an MZM in a wire is a defect in a system with no bulk topological order, whereas $\\sigma$ in an MTC is a deconfined excitation — a distinction the category makes unambiguous and the device literature routinely elides."}, {"id": "validity-and-conflation-audit", "title": "Validity Audit and Conflation Watch: Six Places the Literature Confuses Itself", "markdown": "## Validity Audit and Conflation Watch: Six Places the Literature Confuses Itself\n\nWhat follows is not a list of errors that anyone would defend if pressed. It is a list of *load-bearing shorthands* — statements true in the regime where they were first derived, which circulate with the regime stripped off. Each entry states the surviving content, the conditions, and the specific clause that gets deleted in transmission.\n\n### 1. Fractional charge and fractional statistics are independent; Laughlin locks them\n\n**Valid:** In the Laughlin state at $\\nu = 1/m$ the quasihole carries $Q = e/m$ [17] and mutual statistical angle $\\theta = \\pi/m$ [18][14].\n\n**Regime:** The locking $\\theta = \\pi Q/e$ is a theorem about *abelian Chern–Simons flux attachment*, not about fractionalization. With $\\mathcal{L} = \\frac{k}{4\\pi}\\epsilon^{\\mu\\nu\\lambda}a_\\mu\\partial_\\nu a_\\lambda + a_\\mu j^\\mu$, integrating out $a$ ties the charge a quasiparticle sees to the flux it carries, so the Aharonov–Bohm and statistical phases descend from one coefficient. Break the single-component structure and the lock breaks: the Moore–Read neutral fermion $\\psi$ has $Q=0$ and fermionic exchange, $\\sigma$ has $Q = e/4$ and non-abelian braiding [12]; $\\mathbb{Z}_2$ visons in a spin liquid are chargeless and mutually semionic with the spinon [23][24].\n\n**Stripped assumption:** the word \"quasiparticle\" in FQH pedagogy always means *the abelian Laughlin quasihole*, where the two properties are numerically welded. Charge fractionalization needs only spectral flow across a degenerate soliton sector — Jackiw–Rebbi in 1+1D [11], where $\\pi_1$ of the configuration space is trivial and anyons cannot exist at all. A one-dimensional counterexample to \"fractional charge implies fractional statistics\" has been in print since 1976.\n\n### 2. Braid statistics vs. Haldane exclusion statistics\n\n**Valid:** Two distinct definitions. (i) *Braid statistics*: the one-dimensional characters $\\sigma_i \\mapsto e^{i\\theta}$ of $B_N = \\pi_1(Q_N)$, defined only in $d=2$ [2][10]. (ii) *Haldane exclusion statistics* (1991): a counting rule on the dimension $G$ of the available single-particle space, $\\Delta G = -\\alpha\\,\\Delta N$, with the $N$-particle state count\n$$W = \\frac{[G - \\alpha(N-1) + N - 1]!}{N!\\,[G-\\alpha N - \\alpha... ]!} \\quad \\text{(Haldane's form; } \\alpha=0 \\text{ Bose, } \\alpha=1 \\text{ Fermi)}.$$\nDefinition (ii) contains no braid group, no configuration space, no dimension restriction. It is defined for 1D Calogero–Sutherland and for spinon counting in the Haldane–Shastry chain.\n\n**Regime of the coincidence:** In the lowest Landau level the Laughlin quasihole satisfies $\\alpha = \\theta/\\pi = 1/m$. This is a statement about how quasiholes eat LLL orbitals at fixed flux, and it holds because the LLL degeneracy is $N_\\Phi + 1$ and each quasihole consumes $1/m$ of an orbital's worth of counting. It is an identity of the *counting*, derived in the LLL, not a general dictionary.\n\n**Stripped assumption:** the phrase \"fractional statistics parameter\" is used for both $\\theta/\\pi$ and $\\alpha$ without qualification, so numerical agreement in one Hilbert space gets promoted to an identity. Yong-Shi Wu computed the exchange phase of (i) [10] and, separately, the thermodynamics of (ii); the shared author is part of why the two collapsed into one word.\n\n### 3. Majorana zero modes are defects; Ising anyons are excitations\n\n**Valid:** Both obey $\\sigma\\times\\sigma = 1 + \\psi$ and both give a non-abelian representation of exchange on a degenerate space.\n\n**Regime:** They are not the same object. A Majorana zero mode in a nanowire or a vortex core is an *extrinsic defect* — its location is set by external structure (wire end, applied field, gate-defined domain), it is not a deconfined excitation of a bulk topological order, its degeneracy is protected by a gap plus a parity superselection rule, and there is no braid group because a 1D wire has no 2D configuration space. The \"braiding\" in T-junction protocols [25][26] is an exchange defined by the Clifford algebra $\\{\\gamma_i,\\gamma_j\\}=2\\delta_{ij}$ and the adiabatic sequence, giving $U_{ij} = \\exp(\\frac{\\pi}{4}\\gamma_i\\gamma_j)$ — a correct and useful result, but derived from the zero-mode algebra, not from $\\pi_1$. The Ising $\\sigma$ in the Moore–Read TQFT [12] *is* a deconfined bulk quasiparticle with quantum dimension $\\sqrt2$, obeying genuine $B_N$ monodromy.\n\n**Stripped assumption:** the nanowire literature [30][31][25][32] and the topological-order literature [28][27][22] use \"non-abelian anyon\" for both. The consequences differ: defect degeneracy is destroyed by quasiparticle poisoning at a rate set by microscopic physics [25], whereas bulk anyon degeneracy is protected by the topological gap. Two objects sharing a fusion rule do not share a protection mechanism. Symmetry defects in a topological phase are the formal bridge, and their theory — $G$-crossed extensions — is a strictly larger structure than the parent MTC [21].\n\n### 4. Berry holonomy is not automatically the statistics\n\n**Valid:** For Laughlin, Moore–Read, and Read–Rezayi trial states, adiabatic transport of quasiholes yields a non-abelian Berry holonomy whose non-trivial part equals the analytic monodromy of the conformal blocks.\n\n**Regime:** The topologically invariant datum is the *monodromy* — how the multivalued wavefunction continues around a branch point — which is basis-independent. The Berry holonomy is connection- and gauge-dependent and equals the monodromy only when the trial states are (a) mutually orthonormal to exponential accuracy in the quasihole separation, and (b) holomorphic in the quasihole coordinates, so that the Berry connection reduces to an area (Aharonov–Bohm) term with no extra non-abelian piece. Read established these as *conditions to be checked*, verified them for the relevant model states via plasma screening, and showed that screening failure invalidates the identification.\n\n**Stripped assumption:** \"we computed the Berry phase, therefore we computed the statistics.\" Arovas–Schrieffer–Wilczek [14] is legitimate because the plasma screens; the same manipulation applied to a non-screening ansatz, or to states with a nonzero overlap matrix derivative, is not. The check is a plasma/screening argument, not a formality.\n\n### 5. Fano factor $1/3$ is edge transport, not bulk spectroscopy\n\n**Valid:** Shot noise at a weak constriction on a $\\nu=1/3$ edge gives $S = 2e^*I_B$ with $e^* = e/3$ [33].\n\n**Regime:** Weak backscattering, so the tunnelling object is a Laughlin quasiparticle between two edges; temperature above the crossover $k_BT \\gtrsim eV_{\\rm cross}$ set by the constriction's relevant-operator scale; a clean, fully equilibrated $\\nu=1/3$ edge. In the *strong*-backscattering limit the same junction is two disconnected fractional liquids and electrons tunnel through vacuum: Fano factor $1$. Between the limits, the extracted $e^*$ drifts continuously between $e/3$ and $e$; nothing discrete is being counted.\n\n**Stripped assumption:** the Luttinger-liquid edge theory. $e^*$ from noise is a property of a tunnelling operator's scaling dimension and charge in a chiral Luttinger liquid; the bulk quasiparticle charge is inferred through that theory, not measured against it. This is a strong and independently corroborated inference — not a direct spectroscopy.\n\n### 6. $\\nu=5/2$ is not known to be the Pfaffian\n\n**Valid:** $\\nu=5/2$ is an even-denominator plateau, incompatible with a single-component abelian Laughlin/Jain construction, and every serious candidate is non-abelian with Ising-type content.\n\n**Regime:** At least three candidates share the filling and differ by edge structure and chiral central charge:\n\n| Candidate | $c_-$ | Status |\n|---|---|---|\n| Pfaffian (Moore–Read) [12] | $3/2$ | Original 1991 proposal |\n| Anti-Pfaffian | $-1/2$ | Favoured by most finite-size numerics with LL mixing |\n| PH-Pfaffian | $1/2$ | Favoured by measured thermal Hall $\\kappa_{xy}$ |\n\nThese are distinct topological orders — distinct anyon content, distinct edge spectra — not gauge choices. The thermal-Hall/numerics discrepancy is unresolved; disorder-induced Pfaffian/anti-Pfaffian domain averaging is the leading reconciliation and is not established.\n\n**Stripped assumption:** \"$\\nu=5/2$ = Pfaffian\" is a 1991 shorthand [12] that the data have never confirmed. Any experimental claim to braid Ising anyons at $5/2$ inherits this ambiguity before it inherits anything about braiding.\n\n### A seventh, for the headlines\n\nThree claims of decreasing strength are routinely merged: (a) measuring an *abelian* exchange phase, done at $\\nu=1/3$ and $2/5$ by Fabry–Pérot interferometry [16] and anyon collision; (b) *digital simulation* of a non-abelian fusion/braiding algebra in an engineered circuit — real algebra, no thermodynamic phase, no gap protection, no deconfinement; (c) controlled braiding of deconfined non-abelian quasiparticles in a bulk topological phase — not achieved. Proposals such as X-shaped Majorana interferometry [34] and real-space zero-mode braiding in classical/metamaterial platforms [35] are frequently reported as (c). They are, respectively, a proposal and a demonstration in a system with no many-body Hilbert space at all."}, {"id": "landmark-experiments", "title": "The Laboratory Record: From the ν=1/3 Plateau to Direct Braiding", "markdown": "## The Laboratory Record: From the ν=1/3 Plateau to Direct Braiding\n\nThe experimental history of this subject is usually told as a single ascending line: plateau → fractional charge → fractional statistics → non-abelian statistics → topological qubit. That narrative is wrong in its last two steps, and the error is not subtle. What follows sorts the record by *what each measurement actually establishes*, which is rarely what the abstract claims.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eEvidential ladder of anyon experiments\u003c/title\u003e\u003ctext x=\"8\" y=\"24\" fill=\"#e8e6e1\" font-size=\"16\" font-weight=\"bold\"\u003eEvidential ladder: what each class of experiment actually establishes\u003c/text\u003e\u003cline x1=\"200\" y1=\"372\" x2=\"700\" y2=\"372\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"200\" y=\"390\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1980\u003c/text\u003e\u003ctext x=\"304\" y=\"390\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1990\u003c/text\u003e\u003ctext x=\"408\" y=\"390\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2000\u003c/text\u003e\u003ctext x=\"513\" y=\"390\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2010\u003c/text\u003e\u003ctext x=\"617\" y=\"390\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2020\u003c/text\u003e\u003cline x1=\"200\" y1=\"344\" x2=\"700\" y2=\"344\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" opacity=\"0.35\"/\u003e\u003ctext x=\"8\" y=\"349\" fill=\"#7aa2ff\" font-size=\"14\"\u003e1 · Quantized \u0026#963;xy\u003c/text\u003e\u003ccircle cx=\"221\" cy=\"344\" r=\"6\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"233\" y=\"349\" fill=\"#e8e6e1\" font-size=\"14\"\u003eTsui\u0026#8211;St\u0026#246;rmer\u0026#8211;Gossard, \u0026#957;=1/3 plateau\u003c/text\u003e\u003ctext x=\"221\" y=\"364\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1982\u003c/text\u003e\u003cline x1=\"200\" y1=\"292\" x2=\"700\" y2=\"292\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" opacity=\"0.35\"/\u003e\u003ctext x=\"8\" y=\"297\" fill=\"#7aa2ff\" font-size=\"14\"\u003e2 · Fractional charge e*\u003c/text\u003e\u003ccircle cx=\"377\" cy=\"292\" r=\"6\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"389\" y=\"297\" fill=\"#e8e6e1\" font-size=\"14\"\u003eshot noise, e*=e/3 (Saclay + Weizmann)\u003c/text\u003e\u003ctext x=\"377\" y=\"312\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1997\u003c/text\u003e\u003cline x1=\"200\" y1=\"234\" x2=\"700\" y2=\"234\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" opacity=\"0.35\"/\u003e\u003ctext x=\"8\" y=\"239\" fill=\"#7aa2ff\" font-size=\"14\"\u003e3 · Abelian phase \u0026#952;\u003c/text\u003e\u003ccircle cx=\"617\" cy=\"234\" r=\"6\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"648\" cy=\"234\" r=\"6\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"603\" y=\"239\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003einterferometry 2\u0026#960;/3 \u0026#183; collider P\u0026#8776;\u0026#8722;2 \u0026#183; \u0026#957;=2/5\u003c/text\u003e\u003ctext x=\"617\" y=\"254\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2020\u003c/text\u003e\u003ctext x=\"652\" y=\"254\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2023\u003c/text\u003e\u003cline x1=\"200\" y1=\"176\" x2=\"700\" y2=\"176\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" opacity=\"0.35\"/\u003e\u003ctext x=\"8\" y=\"181\" fill=\"#ffb86b\" font-size=\"14\"\u003e4 · Non-abelian, indirect\u003c/text\u003e\u003ccircle cx=\"596\" cy=\"176\" r=\"6\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"679\" cy=\"176\" r=\"6\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\" stroke-dasharray=\"3 2\"/\u003e\u003ctext x=\"582\" y=\"181\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e\u0026#954;xy = 2.5\u0026#954;\u0026#8320; at \u0026#957;=5/2 \u0026#8212; contested\u003c/text\u003e\u003ctext x=\"596\" y=\"196\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2018\u003c/text\u003e\u003ctext x=\"679\" y=\"196\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2026\u003c/text\u003e\u003cline x1=\"200\" y1=\"118\" x2=\"700\" y2=\"118\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" opacity=\"0.35\"/\u003e\u003ctext x=\"8\" y=\"123\" fill=\"#7ee0a3\" font-size=\"14\"\u003e5 · Engineered algebra\u003c/text\u003e\u003ccircle cx=\"648\" cy=\"118\" r=\"6\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"679\" cy=\"118\" r=\"6\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"634\" y=\"123\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003equbit circuits \u0026#183; string-nets \u0026#183; acoustic lattices\u003c/text\u003e\u003ctext x=\"648\" y=\"138\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2023\u003c/text\u003e\u003ctext x=\"683\" y=\"138\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2026\u003c/text\u003e\u003cline x1=\"200\" y1=\"60\" x2=\"700\" y2=\"60\" stroke=\"#ff7a90\" stroke-width=\"0.5\" opacity=\"0.5\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"8\" y=\"65\" fill=\"#ff7a90\" font-size=\"14\"\u003e6 · Deconfined braiding\u003c/text\u003e\u003ccircle cx=\"679\" cy=\"60\" r=\"7\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"3 2\"/\u003e\u003ctext x=\"665\" y=\"65\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eno gapped bulk topological order has been braided\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Rungs 1–3 are established. Rung 4 is a single quantity whose interpretation is now actively disputed. Rung 5 realizes the fusion/braid algebra in engineered systems with no thermodynamic phase. Rung 6 — the claim the field is routinely reported to have achieved — is empty.*\n\n### Rung 1: the plateau (1982)\n\nTsui, Störmer and Gossard saw a quantized Hall plateau and a vanishing $\\rho_{xx}$ at $\\nu=1/3$ in a GaAs/AlGaAs heterostructure at $\\sim0.5$ K and $\\sim20$ T [36]. What this establishes is an incompressible state with $\\sigma_{xy}=\\tfrac{1}{3}e^2/h$ — a *bulk gap at fractional filling*. It establishes neither fractional charge nor fractional statistics; both are inferences from Laughlin's subsequent theory [17]. The rate-limiting technical step was Gossard's MBE growth: at the mobilities available in 1980 the feature is not resolvable at all. The 1998 Nobel motivation names three people; the growth is the fourth contribution and it is uncredited.\n\n### Rung 2: the charge (1997)\n\nFifteen years passed before $e^*$ itself was measured. Weak backscattering at a QPC in the $\\nu=1/3$ edge gives Poissonian noise $S=2e^*I_B$, and both the Saclay group [33] and the Weizmann group (de-Picciotto *et al.*, Nature **389**, 162) extracted $e^*=e/3$ in 1997; $e^*=e/5$ at $\\nu=2/5$ followed. This is solid — but it is a transport observable of a chiral Luttinger edge, not spectroscopy of a bulk quasiparticle. The extracted Fano factor drifts continuously toward 1 at strong backscattering and at low $T$/high transmission, because in that limit one is watching electrons tunnel through vacuum. \"Shot noise measures the quasiparticle charge\" is true only inside the stated window, and this is the single most-stripped set of assumptions in the FQH experimental literature.\n\n### Rung 3: the abelian exchange phase (2020–2023)\n\nTwo independent routes converged in 2020. Nakamura, Liang, Gardner and Manfra built a screening-well Fabry–Pérot device that suppresses bulk–edge Coulomb charging, moving the interferometer out of the Coulomb-dominated regime and into the genuine Aharonov–Bohm regime, where the conductance oscillation shows discrete phase jumps of $2\\pi/3$ each time a localized quasiparticle enters the interference loop [16]. Simultaneously, the Saclay anyon collider (Bartolomei *et al.*, Science **368**, 173) measured negative current cross-correlations with effective Fano factor $P\\approx-2$ at $\\nu=1/3$, where symmetric fermionic beams would give $P=0$. The 2023 extension to $\\nu=2/5$ is the sharpest number in the field: [$e^*=0.17\\pm0.02$, $\\theta=(-0.43\\pm0.05)\\times2\\pi$ against the predicted $e/5$ and $-4\\pi/5$](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.13.041012). Caveat worth keeping: collider-type negative cross-correlations have since been [reported in the integer regime](https://www.nature.com/articles/s41467-024-50820-0), where no anyons exist, so the collider's interpretive burden is heavier than the interferometer's. Rung 3 is nonetheless established — for *abelian* anyons.\n\n### Rung 4: the ν=5/2 thermal Hall problem\n\nThe only quantitative bulk claim for non-abelian order is thermal. The edge carries $K=c_-\\kappa_0$ with $\\kappa_0=\\pi^2k_B^2T/3h$, and a Majorana branch contributes $c_-=\\tfrac12$. Including the two filled lower Landau levels, the candidates predict $K/\\kappa_0 = 7/2$ (Pfaffian), $3/2$ (anti-Pfaffian), $5/2$ (PH-Pfaffian) [12]. The [Weizmann measurement](https://www.nature.com/articles/s41586-018-0184-1) gave $2.5\\kappa_0$ — a half-integer, hence \"non-abelian\", but the *wrong* half-integer: exact diagonalization and DMRG with Landau-level mixing favour the anti-Pfaffian. Two escapes exist, and both are live. Either the anti-Pfaffian's counterpropagating Majorana fails to thermally equilibrate over the sample, which reproduces $2.5$ from an anti-Pfaffian bulk; or the PH-Pfaffian is real and the numerics are missing something. The interpretation weakened further in 2026, when a bilayer-graphene device built from purely *abelian* particle-like and hole-like integer states was shown to produce a robust half-integer two-terminal plateau from [equilibration dynamics alone](https://www.nature.com/articles/s41467-026-69659-8). Half-integer $K$ is therefore not a topological fingerprint. Independently, Fabry–Pérot interferometry on even-denominator states in bilayer graphene finds an oscillation period of $\\Delta\\Phi=2\\Phi_0$ rather than the $4\\Phi_0$ expected from non-abelian even–odd effects, i.e. [no non-abelian signature](https://arxiv.org/abs/2412.19886). Rung 4 is a genuinely open experimental question, not a confirmed result.\n\n### Rung 5: the algebra, engineered\n\nSince 2023, the braid and fusion algebra of Ising and Fibonacci anyons has been realized on superconducting and trapped-ion processors — [Google's graph-vertex braiding](https://www.nature.com/articles/s41586-023-05954-4), the Quantinuum trapped-ion counterpart, and [Fibonacci string-net braiding](https://www.nature.com/articles/s41567-024-02529-6). An acoustic Kekulé lattice has now tracked Majorana-*like* zero modes through a real-space exchange [35]. These are correct realizations of a *representation of $B_N$* in an engineered Hilbert space (or, for the acoustic case, in a classical wave field). What they are not: thermodynamic phases. There is no gap protecting the encoded state, no deconfined quasiparticle, and the circuit's errors are not topologically suppressed — the topological protection is precisely the thing the simulation does not have.\n\n### Rung 6: empty\n\nControlled braiding of deconfined non-abelian quasiparticles in a gapped bulk phase has not been done. The Majorana-nanowire program [30][31][25][32] is a different object entirely — a defect-bound zero mode with no 2+1D configuration space — and its own record includes a retracted *Science* claim of chiral Majorana modes [37] and a long list of trivial-Andreev-mimic corrections. Proposals such as X-shaped Majorana interferometry [34] are designs, not detections. The fractional quantum anomalous Hall states in rhombohedral graphene and twisted MoTe₂ [38] open a $B=0$ arena where interferometry becomes geometrically easier; no braiding measurement exists there yet. The honest summary: abelian anyons are measured, non-abelian anyons are simulated, and the topological qubit [28][27] remains a program."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier arguing with the standard narrative, so it is only fair that I state where I would put my own name.\n\n### (a) What I would defend\n\nThat fractional statistics is a *kinematic* consequence of two-dimensionality, not a dynamical property of any particular fluid. Given the correct configuration space $Q_N = (\\mathbb{R}^{2N}\\setminus\\Delta)/S_N$, the one-dimensional unitary representations of $\\pi_1(Q_N)=B_N$ are labelled by a single angle $\\theta\\in[0,2\\pi)$, and nothing in the axioms of quantum mechanics selects $\\theta\\in\\{0,\\pi\\}$. That argument is complete, it was made in 1977 in Il Nuovo Cimento B [2], and it is prior to and independent of flux attachment. Laidlaw and DeWitt-Morette's complementary result — that in $d\\geq 3$, $\\pi_1$ collapses to $S_N$ and the only options are Bose/Fermi [1] — is what makes the 2D statement content rather than an artefact of formalism. I would defend equally that fractional *charge* has nothing to do with any of this: Jackiw–Rebbi [11] is a 1+1D index-theorem statement about a soliton sector, and it survives untouched in a world with no braid group at all. Anyone who derives $e/3$ from $\\theta=\\pi/3$ has confused a coincidence of abelian Chern–Simons theory for a theorem. And I would defend the credit correction as *documented*, not folkloric: the Physics Today letter of August 1990 signed by Biedenharn, Lieb, Simon and Wilczek [6] settles the priority question; the pedagogical literature simply never read it.\n\n### (b) What is shakier than the literature admits\n\nThree specific assumptions, each load-bearing and each usually silent.\n\nFirst, **monodromy $=$ Berry phase**. Essentially every quoted \"computation of anyonic statistics\" from trial wavefunctions is a Berry-phase calculation in the Arovas–Schrieffer–Wilczek style [14], which is basis- and connection-dependent. It equals the invariant monodromy only if the quasihole states are orthonormal and holomorphic in the quasiparticle coordinates so that the Berry connection vanishes up to the area term. For Laughlin this was checked; for general trial states it is asserted. The plasma-analogy screening argument that underwrites the check is itself an assumption about a classical 2D Coulomb gas being in its screening phase — true, but not proven, and it fails outside a finite range of $m$.\n\nSecond, **the identification of $\\nu=5/2$ with the Pfaffian**. Pfaffian, anti-Pfaffian and PH-Pfaffian have $c_-=3/2,\\,-1/2,\\,+1/2$ respectively; thermal-transport data favour one, finite-size numerics favour another, and the field's habit of writing \"the Moore–Read state at $5/2$\" [12] is a 35-year-old shorthand that the experiments have not earned. Disorder-averaged domain models patch the discrepancy at the cost of unfalsifiability.\n\nThird, **charge extracted from shot noise**. A Fano factor of $1/3$ is a weak-backscattering, finite-temperature transport observable of a Luttinger edge, not a spectroscopy of a bulk quasiparticle [13]. The same junction yields $F=1$ in the strong-backscattering limit. The number is real; the interpretation is regime-bound and routinely quoted stripped of its regime.\n\nI will add a fourth in passing: the Majorana-nanowire literature and the Ising-anyon literature share a fusion rule and nothing else. A wire endpoint is an extrinsic defect, not a deconfined excitation of a topological order, and no amount of T-junction protocol turns $\\pi_1$ of a 1D configuration space into $B_N$.\n\n### (c) The three I would actually work on, ranked\n\n1. **A regime-clean falsification test for $\\nu=5/2$** — thermal Hall plus interferometric phase slips on the *same* device, because the current disagreement is between measurements made on different samples with different edge equilibration, and that is a fixable methodological failure rather than a deep one.\n2. **When does Berry holonomy compute monodromy?** — a general criterion, not a case-by-case check, because the entire non-abelian trial-wavefunction literature currently rests on an unstated sufficient condition.\n3. **Deconfined non-abelian braiding versus circuit simulation** — a sharp, publishable operational criterion separating gap-protected braiding from an engineered unitary on a processor, because without one the field cannot tell claim (b) from claim (c) and the headlines already cannot.\n\n**Reading path:**\n\n1. Leinaas \u0026 Myrheim (1977) [2] — read the original before any review; the configuration-space argument is cleaner than every textbook restatement of it.\n2. Laidlaw \u0026 DeWitt-Morette [1] — the $d\\ge 3$ no-go that gives the 2D result its teeth, and the reason parastatistics is not a rival.\n3. Jackiw \u0026 Rebbi (1976) [11] — to inoculate yourself permanently against conflating charge fractionalization with statistics.\n4. Arovas, Schrieffer \u0026 Wilczek [14] — the calculation everyone cites; read it watching for exactly which assumptions make the Berry phase topological.\n5. Kitaev, \"Fault-tolerant quantum computation by anyons\" [33] — where the subject stops being about one fluid and becomes a statement about lattice models, error correction, and categories."}], "references": [{"n": 1, "title": "Feynman Functional Integrals for Systems of Indistinguishable Particles", "authors": ["Michael G. G. Laidlaw", "Cécile M. DeWitt"], "year": 1971, "venue": "Physical Review D 3, 1375", "url": "https://link.aps.org/doi/10.1103/PhysRevD.3.1375", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "On the theory of identical particles", "authors": ["Jon Magne Leinaas", "Jan Myrheim"], "year": 1977, "venue": "Il Nuovo Cimento B 37, 1–23", "url": "https://link.springer.com/article/10.1007/BF02727953", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "The story behind the mysterious anyon particles", "authors": ["Titan / University of Oslo (interview with Jon Magne Leinaas)"], <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

<script>

  var hasTL=D.timeline&&D.timeline.length, hasNG=D.neglected&&D.neglected.length, hasCF=D.conflations&&D.conflations.length;

      '<div class="tslider" id="tslider">'+

  }
  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+

        var vy=[r.venue,r.year].filter(Boolean).join(' · ');

      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');

    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
