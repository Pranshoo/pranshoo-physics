vations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins: Laidlaw–DeWitt-Morette, Leinaas–Myrheim, and the Ancestry of the Anyon Origins: Laidlaw–DeWitt-Morette, Leinaas–Myrheim, and the Ancestry of the Anyon The standard sentence — \"anyons were proposed by Wilczek in 1982\" — is wrong in a specific, documentable way, and the correction is not a matter of taste. Four distinct contributions are involved: a framework (1971), a prediction (1977), an independent derivation (1980–81), and a model plus a name (1982). The literature routinely collapses all four onto the last. 1971: the framework, and the restriction that was dropped Laidlaw and DeWitt-Morette asked how a Feynman path integral is to be defined for N indistinguishable particles . The configuration space is not X^N but the quotient with \\Delta the coincidence set removed. This space is multiply connected, so paths from q 0 to q 1 fall into homotopy classes labelled by \\pi 1(Q N), and the total propagator is a weighted sum over classes, where consistency under composition of paths forces \\chi to be a one-dimensional unitary representation — a character — of \\pi 1. That is the whole logical machine: statistics is a representation of the fundamental group of the identical-particle configuration space. Nothing in the argument mentions dimensionality. Their application, however, did. For X=\\mathbb{R}^3 one has \\pi 1(Q N)=S N, whose one-dimensional representations are exactly two — trivial and alternating — so bosons and fermions exhaust the possibilities and parastatistics is excluded from this route. Excluding parastatistics was the paper's stated purpose, and it is the one conclusion in it that is not dimension-independent. The citation record then performed a clean inversion: the 1971 paper is cited, when cited at all, as the proof that only Bose and Fermi statistics exist, with the \\mathbb{R}^3 hypothesis silently dropped. The framework — general, and the source of everything downstream — was absorbed as a no-go theorem. Laidlaw's UNC thesis under DeWitt-Morette contains the same material; DeWitt-Morette's role as the architect of the homotopy-class path integral is largely invisible in condensed-matter pedagogy. 1977: the prediction Leinaas and Myrheim — submitted 1976, published in Il Nuovo Cimento B on 11 January 1977 — ran the same machine in d=2 and got a different answer. In two dimensions the coincidence set has codimension 2; removing it leaves loops that cannot be contracted, and one finds Artin's braid group, presented by generators \\sigma 1,\\dots,\\sigma {N-1} subject to and crucially without the relation \\sigma i^2=1 that would make it S N. B N is infinite; its abelianization is \\mathbb{Z}; its one-dimensional unitary representations are therefore \\sigma i \\mapsto e^{i\\theta} for arbitrary \\theta\\in[0,2\\pi). A continuum of statistics, with Bose (\\theta=0) and Fermi (\\theta=\\pi) as two isolated points in it. Their treatment was concrete rather than formal — a two-particle problem in the relative coordinate with the origin excised, boundary conditions on the relative angle, and the resulting shifted angular-momentum spectrum. They also worked out d=1, where the configuration space is disconnected and the \"statistics\" question dissolves into a boundary-condition problem — a point still worth quoting whenever someone claims fractional statistics in a wire. This is the prediction of anyons, five years before the word. It went nearly uncited for a decade. Leinaas's own account is unsentimental: the paper attracted so few references that he eventually wrote to Wilczek to tell him the work existed . 1980–81: the independent derivation Goldin, Menikoff and Sharp arrived at the same conclusion by a route with no path integral in it . Their object was the unitary representation theory of nonrelativistic local current algebras — equivalently of the group of compactly supported diffeomorphisms of the underlying manifold — where an N-particle sector is built from a measure on configuration space and a representation of its fundamental group. In a non-simply-connected space the inequivalent representations are classified by exactly the same \\pi 1 characters, and they identified the physical mechanism as an Aharonov–Bohm phase. Two derivations that share no technical apparatus — homotopy classes of Feynman paths on one side, induced representations of diffeomorphism groups on the other — landing on the same \\theta-continuum is strong evidence that the result is kinematical, not an artifact of a formalism. Condensed-matter reviews almost never cite it. 1982: the model and the name Wilczek's contribution was neither the framework nor the prediction. It was a realization : bind charge q to flux \\Phi in 2+1 dimensions, and the composite acquires, on exchange, the Aharonov–Bohm phase so that spin and statistics are tuned continuously by a single parameter, with the spin–statistics connection preserved in interpolated form. The companion PRL 48, 1144 supplied the angular-momentum bookkeeping. And he named the thing: anyon . That coinage is not a trivial contribution — it made the concept portable, and the flux-tube picture is what let field theorists reach for Chern–Simons terms within a few years. But it is a model of an already-predicted phenomenon, and the 1982 papers cite neither nor . The correction is documented, not folkloric This matters: nothing here is reconstructed from grievance. When a 1989 Physics Today piece credited anyons to Wilczek alone, a joint letter titled \"The Ancestry of the 'Anyon'\" appeared in the August 1990 issue, signed by Biedenharn, Lieb, Simon — and Wilczek himself — restoring Leinaas–Myrheim and Goldin–Menikoff–Sharp . Wilczek's 1990 reprint volume opens with an editorial pre-history that says the same thing . Myrheim's Les Houches lectures give the braid-group derivation with the original chronology intact . Goldin has since written the episode up explicitly as historiography , and Leinaas has told his side in interview . So the record was corrected in print, by the principals, within eight years of the naming — and the pedagogical literature never absorbed it. What propagates instead is the compressed folk version in which one 1982 paper does all four jobs. The clean division, to be used for the rest of this dossier: Contribution Who Year Ref --- --- --- --- Homotopy-class path integral; statistics = rep of \\pi 1(Q N) Laidlaw, DeWitt-Morette 1971 \\pi 1(Q N)=B N in d=2; the \\theta-continuum — the prediction Leinaas, Myrheim 1977 Independent current-algebra / diffeomorphism-group derivation Goldin, Menikoff, Sharp 1980–81 Charge–flux composite model; \\theta=q\\Phi/2\\hbar c; the name Wilczek 1982 General B N formalism, singular gauge, N-anyon Hilbert space Wu 1984 One caution before the next section. Everything above concerns statistics — the topology of worldlines. It says nothing whatever about fractional charge , which has a separate ancestry, a separate mechanism, and a separate set of misattributions. That the two are locked together in the Laughlin state is a fact about abelian Chern–Simons theory, not a theorem; the next section takes fractional charge apart on its own terms, in a setting where the braid group is trivial. Fractional Charge Without Fractional Statistics: Jackiw–Rebbi, SSH, and Spectral Flow Fractional Charge Without Fractional Statistics: Jackiw–Rebbi, SSH, and Spectral Flow The single most durable confusion in this subject is the assumption that fractional charge and fractional statistics are two faces of one phenomenon. They are not. Charge fractionalization is a statement about the spectrum of a local operator in the presence of a topological defect; braid statistics is a statement about \\pi 1 of a configuration space. The first mechanism was established in 1+1 dimensions , where the braid group is trivial and anyons cannot exist by construction. That the two are locked together in the Laughlin state is a special fact about abelian Chern–Simons theory, not a theorem. The Jackiw–Rebbi zero mode Take a Dirac fermion in 1+1D coupled to a static background scalar, with a kink profile \\phi(-\\infty)=-m, \\phi(+\\infty)=+m. Charge conjugation C = \\sigma 1 K anticommutes with H, so the spectrum is symmetric about E=0. The kink binds exactly one normalizable solution at E=0, whose existence is protected by the index theorem: the number of zero modes minus the number of anti-zero modes equals the winding of \\phi at infinity, and no local deformation of the profile that preserves the asymptotics can remove it . The fractionalization follows from counting, not from dynamics. Define the charge with the symmetric (point-split) operator ordering, which is odd under C. The E\\neq0 states pair up (E,-E) and contribute zero net charge; the single zero mode is its own conjugate partner and contributes \\pm\\tfrac12 depending on whether it is filled or empty. The two states {\\pm}\\rangle of the soliton therefore carry Jackiw and Rebbi phrased this as the vacuum in the soliton sector being doubly degenerate with half-integer fermion number. The criterion: sharp eigenvalue, not fractional average This is where most secondary accounts go soft, and it is the criterion that separates real fractionalization from arithmetic. A fractional expectation value is cheap: any state that is a superposition of integer-charge states with unequal weights gives \\langle Q\\rangle \\notin \\mathbb{Z}, and a wavepacket smeared over two sites carries \"half an electron\" in each half of the region in exactly this uninteresting sense. Genuine fractionalization requires that Q be a sharp quantum number — that the soliton state be an eigenstate of the charge operator with fractional eigenvalue, so that repeated measurement always returns \\pm 1/2 and never 0 or 1. The operational statement is about the variance. Define the charge in a region of size L centred on the soliton, Q L = \\int f L(x)\\,\\rho(x)\\,dx with a smooth window f L. Then as L exceeds the correlation length, with the variance falling off with the window's smoothness (exponentially for a soft window on a gapped system, up to boundary contributions from the window edges). Kivelson and Schrieffer made this the operational definition of fractionalization (verify); Rajaraman and Bell computed the fluctuations explicitly for the kink and found them controlled by the gap, not by the fraction (verify). The contrast case is instructive: a two-level system with \\langle Q\\rangle = 1/2 has variance 1/4 — order unity, never decaying — and is not fractionalized. Vanishing variance in the thermodynamic limit is the whole content of the claim. Any paper that reports a fractional mean without reporting the variance has reported nothing topological. Polyacetylene: the mechanism in a real material Su, Schrieffer and Heeger (Phys. Rev. Lett. 42, 1698 (1979); Phys. Rev. B 22, 2099 (1980)) (verify) wrote down the dimerized chain whose Peierls ground state is twofold degenerate (A and B dimerization patterns). A domain wall between them is precisely the Jackiw–Rebbi kink in the continuum limit: linearizing about \\pm k F reproduces the 1+1D Dirac Hamiltonian with \\phi the dimerization order parameter. The wall binds a mid-gap state at E=0, and the counting gives a soliton with charge \\pm e and spin 0, or charge 0 and spin 1/2 — spin–charge separation, the reversed quantum numbers of any electronic excitation. Note the shift relative to the Dirac case: spin degeneracy doubles the zero mode, so the fractional-1/2 charge of the single-flavour theory becomes an integer charge with anomalous spin. To see charge e/2 in a polyacetylene-like chain one must break the spin degeneracy or work with spinless fermions — a point routinely elided when SSH is presented as \"the observation of charge e/2\". What the trans-polyacetylene experiments actually established is the reversed spin–charge assignment (neutral spin-1/2 solitons visible in ESR alongside spinless charged carriers), which is the same index theorem doing the same work. Goldstone–Wilczek: irrational charge from adiabatic spectral flow The index-theorem argument gives halves because C symmetry pins the mode to E=0. Break that symmetry and the induced charge becomes continuously tunable. Goldstone and Wilczek (Phys. Rev. Lett. 47, 986 (1981)) (verify) coupled the 1+1D fermion to a two-component background, \\phi 1 + i\\phi 2 = \\rho\\, e^{i\\theta(x)}, integrated out the fermion, and obtained the induced current valid to leading order in gradients and for \\rho large compared to the scale of variation of \\theta. The induced charge in a region is then with \\Delta\\theta the change in the chiral angle across the defect. A soliton interpolating by \\Delta\\theta = \\pi recovers Q = 1/2; \\Delta\\theta = 2\\pi/3 gives Q = 1/3; a generic \\Delta\\theta gives an irrational charge, which no index theorem can produce and no degeneracy counting anticipates. The interpretation is spectral flow: adiabatically advancing \\theta by 2\\pi pumps exactly one fermion across the gap from the negative-energy sea to the positive branch — this is Thouless pumping, and the same formula reappears as the polarization of a band insulator, P = e\\,\\gamma {\\rm Zak}/2\\pi. Two caveats that the literature strips silently. First, irrational induced charge is not a sharp eigenvalue in the same sense as the half-integer case: for generic \\Delta\\theta the charge variance does not vanish, because there is no symmetry protecting a degeneracy. The state is a superposition, and Q = \\Delta\\theta/2\\pi is a well-defined mean with residual fluctuation. Sharpness is restored only when a symmetry (charge conjugation, or a \\mathbb{Z} n discrete chiral symmetry making \\Delta\\theta = 2\\pi k/n) forces exact degeneracy. Second, the formula is the leading term of a derivative expansion; it is exact only in the adiabatic limit, and the higher-gradient corrections are not universal. The logical separation Everything above is 1+1 dimensional. The configuration space of N identical particles on a line is not multiply connected in the way \\mathbb{R}^2 is — \\pi 1 gives no braid group, exchange is not even a continuous operation without passing particles through each other, and the phrase \"statistics of the soliton\" has no topological content. Yet the charge is fractional, sharply so, with vanishing variance and index-theorem protection. The converse holds too: fractional statistics does not require fractional charge. The neutral fermion \\psi of the Moore–Read state carries integer (zero) charge and nontrivial braiding ; \\mathbb{Z} 2 visons in the toric code are electrically neutral and braid with the electric charge to -1 . Two logically independent phenomena, joined in the Laughlin state only because flux attachment ties \\theta = \\pi\\nu to Q = \\nu e through the same Chern–Simons coefficient — a feature of one class of effective theory, not a law of nature. The Pedagogical Core I — Configuration-Space Topology and the Braid Group The Pedagogical Core I — Configuration-Space Topology and the Braid Group Everything in this subject follows from one refusal: do not put the symmetrization postulate in by hand. Ask instead what quantum mechanics on the correct configuration space of N indistinguishable particles permits. The answer is dimension-dependent, and the dimension enters through \\pi 1. The space For N indistinguishable particles on a manifold M, the physical configuration space is Two deletions matter and are logically independent. Quotienting by S N encodes indistinguishability: a permuted list is not a new configuration but the same point. Removing the diagonal \\Delta encodes hard-core exclusion; without it the quotient is an orbifold with singular strata and the quotient map is not a covering. Leinaas and Myrheim are explicit that this excision is a physical assumption, not a technicality — it is what makes Q N a manifold and what makes the topology nontrivial. Given a multiply-connected Q N, the Feynman propagator does not have a unique definition. Paths from q i to q f fall into homotopy classes labelled by elements of \\pi 1(Q N), and the sum over paths must be assembled class by class: Associativity of propagation (composing two intervals must reproduce the third) forces the weights \\chi to form a one-dimensional unitary representation of \\pi 1(Q N); for multi-component wavefunctions the weights are unitary matrices and \\chi becomes a representation of dimension 1. This is the Laidlaw–DeWitt-Morette theorem , and it is worth being precise about what it does and does not say. It says: quantizations are classified by unitary representations of \\pi 1 . It then specializes to M = \\mathbb{R}^3, finds \\pi 1 = S N, notes that the one-dimensional characters of S N are exhausted by the trivial and alternating ones, and concludes Bose or Fermi — no parastatistics. The \\mathbb{R}^3 restriction is stated in the paper and stripped in most citations. The theorem is general; the conclusion is not. S N versus B N Why does \\pi 1 care about d? Consider N=2 and pass to the relative coordinate \\mathbf{r} = \\mathbf{x} 1 - \\mathbf{x} 2, which lives in (\\mathbb{R}^d - \\{0\\})/\\mathbb{Z} 2, i.e. real projective space \\mathbb{RP}^{d-1} up to the radial factor. For d \\ge 3, \\mathbb{RP}^{d-1} has \\pi 1 = \\mathbb{Z} 2: an exchange path is a half-loop, and doing it twice gives a closed loop that can be lifted off itself in the third dimension and contracted. Hence \\sigma^2 = 1 and there are exactly two options, \\pm 1. For d = 2 the relative space retracts to a circle, \\pi 1(\\mathbb{RP}^1) = \\pi 1(S^1) = \\mathbb{Z}: winding is an integer that no continuous deformation can undo, because the excluded point \\mathbf{r}=0 blocks the contraction and there is no extra direction to escape into. The exchange has infinite order. For general N in d=2 this generalizes to Artin's braid group: with \\sigma i^2 \\neq 1 — that single omitted relation is the entire subject. S N is the quotient B N/\\langle \\sigma i^2 \\rangle. B N is infinite for N \\ge 2, torsion-free, and its elements are genuine worldline braids in 2+1 dimensions: strands that pass over and under, not merely permute. Figure: the same double exchange in d\\ge3 and d=2. On the left the doubled braid can be undone by lifting one strand out of the page, so \\sigma^2=1 and only \\pm1 survives; on the right the strands are confined to the plane, the double exchange is a nontrivial winding, and \\sigma acquires an arbitrary phase (abelian) or matrix (non-abelian). The abelian sector One-dimensional unitary representations of B N are trivially classified. The braid relation \\sigma i\\sigma {i+1}\\sigma i = \\sigma {i+1}\\sigma i\\sigma {i+1} forces all generators to the same scalar e^{i\\theta i} = e^{i\\theta} when N\\ge3 (the relation gives \\theta i = \\theta {i+1} directly); the far-commutation relations are then automatic. Hence a continuum interpolating between bosons (\\theta=0) and fermions (\\theta=\\pi). That is the anyon prediction, and it is in Leinaas–Myrheim in 1977, five years before the word; Goldin, Menikoff and Sharp reached the same continuum from unitary representations of local current algebras, with no path integral anywhere . Wu's 1984 papers gave the explicit N-body braid-group formulation now used as standard . Two equivalent descriptions of the same physics, and the dictionary between them: Multivalued gauge. Keep the Hamiltonian free and let \\psi be a section of a flat line bundle over Q N with holonomy e^{i\\theta} per elementary braid — equivalently, a multivalued function on M^N-\\Delta obeying \\psi(\\dots,z j,\\dots,z i,\\dots) = e^{i\\theta}\\psi(\\dots,z i,\\dots,z j,\\dots) along a specified exchange path. Singular gauge. Strip the multivaluedness with \\psi \\to \\Big(\\prod {i\u003cj} \\frac{z i-z j}{ z i-z j }\\Big)^{-\\theta/\\pi}\\psi, making the wavefunction single-valued and bosonic at the cost of a statistical vector potential a pure gauge everywhere except at the punctures, where each particle carries a flux tube \\Phi = (\\theta/\\pi)\\Phi 0. This is flux attachment, and it is why the Chern–Simons construction of Wilczek's charge–flux composite and the configuration-space argument are the same statement in two coordinate systems , not two independent discoveries. The topology is primary; the gauge field is a representation of it. The Berry-phase computation of Arovas–Schrieffer–Wilczek for Laughlin quasiholes lands in the multivalued gauge and must be read with that in mind. The open door Nothing in the classification restricts \\rho to dimension one. If the N-quasiparticle Hilbert space at fixed positions is g-fold degenerate with g 1, adiabatic braiding realizes a unitary \\rho:B N \\to U(g), and the images of \\sigma i generically do not commute. This is precisely the possibility Wu's analysis leaves standing when he notes that e^{i\\theta} exhausts only the one-dimensional representations . It was walked through from the axiomatic side by Fredenhagen, Rehren and Schroer, whose superselection sectors with non-integer statistical dimension are non-abelian anyons in all but name , and from the wavefunction side by Moore and Read, whose conformal blocks supply the degenerate multiplet explicitly . The degeneracy must be topological — locally indistinguishable, exponentially split at most — or the \"representation\" is an artifact of fine tuning. Chirality and framing: where the factors of two come from Three separate conventions are routinely collapsed, and every \\theta-vs-2\\theta discrepancy in the literature traces to one of them. Chirality. \\sigma i^{-1} \\neq \\sigma i. A counterclockwise exchange gives e^{i\\theta}, clockwise e^{-i\\theta}. An anyonic theory with \\theta \\notin \\{0,\\pi\\} therefore breaks P and T; this is not an extra assumption but a corollary of B N's non-involutivity. Exchange versus monodromy. Half-exchange (one \\sigma) gives \\theta; full monodromy (one particle taken around another, \\sigma^2) gives 2\\theta. Authors who define \"the statistical phase\" as the monodromy report 2\\pi/m where the exchange convention reports \\pi/m at \\nu=1/m. Both are correct; only one is stated. The Nakamura interferometry result reads a monodromy — the phase jump as one quasiparticle is added inside the loop — and quotes 2\\pi/3 accordingly . Framing/spin. \\theta and \\theta+2\\pi label the same one-dimensional representation of B N but not the same topological theory: the spin–statistics relation s = \\theta/2\\pi ties the exchange phase to a self-rotation, and untangling a self-twist requires a framing of the worldline (a ribbon, not a line). The topological spin \\theta a = e^{2\\pi i s a} is the framing-dependent object; the braiding \\sigma is not fully specified until the ribbon convention is fixed. Wilczek's \\theta = q\\Phi/2\\hbar c with spin \\theta/2\\pi is a statement in a definite framing, and a nonzero fraction of the disagreements in the older literature are two authors using opposite ribbon twists rather than disputing physics . The Pedagogical Core II — Laughlin Quasiholes, the Arovas–Schrieffer–Wilczek Phase, and Chern–Simons Flux Attachment The Pedagogical Core II — Laughlin Quasiholes, the Arovas–Schrieffer–Wilczek Phase, and Chern–Simons Flux Attachment The trial state and what it is a solution to Work in the symmetric gauge, \\mathbf{A} = \\tfrac{B}{2}(-y,x), magnetic length \\ell = \\sqrt{\\hbar c/eB}, complex coordinate z = x - iy. The lowest-Landau-level (LLL) constraint is exhausted by holomorphy: every LLL state is f(\\{z i\\})\\,e^{-\\sum i z i ^2/4\\ell^2} with f entire. Laughlin's ansatz fixes f by three requirements — analyticity, total angular momentum M = mN(N-1)/2, and odd relative exponent for antisymmetry: with filling \\nu = 1/m read off from the maximal single-particle angular momentum m(N-1), i.e. N \\phi = m(N-1)+1 flux quanta. This is a variational wavefunction, not a derived ground state — though it is the exact zero-energy ground state of the Haldane pseudopotential Hamiltonian truncated at V 1 (and V 1, V 3 for m=5), which is the modern sense in which \"Laughlin state\" is a sharply defined phase label rather than an ansatz. The plasma analogy and the assumption inside it Write \\Psi m ^2 = e^{-\\beta U} with \\beta = 2/m and This is the classical statistical mechanics of a 2D one-component plasma: particles of charge q=m interacting logarithmically, in a uniform neutralizing background of density \\rho b = 1/(2\\pi m \\ell^2). The plasma is in its screening phase for \\Gamma = 2m \\lesssim 140, hence charge-neutral and locally incompressible; the electron density is pinned at \\rho = \\nu/(2\\pi\\ell^2). The screening assumption is not decorative — it is what makes every subsequent statement true. Exponential screening is what gives the quasihole a sharply localized , quantized deficit charge; it is also what makes the Berry-connection integrals below converge to their topological values with corrections suppressed as e^{- \\eta 1-\\eta 2 /\\lambda D}. If the plasma froze (Wigner crystallization at large \\Gamma), the norm \\langle\\Psi\\mid\\Psi\\rangle would no longer be a screening-phase partition function and the charge and statistics arguments would both fail. Textbook presentations quote the results and drop the hypothesis. Quasihole by adiabatic flux insertion Pierce the fluid at \\eta with an infinitely thin solenoid and adiabatically thread one flux quantum \\Phi 0 = hc/e. By Faraday, the azimuthal EMF drives a radial Hall current j r = \\sigma {xy} E \\theta, transporting out of the puncture. A large gauge transformation removes the solenoid, and the final state is a LLL state of the original Hamiltonian: The Jastrow zero repels exactly 1/m of an electron. In plasma language, \\Psi^{\\rm qh} ^2 adds an impurity of charge 1 to a plasma of charge-m particles; screening produces a compensating cloud of 1/m particle, i.e. a deficit e/m. Laughlin's paper states the charge and — as the credit audit records — says nothing at all about statistics. The Arovas–Schrieffer–Wilczek Berry phase Now move the quasihole slowly around a closed loop and compute the Berry phase . With normalized \\Psi(\\eta)\\rangle, The key step is that \\ln\\langle\\Psi^{\\rm qh}\\mid\\Psi^{\\rm qh}\\rangle is the free energy of the plasma with one impurity, and screening makes it \\eta-independent up to the boundary. Using \\partial \\eta \\ln \\Psi^{\\rm qh} = -\\sum i (z i-\\eta)^{-1} and the plasma sum rule \\langle \\sum i \\delta^2(z-z i)\\rangle = \\rho, which is precisely the Aharonov–Bohm phase (e^ /\\hbar c)\\oint \\mathbf{A}\\cdot d\\boldsymbol\\ell = 2\\pi (e^ /e)\\,(\\Phi {\\rm enc}/\\Phi 0) for a charge e^ = e/m enclosing flux \\Phi {\\rm enc} = BA. This is the charge piece and contains no statistics. Put a second quasihole inside the loop. The enclosed charge is reduced by e/m, so the mean density inside the contour drops by exactly one 1/m-deficit, and That is the monodromy — a full circuit, one quasihole around another. A single exchange is half of it: so m=3 gives \\theta = \\pi/3, one third of the fermionic \\pi. Two caveats that the derivation makes visible and the pedagogy suppresses. First, the split into \"AB piece\" and \"statistical piece\" is definitional : the total measured phase is \\gamma 2, and calling 2\\pi/m \"statistics\" presumes you subtract a reference AB phase computed with the same enclosed area. Second, this is a Berry-phase calculation, and identifying it with the topological monodromy requires the Berry connection in the relative coordinate to vanish — which holds here because the \\eta-dependence is holomorphic and the norm is \\eta-independent by screening. It is a theorem under conditions, not a definition. Figure: The ASW computation as a subtraction. Transporting a atics of non-abelian braiding is secure in both derivations; its material realization is not. What Superseded What: Modular Tensor Categories, the Toric Code, and Topological Quantum Computation What Superseded What: Modular Tensor Categories, the Toric Code, and Topological Quantum Computation Everything up to this point in the dossier was model-specific. Laughlin's \\prod(z i-z j)^m is an ansatz for a particular Hamiltonian in a particular Landau level; the Arovas–Schrieffer–Wilczek Berry phase is a calculation performed on that ansatz; Chern–Simons flux attachment is an effective field theory with a coupling constant fixed by hand to reproduce it. None of these tells you what an anyon is independent of the medium carrying it. The modern answer — that the universal data of a 2+1D gapped phase is a unitary modular tensor category (MTC), and that everything else is representation-dependent scaffolding — is what superseded them, and it is worth being precise about what \"superseded\" means here: the old formulations were not falsified, they were shown to be presentations of a finite algebraic object. The axiomatic object Fix a finite label set \\{a,b,c,\\dots\\} of superselection sectors (topological charges), with a distinguished vacuum 1 and an involution a\\mapsto\\bar a. The data are: Fusion. Nonnegative integers N {ab}^{c} with a\\times b=\\sum c N {ab}^{c}\\,c, associative and commutative, with N {a\\bar a}^{1}=1. The multiplicity spaces V {ab}^{c} have \\dim V {ab}^{c}=N {ab}^{c}; the n-quasiparticle Hilbert space at fixed total charge is \\bigoplus of fusion-tree bases, and its dimension grows as d a^{\\,n} where d a is the Perron–Frobenius eigenvalue of the matrix (N a) {b}^{\\,c}. Abelian anyons are exactly those with d a=1 — one fusion channel, hence a phase and nothing more. This is the precise sense in which abelian statistics is a degenerate case rather than a different phenomenon. Associativity and braiding. The two ways of decomposing a\\times b\\time  (a) mutually orthonormal to exponential accuracy in the quasihole separation, and (b) holomorphic in the quasihole coordinates, so that the Berry connection reduces to an area (Aharonov–Bohm) term with no extra non-abelian piece. Read established these as conditions to be checked , verified them for the relevant model states via plasma screening, and showed that screening failure invalidates the identification. Stripped assumption: \"we computed the Berry phase, therefore we computed the statistics.\" Arovas–Schrieffer–Wilczek is legitimate because the plasma screens; the same manipulation applied to a non-screening ansatz, or to states with a nonzero overlap matrix derivative, is not. The check is a plasma/screening argument, not a formality. 5. Fano factor 1/3 is edge transport, not bulk spectroscopy Valid: Shot noise at a weak constriction on a \\nu=1/3 edge gives S = 2e^ I B with e^ = e/3 . Regime: Weak backscattering, so the tunnelling object is a Laughlin quasiparticle between two edges; temperature above the crossover k BT \\gtrsim eV {\\rm cross} set by the constriction's relevant-operator scale; a clean, fully equilibrated \\nu=1/3 edge. In the strong -backscattering limit the same junction is two disconnected fractional liquids and electrons tunnel through vacuum: Fano factor 1. Between the limits, the extracted e^ drifts continuously between e/3 and e; nothing discrete is being counted. Stripped assumption: the Luttinger-liquid edge theory. e^ from noise is a property of a tunnelling operator's scaling dimension and charge in a chiral Luttinger liquid; the bulk quasiparticle charge is inferred through that theory, not measured against it. This is a strong and independently corroborated inference — not a direct spectroscopy. 6. \\nu=5/2 is not known to be the Pfaffian Valid: \\nu=5/2 is an even-denominator plateau, incompatible with a single-component abelian Laughlin/Jain construction, and every serious candidate is non-abelian with Ising-type content. Regime: At least three candidates share the filling and differ by edge structure and chiral central charge: Candidate c - Status --- --- --- Pfaffian (Moore–Read) 3/2 Original 1991 proposal Anti-Pfaffian -1/2 Favoured by most finite-size numerics with LL mixing PH-Pfaffian 1/2 Favoured by measured thermal Hall \\kappa {xy} These are distinct topological orders — distinct anyon content, distinct edge spectra — not gauge choices. The thermal-Hall/numerics discrepancy is unresolved; disorder-induced Pfaffian/anti-Pfaffian domain averaging is the leading reconciliation and is not established. Stripped assumption: \"\\nu=5/2 = Pfaffian\" is a 1991 shorthand that the data have never confirmed. Any experimental claim to braid Ising anyons at 5/2 inherits this ambiguity before it inherits anything about braiding. A seventh, for the headlines Three claims of decreasing strength are routinely merged: (a) measuring an abelian exchange phase, done at \\nu=1/3 and 2/5 by Fabry–Pérot interferometry and anyon collision; (b) digital simulation of a non-abelian fusion/braiding algebra in an engineered circuit — real algebra, no thermodynamic phase, no gap protection, no deconfinement; (c) controlled braiding of deconfined non-abelian quasiparticles in a bulk topological phase — not achieved. Proposals such as X-shaped Majorana interferometry and real-space zero-mode braiding in classical/metamaterial platforms are frequently reported as (c). They are, respectively, a proposal and a demonstration in a system with no many-body Hilbert space at all. The Laboratory Record: From the ν=1/3 Plateau to Direct Braiding The Laboratory Record: From the ν=1/3 Plateau to Direct Braiding The experimental history of this subject is usually told as a single ascending line: plateau → fractional charge → fractional statistics → non-abelian statistics → topological qubit. That narrative is wrong in its last two steps, and the error is not subtle. What follows sorts the record by what each measurement actually establishes , which is rarely what the abstract claims. Figure: Rungs 1–3 are established. Rung 4 is a single quantity whose interpretation is now actively disputed. Rung 5 realizes the fusion/braid algebra in engineered systems with no thermodynamic phase. Rung 6 — the claim the field is routinely reported to have achieved — is empty. Rung 1: the plateau (1982) Tsui, Störmer and Gossard saw a quantized Hall plateau and a vanishing \\rho {xx} at \\nu=1/3 in a GaAs/AlGaAs heterostructure at \\sim0.5 K and \\sim20 T . What this establishes is an incompressible state with \\sigma {xy}=\\tfrac{1}{3}e^2/h — a bulk gap at fractional filling . It establishes neither fractional charge nor fractional statistics; both are inferences from Laughlin's subsequent theory . The rate-limiting technical step was Gossard's MBE growth: at the mobilities available in 1980 the feature is not resolvable at all. The 1998 Nobel motivation names three people; the growth is the fourth contribution and it is uncredited. Rung 2: the charge (1997) Fifteen years passed before e^ itself was measured. Weak backscattering at a QPC in the \\nu=1/3 edge gives Poissonian noise S=2e^ I B, and both the Saclay group and the Weizmann group (de-Picciotto et al. , Nature 389 , 162) extracted e^ =e/3 in 1997; e^ =e/5 at \\nu=2/5 followed. This is solid — but it is a transport observable of a chiral Luttinger edge, not spectroscopy of a bulk quasiparticle. The extracted Fano factor drifts continuously toward 1 at strong backscattering and at low T/high transmission, because in that limit one is watching electrons tunnel through vacuum. \"Shot noise measures the quasiparticle charge\" is true only inside the stated window, and this is the single most-stripped set of assumptions in the FQH experimental literature. Rung 3: the abelian exchange phase (2020–2023) Two independent routes converged in 2020. Nakamura, Liang, Gardner and Manfra built a screening-well Fabry–Pérot device that suppresses bulk–edge Coulomb charging, moving the interferometer out of the Coulomb-dominated regime and into the genuine Aharonov–Bohm regime, where the conductance oscillation shows discrete phase jumps of 2\\pi/3 each time a localized quasiparticle enters the interference loop . Simultaneously, the Saclay anyon collider (Bartolomei et al. , Science 368 , 173) measured negative current cross-correlations with effective Fano factor P\\approx-2 at \\nu=1/3, where symmetric fermionic beams would give P=0. The 2023 extension to \\nu=2/5 is the sharpest number in the field: e^ =0.17\\pm0.02, \\theta=(-0.43\\pm0.05)\\times2\\pi against the predicted e/5 and -4\\pi/5. Caveat worth keeping: collider-type negative cross-correlations have since been reported in the integer regime, where no anyons exist, so the collider's interpretive burden is heavier than the interferometer's. Rung 3 is nonetheless established — for abelian anyons. Rung 4: the ν=5/2 thermal Hall problem The only quantitative bulk claim for non-abelian order is thermal. The edge carries K=c -\\kappa 0 with \\kappa 0=\\pi^2k B^2T/3h, and a Majorana branch contributes c -=\\tfrac12. Including the two filled lower Landau levels, the candidates predict K/\\kappa 0 = 7/2 (Pfaffian), 3/2 (anti-Pfaffian), 5/2 (PH-Pfaffian) . The Weizmann measurement gave 2.5\\kappa 0 — a half-integer, hence \"non-abelian\", but the wrong half-integer: exact diagonalization and DMRG with Landau-level mixing favour the anti-Pfaffian. Two escapes exist, and both are live. Either the anti-Pfaffian's counterpropagating Majorana fails to thermally equilibrate over the sample, which reproduces 2.5 from an anti-Pfaffian bulk; or the PH-Pfaffian is real and the numerics are missing something. The interpretation weakened further in 2026, when a bilayer-graphene device built from purely abelian particle-like and hole-like integer states was shown to produce a robust half-integer two-terminal plateau from equilibration dynamics alone. Half-integer K is therefore not a topological fingerprint. Independently, Fabry–Pérot interferometry on even-denominator states in bilayer graphene finds an oscillation period of \\Delta\\Phi=2\\Phi 0 rather than the 4\\Phi 0 expected from non-abelian even–odd effects, i.e. no non-abelian signature. Rung 4 is a genuinely open experimental question, not a confirmed result. Rung 5: the algebra, engineered Since 2023, the braid and fusion algebra of Ising and Fibonacci anyons has been realized on superconducting and trapped-ion processors — Google's graph-vertex braiding, the Quantinuum trapped-ion counterpart, and Fibonacci string-net braiding. An acoustic Kekulé lattice has now tracked Majorana- like zero modes through a real-s"}</script>

html{scroll-behavior:smooth}

body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.72;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .45s,color .45s}

/* landing hero */
.lhero{padding:84px 0 38px}

.empty{padding:60px 0;color:var(--muted);font-style:italic}

.aka{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;align-items:center}

.aka i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px}

.callout{border:1px solid var(--line-soft);border-left:2px solid var(--accent);background:var(--elev);border-radius:0 4px 4px 0;padding:18px 24px;margin:30px 0}
.callout h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.callout p{font-size:15.5px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--gold)}
.callout.warn h4{color:var(--gold)}
.rgrid{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;padding-bottom:40px}

.toc .tl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 12px;border-left:1px solid var(--line-soft);transition:color .2s,border-color .2s}
.toc a:hover,.toc a.on{color:var(--accent);border-color:var(--accent)}
article.body{min-width:0;max-width:760px}
.sec{padding:14px 0 8px;scroll-margin-top:80px}
.sec.verdict{border:1px solid var(--line);border-radius:6px;background:var(--elev);padding:8px 34px 24px;margin-top:30px}
.prose h2{font-family:var(--serif);font-weight:500;font-size:clamp(25px,3.4vw,33px);line-height:1.18;letter-spacing:-.01em;margin:40px 0 16px}

.fig{margin:26px 0;padding:20px;border:1px solid #222a3a;border-radius:8px;background:#10141d;text-align:center;overflow-x:auto;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}

.mathraw{font-family:var(--mono);font-size:.82em;color:var(--ink-2);background:var(--accent-soft);padding:1px 5px;border-radius:3px}

.block{padding:46px 0 8px;border-top:1px solid var(--line-soft);margin-top:40px}

/* origins timeline — horizontal scrollable filmstrip ("slider") */
.tslider{display:flex;gap:14px;overflow-x:auto;padding:10px 2px 16px;scroll-snap-type:x proximity;cursor:grab;

.tcard{position:relative;min-width:215px;max-width:240px;flex:0 0 auto;border:1px solid var(--line);border-radius:7px;background:var(--elev);padding:14px 16px 16px;scroll-snap-align:start}

.ncard .ev{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.conf{list-style:none}

.conf .claim{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:4px;padding:8px 12px;display:inline-block;margin-bottom:8px}

<script type="application/json" id="aether-data">{"slug": "braided-worldlines-fractional-charge-fractional-statistics-a", "topic": "anyons, abelian and non-abelian, fractional charges", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "Braided Worldlines: Fractional Charge, Fractional Statistics, and the Four Different People Who Get Called Their Discoverer", "subtitle": "A monograph on abelian and non-abelian anyons — the topological kinematics, the fractionalization mechanism, and the corrected record the textbooks never absorbed.", "domain": "", "era": "", "why_big": "", "abuse": "", "date": "August 6, 2026", "ts": 1786074484.932184, "engine": "Claude Code CLI · default model", "aliases": ["anyons", "fractional statistics", "braid statistics", "θ-statistics", "intermediate statistics", "nonabelions", "non-Abelian anyons", "Ising/Fibonacci anyons", "charge fractionalization", "quantum number fractionalization", "topological order quasiparticles", "flux-charge composites", "statistical transmutation", "Chern–Simons statistics"], "origin_story": "The idea entered physics twice, from opposite ends, and was named a third time. The formal channel opens in 1971, when Laidlaw and DeWitt-Morette recast identical-particle quantum mechanics as a sum over homotopy classes of paths in the configuration space Q_N = (X^N − Δ)/S_N, and showed the admissible propagators are labelled by one-dimensional unitary representations of π₁(Q_N) [54]. For X = ℝ³, π₁(Q_N) = S_N, whose 1D reps are ±1: bosons and fermions, and — they emphasized — no parastatistics. That result was correct and its scope was silently generalized by the community into a theorem about all space dimensions. In 1977 Leinaas and Myrheim reopened exactly that step: in two dimensions the excised diagonal is codimension 2, loops around it cannot be contracted, π₁(Q_N) is Artin's braid group B_N rather than S_N, and its abelian characters form a continuous circle e^{iθ} — a one-parameter family interpolating between Bose (θ=0) and Fermi (θ=π) [56]. Independently, and by a completely different route — unitary representations of the local current algebra / diffeomorphism group of ℝ^d, i.e. kinematics rather than path integrals — Goldin, Menikoff and Sharp reached the same dimension-dependent conclusion and tied it to the Aharonov–Bohm phase in 1980–81 [57]. Neither line was read. What made the subject visible was a concrete model: Wilczek's charge–flux composite in 2+1 dimensions, a point charge q bound to a thin solenoid of flux Φ, for which adiabatic exchange accumulates the Aharonov–Bohm phase θ = qΦ/2ħc and the object carries spin θ/2π — plus the name 'anyon', which spread faster than any of the mathematics [59]. Meanwhile a second, initially unrelated thread had produced fractional *charge*: Jackiw and Rebbi's zero mode giving a soliton fermion number ½ [55], its condensed-matter incarnation in polyacetylene (Su–Schrieffer–Heeger), and Goldstone–Wilczek's spectral-flow formula. These threads fused when Tsui, Störmer and Gossard saw a plateau at ν=1/3 [58] and Laughlin wrote the wavefunction whose quasiholes carry charge e/3 [60]. The statistics of those quasiholes was supplied not by Laughlin but by Halperin in 1984, as the organizing principle of the FQH hierarchy [61], and computed as a Berry phase by Arovas, Schrieffer and Wilczek in the same year [62]; Wu simultaneously gave the general braid-group formulation and the multi-anyon Hilbert space [63]. The non-abelian generalization arrived from two directions that still barely cite each other: algebraic QFT, where Fredenhagen, Rehren and Schroer (and Fröhlich–Gabbiani) derived braid-group superselection statistics with higher-dimensional endomorphism sectors from Haag duality in low dimensions [64]; and Moore and Read, who identified FQH wavefunctions with chiral CFT conformal blocks, so that a degenerate space of blocks turns quasihole exchange into a matrix — 'nonabelions' [67]. Kitaev then converted the degeneracy into a computational resource, and the subject acquired an engineering purpose it has not lost [68].", "credit_audit": "The naming and the discovery are attached to different people, and the field mostly cites the naming. Leinaas and Myrheim published the braid-group continuum of statistics in Il Nuovo Cimento B in January 1977 [56]; Goldin, Menikoff and Sharp reached it independently by 1981 [57]; Wilczek's 1982 papers, which supplied the flux–charge model and the word 'anyon' [59], did not cite either. The correction is documented rather than folkloric: after a 1989 Physics Today article credited the prediction to Wilczek alone, a joint letter by Biedenharn, Lieb, Simon and Wilczek set the record straight in the August 1990 issue [66], and Wilczek's own 1990 reprint volume opens with the pre-history [65]. Leinaas has said plainly that he wrote to Wilczek because the 1977 paper was going uncited [73]; Goldin has since written the case up as a study in misattribution [72]. So this is not a suppressed record — it is a corrected record that the pedagogical literature never absorbed. On the FQHE side, the 1998 Nobel motivation ('a new form of quantum fluid with fractionally charged excitations') is scrupulously about *charge*, not statistics, and Laughlin's lecture is titled accordingly [70]; the widespread textbook sentence that 'Laughlin showed the quasiparticles are anyons' is simply false — that is Halperin 1984 [61] with the Berry-phase derivation by Arovas–Schrieffer–Wilczek [62]. Arthur Gossard, whose MBE growth made the ν=1/3 plateau resolvable, is a co-author of the discovery paper [58] and absent from the prize. For non-abelian statistics, the condensed-matter canon starts at Moore–Read 1991 [67] and Wen 1991; the algebraic-QFT derivation of braid statistics with non-integer statistical dimension is at least two years earlier [64] and the two literatures still cross-cite thinly, so 'quantum dimension' and 'statistical dimension' are frequently presented as independent inventions. Fractional charge has its own displaced ancestry: the mechanism is Jackiw–Rebbi 1976 [55], made concrete in polyacetylene by Su–Schrieffer–Heeger (1979) and given the general spectral-flow formula by Goldstone–Wilczek (1981) — none of which is FQH, and all of which is usually skipped in FQH pedagogy. Finally, the topological-quantum-computation framing that now drives funding is Kitaev's [68], with Freedman–Kitaev–Larsen–Wang supplying the universality theorems; the frequent attribution of 'topological qubits' to the Majorana-nanowire program inverts the actual chronology [20][23].", "timeline": [{"year": 1971, "event": "Identical-particle quantum mechanics recast as path integral over homotopy classes of the multiply-connected configuration space; propagators classified by 1D unitary reps of π₁. Correct for ℝ³ (only Bose/Fermi, no parastatistics) — and read for two decades as if dimension-independent.", "who": "Michael G. G. Laidlaw, Cécile DeWitt-Morette", "work": "\"Feynman Functional Integrals for Systems of Indistinguishable Particles\", Phys. Rev. D 3, 1375 (from Laidlaw's UNC thesis under DeWitt-Morette)", "kind": "formalization", "ref": 1}, {"year": 1976, "event": "Soliton with a mid-gap zero mode carries fermion number ±1/2 — quantum-number fractionalization established as a sharp, non-fluctuating eigenvalue, independent of any statistics question.", "who": "Roman Jackiw, Claudio Rebbi", "work": "\"Solitons with fermion number 1/2\", Phys. Rev. D 13, 3398", "kind": "theory", "ref": 11}, {"year": 1977, "event": "π₁ of the 2D identical-particle configuration space is the braid group, not S_N; its abelian characters give a continuum e^{iθ} of statistics. Also treats the 1D case. The actual prediction of anyons, five years before the name.", "who": "Jon Magne Leinaas, Jan Myrheim", "work": "\"On the theory of identical particles\", Il Nuovo Cimento B 37, 1–23 (submitted 1976, published 11 Jan 1977)", "kind": "theory", "ref": 2}, {"year": 1981, "event": "Independent derivation of dimension-dependent exotic statistics from unitary representations of local current algebras / diffeomorphism groups, explicitly linked to the Aharonov–Bohm phase — a kinematical route that owes nothing to path integrals.", "who": "Gerald A. Goldin, Ralph Menikoff, David H. Sharp", "work": "\"Representations of a local current algebra in nonsimply connected space and the Aharonov–Bohm effect\", J. Math. Phys. 22, 1664 (preceded by J. Math. Phys. 21, 650 (1980))", "kind": "formalization", "ref": 4}, {"year": 1982, "event": "Magnetotransport in high-mobility GaAs/AlGaAs heterostructures shows a quantized plateau at ν=1/3 — the empirical fact that forced fractional charge into the laboratory.", "who": "Daniel C. Tsui, Horst L. Störmer, Arthur C. Gossard", "work": "\"Two-Dimensional Magnetotransport in the Extreme Quantum Limit\", Phys. Rev. Lett. 48, 1559", "kind": "observation", "ref": 36}, {"year": 1982, "event": "Charge–flux composite in 2+1D: exchange phase θ = qΦ/2ħc, spin θ/2π, and the coinage 'anyon'. The naming, not the discovery — but it is what made the concept portable.", "who": "Frank Wilczek", "work": "\"Quantum Mechanics of Fractional-Spin Particles\", Phys. Rev. Lett. 49, 957 (companion: \"Magnetic Flux, Angular Momentum, and Statistics\", PRL 48, 1144)", "kind": "naming", "ref": 5}, {"year": 1983, "event": "Trial wavefunction ∏(z_i−z_j)^m e^{−Σ|z|²/4}; plasma analogy; quasihole obtained by adiabatic flux insertion carries charge e/m. The paper states the charge; it does not state the statistics.", "who": "Robert B. Laughlin", "work": "\"Anomalous Quantum Hall Effect: An Incompressible Quantum Fluid with Fractionally Charged Excitations\", Phys. Rev. Lett. 50, 1395", "kind": "theory", "ref": 17}, {"year": 1984, "event": "Laughlin quasiparticles identified as anyons with θ = π/m, and fractional statistics made the engine of the hierarchy construction — quasiparticles of one level condense into the next. The first statement that FQH quasiparticles are anyons.", "who": "Bertrand I. Halperin", "work": "\"Statistics of Quasiparticles and the Hierarchy of Fractional Quantized Hall States\", Phys. Rev. Lett. 52, 1583 (+ Erratum 52, 2390)", "kind": "theory", "ref": 18}, {"year": 1984, "event": "Adiabatic Berry-phase computation of the quasihole exchange phase in the Laughlin state: the total phase splits into an Aharonov–Bohm piece ∝ enclosed charge and a mutual statistical piece π/m. The canonical derivation taught today.", "who": "Daniel P. Arovas, J. Robert Schrieffer, Frank Wilczek", "work": "\"Fractional Statistics and the Quantum Hall Effect\", Phys. Rev. Lett. 53, 722", "kind": "formalization", "ref": 14}, {"year": 1984, "event": "Explicit braid-group formulation of N-particle statistics in 2D, multivalued wavefunctions vs. singular gauge transformation, and the observation that 1D reps of B_N are exhausted by e^{iθ} — leaving higher-dimensional reps as the open door to non-abelian statistics.", "who": "Yong-Shi Wu", "work": "\"General Theory for Quantum Statistics in Two Dimensions\", Phys. Rev. Lett. 52, 2103 (with \"Multiparticle Quantum Mechanics Obeying Fractional Statistics\", PRL 53, 111)", "kind": "formalization", "ref": 10}, {"year": 1989, "event": "From the DHR superselection framework: in ≤2+1 dimensions localized endomorphisms of the observable algebra obey braid-group rather than permutation-group statistics, with sectors of non-integer statistical dimension — non-abelian braiding derived from QFT axioms, not from a wavefunction ansatz.", "who": "Klaus Fredenhagen, Karl-Henning Rehren, Bert Schroer (parallel: Jürg Fröhlich, Fabrizio Gabbiani)", "work": "\"Superselection sectors with braid group statistics and exchange algebras I: General theory\", Commun. Math. Phys. 125, 201", "kind": "formalization", "ref": 15}, {"year": 1991, "event": "FQH wavefunctions read as chiral CFT conformal blocks; the Pfaffian (Moore–Read) state at ν=5/2 has 2^{n/2−1}-fold degenerate quasihole blocks, so exchange acts as a matrix — 'nonabelions'. Wen's PRL 66, 802 gave the parallel effective-theory statement the same year.", "who": "Gregory Moore, Nicholas Read", "work": "\"Nonabelions in the fractional quantum Hall effect\", Nucl. Phys. B 360, 362–396", "kind": "theory", "ref": 12}, {"year": 1997, "event": "Non-abelian braiding reframed as a fault-tolerant quantum memory and gate set: the toric code, anyonic error correction, and topological protection by a gap. This is what turned anyons from a curiosity into a funded program.", "who": "Alexei Kitaev", "work": "\"Fault-tolerant quantum computation by anyons\", quant-ph/9707021 (1997); published Ann. Phys. 303, 2 (2003)", "kind": "theory", "ref": 33}, {"year": 1997, "event": "Shot-noise measurements at weak backscattering in the ν=1/3 edge give Fano factor 1/3 — the first direct measurement of a fractional charge, independently by the Saclay and Weizmann groups (de-Picciotto et al., Nature 389, 162).", "who": "Laurent Saminadayar, D. Christian Glattli, Yong Jin, Bernard Etienne (and R. de-Picciotto, M. Reznikov, M. Heiblum et al.)", "work": "\"Observation of the e/3 Fractionally Charged Laughlin Quasiparticle\", Phys. Rev. Lett. 79, 2526", "kind": "observation", "ref": 13}, {"year": 2020, "event": "Fabry–Pérot interferometry in a screened GaAs device resolves discrete Aharonov–Bohm phase jumps of 2π/3 as quasiparticle number changes — anyonic exchange statistics read directly off interference, complemented the same year by anyon collision/noise experiments in the Glattli group.", "who": "James Nakamura, Shuang Liang, Geoffrey C. Gardner, Michael J. Manfra", "work": "\"Direct observation of anyonic braiding statistics\", Nature Physics 16, 931", "kind": "observation", "ref": 16}, {"year": 2024, "event": "Fractional quantum anomalous Hall states at zero magnetic field in rhombohedral multilayer graphene (and twisted MoTe₂), moving fractionalized quasiparticles out of the Landau-level setting entirely — the regime where Chern-band anyons are no longer a thought experiment.", "who": "Zhengguang Lu, Tonghang Han, Long Ju et al.", "work": "\"Fractional quantum anomalous Hall effect in multilayer graphene\", Nature 626, 759", "kind": "revival", "ref": 38}], "neglected": [{"name": "Jon Magne Leinaas and Jan Myrheim", "role": "Predicted anyons outright in 1976–77: identified the braid group as π₁ of the 2D identical-particle configuration space and the continuum of statistics parameters θ. They are the discoverers; Wilczek is the namer. For roughly a decade the paper was nearly uncited, and the concept circulated as 'Wilczek's anyons'.", "evidence": "Leinaas's own account: after publication 'there were few references to our article, so I wrote to Wilczek and informed him about our work.' The 1977 Nuovo Cimento paper predates Wilczek 1982 by five years and contains the braid-group continuum explicitly.", "ref": 3}, {"name": "Gerald A. Goldin, Ralph Menikoff, David H. Sharp", "role": "Derived the same dimension-dependent statistics independently (1980–81) from unitary representations of local current algebras and diffeomorphism groups, and connected them to the Aharonov–Bohm phase — a third, kinematical derivation that is almost never cited in condensed-matter reviews.", "evidence": "Their 1980/1981 J. Math. Phys. papers; and the correction letter 'The Ancestry of the Anyon' (Physics Today, Aug 1990), signed by Biedenharn, Lieb, Simon and Wilczek, written after a 1989 Physics Today piece credited anyons to Wilczek alone and omitted them. Goldin has since written the history explicitly.", "ref": 6}, {"name": "Cécile DeWitt-Morette and Michael G. G. Laidlaw", "role": "Supplied the entire topological framework — homotopy classes of paths, π₁ representations labelling propagators — in 1971. Everything Leinaas–Myrheim did is their machinery applied in d=2. Textbooks cite the 1971 paper, when they cite it, as the proof that only bosons and fermions exist, i.e. for the one conclusion that is dimension-restricted.", "evidence": "Phys. Rev. D 3, 1375 (1971), derived from Laidlaw's UNC doctoral thesis under DeWitt-Morette; the paper's stated aim is excluding parastatistics, and its ℝ³ restriction is explicit in the text but routinely dropped in citation.", "ref": 1}, {"name": "Bertrand I. Halperin", "role": "First to state that Laughlin quasiparticles are anyons and to make fractional statistics the organizing principle of the FQH hierarchy (1984). Popular accounts and the 1998 Nobel citation attach 'fractional statistics' to the Laughlin state itself, but Laughlin 1983 says nothing about statistics.", "evidence": "PRL 52, 1583 (1984) and its erratum; the statistics claim appears there and in Arovas–Schrieffer–Wilczek, not in PRL 50, 1395. Halperin also authored the 1983 two-component (m,m',n) states now indispensable to bilayer and multicomponent FQH.", "ref": 18}, {"name": "Yong-Shi Wu", "role": "Gave the general braid-group theory of 2D quantum statistics in 1984, including the singular-gauge/multivalued-wavefunction dictionary and the N-anyon Hilbert space, and made explicit that only the *one-dimensional* braid reps yield abelian anyons — the logical opening for non-abelian statistics. Later introduced the thermodynamics of Haldane exclusion statistics. Routinely compressed into an 'and see also' citation.", "evidence": "PRL 52, 2103 (1984) and PRL 53, 111 (1984); the braid-group language now standard in the field is his, not Wilczek's.", "ref": 10}, {"name": "Klaus Fredenhagen, Karl-Henning Rehren, Bert Schroer (and Jürg Fröhlich, Fabrizio Gabbiani)", "role": "Derived braid-group statistics — including sectors with non-integer statistical dimension, i.e. non-abelian anyons — from the Doplicher–Haag–Roberts axioms of algebraic QFT in low dimensions, contemporaneously with or before Moore–Read. The condensed-matter literature almost universally dates non-abelian anyons to 1991.", "evidence": "Commun. Math. Phys. 125, 201 (1989); the concepts 'statistical dimension' and 'braid-group superselection statistics' appear there, and modern quantum-dimension d_a is the same object.", "ref": 15}, {"name": "Arthur C. Gossard", "role": "Grew the MBE heterostructures whose mobility made the ν=1/3 plateau visible at all; co-author of the discovery paper. The 1998 Nobel went to three, and the materials-growth contribution — the actual rate-limiting step of the discovery — is absent from the citation.", "evidence": "He is the third author of PRL 48, 1559 (1982), the discovery paper; the Nobel motivation names only Tsui, Störmer and Laughlin.", "ref": 36}], "conflations": [{"claim": "'Fractional charge' and 'fractional statistics' are used interchangeably, as if one implies the other.", "clarification": "They are logically independent. Charge fractionalization requires only a degenerate/soliton sector and spectral flow — it occurs in 1D (Su–Schrieffer–Heeger, Jackiw–Rebbi [55]) where the braid group is trivial and no anyons exist. Fractional statistics requires π₁ of the 2D configuration space and can occur at integer charge (e.g. the neutral fermion ψ of the Moore–Read state, or Z₂ visons). In the Laughlin state the two happen to be locked, θ = πν and Q = νe, because both descend from the same flux-attachment; that locking is a property of abelian Chern–Simons theory, not a general theorem."}, {"claim": "'Fractional statistics' names one thing.", "clarification": "It names two unrelated things. (i) Braid/exchange statistics: a phase e^{iθ} or unitary matrix from the topology of the 2D worldline configuration, a property of π₁(Q_N) [56][63]. (ii) Haldane exclusion statistics (1991): a dimension-independent combinatorial rule for how the single-particle Hilbert space shrinks with occupation, dg = −α dN, defined even in 1D and 3D. Wu computed the thermodynamics of the second and the exchange phase of the first; they coincide numerically in the lowest Landau level (α = θ/π) and that coincidence is regularly promoted to an identity."}, {"claim": "A Majorana zero mode is a non-abelian anyon.", "clarification": "A MZM is an extrinsic *defect* — a vortex core or wire endpoint — carrying a zero mode; it is not a deconfined bulk quasiparticle of a topological order. The Ising anyon σ with quantum dimension √2 lives in the Ising/Moore–Read TQFT, where it is a genuine deconfined excitation. In a 1D Kitaev chain there is no 2+1D braid group at all and the 'braiding' is a T-junction exchange protocol whose non-abelian action follows from the zero-mode algebra, not from configuration-space topology. Papers on nanowire MZMs [19][21][24][45] and papers on Ising anyons in a topological order [23][46] are about different objects that share a fusion rule."}, {"claim": "Non-abelian statistics is the non-abelian Berry holonomy of the ground-state manifold.", "clarification": "The Berry holonomy is basis- and connection-dependent; the topologically invariant content is the *monodromy* of the multivalued wavefunctions. They agree only when the trial states are orthonormal and holomorphic in the quasiparticle coordinates so the Berry connection vanishes (up to an area term). Read established the conditions under which this 'monodromy = Berry phase' identification is legitimate for Moore–Read, Laughlin and Read–Rezayi states; it is not automatic, and quoting a Berry-phase computation as the statistics without checking it is a standard silent assumption."}, {"claim": "Braiding is exchange, and exchanging twice returns you to the start.", "clarification": "In 2D the relevant group is Artin's B_N, not S_N: σ_i² ≠ 1. Clockwise and counterclockwise exchange are inequivalent (which is why anyonic theories break parity/time-reversal), θ and θ+2π label distinct theories once framing/spin is tracked, and the Yang–Baxter relation σ_iσ_{i+1}σ_i = σ_{i+1}σ_iσ_{i+1} replaces the symmetric-group presentation. 'Half of a full monodromy' is only meaningful given a framing convention — the ubiquitous θ vs 2θ factor-of-two discrepancies in the literature come from exactly this."}, {"claim": "A shot-noise Fano factor of 1/3 measures the quasiparticle charge.", "clarification": "The measured quantity is the effective backscattered charge in a specific limit: weak backscattering, temperature above the relevant crossover, and a well-formed ν=1/3 edge. The same junction in the strong-backscattering limit gives Fano factor 1 (electrons tunnelling through vacuum), and at low temperature/high transmission the extracted 'charge' drifts continuously between e/3 and e. e* extracted from noise is a transport observable of a Luttinger-liquid edge, not a direct spectroscopy of a bulk quasiparticle [69]."}, {"claim": "The ν=5/2 state is the Moore–Read Pfaffian, so its non-abelian anyons are Ising anyons.", "clarification": "At least three candidates share the ν=5/2 filling and differ in their edge structure and thermal Hall conductance: Pfaffian (c₋ = 3/2), anti-Pfaffian (c₋ = −1/2), and PH-Pfaffian (c₋ = 1/2). They have different topological orders and different (though all Ising-like or Ising-conjugate) anyon content. Measured thermal Hall values have favoured PH-Pfaffian while numerics favour anti-Pfaffian; the discrepancy is unresolved. 'ν=5/2 = Pfaffian' is a shorthand from 1991 [67] that the data have not confirmed."}, {"claim": "Non-abelian anyons have been observed.", "clarification": "Distinguish three claims of decreasing strength: (a) measurement of an abelian exchange phase via interferometry or collision — done, at ν=1/3 and 2/5 [31]; (b) digital *simulation* of non-abelian braiding on a quantum processor, where the fusion/braiding algebra is realized in an engineered circuit with no thermodynamic phase and no gap protection; (c) controlled braiding of deconfined non-abelian quasiparticles in a bulk topological phase — not achieved. Headlines routinely report (b) as (c), and proposals such as X-shaped Majorana interferometry [50] are read as detections."}, {"claim": "Anyons are the same thing as parastatistics.", "clarification": "Parastatistics (Green, and the DHR analysis) uses higher-dimensional representations of the *permutation* group with an internal-degeneracy index, and in ≥3+1D is unitarily equivalent to ordinary statistics with a hidden internal symmetry — which is precisely what Laidlaw–DeWitt-Morette's result excludes as new physics [54]. Anyons use representations of the *braid* group and are not reducible to internal symmetry. Non-abelian anyons resemble parastatistics superficially (multidimensional representation) but the group being represented is different and the degeneracy is topological and non-local, not an internal label."}], "sections": [{"id": "origins-and-the-corrected-record", "title": "Origins: Laidlaw–DeWitt-Morette, Leinaas–Myrheim, and the Ancestry of the Anyon", "markdown": "## Origins: Laidlaw–DeWitt-Morette, Leinaas–Myrheim, and the Ancestry of the Anyon\n\nThe standard sentence — \"anyons were proposed by Wilczek in 1982\" — is wrong in a specific, documentable way, and the correction is not a matter of taste. Four distinct contributions are involved: a **framework** (1971), a **prediction** (1977), an **independent derivation** (1980–81), and a **model plus a name** (1982). The literature routinely collapses all four onto the last.\n\n### 1971: the framework, and the restriction that was dropped\n\nLaidlaw and DeWitt-Morette asked how a Feynman path integral is to be defined for $N$ indistinguishable particles [1]. The configuration space is not $X^N$ but the quotient\n\n$$Q_N(X) \\;=\\; \\big(X^N \\setminus \\Delta\\big)\\big/S_N,$$\n\nwith $\\Delta$ the coincidence set removed. This space is multiply connected, so paths from $q_0$ to $q_1$ fall into homotopy classes labelled by $\\pi_1(Q_N)$, and the total propagator is a weighted sum over classes,\n\n$$K(q_1,t_1;q_0,t_0) \\;=\\; \\sum_{\\alpha \\in \\pi_1(Q_N)} \\chi(\\alpha)\\, K^\\alpha,$$\n\nwhere consistency under composition of paths forces $\\chi$ to be a one-dimensional unitary representation — a character — of $\\pi_1$. That is the whole logical machine: *statistics is a representation of the fundamental group of the identical-particle configuration space.* Nothing in the argument mentions dimensionality.\n\nTheir application, however, did. For $X=\\mathbb{R}^3$ one has $\\pi_1(Q_N)=S_N$, whose one-dimensional representations are exactly two — trivial and alternating — so bosons and fermions exhaust the possibilities and parastatistics is excluded from this route. Excluding parastatistics was the paper's stated purpose, and it is the one conclusion in it that is *not* dimension-independent. The citation record then performed a clean inversion: the 1971 paper is cited, when cited at all, as the proof that only Bose and Fermi statistics exist, with the $\\mathbb{R}^3$ hypothesis silently dropped. The framework — general, and the source of everything downstream — was absorbed as a no-go theorem. Laidlaw's UNC thesis under DeWitt-Morette contains the same material; DeWitt-Morette's role as the architect of the homotopy-class path integral is largely invisible in condensed-matter pedagogy.\n\n### 1977: the prediction\n\nLeinaas and Myrheim [2] — submitted 1976, published in *Il Nuovo Cimento B* on 11 January 1977 — ran the same machine in $d=2$ and got a different answer. In two dimensions the coincidence set has codimension 2; removing it leaves loops that cannot be contracted, and one finds\n\n$$\\pi_1\\big(Q_N(\\mathbb{R}^2)\\big) \\;=\\; B_N,$$\n\nArtin's braid group, presented by generators $\\sigma_1,\\dots,\\sigma_{N-1}$ subject to\n\n$$\\sigma_i\\sigma_{i+1}\\sigma_i=\\sigma_{i+1}\\sigma_i\\sigma_{i+1}, \\qquad \\sigma_i\\sigma_j=\\sigma_j\\sigma_i \\;\\;(|i-j|\\ge 2),$$\n\nand crucially *without* the relation $\\sigma_i^2=1$ that would make it $S_N$. $B_N$ is infinite; its abelianization is $\\mathbb{Z}$; its one-dimensional unitary representations are therefore $\\sigma_i \\mapsto e^{i\\theta}$ for arbitrary $\\theta\\in[0,2\\pi)$. A continuum of statistics, with Bose ($\\theta=0$) and Fermi ($\\theta=\\pi$) as two isolated points in it. Their treatment was concrete rather than formal — a two-particle problem in the relative coordinate with the origin excised, boundary conditions on the relative angle, and the resulting shifted angular-momentum spectrum. They also worked out $d=1$, where the configuration space is disconnected and the \"statistics\" question dissolves into a boundary-condition problem — a point still worth quoting whenever someone claims fractional statistics in a wire.\n\nThis is the prediction of anyons, five years before the word. It went nearly uncited for a decade. Leinaas's own account is unsentimental: the paper attracted so few references that he eventually wrote to Wilczek to tell him the work existed [3].\n\n### 1980–81: the independent derivation\n\nGoldin, Menikoff and Sharp arrived at the same conclusion by a route with no path integral in it [4]. Their object was the unitary representation theory of nonrelativistic local current algebras — equivalently of the group of compactly supported diffeomorphisms of the underlying manifold — where an $N$-particle sector is built from a measure on configuration space and a representation of its fundamental group. In a non-simply-connected space the inequivalent representations are classified by exactly the same $\\pi_1$ characters, and they identified the physical mechanism as an Aharonov–Bohm phase. Two derivations that share no technical apparatus — homotopy classes of Feynman paths on one side, induced representations of diffeomorphism groups on the other — landing on the same $\\theta$-continuum is strong evidence that the result is kinematical, not an artifact of a formalism. Condensed-matter reviews almost never cite it.\n\n### 1982: the model and the name\n\nWilczek's contribution [5] was neither the framework nor the prediction. It was a *realization*: bind charge $q$ to flux $\\Phi$ in $2+1$ dimensions, and the composite acquires, on exchange, the Aharonov–Bohm phase\n\n$$\\theta \\;=\\; \\frac{q\\Phi}{2\\hbar c}, \\qquad s \\;=\\; \\frac{\\theta}{2\\pi},$$\n\nso that spin and statistics are tuned continuously by a single parameter, with the spin–statistics connection preserved in interpolated form. The companion PRL 48, 1144 supplied the angular-momentum bookkeeping. And he named the thing: *anyon*. That coinage is not a trivial contribution — it made the concept portable, and the flux-tube picture is what let field theorists reach for Chern–Simons terms within a few years. But it is a model of an already-predicted phenomenon, and the 1982 papers cite neither [2] nor [4].\n\n### The correction is documented, not folkloric\n\nThis matters: nothing here is reconstructed from grievance. When a 1989 *Physics Today* piece credited anyons to Wilczek alone, a joint letter titled \"The Ancestry of the 'Anyon'\" appeared in the August 1990 issue, signed by Biedenharn, Lieb, Simon — and Wilczek himself — restoring Leinaas–Myrheim and Goldin–Menikoff–Sharp [6]. Wilczek's 1990 reprint volume opens with an editorial pre-history that says the same thing [7]. Myrheim's Les Houches lectures give the braid-group derivation with the original chronology intact [8]. Goldin has since written the episode up explicitly as historiography [9], and Leinaas has told his side in interview [3].\n\nSo the record was corrected in print, by the principals, within eight years of the naming — and the pedagogical literature never absorbed it. What propagates instead is the compressed folk version in which one 1982 paper does all four jobs. The clean division, to be used for the rest of this dossier:\n\n| Contribution | Who | Year | Ref |\n|---|---|---|---|\n| Homotopy-class path integral; statistics $=$ rep of $\\pi_1(Q_N)$ | Laidlaw, DeWitt-Morette | 1971 | [1] |\n| $\\pi_1(Q_N)=B_N$ in $d=2$; the $\\theta$-continuum — the prediction | Leinaas, Myrheim | 1977 | [2] |\n| Independent current-algebra / diffeomorphism-group derivation | Goldin, Menikoff, Sharp | 1980–81 | [4] |\n| Charge–flux composite model; $\\theta=q\\Phi/2\\hbar c$; the name | Wilczek | 1982 | [5] |\n| General $B_N$ formalism, singular gauge, $N$-anyon Hilbert space | Wu | 1984 | [10] |\n\nOne caution before the next section. Everything above concerns *statistics* — the topology of worldlines. It says nothing whatever about *fractional charge*, which has a separate ancestry, a separate mechanism, and a separate set of misattributions. That the two are locked together in the Laughlin state is a fact about abelian Chern–Simons theory, not a theorem; the next section takes fractional charge apart on its own terms, in a setting where the braid group is trivial."}, {"id": "fractionalization-before-anyons", "title": "Fractional Charge Without Fractional Statistics: Jackiw–Rebbi, SSH, and Spectral Flow", "markdown": "## Fractional Charge Without Fractional Statistics: Jackiw–Rebbi, SSH, and Spectral Flow\n\nThe single most durable confusion in this subject is the assumption that fractional charge and fractional statistics are two faces of one phenomenon. They are not. Charge fractionalization is a statement about the spectrum of a local operator in the presence of a topological defect; braid statistics is a statement about $\\pi_1$ of a configuration space. The first mechanism was established in 1+1 dimensions [11], where the braid group is trivial and anyons cannot exist by construction. That the two are locked together in the Laughlin state is a special fact about abelian Chern–Simons theory, not a theorem.\n\n### The Jackiw–Rebbi zero mode\n\nTake a Dirac fermion in 1+1D coupled to a static background scalar,\n\n$$H = -i\\alpha\\,\\partial_x + \\beta\\,\\phi(x),\\qquad \\alpha=\\sigma_1,\\ \\beta=\\sigma_3,$$\n\nwith a kink profile $\\phi(-\\infty)=-m$, $\\phi(+\\infty)=+m$. Charge conjugation $C = \\sigma_1 K$ anticommutes with $H$, so the spectrum is symmetric about $E=0$. The kink binds exactly one normalizable solution at $E=0$,\n\n$$\\psi_0(x)\\ \\propto\\ \\exp\\!\\Big[-\\!\\int_0^x\\! \\phi(x')\\,dx'\\Big]\\,\\chi,\\qquad \\sigma_2\\chi=\\chi,$$\n\nwhose existence is protected by the index theorem: the number of zero modes minus the number of anti-zero modes equals the winding of $\\phi$ at infinity, and no local deformation of the profile that preserves the asymptotics can remove it [11].\n\nThe fractionalization follows from counting, not from dynamics. Define the charge with the symmetric (point-split) operator ordering,\n\n$$Q = \\tfrac{1}{2}\\int dx \\,\\big[\\psi^\\dagger,\\psi\\big](x),$$\n\nwhich is odd under $C$. The $E\\neq0$ states pair up $(E,-E)$ and contribute zero net charge; the single zero mode is its own conjugate partner and contributes $\\pm\\tfrac12$ depending on whether it is filled or empty. The two states $|{\\pm}\\rangle$ of the soliton therefore carry\n$$Q = \\pm\\tfrac{1}{2}.$$\nJackiw and Rebbi phrased this as the vacuum in the soliton sector being doubly degenerate with half-integer fermion number.\n\n### The criterion: sharp eigenvalue, not fractional average\n\nThis is where most secondary accounts go soft, and it is the criterion that separates real fractionalization from arithmetic. A fractional *expectation value* is cheap: any state that is a superposition of integer-charge states with unequal weights gives $\\langle Q\\rangle \\notin \\mathbb{Z}$, and a wavepacket smeared over two sites carries \"half an electron\" in each half of the region in exactly this uninteresting sense. Genuine fractionalization requires that $Q$ be a **sharp quantum number** — that the soliton state be an eigenstate of the charge operator with fractional eigenvalue, so that repeated measurement always returns $\\pm 1/2$ and never $0$ or $1$.\n\nThe operational statement is about the variance. Define the charge in a region of size $L$ centred on the soliton, $Q_L = \\int f_L(x)\\,\\rho(x)\\,dx$ with a smooth window $f_L$. Then\n$$\\langle Q_L\\rangle \\to \\pm\\tfrac12,\\qquad \\big\\langle Q_L^2\\big\\rangle-\\big\\langle Q_L\\big\\rangle^2 \\to 0$$\nas $L$ exceeds the correlation length, with the variance falling off with the window's smoothness (exponentially for a soft window on a gapped system, up to boundary contributions from the window edges). Kivelson and Schrieffer made this the operational definition of fractionalization (verify); Rajaraman and Bell computed the fluctuations explicitly for the kink and found them controlled by the gap, not by the fraction (verify). The contrast case is instructive: a two-level system with $\\langle Q\\rangle = 1/2$ has variance $1/4$ — order unity, never decaying — and is not fractionalized. **Vanishing variance in the thermodynamic limit is the whole content of the claim.** Any paper that reports a fractional mean without reporting the variance has reported nothing topological.\n\n### Polyacetylene: the mechanism in a real material\n\nSu, Schrieffer and Heeger (Phys. Rev. Lett. 42, 1698 (1979); Phys. Rev. B 22, 2099 (1980)) (verify) wrote down the dimerized chain\n\n$$H = -\\sum_n \\big[t_0 - \\alpha(u_{n+1}-u_n)\\big]\\big(c^\\dagger_{n+1}c_n + \\mathrm{h.c.}\\big) + \\tfrac{K}{2}\\sum_n (u_{n+1}-u_n)^2,$$\n\nwhose Peierls ground state is twofold degenerate ($A$ and $B$ dimerization patterns). A domain wall between them is precisely the Jackiw–Rebbi kink in the continuum limit: linearizing about $\\pm k_F$ reproduces the 1+1D Dirac Hamiltonian with $\\phi$ the dimerization order parameter. The wall binds a mid-gap state at $E=0$, and the counting gives a soliton with **charge $\\pm e$ and spin $0$, or charge $0$ and spin $1/2$** — spin–charge separation, the *reversed* quantum numbers of any electronic excitation. Note the shift relative to the Dirac case: spin degeneracy doubles the zero mode, so the fractional-$1/2$ charge of the single-flavour theory becomes an integer cha
