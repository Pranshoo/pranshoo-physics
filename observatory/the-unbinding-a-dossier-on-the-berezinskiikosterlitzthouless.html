eers, and the Invisible 'B' The paradox the 1960s left on the table By the mid-1960s the statistical mechanics of two-dimensional systems with continuous symmetry had cornered itself into an apparent contradiction. On one side, Mermin and Wagner proved in 1966 that the isotropic Heisenberg model in d\\le 2 cannot sustain spontaneous magnetization at any T 0 ; Hohenberg extended the same argument to Bose and BCS condensates . The proof is a Bogoliubov-inequality bound on the order parameter by the infrared divergence of transverse fluctuations, which for a quadratic spin-wave dispersion \\omega {\\mathbf k}\\sim \\mathbf k diverges as \\int d^2k/k^2. No symmetry breaking, full stop. On the other side, two strands of evidence said something singular must happen anyway. Stanley and Kaplan, also in 1966, pushed high-temperature series for the susceptibility of the 2D Heisenberg model and found a divergence at a finite temperature . Their result was controversial — the Mermin–Wagner camp read it as the failure of low-order Padé extrapolants rather than a real transition — but the calculation was clean enough that it could not be dismissed. And in 1967 Wegner, in a German-language paper that Western pedagogy has almost completely forgotten, did the spin-wave analysis of the planar (XY) magnet and found that for every T below some scale the correlator decays as a continuum of quasi-long-range-ordered states with no broken symmetry . Wegner's paper is the under-credited fulcrum of the whole story: the algebraic low-T phase that Kosterlitz, Thouless and Berezinskii would later bound from above already existed, in print, in 1967. The paradox to be resolved was therefore not \"does a transition exist?\" but \"what is the order parameter of a transition that destroys an algebraic phase without ever creating a symmetry-broken one?\" The 1960s pedagogy was not equipped to answer that question. The answer required treating topological defects — vortices — as the relevant degrees of freedom, and that step was taken, twice and independently, between 1970 and 1972. Berezinskii, 1971 and 1972 Vadim L'vovich Berezinskii's first JETP paper was received by the journal in September 1970 and published in Russian in ZhETF in 1971; the English translation appeared as Sov. Phys. JETP 32, 493 (1971) . In it he treats the 2D planar rotator (and, with care about the spin-wave subtraction, the 2D XY model) by isolating the vortex configurations of the angle field \\theta(\\mathbf r). A single vortex of integer charge n contributes an energy that grows logarithmically with system size, while the configurational entropy of placing it on the lattice also grows as 2\\ln(L/a). The free energy F=E-TS changes sign at k B T = \\pi J/2 — a number that, in the Berezinskii paper, already appears as the temperature above which isolated vortices proliferate. Berezinskii goes further: he writes the partition function for the gas of \\pm vortices, observes the logarithmic pair interaction V(\\mathbf r)= -2\\pi J\\ln(r/a), and recognises the resulting object as a two-dimensional Coulomb gas. The companion paper of 1972 extends the same construction to quantum 2D superfluids and to 1D quantum chains via the imaginary-time mapping. What is absent from both papers is the renormalization-group analysis of the Coulomb gas and the universal stiffness jump; those are genuinely the contributions of the next two years on the British side. The Anderson–Yuval–Hamann work on the Kondo problem , received in 1969 and published in 1970, had already revealed the same mathematical structure — a logarithmic 2D Coulomb gas with a Kosterlitz-like RG flow — but in a context (one-dimensional impurity scattering) so different that the connection was not visible until Anderson himself flagged it years later. Kosterlitz and Thouless, 1972 and 1973 Kosterlitz and Thouless's J. Phys. C 5, L124 (1972) letter announced the same vortex-pair picture independently. Their long paper a year later, J. Phys. C 6, 1181 (1973) , is the document the field grew out of. Three contributions are genuinely theirs and not Berezinskii's: 1. The energy–entropy free-energy argument, written cleanly enough that it became the standard pedagogical entry point: F 1 = (\\pi J - 2 k B T)\\ln(L/a) changes sign at T {\\rm BKT}=\\pi J/2 — the same number Berezinskii had, but derived as a thermodynamic instability of the isolated defect. 2. The dielectric-constant language for the Coulomb gas: bound pairs screen the interaction, J\\to J/\\varepsilon(T), and the transition is the divergence of \\varepsilon as the screening length runs to infinity. 3. The mapping of the 2D solid (dislocations as topological defects of the displacement field, with Burgers vectors playing the role of vortex charges), which is the seed of the KTHNY melting theory of 1978–79. The closed renormalization-group flow, with K=J/k B T and y the vortex fugacity, is Kosterlitz alone in J. Phys. C 7, 1046 (1974) . That paper closes the loop: the BKT temperature is the unstable fixed point on the separatrix \\pi K = 2, the low-T phase is a line of fixed points (recovering Wegner's algebraic correlations as the RG-stable manifold), and the singularity at T {\\rm BKT} is essential, \\xi\\sim\\exp[b/(T-T {\\rm BKT})^{1/2}]. How the 'B' got added The naming history is documentable. Through 1973–76 Western papers cite the transition as \"Kosterlitz–Thouless\" without exception; the Stanley–Kaplan and Wegner precedents are acknowledged in the Kosterlitz–Thouless 1973 reference list but the Berezinskii papers are not. Kosterlitz, in his 2016 Nobel lecture , states explicitly that he and Thouless became aware of Berezinskii's JETP papers only after their own 1972/73 work, through Soviet visitors and through Wegner. The first review to write \"Berezinskii–Kosterlitz–Thouless\" as a unit was, to the best of the verifiable record, José, Kadanoff, Kirkpatrick and Nelson in 1977 , which cites Berezinskii prominently; Minnhagen's 1987 Reviews of Modern Physics article cemented the three-name form in the superconducting-film community. Berezinskii died in 1980, before the convention stabilised, and the Uspekhi obituary by Dzyaloshinskii, Gor'kov, Khalatnikov, Larkin and colleagues is candid that Western credit had been slow. The 2016 Nobel committee, while unable to honour him posthumously, named him explicitly in the scientific background document; Kosterlitz's lecture is unusually careful on the priority question. A fair summary of the 1966–1973 sequence: Stanley–Kaplan supplied the empirical paradox, Wegner the algebraic low-T phase, Berezinskii the vortex-Coulomb-gas mechanism, and Kosterlitz–Thouless the thermodynamic argument and the language (free energy, dielectric constant, dislocations) that the rest of the field would speak. The renormalization-group machinery that makes \"BKT\" calculable came one year later, in Kosterlitz 1974, and the universal number that made it falsifiable came in 1977. Those are the next two sections. The Physics: Vortices, the Coulomb Gas, and the Energy–Entropy Argument The Physics: Vortices, the Coulomb Gas, and the Energy–Entropy Argument The XY action and its two species of excitation Fix a square lattice of unit spacing and place a planar rotor \\mathbf{S} i = (\\cos\\theta i,\\sin\\theta i) at each site. The reduced Hamiltonian is At low temperature, expand \\cos\\Delta\\theta \\approx 1-\\tfrac12(\\Delta\\theta)^2 and pass to the continuum, This Gaussian theory gives Wegner's algebraic correlator so \\eta(T)=1/(2\\pi K) runs continuously with temperature, and the system has quasi-long-range order (qLRO) at every T\u003cT c. Mermin–Wagner is satisfied: \\langle e^{i\\theta}\\rangle =0 everywhere . The 1966 Stanley–Kaplan series, however, signalled a true finite-T singularity in \\chi — something the spin-wave sector alone cannot produce. The missing degrees of freedom are vortices : configurations with \\oint C \\nabla\\theta\\cdot d\\boldsymbol{\\ell} = 2\\pi n, n\\in\\mathbb Z, around a closed loop C. A smooth field cannot carry such a winding, so \\theta must be decomposed as The two sectors decouple in the Gaussian measure, and physics splits cleanly into smooth phonons and topological defects [5, 8, 9]. The logarithmic interaction Writing \\nabla\\theta {\\rm v} = \\hat z\\times\\nabla\\phi with \\nabla^2\\phi = 2\\pi\\sum a n a\\delta^{(2)}(\\mathbf r-\\mathbf r a) identifies \\phi as a 2D electrostatic potential sourced by vortex \"charges\" n a. Substituting into \\tfrac12 K\\int(\\nabla\\theta {\\rm v})^2 and regulating at a core scale a gives the famous interaction The neutrality constraint is enforced by the finite-\\theta boundary condition; the core energy E c \\sim \\pi K \\ln(\\text{const}) is non-universal and parameterizes the lattice cutoff. The XY problem is now exactly a 2D Coulomb gas of integer charges with logarithmic interaction , with coupling \\beta\\,q^2 {\\rm eff} = 2\\pi K [5, 8, 13]. This is the structural identity that Anderson, Yuval and Hamann had already recognized two years earlier in the Kondo problem — the same logarithm, the same marginal coupling, the same RG. The energy–entropy argument Kosterlitz and Thouless's signature insight [8, 9] is a one-line estimate of where the vortex gas becomes unstable to free charges. Place a single vortex of charge \\pm 1 in a system of linear size L. Its energy, from the integral above, is Its entropy is the logarithm of the number of available core positions, The free energy of an isolated vortex is therefore For T \u003c T {\\rm KT} = \\pi J / 2k B the coefficient is positive: isolated vortices cost a divergent free energy and the equilibrium population consists only of tightly bound \\pm pairs. For T T {\\rm KT} the entropy wins, free vortices proliferate, and any algebraic correlation is destroyed — the system enters the high-T exponentially decaying phase. The crossing at T {\\rm KT}=\\pi J/2k B is the Kosterlitz–Thouless critical temperature to the lowest order in the fugacity . The actual T {\\rm BKT} is renormalized downward by the dielectric screening of bound pairs, but the structure of the argument is exact: a phase transition driven not by symmetry breaking but by a balance between a logarithmically divergent energy and a logarithmically divergent entropy with the same prefactor in \\ln L. Berezinskii had identified the unbinding mechanism in his 1971 paper ; the energy–entropy free energy crossing and its quantitative consequence T c \\approx \\pi J/2 are the contribution of Kosterlitz and Thouless [8, 9, 15, 11]. Figure: The Kosterlitz–Thouless energy–entropy crossing. Both E 1 and -TS 1 are linear in \\ln(L/a); their sum F 1=(\\pi J - 2k B T)\\ln(L/a) changes sign at T {\\rm KT}=\\pi J/2k B. Below: isolated vortices are forbidden in the thermodynamic limit. Above: entropy wins and free charges destroy algebraic order. Coulomb-gas and sine-Gordon dualities The partition function of the neutral logarithmic Coulomb gas with charges n a\\in\\mathbb Z admits an exact representation as a sine-Gordon field theory, with fugacity y \\equiv e^{-E c} and dual field \\varphi conjugate to the vortex density [8, 12, 13]. Each vertex operator e^{\\pm i\\varphi(\\mathbf r)} inserts a unit charge; expanding \\cos\\varphi in powers of y reproduces the grand-canonical Coulomb gas term by term. The scaling dimension of \\cos\\varphi is \\Delta = 1/(2K) in units where the free field is canonical; the operator is marginal at \\Delta = 2, i.e. at K=\\pi^{-1}\\cdot\\pi=1/\\pi … reinstating the conventional normalization, at K=2/\\pi . This is the Kosterlitz fixed point: above it \\cos\\varphi is irrelevant and vortices are gapped (qLRO); below it the operator is relevant and the vortex gap collapses (disordered phase). The same picture appears as a Luttinger-liquid commensurability transition in 1+1d quantum problems [6, 7, 15]. Why the Villain action is the honest workhorse The cosine in \\beta H is awkward: vortices appear only as configurations of the discrete winding, and the duality is exact only after a periodic-Gaussian replacement. Villain's 1975 device is to substitute with K V(K) chosen to match the low-T stiffness. The resulting partition function decomposes exactly — not approximately — into a Gaussian spin-wave piece times a 2D Coulomb gas of integer vortex charges with logarithmic interaction and a known core fugacity. Every quantitative BKT statement in the modern literature — the closed RG flow [10, 12], the universal jump , the Monte Carlo and tensor-network determinations of T {\\rm BKT} — is in practice computed in the Villain representation or in a continuum theory whose lattice regulator is Villain. The cosine model and the Villain model are in the same universality class but only the latter makes the energy–entropy argument quantitative without ambiguity: K V is the bare stiffness that appears in the RG, y = e^{-\\pi^2 K V / 2} to leading order is the bare fugacity, and the neutrality constraint emerges from a global integration over \\theta. This identification is what makes \"the vortex gas\" not a heuristic but a calculational object. The mechanism is now fully on the table: a continuous 2D theory with no symmetry to break supports topological defects whose pairwise interaction is logarithmic; the single-defect free energy crosses zero at T {\\rm KT}=\\pi J/2k B; and the underlying field theory is sine-Gordon at marginality, with Villain as its exact lattice realization. What remains — the closed RG flow on the (K,y) plane, the essential-singularity correlation length, and the universal jump K(T {\\rm BKT}^-)=2/\\pi — is the subject of §3. The RG Flow and the Universal Stiffness Jump The RG Flow and the Universal Stiffness Jump The Coulomb-gas mapping of §2 is qualitative: it shows that the bound-pair phase exists, that free vortices proliferate when T is large enough, and that the crossover lies near T \\sim \\pi J/2 on the energy–entropy line. The quantitative theory — a sharp T {\\mathrm{BKT}}, an analytic form for the correlation length, and the prediction that the renormalized stiffness drops by a universal amount at the transition — requires a renormalization-group treatment that follows the effective coupling and the effective fugacity as short-distance vortex–antivortex pairs are progressively integrated out. That is Kosterlitz 1974 ; the universal-jump corollary is Nelson–Kosterlitz 1977 . The Kosterlitz recursion relations Let K \\equiv J/k {B}T be the dimensionless stiffness of the XY model and let y \\equiv e^{-\\beta E {c}} be the bare vortex fugacity, with E {c} the vortex core energy. Working in the Villain representation so that the Coulomb-gas/sine-Gordon duality is exact, integrate out pairs of opposite charge with separation between a and a\\, e^{\\ell}. The partition function is invariant under The first equation is the screening of K^{-1} by short-range bound pairs — an effective dielectric of the vortex gas. The second is the scaling dimension of the fugacity operator: a single vortex carries action \\pi K\\,\\ln(L/a), so its activity has dimension \\pi K while the volume factor \\int d^{2}r contributes 2, giving net 2 - \\pi K. Wherever \\pi K 2 vortices are RG-irrelevant; wherever \\pi K \u003c 2 they proliferate. There is therefore a line of fixed points at y = 0 parametrized by K^{-1} \\le \\pi/2, and an isolated unstable fixed point at Hyperbolic flow and the essential singularity Linearize about (2) with u \\equiv K^{-1} - \\pi/2 and \\tilde y \\equiv 2\\pi^{3/2}\\, y. Equations (1) become which admits the conserved quantity Along any one-parameter family of bare initial conditions (u {0}(T),\\,\\tilde y {0}), C \\propto T - T {\\mathrm{BKT}} to leading order, with C=0 defining T {\\mathrm{BKT}}. Trajectories are hyperbolas of constant C and the flow always sends u to the right (du/d\\ell \\ge 0). Figure: Kosterlitz flow in the (1/K,\\,y) plane (schematic; the separatrix slope is exaggerated for visibility). A line of stable fixed points (green) on y=0 at \\pi K \\ge 2 terminates at an unstable fixed point (pink) at \\pi K = 2. The separatrix (blue) is the trajectory at T = T {\\mathrm{BKT}}. Trajectories beneath it (green, T\u003cT {\\mathrm{BKT}}) end at a stable fixed point with finite renormalized stiffness K {R} 2/\\pi; trajectories above it (orange, T T {\\mathrm{BKT}}) flow to strong fugacity, vortices proliferate, and the correlation length is finite. For C 0 the trajectory terminates on the line of fixed points at u {R} = -\\sqrt{C}, so As T\\to T {\\mathrm{BKT}}^{-}, C\\to 0^{+} and K {R}\\to 2/\\pi from above. For C \u003c 0, \\tilde y^{2}\\ge 4 C /\\pi 0 throughout the flow; no fixed point traps the trajectory, and \\tilde y runs to strong coupling at a finite RG time \\ell^{\\ast} where the perturbative recursion breaks down. Eliminating \\tilde y in (3) using (4), The bracketed factor is bounded by \\pi, so \\ell^{\\ast}\\simeq c/\\sqrt{ C } with c non-universal. Substituting C \\propto T-T {\\mathrm{BKT}} and identifying \\xi\\sim a\\,e^{\\ell^{\\ast}}, This is an essential singularity: every derivative of \\xi(T) is finite at T {\\mathrm{BKT}}, the transition is of infinite order in the Ehrenfest sense, with no latent heat and no power-law specific-heat divergence. The vortex-unbinding entropy produces only a smooth, non-divergent bump in C {V} a few percent above T {\\mathrm{BKT}} — the analytic origin of the experimental folklore that \"the specific heat doesn't notice BKT\" . The Nelson–Kosterlitz universal jump Equation (5) together with K {R}\\to 0 for T T {\\mathrm{BKT}} (no phase rigidity survives once free vortices appear) is the central, parameter-free prediction of the theory : the renormalized stiffness drops discontinuously from K {R}(T {\\mathrm{BKT}}^{-}) = 2/\\pi to zero. In the variables of a 2D neutral superfluid the dimensionless stiffness is the helicity modulus divided by k {B}T, with \\rho {s} the 2D superfluid mass density and m the boson mass, giving For ^{4}He films this evaluates to 3.49\\times 10^{-9}\\,\\mathrm{g\\,cm^{-2}\\,K^{-1}}; Nelson and Kosterlitz quoted 3.52\\times 10^{-9} in 1977 using slightly different atomic-mass conventions . The Bishop–Reppy torsional-oscillator measurement on adsorbed ^{4}He confirmed (9) within experimental scatter the year after the prediction and remains the cleanest validation of the universal-jump idea. The dimensionless content K {R}(T {\\mathrm{BKT}}^{-}) = 2/\\pi is universal in the strict sense: independent of lattice, microscopic interactions, and material parameters, depending only on the long-wavelength theory being a 2D Coulomb gas of unit logarithmically interacting charges. The physical prefactor in (9) is not. Changing the underlying degrees of freedom rescales both the effective mass and the effective charge entering the kinetic term: - Thin-film conventional superconductor: Cooper pairs of mass 2m {e} and charge 2e, so K = \\hbar^{2}\\, n {s}^{(2D)}/(4 m {e}\\, k {B} T); the jump in n {s}^{(2D)}/T acquires a different numerical prefactor, and the measured quantity is the sheet kinetic inductance rather than \\rho {s} directly. The Hg–Xe film analysis of Epstein, Goldman, and Kadin and the dirty-film treatment of Fazio, Giaquinta, and Di Mauro both rest on this rescaled version. - Spinor or dipolar condensates: the kinetic coefficient is set by the relevant component mass; the universal 2/\\pi in K survives untouched. - Lattice hardcore bosons: the effective m is set by the hopping via \\hbar^{2}/(2 m a^{2}) \\to t. - XY-symmetric magnets in the BKT class: \\rho {s} is replaced by the in-plane spin stiffness, with the same universal coefficient 2/\\pi. The number 3.52\\times 10^{-9}\\,\\mathrm{g\\,cm^{-2}\\,K^{-1}} thus belongs to ^{4}He alone. Quoting it as \"the universal jump\" for arbitrary 2D superfluids — a habit that survives in review articles — confuses a system-specific prefactor with the underlying universal K {R}(T {\\mathrm{BKT}}^{-}) = 2/\\pi. The clean statement is (5) together with K {R}(T {\\mathrm{BKT}}^{-}) = 2/\\pi, which holds for every system in the XY universality class regardless of microscopic identity; (9) is the helium-specific instantiation. Equations (1)–(2) with the essential singularity (7) and the universal jump (5) constitute the quantitative skeleton on which every later development of BKT physics hangs — the José–Kadanoff–Kirkpatrick–Nelson refinement that adds Z {q} anisotropy and external-field perturbations , the KTHNY melting cascade in which two successive RG flows of the same form govern dislocation and disclination unbinding [22, 23], the Ambegaokar–Halperin–Nelson–Siggia dynamical extension, and the modern reading of trapped-gas crossovers all begin by writing down (1) and then asking which perturbations, finite-size cutoffs, or dynamical terms deform it. Refinements: José–Kadanoff–Kirkpatrick–Nelson, Z_q Anisotropy, and KTHNY Melting Refinements: José–Kadanoff–Kirkpatrick–Nelson, Z q Anisotropy, and KTHNY Melting By 1974 the Kosterlitz–Thouless picture had a closed two-parameter RG, a transition temperature, and an essential singularity. What it did not yet have was a clean answer to the obvious experimentalist's question: which lattice systems actually flow to the XY fixed point? Real magnets sit on lattices whose symmetry is at best C 4 or C 6, not O(2); real adsorbed films feel a substrate corrugation; real Josephson arrays have islands of finite charging energy. The 1974 paper handled none of these. The first decisive cleanup came from José, Kadanoff, Kirkpatrick, and Nelson , who attached the BKT RG to a much larger operator basis and showed precisely which perturbations are relevant in the technical sense. José–Kadanoff–Kirkpatrick–Nelson: vortex fugacity is one knob among several JKKN began from the Villain action , the periodic-Gaussian XY model in which the duality between spin waves and vortex configurations is exact rather than asymptotic. Writing the partition function on the dual lattice, they exposed two independent perturbations of the Gaussian fixed line: a vortex fugacity y v with scaling dimension and a Z q symmetry-breaking field h q — generated, for example, by a crystal-field term -h q\\cos(q\\theta i) — with scaling dimension Both perturbations are dangerous, but they live on opposite ends of the stiffness line. Vortices are irrelevant for K 2/\\pi (the low-T phase) and turn relevant at the BKT point K {BKT}=2/\\pi. The Z q field is irrelevant when \\Delta q 2, i.e. K \u003c 4/q^2. The two windows therefore coexist for which is non-empty only for q \\geq 5 . JKKN's central result: for q=2,3,4 the discrete clock anisotropy is always relevant somewhere in the algebraic phase, dragging the system to an Ising-, three-state Potts-, or Ashkin-Teller-like ordered fixed point; for q\\geq 5 there is an intermediate critical phase bounded above and below by two BKT transitions — an upper one where vortices proliferate and a lower one where Z q order condenses. The \"Z q critical-phase window\" that every later paper on clock models, vestigial order, and emergent U(1) uses is JKKN's, not Kosterlitz's [9 (verify)]. This is the technical content behind a sloppy folk theorem. \"The clock model flows to XY in the continuum limit\" is true only inside that window; outside it the long-distance physics is qualitatively different. JKKN also showed that the RG equations of Kosterlitz are recovered exactly as the projection of the larger flow onto h q = 0, which legitimised the two-line picture as the universal sector rather than the whole story . The Ohta two-component sine-Gordon analysis for adsorbed monolayers on a periodic substrate is, in retrospect, the floating-solid version of the same construction: two coupled defect gases, one of dislocations, one of misfit walls, each with its own fugacity and stiffness. Halperin–Nelson and Young: melting as two successive unbindings Translating BKT logic from spins to atoms is not a mechanical relabelling. A 2D crystal at low T has two order parameters with distinct continuous symmetries: a translational order parameter for each reciprocal-lattice vector \\mathbf G, and a bond-orientational order parameter for a triangular lattice. Mermin–Wagner forbids true LRO for both at any T 0; the spin-wave (phonon) analysis gives algebraic decay of \\psi G at low T and similarly for \\psi 6. Each order parameter has its own defect: dislocations with quantised Burgers vector \\mathbf b\\in a\\mathbb Z^2 destroy translational quasi-LRO; disclinations with \\pm\\pi/3 rotation charge destroy orientational quasi-LRO. A bound disclination pair is precisely a dislocation, so disclinations are a \"higher-order\" defect. Halperin and Nelson , and independently Young , wrote down the elastic free energy of a dilute dislocation gas. Because Burgers vectors are vectors, the resulting object is a vector Coulomb gas, not the scalar one of XY. The renormalised stiffness is the dimensionless Young's modulus where \\mu,\\lambda are the renormalised Lamé coefficients. Dislocation unbinding occurs when K Y flows to the universal value the elastic analogue of the \\pi K = 2 BKT condition. Above T m free dislocations exist but disclinations are still paired; the system has lost translational quasi-LRO but retains orientational quasi-LRO. This is the hexatic phase — algebraic decay of \\psi 6, exponential decay of \\psi G, and a nonzero Frank constant K A that itself obeys a BKT-style RG. A second, genuinely BKT-type transition unbinds the disclinations at a higher T i, with K A(T i^-) = 72/\\pi another universal jump. The two-step picture is KTHNY: Kosterlitz–Thouless–Halperin–Nelson–Young. What KTHNY adds, and what it is not KTHNY adds three structurally new features beyond a bare relabelling of XY: 1. Two transitions, two universal jumps. Calling the whole sequence \"the BKT melting transition\" loses the hexatic, which is the actual prediction. 2. A vector defect gas. The screening structure is anisotropic in Burgers-vector space; the RG flow involves the full elastic tensor, not a single stiffness. Two-component generalisations of the sine-Gordon mapping are the natural language. 3. A genuine order parameter on each side. \\psi 6 has quasi-LRO in both crystal and hexatic; only \\psi G distinguishes them. This is why diffraction patterns of a hexatic show six broadened spots (still sharp in angle) but azimuthally narrow Bragg arcs in the solid. What KTHNY is not : it is not a theorem that 2D melting must be continuous. The Halperin–Nelson construction assumes the dislocation–dislocation interaction stays logarithmic at all relevant scales and that the elastic constants do not collapse before T m; if either fails — typically through a strong attractive core interaction or coupling to the lattice — the transition can pre-empt itself first-order. Experimentally, the hexatic was clearly resolved in monolayer xenon on graphite and later in colloidal monolayers and electrons on helium, but plenty of 2D systems show single first-order melting; both outcomes are consistent with KTHNY, which only delimits the continuous route. The active-matter literature has repurposed the construction wholesale , where motility-induced phase separation cohabits with a KTHNY-like hexatic over a finite parameter window; the same caveat applies — what is observed is KTHNY physics only if the relevant universal jumps and exponents are measured, not merely if the topology of the phase diagram looks right [13, 15]. Landmark Experiments: Helium Films, Josephson Arrays, and 2D Cold Gases Landmark Experiments: Helium Films, Josephson Arrays, and 2D Cold Gases The theory developed in §§2–4 made unusually crisp predictions: an essential singularity in \\xi, a power-law low-T phase, and — after Nelson–Kosterlitz — a parameter-free downward jump of the dimensionless stiffness K(T {\\rm BKT}^-)=2/\\pi. The experimental program of the following four decades can be read as a sequence of attempts to honour those predictions in three quite different physical platforms: neutral superfluid films, charged superfluid films and arrays, and dilute 2D Bose gases. Each succeeded on its own terms; each also exposed where finite size, finite screening, or finite trap curvature smear the BKT signature into a crossover. Bishop–Reppy: the universal jump in adsorbed ^4He The Nelson–Kosterlitz prediction for an unloaded ^4He film, is a numerical statement with no free parameters. Bishop and Reppy tested it with a torsional oscillator: a Mylar substrate spiral-wound around a vertical rod, ^4He adsorbed onto the substrate to areal densities of a few tenths of a monolayer, and an inertial measurement of the superfluid fraction via the Andronikashvili principle. The superfluid component decouples from the oscillator, shifting its resonance frequency by an amount proportional to \\rho s; vortex damping appears as a peak in the quality factor's inverse. Varying the coverage from \\sim 5\\times 10^{-6} to 3\\times 10^{-5} g cm^{-2} swept T {\\rm BKT} between roughly 0.5 K and 1.1 K, and along the entire line the ratio \\rho s(T c^-)/T c tracked the universal value within a few percent. This was the first quantitative confirmation that a transition with no order parameter and no symmetry breaking nevertheless leaves a thermodynamic fingerprint as rigid as a critical exponent. The cleanness of the test has been over-sold. The torsional oscillator runs at finite frequency \\omega/2\\pi\\sim 2 kHz, while the BKT jump is a static, \\omega=0 statement: bound pairs respond on all scales, free vortices do not. Ambegaokar–Halperin–Nelson–Siggia showed that at finite \\omega the discontinuity is rounded into a smooth descent whose midpoint shifts upward by an amount \\Delta T \\sim T {\\rm BKT}/\\ln(\\omega 0/\\omega), where \\omega 0 is a microscopic vortex-diffusion frequency. Bishop and Reppy fitted the shape of that descent, not a literal step; the universality they verified is the area under the dissipation peak constrained to the static jump, not a direct observation of the discontinuity itself . With that proviso, the experiment remains the gold-standard BKT measurement in neutral fluids. Superconducting films and Josephson arrays: the \\lambda \\perp problem In a charged 2D superfluid the vortex–vortex interaction is screened by the magnetic field the vortex generates. Pearl showed that in a film of thickness d and London depth \\lambda L the interaction is logarithmic only at separations r\\lesssim\\lambda \\perp = 2\\lambda L^2/d and crosses over to 1/r above. Genuine BKT phenomenology therefore requires \\lambda \\perp to exceed every other length in the experiment, including the sample. For most thin metal films \\lambda \\perp is millimetric — comfortably large — so the BKT picture should apply. The canonical signature in this platform is the nonlinear current–voltage relation. Below T {\\rm BKT} a transport current applies a Magnus force \\propto I to bound vortex pairs and unbinds those whose separation exceeds r^ \\sim \\hbar/(e I); the resulting flow gives V\\propto I^{a(T)} with a(T)=1+\\pi K(T). At the transition K(T {\\rm BKT}^-)=2/\\pi forces a to jump from 3 to 1. Epstein, Goldman and Kadin reported precisely this discontinuity in high-resistance Hg–Xe films and extracted a temperature dependence of the areal superelectron density consistent with the universal-jump prediction. Subsequent work in disordered Al , dirty films of finite thickness , and granular systems where dissipation reshapes the Coulomb-gas dynamics extended the picture; Minnhagen's review remains the operational reference for what to fit and what to ignore. Two structural caveats blunt the cleanness of these experiments. First, the finite Pearl length means the asymptotic BKT scaling never quite emerges: in real films one fits an incipient transition rounded by screening on the scale of \\lambda \\perp, and the term has by now entered the title page of papers explicitly designed to acknowledge it . Second, in current-biased measurements the nonlinear I–V exponent is contaminated by free vortices nucleated thermally at the sample edges and by the current itself; the jump 3\\to 1 is therefore generically rounded into a steep but continuous descent. Josephson-junction arrays — engineered to put a controlled, logarithmic Coulomb gas of phase-vortices on a lattice — are cleaner in principle and have reproduced the universal-jump signatures and the Halperin–Nelson resistive scaling R\\sim \\exp[-b/(T-T {\\rm BKT})^{1/2}], but they introduce their own complication: a self-capacitance scale that turns the vortex problem into a vortex-charge duality whose two limits realise either the conventional BKT transition or its charge-unbinding mirror . Hadzibabic 2006: vortices made visible in a 2D Bose gas Cold-atom experiments brought a third arena: a 2D Bose gas in which the microscopic parameters — interaction strength \\tilde g, density n, temperature T — are independently tunable, and in which the phase field can be imaged. Hadzibabic, Krüger, Cheneau, Battelier and Dalibard confined ^{87}Rb in a stack of two pancake-shaped optical traps, released the clouds, and let them interfere. In a coherent 2D superfluid the local relative phase \\phi(\\mathbf{r}) is single-valued and the time-of-flight fringe pattern is a set of straight lines whose contrast decays with the algebraic exponent \\eta(T)=1/(2\\pi K). Above T {\\rm BKT} free vortices proliferate; each one is a 2\\pi phase winding that imprints a fork-like dislocation in the fringe pattern. The experiment recorded the appearance of those dislocations as the temperature was raised through the BKT region and showed, in the same data, the crossover of the integrated fringe contrast from algebraic to exponential. It is the most direct visualisation to date of the mechanism Berezinskii [5, 6] and Kosterlitz–Thouless [8, 9] had proposed. The cost of working in a trapped, finite, harmonic system is that \"the transition\" is a local statement. Within the local-density approximation each ring of constant density crosses BKT at a different temperature; the universal criterion of Prokof'ev and Svistunov, n\\rho s\\lambda {\\rm dB}^2 = \\ln(380/\\tilde g) at T {\\rm BKT}, applies pointwise. The observable in is therefore an integrated signature of an inhomogeneous mixture of phases, and the sharp jump predicted for a homogeneous system is replaced by a window of crossover thermodynamics whose width scales as the trap curvature. Calling the resulting feature a transition is a controlled abuse — and the original paper is careful to label it a crossover , language not always preserved in secondary literature. Subsequent experiments at ENS, MIT, Cambridge and elsewhere have refined the picture in uniform box potentials, where the inhomogeneity caveat is removed and the algebraic-to-exponential transition recovers its sharpness, and have measured the equation of state, the sound velocities, and the static and dynamic susceptibilities against the Coulomb-gas predictions of §3. Across all three platforms the lesson is the same. The Nelson–Kosterlitz universal jump and the essential singularity in \\xi are robust enough to survive the experimental compromises — finite frequency, finite screening, finite trap — that smear them. But the smearing is real, and an honest BKT identification always pays the price of saying which smearing it has tolerated. Use and Abuse: What the Label 'BKT' Now Hides Use and Abuse: What the Label 'BKT' Now Hides The 2016 Nobel turned \"BKT\" into a marketing word. It now appears in abstracts whenever a 2D system shows a smooth resistive tail, a curved I–V exponent, or a non-monotonic correlation length — often with no check that any of the defining features actually hold. The trouble is not that these systems are uninteresting; it is that the BKT machinery makes sharp, parameter-free predictions, and labeling a crossover \"BKT\" without those predictions strips the theory of its content. This section catalogues the recurring abuses and lists the diagnostics that separate a genuine BKT transition from a system that merely rhymes with one. The five recurring conflations (i) \"BKT breaks U(1).\" It does not, and cannot — Mermin–Wagner forbids spontaneous breaking of a continuous symmetry in d\\le 2 at T 0. The low-T phase has \\langle e^{i\\theta(0)}e^{-i\\theta(r)}\\rangle \\sim r^{-\\eta(T)} with \\eta(T {\\mathrm{BKT}}^-) = 1/4, but \\langle e^{i\\theta}\\rangle = 0 in the thermodynamic limit on both sides of the transition. The order parameter is not the magnetization; it is the vortex fugacity, or equivalently the helicity modulus, which jumps. Papers that write \"BKT-mediated spontaneous symmetry breaking\" or \"BKT order parameter \\langle\\psi\\rangle\" are using the words wrong [8, 10]. (ii) Sharp transition vs trapped-gas crossover. The Kosterlitz RG predicts an essential singularity, \\xi(T) \\sim \\exp\\!\\big[b/(T-T {\\mathrm{BKT}})^{1/2}\\big] above T {\\mathrm{BKT}}, and a step in the helicity modulus at T {\\mathrm{BKT}} of height 2/\\pi — both statements about the thermodynamic limit. A harmonically trapped 2D gas of \\sim 10^5 atoms has neither: the local density approximation produces a crossover whose width is set by the trap, with vortex pairs unbinding preferentially in the dilute wings. The Hadzibabic et al. experiment was always presented as a \"BKT crossover,\" and the authors were explicit; the secondary literature has not been. Any claim of a \"trapped BKT transition\" should be read as shorthand for \"crossover whose local stiffness, by LDA, crosses the BKT line.\" (iii) Universal dimensionless jump vs a universal numerical value of \\rho s. Nelson–Kosterlitz showed that and from this derived the famous \\rho s/T \\to 3.52\\times 10^{-9}\\,\\mathrm{g\\,cm^{-2}\\,K^{-1}} for ^4He films. The dimensionless statement K=2/\\pi is universal; the dimensional number is not . For Cooper pairs in a thin film the relevant stiffness is the kinetic inductance, and the jump translates into a sheet-resistance discontinuity through T {\\mathrm{BKT}} = (\\pi/2)\\,(\\hbar/2e)^2/\\Lambda(T {\\mathrm{BKT}}^-) with \\Lambda the kinetic-inductance length; the prefactor depends on the pair mass and charge, not on m 4. For dipolar bosons, spinor condensates, or fermionic pair superfluids the kinetic term in the long-wavelength action carries an additional renormalization (see e.g. ) and quoting the ^4He number is meaningless. (iv) BKT vs KTHNY. The Halperin–Nelson–Young construction [22, 23] is two successive defect unbindings — first dislocations (solid \\to hexatic, breaks translational quasi-LRO), then disclinations (hexatic \\to isotropic liquid, breaks orientational quasi-LRO). Each unbinding is governed by a BKT-type RG, but the defect content (vectorial Burgers vector vs scalar disclination charge), the order parameter (e^{i\\mathbf{G}\\cdot\\mathbf{u}} vs e^{6i\\theta}), and the universal jump constants are different. Labeling the entire melting sequence \"the BKT transition\" erases the hexatic phase — exactly the diagnostic object the theory was built to predict, and the one seen in monolayer xenon on graphite and in active-matter melting . (v) \"2D superconductor \\Rightarrow BKT.\" This is the abuse most pervasive in the contemporary literature. The vortex–antivortex interaction in a film of thickness d is logarithmic only out to the Pearl length \\lambda \\perp = 2\\lambda L^2/d. For r \\lambda \\perp the interaction crosses over to 1/r, screening kills the energy–entropy balance, and the Kosterlitz fixed-point structure simply does not apply. The BKT class therefore requires \\lambda \\perp \\gg L (sample size), a condition that fails for most films of NbSe 2, MoS 2, FeSe and the cuprates above tens of nanometers in lateral extent. Minnhagen's review is unambiguous on this; Epstein–Goldman–Kadin's original Hg-Xe experiment explicitly worked in the \\lambda \\perp \\gg L regime. A modern paper that fits R(T) \\sim \\exp[-b/(T-T c)^{1/2}] over half a decade and announces \"BKT\" without quoting \\lambda \\perp/L is reporting a fit, not a transition. A related abuse: invoking BKT for granular or Josephson-junction-array systems with finite self-capacitance, where the duality is between charge and vortex degrees of freedom and the resulting \"inverse BKT\" of dipolar charges is a distinct fixed point in the same universality class only when the capacitance hierarchy is right. The label survives the change of variables; the conditions do not. A diagnostic checklist before saying \"BKT\" A claim of a genuine BKT transition should pass, at minimum, the following: 1. Universal jump in the stiffness. Measure \\rho s(T) (or the kinetic inductance, or the helicity modulus) and verify that it drops to zero from a value satisfying K(T {\\mathrm{BKT}}^-) = 2/\\pi in the appropriate dimensionless units. A continuous decay through zero is not a BKT signature. 2. Logarithmic vortex interaction over the relevant length scale. For a superconducting film, \\lambda \\perp must exceed the sample size or the inter-vortex spacing of interest. For neutral systems, check that the system is genuinely 2D — no out-of-plane phase coherence and no long-range dipolar tail. 3. Nonlinear I–V with the right exponent below T {\\mathrm{BKT}}. V \\sim I^{a(T)} with a(T {\\mathrm{BKT}}^-) = 3 jumping to a = 1 at T {\\mathrm{BKT}}^+ . The jump in a from 3 to 1 is the transport analogue of the stiffness jump. 4. Essential singularity in \\xi(T). A (T-T {\\mathrm{BKT}})^{-1/2} exponent in the log of the correlation length, not a power law. Power-law \\xi means second-order, not BKT. 5. Algebraic correlations below T {\\mathrm{BKT}} with \\eta(T {\\mathrm{BKT}}^-) = 1/4. Directly measurable by matter-wave interference in cold gases and by neutron scattering in layered magnets. 6. No competing relevant perturbation. Z q anisotropies with q\\le 4 are relevant at the BKT fixed point and convert the transition to Ising, three-state Potts, or first-order . The flow diagram in — not the two-line Kosterlitz RG — is what tells you whether your symmetry is generic enough. 7. Thermodynamic limit, or an explicit finite-size analysis. Finite-size scaling at a BKT transition is logarithmic, not power-law in L; the absence of \\ln L corrections in a \"BKT fit\" is itself diagnostic of a crossover . Failing any one of these does not preclude interesting physics. It precludes the name. The unique content of the Kosterlitz–Thouless construction — and the reason the 2016 prize was awarded — is that the transition is sharp, the jump is universal, and the mechanism is topological without symmetry breaking. A 2D system that lacks the jump, the logarithm, or the topological defect is allowed to be many things; it is not allowed to be BKT. Signatures: What Counts as Evidence for a BKT Transition Signatures: What Counts as Evidence for a BKT Transition A BKT transition is not a vibe. It is a specific fixed point of a two-parameter RG flow, and it leaves a small number of quantitative fingerprints that a careful experiment can either confirm or rule out. The §6 catalogue of abuses exists because the literature routinely settles for one weak signature. The right operational standard is the opposite: a claim of BKT should survive several independent tests, each of which has a sharp failure mode. The four primary signatures are: (i) the universal renormalised stiffness jump with the correct microscopic prefactor; (ii) the logarithmic interaction between vortices, accessed through the nonlinear I–V exponent in superconductors or vortex-pair correlations in superfluids; (iii) the essential singularity of \\xi(T) above T {\\rm BKT}; (iv) the anomalous dimension \\eta(T {\\rm BKT}^-) = 1/4 in the correlation function. None of these alone is conclusive. Taken together, with the correct prefactors and the correct failure modes ruled out, they are. 1. The universal stiffness jump — and the prefactor trap The cleanest BKT prediction is Nelson–Kosterlitz : Equivalently, which for ^4He gives the celebrated 3.52\\times 10^{-9}\\,\\mathrm{g\\,cm^{-2}\\,K^{-1}} — verified to within experimental scatter by Bishop–Reppy on adsorbed films. The signature has two parts and both must hold. First , the discontinuity: \\rho s drops from a finite value to zero across a temperature window narrower than the experimental resolution, with no precursor tail at T T {\\rm BKT}. Second , the prefactor : the jump expressed as \\rho s/T must equal 2 m^2 k B / \\pi \\hbar^2 with m the actual mass of the long-wavelength superfluid degree of freedom — m 4 for ^4He, 2 m e for Cooper pairs (with the appropriate kinetic-inductance reduction in dirty films), the polariton mass for microcavity condensates. A 2D superfluid that shows a discontinuity at \\rho s/T a factor of two off from the model-appropriate prediction is not BKT; it is something else with a discontinuity. The Minnhagen review is explicit on this, and §6 already flagged the literature habit of quoting the He number as if it were universal across all 2D superfluids — it is not. Failure modes that look like the jump but are not: (a) the inhomogeneous-broadening tail in a granular film, which mimics a smeared step; (b) finite-thickness 3D crossover, where a non-universal step appears at the bulk T c and is correlated with T c rather than independent of it; (c) trap-averaged \\rho s in cold-atom systems, where local density approximation washes the jump into a finite-width crossover . 2. The logarithmic vortex interaction — accessed via I–V The defining microscopic statement of BKT is that vortices interact as logarithmic Coulomb charges. In a 2D superconductor this becomes directly measurable: vortex-antivortex pairs are dissociated by a transport current acting as an effective electric field on the charges. The dissipation that follows obeys so the universal jump K R(T {\\rm BKT}^-) = 2/\\pi implies a universal jump in the I–V exponent : a leaps from 1 (Ohmic, free vortices) above T {\\rm BKT} to 3 just below, and grows further as T decreases. Epstein, Goldman and Kadin measured exactly this discontinuity in Hg–Xe films; the result is reproduced in countless thin-film studies since [21, 29, 30]. The diagnostic is more demanding than is usually admitted. A genuine BKT signature requires that (i) a(T) extrapolated to T {\\rm BKT} from below hit 3, not 2 or 5; (ii) a(T) remain =1 above T {\\rm BKT} over a finite window — vortex motion must be free, not thermally activated with a smooth Arrhenius tail; (iii) the same T {\\rm BKT} extracted from the a=3 criterion match the T at which the linear resistance vanishes with the essential-singularity form below. A film that satisfies (i) but fails (iii) is showing pair unbinding in a Pearl-screened regime where the logarithmic interaction is cut off at the Pearl length \\lambda \\perp — not BKT in the strict sense, as Minnhagen made explicit and §6 reiterates. 3. The essential singularity in \\xi Above the transition the correlation length diverges not as a power law but as with b predicted by Kosterlitz's RG . This is the most distinctive — and the hardest to confirm — BKT fingerprint. A standard power-law fit \\xi \\sim (T - T {\\rm BKT})^{-\\nu} will always work over a finite window with some effective \\nu {\\rm eff} that drifts with the fit range. The diagnostic test is therefore not \"does a power law fail\" but: does \\ln \\xi extrapolated against (T - T {\\rm BKT})^{-1/2} give a straight line over more than a decade in \\xi, with T {\\rm BKT} consistent with that obtained from the stiffness jump? Hadzibabic et al. showed essential-singularity scaling in a trapped 2D Bose gas via interference-fringe statistics; the crossover width set by the trap limited the dynamical range but the functional form survived. 4. The anomalous dimension \\eta = 1/4 at T {\\rm BKT}^- Below T {\\rm BKT} the order-parameter correlator decays as a power law \\langle \\psi^ (\\mathbf{r})\\psi(0)\\rangle \\sim r^{-\\eta(T)} with so the universal jump K R(T {\\rm BKT}^-) = 2/\\pi implies the universal endpoint \\eta(T {\\rm BKT}^-) = 1/4. In neutron, X-ray, or matter-wave interference experiments this is the slope of the decay at the transition, and in cold-atom interference it controls the central exponent of the fringe-contrast distribution . In KTHNY melting [22, 23] the analogous endpoints are \\eta T(T m) = 1/3 for translational order at the solid–hexatic line and \\eta 6(T i) = 1/4 for orientational order at the hexatic–liquid line — different numbers, same fixed-point structure, and confusing them is one of the standard §6 errors. Composite test: a checklist with teeth Signature Quantitative prediction Common false positive --- --- --- Stiffness jump \\rho s(T {\\rm BKT}^-)/T {\\rm BKT} = 2 m^2 k B/(\\pi\\hbar^2), prefactor model-specific Mean-field-like step with wrong m; granular smearing I–V exponent a(T {\\rm BKT}^-) = 3, a \\to 1 Ohmic above Smooth Arrhenius tail; Pearl-cut log Correlation length \\ln\\xi \\propto (T - T {\\rm BKT})^{-1/2} over \\geq 1 decade Power-law \\nu {\\rm eff} over narrow window Anomalous dimension \\eta(T {\\rm BKT}^-) = 1/4 (vortex), 1/3 / 1/4 (KTHNY) Effective \\eta from finite-size truncation Consistency All four yield the same T {\\rm BKT} Different fits give different T c's The last row is the one that experiments most often skip and the one that most cleanly separates BKT from its impostors. If the stiffness-jump T {\\rm BKT}, the a=3 crossing, the \\xi-extrapolation, and the \\eta=1/4 point do not coincide within error bars, the system is not in the BKT universality class — whatever the abstract claims [15, 11]. A single signature is folklore; the conjunction is evidence. Frontier and Open Problems: Where BKT Physics Still Mutates Frontier and Open Problems: Where BKT Physics Still Mutates Fifty years after Kosterlitz–Thouless, the BKT fixed point is no longer the subject — it is the tool . What is being asked in 2026 is sharper: when does the two-parameter RG of §3 survive coupling to a bath, a dispersion-flat band, a non-Abelian defect, or a third dimension? The answers split cleanly into two piles: open questions where the universality itself is genuinely undecided, and questions whose answers are known but which the literature persists in mislabeling. Driven-dissipative condensates: BKT or a KPZ impostor? The cleanest live controversy concerns exciton-polariton and photon condensates. These are non-equilibrium steady states; the Mermin–Wagner-style absence of a true condensate is even more severe than in equilibrium because gain/loss noise dresses the long-wavelength phase dynamics. Altman, Sieberer and collaborators showed in the 2010s that the long-wavelength phase obeys a compact Kardar–Parisi–Zhang (KPZ) equation, with the consequence that — in the thermodynamic limit — pure algebraic decay of g 1(r) is replaced by stretched-exponential KPZ scaling and the BKT phase is destroyed by vortex production driven by non-equilibrium noise. In a finite system, KPZ roughening is invisible below a system-size crossover, and one recovers BKT-like algebraic correlations. The 2026 status: the Cambridge polariton group reports g 1(r) \\sim r^{-\\alpha(n)} with \\alpha crossing 1/4 at a density that tracks the predicted BKT line in a long-lifetime sample, with the transition driven by interactions rather than by phase ordering (Nat. Commun. Phys. 8, 1 (2025)). Whether this is BKT proper or the finite-size shoulder of the KPZ phase is a genuine open question — the universal jump cannot be measured because there is no superfluid stiffness in a driven system in the same sense; one is reduced to measuring \\alpha(T c) = 1/4, which is necessary but not sufficient. Polariton lattices are the obvious next probe: a polariton supersolid has just been quenched across condensation with apparently Kibble–Zurek scaling [Nat. Commun. 17, 1 (2026)] (arXiv:2512.17362). Free-vortex counts after a fast ramp are the right observable; whether the exponent matches the BKT prediction (below) or the KPZ one is still being settled. Kibble–Zurek across an essential singularity A power-law transition obeys n {\\rm vort} \\propto \\tau Q^{-d\\nu/(1+z\\nu)}. BKT has no power law: \\xi \\sim \\exp[b/(T-T {\\rm BKT})^{1/2}]. The Kibble–Zurek prediction is therefore logarithmic , n {\\rm vort} \\propto (\\ln \\tau Q)^{-2} (Jelic–Cugliandolo, 2011), which is exquisitely hard to distinguish from a slow power law over an experimentally accessible decade in quench rate. The 2024 atomic-Fermi-superfluid measurement (Nat. Phys. 20, 1 (2024)) reports KZ exponents in a 2D unitary gas crossing the BKT line, but the fit is to a power, not to a logarithm — meaning the system is either (i) too small for the BKT divergence to develop, or (ii) probed in a window where the effective behaviour mimics a 3D XY transition. The cold-atom community has not yet produced a quench that distinguishes the two. This is genuinely open. Moiré superconductors and the geometric jump Magic-angle twisted bilayer and trilayer graphene have flat bands whose ordinary band-projected stiffness \\rho s^{\\rm conv} collapses with the Fermi velocity. The superconducting state nevertheless has a nonzero stiffness because the quantum-geometric term — the Fubini–Study metric integrated over the projected Bloch states — gives a lower bound proportional to the Chern number squared (Peotta–Törmä, 2015; Hu, Hofmann, Bergholtz; Verma et al.). Direct kinetic-inductance measurements on magic-angle TBG and on magic-angle TTG (Nature 637, 1 (2025)) extract a stiffness an order of magnitude above the band-theory prediction and a T {\\rm BKT}/T c ratio close to unity, i.e. these are phase -fluctuation-limited superconductors. The open theoretical question is whether the Nelson–Kosterlitz jump \\rho s(T {\\rm BKT}^-)/T {\\rm BKT} = 2/\\pi retains its universal value when most of \\rho s is geometric — naively yes, because the jump argument depends only on the marginal scaling dimension of the vortex fugacity, not on the microscopic origin of the stiffness. Experimentally the jump has been bracketed in TBG, not resolved. Whether disorder, three-band reconstruction, and inter-valley coherence preserve the BKT fixed point in flat bands is unsettled. Frustrated magnets and Z₂ vortices Kawamura–Miyashita's 1980s prediction that triangular and kagome Heisenberg antiferromagnets host Z₂ vortices — not U(1) ones — has been reanimated by Tm- and Yb-based triangular magnets where two transitions bound a BKT-like quasi-LRO regime (TmMgGaO₄, 2020). The distinction matters: in a Z₂ vortex transition the vortex correlation length diverges while the spin correlation length stays finite, the reverse of the standard BKT signature. This is the cleanest case where \"BKT\" in titles refers to a different fixed point. Flebus and collaborators have argued that the magnetic BKT line in van der Waals ferromagnets should be detectable as a magnetoresistance kink — a proposal still awaiting a clean experimental test on a true monolayer (the CrI₃ and CrBr₃ families have weak easy-plane anisotropy that drives them toward Ising rather than XY ). Whether monolayer NiPS₃ or thinned α-RuCl₃ hosts a bona fide magnetic BKT, with the universal stiffness jump rescaled by spin length and exchange, remains open. Layered systems and finite Pearl length: mislabeled, not unknown The largest category of abuse is the routine identification of resistive tails R(T) \\propto \\exp[-b(T-T c)^{-1/2}] in pnictide, cuprate, twisted-graphene, and oxide-interface films with BKT. The criterion that should kill most of these claims is the Pearl length \\Lambda = 2\\lambda \\perp^2/d: only when \\Lambda exceeds the sample size is the vortex interaction logarithmic out to the system boundary . For optimally doped cuprate films and most NbN thin films, \\Lambda \\sim 1–10 μm; once \\Lambda \\lesssim L, vortices interact via a screened (finite-range) potential, the renormalization-group flow is not the Kosterlitz one, and the resistive exponential is not the BKT one. The 2D coplanar Josephson arrays measured by Massarotti et al. are one of the few systems where the Pearl criterion is satisfied and the I–V exponent jumps from 3 to 1 across T {\\rm BKT}; the Weyl-semimetal PtBi₂ surface state is a more recent candidate where the analysis has been carried out properly. These cases are exceptions. The 2D Ising-superconductor MoS₂ , gated TaS₂ , and most layered cuprates do not satisfy the Pearl criterion at their nominal T {\\rm BKT} and the \"BKT\" labels in those abstracts should be read as crossover labels. The physics is not open; the nomenclature is sloppy. What is left Three problems are genuinely live: (i) whether driven-dissipative 2D condensates are BKT or KPZ in the thermodynamic limit, with finite-size crossover masking the answer; (ii) whether the universal jump 2/\\pi survives geometric stiffness, multiband superconductivity, and disorder in moiré flat bands; (iii) whether non-Abelian (Z₂, \\mathbb{RP}^N) vortex unbindings in frustrated magnets constitute a distinct universality class with its own jump invariant or are perturbations of the BKT fixed point. Everything else paraded as a frontier — \"BKT in 3D layered systems\", \"BKT in finite-screening superconductors\", \"BKT crossover in trapped gases\" — is either a well-understood crossover or an answered question with the label attached for marketing. The fixed point is still doing useful work. The word has done too much. Sources: - Coherence of a non-equilibrium polariton condensate across the interaction-mediated phase transition (Nat. Commun. Phys. 2025) - Kibble-Zurek mechanism in a polariton supersolid (arXiv:2512.17362) - Physicists observe Kibble–Zurek scaling in an atomic Fermi superfluid (Nat. Phys. 2024) - Superfluid stiffness of twisted trilayer graphene superconductors (Nature 2024) - Evidence of the BKT phase in a frustrated magnet TmMgGaO₄ - Non-linear I–V characteristics in 2D superconductors: BKT vs inhomogeneity (arXiv:1905.01221) - Directional-dependent BKT transition at EuO/KTaO₃(111) interfaces (arXiv:2604.00608) The AETHER Verdict The AETHER Verdict I have been asked, repeatedly, whether BKT is \"still interesting.\" The honest answer is that the fixed point is closed business — a triumph of 1970s field theory — but the boundary of its applicability is where almost every modern claim gets sloppy. Here is where I plant my flag. (a) What I will defend with my reputation The two-parameter RG of Kosterlitz 1974, in the form refined by José–Kadanoff–Kirkpatrick–Nelson, is correct, complete, and not improvable within its stated assumptions: a 2D system with a single U(1) phase variable, short-range stiffness, point vortices with logarithmic interaction out to the system size, and no coupling to a third dimension. The universal value K(T {\\rm BKT}^-) = 2/\\pi — equivalently \\rho s(T {\\rm BKT}^-)/T {\\rm BKT} = 2/\\pi in the right units — is exact, follows from the marginality of the dipole fugacity, and was confirmed by Bishop–Reppy on ^4He films to a precision that still embarrasses most condensed-matter universality claims. The essential singularity \\xi \\sim \\exp[b/(T-T {\\rm BKT})^{1/2}] is real; it is also, in practice, indistinguishable from a steep power law over any experimentally accessible window, and I will defend that limitation just as firmly. (b) What is shakier than the literature admits Three load-bearing assumptions are routinely smuggled past the reader: 1. The dilute vortex-gas approximation. The Coulomb-gas mapping is controlled only when the fugacity y = e^{-\\beta E c} is small. Near T {\\rm BKT} from above, y is not small, and the two-loop truncation is a matter of faith, not proof. Numerical RG on the full sine-Gordon action shows quantitative — not just qualitative — drift from the Kosterlitz lines. 2. The logarithmic interaction. In thin-film superconductors, the Pearl length \\lambda \\perp = 2\\lambda^2/d cuts off the logarithm. Half the \"BKT in superconductors\" literature ignores whether \\lambda \\perp exceeds the sample. When it does not, the transition is not BKT — it is a finite-range vortex crossover that mimics BKT scaling over a decade in temperature. The I–V exponent jumping through 3 is consistent with this; it is not pr"}</script>

.aka i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px}

<script type="application/json" id="aether-data">{"slug": "the-unbinding-a-dossier-on-the-berezinskiikosterlitzthouless", "topic": "Berezinskii-Kosterlitz-Thouless transition", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "The Unbinding: A Dossier on the Berezinskii–Kosterlitz–Thouless Transition", "subtitle": "Topology without symmetry breaking, and a universal number at the jump", "domain": "statistical mechanics \u0026 thermodynamics", "era": "born 1971-1973; dominant through the 1980s superfluid film era", "why_big": "It established that 2D systems with continuous symmetry, forbidden true long-range order by Mermin-Wagner, can still undergo a genuine thermodynamic transition driven by the unbinding of topological defects. The universal jump in the superfluid density at T_BKT — predicted by Nelson and Kosterlitz and measured by Bishop and Reppy in helium films — remains one of the cleanest quantitative confirmations of a topological phase transition in all of physics.", "abuse": "The label 'BKT' is now slapped on any 2D system showing a smooth crossover or a power-law-ish correlation, often with no test of the universal jump, no check of vortex-pair logarithmic interaction, and no separation from finite-size crossovers in systems that aren't even in the XY universality class.", "date": "June 13, 2026", "ts": 1781406027.435458, "engine": "Claude Code CLI · default model", "aliases": ["Kosterlitz–Thouless transition", "KT transition", "KTB transition", "vortex-unbinding transition", "topological phase transition in the 2D XY model", "Berezinskii transition (Soviet literature, 1970s)"], "origin_story": "BKT did not arrive as a single insight. By 1966 Mermin–Wagner and Hohenberg had proved that a 2D system with continuous symmetry cannot break it at T\u003e0 — yet Stanley and Kaplan's high-temperature series for the 2D planar magnet showed the susceptibility diverging at finite T, an embarrassing contradiction. Wegner (1967) resolved the low-T side: spin-wave analysis of the planar (XY) model gives power-law decaying correlations at every low T, a 'critical line' rather than an ordered phase. The missing ingredient — what destroys this line — was the topological defect. V. L. Berezinskii in two JETP papers (1970/71 classical, 1971/72 quantum) treated vortices explicitly as a logarithmically interacting 2D Coulomb gas and identified the unbinding mechanism, but his analysis stopped short of the renormalization-group flow. Kosterlitz and Thouless, working at Birmingham and unaware of Berezinskii at the time, published a short J. Phys. C letter in 1972 and the canonical long paper in 1973, mapping the problem to a Coulomb gas, identifying the universal stiffness, and — in Kosterlitz's 1974 follow-up — writing the two-coupling RG equations whose unstable fixed point is what we now call T_BKT. Nelson–Kosterlitz (1977) extracted the universal jump ρ_s(T_BKT^-)/T_BKT = 2m^2 k_B/(π ħ^2); Bishop–Reppy (1978) measured it in 4He films within experimental error. The transition has no order parameter and no broken symmetry; it is the proliferation of free topological charge in a 2D Coulomb gas — the first thermodynamic transition of an entirely topological character.", "credit_audit": "Public credit tracks the 2016 Nobel: Kosterlitz and Thouless (Haldane separately for 1D). The historical record is messier. (i) Berezinskii's two JETP papers (received Sept 1970 and June 1971) precede Kosterlitz–Thouless's J. Phys. C letter (received Nov 1972), and contain the vortex-as-Coulomb-charge picture, the logarithmic interaction, and the unbinding mechanism. What they lack — and what is genuinely Kosterlitz–Thouless — is the energy–entropy free-energy argument, the dielectric-constant language, and (in Kosterlitz 1974) the closed RG flow that yields the universal stiffness jump. The 'B' was added to the transition's name in Western literature only in the late 1970s after Soviet visitors and Wegner pointed out the priority. (ii) The 'universal jump' is universally credited to Nelson–Kosterlitz 1977 — correctly. (iii) The 'two-line RG equations' shown in textbooks are usually Kosterlitz 1974 in form but José–Kadanoff–Kirkpatrick–Nelson 1977 in scope (Z_q perturbations, anisotropy). (iv) Mermin–Wagner is often misquoted as forbidding a phase transition; it only forbids spontaneous LRO. (v) The 2016 Nobel committee correctly acknowledged Berezinskii in its scientific background document even though he was deceased and thus ineligible; Kosterlitz's Nobel lecture is unusually generous on this point.", "timeline": [{"year": 1966, "event": "Mermin–Wagner theorem: no spontaneous continuous-symmetry breaking in d≤2 at T\u003e0 — sets up the paradox BKT will resolve.", "who": "N. D. Mermin, H. Wagner", "work": "Phys. Rev. Lett. 17, 1133", "kind": "theory", "ref": 1}, {"year": 1966, "event": "High-T series expansion of the 2D Heisenberg/XY model shows susceptibility diverging at finite T — first hint of a non-LRO transition.", "who": "H. E. Stanley, T. A. Kaplan", "work": "Phys. Rev. Lett. 17, 913", "kind": "observation", "ref": 4}, {"year": 1967, "event": "Spin-wave analysis of the planar classical magnet: correlations decay as power laws at every low T — a 'quasi-long-range' low-T phase.", "who": "F. J. Wegner", "work": "Z. Phys. 206, 465 (in German)", "kind": "theory", "ref": 2}, {"year": 1970, "event": "Kondo problem mapped onto a logarithmic 2D Coulomb gas — same statistical-mechanics structure that BKT will exploit, recognised later by Anderson.", "who": "P. W. Anderson, G. Yuval, D. R. Hamann", "work": "Phys. Rev. B 1, 4464", "kind": "theory", "ref": 11}, {"year": 1971, "event": "Berezinskii I (classical): vortices in the 2D XY/planar rotator treated as a Coulomb gas; unbinding identified as the destruction mechanism of the algebraic phase.", "who": "V. L. Berezinskii", "work": "Sov. Phys. JETP 32, 493 (ZhETF 59, 907, 1970)", "kind": "theory", "ref": 5}, {"year": 1972, "event": "Berezinskii II (quantum): companion paper extending the defect picture to quantum 2D superfluids and 1D quantum chains.", "who": "V. L. Berezinskii", "work": "Sov. Phys. JETP 34, 610 (ZhETF 61, 1144, 1971)", "kind": "theory", "ref": 6}, {"year": 1972, "event": "Short letter announcing the dislocation/vortex-pair picture in 2D solids and superfluids — first appearance of the K-T mechanism in English.", "who": "J. M. Kosterlitz, D. J. Thouless", "work": "J. Phys. C 5, L124", "kind": "theory", "ref": 9}, {"year": 1973, "event": "Long paper: energy–entropy argument T_c ~ πJ/2, free-energy crossing, Coulomb-gas mapping, dielectric-constant language — the canonical BKT paper.", "who": "J. M. Kosterlitz, D. J. Thouless", "work": "J. Phys. C 6, 1181", "kind": "formalization", "ref": 8}, {"year": 1974, "event": "RG equations for fugacity y and stiffness K written down; unstable fixed point on the line 2−πK=0 identified as T_BKT.", "who": "J. M. Kosterlitz", "work": "J. Phys. C 7, 1046", "kind": "formalization", "ref": 10}, {"year": 1975, "event": "Villain model: periodic-Gaussian XY action that makes the Coulomb-gas/sine-Gordon duality exact — the lattice workhorse for all later BKT calculations.", "who": "J. Villain", "work": "J. Phys. (Paris) 36, 581", "kind": "formalization", "ref": 3}, {"year": 1977, "event": "Rigorous RG including symmetry-breaking and Z_q anisotropy perturbations; clarifies relevance/irrelevance around the BKT line.", "who": "J. V. José, L. P. Kadanoff, S. Kirkpatrick, D. R. Nelson", "work": "Phys. Rev. B 16, 1217", "kind": "formalization", "ref": 16}, {"year": 1977, "event": "Universal jump prediction: ρ_s(T_BKT^-)/T_BKT = 2m^2 k_B/(π ħ^2) — a parameter-free number testable in 4He films.", "who": "D. R. Nelson, J. M. Kosterlitz", "work": "Phys. Rev. Lett. 39, 1201", "kind": "theory", "ref": 17}, {"year": 1978, "event": "Torsional-oscillator measurement on adsorbed 4He films confirms the universal jump quantitatively — the cleanest experimental signature of BKT.", "who": "D. J. Bishop, J. D. Reppy", "work": "Phys. Rev. Lett. 40, 1727", "kind": "observation", "ref": 12}, {"year": 1978, "event": "KTHNY melting: two successive BKT-type transitions (dislocation then disclination unbinding) with an intermediate hexatic phase.", "who": "B. I. Halperin, D. R. Nelson; A. P. Young (1979)", "work": "Phys. Rev. Lett. 41, 121 (and Phys. Rev. B 19, 1855)", "kind": "theory", "ref": 19}, {"year": 2006, "event": "BKT-like algebraic-to-exponential correlation crossover and free vortices observed in a 2D trapped 87Rb gas via matter-wave interference.", "who": "Z. Hadzibabic, P. Krüger, M. Cheneau, B. Battelier, J. Dalibard", "work": "Nature 441, 1118", "kind": "observation", "ref": 24}, {"year": 2016, "event": "Nobel Prize in Physics to Thouless, Haldane, Kosterlitz 'for theoretical discoveries of topological phase transitions and topological phases of matter'. Berezinskii (d. 1980) ineligible.", "who": "Royal Swedish Academy of Sciences", "work": "Nobel Prize citation; Kosterlitz Nobel Lecture", "kind": "naming", "ref": 13}], "neglected": [{"name": "Vadim L'vovich Berezinskii (1935–1980)", "role": "Independently — and earlier — derived the vortex-Coulomb-gas picture of the 2D XY transition in two JETP papers (1971, 1972). Died before the 2016 Nobel; his name was attached to the transition only gradually by Western authors through the late 1970s and 1980s. The 'B' in BKT was for years invisible in textbooks.", "evidence": "Sov. Phys. JETP papers themselves; Uspekhi obituary by Dzyaloshinskii, Larkin, Khalatnikov et al.; Kosterlitz's 2016 Nobel lecture explicitly notes that he and Thouless became aware of Berezinskii's prior work only after their 1972/73 papers.", "ref": 5}, {"name": "Franz Wegner", "role": "Showed in 1967 that the 2D planar magnet has algebraic correlations at every low T — the very 'quasi-LRO' phase that BKT later identified as the low-T side of the transition. Often credited to Berezinskii or Kosterlitz–Thouless even though it predates both.", "evidence": "Z. Phys. 206, 465 (1967), in German; cited by Kosterlitz–Thouless 1973 and by all later RMP reviews of the 2D XY model.", "ref": 2}, {"name": "H. Eugene Stanley \u0026 Theodore A. Kaplan", "role": "Provided the 1966 high-T series evidence that something singular happens at finite T in the 2D Heisenberg/XY model — the empirical paradox that motivated Berezinskii and Kosterlitz–Thouless. Almost never named in modern BKT pedagogy.", "evidence": "Phys. Rev. Lett. 17, 913 (1966); cited in the Kosterlitz–Thouless 1973 paper as a primary motivation.", "ref": 4}, {"name": "Jacques Villain", "role": "The 'Villain model' (1975) makes the Coulomb-gas duality of the XY model exact and is the action that virtually every Monte Carlo and analytic BKT calculation actually uses. Routinely written down without attribution.", "evidence": "J. Phys. (Paris) 36, 581 (1975); recognised as the standard form in José et al. 1977 and Minnhagen's 1987 review.", "ref": 3}, {"name": "José, Kadanoff, Kirkpatrick \u0026 Nelson", "role": "Wrote down the RG equations now reproduced in every textbook — including the Z_q symmetry-breaking flows that determine which physical systems are truly in the XY universality class. The two-line 'Kosterlitz RG' appearing in modern courses is essentially theirs.", "evidence": "Phys. Rev. B 16, 1217 (1977); the renormalization flow diagrams in standard references trace to this paper rather than to Kosterlitz 1974.", "ref": 16}, {"name": "Petter Minnhagen", "role": "Synthesised the Coulomb-gas formulation, dynamical scaling, and superconducting-film phenomenology in his 1987 RMP review; the source most working experimentalists actually consult, yet absent from the standard origin myth.", "evidence": "Rev. Mod. Phys. 59, 1001 (1987).", "ref": 23}], "conflations": [{"claim": "Any smooth crossover in a 2D system that 'looks BKT-like' is a BKT transition.", "clarification": "BKT is a sharp thermodynamic transition in the thermodynamic limit with a specific singularity (essential, ξ ~ exp[b/(T−T_BKT)^{1/2}]) and a universal stiffness jump. Trapped, finite, or layered systems generically show a crossover that mimics BKT scaling over a finite window; calling that 'BKT' without checking the jump or the logarithmic vortex interaction is the standard abuse."}, {"claim": "The BKT transition breaks U(1) symmetry.", "clarification": "It does not. Mermin–Wagner forbids it. The low-T phase has algebraic correlations (quasi-LRO) but vanishing order parameter; the transition is the proliferation of free vortices in a Coulomb gas. No symmetry is broken on either side."}, {"claim": "BKT = melting of a 2D solid.", "clarification": "KTHNY melting is two successive BKT-type unbindings — first of dislocations (solid → hexatic), then of disclinations (hexatic → isotropic liquid). The defect content and the order parameters (translational vs orientational) are distinct from the vortex case. Lumping all three under 'BKT' loses the hexatic."}, {"claim": "The universal jump value is a single number that applies everywhere.", "clarification": "The dimensionless jump K(T_BKT^-) = 2/π is universal for the XY model. The physical ρ_s jump depends on the underlying degrees of freedom — bosonic 4He gives 2 m_4^2 k_B/(π ħ^2); for Cooper pairs the mass and charge enter via the kinetic inductance; for dipolar/spinor systems the prefactor changes. Quoting '3.52 × 10^{-9} g cm^{-2} K^{-1}' as universal across all 2D superfluids is wrong."}, {"claim": "BKT is exclusive to the XY model.", "clarification": "The same fixed-point structure governs any system whose effective long-wavelength theory is sine-Gordon at the marginal coupling: 2D neutral superfluids, thin-film superconductors with screening length λ ≫ sample size, the roughening transition, Luttinger liquids at specific Luttinger parameters, Coulomb gases of logarithmically interacting charges. Conversely, 2D superconductors with finite-range vortex interaction (λ_⊥ smaller than system) are NOT in the BKT class even though the literature often labels them so."}, {"claim": "Berezinskii proved the same thing as Kosterlitz–Thouless.", "clarification": "Berezinskii identified the vortex-gas mechanism and the existence of the transition; he did not derive the RG flow or the universal stiffness jump. Kosterlitz (1974) and Nelson–Kosterlitz (1977) did. The fair statement: Berezinskii has priority on the mechanism; Kosterlitz and Thouless have priority on the quantitative theory."}], "sections": [{"id": "origins-and-the-invisible-b", "title": "Origins: The Paradox, the Pioneers, and the Invisible 'B'", "markdown": "## Origins: The Paradox, the Pioneers, and the Invisible 'B'\n\n### The paradox the 1960s left on the table\n\nBy the mid-1960s the statistical mechanics of two-dimensional systems with continuous symmetry had cornered itself into an apparent contradiction. On one side, Mermin and Wagner proved in 1966 that the isotropic Heisenberg model in $d\\le 2$ cannot sustain spontaneous magnetization at any $T\u003e0$ [1]; Hohenberg extended the same argument to Bose and BCS condensates [2]. The proof is a Bogoliubov-inequality bound on the order parameter by the infrared divergence of transverse fluctuations,\n\n$$\\langle S^z\\rangle^2 \\le \\frac{k_B T}{N}\\sum_{\\mathbf k}\\frac{\\text{const}}{\\omega_{\\mathbf k}^2}\\,,$$\n\nwhich for a quadratic spin-wave dispersion $\\omega_{\\mathbf k}\\sim |\\mathbf k|$ diverges as $\\int d^2k/k^2$. No symmetry breaking, full stop.\n\nOn the other side, two strands of evidence said something singular must happen anyway. Stanley and Kaplan, also in 1966, pushed high-temperature series for the susceptibility of the 2D Heisenberg model and found a divergence at a finite temperature [3]. Their result was controversial — the Mermin–Wagner camp read it as the failure of low-order Padé extrapolants rather than a real transition — but the calculation was clean enough that it could not be dismissed. And in 1967 Wegner, in a German-language paper that Western pedagogy has almost completely forgotten, did the spin-wave analysis of the planar (XY) magnet and found that for every $T$ below some scale the correlator decays as\n\n$$\\langle \\mathbf S(\\mathbf r)\\!\\cdot\\!\\mathbf S(0)\\rangle \\sim r^{-\\eta(T)},\\qquad \\eta(T)=\\frac{k_B T}{2\\pi J}\\,,$$\n\na continuum of quasi-long-range-ordered states with no broken symmetry [4]. Wegner's paper is the under-credited fulcrum of the whole story: the algebraic low-$T$ phase that Kosterlitz, Thouless and Berezinskii would later bound from above already existed, in print, in 1967.\n\nThe paradox to be resolved was therefore not \"does a transition exist?\" but \"what is the order parameter of a transition that destroys an algebraic phase without ever creating a symmetry-broken one?\" The 1960s pedagogy was not equipped to answer that question. The answer required treating topological defects — vortices — as the relevant degrees of freedom, and that step was taken, twice and independently, between 1970 and 1972.\n\n### Berezinskii, 1971 and 1972\n\nVadim L'vovich Berezinskii's first JETP paper was received by the journal in September 1970 and published in Russian in ZhETF in 1971; the English translation appeared as Sov. Phys. JETP 32, 493 (1971) [5]. In it he treats the 2D planar rotator (and, with care about the spin-wave subtraction, the 2D XY model) by isolating the vortex configurations of the angle field $\\theta(\\mathbf r)$. A single vortex of integer charge $n$ contributes an energy that grows logarithmically with system size,\n\n$$E_n = \\pi J n^2 \\ln(L/a) + E_c,$$\n\nwhile the configurational entropy of placing it on the lattice also grows as $2\\ln(L/a)$. The free energy $F=E-TS$ changes sign at $k_B T = \\pi J/2$ — a number that, in the Berezinskii paper, already appears as the temperature above which isolated vortices proliferate. Berezinskii goes further: he writes the par
