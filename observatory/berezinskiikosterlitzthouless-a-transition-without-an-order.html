Mattered: A Transition Mermin–Wagner Said Could Not Exist By the close of 1966 the two-dimensional ordering question looked, briefly, closed. Mermin and Wagner had just proved that for short-ranged, rotationally invariant Heisenberg models in d\\leq 2 no finite-temperature spontaneous magnetization is possible, because the would-be Goldstone modes produce an infrared divergence that destroys any putative ordering at every T 0 . Hohenberg, the same year, extended the Bogoliubov 1/k^2 inequality to the off-diagonal long-range order of 2D superfluids and superconductors, killing \\langle\\psi\\rangle\\neq 0 by the same mechanism . The folklore conclusion — repeated for years afterward, never quite stated by the authors themselves — was that thin ⁴He films and thin-film superconductors should have no phase transition at all. That conclusion did not survive contact with the data. In the same volume of Physical Review Letters as Mermin–Wagner, Stanley and Kaplan (Phys. Rev. Lett. 17, 913, 1966) had extrapolated high-temperature susceptibility series for the 2D classical Heisenberg model and found a finite-temperature singularity as robust as the 3D one. Adsorbed-helium experiments, by the late sixties, were beginning to show something that looked uncomfortably like a sharp superfluid onset. Two correct theorems and one obstinate singularity sat side by side, and the question sharpened: what could the system possibly be doing? It could not have a local order parameter at T c. It could not be analytic through T c either, on pain of contradicting the series. Something had to take the role normally played by symmetry breaking, and whatever it was had to be invisible to any field-theoretic argument that averaged \\langle\\psi(0)\\psi^ (r)\\rangle over the full plane. The Soviet line, 1970–71 Vadim L'vovich Berezinskii answered first, in two long JETP papers that the Anglophone community largely did not read. The 1970 paper established that 2D systems with a continuous internal symmetry have a low-temperature phase in which the order parameter correlation decays algebraically — \\langle\\psi^ (0)\\psi(r)\\rangle \\sim r^{-\\eta(T)} — rather than exponentially, and identified the offending topological excitations, vortices in a U(1) field, as the agents that destroy this quasi-long-range order at high temperature. The 1971 sequel carried the same logic into quantum systems, including the 2D Bose gas and planar magnets. Berezinskii's argument was not a renormalization-group calculation; it was a self-consistent spin-wave analysis supplemented by a topological-defect energy–entropy estimate. It contained the entire physical picture: two phases, a vortex-unbinding mechanism, no broken symmetry, no contradiction with Mermin–Wagner because Mermin–Wagner forbids only a finite \\langle\\psi\\rangle, not algebraic decay. The Birmingham line, 1972–73 Kosterlitz and Thouless, working at Birmingham, arrived at the same picture from a different direction and — as Kosterlitz has repeatedly stated, most explicitly in his Nobel Lecture — without knowledge of Berezinskii's papers. Their 1972 letter and the long 1973 paper gave the energy–entropy argument in its now-canonical form: a single vortex on a region of area L^2 costs E = \\pi K \\ln(L/a) and contributes entropy S = 2 k B \\ln(L/a), so F = (\\pi K - 2 k B T)\\ln(L/a) changes sign at k B T c = \\pi K/2. The Birmingham group also gave the Coulomb-gas mapping, the dielectric reinterpretation of screening by tightly bound vortex pairs, and the first inkling of the universal stiffness jump that Nelson and Kosterlitz would sharpen in 1977 to the parameter-free prediction \\rho s(T c^-)/T c = 2 m^2 k B/\\pi\\hbar^2 . The 1974 RG paper then closed the loop with explicit recursion relations for the fugacity y and stiffness K, the essential singularity \\xi\\sim\\exp(b/\\sqrt{T-T c}), and the link to sine-Gordon — a link rigorously controlled later by Fröhlich and Spencer [80, 11]. Thouless learned of Berezinskii's JETP work only when Paul Martin pointed it out during a visit to Paris, after the Birmingham manuscripts were already in motion (Kosterlitz Nobel Lecture, 2016). The translation existed — Soviet Physics JETP had published the English version of in March 1971 — but it was not on the reading lists of the Anglophone statistical-mechanics community, and the parallel discovery proceeded almost cleanly. The retroactive 'B' Berezinskii died of leukemia in 1980, age 45, with his work still largely uncited in the West. Through the 1980s the name \"Kosterlitz–Thouless\" dominated English-language usage; the Soviet-bloc and parts of the European community kept \"Berezinskii\" attached, and Minnhagen's authoritative 1987 review used \"Kosterlitz–Thouless–Berezinskii\" throughout. The \"BKT\" ordering settled in only over the following decade, partly as a courtesy and partly because younger workers had read the JETP papers in translation and recognized what was there. The 2016 Nobel Prize \"for theoretical discoveries of topological phase transitions and topological phases of matter\" went to Thouless, Haldane, and Kosterlitz (Nobel Foundation, 2016); Berezinskii, ineligible posthumously, appears in the scientific background document but not in the citation. The 'B' is now permanent in the name and absent from the prize — an asymmetry the discipline has chosen to live with. What this discovery actually accomplished, before any of the later machinery, was conceptual: it showed that the textbook dichotomy between symmetry-broken phase and disordered phase was incomplete. A third option exists in two dimensions — algebraic order with a temperature-dependent exponent — and the boundary between it and the disordered phase is controlled not by the field \\psi but by the topology of its configurations. Every subsequent extension (KTHNY melting, roughening, dissipative Josephson arrays, 2D Bose gases) is a variation on that single move. The Physics, Properly: Vortex Unbinding, Coulomb Gas, and the Universal Jump The Physics, Properly: Vortex Unbinding, Coulomb Gas, and the Universal Jump Start from the planar rotor lattice Hamiltonian with spins e^{i\\theta i} on the unit circle. The transition is a property of this universality class under: (A1) a single U(1) phase stiffness with no preferred direction; (A2) vortex defects interacting logarithmically over arbitrarily large separations; (A3) a dilute-vortex regime where the fugacity y=e^{-\\beta E c} is small enough to expand around the spin-wave Gaussian; (A4) an order-parameter manifold whose first homotopy gives codimension-2 point defects with \\pi 1(S^1)=\\mathbb{Z} charge; (A5) short-range microscopic couplings, so the bare stiffness is finite; (A6) the thermodynamic homogeneous limit; (A7) no coupling to a 3D ordered bath that would promote quasi-LRO to true LRO; (A8) no quenched disorder or random gauge field that would replace the clean RG flow by a Cardy–Ostlund-type line. Every assumption fails somewhere in the literature, and §3 is built around those failures. Expand \\cos to quadratic order — legitimate at low T by A3 — and split the phase into a smooth piece and a multivalued vortex piece, \\theta(\\mathbf r)=\\theta {sw}(\\mathbf r)+\\theta v(\\mathbf r), with \\oint\\!\\nabla\\theta v\\!\\cdot d\\boldsymbol\\ell = 2\\pi n around each defect. The two sectors decouple in the continuum action: The spin-wave sector alone is a free Gaussian: \\langle e^{i[\\theta {sw}(\\mathbf r)-\\theta {sw}(0)]}\\rangle\\sim (a/r)^{\\eta(T)} with \\eta(T)=1/(2\\pi K). This is the algebraic phase Berezinskii [71,72] identified, and Mermin–Wagner does not forbid it — quasi-long-range order violates no theorem. The vortex sector is the engine. A single +1 vortex in a box of side L costs E 1=\\pi J\\ln(L/a)+E c (by A2 ); its translational entropy is S 1=2k B\\ln(L/a). The free energy of an isolated vortex is the celebrated changing sign at T c^{(0)}=\\pi J/2k B — the Kosterlitz–Thouless energy–entropy estimate [73,74]. Below T c^{(0)} single vortices are suppressed but neutral \\pm pairs survive, because a bound pair has finite energy \\sim 2\\pi J\\ln(d/a) independent of L. The low-T phase is a vortex dielectric ; the high-T phase is a plasma . This is the Coulomb-gas mapping: vortices of charge n i\\in\\mathbb Z interact via U {ij}=-2\\pi J n i n j\\ln(r {ij}/a), with overall neutrality enforced by A6 . Villain's periodic-Gaussian rewriting (1975) makes the mapping exact, and a duality (sine-Gordon) brings the partition function to the form on which José, Kadanoff, Kirkpatrick, and Nelson founded the modern RG analysis and which Fröhlich and Spencer [11,80] turned into a rigorous proof that the dipole and plasma phases are thermodynamically distinct. Figure: Kosterlitz RG flow in the (K^{-1},y) plane. The y=0 axis below \\pi/2 is a line of Gaussian fixed points (algebraic phase). Trajectories enter the BKT fixed point along the incoming separatrix; across it y runs to strong coupling and vortices proliferate, screening the stiffness to zero. Linearizing the sine-Gordon action around small y gives Kosterlitz's recursion with conserved hyperbola C=(\\pi K-2)^2-(4\\pi^2 y)^2. The separatrix C=0 entering the fixed point (K R^{-1},y)=(\\pi/2,0) defines T c. Above it y runs to strong coupling and a correlation length condenses with the trademark essential singularity not the algebraic t ^{-\\nu} of any Landau transition. This is A2 in disguise: only a marginally relevant operator can produce \\exp(b/\\sqrt t). The fixed-point value \\pi K R(T c^-)=2 is parameter-free: regardless of J, lattice geometry, or vortex-core details (so long as A1–A6 hold), the renormalized stiffness jumps from 2k B T c/\\pi to zero as T crosses T c from below. Translated to the superfluid ^4He film by Nelson and Kosterlitz , and to the two-point exponent \\eta(T c^-)=1/(2\\pi K R)=1/4. The universal jump and \\eta=1/4 are the two non-negotiable quantitative predictions of the theory; everything in §4 is graded against them. Bishop and Reppy saw the jump within a year; Epstein, Goldman, and Kadin saw the I–V exponent jump from 1 to 3 in superconducting films three years later; Hadzibabic et al. saw a crossover version in a trapped Bose gas — each test polluted, in its own way, by the failure of one of A6–A8 . Strict Conditions \u0026 Failure Modes: Where Each Assumption Breaks Strict Conditions \u0026 Failure Modes: Where Each Assumption Breaks The BKT scenario is a tightly conditional theorem, not a universal phenomenon. The recursion relations of , the universal jump of , and the rigorous dipole-phase proof of all rest on a stack of assumptions that the literature labels variously but which we collect here as A1–A8. Drop any one and the physics changes — sometimes into a nearby BKT-like variant, sometimes into an entirely different universality class. A1 — Exact U(1) (XY) symmetry of the stiffness. The vortex/spin-wave separation requires that the rotor live on S^1 with no preferred direction. Add a p-fold anisotropy -h p\\cos(p\\theta) and the analysis of shows that h p has scaling dimension 2 - p^2/(4\\pi K), becoming relevant at K p = p^2/8\\pi. For p=2,3,4 (Z 2 Ising, Z 3 Potts, Z 4 clock) the anisotropy is relevant throughout the would-be BKT phase and one recovers a single transition in the Ising/Potts/Ashkin–Teller universality class. For p\\geq 5 the anisotropy is irrelevant near T {\\rm BKT} but relevant near T=0, producing two BKT-like transitions bracketing a critical XY phase — a fact already visible in and revisited recently in for small lattices. The q=5 boundary is sharp; q=4 gives the Ashkin–Teller line, not BKT. A2 — Logarithmic vortex interaction, i.e., short-ranged microscopic couplings. The Coulomb-gas mapping requires V(r)\\sim -\\pi K\\ln(r/a). Two physically important deformations break this: - Dipolar in-plane couplings (planar magnets, tilted polar molecules) decay as 1/r^3 and screen the vortex log at long distances; Maier–Saalfrank–type analyses replace BKT by a true long-range-ordered phase with Ising-like critical exponents, since the Mermin–Wagner obstruction itself is lifted. - Charged 2D superfluids — i.e., real thin-film superconductors — feel the Pearl length \\lambda \\perp = 2\\lambda^2/d . For r\\ll\\lambda \\perp the interaction is logarithmic and BKT applies; for r\\gg\\lambda \\perp it crosses over to 1/r and unbinding becomes a finite-size, system-shape-dependent affair. A clean BKT transition in a thin film therefore requires L\\ll\\lambda \\perp, a condition routinely violated and routinely ignored in the cuprate literature. A3 — Vortex core energy small enough to keep the transition continuous. The standard recursion linearises around small fugacity y=e^{-E c/k BT}. If E c is large the dilute-gas expansion fails and one slides onto the Minnhagen line : the transition becomes first-order in the (K^{-1}, y) plane, with a jump in \\rho s exceeding the universal 2/\\pi. Josephson-junction arrays with significant charging energy sit close to this line, and several experimental \"anomalously large\" jumps reported as BKT are actually weakly first-order Minnhagen crossings. A4 — Stable point-vortex defects, i.e., \\pi 1(\\mathcal M)=\\mathbb Z. For O(n) models with n\\geq 3 the order parameter manifold is S^{n-1} and \\pi 1(S^{n-1})=0: vortices can be continuously unwound through the third component. The n=3 Heisenberg model therefore has no BKT transition; asymptotic freedom drives \\xi\\sim\\exp(2\\pi/T) with no finite-T singularity, as the high-precision RG of confirms. XXZ anisotropy restores BKT only once the easy-plane gap exceeds the residual out-of-plane fluctuations. A5 — Short-range XY coupling. Long-range ferromagnetic XY models J {ij}\\propto 1/r^{d+\\sigma} in d=2 undergo a true symmetry-breaking transition for \\sigma\u003c2 (mean-field above \\sigma=4/3, non-trivial in between) and reduce to BKT only at \\sigma=2, where the interaction is marginal and logarithmic corrections appear. The often-quoted statement \"2D XY = BKT\" silently assumes \\sigma 2. A6 — Thermodynamic limit / homogeneous medium. In a harmonic trap of frequency \\omega the local phase-space density n\\lambda {\\rm dB}^2 varies across the cloud, so a sharp transition is replaced by a crossover : the central region develops BKT-type quasi-long-range coherence while the wings remain thermal. observed this directly via interference fringe dislocations; the local-density approximation gives T {\\rm BKT}(r) = T {\\rm BKT}^{\\rm hom}[n(r)], smearing the stiffness jump over a shell of width \\sim k BT/m\\omega^2 r. Calling such data a \"BKT transition\" without qualifying crossover is the most common modern abuse. A7 — Strict two-dimensionality. Stacked films of thickness N layers with interlayer coupling J \\perp undergo a dimensional crossover at the scale \\xi {\\rm BKT}(T)\\sim a\\exp(b/\\sqrt{T-T {\\rm BKT}})\\sim (J/J \\perp)^{1/2} : above this length 3D XY universality takes over, with \\nu\\approx 0.67 and a genuine \\langle\\psi\\rangle\\neq 0. Many \"BKT in YBCO\" claims live in this crossover window — the I–V exponent a(T) shows a jump-like feature, but the universal a=3 at T {\\rm BKT} is rounded by the 3D coupling. A8 — Quenched disorder weak / no random vector potential. Adding a random phase A {ij} to the XY Hamiltonian (gauge glass; vortex-pinning arrays) takes one to the Cardy–Ostlund line : for disorder strength \\sigma^2\u003c\\pi/8 the BKT phase survives with disorder-renormalised stiffness, but at \\sigma^2=\\pi/8 a marginal glass phase opens, with \\langle\\cos\\theta\\rangle\\sim r^{-\\eta(T,\\sigma)} where \\eta acquires \\ln^2 r corrections. Beyond this line the transition is destroyed and replaced by a Bragg-glass-like state. Flux-noise experiments on disordered Josephson arrays sit suspiciously near this boundary. Each violation has a textbook signature; together they explain why \"BKT\" claims in the 2D-materials literature [49, 59, 65] survive scrutiny far less often than the citation count suggests. Signatures: Smoking Guns vs. Circumstantial Evidence Signatures: Smoking Guns vs. Circumstantial Evidence A BKT identification rests on a hierarchy of evidence. At the top sit predictions that are quantitative, parameter-free, and inconsistent with any competing scenario in the relevant universality class — the universal jump, the discontinuous nonlinear-I–V exponent, the essential singularity, and the off-T c specific-heat peak. Below them lies a thicker layer of suggestive but ambiguous data: algebraic correlations, interference contrasts, resistive tails. The latter are routinely conflated with the former in the recent literature, and the distinction is what separates a BKT system from a system that merely looks like one in a finite window. Smoking guns (i) The universal jump in superfluid stiffness. Nelson and Kosterlitz showed that the RG flow of forces No microscopic parameter enters. Bishop and Reppy verified the prediction within a year using a torsional oscillator (not third sound — that was the Rudnick group's parallel approach; Bishop–Reppy measured the period shift of an adsorbed-film Andronikashvili pendulum), recovering the universal slope to within a few percent across film coverages spanning more than a decade. The frequency dependence of the apparent jump — predicted by Ambegaokar–Halperin–Nelson–Siggia from vortex-diffusion dynamics — is the cleanest discriminator against an inhomogeneous-T c artefact: a real BKT jump narrows logarithmically with \\omega, while a distribution of local T c's gives an \\omega-independent smearing. Figure: the Nelson–Kosterlitz universal jump. The renormalized stiffness (green) decreases smoothly, must terminate on the universal line \\rho s/T = 2 m^{2} k B / \\pi \\hbar^{2} (orange) at T {\\mathrm{BKT}}, and drops discontinuously to zero. The intercept — not the curve's shape — is parameter-free. (ii) Discontinuous nonlinear-I–V exponent in films. In thin-film superconductors and Josephson arrays the same RG predicts V \\propto I^{a(T)} with a(T {\\mathrm{BKT}}^{-}) = 3, a(T {\\mathrm{BKT}}^{+}) = 1 — a discontinuous step from cubic to ohmic at the transition. Epstein, Goldman, and Kadin resolved exactly this step in Hg–Xe films, with a(T) rising smoothly through 3 just below T {\\mathrm{BKT}}. The step is robust because a = 1 + \\pi K R inherits the universal jump in K R; a finite-size or weak-link scenario yields a continuous a(T) that crosses 3 without a kink. (iii) Kosterlitz essential singularity. The recursion relations of give with no power-law prefactor. Above T {\\mathrm{BKT}} the sheet resistance inherits the same form, R \\square(T) \\propto \\xi^{-2}. A Halperin–Nelson plot of [\\ln(R 0/R)]^{-2} vs. T should be linear and extrapolate to T {\\mathrm{BKT}}. Any system where this plot curves over many decades is either not BKT or is sitting in the crossover region where conventional fluctuation corrections still dominate. (iv) Specific-heat peak above T {\\mathrm{BKT}}. Monte Carlo and series work, summarized in Minnhagen and confirmed in modern simulations, place the broad C V maximum at T \\approx 1.17\\,T {\\mathrm{BKT}}, not at T {\\mathrm{BKT}} — the entropy of liberated vortices is released after the transition. The peak is non-singular (BKT is infinite-order); the diagnostic is the offset , which is incompatible with Ising (C V diverges at T c) or 3D-XY (\\alpha \u003c 0, weak cusp at T c). A coincidence of T {C V^{\\max}} with the apparent transition temperature is therefore evidence against BKT, not for it. Circumstantial, imposter-prone Algebraic g 1(r) and interference-contrast scaling. The low-T correlator g 1(r) \\sim r^{-\\eta(T)} with \\eta(T {\\mathrm{BKT}}^{-}) = 1/4 is genuinely BKT, but a finite-size XY system or any sufficiently large 2D Bose cloud shows apparent power-law decay over the accessible range regardless of regime. The Hadzibabic et al. trapped-gas experiment is the textbook example: the interference-contrast exponent does cross 1/4, but the inhomogeneous trap turns the transition into a crossover — distinct rings of the cloud cross threshold at different T. The discriminator is the jump in \\eta (sharp in a homogeneous box trap, smeared in a harmonic trap), not the value itself. Resistive broadening in films. A broadened R(T) tail is the most overused BKT signature and the weakest. Imposters proliferate: granular weak-link networks (percolative tail), inhomogeneous T c distributions (Gaussian smearing), thermally activated phase slips (\\ln R \\propto 1/T), and ordinary 3D fluctuation tails (Aslamazov–Larkin power law). The Halperin–Nelson exponential form is the discriminator; in its absence the claim is decorative. Vortex visualization, magnetic noise, third-sound velocity dips. Each is suggestive when present; none is parameter-free. A BKT identification that rests only on these without the universal jump or the a(T) step should be read as a working hypothesis. The honest summary: a BKT claim that does not pin at least one of (i), (ii), or (iii) quantitatively — with the predicted absolute value, not just the predicted functional shape — is circumstantial. Modern papers that label any 2D thermal crossover \"BKT\" because g 1(r) looks straight on a log–log plot have inverted the evidentiary order Kosterlitz–Thouless themselves insisted on in . Sources: - Thin Films of Quantum Fluids: History, Phase Transitions, and Wetting (J. Low Temp. Phys.) - Study of the Superfluid Transition in Two-Dimensional Films (Bishop \u0026 Reppy 1978) - Specific-heat anomaly in the 2D XY / lattice sine-Gordon model - Observation of first and second sound in a BKT superfluid (Nature 2021) Use \u0026 Abuse: How 'BKT' Became a Decoration Use \u0026 Abuse: How 'BKT' Became a Decoration The BKT label has become one of those words that adds gravitas to a paper for free, much like \"emergent\" or \"topological\". The cost of that inflation is that genuine BKT physics — a sharp, parameter-free, falsifiable prediction — gets diluted into a vague pattern-match. Section 3 listed the prerequisites; this section catalogs the modal failures. The universal jump, unmeasured The clearest tell. A paper reports a \"BKT transition\" yet never extracts K(T c^-) = 2/\\pi, or extracts a value far from 2/\\pi and proceeds as if nothing happened. The universal jump is the only parameter-free signature distinguishing BKT from any other smooth crossover. If a manuscript identifies T {\\rm BKT} by where the susceptibility peaks, by an inflection of \\xi(T), by a kink in the specific heat, or by visual fitting of correlation functions to power laws — without quantitatively verifying \\rho s(T c^-)/T c = 2 m^2 k B / \\pi \\hbar^2 — the identification is circumstantial at best, decorative at worst. Stronger version of the same disease: the universal jump appears in the renormalized stiffness, and only after the Kosterlitz–Nelson matching condition is solved self-consistently with finite-size corrections . Bare stiffness at finite L generically misses 2/\\pi by an amount that vanishes only as 1/\\ln L. Papers that report a clean 2/\\pi jump from raw Monte Carlo at L=64 without the logarithmic correction are claiming what the data cannot support. Wrong universality class Invoking BKT in systems lacking the required continuous U(1) stiffness. - Ising-anisotropic XY magnets. Easy-axis anisotropy is relevant; it gaps the Goldstone mode and drives the transition to 2D Ising. The BKT recursion flows off the fixed line as soon as h z \\neq 0. \"BKT-like\" still gets attached to easy-plane magnets where the measured exponents are Ising. - q-state clock and Potts models. The clock model has two BKT transitions only for q \\geq 5 ; for q \\leq 4 the symmetry breaking is conventional. Claims of \"BKT\" in 3- and 4-state clock systems mistake a critical-line artifact for a topological transition. - Inverted-BKT confusions. Annealed networks and certain Potts variants exhibit essential singularities mimicking BKT scaling , but the mechanism — graph reconnection, not vortex unbinding — has no Coulomb-gas mapping. Shared functional form \\xi \\sim \\exp(b/\\sqrt{t}) is not a sufficient diagnosis. Finite-size ventriloquism BKT correlation lengths diverge as \\xi \\sim \\exp(b/\\sqrt{t}), so \\xi exceeds any accessible box for a finite window of T T c. Inside that window the system looks critical. The honest tests — Weber–Minnhagen scaling, Binder-cumulant crossings against analytic predictions, helicity modulus matched to the Kosterlitz–Nelson recursion — are straightforward. The dishonest substitute, fitting one curve to r^{-\\eta} at one L, has flooded the literature, particularly in 2D quantum simulations where the physical \\xi would exceed the Hubble radius. Topology, the wrong kind Since 2016 the word \"topological\" routes attention toward Chern numbers, edge modes, and gapped band invariants. BKT is topological in a different sense: \\pi 1(S^1) = \\mathbb{Z} vortex defects, no bulk gap, no protected boundary. Conflating the two — visible in popular accounts and even some review articles after the Thouless–Haldane–Kosterlitz Nobel — treats \"BKT\" and \"topological insulator\" as cousins. They share a homotopy-theoretic flavor and nothing else. A BKT transition has no quantized response, no symmetry-protected anomaly, no bulk-boundary correspondence. KTHNY squeezed into one transition Two-dimensional melting is two unbinding transitions : dislocations unbind at T m producing the hexatic; disclinations unbind at T i T m producing the isotropic liquid. The intermediate hexatic has algebraic orientational order, short-range translational order, and its own universal jump in the Frank constant. Active-matter and colloidal studies occasionally report \"BKT melting\" as a single transition ; if no hexatic window is resolved, the claim is either premature or wrong. The absence of a hexatic phase in a continuous-melting system would itself be a discovery — it should be argued, not assumed. Trapped Bose gases: crossover sold as transition The trapped 2D Bose gas is inhomogeneous: chemical potential varies with radius, density is a smooth profile, and the criterion n \\lambda^2 \\approx \\mathcal{D} is met first in the cloud center. What is measured is therefore a crossover — the seminal Hadzibabic experiment was explicit about this . Subsequent papers occasionally drop the qualifier and report a \"BKT phase transition\" in a harmonic trap. The thermodynamic transition statement is rigorous only in the homogeneous (box-trapped) 2D limit. Superconducting films: the a=3 misuse The Halperin–Nelson prediction is that the nonlinear I–V exponent a(T) jumps from 1 to 3 at T {\\rm BKT} . Two abuses recur. First, fitting power laws to I–V curves where a(T) never crosses 3 — typically because flux-flow or vortex-pinning channels dominate — and still labeling the inflection \"BKT\". Second, identifying T {\\rm BKT} by where a(T) = 3 but reporting a different temperature T^ for the resistive transition without addressing the discrepancy. The two must coincide within the BKT scenario; if they don't, either the scenario fails or finite-frequency and inhomogeneity corrections must be modeled, not waved away. Linguistic tells of a hollow claim A short field guide. Phrases that should trigger skepticism: - \" BKT-like behavior\" — without specifying which feature is BKT and which is \"like\". - \" Consistent with BKT\" — one observable in one regime; the harder predictions go unchecked. - \" Vortex-mediated transition\" — vortex cores are everywhere in an XY model; the question is whether they unbind at T c, not whether they exist. - \" Power-law correlations \" reported at one temperature, one system size, with no \\eta(T) continuity check. - \" Essential-singularity scaling \" extracted from three data points and a two-parameter fit. - \" Topological \" used adjectivally without disclosing which \\pi n is at work. - \" BKT crossover \" used interchangeably with \" BKT transition \" in the abstract and conclusions of the same paper. The healthy alternative is the believer's checklist of §6: universal jump, essential singularity, \\eta(T c^-) = 1/4, dynamical scaling, finite-size collapse consistent with the Kosterlitz RG. A paper meeting three of those is making a claim worth defending. A paper meeting none is using \"BKT\" as ornament. Status \u0026 the Believer's Checklist Status \u0026 the Believer's Checklist Four decades after Nelson–Kosterlitz and Bishop–Reppy , the BKT transition sits in an unusual position: it is one of the most precisely tested predictions in equilibrium statistical mechanics, and one of the most casually invoked. In its native habitat — homogeneous, strictly two-dimensional systems with a single U(1) stiffness — the theory is canonical and quantitatively closed. The universal jump \\rho s(T c^-)/T c = 2m^2k B/\\pi\\hbar^2 has been verified in ⁴He films to better than a percent ; the Coulomb-gas RG of [75,78] and the rigorous dipole-phase proof of together constitute a complete theoretical edifice; large-scale Monte Carlo on the planar rotor reproduces T {\\rm BKT}/J \\approx 0.8929 with the predicted essential singularity. Inside this canonical zone — superfluid ⁴He films, ultrathin amorphous superconductors of the InO/NbN family, classical Josephson-junction arrays [10,20], and XY-symmetric lattice simulations — \"BKT\" is a load-bearing identification. Outside it, the label has metastasized. Two communities are the principal sites of mutation. The first is ultracold atoms: trapped 2D Bose gases , polariton condensates , and 2D Fermi gases in the crossover regime are routinely tagged \"BKT\" on the basis of interference contrast, momentum-distribution sharpening, or coherence-length growth alone. None of these is a clean stand-in for the stiffness jump; trap inhomogeneity means the system passes through a crossover in local phase-space density, and the universal jump is recovered only after careful LDA deconvolution or a flat-bottom box. The second is two-dimensional moiré and van der Waals superconductivity. Magic-angle graphene [46,53], gated MoS₂ , CVD NbSe₂ , thin TaS₂ , and Mo₂C have all generated \"BKT\" claims, often resting solely on an R(T) tail fitted to Halperin–Nelson resistivity, or on an exponent a(T) that crosses three somewhere near the resistive transition. The fit is usually consistent with BKT and rarely exclusive of inhomogeneous broadening, percolation, or paraconductivity. Magnetic 2D materials [49,60] and active-matter melting have produced both rigorous and decorative uses; most KTHNY claims in colloidal or active systems fail the two-step requirement of . Against this backdrop, AETHER will take a BKT identification seriously when, and only when, it passes the following ten-point audit. 1. Order-parameter manifold. Identify the U(1) (or larger continuous Abelian) target manifold of the would-be order parameter and the microscopic stiffness K associated with it. Discrete (\\mathbb{Z} n) or non-Abelian symmetries demand a derived effective XY description with named cutoffs, not assumed. 2. Logarithmic defect interaction. Demonstrate, not assume, that the elementary topological defects interact logarithmically at the relevant length scales. Screening from itinerant carriers, finite Pearl length \\lambda \\perp in a real superconducting film, or 3D coupling all cut off the logarithm and abolish the transition; show the regime of validity explicitly . 3. Universal jump in \\rho s. Measure the superfluid (or superconducting) phase stiffness directly — third sound, torsional oscillator, mutual inductance, kinetic-inductance microwave — and show the discontinuity to 2T c/\\pi within Minnhagen / Weber–Minnhagen finite-size corrections [3,82]. An R(T) tail fit is not a stiffness measurement. 4. Essential singularity in \\xi(T). Fit the correlation length above T c to \\xi \\sim \\exp(b/\\sqrt{T-T c}), not to t ^{-\\nu}. A successful power-law fit over a decade is evidence against BKT, not for it. 5. Anomalous exponent at the transition. Show \\eta(T c^-) = 1/4 in the two-point correlator, either directly (scattering, interference) or via the dynamical exponent a(T c^-) = 3. 6. Nonlinear I–V jump (or analogue). For charged systems, document the jump in a(T) from 1 above to 3 just below T {\\rm BKT}, as in . In neutral analogues, show the equivalent dynamic scaling of vortex pair lifetime. 7. Imposter exclusion. Rule out, by independent diagnostics, Ising (Z 2 symmetry, logarithmic specific-heat divergence), 3D-XY (power-law \\xi, \\nu \\approx 0.67), percolation (geometric thresholds, fractal cluster statistics), and inhomogeneous broadening (spatial maps of T c, finite-frequency stiffness). Without this, a BKT-consistent R(T) proves nothing. 8. Trapped systems: local vs. global. For atomic and polariton gases, separate the local quasi-condensate crossover, governed by phase-space density at the trap centre, from the thermodynamic statement, which requires a box potential or quantitative LDA deconvolution. Do not call a crossover a transition. 9. KTHNY claims require two transitions. Any \"2D melting via BKT\" claim must exhibit both a dislocation-unbinding transition (universal Young-modulus jump) and a disclination-unbinding transition (Frank-constant jump), with a measurable hexatic window between them. A single broadened transition is melting, not KTHNY. 10. Cite Berezinskii. Reference [71,72] — not as historical decoration, but because the quantum extension in is the part of the theory the cold-atom and superconducting-thin-film communities now rely on. Authors who write \"Kosterlitz–Thouless\" in 2026 are signalling that they have not read the literature they are extending. A paper that clears items 1–9 is doing BKT physics. A paper that also clears item 10 is doing it honestly. The AETHER Verdict The AETHER Verdict I have spent enough time inside this literature to know which claims I would walk into a seminar and defend, and which ones the community repeats out of habit. Here is where I stand. What I will defend with my reputation The universal jump is real, it is 2/\\pi in the dimensionless stiffness K = \\hbar^2\\rho s/(m^2 k B T), and it is the only clean experimental fingerprint of BKT that no competing scenario reproduces without fine-tuning. Bishop and Reppy's torsional-oscillator data on ^4He films , combined with the Nelson–Kosterlitz prediction , is one of the half-dozen most precise parameter-free confrontations between theory and experiment in condensed matter — on par with the quantized Hall conductance and the Josephson frequency. I will also defend, without hedging, the Fröhlich–Spencer result that the 2D XY model has a genuine thermodynamic transition in the infinite-volume limit; the \"it's all a crossover\" objection one still hears from skeptical mathematicians was settled in 1981 and people should stop relitigating it. What is shakier than the literature admits Three things, named specifically. First, the recursion relations are derived under the diluteness assumption — vortex fugacity y \\ll 1 — and are then extrapolated, in essentially every modern paper I read, into regimes where y \\sim O(1). The flow near the separatrix is quantitatively trusted far beyond its derivational warrant; the \"universal\" jump survives because it is a fixed-point statement, but non-universal amplitudes routinely quoted from one-loop Kosterlitz RG are not entitled to the precision claimed. Second, the identification of cold-atom and exciton-polariton experiments as \"observing BKT\" rests on a quiet conflation, already flagged in our table: a harmonically trapped 2D gas is inhomogeneous, the local stiffness varies across the cloud, and what is measured is a regional crossover. The Hadzibabic interferogram is beautiful and consistent with BKT physics, but it is not a measurement of the universal jump, and the field should stop pretending otherwise. Third, the case for BKT in 2D superconducting films is weaker than the textbooks let on. Disorder generates random gauge fields that couple to the vortex sector, and the resulting Cardy–Ostlund / random-XY problem has a glassy low-T phase whose relation to the clean BKT fixed point is still not fully understood — Giamarchi–Le Doussal is the honest reference here, not Halperin–Nelson. Three open questions I would actually work on 1. The driven-dissipative jump. Does the 2/\\pi value survive in exciton-polariton condensates, where detailed balance is broken? I think the answer is no in general, yes in a fine-tuned limit — and settling this would expose the thermodynamic content of the jump. 2. Disordered BKT in real superconducting films. A clean experimental separation of the clean-BKT exponent from the Cardy–Ostlund glassy correction is still missing; this is doable with current InO x or NbN samples. 3. Two-step melting at the universal-jump level. KTHNY predicts two universal jumps (Young modulus, Frank constant); only the first has been measured cleanly. The hexatic-to-isotropic jump in the Frank constant is, to my reading, still circumstantial. Reading path 1. [Berezinskii 1971] — read first, in the original JETP, to see vortices identified as the destruction mechanism before any RG language existed. 2. [Kosterlitz–Thouless 1973] — the paper everyone cites; read it for the physical argument, not the recursion relations (those come later). 3. [Kosterlitz 1974] — the actual RG; note the diluteness assumption explicitly. 4. [Nelson–Kosterlitz 1977] — the universal jump; the cleanest prediction in the entire subject. 5. [Minnhagen, Rev. Mod. Phys. 1987] — the review that re-attached Berezinskii's name and remains the most honest synthesis of what is and is not established."}</script>
