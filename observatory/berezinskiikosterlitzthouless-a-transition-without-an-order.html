 group did not know of the JETP papers until after submission.", "ref": null}, {"name": "Herbert Wagner and N. David Mermin", "role": "Their 1966 no-go theorem is the negative result the BKT theory *requires* — without Mermin–Wagner there would be no puzzle about what transition can survive in 2D. Routinely cited but rarely framed as part of the BKT discovery arc.", "evidence": "Mermin–Wagner, Phys. Rev. Lett. 17, 1133 (1966); cited in the introduction of Kosterlitz–Thouless (1973).", "ref": null}, {"name": "Pierre C. Hohenberg", "role": "Independently proved the no-go for 2D superfluids/superconductors (1967), making the BKT prediction for ⁴He films physically nontrivial.", "evidence": "Hohenberg, Phys. Rev. 158, 383 (1967).", "ref": null}, {"name": "Jacques Villain", "role": "Introduced the 'Villain model' (1975) — a periodic Gaussian rewriting of XY that makes the Coulomb-gas / sine-Gordon mapping exact and underlies essentially every modern RG treatment of BKT. Often invoked anonymously.", "evidence": "Villain, J. Phys. (Paris) 36, 581 (1975).", "ref": null}, {"name": "H. Eugene Stanley and Theodore A. Kaplan", "role": "Their 1966 high-temperature series for the 2D Heisenberg model gave the first numerical hint of a finite-T singularity in a model where Mermin–Wagner forbade conventional ordering — a key empirical motivator for Berezinskii and KT.", "evidence": "Stanley \u0026 Kaplan, Phys. Rev. Lett. 17, 913 (1966); discussed in Kosterlitz–Thouless 1973 introduction.", "ref": null}, {"name": "Pierre-Gilles de Gennes (and the 'roughening' community)", "role": "Independently identified analogous logarithmic-interaction unbinding transitions (crystal-surface roughening; Chui–Weeks 1976) that are mathematically identical to BKT but historically developed in parallel without citation crosstalk.", "evidence": "Chui \u0026 Weeks, Phys. Rev. B 14, 4978 (1976); Beijeren \u0026 Nolden review (1987).", "ref": null}], "conflations": [{"claim": "Any 2D system showing a smooth crossover into power-law-looking correlations is 'BKT'.", "clarification": "BKT requires (i) a U(1) / XY-symmetric stiffness, (ii) logarithmically interacting topological defects (vortices/charges), (iii) an essential singularity ξ ∼ exp(b/√(T−T_c)) rather than algebraic ξ ∼ |t|⁻ν, and (iv) the universal jump 2/π in K = ℏ²ρ_s/(m²k_B T). Without these, what one sees is a finite-size crossover, often in a non-XY universality class (Ising, q-state clock for q≥5 has *two* BKT-like transitions, etc.)."}, {"claim": "BKT is a 'topological phase transition' in the modern sense of topological band theory.", "clarification": "BKT is topological in the homotopy sense — π₁(S¹)=ℤ vortices unbind — but it has no bulk gap, no Berry-curvature invariant, and no protected edge modes. The 2016 Nobel citation bundles it with Chern/Haldane physics, but the only common word is 'topology' applied to very different mathematical objects."}, {"claim": "BKT means 'no order parameter, no symmetry breaking, ever'.", "clarification": "It means no *local* order parameter develops a finite expectation value, but the low-T phase has quasi-long-range order: the two-point function decays as r^{−η(T)} with η continuous and η(T_c⁻)=1/4. The transition is detected by the stiffness jump and by the change from power-law to exponential decay, not by ⟨ψ⟩."}, {"claim": "Berezinskii proved the same thing as Kosterlitz–Thouless.", "clarification": "Berezinskii (1970–71) established the existence of two phases and identified vortices as the destruction mechanism, but did not derive the RG flow or the universal jump; Kosterlitz (1974) provided the recursion relations and Nelson–Kosterlitz (1977) the universal jump. Conflating these flattens a real technical hierarchy."}, {"claim": "The 2D Bose gas 'BKT transition' and the 2D superfluid-film transition are physically identical.", "clarification": "They share the universality class, but the trapped Bose gas in a harmonic potential exhibits a *crossover* (BKT-like correlations in a region of the cloud) rather than a sharp thermodynamic transition; the cleanly thermodynamic statement applies in the homogeneous 2D limit. The Hadzibabic et al. (2006) experiment shows a crossover, not the bulk transition itself."}, {"claim": "KTHNY 2D melting is just BKT applied to dislocations.", "clarification": "It is *two* successive BKT-like unbinding transitions (dislocations → hexatic; disclinations → liquid) with distinct universal jumps in the Young modulus and Frank constant. Treating it as a single BKT transition misses the intermediate hexatic phase, which is the entire physical content."}], "sections": [{"id": "why-it-mattered", "title": "Why It Mattered: A Transition Mermin–Wagner Said Could Not Exist", "markdown": "## Why It Mattered: A Transition Mermin–Wagner Said Could Not Exist\n\nBy the close of 1966 the two-dimensional ordering question looked, briefly, closed. Mermin and Wagner had just proved that for short-ranged, rotationally invariant Heisenberg models in $d\\leq 2$ no finite-temperature spontaneous magnetization is possible, because the would-be Goldstone modes produce an infrared divergence\n$$\\langle |\\mathbf{m}|^2\\rangle \\sim k_BT \\int \\frac{d^2k}{(2\\pi)^2}\\,\\frac{1}{\\rho_s k^2}$$\nthat destroys any putative ordering at every $T\u003e0$ [76]. Hohenberg, the same year, extended the Bogoliubov $1/k^2$ inequality to the off-diagonal long-range order of 2D superfluids and superconductors, killing $\\langle\\psi\\rangle\\neq 0$ by the same mechanism [77]. The folklore conclusion — repeated for years afterward, never quite stated by the authors themselves — was that thin ⁴He films and thin-film superconductors should have no phase transition at all.\n\nThat conclusion did not survive contact with the data. In the same volume of *Physical Review Letters* as Mermin–Wagner, Stanley and Kaplan ([Phys. Rev. Lett. 17, 913, 1966](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.17.913)) had extrapolated high-temperature susceptibility series for the 2D classical Heisenberg model and found a finite-temperature singularity as robust as the 3D one. Adsorbed-helium experiments, by the late sixties, were beginning to show something that looked uncomfortably like a sharp superfluid onset. Two correct theorems and one obstinate singularity sat side by side, and the question sharpened: what could the system possibly be doing? It could not have a local order parameter at $T_c$. It could not be analytic through $T_c$ either, on pain of contradicting the series. Something had to take the role normally played by symmetry breaking, and whatever it was had to be invisible to any field-theoretic argument that averaged $\\langle\\psi(0)\\psi^*(r)\\rangle$ over the full plane.\n\n### The Soviet line, 1970–71\n\nVadim L'vovich Berezinskii answered first, in two long JETP papers that the Anglophone community largely did not read. The 1970 paper [71] established that 2D systems with a continuous internal symmetry have a low-temperature phase in which the order parameter correlation decays algebraically — $\\langle\\psi^*(0)\\psi(r)\\rangle \\sim r^{-\\eta(T)}$ — rather than exponentially, and identified the offending topological excitations, vortices in a U(1) field, as the agents that destroy this *quasi-long-range* order at high temperature. The 1971 sequel [72] carried the same logic into quantum systems, including the 2D Bose gas and planar magnets. Berezinskii's argument was not a renormalization-group calculation; it was a self-consistent spin-wave analysis supplemented by a topological-defect energy–entropy estimate. It contained the entire physical picture: two phases, a vortex-unbinding mechanism, no broken symmetry, no contradiction with Mermin–Wagner because Mermin–Wagner forbids only a finite $\\langle\\psi\\rangle$, not algebraic decay.\n\n### The Birmingham line, 1972–73\n\nKosterlitz and Thouless, working at Birmingham, arrived at the same picture from a different direction and — as Kosterlitz has repeatedly stated, most explicitly in his Nobel Lecture — without knowledge of Berezinskii's papers. Their 1972 letter [73] and the long 1973 paper [74] gave the energy–entropy argument in its now-canonical form: a single vortex on a region of area $L^2$ costs $E = \\pi K \\ln(L/a)$ and contributes entropy $S = 2 k_B \\ln(L/a)$, so $F = (\\pi K - 2 k_B T)\\ln(L/a)$ changes sign at $k_B T_c = \\pi K/2$. The Birmingham group also gave the Coulomb-gas mapping, the dielectric reinterpretation of screening by tightly bound vortex pairs, and the first inkling of the universal stiffness jump that Nelson and Kosterlitz would sharpen in 1977 to the parameter-free prediction $\\rho_s(T_c^-)/T_c = 2 m^2 k_B/\\pi\\hbar^2$ [3]. The 1974 RG paper [75] then closed the loop with explicit recursion relations for the fugacity $y$ and stiffness $K$, the essential singularity $\\xi\\sim\\exp(b/\\sqrt{T-T_c})$, and the link to sine-Gordon — a link rigorously controlled later by Fröhlich and Spencer [80, 11].\n\nThouless learned of Berezinskii's JETP work only when Paul Martin pointed it out during a visit to Paris, after the Birmingham manuscripts were already in motion ([Kosterlitz Nobel Lecture, 2016](https://www.nobelprize.org/uploads/2018/06/kosterlitz-lecture.pdf)). The translation existed — *Soviet Physics JETP* had published the English version of [71] in March 1971 — but it was not on the reading lists of the Anglophone statistical-mechanics community, and the parallel discovery proceeded almost cleanly.\n\n### The retroactive 'B'\n\nBerezinskii died of leukemia in 1980, age 45, with his work still largely uncited in the West. Through the 1980s the name \"Kosterlitz–Thouless\" dominated English-language usage; the Soviet-bloc and parts of the European community kept \"Berezinskii\" attached, and Minnhagen's authoritative 1987 review [82] used \"Kosterlitz–Thouless–Berezinskii\" throughout. The \"BKT\" ordering settled in only over the following decade, partly as a courtesy and partly because younger workers had read the JETP papers in translation and recognized what was there. The 2016 Nobel Prize \"for theoretical discoveries of topological phase transitions and topological phases of matter\" went to Thouless, Haldane, and Kosterlitz ([Nobel Foundation, 2016](https://www.nobelprize.org/prizes/physics/2016/summary/)); Berezinskii, ineligible posthumously, appears in the scientific background document but not in the citation. The 'B' is now permanent in the name and absent from the prize — an asymmetry the discipline has chosen to live with.\n\nWhat this discovery actually accomplished, before any of the later machinery, was conceptual: it showed that the textbook dichotomy between *symmetry-broken phase* and *disordered phase* was incomplete. A third option exists in two dimensions — algebraic order with a temperature-dependent exponent — and the boundary between it and the disordered phase is controlled not by the field $\\psi$ but by the topology of its configurations. Every subsequent extension (KTHNY melting, roughening, dissipative Josephson arrays, 2D Bose gases) is a variation on that single move."}, {"id": "the-physics-properly", "title": "The Physics, Properly: Vortex Unbinding, Coulomb Gas, and the Universal Jump", "markdown": "## The Physics, Properly: Vortex Unbinding, Coulomb Gas, and the Universal Jump\n\nStart from the planar rotor lattice Hamiltonian\n$$H = -J\\sum_{\\langle ij\\rangle}\\cos(\\theta_i-\\theta_j),$$\nwith spins $e^{i\\theta_i}$ on the unit circle. The transition is a property of this universality class under: **(A1)** a single U(1) phase stiffness with no preferred direction; **(A2)** vortex defects interacting logarithmically over arbitrarily large separations; **(A3)** a dilute-vortex regime where the fugacity $y=e^{-\\beta E_c}$ is small enough to expand around the spin-wave Gaussian; **(A4)** an order-parameter manifold whose first homotopy gives codimension-2 point defects with $\\pi_1(S^1)=\\mathbb{Z}$ charge; **(A5)** short-range microscopic couplings, so the bare stiffness is finite; **(A6)** the thermodynamic homogeneous limit; **(A7)** no coupling to a 3D ordered bath that would promote quasi-LRO to true LRO; **(A8)** no quenched disorder or random gauge field that would replace the clean RG flow by a Cardy–Ostlund-type line. Every assumption fails somewhere in the literature, and §3 is built around those failures.\n\nExpand $\\cos$ to quadratic order — legitimate at low $T$ by **A3** — and split the phase into a smooth piece and a multivalued vortex piece, $\\theta(\\mathbf r)=\\theta_{sw}(\\mathbf r)+\\theta_v(\\mathbf r)$, with $\\oint\\!\\nabla\\theta_v\\!\\cdot d\\boldsymbol\\ell = 2\\pi n$ around each defect. The two sectors decouple in the continuum action:\n$$S = \\frac{K}{2}\\!\\int\\!d^2r\\,(\\nabla\\theta_{sw})^2 + \\frac{K}{2}\\!\\int\\!d^2r\\,(\\nabla\\theta_v)^2,\\qquad K\\equiv J/k_B T.$$\nThe spin-wave sector alone is a free Gaussian: $\\langle e^{i[\\theta_{sw}(\\mathbf r)-\\theta_{sw}(0)]}\\rangle\\sim (a/r)^{\\eta(T)}$ with $\\eta(T)=1/(2\\pi K)$. This is the algebraic phase Berezinskii [71,72] identified, and Mermin–Wagner [76] does not forbid it — quasi-long-range order violates no theorem.\n\nThe vortex sector is the engine. A single $+1$ vortex in a box of side $L$ costs $E_1=\\pi J\\ln(L/a)+E_c$ (by **A2**); its translational entropy is $S_1=2k_B\\ln(L/a)$. The free energy of an isolated vortex is the celebrated\n$$F_1 = (\\pi J - 2k_B T)\\ln(L/a),$$\nchanging sign at $T_c^{(0)}=\\pi J/2k_B$ — the Kosterlitz–Thouless energy–entropy estimate [73,74]. Below $T_c^{(0)}$ single vortices are suppressed but neutral $\\pm$ pairs survive, because a bound pair has finite energy $\\sim 2\\pi J\\ln(d/a)$ independent of $L$. The low-$T$ phase is a vortex *dielectric*; the high-$T$ phase is a *plasma*.\n\nThis is the Coulomb-gas mapping: vortices of charge $n_i\\in\\mathbb Z$ interact via $U_{ij}=-2\\pi J n_i n_j\\ln(r_{ij}/a)$, with overall neutrality enforced by **A6**. Villain's periodic-Gaussian rewriting (1975) makes the mapping exact, and a duality (sine-Gordon) brings the partition function to\n$$S_{sG}=\\int d^2r\\,\\Big[\\tfrac{1}{2K}(\\nabla\\varphi)^2 - 2y\\,a^{-2}\\cos\\varphi\\Big],$$\nthe form on which José, Kadanoff, Kirkpatrick, and Nelson [78] founded the modern RG analysis and which Fröhlich and Spencer [11,80] turned into a rigorous proof that the dipole and plasma phases are thermodynamically distinct.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eKosterlitz RG flow\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"630\" y=\"365\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003e1/K  ∝  T\u003c/text\u003e\u003ctext x=\"40\" y=\"55\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003ey  (fugacity)\u003c/text\u003e\u003cline x1=\"350\" y1=\"335\" x2=\"350\" y2=\"345\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"335\" y=\"365\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003eπ/2\u003c/text\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"350\" y2=\"340\" stroke=\"#7ee0a3\" stroke-width=\"4\"/\u003e\u003ctext x=\"110\" y=\"328\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003eline of Gaussian fixed points  (quasi-LRO)\u003c/text\u003e\u003cpath d=\"M 350 340 Q 240 240 120 70\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cpath d=\"M 350 340 Q 470 240 620 70\" stroke=\"#ff7a90\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"110\" y=\"95\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"serif\"\u003eincoming separatrix (T = Tc)\u003c/text\u003e\u003ctext x=\"500\" y=\"95\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"serif\"\u003eoutgoing: vortex plasma\u003c/text\u003e\u003cdefs\u003e\u003cmarker id=\"a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003cpath d=\"M 260 245 l 25 -25\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#a)\"/\u003e\u003cpath d=\"M 210 170 l 25 -30\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#a)\"/\u003e\u003cpath d=\"M 440 245 l 25 25\" stroke=\"#ff7a90\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#a)\"/\u003e\u003cpath d=\"M 500 175 l 28 30\" stroke=\"#ff7a90\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#a)\"/\u003e\u003ccircle cx=\"350\" cy=\"340\" r=\"6\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"360\" y=\"332\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eBKT fixed point  (πK_R = 2)\u003c/text\u003e\u003ctext x=\"140\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003elow T  —  dielectric\u003c/text\u003e\u003ctext x=\"490\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003ehigh T  —  plasma\u003c/text\u003e\u003c/svg\u003e\n*Figure: Kosterlitz RG flow in the $(K^{-1},y)$ plane. The $y=0$ axis below $\\pi/2$ is a line of Gaussian fixed points (algebraic phase). Trajectories enter the BKT fixed point along the incoming separatrix; across it $y$ runs to strong coupling and vortices proliferate, screening the stiffness to zero.*\n\nLinearizing the sine-Gordon action around small $y$ gives Kosterlitz's recursion [75]\n$$\\frac{dK^{-1}}{d\\ell}=4\\pi^3 y^2,\\qquad \\frac{dy}{d\\ell}=(2-\\pi K)\\,y,$$\nwith conserved hyperbola $C=(\\pi K-2)^2-(4\\pi^2 y)^2$. The separatrix $C=0$ entering the fixed point $(K_R^{-1},y)=(\\pi/2,0)$ defines $T_c$. Above it $y$ runs to strong coupling and a correlation length condenses with the trademark essential singularity\n$$\\xi(T)\\sim a\\,\\exp\\!\\big(b/\\sqrt{T-T_c}\\big),$$\nnot the algebraic $|t|^{-\\nu}$ of any Landau transition. This is **A2** in disguise: only a marginally relevant operator can produce $\\exp(b/\\sqrt t)$.\n\nThe fixed-point value $\\pi K_R(T_c^-)=2$ is parameter-free: regardless of $J$, lattice geometry, or vortex-core details (so long as **A1–A6** hold), the renormalized stiffness jumps from $2k_B T_c/\\pi$ to zero as $T$ crosses $T_c$ from below. Translated to the superfluid $^4$He film by Nelson and Kosterlitz [3],\n$$\\lim_{T\\to T_c^-}\\frac{\\rho_s(T)}{T}=\\frac{2 m^2 k_B}{\\pi\\hbar^2}=3.52\\times 10^{-9}\\,\\mathrm{g\\,cm^{-2}\\,K^{-1}},$$\nand to the two-point exponent $\\eta(T_c^-)=1/(2\\pi K_R)=1/4$. The universal jump and $\\eta=1/4$ are the two non-negotiable quantitative predictions of the theory; everything in §4 is graded against them. Bishop and Reppy [79] saw the jump within a year; Epstein, Goldman, and Kadin [10] saw the $I$–$V$ exponent jump from $1$ to $3$ in superconducting films three years later; Hadzibabic et al. [51] saw a crossover version in a trapped Bose gas — each test polluted, in its own way, by the failure of one of **A6–A8**."}, {"id": "strict-conditions-failure-modes", "title": "Strict Conditions \u0026 Failure Modes: Where Each Assumption Breaks", "markdown": "## Strict Conditions \u0026 Failure Modes: Where Each Assumption Breaks\n\nThe BKT scenario is a tightly conditional theorem, not a universal phenomenon. The recursion relations of [75], the universal jump of [3], and the rigorous dipole-phase proof of [80] all rest on a stack of assumptions that the literature labels variously but which we collect here as A1–A8. Drop any one and the physics changes — sometimes into a nearby BKT-like variant, sometimes into an entirely different universality class.\n\n**A1 — Exact U(1) (XY) symmetry of the stiffness.** The vortex/spin-wave separation requires that the rotor live on $S^1$ with no preferred direction. Add a $p$-fold anisotropy $-h_p\\cos(p\\theta)$ and the analysis of [78] shows that $h_p$ has scaling dimension $2 - p^2/(4\\pi K)$, becoming relevant at $K_p = p^2/8\\pi$. For $p=2,3,4$ ($Z_2$ Ising, $Z_3$ Potts, $Z_4$ clock) the anisotropy is relevant throughout the would-be BKT phase and one recovers a single transition in the Ising/Potts/Ashkin–Teller universality class. For $p\\geq 5$ the anisotropy is irrelevant near $T_{\\rm BKT}$ but relevant near $T=0$, producing *two* BKT-like transitions bracketing a critical XY phase — a fact already visible in [5] and revisited recently in [14] for small lattices. The $q=5$ boundary is sharp; $q=4$ gives the Ashkin–Teller line, not BKT.\n\n**A2 — Logarithmic vortex interaction, i.e., short-ranged microscopic couplings.** The Coulomb-gas mapping requires $V(r)\\sim -\\pi K\\ln(r/a)$. Two physically important deformations break this:\n\n- *Dipolar in-plane couplings* (planar magnets, tilted polar molecules) decay as $1/r^3$ and screen the vortex log at long distances; Maier–Saalfrank–type analyses replace BKT by a true long-range-ordered phase with Ising-like critical exponents, since the Mermin–Wagner obstruction itself is lifted.\n- *Charged 2D superfluids* — i.e., real thin-film superconductors — feel the Pearl length $\\lambda_\\perp = 2\\lambda^2/d$ [82]. For $r\\ll\\lambda_\\perp$ the interaction is logarithmic and BKT applies; for $r\\gg\\lambda_\\perp$ it crosses over to $1/r$ and unbinding becomes a finite-size, system-shape-dependent affair. A clean BKT transition in a thin film therefore requires $L\\ll\\lambda_\\perp$, a condition routinely violated and routinely ignored in the cuprate literature.\n\n**A3 — Vortex core energy small enough to keep the transition continuous.** The standard recursion linearises around small fugacity $y=e^{-E_c/k_BT}$. If $E_c$ is large the dilute-gas expansion fails and one slides onto the *Minnhagen line* [82]: the transition becomes first-order in the $(K^{-1}, y)$ plane, with a jump in $\\rho_s$ exceeding the universal $2/\\pi$. Josephson-junction arrays with significant charging energy [20] sit close to this line, and several experimental \"anomalously large\" jumps reported as BKT are actually weakly first-order Minnhagen crossings.\n\n**A4 — Stable point-vortex defects, i.e., $\\pi_1(\\mathcal M)=\\mathbb Z$.** For $O(n)$ models with $n\\geq 3$ the order parameter manifold is $S^{n-1}$ and $\\pi_1(S^{n-1})=0$: vortices can be continuously unwound through the third component. The $n=3$ Heisenberg model therefore has no BKT transition; asymptotic freedom drives $\\xi\\sim\\exp(2\\pi/T)$ with no finite-$T$ singularity, as the high-precision RG of [23] confirms. XXZ anisotropy [60] restores BKT only once the easy-plane gap exceeds the residual out-of-plane fluctuations.\n\n**A5 — Short-range XY coupling.** Long-range ferromagnetic XY models $J_{ij}\\propto 1/r^{d+\\sigma}$ in $d=2$ undergo a *true* symmetry-breaking transition for $\\sigma\u003c2$ (mean-field above $\\sigma=4/3$, non-trivial in between) and reduce to BKT only at $\\sigma=2$, where the interaction is marginal and logarithmic corrections appear. The often-quoted statement \"2D XY = BKT\" silently assumes $\\sigma\u003e2$.\n\n**A6 — Thermodynamic limit / homogeneous medium.** In a harmonic trap of frequency $\\omega$ the local phase-space density $n\\lambda_{\\rm dB}^2$ varies across the cloud, so a sharp transition is replaced by a *crossover*: the central region develops BKT-type quasi-long-range coherence while the wings remain thermal. [51] observed this directly via interference fringe dislocations; the local-density approximation gives $T_{\\rm BKT}(r) = T_{\\rm BKT}^{\\rm hom}[n(r)]$, smearing the stiffness jump over a shell of width $\\sim k_BT/m\\omega^2 r$. Calling such data a \"BKT transition\" without qualifying *crossover* is the most common modern abuse.\n\n**A7 — Strict two-dimensionality.** Stacked films of thickness $N$ layers with interlayer coupling $J_\\perp$ undergo a dimensional crossover at the scale $\\xi_{\\rm BKT}(T)\\sim a\\exp(b/\\sqrt{T-T_{\\rm BKT}})\\sim (J/J_\\perp)^{1/2}$ [9]: above this length 3D XY universality takes over, with $\\nu\\approx 0.67$ and a genuine $\\langle\\psi\\rangle\\neq 0$. Many \"BKT in YBCO\" claims [24] live in this crossover window — the I–V exponent $a(T)$ shows a jump-like feature, but the universal $a=3$ at $T_{\\rm BKT}$ is rounded by the 3D coupling.\n\n**A8 — Quenched disorder weak / no random vector potential.** Adding a random phase $A_{ij}$ to the XY Hamiltonian (gauge glass; vortex-pinning arrays) takes one to the *Cardy–Ostlund line*: for disorder strength $\\sigma^2\u003c\\pi/8$ the BKT phase survives with disorder-renormalised stiffness, but at $\\sigma^2=\\pi/8$ a marginal glass phase opens, with $\\langle\\cos\\theta\\rangle\\sim r^{-\\eta(T,\\sigma)}$ where $\\eta$ acquires $\\ln^2 r$ corrections. Beyond this line the transition is destroyed and replaced by a Bragg-glass-like state. Flux-noise experiments on disordered Josephson arrays [70] sit suspiciously near this boundary.\n\nEach violation has a textbook signature; together they explain why \"BKT\" claims in the 2D-materials literature [49, 59, 65] survive scrutiny far less often than the citation count suggests."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Smoking Guns vs. Circumstantial Evidence", "markdown": "## Signatures: Smoking Guns vs. Circumstantial Evidence\n\nA BKT identification rests on a hierarchy of evidence. At the top sit predictions that are quantitative, parameter-free, and inconsistent with any competing scenario in the relevant universality class — the universal jump, the discontinuous nonlinear-$I$–$V$ exponent, the essential singularity, and the off-$T_c$ specific-heat peak. Below them lies a thicker layer of suggestive but ambiguous data: algebraic correlations, interference contrasts, resistive tails. The latter are routinely conflated with the former in the recent literature, and the distinction is what separates a BKT system from a system that merely looks like one in a finite window.\n\n### Smoking guns\n\n**(i) The universal jump in superfluid stiffness.** Nelson and Kosterlitz [3] showed that the RG flow of [75] forces\n\n$$\\lim_{T \\to T_{\\mathrm{BKT}}^{-}} \\frac{\\rho_s(T)}{T} = \\frac{2 m^{2} k_{B}}{\\pi \\hbar^{2}} \\;\\approx\\; 3.52 \\times 10^{-9}\\;\\mathrm{g\\,cm^{-2}\\,K^{-1}}\\,.$$\n\nNo microscopic parameter enters. Bishop and Reppy verified the prediction within a year using a torsional oscillator (not third sound — that was the [Rudnick group's parallel approach](https://link.springer.com/article/10.1007/s10909-020-02421-6); Bishop–Reppy [79] measured the period shift of an adsorbed-film Andronikashvili pendulum), recovering the universal slope to within a few percent across film coverages spanning more than a decade. The frequency dependence of the apparent jump — predicted by Ambegaokar–Halperin–Nelson–Siggia [82] from vortex-diffusion dynamics — is the cleanest discriminator against an inhomogeneous-$T_c$ artefact: a real BKT jump narrows logarithmically with $\\omega$, while a distribution of local $T_c$'s gives an $\\omega$-independent smearing.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eUniversal jump in 2D superfluid density\u003c/title\u003e\u003cline x1=\"80\" y1=\"350\" x2=\"680\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"30\" x2=\"80\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"388\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003etemperature T\u003c/text\u003e\u003ctext x=\"28\" y=\"190\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 28 190)\"\u003eρ_s(T)\u003c/text\u003e\u003cline x1=\"460\" y1=\"350\" x2=\"460\" y2=\"178\" stroke=\"#7aa2ff\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"460\" y=\"370\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eT_BKT\u003c/text\u003e\u003cline x1=\"80\" y1=\"350\" x2=\"610\" y2=\"165\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"420\" y=\"240\" fill=\"#ffb86b\" font-size=\"14\"\u003eρ_s/T = 2 m² k_B / π ℏ²\u003c/text\u003e\u003cpath d=\"M 80 62 Q 240 90 340 130 Q 420 165 460 178\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cline x1=\"460\" y1=\"178\" x2=\"460\" y2=\"350\" stroke=\"#7ee0a3\" stroke-width=\"2\" stroke-dasharray=\"3 4\"/\u003e\u003cline x1=\"460\" y1=\"350\" x2=\"640\" y2=\"350\" stroke=\"#7ee0a3\" stroke-width=\"2.5\"/\u003e\u003ccircle cx=\"460\" cy=\"178\" r=\"4.5\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"460\" cy=\"350\" r=\"4.5\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"120\" y=\"55\" fill=\"#7ee0a3\" font-size=\"14\"\u003erenormalized ρ_s(T)\u003c/text\u003e\u003ctext x=\"490\" y=\"200\" fill=\"#7ee0a3\" font-size=\"13\"\u003ejump = universal locus\u003c/text\u003e\u003ctext x=\"500\" y=\"335\" fill=\"#ff7a90\" font-size=\"14\"\u003efree vortices: ρ_s = 0\u003c/text\u003e\u003ctext x=\"110\" y=\"285\" fill=\"#e8e6e1\" font-size=\"13\"\u003ebound vortex–antivortex dipoles\u003c/text\u003e\u003ctext x=\"110\" y=\"303\" fill=\"#e8e6e1\" font-size=\"13\"\u003equasi-long-range order, η(T) \u0026lt; 1/4\u003c/text\u003e\u003c/svg\u003e\n*Figure: the Nelson–Kosterlitz universal jump. The renormalized stiffness (green) decreases smoothly, must terminate on the universal line $\\rho_s/T = 2 m^{2} k_B / \\pi \\hbar^{2}$ (orange) at $T_{\\mathrm{BKT}}$, and drops discontinuously to zero. The intercept — not the curve's shape — is parameter-free.*\n\n**(ii) Discontinuous nonlinear-$I$–$V$ exponent in films.** In thin-film superconductors and Josephson arrays the same RG predicts $V \\propto I^{a(T)}$ with $a(T_{\\mathrm{BKT}}^{-}) = 3$, $a(T_{\\mathrm{BKT}}^{+}) = 1$ — a discontinuous step from cubic to ohmic at the transition. Epstein, Goldman, and Kadin [10] resolved exactly this step in Hg–Xe films, with $a(T)$ rising smoothly through 3 just below $T_{\\mathrm{BKT}}$. The step is robust because $a = 1 + \\pi K_R$ inherits the universal jump in $K_R$; a finite-size or weak-link scenario yields a continuous $a(T)$ that crosses 3 without a kink.\n\n**(iii) Kosterlitz essential singularity.** The recursion relations of [75] give\n\n$$\\xi(T) \\sim \\xi_0\\,\\exp\\!\\Big[\\,b/\\sqrt{T/T_{\\mathrm{BKT}}-1}\\,\\Big]\\,,\\qquad T \\to T_{\\mathrm{BKT}}^{+},$$\n\nwith no power-law prefactor. Above $T_{\\mathrm{BKT}}$ the sheet resistance inherits the same form, $R_\\square(T) \\propto \\xi^{-2}$. A Halperin–Nelson plot of $[\\ln(R_0/R)]^{-2}$ vs. $T$ should be linear and extrapolate to $T_{\\mathrm{BKT}}$. Any system where this plot curves over many decades is either not BKT or is sitting in the crossover region where conventional fluctuation corrections still dominate.\n\n**(iv) Specific-heat peak *above* $T_{\\mathrm{BKT}}$.** Monte Carlo and series work, summarized in Minnhagen [82] and confirmed in modern simulations, place the broad $C_V$ maximum at $T \\approx 1.17\\,T_{\\mathrm{BKT}}$, not at $T_{\\mathrm{BKT}}$ — the entropy of liberated vortices is released *after* the transition. The peak is non-singular (BKT is infinite-order); the diagnostic is the *offset*, which is incompatible with Ising ($C_V$ diverges at $T_c$) or 3D-XY ($\\alpha \u003c 0$, weak cusp at $T_c$). A coincidence of $T_{C_V^{\\max}}$ with the apparent transition temperature is therefore evidence *against* BKT, not for it.\n\n### Circumstantial, imposter-prone\n\n**Algebraic $g_1(r)$ and interference-contrast scaling.** The low-$T$ correlator $g_1(r) \\sim r^{-\\eta(T)}$ with $\\eta(T_{\\mathrm{BKT}}^{-}) = 1/4$ is genuinely BKT, but a finite-size XY system or any sufficiently large 2D Bose cloud shows apparent power-law decay over the accessible range regardless of regime. The Hadzibabic et al. trapped-gas experiment [51] is the textbook example: the interference-contrast exponent does cross $1/4$, but the inhomogeneous trap turns the transition into a *crossover* — distinct rings of the cloud cross threshold at different $T$. The discriminator is the *jump* in $\\eta$ (sharp in a homogeneous box trap, smeared in a harmonic trap), not the value itself.\n\n**Resistive broadening in films.** A broadened $R(T)$ tail is the most overused BKT signature and the weakest. Imposters proliferate: granular weak-link networks (percolative tail), inhomogeneous $T_c$ distributions (Gaussian smearing), thermally activated phase slips ($\\ln R \\propto 1/T$), and ordinary 3D fluctuation tails (Aslamazov–Larkin power law). The Halperin–Nelson exponential form is the discriminator; in its absence the claim is decorative.\n\n**Vortex visualization, magnetic noise, third-sound velocity dips.** Each is suggestive when present; none is parameter-free. A BKT identification that rests *only* on these without the universal jump or the $a(T)$ step should be read as a working hypothesis.\n\nThe honest summary: a BKT claim that does not pin at least one of (i), (ii), or (iii) quantitatively — with the predicted absolute value, not just the predicted functional shape — is circumstantial. Modern papers that label any 2D thermal crossover \"BKT\" because $g_1(r)$ looks straight on a log–log plot have inverted the evidentiary order Kosterlitz–Thouless themselves insisted on in [74].\n\nSources:\n- [Thin Films of Quantum Fluids: History, Phase Transitions, and Wetting (J. Low Temp. Phys.)](https://link.springer.com/article/10.1007/s10909-020-02421-6)\n- [Study of the Superfluid Transition in Two-Dimensional Films (Bishop \u0026 Reppy 1978)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.40.1727)\n- [Specific-heat anomaly in the 2D XY / lattice sine-Gordon model](https://arxiv.org/html/2504.20766)\n- [Observation of first and second sound in a BKT superfluid (Nature 2021)](https://www.nature.com/articles/s41586-021-03537-9)"}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: How 'BKT' Became a Decoration", "markdown": "## Use \u0026 Abuse: How 'BKT' Became a Decoration\n\nThe BKT label has become one of those words that adds gravitas to a paper for free, much like \"emergent\" or \"topological\". The cost of that inflation is that genuine BKT physics — a sharp, parameter-free, falsifiable prediction — gets diluted into a vague pattern-match. Section 3 listed the prerequisites; this section catalogs the modal failures.\n\n### The universal jump, unmeasured\n\nThe clearest tell. A paper reports a \"BKT transition\" yet never extracts $K(T_c^-) = 2/\\pi$, or extracts a value far from $2/\\pi$ and proceeds as if nothing happened. The universal jump [3] is the only parameter-free signature distinguishing BKT from any other smooth crossover. If a manuscript identifies $T_{\\rm BKT}$ by where the susceptibility peaks, by an inflection of $\\xi(T)$, by a kink in the specific heat, or by visual fitting of correlation functions to power laws — without quantitatively verifying $\\rho_s(T_c^-)/T_c = 2 m^2 k_B / \\pi \\hbar^2$ — the identification is circumstantial at best, decorative at worst.\n\nStronger version of the same disease: the universal jump appears in the *renormalized* stiffness, and only after the Kosterlitz–Nelson matching condition is solved self-consistently with finite-size corrections [78]. Bare stiffness at finite $L$ generically misses $2/\\pi$ by an amount that vanishes only as $1/\\ln L$. Papers that report a clean $2/\\pi$ jump from raw Monte Carlo at $L=64$ without the logarithmic correction are claiming what the data cannot support.\n\n### Wrong universality class\n\nInvoking BKT in systems lacking the required continuous U(1) stiffness.\n\n- **Ising-anisotropic XY magnets.** Easy-axis anisotropy is relevant; it gaps the Goldstone mode and drives the transition to 2D Ising. The BKT recursion flows off the fixed line as soon as $h_z \\neq 0$. \"BKT-like\" still gets attached to easy-plane magnets where the measured exponents are Ising.\n- **$q$-state clock and Potts models.** The clock model has *two* BKT transitions only for $q \\geq 5$ [14]; for $q \\leq 4$ the symmetry breaking is conventional. Claims of \"BKT\" in 3- and 4-state clock systems mistake a critical-line artifact for a topological transition.\n- **Inverted-BKT confusions.** Annealed networks and certain Potts variants exhibit essential singularities mimicking BKT scaling [2], but the mechanism — graph reconnection, not vortex unbinding — has no Coulomb-gas mapping. Shared functional form $\\xi \\sim \\exp(b/\\sqrt{t})$ is not a sufficient diagnosis.\n\n### Finite-size ventriloquism\n\nBKT correlation lengths diverge as $\\xi \\sim \\exp(b/\\sqrt{t})$, so $\\xi$ exceeds any accessible box for a finite window of $T \u003e T_c$. Inside that window the system *looks* critical. The honest tests — Weber–Minnhagen scaling, Binder-cumulant crossings against analytic predictions, helicity modulus matched to the Kosterlitz–Nelson recursion — are straightforward. The dishonest substitute, fitting one curve to $r^{-\\eta}$ at one $L$, has flooded the literature, particularly in 2D quantum simulations where the physical $\\xi$ would exceed the Hubble radius.\n\n### Topology, the wrong kind\n\nSince 2016 the word \"topological\" routes attention toward Chern numbers, edge modes, and gapped band invariants. BKT is topological in a different sense: $\\pi_1(S^1) = \\mathbb{Z}$ vortex defects, no bulk gap, no protected boundary. Conflating the two — visible in popular accounts and even some review articles after the Thouless–Haldane–Kosterlitz Nobel — treats \"BKT\" and \"topological insulator\" as cousins. They share a homotopy-theoretic flavor and nothing else. A BKT transition has no quantized response, no symmetry-protected anomaly, no bulk-boundary correspondence.\n\n### KTHNY squeezed into one transition\n\nTwo-dimensional melting is *two* unbinding transitions [81]: dislocations unbind at $T_m$ producing the hexatic; disclinations unbind at $T_i \u003e T_m$ producing the isotropic liquid. The intermediate hexatic has algebraic orientational order, short-range translational order, and its own universal jump in the Frank constant. Active-matter and colloidal studies occasionally report \"BKT melting\" as a single transition [69]; if no hexatic window is resolved, the claim is either premature or wrong. The absence of a hexatic phase in a continuous-melting system would itself be a discovery — it should be argued, not assumed.\n\n### Trapped Bose gases: crossover sold as transition\n\nThe trapped 2D Bose gas is inhomogeneous: chemical potential varies with radius, density is a smooth profile, and the criterion $n \\lambda^2 \\approx \\mathcal{D}$ is met first in the cloud center. What is measured is therefore a *crossover* — the seminal Hadzibabic experiment was explicit about this [51]. Subsequent papers occasionally drop the qualifier and report a \"BKT phase transition\" in a harmonic trap. The thermodynamic transition statement is rigorous only in the homogeneous (box-trapped) 2D limit.\n\n### Superconducting films: the $a=3$ misuse\n\nThe Halperin–Nelson prediction is that the nonlinear $I$–$V$ exponent $a(T)$ jumps from $1$ to $3$ at $T_{\\rm BKT}$ [10]. Two abuses recur. First, fitting power laws to $I$–$V$ curves where $a(T)$ never crosses $3$ — typically because flux-flow or vortex-pinning channels dominate — and still labeling the inflection \"BKT\". Second, identifying $T_{\\rm BKT}$ by where $a(T) = 3$ but reporting a different temperature $T^*$ for the resistive transition without addressing the discrepancy. The two must coincide within the BKT scenario; if they don't, either the scenario fails or finite-frequency and inhomogeneity corrections must be modeled, not waved away.\n\n### Linguistic tells of a hollow claim\n\nA short field guide. Phrases that should trigger skepticism:\n\n- \"*BKT-like* behavior\" — without specifying which feature is BKT and which is \"like\".\n- \"*Consistent with* BKT\" — one observable in one regime; the harder predictions go unchecked.\n- \"*Vortex-mediated* transition\" — vortex *cores* are everywhere in an XY model; the question is whether they *unbind* at $T_c$, not whether they exist.\n- \"*Power-law correlations*\" reported at one temperature, one system size, with no $\\eta(T)$ continuity check.\n- \"*Essential-singularity scaling*\" extracted from three data points and a two-parameter fit.\n- \"*Topological*\" used adjectivally without disclosing which $\\pi_n$ is at work.\n- \"*BKT crossover*\" used interchangeably with \"*BKT transition*\" in the abstract and conclusions of the same paper.\n\nThe healthy alternative is the believer's checklist of §6: universal jump, essential singularity, $\\eta(T_c^-) = 1/4$, dynamical scaling, finite-size collapse consistent with the Kosterlitz RG. A paper meeting three of those is making a claim worth defending. A paper meeting none is using \"BKT\" as ornament."}, {"id": "status-and-believers-checklist", "title": "Status \u0026 the Believer's Checklist", "markdown": "## Status \u0026 the Believer's Checklist\n\nFour decades after Nelson–Kosterlitz [3] and Bishop–Reppy [79], the BKT transition sits in an unusual position: it is one of the most precisely tested predictions in equilibrium statistical mechanics, and one of the most casually invoked. In its native habitat — homogeneous, strictly two-dimensional systems with a single U(1) stiffness — the theory is canonical and quantitatively closed. The universal jump $\\rho_s(T_c^-)/T_c = 2m^2k_B/\\pi\\hbar^2$ has been verified in ⁴He films to better than a percent [79]; the Coulomb-gas RG of [75,78] and the rigorous dipole-phase proof of [80] together constitute a complete theoretical edifice; large-scale Monte Carlo on the planar rotor reproduces $T_{\\rm BKT}/J \\approx 0.8929$ with the predicted essential singularity. Inside this canonical zone — superfluid ⁴He films, ultrathin amorphous superconductors of the InO/NbN family, classical Josephson-junction arrays [10,20], and XY-symmetric lattice simulations — \"BKT\" is a load-bearing identification.\n\nOutside it, the label has metastasized. Two communities are the principal sites of mutation. The first is ultracold atoms: trapped 2D Bose gases [51], polariton condensates [54], and 2D Fermi gases in the crossover regime are routinely tagged \"BKT\" on the basis of interference contrast, momentum-distribution sharpening, or coherence-length growth alone. None of these is a clean stand-in for the stiffness jump; trap inhomogeneity means the system passes through a *crossover* in local phase-space density, and the universal jump is recovered only after careful LDA deconvolution or a flat-bottom box. The second is two-dimensional moiré and van der Waals superconductivity. Magic-angle graphene [46,53], gated MoS₂ [52], CVD NbSe₂ [62], thin TaS₂ [66], and Mo₂C [50] have all generated \"BKT\" claims, often resting solely on an $R(T)$ tail fitted to Halperin–Nelson resistivity, or on an exponent $a(T)$ that crosses three somewhere near the resistive transition. The fit is usually consistent with BKT and rarely exclusive of inhomogeneous broadening, percolation, or paraconductivity. Magnetic 2D materials [49,60] and active-matter melting [69] have produced both rigorous and decorative uses; most KTHNY claims in colloidal or active systems fail the two-step requirement of [81].\n\nAgainst this backdrop, AETHER will take a BKT identification seriously when, and only when, it passes the following ten-point audit.\n\n1. **Order-parameter manifold.** Identify the U(1) (or larger continuous Abelian) target manifold of the would-be order parameter and the microscopic stiffness $K$ associated with it. Discrete ($\\mathbb{Z}_n$) or non-Abelian symmetries demand a derived effective XY description with named cutoffs, not assumed.\n\n2. **Logarithmic defect interaction.** Demonstrate, not assume, that the elementary topological defects interact logarithmically at the relevant length scales. Screening from itinerant carriers, finite Pearl length $\\lambda_\\perp$ in a real superconducting film, or 3D coupling all cut off the logarithm and abolish the transition; show the regime of validity explicitly [82].\n\n3. **Universal jump in $\\rho_s$.** Measure the superfluid (or superconducting) phase stiffness directly — third sound, torsional oscillator, mutual inductance, kinetic-inductance microwave — and show the discontinuity to $2T_c/\\pi$ within Minnhagen / Weber–Minnhagen finite-size corrections [3,82]. An $R(T)$ tail fit is not a stiffness measurement.\n\n4. **Essential singularity in $\\xi(T)$.** Fit the correlation length above $T_c$ to $\\xi \\sim \\exp(b/\\sqrt{T-T_c})$, not to $|t|^{-\\nu}$. A successful power-law fit over a decade is evidence *against* BKT, not for it.\n\n5. **Anomalous exponent at the transition.** Show $\\eta(T_c^-) = 1/4$ in the two-point correlator, either directly (scattering, interference) or via the dynamical exponent $a(T_c^-) = 3$.\n\n6. **Nonlinear $I$–$V$ jump (or analogue).** For charged systems, document the jump in $a(T)$ from $1$ above to $3$ just below $T_{\\rm BKT}$, as in [10]. In neutral analogues, show the equivalent dynamic scaling of vortex pair lifetime.\n\n7. **Imposter exclusion.** Rule out, by independent diagnostics, Ising ($Z_2$ symmetry, logarithmic specific-heat divergence), 3D-XY (power-law $\\xi$, $\\nu \\approx 0.67$), percolation (geometric thresholds, fractal cluster statistics), and inhomogeneous broadening (spatial maps of $T_c$, finite-frequency stiffness). Without this, a BKT-consistent $R(T)$ proves nothing.\n\n8. **Trapped systems: local vs. global.** For atomic and polariton gases, separate the *local* quasi-condensate crossover, governed by phase-space density at the trap centre, from the thermodynamic statement, which requires a box potential [51] or quantitative LDA deconvolution. Do not call a crossover a transition.\n\n9. **KTHNY claims require two transitions.** Any \"2D melting via BKT\" claim must exhibit *both* a dislocation-unbinding transition (universal Young-modulus jump) *and* a disclination-unbinding transition (Frank-constant jump), with a measurable hexatic window between them. A single broadened transition is melting, not KTHNY.\n\n10. **Cite Berezinskii.** Reference [71,72] — not as historical decoration, but because the quantum extension in [72] is the part of the theory the cold-atom and superconducting-thin-film communities now rely on. Authors who write \"Kosterlitz–Thouless\" in 2026 are signalling that they have not read the literature they are extending.\n\nA paper that clears items 1–9 is doing BKT physics. A paper that also clears item 10 is doing it honestly."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough time inside this literature to know which claims I would walk into a seminar and defend, and which ones the community repeats out of habit. Here is where I stand.\n\n### What I will defend with my reputation\n\nThe universal jump is real, it is $2/\\pi$ in the dimensionless stiffness $K = \\hbar^2\\rho_s/(m^2 k_B T)$, and it is the only clean experimental fingerprint of BKT that no competing scenario reproduces without fine-tuning. Bishop and Reppy's torsional-oscillator data on $^4$He films [79], combined with the Nelson–Kosterlitz prediction [3], is one of the half-dozen most precise *parameter-free* confrontations between theory and experiment in condensed matter — on par with the quantized Hall conductance and the Josephson frequency. I will also defend, without hedging, the Fröhlich–Spencer result that the 2D XY model has a genuine thermodynamic transition in the infinite-volume limit; the \"it's all a crossover\" objection one still hears from skeptical mathematicians was settled in 1981 and people should stop relitigating it.\n\n### What is shakier than the literature admits\n\nThree things, named specifically.\n\nFirst, the recursion relations [75] are derived under the *diluteness* assumption — vortex fugacity $y \\ll 1$ — and are then extrapolated, in essentially every modern paper I read, into regimes where $y \\sim O(1)$. The flow near the separatrix is quantitatively trusted far beyond its derivational warrant; the \"universal\" jump survives because it is a fixed-point statement, but non-universal amplitudes routinely quoted from one-loop Kosterlitz RG are not entitled to the precision claimed.\n\nSecond, the identification of cold-atom and exciton-polariton experiments as \"observing BKT\" rests on a quiet conflation, already flagged in our table: a harmonically trapped 2D gas is inhomogeneous, the local stiffness varies across the cloud, and what is measured is a regional crossover. The Hadzibabic interferogram is beautiful and consistent with BKT physics, but it is not a measurement of the universal jump, and the field should stop pretending otherwise.\n\nThird, the case for BKT in 2D superconducting films is weaker than the textbooks let on. Disorder generates random gauge fields that couple to the vortex sector, and the resulting Cardy–Ostlund / random-XY problem has a glassy low-$T$ phase whose relation to the clean BKT fixed point is still not fully understood — Giamarchi–Le Doussal is the honest reference here, not Halperin–Nelson.\n\n### Three open questions I would actually work on\n\n1. **The driven-dissipative jump.** Does the $2/\\pi$ value survive in exciton-polariton condensates, where detailed balance is broken? I think the answer is *no in general, yes in a fine-tuned limit* — and settling this would expose the thermodynamic content of the jump.\n2. **Disordered BKT in real superconducting films.** A clean experimental separation of the clean-BKT exponent from the Cardy–Ostlund glassy correction is still missing; this is doable with current InO$_x$ or NbN samples.\n3. **Two-step melting at the universal-jump level.** KTHNY predicts *two* universal jumps (Young modulus, Frank constant); only the first has been measured cleanly. The hexatic-to-isotropic jump in the Frank constant is, to my reading, still circumstantial.\n\n### Reading path\n\n1. [Berezinskii 1971] — read first, in the original JETP, to see vortices identified as the destruction mechanism before any RG language existed.\n2. [Kosterlitz–Thouless 1973] — the paper everyone cites; read it for the physical argument, not the recursion relations (those come later).\n3. [Kosterlitz 1974] [75] — the actual RG; note the diluteness assumption explicitly.\n4. [Nelson–Kosterlitz 1977] [3] — the universal jump; the cleanest prediction in the entire subject.\n5. [Minnhagen, Rev. Mod. Phys. 1987] — the review that re-attached Berezinskii's name and remains the most honest synthesis of what is and is not established."}], "references": [{"n": 1, "title": "Co-operation between the health professions.", "authors": ["Jane Crofton"], "year": 1977, "venue": "Munich Personal RePEc Archive (Ludwig Maximilian University of Munich)", "url": "https://openalex.org/W2406732768", "cited_by": 0, "bucket": "earliest"}, {"n": 2, "title": "1031 長寿の為の東洋的実践法 : 四季を通じての老人の食事と運動による健康管理についての一考察", "authors": ["不二雄 又井"], "year": 1977, "venue": "日本体育学会大会号", "url": "https://doi.org/10.1103/physreve.75.041112", "cited_by": 0, "bucket": "earliest"}, {"n": 3, "title": "Universal Jump in the Superfluid Density of Two-Dimensional Superfluids", "authors": ["David R. Nelson", "J. M. Kosterlitz"], "year": 1977, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/physrevlett.39.1201", "cited_by": 1350, "bucket": "earliest"}, {"n": 4, "title": "On the appearance, levels and regulation of pancreatic enzyme serum concentrations.", "authors": ["С А Тужилин", "David A. Dreiling"], "year": 1978, "venue": "Munich Personal RePEc Archive (Ludwig Maximilian University of Munich)", "url": "https://openalex.org/W2418094959", "cit   h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
