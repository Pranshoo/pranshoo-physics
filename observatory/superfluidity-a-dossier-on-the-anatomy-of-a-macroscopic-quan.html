 dogged Kapitza's geometry.\n\nThis is the first asymmetry of credit, and the most consequential. Kapitza's Nobel Prize, awarded in 1978, was for \"basic inventions and discoveries in the area of low-temperature physics\" — a formulation broad enough to encompass Helium II but elastic enough that his Nobel lecture said almost nothing about it, addressing instead high-temperature plasmas and controlled fusion [8]. Allen lived until 2001; Misener until 1996. Neither received a share. Several reasons are usually advanced — Kapitza's coining of the term, the political weight of returning a Nobel to a Soviet figure after the Sakharov era, and the unspoken Stockholm convention of awarding fluid discoveries to the eldest survivor — but none is adequate to the historical record. The juxtaposition in *Nature* speaks for itself; the priority is, to within the resolution of postal mail, simultaneous.\n\nA second asymmetry follows almost immediately. Three months later, Allen and Jones reported a phenomenon that no classical fluid can produce: a heat current applied to one arm of a U-tube of He II, packed with rouge powder, produced a steady fountain — a pressure head from a temperature gradient [9]. The thermomechanical effect was the first observation that two coupled mass currents (later: $\\rho_n \\mathbf{v}_n$ and $\\rho_s \\mathbf{v}_s$) had to be present. It is the most direct experimental signature of the two-fluid character of He II and, even today, it is given less pedagogical weight than the viscosity discovery, although it is conceptually deeper.\n\n### The Rollin film\n\nA third strand belongs to Oxford. Bernard Rollin observed in 1936–37 that He II climbed the walls of any container open to its vapour, forming a creeping film $\\sim 30$ nm thick that transported helium against gravity until levels equalised; the publication record, complicated by the war, runs through Rollin and Simon (1939) and through Daunt and Mendelssohn's slightly later, more systematic Oxford measurements. In the textbook tradition the *Rollin film* is named only inconsistently; the phenomenon is often presented as having been discovered by Daunt and Mendelssohn, who in fact extended and quantified it. The early review by Darrow [10] is one of the few wartime English-language sources that gives Rollin priority by name, and Mendelssohn's own retrospective discussion in 1945 [11] explicitly preserves the Oxford lineage.\n\n### The shape of the credit\n\nBy the time Tisza submitted to *Nature* in May 1938 [12] and London submitted in March [13] — the first to propose a microscopic identification with BEC, the second to build a phenomenological two-fluid hydrodynamics — the *experimental* foundation was already set: Onnes's density anomaly, Wolfke–Keesom's two-phase identification, Keesom–Keesom's $\\lambda$-anomaly, Kapitza's and Allen–Misener's simultaneous viscosity papers, Allen–Jones's fountain, and Rollin's film. Six independent observations, eight or nine names. The textbook compression to \"Kapitza discovered superfluidity in 1938\" is therefore wrong in three distinct ways at once: it erases a co-discovery (Allen and Misener), it erases a co-discovery of the earlier phase identification (Wolfke), and it conflates the *naming* with the *discovery*. Balibar's historical surveys [14, 15] and Donnelly's *Physics Today* article [5] are the most reliable English-language correctives; the primary literature [3, 4, 6, 7, 9] is, as ever, the only place where the record cannot be retouched.\n\nThe deepest irony in the early record is this: the two figures most loudly silenced by the canonical narrative — Wolfke and Misener — between them bracket the phenomenon (the phase identification at one end, the frictionless flow at the other), and neither was Soviet, neither was British by birth, and neither died early. The asymmetry of credit is not, in their case, the usual artefact of language or longevity. It is something closer to inertia: the canonical story was written down too quickly, by Landau in 1941 and by London in 1954 [16], and the historical machinery to revise it — Balibar's reconstructions, Donnelly's archival work — arrived only after the textbooks had ossified."}, {"id": "the-physics-pedagogical-core", "title": "The Pedagogical Core: Two-Fluid Hydrodynamics, the Landau Criterion, and ODLRO", "markdown": "## The Pedagogical Core: Two-Fluid Hydrodynamics, the Landau Criterion, and ODLRO\n\nThree formal scaffolds carry almost all of the working physicist's intuition about He II: the two-fluid equations (kinematic), the Landau critical-velocity criterion (spectral), and off-diagonal long-range order (statistical-mechanical). They were assembled in that order between 1938 and 1956, by four different people, and they sit at three different levels of description. A clean derivation makes the joints visible — and exposes where the textbook glosses are silently wrong.\n\n### Two-fluid hydrodynamics\n\nPostulate, with Tisza [12] and Landau [17], that below $T_\\lambda$ the local state of the liquid is specified by two independent velocity fields $\\mathbf{v}_s(\\mathbf{r},t)$ and $\\mathbf{v}_n(\\mathbf{r},t)$ and two densities $\\rho_s,\\rho_n$ with $\\rho=\\rho_s+\\rho_n$. The mass current is\n\n$$\\mathbf{j} = \\rho_s \\mathbf{v}_s + \\rho_n \\mathbf{v}_n.$$\n\nThe defining kinematic assumptions — *not derivations* — are: (i) the superfluid component carries no entropy, so the entropy current is $\\rho s \\mathbf{v}_n$; (ii) the superfluid flow is irrotational, $\\nabla\\times\\mathbf{v}_s=0$, except on singular vortex cores; (iii) in linear response no friction couples the two components, although mutual friction restores itself once vortices appear (Hall–Vinen–Bekarevich–Khalatnikov). The first two assumptions are exact consequences of $\\mathbf{v}_s=(\\hbar/m)\\nabla\\varphi$ once the macroscopic phase $\\varphi$ exists; in Tisza's 1938 paper they were postulates.\n\nMass and entropy conservation read\n\n$$\\partial_t\\rho + \\nabla\\!\\cdot\\!\\mathbf{j}=0,\\qquad \\partial_t(\\rho s) + \\nabla\\!\\cdot(\\rho s\\,\\mathbf{v}_n)=0.$$\n\nThe Euler equation for the superfluid is driven by the gradient of the chemical potential per unit mass,\n\n$$\\partial_t \\mathbf{v}_s + (\\mathbf{v}_s\\!\\cdot\\!\\nabla)\\mathbf{v}_s = -\\nabla\\mu,\\qquad d\\mu = -s\\,dT + \\rho^{-1}dp,$$\n\nwhile the normal component obeys a Navier–Stokes-like equation with viscosity $\\eta_n$ and a thermomechanical force $\\rho_n s\\nabla T$,\n\n$$\\rho_n\\bigl[\\partial_t\\mathbf{v}_n+(\\mathbf{v}_n\\!\\cdot\\!\\nabla)\\mathbf{v}_n\\bigr] = -\\frac{\\rho_n}{\\rho}\\nabla p - \\rho_n s\\nabla T + \\eta_n\\nabla^2\\mathbf{v}_n.$$\n\nThe structural point: it is the *temperature gradient* that pushes the normal fluid, and it is the *pressure gradient* alone that, in the absence of $\\nabla T$, would push the superfluid. The fountain effect [9] follows in one line: in a steady state with $\\mathbf{v}_s$ irrotational and $\\mathbf{j}=0$ across a superleak, $\\nabla\\mu=0$ gives $\\Delta p = \\rho s\\,\\Delta T$.\n\nLinearising about rest and assuming an adiabatic equation of state, one obtains two coupled wave equations. The decoupling proceeds cleanly when the thermal expansion of $^4$He is neglected (an excellent approximation below $T_\\lambda$): the density mode is ordinary (first) sound,\n\n$$\\omega_1^2 = \\left(\\partial p/\\partial\\rho\\right)_s k^2,$$\n\nand the entropy/temperature mode is second sound,\n\n$$\\boxed{\\;\\omega_2^2 = \\frac{\\rho_s}{\\rho_n}\\,\\frac{s^2 T}{c_p}\\,k^2\\;}$$\n\nwith the standard caveat that $c_p\\to c_v$ in the incompressible limit and the two coincide only when expansion vanishes [17, 12]. Second sound *is* a temperature wave: at a node the two components counterflow with $\\rho_s\\mathbf{v}_s+\\rho_n\\mathbf{v}_n=0$, so no mass moves but entropy oscillates. Peshkov's 1944 observation of $u_2\\approx 20$ m/s at 1.6 K turned this prediction into the most dramatic post-war vindication of the two-fluid picture; Andronikashvili's torsional disks [credit-audit entry] independently fixed $\\rho_n(T)/\\rho$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eTwo-fluid kinematics and the dispersion landscape\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eTwo-fluid picture: counterflow, first sound, second sound\u003c/text\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003crect x=\"30\" y=\"50\" width=\"320\" height=\"120\" rx=\"6\"/\u003e\u003c/g\u003e\u003ctext x=\"190\" y=\"44\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003echannel cross-section\u003c/text\u003e\u003cg\u003e\u003cline x1=\"60\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#7aa2ff\" stroke-width=\"2\" marker-end=\"url(#aN)\"/\u003e\u003cline x1=\"60\" y1=\"100\" x2=\"160\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"2\" marker-end=\"url(#aN)\"/\u003e\u003cline x1=\"60\" y1=\"120\" x2=\"160\" y2=\"120\" stroke=\"#7aa2ff\" stroke-width=\"2\" marker-end=\"url(#aN)\"/\u003e\u003ctext x=\"170\" y=\"105\" fill=\"#7aa2ff\" font-size=\"14\"\u003ev_n (carries s)\u003c/text\u003e\u003cline x1=\"320\" y1=\"80\" x2=\"220\" y2=\"80\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#aS)\"/\u003e\u003cline x1=\"320\" y1=\"100\" x2=\"220\" y2=\"100\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#aS)\"/\u003e\u003cline x1=\"320\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#aS)\"/\u003e\u003ctext x=\"60\" y=\"155\" fill=\"#ffb86b\" font-size=\"14\"\u003ev_s (∇×v_s = 0)\u003c/text\u003e\u003c/g\u003e\u003cdefs\u003e\u003cmarker id=\"aN\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7aa2ff\"/\u003e\u003c/marker\u003e\u003cmarker id=\"aS\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#ffb86b\"/\u003e\u003c/marker\u003e\u003cmarker id=\"aR\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7ee0a3\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"190\" y=\"178\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003ecounterflow: ρ_s v_s + ρ_n v_n = 0 ⇒ no net mass, pure heat transport\u003c/text\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003cline x1=\"410\" y1=\"350\" x2=\"690\" y2=\"350\"/\u003e\u003cline x1=\"410\" y1=\"350\" x2=\"410\" y2=\"60\"/\u003e\u003c/g\u003e\u003ctext x=\"690\" y=\"368\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003ep\u003c/text\u003e\u003ctext x=\"400\" y=\"68\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003eε(p)\u003c/text\u003e\u003cpath d=\"M410,350 Q470,250 540,210 Q600,180 640,170 L690,170\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ccircle cx=\"560\" cy=\"208\" r=\"3\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"568\" y=\"206\" fill=\"#ff7a90\" font-size=\"12\"\u003eroton min (Δ, p₀)\u003c/text\u003e\u003cline x1=\"410\" y1=\"350\" x2=\"500\" y2=\"260\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"430\" y=\"280\" fill=\"#7aa2ff\" font-size=\"12\"\u003ephonon ε = c p\u003c/text\u003e\u003cline x1=\"410\" y1=\"350\" x2=\"560\" y2=\"208\" stroke=\"#ff7a90\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\"/\u003e\u003ctext x=\"500\" y=\"320\" fill=\"#ff7a90\" font-size=\"12\"\u003eslope = Δ/p₀ = v_c\u003c/text\u003e\u003ctext x=\"550\" y=\"80\" fill=\"#e8e6e1\" font-size=\"12\"\u003eLandau criterion:\u003c/text\u003e\u003ctext x=\"550\" y=\"98\" fill=\"#e8e6e1\" font-size=\"12\"\u003ev_c = min_p ε(p)/p\u003c/text\u003e\u003c/svg\u003e\n*Figure: Left — two-fluid counterflow geometry: the normal component carries all the entropy, the superfluid all the irrotational mass flow; their cancellation in the mass current is what makes second sound a pure temperature wave. Right — Landau's phonon–roton spectrum; the tangent from the origin to the roton minimum sets the critical velocity $v_c=\\Delta/p_0$.*\n\n### The Landau critical-velocity criterion\n\nConsider a body of mass $M$ moving at velocity $\\mathbf{v}$ through the fluid at $T=0$. In the rest frame of the body the fluid energy and momentum are $E$ and $\\mathbf{P}$; under a Galilean boost back to the lab frame,\n\n$$E' = E + \\mathbf{v}\\!\\cdot\\!\\mathbf{P} + \\tfrac{1}{2}Mv^2,$$\n\nso the energy cost of creating one excitation of energy $\\varepsilon(\\mathbf{p})$ and momentum $\\mathbf{p}$, as seen in the lab, is $\\varepsilon(\\mathbf{p})+\\mathbf{v}\\!\\cdot\\!\\mathbf{p}$. Spontaneous emission becomes energetically possible only when this can be negative, i.e. when $|\\mathbf{v}|\\ge \\varepsilon(\\mathbf{p})/|\\mathbf{p}|$ for some $\\mathbf{p}$. The threshold is\n\n$$\\boxed{\\;v_c = \\min_{\\mathbf{p}}\\,\\frac{\\varepsilon(\\mathbf{p})}{|\\mathbf{p}|}\\;}$$\n\n— geometrically, the slope of the tangent from the origin to the dispersion curve [17, 18]. For a phonon–roton spectrum the minimum is the *roton* tangent, $v_c=\\Delta/p_0 \\approx 60$ m/s, while for a free particle spectrum $\\varepsilon=p^2/2m$ the minimum is at $p\\to 0$ and $v_c=0$ — the ideal Bose gas is *not* superfluid. The argument flags its own assumptions explicitly: (a) Galilean invariance (broken in lattice or rotating systems — modify accordingly); (b) a well-defined quasiparticle spectrum (true only at low $T$ and below the Pitaevskii instability); (c) translational invariance (boundaries lower $v_c$ via vortex nucleation — the Feynman–Vinen geometry-dependent value, orders of magnitude below the roton tangent). It is precisely this geometric $v_c$ that experiments on flow through narrow channels measure, and the gap to the Landau bound is the loudest signal that vortex physics, not single-quasiparticle emission, sets the practical critical velocity.\n\n### ODLRO and the order parameter\n\nThe kinematic and spectral pictures say nothing about *why* there should be a macroscopic phase to differentiate in the first place. That gap was closed only in 1956 by Penrose and Onsager. Define the reduced one-body density matrix\n\n$$\\rho_1(\\mathbf{r},\\mathbf{r}') = \\langle \\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(\\mathbf{r}')\\rangle = \\sum_i n_i\\,\\chi_i^*(\\mathbf{r})\\chi_i(\\mathbf{r}').$$\n\nA system exhibits **off-diagonal long-range order** when, in the thermodynamic limit, one eigenvalue $n_0$ is of order $N$ — equivalently,\n\n$$\\lim_{|\\mathbf{r}-\\mathbf{r}'|\\to\\infty} \\rho_1(\\mathbf{r},\\mathbf{r}') = n_0\\,\\chi_0^*(\\mathbf{r})\\chi_0(\\mathbf{r}')\\ \\neq\\ 0.$$\n\nThe macroscopic eigenfunction $\\chi_0(\\mathbf{r})=\\sqrt{n_0/V}\\,e^{i\\varphi(\\mathbf{r})}$ supplies the phase whose gradient *is* the superfluid velocity, $\\mathbf{v}_s=(\\hbar/m)\\nabla\\varphi$. Single-valuedness of $\\chi_0$ forces $\\oint\\mathbf{v}_s\\!\\cdot\\!d\\boldsymbol{\\ell}=n\\,h/m$ — the Onsager–Feynman circulation quantum, observed by Vinen on a vibrating wire in 1961 [19]. ODLRO is therefore the bridge that the 1938–1941 hydrodynamics lacks, and the structure that makes the irrotationality postulate a theorem.\n\n### Three levels, one phenomenon — and three honest caveats\n\nThe hierarchy is now visible. (i) Two-fluid hydrodynamics is a *kinematic* statement requiring $\\rho_s\u003e0$ and an irrotational $\\mathbf{v}_s$. (ii) Landau's criterion is a *spectral* statement requiring a quasiparticle dispersion that does not touch the $\\mathbf{v}\\!\\cdot\\!\\mathbf{p}$ cone. (iii) ODLRO is a *statistical-mechanical* statement about a macroscopic eigenvalue of $\\rho_1$. None of the three implies any other without additional hypotheses. The ideal Bose gas has ODLRO ($n_0/N=1$ at $T=0$) and $v_c=0$. A 2D Bose film below $T_{BKT}$ has $\\rho_s\u003e0$ and quasi-long-range order but *no* ODLRO [20]. He II has all three, but with $n_0/N\\approx 0.07$ while $\\rho_s/\\rho\\to 1$ — a 14-fold mismatch that single-handedly refutes \"superfluid density = condensate density\" and that no textbook conflation has the right to elide. The remainder of the dossier — Bogoliubov microscopics, vortex quantisation, the $^3$He matrix order parameter — operates on these three rails, and every confusion catalogued in §5 will turn out to be a category error among them."}, {"id": "evolution-of-the-formulation", "title": "From Tisza's Kinematics to Bogoliubov's Microscopics: What Superseded What", "markdown": "## From Tisza's Kinematics to Bogoliubov's Microscopics: What Superseded What\n\nThe theoretical edifice of superfluidity was built in three pulses between 1938 and 1956, with two important codas (Feynman–Cohen 1955; Vinen 1961). Each pulse partially overwrote its predecessor, and the modern textbook tends to read the result back into history as if it had been intended from the start. It was not.\n\n### Tisza 1938: kinematics grounded on the wrong microscopics\n\nWithin weeks of London's identification of the λ-point with Bose–Einstein degeneracy [13], Tisza proposed that He II be treated as two interpenetrating fluids: the condensed fraction (zero entropy, zero viscosity, velocity field $\\mathbf v_s$) and the thermally excited fraction (carrying all the entropy, viscous, velocity field $\\mathbf v_n$) [12]. The kinematic content is exactly what survives in every modern textbook: two independent mass currents, an entropy current $s\\rho_n\\mathbf v_n$ carried only by the normal component, and — as a non-trivial consequence — a second propagating mode in which $\\mathbf v_s$ and $\\mathbf v_n$ oscillate in antiphase at fixed total density. That mode is *second sound*, predicted before any apparatus could measure it.\n\nThe microscopic underpinning Tisza offered was, however, the literal Bose–Einstein condensate of an ideal gas: $\\rho_s/\\rho$ was to be identified with the condensate fraction $n_0(T)/n$ of the textbook BEC formula. This is the part Landau attacked, and the part that did not survive.\n\n### Landau 1941: replacing the microscopics, keeping the equations\n\nLandau's \"Theory of the Superfluidity of Helium II\" [17] does three distinct things, and conflating them is the standard pedagogical error.\n\nFirst, he rewrites the two-fluid equations in a fully Galilean-covariant form, derives the thermodynamic identities relating $\\rho_s$, $\\rho_n$, $s$, and the chemical potential, and obtains second sound as a clean prediction (later [18] he tightened the derivation against Tisza's [21] objections).\n\nSecond, he postulates a phonon–roton excitation spectrum\n$$\\varepsilon(p) = \\begin{cases} c\\,p \u0026 p \\ll p_0 \\\\ \\Delta + (p-p_0)^2/(2\\mu) \u0026 p \\approx p_0 \\end{cases}$$\nand identifies the normal fluid with the gas of these excitations, so that\n$$\\rho_n(T) \\;=\\; -\\frac{1}{3}\\!\\int\\! \\frac{d^3p}{(2\\pi\\hbar)^3}\\, p^2 \\frac{\\partial n_B(\\varepsilon(p))}{\\partial \\varepsilon}.$$\nThis is a Galilean transformation from the rest frame of the superflow into the lab frame: the momentum carried by thermal quasiparticles, weighted by $\\partial_\\varepsilon n_B$, is the inertial mass of the normal component. It contains no reference to a condensate.\n\nThird, he formulates the *Landau critical-velocity criterion*: superflow is stable against quasiparticle emission only if\n$$v \u003c v_L \\;\\equiv\\; \\min_p \\frac{\\varepsilon(p)}{p}.$$\nFor He II this minimum sits at the roton: $v_L \\approx 58\\ \\mathrm{m\\,s^{-1}}$. Above $v_L$ a quasiparticle can be emitted into the moving fluid without violating energy–momentum conservation.\n\nWhat Landau *rejected* was London's identification of $\\rho_s$ with $n_0$. What he *retained*, without saying so, was Tisza's kinematic skeleton: continuity, two Euler-type equations, entropy convection by the normal component. Donnelly's archive work [5] and Balibar's [14] documentary reconstruction make the citation history unambiguous; the modern label \"Landau's two-fluid model\" misallocates the kinematics.\n\n### Bogoliubov 1947: the missing microscopic theory\n\nTisza had the right kinematics with the wrong microscopics; Landau had the right kinematics with no microscopics at all — only a phenomenological spectrum. Bogoliubov supplied the missing layer for *weakly interacting* bosons [22]. Starting from\n$$\\hat H = \\sum_{\\mathbf k} \\frac{\\hbar^2 k^2}{2m}\\,\\hat a^\\dagger_{\\mathbf k}\\hat a_{\\mathbf k} + \\frac{1}{2V}\\sum_{\\mathbf k,\\mathbf k',\\mathbf q} V_q\\, \\hat a^\\dagger_{\\mathbf k+\\mathbf q}\\hat a^\\dagger_{\\mathbf k'-\\mathbf q}\\hat a_{\\mathbf k'}\\hat a_{\\mathbf k},$$\nhe replaced $\\hat a_0,\\hat a_0^\\dagger \\to \\sqrt{N_0}$ (the *Bogoliubov prescription*: the condensate is macroscopically occupied, its operators are c-numbers), kept terms quadratic in $\\hat a_{\\mathbf k\\ne 0}$, and diagonalised with\n$$\\hat a_{\\mathbf k} = u_k\\,\\hat\\alpha_{\\mathbf k} - v_k\\,\\hat\\alpha^\\dagger_{-\\mathbf k}, \\quad u_k^2 - v_k^2 = 1.$$\nThe result is the celebrated dispersion\n$$\\varepsilon_B(k) = \\sqrt{\\frac{\\hbar^2 k^2}{2m}\\!\\left(\\frac{\\hbar^2 k^2}{2m} + 2 n V_0\\right)},$$\nlinear ($\\varepsilon \\approx \\hbar c k$, $c = \\sqrt{n V_0/m}$) at small $k$, free-particle at large $k$, and — crucially — satisfying $v_L = c \u003e 0$. The Landau criterion is *derived*, not postulated.\n\nTwo subtleties tend to be glossed over. (a) Bogoliubov's spectrum has no roton minimum: it is purely phononic at low $k$ and quadratic at high $k$. The roton is a strong-coupling feature of dense $^4$He, not generic to Bose superfluidity. (b) Even at $T=0$, particles are kicked out of the condensate by the interaction: $N_0/N \u003c 1$. The *quantum depletion* is\n$$1 - \\frac{N_0}{N} = \\frac{8}{3\\sqrt{\\pi}}(n a^3)^{1/2},$$\nfinite but small for dilute gases; in liquid $^4$He, where $n a^3$ is of order unity, the depletion is enormous and $N_0/N \\sim 0.07$–$0.10$ — yet $\\rho_s/\\rho \\to 1$. This is the empirical wedge that finally pries $\\rho_s$ apart from $n_0$.\n\n### Penrose–Onsager 1956: ODLRO as the order parameter\n\nThe conceptual cleanup was Penrose \u0026 Onsager's. They defined the *order parameter* of Bose superfluidity as the largest eigenvalue $\\lambda_0$ of the one-body density matrix\n$$\\rho_1(\\mathbf r,\\mathbf r') = \\langle \\hat\\psi^\\dagger(\\mathbf r)\\,\\hat\\psi(\\mathbf r') \\rangle, \\qquad \\lim_{|\\mathbf r - \\mathbf r'|\\to\\infty} \\rho_1(\\mathbf r,\\mathbf r') = \\frac{N_0}{V} \\neq 0.$$\nA finite limit at infinite separation — *off-diagonal long-range order* — is the precise sense in which \"a macroscopic number of particles occupy a single one-particle state\" survives the interactions that destroyed London's naïve picture. Two things are subsumed here. London's BEC criterion is rehabilitated, but as a statement about $\\rho_1$ rather than about a free-particle level. And Bogoliubov's c-number prescription $\\hat a_0 \\to \\sqrt{N_0}$ is recognised as a spontaneous breaking of global $U(1)$: the condensate wavefunction $\\Psi_0(\\mathbf r) = \\sqrt{n_0}\\,e^{i\\varphi(\\mathbf r)}$ acquires a definite phase, and gradients of that phase are the superfluid velocity,\n$$\\mathbf v_s = \\frac{\\hbar}{m}\\nabla\\varphi.$$\nODLRO is *necessary* for Bose superfluidity in $d \\ge 3$; in $d=2$ it is destroyed at any $T\u003e0$ by long-wavelength phase fluctuations (Mermin–Wagner–Hohenberg), yet superfluidity survives via BKT [20]. The conflation of \"BEC\" with \"superfluidity\" was already wrong in 1956; it became *manifestly* wrong in 1973.\n\n### Feynman–Cohen 1955 and the roton as a microscopic object\n\nFeynman's variational programme [23, 24] supplied what Landau had left phenomenological. Using the Bijl–Feynman ansatz\n$$|\\Psi_{\\mathbf k}\\rangle = \\sum_i e^{i\\mathbf k\\cdot\\mathbf r_i}\\,|\\Phi_0\\rangle, \\qquad \\varepsilon_F(k) = \\frac{\\hbar^2 k^2}{2 m S(k)},$$\nhe reproduced the phonon branch and a minimum at $k_0 \\approx 2\\pi/r_{\\rm nn}$ — Landau's roton — but with $\\Delta_F \\approx 19$ K, nearly a factor two too large. Feynman \u0026 Cohen restored the missing dipolar *backflow*,\n$$|\\Psi_{\\mathbf k}\\rangle = \\sum_i e^{i\\mathbf k\\cdot\\mathbf r_i}\\!\\left[1 + i \\sum_{j\\neq i} g(r_{ij})\\,\\hat{\\mathbf k}\\cdot\\hat{\\mathbf r}_{ij}\\right]|\\Phi_0\\rangle,$$\nwhich pulls $\\Delta$ down to $\\approx 11.5$ K, within a few percent of the neutron-scattering value. The roton is thus reinterpreted: not a free quasiparticle of momentum $p_0$ but a *localised current pattern* — a smoke-ring of probability — whose backflow tail is dictated by mass conservation in the surrounding fluid.\n\n### Onsager 1949, Feynman 1955: the topological coda\n\nThe phase $\\varphi$ is multi-valued; its line integral around a closed loop must be a multiple of $2\\pi$, so\n$$\\oint \\mathbf v_s\\cdot d\\boldsymbol\\ell = n\\,\\frac{h}{m}.$$\nOnsager stated this as a one-paragraph discussion remark at the 1949 Florence statistical-hydrodynamics meeting [25], identifying rotational flow with arrays of singular vortex lines of circulation $h/m$. Feynman, apparently unaware, re-derived it in 1955 and built the vortex-line theory of rotating helium, mutual friction, and the connection to the roton [24]. The pedagogical \"Onsager–Feynman quantum\" hyphenates a six-year priority — and obscures that Onsager arrived at it from hydrodynamic topology (a circulation theorem made integer by the phase) while Feynman arrived at it from microscopic wave-function continuity. Vinen's 1961 detection of a single quantum on a vibrating wire [19] closed the loop empirically.\n\nWhat survived: Tisza's kinematics, Bogoliubov's u–v structure, Penrose–Onsager's ODLRO, the Onsager–Feynman circulation quantum. What was superseded: London's identification $\\rho_s = n_0$, Landau's outright rejection of the BEC connection, Feynman's bare phonon–roton ansatz without backflow. The four surviving pieces are not a single theory; they are four answers to four different questions — kinematic, microscopic, structural, topological — that \"superfluidity\" silently rolls into one."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From Andronikashvili's Disks to Vinen's Single Quantum", "markdown": "## Landmark Experiments: From Andronikashvili's Disks to Vinen's Single Quantum\n\nBetween 1946 and 1967 a sequence of half a dozen experiments turned the two-fluid picture from a kinematic accounting scheme into a quantitative theory whose every parameter could be weighed. Each of these experiments isolates exactly one of the conceptual ingredients laid out in §3 — $\\rho_s/\\rho$, the entropy-carrying second-sound mode, the phonon–roton spectrum, the quantum of circulation $\\kappa=h/m$, and the non-classical rotational response — and measures it directly. Read in chronological order they reconstruct the logical order of the theory in reverse: kinematics first, spectrum next, topology last.\n\n### Andronikashvili (Tbilisi, 1946): the superfluid fraction\n\nElephter Andronikashvili's torsional-pendulum experiment is the experiment in superfluidity. A stack of approximately fifty thin aluminium disks, $\\sim 4\\text{ cm}$ in diameter and separated by $\\sim 0.2\\text{ mm}$, was suspended on a fine torsion fibre and immersed in He II. The stack was driven at $\\omega/2\\pi \\sim 10$–$30$ Hz, where the viscous penetration depth $\\delta_v = \\sqrt{2\\eta_n/\\rho_n\\omega}$ — evaluated with the *normal*-component viscosity — is comparable to the inter-disk gap. The normal fluid therefore co-moves rigidly with the stack; the superfluid, having $\\eta_s = 0$ and no normal-mode response on these length scales, is mechanically decoupled. Measuring the period $T(T_\\text{bath})$ of the loaded pendulum and subtracting the empty-cell value gave the entrained normal-fluid mass and hence $\\rho_n(T)$, from which $\\rho_s = \\rho - \\rho_n$. The result was decisive: $\\rho_s \\to 0$ at $T_\\lambda^-$ with critical behaviour now known to belong to the 3D-XY class, and $\\rho_s/\\rho \\to 1$ at $T \\lesssim 1$ K. This is the single curve that Landau (1941) [17] had no way to compute *a priori* — the two-fluid formalism needs $\\rho_s(T)$ as an input — and it is what made the model predictive.\n\n### Peshkov (Moscow, 1944–46): second sound\n\nTisza had predicted [12], and Landau had re-derived from a different microscopics [17], a wave in which $\\mathbf{v}_s$ and $\\mathbf{v}_n$ oscillate in counter-phase at fixed total mass current. Such a wave carries entropy and temperature, not density, so it cannot be excited by a piston: V. P. Peshkov used a Joule-heated metallic film at one end of a tube of He II and a carbon-resistance thermometer at the other, driving the heater at audio frequencies and locating standing-wave nodes. The resulting velocity $u_2(T)$ rose from zero at $T_\\lambda$, peaked at $\\sim 20\\text{ m s}^{-1}$ near $1.6$ K, and approached a plateau near $u_1/\\sqrt{3}$ in the deep phonon regime — precisely the Landau formula\n$$\nu_2^2 \\;=\\; \\frac{\\rho_s}{\\rho_n}\\,\\frac{T s^2}{c_v},\n$$\nwith $s$ and $c_v$ taken from independent calorimetry [4]. The Peshkov data closed the thermodynamic loop: $\\rho_s/\\rho_n$ measured mechanically (Andronikashvili) and thermally (Peshkov) agreed within experimental error, vindicating the two-fluid scaffolding without recourse to any microscopic picture.\n\n### Henshaw–Woods (Chalk River, 1961) and Cowley–Woods (1971): the phonon–roton spectrum\n\nLandau's $\\varepsilon(p) = cp$ at small $p$ and $\\Delta + (p-p_0)^2/2\\mu$ near the roton minimum was, until 1957, a thermodynamic ansatz constrained by specific-heat data alone. Inelastic neutron scattering — measuring the dynamic structure factor $S(Q,\\omega)$, whose single-quasiparticle pole sits at $\\hbar\\omega = \\varepsilon(Q)$ for a Bose liquid (Pines–Nozières f-sum rule) — finally gave the spectrum directly. Henshaw and Woods (1961) at the NRX reactor mapped the curve from $Q \\approx 0.3$ to $2.7\\text{ Å}^{-1}$ and extracted $c_{\\text{sound}} = 238 \\pm 5\\text{ m s}^{-1}$, a roton minimum at $Q_0 = 1.91\\text{ Å}^{-1}$, gap $\\Delta/k_B = 8.65 \\pm 0.04$ K, and effective mass $\\mu = 0.16\\,m_4$ (verify). Cowley and Woods (1971) repeated and refined the measurement at lower temperature with higher resolution, resolving the multi-phonon continuum above $2\\Delta$ and the temperature dependence of $\\Delta$ that determines roton–roton scattering [17]. The numerical agreement with Feynman–Cohen's variational backflow ansatz [24] was qualitatively good but quantitatively wrong by a fixed offset of $\\sim 20\\%$ in $\\Delta$ — a discrepancy still not analytically resolved, and a quiet reminder that He II is strongly correlated.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\n \u003cline x1=\"60\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\n \u003cline x1=\"60\" y1=\"340\" x2=\"60\" y2=\"30\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\n \u003ctext x=\"375\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003emomentum Q (Å⁻¹)\u003c/text\u003e\n \u003ctext x=\"20\" y=\"185\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 20 185)\"\u003eε(Q)/k_B (K)\u003c/text\u003e\n \u003cline x1=\"165\" y1=\"340\" x2=\"165\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"270\" y1=\"340\" x2=\"270\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"375\" y1=\"340\" x2=\"375\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"465\" y1=\"340\" x2=\"465\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"585\" y1=\"340\" x2=\"585\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\n \u003ctext x=\"165\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e0.5\u003c/text\u003e\n \u003ctext x=\"270\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e1.0\u003c/text\u003e\n \u003ctext x=\"375\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e1.5\u003c/text\u003e\n \u003ctext x=\"465\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e1.93\u003c/text\u003e\n \u003ctext x=\"585\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e2.5\u003c/text\u003e\n \u003cline x1=\"55\" y1=\"278\" x2=\"60\" y2=\"278\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"55\" y1=\"215\" x2=\"60\" y2=\"215\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"55\" y1=\"154\" x2=\"60\" y2=\"154\" stroke=\"#e8e6e1\"/\u003e\n \u003cline x1=\"55\" y1=\"92\" x2=\"60\" y2=\"92\" stroke=\"#e8e6e1\"/\u003e\n \u003ctext x=\"50\" y=\"282\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e5\u003c/text\u003e\n \u003ctext x=\"50\" y=\"219\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e10\u003c/text\u003e\n \u003ctext x=\"50\" y=\"158\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e15\u003c/text\u003e\n \u003ctext x=\"50\" y=\"96\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e20\u003c/text\u003e\n \u003cline x1=\"60\" y1=\"340\" x2=\"300\" y2=\"166\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/\u003e\n \u003ctext x=\"180\" y=\"240\" fill=\"#7ee0a3\" font-size=\"13\"\u003eε = ℏcQ (c = 238 m/s)\u003c/text\u003e\n \u003cpath d=\"M 60 340 Q 130 280 207 195 Q 250 165 270 166 Q 310 170 340 195 Q 400 230 465 233 Q 510 230 555 200 Q 620 155 690 117\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.2\"/\u003e\n \u003ccircle cx=\"270\" cy=\"166\" r=\"4\" fill=\"#ffb86b\"/\u003e\n \u003ctext x=\"282\" y=\"160\" fill=\"#ffb86b\" font-size=\"13\"\u003emaxon (~14 K)\u003c/text\u003e\n \u003ccircle cx=\"465\" cy=\"233\" r=\"4\" fill=\"#ff7a90\"/\u003e\n \u003ctext x=\"478\" y=\"252\" fill=\"#ff7a90\" font-size=\"13\"\u003eroton Δ/k_B = 8.65 K\u003c/text\u003e\n \u003cline x1=\"465\" y1=\"233\" x2=\"465\" y2=\"340\" stroke=\"#ff7a90\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/\u003e\n \u003ctext x=\"470\" y=\"305\" fill=\"#ff7a90\" font-size=\"11\"\u003eQ₀ = 1.93 Å⁻¹\u003c/text\u003e\n \u003ctext x=\"350\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ephonon–roton dispersion of He II (Henshaw–Woods 1961; Cowley–Woods 1971)\u003c/text\u003e\n\u003c/svg\u003e\n*Figure: Single-quasiparticle dispersion $\\varepsilon(Q)$ extracted from inelastic neutron $S(Q,\\omega)$. The linear phonon branch ($c=238\\text{ m s}^{-1}$) sets $u_1$; the roton gap $\\Delta/k_B = 8.65$ K dominates the thermodynamics above $\\sim 0.6$ K. Landau's criterion $v_{c,\\text{intr}} = \\min_Q \\varepsilon(Q)/\\hbar Q \\approx 60\\text{ m s}^{-1}$ is fixed by the line from the origin tangent to the roton minimum (not drawn).*\n\n### Vinen (Cambridge, 1961): one quantum of circulation\n\nOnsager's 1949 remark [25] and Feynman's vortex-line picture [24] both predict that any circulation trapped around a multiply-connected region of superfluid is quantised in units $\\kappa = h/m_4 = 9.97 \\times 10^{-4}\\text{ cm}^2\\text{ s}^{-1}$. W. F. Vinen [19] devised the cleanest possible test. A $25\\,\\mu$m phosphor-bronze wire was stretched along the axis of a cylindrical can of He II. The wire supports two degenerate transverse vibrational modes; trapped circulation around the wire breaks the degeneracy via the Magnus force $\\mathbf{F} = \\rho_s\\,\\boldsymbol{\\kappa}\\times\\mathbf{v}$, splitting the mode frequencies by\n$$\n\\Delta\\omega \\;=\\; \\frac{\\rho_s\\,\\kappa}{2\\,m_\\text{wire}'},\n$$\nwhere $m_\\text{wire}'$ includes hydrodynamic mass. Detecting the slow beat between the two modes — initially excited together — gave $\\Delta\\omega$ and hence $\\kappa$. Vinen observed plateaux at $\\kappa$ and $2\\kappa$ with no values between them; the experiment ran for hours without decay, the persistent-current half of the result. This is the first direct measurement of a macroscopic quantum number in a fluid and the operational definition by which all subsequent quantum-fluid circulation experiments (atomic-condensate vortex lattices, $^3$He-B circulation) are calibrated.\n\n### Hess–Fairbank (Stanford, 1967): non-classical rotational inertia\n\nThe mechanical analogue of the Meissner effect — a superfluid refusing to rotate with its container — was demonstrated by G. B. Hess and W. M. Fairbank. A cylindrical cell of He II was set rotating at an angular velocity $\\Omega$ well below the critical $\\Omega_{c1}$ for vortex nucleation ($\\Omega_{c1} \\approx (\\kappa/\\pi R^2)\\ln(R/a_0) \\sim 10^{-3}\\text{ rad s}^{-1}$ for laboratory cells) and then cooled through $T_\\lambda$. Above $T_\\lambda$ the entire normal liquid co-rotated, with angular momentum $L_\\text{cl} = I_\\text{cl}\\Omega$. Below $T_\\lambda$ the equilibrium angular momentum dropped to $L = (\\rho_n/\\rho)\\,I_\\text{cl}\\Omega$, the superfluid component remaining at rest in the lab frame because the curl-free constraint $\\nabla\\times\\mathbf{v}_s = 0$ admits no rigid-body solution. The measured deficit $(\\rho_s/\\rho)\\,I_\\text{cl}\\Omega$ tracked Andronikashvili's curve quantitatively, vindicating the Landau two-fluid thermodynamics at *zero* drive frequency and giving the operational definition of \"superfluid density\" — non-classical rotational inertia (NCRI) — that Leggett later adopted as the diagnostic for supersolidity.\n\nTogether these five experiments form the experimental skeleton of the two-fluid model. Andronikashvili and Hess–Fairbank weigh $\\rho_s/\\rho$ at finite and zero frequency; Peshkov isolates the entropy-carrying counter-current; Henshaw–Woods give the spectrum that determines $\\rho_n(T)$ and the Landau bound on $v_c$; Vinen exhibits the macroscopic phase as a measurable integer. Everything Tisza [12], Landau [17], Bogoliubov [22], Onsager [25], Feynman [24] and Penrose–Onsager wrote down between 1938 and 1956 had, by 1967, been weighed."}, {"id": "validity-audit-and-conflations", "title": "Validity Audit: Where the Modern Literature Confuses Itself", "markdown": "## Validity Audit: Where the Modern Literature Confuses Itself\n\nFive errors have crystallised into folklore. Each survives because the underlying equation is still *correct* in some restricted regime, and the regime is no longer mentioned when the equation is invoked. What follows is a regime-by-regime audit, in roughly decreasing order of damage done.\n\n### 5.1 \"Superfluidity = Bose–Einstein condensation\"\n\nThis is the headline conflation, and the one most likely to survive into the next generation of textbooks because it is *almost* true for the systems people actually compute with. The two statements are formally distinct:\n\n- **BEC** is a statement about the one-body density matrix: $\\rho_1(\\mathbf{r},\\mathbf{r}') = \\langle \\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(\\mathbf{r}')\\rangle$ has a macroscopic eigenvalue $N_0 \\sim N$ in the thermodynamic limit. Equivalently, $\\lim_{|\\mathbf{r}-\\mathbf{r}'|\\to\\infty}\\rho_1 = n_0 \\neq 0$ — Penrose–Onsager ODLRO.\n- **Superfluidity** is a statement about linear response: $\\rho_s$, defined by the difference between the response to a transverse (boost) and a longitudinal probe, is nonzero, *and* the spectrum admits a positive Landau critical velocity $v_L = \\min_{\\mathbf{p}} \\epsilon(\\mathbf{p})/p$ [17].\n\nThat the two are *logically* independent is settled by three counter-examples that every working physicist should keep in mind:\n\n1. **Ideal Bose gas.** BEC at $T_c = (n/\\zeta(3/2))^{2/3}\\, 2\\pi\\hbar^2/mk_B$, but $\\epsilon(p) = p^2/2m$, so $v_L = \\min_p p/2m = 0$. No superflow. The earliest correct identification of this gap is in Landau 1941 [17] and is dwelt on at length by Bogoliubov [22]; Blatt \u0026 Butler's mid-1950s papers [26, 27] make the case explicitly that interactions are what convert a condensate into a superfluid.\n2. **2D Bose fluid below $T_{\\rm BKT}$.** Mermin–Wagner forbids true ODLRO; the off-diagonal density matrix decays algebraically as $|\\mathbf{r}-\\mathbf{r}'|^{-\\eta(T)}$ with $\\eta \u003c 1/4$ at $T_{\\rm BKT}$. Yet $\\rho_s$ is finite and jumps by the universal Nelson–Kosterlitz value $\\rho_s(T_{\\rm BKT}^-)/T_{\\rm BKT} = 2m^2/\\pi\\hbar^2$ [20]. Superfluid, not condensed.\n3. **Strongly interacting 4He at $T=0$.** Direct neutron measurements (Sears et al., Glyde and collaborators) put $n_0 \\approx 0.07$–$0.10$, whereas $\\rho_s/\\rho \\to 1$. Superflow is carried almost entirely by atoms outside the condensate; the BEC fraction is a minority report.\n\nThe Bogoliubov derivation [22] is the one place where the two coincide *parametrically*: at weak coupling $\\rho_s/\\rho = 1 - O(T^4)$ and $N_0/N = 1 - 8/3\\sqrt{na^3/\\pi} + O(na^3)$ — both close to unity, but for entirely different reasons. Treating Bogoliubov as the *paradigm* of superfluidity is the historical mistake that propagated the conflation; treating it as the *limiting case* in which a one-parameter order can substitute for two is correct.\n\n### 5.2 \"He II\" (phase) vs \"superfluid\" (component)\n\nHe II is a thermodynamic phase below $T_\\lambda = 2.1768$ K. Inside it, two-fluid hydrodynamics applies:\n$$\\rho = \\rho_n(T) + \\rho_s(T), \\qquad \\mathbf{j} = \\rho_n \\mathbf{v}_n + \\rho_s \\mathbf{v}_s,$$\nwith $\\rho_s(T_\\lambda)=0$ and $\\rho_s(0)=\\rho$. The phase is He II; the *component* is the superfluid, and its weight is a continuous function of temperature [12, 17, 14]. Authors who write \"He II is the superfluid\" silently confuse phase with order parameter — at $T = 2.0$ K roughly 60% of the mass is normal, and any flow with $\\mathbf{v}_n \\neq 0$ entrains an entropy current $s\\rho_n\\mathbf{v}_n$ that is the very mechanism of the thermomechanical effect [9]. The pedagogical fallout: students taught that \"below $T_\\lambda$ helium flows without friction\" cannot understand why a heat-current measurement in He II shows a finite *effective* viscosity (Andronikashvili's experiment [14] is literally a measurement of $\\rho_n$ via the entrained-mass response to a torsional oscillator).\n\n### 5.3 Critical velocity: the Landau roton vs Feynman–Vinen vortex nucleation\n\nThe single most over-quoted formula in superfluidity is\n$$v_L = \\min_{\\mathbf{p}} \\frac{\\epsilon(\\mathbf{p})}{p} \\approx 58 \\text{ m s}^{-1}\\quad\\text{(roton minimum)}.$$\nThis is correct as a *kinematic upper bound* on dissipationless flow against a uniform background, derived in [17] and microscopically justified in [22]. It is almost never the velocity at which superflow in a real channel breaks down. Observed critical velocities lie in the range $10^{-2}$ to $10$ cm s$^{-1}$ — three to five orders of magnitude below Landau's value — and depend on the channel geometry as roughly $v_c \\sim (\\hbar/m d)\\ln(d/a_0)$ with $d$ the channel width and $a_0$ a vortex-core scale. The mechanism is *vortex nucleation*, identified by Feynman in [23, 24] and made quantitative by Vinen's circulation experiment [19]. Any paper claiming agreement with \"Landau's criterion\" at sub-cm/s velocities is either measuring the wrong thing or invoking the wrong criterion; the correct statement is that Landau's $v_L$ bounds the *intrinsic* instability of an excitation-free background, while Feynman–Vinen bounds the geometry-limited instability against vortex formation. Both are right; they answer different questions.\n\nA useful diagnostic: at $v \\to v_L$ the *bulk* spectrum becomes unstable, manifest in roton softening; at $v \\to v_c^{\\rm FV}$ the *boundary* nucleates singly-quantised vortices with $\\oint\\mathbf{v}_s\\cdot d\\boldsymbol\\ell = h/m$, the experimental signature of [19].\n\n### 5.4 The Tisza/Landau and Onsager/Feynman attributions\n\nThe kinematic structure of two-fluid hydrodynamics — distinct velocity fields $\\mathbf{v}_n,\\mathbf{v}_s$, entropy carried only by the normal component, the prediction of a second, temperature-wave mode — is Tisza's [12, 14]. Landau's 1941 paper [17] replaced Tisza's BEC-based microscopic justification by a thermodynamic split into ground state plus a gas of phonons and rotons, and dismissed Tisza by name; the *equations of motion* are nevertheless those of Tisza. The accurate citation is \"Tisza's two-fluid kinematics + Landau's phonon–roton spectrum\". The 1947 Bogoliubov derivation [22] supplies the microscopic justification Tisza had wanted.\n\nOnsager's $\\kappa = nh/m$ appeared as a one-paragraph footnote in the Florence 1949 conference discussion [25]; Feynman's vortex-line theory [23, 24] developed independently and in considerably more depth, but four years later. The hyphenation \"Onsager–Feynman\" is fair; the unhyphenated \"Feynman's quantisation condition\" found in many modern reviews is not.\n\n### 5.5 Equations that circulate with their assumptions stripped\n\nA short audit, in the form of *equation — silent assumption — failure mode*:\n\n- **$\\rho_s = \\rho - \\rho_n$ with $\\rho_n = -\\tfrac{1}{3}\\int (\\partial f/\\partial\\epsilon)\\, p^2\\, d^3p/(2\\pi\\hbar)^3$.** Valid for a dilute quasiparticle gas in a Galilean-invariant background. *Fails* whenever the excitation spectrum is gapped by a lattice (optical-lattice superfluids — the same formula gives $\\rho_s$ of the Bose–Hubbard model only up to a renormalisation by the effective mass $m^*$ [28]) or whenever the elementary excitations are not weakly interacting (rotons near $T_\\lambda$).\n- **Gross–Pitaevskii equation $i\\hbar\\partial_t\\psi = (-\\hbar^2\\nabla^2/2m + V + g|\\psi|^2)\\psi$.** Valid for dilute, weakly-interacting bosons at $T\\ll T_c$ where the condensate fraction $\\to 1$ [29]. *Fails* for 4He at any temperature (interactions strong, $n_0\\sim 0.07$) and for 2D systems near $T_{\\rm BKT}$ (no true condensate).\n- **Landau critical-velocity criterion.** Already discussed: valid as an upper bound; rarely the operative velocity in an experiment.\n- **$\\kappa = nh/m$.** Robust — derives from single-valuedness of $\\psi$ — but the implicit assumption is that the order parameter is a *complex scalar*. In 3He-A and -B [30, 31] the order parameter $d_{\\alpha i}(\\hat{\\mathbf{k}})$ is a 3$\\times$3 matrix, and the topology of defects (textures, half-quantum vortices, boojums) is governed by $\\pi_1(\\mathrm{SO}(3))=\\mathbb{Z}_2$ and $\\pi_2(\\mathrm{SU}(2)/U(1))$ rather than by $\\pi_1(U(1))=\\mathbb{Z}$. Quoting \"$\\kappa = nh/m$\" for 3He without flagging the matrix structure is wrong.\n- **$n_s/n = 1 - (T/T_\\lambda)^\\alpha$ scaling.** A *fit*, not a theorem; the actual critical exponent near $T_\\lambda$ is the 3D-XY value $\\nu \\approx 0.6717$ controlling $\\rho_s\\sim |T-T_\\lambda|^{(d-2)\\nu}$ [32].\n- **\"Two-fluid model is exact below $T_\\lambda$.\"** Exact in the long-wavelength, low-frequency limit only; at frequencies $\\omega \\tau_{\\rm roton} \\gtrsim 1$ the normal component does not behave as a Navier–Stokes fluid and one needs a full kinetic equation for the quasiparticle distribution [23, 22].\n\nThe healthy attitude is the one Penrose \u0026 Onsager (ODLRO) and Tisza (kinematics) and Landau (spectrum) and Bogoliubov (microscopics) collectively earned: *no single equation is superfluidity*. The phenomenon is the simultaneous satisfaction of (i) ODLRO or its 2D algebraic relative, (ii) a positive $\\rho_s$ in linear response, (iii) a positive Landau velocity $v_L$, and (iv) the existence of quantised vorticity. Anyone who quotes only one of the four is, somewhere, misleading their reader."}, {"id": "helium-three-and-unconventional-pairing", "title": "Superfluid 3He: p-Wave, Spin-Triplet, and the ABM/BW Order Parameters", "markdown": "## Superfluid 3He: p-Wave, Spin-Triplet, and the ABM/BW Order Parameters\n\n$^3$He is not a footnote to $^4$He. It is a different physical system that happens to share a name: a Fermi liquid of spin-$\\tfrac12$ atoms in which Cooper pairing — forbidden in the $s$-wave channel by the hard core — opens in an odd-parity channel at temperatures three orders of magnitude below $T_\\lambda$. The order parameter is no longer a complex scalar but a $3\\times 3$ matrix on the product of spin and orbital triads, and the phase diagram below $T_c \\approx 2.5\\,\\text{mK}$ at melting pressure contains at least two distinct broken-symmetry states whose identification took twenty-four months of confusion and an Oxford theorist with the right group-theoretic instinct [30].\n\n### The pairing channel and the matrix order parameter\n\nBegin with the Cooper-pair amplitude\n$$F_{\\alpha\\beta}(\\mathbf{k}) \\;=\\; \\langle c_{\\mathbf{k}\\alpha}\\, c_{-\\mathbf{k}\\beta}\\rangle.$$\nFermi statistics demand $F_{\\alpha\\beta}(\\mathbf{k})=-F_{\\beta\\alpha}(-\\mathbf{k})$. In a strongly repulsive liquid the singlet ($L=0$) channel is suppressed; the dominant attractive channel is $L=1$, which by antisymmetry forces $S=1$. The triplet amplitude is most compactly written via the **d-vector**:\n$$F_{\\alpha\\beta}(\\hat{\\mathbf{k}}) \\;=\\; \\bigl[\\,i\\,\\mathbf{d}(\\hat{\\mathbf{k}})\\!\\cdot\\!\\boldsymbol{\\sigma}\\,\\sigma_y\\,\\bigr]_{\\alpha\\beta},\n\\qquad \\mathbf{d}(\\hat{\\mathbf{k}}) \\;=\\; \\sum_{i=x,y,z} d_{\\alpha i}\\,\\hat{k}_i,$$\nso that the orbital $p$-wave dependence is linear in $\\hat{\\mathbf{k}}$ and the spin structure is encoded in the complex $3\\times 3$ matrix $d_{\\alpha i}$. The first index $\\alpha\\in\\{x,y,z\\}$ lives in spin space; the second $i\\in\\{x,y,z\\}$ lives in orbital space. The gap on the Fermi surface is\n$$\\Delta^2(\\hat{\\mathbf{k}}) \\;=\\; \\mathbf{d}^*\\!\\cdot\\mathbf{d} \\;+\\;\\bigl|\\,\\mathbf{d}\\times\\mathbf{d}^*\\,\\bigr|,$$\nthe second term being nonzero whenever the spin state is non-unitary (broken time-reversal in the spin sector).\n\nThe full broken-symmetry group is\n$$G \\;=\\; SO(3)_L \\times SO(3)_S \\times U(1)_\\phi,$$\nwith $U(1)_\\phi$ the gauge phase that gives superfluidity proper. Different residual subgroups inside $G$ label different superfluid phases — there is, in principle, an entire zoo. Nature, at the BCS weak-coupling level plus spin-fluctuation feedback, selects two.\n\n### ABM and BW: which $d_{\\alpha i}$ minimizes the free energy\n\nThe **Balian–Werthamer (BW) state** (1963), proposed as a generic $p$-wave triplet generalization of BCS, has\n$$d_{\\alpha i}^{\\text{BW}} \\;=\\; \\Delta_0\\, R_{\\alpha i}(\\hat{\\mathbf{n}},\\theta)\\, e^{i\\phi},$$\nwith $R$ an arbitrary $SO(3)$ rotation relating spin and orbital frames. The gap magnitude is *isotropic*: $\\Delta^2(\\hat{\\mathbf{k}})=\\Delta_0^2$ on the whole Fermi surface. Time-reversal is preserved. The residual symmetry is the \"relative spin–orbit\" group $SO(3)_{L+S}$, broken further to a discrete subgroup by the dipole-locking angle $\\theta=\\arccos(-1/4)$ [30].\n\nThe **Anderson–Brinkman–Morel (ABM) state** (1961; refined 1973) is the *equal-spin-pairing* axial state,\n$$d_{\\alpha i}^{\\text{ABM}} \\;=\\; \\Delta_0\\,\\hat{\\mathbf{z}}_{\\alpha}\\,(\\hat{m}_i + i\\,\\hat{n}_i),\\qquad \\hat{m}\\perp\\hat{n}\\perp\\hat{\\ell}=\\hat{m}\\times\\hat{n},$$\nwith gap structure\n$$\\Delta^2(\\hat{\\mathbf{k}}) \\;=\\; \\Delta_0^2\\bigl[1-(\\hat{\\mathbf{k}}\\cdot\\hat{\\boldsymbol{\\ell}})^2\\bigr],$$\nwhich **vanishes at two antipodal point nodes** along $\\pm\\hat{\\boldsymbol{\\ell}}$. The state is non-unitary in spin if $\\hat{\\mathbf{z}}$ is treated as a fixed quantization axis only for $\\uparrow\\uparrow$ and $\\downarrow\\downarrow$ pairs (no $\\uparrow\\downarrow$); it breaks time-reversal because the orbital factor carries an intrinsic $\\mathbf{L}=\\hat{\\boldsymbol{\\ell}}$. The residual symmetry is $U(1)_{S_z}\\times U(1)_{L_z-\\phi}$.\n\nAt weak coupling the BW state has lower condensation energy at every pressure, by a margin of order $5\\%$. The ABM state nonetheless wins in a wedge of the phase diagram (the A-phase) because **spin-fluctuation feedback** — Brinkman, Serene \u0026 Anderson — preferentially enhances equal-spin pairing as the gap grows, an effect absent in mean-field BCS [30].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003e3He phase diagram and gap structures\u003c/title\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"380\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"70\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"220\" y=\"375\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eT (mK)\u003c/text\u003e\u003ctext x=\"30\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 30 200)\"\u003eP (bar)\u003c/text\u003e\u003ctext x=\"70\" y=\"358\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e0\u003c/text\u003e\u003ctext x=\"200\" y=\"358\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e1.5\u003c/text\u003e\u003ctext x=\"330\" y=\"358\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e2.5\u003c/text\u003e\u003ctext x=\"55\" y=\"340\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"55\" y=\"160\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e21\u003c/text\u003e\u003ctext x=\"55\" y=\"80\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"end\"\u003e34\u003c/text\u003e\u003cpath d=\"M70,340 C150,320 240,250 340,90\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpath d=\"M260,160 C280,180 295,220 305,260 C312,290 318,315 320,340\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"5,4\"/\u003e\u003ctext x=\"140\" y=\"300\" fill=\"#7ee0a3\" font-size=\"14\"\u003eNormal Fermi liquid\u003c/text\u003e\u003ctext x=\"130\" y=\"220\" fill=\"#7aa2ff\" font-size=\"14\"\u003eB-phase (BW)\u003c/text\u003e\u003ctext x=\"135\" y=\"240\" fill=\"#7aa2ff\" font-size=\"11\"\u003eisotropic gap, T-even\u003c/text\u003e\u003ctext x=\"290\" y=\"130\" fill=\"#ffb86b\" font-size=\"14\"\u003eA-phase (ABM)\u003c/text\u003e\u003ctext x=\"290\" y=\"148\" fill=\"#ffb86b\" font-size=\"11\"\u003epoint nodes, T-broken\u003c/text\u003e\u003ccircle cx=\"540\" cy=\"140\" r=\"50\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cellipse cx=\"540\" cy=\"90\" rx=\"6\" ry=\"3\" fill=\"#ff7a90\"/\u003e\u003cellipse cx=\"540\" cy=\"190\" rx=\"6\" ry=\"3\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"540\" y=\"55\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eABM gap\u003c/text\u003e\u003ctext x=\"540\" y=\"210\" fill=\"#ff7a90\" font-size=\"11\" text-anchor=\"middle\"\u003enodes at ±l̂\u003c/text\u003e\u003ccircle cx=\"660\" cy=\"300\" r=\"50\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ccircle cx=\"660\" cy=\"300\" r=\"44\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"6\" opacity=\"0.35\"/\u003e\u003ctext x=\"660\" y=\"245\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003eBW gap\u003c/text\u003e\u003ctext x=\"660\" y=\"370\" fill=\"#7aa2ff\" font-size=\"11\" text-anchor=\"middle\"\u003eisotropic Δ₀\u003c/text\u003e\u003c/svg\u003e\n*Figure: Schematic $P$–$T$ phase diagram of $^3$He at zero field (left) — the A-phase wedge appears only above $\\approx 21$ bar; below that the system goes directly normal $\\to$ B. Right: the gap magnitudes on the Fermi sphere — ABM has point nodes along $\\pm\\hat{\\boldsymbol{\\ell}}$, BW is isotropic.*\n\n### Credit audit: discovery, identification, naming\n\nThe phases were **discovered** at Cornell in 1971 by Osheroff, Richardson \u0026 Lee in a Pomeranchuk-cooled cell — initially mistaken for a magnetic transition in the solid coexisting with the liquid [31]. Two anomalies in the pressurization trace, \"A\" and \"B\", were renamed once Osheroff's NMR work the next year located them unambiguously in the liquid. The 1996 Nobel went to these three.\n\nThe **identification** — that \"A\" is the Anderson–Brinkman–Morel axial state and \"B\" is the Balian–Werthamer isotropic state — is Leggett's, in a sequence of 1972–1975 papers culminating in the spin dynamics that *predicts* the longitudinal NMR frequency shifts uniquely characteristic of each phase. His 2003 Nobel lecture is unusually candid about what he could and could not have done without Anderson–Brinkman–Morel and Balian–Werthamer already on the shelf [30]. Textbook attribution still routinely conflates \"discoverer\" with \"identifier\" and elides ABM/BW into \"the order parameter that Leggett used.\"\n\nA separate priority point: Balian \u0026 Werthamer (1963) wrote their state down as a *theoretical curiosity* — a generic odd-parity BCS state — eight years before there was anything to identify. Anderson \u0026 Morel (1961) likewise predated discovery by a decade. The 1973 Anderson–Brinkman refinement that made ABM thermodynamically realizable came *after* discovery, in response to the experimental fact that an A-phase existed at all.\n\n### What is genuinely new in $^3$He\n\nThree features have no analogue in $^4$He and propagate forward into modern condensed matter:\n\n1. **Continuous internal symmetry of the order parameter.** Vortex cores in $^3$He-A are *non-singular*: the $\\hat{\\boldsymbol{\\ell}}$ texture can carry circulation by escaping into the third (spin) dimension. Mermin–Ho (1976) and Anderson–Toulouse vortices have no $^4$He counterpart.\n2. **Topological defects classified by homotopy groups of coset spaces** $G/H$ — half-quantum vortices in $^3$He-A ($\\pi_1 = \\mathbb{Z}_4$), point defects (\"hedgehogs\") in $^3$He-B, and the boojum at a wall. Volovik's monograph treats $^3$He as a benchtop laboratory for relativistic-field-theory analogues, including the chiral anomaly via the $\\hat{\\boldsymbol{\\ell}}$ texture in the A-phase [33].\n3. **Topological superconductivity, before the name existed.** The BW state is the canonical $^3$P$_0$ time-reversal-invariant topological superfluid (DIII class), with Majorana surface bound states; the ABM state with its chiral $p_x+ip_y$ orbital factor (per spin species) is the prototype of the two-dimensional chiral $p$-wave superconductor invoked for Sr$_2$RuO$_4$ and for the Moore–Read Pfaffian at $\\nu=5/2$. The modern classification of topological insulators and superconductors [34] — and Volovik's reinterpretation of $^3$He as a relativistic vacuum [33] — both descend directly from the $d_{\\alpha i}$ matrix.\n\nThe pedagogical takeaway is that \"$^3$He is BCS\" is true only at the resolution of \"$^4$He is BEC\": correct as a slogan, wrong as a statement of what the order parameter looks like and what symmetries it breaks. The $3\\times 3$ matrix is the whole story, and the credit ledger — Osheroff/Richardson/Lee *discovered*; Leggett *identified*; Anderson/Brinkman/Morel and Balian/Werthamer *wrote down the states* — should be kept in that order."}, {"id": "frontier-and-open-problems", "title": "Current Frontier: Supersolidity, Dipolar Condensates, Moiré Excitons, and the Neutron Star Interior", "markdown": "## Current Frontier: Supersolidity, Dipolar Condensates, Moiré Excitons, and the Neutron Star Interior\n\nAfter 2015 the superfluid concept has been pushed into four regimes where the textbook formalism — phonon–roton spectrum, Landau two-fluid hydrodynamics, ODLRO of a scalar order parameter — was never designed to live. Each regime asks a different uncomfortable question. Dipolar supersolids force a literal reading of Leggett's 1970 NCRI fraction. Uniform 2D Bose gases dissolve the BEC criterion while leaving superfluidity intact. Moiré exciton bilayers promise an equilibrium electron–hole condensate whose order parameter has no neutral analogue. Neutron-star matter requires a relativistic, entrained, multi-component two-fluid theory whose calibrating experiment is a millisecond timing residual.\n\n### Dipolar supersolids: two Goldstone modes from one fluid\n\nThree groups — Tanzi *et al.* (Pisa), Böttcher *et al.* (Stuttgart), Chomaz *et al.* (Innsbruck) — independently reported in 2019 a stripe phase in trapped $^{162}$Dy and $^{166}$Er condensates that simultaneously carried global phase coherence and a spontaneously broken translational symmetry. The mechanism is the dipolar roton instability of Santos–Shlyapnikov–Lewenstein softened against collapse by the Lee–Huang–Yang quantum correction (Petrov 2015), so the supersolid is stabilised by beyond-mean-field physics rather than by short-range repulsion. By 2021 Norcia *et al.* extended the construction to a genuinely [two-dimensional droplet lattice](https://www.nature.com/articles/s41586-021-03725-7), and the post-2022 work has moved to binary mixtures, fermionic impurities, and structural transitions inside the lattice itself.\n\nThe conceptual content is exactly what Andreev and Lifshitz wrote down in 1969: a supersolid carries *two* Goldstone modes — a longitudinal crystal phonon and a superfluid second sound — coupled by an off-diagonal susceptibility. The measurement of both modes (Tanzi *et al.* 2019; Guo *et al.* 2019) is the cleanest evidence that the dipolar droplet array is not a mere classical crystal of mini-BECs. Leggett's NCRI fraction $f_s = \\rho_s/\\rho \u003c 1$ is now an experimentally extracted number, not a thought experiment, and it sits well below unity — typical reports 0.1–0.5 — which is itself an indictment of any pedagogy in which \"superfluid fraction\" and \"condensate fraction\" are silently identified.\n\nWhat remains genuinely open: (i) whether the dipolar supersolid is a *thermodynamic* phase or a metastable finite-size construct of the trap; (ii) the universality class of the modulation transition once the LHY term — a non-analytic $|\\psi|^5$ correction — is no longer perturbative; (iii) whether vortices threading the lattice obey the Onsager–Feynman $\\kappa = h/m$ when $\\rho_s/\\rho$ is small. None of these is answered by §2's two-fluid equations.\n\n### 2D Bose gases: superfluidity without ODLRO\n\nThe Mermin–Wagner–Hohenberg theorem forbids $\\langle \\hat\\psi(\\mathbf{r})\\hat\\psi^\\dagger(0)\\rangle$ from acquiring a finite long-distance limit at $T\u003e0$ in two dimensions; the one-body density matrix decays algebraically. Penrose–Onsager's ODLRO criterion is therefore *not* met, and yet a 2D Bose fluid in the BKT regime [20] has a sharp superfluid transition with the [universal jump](https://www.science.org/doi/10.1126/science.abq6753)\n$$\\rho_s(T_{\\mathrm{BKT}}^-) \\;=\\; \\frac{2 m^2 k_B T_{\\mathrm{BKT}}}{\\pi \\hbar^2}.$$\nThe uniform 2D atomic gas in a box potential (Cambridge, ENS, Chicago) has now tested scale invariance, the Nelson–Kosterlitz jump, and Kibble–Zurek scaling across a *quench* through the BKT line. The pedagogical lesson — that the conflation §5 flagged (\"superfluidity = BEC\") is *quantitatively* false in 2D — is no longer a paper-and-pencil argument; it is a routinely measured fact in a box trap.\n\n### Moiré excitons: an equilibrium electron–hole condensate?\n\nThe neutral-superfluid programme has a long-standing wish list item: an equilibrium condensate of spatially indirect excitons in an electron–hole double layer, originally proposed by Lozovik–Yudson (1975) and quantitatively reformulated for semiconductor heterostructures by Conti, Vignale, and MacDonald [35]. The TMD revolution (WSe$_2$/MoSe$_2$, WS$_2$/WSe$_2$) provides exactly the platform Conti *et al.* asked for: a tunable interlayer distance set by hBN spacers, a controllable density set by gates, and — added since 2018 — a moiré superlattice that flattens the exciton band and enhances correlation effects. Double *bilayer* graphene was forecast in [36] to host room-temperature BCS-BEC-crossover superfluidity for the same electron–hole geometry.\n\nThe post-2020 experimental claims fall into three categories. (i) Optical signatures of moiré-trapped exciton Mott physics in WSe$_2$/WS$_2$ — robust. (ii) Coulomb-drag and counterflow anomalies in GaAs and graphene double layers consistent with a paired phase — suggestive, not conclusive. (iii) Direct imaging of interlayer-exciton phase coherence in a [TMD heterostructure (2025)](https://www.science.org/doi/10.1126/sciadv.abp9757). The persistent ambiguity is the same one Keldysh diagnosed in the 1960s: a dipole-aligned exciton fluid with long lifetime is not yet a superfluid; one needs evidence of a $\\kappa = h/m^*$ quantum of circulation or of dissipationless counterflow. Until then the field lives in the regime \"plausible but disputed\".\n\n### Neutron-star interior: relativistic two-fluid with entrainment\n\nThe two superfluid components of a mature neutron star — $^1S_0$ paired neutrons in the inner crust and $^3P_2$ paired neutrons in the core, with proton $^1S_0$ pairing on top — are the only setting where the two-fluid formalism is *required* to be relativistic and the entrainment off-diagonal mass tensor $\\rho_{np}$ is dynamically dominant. Two observations drive the field. First, the [Cassiopeia A neutron star cools in real time](https://academic.oup.com/mnrasl/article/412/1/L108/1007778) at a few percent per decade; Page, Lattimer, Prakash, Steiner (2011) and Shternin *et al.* (2011) explained this as the onset of $^3P_2$ pairing turning on the pair-breaking-formation (PBF) neutrino channel — a real-time *thermometry* of $T_c^{(3P_2)} \\sim 5\\times10^8$ K. Subsequent Chandra reanalyses (Posselt \u0026 Pavlov 2022) softened the magnitude, and alternative non-superfluid explanations (quantum-critical neutron liquid, [arXiv:2410.21945](https://arxiv.org/abs/2410.21945)) are now on the table. The PBF interpretation is no longer the only one consistent with the timing.\n\nSecond, Vela-type giant glitches are textbook Anderson–Itoh: pinned vortex avalanches unbind, transferring angular momentum from the crust superfluid to the rigid lattice. Chamel's calculations of band-structure entrainment in the inner-crust lattice show that the *effective* superfluid mass is enhanced by a factor 4–5, which collapses the available crustal moment of inertia below the Vela glitch budget unless core superfluid is recruited. This is the unresolved \"entrainment crisis\": either the equation of state must be softened, or the glitch reservoir extends well into the core. Three-nucleon forces are central to the $^3P_2$ gap calculation itself [37], and the phonon transport coefficients that set the post-glitch relaxation are now derived from the superfluid effective theory [38]. The $I$–Love–$Q$ universality survives the two-fluid generalisation but with measurable corrections [39].\n\n### Where the textbook formalism is inadequate\n\nFive fronts are now visibly outrunning the §3 toolkit. (1) A scalar complex order parameter is wrong: dipolar supersolids need a coupled $(\\psi, \\delta\\rho_G)$ field theory; $^3$He needs the $3\\times3$ matrix $d_{\\alpha i}$; spinor and moiré exciton systems need multi-component pseudospin orders, with spin-superfluid generalisations [40, 41] in which the conserved charge is magnetisation rather than particle number. (2) ODLRO is a sufficient but not necessary criterion for superfluidity; the 2D box trap forces this into every introductory course. (3) NCRI fraction $\\neq$ condensate fraction $\\neq$ $\\rho_s/\\rho$ in any system with broken translational symmetry; supersolids make the distinction operational. (4) Landau two-fluid hydrodynamics is not relativistic and ignores entrainment; the neutron-star programme has rebuilt it as a covariant Andreev–Bashkin theory. (5) Driven–dissipative condensates (polaritons, photons) have non-Hermitian Bogoliubov spectra in which the Landau criterion is replaced by an instability threshold of the imaginary part — a regime Volovik's universality programme [33] anticipated but which the canonical formalism does not contain."}, {"id": "synthesis-and-open-questions", "title": "Synthesis: What 'Superfluidity' Should Mean in 2026", "markdown": "## Synthesis: What 'Superfluidity' Should Mean in 2026\n\nThe history compiled in §§1–7 leaves the word \"superfluidity\" carrying at least three semi-detached meanings: a transport phenomenon (vanishing viscosity in a channel), an order-parameter statement (a macroscopic eigenvalue of the one-body density matrix), and a topological constraint (quantised circulation). For $^4$He these coincide; almost nowhere else do all three apply cleanly. A workable 2026 definition must therefore be a *conjunction*, not a slogan, and must specify what is allowed to fail when a system is two-dimensional, fermionic, charged, disordered, dipolar, or spinor.\n\nI propose the following.\n\n**Definition.** A system is *superfluid* in a state $\\rho$ at temperature $T$ if all three of the following hold.\n\n(A) **Macroscopic coherence.** The reduced one-body density matrix $\\rho_1(\\mathbf{r},\\mathbf{r}')$ has a macroscopic eigenvalue $N_0 \\propto N$ in the sense of Penrose–Onsager — ODLRO. For systems where ODLRO is forbidden by Mermin–Wagner (e.g. 2D Bose at $T\u003e0$), this clause is replaced by *quasi-ODLRO*: $\\rho_1(\\mathbf{r},\\mathbf{r}') \\sim |\\mathbf{r}-\\mathbf{r}'|^{-\\eta}$ with $\\eta \u003c 1/4$ on the superfluid side of a BKT transition [20]. For fermionic and composite-boson systems, ODLRO is required of the appropriate two-body or many-body density matrix (the Yang criterion).\n\n(B) **Nonzero superfluid stiffness in linear response.** The transverse current–current correlator satisfies\n$$\\rho_s \\;\\equiv\\; \\lim_{q\\to 0}\\, m^2 \\big[\\chi_{jj}^{L}(q,0) - \\chi_{jj}^{T}(q,0)\\big] \\;\u003e\\; 0,$$\nequivalently the free-energy increment under an infinitesimal phase twist $\\theta(\\mathbf{r}) = \\mathbf{Q}\\cdot\\mathbf{r}$ obeys $\\Delta F = \\tfrac12 \\rho_s \\int |\\nabla\\theta|^2$ at $Q\\to 0$. This is the *Pollock–Ceperley / Fisher–Barber–Jasnow* definition; it is what is actually measured by Andronikashvili's torsion stack and by analogous twisted-boundary-condition diagnostics in numerics.\n\n(C) **A Landau-type critical-velocity bound.** There exists a velocity $v_c \u003e 0$, set by the low-lying excitation spectrum $\\epsilon(\\mathbf{k})$ via $v_c = \\inf_{\\mathbf{k}} \\epsilon(\\mathbf{k})/\\hbar|\\mathbf{k}|$, below which spontaneous excitation by a uniformly moving impurity is energetically forbidden. The bound $v_c$ need not be the *observed* critical velocity in a finite geometry (vortex nucleation generically lowers it; see §5), but its existence as a *lower* bound on intrinsic dissipation is what distinguishes a superfluid from a coherent-but-dissipative state.\n\nConditions (A) and (B) together imply quantised circulation $\\oint \\mathbf{v}_s \\cdot d\\boldsymbol{\\ell} = nh/m^*$ around any contractible loop, with $m^*$ the constituent (or pair) mass — Onsager's statement, not a separate axiom. Topological order in 2D enters through (A'): the algebraic decay exponent and the vortex–antivortex unbinding give a finite stiffness that jumps to zero at $T_{\\mathrm{BKT}}$, exactly as in the Nelson–Kosterlitz universal-jump relation.\n\n### What survives as fully general\n\nFour classical results need no modification.\n\n*Landau's kinematic argument* for the existence of $v_c$ uses only Galilean invariance and the spectrum $\\epsilon(\\mathbf{k})$; it applies unchanged to $^4$He [17], dilute Bose gases [29], BCS fermions, dipolar condensates and (with appropriate substitution of magnon dispersion) magnon condensates and spin supercurrents [40, 42, 41].\n\n*Onsager's quantisation of circulation*, once $\\mathbf{v}_s = (\\hbar/m^*)\\nabla\\theta$ is recognised as the gradient of a single-valued phase, is a purely topological statement. It survives passage to charged systems (flux quantisation $h/2e$ in BCS), to neutron-star $^3P_2$ pairing where the gauge structure is non-Abelian [37, 39], and to dipolar and moiré-exciton condensates with composite constituents.\n\n*The two-fluid hydrodynamic equations* — continuity, Euler for $\\mathbf{v}_s$, viscous Navier–Stokes for $\\mathbf{v}_n$, entropy carried entirely by the normal component — are a low-frequency, long-wavelength expansion controlled by symmetry, not by a particular microscopic model. They apply, with appropriately reinterpreted $\\rho_s, \\rho_n$, in every superfluid that has a phonon-like Goldstone mode. The Tisza/Landau dispute over the *microscopic* meaning of $\\rho_n$ is, at this kinematic level, irrelevant.\n\n*Penrose–Onsager ODLRO* as the order-parameter statement for global U(1) symmetry breaking survives in the $N\\to\\infty$ limit for any Bose-symmetric ground state with a Bogoliubov-type quasiparticle vacuum [22]; the mathematical-physics literature has formalised this for a class of dilute interacting bosons [43].\n\n### What was $^4$He-specific\n\nThree results that habitually travel under the name \"superfluidity\" are not general.\n\n*The phonon–roton dispersion* and its roton minimum at $k_r \\approx 1.9\\,\\text{\\AA}^{-1}$ are quantitatively a property of strongly-interacting $^4$He at SVP and disappear at high pressure or in dilute gases; in dipolar BECs there is an unrelated structure also called a \"roton\", which is a precursor of supersolid crystallisation [§7], not a Landau roton in the He II sense.\n\n*A condensate fraction approaching unity at $T=0$.* In He II the condensate fraction $n_0/n \\approx 7\\text{–}10\\%$ even as $\\rho_s/\\rho \\to 1$. The identification $n_0 = \\rho_s$ is correct only for the ideal Bose gas and to leading Bogoliubov order [29, 22]; treating it as definitional outside that regime is the most consequential error in the pedagogical literature (§5).\n\n*Galilean invariance.* Landau's derivation assumes the dispersion in the rest frame of the fluid is the same as in the laboratory frame — i.e. translational symmetry. In optical lattices, moiré heterostructures and the inner crust of neutron stars the system is at best discretely translation-invariant; the relevant object is then the *superfluid weight* $D_s$ of the lattice model, and the Landau bound must be replaced by an analysis on the Brillouin zone.\n\n### Open conceptual questions\n\nThe honest residue, where the definition above does not yet uniquely fix the physics:\n\n1. **The meaning of $\\rho_s$ in strongly correlated and disordered regimes.** The Pollock–Ceperley response definition and the Andronikashvili measurement agree only when normal-fluid drag is the dominant transport mechanism. In a glassy or vortex-pinned solid the linear-response $\\rho_s$ can be nonzero while no observable flow occurs on laboratory timescales; conversely, granular superconductors near the Bose-glass boundary [28] can show finite Helicity modulus while ODLRO is replaced by a glassy diagonal order. Whether \"supersolid\" $^4$He of Chan–Kim type ever had a true $\\rho_s\u003e0$ or only an elastic anomaly remains the textbook case of this ambiguity.\n\n2. **The status of clause (A) for non-equilibrium and driven condensates.** Exciton-polariton condensates [44] satisfy (A) and (C) but only conditionally (B): a finite $\\rho_s$ exists in a frame defined by the pump, and the corresponding Landau cone is anisotropic. Whether such systems should be called \"superfluid\" or only \"coherent\" is a definitional choice, not an experimental question.\n\n3. **Spin superfluidity.** Sonin's argument [40] and the magnon-BEC experiments in $^3$He-B [41] satisfy (A)–(C) with the conserved U(1) charge being $S_z$ rather than particle number, but only over a finite spin-diffusion length set by dipole–dipole and spin–orbit relaxation. The definition above accommodates this if \"circulation\" is interpreted as a topological winding of the spin-rotation phase — but the absence of an exact conservation law leaves $\\rho_s^{\\mathrm{spin}}$ scale-dependent in a way it never is for $^4$He.\n\n4. **Dark-sector superfluids.** Proposals such as [45] use clause (A) to identify dark-matter halos as condensates of light bosons; they evade (B) because no transport experiment is available, leaving the criterion empirically empty. Until a Landau-bound observable is identified, \"dark-matter superfluidity\" is a *kinematic ansatz*, not yet a superfluid in the sense developed here.\n\n5. **The continuum status of $^3$He's order parameter.** The ABM and BW states [30] satisfy all three clauses with an order parameter $A_{\\alpha i}$ that is not the macroscopic occupation of a single one-particle state; the corresponding ODLRO is in the two-body density matrix and the topology lives in $\\pi_2(\\mathrm{GAP})$ rather than $\\pi_1(\\mathrm{U}(1))$ [33]. A common formal language for $^4$He, $^3$He, neutron-star and exciton condensates remains missing — this is the principal target Volovik's programme has been chasing for thirty years.\n\nThe working definition (A)$\\wedge$(B)$\\wedge$(C) is therefore proposed not as a closure but as the *minimum* that allows the same word to mean the same thing in Leiden 1938, in Greytak's hydrogen cell, in a moiré bilayer at $T=300\\,\\mathrm{mK}$, and in the crust of a glitching pulsar. Where one of the three clauses fails, the qualifier (\"topological\", \"spin\", \"lattice\", \"driven\") should be made explicit. The textbook noun, used unqualified, should be reserved for the case in which all three hold simultaneously."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent §§1–7 dismantling the comfortable story. Here is what I will sign my name to, what I will not, and what I would be working on if this observatory had a dilution refrigerator instead of a notebook.\n\n### (a) What I defend with my reputation\n\nThe two-fluid *kinematics* — two interpenetrating velocity fields, entropy carried only by the normal component, second sound as a temperature wave — is exact within its linear-response regime and will outlive every microscopic theory we currently possess. It is Tisza's, not Landau's, and the historical record is unambiguous on this point; the equations were written down in *Comptes Rendus* in 1938, three years before Landau's spectrum. I also defend, without qualification, the operational definition of superfluidity as a nonzero superfluid density $\\rho_s$ extracted from the transverse current–current response at zero frequency,\n$$\\rho_s = \\rho - \\lim_{q\\to 0}\\chi_{JJ}^{\\perp}(q,\\omega=0),$$\nwhich is the only definition that survives unchanged from $^4$He to $^3$He-B to BKT films to neutron-star crusts. Andronikashvili measured exactly this quantity in 1946; everything since is a different probe of the same susceptibility.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing claims rest on assumptions that are routinely stripped in citation.\n\nFirst, **the Landau criterion as a critical-velocity prediction**. It is a *necessary* condition derived from Galilean invariance against elementary excitations of a translationally invariant ground state. In any real geometry — capillary, rotating bucket, restricted film — vortex nucleation dominates and the observed $v_c$ is orders of magnitude below $v_L \\approx 58\\ \\mathrm{m/s}$. The textbooks quote $v_L$ as if it predicted the experiment; it does not, and never did.\n\nSecond, **the identification of the condensate fraction $n_0$ with the superfluid fraction $\\rho_s/\\rho$**. In $^4$He at $T=0$, $n_0 \\approx 0.07$–$0.10$ from deep-inelastic neutron scattering while $\\rho_s/\\rho \\to 1$. The conflation is hidden inside every undergraduate treatment that derives superflow from a macroscopically occupied single-particle state. The honest derivation requires Penr
