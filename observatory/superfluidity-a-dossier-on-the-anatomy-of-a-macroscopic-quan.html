<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "Superfluidity: A Dossier on the Anatomy of a Macroscopic Quantum State", "alternativeHeadline": "superfluidity", "name": "superfluidity", "description": "Archaeology, formalism, and the persistent confusions of a ninety-year-old idea", "inLanguage": "en", "keywords": ["superfluidity", "frictionless flow", "Helium II superfluid phase", "Bose superfluid", "fermionic superfluid (paired)", "macroscopic quantum hydrodynamics"], "about": [{"@type": "Thing", "name": "superfluidity"}, {"@type": "Thing", "name": "frictionless flow"}, {"@type": "Thing", "name": "Helium II superfluid phase"}, {"@type": "Thing", "name": "Bose superfluid"}, {"@type": "Thing", "name": "fermionic superfluid (paired)"}, {"@type": "Thing", "name": "macroscopic quantum hydrodynamics"}], "articleSection": "DEEP DIVE", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/superfluidity-a-dossier-on-the-anatomy-of-a-macroscopic-quan.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/superfluidity-a-dossier-on-the-anatomy-of-a-macroscopic-quan.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Leiden to Cambridge: Discovery, Priority, and the Asymmetries of Credit Leiden to Cambridge: Discovery, Priority, and the Asymmetries of Credit The thirty-year prelude (1908–1937) Helium liquefied in Leiden on 10 July 1908; everything that follows is the unhurried unpacking of what that liquid was hiding. Kamerlingh Onnes himself never quite saw superfluidity, but he came astonishingly close. The density of the liquid, measured with a quartz dilatometer, showed a sharp maximum near 2.2 K — an anomaly Onnes himself flagged in his 1913 Nobel address as \"possibly connected with the quantum theory of Planck\" . He had no theoretical handle on it. By 1924 the requisite statistics existed — Bose's quantisation of the photon gas, extended by Einstein to massive particles — but no one in Leiden connected the two. The conceptual lag (fourteen years, 1924 → 1938) is itself part of the historical lesson: macroscopic quantum statistics were available in print before the experimental anomaly that demanded them was named as a phase transition. That naming happened in Leiden in 1927. Mieczysław Wolfke, a Polish optical physicist visiting Keesom's laboratory, and Willem Hendrik Keesom himself, working on the dielectric constant and density of liquid helium, identified a discontinuity at T \\lambda \\approx 2.17 K as a transition between two distinct liquid phases: helium I above, helium II below . The choice of the letter \\lambda came from the shape of the specific-heat curve, which Keesom and his daughter Ania resolved with high precision in 1935 — the now-iconic logarithmic divergence published in Physica . This is the sharpest pre-1938 evidence that the transition is a genuine cooperative phenomenon, not a mere crossover. The 1936 Leiden measurements of an anomalously high thermal conductance in He II — by Keesom, Keesom, and Saris — were the third pillar: He II did not merely have a different density; it transported heat in a way no ordinary liquid could. Two facts about this prelude deserve emphasis. First, the entire phenomenology — anomalous density, \\lambda-discontinuity, anomalous thermal transport — was in hand by 1936 without anyone uttering the word superfluid . Second, Wolfke's name vanishes almost completely from the Anglophone textbook tradition; the discovery of the \\lambda-transition is routinely attributed to Keesom alone, despite his presence as a co-author and equal partner on the KNAW Proceedings paper . Donnelly's Physics Today historical reconstruction is one of the few accessible sources that restores the joint attribution . The Nature issue of 8 January 1938 The next move came not from Leiden, where the war and Keesom's retirement had slowed work, but from Cambridge and Moscow simultaneously. Kapitza in Moscow (working alone, with a torsion-pendulum geometry that pushed He II through a \\sim 0.5\\,\\mu\\text{m} gap between optically polished disks) and Allen and Misener in the Mond Laboratory (forcing He II through fine capillaries) independently observed that the viscosity of helium II, below T \\lambda, was effectively zero. The two papers appeared back-to-back in Nature on 8 January 1938, separated by one page [6, 7]. Kapitza coined the term super-fluid by deliberate analogy with Onnes's 1911 supraconductivity . The Allen–Misener paper made no such terminological claim, but the experimental case was no weaker; in some respects it was cleaner, because narrow-capillary flow is less encumbered by the secondary-flow problem that dogged Kapitza's geometry. This is the first asymmetry of credit, and the most consequential. Kapitza's Nobel Prize, awarded in 1978, was for \"basic inventions and discoveries in the area of low-temperature physics\" — a formulation broad enough to encompass Helium II but elastic enough that his Nobel lecture said almost nothing about it, addressing instead high-temperature plasmas and controlled fusion . Allen lived until 2001; Misener until 1996. Neither received a share. Several reasons are usually advanced — Kapitza's coining of the term, the political weight of returning a Nobel to a Soviet figure after the Sakharov era, and the unspoken Stockholm convention of awarding fluid discoveries to the eldest survivor — but none is adequate to the historical record. The juxtaposition in Nature speaks for itself; the priority is, to within the resolution of postal mail, simultaneous. A second asymmetry follows almost immediately. Three months later, Allen and Jones reported a phenomenon that no classical fluid can produce: a heat current applied to one arm of a U-tube of He II, packed with rouge powder, produced a steady fountain — a pressure head from a temperature gradient . The thermomechanical effect was the first observation that two coupled mass currents (later: \\rho n \\mathbf{v} n and \\rho s \\mathbf{v} s) had to be present. It is the most direct experimental signature of the two-fluid character of He II and, even today, it is given less pedagogical weight than the viscosity discovery, although it is conceptually deeper. The Rollin film A third strand belongs to Oxford. Bernard Rollin observed in 1936–37 that He II climbed the walls of any container open to its vapour, forming a creeping film \\sim 30 nm thick that transported helium against gravity until levels equalised; the publication record, complicated by the war, runs through Rollin and Simon (1939) and through Daunt and Mendelssohn's slightly later, more systematic Oxford measurements. In the textbook tradition the Rollin film is named only inconsistently; the phenomenon is often presented as having been discovered by Daunt and Mendelssohn, who in fact extended and quantified it. The early review by Darrow is one of the few wartime English-language sources that gives Rollin priority by name, and Mendelssohn's own retrospective discussion in 1945 explicitly preserves the Oxford lineage. The shape of the credit By the time Tisza submitted to Nature in May 1938 and London submitted in March — the first to propose a microscopic identification with BEC, the second to build a phenomenological two-fluid hydrodynamics — the experimental foundation was already set: Onnes's density anomaly, Wolfke–Keesom's two-phase identification, Keesom–Keesom's \\lambda-anomaly, Kapitza's and Allen–Misener's simultaneous viscosity papers, Allen–Jones's fountain, and Rollin's film. Six independent observations, eight or nine names. The textbook compression to \"Kapitza discovered superfluidity in 1938\" is therefore wrong in three distinct ways at once: it erases a co-discovery (Allen and Misener), it erases a co-discovery of the earlier phase identification (Wolfke), and it conflates the naming with the discovery . Balibar's historical surveys [14, 15] and Donnelly's Physics Today article are the most reliable English-language correctives; the primary literature [3, 4, 6, 7, 9] is, as ever, the only place where the record cannot be retouched. The deepest irony in the early record is this: the two figures most loudly silenced by the canonical narrative — Wolfke and Misener — between them bracket the phenomenon (the phase identification at one end, the frictionless flow at the other), and neither was Soviet, neither was British by birth, and neither died early. The asymmetry of credit is not, in their case, the usual artefact of language or longevity. It is something closer to inertia: the canonical story was written down too quickly, by Landau in 1941 and by London in 1954 , and the historical machinery to revise it — Balibar's reconstructions, Donnelly's archival work — arrived only after the textbooks had ossified. The Pedagogical Core: Two-Fluid Hydrodynamics, the Landau Criterion, and ODLRO The Pedagogical Core: Two-Fluid Hydrodynamics, the Landau Criterion, and ODLRO Three formal scaffolds carry almost all of the working physicist's intuition about He II: the two-fluid equations (kinematic), the Landau critical-velocity criterion (spectral), and off-diagonal long-range order (statistical-mechanical). They were assembled in that order between 1938 and 1956, by four different people, and they sit at three different levels of description. A clean derivation makes the joints visible — and exposes where the textbook glosses are silently wrong. Two-fluid hydrodynamics Postulate, with Tisza and Landau , that below T \\lambda the local state of the liquid is specified by two independent velocity fields \\mathbf{v} s(\\mathbf{r},t) and \\mathbf{v} n(\\mathbf{r},t) and two densities \\rho s,\\rho n with \\rho=\\rho s+\\rho n. The mass current is The defining kinematic assumptions — not derivations — are: (i) the superfluid component carries no entropy, so the entropy current is \\rho s \\mathbf{v} n; (ii) the superfluid flow is irrotational, \\nabla\\times\\mathbf{v} s=0, except on singular vortex cores; (iii) in linear response no friction couples the two components, although mutual friction restores itself once vortices appear (Hall–Vinen–Bekarevich–Khalatnikov). The first two assumptions are exact consequences of \\mathbf{v} s=(\\hbar/m)\\nabla\\varphi once the macroscopic phase \\varphi exists; in Tisza's 1938 paper they were postulates. Mass and entropy conservation read The Euler equation for the superfluid is driven by the gradient of the chemical potential per unit mass, while the normal component obeys a Navier–Stokes-like equation with viscosity \\eta n and a thermomechanical force \\rho n s\\nabla T, The structural point: it is the temperature gradient that pushes the normal fluid, and it is the pressure gradient alone that, in the absence of \\nabla T, would push the superfluid. The fountain effect follows in one line: in a steady state with \\mathbf{v} s irrotational and \\mathbf{j}=0 across a superleak, \\nabla\\mu=0 gives \\Delta p = \\rho s\\,\\Delta T. Linearising about rest and assuming an adiabatic equation of state, one obtains two coupled wave equations. The decoupling proceeds cleanly when the thermal expansion of ^4He is neglected (an excellent approximation below T \\lambda): the density mode is ordinary (first) sound, and the entropy/temperature mode is second sound, with the standard caveat that c p\\to c v in the incompressible limit and the two coincide only when expansion vanishes [17, 12]. Second sound is a temperature wave: at a node the two components counterflow with \\rho s\\mathbf{v} s+\\rho n\\mathbf{v} n=0, so no mass moves but entropy oscillates. Peshkov's 1944 observation of u 2\\approx 20 m/s at 1.6 K turned this prediction into the most dramatic post-war vindication of the two-fluid picture; Andronikashvili's torsional disks [credit-audit entry] independently fixed \\rho n(T)/\\rho. Figure: Left — two-fluid counterflow geometry: the normal component carries all the entropy, the superfluid all the irrotational mass flow; their cancellation in the mass current is what makes second sound a pure temperature wave. Right — Landau's phonon–roton spectrum; the tangent from the origin to the roton minimum sets the critical velocity v c=\\Delta/p 0. The Landau critical-velocity criterion Consider a body of mass M moving at velocity \\mathbf{v} through the fluid at T=0. In the rest frame of the body the fluid energy and momentum are E and \\mathbf{P}; under a Galilean boost back to the lab frame, so the energy cost of creating one excitation of energy \\varepsilon(\\mathbf{p}) and momentum \\mathbf{p}, as seen in the lab, is \\varepsilon(\\mathbf{p})+\\mathbf{v}\\!\\cdot\\!\\mathbf{p}. Spontaneous emission becomes energetically possible only when this can be negative, i.e. when \\mathbf{v} \\ge \\varepsilon(\\mathbf{p})/ \\mathbf{p} for some \\mathbf{p}. The threshold is — geometrically, the slope of the tangent from the origin to the dispersion curve [17, 18]. For a phonon–roton spectrum the minimum is the roton tangent, v c=\\Delta/p 0 \\approx 60 m/s, while for a free particle spectrum \\varepsilon=p^2/2m the minimum is at p\\to 0 and v c=0 — the ideal Bose gas is not superfluid. The argument flags its own assumptions explicitly: (a) Galilean invariance (broken in lattice or rotating systems — modify accordingly); (b) a well-defined quasiparticle spectrum (true only at low T and below the Pitaevskii instability); (c) translational invariance (boundaries lower v c via vortex nucleation — the Feynman–Vinen geometry-dependent value, orders of magnitude below the roton tangent). It is precisely this geometric v c that experiments on flow through narrow channels measure, and the gap to the Landau bound is the loudest signal that vortex physics, not single-quasiparticle emission, sets the practical critical velocity. ODLRO and the order parameter The kinematic and spectral pictures say nothing about why there should be a macroscopic phase to differentiate in the first place. That gap was closed only in 1956 by Penrose and Onsager. Define the reduced one-body density matrix A system exhibits off-diagonal long-range order when, in the thermodynamic limit, one eigenvalue n 0 is of order N — equivalently, The macroscopic eigenfunction \\chi 0(\\mathbf{r})=\\sqrt{n 0/V}\\,e^{i\\varphi(\\mathbf{r})} supplies the phase whose gradient is the superfluid velocity, \\mathbf{v} s=(\\hbar/m)\\nabla\\varphi. Single-valuedness of \\chi 0 forces \\oint\\mathbf{v} s\\!\\cdot\\!d\\boldsymbol{\\ell}=n\\,h/m — the Onsager–Feynman circulation quantum, observed by Vinen on a vibrating wire in 1961 . ODLRO is therefore the bridge that the 1938–1941 hydrodynamics lacks, and the structure that makes the irrotationality postulate a theorem. Three levels, one phenomenon — and three honest caveats The hierarchy is now visible. (i) Two-fluid hydrodynamics is a kinematic statement requiring \\rho s 0 and an irrotational \\mathbf{v} s. (ii) Landau's criterion is a spectral statement requiring a quasiparticle dispersion that does not touch the \\mathbf{v}\\!\\cdot\\!\\mathbf{p} cone. (iii) ODLRO is a statistical-mechanical statement about a macroscopic eigenvalue of \\rho 1. None of the three implies any other without additional hypotheses. The ideal Bose gas has ODLRO (n 0/N=1 at T=0) and v c=0. A 2D Bose film below T {BKT} has \\rho s 0 and quasi-long-range order but no ODLRO . He II has all three, but with n 0/N\\approx 0.07 while \\rho s/\\rho\\to 1 — a 14-fold mismatch that single-handedly refutes \"superfluid density = condensate density\" and that no textbook conflation has the right to elide. The remainder of the dossier — Bogoliubov microscopics, vortex quantisation, the ^3He matrix order parameter — operates on these three rails, and every confusion catalogued in §5 will turn out to be a category error among them. From Tisza's Kinematics to Bogoliubov's Microscopics: What Superseded What From Tisza's Kinematics to Bogoliubov's Microscopics: What Superseded What The theoretical edifice of superfluidity was built in three pulses between 1938 and 1956, with two important codas (Feynman–Cohen 1955; Vinen 1961). Each pulse partially overwrote its predecessor, and the modern textbook tends to read the result back into history as if it had been intended from the start. It was not. Tisza 1938: kinematics grounded on the wrong microscopics Within weeks of London's identification of the λ-point with Bose–Einstein degeneracy , Tisza proposed that He II be treated as two interpenetrating fluids: the condensed fraction (zero entropy, zero viscosity, velocity field \\mathbf v s) and the thermally excited fraction (carrying all the entropy, viscous, velocity field \\mathbf v n) . The kinematic content is exactly what survives in every modern textbook: two independent mass currents, an entropy current s\\rho n\\mathbf v n carried only by the normal component, and — as a non-trivial consequence — a second propagating mode in which \\mathbf v s and \\mathbf v n oscillate in antiphase at fixed total density. That mode is second sound , predicted before any apparatus could measure it. The microscopic underpinning Tisza offered was, however, the literal Bose–Einstein condensate of an ideal gas: \\rho s/\\rho was to be identified with the condensate fraction n 0(T)/n of the textbook BEC formula. This is the part Landau attacked, and the part that did not survive. Landau 1941: replacing the microscopics, keeping the equations Landau's \"Theory of the Superfluidity of Helium II\" does three distinct things, and conflating them is the standard pedagogical error. First, he rewrites the two-fluid equations in a fully Galilean-covariant form, derives the thermodynamic identities relating \\rho s, \\rho n, s, and the chemical potential, and obtains second sound as a clean prediction (later he tightened the derivation against Tisza's objections). Second, he postulates a phonon–roton excitation spectrum and identifies the normal fluid with the gas of these excitations, so that This is a Galilean transformation from the rest frame of the superflow into the lab frame: the momentum carried by thermal quasiparticles, weighted by \\partial \\varepsilon n B, is the inertial mass of the normal component. It contains no reference to a condensate. Third, he formulates the Landau critical-velocity criterion : superflow is stable against quasiparticle emission only if For He II this minimum sits at the roton: v L \\approx 58\\ \\mathrm{m\\,s^{-1}}. Above v L a quasiparticle can be emitted into the moving fluid without violating energy–momentum conservation. What Landau rejected was London's identification of \\rho s with n 0. What he retained , without saying so, was Tisza's kinematic skeleton: continuity, two Euler-type equations, entropy convection by the normal component. Donnelly's archive work and Balibar's documentary reconstruction make the citation history unambiguous; the modern label \"Landau's two-fluid model\" misallocates the kinematics. Bogoliubov 1947: the missing microscopic theory Tisza had the right kinematics with the wrong microscopics; Landau had the right kinematics with no microscopics at all — only a phenomenological spectrum. Bogoliubov supplied the missing layer for weakly interacting bosons . Starting from he replaced \\hat a 0,\\hat a 0^\\dagger \\to \\sqrt{N 0} (the Bogoliubov prescription : the condensate is macroscopically occupied, its operators are c-numbers), kept terms quadratic in \\hat a {\\mathbf k\\ne 0}, and diagonalised with The result is the celebrated dispersion linear (\\varepsilon \\approx \\hbar c k, c = \\sqrt{n V 0/m}) at small k, free-particle at large k, and — crucially — satisfying v L = c 0. The Landau criterion is derived , not postulated. Two subtleties tend to be glossed over. (a) Bogoliubov's spectrum has no roton minimum: it is purely phononic at low k and quadratic at high k. The roton is a strong-coupling feature of dense ^4He, not generic to Bose superfluidity. (b) Even at T=0, particles are kicked out of the condensate by the interaction: N 0/N \u003c 1. The quantum depletion is finite but small for dilute gases; in liquid ^4He, where n a^3 is of order unity, the depletion is enormous and N 0/N \\sim 0.07–0.10 — yet \\rho s/\\rho \\to 1. This is the empirical wedge that finally pries \\rho s apart from n 0. Penrose–Onsager 1956: ODLRO as the order parameter The conceptual cleanup was Penrose \u0026 Onsager's. They defined the order parameter of Bose superfluidity as the largest eigenvalue \\lambda 0 of the one-body density matrix A finite limit at infinite separation — off-diagonal long-range order — is the precise sense in which \"a macroscopic number of particles occupy a single one-particle state\" survives the interactions that destroyed London's naïve picture. Two things are subsumed here. London's BEC criterion is rehabilitated, but as a statement about \\rho 1 rather than about a free-particle level. And Bogoliubov's c-number prescription \\hat a 0 \\to \\sqrt{N 0} is recognised as a spontaneous breaking of global U(1): the condensate wavefunction \\Psi 0(\\mathbf r) = \\sqrt{n 0}\\,e^{i\\varphi(\\mathbf r)} acquires a definite phase, and gradients of that phase are the superfluid velocity, ODLRO is necessary for Bose superfluidity in d \\ge 3; in d=2 it is destroyed at any T 0 by long-wavelength phase fluctuations (Mermin–Wagner–Hohenberg), yet superfluidity survives via BKT . The conflation of \"BEC\" with \"superfluidity\" was already wrong in 1956; it became manifestly wrong in 1973. Feynman–Cohen 1955 and the roton as a microscopic object Feynman's variational programme [23, 24] supplied what Landau had left phenomenological. Using the Bijl–Feynman ansatz he reproduced the phonon branch and a minimum at k 0 \\approx 2\\pi/r {\\rm nn} — Landau's roton — but with \\Delta F \\approx 19 K, nearly a factor two too large. Feynman \u0026 Cohen restored the missing dipolar backflow , which pulls \\Delta down to \\approx 11.5 K, within a few percent of the neutron-scattering value. The roton is thus reinterpreted: not a free quasiparticle of momentum p 0 but a localised current pattern — a smoke-ring of probability — whose backflow tail is dictated by mass conservation in the surrounding fluid. Onsager 1949, Feynman 1955: the topological coda The phase \\varphi is multi-valued; its line integral around a closed loop must be a multiple of 2\\pi, so Onsager stated this as a one-paragraph discussion remark at the 1949 Florence statistical-hydrodynamics meeting , identifying rotational flow with arrays of singular vortex lines of circulation h/m. Feynman, apparently unaware, re-derived it in 1955 and built the vortex-line theory of rotating helium, mutual friction, and the connection to the roton . The pedagogical \"Onsager–Feynman quantum\" hyphenates a six-year priority — and obscures that Onsager arrived at it from hydrodynamic topology (a circulation theorem made integer by the phase) while Feynman arrived at it from microscopic wave-function continuity. Vinen's 1961 detection of a single quantum on a vibrating wire closed the loop empirically. What survived: Tisza's kinematics, Bogoliubov's u–v structure, Penrose–Onsager's ODLRO, the Onsager–Feynman circulation quantum. What was superseded: London's identification \\rho s = n 0, Landau's outright rejection of the BEC connection, Feynman's bare phonon–roton ansatz without backflow. The four surviving pieces are not a single theory; they are four answers to four different questions — kinematic, microscopic, structural, topological — that \"superfluidity\" silently rolls into one. Landmark Experiments: From Andronikashvili's Disks to Vinen's Single Quantum Landmark Experiments: From Andronikashvili's Disks to Vinen's Single Quantum Between 1946 and 1967 a sequence of half a dozen experiments turned the two-fluid picture from a kinematic accounting scheme into a quantitative theory whose every parameter could be weighed. Each of these experiments isolates exactly one of the conceptual ingredients laid out in §3 — \\rho s/\\rho, the entropy-carrying second-sound mode, the phonon–roton spectrum, the quantum of circulation \\kappa=h/m, and the non-classical rotational response — and measures it directly. Read in chronological order they reconstruct the logical order of the theory in reverse: kinematics first, spectrum next, topology last. Andronikashvili (Tbilisi, 1946): the superfluid fraction Elephter Andronikashvili's torsional-pendulum experiment is the experiment in superfluidity. A stack of approximately fifty thin aluminium disks, \\sim 4\\text{ cm} in diameter and separated by \\sim 0.2\\text{ mm}, was suspended on a fine torsion fibre and immersed in He II. The stack was driven at \\omega/2\\pi \\sim 10–30 Hz, where the viscous penetration depth \\delta v = \\sqrt{2\\eta n/\\rho n\\omega} — evaluated with the normal -component viscosity — is comparable to the inter-disk gap. The normal fluid therefore co-moves rigidly with the stack; the superfluid, having \\eta s = 0 and no normal-mode response on these length scales, is mechanically decoupled. Measuring the period T(T \\text{bath}) of the loaded pendulum and subtracting the empty-cell value gave the entrained normal-fluid mass and hence \\rho n(T), from which \\rho s = \\rho - \\rho n. The result was decisive: \\rho s \\to 0 at T \\lambda^- with critical behaviour now known to belong to the 3D-XY class, and \\rho s/\\rho \\to 1 at T \\lesssim 1 K. This is the single curve that Landau (1941) had no way to compute a priori — the two-fluid formalism needs \\rho s(T) as an input — and it is what made the model predictive. Peshkov (Moscow, 1944–46): second sound Tisza had predicted , and Landau had re-derived from a different microscopics , a wave in which \\mathbf{v} s and \\mathbf{v} n oscillate in counter-phase at fixed total mass current. Such a wave carries entropy and temperature, not density, so it cannot be excited by a piston: V. P. Peshkov used a Joule-heated metallic film at one end of a tube of He II and a carbon-resistance thermometer at the other, driving the heater at audio frequencies and locating standing-wave nodes. The resulting velocity u 2(T) rose from zero at T \\lambda, peaked at \\sim 20\\text{ m s}^{-1} near 1.6 K, and approached a plateau near u 1/\\sqrt{3} in the deep phonon regime — precisely the Landau formula with s and c v taken from independent calorimetry . The Peshkov data closed the thermodynamic loop: \\rho s/\\rho n measured mechanically (Andronikashvili) and thermally (Peshkov) agreed within experimental error, vindicating the two-fluid scaffolding without recourse to any microscopic picture. Henshaw–Woods (Chalk River, 1961) and Cowley–Woods (1971): the phonon–roton spectrum Landau's \\varepsilon(p) = cp at small p and \\Delta + (p-p 0)^2/2\\mu near the roton minimum was, until 1957, a thermodynamic ansatz constrained by specific-heat data alone. Inelastic neutron scattering — measuring the dynamic structure factor S(Q,\\omega), whose single-quasiparticle pole sits at \\hbar\\omega = \\varepsilon(Q) for a Bose liquid (Pines–Nozières f-sum rule) — finally gave the spectrum directly. Henshaw and Woods (1961) at the NRX reactor mapped the curve from Q \\approx 0.3 to 2.7\\text{ Å}^{-1} and extracted c {\\text{sound}} = 238 \\pm 5\\text{ m s}^{-1}, a roton minimum at Q 0 = 1.91\\text{ Å}^{-1}, gap \\Delta/k B = 8.65 \\pm 0.04 K, and effective mass \\mu = 0.16\\,m 4 (verify). Cowley and Woods (1971) repeated and refined the measurement at lower temperature with higher resolution, resolving the multi-phonon continuum above 2\\Delta and the temperature dependence of \\Delta that determines roton–roton scattering . The numerical agreement with Feynman–Cohen's variational backflow ansatz was qualitatively good but quantitatively wrong by a fixed offset of \\sim 20\\% in \\Delta — a discrepancy still not analytically resolved, and a quiet reminder that He II is strongly correlated. Figure: Single-quasiparticle dispersion \\varepsilon(Q) extracted from inelastic neutron S(Q,\\omega). The linear phonon branch (c=238\\text{ m s}^{-1}) sets u 1; the roton gap \\Delta/k B = 8.65 K dominates the thermodynamics above \\sim 0.6 K. Landau's criterion v {c,\\text{intr}} = \\min Q \\varepsilon(Q)/\\hbar Q \\approx 60\\text{ m s}^{-1} is fixed by the line from the origin tangent to the roton minimum (not drawn). Vinen (Cambridge, 1961): one quantum of circulation Onsager's 1949 remark and Feynman's vortex-line picture both predict that any circulation trapped around a multiply-connected region of superfluid is quantised in units \\kappa = h/m 4 = 9.97 \\times 10^{-4}\\text{ cm}^2\\text{ s}^{-1}. W. F. Vinen devised the cleanest possible test. A 25\\,\\mum phosphor-bronze wire was stretched along the axis of a cylindrical can of He II. The wire supports two degenerate transverse vibrational modes; trapped circulation around the wire breaks the degeneracy via the Magnus force \\mathbf{F} = \\rho s\\,\\boldsymbol{\\kappa}\\times\\mathbf{v}, splitting the mode frequencies by where m \\text{wire}' includes hydrodynamic mass. Detecting the slow beat between the two modes — initially excited together — gave \\Delta\\omega and hence \\kappa. Vinen observed plateaux at \\kappa and 2\\kappa with no values between them; the experiment ran for hours without decay, the persistent-current half of the result. This is the first direct measurement of a macroscopic quantum number in a fluid and the operational definition by which all subsequent quantum-fluid circulation experiments (atomic-condensate vortex lattices, ^3He-B circulation) are calibrated. Hess–Fairbank (Stanford, 1967): non-classical rotational inertia The mechanical analogue of the Meissner effect — a superfluid refusing to rotate with its container — was demonstrated by G. B. Hess and W. M. Fairbank. A cylindrical cell of He II was set rotating at an angular velocity \\Omega well below the critical \\Omega {c1} for vortex nucleation (\\Omega {c1} \\approx (\\kappa/\\pi R^2)\\ln(R/a 0) \\sim 10^{-3}\\text{ rad s}^{-1} for laboratory cells) and then cooled through T \\lambda. Above T \\lambda the entire normal liquid co-rotated, with angular momentum L \\text{cl} = I \\text{cl}\\Omega. Below T \\lambda the equilibrium angular momentum dropped to L = (\\rho n/\\rho)\\,I \\text{cl}\\Omega, the superfluid component remaining at rest in the lab frame because the curl-free constraint \\nabla\\times\\mathbf{v} s = 0 admits no rigid-body solution. The measured deficit (\\rho s/\\rho)\\,I \\text{cl}\\Omega tracked Andronikashvili's curve quantitatively, vindicating the Landau two-fluid thermodynamics at zero drive frequency and giving the operational definition of \"superfluid density\" — non-classical rotational inertia (NCRI) — that Leggett later adopted as the diagnostic for supersolidity. Together these five experiments form the experimental skeleton of the two-fluid model. Andronikashvili and Hess–Fairbank weigh \\rho s/\\rho at finite and zero frequency; Peshkov isolates the entropy-carrying counter-current; Henshaw–Woods give the spectrum that determines \\rho n(T) and the Landau bound on v c; Vinen exhibits the macroscopic phase as a measurable integer. Everything Tisza , Landau , Bogoliubov , Onsager , Feynman and Penrose–Onsager wrote down between 1938 and 1956 had, by 1967, been weighed. Validity Audit: Where the Modern Literature Confuses Itself Validity Audit: Where the Modern Literature Confuses Itself Five errors have crystallised into folklore. Each survives because the underlying equation is still correct in some restricted regime, and the regime is no longer mentioned when the equation is invoked. What follows is a regime-by-regime audit, in roughly decreasing order of damage done. 5.1 \"Superfluidity = Bose–Einstein condensation\" This is the headline conflation, and the one most likely to survive into the next generation of textbooks because it is almost true for the systems people actually compute with. The two statements are formally distinct: - BEC is a statement about the one-body density matrix: \\rho 1(\\mathbf{r},\\mathbf{r}') = \\langle \\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(\\mathbf{r}')\\rangle has a macroscopic eigenvalue N 0 \\sim N in the thermodynamic limit. Equivalently, \\lim { \\mathbf{r}-\\mathbf{r}' \\to\\infty}\\rho 1 = n 0 \\neq 0 — Penrose–Onsager ODLRO. - Superfluidity is a statement about linear response: \\rho s, defined by the difference between the response to a transverse (boost) and a longitudinal probe, is nonzero, and the spectrum admits a positive Landau critical velocity v L = \\min {\\mathbf{p}} \\epsilon(\\mathbf{p})/p . That the two are logically independent is settled by three counter-examples that every working physicist should keep in mind: 1. Ideal Bose gas. BEC at T c = (n/\\zeta(3/2))^{2/3}\\, 2\\pi\\hbar^2/mk B, but \\epsilon(p) = p^2/2m, so v L = \\min p p/2m = 0. No superflow. The earliest correct identification of this gap is in Landau 1941 and is dwelt on at length by Bogoliubov ; Blatt \u0026 Butler's mid-1950s papers [26, 27] make the case explicitly that interactions are what convert a condensate into a superfluid. 2. 2D Bose fluid below T {\\rm BKT}. Mermin–Wagner forbids true ODLRO; the off-diagonal density matrix decays algebraically as \\mathbf{r}-\\mathbf{r}' ^{-\\eta(T)} with \\eta \u003c 1/4 at T {\\rm BKT}. Yet \\rho s is finite and jumps by the universal Nelson–Kosterlitz value \\rho s(T {\\rm BKT}^-)/T {\\rm BKT} = 2m^2/\\pi\\hbar^2 . Superfluid, not condensed. 3. Strongly interacting 4He at T=0. Direct neutron measurements (Sears et al., Glyde and collaborators) put n 0 \\approx 0.07–0.10, whereas \\rho s/\\rho \\to 1. Superflow is carried almost entirely by atoms outside the condensate; the BEC fraction is a minority report. The Bogoliubov derivation is the one place where the two coincide parametrically : at weak coupling \\rho s/\\rho = 1 - O(T^4) and N 0/N = 1 - 8/3\\sqrt{na^3/\\pi} + O(na^3) — both close to unity, but for entirely different reasons. Treating Bogoliubov as the paradigm of superfluidity is the historical mistake that propagated the conflation; treating it as the limiting case in which a one-parameter order can substitute for two is correct. 5.2 \"He II\" (phase) vs \"superfluid\" (component) He II is a thermodynamic phase below T \\lambda = 2.1768 K. Inside it, two-fluid hydrodynamics applies: with \\rho s(T \\lambda)=0 and \\rho s(0)=\\rho. The phase is He II; the component is the superfluid, and its weight is a continuous function of temperature [12, 17, 14]. Authors who write \"He II is the superfluid\" silently confuse phase with order parameter — at T = 2.0 K roughly 60% of the mass is normal, and any flow with \\mathbf{v} n \\neq 0 entrains an entropy current s\\rho n\\mathbf{v} n that is the very mechanism of the thermomechanical effect . The pedagogical fallout: students taught that \"below T \\lambda helium flows without friction\" cannot understand why a heat-current measurement in He II shows a finite effective viscosity (Andronikashvili's experiment is literally a measurement of \\rho n via the entrained-mass response to a torsional oscillator). 5.3 Critical velocity: the Landau roton vs Feynman–Vinen vortex nucleation The single most over-quoted formula in superfluidity is This is correct as a kinematic upper bound on dissipationless flow against a uniform background, derived in and microscopically justified in . It is almost never the velocity at which superflow in a real channel breaks down. Observed critical velocities lie in the range 10^{-2} to 10 cm s^{-1} — three to five orders of magnitude below Landau's value — and depend on the channel geometry as roughly v c \\sim (\\hbar/m d)\\ln(d/a 0) with d the channel width and a 0 a vortex-core scale. The mechanism is vortex nucleation , identified by Feynman in [23, 24] and made quantitative by Vinen's circulation experiment . Any paper claiming agreement with \"Landau's criterion\" at sub-cm/s velocities is either measuring the wrong thing or invoking the wrong criterion; the correct statement is that Landau's v L bounds the intrinsic instability of an excitation-free background, while Feynman–Vinen bounds the geometry-limited instability against vortex formation. Both are right; they answer different questions. A useful diagnostic: at v \\to v L the bulk spectrum becomes unstable, manifest in roton softening; at v \\to v c^{\\rm FV} the boundary nucleates singly-quantised vortices with \\oint\\mathbf{v} s\\cdot d\\boldsymbol\\ell = h/m, the experimental signature of . 5.4 The Tisza/Landau and Onsager/Feynman attributions The kinematic structure of two-fluid hydrodynamics — distinct velocity fields \\mathbf{v} n,\\mathbf{v} s, entropy carried only by the normal component, the prediction of a second, temperature-wave mode — is Tisza's [12, 14]. Landau's 1941 paper replaced Tisza's BEC-based microscopic justification by a thermodynamic split into ground state plus a gas of phonons and rotons, and dismissed Tisza by name; the equations of motion are nevertheless those of Tisza. The accurate citation is \"Tisza's two-fluid kinematics + Landau's phonon–roton spectrum\". The 1947 Bogoliubov derivation supplies the microscopic justification Tisza had wanted. Onsager's \\kappa = nh/m appeared as a one-paragraph footnote in the Florence 1949 conference discussion ; Feynman's vortex-line theory [23, 24] developed independently and in considerably more depth, but four years later. The hyphenation \"Onsager–Feynman\" is fair; the unhyphenated \"Feynman's quantisation condition\" found in many modern reviews is not. 5.5 Equations that circulate with their assumptions stripped A short audit, in the form of equation — silent assumption — failure mode : - \\rho s = \\rho - \\rho n with \\rho n = -\\tfrac{1}{3}\\int (\\partial f/\\partial\\epsilon)\\, p^2\\, d^3p/(2\\pi\\hbar)^3. Valid for a dilute quasiparticle gas in a Galilean-invariant background. Fails whenever the excitation spectrum is gapped by a lattice (optical-lattice superfluids — the same formula gives \\rho s of the Bose–Hubbard model only up to a renormalisation by the effective mass m^ ) or whenever the elementary excitations are not weakly interacting (rotons near T \\lambda). - Gross–Pitaevskii equation i\\hbar\\partial t\\psi = (-\\hbar^2\\nabla^2/2m + V + g \\psi ^2)\\psi. Valid for dilute, weakly-interacting bosons at T\\ll T c where the condensate fraction \\to 1 . Fails for 4He at any temperature (interactions strong, n 0\\sim 0.07) and for 2D systems near T {\\rm BKT} (no true condensate). - Landau critical-velocity criterion. Already discussed: valid as an upper bound; rarely the operative velocity in an experiment. - \\kappa = nh/m. Robust — derives from single-valuedness of \\psi — but the implicit assumption is that the order parameter is a complex scalar . In 3He-A and -B [30, 31] the order parameter d {\\alpha i}(\\hat{\\mathbf{k}}) is a 3\\times3 matrix, and the topology of defects (textures, half-quantum vortices, boojums) is governed by \\pi 1(\\mathrm{SO}(3))=\\mathbb{Z} 2 and \\pi 2(\\mathrm{SU}(2)/U(1)) rather than by \\pi 1(U(1))=\\mathbb{Z}. Quoting \"\\kappa = nh/m\" for 3He without flagging the matrix structure is wrong. - n s/n = 1 - (T/T \\lambda)^\\alpha scaling. A fit , not a theorem; the actual critical exponent near T \\lambda is the 3D-XY value \\nu \\approx 0.6717 controlling \\rho s\\sim T-T \\lambda ^{(d-2)\\nu} . - \"Two-fluid model is exact below T \\lambda.\" Exact in the long-wavelength, low-frequency limit only; at frequencies \\omega \\tau {\\rm roton} \\gtrsim 1 the normal component does not behave as a Navier–Stokes fluid and one needs a full kinetic equation for the quasiparticle distribution [23, 22]. The healthy attitude is the one Penrose \u0026 Onsager (ODLRO) and Tisza (kinematics) and Landau (spectrum) and Bogoliubov (microscopics) collectively earned: no single equation is superfluidity . The phenomenon is the simultaneous satisfaction of (i) ODLRO or its 2D algebraic relative, (ii) a positive \\rho s in linear response, (iii) a positive Landau velocity v L, and (iv) the existence of quantised vorticity. Anyone who quotes only one of the four is, somewhere, misleading their reader. Superfluid 3He: p-Wave, Spin-Triplet, and the ABM/BW Order Parameters Superfluid 3He: p-Wave, Spin-Triplet, and the ABM/BW Order Parameters ^3He is not a footnote to ^4He. It is a different physical system that happens to share a name: a Fermi liquid of spin-\\tfrac12 atoms in which Cooper pairing — forbidden in the s-wave channel by the hard core — opens in an odd-parity channel at temperatures three orders of magnitude below T \\lambda. The order parameter is no longer a complex scalar but a 3\\times 3 matrix on the product of spin and orbital triads, and the phase diagram below T c \\approx 2.5\\,\\text{mK} at melting pressure contains at least two distinct broken-symmetry states whose identification took twenty-four months of confusion and an Oxford theorist with the right group-theoretic instinct . The pairing channel and the matrix order parameter Begin with the Cooper-pair amplitude Fermi statistics demand F {\\alpha\\beta}(\\mathbf{k})=-F {\\beta\\alpha}(-\\mathbf{k}). In a strongly repulsive liquid the singlet (L=0) channel is suppressed; the dominant attractive channel is L=1, which by antisymmetry forces S=1. The triplet amplitude is most compactly written via the d-vector : so that the orbital p-wave dependence is linear in \\hat{\\mathbf{k}} and the spin structure is encoded in the complex 3\\times 3 matrix d {\\alpha i}. The first index \\alpha\\in\\{x,y,z\\} lives in spin space; the second i\\in\\{x,y,z\\} lives in orbital space. The gap on the Fermi surface is the second term being nonzero whenever the spin state is non-unitary (broken time-reversal in the spin sector). The full broken-symmetry group is with U(1) \\phi the gauge phase that gives superfluidity proper. Different residual subgroups inside G label different superfluid phases — there is, in principle, an entire zoo. Nature, at the BCS weak-coupling level plus spin-fluctuation feedback, selects two. ABM and BW: which d {\\alpha i} minimizes the free energy The Balian–Werthamer (BW) state (1963), proposed as a generic p-wave triplet generalization of BCS, has with R an arbitrary SO(3) rotation relating spin and orbital frames. The gap magnitude is isotropic : \\Delta^2(\\hat{\\mathbf{k}})=\\Delta 0^2 on the whole Fermi surface. Time-reversal is preserved. The residual symmetry is the \"relative spin–orbit\" group SO(3) {L+S}, broken further to a discrete subgroup by the dipole-locking angle \\theta=\\arccos(-1/4) . The Anderson–Brinkman–Morel (ABM) state (1961; refined 1973) is the equal-spin-pairing axial state, with gap structure which vanishes at two antipodal point nodes along \\pm\\hat{\\boldsymbol{\\ell}}. The state is non-unitary in spin if \\hat{\\mathbf{z}} is treated as a fixed quantization axis only for \\uparrow\\uparrow and \\downarrow\\downarrow pairs (no \\uparrow\\downarrow); it breaks time-reversal because the orbital factor carries an intrinsic \\mathbf{L}=\\hat{\\boldsymbol{\\ell}}. The residual symmetry is U(1) {S z}\\times U(1) {L z-\\phi}. At weak coupling the BW state has lower condensation energy at every pressure, by a margin of order 5\\%. The ABM state nonetheless wins in a wedge of the phase diagram (the A-phase) because spin-fluctuation feedback — Brinkman, Serene \u0026 Anderson — preferentially enhances equal-spin pairing as the gap grows, an effect absent in mean-field BCS . Figure: Schematic P–T phase diagram of ^3He at zero field (left) — the A-phase wedge appears only above \\approx 21 bar; below that the system goes directly normal \\to B. Right: the gap magnitudes on the Fermi sphere — ABM has point nodes along \\pm\\hat{\\boldsymbol{\\ell}}, BW is isotropic. Credit audit: discovery, identification, naming The phases were discovered at Cornell in 1971 by Osheroff, Richardson \u0026 Lee in a Pomeranchuk-cooled cell — initially mistaken for a magnetic transition in the solid coexisting with the liquid . Two anomalies in the pressurization trace, \"A\" and \"B\", were renamed once Osheroff's NMR work the next year located them unambiguously in the liquid. The 1996 Nobel went to these three. The identification — that \"A\" is the Anderson–Brinkman–Morel axial state and \"B\" is the Balian–Werthamer isotropic state — is Leggett's, in a sequence of 1972–1975 papers culminating in the spin dynamics that predicts the longitudinal NMR frequency shifts uniquely characteristic of each phase. His 2003 Nobel lecture is unusually candid about what he could and could not have done without Anderson–Brinkman–Morel and Balian–Werthamer already on the shelf . Textbook attribution still routinely conflates \"discoverer\" with \"identifier\" and elides ABM/BW into \"the order parameter that Leggett used.\" A separate priority point: Balian \u0026 Werthamer (1963) wrote their state down as a theoretical curiosity — a generic odd-parity BCS state — eight years before there was anything to identify. Anderson \u0026 Morel (1961) likewise predated discovery by a decade. The 1973 Anderson–Brinkman refinement that made ABM thermodynamically realizable came after discovery, in response to the experimental fact that an A-phase existed at all. What is genuinely new in ^3He Three features have no analogue in ^4He and propagate forward into modern condensed matter: 1. Continuous internal symmetry of the order parameter. Vortex cores in ^3He-A are non-singular : the \\hat{\\boldsymbol{\\ell}} texture can carry circulation by escaping into the third (spin) dimension. Mermin–Ho (1976) and Anderson–Toulouse vortices have no ^4He counterpart. 2. Topological defects classified by homotopy groups of coset spaces G/H — half-quantum vortices in ^3He-A (\\pi 1 = \\mathbb{Z} 4), point defects (\"hedgehogs\") in ^3He-B, and the boojum at a wall. Volovik's monograph treats ^3He as a benchtop laboratory for relativistic-field-theory analogues, including the chiral anomaly via the \\hat{\\boldsymbol{\\ell}} texture in the A-phase . 3. Topological superconductivity, before the name existed. The BW state is the canonical ^3P 0 time-reversal-invariant topological superfluid (DIII class), with Majorana surface bound states; the ABM state with its chiral p x+ip y orbital factor (per spin species) is the prototype of the two-dimensional chiral p-wave superconductor invoked for Sr 2RuO 4 and for the Moore–Read Pfaffian at \\nu=5/2. The modern classification of topological insulators and superconductors — and Volovik's reinterpretation of ^3He as a relativistic vacuum — both descend directly from the d {\\alpha i} matrix. The pedagogical takeaway is that \"^3He is BCS\" is true only at the resolution of \"^4He is BEC\": correct as a slogan, wrong as a statement of what the order parameter looks like and what symmetries it breaks. The 3\\times 3 matrix is the whole story, and the credit ledger — Osheroff/Richardson/Lee discovered ; Leggett identified ; Anderson/Brinkman/Morel and Balian/Werthamer wrote down the states — should be kept in that order. Current Frontier: Supersolidity, Dipolar Condensates, Moiré Excitons, and the Neutron Star Interior Current Frontier: Supersolidity, Dipolar Condensates, Moiré Excitons, and the Neutron Star Interior After 2015 the superfluid concept has been pushed into four regimes where the textbook formalism — phonon–roton spectrum, Landau two-fluid hydrodynamics, ODLRO of a scalar order parameter — was never designed to live. Each regime asks a different uncomfortable question. Dipolar supersolids force a literal reading of Leggett's 1970 NCRI fraction. Uniform 2D Bose gases dissolve the BEC criterion while leaving superfluidity intact. Moiré exciton bilayers promise an equilibrium electron–hole condensate whose order parameter has no neutral analogue. Neutron-star matter requires a relativistic, entrained, multi-component two-fluid theory whose calibrating experiment is a millisecond timing residual. Dipolar supersolids: two Goldstone modes from one fluid Three groups — Tanzi et al. (Pisa), Böttcher et al. (Stuttgart), Chomaz et al. (Innsbruck) — independently reported in 2019 a stripe phase in trapped ^{162}Dy and ^{166}Er condensates that simultaneously carried global phase coherence and a spontaneously broken translational symmetry. The mechanism is the dipolar roton instability of Santos–Shlyapnikov–Lewenstein softened against collapse by the Lee–Huang–Yang quantum correction (Petrov 2015), so the supersolid is stabilised by beyond-mean-field physics rather than by short-range repulsion. By 2021 Norcia et al. extended the construction to a genuinely two-dimensional droplet lattice, and the post-2022 work has moved to binary mixtures, fermionic impurities, and structural transitions inside the lattice itself. The conceptual content is exactly what Andreev and Lifshitz wrote down in 1969: a supersolid carries two Goldstone modes — a longitudinal crystal phonon and a superfluid second sound — coupled by an off-diagonal susceptibility. The measurement of both modes (Tanzi et al. 2019; Guo et al. 2019) is the cleanest evidence that the dipolar droplet array is not a mere classical crystal of mini-BECs. Leggett's NCRI fraction f s = \\rho s/\\rho \u003c 1 is now an experimentally extracted number, not a thought experiment, and it sits well below unity — typical reports 0.1–0.5 — which is itself an indictment of any pedagogy in which \"superfluid fraction\" and \"condensate fraction\" are silently identified. What remains genuinely open: (i) whether the dipolar supersolid is a thermodynamic phase or a metastable finite-size construct of the trap; (ii) the universality class of the modulation transition once the LHY term — a non-analytic \\psi ^5 correction — is no longer perturbative; (iii) whether vortices threading the lattice obey the Onsager–Feynman \\kappa = h/m when \\rho s/\\rho is small. None of these is answered by §2's two-fluid equations. 2D Bose gases: superfluidity without ODLRO The Mermin–Wagner–Hohenberg theorem forbids \\langle \\hat\\psi(\\mathbf{r})\\hat\\psi^\\dagger(0)\\rangle from acquiring a finite long-distance limit at T 0 in two dimensions; the one-body density matrix decays algebraically. Penrose–Onsager's ODLRO criterion is therefore not met, and yet a 2D Bose fluid in the BKT regime has a sharp superfluid transition with the universal jump The uniform 2D atomic gas in a box potential (Cambridge, ENS, Chicago) has now tested scale invariance, the Nelson–Kosterlitz jump, and Kibble–Zurek scaling across a quench through the BKT line. The pedagogical lesson — that the conflation §5 flagged (\"superfluidity = BEC\") is quantitatively false in 2D — is no longer a paper-and-pencil argument; it is a routinely measured fact in a box trap. Moiré excitons: an equilibrium electron–hole condensate? The neutral-superfluid programme has a long-standing wish list item: an equilibrium condensate of spatially indirect excitons in an electron–hole double layer, originally proposed by Lozovik–Yudson (1975) and quantitatively reformulated for semiconductor heterostructures by Conti, Vignale, and MacDonald . The TMD revolution (WSe 2/MoSe 2, WS 2/WSe 2) provides exactly the platform Conti et al. asked for: a tunable interlayer distance set by hBN spacers, a controllable density set by gates, and — added since 2018 — a moiré superlattice that flattens the exciton band and enhances correlation effects. Double bilayer graphene was forecast in to host room-temperature BCS-BEC-crossover superfluidity for the same electron–hole geometry. The post-2020 experimental claims fall into three categories. (i) Optical signatures of moiré-trapped exciton Mott physics in WSe 2/WS 2 — robust. (ii) Coulomb-drag and counterflow anomalies in GaAs and graphene double layers consistent with a paired phase — suggestive, not conclusive. (iii) Direct imaging of interlayer-exciton phase coherence in a TMD heterostructure (2025). The persistent ambiguity is the same one Keldysh diagnosed in the 1960s: a dipole-aligned exciton fluid with long lifetime is not yet a superfluid; one needs evidence of a \\kappa = h/m^ quantum of circulation or of dissipationless counterflow. Until then the field lives in the regime \"plausible but disputed\". Neutron-star interior: relativistic two-fluid with entrainment The two superfluid components of a mature neutron star — ^1S 0 paired neutrons in the inner crust and ^3P 2 paired neutrons in the core, with proton ^1S 0 pairing on top — are the only setting where the two-fluid formalism is required to be relativistic and the entrainment off-diagonal mass tensor \\rho {np} is dynamically dominant. Two observations drive the field. First, the Cassiopeia A neutron star cools in real time at a few percent per decade; Page, Lattimer, Prakash, Steiner (2011) and Shternin et al. (2011) explained this as the onset of ^3P 2 pairing turning on the pair-breaking-formation (PBF) neutrino channel — a real-time thermometry of T c^{(3P 2)} \\sim 5\\times10^8 K. Subsequent Chandra reanalyses (Posselt \u0026 Pavlov 2022) softened the magnitude, and alternative non-superfluid explanations (quantum-critical neutron liquid, arXiv:2410.21945) are now on the table. The PBF interpretation is no longer the only one consistent with the timing. Second, Vela-type giant glitches are textbook Anderson–Itoh: pinned vortex avalanches unbind, transferring angular momentum from the crust superfluid to the rigid lattice. Chamel's calculations of band-structure entrainment in the inner-crust lattice show that the effective superfluid mass is enhanced by a factor 4–5, which collapses the available crustal moment of inertia below the Vela glitch budget unless core superfluid is recruited. This is the unresolved \"entrainment crisis\": either the equation of state must be softened, or the glitch reservoir extends well into the core. Three-nucleon forces are central to the ^3P 2 gap calculation itself , and the phonon transport coefficients that set the post-glitch relaxation are now derived from the superfluid effective theory . The I–Love–Q universality survives the two-fluid generalisation but with measurable corrections . Where the textbook formalism is inadequate Five fronts are now visibly outrunning the §3 toolkit. (1) A scalar complex order parameter is wrong: dipolar supersolids need a coupled (\\psi, \\delta\\rho G) field theory; ^3He needs the 3\\times3 matrix d {\\alpha i}; spinor and moiré exciton systems need multi-component pseudospin orders, with spin-superfluid generalisations [40, 41] in which the conserved charge is magnetisation rather than particle number. (2) ODLRO is a sufficient but not necessary criterion for superfluidity; the 2D box trap forces this into every introductory course. (3) NCRI fraction \\neq condensate fraction \\neq \\rho s/\\rho in any system with broken translational symmetry; supersolids make the distinction operational. (4) Landau two-fluid hydrodynamics is not relativistic and ignores entrainment; the neutron-star programme has rebuilt it as a covariant Andreev–Bashkin theory. (5) Driven–dissipative condensates (polaritons, photons) have non-Hermitian Bogoliubov spectra in which the Landau criterion is replaced by an instability threshold of the imaginary part — a regime Volovik's universality programme anticipated but which the canonical formalism does not contain. Synthesis: What 'Superfluidity' Should Mean in 2026 Synthesis: What 'Superfluidity' Should Mean in 2026 The history compiled in §§1–7 leaves the word \"superfluidity\" carrying at least three semi-detached meanings: a transport phenomenon (vanishing viscosity in a channel), an order-parameter statement (a macroscopic eigenvalue of the one-body density matrix), and a topological constraint (quantised circulation). For ^4He these coincide; almost nowhere else do all three apply cleanly. A workable 2026 definition must therefore be a conjunction , not a slogan, and must specify what is allowed to fail when a system is two-dimensional, fermionic, charged, disordered, dipolar, or spinor. I propose the following. Definition. A system is superfluid in a state \\rho at temperature T if all three of the following hold. (A) Macroscopic coherence. The reduced one-body density matrix \\rho 1(\\mathbf{r},\\mathbf{r}') has a macroscopic eigenvalue N 0 \\propto N in the sense of Penrose–Onsager — ODLRO. For systems where ODLRO is forbidden by Mermin–Wagner (e.g. 2D Bose at T 0), this clause is replaced by quasi-ODLRO : \\rho 1(\\mathbf{r},\\mathbf{r}') \\sim \\mathbf{r}-\\mathbf{r}' ^{-\\eta} with \\eta \u003c 1/4 on the superfluid side of a BKT transition . For fermionic and composite-boson systems, ODLRO is required of the appropriate two-body or many-body density matrix (the Yang criterion). (B) Nonzero superfluid stiffness in linear response. The transverse current–current correlator satisfies equivalently the free-energy increment under an infinitesimal phase twist \\theta(\\mathbf{r}) = \\mathbf{Q}\\cdot\\mathbf{r} obeys \\Delta F = \\tfrac12 \\rho s \\int \\nabla\\theta ^2 at Q\\to 0. This is the Pollock–Ceperley / Fisher–Barber–Jasnow definition; it is what is actually measured by Andronikashvili's torsion stack and by analogous twisted-boundary-condition diagnostics in numerics. (C) A Landau-type critical-velocity bound. There exists a velocity v c 0, set by the low-lying excitation spectrum \\epsilon(\\mathbf{k}) via v c = \\inf {\\mathbf{k}} \\epsilon(\\mathbf{k})/\\hbar \\mathbf{k} , below which spontaneous excitation by a uniformly moving impurity is energetically forbidden. The bound v c need not be the observed critical velocity in a finite geometry (vortex nucleation generically lowers it; see §5), but its existence as a lower bound on intrinsic dissipation is what distinguishes a superfluid from a coherent-but-dissipative state. Conditions (A) and (B) together imply quantised circulation \\oint \\mathbf{v} s \\cdot d\\boldsymbol{\\ell} = nh/m^ around any contractible loop, with m^ the constituent (or pair) mass — Onsager's statement, not a separate axiom. Topological order in 2D enters through (A'): the algebraic decay exponent and the vortex–antivortex unbinding give a finite stiffness that jumps to zero at T {\\mathrm{BKT}}, exactly as in the Nelson–Kosterlitz universal-jump relation. What survives as fully general Four classical results need no modification. Landau's kinematic argument for the existence of v c uses only Galilean invariance and the spectrum \\epsilon(\\mathbf{k}); it applies unchanged to ^4He , dilute Bose gases , BCS fermions, dipolar condensates and (with appropriate substitution of magnon dispersion) magnon condensates and spin supercurrents [40, 42, 41]. Onsager's quantisation of circulation , once \\mathbf{v} s = (\\hbar/m^ )\\nabla\\theta is recognised as the gradient of a single-valued phase, is a purely topological statement. It survives passage to charged systems (flux quantisation h/2e in BCS), to neutron-star ^3P 2 pairing where the gauge structure is non-Abelian [37, 39], and to dipolar and moiré-exciton condensates with composite constituents. The two-fluid hydrodynamic equations — continuity, Euler for \\mathbf{v} s, viscous Navier–Stokes for \\mathbf{v} n, entropy carried entirely by the normal component — are a low-frequency, long-wavelength expansion controlled by symmetry, not by a particular microscopic model. They apply, with appropriately reinterpreted \\rho s, \\rho n, in every superfluid that has a phonon-like Goldstone mode. The Tisza/Landau dispute over the microscopic meaning of \\rho n is, at this kinematic level, irrelevant. Penrose–Onsager ODLRO as the order-parameter statement for global U(1) symmetry breaking survives in the N\\to\\infty limit for any Bose-symmetric ground state with a Bogoliubov-type quasiparticle vacuum ; the mathematical-physics literature has formalised this for a class of dilute interacting bosons . What was ^4He-specific Three results that habitually travel under the name \"superfluidity\" are not general. The phonon–roton dispersion and its roton minimum at k r \\approx 1.9\\,\\text{\\AA}^{-1} are quantitatively a property of strongly-interacting ^4He at SVP and disappear at high pressure or in dilute gases; in dipolar BECs there is an unrelated structure also called a \"roton\", which is a precursor of supersolid crystallisation [§7], not a Landau roton in the He II sense. A condensate fraction approaching unity at T=0. In He II the condensate fraction n 0/n \\approx 7\\text{–}10\\% even as \\rho s/\\rho \\to 1. The identification n 0 = \\rho s is correct only for the ideal Bose gas and to leading Bogoliubov order [29, 22]; treating it as definitional outside that regime is the most consequential error in the pedagogical literature (§5). Galilean invariance. Landau's derivation assumes the dispersion in the rest frame of the fluid is the same as in the laboratory frame — i.e. translational symmetry. In optical lattices, moiré heterostructures and the inner crust of neutron stars the system is at best discretely translation-invariant; the relevant object is then the superfluid weight D s of the lattice model, and the Landau bound must be replaced by an analysis on the Brillouin zone. Open conceptual questions The honest residue, where the definition above does not yet uniquely fix the physics: 1. The meaning of \\rho s <script type="application/json" id="aether-data">{"slug": "superfluidity-a-dossier-on-the-anatomy-of-a-macroscopic-quan", "topic": "superfluidity", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "Superfluidity: A Dossier on the Anatomy of a Macroscopic Quantum State", "subtitle": "Archaeology, formalism, and the persistent confusions of a ninety-year-old idea", "domain": "", "era": "", "why_big": "", "abuse": "", "date": "June 13, 2026", "ts": 1781401700.294088, "engine": "Claude Code CLI · default model", "aliases": ["frictionless flow", "Helium II superfluid phase", "Bose superfluid", "fermionic superfluid (paired)", "macroscopic quantum hydrodynamics"], "origin_story": "Superfluidity is the dissipationless flow of a quantum liquid below a critical temperature. The phenomenon was approached in stages from Leiden: Kamerlingh Onnes liquefied 4He in 1908 and noted (1911 and again in his 1913 Nobel lecture) the suspicious density maximum near 2.2 K; Wolfke and Keesom localised this as a true phase transition in 1927–28, baptising the phases He I / He II and (after Ehrenfest) calling the specific-heat singularity the λ-point. Anomalous heat transport and viscosity in He II were noted through the 1930s (Keesom \u0026 Clusius, Keesom \u0026 Miss Keesom, Allen, Peshkov), but the decisive viscosity measurements were sent to Nature in November–December 1937 by Kapitza in Moscow and, two weeks later, by Allen and Misener in Cambridge; both appeared on facing pages of the 8 January 1938 issue. Kapitza, in that one-page letter, coined 'super-fluid' by deliberate analogy with superconductivity. Within months F. London identified the λ-transition with Bose–Einstein condensation, and Tisza, in Paris, extended this into the two-fluid hydrodynamics. Landau (1941) rebuilt the two-fluid model on a phonon/roton spectrum and rejected London's BEC picture; Bogoliubov (1947) reconciled them microscopically for a weakly-interacting Bose gas. The macroscopic-wavefunction interpretation was sealed by Onsager's 1949 remark on quantised circulation, by Penrose \u0026 Onsager's 1956 ODLRO criterion, and experimentally by Andronikashvili (1946, ρ_s/ρ) and Vinen (1961, h/m quantum). The fermionic, p-wave generalisation followed with the 1971–72 discovery of superfluid 3He by Osheroff, Richardson and Lee and its identification with Anderson–Brinkman–Morel / Balian–Werthamer states by Leggett.", "credit_audit": "Textbook attribution of superfluidity is unusually distorted. (i) Discovery: Kapitza is canonically credited; Allen \u0026 Misener published in the same Nature issue from independent Cambridge work and received no Nobel share — Kapitza's 1978 prize was framed as 'basic discoveries in low-temperature physics', and his Nobel lecture pointedly addressed plasma, not He II. (ii) Two-fluid model: Tisza (1938) preceded Landau (1941); Landau dismissed Tisza's BEC underpinning but kept the kinematic structure, and Soviet-influenced pedagogy then propagated the model as Landau's. The truth is closer to 'Tisza's kinematics + Landau's spectrum'. (iii) BEC interpretation: London's identification of the λ-transition with BEC was correct in spirit and wrong in detail (4He is strongly interacting; the condensate fraction at T=0 is ≈7%) — its rehabilitation needed Penrose \u0026 Onsager's ODLRO (1956) and was not fully validated until trapped-atom BECs (1995) and direct neutron measurements of n_0. (iv) Quantised circulation: invariably presented as 'Feynman's' result, although Onsager stated it first (1949 Florence conference proceedings). (v) Roton: a Landau ansatz vindicated by Feynman; the experimental confirmation by neutron scattering (Henshaw \u0026 Woods 1961, Cowley \u0026 Woods 1971) is rarely named. (vi) 3He: the 1996 Nobel went to Osheroff–Richardson–Lee but the actual identification of the A and B phases as ABM and BW states is Leggett's (1972) — Anderson, Brinkman, Morel, Balian and Werthamer are usually footnoted.", "timeline": [{"year": 1908, "event": "First liquefaction of 4He at 4.2 K; later precise density measurements show a maximum near 2.2 K, noted in his Nobel lecture as 'possibly connected with the quantum theory'.", "who": "H. Kamerlingh Onnes", "work": "Leiden Comm. 108; Nobel Lecture (1913)", "kind": "observation", "ref": 1}, {"year": 1924, "event": "Quantum statistics for indistinguishable bosons (the prerequisite of BEC).", "who": "S. N. Bose; A. Einstein (translator/extender)", "work": "'Plancks Gesetz und Lichtquantenhypothese', Z. Phys. 26, 178 (1924); Einstein, Sitzungsber. Preuss. Akad. Wiss. (1924/25)", "kind": "formalization", "ref": 2}, {"year": 1927, "event": "Identification of the λ-anomaly as a transition between two liquid phases He I / He II.", "who": "M. Wolfke \u0026 W. H. Keesom", "work": "Comm. Leiden 190b; KNAW Proc.", "kind": "observation", "ref": 3}, {"year": 1936, "event": "Anomalously high heat conductance in He II reported in Leiden; first hint of non-classical transport.", "who": "W. H. Keesom, A. P. Keesom (\u0026 Saris)", "work": "Physica 3 (1936) 1029", "kind": "observation", "ref": 4}, {"year": 1938, "event": "Discovery of vanishing viscosity in He II; the word 'super-fluid' is coined by analogy with superconductors.", "who": "P. L. Kapitza", "work": "'Viscosity of Liquid Helium below the λ-point', Nature 141, 74 (1938)", "kind": "observation", "ref": 6}, {"year": 1938, "event": "Independent, simultaneous discovery of frictionless flow through fine channels.", "who": "J. F. Allen \u0026 A. D. Misener", "work": "'Flow of Liquid Helium II', Nature 141, 75 (1938)", "kind": "observation", "ref": 7}, {"year": 1938, "event": "Fountain (thermomechanical) effect: heat drives a pressure head — direct evidence of two coupled mass currents.", "who": "J. F. Allen \u0026 H. Jones", "work": "'New Phenomena Connected with Heat Flow in Helium II', Nature 141, 243 (1938)", "kind": "observation", "ref": 9}, {"year": 1938, "event": "Identification of the λ-transition with Bose–Einstein condensation — the first conceptual bridge from quantum statistics to macroscopic flow.", "who": "F. London", "work": "'The λ-Phenomenon of Liquid Helium and the Bose-Einstein Degeneracy', Nature 141, 643 (1938)", "kind": "theory", "ref": 13}, {"year": 1938, "event": "Two-fluid hydrodynamics: He II = normal + superfluid components with independent velocity fields; prediction of thermal (second-sound) waves.", "who": "L. Tisza", "work": "Nature 141, 913 (1938); Comptes Rendus 207, 1035 \u0026 1186 (1938, presented by Langevin)", "kind": "theory", "ref": 12}, {"year": 1941, "event": "Two-fluid hydrodynamics rebuilt on a phonon–roton excitation spectrum; superfluidity from the Landau critical-velocity criterion — London/BEC explicitly rejected.", "who": "L. D. Landau", "work": "ZhETF 11, 592; Phys. Rev. 60, 356", "kind": "theory", "ref": 17}, {"year": 1946, "event": "Direct measurement of ρ_s(T)/ρ via the torsional-disk-stack experiment, confirming the two-fluid picture.", "who": "E. L. Andronikashvili", "work": "ZhETF 16, 780; 18, 424", "kind": "observation", "ref": 14}, {"year": 1947, "event": "Microscopic theory of a weakly-interacting Bose gas: u–v transformation, linear quasiparticle spectrum satisfying Landau's criterion.", "who": "N. N. Bogoliubov", "work": "'On the theory of superfluidity', J. Phys. USSR 11, 23 (1947)", "kind": "theory", "ref": 16}, {"year": 1949, "event": "Quantisation of circulation κ = nh/m predicted as a topological consequence of the macroscopic phase.", "who": "L. Onsager", "work": "Nuovo Cimento 6 Suppl. 2, 279 (Florence statistical-mechanics conf.)", "kind": "theory", "ref": 22}, {"year": 1955, "event": "Roton as a localised backflow excitation; semi-quantitative variational reconstruction of Landau's spectrum from Bose statistics.", "who": "R. P. Feynman; M. Cohen", "work": "Progress in Low Temperature Physics, Vol. 1, ch. 2 (North-Holland); PTP 14, 261", "kind": "theory", "ref": 25}, {"year": 1956, "event": "Off-diagonal long-range order (ODLRO) of the one-body density matrix as the order parameter of Bose superfluidity.", "who": "O. Penrose \u0026 L. Onsager", "work": "'Bose-Einstein Condensation and Liquid Helium', Phys. Rev. 104, 576 (1956)", "kind": "formalization", "ref": 24}, {"year": 1961, "event": "Direct observation of a single quantum of circulation h/m on a vibrating wire — first macroscopic-quantum measurement in a fluid.", "who": "W. F. Vinen", "work": "Proc. Roy. Soc. A 260, 218 (1961)", "kind": "observation", "ref": 19}, {"year": 1972, "event": "Discovery of superfluid 3He (A and B phases) in a Pomeranchuk-cooled cell; p-wave / spin-triplet pairing identified theoretically by Leggett.", "who": "D. D. Osheroff, R. C. Richardson, D. M. Lee; A. J. Leggett (theory)", "work": "PRL 28, 885 (1972); PRL 29, 920 (Leggett 1972); Nobel Lectures 1996 \u0026 2003", "kind": "observation", "ref": 8}], "neglected": [{"name": "Jack F. Allen \u0026 A. Donald Misener", "role": "Independent, essentially simultaneous discoverers of vanishing viscosity in He II; their Cambridge paper sat opposite Kapitza's in Nature 141, but in popular and prize history the discovery is routinely attributed to Kapitza alone, and the 1978 Nobel went only to him.", "evidence": "Allen \u0026 Misener, Nature 141, 75 (1938); Griffin (Physics World, 2008) and Balibar (Nuovo Saggiatore) document the priority and the asymmetric credit.", "ref": 30}, {"name": "László Tisza", "role": "Originator of the two-fluid model and the prediction of second sound. The model is now almost universally taught as 'Landau's two-fluid model'; Landau (1941) cited Tisza only to disagree with the BEC underpinning, then absorbed the formal structure.", "evidence": "Balibar, 'Laszlo Tisza and the two-fluid model of superfluidity', Comptes Rendus Physique 18, 586 (2017).", "ref": 31}, {"name": "Fritz London", "role": "First to connect the λ-transition with BEC and to insist on a macroscopic wavefunction — a view rejected by Landau and only fully rehabilitated by Penrose–Onsager (1956) and the ultracold-atom era. London's two-volume monograph remained the conceptual reference for a generation.", "evidence": "London, Nature 141, 643 (1938); 'Superfluids' Vol. II (Wiley, 1954); Gavroglu's biography.", "ref": 5}, {"name": "Mieczysław Wolfke", "role": "Co-discoverer with Keesom of the He I / He II phase transition in 1927; in textbooks the discovery is regularly attributed to Keesom alone.", "evidence": "Wolfke \u0026 Keesom, KNAW Proc. 31, 81 (1928); cited in Donnelly, Physics Today 48(7) 30 (1995).", "ref": 15}, {"name": "Elephter Andronikashvili", "role": "His Tbilisi torsional-disk-stack experiment is what actually MEASURED ρ_s(T), turning the two-fluid model from picture into quantitative theory; modern reviews compress this to a parenthetical.", "evidence": "Andronikashvili, ZhETF 16, 780 (1946); reprinted in his 'Reflections on Liquid Helium' (AIP, 1989).", "ref": null}, {"name": "Lars Onsager", "role": "Stated κ = nh/m as a one-paragraph discussion remark in Florence (1949) before Feynman's vortex papers; the result is frequently labelled 'Feynman's quantisation condition' in pedagogical accounts.", "evidence": "Onsager, Nuovo Cimento 6 Suppl. 2, 279 (1949); Donnelly, 'Sixty Years of Quantized Circulation', J. Low Temp. Phys. (2023).", "ref": null}, {"name": "Bernard V. Rollin (with F. Simon, J. G. Daunt, K. Mendelssohn)", "role": "The creeping helium-film transport that became a stock illustration of superfluidity is called the 'Rollin film' only sporadically; Rollin's 1936 Oxford observation is often attributed wholesale to Daunt and Mendelssohn.", "evidence": "Rollin \u0026 Simon, Physica 6, 219 (1939); Daunt \u0026 Mendelssohn, Nature 143, 719 (1939).", "ref": null}], "conflations": [{"claim": "'Superfluidity = Bose–Einstein condensation.'", "clarification": "BEC is a property of the one-body density matrix (macroscopic eigenvalue / ODLRO); superfluidity is a transport property defined by Landau's critical-velocity criterion and a nonzero ρ_s in linear response. They coincide for the ideal Bose gas and for weakly-interacting bosons (Bogoliubov), but a 2D Bose fluid is superfluid without true BEC (BKT regime), and an ideal Bose gas BEC has zero critical velocity — no superflow. In 4He at T=0 the condensate fraction is ≈7–10%, while ρ_s/ρ → 1."}, {"claim": "'Helium II is the superfluid; superfluidity sets in at T_λ.'", "clarification": "He II is the equilibrium phase below T_λ ≈ 2.17 K. Superfluidity in the kinematic sense (ρ_s \u003e 0) does begin at T_λ, but a generic flow in He II is dissipative once v_n ≠ 0 or v_s exceeds a (geometry-dependent) Feynman–Vinen critical velocity set by vortex nucleation — far below the Landau roton velocity. 'Helium II' names a phase, 'superfluid' names a component."}, {"claim": "'Landau's two-fluid model.'", "clarification": "The two interpenetrating, distinct-velocity-field picture, together with the prediction of thermal waves, is Tisza's (1938). Landau (1941) replaced Tisza's BEC-based normal/condensate split by a thermodynamic split into ground state plus phonon–roton excitation gas, and dismissed Tisza in print. The hydrodynamic equations one writes down (continuity, Euler for v_s, Navier-Stokes for v_n, entropy carried by the normal component) are common to both."}, {"claim": "'Superfluid 3He is a BCS condensate.'", "clarification": "It is a BCS-type pairing condensate but with L=1, S=1 (p-wave, spin-triplet), so the order parameter is a 3×3 matrix d_{αi}(k̂) rather than a complex scalar. The A-phase (ABM state) breaks time-reversal and has gap nodes; the B-phase (BW state) is fully gapped but anisotropic in spin space. Calling it 'BCS' without that caveat erases the entire reason a Nobel was given for the identification."}, {"claim": "'Onsager–Feynman quantisation of circulation.'", "clarification": "The statement κ = nh/m was made by Onsager as a single remark in the Florence 1949 proceedings; Feynman re-derived it and developed the vortex-line picture of rotation, second sound damping and the roton in 1955. The 'Onsager–Feynman' hyphenation papers over a four-year priority and two quite different motivations."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Leiden to Cambridge: Discovery, Priority, and the Asymmetries of Credit", "markdown": "## Leiden to Cambridge: Discovery, Priority, and the Asymmetries of Credit\n\n### The thirty-year prelude (1908–1937)\n\nHelium liquefied in Leiden on 10 July 1908; everything that follows is the unhurried unpacking of what that liquid was hiding. Kamerlingh Onnes himself never quite saw superfluidity, but he came astonishingly close. The density of the liquid, measured with a quartz dilatometer, showed a sharp maximum near $2.2$ K — an anomaly Onnes himself flagged in his 1913 Nobel address as \"possibly connected with the quantum theory of Planck\" [1]. He had no theoretical handle on it. By 1924 the requisite statistics existed — Bose's quantisation of the photon gas, extended by Einstein to massive particles [2] — but no one in Leiden connected the two. The conceptual lag (fourteen years, 1924 → 1938) is itself part of the historical lesson: macroscopic quantum statistics were available in print before the experimental anomaly that demanded them was named as a phase transition.\n\nThat naming happened in Leiden in 1927. Mieczysław Wolfke, a Polish optical physicist visiting Keesom's laboratory, and Willem Hendrik Keesom himself, working on the dielectric constant and density of liquid helium, identified a discontinuity at $T_\\lambda \\approx 2.17$ K as a transition between two distinct liquid phases: helium I above, helium II below [3]. The choice of the letter $\\lambda$ came from the shape of the specific-heat curve, which Keesom and his daughter Ania resolved with high precision in 1935 — the now-iconic logarithmic divergence\n\n$$C_p(T) \\sim -A \\ln\\!\\bigl\\lvert T - T_\\lambda\\bigr\\rvert + \\text{regular}$$\n\npublished in *Physica* [4]. This is the sharpest pre-1938 evidence that the transition is a genuine cooperative phenomenon, not a mere crossover. The 1936 Leiden measurements of an anomalously high thermal conductance in He II — by Keesom, Keesom, and Saris — were the third pillar: He II did not merely have a different density; it transported heat in a way no ordinary liquid could.\n\nTwo facts about this prelude deserve emphasis. First, the entire phenomenology — anomalous density, $\\lambda$-discontinuity, anomalous thermal transport — was in hand by 1936 without anyone uttering the word *superfluid*. Second, Wolfke's name vanishes almost completely from the Anglophone textbook tradition; the discovery of the $\\lambda$-transition is routinely attributed to Keesom alone, despite his presence as a co-author and equal partner on the KNAW Proceedings paper [3]. Donnelly's *Physics Today* historical reconstruction is one of the few accessible sources that restores the joint attribution [5].\n\n### The Nature issue of 8 January 1938\n\nThe next move came not from Leiden, where the war and Keesom's retirement had slowed work, but from Cambridge and Moscow simultaneously. Kapitza in Moscow (working alone, with a torsion-pendulum geometry that pushed He II through a $\\sim 0.5\\,\\mu\\text{m}$ gap between optically polished disks) and Allen and Misener in the Mond Laboratory (forcing He II through fine capillaries) independently observed that the viscosity of helium II, below $T_\\lambda$, was effectively zero. The two papers appeared back-to-back in *Nature* on 8 January 1938, separated by one page [6, 7]. Kapitza coined the term *super-fluid* by deliberate analogy with Onnes's 1911 *supraconductivity*. The Allen–Misener paper made no such terminological claim, but the experimental case was no weaker; in some respects it was cleaner, because narrow-capillary flow is less encumbered by the secondary-flow problem that
