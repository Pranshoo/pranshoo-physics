<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Tangent Mistaken for the Curve: Fermi's Golden Rule and Its Missing Validity Theory", "alternativeHeadline": "Fermi golden rule", "name": "Fermi golden rule", "description": "Dirac derived it, Wentzel used it, Pauli made it kinetic, Weisskopf–Wigner supplied the exponential everyone quotes — and Van Hove, Khalfin, Misra–Sudarshan and Bixon–Jortner wrote the conditions nobody checks.", "inLanguage": "en", "keywords": ["Fermi golden rule", "Golden Rule No. 2 (Fermi's own name)", "Golden Rule No. 1 (Fermi's name for the second-order/superexchange version)", "Dirac's golden rule", "Fermi–Dirac golden rule", "Wentzel–Fermi golden rule (rare, mostly German-language)", "the golden rule of time-dependent perturbation theory", "the rate formula", "Fermi golden rule (FGR)", "Born–Fermi rate", "Weisskopf–Wigner decay rate (when resummed)", "quantum mechanics / spectroscopy / condensed matter transport"], "about": [{"@type": "Thing", "name": "Fermi golden rule"}, {"@type": "Thing", "name": "Golden Rule No. 2 (Fermi's own name)"}, {"@type": "Thing", "name": "Golden Rule No. 1 (Fermi's name for the second-order/superexchange version)"}, {"@type": "Thing", "name": "Dirac's golden rule"}, {"@type": "Thing", "name": "Fermi–Dirac golden rule"}, {"@type": "Thing", "name": "Wentzel–Fermi golden rule (rare, mostly German-language)"}, {"@type": "Thing", "name": "the golden rule of time-dependent perturbation theory"}, {"@type": "Thing", "name": "the rate formula"}], "articleSection": "quantum mechanics / spectroscopy / condensed matter transport", "datePublished": "2026-08-14", "dateModified": "2026-08-14", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-tangent-mistaken-for-the-curve-fermis-golden-rule-and-it.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-tangent-mistaken-for-the-curve-fermis-golden-rule-and-it.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "The Vacancy Einstein Left: How Quantum Mechanics Acquired Rates The Vacancy Einstein Left: How Quantum Mechanics Acquired Rates Einstein's 1917 paper is remembered for stimulated emission . Its more consequential move was structural. Einstein posited three coefficients — A {mn}, B {mn}, B {nm} — and let detailed balance against the Planck distribution fix only their ratios : Nothing in the argument fixes a magnitude. Worse, the very existence of the coefficients is an assumption: Einstein wrote the spontaneous term in explicit analogy with the Rutherford–Soddy law of radioactive decay, i.e. he assumed that an atom in state m possesses a constant probability per unit time of jumping to n, independent of how long it has been sitting there. Exponential decay is thereby an input, not an output. This is the vacancy: by 1917 quantum theory had rates before it had any dynamics capable of producing them, and it had them in a form — memoryless, time-homogeneous, constant \\Gamma — that no Hamiltonian evolution can literally supply. Dirac filled it in 1926 . Splitting H = H 0 + V and expanding the coefficients a n(t) of the unperturbed states to first order gives, for a transition to a state f at energy detuning \\Delta E = E f - E i, This is quadratic in t at the origin and oscillatory thereafter — no rate anywhere in it. The rate appears only after summation over a continuum of final states, where the bracketed kernel, of width \\sim\\hbar/t and unit-normalized weight, acts as a nascent delta function, so that P f(t) = (2\\pi/\\hbar) V {fi} ^2\\rho(E f)\\,t. Dirac carried this through explicitly and used it to derive Einstein's B coefficient from a matrix element. In 1927, with the radiation field itself quantized, he obtained A as well , and both coefficients ceased to be phenomenological constants. Every structural element of the modern formula is present in these two papers; the reason Dirac's expressions do not look like the textbook one is that he used energy-normalized continuum states, which absorb \\rho(E) into the normalization and make it invisible. The same machinery is reproduced as routine apparatus in the 1930 Principles . Within months of the 1927 paper, Wentzel turned the rule on a continuum that had nothing to do with radiation . An atom ionized in the K shell can eject an L electron instead of emitting a K\\alpha photon; the final state — bound hole plus free electron — is a genuine continuum reached by the residual electron–electron interaction. Wentzel computed the absolute probability and compared the ratio of ejected electrons to K\\alpha quanta against the counts of Auger and of Robinson. This is the first use of the rule as a predictive instrument rather than a consistency check on Einstein, and every modern Auger–Meitner rate calculation — atomic, molecular, or condensed-phase — is still running his template. Pauli, in the 1928 Sommerfeld Festschrift, changed the rule's status entirely . He took Dirac's W {fi} as the kernel of a kinetic equation for the diagonal density-matrix elements, and proved an H-theorem for it. The step is not free: it requires that the off-diagonal coherences be re-randomized at every instant , an assumption imposed repeatedly on the dynamics rather than derived from it. Van Hove's later achievement was precisely to show that this repeated randomization could be replaced by a scaling limit . Every \"FGR scattering rate\" appearing as a collision integral in a Boltzmann or Redfield equation is Pauli's construction, not Dirac's — and is universally credited to Fermi. In 1930 Weisskopf and Wigner supplied what people actually mean when they quote a golden-rule lifetime . First-order theory gives P(t)=\\Gamma t, a probability growing without bound. Resumming the series self-consistently converts the pole structure into a i(t) ^2 = e^{-\\Gamma t} with a Lorentzian lineshape — and, unavoidably, a real self-energy \\Delta shifting the level, which the golden rule discards. Weisskopf's Academy memoir treats this as the first and most important of his papers . Fermi's own contribution came in 1934: in the \\beta-decay theory he set \\rho(E) equal to the lepton phase space and obtained not a number but an entire observable — the spectral shape, and with it the Kurie plot . The naming is a classroom accident. Schiff's 1949 textbook gave the derivation its standard pedagogical form ; Fermi's Chicago course notes, published in 1950, label the first-order expression \"Golden Rule No. 2\" (p. 142) and cite Schiff for the derivation . Fermi neither derived the formula nor claimed it, and \"No. 2\" implies a \"No. 1\" — the second-order, virtual-intermediate-state rate — which survives in chemical physics as superexchange with no memory of its ranking . So the credit problem is not priority theft. It is that a single label swallowed four distinct acts: Dirac's derivation, Wentzel's first continuum application, Pauli's promotion to kinetics, and Weisskopf–Wigner's resummation. Textbooks retain the first and the last (the latter usually misattributed to the rule itself). Wentzel and Pauli have vanished — and with Pauli went the explicit statement that using the rule as a rate requires a non-quantum assumption nobody now writes down. Sources: Zeitschrift für Physik 43, 524 (Wentzel 1927), Fermi's golden rule (Wikipedia), Pauli master equation and the van Hove limit The Physics, Properly: From Amplitude to Rate, with Every Assumption Numbered The Physics, Properly: From Amplitude to Rate, with Every Assumption Numbered Take \\hat H = \\hat H 0 + \\lambda \\hat V, with \\hat H 0 n\\rangle = E n n\\rangle, and the system prepared in i\\rangle at t=0. In the interaction picture the Dyson series for the amplitude into f\\rangle \\neq i\\rangle reads (A1) Truncate at first order. This is the statement \\Gamma t \\ll 1 — the total transferred probability must stay small — not the statement that \\lambda is small. (A2) The lower limit t'=0 is a sharp switch-on: the state is prepared instantaneously, with no correlation to the bath and no memory of how it was made. Both are physical claims, not bookkeeping. The first-order integral gives the object everything else is built on: This is a quadratic , not linear, function of t for a single final state. There is no rate here. A rate appears only when the sinc² is summed over a manifold of final states — and how that sum is written is where the literature's factor-of-2\\pi disease lives. Two derivations, one statement Dirac's form (energy-normalized continuum) [2, 3]. Label continuum states E,\\alpha\\rangle with \\langle E,\\alpha E',\\alpha'\\rangle = \\delta(E-E')\\delta {\\alpha\\alpha'}. Then the summation measure is \\int\\! dE with unit weight, and using \\lim {t\\to\\infty}\\frac{t}{2\\pi\\hbar}\\,\\mathrm{sinc}^2\\!\\left(\\frac{\\Delta E\\,t}{2\\hbar}\\right) = \\delta(\\Delta E). There is no \\rho. It was absorbed into the normalization of E,\\alpha\\rangle. This is precisely why Dirac's expressions do not resemble the textbook formula, and a large part of why the \\rho-explicit form ended up attached to a later name. The textbook form (box normalization) . Label states k\\rangle discretely, \\langle k k'\\rangle=\\delta {kk'}, in a box of volume \\mathcal V. Now the measure carries the state counting: \\sum k \\to \\int\\! dE\\,\\rho(E), and The dictionary is exact: E,\\alpha\\rangle = \\rho(E)^{1/2} k(E),\\alpha\\rangle, so V {E\\alpha,i} ^2 = \\rho(E)\\, V {fi} ^2. The two forms are the same equation with the density of states parked in different places. The practical corollary: \\rho and V {fi} are not independently meaningful — only the product V {fi} ^2\\rho is. A calculation that takes \\rho from one convention (\\delta^3(\\mathbf k-\\mathbf k'), per spin, per unit volume, per unit energy…) and V {fi} from another is not making a physics error; it is making a units error that looks like physics. Most reported factor-of-2\\pi discrepancies are this. The window Figure: the survival/transfer probability has three regimes. The golden rule is the straight segment; it is the tangent, and it exists only between two walls whose separation is set by bath bandwidth and final-state level spacing, not by coupling strength. The \\delta-function step above hides four more assumptions. (A3) The final-state manifold must be effectively continuous on the scale \\hbar/t: with level spacing \\Delta, this requires t \\ll t H = \\hbar/\\Delta, the Heisenberg time. Past t H the sum over discrete levels rephases and the probability stops growing — Bixon and Jortner's sparse vibronic quasi-continuum , and Zhang and Liu's exactly solvable uniformly-spaced model, where the transfer probability is demonstrably piecewise linear and the rule dies at t H while first-order perturbation theory is still quantitatively accurate . (A4) V {fi} ^2\\rho(E) must be smooth over the bandwidth W that the sinc² samples, defining a bath correlation time \\tau {\\rm corr} = \\hbar/W; for t \\lesssim \\tau {\\rm corr} the sinc² has not collapsed, P \\propto t^2, and no rate exists — the Zeno wall . (A5) Amplitude that leaves i\\rangle never returns: no depletion feedback, no repopulation. Irreversibility is imposed, not derived. (A6) When \\Gamma is used as a collision integral in a transport equation, phases are re-randomized between events — Pauli's Stosszahlansatz , an assumption external to the Schrödinger dynamics and the reason every \"FGR scattering rate\" in a Boltzmann code is Pauli's construction rather than Fermi's . (A7) The rule keeps only \\mathrm{Im}\\,\\Sigma; the real part of the self-energy, the level shift that Weisskopf–Wigner retain alongside the width, is silently discarded . (A8) All of the above collapse to one inequality: \\tau {\\rm corr} \\ll t \\ll \\min(t H,\\,1/\\Gamma). If that chain is empty — sparse final states, sharply structured \\rho, large \\Gamma — no golden-rule rate exists at any coupling strength. Where A1–A8 are simultaneously legitimate Only one limit is known to satisfy all eight in a controlled way: Van Hove's \\lambda^2 t scaling limit, \\lambda \\to 0 and t \\to \\infty with \\lambda^2 t held fixed, for a system with infinitely many degrees of freedom . The order of limits does the work: t\\to\\infty enforces A3 and A4 (both walls recede), \\lambda\\to0 enforces A1 and A5, and the fixed product keeps \\Gamma t finite so the answer is nontrivial. The Markovian master equation with golden-rule coefficients — and, with the secular approximation added, the Lindblad form — is a theorem in this limit and a hope outside it. Van Hove is the only paper in this lineage that states when the rule is true; he is also the one essentially never cited by the spectroscopy and transport literature that depends on him. No. 2, and the No. 1 nobody remembers The second-order term of the Dyson series above, evaluated with the same A3–A4 machinery, gives valid when V {fi} vanishes or is small and the intermediates m\\rangle are energetically remote (so the denominators never go on-shell). In the Chicago notes this is Golden Rule No. 1 ; the first-order expression is No. 2 . Only No. 2 survived the name. No. 1 was rediscovered independently as the superexchange rate in chemical physics and as second-order distorted-wave theory in nuclear physics, with no awareness that Fermi ranked it first . The numbering matters practically: No. 1 has an additional failure mode No. 2 does not — when an intermediate approaches resonance, E i - E m \\to 0, the perturbative denominator diverges and the correct treatment is sequential population of m\\rangle with its own golden-rule window, not a coherent second-order rate. The Window and Its Two Walls: What Breaks When A1–A8 Fail The Window and Its Two Walls: What Breaks When A1–A8 Fail The golden rule is not a formula with a small correction term. It is a formula that exists inside a window in time, and outside that window it does not merely lose accuracy — it loses referent. There is no rate. What follows walks the assumptions in the order they break in practice. A3/A4 — \"the final states form a continuum,\" and \" V {fi} ^2\\rho(E) is smooth\" These are the assumptions that fail first and are checked least. The continuum enters through two timescales, and only two: with W the bandwidth over which V {fi} ^2\\rho(E) is smooth and \\Delta the mean spacing of the final-state manifold. The sinc^2 kernel of width \\hbar/t must be narrow enough to sample the envelope (t \\gg \\tau {\\rm corr}) and wide enough to still blur individual levels (t \\ll t H). The golden-rule window is the intersection: Written that way the failure mode is obvious and it is structural , not perturbative: if \\Delta \\gtrsim W — a sparse manifold, or a smooth one that is simply not dense enough — then t H \\lesssim \\tau {\\rm corr}, the interval is empty, and no golden-rule rate exists at any coupling strength . Making \\lambda smaller does not help; it only makes the (nonexistent) rate smaller. This is Bixon and Jortner's result for intramolecular radiationless transitions : a vibronic quasi-continuum with finite level spacing gives irreversible-looking decay only over an intermediate window, and past the recurrence time the population comes back. Their \"statistical limit\" versus \"intermediate case\" distinction is precisely the statement \\Delta \\ll W versus \\Delta \\sim W, and it is the distinction that gets discarded whenever someone writes down a single internal-conversion rate for a molecule with a dozen accepting modes. Zhang and Liu made this exactly solvable and thereby unarguable . Take a discrete state coupled uniformly with strength v to a ladder of levels spaced by \\Delta, extending symmetrically to \\pm\\infty. The survival probability is computable in closed form, and P {i\\to f}(t) is piecewise linear : it rises with slope \\Gamma = 2\\pi v^2/(\\hbar\\Delta) up to t H = \\hbar/\\Delta (in the conventional 2\\pi\\hbar/\\Delta normalization, the recurrence period), and then flattens, reverses, and recurs. The essential point is what is not wrong at t H: first-order perturbation theory is still excellent there, since \\Gamma t H = 2\\pi v^2/\\Delta^2 \\ll 1 whenever v \\ll \\Delta. So the two conditions - (a) perturbative accuracy, \\Gamma t \\ll 1, - (b) existence of a linear-in-t regime, \\tau {\\rm corr}\\ll t \\ll t H, are logically independent . \"The coupling is weak, so the golden rule applies\" is a non sequitur. Weak coupling buys (a) and says nothing about (b). The operational version: any fitted rate whose value drifts with the fitting window is reporting the slope of a curve that is not a line. A \"rate\" extracted from 0–2 ps and a \"rate\" extracted from 0–20 ps that differ by 40% is not experimental scatter; it is the announcement that t H lies inside your data. A8, lower wall — the Zeno regime For t \\lesssim \\tau {\\rm corr} the survival probability is quadratic, not linear: which follows from nothing more than the analyticity of \\langle i e^{-i\\hat Ht/\\hbar} i\\rangle at t=0 for a state in the domain of \\hat H. Misra and Sudarshan turned this into the formal statement that continuously-monitored decay is suppressed entirely : the derivative dP/dt vanishes at t=0, so there is no rate to speak of below \\tau {\\rm corr}, and repeated projection at intervals \\ll \\tau {\\rm corr} freezes the system. Note the divergence: \\langle\\Delta H^2\\rangle = \\int dE\\,(E-\\bar E)^2\\, V ^2\\rho(E) requires a normalizable second moment, i.e. a bath with a genuine cutoff. The Zeno time is set by the bandwidth, not the coupling — another quantity absent from the golden-rule formula itself. The same wall shows up as an energy resolution. The kernel has FWHM \\approx 4\\hbar/t (and 2\\pi\\hbar/t between first zeros). A 20 fs pulse gives an energy-conserving \\delta-function roughly 30 meV wide (2\\pi\\hbar/20\\,\\text{fs} \\approx 0.2 eV between zeros; \\hbar/t \\approx 33 meV as the characteristic scale). Every \"off-shell\" worry in ultrafast spectroscopy, hot-carrier relaxation, and finite-lifetime intermediate states is this sinc^2 failing to have collapsed. At 100 fs you have 7 meV of slack — comparable to a phonon energy. Energy conservation in a golden-rule calculation is a statement about the observation time, not about the Hamiltonian. A8, upper wall — Khalfin The long-time end is a theorem, not an approximation. If \\hat H is bounded below — which it is, for any physical system — then the survival amplitude is the Fourier transform of a function supported on a half-line, hence a Hardy-class function in the lower half plane. The Paley–Wiener theorem then requires \\int dt\\,\\bigl \\ln a(t) \\bigr /(1+t^2) \u003c \\infty, which a(t) ^2 = e^{-\\Gamma t} violates. Exponential decay at all times is therefore incompatible with a spectrum bounded below . Decay must cross over to a power law, typically P {\\rm surv}\\sim t^{-p} with p fixed by the threshold behaviour of \\omega(E) near E {\\min} (e.g. \\omega \\sim (E-E {\\min})^{1/2} gives t^{-3}). The crossover sits near t \\sim (\\Gamma/\\,E {\\rm res})\\cdot\\tau with an exponentially small residual amplitude — typically tens of lifetimes, which is why it took until 2006 to see it in organic-molecule luminescence (verify) — but the logical point stands independently of the observability: \\tau = 1/\\Gamma is an approximation with a built-in expiry date at both ends, and the \"decay constant\" quoted in a table is the middle segment of a three-segment curve. A5/A7 — no back-action, and the pole you threw away A5 (the initial state is not depleted, and the final states do not feed back) and A7 (only the imaginary part of the self-energy matters) fail together. The honest object is the pole of the resolvent, The golden rule is \\hbar\\Gamma evaluated at E=E i — the imaginary part, on-shell, to lowest order. Weisskopf–Wigner is the resummation that turns P(t)=\\Gamma t into e^{-\\Gamma t} , and it hands you \\Delta(E i) in the same breath: the Lamb-type level shift. Quoting \\Gamma as a lifetime is borrowing the resummed result while discarding half of it. The discarded half is not always small — \\Delta and \\Gamma are Kramers–Kronig partners, so wherever \\rho(E) has structure on scale \\delta E, \\Delta has a dispersive feature of comparable magnitude right where \\Gamma has its peak. The pole also drifts: E {\\rm pole}\\neq E i means \\Gamma should be evaluated self-consistently at the shifted energy, which matters exactly when \\rho varies over the linewidth — i.e. exactly when people reach for \"the structured density of states.\" The collision Structured baths are where all of this comes due at once. Suppose \\rho(E) has a feature of width \\delta E — a cavity mode, an optical-phonon peak, a polaronic resonance. Resolving it demands t \\gg \\hbar/\\delta E. Perturbative validity demands t \\ll 1/\\Gamma. Both hold only if But \\Gamma\\propto\\rho {\\rm peak}, and sharpening a feature at fixed oscillator strength raises \\rho {\\rm peak} roughly as 1/\\delta E. So the left side grows as the right side shrinks: the constraints collide, and they collide precisely at the point where the structure was supposed to make the physics interesting. Past the crossing point the dynamics is coherent and oscillatory — vacuum Rabi splitting in the cavity case, where g \\gtrsim \\kappa and no rate exists at all [19, 20]. This is the regime where phonon-bottleneck rates, hot-carrier cooling rates, and polaron-formation rates are routinely quoted [21, 22]. The diagnostic remains the same as for A3/A4: if the extracted \\Gamma depends on the fitting window, you have measured the curvature of something that is not exponential and reported it as a rate. Everything above is a condition on time , and none of it is visible in \\Gamma = (2\\pi/\\hbar) V {fi} ^2\\rho(E f) — a formula with no t in it, obtained by taking t\\to\\infty in a quantity that was linear in t. Van Hove's \\lambda^2 t limit is the only construction that makes the two limits commute, and it does so by taking \\lambda\\to 0 and t\\to\\infty together at fixed \\lambda^2 t — a scaling statement, not an inequality on V . That is the condition the applied literature does not check, because the formula it uses has been stripped of the variable in which the condition is expressed. Signatures: What Actually Proves a Golden-Rule Rate Exists Signatures: What Actually Proves a Golden-Rule Rate Exists A rate is not an observable. What experiments deliver is a population trace, a lineshape, or a temperature series, and each of these is compatible with several distinct dynamical origins, only one of which is a golden-rule rate. The distinction matters because the golden rule is a claim about a window — \\tau {\\rm corr} \\ll t \\ll t H, with \\Gamma t \\ll 1 — and the standard evidence base is precisely the class of measurements that is blind to window edges. Direct evidence (D1) Linear-in-t transition probability inside independently bounded edges. The golden rule's actual content is P f(t) = \\Gamma t, so the only unambiguous signature is a measured P f linear in t over a range whose two ends were fixed before the fit: \\tau {\\rm corr} = \\hbar/W from the measured bandwidth W over which V {fi} ^2\\rho(E) is smooth, and t H = \\hbar/\\Delta from the final-state level spacing. Both must come from independent spectroscopy, not from the decay trace itself. Zhang and Liu's solvable model makes the point sharply: the transition probability is piecewise linear, with the golden-rule slope holding only to t H, after which the slope changes while first-order perturbation theory remains quantitatively accurate . A linear fit that straddles t H returns a number that is neither slope. (D2) \\Gamma \\propto V ^2 across a tuned coupling. Not V ^2 inferred from a model, but V ^2 varied experimentally — barrier thickness in a tunnel junction, bridge length in donor–bridge–acceptor electron transfer, detuning-controlled hybridization in a double quantum dot . The quadratic law is the fingerprint of first order; any admixture of second-order (superexchange, Fermi's Golden Rule No. 1) or of a non-perturbative crossover shows up as curvature on a log–log plot. Note the trap: the exponential distance dependence \\Gamma \\propto e^{-\\beta R} celebrated in electron transfer is a statement about V(R) ^2, not evidence that the rate is golden-rule; it is consistent with any mechanism inheriting the same overlap factor. (D3) \\Gamma tracking an engineered \\rho(E) at fixed V . This is Purcell's construction : hold the emitter fixed, change the environment's mode density, and check that the rate follows. It is the cleanest test because \\rho is the one factor an experimentalist can vary by orders of magnitude without touching the system. It is valid only in the bad-cavity limit \\kappa \\gg g, where the mode still looks like a smooth bath across the width \\hbar/t; radio-frequency circuits and low-Q plasmonic or photonic-crystal environments qualify, while a \"Purcell factor\" quoted near g \\sim \\kappa is describing vacuum Rabi oscillation, not a rate [19, 20]. Figure: The survival/transfer probability across the three regimes. Both boundaries must be fixed by independent measurements (bath bandwidth, level spacing); the discriminating test differs at each edge. A rate exists only in the green segment, and only there is a fitted slope meaningful. Circumstantial evidence, routinely overread (C1) Single-exponential population decay. The most-cited \"proof\" is the weakest. Exponential decay is the Weisskopf–Wigner pole result , not the golden rule, which predicts unbounded linear growth; it is also produced by inhomogeneous ensemble averaging over a distribution of couplings, by classical rate processes with no quantum content, and — most commonly — by a fit window chosen to exclude both non-exponential edges. Discriminator: vary the observation window systematically and check that \\Gamma is invariant. A rate whose fitted value drifts with the start or end of the window is a slope, not a rate. This is the single cheapest test available and it is almost never reported. (C2) Lorentzian lineshape. A Lorentzian of FWHM \\hbar\\Gamma is the Fourier partner of C1 and inherits all its ambiguities, plus two more: pure dephasing produces a Lorentzian of width \\hbar/T 2 with no population transfer at all, and motional narrowing produces one from a fluctuating environment. Instrument response adds a third. Discriminator: measure T 1 and T 2 separately and test 1/T 2 = 1/(2T 1) + 1/T \\varphi. Only the T 1 channel is what the golden rule computes; 1/T \\varphi is a zero-frequency spectral density and is not a transition rate at all. In systems where both are accessible — spin qubits , superconducting circuits — this separation is standard and should be treated as mandatory before the phrase \"golden-rule rate\" is used. (C3) Arrhenius temperature dependence. \\Gamma \\propto e^{-E a/k BT} is equally the signature of classical barrier crossing and of Marcus-regime activation, where the exponential comes from the Franck–Condon-weighted density of states, E a = (\\lambda+\\Delta G)^2/4\\lambda [25, 26]. Discriminator: the inverted region. Marcus predicts \\Gamma decreasing as -\\Delta G exceeds \\lambda; classical kinetics does not. Observation of the inverted region is genuine evidence for the golden-rule structure of the rate; a plain Arrhenius slope is evidence for nothing in particular. (C4) A fitted rate from an ultrafast pump–probe trace. Here the energy-conserving \\delta has width \\hbar/t — a 20 fs pulse means a 30 meV-wide \\delta-function — and the trace frequently begins inside \\tau {\\rm corr}, where P \\propto t^2 . Discriminators: look for the quadratic short-time knee (its presence proves you are below the window; its absence at your resolution proves nothing), and check whether the extracted rate depends on pulse duration. Rates fitted in structured environments — phonon bottlenecks, sharply peaked spectral densities, polaron formation [21, 22] — are the most exposed, since a peaked \\rho makes \\Gamma large and collides the constraints t \\gg \\hbar/\\delta E and t \\ll 1/\\Gamma directly. (C5) Absence of a long-time tail. Khalfin's theorem guarantees a power-law crossover for any Hamiltonian bounded below , typically at \\sim 20–50 lifetimes and 10^{-10} of the initial population. Failure to see it is a dynamic-range statement about the detector, not a confirmation of exponential decay. Conversely, an observed tail is a direct demonstration that the constant rate has expired. The asymmetry across this list is the practical point: D1–D3 test the structure of the rate — its linearity, its V ^2 scaling, its \\rho dependence — while C1–C5 test only its numerical consequences , which several unrelated mechanisms reproduce. A paper reporting D1 with independently fixed edges has demonstrated a golden-rule rate. A paper reporting C1 has demonstrated an exponential. Use \u0026 Abuse: Rates Quoted Outside the Window in Which They Exist Use \u0026 Abuse: Rates Quoted Outside the Window in Which They Exist The failures catalogued below are not sloppiness. They are the predictable consequence of a formula that carries no validity certificate: \\Gamma = (2\\pi/\\hbar) V {fi} ^2\\rho(E f) can be evaluated whenever a matrix element and a density of states can be written down, and nothing in the act of evaluating it asks whether \\tau {\\rm corr} \\ll t \\ll \\min(t H,\\,\\Gamma^{-1}) is satisfiable. Each pattern below is a case where the formula was evaluated and the window was not. 1. Purcell factors quoted as g \\to \\kappa. Purcell's 1946 abstract is correct physics: a radio-frequency LC circuit has \\kappa enormous compared to g, the mode is a smooth bath across the width \\hbar/t, and F P = 3Q\\lambda^3/4\\pi^2 V is a legitimate golden-rule statement with an engineered \\rho. The abuse is the export of that number into cavity QED at g \\gtrsim \\kappa, where the emitter–field system has two polariton poles rather than one and the population undergoes vacuum Rabi oscillation. There is no rate to enhance; the decay is not exponential, and F P is a ratio of two things neither of which exists [19, 20]. Two further degradations are specific to nanophotonics. First, in dispersive absorbing media a normal-mode set does not exist, so the mode volume entering F P must be replaced by a complex quasinormal-mode norm — and three formally distinct normalizations are in circulation, differing by more than the effects being reported. Second, at a plasmonic resonance the LDOS is dominated by nonresonant coupling to higher multipoles, so a single-mode \\rho is not merely inaccurate but structurally wrong, and detuning does not produce a Lorentzian. In the deep-strong-coupling regime the effect reverses outright: emission is suppressed, not enhanced. 2. Hot-carrier, phonon-bottleneck, and polaron-formation rates. Here \\rho(E) is sharply peaked — an LO phonon at \\sim 15 meV in a halide perovskite , a polaron band in a strong-coupling photoemission model . Structure on scale \\delta E demands t \\gg \\hbar/\\delta E \\approx 45 fs, while the peak makes \\Gamma large and demands t \\ll \\Gamma^{-1}, which for sub-picosecond cooling is a few hundred fs. The window is under one decade wide, or empty. The tell is diagnostic and cheap: a fitted rate whose value depends on the fitting window . The literature supplies the confession directly — cooling curves at high carrier density are explicitly biphasic, with a Fröhlich-dominated phase I and a bottleneck-dominated phase II, each assigned its own \"cooling time\" by fitting an exponential over a chosen interval. Two exponentials fitted to two windows of one non-exponential trace are not two rates; they are the local logarithmic slopes of a function that has no constant slope. A prominent critique in the same field argues much of the reported bottleneck is artefact — which is what one expects when the observable is window-dependent. 3. \"Decoherence rate.\" Three inequivalent quantities travel under this name. The golden rule computes 1/T 1: a real transition between eigenstates of \\hat H 0, requiring bath spectral weight at the Bohr frequency . Pure dephasing 1/T \\varphi is S(\\omega \\to 0) — a zero-frequency noise power, involving no transition and no final-state density at E i — and it is not a golden-rule rate at all, however often it is computed by writing one down. Only 1/T 2 = 1/(2T 1) + 1/T \\varphi is what an interferometric measurement returns. Reaching a Lindblad or Bloch–Redfield generator with golden-rule coefficients additionally requires the secular approximation and Markovianity, i.e. Van Hove's \\lambda^2 t limit — and Redfield without secularization is not positivity-preserving, producing negative populations and non-Hermitian shifts. That is a statement about \\tau {\\rm corr} and about near-degenerate splittings, not about V . 4. Exponentials attributed to the wrong calculation. P f(t) = \\Gamma t is unbounded and linear. Every quoted \"golden-rule lifetime\" \\tau = 1/\\Gamma silently imports the Weisskopf–Wigner pole approximation , and then discards the other half of the same self-energy: the real level shift. Papers that report a linewidth from \\mathrm{Im}\\,\\Sigma while ignoring \\mathrm{Re}\\,\\Sigma have used half a resummation and credited it to a formula that performs neither. Khalfin and Misra–Sudarshan then bound the exponential at both ends. 5. Marcus-regime electron transfer. The 1992 Nobel lecture exported the rule wholesale into chemistry with \\rho replaced by a Franck–Condon-weighted density [25, 26]. The formula travelled; the window did not. Golden-rule validity here requires nonadiabaticity (H {AB} small compared to the reorganization scale) and solvent relaxation fast compared to \\Gamma^{-1}. When friction governs the kinetics one is in Zusman/Sumi–Marcus territory, where both classical theories fail even inside the golden-rule regime through neglected nuclear quantum effects, and instanton rate theory beyond the golden-rule limit is required. Large- \\Delta G inverted-regime rates are quoted furthest from where the derivation holds. 6. Normalization mismatch. Box-normalized, \\delta(E-E')-normalized, and \\delta^3(\\mathbf{k}-\\mathbf{k}')-normalized continua differ by factors of 2\\pi, V, and mk/\\hbar^2. Dirac's energy normalization removes \\rho from sight entirely [2, 3], which is why his expression does not resemble the textbook one. Roughly half of published factor-of-2\\pi discrepancies are bookkeeping between V {fi} ^2 and the state counting, not physics. The diagnostic questions Ask A hollow claim answers --- --- Does the fitted rate change if you shift the fit window? Yes — then it is a slope, not a rate What are \\tau {\\rm corr}=\\hbar/W and t H=\\hbar/\\Delta numerically, and is t between them? Never computed Is \\Gamma \\tau {\\rm corr} \\ll 1? \\rho is peaked, so no Exponential or oscillatory — was the trace fitted to both models? Only one was tried T 1, T \\varphi, or T 2? \"Decoherence\" Where is \\mathrm{Re}\\,\\Sigma? Dropped without comment How is \\rho normalized, and does the matrix element match? Unstated Zhang and Liu's exactly solvable model makes the sharpest point: the probability is piecewise linear, and the golden-rule window closes at t H while first-order perturbation theory remains accurate . A convergence check on \\lambda therefore certifies nothing about whether a rate exists. Sparse final-state manifolds with t H \u003c \\tau {\\rm corr} have no window at any coupling — and yet a number is always returned. Sources: Purcell/QNM normalization, Purcell factors for plasmon antennas, Purcell breakdown at deep strong coupling, biphasic carrier cooling, hot-phonon-bottleneck critique, Redfield→Lindblad positivity, strong-coupling inverted-regime rates, instanton rate theory beyond golden rule. Status: Canonical Formula, Mutated Meaning — and What AETHER Demands Status: Canonical Formula, Mutated Meaning — and What AETHER Demands The equation is not in question. \\Gamma {i\\to f} = (2\\pi/\\hbar) V {fi} ^2\\rho(E f) is correct, in the sense that it is the exact leading term of a controlled expansion in a well-defined double limit — Van Hove's \\lambda^2 t limit . Nothing in a century has dented it. What has drifted is everything around it: the name, which is a Chicago classroom label that ate four separate authorships [2, 3, 5, 6]; and the usage, which has migrated from \"the leading term of an expansion, valid in a window\" to \"the number you report.\" The field has bifurcated, and the fault line is disciplinary rather than intellectual. In mathematical physics and open-quantum-system theory the validity theory is not merely alive, it is the subject: the \\lambda^2 t limit is the standard hypothesis under which weak-coupling Lindblad generators are derived rather than assumed, Khalfin's Paley–Wiener no-go is textbook in decay theory, and Misra–Sudarshan's quadratic short-time regime is the operational basis of an entire Zeno/anti-Zeno literature. In spectroscopy, transport, and quantum-device engineering — the fields that actually quote golden-rule numbers — these five papers are close to invisible. A typical carrier-relaxation or nonradiative-decay paper cites Fermi (who did not derive it), sometimes Marcus [25, 26], and none of the works establishing that the quantity being reported exists. That invisibility is not innocuous, because the boundaries are experimentally real, not formal curiosities. Rothe, Hintschich and Monkman tracked luminescence in dissolved organics over more than twenty lifetimes and observed the turnover from exponential to algebraic decay, P(t)\\sim t^{-\\mu} with non-integral \\mu \\approx 2–4 — Khalfin's long-time wall, measured (PRL 96, 163601 (2006)). The upper wall is a laboratory fact with a fitted exponent, not a theorem awaiting relevance. Superseded versus stretched The distinction that matters now is between communities that have replaced the golden rule where it fails and communities that keep applying it past its window with cosmetic repairs. Properly superseded Merely stretched --- --- HEOM: numerically exact, non-perturbative, non-Markovian reduced dynamics; recovers golden-rule rates as a limit and shows where they stop existing (Tanimura, JCP 153, 020901) A structured \\rho(E) with a sharp peak inserted into the rule while t \\gg \\hbar/\\delta E and \\Gamma t \\ll 1 are mutually incompatible [21, 22] Reaction-coordinate mapping plus polaron transform: absorb the dominant collective mode into the system, so the residual bath is genuinely weak and Markovian, and the rule applies to a redefined partition (NJP 18, 073007) A \"Purcell factor\" quoted at g \\gtrsim \\kappa, where the dynamics is vacuum Rabi oscillation and no rate exists [19, 20] Generalized/quantum-corrected FGR expressions with explicit validity statements, catalogued in the Jang–Kim–Rhee perspective — the first review in this literature to treat the ambiguities as the subject rather than the fine print A fitted lifetime whose value depends on the fit window, reported without the window Sparse-manifold treatments descending from Bixon–Jortner , where the recurrence time is computed rather than assumed infinite \"Decoherence rate\" naming a golden-rule 1/T 1 while the measurement is T 2 The pattern is that supersession happens where the method changes hands — chemical physics and quantum thermodynamics have built machinery that makes the weak-coupling assumption honest by redefining what is weakly coupled. Stretching happens where the number is an intermediate quantity in a larger argument and nobody's career depends on it being a rate. What AETHER demands Of any manuscript quoting \\Gamma = (2\\pi/\\hbar) V {fi} ^2\\rho(E f), or any lifetime derived from it: 1. State the window numerically. Give \\tau {\\rm corr} = \\hbar/W from the bandwidth W over which V {fi} ^2\\rho(E) is smooth, and t H = \\hbar/\\Delta from the final-state spacing \\Delta, in physical units, alongside the observation time. If t H \\lesssim \\tau {\\rm corr}, no window exists at any coupling and the calculation should not be presented as a rate [14, 15]. 2. Show window-invariance of the fit. Report the extracted \\Gamma from at least two disjoint fitting intervals. A rate that moves with the window is a local slope, not a rate — this is the single cheapest diagnostic and the one most often omitted. 3. Declare the normalization of \\rho(E) — per unit energy per unit volume, box-normalized, \\delta(E-E')-normalized, or \\delta^3(\\mathbf k - \\mathbf k')-normalized — and demonstrate that the matrix element uses the same convention. Dirac's energy normalization hides \\rho entirely; most stray factors of 2\\pi, V, or mk/\\hbar^2 are this mismatch, not physics. 4. Justify no back-action explicitly if the bath is structured. A peaked spectral density means the bath remembers; asserting a Markovian rate then requires either an RC/polaron mapping or an exact method, not an assurance that the coupling is small. 5. Say what the quoted lifetime is. Golden-rule \\Gamma (a linear-in-t slope) or a Weisskopf–Wigner pole (an exponential) — and if the latter, where the real part of the self-energy went. A discarded level shift is a discarded observable, not a rounding error. 6. Separate 1/T 1 from 1/T \\varphi before writing \"decoherence rate.\" The golden rule computes population transfer; pure dephasing is a zero-frequency spectral density and is not a golden-rule transition rate. 1/T 2 = 1/(2T 1) + 1/T \\varphi is a definition, not a derivation. 7. Confirm g \\ll \\kappa before invoking a Purcell factor. Purcell's own case satisfies it by orders of magnitude; a high-Q nanophotonic cavity frequently does not. 8. Cite where the physics came from. Dirac for the derivation [2, 3], Wentzel for the first continuum application , Pauli for the master-equation step that transport calculations silently perform , Van Hove for the limit in which the rate exists . \"Fermi's golden rule\" may stand as the name; it should not stand as the citation. Sources: Tanimura, JCP 153, 020901 (2020) · Nazir–Schaller RC mapping, NJP 18, 073007 (2016) · Rothe, Hintschich \u0026 Monkman, PRL 96, 163601 (2006) · Jang, Kim \u0026 Rhee, JCP 164, 230901 (2026) The AETHER Verdict The AETHER Verdict I have spent this dossier arguing that a correct equation has been turned into an incorrect habit. Here is where I actually stand. (a) What I will defend with my reputation The formula is right and its derivation is closed. \\Gamma = (2\\pi/\\hbar) V {fi} ^2\\rho(E f) is the exact leading term of a controlled expansion, and the expansion parameter is not V — it is \\Gamma t. Dirac wrote it [2, 3]; Wentzel first applied it to a genuine continuum ; Fermi labelled it and cited Schiff for the derivation . There is no priority dispute here, only a pedagogical accident, and anyone who frames the naming as theft is manufacturing drama in a clean record. Van Hove's \\lambda^2 t limit is the correct statement of what \"the golden rule regime\" means , and it is a statement about the bath, not about the coupling. Every Markovian master equation with golden-rule coefficients inherits its validity from that limit and from nowhere else. Redfield, Lindblad, Marcus, Purcell in the bad-cavity limit — all downstream of a bath-correlation-time assumption that the coupling strength does not certify. Non-exponential decay is mandatory at both ends. Quadratic at short times , power-law at long times by Paley–Wiener for any spectrum bounded below . This is theorem, not curiosity. The golden-rule rate lives in an intermediate asymptotic bracketed by two regimes where it is provably wrong, and I will defend that framing against anyone who calls the deviations \"corrections.\" Weisskopf–Wigner is a different calculation from the golden rule . It resums, it produces a pole, and its pole has a real part. Quoting \\tau = 1/\\Gamma from a first-order calculation is importing a resummed result while silently discarding the level shift that came with it. (b) What is shakier than the literature admits Three assumptions, named. A-smooth: that V {fi} ^2\\rho(E) is smooth over \\hbar/t. Almost never checked. In molecular aggregates, phonon-bottleneck systems, and photonic-crystal band edges, \\rho has structure on the scale that sets \\Gamma itself, and the two conditions t \\gg \\hbar/\\delta E and t \\ll 1/\\Gamma collide . The observable tell is a fitted rate that moves when you move the fitting window. I see this constantly and it is almost never reported. A-window: that weak coupling implies a linear regime exists. It does not. The window is \\tau {\\rm corr} \\ll t \\ll t H with t H = \\hbar/\\Delta, and Zhang and Liu's exactly solvable model shows the probability is piecewise linear — the golden-rule slope fails at t H while first-order perturbation theory remains accurate. Perturbative validity and rate existence are independent conditions and the literature routinely conflates them into one. A-noback: that summing independent channels is free. It presumes no repopulation of i\\rangle and an occupation-independent \\rho. Few-mode environments violate the first (recurrences at t H); dense excitation violates the second (Pauli blocking). The golden rule is the linearization of the dynamics and is stated as though it were the dynamics. (c) The three open questions I would work on 1. An operational validity certificate. Given a measured \\rho(E) and pulse bandwidth, output the window [\\tau {\\rm corr}, \\min(t H, 1/\\Gamma)] and refuse to emit a rate when it is empty. Ranked first because it converts a conceptual objection into a check any experimentalist can run before publishing a number. 2. Structured-bath rates without a rate. What replaces \\Gamma when \\delta E \\sim \\hbar\\Gamma? Hierarchical-equation and polaron-transformed treatments give trajectories, not rates — the field needs a reportable scalar with a stated regime, or an honest admission that none exists. 3. The Khalfin crossover, actually measured. The long-time power-law tail has essentially never been resolved in a solid-state emitter. Ranked third only because it is hard, not because it is unimportant: it is the sharpest available falsification of the \"a rate exists\" assertion. Reading path: 1. Dirac 1927 — read the derivation before the label; the structure of the argument is visible before the mythology attaches. 2. Wentzel 1927 — the first genuine continuum application, and the reason the rule belongs to Auger physics as much as to radiation theory. 3. Weisskopf–Wigner 1930 — where the exponential actually comes from, and where the level shift you were told to ignore is sitting. 4. Van Hove 1955 — the \\lambda^2 t limit; the only place the Markov assumption is stated as a theorem rather than assumed. 5. Zhang–Liu — an exactly solvable model showing the window closing at t H with perturbation theory still intact; the cleanest demonstration that the two conditions are independent."}</script>

<script type="application/json" id="aether-data">{"slug": "the-tangent-mistaken-for-the-curve-fermis-golden-rule-and-it", "topic": "Fermi golden rule", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "The Tangent Mistaken for the Curve: Fermi's Golden Rule and Its Missing Validity Theory", "subtitle": "Dirac derived it, Wentzel used it, Pauli made it kinetic, Weisskopf–Wigner supplied the exponential everyone quotes — and Van Hove, Khalfin, Misra–Sudarshan and Bixon–Jortner wrote the conditions nobody checks.", "domain": "quantum mechanics / spectroscopy / condensed matter transport", "era": "Dirac 1927; Wentzel 1927 (Auger theory); named and canonized by Fermi ~1934–1950 lecture notes; universal by the 1960s", "why_big": "It is the single most-used equation in applied quantum mechanics: every transition rate, every linewidth, every scattering time, every absorption cross-section, every decay constant in nuclear, atomic, molecular, solid-state and particle physics is computed from Γ = (2π/ℏ)|⟨f|V|i⟩|²ρ(E_f). It converted quantum mechanics from a theory of stationary states into a theory of *rates*, and thereby underwrites Boltzmann-equation transport, the Weisskopf-Wigner theory of spontaneous emission, and essentially all of spectroscopy. Its structure — matrix element squared times density of final states — became the organizing intuition physicists use even when they are not computing anything.", "abuse": "The rule is an asymptotic result valid only in a window t_corr ≪ t ≪ 1/Γ (and only for a smooth, effectively continuous final-state density with no back-action), yet it is routinely applied to strongly coupled, structured-bath, non-Markovian, or few-mode environments where the linear-in-t regime never exists — Purcell/photonic-crystal engineering, cavity QED near strong coupling, hot-carrier and phonon-bottleneck relaxation, and open-quantum-system 'decoherence rates' are the usual offenders. The tell is a quoted rate extracted from a system whose own decay would be non-exponential (Zeno-like short-time, power-law long-time) if anyone bothered to look.", "date": "August 14, 2026", "ts": 1786756293.434119, "engine": "Claude Code CLI · default model", "aliases": ["Golden Rule No. 2 (Fermi's own name)", "Golden Rule No. 1 (Fermi's name for the second-order/superexchange version)", "Dirac's golden rule", "Fermi–Dirac golden rule", "Wentzel–Fermi golden rule (rare, mostly German-language)", "the golden rule of time-dependent perturbation theory", "the rate formula", "Fermi golden rule (FGR)", "Born–Fermi rate", "Weisskopf–Wigner decay rate (when resummed)"], "origin_story": "The golden rule entered physics as a *by-product* of the two problems that forced quantum mechanics to say something about time: how an atom radiates, and how a system with a continuum of final states makes an irreversible jump. Einstein [62] had already established in 1916–17 that atomic physics fundamentally traffics in *rates* (A and B coefficients) fixed only by thermodynamic consistency, not derived. Dirac supplied the derivation twice: in 1926 [63] he set up time-dependent perturbation theory for an atom in a radiation field, obtained |c_f(t)|² ∝ |V_{fi}|² sin²(ωt/2)/(ℏω/2)², recognized that summing over a continuum of final states with energy normalization converts the sinc² into 2πt δ(E_f−E_i), and recovered Einstein's B; in 1927 [64], having quantized the field, he applied the same machinery to spontaneous emission and obtained a rate linear in t with the structure |matrix element|² × (density of final states). Because Dirac used energy-normalized continuum states, ρ(E) is hidden inside his normalization and never appears as a separate factor — which is precisely why the formula did not acquire his name. Four months later Wentzel [65] used it for a genuinely non-radiative continuum — the ejection of an outer electron after a K-shell vacancy, i.e. the Auger–Meitner process
