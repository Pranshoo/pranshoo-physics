near*: the golden rule holds only up to the Heisenberg time ℏ/Δ even where first-order perturbation theory is still accurate — validity of the rule and validity of perturbation theory are separate conditions.", "who": "J. M. Zhang, Y. Liu", "work": "\"Fermi's golden rule: its derivation and breakdown by an ideal model\", Eur. J. Phys. 37, 065406", "kind": "revival", "ref": 15}], "neglected": [{"name": "P. A. M. Dirac", "role": "Derived the formula in full — twice, in 1926 and 1927 — including the sinc²→2πtδ(E) limit and the sum over continuum states. Fermi neither derived it nor claimed it; in the Chicago notes the derivation is explicitly delegated to Schiff. Dirac's use of energy-normalized continuum states hid ρ(E) inside the normalization, which is a large part of why the ρ-explicit form got attached to a later name.", "evidence": "Dirac's own papers: the transition-probability calculation is §5 of the 1926 paper and reappears with the quantized field in 1927; the 1930 Principles reproduces it as standard machinery.", "ref": 2}, {"name": "Gregor Wentzel", "role": "First person to *use* the rule as a rate-producing instrument on a real continuum problem — radiationless (Auger–Meitner) transitions — four months after Dirac's 1927 paper, obtaining absolute yields checked against experiment. Modern Auger-rate calculations in atomic and condensed-matter physics still run his 1927 template, and virtually never cite him.", "evidence": "\"Über strahlungslose Quantensprünge\", Z. Phys. 43, 524–530 (1927): the calculation of the L-electron ejection probability relative to Kα emission, compared to Auger's and Robinson's data.", "ref": 5}, {"name": "Wolfgang Pauli", "role": "Turned the golden-rule rate into a transport theory: the 1928 master equation is where the rule acquires the status it actually enjoys in practice (a collision integral in a Boltzmann equation), and where its indispensable assumption — repeated randomization of phases between events — is stated out loud. Every modern 'FGR scattering rate' in a transport calculation is Pauli's construction, credited to Fermi.", "evidence": "Sommerfeld Festschrift contribution, Probleme der modernen Physik (Leipzig, 1928), 30–45; the H-theorem derivation reproduced in modern historical analyses of the Pauli master equation.", "ref": 6}, {"name": "Léon Van Hove", "role": "Supplied the only mathematically honest statement of when a golden-rule rate exists at all — the λ²t scaling limit — and thereby the criterion (weak coupling *and* long time, taken together in a fixed ratio) that essentially no applied paper checks. Cited in mathematical physics, invisible in the spectroscopy and transport literature that depends on it.", "evidence": "Physica 21, 517–540 (1955), and the follow-up Physica 23 (1957); the limit is standard in rigorous open-quantum-system theory under his name.", "ref": 7}, {"name": "Leonid A. Khalfin", "role": "Proved, from the boundedness-below of the spectrum plus Paley–Wiener, that the constant decay rate cannot be exact at long times — the decay must cross over to a power law. His result sets the upper edge of the golden-rule window and is routinely ignored in quoted 'decay constants'. Published in Russian in 1957; reached the West only via the JETP translation.", "evidence": "ZhETF 33, 1371 (1957) / Sov. Phys. JETP 6, 1053 (1958).", "ref": 18}, {"name": "Victor Weisskopf and Eugene Wigner", "role": "Provided the exponential decay law and the Lorentzian lineshape that people *mean* when they quote a golden-rule lifetime, plus the real part of the self-energy (level shift) that the golden rule discards. The golden rule alone gives a probability growing linearly without bound; the exponential is theirs.", "evidence": "Z. Phys. 63, 54 (1930); Weisskopf's National Academy of Sciences Biographical Memoir describes this as the first and most important of his papers, treating exponential decay and natural linewidth for all transition types.", "ref": 9}], "conflations": [{"claim": "'Fermi's golden rule' names one formula.", "clarification": "It names Fermi's Golden Rule No. 2 [72] — first order, direct coupling. Golden Rule No. 1 is the second-order rate Γ = (2π/ℏ)|Σ_m V_{fm}V_{mi}/(E_i−E_m)|²ρ(E_f), used for scattering through virtual intermediates. It was rediscovered in chemical physics as the superexchange rate and in nuclear physics as second-order distorted-wave theory, with no awareness that Fermi ranked it *first* [81]."}, {"claim": "The golden rule gives exponential decay with lifetime τ = 1/Γ.", "clarification": "It gives P_f(t) = Γt, a probability growing without bound; it is the tangent of an exponential at the origin, not the exponential. The exponential requires the Weisskopf–Wigner resummation [67] (equivalently, a self-consistent Dyson/pole approximation). That resummation also produces a *real* self-energy — the Lamb-type level shift — which the golden rule throws away. Quoting a golden-rule Γ as a lifetime is borrowing a result from a calculation you did not do, and simultaneously discarding half of it."}, {"claim": "If |V| is small, the golden rule applies.", "clarification": "Two independent conditions must both hold, and weak coupling only buys one. (a) Perturbative accuracy: Γt ≪ 1. (b) Existence of a linear regime at all: τ_corr ≪ t ≪ t_H, where τ_corr = ℏ/W is set by the bandwidth W over which |V_fi|²ρ(E) is smooth, and t_H = ℏ/Δ is the Heisenberg time set by the final-state level spacing Δ. Zhang and Liu's exactly solvable model [80] shows the probability is *piecewise linear*: past t_H the rule fails while first-order perturbation theory is still perfectly accurate. A discrete or sparse final-state manifold has t_H \u003c τ_corr and no golden-rule window exists at any coupling strength [75]."}, {"claim": "ρ(E_f) is the density of final states.", "clarification": "Of *what*, normalized *how*? Box-normalized vs. δ(E−E')-normalized vs. δ³(k−k')-normalized continua differ by factors of 2π, V, and m k/ℏ². Dirac's energy normalization [64] makes ρ disappear entirely — which is why his form does not look like the textbook form. Roughly half the factor-of-2π errors in the literature are normalization mismatches between the matrix element and the state counting, not physics errors."}, {"claim": "The energy-conserving δ(E_f − E_i) is exact.", "clarification": "It is the t→∞ limit of (2/π)·sin²(ΔEt/2ℏ)/(ΔE²t/ℏ), of width ℏ/t. Energy is conserved only to within ℏ/t at observation time t. Every 'off-shell' contribution people worry about in ultrafast spectroscopy, hot-carrier relaxation, and finite-lifetime intermediate states is a statement that the sinc² has not yet collapsed. If your pulse is 20 fs, your δ-function is 30 meV wide."}, {"claim": "The Purcell effect / photonic-crystal emission control is 'the golden rule with a modified density of states'.", "clarification": "Only in the bad-cavity (weak-coupling) limit, where the cavity linewidth κ exceeds both the coupling g and the emitter linewidth, so the mode still looks like a smooth bath over the width ℏ/t. As g→κ the correct object is the Jaynes–Cummings vacuum Rabi splitting: the dynamics is oscillatory, not exponential, and no rate exists [22, 29]. Purcell's own 1946 abstract [70] is legitimate — radio-frequency circuits are deep in the bad-cavity limit. Modern quotations of 'Purcell factor' near strong coupling are not."}, {"claim": "'Decoherence rate' extracted from a golden-rule calculation.", "clarification": "Three distinct objects get called this: (i) the population relaxation rate 1/T₁, which is what the golden rule computes; (ii) the pure dephasing rate 1/T_φ, which is a zero-frequency bath spectral density and is *not* a golden-rule transition rate; (iii) 1/T₂ = 1/(2T₁) + 1/T_φ. Getting a Lindblad/Bloch–Redfield structure with golden-rule coefficients additionally requires the secular approximation and the Markov assumption — i.e. Van Hove's λ²t limit [73] — which is a statement about bath correlation time, not about the size of the matrix element."}, {"claim": "A structured bath (phonon bottleneck, single dominant mode, sharply peaked spectral density) just means 'use the structured ρ(E) in the golden rule'.", "clarification": "If ρ(E) has structure on scale δE, the rule requires t ≫ ℏ/δE, but perturbative validity requires t ≪ 1/Γ; a sharply peaked ρ makes Γ large and the two constraints collide. This is exactly where hot-carrier relaxation, phonon-bottleneck, and polaron-formation rates are quoted, and exactly where the underlying dynamics is coherent and non-exponential [35, 57]. The tell is a fitted 'rate' whose value depends on the fitting window."}, {"claim": "Marcus theory *is* the golden rule.", "clarification": "Marcus's high-temperature expression is the golden rule with ρ replaced by a thermally averaged Franck–Condon factor, then evaluated in the classical (short-time steepest-descent) limit [24, 78]. The quantum-mode/nuclear-tunneling corrections and the inverted region are precisely where that classical evaluation of the golden-rule integral fails while the golden rule itself may still hold. Conflating the two makes the inverted region look like a failure of perturbation theory rather than of a saddle-point approximation."}, {"claim": "Non-exponential decay is an exotic curiosity.", "clarification": "It is mandatory. Short-time: P_surv = 1 − (ΔH t/ℏ)² is quadratic for t ≲ τ_Zeno, so measurement-limited or bandwidth-limited processes have no rate [76]. Long-time: any spectrum bounded below forces a crossover to power law by Paley–Wiener [74]. The golden-rule rate lives entirely in the intermediate asymptotic between two regimes where it is provably wrong. Quoted rates in systems whose decay was never actually resolved in time are assertions that this window exists, not measurements that it does."}, {"claim": "The golden rule and the Born approximation are the same statement.", "clarification": "The first Born approximation is a statement about the *amplitude* (f ∝ ⟨k'|V|k⟩); the golden rule is a statement about the *rate* obtained by squaring it and counting states. They coincide at first order but diverge immediately: unitarity/optical-theorem corrections, distorted waves, and multiple scattering enter the amplitude, while phase-space and back-action corrections enter the rate. Systems where the total golden-rule rate exceeds the unitarity bound (a common outcome in resonant scattering) are failures of the *amplitude* approximation, not of state counting."}, {"claim": "Applying the golden rule to each final state independently and summing is always legitimate.", "clarification": "It requires no back-action — the final-state manifold must not repopulate the initial state, and the initial state's occupation must be quasi-static. In few-mode environments the excitation returns (recurrences at t_H), and in dense-excitation regimes Pauli blocking of the final states makes ρ occupation-dependent. Both convert a linear rate equation into a nonlinear one; the golden rule is the linearization, and it is stated as if it were the dynamics."}], "sections": [{"id": "vacancy-and-its-filling", "title": "The Vacancy Einstein Left: How Quantum Mechanics Acquired Rates", "markdown": "## The Vacancy Einstein Left: How Quantum Mechanics Acquired Rates\n\nEinstein's 1917 paper is remembered for stimulated emission [1]. Its more consequential move was structural. Einstein posited three coefficients — $A_{mn}$, $B_{mn}$, $B_{nm}$ — and let detailed balance against the Planck distribution fix only their *ratios*:\n\n$$\\frac{A_{mn}}{B_{mn}} = \\frac{8\\pi h\\nu^3}{c^3}, \\qquad g_m B_{mn} = g_n B_{nm}.$$\n\nNothing in the argument fixes a magnitude. Worse, the very existence of the coefficients is an assumption: Einstein wrote the spontaneous term in explicit analogy with the Rutherford–Soddy law of radioactive decay, i.e. he *assumed* that an atom in state $m$ possesses a constant probability per unit time of jumping to $n$, independent of how long it has been sitting there. Exponential decay is thereby an input, not an output. This is the vacancy: by 1917 quantum theory had rates before it had any dynamics capable of producing them, and it had them in a form — memoryless, time-homogeneous, constant $\\Gamma$ — that no Hamiltonian evolution can literally supply.\n\nDirac filled it in 1926 [2]. Splitting $H = H_0 + V$ and expanding the coefficients $a_n(t)$ of the unperturbed states to first order gives, for a transition to a state $f$ at energy detuning $\\Delta E = E_f - E_i$,\n\n$$|a_f^{(1)}(t)|^2 = |V_{fi}|^2\\,\\frac{4\\sin^2(\\Delta E\\, t/2\\hbar)}{\\Delta E^2}.$$\n\nThis is quadratic in $t$ at the origin and oscillatory thereafter — no rate anywhere in it. The rate appears only after summation over a continuum of final states, where the bracketed kernel, of width $\\sim\\hbar/t$ and unit-normalized weight, acts as a nascent delta function,\n\n$$\\frac{4\\sin^2(\\Delta E\\,t/2\\hbar)}{\\Delta E^2} \\;\\longrightarrow\\; \\frac{2\\pi t}{\\hbar}\\,\\delta(\\Delta E),$$\n\nso that $P_f(t) = (2\\pi/\\hbar)|V_{fi}|^2\\rho(E_f)\\,t$. Dirac carried this through explicitly and used it to *derive* Einstein's $B$ coefficient from a matrix element. In 1927, with the radiation field itself quantized, he obtained $A$ as well [3], and both coefficients ceased to be phenomenological constants. Every structural element of the modern formula is present in these two papers; the reason Dirac's expressions do not *look* like the textbook one is that he used energy-normalized continuum states, which absorb $\\rho(E)$ into the normalization and make it invisible. The same machinery is reproduced as routine apparatus in the 1930 *Principles* [4].\n\nWithin months of the 1927 paper, Wentzel turned the rule on a continuum that had nothing to do with radiation [5]. An atom ionized in the K shell can eject an L electron instead of emitting a K$\\alpha$ photon; the final state — bound hole plus free electron — is a genuine continuum reached by the residual electron–electron interaction. Wentzel computed the absolute probability and compared the ratio of ejected electrons to K$\\alpha$ quanta against the counts of Auger and of Robinson. This is the first use of the rule as a predictive instrument rather than a consistency check on Einstein, and every modern Auger–Meitner rate calculation — atomic, molecular, or condensed-phase — is still running his template.\n\nPauli, in the 1928 Sommerfeld Festschrift, changed the rule's status entirely [6]. He took Dirac's $W_{fi}$ as the kernel of a kinetic equation for the diagonal density-matrix elements,\n\n$$\\dot{P}_n = \\sum_m \\left( W_{nm}P_m - W_{mn}P_n \\right),$$\n\nand proved an H-theorem for it. The step is not free: it requires that the off-diagonal coherences be re-randomized *at every instant*, an assumption imposed repeatedly on the dynamics rather than derived from it. Van Hove's later achievement was precisely to show that this repeated randomization could be replaced by a scaling limit [7]. Every \"FGR scattering rate\" appearing as a collision integral in a Boltzmann or Redfield equation is Pauli's construction, not Dirac's — and is universally credited to Fermi.\n\nIn 1930 Weisskopf and Wigner supplied what people actually mean when they quote a golden-rule lifetime [8]. First-order theory gives $P(t)=\\Gamma t$, a probability growing without bound. Resumming the series self-consistently converts the pole structure into $|a_i(t)|^2 = e^{-\\Gamma t}$ with a Lorentzian lineshape — and, unavoidably, a *real* self-energy $\\Delta$ shifting the level, which the golden rule discards. Weisskopf's Academy memoir treats this as the first and most important of his papers [9]. Fermi's own contribution came in 1934: in the $\\beta$-decay theory he set $\\rho(E)$ equal to the lepton phase space and obtained not a number but an entire observable — the spectral shape, and with it the Kurie plot [10].\n\nThe naming is a classroom accident. Schiff's 1949 textbook gave the derivation its standard pedagogical form [11]; Fermi's Chicago course notes, published in 1950, label the first-order expression \"Golden Rule No. 2\" (p. 142) and cite Schiff for the derivation [12]. Fermi neither derived the formula nor claimed it, and \"No. 2\" implies a \"No. 1\" — the second-order, virtual-intermediate-state rate — which survives in chemical physics as superexchange with no memory of its ranking [13].\n\nSo the credit problem is not priority theft. It is that a single label swallowed four distinct acts: Dirac's derivation, Wentzel's first continuum application, Pauli's promotion to kinetics, and Weisskopf–Wigner's resummation. Textbooks retain the first and the last (the latter usually misattributed to the rule itself). Wentzel and Pauli have vanished — and with Pauli went the explicit statement that using the rule as a rate requires a non-quantum assumption nobody now writes down.\n\nSources: [Zeitschrift für Physik 43, 524 (Wentzel 1927)](https://link.springer.com/article/10.1007/BF01397631), [Fermi's golden rule (Wikipedia)](https://en.wikipedia.org/wiki/Fermi's_golden_rule), [Pauli master equation and the van Hove limit](https://www.nature.com/articles/srep29942)"}, {"id": "derivation-with-numbered-assumptions", "title": "The Physics, Properly: From Amplitude to Rate, with Every Assumption Numbered", "markdown": "## The Physics, Properly: From Amplitude to Rate, with Every Assumption Numbered\n\nTake $\\hat H = \\hat H_0 + \\lambda \\hat V$, with $\\hat H_0|n\\rangle = E_n|n\\rangle$, and the system prepared in $|i\\rangle$ at $t=0$. In the interaction picture the Dyson series for the amplitude into $|f\\rangle \\neq |i\\rangle$ reads\n\n$$c_f(t) = -\\frac{i\\lambda}{\\hbar}\\int_0^t\\!dt'\\, V_{fi}\\,e^{i\\omega_{fi}t'} \\;+\\; \\left(\\frac{-i\\lambda}{\\hbar}\\right)^{2}\\sum_m \\int_0^t\\!dt'\\!\\int_0^{t'}\\!\\!dt''\\, V_{fm}V_{mi}\\,e^{i\\omega_{fm}t'}e^{i\\omega_{mi}t''} \\;+\\;\\cdots$$\n\n**(A1)** Truncate at first order. This is the statement $\\Gamma t \\ll 1$ — the total transferred probability must stay small — *not* the statement that $\\lambda$ is small. **(A2)** The lower limit $t'=0$ is a sharp switch-on: the state is prepared instantaneously, with no correlation to the bath and no memory of how it was made. Both are physical claims, not bookkeeping.\n\nThe first-order integral gives the object everything else is built on:\n\n$$|c_f(t)|^2 = \\frac{\\lambda^2|V_{fi}|^2}{\\hbar^2}\\, t^2\\,\\mathrm{sinc}^2\\!\\left(\\frac{\\omega_{fi}t}{2}\\right), \\qquad \\mathrm{sinc}(x)\\equiv \\frac{\\sin x}{x}.$$\n\nThis is a *quadratic*, not linear, function of $t$ for a single final state. There is no rate here. A rate appears only when the sinc² is summed over a manifold of final states — and how that sum is written is where the literature's factor-of-$2\\pi$ disease lives.\n\n### Two derivations, one statement\n\n**Dirac's form (energy-normalized continuum) [2, 3].** Label continuum states $|E,\\alpha\\rangle$ with $\\langle E,\\alpha|E',\\alpha'\\rangle = \\delta(E-E')\\delta_{\\alpha\\alpha'}$. Then the summation measure is $\\int\\! dE$ with unit weight, and\n\n$$P(t) = \\int\\! dE\\,\\frac{\\lambda^2|V_{E\\alpha,i}|^2}{\\hbar^2}\\,t^2\\,\\mathrm{sinc}^2\\!\\left(\\frac{(E-E_i)t}{2\\hbar}\\right) \\xrightarrow{\\ \\text{A3, A4}\\ } \\frac{2\\pi}{\\hbar}\\lambda^2\\,|V_{E_i\\alpha,i}|^2\\, t,$$\n\nusing $\\lim_{t\\to\\infty}\\frac{t}{2\\pi\\hbar}\\,\\mathrm{sinc}^2\\!\\left(\\frac{\\Delta E\\,t}{2\\hbar}\\right) = \\delta(\\Delta E)$. **There is no $\\rho$.** It was absorbed into the normalization of $|E,\\alpha\\rangle$. This is precisely why Dirac's expressions do not resemble the textbook formula, and a large part of why the $\\rho$-explicit form ended up attached to a later name.\n\n**The textbook form (box normalization) [11].** Label states $|k\\rangle$ discretely, $\\langle k|k'\\rangle=\\delta_{kk'}$, in a box of volume $\\mathcal V$. Now the measure carries the state counting: $\\sum_k \\to \\int\\! dE\\,\\rho(E)$, and\n\n$$\\Gamma_{i\\to f} = \\frac{2\\pi}{\\hbar}\\lambda^2\\left|\\langle f|\\hat V|i\\rangle\\right|^2\\rho(E_f).$$\n\nThe dictionary is exact: $|E,\\alpha\\rangle = \\rho(E)^{1/2}|k(E),\\alpha\\rangle$, so $|V_{E\\alpha,i}|^2 = \\rho(E)\\,|V_{fi}|^2$. **The two forms are the same equation with the density of states parked in different places.** The practical corollary: $\\rho$ and $V_{fi}$ are not independently meaningful — only the product $|V_{fi}|^2\\rho$ is. A calculation that takes $\\rho$ from one convention ($\\delta^3(\\mathbf k-\\mathbf k')$, per spin, per unit volume, per unit energy…) and $V_{fi}$ from another is not making a physics error; it is making a units error that looks like physics. Most reported factor-of-$2\\pi$ discrepancies are this.\n\n### The window\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eThe golden-rule window in time\u003c/title\u003e\u003cline x1=\"60\" y1=\"330\" x2=\"690\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"690,330 680,325 680,335\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"660\" y=\"358\" fill=\"#e8e6e1\" font-size=\"16\"\u003et\u003c/text\u003e\u003cline x1=\"60\" y1=\"330\" x2=\"60\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"18\" y=\"70\" fill=\"#e8e6e1\" font-size=\"15\"\u003eP(t)\u003c/text\u003e\u003cpath d=\"M60 330 Q 110 326 150 310\" stroke=\"#ff7a90\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cline x1=\"150\" y1=\"310\" x2=\"470\" y2=\"150\" stroke=\"#7ee0a3\" stroke-width=\"3\"/\u003e\u003cpath d=\"M470 150 Q 540 118 600 130 T 680 105\" stroke=\"#ffb86b\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cline x1=\"150\" y1=\"60\" x2=\"150\" y2=\"345\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/\u003e\u003cline x1=\"470\" y1=\"60\" x2=\"470\" y2=\"345\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/\u003e\u003ctext x=\"80\" y=\"378\" fill=\"#ff7a90\" font-size=\"15\"\u003eZeno: P ∝ t²\u003c/text\u003e\u003ctext x=\"255\" y=\"378\" fill=\"#7ee0a3\" font-size=\"15\"\u003egolden rule: P = Γt\u003c/text\u003e\u003ctext x=\"500\" y=\"378\" fill=\"#ffb86b\" font-size=\"15\"\u003erecurrence / power law\u003c/text\u003e\u003ctext x=\"96\" y=\"52\" fill=\"#e8e6e1\" font-size=\"15\"\u003et = τ_corr = ℏ/W\u003c/text\u003e\u003ctext x=\"392\" y=\"52\" fill=\"#e8e6e1\" font-size=\"15\"\u003et = min(t_H, 1/Γ)\u003c/text\u003e\u003ctext x=\"86\" y=\"248\" fill=\"#ff7a90\" font-size=\"14\"\u003eA4 fails\u003c/text\u003e\u003ctext x=\"86\" y=\"268\" fill=\"#ff7a90\" font-size=\"14\"\u003ebelow here\u003c/text\u003e\u003ctext x=\"520\" y=\"250\" fill=\"#ffb86b\" font-size=\"14\"\u003eA1 or A3 fails\u003c/text\u003e\u003ctext x=\"520\" y=\"270\" fill=\"#ffb86b\" font-size=\"14\"\u003eabove here\u003c/text\u003e\u003ctext x=\"230\" y=\"205\" fill=\"#7ee0a3\" font-size=\"14\"\u003eslope = Γ = (2π/ℏ)|V_fi|²ρ\u003c/text\u003e\u003ctext x=\"150\" y=\"118\" fill=\"#e8e6e1\" font-size=\"14\"\u003et_H = ℏ/Δ (level spacing Δ)\u003c/text\u003e\u003ctext x=\"150\" y=\"140\" fill=\"#e8e6e1\" font-size=\"14\"\u003eτ_corr = ℏ/W (bandwidth W)\u003c/text\u003e\u003ctext x=\"150\" y=\"96\" fill=\"#e8e6e1\" font-size=\"14\"\u003ewindow exists only if τ_corr ≪ min(t_H, 1/Γ)\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: the survival/transfer probability has three regimes. The golden rule is the straight segment; it is the tangent, and it exists only between two walls whose separation is set by bath bandwidth and final-state level spacing, not by coupling strength.*\n\nThe $\\delta$-function step above hides four more assumptions. **(A3)** The final-state manifold must be effectively continuous on the scale $\\hbar/t$: with level spacing $\\Delta$, this requires $t \\ll t_H = \\hbar/\\Delta$, the Heisenberg time. Past $t_H$ the sum over discrete levels rephases and the probability stops growing — Bixon and Jortner's sparse vibronic quasi-continuum [14], and Zhang and Liu's exactly solvable uniformly-spaced model, where the transfer probability is demonstrably *piecewise linear* and the rule dies at $t_H$ while first-order perturbation theory is still quantitatively accurate [15]. **(A4)** $|V_{fi}|^2\\rho(E)$ must be smooth over the bandwidth $W$ that the sinc² samples, defining a bath correlation time $\\tau_{\\rm corr} = \\hbar/W$; for $t \\lesssim \\tau_{\\rm corr}$ the sinc² has not collapsed, $P \\propto t^2$, and no rate exists — the Zeno wall [16]. **(A5)** Amplitude that leaves $|i\\rangle$ never returns: no depletion feedback, no repopulation. Irreversibility is imposed, not derived. **(A6)** When $\\Gamma$ is used as a collision integral in a transport equation, phases are re-randomized between events — Pauli's *Stosszahlansatz*, an assumption external to the Schrödinger dynamics and the reason every \"FGR scattering rate\" in a Boltzmann code is Pauli's construction rather than Fermi's [6]. **(A7)** The rule keeps only $\\mathrm{Im}\\,\\Sigma$; the real part of the self-energy, the level shift that Weisskopf–Wigner retain alongside the width, is silently discarded [8]. **(A8)** All of the above collapse to one inequality: $\\tau_{\\rm corr} \\ll t \\ll \\min(t_H,\\,1/\\Gamma)$. If that chain is empty — sparse final states, sharply structured $\\rho$, large $\\Gamma$ — no golden-rule rate exists at *any* coupling strength.\n\n### Where A1–A8 are simultaneously legitimate\n\nOnly one limit is known to satisfy all eight in a controlled way: Van Hove's $\\lambda^2 t$ scaling limit, $\\lambda \\to 0$ and $t \\to \\infty$ with $\\lambda^2 t$ held fixed, for a system with infinitely many degrees of freedom [7]. The order of limits does the work: $t\\to\\infty$ enforces A3 and A4 (both walls recede), $\\lambda\\to0$ enforces A1 and A5, and the fixed product keeps $\\Gamma t$ finite so the answer is nontrivial. The Markovian master equation with golden-rule coefficients — and, with the secular approximation added, the Lindblad form — is a *theorem* in this limit and a hope outside it. Van Hove is the only paper in this lineage that states when the rule is true; he is also the one essentially never cited by the spectroscopy and transport literature that depends on him.\n\n### No. 2, and the No. 1 nobody remembers\n\nThe second-order term of the Dyson series above, evaluated with the same A3–A4 machinery, gives\n\n$$\\Gamma^{(2)}_{i\\to f} = \\frac{2\\pi}{\\hbar}\\left|\\sum_m \\frac{V_{fm}V_{mi}}{E_i - E_m}\\right|^{2}\\rho(E_f),$$\n\nvalid when $V_{fi}$ vanishes or is small and the intermediates $|m\\rangle$ are energetically remote (so the denominators never go on-shell). In the Chicago notes this is **Golden Rule No. 1**; the first-order expression is **No. 2** [12]. Only No. 2 survived the name. No. 1 was rediscovered independently as the superexchange rate in chemical physics and as second-order distorted-wave theory in nuclear physics, with no awareness that Fermi ranked it first [13]. The numbering matters practically: No. 1 has an additional failure mode No. 2 does not — when an intermediate approaches resonance, $E_i - E_m \\to 0$, the perturbative denominator diverges and the correct treatment is sequential population of $|m\\rangle$ with its own golden-rule window, not a coherent second-order rate."}, {"id": "where-each-assumption-dies", "title": "The Window and Its Two Walls: What Breaks When A1–A8 Fail", "markdown": "## The Window and Its Two Walls: What Breaks When A1–A8 Fail\n\nThe golden rule is not a formula with a small correction term. It is a formula that exists inside a window in time, and outside that window it does not merely lose accuracy — it loses referent. There is no rate. What follows walks the assumptions in the order they break in practice.\n\n### A3/A4 — \"the final states form a continuum,\" and \"$|V_{fi}|^2\\rho(E)$ is smooth\"\n\nThese are the assumptions that fail first and are checked least. The continuum enters through two timescales, and only two:\n\n$$\\tau_{\\rm corr} = \\frac{\\hbar}{W}, \\qquad t_H = \\frac{\\hbar}{\\Delta},$$\n\nwith $W$ the bandwidth over which $|V_{fi}|^2\\rho(E)$ is smooth and $\\Delta$ the mean spacing of the final-state manifold. The sinc$^2$ kernel of width $\\hbar/t$ must be narrow enough to sample the envelope ($t \\gg \\tau_{\\rm corr}$) and wide enough to still blur individual levels ($t \\ll t_H$). The golden-rule window is the intersection:\n\n$$\\tau_{\\rm corr} \\ll t \\ll t_H \\quad\\Longleftrightarrow\\quad \\Delta \\ll \\hbar/t \\ll W.$$\n\nWritten that way the failure mode is obvious and it is *structural*, not perturbative: if $\\Delta \\gtrsim W$ — a sparse manifold, or a smooth one that is simply not dense enough — then $t_H \\lesssim \\tau_{\\rm corr}$, the interval is empty, and **no golden-rule rate exists at any coupling strength**. Making $\\lambda$ smaller does not help; it only makes the (nonexistent) rate smaller. This is Bixon and Jortner's result for intramolecular radiationless transitions [14]: a vibronic quasi-continuum with finite level spacing gives irreversible-looking decay only over an intermediate window, and past the recurrence time the population comes back. Their \"statistical limit\" versus \"intermediate case\" distinction is precisely the statement $\\Delta \\ll W$ versus $\\Delta \\sim W$, and it is the distinction that gets discarded whenever someone writes down a single internal-conversion rate for a molecule with a dozen accepting modes.\n\nZhang and Liu made this exactly solvable and thereby unarguable [15]. Take a discrete state coupled uniformly with strength $v$ to a ladder of levels spaced by $\\Delta$, extending symmetrically to $\\pm\\infty$. The survival probability is computable in closed form, and $P_{i\\to f}(t)$ is **piecewise linear**: it rises with slope $\\Gamma = 2\\pi v^2/(\\hbar\\Delta)$ up to $t_H = \\hbar/\\Delta$ (in the conventional $2\\pi\\hbar/\\Delta$ normalization, the recurrence period), and then flattens, reverses, and recurs. The essential point is what is *not* wrong at $t_H$: first-order perturbation theory is still excellent there, since $\\Gamma t_H = 2\\pi v^2/\\Delta^2 \\ll 1$ whenever $v \\ll \\Delta$. So the two conditions\n\n- (a) perturbative accuracy, $\\Gamma t \\ll 1$,\n- (b) existence of a linear-in-$t$ regime, $\\tau_{\\rm corr}\\ll t \\ll t_H$,\n\nare **logically independent**. \"The coupling is weak, so the golden rule applies\" is a non sequitur. Weak coupling buys (a) and says nothing about (b).\n\nThe operational version: any fitted rate whose value drifts with the fitting window is reporting the slope of a curve that is not a line. A \"rate\" extracted from 0–2 ps and a \"rate\" extracted from 0–20 ps that differ by 40% is not experimental scatter; it is the announcement that $t_H$ lies inside your data.\n\n### A8, lower wall — the Zeno regime\n\nFor $t \\lesssim \\tau_{\\rm corr}$ the survival probability is quadratic, not linear:\n\n$$P_{\\rm surv}(t) = 1 - \\frac{\\langle \\Delta H^2\\rangle}{\\hbar^2}t^2 + \\mathcal{O}(t^4), \\qquad \\langle \\Delta H^2\\rangle = \\langle i|\\hat H^2|i\\rangle - \\langle i|\\hat H|i\\rangle^2,$$\n\nwhich follows from nothing more than the analyticity of $\\langle i|e^{-i\\hat Ht/\\hbar}|i\\rangle$ at $t=0$ for a state in the domain of $\\hat H$. Misra and Sudarshan turned this into the formal statement that continuously-monitored decay is suppressed entirely [17]: the derivative $dP/dt$ vanishes at $t=0$, so there is no rate to speak of below $\\tau_{\\rm corr}$, and repeated projection at intervals $\\ll \\tau_{\\rm corr}$ freezes the system. Note the divergence: $\\langle\\Delta H^2\\rangle = \\int dE\\,(E-\\bar E)^2\\,|V|^2\\rho(E)$ requires a normalizable second moment, i.e. a bath with a genuine cutoff. The Zeno time is set by the bandwidth, not the coupling — another quantity absent from the golden-rule formula itself.\n\nThe same wall shows up as an energy resolution. The kernel\n\n$$\\frac{2}{\\pi}\\frac{\\sin^2(\\Delta E\\,t/2\\hbar)}{(\\Delta E)^2 t/\\hbar} \\xrightarrow{t\\to\\infty} \\delta(\\Delta E)$$\n\nhas FWHM $\\approx 4\\hbar/t$ (and $2\\pi\\hbar/t$ between first zeros). **A 20 fs pulse gives an energy-conserving $\\delta$-function roughly 30 meV wide** ($2\\pi\\hbar/20\\,\\text{fs} \\approx 0.2$ eV between zeros; $\\hbar/t \\approx 33$ meV as the characteristic scale). Every \"off-shell\" worry in ultrafast spectroscopy, hot-carrier relaxation, and finite-lifetime intermediate states is this sinc$^2$ failing to have collapsed. At 100 fs you have ~7 meV of slack — comparable to a phonon energy. Energy conservation in a golden-rule calculation is a statement about the observation time, not about the Hamiltonian.\n\n### A8, upper wall — Khalfin\n\nThe long-time end is a theorem, not an approximation. If $\\hat H$ is bounded below — which it is, for any physical system — then the survival amplitude\n\n$$a(t) = \\int_{E_{\\min}}^{\\infty} dE\\, \\omega(E)\\, e^{-iEt/\\hbar}$$\n\nis the Fourier transform of a function supported on a half-line, hence a Hardy-class function in the lower half plane. The Paley–Wiener theorem then requires $\\int dt\\,\\bigl|\\ln|a(t)|\\bigr|/(1+t^2) \u003c \\infty$, which $|a(t)|^2 = e^{-\\Gamma t}$ violates. Exponential decay at *all* times is therefore incompatible with a spectrum bounded below [18]. Decay must cross over to a power law, typically $P_{\\rm surv}\\sim t^{-p}$ with $p$ fixed by the threshold behaviour of $\\omega(E)$ near $E_{\\min}$ (e.g. $\\omega \\sim (E-E_{\\min})^{1/2}$ gives $t^{-3}$). The crossover sits near $t \\sim (\\Gamma/\\,E_{\\rm res})\\cdot\\tau$ with an exponentially small residual amplitude — typically tens of lifetimes, which is why it took until 2006 to see it in organic-molecule luminescence (verify) — but the logical point stands independently of the observability: $\\tau = 1/\\Gamma$ is an approximation with a built-in expiry date at both ends, and the \"decay constant\" quoted in a table is the middle segment of a three-segment curve.\n\n### A5/A7 — no back-action, and the pole you threw away\n\nA5 (the initial state is not depleted, and the final states do not feed back) and A7 (only the imaginary part of the self-energy matters) fail together. The honest object is the pole of the resolvent,\n\n$$E_{\\rm pole} = E_i + \\Sigma(E_{\\rm pole}), \\qquad \\Sigma(E) = \\Delta(E) - \\tfrac{i}{2}\\hbar\\Gamma(E),$$\n\n$$\\Delta(E) = \\mathcal{P}\\!\\!\\int dE'\\,\\frac{|V(E')|^2\\rho(E')}{E-E'}, \\qquad \\hbar\\Gamma(E) = 2\\pi|V(E)|^2\\rho(E).$$\n\nThe golden rule is $\\hbar\\Gamma$ evaluated at $E=E_i$ — the imaginary part, on-shell, to lowest order. Weisskopf–Wigner is the resummation that turns $P(t)=\\Gamma t$ into $e^{-\\Gamma t}$ [8], and it hands you $\\Delta(E_i)$ in the same breath: the Lamb-type level shift. Quoting $\\Gamma$ as a lifetime is borrowing the resummed result while discarding half of it. The discarded half is not always small — $\\Delta$ and $\\Gamma$ are Kramers–Kronig partners, so wherever $\\rho(E)$ has structure on scale $\\delta E$, $\\Delta$ has a dispersive feature of comparable magnitude right where $\\Gamma$ has its peak. The pole also drifts: $E_{\\rm pole}\\neq E_i$ means $\\Gamma$ should be evaluated self-consistently at the shifted energy, which matters exactly when $\\rho$ varies over the linewidth — i.e. exactly when people reach for \"the structured density of states.\"\n\n### The collision\n\nStructured baths are where all of this comes due at once. Suppose $\\rho(E)$ has a feature of width $\\delta E$ — a cavity mode, an optical-phonon peak, a polaronic resonance. Resolving it demands $t \\gg \\hbar/\\delta E$. Perturbative validity demands $t \\ll 1/\\Gamma$. Both hold only if\n\n$$\\hbar\\Gamma \\ll \\delta E.$$\n\nBut $\\Gamma\\propto\\rho_{\\rm peak}$, and sharpening a feature at fixed oscillator strength *raises* $\\rho_{\\rm peak}$ roughly as $1/\\delta E$. So the left side grows as the right side shrinks: the constraints collide, and they collide precisely at the point where the structure was supposed to make the physics interesting. Past the crossing point the dynamics is coherent and oscillatory — vacuum Rabi splitting in the cavity case, where $g \\gtrsim \\kappa$ and no rate exists at all [19, 20]. This is the regime where phonon-bottleneck rates, hot-carrier cooling rates, and polaron-formation rates are routinely quoted [21, 22]. The diagnostic remains the same as for A3/A4: if the extracted $\\Gamma$ depends on the fitting window, you have measured the curvature of something that is not exponential and reported it as a rate.\n\nEverything above is a condition on *time*, and none of it is visible in $\\Gamma = (2\\pi/\\hbar)|V_{fi}|^2\\rho(E_f)$ — a formula with no $t$ in it, obtained by taking $t\\to\\infty$ in a quantity that was linear in $t$. Van Hove's $\\lambda^2 t$ limit [7] is the only construction that makes the two limits commute, and it does so by taking $\\lambda\\to 0$ and $t\\to\\infty$ *together* at fixed $\\lambda^2 t$ — a scaling statement, not an inequality on $|V|$. That is the condition the applied literature does not check, because the formula it uses has been stripped of the variable in which the condition is expressed."}, {"id": "signatures-direct-and-circumstantial", "title": "Signatures: What Actually Proves a Golden-Rule Rate Exists", "markdown": "## Signatures: What Actually Proves a Golden-Rule Rate Exists\n\nA rate is not an observable. What experiments deliver is a population trace, a lineshape, or a temperature series, and each of these is compatible with several distinct dynamical origins, only one of which is a golden-rule rate. The distinction matters because the golden rule is a claim about a *window* — $\\tau_{\\rm corr} \\ll t \\ll t_H$, with $\\Gamma t \\ll 1$ — and the standard evidence base is precisely the class of measurements that is blind to window edges.\n\n### Direct evidence\n\n**(D1) Linear-in-$t$ transition probability inside independently bounded edges.** The golden rule's actual content is $P_f(t) = \\Gamma t$, so the only unambiguous signature is a measured $P_f$ linear in $t$ over a range whose two ends were fixed *before* the fit: $\\tau_{\\rm corr} = \\hbar/W$ from the measured bandwidth $W$ over which $|V_{fi}|^2\\rho(E)$ is smooth, and $t_H = \\hbar/\\Delta$ from the final-state level spacing. Both must come from independent spectroscopy, not from the decay trace itself. Zhang and Liu's solvable model makes the point sharply: the transition probability is *piecewise* linear, with the golden-rule slope holding only to $t_H$, after which the slope changes while first-order perturbation theory remains quantitatively accurate [15]. A linear fit that straddles $t_H$ returns a number that is neither slope.\n\n**(D2) $\\Gamma \\propto |V|^2$ across a *tuned* coupling.** Not $|V|^2$ inferred from a model, but $|V|^2$ varied experimentally — barrier thickness in a tunnel junction, bridge length in donor–bridge–acceptor electron transfer, detuning-controlled hybridization in a double quantum dot [23]. The quadratic law is the fingerprint of first order; any admixture of second-order (superexchange, Fermi's Golden Rule No. 1) or of a non-perturbative crossover shows up as curvature on a log–log plot. Note the trap: the exponential distance dependence $\\Gamma \\propto e^{-\\beta R}$ celebrated in electron transfer is a statement about $|V(R)|^2$, not evidence that the rate is golden-rule; it is consistent with any mechanism inheriting the same overlap factor.\n\n**(D3) $\\Gamma$ tracking an engineered $\\rho(E)$ at fixed $|V|$.** This is Purcell's construction [24]: hold the emitter fixed, change the environment's mode density, and check that the rate follows. It is the cleanest test because $\\rho$ is the one factor an experimentalist can vary by orders of magnitude without touching the system. It is valid only in the bad-cavity limit $\\kappa \\gg g$, where the mode still looks like a smooth bath across the width $\\hbar/t$; radio-frequency circuits [24] and low-$Q$ plasmonic or photonic-crystal environments qualify, while a \"Purcell factor\" quoted near $g \\sim \\kappa$ is describing vacuum Rabi oscillation, not a rate [19, 20].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eGolden-rule window and the signatures at each boundary\u003c/title\u003e\u003cline x1=\"70\" y1=\"330\" x2=\"690\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"640\" y=\"358\" fill=\"#e8e6e1\" font-size=\"16\"\u003elog t\u003c/text\u003e\u003cline x1=\"70\" y1=\"60\" x2=\"70\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"18\" y=\"60\" fill=\"#e8e6e1\" font-size=\"15\"\u003eP(t)\u003c/text\u003e\u003cline x1=\"200\" y1=\"60\" x2=\"200\" y2=\"340\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"150\" y=\"50\" fill=\"#ffb86b\" font-size=\"15\"\u003et ~ τ_corr\u003c/text\u003e\u003cline x1=\"500\" y1=\"60\" x2=\"500\" y2=\"340\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"452\" y=\"50\" fill=\"#ffb86b\" font-size=\"15\"\u003et ~ t_H = ℏ/Δ\u003c/text\u003e\u003ctext x=\"272\" y=\"50\" fill=\"#7ee0a3\" font-size=\"16\"\u003eGOLDEN-RULE WINDOW\u003c/text\u003e\u003cpath d=\"M70 330 Q140 322 200 292\" stroke=\"#7aa2ff\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M200 292 L500 150\" stroke=\"#7ee0a3\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cpath d=\"M500 150 Q560 128 600 145 Q640 165 690 140\" stroke=\"#ff7a90\" stroke-width=\"3\" fill=\"none\"/\u003e\u003ctext x=\"88\" y=\"290\" fill=\"#7aa2ff\" font-size=\"15\"\u003eP ∝ t²\u003c/text\u003e\u003ctext x=\"88\" y=\"310\" fill=\"#7aa2ff\" font-size=\"14\"\u003e(Zeno)\u003c/text\u003e\u003ctext x=\"300\" y=\"205\" fill=\"#7ee0a3\" font-size=\"15\"\u003eP = Γt\u003c/text\u003e\u003ctext x=\"540\" y=\"205\" fill=\"#ff7a90\" font-size=\"15\"\u003erecurrence /\u003c/text\u003e\u003ctext x=\"540\" y=\"225\" fill=\"#ff7a90\" font-size=\"15\"\u003epower-law tail\u003c/text\u003e\u003ctext x=\"88\" y=\"392\" fill=\"#7aa2ff\" font-size=\"14\"\u003eD-test: quadratic knee\u003c/text\u003e\u003ctext x=\"290\" y=\"392\" fill=\"#7ee0a3\" font-size=\"14\"\u003eD-test: rate invariant to window\u003c/text\u003e\u003ctext x=\"540\" y=\"392\" fill=\"#ff7a90\" font-size=\"14\"\u003eD-test: tail search\u003c/text\u003e\u003ctext x=\"200\" y=\"118\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eset by bath\u003c/text\u003e\u003ctext x=\"200\" y=\"136\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ebandwidth W\u003c/text\u003e\u003ctext x=\"500\" y=\"118\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eset by level\u003c/text\u003e\u003ctext x=\"500\" y=\"136\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003espacing Δ\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The survival/transfer probability across the three regimes. Both boundaries must be fixed by independent measurements (bath bandwidth, level spacing); the discriminating test differs at each edge. A rate exists only in the green segment, and only there is a fitted slope meaningful.*\n\n### Circumstantial evidence, routinely overread\n\n**(C1) Single-exponential population decay.** The most-cited \"proof\" is the weakest. Exponential decay is the Weisskopf–Wigner pole result [8], not the golden rule, which predicts unbounded linear growth; it is also produced by inhomogeneous ensemble averaging over a distribution of couplings, by classical rate processes with no quantum content, and — most commonly — by a fit window chosen to exclude both non-exponential edges. *Discriminator:* vary the observation window systematically and check that $\\Gamma$ is invariant. A rate whose fitted value drifts with the start or end of the window is a slope, not a rate. This is the single cheapest test available and it is almost never reported.\n\n**(C2) Lorentzian lineshape.** A Lorentzian of FWHM $\\hbar\\Gamma$ is the Fourier partner of C1 and inherits all its ambiguities, plus two more: pure dephasing produces a Lorentzian of width $\\hbar/T_2$ with no population transfer at all, and motional narrowing produces one from a fluctuating environment. Instrument response adds a third. *Discriminator:* measure $T_1$ and $T_2$ separately and test $1/T_2 = 1/(2T_1) + 1/T_\\varphi$. Only the $T_1$ channel is what the golden rule computes; $1/T_\\varphi$ is a zero-frequency spectral density and is not a transition rate at all. In systems where both are accessible — spin qubits [23], superconducting circuits [20] — this separation is standard and should be treated as mandatory before the phrase \"golden-rule rate\" is used.\n\n**(C3) Arrhenius temperature dependence.** $\\Gamma \\propto e^{-E_a/k_BT}$ is equally the signature of classical barrier crossing and of Marcus-regime activation, where the exponential comes from the Franck–Condon-weighted density of states, $E_a = (\\lambda+\\Delta G)^2/4\\lambda$ [25, 26]. *Discriminator:* the inverted region. Marcus predicts $\\Gamma$ *decreasing* as $-\\Delta G$ exceeds $\\lambda$; classical kinetics does not. Observation of the inverted region is genuine evidence for the golden-rule structure of the rate; a plain Arrhenius slope is evidence for nothing in particular.\n\n**(C4) A fitted rate from an ultrafast pump–probe trace.** Here the energy-conserving $\\delta$ has width $\\hbar/t$ — a 20 fs pulse means a 30 meV-wide $\\delta$-function — and the trace frequently begins *inside* $\\tau_{\\rm corr}$, where $P \\propto t^2$ [17]. *Discriminators:* look for the quadratic short-time knee (its presence proves you are below the window; its absence at your resolution proves nothing), and check whether the extracted rate depends on pulse duration. Rates fitted in structured environments — phonon bottlenecks, sharply peaked spectral densities, polaron formation [21, 22] — are the most exposed, since a peaked $\\rho$ makes $\\Gamma$ large and collides the constraints $t \\gg \\hbar/\\delta E$ and $t \\ll 1/\\Gamma$ directly.\n\n**(C5) Absence of a long-time tail.** Khalfin's theorem guarantees a power-law crossover for any Hamiltonian bounded below [18], typically at $\\sim 20$–$50$ lifetimes and $10^{-10}$ of the initial population. Failure to see it is a dynamic-range statement about the detector, not a confirmation of exponential decay. Conversely, an observed tail is a direct demonstration that the constant rate has expired.\n\nThe asymmetry across this list is the practical point: D1–D3 test the *structure* of the rate — its linearity, its $|V|^2$ scaling, its $\\rho$ dependence — while C1–C5 test only its *numerical consequences*, which several unrelated mechanisms reproduce. A paper reporting D1 with independently fixed edges has demonstrated a golden-rule rate. A paper reporting C1 has demonstrated an exponential."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: Rates Quoted Outside the Window in Which They Exist", "markdown": "## Use \u0026 Abuse: Rates Quoted Outside the Window in Which They Exist\n\nThe failures catalogued below are not sloppiness. They are the predictable consequence of a formula that carries no validity certificate: $\\Gamma = (2\\pi/\\hbar)|V_{fi}|^2\\rho(E_f)$ can be evaluated whenever a matrix element and a density of states can be written down, and nothing in the act of evaluating it asks whether $\\tau_{\\rm corr} \\ll t \\ll \\min(t_H,\\,\\Gamma^{-1})$ is satisfiable. Each pattern below is a case where the formula was evaluated and the window was not.\n\n**1. Purcell factors quoted as $g \\to \\kappa$.** Purcell's 1946 abstract [24] is correct physics: a radio-frequency LC circuit has $\\kappa$ enormous compared to $g$, the mode is a smooth bath across the width $\\hbar/t$, and $F_P = 3Q\\lambda^3/4\\pi^2 V$ is a legitimate golden-rule statement with an engineered $\\rho$. The abuse is the export of that number into cavity QED at $g \\gtrsim \\kappa$, where the emitter–field system has two polariton poles rather than one and the population undergoes vacuum Rabi oscillation. There is no rate to enhance; the decay is not exponential, and $F_P$ is a ratio of two things neither of which exists [19, 20]. Two further degradations are specific to nanophotonics. First, in dispersive absorbing media a normal-mode set does not exist, so the mode volume entering $F_P$ must be replaced by a complex quasinormal-mode norm — and [three formally distinct normalizations are in circulation](https://arxiv.org/abs/1501.05938), differing by more than the effects being reported. Second, at a plasmonic resonance the LDOS is [dominated by nonresonant coupling to higher multipoles](https://arxiv.org/pdf/1007.1074), so a single-mode $\\rho$ is not merely inaccurate but structurally wrong, and detuning does not produce a Lorentzian. In the deep-strong-coupling regime the effect [reverses outright](https://arxiv.org/pdf/1308.2812): emission is suppressed, not enhanced.\n\n**2. Hot-carrier, phonon-bottleneck, and polaron-formation rates.** Here $\\rho(E)$ is sharply peaked — an LO phonon at $\\sim 15$ meV in a halide perovskite [21], a polaron band in a strong-coupling photoemission model [22]. Structure on scale $\\delta E$ demands $t \\gg \\hbar/\\delta E \\approx 45$ fs, while the peak makes $\\Gamma$ large and demands $t \\ll \\Gamma^{-1}$, which for sub-picosecond cooling is a few hundred fs. The window is under one decade wide, or empty. The tell is diagnostic and cheap: **a fitted rate whose value depends on the fitting window**. The literature supplies the confession directly — cooling curves at high carrier density are [explicitly biphasic](https://pubs.acs.org/doi/10.1021/acs.jpclett.5c04071), with a Fröhlich-dominated phase I and a bottleneck-dominated phase II, each assigned its own \"cooling time\" by fitting an exponential over a chosen interval. Two exponentials fitted to two windows of one non-exponential trace are not two rates; they are the local logarithmic slopes of a function that has no constant slope. A [prominent critique in the same field](https://pubs.acs.org/doi/10.1021/acsenergylett.6c01471) argues much of the reported bottleneck is artefact — which is what one expects when the observable is window-dependent.\n\n**3. \"Decoherence rate.\"** Three inequivalent quantities travel under this name. The golden rule computes $1/T_1$: a real transition between eigenstates of $\\hat H_0$, requiring bath spectral weight *at the Bohr frequency*. Pure dephasing $1/T_\\varphi$ is $S(\\omega \\to 0)$ — a zero-frequency noise power, involving no transition and no final-state density at $E_i$ — and it is not a golden-rule rate at all, however often it is computed by writing one down. Only $1/T_2 = 1/(2T_1) + 1/T_\\varphi$ is what an interferometric measurement returns. Reaching a Lindblad or Bloch–Redfield generator with golden-rule coefficients additionally requires the secular approximation and Markovianity, i.e. Van Hove's $\\lambda^2 t$ limit [7] — and Redfield without secularization [is not positivity-preserving](https://link.aps.org/doi/10.1103/PhysRevA.109.062225), producing negative populations and non-Hermitian shifts. That is a statement about $\\tau_{\\rm corr}$ and about near-degenerate splittings, not about $|V|$.\n\n**4. Exponentials attributed to the wrong calculation.** $P_f(t) = \\Gamma t$ is unbounded and linear. Every quoted \"golden-rule lifetime\" $\\tau = 1/\\Gamma$ silently imports the Weisskopf–Wigner pole approximation [8], and then discards the other half of the same self-energy: the real level shift. Papers that report a linewidth from $\\mathrm{Im}\\,\\Sigma$ while ignoring $\\mathrm{Re}\\,\\Sigma$ have used half a resummation and credited it to a formula that performs neither. Khalfin [18] and Misra–Sudarshan [17] then bound the exponential at both ends.\n\n**5. Marcus-regime electron transfer.** The 1992 Nobel lecture exported the rule wholesale into chemistry with $\\rho$ replaced by a Franck–Condon-weighted density [25, 26]. The formula travelled; the window did not. Golden-rule validity here requires nonadiabaticity ($H_{AB}$ small compared to the reorganization scale) *and* solvent relaxation fast compared to $\\Gamma^{-1}$. When friction governs the kinetics one is in Zusman/Sumi–Marcus territory, where [both classical theories fail even inside the golden-rule regime](https://arxiv.org/pdf/2407.01323) through neglected nuclear quantum effects, and [instanton rate theory beyond the golden-rule limit](https://pubs.aip.org/aip/jcp/article/156/17/174115/2841178/Nonadiabatic-instanton-rate-theory-beyond-the) is required. Large-$|\\Delta G|$ inverted-regime rates are quoted furthest from where the derivation holds.\n\n**6. Normalization mismatch.** Box-normalized, $\\delta(E-E')$-normalized, and $\\delta^3(\\mathbf{k}-\\mathbf{k}')$-normalized continua differ by factors of $2\\pi$, $V$, and $mk/\\hbar^2$. Dirac's energy normalization removes $\\rho$ from sight entirely [2, 3], which is why his expression does not resemble the textbook one. Roughly half of published factor-of-$2\\pi$ discrepancies are bookkeeping between $|V_{fi}|^2$ and the state counting, not physics.\n\n### The diagnostic questions\n\n| Ask | A hollow claim answers |\n|---|---|\n| Does the fitted rate change if you shift the fit window? | Yes — then it is a slope, not a rate |\n| What are $\\tau_{\\rm corr}=\\hbar/W$ and $t_H=\\hbar/\\Delta$ numerically, and is $t$ between them? | Never computed |\n| Is $\\Gamma \\tau_{\\rm corr} \\ll 1$? | $\\rho$ is peaked, so no |\n| Exponential or oscillatory — was the trace fitted to both models? | Only one was tried |\n| $T_1$, $T_\\varphi$, or $T_2$? | \"Decoherence\" |\n| Where is $\\mathrm{Re}\\,\\Sigma$? | Dropped without comment |\n| How is $\\rho$ normalized, and does the matrix element match? | Unstated |\n\nZhang and Liu's exactly solvable model [15] makes the sharpest point: the probability is piecewise linear, and the golden-rule window closes at $t_H$ **while first-order perturbation theory remains accurate**. A convergence check on $\\lambda$ therefore certifies nothing about whether a rate exists. Sparse final-state manifolds with $t_H \u003c \\tau_{\\rm corr}$ have no window at any coupling [14] — and yet a number is always returned.\n\nSources: [Purcell/QNM normalization](https://arxiv.org/abs/1501.05938), [Purcell factors for plasmon antennas](https://arxiv.org/pdf/1007.1074), [Purcell breakdown at deep strong coupling](https://arxiv.org/pdf/1308.2812), [biphasic carrier cooling](https://pubs.acs.org/doi/10.1021/acs.jpclett.5c04071), [hot-phonon-bottleneck critique](https://pubs.acs.org/doi/10.1021/acsenergylett.6c01471), [Redfield→Lindblad positivity](https://link.aps.org/doi/10.1103/PhysRevA.109.062225), [strong-coupling inverted-regime rates](https://arxiv.org/pdf/2407.01323), [instanton rate theory beyond golden rule](https://pubs.aip.org/aip/jcp/article/156/17/174115/2841178/Nonadiabatic-instanton-rate-theory-beyond-the)."}, {"id": "status-and-checklist", "title": "Status: Canonical Formula, Mutated Meaning — and What AETHER Demands", "markdown": "## Status: Canonical Formula, Mutated Meaning — and What AETHER Demands\n\nThe equation is not in question. $\\Gamma_{i\\to f} = (2\\pi/\\hbar)|V_{fi}|^2\\rho(E_f)$ is correct, in the sense that it is the exact leading term of a controlled expansion in a well-defined double limit — Van Hove's $\\lambda^2 t$ limit [7]. Nothing in a century has dented it. What has drifted is everything around it: the name, which is a Chicago classroom label [12] that ate four separate authorships [2, 3, 5, 6]; and the usage, which has migrated from \"the leading term of an expansion, valid in a window\" to \"the number you report.\"\n\nThe field has bifurcated, and the fault line is disciplinary rather than intellectual. In mathematical physics and open-quantum-system theory the validity theory is not merely alive, it is the subject: the $\\lambda^2 t$ limit is the standard hypothesis under which weak-coupling Lindblad generators are *derived* rather than assumed, Khalfin's Paley–Wiener no-go [18] is textbook in decay theory, and Misra–Sudarshan's quadratic short-time regime [17] is the operational basis of an entire Zeno/anti-Zeno literature. In spectroscopy, transport, and quantum-device engineering — the fields that actually *quote* golden-rule numbers — these five papers are close to invisible. A typical carrier-relaxation or nonradiative-decay paper cites Fermi (who did not derive it), sometimes Marcus [25, 26], and none of the works establishing that the quantity being reported exists.\n\nThat invisibility is not innocuous, because the boundaries are experimentally real, not formal curiosities. Rothe, Hintschich and Monkman tracked luminescence in dissolved organics over more than twenty lifetimes and observed the turnover from exponential to algebraic decay, $P(t)\\sim t^{-\\mu}$ with non-integral $\\mu \\approx 2$–$4$ — Khalfin's long-time wall, measured ([PRL 96, 163601 (2006)](https://link.aps.org/doi/10.1103/PhysRevLett.96.163601)). The upper wall is a laboratory fact with a fitted exponent, not a theorem awaiting relevance.\n\n### Superseded versus stretched\n\nThe distinction that matters now is between communities that have *replaced* the golden rule where it fails and communities that keep applying it past its window with cosmetic repairs.\n\n| Properly superseded | Merely stretched |\n|---|---|\n| HEOM: numerically exact, non-perturbative, non-Markovian reduced dynamics; recovers golden-rule rates as a limit and shows where they stop existing ([Tanimura, JCP 153, 020901](https://pubs.aip.org/aip/jcp/article/153/2/020901/76291/Numerically-exact-approach-to-open-quantum)) | A structured $\\rho(E)$ with a sharp peak inserted into the rule while $t \\gg \\hbar/\\delta E$ and $\\Gamma t \\ll 1$ are mutually incompatible [21, 22] |\n| Reaction-coordinate mapping plus polaron transform: absorb the dominant collective mode into the system, so the *residual* bath is genuinely weak and Markovian, and the rule applies to a redefined partition ([NJP 18, 073007](https://iopscience.iop.org/article/10.1088/1367-2630/18/7/073007)) | A \"Purcell factor\" quoted at $g \\gtrsim \\kappa$, where the dynamics is vacuum Rabi oscillation and no rate exists [19, 20] |\n| Generalized/quantum-corrected FGR expressions with explicit validity statements, catalogued in the Jang–Kim–Rhee perspective [13] — the first review in this literature to treat the ambiguities as the subject rather than the fine print | A fitted lifetime whose value depends on the fit window, reported without the window |\n| Sparse-manifold treatments descending from Bixon–Jortner [14], where the recurrence time is computed rather than assumed infinite | \"Decoherence rate\" naming a golden-rule $1/T_1$ while the measurement is $T_2$ |\n\nThe pattern is that supersession happens where the *method* changes hands — chemical physics and quantum thermodynamics have built machinery that makes the weak-coupling assumption honest by redefining what is weakly coupled. Stretching happens where the number is an intermediate quantity in a larger argument and nobody's career depends on it being a rate.\n\n### What AETHER demands\n\nOf any manuscript quoting $\\Gamma = (2\\pi/\\hbar)|V_{fi}|^2\\rho(E_f)$, or any lifetime derived from it:\n\n1. **State the window numerically.** Give $\\tau_{\\rm corr} = \\hbar/W$ from the bandwidth $W$ over which $|V_{fi}|^2\\rho(E)$ is smooth, and $t_H = \\hbar/\\Delta$ from the final-state spacing $\\Delta$, in physical units, alongside the observation time. If $t_H \\lesssim \\tau_{\\rm corr}$, no window exists at any coupling and the calculation should not be presented as a rate [14, 15].\n2. **Show window-invariance of the fit.** Report the extracted $\\Gamma$ from at least two disjoint fitting intervals. A rate that moves with the window is a local slope, not a rate — this is the single cheapest diagnostic and the one most often omitted.\n3. **Declare the normalization of $\\rho(E)$** — per unit energy per unit volume, box-normalized, $\\delta(E-E')$-normalized, or $\\delta^3(\\mathbf k - \\mathbf k')$-normalized — and demonstrate that the matrix element uses the *same* convention. Dirac's energy normalization [3] hides $\\rho$ entirely; most stray factors of $2\\pi$, $V$, or $mk/\\hbar^2$ are this mismatch, not physics.\n4. **Justify no back-action explicitly if the bath is structured.** A peaked spectral density means the bath remembers; asserting a Markovian rate then requires either an RC/polaron mapping or an exact method, not an assurance that the coupling is small.\n5. **Say what the quoted lifetime is.** Golden-rule $\\Gamma$ (a linear-in-$t$ slope) or a Weisskopf–Wigner pole (an exponential) [8] — and if the latter, where the real part of the self-energy went. A discarded level shift is a discarded observable, not a rounding error.\n6. **Separate $1/T_1$ from $1/T_\\varphi$ before writing \"decoherence rate.\"** The golden rule computes population transfer; pure dephasing is a zero-frequency spectral density and is not a golden-rule transition rate. $1/T_2 = 1/(2T_1) + 1/T_\\varphi$ is a definition, not a derivation.\n7. **Confirm $g \\ll \\kappa$ before invoking a Purcell factor.** Purcell's own case [24] satisfies it by orders of magnitude; a high-$Q$ nanophotonic cavity frequently does not.\n8. **Cite where the physics came from.** Dirac for the derivation [2, 3], Wentzel for the first continuum application [5], Pauli for the master-equation step that transport calculations silently perform [6], Van Hove for the limit in which the rate exists [7]. \"Fermi's golden rule\" may stand as the name; it should not stand as the citation.\n\nSources: [Tanimura, JCP 153, 020901 (2020)](https://pubs.aip.org/aip/jcp/article/153/2/020901/76291/Numerically-exact-approach-to-open-quantum) · [Nazir–Schaller RC mapping, NJP 18, 073007 (2016)](https://iopscience.iop.org/article/10.1088/1367-2630/18/7/073007) · [Rothe, Hintschich \u0026 Monkman, PRL 96, 163601 (2006)](https://link.aps.org/doi/10.1103/PhysRevLett.96.163601) · [Jang, Kim \u0026 Rhee, JCP 164, 230901 (2026)](https://pubs.aip.org/aip/jcp/article/164/23/230901/3394739/Perspective-of-Fermi-s-golden-rule-and-its)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier arguing that a correct equation has been turned into an incorrect habit. Here is where I actually stand.\n\n### (a) What I will defend with my reputation\n\n**The formula is right and its derivation is closed.** $\\Gamma = (2\\pi/\\hbar)|V_{fi}|^2\\rho(E_f)$ is the exact leading term of a controlled expansion, and the expansion parameter is not $|V|$ — it is $\\Gamma t$. Dirac wrote it [2, 3]; Wentzel first applied it to a genuine continuum [5]; Fermi labelled it and cited Schiff for the derivation [12]. There is no priority dispute here, only a pedagogical accident, and anyone who frames the naming as theft is manufacturing drama in a clean record.\n\n**Van Hove's $\\lambda^2 t$ limit [7] is the correct statement of what \"the golden rule regime\" means**, and it is a statement about the bath, not about the coupling. Every Markovian master equation with golden-rule coefficients inherits its validity from that limit and from nowhere else. Redfield, Lindblad, Marcus, Purcell in the bad-cavity limit [24] — all downstream of a bath-correlation-time assumption that the coupling strength does not certify.\n\n**Non-exponential decay is mandatory at both ends.** Quadratic at short times [16], power-law at long times by Paley–Wiener for any spectrum bounded below [18]. This is theorem, not curiosity. The golden-rule rate lives in an intermediate asymptotic bracketed by two regimes where it is provably wrong, and I will defend that framing against anyone who calls the deviations \"corrections.\"\n\n**Weisskopf–Wigner is a different calculation from the golden rule** [8]. It resums, it produces a pole, and its pole has a *real* part. Quoting $\\tau = 1/\\Gamma$ from a first-order calculation is importing a resummed result while silently discarding the level shift that came with it.\n\n### (b) What is shakier than the literature admits\n\nThree assumptions, named.\n\n**A-smooth: that $|V_{fi}|^2\\rho(E)$ is smooth over $\\hbar/t$.** Almost never checked. In molecular aggregates, phonon-bottleneck systems, and photonic-crystal band edges, $\\rho$ has structure on the scale that sets $\\Gamma$ itself, and the two conditions $t \\gg \\hbar/\\delta E$ and $t \\ll 1/\\Gamma$ collide [14]. The observable tell is a fitted rate that moves when you move the fitting window. I see this constantly and it is almost never reported.\n\n**A-window: that weak coupling implies a linear regime exists.** It does not. The window is $\\tau_{\\rm corr} \\ll t \\ll t_H$ with $t_H = \\hbar/\\Delta$, and Zhang and Liu's exactly solvable model [15] shows the probability is *piecewise linear* — the golden-rule slope fails at $t_H$ while first-order perturbation theory remains accurate. Perturbative validity and rate existence are independent conditions and the literature routinely conflates them into one.\n\n**A-noback: that summing independent channels is free.** It presumes no repopulation of $|i\\rangle$ and an occupation-independent $\\rho$. Few-mode environments violate the first (recurrences at $t_H$); dense excitation violates the second (Pauli blocking). The golden rule is the linearization of the dynamics and is stated as though it were the dynamics.\n\n### (c) The three open questions I would work on\n\n1. **An operational validity certificate.** Given a measured $\\rho(E)$ and pulse bandwidth, output the window $[\\tau_{\\rm corr}, \\min(t_H, 1/\\Gamma)]$ and refuse to emit a rate when it is empty. Ranked first because it converts a conceptual objection into a check any experimentalist can run before publishing a number.\n\n2. **Structured-bath rates without a rate.** What replaces $\\Gamma$ when $\\delta E \\sim \\hbar\\Gamma$? Hierarchical-equation and polaron-transformed treatments give trajectories, not rates — the field needs a *reportable scalar* with a stated regime, or an honest admission that none exists.\n\n3. **The Khalfin crossover, actually measured.** The long-time power-law tail has essentially never been resolved in a solid-state emitter. Ranked third only because it is hard, not because it is unimportant: it is the sharpest available falsification of the \"a rate exists\" assertion.\n\n**Reading path:**\n\n1. Dirac 1927 [2] — read the derivation before the label; the structure of the argument is visible before the mythology attaches.\n2. Wentzel 1927 [5] — the first genuine continuum application, and the reason the rule belongs to Auger physics as much as to radiation theory.\n3. Weisskopf–Wigner 1930 [8] — where the exponential actually comes from, and where the level shift you were told to ignore is sitting.\n4. Van Hove 1955 [7] — the $\\lambda^2 t$ limit; the only place the Markov assumption is stated as a theorem rather than assumed.\n5. Zhang–Liu [15] — an exactly solvable model showing the window closing at $t_H$ with perturbation theory still intact; the cleanest demonstration that the two conditions are independent."}], "references": [{"n": 1, "title": "Zur Quantentheorie der Strahlung", "authors": ["Albert Einstein"], "year": 1917, "venue": "Physikalische Zeitschrift 18, 121–128 (also Mitteilungen der Physikalischen Gesellschaft Zürich 18, 1916)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "On the Theory of Quantum Mechanics", "authors": ["P. A. M. Dirac"], "year": 1926, "venue": "Proceedings of the Royal Society of London A 112, 661–677", "url": "https://doi.org/10.1098/rspa.1926.0133", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "The Quantum Theory of the Emission and Absorption of Radiation", "authors": ["P. A. M. Dirac"], "year": 1927, "venue": "Proceedings of the Royal Society of London A 114, 243–265", "url": "https://doi.org/10.1098/rspa.1927.0039", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "The Principles of Quantum Mechanics", "authors": ["P. A. M. Dirac"], "year": 1930, "venue": "Clarendon Press, Oxford (1st edition)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Über strahlungslose Quantensprünge", "authors": ["Gregor Wentzel"], "year": 1927, "venue": "Zeitschrift für Physik 43, 524–530", "url": "https://ui.adsabs.harvard.edu/abs/1927ZPhy...43..524W/abstract", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Über das H-Theorem vom Anwachsen der Entropie vom Standpunkt der neuen Quantenmechanik", "authors": ["Wolfgang Pauli"], "year": 1928, "venue": "Probleme der modernen Physik: Arnold Sommerfeld zum 60. Geburtstage gewidmet von seinen Schülern (S. Hirzel, Leipzig), 3", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Quantum-mechanical perturbations giving rise to a statistical transport equation", "authors": ["Léon Van Hove"], "year": 1955, "venue": "Physica 21, 517–540", "url": "https://doi.org/10.1016/S0031-8914(54)92646-4", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Berechnung der natürlichen Linienbreite auf Grund der Diracschen Lichttheorie", "authors": ["Victor Weisskopf", "Eugene Wigner"], "year": 1930, "venue": "Zeitschrift für Physik 63, 54–73", "url": "https://ui.adsabs.harvard.edu/abs/1930ZPhy...63...54W/abstract", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Victor Frederick Weisskopf 1908–2002, Biographical Memoirs", "authors": ["National Academy of Sciences"], "year": 2005, "venue": "Biographical Memoirs, National Academies Press, Washington DC", "url": "https://www.n bucket": "archive"}, {"n": 17, "title": "The Zeno's paradox in quantum theory", "authors": ["Baidyanath Misra", "E. C. G. Sudarshan"], "year": 1977, "venue": "Journal of Mathematical Physics 18, 756–763", "url": "https://doi.org/10.1063/1.523304", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "Contribution to the Decay Theory of a Quasi-Stationary State", "authors": ["Leonid A. Khalfin"], "year": 1958, "venue": "Soviet Physics JETP 6, 1053–1063 (Russian original: Zh. Eksp. Teor. Fiz. 33, 1371, 1957)", "url": "https://ui.adsabs.harvard.edu/abs/1958JETP....6.1053K/abstract", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Cavity optomechanics", "authors": ["Markus Aspelmeyer", "Tobias J. Kippenberg", "Florian Marquardt"], "year": 2014, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.86.1391", "cited_by": 5749, "bucket": "canon"}, {"n": 20, "title": "Introduction to quantum noise, measurement, and amplification", "authors": ["Aashish A. Clerk", "Michel Devoret", "S. M. Girvin", "Florian Marquardt", "Robert Schoelkopf"], "year": 2010, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.82.1155", "cited_by": 1973, "bucket": "canon"}, {"n": 21, "title": "Electron–phonon coupling in hybrid lead halide perovskites", "authors": ["Adam D. Wright", "Carla Verdi", "Rebecca L. Milot", "Giles E. Eperon", "Miguel A. Pérez‐Osorio", "Henry J. Snaith"], "year": 2016, "venue": "Nature Communications", "url": "https://doi.org/10.1038/ncomms11755", "cited_by": 1348, "bucket": "canon"}, {"n": 22, "title": "Photoemission modeling of a two-liquid charge-carrier system formed at strong electron–phonon coupling", "authors": ["S. V. Doronkina", "A. S. Babayants", "I. V. Lisitsa", "A. É. Myasnikova"], "year": 2026, "venue": "Russian Technological Journal", "url": "https://doi.org/10.32362/2500-316x-2026-14-4-106-115", "cited_by": 0, "bucket": "recent"}, {"n": 23, "title": "Spins in few-electron quantum dots", "authors": ["Ronald Hanson", "Leo P. Kouwenhoven", "J. R. Petta", "Seigo Tarucha", "Lieven M. K. Vandersypen"], "year": 2007, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.79.1217", "cited_by": 2685, "bucket": "canon"}, {"n": 24, "title": "Spontaneous Emission Probabilities at Radio Frequencies", "authors": ["Edward M. Purcell"], "year": 1946, "venue": "Physical Review 69, 681 (abstract B10, American Physical Society meeting)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 25, "title": "Electron transfer reactions in chemistry. Theory and experiment", "authors": ["R. A. Marcus"], "year": 1993, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.65.599", "cited_by": 3653, "bucket": "canon"}, {"n": 26, "title": "Electron Transfer Reactions in Chemistry: Theory and Experiment", "authors": ["Rudolph A. Marcus"], "year": 1992, "venue": "Nobel Lecture in Chemistry, The Nobel Foundation, Stockholm (8 December 1992)", "url": "https://www.nobelprize.org/prizes/chemistry/1992/marcus/lecture/", "cited_by": null, "bucket": "archive"}], "nsec": 7, "nref": 26, "teaser": "Dirac derived it, Wentzel used it, Pauli made it kinetic, Weisskopf–Wigner supplied the exponential everyone quotes — and Van Hove, Khalfin, Misra–Sudarshan and Bixon–Jortner wrote the conditions nobody checks."}</script>
