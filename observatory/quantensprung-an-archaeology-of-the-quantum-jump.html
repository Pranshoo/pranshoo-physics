ok projective collapse only in the limit of perfect, instantaneous, projective detection. Belavkin's filtering equation makes the distinction precise."}, {"claim": "Quantum jumps require strong, projective measurement.", "clarification": "Weak continuous measurement generates a stochastic master equation whose jump term has the same Kraus structure (Srinivas–Davies, Carmichael); the 'jump' survives as a singular component of an otherwise diffusive trajectory."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins, Heretics, and Forgotten Pioneers (1913–1952)", "markdown": "## Origins, Heretics, and Forgotten Pioneers (1913–1952)\n\nThe word *Quantensprung* enters physics in July 1913, but the object it names is not yet the object modern textbooks invoke. Bohr's three-part *Philosophical Magazine* paper [1] postulates stationary states of the hydrogen atom and a radiative transition between them obeying\n\n$$h\\nu_{mn} \\;=\\; E_m - E_n,$$\n\nwith the explicit declaration that the dynamics *between* states lies outside classical electrodynamics. The jump is introduced as a *negation*: a statement about what classical mechanics cannot describe, not a statement about what happens. There are no transition probabilities, no rates, no preferred direction of time, no stochastic element. Bohr's 1913 jump is closer to a kinematic discontinuity — a selection rule on which orbits are allowed — than to the irreversible event later canonized under the same name.\n\nThe stochastic ontology arrives three years later, and it is Einstein's, not Bohr's. In the 1916 *Mitteilungen* of the Zürich Physical Society, restated in the better-known 1917 *Physikalische Zeitschrift* paper [2], Einstein introduces the coefficients $A_{mn}$, $B_{mn}$, $B_{nm}$ and derives Planck's law from detailed balance, deriving in the process two features that Bohr's 1913 paper does not contain. First, spontaneous emission is *irreducibly probabilistic*: an excited atom decays with a rate $A_{mn}$ and no further specification of when. Second, every emission carries a directed momentum $h\\nu/c$, so the jump is not only a transition of internal state but a *recoil event* — a localized, momentum-conserving emission of a quantum of radiation. Einstein himself, in the final paragraph of the 1917 paper, registers his discomfort: the theory leaves \"Zeitpunkt und Richtung\" of the elementary process to chance, a weakness he calls a defect of the formalism rather than a feature of nature. The textbook tradition that hands the entire stochastic-jump picture to Bohr collapses two distinct contributions: Bohr supplied the discreteness, Einstein supplied the randomness and the recoil.\n\nThe first non-English dissent arrives almost immediately. Walther Nernst, in the same *Verhandlungen* volume as Einstein's lecture, argues that the apparent monochromaticity of spectral lines does not compel a photon-jump picture; a continuous wave-emission interpretation in which energy is shed gradually across an extended time interval is, he claims, compatible with the same line shapes once Doppler and pressure broadening are accounted for. Nernst's objection is rarely reproduced in English-language histories and is essentially absent from quantum-optics textbooks; Mehra and Rechenberg's volume I preserves the exchange. The argument is wrong as stated — it requires abandoning the photoelectric effect's quantum kinematics — but it is the first articulation of an idea that returns, in altered form, with Schrödinger in 1926 and with the continuous-measurement community after 1980: that *jump* is a shorthand for an underlying smooth process not yet exhibited.\n\nHeisenberg's 1925 *Umdeutung* paper [3] does not abolish the jump; it formalizes it. The matrix elements $x_{mn}(t) = x_{mn}(0)\\,e^{i\\omega_{mn}t}$ are explicitly *between* stationary states, and the commutation relation $[x,p] = i\\hbar$ encodes the algebra of those transitions. What Heisenberg removes is the orbit, not the leap. In a strict sense matrix mechanics is the algebra of the jump: the dynamical variables of the theory are no longer trajectories $q(t)$ but transition amplitudes $\\langle m\\mid q\\mid n\\rangle$, and a measurement of any observable on a stationary state delivers the spectrum of these amplitudes. This is the historical moment at which the jump ceases to be an ad hoc patch and becomes the kinematic substrate of the theory. The cost is a near-total loss of spacetime visualizability, and it is precisely this loss that Schrödinger sets out to repair the following year.\n\nSchrödinger's 1926 wave mechanics is, by his own declaration, *anti-jump*. The famous reconstruction of the exchange with Bohr in Copenhagen — Heisenberg's recollection has Schrödinger declaring \"If I have to put up with these damned quantum jumps, then I regret ever having had anything to do with quantum theory\" — is rhetorical, but the technical content of the dissent is sharp. Schrödinger's program was to identify atomic stationary states with proper modes of a continuous field $\\psi$ and the apparent transitions with beat phenomena between two simultaneously excited modes, so that radiation would emerge as a classical Hertz dipole driven by the bilinear current $\\psi^*\\nabla\\psi$ — *no discontinuity*, no projection. This program fails: it produces no Born statistics for individual detection events and no mechanism for the irreversibility encoded in Einstein's $A$-coefficient. But its failure mode is interesting. What Schrödinger could not derive from a closed wave equation is exactly what was later supplied externally by photodetection theory (Davies, Srinivas) and by the stochastic-master-equation framework — namely, the conditioning rule that turns smooth $\\psi$-evolution into a Poisson-clicked record.\n\nEdwin C. Kemble's 1929 *Reviews of Modern Physics* article on the general principles of quantum mechanics is the most under-cited document of this period. Kemble argues, with explicit reference to the Bohr–Schrödinger dispute, that a quantum transition must be a *finite-duration physical process* set by the inverse of the transition matrix element times $\\hbar$, and that the apparent instantaneity is an artifact of treating the radiation field perturbatively to lowest order. The argument anticipates, in qualitative form, both the Wigner–Weisskopf line-shape calculation (1930) and the modern result, made experimental by Seidler et al. [4] and by Minev et al. [5], that the conditional evolution between detector clicks is smooth and the \"jump\" has a temporal extent of order $\\Omega_R^{-1}$. Kemble's article is discussed at length in Jammer's *Conceptual Development of Quantum Mechanics* (1966) and almost nowhere else in the physics literature.\n\nThe last great anti-jump intervention comes from Schrödinger himself, twenty-six years on. The 1952 two-part essay \"Are There Quantum Jumps?\" [6, 7] is usually quoted for its rhetorical flourishes — the comparison of the jump to a Homeric phantasm, the insistence that no one has ever seen one. The technical core is sharper than the quotations suggest. Schrödinger's complaint is that a stochastic ontology of jumps cannot be *derived from* any closed wave equation, unitary or otherwise: it must be imposed by a measurement postulate external to the dynamics. In 1952 this was a metaphysical objection; in the present formalism it is a theorem. The Lindblad generator, the Davies–Srinivas photon-counting formula [8], and the Belavkin filtering equation each insert the jump by hand as an unraveling of an irreversible map, and the choice of unraveling — jumps versus diffusion — is a gauge of the measurement apparatus, not of the system. Schrödinger lost the polemic about whether jumps occur. He won, posthumously, the narrower technical point that they cannot be deduced from the closed dynamics alone.\n\nBy 1952, then, every conceptual ingredient of the modern object called *quantum jump* is on the table, but distributed across distinct founders and partially in mutual contradiction: discreteness from Bohr, stochasticity and recoil from Einstein, the algebra of transitions from Heisenberg, the smooth wave-mechanical substrate from Schrödinger, the finite-duration interpretation from Kemble, and the wave-emission dissent from Nernst. None of these authors, taken alone, is the originator of the textbook concept. The textbook concept is a *composite*, assembled in the 1980s out of pieces whose original owners would, in several cases, have rejected the assembly."}, {"id": "the-physics-the-pedagogical-core", "title": "The Physics: Stationary States, Transition Amplitudes, and the Lindblad Skeleton", "markdown": "## The Physics: Stationary States, Transition Amplitudes, and the Lindblad Skeleton\n\nThe word *Quantensprung* survives in modern physics because three layers of formalism, laid down between 1913 and 1976, can be peeled apart cleanly: a kinematic layer (stationary states and Bohr frequencies), a rate layer (Einstein coefficients and Fermi's golden rule), and a generator layer (the GKLS/Lindblad master equation). Each layer has its own notion of \"jump,\" each carries its own domain of validity, and the conflations catalogued in §1 almost all arise from sliding between them without changing notation.\n\n### Kinematics: stationary states and the Bohr condition\n\nBohr's 1913 postulate [1] fixes only two things: that bound atoms occupy a discrete set $\\{|n\\rangle\\}$ with energies $E_n$, and that radiative transitions $m \\to n$ emit monochromatic light at\n\n$$\\nu_{mn} \\;=\\; \\frac{E_m - E_n}{h}.$$\n\nNothing in Bohr's text equips the transition with a probability, a lifetime, or a direction; the jump is a kinematical constraint between two stationary solutions of an otherwise unspecified dynamics. Matrix mechanics [3] reinterprets the index pair $(m,n)$ as the natural address of a dynamical variable: an observable is a *table* $A_{mn}(t) = A_{mn}\\,e^{i\\omega_{mn}t}$ with $\\omega_{mn} = (E_m - E_n)/\\hbar$, so the Ritz combination principle is built into the algebra. In this language the \"jump\" is not an event in time but the off-diagonal entry of an operator — a transition amplitude whose modulus squared will, once a reservoir is reintroduced, become a rate.\n\n### Rates: Einstein's A and B, and detailed balance\n\nEinstein's 1916–17 derivation [2] is the moment the jump acquires irreducibly stochastic content. For a two-level atom in thermal radiation of spectral density $\\rho(\\nu)$, postulate three elementary processes with rates\n\n$$W_{m\\to n}^{\\text{spont}} = A_{mn},\\qquad W_{m\\to n}^{\\text{stim}} = B_{mn}\\,\\rho(\\nu_{mn}),\\qquad W_{n\\to m}^{\\text{abs}} = B_{nm}\\,\\rho(\\nu_{mn}),$$\n\nand demand that thermal equilibrium ($N_m/N_n = e^{-h\\nu_{mn}/k_BT}$) reproduce Planck's law. The algebra fixes\n\n$$B_{mn} = B_{nm},\\qquad \\frac{A_{mn}}{B_{mn}} = \\frac{8\\pi h \\nu_{mn}^3}{c^3}.$$\n\nThe Einstein argument is thermodynamic, not mechanical: the *ratios* are forced, the absolute values are not. To get $A_{mn}$ from first principles one passes to time-dependent perturbation theory.\n\n### Fermi's golden rule and $A_{mn}$ from the dipole coupling\n\nIn the electric-dipole, rotating-wave approximation, an atom of dipole operator $\\hat{\\mathbf d}$ couples to the quantized field via $H_{\\text{int}} = -\\hat{\\mathbf d}\\cdot\\hat{\\mathbf E}(\\mathbf 0)$. Treating the field vacuum as a continuum reservoir and applying Fermi's rule,\n\n$$\\Gamma_{m\\to n} \\;=\\; \\frac{2\\pi}{\\hbar}\\sum_{\\mathbf k,\\lambda}\\bigl|\\langle n,\\mathbf k\\lambda|H_{\\text{int}}|m,0\\rangle\\bigr|^2\\,\\delta(E_m - E_n - \\hbar\\omega_{\\mathbf k}),$$\n\nwith the mode density $\\rho_{\\text{field}}(\\omega) = \\omega^2 V/(\\pi^2 c^3)$ and an angular average over polarizations, collapses to the Weisskopf–Wigner result\n\n$$A_{mn} \\;=\\; \\frac{\\omega_{mn}^3}{3\\pi\\varepsilon_0\\hbar c^3}\\,|\\langle n|\\hat{\\mathbf d}|m\\rangle|^2.$$\n\nThe $\\omega^3$ scaling — the kinematical fingerprint of vacuum mode density — recovers Einstein's ratio identically. Assumptions inserted, in order: (i) dipole approximation $kr \\ll 1$; (ii) rotating-wave approximation, dropping counter-rotating terms of order $\\omega/\\omega_0$; (iii) flat reservoir spectral density on the scale of the linewidth (Markov); (iv) initial vacuum, so spontaneous emission has no stimulated counterpart. The same calculation also produces an imaginary part — the Lamb shift — which is real, finite after renormalization, and routinely dropped at this stage.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eThree layers of formalism for a quantum jump\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"24\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eThree layers: kinematics → rates → generator\u003c/text\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1.2\" fill=\"none\"\u003e\u003cline x1=\"60\" y1=\"120\" x2=\"220\" y2=\"120\"/\u003e\u003cline x1=\"60\" y1=\"220\" x2=\"220\" y2=\"220\"/\u003e\u003c/g\u003e\u003ctext x=\"40\" y=\"124\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e|m⟩\u003c/text\u003e\u003ctext x=\"40\" y=\"224\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e|n⟩\u003c/text\u003e\u003ctext x=\"140\" y=\"110\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eE_m\u003c/text\u003e\u003ctext x=\"140\" y=\"240\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eE_n\u003c/text\u003e\u003cpath d=\"M 150 130 Q 175 170 150 210\" stroke=\"#ffb86b\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arr)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#ffb86b\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"195\" y=\"175\" fill=\"#ffb86b\" font-size=\"13\"\u003ehν = E_m − E_n\u003c/text\u003e\u003ctext x=\"140\" y=\"280\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eBohr 1913 / Heisenberg 1925\u003c/text\u003e\u003ctext x=\"140\" y=\"298\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003ekinematic: amplitudes ⟨n|·|m⟩\u003c/text\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1.2\" fill=\"none\"\u003e\u003cline x1=\"280\" y1=\"120\" x2=\"440\" y2=\"120\"/\u003e\u003cline x1=\"280\" y1=\"220\" x2=\"440\" y2=\"220\"/\u003e\u003c/g\u003e\u003cpath d=\"M 360 130 L 360 210\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" marker-end=\"url(#arr2)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7ee0a3\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"378\" y=\"175\" fill=\"#7ee0a3\" font-size=\"13\"\u003eA_mn, B_mn\u003c/text\u003e\u003ctext x=\"360\" y=\"280\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eEinstein 1916 / Weisskopf–Wigner\u003c/text\u003e\u003ctext x=\"360\" y=\"298\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003erates: Γ = (2π/ℏ)|V|²ρ(ω)\u003c/text\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1.2\" fill=\"none\"\u003e\u003cline x1=\"500\" y1=\"120\" x2=\"660\" y2=\"120\"/\u003e\u003cline x1=\"500\" y1=\"220\" x2=\"660\" y2=\"220\"/\u003e\u003c/g\u003e\u003cpath d=\"M 580 130 C 600 150 560 190 580 210\" stroke=\"#ff7a90\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arr3)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"arr3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#ff7a90\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"610\" y=\"175\" fill=\"#ff7a90\" font-size=\"13\"\u003eL = √Γ σ₋\u003c/text\u003e\u003ctext x=\"580\" y=\"280\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eGKLS 1976 / Lindblad 1976\u003c/text\u003e\u003ctext x=\"580\" y=\"298\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003egenerator: LρL† − ½{L†L,ρ}\u003c/text\u003e\u003ctext x=\"360\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\"\u003eeach layer adds structure (probability, then dynamics) without contradicting the previous\u003c/text\u003e\u003c/svg\u003e\n*Figure: The three formalism layers in which \"quantum jump\" lives. Kinematics fixes only the frequency; Einstein rates add probability; the Lindblad generator promotes the rate to a completely positive dynamical semigroup whose unraveling produces the trajectory-theory jump of §3.*\n\n### The Lindblad/GKLS skeleton\n\nRates suffice for populations, but the coherence between $|m\\rangle$ and $|n\\rangle$ also decays, and a master equation must preserve positivity of $\\rho$ for all preparations. The unique form satisfying complete positivity, trace preservation, and Markovianity is the Gorini–Kossakowski–Sudarshan–Lindblad equation,\n\n$$\\dot\\rho \\;=\\; -\\frac{i}{\\hbar}[H,\\rho] \\;+\\; \\sum_k \\Bigl( L_k\\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\} \\Bigr).$$\n\nFor spontaneous emission on $|m\\rangle\\to|n\\rangle$ the single jump operator is $L = \\sqrt{\\Gamma_{m\\to n}}\\,|n\\rangle\\langle m|$, with $\\Gamma_{m\\to n} = A_{mn}$. Multiple decay channels enter as independent $L_k$. The derivation from a microscopic system–reservoir Hamiltonian requires four assumptions, each of which can — and does — fail in real experiments:\n\n1. **Weak coupling.** The system–bath interaction is small enough that second-order perturbation in $H_{SB}$ closes the equation. Strong-coupling regimes (cavity QED with $g \\gtrsim \\kappa,\\gamma$) require polaron transforms or non-perturbative methods.\n2. **Born approximation.** $\\rho_{SB}(t) \\approx \\rho_S(t)\\otimes\\rho_B$ throughout — the bath is unentangled from the system at every instant. This is the assumption that quietly fails in structured reservoirs (photonic band gaps, finite-Q cavities).\n3. **Markov approximation.** Bath correlation time $\\tau_B$ much shorter than the system relaxation time $1/\\Gamma$. Memory kernels become $\\delta$-functions; the time-non-local Nakajima–Zwanzig kernel collapses to a generator. When this fails, one needs the non-Markovian jump formalisms of Piilo et al. [9].\n4. **Secular approximation.** Time-averaging over the fast scale $\\omega_0^{-1}$ drops cross-terms between Bohr frequencies differing by more than $\\Gamma$. This is what diagonalizes the dissipator in the energy eigenbasis and recovers the Pauli rate equations $\\dot P_m = \\sum_n (A_{nm}P_n - A_{mn}P_m)$.\n\nTwo corollaries deserve emphasis.\n\nFirst, the Lindblad equation knows nothing about jumps in the event sense — it propagates an ensemble. The *individual* jump only appears once the dissipator is *unravelled*: writing\n\n$$\\dot\\rho = -\\frac{i}{\\hbar}[H_{\\text{eff}},\\rho] + \\sum_k L_k\\rho L_k^\\dagger,\\qquad H_{\\text{eff}} = H - \\frac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k,$$\n\nseparates a deterministic non-Hermitian flow (the \"no-count\" evolution of Srinivas–Davies [8]) from a stochastic recycling operation $\\rho \\to L_k\\rho L_k^\\dagger/\\text{tr}(\\cdot)$ (the \"click\"). This split is the mathematical skeleton on which §3 will erect the Monte-Carlo wave-function method [10] and Carmichael's quantum trajectories — but it is unique to the photon-counting unravelling. A homodyne unravelling of the same Lindbladian replaces the jump by a Wiener increment and produces no events at all. The Lindblad equation is unraveling-agnostic; the *jump* is not.\n\nSecond, the Bohr-era jump and the GKLS jump operator are not the same object. Bohr's $|m\\rangle\\to|n\\rangle$ is a relation between eigenstates of a closed Hamiltonian; $L = \\sqrt\\Gamma\\,\\sigma_-$ is a non-Hermitian operator on the open-system Hilbert space whose action on a coherent superposition $\\alpha|m\\rangle + \\beta|n\\rangle$ generically yields a non-eigenstate of $H$. The textbook habit of drawing a downward arrow on a level diagram and calling it \"the jump\" is consistent with both readings only because the secular approximation has been silently imposed.\n\nWhat survives across all four layers is the algebra of transition amplitudes — Heisenberg's 1925 insight — recast as Kraus operators acting on a conditional state. What does not survive is the picture of the jump as an instantaneous, structureless event: each assumption above is the place where a finite duration, a memory, or a coherence will reappear, and §3 will follow them through the unravelling."}, {"id": "from-rates-to-trajectories", "title": "From Rates to Trajectories: Photodetection, Unravelings, and the MCWF Lineage", "markdown": "## From Rates to Trajectories: Photodetection, Unravelings, and the MCWF Lineage\n\nBy the late 1960s the jump was three different things wearing the same name: Einstein's irreversible $A$-coefficient event, the off-diagonal matrix element $\\langle m|\\hat{H}_\\text{int}|n\\rangle$ of perturbation theory, and a tacit pointer-state reduction invoked whenever a fluorescence photon was registered. What was missing was a dynamical law for the *conditional* state of an atom whose emitted field is being watched. That law — and with it the modern meaning of \"quantum trajectory\" — was assembled in three layers between 1969 and 1993.\n\n### Davies' operational theory of continuous measurement (1969–1976)\n\nE. B. Davies' programme was austerely mathematical: a continuous measurement is a one-parameter family of completely positive maps $\\{\\mathcal{T}_t\\}_{t\\ge 0}$ together with an instrument $\\mathcal{I}(\\mathrm{d}\\omega, t)$ that decomposes each $\\mathcal{T}_t$ into pieces labelled by classical records $\\omega$. The atom's unconditional dynamics is generated by a Lindblad-type semigroup\n$$\\dot{\\rho} = -\\tfrac{i}{\\hbar}[H,\\rho] + \\sum_k \\left( L_k \\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\}\\right),$$\nbut Davies' insight was that one can split the generator as $\\mathcal{L} = \\mathcal{L}_0 + \\mathcal{J}$, where $\\mathcal{J}\\rho = \\sum_k L_k \\rho L_k^\\dagger$ is the *jump super-operator* and $\\mathcal{L}_0\\rho = -i\\hbar^{-1}(H_\\text{eff}\\rho - \\rho H_\\text{eff}^\\dagger)$ is the *no-event* generator built from the non-Hermitian effective Hamiltonian\n$$H_\\text{eff} = H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k.$$\nA Dyson expansion of $e^{\\mathcal{L} t}$ in powers of $\\mathcal{J}$ then organises the dynamics as a sum over histories with $n$ jumps at times $t_1\u003c\\dots\u003ct_n$. This decomposition is the *operational* skeleton on which everything that follows hangs. Davies' 1976 monograph *Quantum Theory of Open Systems* is the canonical reference; his name is almost never spoken in physics graduate courses despite the fact that no MCWF paper would compile without him.\n\n### The Srinivas–Davies photon-counting formula (1981)\n\nSrinivas and Davies [8] specialised the instrument to photoelectric detection of the emitted field. Defining the *exclusive* probability density that exactly $n$ photoelectrons are recorded at times $t_1\u003c\\dots\u003ct_n$ in $[0,t]$,\n$$p_n(t_1,\\dots,t_n) = \\mathrm{Tr}\\!\\left[\\, \\mathcal{S}_{t-t_n}\\mathcal{J}\\,\\mathcal{S}_{t_n-t_{n-1}}\\mathcal{J}\\,\\cdots\\,\\mathcal{J}\\,\\mathcal{S}_{t_1}\\rho_0 \\,\\right],$$\nwith $\\mathcal{S}_\\tau\\rho = e^{-iH_\\text{eff}\\tau/\\hbar}\\rho\\,e^{+iH_\\text{eff}^\\dagger\\tau/\\hbar}$, they obtained the *non-exclusive* counting statistics by integrating out future detection events. This is the photon-counting analogue of Mandel's semiclassical formula, but with operators in the right places — and it is, line for line, what reappears a decade later as the unraveling identity behind MCWF. Two structural facts emerge immediately from this formula and matter for everything later: the waiting-time density between clicks is $w(\\tau) = \\mathrm{Tr}[\\mathcal{J} e^{\\mathcal{L}_0 \\tau}\\rho_\\text{cond}]$, *not* a simple exponential except in the secular limit; and the conditional state between clicks evolves *deterministically* under the non-Hermitian $H_\\text{eff}$. The \"jump\" is the only stochastic event in the picture.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eThree unravelings of the same Lindblad equation\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eThree unravelings of one master equation d\u0026#961;/dt = ℒ\u0026#961;\u003c/text\u003e\u003ctext x=\"40\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e(a) MCWF / photon counting\u003c/text\u003e\u003cpath d=\"M40 130 C 80 100, 110 100, 140 130 C 170 160, 200 160, 230 130 C 260 100, 290 100, 320 130\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cline x1=\"320\" y1=\"130\" x2=\"320\" y2=\"180\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003cpath d=\"M320 180 C 350 150, 380 150, 410 180 C 440 210, 470 210, 500 180\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cline x1=\"500\" y1=\"180\" x2=\"500\" y2=\"230\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003cpath d=\"M500 230 C 530 200, 560 200, 590 230 C 620 260, 650 260, 680 230\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ctext x=\"320\" y=\"200\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\" font-family=\"serif\"\u003eclick L\u003c/text\u003e\u003ctext x=\"500\" y=\"250\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\" font-family=\"serif\"\u003eclick L\u003c/text\u003e\u003ctext x=\"40\" y=\"195\" fill=\"#e8e6e1\" font-size=\"12\" font-family=\"serif\"\u003e|\u0026#968;\u0026#10217;: smooth H_eff drift + discrete jumps\u003c/text\u003e\u003ctext x=\"40\" y=\"260\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e(b) Homodyne diffusion\u003c/text\u003e\u003cpath d=\"M40 330 Q 60 310, 80 335 T 120 320 T 160 340 T 200 318 T 240 335 T 280 322 T 320 338 T 360 320 T 400 332 T 440 325 T 480 338 T 520 320 T 560 332 T 600 325 T 640 335 T 680 322\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ctext x=\"40\" y=\"365\" fill=\"#e8e6e1\" font-size=\"12\" font-family=\"serif\"\u003e|\u0026#968;\u0026#10217;: continuous Wiener noise, no jumps\u003c/text\u003e\u003cline x1=\"40\" y1=\"385\" x2=\"680\" y2=\"385\" stroke=\"#e8e6e1\" stroke-width=\"0.5\"/\u003e\u003ctext x=\"360\" y=\"398\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\" font-family=\"serif\"\u003eSame ensemble average E[|\u0026#968;\u0026#10217;\u0026#10216;\u0026#968;|] = \u0026#961;(t) — the \"jump\" is an unraveling, not an observable of \u0026#961;\u003c/text\u003e\u003c/svg\u003e\n*Figure: A single Lindblad equation admits inequivalent stochastic unravelings. (a) Photon-counting / MCWF: deterministic non-Hermitian drift under $H_\\text{eff}$ punctuated by Poisson-timed jumps $L_k$. (b) Homodyne unraveling: a diffusive trajectory with no jumps at all. Both reproduce $\\rho(t)$ on ensemble average.*\n\n### Carmichael's quantum trajectories (1989/1993)\n\nHoward Carmichael's reframing — circulating in his 1989 Les Houches notes and consolidated in the 1993 Springer monograph *An Open Systems Approach to Quantum Optics* — was conceptual rather than mathematical. He recognised the Srinivas–Davies expansion as a *physical* statement about an atom under photodetection: the conditional ket $|\\psi_c(t)\\rangle$ is the state of the atom *given the photocount record up to time $t$*. Between clicks,\n$$\\frac{\\mathrm{d}}{\\mathrm{d}t}|\\psi_c\\rangle = -\\tfrac{i}{\\hbar}\\,H_\\text{eff}\\,|\\psi_c\\rangle,$$\nwith norm decay $\\|\\psi_c(t)\\|^2$ equal to the probability of recording *no* click up to $t$; a click at $t_k$ implements\n$$|\\psi_c(t_k^+)\\rangle = \\frac{L_k|\\psi_c(t_k^-)\\rangle}{\\|L_k|\\psi_c(t_k^-)\\rangle\\|}.$$\nCarmichael coined the term \"quantum trajectory\" for the resulting cadlag path in Hilbert space and demonstrated that ensemble-averaging $|\\psi_c\\rangle\\langle\\psi_c|$ over all possible records recovers the Lindblad $\\rho(t)$. He is routinely cited from 1993, but the 1989 lecture notes establish his priority over the MCWF papers by roughly three years.\n\n### MCWF: Dalibard–Castin–Mølmer and Dum–Zoller–Ritsch (1992)\n\nThe two MCWF letters arrived essentially together [10]. Dalibard, Castin and Mølmer presented the algorithm as a *Monte Carlo* sampling of Hilbert-space trajectories whose statistics reproduce the master equation; Dum, Zoller and Ritsch (*Phys. Rev. A* 45, 4879) gave a parallel construction motivated by laser-cooling simulations where storing $\\rho$ for $\\sim 10^5$ momentum states was prohibitive. The algorithmic kernel is the Srinivas–Davies formula recast as a sampling rule:\n\n1. Propagate $|\\psi(t)\\rangle$ under $H_\\text{eff}$ for $\\mathrm{d}t$;\n2. Compute $\\delta p = \\mathrm{d}t\\,\\sum_k\\langle\\psi|L_k^\\dagger L_k|\\psi\\rangle$;\n3. Draw $r\\sim U[0,1)$; if $r\u003e\\delta p$, renormalise and continue; otherwise jump with channel $k$ chosen with probability $\\langle\\psi|L_k^\\dagger L_k|\\psi\\rangle/\\sum_j\\langle\\psi|L_j^\\dagger L_j|\\psi\\rangle$.\n\nNeither letter cites Davies; neither cites Srinivas–Davies; neither cites Carmichael's 1989 notes. The Plenio–Knight review [11] later supplied the missing genealogy and is the place where the lineage is finally drawn straight.\n\n### Hegerfeldt–Wilser, and the convergence of three independent derivations\n\nA third, near-simultaneous construction is owed to Gerhard Hegerfeldt and T. S. Wilser, who in 1991–92 derived the same stochastic ket evolution from a \"delayed-choice\" analysis of repeated short measurements on the radiation field (Hegerfeldt, *Phys. Rev. A* 47, 449 (1993); Hegerfeldt \u0026 Wilser, Proc. II Wigner Symp., 1992). Their motivation was the resolution of the Cook–Kimble shelving problem — what conditional state does the ion occupy during a dark period? — and they obtained, by independent route, exactly the no-jump $H_\\text{eff}$ drift plus Kraus-jump update. That three groups, working from photodetection theory, laser cooling, and the foundations of measurement respectively, converged on the same equations in the same year is a strong indication that the formalism was overdetermined by 1992.\n\n### Belavkin's filtering: the SDE underneath\n\nThe rigorous mathematics had in fact been completed five years earlier by V. P. Belavkin. His *quantum filtering equation* (Lect. Notes Control Inf. Sci. 121, 1988; *J. Multivar. Anal.* 42, 1992) is a quantum stochastic differential equation\n$$\\mathrm{d}\\rho_c = \\mathcal{L}\\rho_c\\,\\mathrm{d}t + \\sum_k\\left( \\frac{L_k\\rho_c L_k^\\dagger}{\\mathrm{Tr}[L_k^\\dagger L_k\\rho_c]} - \\rho_c\\right)\\left( \\mathrm{d}N_k - \\mathrm{Tr}[L_k^\\dagger L_k\\rho_c]\\,\\mathrm{d}t\\right),$$\nwith $\\mathrm{d}N_k$ the increment of the classical point process of photodetections — i.e. the MCWF jump rule is the $\\mathrm{d}N_k\\in\\{0,1\\}$ realisation of this SDE on the *innovations* process. Replace the point-process noise by a Wiener increment $\\mathrm{d}W$ — i.e. homodyne rather than direct detection — and the same equation becomes the diffusive stochastic master equation of Carmichael, Wiseman, and Milburn. Belavkin had derived both unravelings as special cases of one filter; the physics literature reinvented them piecewise.\n\n### What the unraveling is not\n\nIt bears stating explicitly because the confusion is endemic: the jumps in MCWF are not features of $\\rho(t)$. They live on the conditional state $|\\psi_c\\rangle$, which depends on the choice of *measurement record*. The same $\\mathcal{L}$ unraveled by homodyne detection produces a purely diffusive trajectory that never jumps; unraveled by heterodyne, a complex-valued diffusion. The Lindblad equation has no preferred unraveling, and no experiment performed on $\\rho$ alone can detect one. The jump becomes a physical event only when a specific detector is wired up — when, in Belavkin's language, a specific measurement filtration is selected. This is the price the formalism quietly extracts for resurrecting Bohr's *Quantensprung* as a calculable object: the jump is real, but only relative to the apparatus that watches for it."}, {"id": "landmark-experiments", "title": "Seeing the Jump: Shelving, the 1986 Triple, and Caught Mid-Flight", "markdown": "## Seeing the Jump: Shelving, the 1986 Triple, and Caught Mid-Flight\n\nFor six decades after Bohr, the *Quantensprung* remained an inference. One saw spectral lines, fluorescence rates, lifetimes — averages over Avogadro's number of unwitnessed transitions. The jump was a verb in the formalism, never an event in the laboratory. The transformation from inference to observation took place between 1975 and 1986, in a single technique applied to a single ion, and even then the textbook story compresses three independent groups into one credit line. This section reconstructs that lineage and follows it forward to two twenty-first-century experiments that have rewritten what \"seeing a jump\" can mean.\n\n### Dehmelt's escape from the ensemble\n\nThe conceptual move that made single-ion spectroscopy possible was Hans Dehmelt's, and it was made in a one-paragraph abstract in the *Bulletin of the American Physical Society* in 1975 (vol. 20, p. 60). The proposal — never written up as a long paper at the time — is now called **electron shelving**. Consider a three-level ion with one strong cycling transition $\\lvert g\\rangle \\leftrightarrow \\lvert e\\rangle$ at rate $\\Gamma$ and one weak transition $\\lvert g\\rangle \\leftrightarrow \\lvert s\\rangle$ to a metastable \"shelf\" state with lifetime $\\tau_s \\gg \\Gamma^{-1}$. Drive both. Photons stream out of the strong transition — millions per second — *unless* a rare excitation to $\\lvert s\\rangle$ removes the ion from the cycling manifold. While shelved, the fluorescence vanishes. When the ion decays back to $\\lvert g\\rangle$, fluorescence resumes. A single weak-transition quantum jump is amplified into the on/off switching of $\\sim 10^{8}$ photons per second — Dehmelt's \"shelved optical electron amplifier.\"\n\nThe proposal had three crucial properties. First, it was *digital*: the signal is the presence or absence of fluorescence, not a small change in a large background. Second, it presupposed the capture and laser-cooling of a single ion, an art Dehmelt and Wineland had been building since the 1973 demonstration of a single trapped electron and the 1978 cooling of Ba$^{+}$. Third, it offered no way to see the jump *in flight* — only its consequences, before and after.\n\n### Cook–Kimble: the quantitative telegraph\n\nFor five years the shelving idea circulated as folklore. It became calculable in 1985, when Richard Cook and H. Jeff Kimble worked out the photon statistics of the V-system in [12]. They showed that the fluorescence record consists of bright intervals (Poissonian photon emission at rate $\\Gamma_{\\text{bright}}$) interrupted by dark intervals, with bright- and dark-period durations exponentially distributed at rates set by the weak-transition pump and the shelf decay,\n\n$$\nP(\\tau_{\\text{dark}}) = \\frac{1}{\\langle\\tau_s\\rangle}\\,e^{-\\tau_{\\text{dark}}/\\langle\\tau_s\\rangle}, \\qquad P(\\tau_{\\text{bright}}) = \\frac{1}{\\langle\\tau_b\\rangle}\\,e^{-\\tau_{\\text{bright}}/\\langle\\tau_b\\rangle},\n$$\n\nwith $\\langle\\tau_b\\rangle^{-1}$ proportional to the weak-transition Rabi frequency squared. The expected signal was a *random telegraph* — a stochastic two-level process whose two rates encoded, separately, the shelf lifetime and the weak-transition matrix element. Cook and Kimble's paper [12] reduced Dehmelt's idea to a falsifiable prediction with a known waveform; it told the experimentalists exactly what to look for. (Their derivation, as Plenio and Knight later emphasised in [11], is in effect a three-level instance of the Srinivas–Davies photon-counting formalism [8], though Cook and Kimble arrived at it independently.)\n\n### The 1986 triple\n\nWithin fifteen months of Cook–Kimble, three groups published the observation. The credit audit matters because textbook accounts routinely list one name:\n\n- **Nagourney, Sandberg, Dehmelt** (University of Washington), single $^{138}\\text{Ba}^{+}$ ion in a Paul trap, shelving via the $5d\\,^{2}D_{5/2}$ state. *Phys. Rev. Lett.* **56**, 2797 — received 31 March 1986, published 30 June 1986 [13].\n- **Sauter, Neuhauser, Blatt, Toschek** (Universität Hamburg), single $^{138}\\text{Ba}^{+}$, same shelving scheme. *Phys. Rev. Lett.* **57**, 1696 — received 8 August 1986, published 6 October 1986 [14].\n- **Bergquist, Hulet, Itano, Wineland** (NIST Boulder), single $^{198}\\text{Hg}^{+}$, shelving via the $5d^{9}6s^{2}\\,^{2}D_{5/2}$ state. *Phys. Rev. Lett.* **57**, 1699 — received 21 August 1986, published 6 October 1986 [15].\n\nPriority by submission date belongs unambiguously to Nagourney et al. [13], whose manuscript reached PRL more than four months before the other two. But \"the 1986 observation\" is not a single event:\n\n1. Sauter et al. [14] were running their Ba$^{+}$ experiment in Hamburg in parallel with the Washington group; the Hamburg apparatus had been operating since 1980 (Neuhauser–Hohenstatt–Toschek–Dehmelt's single-ion confinement papers), and the two groups had partially overlapping intellectual genealogies through Dehmelt himself. Their submission delay was not catch-up but independent confirmation.\n2. Bergquist et al. [15] used a *different* ion ($\\text{Hg}^{+}$ rather than $\\text{Ba}^{+}$), a different vacuum-UV cooling laser, and a Penning-trap design — a genuinely independent experimental realization. Their telegraph trace, with its long dark intervals matching the $\\sim 0.1$ s $^{2}D_{5/2}$ lifetime, is the canonical figure reproduced in monographs and Nobel lectures, partly because of the NIST group's institutional prominence and partly because the Hg$^{+}$ time constants are visually striking.\n\nThe honest record is that 1986 saw three independent demonstrations of single-ion quantum jumps within five months, two of them submitted within thirteen days of one another. The Plenio–Knight review [11] credits all three; most pedagogical sources cite at most one.\n\nWhat the 1986 triple actually showed was the Cook–Kimble random telegraph, with exponential dark and bright statistics matching the rate predictions of [12] to within experimental uncertainty. It did *not* show the temporal profile of a jump — the dark intervals were resolved, but the transitions between bright and dark were limited by photon shot noise and detector bandwidth, and were consistent with instantaneity at the experimental resolution of $\\sim 10$ ms.\n\n### Seidler 2018: an upper bound on the duration\n\nThe question of jump duration — what does the *transition itself* look like, viewed faster than its inverse Rabi frequency? — required a different platform. Seidler, Gutiérrez-Jáuregui, Cerè, Jáuregui and Kurtsiefer [4] approached it in 2018 by inverting the usual experiment: instead of monitoring a strong transition for the consequence of a weak jump, they recorded the temporal envelope of a single photon emitted on a heralded decay, using a high-bandwidth single-photon detector and a single Rb atom. The relevant time scale is the inverse Rabi frequency $\\Omega^{-1}$ of the driven coupling between $\\lvert g\\rangle$ and $\\lvert e\\rangle$ — the time over which the conditional wavefunction concentrates amplitude in the receiving state. Their measurement placed an *upper bound* of order $\\Omega^{-1}$ on the duration of the transition, consistent with the prediction that the jump is a finite-duration coherent process and not a Dirac delta in time. Hegerfeldt's 1993 analytical result for the no-click conditional evolution [implicit in the MCWF construction of 81] had been theoretical; the Seidler bound was the first empirical statement of finite jump duration.\n\n### Minev 2019: catching the jump mid-flight\n\nThe final move — turning the jump from an *observed* event into a *predicted* and *intercepted* one — was made by Minev, Mundhada, Shankar, Reinhold, Gutiérrez-Jáuregui, Schoelkopf, Mirrahimi and Carmichael in 2019 [5]. Their platform was not an ion but a superconducting transmon with three levels $\\lvert g\\rangle$, $\\lvert e\\rangle$, $\\lvert d\\rangle$ analogous to the V-system of [12]: a strong cycling transition $\\lvert g\\rangle \\leftrightarrow \\lvert d\\rangle$ producing a fluorescence record, and a weak shelving transition $\\lvert g\\rangle \\leftrightarrow \\lvert e\\rangle$ whose rare excitations registered as dark intervals. What was new was the bandwidth — fluorescence was monitored on microsecond time scales, many times faster than the millisecond shelf lifetime — and the use of the resulting record for *real-time prediction*. They observed that the onset of a dark interval is preceded by a brief, deterministic warning: the absence of a click for a duration comparable to the inverse Rabi frequency of the strong transition is, conditioned on shelving having begun, a smoothly increasing probability. With sufficient temporal resolution, this warning is detectable in a single trajectory.\n\nThe experiment then applied a tomographic pulse during the warning window and reconstructed the conditional state. The result: the jump is a smooth, deterministic, coherent traversal from $\\lvert g\\rangle$ to $\\lvert e\\rangle$, parameterised by a polar angle that increases continuously from $0$ to $\\pi/2$ over a time $\\sim \\Omega^{-1}_{\\text{weak}}$. Applying a reversing pulse during the traversal returned the transmon to $\\lvert g\\rangle$ with high fidelity. The jump was caught, characterised, and undone in flight.\n\nThree points of intellectual provenance are worth flagging. First, the theoretical machinery — non-Hermitian no-click evolution, conditional state update on detection, the predictability of an *almost*-jump — was already complete in the Srinivas–Davies–Davies [8] and Carmichael photodetection lineage and was made manifest in the MCWF construction of [10]; Minev et al. cite Carmichael as co-author for precisely this reason. Second, Schrödinger's 1952 demand [6, 7] that any genuine jump should reduce to continuous wave-mechanical evolution was, in a strong technical sense, vindicated: the *individual* jump is continuous; the *statistics* of jumps remain irreducibly Poissonian. Third, the result is consistent with the Seidler bound [4] and resolves the conflation that Bohr's 1913 instantaneous transition is the same object as a modern conditional state update — it is not, and now we have looked at the difference."}, {"id": "what-superseded-what", "title": "What Was Superseded, What Survives, and in Which Regime", "markdown": "## What Was Superseded, What Survives, and in Which Regime\n\nA century of *Quantensprung* has left behind a stratigraphy of equations, each valid in a controlled regime and each routinely deployed outside it. The task of this section is to mark the strata: which formulas remain exact, which are asymptotic, which are pedagogical fossils, and which have been quietly mutilated by the modern literature when the underlying assumptions were dropped without comment.\n\n### Bohr's instantaneous jump: a secular-limit fossil\n\nBohr's 1913 postulate — a discontinuous transition $n \\to m$ accompanied by a monochromatic photon of energy $\\hbar\\omega_{nm} = E_n - E_m$ [1] — survives in modern physics only as the *secular limit* of a more general dynamics. Concretely, if one writes the reduced atomic density matrix in the energy eigenbasis and discards all off-diagonal coherences on a timescale $\\tau \\gg \\omega_{nm}^{-1}, \\gamma^{-1}$, what remains is a Pauli rate equation\n\n$$\\dot{p}_n = \\sum_m \\left(W_{n\\leftarrow m}\\, p_m - W_{m\\leftarrow n}\\, p_n\\right),$$\n\nwhose stationary distribution and detailed-balance structure are exactly Einstein's. As a kinematic statement — \"transitions occur between stationary states\" — Bohr's picture is the diagonal projection of the true dynamics, and it fails whenever (i) the driving field is strong enough that dressed states, not bare states, are the correct asymptotic basis; (ii) the radiation reservoir has structure on the scale of $\\gamma$ (photonic-crystal bandgaps, cavities, sub-radiant manifolds); or (iii) the relevant observable is sensitive to phase, not population. The 2019 Minev experiment [5] is the cleanest demonstration that the \"jump\" is in fact a continuous, predictable Bloch-vector trajectory inside the dressed manifold; Bohr's instantaneity was an artefact of asking only about populations.\n\n### Einstein's coefficients: exact under detailed balance\n\nEinstein's 1917 derivation [2] — the $A_{nm}, B_{nm}, B_{mn}$ relations and the rate equation — does *not* require quantum electrodynamics. It requires only (a) thermal equilibrium with a Planckian reservoir, (b) detailed balance, and (c) the existence of well-defined energy eigenstates with non-degenerate transition frequencies. Within those assumptions the relations\n\n$$\\frac{A_{nm}}{B_{nm}} = \\frac{\\hbar\\omega_{nm}^3}{\\pi^2 c^3}, \\qquad g_n B_{nm} = g_m B_{mn}$$\n\nare exact and remain so under the full QED treatment: $A_{nm}$ is the trace-over-modes of the spontaneous-emission Lindblad rate, and the $B$-coefficients are the corresponding stimulated rates. What the modern literature routinely strips away is the *thermal-reservoir* premise. Quoting \"$A$\" for an emitter inside a structured photonic environment is an abuse: the Purcell factor and the local density of states must intervene, and in a strongly modified reservoir the very notion of an exponential decay (and therefore of a rate) breaks down on the Wigner–Weisskopf timescale.\n\n### Lindblad: complete positivity at the price of Born–Markov\n\nThe Gorini–Kossakowski–Sudarshan–Lindblad (GKSL) generator\n\n$$\\dot{\\rho} = -\\tfrac{i}{\\hbar}[H,\\rho] + \\sum_k \\left(L_k \\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\}\\right)$$\n\nis the *unique* form of a Markovian, time-homogeneous, completely positive, trace-preserving (CPTP) semigroup. Its derivation from a system–bath Hamiltonian requires three independent approximations: Born (weak coupling, factorized state $\\rho_S \\otimes \\rho_B$), Markov (bath correlation time $\\tau_B$ much shorter than the system relaxation time $\\gamma^{-1}$), and the secular/rotating-wave step needed to enforce CP when the system has multiple closely-spaced Bohr frequencies. Each is regularly violated in present-day platforms:\n\n| Regime | Assumption broken | Symptom | Correct framework |\n|---|---|---|---|\n| Strong system–bath coupling | Born | Reservoir state entangled with system; rates depend on $\\rho_S$ | Polaron / reaction-coordinate mapping; HEOM |\n| Structured reservoir (cavity, PhC, sub-radiance) | Markov | Bath memory $\\tau_B \\gtrsim \\gamma^{-1}$; non-exponential decay | Time-convolutionless ME; pseudomode |\n| Near-degenerate transitions | Secular | Rotating-wave-induced loss of CP across $\\omega_{nm} \\sim \\gamma$ doublets | Non-secular Redfield with CP-restoration; coarse-graining |\n| Periodic driving stronger than $\\gamma$ | Time-homogeneity | Floquet sidebands carry decoherence | Floquet–Lindblad with dressed jump operators |\n\nThe honest statement is therefore narrow: GKSL is exact for a CPTP semigroup, and a useful asymptotic limit for a system weakly coupled to a featureless bath. It is *not* a fundamental equation of open-system dynamics, and citing \"the Lindblad equation\" for a transmon hybridized with a lossy resonator [5] is already an approximation whose error one must quantify.\n\n### MCWF and Carmichael trajectories: a gauge among unravelings\n\nThe Monte Carlo wave-function method [10] and its review by Plenio and Knight [11] reproduce the GKSL equation in expectation. Crucially they do not promote the jump to an ontological event: the *same* master equation is unravelled diffusively by homodyne or heterodyne records,\n\n$$d|\\psi\\rangle = \\left(-\\tfrac{i}{\\hbar}H_{\\rm eff} dt + \\sum_k L_k\\, dW_k + \\cdots\\right)|\\psi\\rangle,$$\n\nproducing trajectories with no jumps whatsoever. The choice of unraveling is fixed by the *measurement* one performs on the environment, not by the system's dynamics. Reading the MCWF trajectory as \"the actual history of the atom\" is therefore a category error — it is the conditional history of an atom *given* a perfectly efficient photon-counting record [8, 10]. This point, made forcefully by Wiseman and traceable through Davies, Srinivas, and Belavkin, is silently dropped whenever a numerical simulation is presented as evidence that \"jumps really happen\". The 2019 Minev result restores some ontological weight, but only in a regime where the conditional state is continuously tracked at near-unit efficiency [5].\n\n### Non-Markovian jumps: what Piilo et al. fix\n\nThe principal limitation of the MCWF lineage is that the negative-rate / memory-kernel regime,\n\n$$\\dot{\\rho} = -\\tfrac{i}{\\hbar}[H,\\rho] + \\sum_k \\Gamma_k(t)\\left(L_k \\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\}\\right),\\quad \\Gamma_k(t) \u003c 0\\ \\text{permitted},$$\n\ncannot be unravelled by Poisson jumps with rates $\\Gamma_k(t) |L_k|\\psi\\rangle\\|^2$ once $\\Gamma_k$ becomes negative. The Piilo–Maniscalco–Härkönen–Suominen scheme [9] solves this by introducing *reverse* jumps that, with appropriately weighted probability, undo a previous jump on a member of the ensemble, restoring information that the bath has temporarily stored. The construction makes manifest what every careful reader of [11] already suspected: the Markovian jump is a coarse-graining over bath memory, and the loss of CP at intermediate times is the signature of a system–bath state that the reduced description has forgotten about. The Hartwell–Beige analysis [16] makes a complementary point in a different direction: even in the Markovian regime, photon emission need not occur at a jump instant in every consistent unraveling. Both works should be read as warnings against importing the Markovian jump picture into structured-reservoir physics.\n\n### What survives, in one paragraph\n\nThe kinematic content of Bohr's postulate — that bound systems have discrete eigenstates — is permanent. Einstein's detailed-balance relations are exact wherever a thermal reservoir and well-defined frequencies exist. GKSL is the unique CPTP Markovian semigroup and an excellent approximation in the weak-coupling, fast-bath limit. MCWF and its diffusive cousins are exact numerical unravelings of GKSL, ontologically neutral. The instantaneous Bohr jump and the textbook claim \"spontaneous emission has rate $A$\" are regime-restricted idealizations, valid only when secular and Markov approximations apply. Everything beyond — strong coupling, structured baths, finite-bandwidth detection, the caught-mid-flight trajectory — requires the non-Markovian, non-secular, conditional-state formalism whose foundations the next section examines."}, {"id": "conflation-watch", "title": "Conflation Watch: Five Things Called 'Quantum Jump'", "markdown": "## Conflation Watch: Five Things Called 'Quantum Jump'\n\nThe phrase *Quantensprung* has, over a century, accreted at least five technically distinct referents. They are routinely substituted for one another in pedagogy, in colloquia, and — more damagingly — in the framing of experiments. The substitution is rarely innocent: each referent lives in a different mathematical category (eigenstate, Kraus operator, sample-path event, projector, singular measure), and the conditions under which two of them coincide are stringent and seldom satisfied. What follows separates the five, names the regime in which each is physical, and identifies which are *gauge-like* — artefacts of a representational choice that another, equally valid, representation eliminates.\n\n### (a) The Bohr–Einstein eigenstate transition\n\nThe original object. In Bohr's 1913 atom [1], a *Quantensprung* is a discontinuous change of the stationary-state label $n \\to m$ of an otherwise closed system, accompanied by a monochromatic quantum $h\\nu = E_n - E_m$. Einstein's 1916–17 reformulation [2] equips it with a rate, the spontaneous coefficient $A_{nm}$, and thereby with an irreducibly stochastic ontology that Bohr's original axioms did not contain. Heisenberg's 1925 *Umdeutung* [3] promotes the transition *amplitude* $\\langle m | x | n \\rangle$ to the fundamental dynamical variable, so the \"jump\" survives as an off-diagonal matrix element rather than as a path.\n\nPhysical content. Object (a) is a statement about the spectrum of $H_0$ and about the conserved-energy bookkeeping of an emission/absorption event. It is not a statement about a *time-resolved process* — neither Bohr nor Einstein offered one, and Schrödinger's 1952 polemic [6, 7] correctly insisted that no closed wave equation produces such a process. Modern usage that conflates (a) with a measured trajectory is anachronistic: (a) is a kinematic label, not a dynamical event.\n\n### (b) The photodetector click as a Kraus event on the conditional state\n\nIn the Srinivas–Davies photocounting formalism [8], continuous monitoring of the radiated field by an ideal detector generates two operations on the conditional system state $\\rho_c$: a non-unitary *no-count* evolution\n$$\\dot\\rho_c \\;=\\; -\\,i[H,\\rho_c] \\;-\\; \\tfrac{1}{2}\\{J^\\dagger J,\\rho_c\\} \\;+\\; \\tfrac{1}{2}\\mathrm{Tr}(J^\\dagger J\\,\\rho_c)\\,\\rho_c,$$\nand, at Poisson-distributed click times, an instantaneous Kraus update\n$$\\rho_c \\;\\longrightarrow\\; \\frac{J\\rho_c J^\\dagger}{\\mathrm{Tr}(J^\\dagger J\\,\\rho_c)},\\qquad J=\\sqrt{\\gamma}\\,\\sigma_-.$$\nThis is the only object on the list that is unambiguously *physical and operational*: each click is a record event in the laboratory, time-stamped to within the detector bandwidth. The 1986 single-ion observations [13, 14, 15] and the modern caught-mid-flight experiment [5] are all events of type (b), inferred from the macroscopic fluorescence record of a strong companion transition.\n\nWhat (b) is not: it is not the change of an underlying ontic state. The Kraus update is a Bayesian update of an observer's conditional description given a detection record; the unconditional state $\\bar\\rho = \\mathbb{E}[\\rho_c]$ evolves smoothly under the corresponding Lindbladian and exhibits no jumps at all.\n\n### (c) The numerical event in an MCWF unraveling\n\nThe Monte-Carlo wave-function method of Dalibard–Castin–Mølmer [10], the contemporaneous Dum–Zoller–Ritsch construction, and Carmichael's quantum-trajectory formulation [11] generate sample paths $|\\psi_c(t)\\rangle$ whose ensemble average reproduces the Lindblad solution. A \"jump\" here is a discrete numerical event at which $|\\psi_c\\rangle \\to J|\\psi_c\\rangle / \\|J|\\psi_c\\rangle\\|$.\n\nPhysical status. *The individual jump in (c) is gauge-like.* The same Lindbladian\n$$\\dot\\rho \\;=\\; -i[H,\\rho] \\;+\\; J\\rho J^\\dagger - \\tfrac12\\{J^\\dagger J,\\rho\\}$$\nadmits a continuous family of unravelings parameterized by the measurement scheme one imagines coupling to the bath: direct photodetection (jumps), homodyne ($d\\rho = \\cdots + dW$, diffusion), heterodyne (complex diffusion), adaptive schemes that interpolate. The Wiseman–Milburn family of stochastic master equations makes the point structural: the jump *operator* $J$ is invariant under the unraveling, but whether the trajectory exhibits *jumps* or *diffusion* depends on which fictitious detector one places at infinity. Plenio–Knight [11] are explicit on this. To call the MCWF jump \"the\" physical process is to mistake a representation for the represented.\n\nThe corollary is sharp. An MCWF jump becomes an event of type (b) *if and only if* one actually performs photodetection on the relevant emission channel with unit efficiency. Otherwise (c) and (b) inhabit different categories: (b) lives in the laboratory record, (c) lives in the random-number stream of a simulation.\n\n### (d) Wave-function collapse under projective measurement\n\nVon Neumann's projection postulate sends $|\\psi\\rangle \\to P_n|\\psi\\rangle/\\|P_n|\\psi\\rangle\\|$ on outcome $n$ of an observable with spectral resolution $\\sum_n P_n = \\mathbb{1}$. The \"jump\" here is instantaneous, complete, and indexed by the eigenvalue $n$. It is therefore a *strict special case* of (b), recovered when\n\n(i) the measured operator is sharp (a projector, $J^\\dagger J = P$);\n(ii) the detector is perfectly efficient;\n(iii) the back-action time is short compared to all internal dynamical timescales — formally, the secular/Markov limit in which the no-count evolution between clicks is ignorable.\n\nOutside this limit — i.e. in every real experiment — identifying (d) with (b) is a category error. The Kraus operator of a click is not a projector; the post-click state retains coherences forbidden to a post-projection state. The Belavkin filtering equation makes the distinction sharp: collapse is the strong-measurement, projector-valued limit of the filter, not the filter itself. The vast majority of statements in popular and even graduate-level pedagogy of the form \"the atom collapses into the ground state when a photon is emitted\" silently invoke (d) while pointing at (b).\n\n### (e) The singular component of a stochastic-master-equation trajectory\n\nIn weak continuous monitoring — homodyne with finite local-oscillator strength, photon counting at sub-unit efficiency $\\eta \u003c 1$, hybrid schemes — the conditional state obeys a stochastic master equation whose increment decomposes into a smooth (Wiener) drift and a singular (Poisson) jump part:\n$$d\\rho_c \\;=\\; \\mathcal{L}\\rho_c\\,dt \\;+\\; \\mathcal{H}[J]\\rho_c\\,dW \\;+\\; \\mathcal{G}[J]\\rho_c\\,(dN - \\eta\\langle J^\\dagger J\\rangle\\,dt).$$\nThe jumps survive as the support of the point-process $dN$ but are now interleaved with diffusion, and their *visibility* depends on $\\eta$. In the limit $\\eta \\to 0$ they vanish into the diffusion; in the limit $\\eta \\to 1$ with vanishing local oscillator they reduce to (b). Object (e) is therefore a *continuous-deformation family* connecting (b) and the no-jump diffusive unravelings of (c). Recent non-Markovian generalizations [9] add memory kernels but preserve this structural split.\n\n### What is physical, what is gauge\n\nA compact taxonomy:\n\n| Object | Lives in | Physical? | Gauge-like? | Coincides with (b) when |\n|---|---|---|---|---|\n| (a) Bohr–Einstein eigenstate transition | spectrum of $H_0$ | kinematic only | no (it is a label) | — |\n| (b) Photodetector click | measurement record | yes | no | by definition |\n| (c) MCWF numerical jump | simulation sample path | only as statistics | yes (unraveling choice) | photodetection unraveling with $\\eta = 1$ |\n| (d) Projective collapse | postulated update rule | idealization | no, but limiting | $J^\\dagger J$ a projector, $\\eta = 1$, secular limit |\n| (e) SME singular component | conditional dynamics under weak monitoring | yes (statistics + record) | partially ($\\eta$-dependent visibility) | $\\eta \\to 1$ with point-process detection |\n\nTwo operational lessons follow. *First*, \"we observed a quantum jump\" is a meaningful empirical claim only at the level of (b) — a click and its conditional back-action — and the 1986 triple [13, 14, 15] and the 2019 Minev experiment [5] are properly read this way. *Second*, \"quantum jumps are real\" and \"wave-function collapse is real\" are not the same proposition: the former asserts the existence of (b); the latter asserts (d) as fundamental. The Belavkin–Carmichael lineage shows that (b) can be derived without postulating (d), which is what Schrödinger's 1952 complaint [6, 7] anticipated and what the smooth, predictable mid-flight trajectory of Minev et al. [5] retrospectively vindicated: the click is real, the projector is a limit."}, {"id": "frontier-and-open-problems", "title": "Frontier: Predictable Jumps, Non-Markovian Memory, and the Schrödinger Vindication", "markdown": "## Frontier: Predictable Jumps, Non-Markovian Memory, and the Schrödinger Vindication\n\nThe century that began with Bohr's discontinuous *Quantensprung* did not end with a Bohrian instant. By the late 2010s, three independent threads — circuit-QED interception, photon-correlation bounds on jump duration, and non-Markovian unravelings — had converged on a picture in which the single jump is a *continuous, partially deterministic* segment of conditional dynamics, while only the *ensemble* statistics retain the irreducible randomness Einstein installed in 1916. This section maps the live frontier and the philosophical aftershock it carried back to 1952.\n\n### 1. The Minev event and its progeny\n\nThe Minev *et al.* experiment [5] occupies a unique position in the lineage because it does not merely *observe* a jump in the manner of [13, 15] — it intercepts one. The setup is a three-level transmon driven Λ-style by a strong bright-channel Rabi tone $\\Omega_{BG}$ and a weak dark-channel drive $\\Omega_{DG}$, with the bright fluorescence dispersively heterodyned. A jump $|G\\rangle \\to |D\\rangle$ is heralded operationally as a *click-free interval* in the bright record of duration $\\Delta t_{\\text{catch}} \\gtrsim 2\\,\\mu\\mathrm{s}$. Conditional on that herald, the state vector traces a smooth, repeatable arc in the $(G,D)$ subspace — the *flight* — describable by the no-jump non-Hermitian effective Hamiltonian\n\n$$H_{\\text{eff}} = H_S - \\tfrac{i\\hbar}{2} \\sum_k L_k^\\dagger L_k,$$\n\nrestricted to the Bright-vacuum sector. Applying a calibrated $\\pi$-pulse along the predicted instantaneous Bloch tangent reverses the trajectory with $\\sim 73\\%$ fidelity. The conclusion: the *individual* jump, viewed at the resolution of the measurement record, is not Poissonian *during* its flight; only its onset time is.\n\nThree follow-up directions are now active. The first is the predictive/feedback extension into bosonic-code stabilization, where continuous monitoring of error syndromes is being merged with jump-trajectory–conditioned control to extend cat- and binomial-qubit lifetimes — closely related to the \"passive\" autonomous architectures recently demonstrated for concatenated bosonic memories ([Hardware-efficient QEC via concatenated bosonic qubits, Nature 2025](https://www.nature.com/articles/s41586-025-08642-7)). The second is jump-based feedback for entanglement stabilization, whose original 2007 formulation by Carvalho and Hope [17] now reads as the analytic skeleton of the Minev reversal in the two-qubit limit. The third — methodologically the most recent — is the Deterministic Quantum Jump algorithm of Meschede and Mathey [18], which exploits precisely the regime $\\Omega_{DG} \\ll \\Omega_{BG}$ in which the no-jump evolution is *quasi-classical* between rare clicks, turning Minev's experimental observation into a simulation efficiency.\n\n### 2. Finite duration and the death of \"instantaneous\"\n\nSeidler *et al.* [4] used the temporal correlation of cascade-decay photon pairs in $^{87}$Rb to bound the jump duration at $\\tau_J \\le 21 \\pm 11\\,\\mathrm{ps}$, consistent with the inverse Rabi/decay frequency of the intermediate transition. The bound is conceptually larger than its number: it kills the textbook idealization that quantum jumps are points on the time axis. In the Markov limit the projector formalism *averages over* an internal time scale of order $\\Omega^{-1}$ which the Lindblad equation is structurally blind to. The 1993 Hegerfeldt argument that the conditional evolution between clicks is continuous (mentioned in the *Neglected* register) and the Minev flight are different windows onto the same fact: the discontinuity is a coarse-graining artefact.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eAnatomy of a caught jump\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"20\" y=\"24\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eBright channel photodetection record\u003c/text\u003e\u003cline x1=\"20\" y1=\"60\" x2=\"700\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cg stroke=\"#7aa2ff\" stroke-width=\"2\"\u003e\u003cline x1=\"40\" y1=\"40\" x2=\"40\" y2=\"60\"/\u003e\u003cline x1=\"70\" y1=\"40\" x2=\"70\" y2=\"60\"/\u003e\u003cline x1=\"95\" y1=\"40\" x2=\"95\" y2=\"60\"/\u003e\u003cline x1=\"130\" y1=\"40\" x2=\"130\" y2=\"60\"/\u003e\u003cline x1=\"160\" y1=\"40\" x2=\"160\" y2=\"60\"/\u003e\u003cline x1=\"195\" y1=\"40\" x2=\"195\" y2=\"60\"/\u003e\u003cline x1=\"225\" y1=\"40\" x2=\"225\" y2=\"60\"/\u003e\u003cline x1=\"260\" y1=\"40\" x2=\"260\" y2=\"60\"/\u003e\u003cline x1=\"540\" y1=\"40\" x2=\"540\" y2=\"60\"/\u003e\u003cline x1=\"565\" y1=\"40\" x2=\"565\" y2=\"60\"/\u003e\u003cline x1=\"600\" y1=\"40\" x2=\"600\" y2=\"60\"/\u003e\u003cline x1=\"635\" y1=\"40\" x2=\"635\" y2=\"60\"/\u003e\u003cline x1=\"670\" y1=\"40\" x2=\"670\" y2=\"60\"/\u003e\u003c/g\u003e\u003crect x=\"285\" y=\"36\" width=\"240\" height=\"28\" fill=\"none\" stroke=\"#ffb86b\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"295\" y=\"80\" fill=\"#ffb86b\" font-size=\"14\" font-family=\"serif\"\u003eclick-free interval ⇒ herald: jump in flight\u003c/text\u003e\u003ctext x=\"20\" y=\"130\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eConditional state on (|G⟩,|D⟩) Bloch slice\u003c/text\u003e\u003ccircle cx=\"360\" cy=\"260\" r=\"90\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"358\" y=\"160\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e|G⟩\u003c/text\u003e\u003ctext x=\"358\" y=\"370\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e|D⟩\u003c/text\u003e\u003cpath d=\"M 360 170 C 430 200 430 320 360 350\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.5\"/\u003e\u003ccircle cx=\"425\" cy=\"260\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"440\" y=\"265\" fill=\"#7ee0a3\" font-size=\"13\" font-family=\"serif\"\u003edeterministic flight\u003c/text\u003e\u003cpath d=\"M 360 350 C 290 320 290 200 360 170\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"215\" y=\"200\" fill=\"#ff7a90\" font-size=\"13\" font-family=\"serif\"\u003ereverse pulse\u003c/text\u003e\u003ctext x=\"20\" y=\"395\" fill=\"#e8e6e1\" font-size=\"12\" font-family=\"serif\"\u003eAfter Minev et al. (Nature 570, 200, 2019) [5]. Discrete Poissonian onset ≠ discrete flight.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: A jump as resolved by the Minev protocol. Bright-channel clicks (blue) define a Poissonian record; their absence over a window $\\Delta t_{\\text{catch}}$ heralds a flight in the $(G,D)$ subspace whose Bloch-sphere arc (green) is smooth and deterministic, and which a calibrated $\\pi$-pulse can reverse (pink).*\n\n### 3. Memory: non-Markovian jumps with reverse events\n\nWhen the bath has nontrivial spectral structure — photonic crystals, structured cavities, finite-size phonon reservoirs — the Lindblad rate $\\gamma(t)$ acquires intervals of *negativity* and the standard MCWF loses unitarity of the conditional state. The Piilo–Maniscalco–Härkönen–Suominen non-Markovian quantum-jump (NMQJ) algorithm [9] resolves this by correlating distinct ensemble realizations and introducing *reverse jumps* that undo earlier ones, exactly canceling the negative-rate contribution while keeping each trajectory normalized. Reviews and refinements through 2025 ([NMQJ review, arXiv:2605.07797](https://arxiv.org/abs/2605.07797); [driven NMQJ, arXiv:2502.00764](https://arxiv.org/abs/2502.00764)) make explicit a fact that should always have been visible: in a non-Markovian setting the jump is no longer a one-way Poissonian event but a node in a *bidirectional* stochastic process whose time-reversed branch is physically reabsorption from the memory kernel. Field-theoretic generalizations such as the replica-Keldysh formulation of [19] embed this directly in a Keldysh contour, making jump statistics an order parameter rather than an algorithmic accident.\n\n### 4. Autonomous stabilization and jump-based control\n\nThe jump operator has migrated from passive book-keeping to active resource. Engineered dissipation now stabilizes target subspaces by *driving* the system toward eigenstates of $L_k$ — first explored in charge-qubit decoherence engineering [20] and matured into the autonomous QEC schemes underlying current bosonic-code memories. Jump-conditioned feedback for entanglement [17] and jump-based metrological protocols ([21], with the recent narrowband single-atom jump photodetector of Zarraoa *et al.* [22]) demonstrate that the click record is not a nuisance to be averaged away but a primary measurement resource. The complementary observation — that *photon emission without jumps* is a well-defined regime when the unraveling is homodyne rather than direct-detection [16] — reminds us that whether jumps are \"there\" at all depends on the meter, not on the system.\n\n### 5. The Schrödinger vindication, carefully stated\n\nSchrödinger's 1952 polemic [6, 7] argued that no closed wave equation could *generate* a stochastic ontology of jumps. The argument was technically correct and metaphysically anachronistic. The Lindblad–trajectory framework that emerged from Davies, Srinivas, Carmichael and Dalibard–Castin–Mølmer does generate jump statistics, but only after one *opens* the system and conditions on a measurement record. What the Minev experiment vindicated is the *narrower* Schrödinger claim that an individual transition, when one has sufficient information to condition on it, is a *continuous deterministic process*. The Bohr–Einstein randomness survives — but it now lives entirely in the *onset time* of the flight, not in the flight itself. The dichotomy \"Bohr right vs Schrödinger right\" is dissolved: Bohr's instant is the marginal statistic; Schrödinger's continuity is the conditional trajectory.\n\n### 6. Open problems\n\nThree remain genuinely unsettled.\n\n1. **A covariant jump formalism.** The Lindblad–MCWF apparatus is non-relativistic to its bones; promoting jumps to a Tomonaga–Schwinger foliation runs into Lorentz-noncovariance of the click time, as long flagged in the GRW collapse literature and visible in current attempts ([Tomonaga–Schwinger analysis of nonlinear QM, Phys. Lett. B 2025](https://www.sciencedirect.com/science/article/pii/S0370269325008111)).\n2. **Strongly non-Markovian and structured reservoirs.** NMQJ and its driven extensions are tractable for moderate memory; for strongly non-Markovian regimes (sub-ohmic baths, photonic-bandgap edges) the very factorization \"system + jump operator\" is ambiguous, and exceptional-point organization of jump dynamics [23] is just beginning to map the relevant operator geometry.\n3. **The operational status of the trajectory.** The MCWF jump is unraveling-dependent; the homodyne unraveling has none [16]. Whether the *trajectory itself* is an ontological object or a record-relative bookkeeping device remains the live question — sharpened, not closed, by Minev's interception. The Belavkin filtering equation (still under-cited; see §1) gives a rigorous answer in one direction; an experimentally falsifiable answer in the other has not been delivered.\n\nSources:\n- [Minev et al., Nature 2019 (catch and reverse)](https://www.nature.com/articles/s41586-019-1287-z)\n- [Seidler et al., arXiv:1812.00129 (jump-duration bound)](https://arxiv.org/abs/1812.00129)\n- [Piilo et al., arXiv:0706.4438 (NMQJ)](https://arxiv.org/abs/0706.4438)\n- [NMQJ review, arXiv:2605.07797](https://arxiv.org/abs/2605.07797)\n- [Driven NMQJ, arXiv:2502.00764](https://arxiv.org/abs/2502.00764)\n- [Hardware-efficient QEC via bosonic qubits, Nature 2025](https://www.nature.com/articles/s41586-025-08642-7)\n- [Quanta Magazine: Quantum Leaps Take Time (2019)](https://www.quantamagazine.org/quantum-leaps-long-assumed-to-be-instantaneous-take-time-20190605/)\n- [Yale News, Minev et al. press release](https://news.yale.edu/2019/06/03/physicists-can-predict-jumps-schrodingers-cat-and-finally-save-it)\n- [Tomonaga–Schwinger analysis of nonlinear QM, Phys. Lett. B 2025](https://www.sciencedirect.com/science/article/pii/S0370269325008111)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent six sections dissecting a word. What follows is what I actually believe, stated in the first person and without the historian's protective haze.\n\n### (a) What I will defend with my reputation\n\nThe Lindblad–GKS skeleton — Markovian, completely positive, trace-preserving — is the correct minimal description of a quantum system whose environment is memoryless on the relevant timescale, and the jump operators $L_k$ appearing in it are not metaphysics but bookkeeping. I will defend three propositions without qualification. First, the *statistical* content of a \"quantum jump\" is unitarily invariant under the gauge $L_k \\to U_{kj} L_j + \\alpha_k \\mathbb{1}$, so any claim that one unraveling is \"more real\" than another — photon counting over homodyne, in particular — is a category error. Second, the 1986 triple (Nagourney–Sandberg–Dehmelt; Sauter–Neuhauser–Blatt–Toschek; Bergquist–Hulet–Itano–Wineland) settled the empirical question Schrödinger posed in 1952: discontinuous telegraph signals at the single-quantum level exist as features of the measurement record. Third, Minev et al. (2019) settled a *different* question Schrödinger would have recognized as his: the conditional state, between clicks, evolves smoothly and — under sufficient prior information — deterministically. Both can be true because they are statements about distinct objects: the record versus the filtered state.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions get waved through.\n\nThe **Markov approximation** is invoked far past its domain. The standard Born–Markov derivation requires $\\tau_B \\ll \\tau_S$ where $\\tau_B$ is the bath correlation time, but circuit-QED experiments routinely operate where $\\kappa$ and the relevant transmon dispersive shifts are within an order of magnitude of structured-environment features (Purcell filters, two-level-system baths). The Lindblad form is then *imposed* as a regulator, not derived; the resulting \"jump rates\" inherit unstated cutoff dependence.\n\nThe **secular approximation** silently strips cross-terms whenever multiple Lindblad channels have near-degenerate frequencies. In multilevel systems with quasi-degenerate decay paths this is wrong in a way that affects predicted jump statistics, not just lineshapes — and the literature on \"engineered dissipation\" rarely audits it.\n\nThe **detector idealization** — projective, instantaneous, unit-efficiency POVM elements — is the move that lets \"jump\" and \"collapse\" be quietly identified. Real detectors have dead time, dark counts, and finite bandwidth; the Belavkin filter handles this exactly, but the physics-side derivations almost never carry the imperfect-detection terms through to the final stochastic master equation.\n\n### (c) The three open questions I would actually work on\n\n1. **Optimal prediction and reversal of jumps in structured-bath circuit-QED**, pushing Minev-style catch-and-reverse into the genuinely non-Markovian regime. *Because this is where the Markov skeleton breaks and the experiments are now possible.*\n2. **An operational dictionary between MCWF unravelings and Belavkin filters with imperfect detection.** *The physics and EE literatures still use disjoint vocabularies for the same equation; the cost is unaudited approximations.*\n3. **A regime-resolved derivation of when \"jump\" and \"collapse\" can be identified, and when they cannot.** *The conflation is pedagogical malware; a clean theorem with stated hypotheses would do real work.*\n\n### Reading path\n\n1. Einstein 1916–17 on $A$ and $B$ coefficients — the irreversible, stochastic event was already here; Bohr's jumps were not.\n2. Schrödinger, *Are there quantum jumps?* (1952) — read the technical complaint, not the slogan.\n3. Nagourney–Sandberg–Dehmelt, *PRL* 56 (1986); Sauter et al. and Bergquist et al., *PRL* 57 (1986) — the empirical settlement, read as the triple it was.\n4. Dalibard–Castin–Mølmer (1992) alongside Carmichael's *Open Systems Approach* (1993) — two routes to the same unraveling; reading them together inoculates against thinking either is canonical.\n5. Minev et al., *Nature* 570 (2019) — the smooth, predictable jump; Schrödinger's complaint vindicated inside the formalism he distrusted."}], "references": [{"n": 1, "title": "On the Constitution of Atoms and Molecules", "authors": ["Niels Bohr"], "year": 1913, "venue": "Philosophical Magazine Series 6, vol. 26, 1–25", "url": "https://doi.org/10.1080/14786441308634955", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Zur Quantentheorie der Strahlung", "authors": ["Albert Einstein"], "year": 1917, "venue": "Physikalische Zeitschrift 18, 121–128", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Über quantentheoretische Umdeutung kinematischer und mechanischer Beziehungen", "authors": ["Werner Heisenberg"], "year": 1925, "venue": "Zeitschrift für Physik 33, 879–893", "url": "https://doi.org/10.1007/BF01328377", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Upper bound on the duration of quantum jumps", "authors": ["Mathias A. Seidler", "Ricardo Gutiérrez-Jáuregui", "Alessandro Cerè", "Rocío Jáuregui", "Christian Kurtsiefer"], "year": 2018, "venue": "arXiv", "url": "http://arxiv.org/abs/1812.00129v1", "cited_by": null, "bucket": "arXiv"}, {"n": 5, "title": "To catch and reverse a quantum jump mid-flight", "authors": ["Z. K. Minev", "S. O. Mundhada", "S. Shankar", "P. Reinhold", "R. Gutierrez-Jauregui", "R. J. Schoelkopf", "M. Mirrahimi", "H. J. Carmichael"], "year": 2018, "venue": "arXiv", "url": "http://arxiv.org/abs/1803.00545v3", "cited_by": null, "bucket": "arXiv"}, {"n": 6, "title": "Are There Quantum Jumps? Part I", "authors": ["Erwin Schrödinger"], "year": 1952, "venue": "British Journal for the Philosophy of Science 3(10), 109–123", "url": "https://doi.org/10.1093/bjps/III.10.109", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Are There Quantum Jumps? Part II", "authors": ["Erwin Schrödinger"], "year": 1952, "venue": "British Journal for the Philosophy of Science 3(11), 233–242", "url": "https://doi.org/10.1093/bjps/III.11.233", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Photon counting probabilities in quantum optics", "authors": ["M. D. Srinivas", "E. B. Davies"], "year": 1981, "venue": "Optica Acta 28(7), 981–996", "url": "https://doi.org/10.1080/713820643", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Non-Markovian quantum jumps", "authors": ["J. Piilo", "S. Maniscalco", "K. Harkonen", "K. -A. Suominen"], "year": 2007, "venue": "arXiv", "url": "http://arxiv.org/abs/0706.4438v3", "cited_by": null, "bucket": "arXiv"}, {"n": 10, "title": "Wave-function approach to dissipative processes in quantum o
