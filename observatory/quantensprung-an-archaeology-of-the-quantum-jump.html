ptics", "authors": ["Jean Dalibard", "Yvan Castin", "Klaus Mølmer"], "year": 1992, "venue": "Physical Review Letters 68(5), 580–583", "url": "https://doi.org/10.1103/PhysRevLett.68.580", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "The quantum-jump approach to dissipative dynamics in quantum optics", "authors": ["M. B. Plenio", "P. L. Knight"], "year": 1998, "venue": "Reviews of Modern Physics 70(1), 101–144", "url": "https://doi.org/10.1103/RevModPhys.70.101", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Possibility of Direct Observation of Quantum Jumps", "authors": ["R. J. Cook", "H. J. Kimble"], "year": 1985, "venue": "Physical Review Letters 54(10), 1023–1026", "url": "https://doi.org/10.1103/PhysRevLett.54.1023", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Shelved Optical Electron Amplifier: Observation of Quantum Jumps", "authors": ["W. Nagourney", "J. Sandberg", "H. Dehmelt"], "year": 1986, "venue": "Physical Review Letters 56(26), 2797–2799", "url": "https://doi.org/10.1103/PhysRevLett.56.2797", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Observation of Quantum Jumps", "authors": ["Th. Sauter", "W. Neuhauser", "R. Blatt", "P. E. Toschek"], "year": 1986, "venue": "Physical Review Letters 57(14), 1696–1698", "url": "https://doi.org/10.1103/PhysRevLett.57.1696", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Observation of Quantum Jumps in a Single Atom", "authors": ["J. C. Bergquist", "R. G. Hulet", "W. M. Itano", "D. J. Wineland"], "year": 1986, "venue": "Physical Review Letters 57(14), 1699–1702", "url": "https://doi.org/10.1103/PhysRevLett.57.1699", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "Photon emission without quantum jumps", "authors": ["Thomas Hartwell", "Daniel Hodgson", "Huda Alshemmari", "Gin Jose", "Almut Beige"], "year": 2025, "venue": "arXiv", "url": "http://arxiv.org/abs/2509.01702v2", "cited_by": null, "bucket": "arXiv"}, {"n": 17, "title": "Stabilising entanglement by quantum jump-based feedback", "authors": ["A. R. R. Carvalho", "J. J. Hope"], "year": 2007, "venue": "arXiv", "url": "http://arxiv.org/abs/0705.3492v1", "cited_by": null, "bucket": "arXiv"}, {"n": 18, "title": "Deterministic Quantum Jump (DQJ) Method for Weakly Dissipative Systems", "authors": ["Marcus Meschede", "Ludwig Mathey"], "year": 2026, "venue": "arXiv", "url": "http://arxiv.org/abs/2603.04066v1", "cited_by": null, "bucket": "arXiv"}, {"n": 19, "title": "Replica Keldysh field theory of quantum-jump processes: General formalism and application to imbalanced and inefficient fermion counting", "authors": ["Felix Kloiber-Tollinger", "Lukas M. Sieberer"], "year": 2026, "venue": "Zenodo (CERN European Organization for Nuclear Research)", "url": "https://doi.org/10.5281/zenodo.17949002", "cited_by": 0, "bucket": "recent"}, {"n": 20, "title": "Engineering Progressive Decoherence with Quantum Jumps in Charge Qubit", "authors": ["Y. D. Wang", "Y. B. Gao", "C. P. Sun"], "year": 2002, "venue": "arXiv", "url": "http://arxiv.org/abs/quant-ph/0212088v3", "cited_by": null, "bucket": "arXiv"}, {"n": 21, "title": "Quantum Jump Metrology", "authors": ["Lewis A. Clark", "Adam Stokes", "Almut Beige"], "year": 2018, "venue": "arXiv", "url": "http://arxiv.org/abs/1811.01004v2", "cited_by": null, "bucket": "arXiv"}, {"n": 22, "title": "Quantum jump photodetector for narrowband photon counting with a single atom", "authors": ["Laura Zarraoa", "Romain Veyron", "Tomas Lamich", "Lorena C. Bianchet", "Morgan W. Mitchell"], "year": 2024, "venue": "arXiv", "url": "http://arxiv.org/abs/2403.08674v2", "cited_by": null, "bucket": "arXiv"}, {"n": 23, "title": "Graph Symmetry Organizes Exceptional Dynamics in Open Quantum Systems", "authors": ["Eric R. Bittner", "Bhavay Tyagi", "Kevin Baßler"], "year": 2026, "venue": "Research Square", "url": "https://doi.org/10.21203/rs.3.rs-9105173/v1", "cited_by": 0, "bucket": "recent"}], "nsec": 8, "nref": 23, "teaser": "From Bohr's discontinuity to the caught-mid-flight trajectory — a century of a contested word"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
