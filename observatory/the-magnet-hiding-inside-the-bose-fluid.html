<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Magnet Hiding Inside the Bose Fluid", "alternativeHeadline": "bose hubbard physics beyond superfluidity or condensation, some spin correlation?", "name": "bose hubbard physics beyond superfluidity or condensation, some spin correlation?", "description": "Spin order, counterflow, and the Mott-insulating majority of the Bose–Hubbard phase diagram — from Kramers (1934) to counterflow superfluidity (2025).", "inLanguage": "en", "keywords": ["bose hubbard physics beyond superfluidity or condensation, some spin correlation?", "two-component Bose–Hubbard model", "spinor (spin-1) Bose–Hubbard model", "bosonic superexchange", "pseudospin-1/2 XXZ magnetism of lattice bosons", "counterflow superfluid / supercounterfluid (SCF)", "spin-Mott insulator", "Matsubara–Matsuda hard-core boson ↔ spin-1/2 correspondence", "boson Hubbard model (Fisher et al.'s own term)", "quantum cell model for bosons (Gersch–Knollman)", "bosonic Kugel–Khomskii / spin-orbital exchange", "spin-singlet and spin-nematic Mott phases"], "about": [{"@type": "Thing", "name": "bose hubbard physics beyond superfluidity or condensation, some spin correlation?"}, {"@type": "Thing", "name": "two-component Bose–Hubbard model"}, {"@type": "Thing", "name": "spinor (spin-1) Bose–Hubbard model"}, {"@type": "Thing", "name": "bosonic superexchange"}, {"@type": "Thing", "name": "pseudospin-1/2 XXZ magnetism of lattice bosons"}, {"@type": "Thing", "name": "counterflow superfluid / supercounterfluid (SCF)"}, {"@type": "Thing", "name": "spin-Mott insulator"}, {"@type": "Thing", "name": "Matsubara–Matsuda hard-core boson ↔ spin-1/2 correspondence"}], "articleSection": "DEEP DIVE", "datePublished": "2026-08-07", "dateModified": "2026-08-07", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-magnet-hiding-inside-the-bose-fluid.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-magnet-hiding-inside-the-bose-fluid.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Four Origins, One Misnamed Model: Kramers, Matsubara–Matsuda, Gersch–Knollman, Hubbard Four Origins, One Misnamed Model: Kramers, Matsubara–Matsuda, Gersch–Knollman, Hubbard The phrase \"spin correlations in the Bose–Hubbard model\" is a four-way collision of independent lineages, and the model's name credits none of them correctly. One lineage supplies the mechanism by which localized degrees of freedom talk to each other at second order in tunnelling; one supplies the dictionary under which bosonic and magnetic language describe the same Hilbert space; one supplies the Hamiltonian ; and one supplies half the name while having nothing to do with bosons. Sorting these out is not antiquarianism. Each mis-crediting travels with a physics error attached — a sign, an assumption, or a phase count — and those errors are still in circulation. Lineage 1: Kramers 1934, and what \"super\" meant Kramers asked how paramagnetic ions in a crystal — Mn^{2+} in MnO, with no appreciable direct orbital overlap, separated by an intervening closed-shell O^{2-} — nonetheless couple strongly enough to order antiferromagnetically . His answer: the coupling is mediated . Virtual admixture of excited configurations in which an anion electron is promoted onto a magnetic cation generates an effective cation–cation exchange. The paper is in French, in a Dutch journal, published a year before the Heisenberg exchange formalism had settled into textbooks and three decades before anyone wrote a second-quantized lattice model with an on-site U. The word super in \"superexchange\" refers precisely to this: exchange achieved over and above direct overlap, through an intermediary. Status: established. Van Vleck's 1977 Nobel lecture, delivered in the year Anderson shared the prize, places Kramers explicitly in the exchange lineage . Kramers never received a Nobel Prize. The historically honest name \"Kramers–Anderson superexchange\" survives in the oxide-magnetism literature and is essentially absent from the ultracold-atom literature. Lineage 2: Anderson 1950, and the sign that is Pauli's Anderson recast the mechanism as kinetic exchange within a single-band model: two localized electrons on adjacent sites, hopping t, on-site repulsion U, virtual doubly-occupied intermediate state, second-order perturbation theory . The result is antiferromagnetic — because Pauli exclusion permits the virtual doublon only in the spin-singlet channel, so only the singlet gets lowered by -4t^2/U. The systematic version of this calculation, the canonical (Schrieffer–Wolff-type) transformation that generates constrained hopping plus Heisenberg exchange to all orders in a controlled expansion, is Chao, Spałek and Oleś in 1977 — the t–J model, a decade before the name and the standard attribution. The multi-flavour generalization, with coupled spin and pseudospin sectors and anisotropic, sign-tunable couplings derived from a degenerate Hubbard model, is Kugel and Khomskii in 1973, in Russian . Both are structural ancestors of every \"we derive a novel XXZ model for two-species bosons\" paper written since 2002; both are routinely uncited there. Two conflations to name now, because they propagate through everything that follows. First: the ultracold \"superexchange\" is not superexchange. It is Anderson kinetic exchange with direct nearest-neighbour tunnelling between lattice sites. There is no bridging anion, nothing is exchanged through an intermediary, and papers that invoke \"the superexchange mechanism\" as though a mediating orbital were involved are wrong about their own apparatus. The name is inherited terminology, not a mechanism claim. Second: J=4t^2/U 0 is a fermionic statement. For two distinguishable bosonic species the virtual double occupancy carries a Bose enhancement rather than a Pauli blockade, and the transverse exchange emerges with the opposite sign, i.e. XY- ferro magnetic transverse coupling, with J z changing sign as the interaction anisotropy U {ab}/U {aa,bb} is tuned. This is why building a bosonic antiferromagnet required deliberately engineering a sign flip rather than merely cooling [6, 7] — a point Section 3 returns to in detail. Lineage 3: Matsubara–Matsuda 1956, the dictionary The structural fact on which this entire dossier rests is not about magnets or about bosons but about the identity of the two descriptions. Matsubara and Matsuda, modelling liquid helium on a lattice, observed that a hard-core boson site has exactly two states, 0\\rangle and 1\\rangle, and mapped them onto spin-\\tfrac12 : Under this substitution the hard-core Bose–Hubbard Hamiltonian becomes the XXZ magnet in a longitudinal field, with the correspondences that follow immediately: superfluidity \\leftrightarrow transverse (XY) spin order, \\langle b\\rangle \\leftrightarrow \\langle S^+\\rangle; the Mott/charge-density-wave insulator \\leftrightarrow Ising order along z; chemical potential \\leftrightarrow longitudinal field; and the supersolid \\leftrightarrow coexisting Ising and XY order, the line that leads to Matsuda–Tsuneto (1970) and Liu–Fisher (1973) (verify). Matsubara and Matsuda were explicit that this goes beyond the Yang–Lee lattice-gas/Ising correspondence, which \"did not take into consideration the vector character of spins\" and thereby discarded the transverse-exchange term that carries all the quantum dynamics. Status: established, and chronically uncited. This is 1956 — seven years before the bosonic lattice Hamiltonian was written down in the form we use. Cold-atom papers regularly deploy the mapping with no citation at all, or attribute it vaguely to Holstein–Primakoff, which is a different (large-S, approximate) transformation in the opposite direction. Lineage 4: Gersch–Knollman 1963 — and Hubbard 1963 Gersch and Knollman wrote the Bose–Hubbard Hamiltonian : as a \"quantum cell model\" for a repulsive Bose fluid in the liquid-helium tradition, including the physical mechanism — competition between on-site number localization and delocalization into the k=0 state — and an explicit instability of the localized description toward the condensate at a critical density. Twenty-six years before Fisher, Weichman, Grinstein and Fisher supplied the Mott lobes, the particle–hole asymmetry, the two distinct universality classes at the transition, and the Bose glass . Hubbard's 1963 paper , published the same year, treats correlations of electrons in narrow bands. It is a fine paper. It has no bosons in it. Three credit failures, graded: Claim Status Evidence --- --- --- Gersch–Knollman introduced the model \"in the context of granular superconductors\" folklore, and false Their paper is a cell model of a repulsive Bose fluid . The granular-superconductor / Josephson-array lineage is a separate convergent development, retrofitted onto them — propagated largely by Wikipedia — and it rests on the rotor conflation below. The contraction \"Bose–Hubbard\" has an identifiable coiner disputed / murky FWGF write \"boson Hubbard model\" . The contraction is later and diffuse; it is in common use in the quantum-Monte-Carlo literature by the early 1990s. I cannot pin a first user, and will not invent one. The boson\\leftrightarrowspin mapping is a modern cold-atom construction false Matsubara–Matsuda 1956 , exact for hard-core bosons, stated with the superfluid/Ising dictionary explicit. A fourth conflation belongs here because it is the load-bearing one for the origin myth: the Bose–Hubbard model is not the quantum-rotor / Josephson-junction-array model. They agree only at large integer filling, where number fluctuations are small and n i may be treated as an unbounded integer conjugate to a phase \\varphi i. The rotor model has no particle–hole asymmetry, no lobe structure in \\mu, no hard-core constraint — and therefore cannot produce the distinction between the generic (z=2, mean-field-like) transition crossing a lobe boundary and the fixed-density lobe-tip transition in the (d{+}1)-dimensional XY class . Those are exactly the features that make the model interesting, and exactly what the granular-superconductor origin story quietly discards. The structural thesis What survives from these four lineages is a single claim that organizes the rest of this dossier: spin language and boson language are two coordinate systems on one Hilbert space, and the older one is the spin language. Under Matsubara–Matsuda the hard-core superfluid–insulator transition is a magnetic transition; asking whether the \"real\" physics is charge or spin is asking which chart you have drawn on the manifold. Which coordinate system is convenient is set by what the experiment couples to — time-of-flight interferometry reads \\langle b\\rangle, site-resolved imaging reads \\langle S^z\\rangle, and spin-resolved counterflow measurements read \\langle a^\\dagger b\\rangle, which has no name in either chart alone. The consequence, developed in Section 4, is that \"beyond superfluidity or condensation\" is not a fringe corner of this model. Once the hard-core constraint is relaxed, disorder admitted, or an internal degree of freedom added, the phases that are neither superfluid nor Mott — Bose glass, counterflow superfluid, spin-Mott, nematic, singlet — occupy most of the phase diagram. The two-phase cartoon is an artifact of studying the one-component clean model and calling it the model. The Exact Dictionary: Hard-Core Bosons Are an XXZ Magnet The Exact Dictionary: Hard-Core Bosons Are an XXZ Magnet The single most consequential structural fact in this subject predates the Bose–Hubbard model by seven years and was published in Kyoto: Matsubara and Matsuda's demonstration that a lattice Bose fluid with infinite on-site repulsion is a spin-1/2 magnet — not analogous to one, not approximately one, but the same algebra on the same Hilbert space . The mapping Hard-core bosons have a two-dimensional local Hilbert space, \\{ 0\\rangle i, 1\\rangle i\\}, because (b i^\\dagger)^2 = 0. So does a spin-1/2. Identify The nontrivial check is the algebra. Hard-core bosons obey a hybrid statistics: on the same site they anticommute, \\{b i, b i^\\dagger\\} = 1; on different sites they commute, [b i, b j^\\dagger] = 0 for i \\neq j. Spin operators obey exactly this: \\{S i^+, S i^-\\} = 1 with (S i^\\pm)^2 = 0 on-site, and [S i^+, S j^-] = 2S i^z\\delta {ij} = 0 off-site. The correspondence is therefore an isomorphism of operator algebras in any dimension, not a large-S expansion, not a mean-field decoupling, and not restricted to 1D (where the Jordan–Wigner string, a different and dimension-limited device, would also do the job). Apply it term by term to the hard-core extended Bose–Hubbard Hamiltonian Hopping becomes transverse exchange, so J \\perp = -2t: the kinetic term is an XY-ferromagnetic coupling. Nearest-neighbour repulsion becomes Ising exchange, with z the coordination number, so J z = V and repulsion is Ising-antiferromagnetic . The chemical potential becomes a longitudinal (Zeeman) field, -\\mu\\sum i S i^z, absorbing the Vz/2 shift into an effective h = \\mu - Vz/2. The result is the spin-1/2 XXZ model in a field: The sign of J \\perp is gauge-irrelevant on a bipartite lattice: the sublattice rotation S^\\pm i \\to -S^\\pm i on one sublattice flips it, which is why one may speak of the \"XY-ferromagnet\" and \"XY-antiferromagnet\" interchangeably there — and why on a frustrated lattice one may not . That same rotation is the operation later used to invert the natively ferromagnetic bosonic exchange in the two-component Mott insulator . The dictionary of orders Boson language Spin language Order parameter --- --- --- Density \\langle n i\\rangle Magnetization \\langle S^z i\\rangle + 1/2 — Chemical potential \\mu Longitudinal field h — Superfluid ODLRO Transverse (XY) order \\langle b^\\dagger i b j\\rangle \\to \\mid\\langle S^+\\rangle\\mid^2 Condensate fraction \\mid\\langle S^x\\rangle\\mid — Mott (empty/full) Fully polarized Ising state \\langle S^z\\rangle = \\pm 1/2 Checkerboard CDW Néel Ising order \\langle S^z {\\mathbf{Q}}\\rangle \\ne 0 Supersolid Canted XXZ: coexisting XY + Ising both nonzero Superfluid density \\rho s Transverse spin stiffness — Vortex Meron / in-plane spin texture — Compressibility \\partial n/\\partial\\mu Longitudinal susceptibility \\chi {zz} — Two entries deserve emphasis. First, an incompressible boson state and a magnetization plateau are the same phenomenon : \\kappa = \\partial n/\\partial\\mu = \\chi {zz}, so a Mott lobe is a plateau in M(h) and the Mott gap is the plateau width. Second, the supersolid is not exotic in spin language — it is the canted phase of an easy-axis XXZ antiferromagnet in a field, which is precisely why Matsuda and Tsuneto, and independently Liu and Fisher, could propose it directly from the spin model (verify). Figure: The Matsubara–Matsuda correspondence. Left, hard-core bosons on a lattice; right, the identical spin-1/2 XXZ magnet. Tunnelling t becomes transverse exchange J \\perp = -2t; interspecies-free on-site hard-core constraint becomes the two-state spin; nearest-neighbour repulsion becomes J z; chemical potential becomes the Zeeman field. Every phase on the left has a magnetic name on the right. Why Yang–Lee missed it Yang and Lee's lattice gas maps occupation numbers onto Ising variables \\sigma i = 2n i - 1 and is exact for the classical problem: a diagonal Hamiltonian of density–density interactions becomes an Ising model in a field. Matsubara and Matsuda's stated objection is that this correspondence \"did not take into consideration the vector character of spins\" — Ising spins have only a z-component, so there is no operator in the classical dictionary that can represent b i^\\dagger b j. The kinetic energy, the entire quantum content of the problem, has nowhere to go. Promoting \\sigma^z to a genuine vector operator \\vec{S} supplies exactly the missing transverse term, and with it superfluidity. The lesson generalizes: any mapping that keeps only the diagonal sector reproduces the CDW/Mott physics and loses the condensate entirely. Where the dictionary is exact, and where it degrades Exact. U = \\infty, any lattice, any dimension, any filling, any diagonal interaction range (map each V {ij}n in j to V {ij}S^z iS^z j). Correlation functions map one-to-one, so quantum Monte Carlo on one model is literally a simulation of the other. Degrades — soft core. At finite U the local Hilbert space is unbounded and no spin-1/2 representation exists. The standard repair, truncating to n i \\le 2S and using spin-S operators, is not an isomorphism: b^\\dagger \\to S^+/\\sqrt{\\cdots} requires occupation-dependent matrix elements, since b^\\dagger n\\rangle = \\sqrt{n+1} n+1\\rangle while S^+ m\\rangle carries \\sqrt{S(S+1)-m(m+1)}. Setting these equal fixes S only for S=1/2. For S \\ge 1 the truncated boson model and the spin-S XXZ model are different Hamiltonians that share a Hilbert-space dimension. Papers that assert \"soft-core bosons with n\\le 2 are a spin-1 magnet\" are asserting an approximation, and should say so. Degrades — spinor/multicomponent. For two species the local space at unit filling is again two-dimensional, and an XXZ description survives — but it is generated perturbatively in t/U, not by an operator identity, and its couplings are O(t^2/U) rather than O(t) . That is a different dictionary, valid only deep in the Mott lobe, and conflating it with Matsubara–Matsuda is a common error. The Holstein–Primakoff confusion. Holstein–Primakoff runs the other direction: spins → bosons, with S^z = S - a^\\dagger a, S^+ = \\sqrt{2S}\\,a\\sqrt{1 - a^\\dagger a/2S}, and it is exact only before the 1/S expansion truncates the square root. It is a large-S semiclassical tool. Matsubara–Matsuda is a small-S exact identity. Cold-atom papers that attribute the hard-core-boson–XXZ mapping to Holstein–Primakoff have inverted both the direction and the regime of validity of the transformation they are using. Bosonic Superexchange and the Sign That Is Not Anderson's Bosonic Superexchange and the Sign That Is Not Anderson's Take two distinguishable bosonic species a,b (hyperfine states, or two internal sublevels of the same atom, with collisions that do not convert one into the other) on a lattice at unit filling: At t/U \\to 0 and exactly one atom per site the ground manifold is 2^N-fold degenerate: each site carries a free label {\\uparrow}\\rangle i \\equiv a i^\\dagger 0\\rangle, {\\downarrow}\\rangle i \\equiv b i^\\dagger 0\\rangle. Hopping lifts the degeneracy at second order. This is precisely the situation Chao, Spałek and Oleś formalized for the fermionic Hubbard model in 1977 : a canonical transformation \\tilde H = e^{iS} H e^{-iS} with S chosen to cancel the doublon-creating part of the kinetic term at first order, leaving with P the projector onto the singly-occupied manifold and T the hopping. For bosons the algebra is identical; only the matrix elements of T between the ground manifold and the doublon manifold differ — and that difference is the whole story. The virtual doublons, one by one On a bond \\langle ij\\rangle there are three intermediate channels, distinguished by which doublon is made and at what energy. (1) Spin-flip channel, {\\uparrow} i{\\downarrow} j\\rangle \\to {\\downarrow} i{\\uparrow} j\\rangle. The virtual state is a mixed doublon a^\\dagger b^\\dagger 0\\rangle on one site, energy U {ab}. The relevant matrix element is since b i^\\dagger 0\\rangle i^{(b)} = 1\\rangle i^{(b)} carries no enhancement — the mixed doublon has occupation one in each species. Going back out with a i^\\dagger a j \\to requires moving the a boson to j, amplitude t a. Summing the two orderings (hop b left then a right, or a right then b left), both intermediate states have energy U {ab} above the ground manifold, and the second-order amplitude is The sign is the ordinary second-order-perturbation-theory sign: energy denominators are negative, so any off-diagonal process lowers the energy of the state it connects. With no fermionic minus signs anywhere, the transverse exchange is ferromagnetic in the XY sense : I will write it as J \\perp = +4t at b/U {ab} with the understanding that the physically invariant statement is: the transverse term favours a symmetric (bonding) combination of the two spin configurations, i.e. XY-ferromagnetic alignment. (2) Same-species channels, {\\uparrow} i{\\uparrow} j\\rangle \\to {\\uparrow} i{\\uparrow} j\\rangle. Here is where Bose statistics bites. The virtual state is \\frac{1}{\\sqrt 2}(a i^\\dagger)^2 0\\rangle = 2\\rangle i^{(a)}, energy U {aa}, and The factor \\sqrt2 is the Bose enhancement. It appears once on the way in and once on the way out, so the process is enhanced by a factor of 2 in the energy: This is a pure diagonal (Ising) energy: it lowers {\\uparrow}{\\uparrow}\\rangle and {\\downarrow}{\\downarrow}\\rangle but not {\\uparrow}{\\downarrow}\\rangle. Its Fermi counterpart does not exist at all — (c^\\dagger)^2 = 0 — which is exactly why in the fermionic problem the only surviving second-order process is the spin-flip one, and why fermionic superexchange is unavoidably antiferromagnetic . (3) Diagonal part of the mixed channel. The state {\\uparrow} i{\\downarrow} j\\rangle also gains energy from the virtual mixed doublon without flipping, amplitude t a in and t a out (and likewise t b), giving -2(t a^2+t b^2)/U {ab} per bond. Collecting the diagonal pieces and writing S^z i = \\tfrac12(n^a i - n^b i), the constants and the field drop out at unit filling and symmetric populations, leaving with the sign convention that J \\perp 0 denotes XY-ferromagnetic (the transverse term lowers the symmetric state) and J z 0 denotes easy-plane (anti-aligned S^z favoured). This is the two-species XXZ magnet of Kuklov and Svistunov and of Duan, Demler and Lukin ; under Matsubara–Matsuda it is the same object as the hard-core Bose fluid of §2, now with the species label playing the role the site occupation played there. Why \"Anderson's sign\" does not transfer Anderson's J = 4t^2/U 0 antiferromagnetic is a statistics theorem in disguise , not a general consequence of second-order perturbation theory . The logic is: (i) the virtual doublon requires two particles on one site; (ii) for spin-1/2 fermions in a single orbital, Pauli exclusion permits this only if the two spins form a singlet; (iii) therefore only the singlet component of the bond wavefunction is lowered in energy; (iv) hence antiferromagnetism. Steps (ii)–(iii) are where the fermionic sign lives, and for bosons every step fails: the double occupancy is allowed in all channels, it is enhanced rather than blocked, and there is no antisymmetrization minus sign to convert an energy lowering of the symmetric state into a lowering of the antisymmetric one. Bosonic exchange is natively ferromagnetic. Anything else must be engineered. This is the physical content of the 2021 bosonic-antiferromagnet experiment : it was not a matter of cooling further into a pre-existing antiferromagnetic ground state, but of inverting the sign, via a sublattice/gauge rotation that maps the natural ferromagnet onto a Heisenberg antiferromagnet on a bipartite lattice, seeded from a Néel product state. The same sign control appears already in Trotzky et al. , where tilting a double well reverses the effective exchange by shifting which virtual doublon is energetically accessible — a two-site measurement of J and its sign, not of order (see §6). The anisotropy dial Set t a = t b = t, U {aa} = U {bb} = U. Then J \\perp = 4t^2/U {ab} and J z = 4t^2/U {ab} - 8t^2/U, so the anisotropy is controlled entirely by \\alpha \\equiv U {ab}/U: Regime Condition J z / J \\perp Phase --- --- --- --- Easy-plane U {ab} \u003c U (\\alpha\u003c1) 0 \u003c J z/J \\perp \u003c 1 XY order in S^\\pm: counterflow superfluid, \\langle a i^\\dagger b i\\rangle \\ne 0 Isotropic U {ab} = U (\\alpha = 1) J z/J \\perp = -1 relative sign flips at \\alpha=2; SU(2) point at U {ab}=U Heisenberg (ferromagnetic) Easy-axis / Ising U {ab} 2U J z \u003c 0, \\mid J z\\mid \\mid J \\perp\\mid Ising-ordered Mott: species-segregated / spin-Mott, gapped in both sectors Phase separation U {ab} \\gg U — Domain formation; the perturbative magnet ceases to describe the true ground state The counterflow superfluid and the spin-Mott state — the two experimentally realized \"neither superfluid nor Mott\" phases — are the two sides of this dial, separated by an Ising transition in the spin sector at fixed, incompressible total density. Section 4 takes up their order parameters. Ancestry and validity The structure above is a special case of Kugel–Khomskii : a degenerate Hubbard model at large U whose strong-coupling expansion produces coupled spin and pseudospin exchange with anisotropic, sign-tunable couplings, the anisotropy inherited from the ratio of intra- to inter-flavour on-site repulsion. The two-component Bose–Hubbard spin Hamiltonian is that algebra with the orbital pseudospin promoted to a species label and the fermionic antisymmetrization removed. Papers deriving \"a new XXZ model from two-species bosons\" are rediscovering a 1973 Russian-language result with the statistics changed. The expansion is controlled only if: - zt/U {\\min} \\ll 1 with U {\\min} = \\min(U {aa},U {bb},U {ab}) — near the tip of the Mott lobe the doublon gap closes and the strong-coupling series is meaningless; - filling is commensurate at exactly n=1; away from it the leading term is not J but a constrained-hopping (t–J-like) term of order t, and doped bosonic Mott insulators are not magnets, they are superfluids; - U {ab} is not resonant with a molecular bound state or a Feshbach resonance, and U {ab} \\ne U {aa},U {bb} by amounts small compared with the trap-induced level spacing — otherwise the \"virtual\" doublon is not virtual; - three-body and higher-band processes are off-resonant: the neglected fourth-order ring exchange scales as t^4/U^3 and can be comparable to J z when J z is tuned near zero by cancellation, which is exactly the interesting regime; - J \\sim 4t^2/U sets the entropy scale that must be reached — typically tens of hertz, well below the Mott gap. This is the entire experimental difficulty and the subject of §8. The Phases That Are Neither Superfluid Nor Mott: Bose Glass, Counterflow, Spin-Mott, Nematic The Phases That Are Neither Superfluid Nor Mott: Bose Glass, Counterflow, Spin-Mott, Nematic The two-phase cartoon of the Bose–Hubbard model — superfluid at small U/t, Mott insulator at large U/t and integer filling — survives only in the clean, single-component, structureless case. Relax any one of those three conditions and the phase diagram acquires states that are neither. What follows is a catalogue organized by the only thing that distinguishes phases: order parameter, gap, compressibility, and the diagnostic that actually resolves them. The two-axis bookkeeping For a two-component gas the useful decomposition is charge/spin rather than a/b: Each sector independently can be gapped or gapless, ordered or disordered, and the four combinations are four distinct phases. The charge sector's compressibility is \\kappa = \\partial n/\\partial\\mu; the spin sector's is \\chi = \\partial m/\\partial h with h the population imbalance chemical potential. A Mott insulator has \\kappa = 0; a spin -Mott has \\kappa = \\chi = 0; counterflow superfluidity has \\kappa = 0 but \\chi \\neq 0 with off-diagonal long-range order in S^+. Nothing forces the two sectors to freeze at the same coupling, and the interesting phases live in the mismatch. Figure: Charge (total density) and spin (relative density) sectors gap out independently in the two-component Bose–Hubbard model. Only the upper-right cell is \"the superfluid\" and only the lower-left is \"the Mott insulator\" of the textbook cartoon; the off-diagonal cells are genuine phases with their own order parameters. The Bose glass is placed in the compressible-but-not-superfluid cell of the single-component (disordered) problem, which is the same failure of the two-phase picture along a different axis. Bose glass: compressible, gapless, insulating The first canonical \"neither\" phase is single-component and requires only disorder . In a random potential the Mott lobes are surrounded by a phase with \\rho s = 0 (no superfluid stiffness), \\kappa 0 (finite compressibility), no gap, and no long-range order — rare Griffiths regions of locally superfluid puddles that never percolate. Its defining structural claim is the theorem of inclusions : a direct Mott–superfluid transition is impossible in the presence of bounded disorder, so the Bose glass always intervenes. The diagnostic is the pairing of a finite \\partial n/\\partial\\mu with vanishing stiffness — a combination no mean-field decoupling produces, which is why Bogoliubov and Gutzwiller treatments miss the phase entirely. It is not adiabatically connected to either neighbour, and its single-particle density of states at the chemical potential is finite, in contrast to the hard gap of the Mott state. Counterflow superfluidity Take two species at total filling n a + n b = 1 per site, so the charge sector is deep in a Mott state. The residual spin dynamics is the XXZ magnet of §3. In the easy-plane regime ( J z \u003c J \\perp ) the transverse spin orders, which is off-diagonal long-range order in a particle–hole composite: an a-atom current is necessarily accompanied by an equal and opposite b-atom current. Total mass current is identically zero; total density stays incompressible. This is Kuklov and Svistunov's supercounterfluid , predicted in May 2002 and observed 23 years later at USTC by adiabatically driving a low-entropy spin-Mott state of repulsively bound pairs across the easy-axis→easy-plane boundary and watching relative-density coherence appear while the total-density structure factor remained flat. The distinctions that the literature routinely erases: phase order parameter total mass current charge sector --- --- --- --- counterflow SF \\langle a i^\\dagger b i\\rangle zero incompressible pair SF \\langle a i b i\\rangle carried by pairs compressible, gapless in 2n two-species SF \\langle a i\\rangle,\\ \\langle b i\\rangle carried by each compressible Pair superfluidity requires attractive or strongly asymmetric interspecies interaction (U {ab} sufficiently negative, or \\mid U {ab}\\mid exceeding the intraspecies scales) so that a ib i molecules form and then condense; it breaks a single U(1) (total phase) while leaving relative phase disordered. Counterflow does exactly the reverse. \"Spin superfluid\" is a third name, correct only when the spin symmetry is genuinely U(1) — with exact SU(2) symmetry the would-be Goldstone modes are two ferromagnetic magnons with quadratic dispersion and there is no stiffness in the Landau sense. Spin-Mott, Ising, and phase separation Push J z into the easy-axis regime and the spin sector gaps out as well. Two variants exist and are physically different. If U {ab} U {aa}, U {bb} the ground state at n=1 is an Ising antiferromagnet in the pseudospin language — the two species alternate, which in atomic language is a checkerboard demixing. If U {ab} \u003c U {aa}, U {bb} the system phase-separates: the Ising ferromagnet is a macroscopic domain of a beside a domain of b, and on a lattice with a trap this appears as spatial segregation rather than a magnetic pattern. The spin-Mott proper is the n a = n b = 1 state of repulsively bound a–b pairs, one on each site: both \\kappa and \\chi vanish, the gap is set by pair-breaking \\sim U {ab} - (intraspecies costs), and it is the preparation state of the 2025 counterflow experiment precisely because it is a low-entropy product state with a large gap. The spinor model is a different problem The two-component model above conserves N a and N b separately: the species label is a bookkeeping index, and the effective magnet is XXZ with anisotropy fixed by U {ab}/U {aa,bb}. In a genuine spin-1 gas, spin-changing collisions {+}1\\rangle + {-}1\\rangle \\leftrightarrow 0\\rangle + 0\\rangle are allowed; only total S^z and total spin are conserved, and the on-site interaction is with U 2 \\propto (a 2 - a 0). For U 2 0 (antiferromagnetic, as in ^{23}Na) the on-site spectrum is organized by total on-site spin S, and the Mott insulator's magnetic character alternates with filling — the central result of Demler and Zhou . At even filling the site can form the on-site singlet S=0: the ground state is a product of spin singlets, gapped, with no broken spin symmetry, no local moment, and exponentially decaying spin correlations. Calling this an antiferromagnet — which happens routinely — is a category error: an antiferromagnet has a nonzero staggered order parameter and gapless (or at least symmetry-broken) magnon structure; this state has no order parameter at all in the spin sector, and its correlations are those of a trivial paramagnet. At odd filling the site cannot singlet-pair internally, the minimum on-site spin is S=1, and the resulting inter-site exchange favours a nematic : \\langle \\hat{\\mathbf{S}}\\rangle = 0 but the quadrupole tensor Q^{\\alpha\\beta} = \\langle S^\\alpha S^\\beta + S^\\beta S^\\alpha\\rangle/2 - \\tfrac{2}{3}\\delta^{\\alpha\\beta} is anisotropic — rotational symmetry broken, time reversal preserved. The order parameter is a director \\mathbf{d} identified with -\\mathbf{d}, so the manifold is \\mathbb{RP}^2 and the topological defects are \\mathbb{Z} 2 half-vortices rather than integer vortices. Demler and Zhou further argued that condensing those half-vortices, or fluctuating the nematic strongly, yields fractionalized phases with \\mathbb{Z} 2 topological order and spin-1/2 deconfined excitations — candidate phases, not observed ones. The diagnostics differ accordingly. Nematic order is invisible to any measurement of \\langle S^\\alpha\\rangle or to a Stern–Gerlach population readout; it requires a quadrupole probe — spin-dependent Bragg scattering, or the anisotropy of spin-noise correlations. The even-filling singlet is diagnosed by its gap and by the absence of magnetization response, which is why it is so easily mislabelled: an experiment that measures zero staggered magnetization and a spin gap will report the same numbers for a singlet Mott insulator and for a well-cooled short-range-correlated antiferromagnet above its ordering scale. The 2002–2003 Convergence and How the Credit Flattened The 2002–2003 Convergence and How the Credit Flattened The standard citation block for bosonic magnetism in optical lattices reads, in most reviews, as a comma-separated list of 2003 Physical Review Letters . Journal dates are the wrong clock. Sorted by arXiv posting — the date at which the community could actually read the argument — the sequence is different, and the priorities it establishes do not match the ones the field records. The sequence by preprint date April 2001 — Demler and Zhou, cond-mat/0104409 . The first paper to insist that a bosonic Mott insulator has non-trivial internal magnetic structure. The system is genuinely spin-1: spin-changing collisions are allowed, the on-site interaction splits as U 0 + U 2 \\mathbf{S} i^2, and the conserved quantity is the total spin, not the individual populations. The results are correspondingly specific to that case — a gapped, non-magnetic spin-singlet Mott state at even filling, a spin-nematic state at odd filling, and candidate fractionalized phases. Note what this paper is not : it is not a derivation of pseudospin-1/2 superexchange, and the phases it predicts have no counterpart in the two-component problem. The habit of opening a two-component Bose–Hubbard citation list with as though it were the ancestor conflates two different models (a conflation already dissected in §4). May 2002 — Kuklov and Svistunov, cond-mat/0205069 . Two distinguishable species at commensurate total filling; strong coupling; second-order elimination of the doubly-occupied manifold; an effective XXZ Hamiltonian in the pseudospin sector, with J \\perp and J z fixed by t a,t b and the ratio U {ab}/U {aa},U {bb} — and the identification of the easy-plane phase as a state with off-diagonal long-range order in a^\\dagger i b j: counterflow superfluidity. This is, by preprint date, the first statement of the two-species effective spin Hamiltonian in the optical-lattice context, and it arrives with its most striking physical consequence already attached. Kuklov and Svistunov did not stop at \"the Mott insulator is a magnet\"; they identified which magnetic phase was experimentally distinctive and why (charge-incompressible, spin-coherent, zero net mass current). Twenty-three years later that is the phase the USTC experiment reports observing , and the paper frames itself explicitly as a test of this prediction. Late 2002 → 2003 — Duan, Demler and Lukin . A different intellectual programme, and this is the point most often lost: is not primarily a derivation paper, it is an engineering paper. Its content is that spin-dependent optical potentials and controlled collisions let you set the magnitude, the sign, and the anisotropy of J \\perp and J z independently — including regimes with J \\perp and J z of opposite sign, and anisotropic compass-type models with topologically ordered ground states. The strong-coupling algebra is a means; the deliverable is a map from laser configurations onto an essentially arbitrary lattice spin Hamiltonian. That is why the paper became load-bearing for everything after it, and also why citing it as the origin of the effective Hamiltonian is a category error. 2003 — Altman, Hofstetter, Demler and Lukin . The systematic phase diagram of the two-component model, treating the spin sector on the same footing in the Mott and superfluid regimes rather than only deep in the insulator: super-counterfluid, spin-ordered (Ising / phase-separated) Mott states, and the various two-component superfluids, with the boundaries laid out as functions of the interaction anisotropy. This is the paper that converts a strong-coupling effective Hamiltonian into a navigable diagram, and it deserves independent credit for the regions where neither the strong-coupling nor the weak-coupling limit is controlled. Underneath all four sits Jaksch, Bruder, Cirac, Gardiner and Zoller (1998) , which supplies the bridge nobody in this list could have crossed alone: t and U as computable functionals of Wannier functions and laser intensity. Without there is no reason to write 4t^2/U for a gas of atoms; with it, \"tunable exchange\" becomes a laboratory parameter. Its citation record is, unusually for this story, roughly correct. Why absorbed the credit The flattening is explicable without attributing bad faith to anyone. Four mechanisms, all evidentiary: 1. Journal-date collapse. appeared in PRL in 2003; appeared in PRL in 2003. In a reference list sorted by publication year the seven-month preprint gap vanishes. 2. Utility beats priority. Nearly every subsequent experimental proposal needed a sign and a knob , not a Hamiltonian. is the paper you cite when you want to justify that your J is tunable, so it is cited far more often — and citation frequency is what later reviews sample when writing \"as shown in\". 3. Framing. is titled and framed around counterflow superfluidity, a phase that remained unobserved until 2025 . A paper whose headline claim sits in the future is read as a prediction paper, not as a foundations paper, and prediction papers get cited in the section where the prediction is tested rather than in the section where the formalism is set up. 4. Author-network clustering. , and share overlapping authorship, so a review citing any one of them tends to pick up the others; sits outside that cluster. The consequence is a specific, checkable error, not a vague injustice: statements of the form \"the effective spin Hamiltonian for two-component lattice bosons was derived in \" are false by seven months of public record. The 1973 and 1977 antecedents There is a second gap, and it is deeper than an ordering dispute inside the cold-atom literature. The derivation performed in , and — project onto the singly-occupied manifold, eliminate the doubly-occupied states to second order by canonical transformation, collect the resulting exchange terms — is precisely the Schrieffer–Wolff-type construction that Chao, Spałek and Oleś published for the narrow S-band Hubbard model in 1977 , a decade before it was named the t–J model. The bosonic version differs in the statistics of the intermediate state, which flips the sign of J \\perp (§3), but the machinery — the projector, the generator, the systematic O(t^2/U) truncation, the constrained-hopping remnant — is theirs in structure. It is essentially never cited in this literature. The multi-flavour case is worse. Kugel and Khomskii (1973) derived, from a degenerate Hubbard model at large U, coupled spin and pseudospin exchange with anisotropic, sign-tunable couplings — the exact algebraic structure that reappears in the two-component Bose–Hubbard papers with the orbital pseudospin relabelled as a hyperfine index. Papers announcing \"a new XXZ model with tunable anisotropy from two-species bosons\" are, at the level of the effective Hamiltonian, rediscovering a Russian-language 1973 result. Two ordinary causes suffice to explain the omission: the original is in ZhETF with the JETP translation appearing in a solid-state venue, and the cold-atom community entered through the Fisher–Weichman–Grinstein–Fisher / Jaksch doorway rather than the strongly-correlated-oxide one, so its inherited bibliography simply did not contain or to begin with. The correct minimal citation, then, for \"superexchange in a two-component bosonic Mott insulator\" is: mechanism from Kramers via Anderson ; canonical-transformation derivation from Chao–Spałek–Oleś ; multi-flavour structure from Kugel–Khomskii ; boson↔spin dictionary from Matsubara–Matsuda ; lattice realization from Jaksch et al. ; the two-species effective Hamiltonian and counterflow order parameter from Kuklov–Svistunov ; the engineering of sign and anisotropy from Duan–Demler–Lukin ; the phase diagram from Altman et al. ; and the spin-1 problem, separately, from Demler–Zhou . Landmark Experiments: What Was Measured, and What Was Only Claimed Landmark Experiments: What Was Measured, and What Was Only Claimed The theory in §3–§5 is cheap; the temperatures are not. Bosonic superexchange sets the only energy scale in the spin sector, and it is fourth order small: J \\sim 4t^2/U with t/U \\lesssim 0.1 deep in the Mott phase gives J/h in the range 10 Hz – 1 kHz, i.e. J/k B \\sim 0.5–50 pK for typical lattice depths. Every result below is gated by whether the entropy per particle was pushed below the corresponding s^ \\sim k B \\ln 2 within the spin sector , and most of them were not. Greiner et al. 2002: the charge sector, and only the charge sector Two observables, not one. First, time-of-flight interference: release from the 3D lattice and image the momentum distribution, which for a coherent state is a set of Bragg peaks at reciprocal-lattice vectors \\mathbf{G} with visibility set by \\langle \\hat a i \\rangle ^2; the peaks fade continuously and vanish by V 0 \\approx 22\\,E R, then revive when the lattice is ramped back down . Loss of interference alone proves nothing — it is equally consistent with dephasing, heating, or a mixed state. The second observable is what makes the paper: gap spectroscopy. Applying a potential gradient and measuring the resonant response gives excitation peaks at \\Delta E = U and 2U, the particle–hole gap of an incompressible state. Greiner's LMU dissertation documents the calibration chain — lattice depth from Kapitza–Dirac diffraction, U from Wannier overlap integrals — more completely than the Nature letter. What was not measured: anything in the spin sector. The atoms were spin-polarized ^{87}Rb F=2, m F=2\\rangle. There is no magnetism in this experiment, and under the Matsubara–Matsuda dictionary of §2 the superfluid it destroyed was already the XY-ordered phase of an effective magnet — the transition observed is a magnetic transition in disguise, which is a different statement from having observed spin correlations. Trotzky et al. 2008: a coupling constant, not a phase This is the experiment most often mis-cited, so state precisely what happened. A superlattice, V(x) \\propto V s\\cos^2(2k x) + V l\\cos^2(kx + \\varphi), cuts the system into an array of isolated double wells. Two spin states \\uparrow\\rangle, \\downarrow\\rangle are loaded one per site by spin-dependent transfer, producing the product state \\uparrow\\downarrow\\rangle on every double well. The barrier is then lowered and the sublattice magnetization N \\uparrow^{\\rm even} - N \\uparrow^{\\rm odd} is read out versus hold time. It oscillates sinusoidally, \\propto \\cos(2J t/\\hbar), over several periods with frequencies from 5 Hz to 1 kHz as t/U is tuned . Tilting the double well by \\Delta shifts the virtual-doublon energy denominators asymmetrically, J \\perp \\propto 4t^2 U/(U^2-\\Delta^2), and drives J through a divergence and a sign change — the first experimental control over the sign of a bosonic exchange. That is a spectroscopic measurement of a two-body matrix element. A double well has two sites. It has no thermodynamic limit, no correlation length, no order parameter, no spontaneous symmetry breaking, and no phase transition. The initial state was prepared staggered by external superlattice engineering, not grown by the exchange; the observed dynamics is coherent Rabi-like population transfer between \\uparrow\\downarrow\\rangle and \\downarrow\\uparrow\\rangle through the virtual doublon. Papers that cite as \"observation of antiferromagnetic order in a bosonic Mott insulator\" are describing an experiment that did not occur. The distinction is not pedantry: measuring J requires only that the double-well pair be in a known state, whereas observing Néel order requires the spin entropy of an extended system to fall below \\ln 2 per site — a requirement harder by orders of magnitude. Figure: The charge sector is gapped by U, comfortably above lattice temperatures, which is why the Mott transition was seen in 2002. The spin sector is gapped by J = 4t^2/U, typically at or below T — so bosonic magnetism cannot be reached by cooling. Both and instead start from a near-zero-entropy product state and transport it adiabatically into the ordered phase, sidestepping thermal equilibration entirely. Sun et al. 2021: an extended antiferromagnet, built rather than cooled The USTC experiment is the first honest observation of bosonic magnetic order . Three ingredients. (i) A low-entropy Néel product state \\uparrow\\downarrow\\uparrow\\downarrow\\cdots\\rangle prepared by superlattice loading with defect filtering, giving spin entropy far below the thermal value at any achievable T. (ii) Sign inversion: bosonic J \\perp is natively ferromagnetic (§3), so a staggered spin rotation — equivalently the tilt trick of — is used to realize an antiferromagnetic isotropic Heisenberg chain. (iii) Optimized adiabatic passage : the superlattice is ramped along a numerically optimized trajectory that keeps the state in the instantaneous ground state as the chain is connected from isolated dimers into a uniform 70-site chain. Observables: staggered magnetization and, decisively, the two-point correlator C d = \\langle S^z i S^z {i+d}\\rangle - \\langle S^z i\\rangle\\langle S^z {i+d}\\rangle resolved to d = 2–3 by site-resolved spin-selective imaging. Correlations of the right sign, alternating with d, over more than one bond. This is order in an extended system — but note it is a prepared low-entropy state carried adiabatically, not a thermal state below a critical temperature. In 1D there is no finite-T transition anyway; the claim is ground-state correlations, and it is defensible as made. de Hond et al. 2022 → Zheng et al. 2025: counterflow, 23 years late The spin-Mott state — two species locked into repulsively bound a–b pairs, one per site, gapped in both the charge and spin sectors — was identified and prepared by de Hond et al., Phys. Rev. Lett. 128 , 093401 (2022) (verify). Its value is entropic: the spin-Mott is the unique low-entropy starting point from which the counterflow phase can be reached by an adiabatic ramp rather than by cooling. Zheng et al. then ramp U {ab}/U {aa} (equivalently J z/J \\perp) across the easy-axis→easy-plane boundary of the effective XXZ magnet and measure two things simultaneously . First, coherence in the relative density: a matter-wave interference measurement sensitive to \\langle a i^\\dagger b i \\rangle, i.e. transverse spin order, which turns on across the transition. Second, and this is what makes it counterflow rather than ordinary superfluidity, the total density stays incompressible — \\partial n/\\partial\\mu \\approx 0, no coherence in \\langle a i\\rangle or \\langle b i\\rangle separately. Spin sector superfluid, charge sector Mott. That joint measurement is the operational content of the Kuklov–Svistunov prediction , and it is the reason the claim survives the conflation warning of §4: without the compressibility null result, relative-phase coherence alone would not distinguish counterflow from a pair superfluid or from a two-component superfluid with correlated phases. The honest summary of the chain: 2002 measured a charge gap, 2008 measured a coupling constant, 2021 grew a correlated spin state, 2025 measured two order parameters against each other. Only the last two are observations of a phase, and both got there by circumventing thermalization rather than by achieving it. Validity Audit: Formulas Circulating With Their Assumptions Stripped Validity Audit: Formulas Circulating With Their Assumptions Stripped Each item below is a formula or a phrase that travels through the literature detached from the derivation that produced it. The pattern is uniform: an expression derived under a specific set of constraints acquires the status of a definition, and the constraints stop being stated. I give the circulating form, the assumption that was dropped, and the corrected statement. 1. J = 4t^2/U, imported with its sign Circulating form. \"Superexchange in the Mott insulator gives an antiferromagnetic Heisenberg coupling J = 4t^2/U 0.\" Assumption stripped. Fermionic statistics. Anderson's derivation is second-order perturbation theory in t around a singly-occupied product state, and the sign is not arithmetic — it is Pauli blocking. The virtual doublon {\\uparrow\\downarrow},0\\rangle is accessible only from the spin-singlet component of the neighbouring pair; the triplet has no second-order path at all. Second-order energy shifts are negative, so the singlet alone is lowered by -4t^2/U, and H {\\rm eff} = J(\\mathbf{S} i\\cdot\\mathbf{S} j - 1/4) with J 0. Remove the exclusion principle and the mechanism evaporates. Corrected statement. For two distinguishable bosonic species a,b at unit filling with intra- and interspecies repulsions U {aa}, U {bb}, U {ab}, the same canonical transformation gives an XXZ model, not a Heisenberg one: with the sign convention H = \\sum {\\langle ij\\rangle}\\big[\\tfrac{J \\perp}{2}(S i^+S j^- + \\mathrm{h.c.}) + J z S i^z S j^z\\big]. Two things change. First, the transverse channel is ferromagnetic : both spin states of the virtual pair are permitted, and the ab\\rangle intermediate carries a Bose enhancement rather than a Pauli veto, so the flip-flop amplitude comes out with the opposite sign to the fermionic case — the natural bosonic order is XY-ferromagnetic. Second, J z is a difference of three terms and changes sign with the interaction anisotropy \\eta = U {ab}/\\sqrt{U {aa}U {bb}}; at t a = t b = t and U {aa}=U {bb}=U, J z = 4t^2(1/U {ab} - 2/U)\\cdot\\tfrac{1}{2}-type combinations cross zero near U {ab}\\approx U/2, which is precisely the boundary between the counterflow (easy-plane) phase and the Ising/phase-separated regime [12, 16]. The SU(2)-symmetric Heisenberg point is not generic; it is the fine-tuned locus U {ab}=U {aa}=U {bb}. The operational consequence is visible in the experimental record. The bosonic antiferromagnet of 2021 was not obtained by cooling — it required inverting the native exchange sign, via the tilt/superlattice control demonstrated in the double-well measurements of 2008 . Any paper quoting \"J=4t^2/U, antiferromagnetic\" for a two-component bosonic lattice has imported a fermionic result across the statistics boundary. 2. The quantum-rotor / Josephson-array reduction Circulating form. H = \\tfrac{U}{2}\\sum i \\hat n i^2 - 2t\\bar n\\sum {\\langle ij\\rangle}\\cos(\\phi i-\\phi j), \"the Bose–Hubbard model in phase representation.\" Assumption stripped. Large integer filling \\bar n \\gg 1 with \\delta n i = \\hat n i - \\bar n small, so that \\delta n i may be treated as an unbounded integer canonically conjugate to a compact phase and \\sqrt{n i+1}\\sqrt{n j}\\to \\bar n. Corrected statement. The rotor model is an \\bar n \\to \\infty limit, not a representation. It is blind to three features that constitute most of what is interesting about the Bose–Hubbard phase diagram . (i) Particle–hole asymmetry: the true amplitudes \\sqrt{n+1} and \\sqrt{n} differ, so particle and hole excitations of the Mott state have different effective masses and the lobes are asymmetric in \\mu; the rotor model has an exact particle–hole symmetry it did not earn. (ii) Lobe structure: with \\delta n unbounded there is no hard-core constraint and no discrete sequence of Mott lobes indexed by filling. (iii) The universality distinction at the lobe tip: the generic transition, driven at fixed \\mu across a lobe boundary, has z=2 and mean-field-like exponents with the density as an active field; the transition through the lobe tip at fixed integer density has z=1 and lies in the (d+1)-dimensional XY class . The rotor approximation imposes z=1 everywhere by construction — it is exactly the \\mathrm{tip} theory extended illegitimately across the whole boundary. Papers that quote a (d+1)-XY exponent for a transition crossed at fixed chemical potential have used the rotor result outside its domain. The \"granular superconductor origin\" folklore attached to the model is a downstream symptom of the same conflation. 3. \"Superexchange\" as a mechanism claim Circulating form. \"Atoms on neighbouring sites couple via the superexchange mechanism.\" Assumption stripped. A bridging closed-shell anion. Kramers' 1934 mechanism is the coupling of magnetic cations through an intervening non-magnetic ion — Mn–O–Mn — with the O^{2-} orbital supplying the virtual excitation. That is the \"super\". Anderson's kinetic exchange is a single-band, direct-tunnelling second-order process with no intermediary; the ultracold realization inherits Anderson's structure exactly, with t the nearest-neighbour Wannier overlap. Corrected statement. \"Superexchange\" in the optical-lattice literature is inherited terminology for second-order kinetic exchange. Nothing is exchanged through a third site. The usage is harmless as a label and wrong as a claim: statements that a bridging orbital, a Goodenough–Kanamori rule, or an anion-mediated pathway is operative in a two-site double well are false. Where the historical mechanism is meant, the honest name is Kramers–Anderson superexchange [1, 3, 2]. 4. Counterflow, pair, and spin superfluidity Circulating form. The three names used interchangeably for the ordered phase of the two-component Mott insulator. Corrected statement. Three inequivalent order parameters: Phase Order parameter Total mass current Compressibility \\partial n/\\partial\\mu --- --- --- --- Counterflow (supercounterfluid) \\langle a i^\\dagger b i\\rangle \\neq 0 zero zero (Mott in total density) Pair superfluid \\langle a i b i\\rangle \\neq 0 nonzero nonzero \"Spin superfluid\" XXZ name for the first zero zero Counterflow order is a particle–hole condensate in the relative channel: species a flows one way, b the other, the total current cancels, and the system remains incompressible . It is the easy-plane phase of the XXZ magnet, \\lvert J \\perp\\rvert \\lvert J z\\rvert, and it is what was observed in 2025 by driving a spin-Mott state of repulsively bound a–b pairs adiabatically across the transition and detecting relative-density coherence while the total density stayed gapped . Pair superfluidity is a particle–particle condensate, requires attractive or strongly anisotropic interspecies interaction, and does carry mass current — it is a different phase, not a different word. 5. The U(1)-versus-SU(2) caveat on spin stiffness \"Spin superfluid\" presupposes a conserved U(1) charge to be superfluid in . In the two-component model the species populations N a, N b are separately conserved by collisions, S^z generates a genuine U(1), and a spin stiffness \\rho s^{\\rm spin}, a spin-sector Goldstone mode, and (in 3D) a Berezinskii-type transition all exist. At the SU(2)-symmetric point, or in a genuine spin-1 spinor gas where spin-changing collisions \\lvert 0,0\\rangle \\leftrightarrow \\lvert +1,-1\\rangle break the separate conservation and only total F survives, the argument fails: there is no single conserved U(1) charge whose phase can wind, no unique stiffness, and the \"superfluid\" language is at best a statement about a particular symmetry-broken direction, not a topologically protected transport property. This is also where the two-component and spinor models must be kept apart: the spin-1 Mott insulator at even filling is a gapped, non-magnetic total-singlet, and at odd filling nematic — neither is a spin superfluid, and calling the even-filling singlet \"antiferromagnetic\" is a category error. 6. The Jaksch–Bruder–Cirac–Gardiner–Zoller expressions for t and U Circulating form. quoted as the lattice parameters for any depth and any species. Assumptions stripped. Four. (i) Single band : w is the lowest-band Wannier function and all higher bands are projected out; valid only for U, t, \\mu \\ll \\hbar\\omega {\\rm band}. (ii) Gaussian/harmonic Wannier : the closed-form asymptotics above come from replacing w by the ground state of the local harmonic well, which fails in shallow lattices where w has substantial tunnelling tails, and slightly overestimates U in deep ones. (iii) Contact pseudopotential with a s the free-space scattering length : valid when a s \\ll the on-site oscillator length, i.e. the confinement does not distort the two-body scattering state. (iv) Density-independent U : no multiband dressing. The standard repairs are well known and routinely omitted: at large V 0 the on-site interaction dresses the Wannier orbital and U n acquires an n-dependence, U n \\simeq U(1 - \\beta (n-1)) with \\beta of order a few percent per particle; near a Feshbach resonance or in tight confinement the contact form must be replaced by the confinement-induced-resonance treatment; and the exponential asymptotic for t is valid only for V 0/E R \\gtrsim 5 — below that it should be taken from the exact band structure (the bandwidth of the Mathieu equation), not from the formula. The formula is a derivation with a stated regime , and the papers that quote it as a definition inherit errors of tens of percent in U/t — which, near a lobe boundary, is the difference between phases. Frontier: Entropy, Gauge Fields, and the Magnetism Nobody Has Cooled To Frontier: Entropy, Gauge Fields, and the Magnetism Nobody Has Cooled To Everything in this dossier reduces to one number. The spin sector of the two-component Bose–Hubbard Mott insulator is governed by and for the lattice depths at which the Mott gap is well formed (U/t \\gtrsim 30 in 3D), J/h lands in the range of tens of hertz to at most a few hundred hertz — temperatures of order 100\\ \\mathrm{pK} to a few nanokelvin. The 2025 counterflow experiment quotes \\sim 1\\ \\mathrm{nK} for the ordered state , and that is not a typo: it is the actual scale of bosonic magnetism. Every open problem below is, at bottom, a restatement of the fact that J is fourth-order small while the tools that produce cold atoms are second-order blunt. The entropy ledger, and why charge cooling does not buy spin order The standard conflation here is between charge entropy and spin entropy. Immersion-type protocols — the USTC staggered-immersion scheme, which embeds a Mott sample in a removable superfluid reservoir — reached a reported entropy per particle of \\sim 0.0019\\,k B (Yang et al. , Science 369 , 550 (2020)), a 65-fold reduction. That number describes the defect content of the density distribution: holes and doublons in an n=1 Mott insulator, whose creation costs U. It says essentially nothing about the spin sector, whose entropy budget is \\ln 2 \\approx 0.69\\,k B per site and whose energy scale is J, three to four orders of magnitude below U. A perfect band insulator of pinned atoms with random spins is charge-cold and spin-infinite-temperature. The requirement for magnetism is therefore s {\\rm spin} \\lesssim 0.3–0.5\\,k B per particle, and no equilibrium cooling technique has removed spin entropy at the J scale. It is worth being blunt about what the target even is: in 1D there is no ordered phase at any T 0, and in 2D the isotropic Heisenberg model is forbidden long-range order at finite temperature by Mermin–Wagner, with only a correlation length \\xi \\sim \\exp(2\\pi\\rho s/T) growing exponentially. \"Observing the bosonic antiferromagnet\" in d\\le 2 means observing correlations over some number of sites , never a thermodynamic ordered phase. Papers and press releases that elide this are describing 3D physics with 2D data. Preparation is not cooling — and both landmark results are preparation Both and sidestep the entropy problem the same way, and the method deserves to be named precisely: adiabatic passage from a gapped, low-entropy product state . In the 2021 chain, a superlattice-imposed Néel pattern — a zero-entropy classical spin configuration — is ramped into the isotropic-exchange regime, and correlations grow as the state follows the instantaneous ground state . In the 2025 counterflow experiment, the initial state is the spin-Mott of repulsively bound a–b pairs (de Hond et al. , PRL 128 , 093401 (2022)), which is gapped by the interaction anisotropy U "}</script>

<script type="application/json" id="aether-data">{"slug": "the-magnet-hiding-inside-the-bose-fluid", "topic": "bose hubbard physics beyond superfluidity or condensation, some spin correlation?", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "The Magnet Hiding Inside the Bose Fluid", "subtitle": "Spin order, counterflow, and the Mott-insulating majority of the Bose–Hubbard phase diagram — from Kramers (1934) to counterflow superfluidity (2025).", "domain": "", "era": "", "why_big": "", "abuse": "", "date": "August 7, 2026", "ts": 1786074610.127977, "engine": "Claude Code CLI · default model", "aliases": ["two-component Bose–Hubbard model", "spinor (spin-1) Bose–Hubbard model", "bosonic superexchange", "pseudospin-1/2 XXZ magnetism of lattice bosons", "counterflow superfluid / supercounterfluid (SCF)", "spin-Mott insulator", "Matsubara–Matsuda hard-core boson ↔ spin-1/2 correspondence", "boson Hubbard model (Fisher et al.'s own term)", "quantum cell model for bosons (Gersch–Knollman)", "bosonic Kugel–Khomskii / spin-orbital exchange", "spin-singlet and spin-nematic Mott phases"], "origin_story": "The spin story is older than the boson story, and the usual textbook ordering inverts the actual history. In 1956 Matsubara and Matsuda, trying to build a lattice caricature of liquid He II, wrote hard-core lattice bosons as spin-1/2 operators (b_i† → S_i^+, n_i → S_i^z + 1/2) and thereby converted the Bose lattice problem into an XXZ magnet: what we now call the superfluid is transverse (XY) spin order, ⟨S^+⟩ ≠ 0, and what we call the Mott/charge-density-wave insulator is longitudinal Ising order [21]. Explicitly: hopping t becomes J_⊥/2, nearest-neighbour repulsion V becomes J_z, and the chemical potential becomes a longitudinal field — so 'spin correlations in the Bose–Hubbard model' are not an exotic add-on, they are the model's native language, and superfluidity is a magnetic order parameter in disguise. The soft-core Hamiltonian itself — the sum of −t b_i†b_j, (U/2)n(n−1), −μn — was written by Gersch and Knollman in 1963 as a 'quantum cell model' for a Bose fluid [25], the same year Hubbard wrote the fermionic narrow-band model whose name would later be grafted onto it [26]; Fisher, Weichman, Grinstein and D. S. Fisher supplied the Mott-lobe phase diagram, the two distinct (generic vs. tip) universality classes, and the Bose-glass phase in 1989, calling it the 'boson Hubbard model' [29]. Jaksch, Bruder, Cirac, Gardiner and Zoller mapped it onto atoms in optical lattices in 1998 [30], and Greiner, Mandel, Esslinger, Hänsch and Bloch realized the Mott transition in 2002 [31,32]. The magnetic branch beyond condensation opened when the atoms were given an internal label. Deep in the n=1 Mott lobe, second-order perturbation theory in t/U on a two-component gas — the Anderson kinetic-exchange calculation [23], itself a lattice descendant of Kramers' 1934 anion-mediated superexchange [22] and structurally identical to Kugel and Khomskii's two-flavour spin–orbital superexchange [27] — yields H_eff = Σ⟨ij⟩ [J_z S_i^z S_j^z − J_⊥(S_i^x S_j^x + S_i^y S_j^y)] with J_⊥ = 4t_a t_b/U_ab and J_z = 2(t_a²+t_b²)/U_ab − 4t_a²/U_aa − 4t_b²/U_bb. Two things distinguish it from the fermionic case: Bose statistics enhances the virtual-doublon matrix element and flips the sign of the transverse exchange, so bosonic Mott insulators are natively XY-*ferro*magnetic rather than antiferromagnetic; and the anisotropy J_z/J_⊥ is set by the ratio U_ab/U_aa,bb, i.e. by scattering lengths, making the XXZ anisotropy an experimental knob rather than a material constant. Kuklov and Svistunov (posted May 2002) identified the easy-plane phase as a counterflow superfluid — off-diagonal order in a_i†b_i with zero total mass current, a state that is simultaneously an incompressible insulator for total density and a superfluid for the relative one [34]; Duan, Demler and Lukin showed how to design J_⊥, J_z and their signs with spin-dependent lattices [35]; Altman, Hofstetter, Demler and Lukin charted the resulting spin-ordered phases across the Mott–superfluid boundary [36]; and Demler and Zhou had already shown that spin-1 bosons with antiferromagnetic contact interaction give a qualitatively different Mott insulator, with nematic order at odd filling and a gapped, non-magnetic spin-singlet at even filling [33]. Experiment followed: Trotzky et al. resolved superexchange oscillations in double wells and reversed the exchange sign with a lattice tilt in 2008 [37]; Sun et al. built an extended bosonic Heisenberg antiferromagnet by engineering the sign flip in a 70-site chain in 2021 [38]; and the counterflow superfluid predicted in 2002 was finally observed in 2025 by adiabatically melting a low-entropy spin-Mott state of repulsively bound ab pairs [39].", "credit_audit": "Four separate misattributions compound here. (i) The model's name credits neither of the people who wrote it: Gersch and Knollman wrote the bosonic lattice Hamiltonian in 1963 [25]; Hubbard, whose name it carries, wrote a fermionic model and never treated bosons [26]; and Fisher, Weichman, Grinstein and Fisher, who supplied the physics that made it famous, called it the 'boson Hubbard model' [29] — the contraction to 'Bose–Hubbard' is later, diffuse, and I have not been able to pin it to a first user (the record here is murky; the term is in common use in the quantum-Monte-Carlo literature by the early 1990s). The widely repeated claim that Gersch and Knollman introduced the model 'in the context of granular superconductors' is not supported by their paper, which is a cell model for a repulsive Bose fluid; that appears to be retrofitted from the Josephson-array literature and propagated by Wikipedia. (ii) The boson↔spin correspondence that makes 'spin correlations in the Bose–Hubbard model' meaningful is Matsubara and Matsuda's [21] and is usually presented without attribution. (iii) 'Superexchange' in the cold-atom sense is Anderson's kinetic exchange [23], which is itself a reformulation of Kramers' 1934 anion-mediated mechanism [22]; the systematic canonical-transformation derivation that cold-atom papers actually reproduce is Chao–Spałek–Oleś [28], usually uncited, while the multi-flavour generalization is Kugel–Khomskii [27], also usually uncited. (iv) Within the 2002–2003 cold-atom burst, three groups arrived nearly simultaneously and the credit has flattened onto one: Kuklov–Svistunov (arXiv May 2002) have clear priority on the effective two-species spin Hamiltonian and on counterflow superfluidity [34]; Duan–Demler–Lukin (arXiv late 2002) contributed the engineering programme — designing sign, magnitude and anisotropy of the exchange [35]; Altman–Hofstetter–Demler–Lukin [36] produced the phase diagram treating spin order in Mott and superfluid regimes on the same footing; and Demler–Zhou [33] had already (arXiv April 2001) done the spin-1 case, which is a genuinely different problem. Reviews commonly cite [35] alone as 'the' bosonic superexchange paper. On the experimental side the record is comparatively clean, with one caveat noted below about what Trotzky et al. [37] actually observed.", "timeline": [{"year": 1934, "event": "Superexchange proposed: magnetic ions with no direct orbital overlap couple through virtual excitations of an intervening closed-shell anion (MnO). Written in French, in a Dutch journal, pre-Hubbard, pre-second-quantized-lattice-model.", "who": "Hendrik A. Kramers", "work": "\"L'interaction entre les atomes magnétogènes dans un cristal paramagnétique\", Physica 1, 182–192", "kind": "theory", "ref": 1}, {"year": 1950, "event": "Kramers' mechanism recast as kinetic exchange: second-order hopping through a doubly-occupied virtual state gives J = 4t²/U, antiferromagnetic because Pauli blocking permits only the singlet path. This is the calculation the cold-atom literature performs — with the fermionic sign.", "who": "Philip W. Anderson", "work": "\"Antiferromagnetism. Theory of Superexchange Interaction\", Phys. Rev. 79, 350", "kind": "formalization", "ref": 3}, {"year": 1956, "event": "Hard-core lattice bosons mapped exactly onto spin-1/2 operators; the lattice Bose fluid becomes an XXZ magnet, superfluidity becomes transverse spin order, the Mott/CDW state becomes Ising order. The single most important structural fact about 'spin correlations in Bose–Hubbard physics' — and it precedes the Bose–Hubbard model by seven years.", "who": "Takeo Matsubara, Hirotsugu Matsuda", "work": "\"Lattice Model of Liquid Helium, I\", Prog. Theor. Phys. 16, 569 (preceded by the letter, Prog. Theor. Phys. 16, 416)", "kind": "formalization", "ref": 8}, {"year": 1963, "event": "The Bose–Hubbard Hamiltonian is written down — soft-core bosons on a lattice with on-site repulsion — as a 'quantum cell model' for a repulsive Bose fluid, with an explicit instability of the small-fluctuation (localized) description toward the zero-momentum condensate at a critical density.", "who": "Harold A. Gersch, George C. Knollman", "work": "\"Quantum Cell Model for Bosons\", Phys. Rev. 129, 959 (Georgia Institute of Technology)", "kind": "theory", "ref": 9}, {"year": 1963, "event": "The fermionic narrow-band model that will, three decades later, lend half its name to a model it does not describe. Hubbard never treated bosons.", "who": "John Hubbard", "work": "\"Electron correlations in narrow energy bands\", Proc. R. Soc. Lond. A 276, 238", "kind": "theory", "ref": 11}, {"year": 1973, "event": "Two-flavour superexchange: with an internal (orbital) degree of freedom, the strong-coupling expansion of a degenerate Hubbard model gives coupled spin and pseudospin exchange with anisotropic, sign-tunable couplings. Structurally the same algebra as the modern two-component Bose–Hubbard spin Hamiltonian, published in Russian.", "who": "Kliment I. Kugel, Daniil I. Khomskii", "work": "Zh. Eksp. Teor. Fiz. 64, 1429; Engl. transl. \"Crystal structure and magnetic properties of substances with orbital degeneracy\", Sov. Phys. JETP 37, 725", "kind": "theory", "ref": 5}, {"year": 1977, "event": "Systematic canonical (Schrieffer–Wolff-type) transformation of the Hubbard model at large U, producing the constrained-hopping-plus-Heisenberg effective Hamiltonian — the t–J model — a decade before it was named and attributed to others. The same transformation, applied to bosons, is what generates bosonic superexchange.", "who": "Kuo-An Chao, Józef Spałek, Andrzej M. Oleś", "work": "\"Kinetic exchange interaction in a narrow S-band\", J. Phys. C: Solid State Phys. 10, L271", "kind": "formalization", "ref": 4}, {"year": 1989, "event": "The modern phase diagram: Mott lobes with particle–hole asymmetry, the distinction between the generic (z=2, mean-field-like) and fixed-density lobe-tip (z=1, (d+1)-XY) transitions, and the Bose-glass phase in the disordered case — an insulating, gapless, compressible state that is neither superfluid nor Mott, and the first canonical 'beyond superfluidity' phase of the model. The authors call it the 'boson Hubbard model'.", "who": "Matthew P. A. Fisher, Peter B. Weichman, Geoffrey Grinstein, Daniel S. Fisher", "work": "\"Boson localization and the superfluid-insulator transition\", Phys. Rev. B 40, 546", "kind": "formalization", "ref": 10}, {"year": 1998, "event": "Cold neutral atoms in an optical lattice shown to realize the Bose–Hubbard Hamiltonian with t and U computable from Wannier functions and laser parameters — the step that turned a condensed-matter toy model into an engineered system with tunable exchange.", "who": "Dieter Jaksch, Christoph Bruder, J. Ignacio Cirac, Crispin W. Gardiner, Peter Zoller", "work": "\"Cold Bosonic Atoms in Optical Lattices\", Phys. Rev. Lett. 81, 3108", "kind": "theory", "ref": 17}, {"year": 2001, "event": "Spin-1 bosons on a lattice: the Mott insulator of antiferromagnetically interacting spinor atoms is shown to host a spin-nematic phase at odd filling and a gapped spin-singlet (non-magnetic, no broken spin symmetry) phase at even filling, plus candidate fractionalized/Z2 phases. The first serious statement that a bosonic Mott insulator has non-trivial magnetic structure of its own.", "who": "Eugene Demler, Fei Zhou", "work": "\"Spinor Bosonic Atoms in Optical Lattices: Symmetry Breaking and Fractionalization\", arXiv:cond-mat/0104409; publ. Phys. Rev. Lett. 88, 163001 (2002)", "kind": "theory", "ref": 15}, {"year": 2002, "event": "Observation of the superfluid-to-Mott-insulator transition in a 3D optical lattice — loss and revival of matter-wave interference, and the gapped excitation spectrum of the insulator. The experimental platform on which every subsequent bosonic-magnetism result rests.", "who": "Markus Greiner, Olaf Mandel, Tilman Esslinger, Theodor W. Hänsch, Immanuel Bloch", "work": "\"Quantum phase transition from a superfluid to a Mott insulator in a gas of ultracold atoms\", Nature 415, 39 (see also Greiner's LMU dissertation [32])", "kind": "observation", "ref": 18}, {"year": 2002, "event": "Counterflow superfluidity (supercounterfluidity) predicted for two species in a commensurate lattice: an effective XXZ Hamiltonian whose easy-plane phase carries off-diagonal long-range order in a†b — each species flows, the total current vanishes, the system stays incompressible. The canonical 'superfluid that is not a superfluid' of the Bose–Hubbard model.", "who": "Anatoly B. Kuklov, Boris V. Svistunov", "work": "arXiv:cond-mat/0205069 (May 2002); publ. \"Counterflow Superfluidity of Two-Species Ultracold Atoms in a Commensurate Optical Lattice\", Phys. Rev. Lett. 90, 100401 (2003)", "kind": "theory", "ref": 12}, {"year": 2003, "event": "Explicit engineering of bosonic spin exchange: spin-dependent optical potentials and controlled collisions used to design the magnitude, sign and anisotropy of J_⊥ and J_z, mapping the two-component Bose–Hubbard Mott insulator onto essentially arbitrary lattice spin models (including anisotropic/compass-type Hamiltonians with topological order).", "who": "Lu-Ming Duan, Eugene Demler, Mikhail D. Lukin", "work": "\"Controlling Spin Exchange Interactions of Ultracold Atoms in Optical Lattices\", Phys. Rev. Lett. 91, 090402", "kind": "theory", "ref": 13}, {"year": 2008, "event": "Direct time-resolved measurement of superexchange in isolated double wells: coherent spin oscillations at 5 Hz–1 kHz, with the sign of the exchange reversed by tilting the double well — the first experimental handle on the sign of bosonic J.", "who": "Stefan Trotzky, Patrick Cheinet, Simon Fölling, Michael Feld, Ute Schnorrberger, Ana Maria Rey, Anatoli Polkovnikov, Eugene Demler, Mikhail Lukin, Immanuel Bloch", "work": "\"Time-Resolved Observation and Control of Superexchange Interactions with Ultracold Atoms in Optical Lattices\", Science 319, 295", "kind": "observation", "ref": 6}, {"year": 2021, "event": "An extended (70-site) one-dimensional isotropic Heisenberg antiferromagnet built from bosons: the natively ferromagnetic bosonic exchange sign is inverted, and antiferromagnetic order is demonstrated via staggered magnetization and spin correlations grown by optimized adiabatic passage from a low-entropy Néel product state.", "who": "Hui Sun, Bing Yang, Han-Yi Wang, Zhao-Yu Zhou, Guo-Xian Su, Han-Ning Dai, Zhen-Sheng Yuan, Jian-Wei Pan", "work": "\"Realization of a bosonic antiferromagnet\", Nature Physics 17, 990", "kind": "observation", "ref": 7}, {"year": 2025, "event": "Counterflow superfluidity observed, ~23 years after prediction: a low-entropy spin-Mott state of repulsively bound a–b pairs (de Hond et al., Phys. Rev. Lett. 128, 093401 (2022)) is adiabatically driven across the transition into the easy-plane phase, where relative-density (spin) coherence appears while the total density stays incompressible.", "who": "Yong-Guang Zheng et al. (USTC group of Zhen-Sheng Yuan, Jian-Wei Pan, with Youjin Deng)", "work": "\"Counterflow superfluidity in a two-com
