 the Mott state have different effective masses and the lobes are asymmetric in $\\mu$; the rotor model has an exact particle–hole symmetry it did not earn. (ii) Lobe structure: with $\\delta n$ unbounded there is no hard-core constraint and no discrete sequence of Mott lobes indexed by filling. (iii) The universality distinction at the lobe tip: the generic transition, driven at fixed $\\mu$ across a lobe boundary, has $z=2$ and mean-field-like exponents with the density as an active field; the transition through the lobe tip at fixed integer density has $z=1$ and lies in the $(d+1)$-dimensional XY class [10]. The rotor approximation imposes $z=1$ everywhere by construction — it is exactly the $\\mathrm{tip}$ theory extended illegitimately across the whole boundary. Papers that quote a $(d+1)$-XY exponent for a transition crossed at fixed chemical potential have used the rotor result outside its domain. The \"granular superconductor origin\" folklore attached to the model is a downstream symptom of the same conflation.\n\n### 3. \"Superexchange\" as a mechanism claim\n\n**Circulating form.** \"Atoms on neighbouring sites couple via the superexchange mechanism.\"\n\n**Assumption stripped.** A bridging closed-shell anion. Kramers' 1934 mechanism [1] is the coupling of magnetic cations *through an intervening non-magnetic ion* — Mn–O–Mn — with the O$^{2-}$ orbital supplying the virtual excitation. That is the \"super\". Anderson's kinetic exchange [3] is a single-band, direct-tunnelling second-order process with no intermediary; the ultracold realization inherits Anderson's structure exactly, with $t$ the nearest-neighbour Wannier overlap.\n\n**Corrected statement.** \"Superexchange\" in the optical-lattice literature is inherited terminology for second-order kinetic exchange. Nothing is exchanged through a third site. The usage is harmless as a label and wrong as a claim: statements that a bridging orbital, a Goodenough–Kanamori rule, or an anion-mediated pathway is operative in a two-site double well are false. Where the historical mechanism *is* meant, the honest name is Kramers–Anderson superexchange [1, 3, 2].\n\n### 4. Counterflow, pair, and spin superfluidity\n\n**Circulating form.** The three names used interchangeably for the ordered phase of the two-component Mott insulator.\n\n**Corrected statement.** Three inequivalent order parameters:\n\n| Phase | Order parameter | Total mass current | Compressibility $\\partial n/\\partial\\mu$ |\n|---|---|---|---|\n| Counterflow (supercounterfluid) | $\\langle a_i^\\dagger b_i\\rangle \\neq 0$ | zero | zero (Mott in total density) |\n| Pair superfluid | $\\langle a_i b_i\\rangle \\neq 0$ | nonzero | nonzero |\n| \"Spin superfluid\" | XXZ name for the first | zero | zero |\n\nCounterflow order is a particle–hole condensate in the relative channel: species $a$ flows one way, $b$ the other, the total current cancels, and the system remains incompressible [12]. It is the easy-plane phase of the XXZ magnet, $\\lvert J_\\perp\\rvert \u003e \\lvert J_z\\rvert$, and it is what was observed in 2025 by driving a spin-Mott state of repulsively bound $a$–$b$ pairs adiabatically across the transition and detecting relative-density coherence while the total density stayed gapped [14]. Pair superfluidity is a particle–particle condensate, requires attractive or strongly anisotropic interspecies interaction, and *does* carry mass current — it is a different phase, not a different word.\n\n### 5. The U(1)-versus-SU(2) caveat on spin stiffness\n\n\"Spin superfluid\" presupposes a conserved U(1) charge to be superfluid *in*. In the two-component model the species populations $N_a, N_b$ are separately conserved by collisions, $S^z$ generates a genuine U(1), and a spin stiffness $\\rho_s^{\\rm spin}$, a spin-sector Goldstone mode, and (in 3D) a Berezinskii-type transition all exist. At the SU(2)-symmetric point, or in a genuine spin-1 spinor gas where spin-changing collisions $\\lvert 0,0\\rangle \\leftrightarrow \\lvert +1,-1\\rangle$ break the separate conservation and only total $F$ survives, the argument fails: there is no single conserved U(1) charge whose phase can wind, no unique stiffness, and the \"superfluid\" language is at best a statement about a particular symmetry-broken direction, not a topologically protected transport property. This is also where the two-component and spinor models must be kept apart: the spin-1 Mott insulator at even filling is a gapped, non-magnetic total-singlet, and at odd filling nematic [15] — neither is a spin superfluid, and calling the even-filling singlet \"antiferromagnetic\" is a category error.\n\n### 6. The Jaksch–Bruder–Cirac–Gardiner–Zoller expressions for $t$ and $U$\n\n**Circulating form.**\n\n$$U = \\frac{4\\pi\\hbar^2 a_s}{m}\\int \\lvert w(\\mathbf{r})\\rvert^4\\, d^3r \\;\\approx\\; \\sqrt{\\tfrac{8}{\\pi}}\\,k a_s E_R \\left(\\tfrac{V_0}{E_R}\\right)^{3/4}, \\qquad t \\approx \\tfrac{4}{\\sqrt\\pi} E_R\\left(\\tfrac{V_0}{E_R}\\right)^{3/4} e^{-2\\sqrt{V_0/E_R}}$$\n\nquoted as *the* lattice parameters for any depth and any species.\n\n**Assumptions stripped.** Four. (i) *Single band*: $w$ is the lowest-band Wannier function and all higher bands are projected out; valid only for $U, t, \\mu \\ll \\hbar\\omega_{\\rm band}$. (ii) *Gaussian/harmonic Wannier*: the closed-form asymptotics above come from replacing $w$ by the ground state of the local harmonic well, which fails in shallow lattices where $w$ has substantial tunnelling tails, and slightly overestimates $U$ in deep ones. (iii) *Contact pseudopotential with $a_s$ the free-space scattering length*: valid when $a_s \\ll$ the on-site oscillator length, i.e. the confinement does not distort the two-body scattering state. (iv) *Density-independent $U$*: no multiband dressing. The standard repairs are well known and routinely omitted: at large $V_0$ the on-site interaction dresses the Wannier orbital and $U_n$ acquires an $n$-dependence, $U_n \\simeq U(1 - \\beta (n-1))$ with $\\beta$ of order a few percent per particle; near a Feshbach resonance or in tight confinement the contact form must be replaced by the confinement-induced-resonance treatment; and the exponential asymptotic for $t$ is valid only for $V_0/E_R \\gtrsim 5$ — below that it should be taken from the exact band structure (the bandwidth of the Mathieu equation), not from the formula. The formula [17] is a *derivation with a stated regime*, and the papers that quote it as a definition inherit errors of tens of percent in $U/t$ — which, near a lobe boundary, is the difference between phases."}, {"id": "frontier-and-open-problems", "title": "Frontier: Entropy, Gauge Fields, and the Magnetism Nobody Has Cooled To", "markdown": "## Frontier: Entropy, Gauge Fields, and the Magnetism Nobody Has Cooled To\n\nEverything in this dossier reduces to one number. The spin sector of the two-component Bose–Hubbard Mott insulator is governed by\n\n$$J \\sim \\frac{4t^2}{U}, \\qquad \\frac{J}{U} \\sim 4\\left(\\frac{t}{U}\\right)^2 \\ll 1,$$\n\nand for the lattice depths at which the Mott gap is well formed ($U/t \\gtrsim 30$ in 3D), $J/h$ lands in the range of tens of hertz to at most a few hundred hertz — temperatures of order $100\\ \\mathrm{pK}$ to a few nanokelvin. The 2025 counterflow experiment quotes $\\sim 1\\ \\mathrm{nK}$ for the ordered state [14], and that is not a typo: it is the actual scale of bosonic magnetism. Every open problem below is, at bottom, a restatement of the fact that $J$ is fourth-order small while the tools that produce cold atoms are second-order blunt.\n\n### The entropy ledger, and why charge cooling does not buy spin order\n\nThe standard conflation here is between *charge* entropy and *spin* entropy. Immersion-type protocols — the USTC staggered-immersion scheme, which embeds a Mott sample in a removable superfluid reservoir — reached a reported entropy per particle of $\\sim 0.0019\\,k_B$ ([Yang *et al.*, *Science* **369**, 550 (2020)](https://pubmed.ncbi.nlm.nih.gov/32554628/)), a ~65-fold reduction. That number describes the *defect* content of the density distribution: holes and doublons in an $n=1$ Mott insulator, whose creation costs $U$. It says essentially nothing about the spin sector, whose entropy budget is $\\ln 2 \\approx 0.69\\,k_B$ per site and whose energy scale is $J$, three to four orders of magnitude below $U$. A perfect band insulator of pinned atoms with random spins is charge-cold and spin-infinite-temperature.\n\nThe requirement for magnetism is therefore $s_{\\rm spin} \\lesssim 0.3$–$0.5\\,k_B$ per particle, and no equilibrium cooling technique has removed spin entropy at the $J$ scale. It is worth being blunt about what the target even is: in 1D there is no ordered phase at any $T\u003e0$, and in 2D the isotropic Heisenberg model is forbidden long-range order at finite temperature by Mermin–Wagner, with only a correlation length $\\xi \\sim \\exp(2\\pi\\rho_s/T)$ growing exponentially. \"Observing the bosonic antiferromagnet\" in $d\\le 2$ means observing *correlations over some number of sites*, never a thermodynamic ordered phase. Papers and press releases that elide this are describing 3D physics with 2D data.\n\n### Preparation is not cooling — and both landmark results are preparation\n\nBoth [7] and [14] sidestep the entropy problem the same way, and the method deserves to be named precisely: **adiabatic passage from a gapped, low-entropy product state**. In the 2021 chain, a superlattice-imposed Néel pattern — a zero-entropy classical spin configuration — is ramped into the isotropic-exchange regime, and correlations grow as the state follows the instantaneous ground state [7]. In the 2025 counterflow experiment, the initial state is the spin-Mott of repulsively bound $a$–$b$ pairs ([de Hond *et al.*, *PRL* **128**, 093401 (2022)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.128.093401)), which is gapped by the interaction anisotropy $U_{ab}-U_{aa}$ — a *first-order-small* gap, not a superexchange gap, which is exactly why it can be prepared cleanly — and the system is then driven across the Ising-to-easy-plane transition into the counterflow phase [14].\n\nThis is state engineering, not refrigeration, and it inherits the corresponding limitation. The ramp must be slow compared to $\\hbar/\\Delta$ where $\\Delta$ is the instantaneous gap, and $\\Delta \\to 0$ at the critical point; the resulting Kibble–Zurek defect density sets a maximum correlated domain size, independent of how good the initial state was. With $\\hbar/J \\sim 10\\ \\mathrm{ms}$ and lifetimes of $10^2$–$10^3\\ \\mathrm{ms}$, one has perhaps ten to a hundred exchange times to work with. The honest statement of the frontier is: **no bosonic spin system has been equilibrated at $T \\ll J$; every existing result is a finite-time ramp whose correlations are limited by the ramp, not by the thermodynamics.**\n\n### What the microscope resolves\n\nThe measurement side is, for once, ahead of the preparation side. Spin- and site-resolved quantum-gas microscopy delivers the full snapshot distribution, from which arbitrary $n$-point functions follow. The 2025 work extracts the counterflow order not from a single-particle interference pattern but from *antipair* correlations in both real and momentum space [14] — the appropriate observable, since the counterflow order parameter $\\langle a_i^\\dagger b_i\\rangle$ is invisible to any single-species time-of-flight measurement. This is the resolution of a long-standing detection problem: the phase is superfluid in the spin channel and insulating in the charge channel, so every conventional superfluidity diagnostic returns \"insulator.\"\n\nNon-local order is the natural next target and is not yet done for bosons. String operators of the form $\\mathcal{O}_{\\rm string}(i,j) = \\langle S^z_i \\prod_{i\u003ck\u003cj} e^{i\\pi S^z_k} S^z_j\\rangle$ diagnose the Haldane phase of the spin-1 chain and the parity order of the Mott insulator; the machinery exists, the states do not.\n\n### Engineered exchange: frustration, compass terms, gauge fields\n\nThe Duan–Demler–Lukin programme [13] — spin-dependent lattices plus controlled collisions to set the sign, magnitude and anisotropy of $J_\\perp$ and $J_z$ independently — was written as a route to arbitrary lattice spin models, including compass- and Kitaev-type anisotropic exchange with topologically ordered ground states. Two decades on, its *scalar* content has been realized (sign control of $J$ via tilt [6], anisotropy control via $U_{ab}/U_{aa}$ [14]) and its *anisotropic, bond-directional* content has not. Bosonic Kitaev honeycomb exchange remains a proposal; Rydberg arrays and trapped ions have taken the frustrated-magnetism lead precisely because their interaction scale is not $4t^2/U$.\n\nThe gauge-field branch is the most active theoretical descendant. Two-component bosons in a lattice, with one species treated as matter and the other as a $\\mathbb{Z}_2$ gauge field living on the bonds, give density-dependent Peierls phases and flux attachment ([Barbiero *et al.*, arXiv:1810.02777](https://arxiv.org/abs/1810.02777)); Floquet-engineered minimal $\\mathbb{Z}_2$ building blocks have been demonstrated in double wells, and proposals now extend to confinement transitions beyond 1D with dipolar atoms ([arXiv:2509.16200](https://arxiv.org/pdf/2509.16200)). Extended, gauge-invariant $\\mathbb{Z}_2$ lattices with dynamical matter remain unbuilt.\n\n### Resolved versus open, stated plainly\n\n| Claim | Status |\n|---|---|\n| Counterflow superfluidity in a two-component lattice Mott insulator | **Resolved** (2025) — [14], ~1 nK, spin-resolved microscope; predicted 2002 [12] |\n| Sign and magnitude of bosonic superexchange | **Resolved** (2008) — double-well spectroscopy [6] |\n| Bosonic Heisenberg AFM correlations in an extended chain | **Resolved for 1D correlations** (2021) [7]; no 2D/3D result |\n| Equilibrium spin ordering at $T\\ll J$ by cooling | **Open** — no protocol removes spin entropy at the $J$ scale |\n| Lattice (checkerboard) supersolid from extended Bose–Hubbard $V$ | **Open** — cavity-mediated realizations use infinite-range $V$; short-range case unobserved (see the 2025 review, [arXiv:2502.06660](https://arxiv.org/abs/2502.06660)) |\n| Spin-nematic / spin-singlet Mott phases of spin-1 bosons [15] | **Open** — $U_2/U_0$ is a few percent, so the scale is more forgiving than $J$, yet no lattice experiment has resolved them |\n| $\\mathbb{Z}_2$ fractionalized spin liquid in the spin-1 Mott insulator [15] | **Open**, and no credible near-term route |\n| Borromean supercounterfluidity (three components, pairwise counterflow only) | **Open** — theory only, [*PRL* **127**, 255303 (2021)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.127.255303) |\n| Bond-anisotropic (compass/Kitaev) bosonic exchange [13] | **Open** — engineering demonstrated only for isotropic/XXZ couplings |\n\nThe pattern across the open rows is uniform. Where the relevant scale is first-order in the interactions — the spin-Mott pairing gap, the spin-1 splitting $U_2$ — the physics is reachable. Where it is $4t^2/U$, it is not, and twenty-three years elapsed between the counterflow prediction [12] and its observation [14] for exactly that reason. The Matsubara–Matsuda dictionary [8] guarantees that the magnetism is *there*, encoded in the same Hilbert space that already produced the 2002 Mott transition; the obstruction was never conceptual."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\n### (a) What I would defend with my reputation\n\nThat the Matsubara–Matsuda correspondence [8] is not an analogy but an isomorphism of Hilbert spaces, and that everything called \"spin correlation in the Bose–Hubbard model\" is downstream of it. Hard-core bosons at half filling *are* an XXZ magnet in a longitudinal field; the superfluid–Mott transition in that limit *is* an XY-ordering transition; the supersolid *is* coexisting Ising and XY order. I would defend this in a seminar against anyone who claims charge language is more fundamental than spin language here. They are two coordinate systems on one space, and the choice is dictated by what the probe couples to.\n\nI would also defend, without qualification: the sign structure of bosonic exchange. $J_\\perp = +4t_at_b/U_{ab}$ is XY-*ferromagnetic* for two distinguishable species, because the virtual doublon is Bose-enhanced rather than Pauli-blocked. The fermionic $J = 4t^2/U \u003e 0$ antiferromagnetic reflex is imported wholesale and it is wrong. The 2021 bosonic antiferromagnet required an engineered sign flip precisely because nature does not hand you one [7]. And I would defend that Kuklov–Svistunov [12] have priority on the two-species effective spin Hamiltonian and on counterflow superfluidity, that Duan–Demler–Lukin [13] contributed the engineering programme rather than the discovery, and that the flattening of these into a single citation is a documented failure of the review literature.\n\nFinally: the Bose glass is a distinct phase [10], gapless, compressible, insulating, not adiabatically connected to either neighbour. Anyone still teaching the two-phase cartoon is teaching a special case as though it were the model.\n\n### (b) What is shakier than the literature admits\n\nThree assumptions, named.\n\n**Adiabaticity in the spin sector.** Nearly every experimental claim of bosonic magnetism assumes the spin degrees of freedom equilibrate on the timescale of the ramp. They do not. With $J/k_B \\sim$ hundreds of picokelvin and lattice lifetimes set by three-body loss and spontaneous emission, the spin sector is generically *quenched*, not cooled. The literature reports $T/J$ as though it were a measured thermodynamic temperature; in most cases it is a fitted parameter of a non-equilibrium state whose entropy never left. The honest statement is that the spin entropy is redistributed, not removed.\n\n**The second-order truncation.** $J \\sim 4t^2/U$ is the leading term of a canonical transformation [4] whose expansion parameter is $t/U$. Cold-atom experiments run at $t/U \\sim 0.1$–$0.3$, where fourth-order ring exchange, correlated hopping, and density-dependent corrections are at the ten-to-thirty-percent level — comparable to the anisotropies people claim to be engineering. Papers quoting $J_z = 2(t_a^2+t_b^2)/U_{ab} - 4t_a^2/U_{aa} - 4t_b^2/U_{bb}$ to three significant figures at $t/U = 0.25$ are quoting a truncation error.\n\n**The single-band assumption.** $U$ is not a parameter; it is a matrix element of a Wannier function that itself depends on the interaction. Interaction-induced admixture of higher bands renormalizes $U$, and near a Feshbach resonance the single-band Bose–Hubbard model is not merely quantitatively but structurally wrong. The interspecies ratio $U_{ab}/U_{aa}$, which sets the entire XXZ anisotropy and thus the phase, is the quantity most sensitive to this.\n\nI will add a fourth, softer one: I do not believe the community has honestly confronted how little of the two-component phase diagram has been *measured* as opposed to *computed*. Counterflow superfluidity in particular has strong theoretical standing [12] and thin experimental standing.\n\n### (c) The three questions I would work on\n\n1. **Entropy engineering, not cooling.** Can one deterministically remove spin entropy — via an entropy-absorbing reservoir region, or measurement-and-feedback on a quantum-gas microscope — rather than fighting for a lower global $T$? Everything in §8 bottlenecks here; solve this and half the phase diagram becomes accessible at once.\n2. **A clean counterflow superfluid.** Measure $\\langle a_i^\\dagger b_j\\rangle$ correlations directly and demonstrate the defining signature: total density incompressible, relative phase coherent. It is the one prediction in this subject with high theoretical confidence and no unambiguous experiment.\n3. **Frustrated bosonic magnetism with engineered gauge fields.** Bosons on a frustrated lattice with complex tunnelling have no sign problem in the way fermions do, so quantum Monte Carlo can referee the experiment — the rarest configuration in strongly correlated physics, where simulation and analogue simulator can actually cross-check each other.\n\n**Reading path:**\n\n1. Matsubara \u0026 Matsuda (1956) [8] — read first; the dictionary that makes every later paper in this dossier translatable.\n2. Fisher, Weichman, Grinstein \u0026 Fisher (1989) [10] — the phase-diagram architecture, the Bose glass, and the $z=2$ vs. lobe-tip $z=1$ distinction that rotor models destroy.\n3. Chao, Spałek \u0026 Oleś (1977) [4] — the canonical transformation the cold-atom papers reproduce without citing; read it to know exactly what your $t/U$ expansion has thrown away.\n4. Kuklov \u0026 Svistunov (2003) [12] — the two-species effective spin Hamiltonian and counterflow superfluidity, at the source rather than through the review-literature paraphrase.\n5. Trotzky et al. (2008) [6] — the cleanest measurement of the exchange coupling and its sign; read it alongside §6 to see precisely where \"measured coupling constant\" ends and \"observed ordered phase\" begins."}], "references": [{"n": 1, "title": "L'interaction Entre les Atomes Magnétogènes dans un Cristal Paramagnétique", "authors": ["Hendrik A. Kramers"], "year": 1934, "venue": "Physica 1, 182–192 (French-language, Dutch journal)", "url": "https://www.sciencedirect.com/science/article/abs/pii/S0031891434900239", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Quantum Mechanics: The Key to Understanding Magnetism", "authors": ["John H. Van Vleck"], "year": 1977, "venue": "Nobel Lecture, 8 December 1977, The Nobel Foundation", "url": "https://www.nobelprize.org/prizes/physics/1977/vleck/lecture/", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Antiferromagnetism. Theory of Superexchange Interaction", "authors": ["Philip W. Anderson"], "year": 1950, "venue": "Physical Review 79, 350–356", "url": "https://doi.org/10.1103/PhysRev.79.350", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Kinetic exchange interaction in a narrow S-band", "authors": ["K. A. Chao", "J. Spałek", "A. M. Oleś"], "year": 1977, "venue": "Journal of Physics C: Solid State Physics 10, L271", "url": "https://iopscience.iop.org/article/10.1088/0022-3719/10/10/002", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Crystal structure and magnetic properties of substances with orbital degeneracy", "authors": ["K. I. Kugel", "D. I. Khomskii"], "year": 1973, "venue": "Zh. Eksp. Teor. Fiz. 64, 1429; English translation Sov. Phys. JETP 37, 725–730", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Time-Resolved Observation and Control of Superexchange Interactions with Ultracold Atoms in Optical Lattices", "authors": ["S. Trotzky", "P. Cheinet", "S. Fölling", "M. Feld", "U. Schnorrberger", "A. M. Rey"], "year": 2008, "venue": "Science 319, 295–299", "url": "https://arxiv.org/abs/0712.1853", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Realization of a bosonic antiferromagnet", "authors": ["Hui Sun", "Bing Yang", "Han-Yi Wang", "Zhao-Yu Zhou", "Guo-Xian Su", "Han-Ning Dai"], "year": 2021, "venue": "Nature Physics 17, 990–994 (arXiv:2009.01426)", "url": "https://www.nature.com/articles/s41567-021-01277-1", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Lattice Model of Liquid Helium, I", "authors": ["Takeo Matsubara", "Hirotsugu Matsuda"], "year": 1956, "venue": "Progress of Theoretical Physics 16, 569–582 (preceded by the letter, Prog. Theor. Phys. 16, 416–417)", "url": "https://academic.oup.com/ptp/article/16/6/569/1907565", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Quantum Cell Model for Bosons", "authors": ["H. A. Gersch", "G. C. Knollman"], "year": 1963, "venue": "Physical Review 129, 959 (Georgia Institute of Technology)", "url": "https://link.aps.org/doi/10.1103/PhysRev.129.959", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Boson localization and the superfluid-insulator transition", "authors": ["Matthew P. A. Fisher", "Peter B. Weichman", "G. Grinstein", "Daniel S. Fisher"], "year": 1989, "venue": "Physical Review B 40, 546–570", "url": "https://link.aps.org/doi/10.1103/PhysRevB.40.546", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "Electron correlations in narrow energy bands", "authors": ["J. Hubbard"], "year": 1963, "venue": "Proceedings of the Royal Society of London A 276, 238–257", "url": "https://doi.org/10.1098/rspa.1963.0204", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Counterflow Superfluidity of Two-Species Ultracold Atoms in a Commensurate Optical Lattice", "authors": ["A. B. Kuklov", "B. V. Svistunov"], "year": 2003, "venue": "Physical Review Letters 90, 100401 (arXiv:cond-mat/0205069, May 2002; erratum PRL 114, 149901 (2015))", "url": "https://arxiv.org/abs/cond-mat/0205069", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Controlling Spin Exchange Interactions of Ultracold Atoms in Optical Lattices", "authors": ["L.-M. Duan", "E. Demler", "M. D. Lukin"], "year": 2003, "venue": "Physical Review Letters 91, 090402", "url": "https://doi.org/10.1103/PhysRevLett.91.090402", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Counterflow superfluidity in a two-component Mott insulator", "authors": ["Yong-Guang Zheng", "Zhen-Sheng Yuan", "Youjin Deng", "Jian-Wei Pan"], "year": 2025, "venue": "Nature Physics (published 8 January 2025); arXiv:2403.03479 (\"Observation of counterflow superfluidity in a two-componen", "url": "https://arxiv.org/abs/2403.03479", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Spinor Bosonic Atoms in Optical Lattices: Symmetry Breaking and Fractionalization", "authors": ["E. Demler", "F. Zhou"], "year": 2002, "venue": "Physical Review Letters 88, 163001 <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* ---- special blocks, rendered BEFORE the prose (as in the app) ---- */
  var hasTL=D.timeline&&D.timeline.length, hasNG=D.neglected&&D.neglected.length, hasCF=D.conflations&&D.conflations.length;
  var pre='';
  if(hasTL){
    pre+='<section class="block" id="blk-timeline"><h3>Origins timeline</h3><div class="lead">How the field actually arrived — scroll through it, with the paper that marks each turn.</div>'+
      '<div class="tslider" id="tslider">'+
      D.timeline.map(function(t){var ref=(t.ref?' <a class="cite" href="#ref-'+(+t.ref||0)+'">['+esc(t.ref)+']</a>':'');
        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+
      '</div><div class="thint">drag or scroll through time →</div></section>';
  }
  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+
      (D.credit_audit?'<div class="callout" style="margin-top:22px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>':'')+'</section>';
  }
  var langHtml='';
  if(hasCF){

      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></section>';
  }
  /* prose sections */
  var sectionsHtml=D.sections.map(function(s){

  /* references (kept at the end) */

      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
