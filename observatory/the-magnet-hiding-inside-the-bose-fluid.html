ponent Mott insulator\", Nature Physics (2025); arXiv:2403.03479", "kind": "observation", "ref": 14}], "neglected": [{"name": "Takeo Matsubara and Hirotsugu Matsuda", "role": "Established the exact correspondence between hard-core lattice bosons and spin-1/2 XXZ magnets in 1956 — the mapping under which 'superfluid' and 'magnetically ordered' are the same statement. Essentially every claim in this field about spin correlations in the Bose–Hubbard model is an application of their transformation, and the closely related supersolid proposal (Matsuda–Tsuneto 1970; Liu–Fisher 1973) descends from the same paper (verify).", "evidence": "Their own papers explicitly build the spin representation and contrast it with Yang–Lee's lattice-gas/Ising correspondence, noting that Yang and Lee 'did not take into consideration the vector character of spins' and so missed the quantum (transverse-exchange) term. Cold-atom papers routinely present the mapping without citation, or attribute it vaguely to Holstein–Primakoff.", "ref": 8}, {"name": "Harold A. Gersch and George C. Knollman", "role": "Wrote the Bose–Hubbard Hamiltonian in 1963, twenty-six years before Fisher, Weichman, Grinstein and Fisher, including the physical mechanism — competition between on-site number localization and delocalization into the k=0 state, with an instability at a critical density.", "evidence": "Phys. Rev. 129, 959. They are cited perfunctorily when cited at all, and the citation is usually wrong about the content: Wikipedia and a large downstream literature assert the model was 'introduced in the context of granular superconductors', whereas the paper is a cell model of a repulsive Bose fluid in the liquid-helium tradition. The granular-superconductor / Josephson-array lineage is a separate convergent development.", "ref": 9}, {"name": "Hendrik A. Kramers", "role": "Invented superexchange in 1934. Everything the cold-atom literature calls 'superexchange' descends from this paper, usually via Anderson's kinetic-exchange reformulation.", "evidence": "Van Vleck's 1977 Nobel lecture, delivered in the year Anderson shared the prize, situates the exchange-interaction lineage and Kramers' role directly; the mechanism survives in the historically honest name 'Kramers–Anderson superexchange', which the ultracold literature almost never uses. Kramers never received a Nobel Prize.", "ref": 2}, {"name": "Józef Spałek and Andrzej M. Oleś (with Kuo-An Chao)", "role": "Derived the large-U effective Hamiltonian of the Hubbard model by canonical transformation in 1977 — constrained hopping plus Heisenberg exchange, i.e. the t–J model — ten years before the name and the standard attribution to Anderson's 1987 RVB paper.", "evidence": "J. Phys. C 10, L271 (1977), with a companion treatment of the doubly-degenerate band the same year. The priority is documented but rarely reflected in citation practice; the 'superexchange from a Hubbard model' derivation reproduced in cold-atom papers is theirs in structure.", "ref": 4}, {"name": "Kliment I. Kugel and Daniil I. Khomskii", "role": "Produced the multi-flavour superexchange Hamiltonian — coupled spin and pseudospin sectors with anisotropic and sign-tunable exchange, derived from a degenerate Hubbard model at large U. This is the direct structural ancestor of the two-component/spinor Bose–Hubbard spin Hamiltonian.", "evidence": "Zh. Eksp. Teor. Fiz. 64, 1429 (1973), Russian original with an English JETP translation; their 1982 Uspekhi review consolidated the framework. Optical-lattice papers deriving 'a new XXZ/spin–orbital model' from two-species bosons overwhelmingly cite 2002–2003 cold-atom theory rather than the 1973 original.", "ref": 5}, {"name": "Anatoly B. Kuklov and Boris V. Svistunov", "role": "Identified counterflow superfluidity (supercounterfluidity) in the commensurate two-species lattice — the phase in which the spin sector orders in the XY plane while the charge sector remains an incompressible Mott insulator. Posted to arXiv in May 2002, several months before the better-known spin-engineering papers.", "evidence": "arXiv:cond-mat/0205069 (May 2002) vs. the Duan–Demler–Lukin and Altman–Hofstetter–Demler–Lukin preprints later in 2002–2003; the 2025 experimental observation is framed explicitly as a confirmation of their prediction. In review articles the bosonic XXZ mapping is usually credited to Duan–Demler–Lukin alone.", "ref": 12}], "conflations": [{"claim": "'Superexchange' in optical lattices.", "clarification": "Kramers' superexchange is a higher-order process mediated by an intervening closed-shell anion (Mn–O–Mn); Anderson's kinetic exchange is second order in t/U within a single-band model with no bridging ion; the ultracold 'superexchange' is Anderson kinetic exchange with direct nearest-neighbour tunnelling. There is no 'super' in it — nothing is being exchanged through an intermediary site. The name is inherited terminology, not a mechanism claim, and papers that invoke 'the superexchange mechanism' as though a bridging orbital were involved are wrong about their own system."}, {"claim": "J = 4t²/U is antiferromagnetic.", "clarification": "That sign is a fermionic statement: Pauli exclusion permits the virtual doublon only in the singlet channel, so the singlet is lowered. For two distinguishable bosonic species the virtual double occupancy carries a Bose enhancement and the transverse exchange comes out with the opposite sign, J_⊥ = +4t_a t_b/U_ab, i.e. XY-ferromagnetic; the longitudinal part J_z = 2(t_a²+t_b²)/U_ab − 4t_a²/U_aa − 4t_b²/U_bb changes sign with the interaction anisotropy U_ab/U_aa,bb. This is exactly why the bosonic antiferromagnet [38] required deliberately engineering a sign flip (sublattice rotation / tilt-controlled exchange [37]) rather than simply cooling. Formulas lifted from fermionic Mott-insulator papers into bosonic contexts routinely carry the wrong sign convention."}, {"claim": "The Bose–Hubbard model has two phases, superfluid and Mott insulator.", "clarification": "Even in the single-component model that is false: with disorder there is the Bose glass — gapless, compressible, insulating, and not adiabatically connected to either [29]. With an internal degree of freedom the count grows: counterflow superfluid (charge-insulating, spin-superfluid) [34], spin-Mott (insulating in both sectors, gapped by pair binding), Ising-ordered/phase-separated Mott states, spin-nematic and spin-singlet Mott states for spin-1 [33]. 'Beyond superfluidity or condensation' is not a fringe regime of this model; it is most of its phase diagram."}, {"claim": "Counterflow superfluid = pair superfluid = spin superfluid.", "clarification": "Three distinct order parameters. Counterflow (supercounterfluid) order is ⟨a_i† b_i⟩ ≠ 0 — a particle–hole condensate, total mass current zero, total density incompressible. Pair superfluidity is ⟨a_i b_i⟩ ≠ 0 — a particle–particle condensate carrying total mass current, arising for attractive or strongly anisotropic interspecies interaction. 'Spin superfluid' is the XXZ-language name for the first, correct only if the spin symmetry is U(1); with full SU(2) symmetry there is no superfluid stiffness in the usual sense. Papers slide between the three names as if they were synonyms."}, {"claim": "'Spinor Bose–Hubbard model' and 'two-component Bose–Hubbard model' are the same thing.", "clarification": "In the two-component (pseudospin-1/2) model the species label is conserved by collisions; the spin is a bookkeeping index and the effective magnet is XXZ with anisotropy set by U_ab/U_aa,bb. In the genuine spin-1 (spinor) model, spin-changing collisions are allowed and the on-site interaction splits as U_0 + U_2 S², so total spin — not the individual populations — is conserved. The consequences differ qualitatively: the spin-1 Mott insulator at even filling is a gapped spin singlet with no magnetic order and no broken spin symmetry, while at odd filling it is nematic (breaks rotation, preserves time reversal) [33]. Calling that even-filling singlet 'antiferromagnetic' — as happens routinely — is simply wrong."}, {"claim": "Trotzky et al. observed antiferromagnetic order / a Néel state in a bosonic Mott insulator.", "clarification": "They prepared a staggered spin pattern by superlattice engineering and then watched coherent second-order tunnelling oscillate in isolated double wells [37]. That is a measurement of the superexchange coupling constant and its sign, not the observation of a spontaneously ordered thermodynamic phase. The extended-chain, adiabatically grown antiferromagnet with genuine correlations came in 2021 [38]."}, {"claim": "The Bose–Hubbard model and the quantum rotor / Josephson-junction-array model are the same model.", "clarification": "They agree only in the limit of large integer filling, where number fluctuations are small and n_i can be treated as an unbounded integer conjugate to a phase. The rotor model has no particle–hole asymmetry, no lobe structure in μ, and no hard-core constraint; the Bose–Hubbard Mott lobes and the distinction between the generic (z=2) and fixed-density lobe-tip (z=1, (d+1)-dimensional XY) transitions [29] are precisely what the rotor approximation throws away. The 'granular superconductor' origin story for the Bose–Hubbard model is a symptom of this conflation."}, {"claim": "The superfluid–Mott transition is a charge phenomenon and spin physics is something added afterwards.", "clarification": "Under Matsubara–Matsuda [21] the hard-core single-component transition *is* a magnetic transition — XY ordering of a spin-1/2 model in a longitudinal field — and the supersolid is coexisting Ising and XY order. Charge and spin language are two coordinate systems on the same Hilbert space; which one is 'fundamental' is a matter of which degrees of freedom the experiment couples to, not of physics."}], "sections": [{"id": "origins-and-the-four-fathers", "title": "Four Origins, One Misnamed Model: Kramers, Matsubara–Matsuda, Gersch–Knollman, Hubbard", "markdown": "## Four Origins, One Misnamed Model: Kramers, Matsubara–Matsuda, Gersch–Knollman, Hubbard\n\nThe phrase \"spin correlations in the Bose–Hubbard model\" is a four-way collision of independent lineages, and the model's name credits none of them correctly. One lineage supplies the *mechanism* by which localized degrees of freedom talk to each other at second order in tunnelling; one supplies the *dictionary* under which bosonic and magnetic language describe the same Hilbert space; one supplies the *Hamiltonian*; and one supplies half the name while having nothing to do with bosons. Sorting these out is not antiquarianism. Each mis-crediting travels with a physics error attached — a sign, an assumption, or a phase count — and those errors are still in circulation.\n\n### Lineage 1: Kramers 1934, and what \"super\" meant\n\nKramers asked how paramagnetic ions in a crystal — Mn$^{2+}$ in MnO, with no appreciable direct orbital overlap, separated by an intervening closed-shell O$^{2-}$ — nonetheless couple strongly enough to order antiferromagnetically [1]. His answer: the coupling is *mediated*. Virtual admixture of excited configurations in which an anion electron is promoted onto a magnetic cation generates an effective cation–cation exchange. The paper is in French, in a Dutch journal, published a year before the Heisenberg exchange formalism had settled into textbooks and three decades before anyone wrote a second-quantized lattice model with an on-site $U$. The word *super* in \"superexchange\" refers precisely to this: exchange achieved *over and above* direct overlap, through an intermediary.\n\n**Status: established.** Van Vleck's 1977 Nobel lecture, delivered in the year Anderson shared the prize, places Kramers explicitly in the exchange lineage [2]. Kramers never received a Nobel Prize. The historically honest name \"Kramers–Anderson superexchange\" survives in the oxide-magnetism literature and is essentially absent from the ultracold-atom literature.\n\n### Lineage 2: Anderson 1950, and the sign that is Pauli's\n\nAnderson recast the mechanism as *kinetic exchange* within a single-band model: two localized electrons on adjacent sites, hopping $t$, on-site repulsion $U$, virtual doubly-occupied intermediate state, second-order perturbation theory [3]. The result is\n\n$$J = \\frac{4t^2}{U},\\qquad H_{\\rm eff}=J\\sum_{\\langle ij\\rangle}\\Big(\\mathbf S_i\\cdot\\mathbf S_j-\\tfrac14 n_i n_j\\Big),$$\n\nantiferromagnetic — because Pauli exclusion permits the virtual doublon only in the spin-singlet channel, so only the singlet gets lowered by $-4t^2/U$. The systematic version of this calculation, the canonical (Schrieffer–Wolff-type) transformation that generates constrained hopping plus Heisenberg exchange to all orders in a controlled expansion, is Chao, Spałek and Oleś in 1977 [4] — the $t$–$J$ model, a decade before the name and the standard attribution. The multi-flavour generalization, with coupled spin and pseudospin sectors and anisotropic, sign-tunable couplings derived from a degenerate Hubbard model, is Kugel and Khomskii in 1973, in Russian [5]. Both are structural ancestors of every \"we derive a novel XXZ model for two-species bosons\" paper written since 2002; both are routinely uncited there.\n\nTwo conflations to name now, because they propagate through everything that follows. First: **the ultracold \"superexchange\" is not superexchange.** It is Anderson kinetic exchange with direct nearest-neighbour tunnelling between lattice sites. There is no bridging anion, nothing is exchanged through an intermediary, and papers that invoke \"the superexchange mechanism\" as though a mediating orbital were involved are wrong about their own apparatus. The name is inherited terminology, not a mechanism claim. Second: **$J=4t^2/U\u003e0$ is a fermionic statement.** For two distinguishable bosonic species the virtual double occupancy carries a Bose enhancement rather than a Pauli blockade, and the transverse exchange emerges with the opposite sign,\n\n$$J_\\perp = +\\frac{4t_a t_b}{U_{ab}},\\qquad J_z = \\frac{2(t_a^2+t_b^2)}{U_{ab}}-\\frac{4t_a^2}{U_{aa}}-\\frac{4t_b^2}{U_{bb}},$$\n\ni.e. XY-*ferro*magnetic transverse coupling, with $J_z$ changing sign as the interaction anisotropy $U_{ab}/U_{aa,bb}$ is tuned. This is why building a bosonic antiferromagnet required deliberately engineering a sign flip rather than merely cooling [6, 7] — a point Section 3 returns to in detail.\n\n### Lineage 3: Matsubara–Matsuda 1956, the dictionary\n\nThe structural fact on which this entire dossier rests is not about magnets or about bosons but about the identity of the two descriptions. Matsubara and Matsuda, modelling liquid helium on a lattice, observed that a hard-core boson site has exactly two states, $|0\\rangle$ and $|1\\rangle$, and mapped them onto spin-$\\tfrac12$ [8]:\n\n$$b_i^\\dagger \\to S_i^+,\\qquad b_i \\to S_i^-,\\qquad n_i \\to S_i^z+\\tfrac12.$$\n\nUnder this substitution the hard-core Bose–Hubbard Hamiltonian *becomes* the XXZ magnet in a longitudinal field,\n\n$$H=-t\\sum_{\\langle ij\\rangle}(b_i^\\dagger b_j+{\\rm h.c.})+V\\sum_{\\langle ij\\rangle}n_in_j-\\mu\\sum_i n_i \\;\\longleftrightarrow\\; -2t\\sum_{\\langle ij\\rangle}(S^x_iS^x_j+S^y_iS^y_j)+V\\sum_{\\langle ij\\rangle}S^z_iS^z_j-h\\sum_i S^z_i,$$\n\nwith the correspondences that follow immediately: superfluidity $\\leftrightarrow$ transverse (XY) spin order, $\\langle b\\rangle \\leftrightarrow \\langle S^+\\rangle$; the Mott/charge-density-wave insulator $\\leftrightarrow$ Ising order along $z$; chemical potential $\\leftrightarrow$ longitudinal field; and the supersolid $\\leftrightarrow$ coexisting Ising and XY order, the line that leads to Matsuda–Tsuneto (1970) and Liu–Fisher (1973) (verify). Matsubara and Matsuda were explicit that this goes beyond the Yang–Lee lattice-gas/Ising correspondence, which \"did not take into consideration the vector character of spins\" and thereby discarded the transverse-exchange term that carries all the quantum dynamics.\n\n**Status: established, and chronically uncited.** This is 1956 — seven years *before* the bosonic lattice Hamiltonian was written down in the form we use. Cold-atom papers regularly deploy the mapping with no citation at all, or attribute it vaguely to Holstein–Primakoff, which is a different (large-$S$, approximate) transformation in the opposite direction.\n\n### Lineage 4: Gersch–Knollman 1963 — and Hubbard 1963\n\nGersch and Knollman wrote the Bose–Hubbard Hamiltonian [9]:\n\n$$H=-t\\sum_{\\langle ij\\rangle}b_i^\\dagger b_j+\\frac{U}{2}\\sum_i n_i(n_i-1)-\\mu\\sum_i n_i,$$\n\nas a \"quantum cell model\" for a repulsive Bose fluid in the liquid-helium tradition, including the physical mechanism — competition between on-site number localization and delocalization into the $k=0$ state — and an explicit instability of the localized description toward the condensate at a critical density. Twenty-six years before Fisher, Weichman, Grinstein and Fisher supplied the Mott lobes, the particle–hole asymmetry, the two distinct universality classes at the transition, and the Bose glass [10].\n\nHubbard's 1963 paper [11], published the same year, treats correlations of *electrons* in narrow bands. It is a fine paper. It has no bosons in it.\n\nThree credit failures, graded:\n\n| Claim | Status | Evidence |\n|---|---|---|\n| Gersch–Knollman introduced the model \"in the context of granular superconductors\" | **folklore, and false** | Their paper is a cell model of a repulsive Bose fluid [9]. The granular-superconductor / Josephson-array lineage is a separate convergent development, retrofitted onto them — propagated largely by Wikipedia — and it rests on the rotor conflation below. |\n| The contraction \"Bose–Hubbard\" has an identifiable coiner | **disputed / murky** | FWGF write \"boson Hubbard model\" [10]. The contraction is later and diffuse; it is in common use in the quantum-Monte-Carlo literature by the early 1990s. I cannot pin a first user, and will not invent one. |\n| The boson$\\leftrightarrow$spin mapping is a modern cold-atom construction | **false** | Matsubara–Matsuda 1956 [8], exact for hard-core bosons, stated with the superfluid/Ising dictionary explicit. |\n\nA fourth conflation belongs here because it is the load-bearing one for the origin myth: the Bose–Hubbard model is **not** the quantum-rotor / Josephson-junction-array model. They agree only at large integer filling, where number fluctuations are small and $n_i$ may be treated as an unbounded integer conjugate to a phase $\\varphi_i$. The rotor model has no particle–hole asymmetry, no lobe structure in $\\mu$, no hard-core constraint — and therefore cannot produce the distinction between the generic ($z=2$, mean-field-like) transition crossing a lobe boundary and the fixed-density lobe-tip transition in the $(d{+}1)$-dimensional XY class [10]. Those are exactly the features that make the model interesting, and exactly what the granular-superconductor origin story quietly discards.\n\n### The structural thesis\n\nWhat survives from these four lineages is a single claim that organizes the rest of this dossier: **spin language and boson language are two coordinate systems on one Hilbert space, and the older one is the spin language.** Under Matsubara–Matsuda the hard-core superfluid–insulator transition *is* a magnetic transition; asking whether the \"real\" physics is charge or spin is asking which chart you have drawn on the manifold. Which coordinate system is convenient is set by what the experiment couples to — time-of-flight interferometry reads $\\langle b\\rangle$, site-resolved imaging reads $\\langle S^z\\rangle$, and spin-resolved counterflow measurements read $\\langle a^\\dagger b\\rangle$, which has no name in either chart alone. The consequence, developed in Section 4, is that \"beyond superfluidity or condensation\" is not a fringe corner of this model. Once the hard-core constraint is relaxed, disorder admitted, or an internal degree of freedom added, the phases that are neither superfluid nor Mott — Bose glass, counterflow superfluid, spin-Mott, nematic, singlet — occupy most of the phase diagram. The two-phase cartoon is an artifact of studying the one-component clean model and calling it the model."}, {"id": "matsubara-matsuda-and-the-single-component-magnet", "title": "The Exact Dictionary: Hard-Core Bosons Are an XXZ Magnet", "markdown": "## The Exact Dictionary: Hard-Core Bosons Are an XXZ Magnet\n\nThe single most consequential structural fact in this subject predates the Bose–Hubbard model by seven years and was published in Kyoto: Matsubara and Matsuda's demonstration that a lattice Bose fluid with infinite on-site repulsion *is* a spin-1/2 magnet — not analogous to one, not approximately one, but the same algebra on the same Hilbert space [8].\n\n### The mapping\n\nHard-core bosons have a two-dimensional local Hilbert space, $\\{|0\\rangle_i, |1\\rangle_i\\}$, because $(b_i^\\dagger)^2 = 0$. So does a spin-1/2. Identify\n\n$$|0\\rangle_i \\;\\leftrightarrow\\; |{\\downarrow}\\rangle_i, \\qquad |1\\rangle_i \\;\\leftrightarrow\\; |{\\uparrow}\\rangle_i,$$\n\n$$b_i^\\dagger \\;\\to\\; S_i^+, \\qquad b_i \\;\\to\\; S_i^-, \\qquad n_i = b_i^\\dagger b_i \\;\\to\\; S_i^z + \\tfrac{1}{2}.$$\n\nThe nontrivial check is the algebra. Hard-core bosons obey a *hybrid* statistics: on the same site they anticommute, $\\{b_i, b_i^\\dagger\\} = 1$; on different sites they commute, $[b_i, b_j^\\dagger] = 0$ for $i \\neq j$. Spin operators obey exactly this: $\\{S_i^+, S_i^-\\} = 1$ with $(S_i^\\pm)^2 = 0$ on-site, and $[S_i^+, S_j^-] = 2S_i^z\\delta_{ij} = 0$ off-site. The correspondence is therefore an isomorphism of operator algebras in any dimension, not a large-$S$ expansion, not a mean-field decoupling, and not restricted to 1D (where the Jordan–Wigner string, a different and dimension-limited device, would also do the job).\n\nApply it term by term to the hard-core extended Bose–Hubbard Hamiltonian\n\n$$H = -t\\sum_{\\langle ij\\rangle}\\left(b_i^\\dagger b_j + \\text{h.c.}\\right) + V\\sum_{\\langle ij\\rangle} n_i n_j - \\mu\\sum_i n_i, \\qquad U \\to \\infty.$$\n\nHopping becomes transverse exchange,\n\n$$-t\\sum_{\\langle ij\\rangle}(S_i^+S_j^- + S_i^-S_j^+) = -2t\\sum_{\\langle ij\\rangle}(S_i^xS_j^x + S_i^yS_j^y),$$\n\nso $J_\\perp = -2t$: the kinetic term is an *XY-ferromagnetic* coupling. Nearest-neighbour repulsion becomes Ising exchange,\n\n$$V\\sum_{\\langle ij\\rangle}\\left(S_i^z + \\tfrac12\\right)\\left(S_j^z+\\tfrac12\\right) = V\\sum_{\\langle ij\\rangle}S_i^zS_j^z + \\tfrac{V z}{2}\\sum_i S_i^z + \\text{const},$$\n\nwith $z$ the coordination number, so $J_z = V$ and repulsion is *Ising-antiferromagnetic*. The chemical potential becomes a longitudinal (Zeeman) field, $-\\mu\\sum_i S_i^z$, absorbing the $Vz/2$ shift into an effective $h = \\mu - Vz/2$. The result is the spin-1/2 XXZ model in a field:\n\n$$H_{\\rm XXZ} = \\sum_{\\langle ij\\rangle}\\Big[J_z S_i^zS_j^z - 2t\\,(S_i^xS_j^x + S_i^yS_j^y)\\Big] - h\\sum_i S_i^z.$$\n\nThe sign of $J_\\perp$ is gauge-irrelevant on a bipartite lattice: the sublattice rotation $S^\\pm_i \\to -S^\\pm_i$ on one sublattice flips it, which is why one may speak of the \"XY-ferromagnet\" and \"XY-antiferromagnet\" interchangeably there — and why on a frustrated lattice one may *not*. That same rotation is the operation later used to invert the natively ferromagnetic bosonic exchange in the two-component Mott insulator [7].\n\n### The dictionary of orders\n\n| Boson language | Spin language | Order parameter |\n|---|---|---|\n| Density $\\langle n_i\\rangle$ | Magnetization $\\langle S^z_i\\rangle + 1/2$ | — |\n| Chemical potential $\\mu$ | Longitudinal field $h$ | — |\n| Superfluid ODLRO | Transverse (XY) order | $\\langle b^\\dagger_i b_j\\rangle \\to \\mid\\langle S^+\\rangle\\mid^2$ |\n| Condensate fraction | $\\mid\\langle S^x\\rangle\\mid$ | — |\n| Mott (empty/full) | Fully polarized Ising state | $\\langle S^z\\rangle = \\pm 1/2$ |\n| Checkerboard CDW | Néel Ising order | $\\langle S^z_{\\mathbf{Q}}\\rangle \\ne 0$ |\n| Supersolid | Canted XXZ: coexisting XY + Ising | both nonzero |\n| Superfluid density $\\rho_s$ | Transverse spin stiffness | — |\n| Vortex | Meron / in-plane spin texture | — |\n| Compressibility $\\partial n/\\partial\\mu$ | Longitudinal susceptibility $\\chi_{zz}$ | — |\n\nTwo entries deserve emphasis. First, an incompressible boson state and a magnetization plateau are the *same phenomenon*: $\\kappa = \\partial n/\\partial\\mu = \\chi_{zz}$, so a Mott lobe is a plateau in $M(h)$ and the Mott gap is the plateau width. Second, the supersolid is not exotic in spin language — it is the canted phase of an easy-axis XXZ antiferromagnet in a field, which is precisely why Matsuda and Tsuneto, and independently Liu and Fisher, could propose it directly from the spin model (verify).\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eMatsubara-Matsuda dictionary\u003c/title\u003e\u003ctext x=\"180\" y=\"26\" fill=\"#7aa2ff\" font-size=\"17\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eHARD-CORE BOSONS\u003c/text\u003e\u003ctext x=\"540\" y=\"26\" fill=\"#ffb86b\" font-size=\"17\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eSPIN-1/2 XXZ MAGNET\u003c/text\u003e\u003cline x1=\"360\" y1=\"40\" x2=\"360\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003ccircle cx=\"70\" cy=\"80\" r=\"12\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ccircle cx=\"130\" cy=\"80\" r=\"12\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"190\" cy=\"80\" r=\"12\" fill=\"#7aa2ff\"/\u003e\u003ccircle cx=\"250\" cy=\"80\" r=\"12\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"160\" y=\"112\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eempty = 0, occupied = 1\u003c/text\u003e\u003cpath d=\"M118 66 q -12 -18 -36 0\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ah)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L6,3 L0,6 z\" fill=\"#7ee0a3\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"100\" y=\"52\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003et\u003c/text\u003e\u003cline x1=\"450\" y1=\"92\" x2=\"450\" y2=\"66\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#ao)\"/\u003e\u003cline x1=\"510\" y1=\"66\" x2=\"510\" y2=\"92\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#ao)\"/\u003e\u003cline x1=\"570\" y1=\"66\" x2=\"570\" y2=\"92\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#ao)\"/\u003e\u003cline x1=\"630\" y1=\"92\" x2=\"630\" y2=\"66\" stroke=\"#ffb86b\" stroke-width=\"2\" marker-end=\"url(#ao)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"ao\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"\u003e\u003cpath d=\"M0,8 L4,0 L8,8 z\" fill=\"#ffb86b\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"540\" y=\"112\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003edown = 0, up = 1\u003c/text\u003e\u003ctext x=\"480\" y=\"52\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eJ⊥ = −2t\u003c/text\u003e\u003cline x1=\"40\" y1=\"140\" x2=\"680\" y2=\"140\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"30\" y=\"172\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eb†ᵢ\u003c/text\u003e\u003ctext x=\"30\" y=\"204\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003enᵢ\u003c/text\u003e\u003ctext x=\"30\" y=\"236\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003e−μ nᵢ\u003c/text\u003e\u003ctext x=\"30\" y=\"268\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eV nᵢnⱼ\u003c/text\u003e\u003ctext x=\"30\" y=\"300\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003esuperfluid ODLRO\u003c/text\u003e\u003ctext x=\"30\" y=\"332\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eCDW / Mott\u003c/text\u003e\u003ctext x=\"30\" y=\"364\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003esupersolid\u003c/text\u003e\u003ctext x=\"290\" y=\"172\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"290\" y=\"204\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"290\" y=\"236\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"290\" y=\"268\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"290\" y=\"300\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"290\" y=\"332\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"290\" y=\"364\" fill=\"#7ee0a3\" font-size=\"15\" font-family=\"sans-serif\"\u003e→\u003c/text\u003e\u003ctext x=\"400\" y=\"172\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eS⁺ᵢ\u003c/text\u003e\u003ctext x=\"400\" y=\"204\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eSᶻᵢ + 1/2\u003c/text\u003e\u003ctext x=\"400\" y=\"236\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003elongitudinal field −h Sᶻ\u003c/text\u003e\u003ctext x=\"400\" y=\"268\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eIsing exchange Jz = V\u003c/text\u003e\u003ctext x=\"400\" y=\"300\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003etransverse XY order\u003c/text\u003e\u003ctext x=\"400\" y=\"332\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003eNéel / polarized Ising order\u003c/text\u003e\u003ctext x=\"400\" y=\"364\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"sans-serif\"\u003ecanted: XY + Ising coexisting\u003c/text\u003e\u003crect x=\"20\" y=\"146\" width=\"670\" height=\"234\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" opacity=\"0.3\"/\u003e\u003c/svg\u003e\n\n*Figure: The Matsubara–Matsuda correspondence. Left, hard-core bosons on a lattice; right, the identical spin-1/2 XXZ magnet. Tunnelling $t$ becomes transverse exchange $J_\\perp = -2t$; interspecies-free on-site hard-core constraint becomes the two-state spin; nearest-neighbour repulsion becomes $J_z$; chemical potential becomes the Zeeman field. Every phase on the left has a magnetic name on the right.*\n\n### Why Yang–Lee missed it\n\nYang and Lee's lattice gas maps occupation numbers onto Ising variables $\\sigma_i = 2n_i - 1$ and is exact for the *classical* problem: a diagonal Hamiltonian of density–density interactions becomes an Ising model in a field. Matsubara and Matsuda's stated objection is that this correspondence \"did not take into consideration the vector character of spins\" [8] — Ising spins have only a $z$-component, so there is no operator in the classical dictionary that can represent $b_i^\\dagger b_j$. The kinetic energy, the entire quantum content of the problem, has nowhere to go. Promoting $\\sigma^z$ to a genuine vector operator $\\vec{S}$ supplies exactly the missing transverse term, and with it superfluidity. The lesson generalizes: any mapping that keeps only the diagonal sector reproduces the CDW/Mott physics and loses the condensate entirely.\n\n### Where the dictionary is exact, and where it degrades\n\n**Exact.** $U = \\infty$, any lattice, any dimension, any filling, any diagonal interaction range (map each $V_{ij}n_in_j$ to $V_{ij}S^z_iS^z_j$). Correlation functions map one-to-one, so quantum Monte Carlo on one model is literally a simulation of the other.\n\n**Degrades — soft core.** At finite $U$ the local Hilbert space is unbounded and no spin-1/2 representation exists. The standard repair, truncating to $n_i \\le 2S$ and using spin-$S$ operators, is *not* an isomorphism: $b^\\dagger \\to S^+/\\sqrt{\\cdots}$ requires occupation-dependent matrix elements, since $b^\\dagger|n\\rangle = \\sqrt{n+1}|n+1\\rangle$ while $S^+|m\\rangle$ carries $\\sqrt{S(S+1)-m(m+1)}$. Setting these equal fixes $S$ only for $S=1/2$. For $S \\ge 1$ the truncated boson model and the spin-$S$ XXZ model are different Hamiltonians that share a Hilbert-space dimension. Papers that assert \"soft-core bosons with $n\\le 2$ are a spin-1 magnet\" are asserting an approximation, and should say so.\n\n**Degrades — spinor/multicomponent.** For two species the local space at unit filling is again two-dimensional, and an XXZ description survives — but it is generated perturbatively in $t/U$, not by an operator identity, and its couplings are $O(t^2/U)$ rather than $O(t)$ [12]. That is a *different* dictionary, valid only deep in the Mott lobe, and conflating it with Matsubara–Matsuda is a common error.\n\n**The Holstein–Primakoff confusion.** Holstein–Primakoff runs the *other* direction: spins → bosons, with $S^z = S - a^\\dagger a$, $S^+ = \\sqrt{2S}\\,a\\sqrt{1 - a^\\dagger a/2S}$, and it is exact only before the $1/S$ expansion truncates the square root. It is a large-$S$ semiclassical tool. Matsubara–Matsuda is a small-$S$ exact identity. Cold-atom papers that attribute the hard-core-boson–XXZ mapping to Holstein–Primakoff [8] have inverted both the direction and the regime of validity of the transformation they are using."}, {"id": "bosonic-superexchange-and-the-sign", "title": "Bosonic Superexchange and the Sign That Is Not Anderson's", "markdown": "## Bosonic Superexchange and the Sign That Is Not Anderson's\n\nTake two distinguishable bosonic species $a,b$ (hyperfine states, or two internal sublevels of the same atom, with collisions that do not convert one into the other) on a lattice at unit filling:\n\n$$H = -\\sum_{\\langle ij\\rangle}\\left(t_a\\, a_i^\\dagger a_j + t_b\\, b_i^\\dagger b_j + \\mathrm{h.c.}\\right) + \\frac{U_{aa}}{2}\\sum_i n^a_i(n^a_i-1) + \\frac{U_{bb}}{2}\\sum_i n^b_i(n^b_i-1) + U_{ab}\\sum_i n^a_i n^b_i.$$\n\nAt $t/U \\to 0$ and exactly one atom per site the ground manifold is $2^N$-fold degenerate: each site carries a free label $|{\\uparrow}\\rangle_i \\equiv a_i^\\dagger|0\\rangle$, $|{\\downarrow}\\rangle_i \\equiv b_i^\\dagger|0\\rangle$. Hopping lifts the degeneracy at second order. This is precisely the situation Chao, Spałek and Oleś formalized for the fermionic Hubbard model in 1977 [4]: a canonical transformation $\\tilde H = e^{iS} H e^{-iS}$ with $S$ chosen to cancel the doublon-creating part of the kinetic term at first order, leaving\n\n$$H_{\\rm eff} = P\\, T\\, \\frac{1}{E_0 - H_U}\\, T\\, P,$$\n\nwith $P$ the projector onto the singly-occupied manifold and $T$ the hopping. For bosons the algebra is identical; only the matrix elements of $T$ between the ground manifold and the doublon manifold differ — and that difference is the whole story.\n\n### The virtual doublons, one by one\n\nOn a bond $\\langle ij\\rangle$ there are three intermediate channels, distinguished by which doublon is made and at what energy.\n\n**(1) Spin-flip channel, $|{\\uparrow}_i{\\downarrow}_j\\rangle \\to |{\\downarrow}_i{\\uparrow}_j\\rangle$.** The virtual state is a mixed doublon $a^\\dagger b^\\dagger|0\\rangle$ on one site, energy $U_{ab}$. The relevant matrix element is\n$$\\langle a^\\dagger_i b^\\dagger_i 0 \\mid t_b\\, b_i^\\dagger b_j \\mid {\\uparrow}_i {\\downarrow}_j\\rangle = t_b,$$\nsince $b_i^\\dagger|0\\rangle_i^{(b)} = |1\\rangle_i^{(b)}$ carries no enhancement — the mixed doublon has occupation one in each species. Going back out with $a_i^\\dagger a_j \\to$ requires moving the $a$ boson to $j$, amplitude $t_a$. Summing the two orderings (hop $b$ left then $a$ right, or $a$ right then $b$ left), both intermediate states have energy $U_{ab}$ above the ground manifold, and the second-order amplitude is\n$$-\\frac{2 t_a t_b}{U_{ab}}.$$\nThe sign is the ordinary second-order-perturbation-theory sign: energy denominators are negative, so any off-diagonal process **lowers** the energy of the state it connects. With no fermionic minus signs anywhere, the transverse exchange is *ferromagnetic in the XY sense*:\n$$J_\\perp = -\\frac{4 t_a t_b}{U_{ab}} \\quad\\text{in the convention } H = \\sum \\tfrac{J_\\perp}{2}(S^+_iS^-_j + \\mathrm{h.c.}), \\qquad\\text{i.e. } J_\\perp = +\\frac{4t_at_b}{U_{ab}} \\text{ as a ferromagnetic XY coupling.}$$\nI will write it as $J_\\perp = +4t_at_b/U_{ab}$ with the understanding that the *physically invariant* statement is: the transverse term favours a symmetric (bonding) combination of the two spin configurations, i.e. XY-ferromagnetic alignment.\n\n**(2) Same-species channels, $|{\\uparrow}_i{\\uparrow}_j\\rangle \\to |{\\uparrow}_i{\\uparrow}_j\\rangle$.** Here is where Bose statistics bites. The virtual state is $\\frac{1}{\\sqrt 2}(a_i^\\dagger)^2|0\\rangle = |2\\rangle_i^{(a)}$, energy $U_{aa}$, and\n$$a_i^\\dagger |1\\rangle_i^{(a)} = \\sqrt{2}\\,|2\\rangle_i^{(a)}.$$\nThe factor $\\sqrt2$ is the Bose enhancement. It appears once on the way in and once on the way out, so the process is enhanced by a factor of **2** in the energy:\n$$\\delta E = -\\frac{|\\sqrt2 t_a|^2}{U_{aa}} \\times 2\\ (\\text{two sites to make the doublon on}) = -\\frac{4t_a^2}{U_{aa}}.$$\nThis is a pure diagonal (Ising) energy: it lowers $|{\\uparrow}{\\uparrow}\\rangle$ and $|{\\downarrow}{\\downarrow}\\rangle$ but not $|{\\uparrow}{\\downarrow}\\rangle$. Its Fermi counterpart *does not exist at all* — $(c^\\dagger)^2 = 0$ — which is exactly why in the fermionic problem the only surviving second-order process is the spin-flip one, and why fermionic superexchange is unavoidably antiferromagnetic [3].\n\n**(3) Diagonal part of the mixed channel.** The state $|{\\uparrow}_i{\\downarrow}_j\\rangle$ also gains energy from the virtual mixed doublon *without* flipping, amplitude $t_a$ in and $t_a$ out (and likewise $t_b$), giving $-2(t_a^2+t_b^2)/U_{ab}$ per bond.\n\nCollecting the diagonal pieces and writing $S^z_i = \\tfrac12(n^a_i - n^b_i)$, the constants and the field drop out at unit filling and symmetric populations, leaving\n\n$$H_{\\rm eff} = \\sum_{\\langle ij\\rangle}\\Big[ J_\\perp \\left(S^x_iS^x_j + S^y_iS^y_j\\right) + J_z\\, S^z_iS^z_j \\Big], \\qquad\n\\boxed{\\;J_\\perp = +\\frac{4t_at_b}{U_{ab}},\\qquad J_z = \\frac{2(t_a^2+t_b^2)}{U_{ab}} - \\frac{4t_a^2}{U_{aa}} - \\frac{4t_b^2}{U_{bb}}\\;}$$\n\nwith the sign convention that $J_\\perp\u003e0$ denotes XY-ferromagnetic (the transverse term lowers the symmetric state) and $J_z\u003e0$ denotes easy-plane (anti-aligned $S^z$ favoured). This is the two-species XXZ magnet of Kuklov and Svistunov [12] and of Duan, Demler and Lukin [13]; under Matsubara–Matsuda [8] it is the same object as the hard-core Bose fluid of §2, now with the species label playing the role the site occupation played there.\n\n### Why \"Anderson's sign\" does not transfer\n\nAnderson's $J = 4t^2/U \u003e 0$ antiferromagnetic is a *statistics theorem in disguise*, not a general consequence of second-order perturbation theory [3]. The logic is: (i) the virtual doublon requires two particles on one site; (ii) for spin-$1/2$ fermions in a single orbital, Pauli exclusion permits this only if the two spins form a singlet; (iii) therefore only the singlet component of the bond wavefunction is lowered in energy; (iv) hence antiferromagnetism. Steps (ii)–(iii) are where the fermionic sign lives, and for bosons *every* step fails: the double occupancy is allowed in all channels, it is enhanced rather than blocked, and there is no antisymmetrization minus sign to convert an energy lowering of the symmetric state into a lowering of the antisymmetric one. Bosonic exchange is natively ferromagnetic. Anything else must be engineered.\n\nThis is the physical content of the 2021 bosonic-antiferromagnet experiment [7]: it was not a matter of cooling further into a pre-existing antiferromagnetic ground state, but of inverting the sign, via a sublattice/gauge rotation that maps the natural ferromagnet onto a Heisenberg antiferromagnet on a bipartite lattice, seeded from a Néel product state. The same sign control appears already in Trotzky *et al.* [6], where tilting a double well reverses the effective exchange by shifting which virtual doublon is energetically accessible — a two-site measurement of $J$ and its sign, not of order (see §6).\n\n### The anisotropy dial\n\nSet $t_a = t_b = t$, $U_{aa} = U_{bb} = U$. Then $J_\\perp = 4t^2/U_{ab}$ and $J_z = 4t^2/U_{ab} - 8t^2/U$, so the anisotropy is controlled entirely by $\\alpha \\equiv U_{ab}/U$:\n\n| Regime | Condition | $J_z / J_\\perp$ | Phase |\n|---|---|---|---|\n| Easy-plane | $U_{ab} \u003c U$ ($\\alpha\u003c1$) | $0 \u003c J_z/J_\\perp \u003c 1$ | XY order in $S^\\pm$: counterflow superfluid, $\\langle a_i^\\dagger b_i\\rangle \\ne 0$ [12] |\n| Isotropic | $U_{ab} = U$ ($\\alpha = 1$) | $J_z/J_\\perp = -1$ relative sign flips at $\\alpha=2$; SU(2) point at $U_{ab}=U$ | Heisenberg (ferromagnetic) |\n| Easy-axis / Ising | $U_{ab} \u003e 2U$ | $J_z \u003c 0$, $\\mid J_z\\mid \u003e \\mid J_\\perp\\mid$ | Ising-ordered Mott: species-segregated / spin-Mott, gapped in both sectors |\n| Phase separation | $U_{ab} \\gg U$ | — | Domain formation; the perturbative magnet ceases to describe the true ground state |\n\nThe counterflow superfluid and the spin-Mott state — the two experimentally realized \"neither superfluid nor Mott\" phases [14] — are the two sides of this dial, separated by an Ising transition in the spin sector at fixed, incompressible total density. Section 4 takes up their order parameters.\n\n### Ancestry and validity\n\nThe structure above is a special case of Kugel–Khomskii [5]: a degenerate Hubbard model at large $U$ whose strong-coupling expansion produces coupled spin and pseudospin exchange with anisotropic, sign-tunable couplings, the anisotropy inherited from the ratio of intra- to inter-flavour on-site repulsion. The two-component Bose–Hubbard spin Hamiltonian is that algebra with the orbital pseudospin promoted to a species label and the fermionic antisymmetrization removed. Papers deriving \"a new XXZ model from two-species bosons\" are rediscovering a 1973 Russian-language result with the statistics changed.\n\nThe expansion is controlled only if:\n\n- $zt/U_{\\min} \\ll 1$ with $U_{\\min} = \\min(U_{aa},U_{bb},U_{ab})$ — near the tip of the Mott lobe the doublon gap closes and the strong-coupling series is meaningless;\n- filling is commensurate at exactly $n=1$; away from it the leading term is not $J$ but a constrained-hopping (t–J-like) term of order $t$, and doped bosonic Mott insulators are not magnets, they are superfluids;\n- $U_{ab}$ is not resonant with a molecular bound state or a Feshbach resonance, and $U_{ab} \\ne U_{aa},U_{bb}$ by amounts small compared with the trap-induced level spacing — otherwise the \"virtual\" doublon is not virtual;\n- three-body and higher-band processes are off-resonant: the neglected fourth-order ring exchange scales as $t^4/U^3$ and can be comparable to $J_z$ when $J_z$ is tuned near zero by cancellation, which is exactly the interesting regime;\n- $J \\sim 4t^2/U$ sets the entropy scale that must be reached — typically tens of hertz, well below the Mott gap. This is the entire experimental difficulty and the subject of §8."}, {"id": "phases-that-are-neither", "title": "The Phases That Are Neither Superfluid Nor Mott: Bose Glass, Counterflow, Spin-Mott, Nematic", "markdown": "## The Phases That Are Neither Superfluid Nor Mott: Bose Glass, Counterflow, Spin-Mott, Nematic\n\nThe two-phase cartoon of the Bose–Hubbard model — superfluid at small $U/t$, Mott insulator at large $U/t$ and integer filling — survives only in the clean, single-component, structureless case. Relax any one of those three conditions and the phase diagram acquires states that are neither. What follows is a catalogue organized by the only thing that distinguishes phases: order parameter, gap, compressibility, and the diagnostic that actually resolves them.\n\n### The two-axis bookkeeping\n\nFor a two-component gas the useful decomposition is charge/spin rather than $a$/$b$:\n\n$$n_i = n_i^a + n_i^b, \\qquad S_i^z = \\tfrac{1}{2}(n_i^a - n_i^b), \\qquad S_i^+ = a_i^\\dagger b_i.$$\n\nEach sector independently can be gapped or gapless, ordered or disordered, and the four combinations are four distinct phases. The charge sector's compressibility is $\\kappa = \\partial n/\\partial\\mu$; the spin sector's is $\\chi = \\partial m/\\partial h$ with $h$ the population imbalance chemical potential. A Mott insulator has $\\kappa = 0$; a *spin*-Mott has $\\kappa = \\chi = 0$; counterflow superfluidity has $\\kappa = 0$ but $\\chi \\neq 0$ with off-diagonal long-range order in $S^+$. Nothing forces the two sectors to freeze at the same coupling, and the interesting phases live in the mismatch.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eCharge and spin sector classification of Bose-Hubbard phases\u003c/title\u003e\u003cline x1=\"120\" y1=\"330\" x2=\"640\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"120\" y1=\"330\" x2=\"120\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"368\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\"\u003echarge sector (total density)\u003c/text\u003e\u003ctext x=\"150\" y=\"352\" fill=\"#e8e6e1\" font-size=\"14\"\u003egapped, κ = 0\u003c/text\u003e\u003ctext x=\"470\" y=\"352\" fill=\"#e8e6e1\" font-size=\"14\"\u003egapless, κ \u0026gt; 0\u003c/text\u003e\u003ctext x=\"60\" y=\"200\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" transform=\"rotate(-90 60 200)\"\u003espin sector\u003c/text\u003e\u003ctext x=\"82\" y=\"120\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eordered\u003c/text\u003e\u003ctext x=\"82\" y=\"138\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e⟨S⁺⟩ ≠ 0\u003c/text\u003e\u003ctext x=\"82\" y=\"285\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003egapped\u003c/text\u003e\u003ctext x=\"82\" y=\"303\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eχ = 0\u003c/text\u003e\u003cline x1=\"380\" y1=\"60\" x2=\"380\" y2=\"330\" stroke=\"#e8e6e1\" stroke-width=\"0.8\" stroke-dasharray=\"4 4\"/\u003e\u003cline x1=\"120\" y1=\"195\" x2=\"640\" y2=\"195\" stroke=\"#e8e6e1\" stroke-width=\"0.8\" stroke-dasharray=\"4 4\"/\u003e\u003crect x=\"132\" y=\"72\" width=\"236\" height=\"112\" rx=\"6\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"250\" y=\"104\" fill=\"#7ee0a3\" font-size=\"16\" text-anchor=\"middle\"\u003eCOUNTERFLOW SF\u003c/text\u003e\u003ctext x=\"250\" y=\"126\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e⟨a†b⟩ ≠ 0, j_total = 0\u003c/text\u003e\u003ctext x=\"250\" y=\"146\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eeasy-plane XXZ\u003c/text\u003e\u003ctext x=\"250\" y=\"166\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eKuklov–Svistunov 2002\u003c/text\u003e\u003crect x=\"392\" y=\"72\" width=\"236\" height=\"112\" rx=\"6\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"510\" y=\"104\" fill=\"#7aa2ff\" font-size=\"16\" text-anchor=\"middle\"\u003e2SF (both superfluid)\u003c/text\u003e\u003ctext x=\"510\" y=\"126\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e⟨a⟩ ≠ 0, ⟨b⟩ ≠ 0\u003c/text\u003e\u003ctext x=\"510\" y=\"146\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eweak lattice; or PAIR SF\u003c/text\u003e\u003ctext x=\"510\" y=\"166\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e⟨ab⟩ ≠ 0 if U_ab \u0026lt; 0\u003c/text\u003e\u003crect x=\"132\" y=\"207\" width=\"236\" height=\"112\" rx=\"6\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"250\" y=\"239\" fill=\"#ffb86b\" font-size=\"16\" text-anchor=\"middle\"\u003eSPIN-MOTT / ISING MOTT\u003c/text\u003e\u003ctext x=\"250\" y=\"261\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ebound a–b pairs, or Néel/FM\u003c/text\u003e\u003ctext x=\"250\" y=\"281\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eboth sectors incompressible\u003c/text\u003e\u003ctext x=\"250\" y=\"301\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eeasy-axis XXZ\u003c/text\u003e\u003crect x=\"392\" y=\"207\" width=\"236\" height=\"112\" rx=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"510\" y=\"239\" fill=\"#ff7a90\" font-size=\"16\" text-anchor=\"middle\"\u003eBOSE GLASS\u003c/text\u003e\u003ctext x=\"510\" y=\"261\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eκ \u0026gt; 0 but ρ_s = 0\u003c/text\u003e\u003ctext x=\"510\" y=\"281\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003egapless, no LRO, disorder\u003c/text\u003e\u003ctext x=\"510\" y=\"301\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eFisher et al. 1989\u003c/text\u003e\u003ctext x=\"380\" y=\"40\" fill=\"#e8e6e1\" font-size=\"17\" text-anchor=\"middle\"\u003eSectors freeze independently — four phases, not two\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Charge (total density) and spin (relative density) sectors gap out independently in the two-component Bose–Hubbard model. Only the upper-right cell is \"the superfluid\" and only the lower-left is \"the Mott insulator\" of the textbook cartoon; the off-diagonal cells are genuine phases with their own order parameters. The Bose glass is placed in the compressible-but-not-superfluid cell of the single-component (disordered) problem, which is the same failure of the two-phase picture along a different axis.*\n\n### Bose glass: compressible, gapless, insulating\n\nThe first canonical \"neither\" phase is single-component and requires only disorder [10]. In a random potential the Mott lobes are surrounded by a phase with $\\rho_s = 0$ (no superfluid stiffness), $\\kappa \u003e 0$ (finite compressibility), no gap, and no long-range order — rare Griffiths regions of locally superfluid puddles that never percolate. Its defining structural claim is the *theorem of inclusions*: a direct Mott–superfluid transition is impossible in the presence of bounded disorder, so the Bose glass always intervenes. The diagnostic is the pairing of a finite $\\partial n/\\partial\\mu$ with vanishing stiffness — a combination no mean-field decoupling produces, which is why Bogoliubov and Gutzwiller treatments miss the phase entirely. It is not adiabatically connected to either neighbour, and its single-particle density of states at the chemical potential is finite, in contrast to the hard gap of the Mott state.\n\n### Counterflow superfluidity\n\nTake two species at total filling $n_a + n_b = 1$ per site, so the charge sector is deep in a Mott state. The residual spin dynamics is the XXZ magnet of §3. In the easy-plane regime ($|J_z| \u003c |J_\\perp|$) the transverse spin orders,\n\n$$\\langle S_i^+ \\rangle = \\langle a_i^\\dagger b_i \\rangle \\neq 0,$$\n\nwhich is off-diagonal long-range order in a *particle–hole* composite: an $a$-atom current is necessarily accompanied by an equal and opposite $b$-atom current. Total mass current is identically zero; total density stays incompressible. This is Kuklov and Svistunov's supercounterfluid [12], predicted in May 2002 and observed 23 years later at USTC [14] by adiabatically driving a low-entropy spin-Mott state of repulsively bound pairs across the easy-axis→easy-plane boundary and watching relative-density coherence appear while the total-density structure factor remained flat.\n\nThe distinctions that the literature routinely erases:\n\n| phase | order parameter | total mass current | charge sector |\n|---|---|---|---|\n| counterflow SF | $\\langle a_i^\\dagger b_i\\rangle$ | zero | incompressible |\n| pair SF | $\\langle a_i b_i\\rangle$ | carried by pairs | compressible, gapless in $2n$ |\n| two-species SF | $\\langle a_i\\rangle,\\ \\langle b_i\\rangle$ | carried by each | compressible |\n\nPair superfluidity requires attractive or strongly asymmetric interspecies interaction ($U_{ab}$ sufficiently negative, or $\\mid U_{ab}\\mid$ exceeding the intraspecies scales) so that $a_ib_i$ molecules form and then condense; it breaks a single U(1) (total phase) while leaving relative phase disordered. Counterflow does exactly the reverse. \"Spin superfluid\" is a third name, correct only when the spin symmetry is genuinely U(1) — with exact SU(2) symmetry the would-be Goldstone modes are two ferromagnetic magnons with quadratic dispersion and there is no stiffness in the Landau sense.\n\n### Spin-Mott, Ising, and phase separation\n\nPush $J_z$ into the easy-axis regime and the spin sector gaps out as well. Two variants exist and are physically different. If $U_{ab} \u003e U_{aa}, U_{bb}$ the ground state at $n=1$ is an Ising *antiferromagnet* in the pseudospin language — the two species alternate, which in atomic language is a checkerboard demixing. If $U_{ab} \u003c U_{aa}, U_{bb}$ the system phase-separates: the Ising ferromagnet is a macroscopic domain of $a$ beside a domain of $b$, and on a lattice with a trap this appears as spatial segregation rather than a magnetic pattern. The *spin-Mott* proper is the $n_a = n_b = 1$ state of repulsively bound $a$–$b$ pairs, one on each site: both $\\kappa$ and $\\chi$ vanish, the gap is set by pair-breaking $\\sim U_{ab} - $ (intraspecies costs), and it is the preparation state of the 2025 counterflow experiment [14] precisely because it is a low-entropy product state with a large gap.\n\n### The spinor model is a different problem\n\nThe two-component model above conserves $N_a$ and $N_b$ separately: the species label is a bookkeeping index, and the effective magnet is XXZ with anisotropy fixed by $U_{ab}/U_{aa,bb}$. In a genuine spin-1 gas, spin-changing collisions $|{+}1\\rangle + |{-}1\\rangle \\leftrightarrow |0\\rangle + |0\\rangle$ are allowed; only total $S^z$ and total spin are conserved, and the on-site interaction is\n\n$$\\hat{H}_{\\rm int} = \\frac{U_0}{2}\\,\\hat{n}(\\hat{n}-1) + \\frac{U_2}{2}\\left(\\hat{\\mathbf{S}}^2 - 2\\hat{n}\\right),$$\n\nwith $U_2 \\propto (a_2 - a_0)$. For $U_2 \u003e 0$ (antiferromagnetic, as in $^{23}$Na) the on-site spectrum is organized by total on-site spin $S$, and the Mott insulator's magnetic character alternates with filling — the central result of Demler and Zhou [15]. At even filling the site can form the on-site singlet $S=0$: the ground state is a product of spin singlets, gapped, with *no* broken spin symmetry, no local moment, and exponentially decaying spin correlations. Calling this an antiferromagnet — which happens routinely — is a category error: an antiferromagnet has a nonzero staggered order parameter and gapless (or at least symmetry-broken) magnon structure; this state has no order parameter at all in the spin sector, and its correlations are those of a trivial paramagnet. At odd filling the site cannot singlet-pair internally, the minimum on-site spin is $S=1$, and the resulting inter-site exchange favours a *nematic*: $\\langle \\hat{\\mathbf{S}}\\rangle = 0$ but the quadrupole tensor $Q^{\\alpha\\beta} = \\langle S^\\alpha S^\\beta + S^\\beta S^\\alpha\\rangle/2 - \\tfrac{2}{3}\\delta^{\\alpha\\beta}$ is anisotropic — rotational symmetry broken, time reversal preserved. The order parameter is a director $\\mathbf{d}$ identified with $-\\mathbf{d}$, so the manifold is $\\mathbb{RP}^2$ and the topological defects are $\\mathbb{Z}_2$ half-vortices rather than integer vortices. Demler and Zhou further argued that condensing those half-vortices, or fluctuating the nematic strongly, yields fractionalized phases with $\\mathbb{Z}_2$ topological order and spin-1/2 deconfined excitations [15] — candidate phases, not observed ones.\n\nThe diagnostics differ accordingly. Nematic order is invisible to any measurement of $\\langle S^\\alpha\\rangle$ or to a Stern–Gerlach population readout; it requires a quadrupole probe — spin-dependent Bragg scattering, or the anisotropy of spin-noise correlations. The even-filling singlet is diagnosed by its gap and by the *absence* of magnetization response, which is why it is so easily mislabelled: an experiment that measures zero staggered magnetization and a spin gap will report the same numbers for a singlet Mott insulator and for a well-cooled short-range-correlated antiferromagnet above its ordering scale."}, {"id": "the-2002-2003-convergence", "title": "The 2002–2003 Convergence and How the Credit Flattened", "markdown": "## The 2002–2003 Convergence and How the Credit Flattened\n\nThe standard citation block for bosonic magnetism in optical lattices reads, in most reviews, as a comma-separated list of 2003 *Physical Review Letters*. Journal dates are the wrong clock. Sorted by arXiv posting — the date at which the community could actually read the argument — the sequence is different, and the priorities it establishes do not match the ones the field records.\n\n### The sequence by preprint date\n\n**April 2001 — Demler and Zhou, cond-mat/0104409 [15].** The first paper to insist that a bosonic Mott insulator has non-trivial internal magnetic structure. The system is genuinely spin-1: spin-changing collisions are allowed, the on-site interaction splits as $U_0 + U_2 \\mathbf{S}_i^2$, and the conserved quantity is the total spin, not the individual populations. The results are correspondingly specific to that case — a gapped, non-magnetic spin-singlet Mott state at even filling, a spin-nematic state at odd filling, and candidate fractionalized phases. Note what this paper is *not*: it is not a derivation of pseudospin-1/2 superexchange, and the phases it predicts have no counterpart in the two-component problem. The habit of opening a two-component Bose–Hubbard citation list with [15] as though it were the ancestor conflates two different models (a conflation already dissected in §4).\n\n**May 2002 — Kuklov and Svistunov, cond-mat/0205069 [12].** Two distinguishable species at commensurate total filling; strong coupling; second-order elimination of the doubly-occupied manifold; an effective XXZ Hamiltonian in the pseudospin sector,\n$$H_{\\rm eff}=\\sum_{\\langle ij\\rangle}\\Big[J_\\perp\\big(S^x_iS^x_j+S^y_iS^y_j\\big)+J_zS^z_iS^z_j\\Big]-h\\sum_i S^z_i,$$\nwith $J_\\perp$ and $J_z$ fixed by $t_a,t_b$ and the ratio $U_{ab}/U_{aa},U_{bb}$ — and the identification of the easy-plane phase as a state with off-diagonal long-range order in $a^\\dagger_i b_j$: counterflow superfluidity. This is, by preprint date, the first statement of the two-species effective spin Hamiltonian in the optical-lattice context, and it arrives with its most striking physical consequence already attached. Kuklov and Svistunov did not stop at \"the Mott insulator is a magnet\"; they identified which magnetic phase was experimentally distinctive and why (charge-incompressible, spin-coherent, zero net mass current). Twenty-three years later that is the phase the USTC experiment reports observing [14], and the paper frames itself explicitly as a test of this prediction.\n\n**Late 2002 → 2003 — Duan, Demler and Lukin [13].** A different intellectual programme, and this is the point most often lost: [13] is not primarily a *derivation* paper, it is an *engineering* paper. Its content is that spin-dependent optical potentials and controlled collisions let you set the magnitude, the sign, and the anisotropy of $J_\\perp$ and $J_z$ independently — including regimes with $J_\\perp$ and $J_z$ of opposite sign, and anisotropic compass-type models with topologically ordered ground states. The strong-coupling algebra is a means; the deliverable is a map from laser configurations onto an essentially arbitrary lattice spin Hamiltonian. That is why the paper became load-bearing for everything after it, and also why citing it as the origin of the effective Hamiltonian is a category error.\n\n**2003 — Altman, Hofstetter, Demler and Lukin [16].** The systematic phase diagram of the two-component model, treating the spin sector on the same footing in the Mott and superfluid regimes rather than only deep in the insulator: super-counterfluid, spin-ordered (Ising / phase-separated) Mott states, and the various two-component superfluids, with the boundaries laid out as functions of the interaction anisotropy. This is the paper that converts a strong-coupling effective Hamiltonian into a navigable diagram, and it deserves independent credit for the regions where neither the strong-coupling nor the weak-coupling limit is controlled.\n\nUnderneath all four sits Jaksch, Bruder, Cirac, Gardiner and Zoller (1998) [17], which supplies the bridge nobody in this list could have crossed alone: $t$ and $U$ as computable functionals of Wannier functions and laser intensity. Without [17] there is no reason to write $4t^2/U$ for a gas of atoms; with it, \"tunable exchange\" becomes a laboratory parameter. Its citation record is, unusually for this story, roughly correct.\n\n### Why [13] absorbed the credit\n\nThe flattening is explicable without attributing bad faith to anyone. Four mechanisms, all evidentiary:\n\n1. **Journal-date collapse.** [12] appeared in PRL in 2003; [13] appeared in PRL in 2003. In a reference list sorted by publication year the seven-month preprint gap vanishes.\n2. **Utility beats priority.** Nearly every subsequent experimental proposal needed a *sign* and a *knob*, not a Hamiltonian. [13] is the paper you cite when you want to justify that your $J$ is tunable, so it is cited far more often — and citation frequency is what later reviews sample when writing \"as shown in\".\n3. **Framing.** [12] is titled and framed around counterflow superfluidity, a phase that remained unobserved until 2025 [14]. A paper whose headline claim sits in the future is read as a prediction paper, not as a foundations paper, and prediction papers get cited in the section where the prediction is tested rather than in the section where the formalism is set up.\n4. **Author-network clustering.** [15], [13] and [16] share overlapping authorship, so a review citing any one of them tends to pick up the others; [12] sits outside that cluster.\n\nThe consequence is a specific, checkable error, not a vague injustice: statements of the form \"the effective spin Hamiltonian for two-component lattice bosons was derived in [13]\" are false by seven months of public record.\n\n### The 1973 and 1977 antecedents\n\nThere is a second gap, and it is deeper than an ordering dispute inside the cold-atom literature.\n\nThe derivation performed in [12], [13] and [16] — project onto the singly-occupied manifold, eliminate the doubly-occupied states to second order by canonical transformation, collect the resulting exchange terms — is precisely the Schrieffer–Wolff-type construction that Chao, Spałek and Oleś published for the narrow $S$-band Hubbard model in 1977 [4], a decade before it was named the $t$–$J$ model. The bosonic version differs in the statistics of the intermediate state, which flips the sign of $J_\\perp$ (§3), but the machinery — the projector, the generator, the systematic $O(t^2/U)$ truncation, the constrained-hopping remnant — is theirs in structure. It is essentially never cited in this literature.\n\nThe multi-flavour case is worse. Kugel and Khomskii (1973) [5] derived, from a degenerate Hubbard model at large $U$, coupled spin and pseudospin exchange with anisotropic, sign-tunable couplings — the exact algebraic structure that reappears in the two-component Bose–Hubbard papers with the orbital pseudospin relabelled as a hyperfine index. Papers announcing \"a new XXZ model with tunable anisotropy from two-species bosons\" are, at the level of the effective Hamiltonian, rediscovering a Russian-language 1973 result. Two ordinary causes suffice to explain the omission: the original is in *ZhETF* with the JETP translation appearing in a solid-state venue, and the cold-atom community entered through the Fisher–Weichman–Grinstein–Fisher [10] / Jaksch [17] doorway rather than the strongly-correlated-oxide one, so its inherited bibliography simply did not contain [5] or [4] to begin with.\n\nThe correct minimal citation, then, for \"superexchange in a two-component bosonic Mott insulator\" is: mechanism from Kramers [1] via Anderson [3]; canonical-transformation derivation from Chao–Spałek–Oleś [4]; multi-flavour structure from Kugel–Khomskii [5]; boson↔spin dictionary from Matsubara–Matsuda [8]; lattice realization from Jaksch *et al.* [17]; the two-species effective Hamiltonian and counterflow order parameter from Kuklov–Svistunov [12]; the engineering of sign and anisotropy from Duan–Demler–Lukin [13]; the phase diagram from Altman *et al.* [16]; and the spin-1 problem, separately, from Demler–Zhou [15]."}, {"id": "landmark-experiments", "title": "Landmark Experiments: What Was Measured, and What Was Only Claimed", "markdown": "## Landmark Experiments: What Was Measured, and What Was Only Claimed\n\nThe theory in §3–§5 is cheap; the temperatures are not. Bosonic superexchange sets the only energy scale in the spin sector, and it is *fourth* order small: $J \\sim 4t^2/U$ with $t/U \\lesssim 0.1$ deep in the Mott phase gives $J/h$ in the range 10 Hz – 1 kHz, i.e. $J/k_B \\sim 0.5$–50 pK for typical lattice depths. Every result below is gated by whether the entropy per particle was pushed below the corresponding $s^* \\sim k_B \\ln 2$ *within the spin sector*, and most of them were not.\n\n### Greiner et al. 2002: the charge sector, and only the charge sector\n\nTwo observables, not one. First, time-of-flight interference: release from the 3D lattice and image the momentum distribution, which for a coherent state is a set of Bragg peaks at reciprocal-lattice vectors $\\mathbf{G}$ with visibility set by $|\\langle \\hat a_i \\rangle|^2$; the peaks fade continuously and vanish by $V_0 \\approx 22\\,E_R$, then revive when the lattice is ramped back down [18]. Loss of interference alone proves nothing — it is equally consistent with dephasing, heating, or a mixed state. The second observable is what makes the paper: gap spectroscopy. Applying a potential gradient and measuring the resonant response gives excitation peaks at $\\Delta E = U$ and $2U$, the particle–hole gap of an incompressible state. Greiner's LMU dissertation [19] documents the calibration chain — lattice depth from Kapitza–Dirac diffraction, $U$ from Wannier overlap integrals — more completely than the *Nature* letter.\n\nWhat was *not* measured: anything in the spin sector. The atoms were spin-polarized $^{87}$Rb $|F=2, m_F=2\\rangle$. There is no magnetism in this experiment, and under the Matsubara–Matsuda dictionary of §2 the superfluid it destroyed was already the XY-ordered phase of an effective magnet [8] — the transition observed *is* a magnetic transition in disguise, which is a different statement from having observed spin correlations.\n\n### Trotzky et al. 2008: a coupling constant, not a phase\n\nThis is the experiment most often mis-cited, so state precisely what happened. A superlattice, $V(x) \\propto V_s\\cos^2(2k x) + V_l\\cos^2(kx + \\varphi)$, cuts the system into an array of *isolated* double wells. Two spin states $|\\uparrow\\rangle, |\\downarrow\\rangle$ are loaded one per site by spin-dependent transfer, producing the product state $|\\uparrow\\downarrow\\rangle$ on every double well. The barrier is then lowered and the sublattice magnetization $N_\\uparrow^{\\rm even} - N_\\uparrow^{\\rm odd}$ is read out versus hold time. It oscillates sinusoidally, $\\propto \\cos(2J t/\\hbar)$, over several periods with frequencies from ~5 Hz to ~1 kHz as $t/U$ is tuned [6]. Tilting the double well by $\\Delta$ shifts the virtual-doublon energy denominators asymmetrically, $J_\\perp \\propto 4t^2 U/(U^2-\\Delta^2)$, and drives $J$ through a divergence and a sign change — the first experimental control over the sign of a bosonic exchange.\n\nThat is a spectroscopic measurement of a two-body matrix element. A double well has two sites. It has no thermodynamic limit, no correlation length, no order parameter, no spontaneous symmetry breaking, and no phase transition. The initial state was *prepared* staggered by external superlattice engineering, not grown by the exchange; the observed dynamics is coherent Rabi-like population transfer between $|\\uparrow\\downarrow\\rangle$ and $|\\downarrow\\uparrow\\rangle$ through the virtual doublon. Papers that cite [6] as \"observation of antiferromagnetic order in a bosonic Mott insulator\" are describing an experiment that did not occur. The distinction is not pedantry: measuring $J$ requires only that the double-well *pair* be in a known state, whereas observing Néel order requires the spin entropy of an extended system to fall below $\\ln 2$ per site — a requirement harder by orders of magnitude.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eEnergy scales versus achieved entropy in bosonic lattice experiments\u003c/title\u003e\u003cline x1=\"90\" y1=\"350\" x2=\"690\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"90\" y1=\"40\" x2=\"90\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"30\" y=\"200\" fill=\"#e8e6e1\" font-size=\"15\" transform=\"rotate(-90 30 200)\"\u003eenergy / k_B\u003c/text\u003e\u003ctext x=\"360\" y=\"388\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003ewhat each experiment had to beat\u003c/text\u003e\u003cline x1=\"90\" y1=\"70\" x2=\"690\" y2=\"70\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"98\" y=\"62\" fill=\"#7aa2ff\" font-size=\"15\"\u003eU / k_B ~ 100 nK — charge gap (Greiner 2002)\u003c/text\u003e\u003cline x1=\"90\" y1=\"150\" x2=\"690\" y2=\"150\" stroke=\"#ffb86b\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"98\" y=\"142\" fill=\"#ffb86b\" font-size=\"15\"\u003et / k_B ~ 10 nK — single-particle bandwidth\u003c/text\u003e\u003cline x1=\"90\" y1=\"250\" x2=\"690\" y2=\"250\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"98\" y=\"242\" fill=\"#7ee0a3\" font-size=\"15\"\u003eJ = 4t²/U ~ 0.1–1 nK — spin gap (Trotzky, Sun, Zheng)\u003c/text\u003e\u003cline x1=\"90\" y1=\"315\" x2=\"690\" y2=\"315\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"98\" y=\"307\" fill=\"#ff7a90\" font-size=\"15\"\u003etypical lattice temperature T ~ 1–10 nK\u003c/text\u003e\u003crect x=\"150\" y=\"70\" width=\"90\" height=\"245\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1\"/\u003e\u003ctext x=\"195\" y=\"335\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003echarge: OK\u003c/text\u003e\u003crect x=\"330\" y=\"250\" width=\"90\" height=\"65\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"375\" y=\"335\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003espin: marginal\u003c/text\u003e\u003ctext x=\"375\" y=\"235\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003egap \u0026lt; T\u003c/text\u003e\u003cpath d=\"M 520 315 L 520 250\" stroke=\"#e8e6e1\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L0,6 L8,3 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"530\" y=\"290\" fill=\"#e8e6e1\" font-size=\"14\"\u003eentropy engineering:\u003c/text\u003e\u003ctext x=\"530\" y=\"308\" fill=\"#e8e6e1\" font-size=\"14\"\u003elow-S product state + adiabatic passage\u003c/text\u003e\u003ctext x=\"100\" y=\"30\" fill=\"#e8e6e1\" font-size=\"15\"\u003eThe whole subject lives in the 2-decade gap between U and J\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The charge sector is gapped by $U$, comfortably above lattice temperatures, which is why the Mott transition was seen in 2002. The spin sector is gapped by $J = 4t^2/U$, typically at or below $T$ — so bosonic magnetism cannot be reached by cooling. Both [7] and [14] instead start from a near-zero-entropy product state and transport it adiabatically into the ordered phase, sidestepping thermal equilibration entirely.*\n\n### Sun et al. 2021: an extended antiferromagnet, built rather than cooled\n\nThe USTC experiment is the first honest observation of bosonic magnetic order [7]. Three ingredients. (i) A low-entropy Néel product state $|\\uparrow\\downarrow\\uparrow\\downarrow\\cdots\\rangle$ prepared by superlattice loading with defect filtering, giving spin entropy far below the thermal value at any achievable $T$. (ii) Sign inversion: bosonic $J_\\perp$ is natively ferromagnetic (§3), so a staggered spin rotation — equivalently the tilt trick of [6] — is used to realize an antiferromagnetic isotropic Heisenberg chain. (iii) *Optimized adiabatic passage*: the superlattice is ramped along a numerically optimized trajectory that keeps the state in the instantaneous ground state as the chain is connected from isolated dimers into a uniform 70-site chain.\n\nObservables: staggered magnetization and, decisively, the two-point correlator $C_d = \\langle S^z_i S^z_{i+d}\\rangle - \\langle S^z_i\\rangle\\langle S^z_{i+d}\\rangle$ resolved to $d = 2$–3 by site-resolved spin-selective imaging. Correlations of the right sign, alternating with $d$, over more than one bond. This is order in an extended system — but note it is a *prepared* low-entropy state carried adiabatically, not a thermal state below a critical temperature. In 1D there is no finite-$T$ transition anyway; the claim is ground-state correlations, and it is defensible as made.\n\n### de Hond et al. 2022 → Zheng et al. 2025: counterflow, 23 years late\n\nThe spin-Mott state — two species locked into repulsively bound $a$–$b$ pairs, one per site, gapped in *both* the charge and spin sectors — was identified and prepared by de Hond et al., *Phys. Rev. Lett.* **128**, 093401 (2022) (verify). Its value is entropic: the spin-Mott is the unique low-entropy starting point from which the counterflow phase can be reached by an adiabatic ramp rather than by cooling.\n\nZheng et al. then ramp $U_{ab}/U_{aa}$ (equivalently $J_z/J_\\perp$) across the easy-axis→easy-plane boundary of the effective XXZ magnet and measure two things simultaneously [14]. First, coherence in the *relative* density: a matter-wave interference measurement sensitive to $\\langle a_i^\\dagger b_i \\rangle$, i.e. transverse spin order, which turns on across the transition. Second, and this is what makes it counterflow rather than ordinary superfluidity, the *total* density stays incompressible — $\\partial n/\\partial\\mu \\approx 0$, no coherence in $\\langle a_i\\rangle$ or $\\langle b_i\\rangle$ separately. Spin sector superfluid, charge sector Mott. That joint measurement is the operational content of the Kuklov–Svistunov prediction [12], and it is the reason the claim survives the conflation warning of §4: without the compressibility null result, relative-phase coherence alone would not distinguish counterflow from a pair superfluid or from a two-component superfluid with correlated phases.\n\nThe honest summary of the chain: 2002 measured a charge gap, 2008 measured a coupling constant, 2021 grew a correlated spin state, 2025 measured two order parameters against each other. Only the last two are observations of a phase, and both got there by circumventing thermalization rather than by achieving it."}, {"id": "validity-audit", "title": "Validity Audit: Formulas Circulating With Their Assumptions Stripped", "markdown": "## Validity Audit: Formulas Circulating With Their Assumptions Stripped\n\nEach item below is a formula or a phrase that travels through the literature detached from the derivation that produced it. The pattern is uniform: an expression derived under a specific set of constraints acquires the status of a definition, and the constraints stop being stated. I give the circulating form, the assumption that was dropped, and the corrected statement.\n\n### 1. $J = 4t^2/U$, imported with its sign\n\n**Circulating form.** \"Superexchange in the Mott insulator gives an antiferromagnetic Heisenberg coupling $J = 4t^2/U \u003e 0$.\"\n\n**Assumption stripped.** Fermionic statistics. Anderson's derivation [3] is second-order perturbation theory in $t$ around a singly-occupied product state, and the sign is not arithmetic — it is Pauli blocking. The virtual doublon $|{\\uparrow\\downarrow},0\\rangle$ is accessible only from the spin-singlet component of the neighbouring pair; the triplet has no second-order path at all. Second-order energy shifts are negative, so the singlet alone is lowered by $-4t^2/U$, and $H_{\\rm eff} = J(\\mathbf{S}_i\\cdot\\mathbf{S}_j - 1/4)$ with $J \u003e 0$. Remove the exclusion principle and the mechanism evaporates.\n\n**Corrected statement.** For two distinguishable bosonic species $a,b$ at unit filling with intra- and interspecies repulsions $U_{aa}, U_{bb}, U_{ab}$, the same canonical transformation [4] gives an XXZ model, not a Heisenberg one:\n\n$$J_\\perp = -\\frac{4t_a t_b}{U_{ab}}, \\qquad J_z = \\frac{2(t_a^2+t_b^2)}{U_{ab}} - \\frac{4t_a^2}{U_{aa}} - \\frac{4t_b^2}{U_{bb}}$$\n\nwith the sign convention $H = \\sum_{\\langle ij\\rangle}\\big[\\tfrac{J_\\perp}{2}(S_i^+S_j^- + \\mathrm{h.c.}) + J_z S_i^z S_j^z\\big]$. Two things change. First, the transverse channel is *ferromagnetic*: both spin states of the virtual pair are permitted, and the $|ab\\rangle$ intermediate carries a Bose enhancement rather than a Pauli veto, so the flip-flop amplitude comes out with the opposite sign to the fermionic case — the natural bosonic order is XY-ferromagnetic. Second, $J_z$ is a difference of three terms and changes sign with the interaction anisotropy $\\eta = U_{ab}/\\sqrt{U_{aa}U_{bb}}$; at $t_a = t_b = t$ and $U_{aa}=U_{bb}=U$, $J_z = 4t^2(1/U_{ab} - 2/U)\\cdot\\tfrac{1}{2}$-type combinations cross zero near $U_{ab}\\approx U/2$, which is precisely the boundary between the counterflow (easy-plane) phase and the Ising/phase-separated regime [12, 16]. The SU(2)-symmetric Heisenberg point is not generic; it is the fine-tuned locus $U_{ab}=U_{aa}=U_{bb}$.\n\nThe operational consequence is visible in the experimental record. The bosonic antiferromagnet of 2021 [7] was not obtained by cooling — it required inverting the native exchange sign, via the tilt/superlattice control demonstrated in the double-well measurements of 2008 [6]. Any paper quoting \"$J=4t^2/U$, antiferromagnetic\" for a two-component bosonic lattice has imported a fermionic result across the statistics boundary.\n\n### 2. The quantum-rotor / Josephson-array reduction\n\n**Circulating form.** $H = \\tfrac{U}{2}\\sum_i \\hat n_i^2 - 2t\\bar n\\sum_{\\langle ij\\rangle}\\cos(\\phi_i-\\phi_j)$, \"the Bose–Hubbard model in phase representation.\"\n\n**Assumption stripped.** Large integer filling $\\bar n \\gg 1$ with $\\delta n_i = \\hat n_i - \\bar n$ small, so that $\\delta n_i$ may be treated as an *unbounded* integer canonically conjugate to a compact phase and $\\sqrt{n_i+1}\\sqrt{n_j}\\to \\bar n$.\n\n**Corrected statement.** The rotor model is an $\\bar n \\to \\infty$ limit, not a representation. It is blind to three features that constitute most of what is interesting about the Bose–Hubbard phase diagram [10]. (i) Particle–hole asymmetry: the true amplitudes $\\sqrt{n+1}$ and $\\sqrt{n}$ differ, so particle and hole excitations of
