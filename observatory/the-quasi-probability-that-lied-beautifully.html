and covariance under the metaplectic action. The inverse map, $\\hat A\\mapsto a$, is the *Weyl symbol*. The Wigner function is the Weyl symbol of the density operator, normalized so that $\\int W\\,dx\\,dp=\\mathrm{Tr}\\,\\hat\\rho$:\n\n$$W(x,p) \\;=\\; \\frac{1}{2\\pi\\hbar}\\!\\int\\!\\! dy\\; e^{-ipy/\\hbar}\\,\\langle x+\\tfrac{y}{2}\\mid \\hat\\rho\\mid x-\\tfrac{y}{2}\\rangle.$$\n\nThe equivalent — and structurally cleaner — formulation runs through the *characteristic function* $\\chi(\\xi,\\eta)=\\mathrm{Tr}\\bigl[\\hat\\rho\\, e^{i(\\xi\\hat x+\\eta\\hat p)}\\bigr]$. Then\n\n$$W(x,p) \\;=\\; \\frac{1}{(2\\pi)^2}\\!\\int\\!\\! d\\xi\\, d\\eta\\; \\chi(\\xi,\\eta)\\, e^{-i(\\xi x+\\eta p)},$$\n\na symplectic Fourier transform. Two consequences are immediate. First, $|W(x,p)|\\le 1/(\\pi\\hbar)$: the same Cauchy–Schwarz bound that makes $W$ uniformly bounded also forbids it from concentrating into a delta — it cannot mimic a sharp classical point, which is the *technical* reason a phase-space cell of area $\\hbar$ is the natural resolution. Second, the marginals\n\n$$\\int W(x,p)\\,dp = \\langle x\\mid\\hat\\rho\\mid x\\rangle,\\qquad \\int W(x,p)\\,dx = \\langle p\\mid\\hat\\rho\\mid p\\rangle$$\n\nare true probability densities, but no integral of $W$ over a *general* phase-space region is, in general, in $[6]$. Treating $W$ as a joint density and applying classical inference is the source of the standard paradoxes [2].\n\n### The Moyal star product and the Groenewold–van Hove obstruction\n\nThe Weyl correspondence transports operator multiplication into the *Moyal star product* on symbols,\n\n$$(a\\star b)(x,p) \\;=\\; a(x,p)\\,\\exp\\!\\Bigl[\\,\\tfrac{i\\hbar}{2}\\bigl(\\overleftarrow{\\partial_x}\\overrightarrow{\\partial_p}-\\overleftarrow{\\partial_p}\\overrightarrow{\\partial_x}\\bigr)\\Bigr]\\, b(x,p),$$\n\nand its antisymmetrization, the *Moyal bracket*,\n\n$$\\{a,b\\}_M \\;=\\; \\frac{1}{i\\hbar}(a\\star b-b\\star a) \\;=\\; \\{a,b\\}_{\\text{PB}} + O(\\hbar^2),$$\n\nwhich reduces to the Poisson bracket at leading order in $\\hbar$. The dynamics of $W$ is then\n\n$$\\partial_t W \\;=\\; \\{H,W\\}_M,$$\n\na $\\hbar$-deformation of Liouville's equation. The history here is not the textbook story of \"Wigner 1932 → Moyal 1949\". Groenewold's 1946 Utrecht thesis [3] contains both the star product and the obstruction theorem usually filed under \"Groenewold–van Hove\": no Lie-algebra homomorphism from $(C^\\infty(\\mathbb{R}^2),\\{\\cdot,\\cdot\\}_{\\text{PB}})$ into the operator commutator algebra exists beyond polynomials of degree $\\le 2$. This is what forces ordering ambiguity into quantization and what gives the Moyal bracket its $O(\\hbar^2)$ corrections any nontrivial content. Moyal's 1949 paper [4] was the independent rediscovery — refereed hostilely by Dirac, who disliked the statistical reinterpretation — and brought the formalism into the Anglophone literature.\n\n### The $s$-ordered family: P, W, Q as one Gaussian flow\n\nCahill and Glauber (1969) (verify) parametrized the operator-ordering ambiguity with a single real parameter $s\\in[-1,1]$. The $s$-ordered quasi-distribution is the symplectic Fourier transform of $\\chi(\\xi,\\eta)\\,e^{s(\\xi^2+\\eta^2)/4}$ (in dimensionless quadratures). The three canonical points are\n\n| $s$ | name | ordering | regularity |\n|---|---|---|---|\n| $+1$ | Glauber–Sudarshan $P$ | normal | distributional, can be highly singular |\n| $\\;\\;0$ | Wigner $W$ | symmetric (Weyl) | bounded, can be negative |\n| $-1$ | Husimi $Q$ | antinormal | smooth, $\\ge 0$ for every $\\hat\\rho$ |\n\nMoving in $s$ is Gaussian convolution: $W = P \\ast G_{1/2}$, $\\;Q = W \\ast G_{1/2} = P \\ast G_{1}$, where $G_\\sigma$ is the isotropic Gaussian of variance $\\sigma$ per quadrature. This single fact organizes most of the conflations in §4: the *more* one smooths, the *less* nonclassicality survives, and at $s=-1$ everything has been smoothed away — which is why $Q\\ge 0$ carries no information about classicality, and why detector inefficiency $\\eta\u003c1$ converts an observed $W$ into a partially Husimi-smoothed object with variance $(1-\\eta)/(2\\eta)$ added per quadrature.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003es-ordered family and Gaussian smoothing flow\u003c/title\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"660\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cpolygon points=\"660,320 650,315 650,325\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"675\" y=\"324\" fill=\"#e8e6e1\" font-size=\"14\"\u003es\u003c/text\u003e\u003cline x1=\"120\" y1=\"315\" x2=\"120\" y2=\"325\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"360\" y1=\"315\" x2=\"360\" y2=\"325\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"600\" y1=\"315\" x2=\"600\" y2=\"325\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"108\" y=\"345\" fill=\"#ff7a90\" font-size=\"14\"\u003es=+1\u003c/text\u003e\u003ctext x=\"348\" y=\"345\" fill=\"#7aa2ff\" font-size=\"14\"\u003es=0\u003c/text\u003e\u003ctext x=\"588\" y=\"345\" fill=\"#7ee0a3\" font-size=\"14\"\u003es=−1\u003c/text\u003e\u003ctext x=\"100\" y=\"365\" fill=\"#e8e6e1\" font-size=\"14\"\u003eP (Glauber–Sudarshan)\u003c/text\u003e\u003ctext x=\"338\" y=\"365\" fill=\"#e8e6e1\" font-size=\"14\"\u003eW (Wigner)\u003c/text\u003e\u003ctext x=\"572\" y=\"365\" fill=\"#e8e6e1\" font-size=\"14\"\u003eQ (Husimi)\u003c/text\u003e\u003ctext x=\"80\" y=\"385\" fill=\"#e8e6e1\" font-size=\"13\"\u003enormal order\u003c/text\u003e\u003ctext x=\"324\" y=\"385\" fill=\"#e8e6e1\" font-size=\"13\"\u003esymmetric (Weyl)\u003c/text\u003e\u003ctext x=\"556\" y=\"385\" fill=\"#e8e6e1\" font-size=\"13\"\u003eantinormal order\u003c/text\u003e\u003cpath d=\"M 120 200 L 120 170 L 130 170 L 110 150 L 130 130 L 110 110 L 130 90 L 120 90 L 120 60\" stroke=\"#ff7a90\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"140\" y=\"100\" fill=\"#ff7a90\" font-size=\"13\"\u003esingular / distributional\u003c/text\u003e\u003cpath d=\"M 280 200 C 320 80, 400 80, 440 200\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cpath d=\"M 280 200 C 310 250, 330 250, 360 200\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"4 3\"/\u003e\u003cpath d=\"M 360 200 C 390 150, 410 150, 440 200\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"300\" y=\"75\" fill=\"#7aa2ff\" font-size=\"13\"\u003ebounded, can be negative\u003c/text\u003e\u003cpath d=\"M 540 200 C 570 110, 630 110, 660 200\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"540\" y=\"100\" fill=\"#7ee0a3\" font-size=\"13\"\u003esmooth, ≥ 0 always\u003c/text\u003e\u003cpath d=\"M 170 240 C 240 270, 290 270, 340 240\" stroke=\"#ffb86b\" stroke-width=\"1.8\" fill=\"none\"/\u003e\u003cpolygon points=\"340,240 330,238 332,248\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"200\" y=\"288\" fill=\"#ffb86b\" font-size=\"13\"\u003econvolve with G(σ=1/2)\u003c/text\u003e\u003cpath d=\"M 410 240 C 480 270, 530 270, 580 240\" stroke=\"#ffb86b\" stroke-width=\"1.8\" fill=\"none\"/\u003e\u003cpolygon points=\"580,240 570,238 572,248\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"440\" y=\"288\" fill=\"#ffb86b\" font-size=\"13\"\u003econvolve with G(σ=1/2)\u003c/text\u003e\u003ctext x=\"40\" y=\"40\" fill=\"#e8e6e1\" font-size=\"15\"\u003eThe s-ordered family as a Gaussian smoothing flow\u003c/text\u003e\u003ctext x=\"40\" y=\"58\" fill=\"#e8e6e1\" font-size=\"12\"\u003eeach rightward step adds half a quadrature variance; nonclassicality is erased monotonically\u003c/text\u003e\u003c/svg\u003e\n*Figure: The Cahill–Glauber $s$-ordered family viewed as a one-parameter Gaussian convolution semigroup. P-singularity is the strongest nonclassicality witness, W-negativity is strictly weaker, and Q-positivity is content-free; detector loss with efficiency $\\eta$ enters as an extra convolution that pushes the displayed distribution toward the Husimi end.*\n\n### Royer's identity: $W$ as a displaced-parity expectation\n\nThe single formula that turns $W$ from a calculational device into a measurable observable is Royer's 1977 identity [7]: with $\\hat\\Pi=\\sum_n (-1)^n |n\\rangle\\langle n|$ the photon-number parity and $\\hat D(\\alpha)=\\exp(\\alpha\\hat a^\\dagger-\\alpha^*\\hat a)$ the displacement operator,\n\n$$W(\\alpha) \\;=\\; \\frac{2}{\\pi}\\,\\mathrm{Tr}\\!\\bigl[\\hat D(\\alpha)\\,\\hat\\Pi\\,\\hat D^\\dagger(\\alpha)\\,\\hat\\rho\\bigr] \\;=\\; \\frac{2}{\\pi}\\,\\langle\\hat\\Pi(\\alpha)\\rangle_{\\hat\\rho},$$\n\n(with $\\hbar=1$, dimensionless complex $\\alpha=(x+ip)/\\sqrt 2$). $W(\\alpha)$ is the expectation of a *bounded Hermitian operator with spectrum $\\{+1,-1\\}$*: its values are quantum expectation values of a parity observable measured after displacing the state by $-\\alpha$. Two consequences flow from this. First, $|W(\\alpha)|\\le 2/\\pi$ is now manifest as $|\\langle\\hat\\Pi(\\alpha)\\rangle|\\le 1$. Second, every \"direct\" or point-wise measurement of $W$ in cavity QED (Bertet et al., Deléglise et al.) and in circuit QED (Vlastakis et al., Wang et al.) (verify) is, operationally, a parity readout following a controlled displacement; the older homodyne route reconstructs $W$ via the Radon transform on the marginals [8, 9], but Royer's identity is what makes the *pointwise* protocol exist.\n\nNegativity is, in this language, the statement that there exists a phase-space point $\\alpha$ at which the *quantum* parity expectation is negative — i.e., the displaced state has more weight on odd Fock numbers than on even. That is the gauge-invariant fact the rest of the dossier will track: the inequalities Hudson's theorem [5] proves about, the experimental dip Smithey [8] could not yet see and Lvovsky [9] did, the resource the Mari–Eisert simulation theorem [10] consumes."}, {"id": "hudson-theorem-and-its-extensions", "title": "Hudson's Theorem and What It Does Not Say", "markdown": "## Hudson's Theorem and What It Does Not Say\n\nBy the early 1970s the Wigner function had been around for forty years, the star product for nearly thirty, and yet no clean theorem existed that turned $W \u003c 0$ into a structural statement about the state. The folklore — that nonclassicality \"shows up\" as negativity — was a slogan in search of a proof. Robin Hudson supplied one, in three pages, in 1974 [5]. The result is sharper and narrower than the way it is usually quoted.\n\n### The theorem, stated honestly\n\n**Hudson (1974).** *Let $\\psi \\in L^2(\\mathbb{R})$ be normalized and let $W_\\psi$ be its Wigner function. Then $W_\\psi(x,p) \\geq 0$ for all $(x,p)$ if and only if $\\psi$ is a Gaussian wavefunction*, i.e.\n$$\\psi(x) = \\exp\\!\\left(-\\tfrac{1}{2}a x^2 + b x + c\\right), \\qquad \\operatorname{Re}(a) \u003e 0,\\ b,c \\in \\mathbb{C}.$$\n\nEvery word matters. *Pure state*: $W_\\psi$ is the Wigner symbol of a rank-one projector $|\\psi\\rangle\\langle\\psi|$. *Gaussian*: complex quadratic exponent, hence a coherent or squeezed state up to displacement and phase. The \"if\" direction is the elementary calculation: the Wigner transform of a Gaussian is a Gaussian on $\\mathbb{R}^2$, manifestly nonnegative. The \"only if\" direction is the content.\n\n### Proof sketch (Hudson's argument, modernized)\n\nSuppose $W_\\psi \\geq 0$. Hudson's trick is to look at the *Wigner characteristic function*, the symplectic Fourier transform\n$$\\chi_\\psi(\\xi,\\eta) = \\int W_\\psi(x,p)\\, e^{-i(\\xi x + \\eta p)/\\hbar}\\, dx\\, dp = \\langle\\psi|\\, e^{-i(\\xi \\hat{x} + \\eta \\hat{p})/\\hbar}\\,|\\psi\\rangle,$$\nwhich is the expectation of a displacement operator. Two facts collide.\n\n(a) Because $W_\\psi \\geq 0$ and $\\int W_\\psi = 1$, the function $W_\\psi$ is a bona fide probability density on $\\mathbb{R}^2$, so $\\chi_\\psi$ is the characteristic function of a probability measure. By Bochner's theorem $\\chi_\\psi$ is *of positive type*: for any finite collection $\\{(\\xi_k,\\eta_k)\\}$ the matrix $\\chi_\\psi(\\xi_k-\\xi_\\ell,\\eta_k-\\eta_\\ell)$ is positive semidefinite.\n\n(b) Independently, $\\chi_\\psi$ is the matrix element of a unitary displacement operator on a pure state. A direct calculation gives the modulus bound\n$$|\\chi_\\psi(\\xi,\\eta)|^2 \\leq \\chi_\\psi(0,0)\\cdot |\\chi_\\psi(\\xi,\\eta)|^2 \\cdot e^{-(\\xi^2+\\eta^2)/(2\\hbar)\\cdot \\text{(state-dependent)}},$$\nand one shows that $\\chi_\\psi$ extends to an *entire function of order $\\leq 2$* in the complex variables $(\\xi,\\eta)$, with Gaussian growth on the real axis.\n\nCombining (a) and (b): an entire function of order 2 that is also the characteristic function of a probability measure must, by Marcinkiewicz's theorem (1939), be the exponential of a polynomial of degree at most 2. Hence\n$$\\chi_\\psi(\\xi,\\eta) = \\exp\\!\\left(\\text{quadratic in } \\xi,\\eta\\right),$$\nso the underlying $W_\\psi$ is Gaussian and the wavefunction $\\psi$ is Gaussian as well. Marcinkiewicz's theorem is doing the real work; Hudson's contribution was to recognize that the unitarity of displacements forces the order to be exactly 2, closing the loophole that distinguishes Wigner functions from arbitrary characteristic functions.\n\n### Soto–Claverie (1983): the multimode statement actually used in CV optics\n\nHudson wrote the theorem for one degree of freedom. The natural generalization to $\\mathbb{R}^{2n}$ — every pure multimode state with $W \\geq 0$ is a multimode Gaussian — is not a trivial corollary, because Marcinkiewicz's theorem is delicate in higher dimensions. Soto and Claverie filled the gap [11], showing that for pure $\\psi \\in L^2(\\mathbb{R}^n)$,\n$$W_\\psi(\\mathbf{x},\\mathbf{p}) \\geq 0 \\ \\ \\forall (\\mathbf{x},\\mathbf{p}) \\in \\mathbb{R}^{2n} \\iff \\psi \\ \\text{is a Gaussian in } n \\ \\text{variables.}$$\nThis is the version actually invoked in continuous-variable quantum optics, in CV cluster-state computing, and in the Mari–Eisert simulation theorem [10]. Textbooks routinely cite \"Hudson 1974\" for the multimode result; the correct citation is \"Hudson 1974 + Soto–Claverie 1983.\" The Hillery–O'Connell–Scully–Wigner review [2] is one of the few standard references that names both.\n\n### Gross (2006): the finite-dimensional analogue\n\nIn odd prime power dimension $d$, Wootters's discrete phase space $\\mathbb{Z}_d \\times \\mathbb{Z}_d$ supports a covariant Wigner function $W_\\rho(q,p)$ with all the right marginals. Gross proved [12] the discrete Hudson theorem:\n$$W_{|\\psi\\rangle}(q,p) \\geq 0 \\ \\ \\forall (q,p) \\iff |\\psi\\rangle \\ \\text{is a stabilizer state.}$$\nStabilizer states are the discrete Gaussians — they are the orbit of the computational basis under the Clifford group, which is precisely the finite-dimensional metaplectic representation. The proof again exploits a uniqueness theorem (here, the structure of the discrete Heisenberg–Weyl group) to force a quadratic exponent on the discrete characteristic function. This is the result that turns \"negativity is necessary for quantum advantage\" into a sharp statement for qudit circuits and underwrites the entire magic-state resource theory developed by Veitch, Ferrie, Gross, Emerson and successors. It also explains why $d$ must be *odd*: in even dimension there is no covariant nonnegative Wigner function for stabilizer states, and the analogue fails — a point we will return to in §8.\n\n### What the theorem does *not* say\n\nThe pure-state hypothesis is not cosmetic. Drop it and every direction of the equivalence breaks.\n\n**Counterexample 1 — mixed non-Gaussian states with $W \\geq 0$.** Bröcker and Werner (1995) constructed explicit mixed states whose Wigner function is everywhere nonnegative but which are not convex combinations of Gaussians; Mandilara, Karpov and Cerf (2009) gave a constructive family. These states are nonclassical by the P-representation criterion yet have $W \\geq 0$. Hudson does not forbid them.\n\n**Counterexample 2 — Wigner-positive mixtures of Wigner-negative pure states.** The thermal-photon mixture $\\rho = \\sum_n p_n |n\\rangle\\langle n|$ with sufficient noise has $W \\geq 0$ even though each $|n\\rangle$ for $n \\geq 1$ has $W \u003c 0$. The \"if\" direction of Hudson — Gaussian pure $\\Rightarrow W \\geq 0$ — has no mixed-state converse: positivity of $W$ on a mixed state does not imply the state is a Gaussian mixture.\n\n**Counterexample 3 — non-Gaussian channels acting on Gaussians.** A photon-number-resolving measurement on one arm of a two-mode Gaussian state yields a heralded mode whose Wigner function is, generically, non-Gaussian *and negative*. The non-Gaussianity comes from the measurement, not the input — confirming that Gaussianity of the prepared state is the controlled assumption in Hudson, not a property of the dynamics.\n\n**Counterexample 4 — degenerate Gaussians.** Hudson tacitly assumes $\\operatorname{Re}(a) \u003e 0$, i.e. a normalizable Gaussian. Improper \"Gaussians\" with $\\operatorname{Re}(a) = 0$ (position eigenstates, momentum eigenstates) are not in $L^2(\\mathbb{R})$ and do not have Wigner functions in the usual sense; they sit outside the theorem.\n\nThe mixed-state failure is the most consequential. Several modern claims — \"we observed $W \\geq 0$, therefore the state is classical-Gaussian\" — silently promote Hudson from a pure-state to a mixed-state statement and are simply wrong. The correct mixed-state question is whether $\\rho$ lies in the convex hull of Gaussian pure states; this is the *Wigner-positive but classically simulable* class identified by Mari–Eisert [10], and it is strictly larger than the Gaussian mixed states. The boundary is the resource-theoretic object that §7 will dissect.\n\nThe theorem, then, does one thing very cleanly: it pins nonnegativity of $W$ to Gaussianity *for pure states*. Everything past that boundary — mixed-state nonclassicality, simulability, contextuality, magic — requires more than Hudson. It requires the language assembled in 2006–2012, to which we turn after first cataloguing the conflations that occupy the intervening literature."}, {"id": "use-and-abuse", "title": "Use and Abuse: Six Conflations That Pollute the Modern Literature", "markdown": "## Use and Abuse: Six Conflations That Pollute the Modern Literature\n\nFour decades of nomenclature drift have left \"Wigner negativity\" doing work it cannot do. The phrase appears in talks as a synonym for non-Gaussianity, for nonclassicality, for contextuality, for entanglement, and — in the worst cases — for a probability that one is then invited to condition on. The Hillery–O'Connell–Scully–Wigner review [2] already warned, in 1984, that the $s$-ordered family makes most of these identifications regime-dependent; the warning did not survive the textbook treatment. What follows is a triage of six confusions, each stated as it actually appears in the literature, with the regime in which it happens to be locally true.\n\n### 4.1 \"$W\u003c0$ is THE signature of non-classicality\"\n\nHudson's theorem [5], and its multimode extension by Soto and Claverie [11], establishes a sharp equivalence between $W\\ge 0$ and Gaussianity *for pure states*. The slide from \"pure states with $W\\ge 0$ are Gaussian\" to \"states with $W\\ge 0$ are classical\" is a quantifier error.\n\nCounterexamples come in two flavours. (i) Mixed non-Gaussian states with $W\\ge 0$: take a single-photon Fock state $|1\\rangle\\langle 1|$ and mix it with vacuum,\n$$\\rho_\\eta = \\eta\\,|1\\rangle\\langle 1| + (1-\\eta)\\,|0\\rangle\\langle 0|, \\qquad W_{\\rho_\\eta}(\\alpha) = \\frac{2}{\\pi}\\bigl[(1-2\\eta) + 4\\eta|\\alpha|^2\\bigr]e^{-2|\\alpha|^2},$$\nwhich is everywhere non-negative once $\\eta\\le 1/2$, yet the state is non-Gaussian and is nonclassical in the Glauber–Sudarshan sense for any $\\eta\u003e0$. (ii) Squeezed thermal states, which have $W\\ge 0$ Gaussian (so on Hudson grounds look \"free\") but whose $P$ representation is a tempered distribution that is not a probability density — the textbook nonclassicality of squeezing lives entirely in $W\\ge 0$ territory.\n\nWhere the slogan happens to be right: for *pure* CV states, and inside the resource-theoretic accounting where the free operations are Gaussian and classical mixing is allowed [10]. There $W\\ge 0$ is exactly the free set.\n\n### 4.2 \"Wigner negativity = non-Gaussianity\"\n\nThis is the same conflation in a different disguise, and it is widespread in the multimode quantum-optics literature where non-Gaussian state engineering is the experimental currency [13]. For pure states the equivalence is Hudson–Soto–Claverie and is clean. For mixed states it fails in *both* directions:\n\n- A non-Gaussian mixed state may have $W\\ge 0$ (the $\\eta=1/2$ Fock–vacuum mixture above; convex combinations of widely separated coherent states; any state in the convex hull of coherent states, which is by definition $P$-positive and therefore $W\\ge 0$).\n- A Wigner-negative state passed through a Gaussian loss channel of transmissivity $\\eta$ has its Wigner function convolved with a Gaussian of variance $(1-\\eta)/(2\\eta)$ per quadrature; below a state-dependent $\\eta_{\\rm c}$ the convolution erases the negativity, but the output is still non-Gaussian — non-Gaussianity is invariant under Gaussian unitaries and decreases under Gaussian channels, but it does not vanish at the same threshold where negativity does [14].\n\nWalschaers and collaborators have made the multimode version of this distinction operational [13]: entanglement structure and negativity structure of non-Gaussian states are independent axes, and conflating them produces wrong predictions for which beamsplitter networks generate useful resources.\n\n### 4.3 \"$P$-singularity and $W\u003c0$ are the same nonclassicality criterion\"\n\nThe $s$-ordered family $W_s$ interpolates between Glauber–Sudarshan $P$ ($s=+1$), Wigner $W$ ($s=0$), and Husimi $Q$ ($s=-1$), each obtained from the next by Gaussian convolution of variance $(s'-s)/2$. Nonclassicality at level $s$ is strictly stronger than nonclassicality at level $s-2$: $P$ failing to be a probability density is weaker than $W\u003c0$, which is weaker than $Q\u003c0$ (which never happens).\n\nConcretely: the squeezed vacuum has $W\\ge 0$ Gaussian and a $P$ that is a derivative of a delta — singular, not a probability — so it is \"$P$-nonclassical\" but Wigner-positive. The single-photon state has both $P$ highly singular and $W(0)=-2/\\pi$. The cat state $|\\alpha\\rangle+|-\\alpha\\rangle$ has $W$ negativity at the origin of order $2/\\pi$ regardless of $|\\alpha|$, but its $P$ is more singular still. Reading $P$-singularity arguments (Mandel, Glauber) and $W\u003c0$ arguments (Kenfack–Życzkowski [15], Mari–Eisert [10]) as the same criterion misranks every borderline state and is a recurring error in homodyne tomography papers.\n\n### 4.4 \"Detector inefficiency that erases the dip proves the state became classical\"\n\nDetector efficiency $\\eta\u003c1$ acts on the reconstructed Wigner function as Gaussian convolution with kernel variance $(1-\\eta)/(2\\eta)$. For $|n\\rangle$ the central value satisfies $W(0)\u003c0$ iff $\\eta\u003en/(2n+1)$; for $n=1$ the threshold is $\\eta=1/2$. Above the threshold one sees a dip; below, the reconstruction is non-negative everywhere — *not because the state is classical*, but because one is looking at the Husimi-side of the smoothing axis. Lvovsky et al. [9] state the inversion explicitly: their reported $W(0)\\approx -1/\\pi$ is after loss correction, the raw reconstruction is positive. Reports of \"loss of nonclassicality\" that do not name $\\eta$ and the smoothing kernel are unfalsifiable.\n\nThis is the Husimi trap viewed from the experimental side: Gaussian smoothing is the same operation as moving toward $Q$, and $Q\\ge 0$ for *all* states [2].\n\n### 4.5 \"$W$ is a probability density that just happens to go negative\"\n\n$W$ is the symplectic Fourier transform of the characteristic function $\\chi(\\xi,\\eta)=\\mathrm{Tr}\\bigl[\\rho\\,D(\\xi+i\\eta)\\bigr]$; equivalently, by Royer [7],\n$$W(\\alpha) = \\frac{2}{\\pi}\\,\\mathrm{Tr}\\!\\left[\\rho\\,D(\\alpha)\\,\\Pi\\,D^\\dagger(\\alpha)\\right],$$\nwhich is the expectation value of a *bounded operator* with spectrum $\\pm 2/\\pi$. The marginals along any quadrature are bona fide probability densities; $W$ itself is not countably additive on phase-space cells of area less than $\\hbar$, and applying Bayes' rule, rejection sampling, or any classical conditioning to $W$ produces nonsense at sub-Planck scales. The slogan \"negative probability\" — Bartlett's coinage, Wigner's footnote pointing at Szilard — is a calculational device, not an ontological commitment, and Spekkens's operational argument later made the precise sense in which the negativity is *not* removable by reinterpretation.\n\n### 4.6 \"Vidal–Werner entanglement negativity is Wigner negativity\"\n\nA periodic name collision: entanglement negativity is $\\mathcal{N}(\\rho)=(\\Vert\\rho^{T_B}\\Vert_1 - 1)/2$, a partial-transpose monotone on a bipartite Hilbert space, with no phase-space content. Wigner negativity is $\\nu(\\rho)=\\int|W(x,p)|\\,dx\\,dp - 1$ [15], a single-mode (or multimode) phase-space integral. The two coincide only by accident of vocabulary; there is no general inequality between them.\n\n### 4.7 \"$Q\\ge 0$ certifies the $Q$-positive states as classical\"\n\n$Q\\ge 0$ is universal — it holds for $|n\\rangle$, for cats, for GKP states, for every density operator [2]. Treating $Q$-positivity as a nonclassicality criterion empties the word. What carries content in $Q$ is the *rate* of approach to a delta (equivalent to $P$-representability) and the existence of sub-Planck structure $\\Delta x\\Delta p \\ll \\hbar$ that survives the Gaussian smoothing.\n\n| Claim | True regime | False regime |\n|---|---|---|\n| $W\\ge 0\\Rightarrow$ classical | pure CV states | mixed states; squeezed thermal |\n| $W\u003c0\\Leftrightarrow$ non-Gaussian | pure states (Hudson, Soto–Claverie) | mixed states either way |\n| $P$ singular $\\Leftrightarrow W\u003c0$ | never strictly | always: $P$ is strictly weaker |\n| No dip $\\Rightarrow$ classical | $\\eta=1$ ideal detection | any $\\eta\u003c\\eta_{\\rm c}(\\rho)$ |\n| $W$ is a probability | quadrature marginals only | joint phase-space inference |\n| Negativity = entanglement negativity | none | always — different objects |\n| $Q\\ge 0$ $\\Rightarrow$ classical | never | always |\n\nSix confusions, one mechanism: each substitutes a *necessary* condition for a *sufficient* one, usually by quietly promoting a pure-state theorem to mixed states or a single $s$-slice to the whole family. The resource-theoretic frameworks of §7 are precisely the apparatus that refuses these substitutions."}, {"id": "landmark-experiments", "title": "From Smithey to Lvovsky to Circuit QED: Seeing the Dip", "markdown": "## From Smithey to Lvovsky to Circuit QED: Seeing the Dip\n\nBy the late 1980s the Wigner function had a clean operational identity (Royer's displaced parity [7]) and a clean nonclassicality theorem (Hudson [5], extended by Soto–Claverie [11]), but no one had ever drawn one from data. The obstruction was not conceptual — Bertrand and Bertrand had already supplied the inversion formula — but technological: balanced homodyne detection of a stable local oscillator at the shot-noise limit, with phase control good enough to bin quadratures by $\\theta$ at the few-percent level, only became routine in the Raymer group at Oregon around 1992.\n\n### The Bertrand–Bertrand identity\n\nBertrand and Bertrand (Found. Phys. 17, 397, 1987) (verify) observed that the marginal of $W$ along the rotated quadrature $x_\\theta = x\\cos\\theta + p\\sin\\theta$,\n\n$$\\mathrm{pr}(x_\\theta,\\theta) \\;=\\; \\int_{-\\infty}^{\\infty} W(x_\\theta\\cos\\theta - p_\\theta\\sin\\theta,\\, x_\\theta\\sin\\theta + p_\\theta\\cos\\theta)\\, dp_\\theta,$$\n\nis the Radon transform of $W$ over $\\theta\\in[0,\\pi)$. Inversion is the filtered back-projection familiar from X-ray CT,\n\n$$W(x,p) \\;=\\; \\frac{1}{2\\pi^2}\\int_0^\\pi d\\theta \\int_{-\\infty}^{\\infty} d\\xi\\, |\\xi|\\, \\tilde{\\mathrm{pr}}(\\xi,\\theta)\\, e^{i\\xi(x\\cos\\theta + p\\sin\\theta)},$$\n\nwith $\\tilde{\\mathrm{pr}}$ the Fourier transform of the marginal in $x_\\theta$. The $|\\xi|$ ramp filter is precisely the high-frequency amplification that the better-known Vogel–Risken paper (Phys. Rev. A 40, 2847, 1989) (verify) re-derived two years later in a purely quantum-optical language. Vogel and Risken are credited in the experimental literature; Bertrand and Bertrand were mathematicians publishing in *Foundations of Physics*, and the discoverability gap is a textbook example of community walls in citation.\n\n### Smithey 1993: the apparatus, not the dip\n\nThe first reconstruction was performed by Smithey, Beck, Raymer, and Faridani at Oregon on a pulsed squeezed vacuum produced by degenerate parametric down-conversion [8]. They binned $\\sim 4\\times 10^5$ homodyne samples into $\\sim 27$ phase bins across $[0,\\pi)$, applied filtered back-projection, and obtained a Wigner function that was an elongated Gaussian with minor-axis variance below shot noise by roughly $0.5$ dB. *The reconstructed $W$ was nowhere negative.* This is structural, not anecdotal: a squeezed vacuum is a Gaussian pure state, so Hudson's theorem guarantees $W\\ge 0$. What Smithey et al. demonstrated was the inversion machinery itself, and the marginal-by-marginal calibration of an apparatus capable, in principle, of resolving sub-Planck features.\n\nTheir efficiency budget — detector quantum efficiency $\\eta_d \\approx 0.85$, mode-matching visibility $\\mathcal{V}\\approx 0.78$, propagation $\\approx 0.97$ — combined to an effective $\\eta \\approx 0.55$. They reported quadratures *without* deconvolving $\\eta$: the published $W$ is the Wigner function of the lossy-channel output, which for Gaussian inputs is simply a more thermalised Gaussian. Because there is no negativity to lose, the lack of correction is harmless. It would be catastrophic for the next experiment.\n\n### The 2000/2001 priority question\n\nThe first directly observed $W\u003c0$ is the subject of a genuine, unresolved priority dispute.\n\nNogues, Rauschenbeutel, Osnaghi, Brune, Raimond, Haroche (Phys. Rev. A 62, 054101, 2000) (verify) measured a quantity proportional to the Wigner function of a single-photon Fock state stored in a high-$Q$ microwave cavity, using a circular-Rydberg atom as a parity probe in the spirit of Lutterbach–Davidovich (Phys. Rev. Lett. 78, 2547, 1997) (verify). They reported $W(0)\u003c0$ for the $|1\\rangle$ Fock state at the few-sigma level, with the central value consistent with the ideal $-2/\\pi \\approx -0.637$ after correction for thermal background ($\\bar n\\approx 0.1$) and Ramsey contrast.\n\nLvovsky, Hansen, Aichele, Benson, Mlynek, Schiller [9] performed full optical-homodyne tomography of a heralded single photon from a pulsed parametric down-converter, recovering a Wigner function whose value at the origin was $W(0,0) = -0.13 \\pm 0.01$ in the raw reconstruction, and $W(0,0)\\approx -1/\\pi \\approx -0.318$ after efficiency correction with $\\eta\\approx 0.55$ (detector QE $\\times$ mode-matching $\\times$ trigger conditioning).\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePriority geometry of the first W\u0026lt;0 observations\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"24\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" font-family=\"serif\"\u003eWhat was reconstructed, and of what?\u003c/text\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"370\" x2=\"700\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"36\" y=\"220\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 36 220)\"\u003emode reconstructed\u003c/text\u003e\u003ctext x=\"380\" y=\"392\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eprobe / inversion\u003c/text\u003e\u003crect x=\"110\" y=\"100\" width=\"240\" height=\"120\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"230\" y=\"124\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eNogues et al. 2000\u003c/text\u003e\u003ctext x=\"230\" y=\"146\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003emicrowave cavity mode\u003c/text\u003e\u003ctext x=\"230\" y=\"166\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e|1\u0026#x27E9; Fock, stationary\u003c/text\u003e\u003ctext x=\"230\" y=\"190\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eRydberg parity probe\u003c/text\u003e\u003ctext x=\"230\" y=\"210\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eW(\u0026#x3B1;) = (2/\u0026#x3C0;)\u0026#x27E8;D\u0026#x2020;\u0026#x3A0;D\u0026#x27E9;\u003c/text\u003e\u003crect x=\"380\" y=\"100\" width=\"240\" height=\"120\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"500\" y=\"124\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003eLvovsky et al. 2001\u003c/text\u003e\u003ctext x=\"500\" y=\"146\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003epropagating optical mode\u003c/text\u003e\u003ctext x=\"500\" y=\"166\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eheralded single photon\u003c/text\u003e\u003ctext x=\"500\" y=\"190\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003ebalanced homodyne\u003c/text\u003e\u003ctext x=\"500\" y=\"210\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eRadon back-projection\u003c/text\u003e\u003crect x=\"110\" y=\"250\" width=\"240\" height=\"100\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"230\" y=\"274\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eW(0) raw \u0026#x2248; \u0026#x2212;0.05 to \u0026#x2212;0.10\u003c/text\u003e\u003ctext x=\"230\" y=\"294\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003elimited by thermal n\u0026#x0304; \u0026#x2248; 0.1\u003c/text\u003e\u003ctext x=\"230\" y=\"314\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eand Ramsey contrast\u003c/text\u003e\u003ctext x=\"230\" y=\"338\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003epoint-by-point; never inverted\u003c/text\u003e\u003crect x=\"380\" y=\"250\" width=\"240\" height=\"100\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"500\" y=\"274\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eW(0,0) raw = \u0026#x2212;0.13 \u0026#xB1; 0.01\u003c/text\u003e\u003ctext x=\"500\" y=\"294\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e\u0026#x3B7; \u0026#x2248; 0.55 \u0026#x2192; corrected \u0026#x2248; \u0026#x2212;1/\u0026#x3C0;\u003c/text\u003e\u003ctext x=\"500\" y=\"314\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003efull W(x,p) surface\u003c/text\u003e\u003ctext x=\"500\" y=\"338\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003evia filtered back-projection\u003c/text\u003e\u003c/svg\u003e\n*Figure: The two 2000–2001 experiments observed $W\u003c0$ on physically distinct modes by inversion procedures with different epistemic content. Nogues et al. read $W(\\alpha)$ pointwise from atomic populations at chosen displacements; Lvovsky et al. inverted a full Radon transform of an optical mode.*\n\nThe priority question is therefore not \"who saw negative first\" but \"what counts as seeing $W$.\" If $W$ is *defined* by Royer's displaced-parity identity $W(\\alpha)=(2/\\pi)\\langle D(\\alpha)\\Pi D^\\dagger(\\alpha)\\rangle$ [7], then Nogues et al. measured it directly at a discrete set of $\\alpha$ — no inversion, no smoothing kernel, no efficiency deconvolution beyond a thermal-occupation correction. If $W$ is defined as the symplectic Fourier transform of the characteristic function reconstructed from homodyne marginals of a propagating field, then Lvovsky et al. were first to a full reconstruction. The two communities tend to cite themselves; the historically honest statement is \"first directly observed in cavity QED (Nogues 2000), first tomographically reconstructed on a propagating optical mode (Lvovsky 2001).\"\n\n### Efficiency and the threshold for seeing the dip\n\nLvovsky's raw $-0.13$ versus corrected $-0.318$ is the entire pedagogical point of §6: detector inefficiency acts on $W$ as Gaussian convolution of variance $\\sigma^2 = (1-\\eta)/(2\\eta)$, so for $|1\\rangle$ the reconstructed $W(0,0)$ has the closed form\n\n$$W_{\\eta}(0,0) \\;=\\; -\\frac{1}{\\pi}\\,\\frac{2\\eta - 1}{(2\\eta - 1) + 2(1-\\eta)\\cdot 1}\\;\\xrightarrow[\\eta\\to 1/2]{}\\; 0.$$\n\nA more useful way to write it: for the Fock state $|n\\rangle$ the central value $W_\\eta(0,0) = (-1)^n(2/\\pi)(2\\eta-1)^n$ for $\\eta\u003e1/2$, crossing zero at $\\eta=1/2$ and never returning negative for any finite loss below threshold. Lvovsky's $\\eta\\approx 0.55$ left him a $W(0,0)\\approx-(2/\\pi)(0.1)\\approx -0.064$ before mode-matching and trigger-conditioning factors; the published $-0.13$ implies they reported the negativity of an inferred state that *had* been partially corrected for finite trigger purity but not for the lossy channel itself. Whether one reports the raw reconstruction, the channel-deconvolved state, or both is the central ethical question in Wigner-tomography papers from this period.\n\n### From Lutterbach–Davidovich to circuit QED\n\nLutterbach and Davidovich (1997) (verify) recast Royer's identity into an experimental protocol: prepare a cavity in state $\\rho$, displace by $\\alpha$, send a two-level probe through the cavity for an interaction time $\\tau$ such that $\\chi\\tau = \\pi$ (dispersive coupling $\\chi$), and read the probe's $z$-population. The probe's excited-state probability is $P_e(\\alpha) = \\tfrac{1}{2}[1 + \\pi\\, W(\\alpha)/2]$, returning $W(\\alpha)$ scan-by-scan with no inversion and no efficiency-deconvolution kernel — only an overall contrast factor.\n\nThis is now the dominant cavity-Wigner protocol in superconducting circuits. Vlastakis et al. (Science 342, 607, 2013) (verify) used dispersive coupling of a transmon to a 3D microwave cavity to map the Wigner functions of cat states $|\\alpha\\rangle + |-\\alpha\\rangle$ with $|\\alpha|^2$ up to $\\sim 110$ photons, resolving the central interference fringe with $W\u003c0$ at the percent level. Sun et al. (Nature 511, 444, 2014) (verify) read out $W$ stroboscopically to track decoherence of cat states with Ramsey-like protocols. The Schoelkopf and Devoret groups' subsequent bosonic-code work — Ofek et al. (2016) (verify) on break-even cat-code memories, Campagne-Ibarcq et al. (2020) (verify) on GKP — uses the same Lutterbach–Davidovich primitive to certify state preparation: a negative dip in the right place is the experimental signature that the codespace is being populated.\n\nThe lineage is therefore not Wigner $\\to$ Smithey $\\to$ Lvovsky $\\to$ circuit QED as a single line of inheritance. It bifurcates at 1977: Royer's parity identity feeds the cavity/circuit-QED branch via Lutterbach–Davidovich and was first deployed by Nogues; Bertrand–Bertrand's Radon inversion feeds the homodyne branch via Smithey and was first pushed to negativity by Lvovsky. Both branches needed efficiency $\\eta\u003e1/2$ for a single photon, and both, by 2001, had it."}, {"id": "signatures-and-pitfalls", "title": "Detector Efficiency, Smoothing Kernels, and the Husimi Trap", "markdown": "## Detector Efficiency, Smoothing Kernels, and the Husimi Trap\n\nBy 2001 the negative dip was no longer a theoretical curio — Lvovsky's heralded Fock state had put $W(0,0) \\approx -1/\\pi$ on a single-channel oscilloscope trace [9]. What followed in the decade after was a quieter, less glamorous discovery: that the dip is fragile in a very specific, *calculable* way, and that the standard reporting practice — \"we measured $W$ and saw negativity\" — hides three independent layers of inference (loss, smoothing, regularization) each of which can manufacture or destroy a sign change without anyone noticing. This section is the accounting of those layers.\n\n### The loss channel as a Gaussian convolution\n\nThe starting point is the pure-loss channel $\\mathcal{L}_\\eta$, which models a beam-splitter of transmissivity $\\eta$ with vacuum at the unused port — equivalently, the action of a detector of quantum efficiency $\\eta$. On the level of characteristic functions $\\chi(\\lambda) = \\mathrm{tr}\\,\\rho\\,D(\\lambda)$ the channel acts as $\\chi(\\lambda) \\to \\chi(\\sqrt{\\eta}\\,\\lambda)\\,\\exp\\!\\left[-\\tfrac{1-\\eta}{2}|\\lambda|^2\\right]$, and the corresponding map on the Wigner function is a rescaling followed by Gaussian convolution. After absorbing the dilation $\\alpha \\to \\alpha/\\sqrt{\\eta}$ into the coordinates — which is what an experimentalist who normalizes to the reconstructed shot noise does automatically — the *reconstructed* Wigner function is\n\n$$\nW_\\eta(\\alpha) \\;=\\; \\frac{1}{\\pi\\sigma^2}\\int d^2\\beta\\, W(\\beta)\\,\\exp\\!\\left[-\\frac{|\\alpha-\\beta|^2}{\\sigma^2}\\right],\\qquad \\sigma^2 \\;=\\; \\frac{1-\\eta}{2\\eta}.\n$$\n\nThis is the relation usually quoted as \"loss smooths $W$.\" The variance $\\sigma^2$ interpolates monotonically between two named distributions of the $s$-ordered family [2]: $\\sigma^2 = 0$ at $\\eta = 1$ (the true $W$, $s=0$) and $\\sigma^2 = 1/2$ at $\\eta = 1/2$, where $W_\\eta$ becomes precisely the Husimi $Q$ function ($s=-1$). Half-efficient detection is not \"approximately the Wigner function with extra noise\"; it is *exactly* the Husimi function on the unmagnified mode. Anything below $\\eta = 1/2$ is *worse* than $Q$, i.e. lies outside the convex hull of the $s$-ordered family on the negative-$s$ side, and is positive for every quantum state.\n\n### State-dependent efficiency thresholds\n\nFor a Fock state $|n\\rangle$ the Wigner function is\n\n$$\nW_n(\\alpha) \\;=\\; \\frac{2(-1)^n}{\\pi}\\, L_n(4|\\alpha|^2)\\, e^{-2|\\alpha|^2},\n$$\n\nwith $L_n$ the Laguerre polynomial. The Gaussian convolution above acts diagonally in the photon-number basis on the density operator, mapping $|n\\rangle\\langle n|$ to a binomial mixture $\\sum_k \\binom{n}{k}\\eta^k(1-\\eta)^{n-k}\\,|k\\rangle\\langle k|$. The reconstructed $W$ at the origin then evaluates cleanly:\n\n$$\nW_\\eta^{(n)}(0) \\;=\\; \\frac{2}{\\pi}\\sum_{k=0}^{n}\\binom{n}{k}\\eta^k(1-\\eta)^{n-k}(-1)^k \\;=\\; \\frac{2}{\\pi}\\,(1-2\\eta)^n.\n$$\n\nThe dip survives — $W_\\eta^{(n)}(0) \u003c 0$ — *iff* $n$ is odd and $\\eta \u003e 1/2$, or $n$ is even and… never (the origin value is positive for $|0\\rangle$, $|2\\rangle$, $|4\\rangle$… because their underlying $W$ is already positive at the origin). The clean \"$\\eta \u003e 1/2$ to see negativity in $|1\\rangle$\" rule is the $n=1$ instance of this identity, originally pinned down in this form by Leonhardt and Paul in the mid-1990s and rediscovered by everyone who has since tried to certify a single photon.\n\nFor higher Fock states the *origin* is a misleading test point — the dominant negativity of $|n\\rangle$ lives in the outer rings of $L_n$, not at $\\alpha = 0$. A more honest figure of merit is the threshold above which *some* point of $W_\\eta^{(n)}$ goes negative. A standard calculation (extremize $W_\\eta^{(n)}$ over $|\\alpha|$ for the mixed-state representation above) gives the asymptotic threshold\n\n$$\n\\eta_c^{(n)} \\;\\sim\\; 1 \\;-\\; \\frac{1}{2n+1}\\qquad (n \\gtrsim 1),\n$$\n\nso $|2\\rangle$ needs $\\eta \u003e 4/5$, $|5\\rangle$ needs $\\eta \u003e 10/11$, and the photon-number-cat states used in bosonic codes [16] need efficiencies that climb toward unity as the code distance grows. The negativity of a large-$n$ Fock state is a *finer* signal than that of a single photon, not a coarser one — a fact frequently lost in claims that \"higher Fock states are more nonclassical.\" They are more nonclassical, and proportionally harder to *see*.\n\n### Why an absent dip is not evidence of classicality\n\nThe pair of statements (i) $\\rho$ has $W \u003c 0$ somewhere, and (ii) the reconstructed $W_\\eta$ has $W_\\eta \u003c 0$ somewhere, are related by a one-way implication only: (i) does not imply (ii) when $\\eta$ is below the state-dependent threshold; (ii) implies (i) for any $\\eta \u003e 0$, because Gaussian convolution cannot create negativity (it is a CPTP map that takes the positive cone of Wigner-positive states into itself). A reported \"loss of nonclassicality at low efficiency\" is therefore a statement about the reconstruction, not the state. The conflation alert from §4 — that this is read as evidence the underlying state has become classical — is the *Husimi trap*: the experimentalist, having unwittingly reconstructed $Q$ or something close to it, concludes from $Q \\geq 0$ what only $W \\geq 0$ would entail, namely something about the state itself. The asymmetry is structural. Hudson's theorem [5], extended by Soto–Claverie [11], is a statement about $W$; the Husimi function is positive for every state and carries no analogous theorem [2].\n\n### Reconstruction artefacts: MaxLik bias and kernel regularization\n\nThe smoothing argument above treats reconstruction as transparent — as if one had direct access to $W_\\eta$. Two real reconstruction methods break this assumption in opposite directions.\n\nMaximum-likelihood (MaxLik) reconstruction in a truncated Fock basis, as deployed since Lvovsky's iterative algorithm of 2004, enforces $\\rho \\geq 0$ as a hard constraint. This is correct as a quantum-mechanical prior but biases the estimator toward *more* negative Wigner functions: the boundary of the positive cone is where pure states live, and pure non-Gaussian states (Hudson [5]) have $W \u003c 0$. A statistically marginal homodyne dataset, fed to MaxLik with too low a photon-number cutoff, will tend to return a state that overshoots toward purity and reports a dip whose statistical significance is not what a Gaussian error bar would suggest. The cure is bootstrapped error bars on $W(\\alpha)$, not on $\\rho$.\n\nInverse-Radon (filtered backprojection) reconstruction has the opposite pathology. The exact inversion involves a $|k|$ filter in the radial Fourier variable that is unbounded; any practical implementation regularizes it with a low-pass cutoff $k_{\\max}$. The cutoff is *itself* a Gaussian (or sinc) convolution on $W$ — an additional smoothing kernel of width set by $1/k_{\\max}$, stacked on top of the loss kernel $\\sigma^2 = (1-\\eta)/(2\\eta)$. The total reconstructed object is $W$ convolved with a kernel of variance $\\sigma^2_{\\rm tot} = \\sigma^2_\\eta + \\sigma^2_{\\rm reg}$, and the same state-dependent thresholds apply with $\\sigma^2$ replaced by $\\sigma^2_{\\rm tot}$. A reconstruction quoted as \"$\\eta = 0.6$\" with aggressive radial regularization can be operationally indistinguishable from $\\eta = 0.45$ with none; the dip can disappear for a reason that has nothing to do with the optics.\n\n### The honest report\n\nA Wigner reconstruction that claims to witness negativity should specify three numbers — the detection efficiency $\\eta$, the effective post-reconstruction kernel variance $\\sigma^2_{\\rm tot}$, and the state-dependent threshold $\\eta_c$ above which the *target* state's negativity survives convolution by that kernel — and report the dip together with confidence intervals derived from the homodyne shot record, not from the reconstructed density matrix. Anything less is reporting on the algorithm."}, {"id": "negativity-as-resource", "title": "Negativity as a Resource: Mari–Eisert, Veitch–Ferrie–Gross–Emerson, and the Spekkens Bridge", "markdown": "## Negativity as a Resource: Mari–Eisert, Veitch–Ferrie–Gross–Emerson, and the Spekkens Bridge\n\nFor seventy-six years $W\u003c0$ was a curiosity in search of a job. Hudson's theorem [5] said it was the signature of non-Gaussianity for pure states; Kenfack–Życzkowski [15] said it could be integrated; Lvovsky's heralded Fock state [9] said it was real. None of this told you what negativity was *for*. The reframing — negativity is the fuel that quantum computers burn — happened in two stages between 2008 and 2012, and required a conceptual bridge built by Spekkens that most quantum-optics papers still elide.\n\n### Quantifying the dip\n\nThree quantitative measures coexist in the literature; they are not interchangeable and the field has been sloppy about saying so.\n\nThe Kenfack–Życzkowski indicator [15] is the $L^1$ excess of $W$ over its modulus,\n$$\\nu(\\rho) \\;=\\; \\tfrac{1}{2}\\!\\left(\\int|W_\\rho(x,p)|\\,\\mathrm{d}x\\,\\mathrm{d}p \\;-\\;1\\right) \\;=\\; \\int W_\\rho^{-}(x,p)\\,\\mathrm{d}x\\,\\mathrm{d}p,$$\nwhere $W^{-}=\\max(-W,0)$. Two normalisation conventions circulate: Kenfack–Życzkowski's original [15] takes $\\int|W|-1$ (no factor of $1/2$); the resource-theoretic literature [10] prefers $\\tfrac12(\\int|W|-1)$ so that $\\nu=\\int W^-$, which is what enters the simulation bounds. Always state which.\n\nMari and Eisert [10] then promoted negativity to a *resource* monotone — really, to its logarithm,\n$$\\mathcal{N}(\\rho) \\;=\\; \\log\\!\\int|W_\\rho(x,p)|\\,\\mathrm{d}x\\,\\mathrm{d}p,$$\nthe *Wigner logarithmic negativity*, an unfortunate name-collision with the Vidal–Werner entanglement negativity but a real mathematical sibling: both are $\\log\\lVert\\,\\cdot\\,\\rVert_1$ of an object whose $L^1$ norm collapses to $1$ exactly on the free states (PPT states there, Gaussian-positive states here). The defining property is sub-additivity under Gaussian channels: $\\mathcal{N}$ does not increase under Gaussian unitaries, Gaussian measurements with feed-forward, and partial traces — the natural CV \"free operations\". A non-Gaussian channel can manufacture negativity; a Gaussian one cannot.\n\nFor odd prime $d$, Veitch, Ferrie, Gross, and Emerson built the discrete analogue on Gross's finite-dimensional Hudson theorem [12]. Define the discrete Wigner $W_\\rho(u)$ over the phase space $\\mathbb{Z}_d\\times\\mathbb{Z}_d$ and set\n$$\\mathrm{sn}(\\rho) \\;=\\; \\sum_{u}|W_\\rho(u)|, \\qquad \\mathcal{M}(\\rho) \\;=\\; \\log\\mathrm{sn}(\\rho).$$\nThe latter is *mana*. Mana is faithful ($\\mathcal{M}=0$ iff $\\rho$ is a non-negatively represented state, i.e. a convex mixture of stabilizer states by Gross's theorem [12]), monotone under stabilizer operations, and additive under tensor products. It is the magic-state analogue of CV Wigner negativity; the parallel is not metaphor but theorem.\n\n### The classical-simulation theorems\n\nThe reason 2012 was the watershed is that two papers, one CV [10] and one finite-dimensional (Veitch–Ferrie–Gross–Emerson, New J. Phys. 14, 113011, the same year), proved structurally identical statements: a state with $W\\ge 0$ is a classical probability distribution over phase space that the computer can sample from in poly time, provided the dynamics also preserve positivity.\n\nIn the CV setting [10] the statement is sharp. If\n1. the input state $\\rho_{\\mathrm{in}}$ has $W_{\\rho_{\\mathrm{in}}}\\ge 0$ everywhere,\n2. all gates are Gaussian (symplectic affine transformations of $(x,p)$, plus displacements),\n3. all measurements are Gaussian (homodyne, heterodyne, Gaussian POVMs),\n\nthen the output statistics of the circuit can be sampled in classical poly time. The proof is essentially one line once the framework is in place: Gaussian unitaries act on $W$ as classical symplectic flows, Gaussian measurements correspond to marginalising over half of phase space, and a non-negative $W$ is then a literal probability density on the unmeasured subspace which one samples by Monte Carlo. Quantum speed-up therefore *requires* either a Wigner-negative input or a non-Gaussian operation — there is no third source.\n\nThe Veitch–Ferrie–Gross–Emerson theorem is the same statement in the odd-prime qudit world, with Gross's discrete Wigner [12] in place of the continuous one and Clifford gates in place of Gaussian unitaries. A state with $W\\ge 0$ on $\\mathbb{Z}_d\\times\\mathbb{Z}_d$ — equivalently, a *positively represented* state, equivalently, by [12], a convex mixture of stabilizer states — fed through Clifford circuits and measured in Pauli bases admits efficient classical simulation. Magic states (non-stabilizer ancillas distilled to fault-tolerant $T$-like resources) are precisely the states for which $W$ goes negative; their mana lower-bounds the cost of magic-state distillation.\n\nTwo warnings the literature regularly fails to issue. First, both theorems are sufficient conditions for hardness of simulation, not characterisations: $W\u003c0$ is necessary for quantum speed-up in these settings but a state can have copious negativity and still be classically simulable (e.g. low Schmidt rank tensor products of single-mode Wigner-negative states with efficient tensor-network descriptions). Second, the discrete Hudson theorem [12] holds only in *odd prime* dimension. The qubit case ($d=2$) is genuinely different — the natural discrete Wigner is not unique, every Pauli eigenstate carries negativity in most constructions, and the resource theory has to be rebuilt around contextuality rather than negativity itself. This is the gap that Delfosse et al. [17] and Raussendorf et al. [18] filled for rebits and qubits respectively, and it is why \"$d=2$ magic\" needed a separate program.\n\n### The Spekkens bridge\n\nWhy should $W\u003c0$ — a sign on a Fourier transform of a density matrix — track computational power at all? The conceptual link, missing from both 2012 papers as a citation but present in their thinking, is Spekkens's 2008 theorem (Phys. Rev. Lett. 101, 020401): the existence of a non-negative quasi-probability representation of an operational theory is equivalent to non-contextuality of that theory in the generalised (preparation- and measurement-) sense. Negativity in *any* quasi-probability representation — Wigner, discrete Wigner, Kirkwood–Dirac [19] — is therefore not an artefact of choosing a bad representation; it is the operational signature of contextuality, which Kochen–Specker and its successors had already identified as a non-classical structural feature.\n\nMari–Eisert [10] and Veitch–Ferrie–Gross–Emerson together translated this ontological statement into a computational one: contextuality, witnessed as Wigner negativity, is what a classical sampler cannot reproduce in poly time. The chain is now standard. Hudson [5] / Soto–Claverie [11] / Gross [12] identify the free states (Gaussian or stabilizer); Spekkens identifies the structural feature distinguishing free from non-free as preparation contextuality; Mari–Eisert and VFGE turn that feature into a simulation lower bound; mana and CV log-negativity quantify the rate. The subsequent equivalence between contextuality and Wigner negativity in CV [20] and in qubit/rebit computation [17, 18] closed the loop: in every regime where the resource theory works, \"negative\" and \"contextual\" name the same thing.\n\nWhat this reframing buys, and what it does not. It buys a precise operational meaning for $W\u003c0$: it is the unit of computational non-classicality, distillable, monotone, and additive (mana) or sub-additive (CV negativity) under the free operations. It does not buy a uniqueness theorem — Kirkwood–Dirac quasi-probabilities [19] support a parallel resource theory with different free operations, and the choice of representation is itself a modelling decision with operational content. Negativity is the resource; *which* negativity depends on which classical theory you are trying to beat."}, {"id": "frontier-and-open-problems", "title": "Open Fronts: Even-Dimensional Qudits, Bosonic Codes, and the Ontology Question", "markdown": "## Open Fronts: Even-Dimensional Qudits, Bosonic Codes, and the Ontology Question\n\n### The even-dimensional gap\n\nGross's theorem [12] — for odd prime power dimension $d$, the discrete Wigner function is non-negative iff the state is a stabilizer — is what makes the Veitch–Ferrie–Gross–Emerson resource theory clean. The proof exploits the fact that in odd $d$ the Heisenberg–Weyl group admits a unique (up to gauge) translation-covariant Wigner function whose positivity facets coincide with the stabilizer polytope. In $d = 2$ the construction collapses. Any translation-covariant Wigner function for $n$ qubits must assign negative values to some stabilizer states; the textbook witness is $|+y\\rangle$, which is a stabilizer state but produces $W \u003c 0$ in every Wootters-type GF$(2^n)$ construction.\n\nThis is not cosmetic. Qubit fault tolerance is the practically dominant model, and the cleanest negativity-as-resource statement does not directly apply to it. Three work-arounds organize the literature:\n\n- The Delfosse–Allard Guérin–Bian–Raussendorf rebit theorem [17] recovers Hudson cleanly for real-amplitude qubits: the Wootters discrete $W$ over GF$(2)$ becomes an operational contextuality witness for rebit measurement-based computation. The cost is the restriction to the real subtheory, which excludes the magic states most relevant to practical fault tolerance.\n- Raussendorf–Browne–Delfosse–Okay–Bermejo-Vega [18] then extended the framework to full qubit MBQC by replacing translation-covariance with a cocycle-determined quasi-distribution. The price: the stabilizer polytope is replaced by a state-dependent positivity condition, and the resulting equivalence is strictly weaker than its odd-$d$ counterpart.\n- Haferkamp–Bermejo-Vega [20] proved a CV analogue: for continuous-variable optics with measurements drawn from a Gaussian-positive POVM class, operational contextuality and Wigner negativity coincide. The qubit obstruction is thus genuinely dimensional — absent in the bosonic continuum, structural in $d=2^n$.\n\nThe unresolved question is whether the obstruction can be lifted by enlarging the symmetry group. Campos-Uscanga and collaborators [21] have recently identified magic-state structure inside the asymmetric quantum Rabi model that hints at a translation-covariant Wigner construction on a quotient phase space, but a clean even-$d$ Hudson theorem remains absent. The Zhang–Li construction of \"mutual mana\" via discrete beamsplitters [22] formalizes the conversion of local magic into correlation, sharpening the question without answering it.\n\n### Bosonic codes: negativity as the encoding\n\nThe bosonic error-correcting codes — GKP (2001), cat (Mirrahimi–Leghtas), binomial (Michael et al.) — all live in the manifestly non-Gaussian sector, and all carry $W \u003c 0$ as a structural feature rather than an accident.\n\nFor ideal GKP, logical states are formal Dirac combs $|\\mu\\rangle_\\text{GKP} \\propto \\sum_{s \\in \\mathbb{Z}} |(2s+\\mu)\\sqrt{\\pi}\\rangle$. The Wigner function is a lattice of delta peaks with signs determined by the symplectic dual,\n\n$$W_\\mu(q,p) \\;\\propto\\; \\sum_{s,t \\in \\mathbb{Z}} (-1)^{(2s+\\mu)\\,t}\\, \\delta\\!\\big(q - s\\sqrt{\\pi}\\,\\big)\\,\\delta\\!\\big(p - t\\sqrt{\\pi}/2\\big),$$\n\nso half the peaks are *negative*. Finite-energy approximations smear the deltas into Gaussian bumps of width $\\Delta$; the sign pattern survives whenever $\\Delta \\ll \\sqrt{\\pi}$. The negativity volume scales linearly with the number of resolved peaks, hence logarithmically with the squeezing parameter — now an observable quantity in trapped-ion and circuit-QED hardware. The unresolved theoretical question, partially addressed by Walschaers–Fabre–Parigi–Treps for multimode non-Gaussian states [13], is whether $\\nu(\\rho)$ is a *faithful* monotone for the code's fault-tolerance threshold, or only correlated with it. The two diverge for the cat code, whose logical errors are dominated by parity (a continuous-symmetry-protected quantity) rather than by negativity per se.\n\nCat states $|\\mathcal{C}_\\pm\\rangle \\propto |\\alpha\\rangle \\pm |{-}\\alpha\\rangle$ exhibit interference fringes of amplitude $\\sim 2 e^{-2|\\alpha|^2}/\\pi$, oscillating in sign on the line between the lobes. Squeezing the cat protects the negativity against amplitude damping by reshaping the Wigner support into the orthogonal direction [14]; the protection is geometric, not topological, and there is no clean negativity threshold for fault tolerance. Recent quantifications of optical cat-state coherence [23] use $\\nu(\\rho)$ [15] as a witness, but the gap between $\\nu$ and the operationally relevant code-distance metric is unaddressed.\n\nBinomial codes sit between GKP and cat: finite Fock support means bounded negativity (no diverging delta-comb) and fault-tolerance analysis is most natural in the Fock basis, where negativity is derived rather than primary. The taxonomic lesson is uncomfortable for the resource-theory program — different bosonic codes promote *different* aspects of non-Gaussianity to the protected role, and it is not obvious that any single phase-space scalar captures all of them.\n\n### Ontology: contextuality, Kirkwood–Dirac, and the realism question\n\nSpekkens's 2008 operational equivalence — negativity of *any* quasi-probability representation is equivalent to contextuality of the underlying ontological model — has been sharpened on two fronts. For CV [20], the equivalence holds under explicit restrictions on the measurement class. For qubit MBQC [18], contextuality (not negativity directly) is the necessary resource, and negativity is a witness only inside the restricted Wigner constructions above.\n\nThe cleanest open question is whether negativity is ontologically primary or a *symptom* of a deeper contextual structure. The Kirkwood–Dirac distribution has had a quiet revival in weak-measurement and foundations contexts; Spriet–Langrenez–Brummelhuis–De Bièvre [19] argue that the KD distribution is singled out among quasi-probabilities by producing natural conditional expectations, suggesting that KD negativity is operationally equivalent to $W$ negativity for many witnesses but emerges from a different symmetry group. The implication is that negativity is a generic feature of non-commuting-operator representations rather than a property privileged to phase space. In this writer's view, this is the most under-discussed foundational question in the area, and the one most likely to dissolve into a precise no-go statement within the decade.\n\nRecent experimental tests of noncontextuality without causal-chain assumptions [24] close one of the looser knots in the Spekkens framework; transporting the same closure to the CV setting is open.\n\n### Negativity under noise: monotonicity, faithfulness, and the resource gap\n\nThe most actionable open problem for experimentalists is the status of $\\nu(\\rho) = \\int |W(q,p)|\\,dq\\,dp - 1$ as a *faithful* nonclassicality monotone under realistic noise. The current picture:\n\n- Under Gaussian channels, $\\nu$ is monotone non-increasing — this is the operational backbone of the Husimi-smoothing argument from §6, and it has no known counterexample.\n- Under non-Gaussian channels, $\\nu$ is **not** monotone. Photon subtraction following amplitude damping can transiently *increase* $\\nu$ because loss-induced smoothing reshapes a broad oscillating $W$ into a more sharply oscillating one. Le Jeannic et al. [14] demonstrate the effect in optics; a clean theorem distinguishing \"good\" from \"pathological\" channels with respect to $\\nu$ is missing.\n- For mixed states there is **no** known analogue of Hudson's theorem [5, 11], even in the loose sense of a representation-independent positivity criterion. The Solinas–Donelli–Gherardini operational criterion [25] bypasses full tomography by computing $\\nu$ from a moment-generating expectation, but it does not resolve the monotonicity question — it presupposes that $\\nu$ is the right quantity to certify.\n\nWalschaers and collaborators [13] tie multimode Wigner negativity to entanglement structure, pointing toward a future in which negativity is decomposed mode-by-mode and the resource theory becomes a graded object rather than a single scalar. Whether such a decomposition admits a clean monotonicity theorem under arbitrary CPTP noise is, at present, the central open question of the program — and the one on which the dossier's verdict turns."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier picking at seventy years of attribution and forty years of vocabulary drift. Here is where I will plant a flag.\n\n### (a) What I will defend with my reputation\n\nThree claims, in descending order of how loudly I am willing to argue them.\n\nFirst: **the Wigner function is a symbol, not a distribution that misbehaves.** Everything coherent that has ever been said about $W$ — Groenewold's no-go [4], Hudson's theorem [5], Royer's displaced-parity formula [7], the Mari–Eisert quasi-probability simulation bound — is a statement about the Weyl–Wigner *map* $A \\mapsto W_A$ and the Moyal product $\\star$, not about $W$ as a misfit probability. The pedagogical framing \"negative probability, weird, isn't quantum mechanics strange\" has cost the field two generations of clarity and is responsible for at least four of the six conflations cataloged in §4.\n\nSecond: **Hudson's theorem is a pure-state theorem and saying otherwise is wrong, not loose.** The pure-state hypothesis is load-bearing in Hudson's original Gaussian-integrability argument [5] and in the Soto–Claverie multimode extension [11]. The mixed-state version is *false* — Bröcker–Werner [verify] exhibited Wigner-positive non-Gaussian mixed states explicitly, and noisy Fock states give the construction for free. Every talk that writes \"by Hudson's theorem, $W \\geq 0 \\Leftrightarrow$ Gaussian\" without \"pure\" is propagating an error.\n\nThird: **for odd prime-power $d$, Gross's discrete Hudson theorem [12] is the foundational result of the discrete resource theory, not a technicality.** Without it Veitch–Ferrie–Gross–Emerson has no preferred free set and the Wigner-negativity-as-magic story collapses into \"pick a quasi-probability, any quasi-probability.\"\n\n### (b) What is shakier than the literature admits\n\nThe **resource-theoretic reading of $W\u003c0$** rests on assumptions that are quietly stronger than advertised. Specifically: (i) the choice of phase-space representation is treated as canonical, when in continuous variables the entire $s$-ordered family $\\{W_s\\}_{s\\in[-1,1]}$ is mathematically on equal footing and only the operational context (homodyne vs heterodyne) privileges $s=0$; (ii) the simulation bound of is a statement about a particular *classical sampling algorithm*, not about classical simulability in any model-independent sense — efficient simulation of Wigner-positive dynamics with non-Gaussian measurement is an open problem the slogan obscures; (iii) the qudit story [12] fails at $d=2$ and at every even $d$, which is the regime of every actual superconducting and trapped-ion processor on Earth. The Wootters [verify] / Gibbons–Hoffman–Wootters [verify] constructions for even $d$ are not unique and none of them satisfies the analogue of Gross's theorem. We do not have a discrete Hudson theorem for qubits and we are pretending the gap is cosmetic.\n\nThe **contextuality bridge** is shakier still. Spekkens' operational equivalence of negativity and contextuality is a theorem about *every* quasi-probability representation, not about $W$ specifically; the identification \"Wigner negativity = contextuality\" only goes through after one has accepted (i) above.\n\n### (c) Three open questions I would actually work on\n\n1. **An even-$d$ discrete Hudson theorem, or a sharp obstruction to one.** Without it the magic-state picture for qubits is foundationless.\n2. **A representation-independent resource theory of negativity.** Quotient out the $s$-ordering choice; what survives is the real invariant.\n3. **Operational meaning of the integrated negativity $\\mathcal N = \\int|W|\\,d^2\\alpha - 1$ beyond 's sampling overhead** — is it a channel capacity, a metrological resource, or an artifact of an arbitrary norm?\n\n### Reading path\n\n1. [4] Groenewold (1946) — read the no-go theorem and the star product in their original form; everything downstream is commentary.\n2. [7] Royer (1977) — $W(\\alpha) = \\tfrac{2}{\\pi}\\langle D(\\alpha)\\Pi D^\\dagger(\\alpha)\\rangle$ is the cleanest definition and dissolves the \"negative probability\" mystique in one line.\n3. [5] Hudson (1974), then [11] Soto–Claverie (1983) back-to-back — the theorem as proved, and the multimode form actually used in quantum optics.\n4. Spekkens (2008) — the operational frame that retroactively explains why $W\u003c0$ was ever a resource.\n5. Veitch–Ferrie–Gross–Emerson (2012), with [12] Gross (2006) kept open beside it — the resource theory and the theorem it secretly rests on."}], "references": [{"n": 1, "title": "On the Quantum Correction For Thermodynamic Equilibrium", "authors": ["Eugene P. Wigner"], "year": 1932, "venue": "Physical Review 40, 749", "url": "https://doi.org/10.1103/PhysRev.40.749", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Distribution functions in physics: Fundamentals", "authors": ["M. Hillery", "R. F. O'Connell", "M. O. Scully", "E. P. Wigner"], "year": 1984, "venue": "Physics Reports 106, 121", "url": "https://doi.org/10.1016/0370-1573(84)90160-1", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "On the principles of elementary quantum mechanics", "authors": ["H. J. Groenewold"], "year": 1946, "venue": "Physica 12, 405", "url": "https://doi.org/10.1016/S0031-8914(46)80059-4", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Quantum mechanics as a statistical theory", "authors": ["J. E. Moyal"], "year": 1949, "venue": "Mathematical Proceedings of the Cambridge Philosophical Society 45, 99", "url": "https://doi.org/10.1017/S0305004100000487", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "When is the Wigner quasi-probability density non-negative?", "authors": ["R. L. Hudson"], "year": 1974, "venue": "Reports on Mathematical Physics 6, 249", "url": "https://doi.org/10.1016/0034-4877(74)90007-X", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Theory of the Work Function. II. The Surface Double Layer", "authors": ["John Bardeen"], "year": 1936, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.49.653", "cited_by": 516, "bucket": "earliest"}, {"n": 7, "title": "Wigner function as the expectation value of a parity operator", "authors": ["Antoine Royer"], "year": 1977, "venue": "Physical Review A 15, 449", "url": "https://doi.org/10.1103/PhysRevA.15.449", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Measurement of the Wigner distribution and the density matrix of a light mode using optical homodyne tomography: Application to squeezed states and the vacuum", "authors": ["D. T. Smithey", "M. Beck", "M. G. Raymer", "A. Faridani"], "year": 1993, "venue": "Physical Review Letters 70, 1244", "url": "https://doi.org/10.1103/PhysRevLett.70.1244", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Quantum State Reconstruction of the Single-Photon Fock State", "authors": ["A. I. Lvovsky", "H. Hansen", "T. Aichele", "O. Benson", "J. Mlynek", "S. Schiller"], "year": 2001, "venue": "Physical Review Letters 87, 050402", "url": "https://doi.org/10.1103/PhysRevLett. <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
