es; the citation pattern has barely shifted.\n\n### Moyal 1949, and Dirac's refusal\n\nJosé Enrique Moyal arrived at the phase-space program from a different direction — probability theory and stochastic processes — and submitted his manuscript to *Proceedings of the Cambridge Philosophical Society* in 1947. The published version [7] is what the field knows: quantum mechanics recast as a statistical theory on phase space, with the bracket\n\n$$\\{f,g\\}_{M} = \\frac{2}{\\hbar}\\, f \\sin\\!\\left(\\frac{\\hbar}{2}\\overleftarrow{\\partial}_{q}\\overrightarrow{\\partial}_{p} - \\frac{\\hbar}{2}\\overleftarrow{\\partial}_{p}\\overrightarrow{\\partial}_{q}\\right) g$$\n\n(the sine bracket whose leading term is the Poisson bracket and whose all-orders content reproduces the commutator) carrying the dynamics. Moyal did not know of Groenewold's thesis when he wrote the paper; the star product is implicit in his bracket but not isolated as an algebra. The independence of the two derivations is well established.\n\nWhat is less widely remembered is that Moyal had circulated drafts to Dirac for nearly a decade before publication, and Dirac refused the program. The correspondence — preserved and reproduced by Ann Moyal in [8] — shows Dirac arguing that any reformulation of quantum mechanics on phase space must be either equivalent to the Hilbert-space formulation (in which case it is at best a notational variant) or inequivalent (in which case it is wrong); the option that the reformulation might *expose structure invisible in the operator picture* — which is exactly what the deformation-quantization community would later argue is its real content — Dirac did not entertain. Moyal's paper was held up, his academic position in Britain became untenable, and he eventually moved to Australia. The marginalization was concrete, not merely citational.\n\n### What the textbook attribution falsifies\n\nThe standard sentence \"the Wigner function was introduced by Wigner in 1932 and reformulated by Moyal in 1949\" is wrong on three counts. (i) The function was introduced by Wigner *and Szilard*, with the joint origin documented in Wigner's own footnote and recollections [1, 2]. (ii) The reformulation as an algebra — the part that makes the phase-space picture a working framework rather than a curiosity — is Groenewold's [6], not Moyal's, and predates Moyal's publication by three years. (iii) The conceptual rehabilitation of \"negative probability\" as a mathematically respectable object is Bartlett's [3], not Feynman's [4]. Each of these displacements is documented in the primary sources; none is controversial historiographically; all four remain in force in the citation practice of the field. The sections that follow will assume this corrected lineage rather than the textbook one."}, {"id": "the-formalism", "title": "The Formalism: Wigner Transform, Weyl Symbols, and the Moyal Bracket", "markdown": "## The Formalism: Wigner Transform, Weyl Symbols, and the Moyal Bracket\n\n### The transform and what it is *of*\n\nThe object Wigner wrote down in 1932 [1], for a one-dimensional system in a pure state $\\psi$, is\n\n$$ W(q,p) \\;=\\; \\frac{1}{\\pi\\hbar}\\int_{-\\infty}^{\\infty} \\psi^{*}(q+y)\\,\\psi(q-y)\\,e^{2ipy/\\hbar}\\,dy. $$\n\nFor a general (possibly mixed) state $\\rho$ the same construction reads\n\n$$ W(q,p) \\;=\\; \\frac{1}{\\pi\\hbar}\\int_{-\\infty}^{\\infty} \\langle q+y\\mid \\rho \\mid q-y\\rangle\\, e^{-2ipy/\\hbar}\\,dy, $$\n\nwhere the sign in the exponent is the textbook convention chosen so that the $p$-marginal comes out right; the two forms differ only by $y\\!\\to\\!-y$. Either way, $W$ is a real function on $\\mathbb R^{2}$ — *not* a probability density. It is the **Wigner symbol** of $\\rho$, i.e. its image under the Wigner transform, which is the inverse of the Weyl quantization map. Three identities make this concrete:\n\n$$ \\int W(q,p)\\,dp = \\langle q\\mid\\rho\\mid q\\rangle, \\qquad \\int W(q,p)\\,dq = \\langle p\\mid\\rho\\mid p\\rangle, \\qquad \\iint W(q,p)\\,dq\\,dp = \\operatorname{tr}\\rho = 1. $$\n\nBoth marginals are *bona fide* probability densities. The trouble is hidden in joint statements: there exists no real-valued $W$ on phase space that reproduces both marginals correctly *and* is everywhere nonnegative, unless $\\psi$ is a Gaussian — that is the content (later) of Hudson [9] and Soto–Claverie [10].\n\n### Weyl quantization and its inverse\n\nWeyl's symmetrization rule assigns to a phase-space function $a(q,p)$ the operator\n\n$$ \\hat A \\;=\\; \\operatorname{Op}_{\\mathrm W}[a] \\;=\\; \\frac{1}{(2\\pi)^{2}}\\iiiint a(q,p)\\,e^{i\\alpha(\\hat q-q)+i\\beta(\\hat p-p)}\\,d\\alpha\\,d\\beta\\,dq\\,dp. $$\n\nThe inverse map — Wigner's transform on operators — sends $\\hat A$ to its **Weyl symbol**\n\n$$ a(q,p) \\;=\\; \\int \\big\\langle q+\\tfrac{y}{2}\\,\\big|\\,\\hat A\\,\\big|\\,q-\\tfrac{y}{2}\\big\\rangle\\, e^{-ipy/\\hbar}\\,dy. $$\n\nWith these conventions $W(q,p) = (2\\pi\\hbar)^{-1}\\,a_{\\rho}(q,p)$: the Wigner function is the Weyl symbol of $\\rho$, normalized for phase-space integration. The whole formalism is then a dictionary\n\n$$ \\hat A \\longleftrightarrow a(q,p), \\qquad \\operatorname{tr}(\\hat A\\hat B) \\;=\\; \\frac{1}{2\\pi\\hbar}\\!\\iint a(q,p)\\,b(q,p)\\,dq\\,dp. $$\n\nThe last line — the **trace inner product as a phase-space overlap** — is the workhorse of every later result. With $\\hat A=\\rho_{1}$, $\\hat B=\\rho_{2}$ one finds $\\operatorname{tr}(\\rho_{1}\\rho_{2}) = 2\\pi\\hbar \\iint W_{1}W_{2}\\,dq\\,dp$. Two consequences are immediate.\n\nFirst, because $0 \\le \\operatorname{tr}(\\rho_{1}\\rho_{2}) \\le 1$ and one may set $\\rho_{2}=\\rho_{1}=|\\psi\\rangle\\langle\\psi|$,\n\n$$ 2\\pi\\hbar \\!\\iint W^{2}(q,p)\\,dq\\,dp \\;=\\; \\operatorname{tr}\\rho^{2} \\;\\le\\; 1. $$\n\nSecond — the bound asked for — set $\\rho_{2}$ equal to the displaced parity $\\hat\\Pi(\\alpha)=\\hat D(\\alpha)\\hat\\Pi\\hat D^{\\dagger}(\\alpha)$. Royer's identity [11]\n\n$$ W(q,p) \\;=\\; \\frac{1}{\\pi\\hbar}\\,\\operatorname{tr}\\!\\big[\\rho\\,\\hat\\Pi(q,p)\\big] $$\n\nwrites $W$ as an expectation value of a bounded operator with spectrum $\\{+1,-1\\}$, so\n\n$$ |W(q,p)| \\;\\le\\; \\frac{1}{\\pi\\hbar}, \\qquad \\forall\\,(q,p). $$\n\nThis is a *state-independent* pointwise ceiling — a peculiarity of $s=0$ in the Cahill–Glauber family [12] — and the value $1/\\pi\\hbar$ is saturated only by states for which $\\rho$ is mapped to $\\pm$ the displaced parity, i.e. coherent states (positive saturation) and odd Fock-like superpositions at the origin (negative saturation, $W(0,0)=-1/\\pi\\hbar$ for $|1\\rangle$). It is also the cleanest answer to \"how negative can a Wigner function get\": exactly as negative as it can be positive. Royer's formula is what makes \"negativity\" an *observable* — $\\hat\\Pi(\\alpha)$ is measured directly by photon-number parity after displacement [13, 14].\n\n### Star product and Moyal bracket\n\nThe composition law $\\widehat{a\\star b} = \\hat A\\hat B$ defines Groenewold's star product [6]:\n\n$$ (a\\star b)(q,p) \\;=\\; a(q,p)\\,\\exp\\!\\Big[\\tfrac{i\\hbar}{2}\\big(\\overleftarrow{\\partial}_{q}\\overrightarrow{\\partial}_{p}-\\overleftarrow{\\partial}_{p}\\overrightarrow{\\partial}_{q}\\big)\\Big]\\,b(q,p). $$\n\nExpanding the exponential generates an $\\hbar$-series whose zeroth term is the pointwise product and whose first antisymmetric term reproduces $\\{a,b\\}_{\\mathrm{PB}}$. The antisymmetrized star is the **Moyal bracket** [7],\n\n$$ \\{a,b\\}_{\\mathrm M} \\;=\\; \\frac{1}{i\\hbar}\\,(a\\star b - b\\star a) \\;=\\; \\{a,b\\}_{\\mathrm{PB}} + \\mathcal O(\\hbar^{2}), $$\n\nso the von Neumann equation becomes\n\n$$ \\partial_{t} W \\;=\\; \\{H,W\\}_{\\mathrm M} \\;=\\; \\{H,W\\}_{\\mathrm{PB}} + \\sum_{n\\ge 1} \\frac{(-1)^{n}}{(2n+1)!}\\Big(\\tfrac{\\hbar}{2}\\Big)^{2n}\\!\\sum_{k}\\binom{2n+1}{k} \\partial_{q}^{2n+1-k}\\partial_{p}^{k}H \\cdot \\partial_{q}^{k}\\partial_{p}^{2n+1-k}W. $$\n\nFor Hamiltonians at most quadratic in $(q,p)$ all higher terms vanish and the Moyal flow is *identical* to the classical Liouville flow: Gaussian states stay Gaussian, and a nonnegative $W$ stays nonnegative. Negativity, when it appears, is therefore strictly an artefact of (i) non-Gaussian initial states or (ii) non-quadratic Hamiltonians — and it cannot be produced by passive linear optics acting on coherent or thermal light. This already telegraphs why Mari–Eisert's simulation theorem [15] cleaves cleanly along the quadratic/Gaussian boundary. Credit-wise, the entire star/Moyal apparatus is Groenewold's thesis [6] with Moyal independent and concurrent [7]; the modern label \"Wigner–Moyal\" undercredits Groenewold systematically (see §1 and [8]).\n\n### Where negativity is forced — geometry of fringes and sub-Planck cells\n\nTake a coherent superposition $|\\psi\\rangle = \\mathcal N(|\\alpha\\rangle + |{-\\alpha}\\rangle)$ with $\\alpha\\in\\mathbb R$, $\\alpha\\gg 1$. Its Wigner function decomposes into two Gaussian \"lobes\" centered at $(\\pm\\sqrt{2\\hbar}\\,\\alpha,0)$ plus a cross term:\n\n$$ W_{\\mathrm{cat}}(q,p) \\;\\propto\\; e^{-(q-q_{0})^{2}/\\hbar - p^{2}/\\hbar} + e^{-(q+q_{0})^{2}/\\hbar - p^{2}/\\hbar} + 2\\,e^{-q^{2}/\\hbar - p^{2}/\\hbar}\\cos\\!\\Big(\\tfrac{2q_{0}\\,p}{\\hbar}\\Big). $$\n\nThe third term is the interference fringe. Its sign oscillates with momentum period $\\Delta p = \\pi\\hbar/q_{0}$; on either side of a fringe maximum sits a fringe minimum of equal amplitude. Because the *envelope* of the cross term has the coherent-state width $\\sqrt{\\hbar}$ in both $q$ and $p$, a single fringe occupies an area\n$$ \\Delta q \\cdot \\Delta p \\;\\sim\\; \\sqrt{\\hbar}\\cdot \\frac{\\pi\\hbar}{q_{0}} \\;=\\; \\frac{\\pi\\hbar^{3/2}}{q_{0}} \\;\\ll\\; \\hbar \\quad\\text{for }q_{0}\\gg \\sqrt{\\hbar}, $$\ni.e. **smaller than a Planck cell**. This is Zurek's \"sub-Planck structure\": negativity packs phase-space oscillations into regions tighter than the coherent-state uncertainty product, which is precisely the geometry that makes such states ultra-sensitive (and decoherence-fragile). Hudson's theorem [9] says the same thing from the other side — any non-Gaussian pure state must show such fringes somewhere — and Soto–Claverie [10] extend it to $N$ modes.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eSchematic Wigner function of a cat state with fringes between two coherent lobes\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"700\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"380\" y1=\"40\" x2=\"380\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"690\" y=\"358\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"end\"\u003eq\u003c/text\u003e\u003ctext x=\"392\" y=\"52\" fill=\"#e8e6e1\" font-size=\"15\"\u003ep\u003c/text\u003e\u003ccircle cx=\"200\" cy=\"200\" r=\"46\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.8\"/\u003e\u003ccircle cx=\"200\" cy=\"200\" r=\"30\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.8\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"200\" y=\"265\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003e|−α⟩ lobe (W \u0026gt; 0)\u003c/text\u003e\u003ccircle cx=\"560\" cy=\"200\" r=\"46\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.8\"/\u003e\u003ccircle cx=\"560\" cy=\"200\" r=\"30\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.8\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"560\" y=\"265\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003e|+α⟩ lobe (W \u0026gt; 0)\u003c/text\u003e\u003cg stroke-width=\"1.6\"\u003e\u003cline x1=\"320\" y1=\"120\" x2=\"440\" y2=\"120\" stroke=\"#ffb86b\"/\u003e\u003cline x1=\"320\" y1=\"140\" x2=\"440\" y2=\"140\" stroke=\"#ff7a90\"/\u003e\u003cline x1=\"320\" y1=\"160\" x2=\"440\" y2=\"160\" stroke=\"#ffb86b\"/\u003e\u003cline x1=\"320\" y1=\"180\" x2=\"440\" y2=\"180\" stroke=\"#ff7a90\"/\u003e\u003cline x1=\"320\" y1=\"200\" x2=\"440\" y2=\"200\" stroke=\"#ffb86b\"/\u003e\u003cline x1=\"320\" y1=\"220\" x2=\"440\" y2=\"220\" stroke=\"#ff7a90\"/\u003e\u003cline x1=\"320\" y1=\"240\" x2=\"440\" y2=\"240\" stroke=\"#ffb86b\"/\u003e\u003cline x1=\"320\" y1=\"260\" x2=\"440\" y2=\"260\" stroke=\"#ff7a90\"/\u003e\u003cline x1=\"320\" y1=\"280\" x2=\"440\" y2=\"280\" stroke=\"#ffb86b\"/\u003e\u003c/g\u003e\u003cellipse cx=\"380\" cy=\"200\" rx=\"70\" ry=\"100\" fill=\"none\" stroke=\"#e8e6e1\" stroke-dasharray=\"4 4\" stroke-width=\"1\"/\u003e\u003ctext x=\"380\" y=\"95\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eGaussian envelope, width √ℏ\u003c/text\u003e\u003cline x1=\"455\" y1=\"160\" x2=\"520\" y2=\"120\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"525\" y=\"118\" fill=\"#ffb86b\" font-size=\"14\"\u003eW \u0026gt; 0 fringe\u003c/text\u003e\u003cline x1=\"455\" y1=\"180\" x2=\"520\" y2=\"145\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003ctext x=\"525\" y=\"148\" fill=\"#ff7a90\" font-size=\"14\"\u003eW \u0026lt; 0 fringe\u003c/text\u003e\u003cline x1=\"380\" y1=\"305\" x2=\"380\" y2=\"335\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003cline x1=\"380\" y1=\"335\" x2=\"460\" y2=\"335\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"465\" y=\"339\" fill=\"#7ee0a3\" font-size=\"13\"\u003eΔp ≈ πℏ / q₀\u003c/text\u003e\u003cline x1=\"200\" y1=\"370\" x2=\"560\" y2=\"370\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003cline x1=\"200\" y1=\"365\" x2=\"200\" y2=\"375\" stroke=\"#7ee0a3\"/\u003e\u003cline x1=\"560\" y1=\"365\" x2=\"560\" y2=\"375\" stroke=\"#7ee0a3\"/\u003e\u003ctext x=\"380\" y=\"390\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003e2 q₀ — coherent-state separation\u003c/text\u003e\u003ctext x=\"60\" y=\"30\" fill=\"#e8e6e1\" font-size=\"13\"\u003e|W| ≤ 1/πℏ (Royer bound, saturated by lobes \u0026amp; central fringe)\u003c/text\u003e\u003c/svg\u003e\n*Figure: phase-space anatomy of $|\\alpha\\rangle+|-\\alpha\\rangle$. Two Gaussian lobes (blue) carry $W\u003e0$; between them sits a striped band of alternating positive (orange) and negative (pink) fringes with momentum period $\\pi\\hbar/q_{0}$ — sub-Planck in area though enveloped by a $\\sqrt{\\hbar}$-wide Gaussian. The Royer bound $|W|\\le 1/\\pi\\hbar$ is saturated by both the lobes and the central fringe, with opposite sign.*\n\n### Why the bracket and the bound matter together\n\nThe Royer bound and the Moyal flow conspire to make negativity *robust under unitary evolution but fragile under coarse-graining*. Quadratic Hamiltonians shuffle fringes around symplectically without ever erasing them; Gaussian convolution — equivalent to advancing $s$ from $0$ toward $-1$ in the Cahill–Glauber family [12], or to coupling to a thermal/vacuum bath — kills oscillations exponentially in their wavenumber, and the sub-Planck fringes go first. This is the formal reason the Husimi $Q$ is nonnegative for every state: it is the convolution of $W$ with a coherent-state Gaussian of width $\\sqrt{\\hbar/2}$, exactly the scale that washes out fringes whose envelope sits within $\\sqrt{\\hbar}$. Negativity, then, is not a pathology to be fixed by smoothing — it is the thing that smoothing destroys. The next section formalises this through the $s$-ordered family and the Hudson / Soto–Claverie theorem."}, {"id": "s-ordered-family-and-hudsons-theorem", "title": "The s-Ordered Family and Hudson's (Soto–Claverie) Theorem", "markdown": "## The s-Ordered Family and Hudson's (Soto–Claverie) Theorem\n\n### The one-parameter family\n\nThe Wigner function is not unique among phase-space representatives of $\\rho$; it is the symmetric (Weyl) member of a one-parameter family that Cahill and Glauber organized in 1969 [12]. Define the $s$-ordered displacement characteristic function\n\n$$\n\\chi(\\xi,s) \\;=\\; \\mathrm{Tr}\\!\\left[\\rho\\, D(\\xi)\\right]\\,\\exp\\!\\big(\\tfrac{1}{2} s\\, |\\xi|^{2}\\big),\\qquad D(\\xi)=\\exp(\\xi a^{\\dagger}-\\xi^{\\!*} a),\n$$\n\nand its complex Fourier transform\n\n$$\nW(\\alpha,s) \\;=\\; \\frac{1}{\\pi^{2}}\\!\\int d^{2}\\xi\\;\\chi(\\xi,s)\\,\\exp(\\alpha\\xi^{\\!*}-\\alpha^{\\!*}\\xi).\n$$\n\nThree values pick out the named distributions: $s=+1$ gives the Glauber–Sudarshan $P$-function (often distributional, the diagonal coherent-state expansion); $s=0$ gives the Wigner function $W$ (Weyl-symmetric ordering); $s=-1$ gives the Husimi $Q(\\alpha)=\\langle\\alpha|\\rho|\\alpha\\rangle/\\pi$ (anti-normal ordering). Operator products are reconstructed by integrating the $s$-symbol against the corresponding kernel; expectation values of $s$-ordered monomials become moments of $W(\\alpha,s)$. The choice of $s$ is therefore the choice of *operator ordering convention*, dressed as a choice of statistics.\n\nThe bridge between members of the family is a Gaussian convolution. For $s'\u003cs$,\n\n$$\nW(\\alpha,s') \\;=\\; \\frac{2}{\\pi(s-s')}\\!\\int d^{2}\\beta\\; W(\\beta,s)\\,\\exp\\!\\Big(\\!-\\!\\tfrac{2|\\alpha-\\beta|^{2}}{s-s'}\\Big).\n$$\n\nSetting $s=0$, $s'=-1$ yields the standard statement: $Q$ is $W$ smeared with a Gaussian of variance $1/2$ (in coherent-state units), i.e. the vacuum Wigner function. Because a convolution with a strictly positive kernel cannot produce negative values from a non-pathological input, $Q\\ge 0$ for every state — the Husimi function is **structurally** non-negative not because of any physical taming of \"quantumness\" but because we have band-limited away exactly the spatial scales smaller than $\\sqrt{\\hbar/2}$ on which the Wigner negativity oscillates. This is the precise sense in which Gaussian smoothing of width $(1-s)/2$ \"silently restores positivity\": once $1-s$ exceeds the support scale of the negative lobes — typically $\\mathcal{O}(\\hbar)$ on Fock states or cat states — the surviving distribution is, by construction, a probability density and tells the unwary observer nothing about the underlying non-classicality. Cahill and Glauber were explicit that the family is interpolating an *ordering*, not an *amount of classicality*; the literature has not always honoured that distinction (see §6).\n\n### Hudson's pure-state theorem\n\nFor pure states the question \"when is $W\\ge 0$?\" has a complete and surprisingly clean answer, due to Hudson [9]:\n\n\u003e **Theorem (Hudson 1974).** For a pure state $\\psi\\in L^{2}(\\mathbb{R})$, the Wigner function $W_{\\psi}(q,p)$ is non-negative on all of phase space if and only if $\\psi$ is a Gaussian, i.e. $\\psi(q)=\\exp(-\\tfrac{1}{2}aq^{2}+bq+c)$ with $\\mathrm{Re}\\,a\u003e0$.\n\n**Derivation sketch (Bochner / Paley–Wiener).** For a pure state, the Wigner function is the Weyl transform of the rank-one projector $|\\psi\\rangle\\langle\\psi|$, so its symplectic Fourier transform is the *ambiguity function*\n\n$$\nA_{\\psi}(\\xi,\\eta)\\;=\\;\\int dq\\;\\overline{\\psi(q-\\tfrac{\\eta}{2})}\\,\\psi(q+\\tfrac{\\eta}{2})\\,e^{-i\\xi q}.\n$$\n\nIf $W_{\\psi}\\ge 0$ everywhere, then — since $\\int W_{\\psi}=\\|\\psi\\|^{2}=1$ — it is a genuine probability density and its Fourier transform $A_{\\psi}$ is the characteristic function of a probability measure on $\\mathbb{R}^{2}$. By Bochner's theorem $A_{\\psi}$ is positive definite. But $A_{\\psi}(\\xi,\\eta)$ is, in $\\eta$, the Fourier transform of $\\overline{\\psi(q-\\eta/2)}\\psi(q+\\eta/2)$ for each fixed $q$, hence an entire function of exponential type in $(\\xi,\\eta)$ when $\\psi$ has compact support — and more generally, on the Paley–Wiener side, an entire function of order 2. A positive-definite entire function of order $\\le 2$ on $\\mathbb{R}^{2}$ is, by the Marcinkiewicz–Lévy theorem (a classical companion to Bochner), the characteristic function of a *Gaussian* measure. Inverting, $W_{\\psi}$ is Gaussian, hence $\\psi$ is Gaussian. The standard pedagogical reconstructions in Schleich [16] and Hillery–O'Connell–Scully–Wigner [5] are variants of this Bochner / entire-function argument.\n\nTwo corollaries deserve emphasis. *First*, Hudson's theorem already determines that the only pure states reachable from vacuum by Gaussian unitaries — displacements, single-mode squeezers, phase rotations — have $W\\ge 0$; equivalently, the only pure CV states with classical-looking phase space are those generated by the symplectic group on the vacuum. *Second*, the theorem says nothing about mixed states: as in the conflation list, mixtures of Gaussians give $W\\ge 0$ but are not the only $W\\ge 0$ mixed states, and they include manifestly non-classical objects such as photon-number-stabilized thermal squeezed states. Hudson's theorem is a knife-edge result that mixed-state intuition routinely over-extends.\n\n### Soto–Claverie: the multimode statement actually cited\n\nThe result invoked in modern continuous-variable optics — that a pure $N$-mode state has $W\\ge 0$ on $\\mathbb{R}^{2N}$ iff it is a (possibly squeezed, displaced) multimode Gaussian — is **not** in Hudson 1974. It was proved nine years later by F. Soto and P. Claverie [10], who extended the Bochner/entire-function machinery to $\\mathbb{R}^{2N}$ and dealt with the cross-mode quadratic forms. Their statement:\n\n\u003e **Theorem (Soto–Claverie 1983).** A pure state $\\psi\\in L^{2}(\\mathbb{R}^{N})$ has $W_{\\psi}\\ge 0$ on $\\mathbb{R}^{2N}$ iff $\\psi(\\mathbf{q})=\\exp(-\\tfrac{1}{2}\\mathbf{q}^{T}\\!A\\,\\mathbf{q}+\\mathbf{b}^{T}\\!\\mathbf{q}+c)$ with $A$ a complex symmetric matrix of positive-definite real part.\n\nMultimode reviews and the resource-theoretic papers [15, 17] depend on this statement; references that read \"by Hudson's theorem\" in the $N$-mode context are, with rare exceptions, citing Soto–Claverie under Hudson's name. The credit audit is unambiguous on this point — the theorem deserves both names.\n\n### Royer's parity identity\n\nThe third pillar of this section is operational. Royer showed in 1977 that the Wigner function is, *pointwise*, the expectation value of a displaced parity [11]:\n\n$$\nW(\\alpha)\\;=\\;\\frac{2}{\\pi}\\,\\mathrm{Tr}\\!\\left[\\rho\\, D(\\alpha)\\,\\Pi\\, D^{\\dagger}(\\alpha)\\right],\\qquad \\Pi=(-1)^{a^{\\dagger}a}=e^{i\\pi a^{\\dagger}a}.\n$$\n\nThe derivation is one line once the Weyl symbol of the parity operator is computed: $\\Pi$ has Wigner symbol $\\tfrac{\\pi}{2}\\delta^{(2)}(\\alpha)$, so the trace $\\mathrm{Tr}[\\rho\\Pi]=\\tfrac{2}{\\pi}W(0)$, and translation covariance under $D(\\alpha)$ extends this to every phase-space point. The identity has three operational consequences. (i) $W$ is *bounded*: $|W(\\alpha)|\\le 2/\\pi$, since $\\Pi$ has spectrum $\\{\\pm 1\\}$ — a bound the literature still sometimes misquotes. (ii) The negative lobes of $W$ are physically the regions where the displaced state has an **excess of odd photon number** over even, an observable parity excess. (iii) The expression makes direct, un-smoothed Wigner reconstruction possible: displace by $-\\alpha$ and measure photon-number parity. This is the route taken by Banaszek–Wódkiewicz [13] for travelling fields and by Haroche's cavity-QED group [14] for intracavity states, where parity is read off the dispersive phase shift on a Rydberg atom traversing the cavity. The standard textbook attribution to Banaszek–Wódkiewicz alone, without Royer (and Grossmann, independently in 1976), is one of the cleaner cases of erased priority in the field.\n\nRoyer's identity also clarifies why every \"direct\" Wigner measurement is a measurement of a **bounded, signed, but otherwise ordinary** observable: there is no metaphysics of negative probability at the detector — only the expectation of a Hermitian operator that happens to take both signs. Whether the negative *values* of $W$ are then a *resource* in any operational sense is the question that §7 takes up."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From Smithey to Cavity QED to Mechanical Cats", "markdown": "## Landmark Experiments: From Smithey to Cavity QED to Mechanical Cats\n\nFor its first sixty years the Wigner function was an object only theorists looked at. Two distinct experimental philosophies broke that silence in the 1990s and they are not interchangeable. The first reconstructs $W(q,p)$ tomographically from quadrature histograms — a noisy inverse problem that lets detection inefficiency masquerade as Gaussian smoothing. The second samples $W$ pointwise via Royer's parity identity [11], turning the question into an interferometric measurement whose contrast is degraded by inefficiency but whose location and depth of negativity are not blurred away. Which philosophy was used decides, in every experiment below, whether the reported \"dip\" is a true property of the state or an artifact rescued by post-processing.\n\n### 4.1 Smithey–Beck–Raymer–Faridani 1993: the inverse-Radon era\n\nThe first Wigner reconstruction of a quantum-optical state was performed on the squeezed vacuum and vacuum from a degenerate optical parametric amplifier [18]. Balanced homodyne detection at $\\sim 85\\%$ photodiode quantum efficiency yielded phase-binned quadrature histograms $p_\\theta(x)$; the Wigner function was recovered by inverting the Radon transform\n\n$$ p_\\theta(x) \\;=\\; \\int W(x\\cos\\theta - p\\sin\\theta,\\; x\\sin\\theta + p\\cos\\theta)\\,dp.$$\n\nNo negativity was observed and none should have been: a squeezed vacuum is Gaussian and so $W \\ge 0$ by Hudson's theorem [9]. The contribution was methodological — the demonstration that $W$ is operationally accessible from marginals — not a witness of non-classicality. It is a common misreading to credit the 1993 paper with the first observation of Wigner negativity; it observed the first Wigner *function*. The same year Vogel and Risken's pattern-function inversion [\\[Vogel–Risken PRA 40, 2847 (1989)\\]](https://journals.aps.org/pra/abstract/10.1103/PhysRevA.40.2847) (verify) made the analysis tractable.\n\n### 4.2 Royer's parity and the cavity-QED ladder\n\nRoyer's 1977 identity [11]\n\n$$ W(\\alpha) \\;=\\; \\frac{2}{\\pi}\\,\\mathrm{Tr}\\!\\bigl[D(\\alpha)\\,\\rho\\,D^\\dagger(\\alpha)\\,\\Pi\\bigr], \\qquad \\Pi \\equiv (-1)^{\\hat n},$$\n\nreduces the measurement of $W$ at a single phase-space point to the measurement of a displaced photon-number parity. Banaszek and Wódkiewicz [13] proposed implementing this by counting photons after a beamsplitter displacement; Lutterbach and Davidovich (PRL 78, 2547, 1997) [(link)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.78.2547) showed that in cavity QED the parity is read out by Ramsey interferometry on a dispersively coupled atom — the field is never demolished, the signal is an atomic population, and detector inefficiency suppresses the contrast but does not convolve $W$ with anything. This robustness, more than the conceptual elegance, is what made the ENS Haroche-group program possible [14].\n\nBertet, Auffèves *et al.* PRL 89, 200402 (2002) [(link)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.89.200402) executed the Lutterbach–Davidovich recipe on a one-photon Fock state in a high-$Q$ microwave cavity. The theoretical value $W_{|1\\rangle}(0) = -2/\\pi$ was reduced by experimental imperfections (atomic-velocity dispersion, cavity damping during the $300\\,\\mu\\mathrm{s}$ interrogation) to an observed central value near $-0.32$ in normalised units, but the dip survived *without* loss correction.\n\nDeléglise *et al.* Nature 455, 510 (2008) [(link)](https://www.nature.com/articles/nature07288) extended this to even and odd Schrödinger cat states $|\\alpha\\rangle \\pm |\\!-\\!\\alpha\\rangle$ with $|\\alpha|^2$ up to $\\sim 3.5$ photons, scanning $W$ on a full phase-space grid. Snapshots taken at successive cavity-damping times traced the interference fringes washing out at the predicted rate $\\propto |\\alpha|^2 \\kappa$, providing a direct picture of the quantum-to-classical transition. Negativities of order $-2/\\pi$ appeared in the raw data; the role of post-processing was only to extract a density matrix, not to recover negativity from a smoothed image.\n\n### 4.3 Lvovsky 2001: the optical Fock state at the 50% threshold\n\nLvovsky, Hansen, Aichele, Benson, Mlynek, Schiller PRL 87, 050402 (2001) [(link)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.87.050402) performed homodyne tomography on a heralded single photon from SPDC, total detection efficiency $\\eta \\approx 0.55$. The reconstructed $W(0,0)$ was negative on raw data, with a value near $-0.13/\\pi$ — small but statistically resolved.\n\nThe number is not arbitrary. Finite efficiency $\\eta$ at homodyne detection is equivalent to mixing the signal with vacuum at a beamsplitter of transmissivity $\\eta$, which convolves the true Wigner function with a Gaussian of variance $(1-\\eta)/2\\eta$. For the single-photon state $W_{|1\\rangle}(0) = -2/\\pi$ this gives\n\n$$ W_\\eta(0,0) \\;=\\; -\\frac{2}{\\pi}\\,(2\\eta - 1),$$\n\nso $W_\\eta(0,0) \u003c 0$ iff $\\eta \u003e 1/2$. Lvovsky's $\\eta = 0.55$ sat $5\\%$ above the threshold and predicted $W_\\eta(0,0) \\approx -0.10/\\pi$, matching observation. This is the experiment that turned the $\\eta = 0.5$ inequality from a textbook statement into a publishable claim, and it is the warning the negativity literature has internalised: *report $\\eta$ or you have not measured negativity*.\n\n### 4.4 Superconducting cavities: Hofheinz–Martinis 2009\n\nHofheinz *et al.* Nature 459, 546 (2009) [(link)](https://www.nature.com/articles/nature08005) synthesised arbitrary superpositions of Fock states up to $|6\\rangle$ in a coplanar-waveguide resonator coupled to a phase qubit, and measured the full Wigner function via qubit-mediated dispersive parity — the circuit-QED descendant of Lutterbach–Davidovich. Negativities were resolved on every non-Gaussian state and no inefficiency deconvolution was needed: the parity readout extracts $\\langle \\Pi \\rangle$ as the contrast of a Ramsey-like signal on the qubit, and qubit-readout error reduces SNR rather than blurring the phase-space image. Subsequent circuit-QED work (Vlastakis 2013, Sun 2014) extended the technique to cats of $\\sim 100$ photons.\n\n### 4.5 Mechanical Wigner negativity: 2018 onward\n\nTwo simultaneous Nature papers in 2018 brought parity-based Wigner imaging to phonons. Chu *et al.* Nature 563, 666 (2018) [(link)](https://www.nature.com/articles/s41586-018-0717-7) prepared multi-phonon Fock states in a bulk acoustic-wave resonator coupled to a transmon; Satzinger *et al.* Nature 563, 661 (2018) generated a single-phonon state in a surface-acoustic-wave resonator coupled to a transmon. In both cases the Wigner function was reconstructed via the same dispersive-parity protocol used for microwave photons; in both cases negativity appeared in the raw data, requiring no efficiency correction. Independent of the dispersive route, Brown *et al.* arXiv:2203.03053 [19] reconstructed the motional Wigner function of a single neutral atom in an optical tweezer by time-of-flight expansion — a return, on a single-particle mechanical mode, to the quadrature-tomography philosophy of Smithey, with single-atom imaging replacing balanced photodetection.\n\nA scoreboard of the lineage:\n\n| Experiment | State | Method | $\\eta$ regime | Negativity in raw data? |\n|---|---|---|---|---|\n| Smithey 1993 [18] | squeezed vacuum | inverse Radon | $\\sim 0.85$ | n/a (Gaussian) |\n| Lvovsky 2001 | $\\mid 1\\rangle$ optical | inverse Radon | $0.55$ | yes, marginal |\n| Bertet 2002 | $\\mid 1\\rangle$ microwave | disp. parity (Rydberg) | cavity-limited | yes |\n| Deléglise 2008 | cats $\\mid\\alpha\\rangle\\pm\\mid\\!-\\!\\alpha\\rangle$ | disp. parity (Rydberg) | cavity-limited | yes |\n| Hofheinz 2009 | Fock $\\mid n\\rangle$ to $\\mid 6\\rangle$ | disp. parity (qubit) | qubit-limited | yes |\n| Chu / Satzinger 2018 | phonon Fock | disp. parity (transmon) | qubit-limited | yes |\n| Brown 2022 [19] | atomic motion | time-of-flight | imaging-limited | yes |\n\nThe pattern is unambiguous: every experiment that produced negativity in *raw* data used a parity-based pointwise sampling; every experiment that needed loss correction or deconvolution used quadrature tomography. The instrumental moral — explored further in §5 — is that the choice of detection scheme is not a matter of taste. It selects which of two distinct mathematical objects you are reconstructing, and for the inverse-Radon route the negativity you publish is the negativity your detector left intact."}, {"id": "use-and-abuse", "title": "Use, Abuse, and the Detector That Eats Negativity", "markdown": "## Use, Abuse, and the Detector That Eats Negativity\n\nFour habits dominate the modern use of Wigner negativity, and three of them are wrong. The pattern is the same in each case: a clean theorem proved under tight hypotheses gets quoted as a slogan, the hypotheses get dropped in transit, and a measurement artifact gets re-labelled as physics. This section names the four habits and writes down the operational statement that should replace the slogan.\n\n### Abuse 1 — Hudson applied to mixed states\n\nHudson's 1974 theorem [9], extended to many modes by Soto and Claverie [10], is unambiguous: for a **pure** state $\\rho=|\\psi\\rangle\\langle\\psi|$, $W_\\psi\\ge 0$ everywhere on phase space iff $|\\psi\\rangle$ is a Gaussian wavepacket — equivalently a squeezed-displaced vacuum. Nothing in the proof survives convex combinations. The map $\\rho\\mapsto W_\\rho$ is linear, so\n\n$$ W_{\\sum_k p_k \\rho_k}(q,p)\\;=\\;\\sum_k p_k\\, W_{\\rho_k}(q,p),$$\n\nand an incoherent mixture of two Gaussians displaced far apart is manifestly $W\\ge 0$ while being arbitrarily far from any single Gaussian. The textbook habit of writing \"$W\\ge 0\\Leftrightarrow$ classical\" without the word *pure* is just wrong, and the error matters because almost every laboratory state is mixed.\n\nTwo clean counterexamples expose how badly the slogan fails.\n\n**(a) Two-mode squeezed thermal states.** Take the TMST $\\rho_{AB}$ — a two-mode squeezed vacuum that has been passed through symmetric thermal channels of mean occupation $\\bar n$. Its Wigner function is a centred Gaussian with covariance matrix\n\n$$ \\sigma \\;=\\; \\begin{pmatrix} \\nu\\,\\mathbb{1} \u0026 c\\,Z \\\\ c\\,Z \u0026 \\nu\\,\\mathbb{1} \\end{pmatrix},\\qquad Z=\\mathrm{diag}(1,-1),$$\n\nwith $\\nu = (2\\bar n+1)\\cosh(2r)/?$… in any case $W\\ge 0$ throughout, because *every* Gaussian state has $W\\ge 0$. The state is nevertheless entangled whenever the partial-transpose criterion fails, which it does for $r$ above a threshold set by $\\bar n$. Here is a state with positive Wigner function, non-trivial entanglement, and no classical $P$-representation in the Glauber–Sudarshan sense. Negativity has missed all of the non-classicality on offer.\n\n**(b) Photon-subtracted thermal states.** Apply $\\hat a$ to a thermal state $\\rho_{\\rm th}(\\bar n)$ and renormalise. The resulting state is non-Gaussian, has $W$ that dips below zero near the origin for any $\\bar n\u003c\\infty$, and yet — as $\\bar n\\to\\infty$ — its operational distance from a classical mixture vanishes in any reasonable metric. The negativity is real but small and decoration; the state's \"non-classicality budget\" lives almost entirely in higher-order moments that negativity does not see. The same Wigner-negativity number can therefore describe a single-photon Fock state (operationally exquisite) and a near-thermal photon-subtracted mixture (operationally banal).\n\nThe honest summary: for **mixed** states, $W$-negativity is **sufficient** for the strict non-classicality usually meant (no positive $P$-representation, not a mixture of coherent states) but **not necessary** for non-classicality in any wider sense — entanglement, non-Gaussianity, or contextuality. Kenfack–Życzkowski's volume $\\mathcal N(\\rho)=\\tfrac12\\!\\int(\\,|W|-W\\,)\\,d^2\\alpha$ [20] is a useful scalar but it is a witness, not a measure.\n\n### Abuse 2 — Negativity, non-Gaussianity, nonclassicality, and contextuality conflated\n\nThese four are equivalent only on the Hudson locus — pure single-mode states. Off it, they peel apart in every direction. Gaussian-mixed thermal states are non-classical (no $P\\ge 0$) yet have $W\\ge 0$ and zero non-Gaussianity. Convex mixtures of coherent states displaced on a non-Gaussian distribution are non-Gaussian yet have $W\\ge 0$. Photon-subtracted Gaussians are non-Gaussian and $W$-negative but contextually trivial in the operational sense of Spekkens. And in the discrete (qudit) Wigner setting, contextuality is a strictly stronger resource than negativity in odd dimensions and the equivalence holds only under tight operational restrictions — magic-state injection with stabiliser operations [21, 22], or specific CV settings [23]. Four words, four resources, four theorems; the literature treats them as synonyms.\n\n### Abuse 3 — The detector that eats negativity\n\nThis is the hardest one, because it dresses an artifact as a result. Model a finite-efficiency photodetector as a beamsplitter of transmission $\\eta$ followed by a unit-efficiency ideal detector, with vacuum entering the unused port. The Wigner function of the mode actually being measured is the Wigner function of the input convolved with the vacuum Wigner of the lost mode:\n\n$$ W_{\\rm meas}(\\alpha)\\;=\\;\\frac{2}{\\pi(1-\\eta)}\\!\\int d^2\\beta\\; \\exp\\!\\Big[\\!-\\tfrac{2|\\alpha-\\sqrt{\\eta}\\,\\beta|^2}{1-\\eta}\\Big]\\,W_{\\rm in}(\\beta).$$\n\nThis is Gaussian smoothing on a scale $\\sigma_\\eta^2=(1-\\eta)/2\\eta$. It interpolates between $W$ ($\\eta=1$) and the Husimi $Q$ ($\\eta\\to 0$): exactly the $s$-ordered family of Cahill–Glauber [12] re-read as a physical loss channel. The single-photon Fock state, whose ideal Wigner reaches $W(0,0)=-2/\\pi$, has its central dip filled in for $\\eta\u003c1/2$ — the same threshold that appears in the Hudson-type analysis of when a smoothed $W$ first becomes everywhere non-negative.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDetector efficiency erases negativity\u003c/title\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"680\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"370\" y1=\"60\" x2=\"370\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"690\" y=\"324\" fill=\"#e8e6e1\" font-size=\"14\"\u003eq\u003c/text\u003e\u003ctext x=\"376\" y=\"58\" fill=\"#e8e6e1\" font-size=\"14\"\u003eW(q,0)\u003c/text\u003e\u003ctext x=\"60\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\"\u003eSingle-photon Wigner cut, smoothed by loss σ²=(1−η)/2η\u003c/text\u003e\u003cpath d=\"M 80 320 Q 200 320 280 250 T 370 100 T 460 250 Q 540 320 660 320\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 80 320 Q 200 320 280 285 T 370 180 T 460 285 Q 540 320 660 320\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 80 320 Q 200 320 280 308 T 370 270 T 460 308 Q 540 320 660 320\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 80 320 Q 200 320 280 318 T 370 312 T 460 318 Q 540 320 660 320\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"180\" x2=\"680\" y2=\"180\" stroke=\"#e8e6e1\" stroke-width=\"0.6\" stroke-dasharray=\"3 4\"/\u003e\u003ctext x=\"64\" y=\"176\" fill=\"#e8e6e1\" font-size=\"13\"\u003eW=0 axis\u003c/text\u003e\u003ctext x=\"120\" y=\"100\" fill=\"#7aa2ff\" font-size=\"14\"\u003eη = 1.0 (ideal): W(0)=−2/π\u003c/text\u003e\u003ctext x=\"120\" y=\"200\" fill=\"#ffb86b\" font-size=\"14\"\u003eη = 0.7: dip survives, attenuated\u003c/text\u003e\u003ctext x=\"120\" y=\"270\" fill=\"#7ee0a3\" font-size=\"14\"\u003eη = 0.5: dip just touches zero\u003c/text\u003e\u003ctext x=\"120\" y=\"345\" fill=\"#ff7a90\" font-size=\"14\"\u003eη = 0.3: no negativity — Gaussian remnant only\u003c/text\u003e\u003ctext x=\"380\" y=\"380\" fill=\"#e8e6e1\" font-size=\"13\"\u003eHudson-like threshold η* ≈ 1/2 for n=1; loss acts as a beamsplitter with vacuum\u003c/text\u003e\u003c/svg\u003e\n*Figure: Finite detection efficiency η implements Gaussian smoothing of the input Wigner function on a scale σ²=(1−η)/2η. For the single-photon Fock state the central dip is preserved only for η above ≈ 1/2; below that the measured W is everywhere non-negative even though the input state's negativity is intact. Any reported W(0) without a deconvolution of the detection POVM is reporting the detector, not the field.*\n\nThe consequence is brutal. A reconstructed $W(0,0)\u003c0$ measured with $\\eta=0.6$ does **not** imply that the same source measured with $\\eta=0.4$ would still show negativity; it would not. Conversely, the absence of a dip at $\\eta=0.4$ does not falsify the source. The proper observable is not $W_{\\rm meas}$ but the deconvolved input $W_{\\rm in}$, with the detection POVM treated as part of the inverse problem. Direct displaced-parity measurements à la Royer [11] and Banaszek–Wódkiewicz [13] inherit the same convolution through the parity operator's photon-counting decomposition — the parity expectation value at $\\eta\u003c1$ is the expectation of a Gaussian-smeared parity, which lifts the spectrum off $\\{-1,+1\\}$ and shrinks the achievable extremum of $W_{\\rm meas}$ below $2/\\pi$.\n\n### Abuse 4 — Reconstruction artifacts mistaken for physics\n\nInverse-Radon tomography of the kind pioneered by Smithey *et al.* [18] is unbiased but has unbounded variance in the limit of fine binning. Filtered back-projection or maximum-likelihood pattern-function reconstructions therefore produce a $W$ with sample-driven fluctuations whose excursions below zero scale as $1/\\sqrt{N}$ in shot number and **diverge** as the binning is refined. A single dip in a reconstructed Wigner without (a) a quantitative confidence interval on $W(0,0)$, (b) an explicit forward model of the detection POVM, and (c) a check that the negative volume exceeds what one would obtain from reconstructing the smoothed measurement of a known classical state at matched statistics, is not evidence of non-classicality.\n\n### The proper operational statement\n\nWhat should replace \"negative Wigner equals quantum\" is the following, which is what the theorems actually say.\n\n\u003e Let $\\rho$ be the state of a single bosonic mode and let $\\Lambda_\\eta$ denote the lossy channel of transmission $\\eta$ implemented by the detection chain. Define $W_\\rho^{(\\eta)}=W_{\\Lambda_\\eta\\rho}$, equivalently the $s$-ordered quasi-distribution of $\\rho$ with $s=2\\eta-1$ [12]. Then: (i) $W_\\rho^{(1)}\u003c0$ at some point is **sufficient** to certify that $\\rho$ has no Glauber–Sudarshan $P$-representation, and for **pure** $\\rho$ this is equivalent to $\\rho$ being non-Gaussian [9, 10]; (ii) for **mixed** $\\rho$, $W_\\rho^{(1)}\\ge 0$ is consistent with non-classicality, non-Gaussianity, and entanglement [24]; (iii) any experimental claim of negativity must report $\\eta$, the deconvolved $W_\\rho^{(1)}(0,0)$ with its full uncertainty, and the value of $s^*$ at which the smoothed distribution first becomes everywhere non-negative — call this the **negativity-loss budget** of the source.\n\nNegativity is real, witnessable, and resourceful. It is also fragile, regime-dependent, and detector-coupled. The literature's casual conflation of \"$W\u003c0$\" with \"quantum\" is the price paid for sixty years of treating Hudson's theorem as a slogan rather than a hypothesis-laden theorem about pure states observed with perfect detectors. The next section turns to the four conceptual conflations that survive even this operational cleanup."}, {"id": "conflations", "title": "Four Conflations the Literature Lives With", "markdown": "## Four Conflations the Literature Lives With\n\nThe literature on Wigner negativity carries four distinct concepts under three or four names, used almost interchangeably. The damage is not just rhetorical: theorems whose proofs require one notion get invoked to license claims about another, and \"necessary\" silently upgrades to \"necessary and sufficient\" between paragraphs. The four objects are\n\n- **N**: Wigner-negativity — the statement $\\inf_{q,p} W(q,p) \u003c 0$, equivalently a non-vanishing Kenfack–Życzkowski volume $\\nu = \\tfrac{1}{2}\\!\\int(|W|-W)\\,dq\\,dp \u003e 0$ [20].\n- **G**: non-Gaussianity — $\\rho$ is not a Gaussian state, i.e. its characteristic function is not the exponential of a quadratic.\n- **C**: nonclassicality in the Glauber–Sudarshan sense — the $P$-function fails to be a bona fide probability density (it is negative, or more singular than a delta).\n- **X**: contextuality of an operational theory built on $\\rho$ together with a fixed set of measurements, in the Spekkens / Kochen–Specker sense.\n\nPairwise, none of these implications run both ways for mixed states; for pure single-mode states three of them collapse onto one, which is the source of the confusion.\n\n### N vs. G: Hudson is a pure-state theorem\n\nHudson [9] (multimode: Soto–Claverie [10]) proves $W_\\psi \\ge 0 \\Leftrightarrow \\psi$ Gaussian. Read as a biconditional this looks like \"$\\mathbf{N}\\Leftrightarrow \\mathbf{G}$\"; it is not. The theorem fails in both directions for mixed states.\n\n*Direction $\\mathbf{G}\\Rightarrow \\mathbf{N}$ fails.* Take any non-Gaussian pure state $|\\psi\\rangle$ with $W_\\psi$ taking negative values — a Fock state, a Schrödinger cat — and convolve it with a Gaussian of variance $\\sigma^2 \\ge 1/2$. The convolution is the partial trace over an ancillary thermal bath of mean photon number $\\bar n = \\sigma^2 - 1/2$, and the resulting mixed state\n$$\\rho = \\int \\!\\frac{d^2\\beta}{\\pi\\sigma^2}\\, e^{-|\\beta|^2/\\sigma^2}\\, D(\\beta)\\,|\\psi\\rangle\\langle\\psi|\\,D^\\dagger(\\beta)$$\nhas $W_\\rho \\ge 0$ everywhere, while remaining manifestly non-Gaussian (its Wigner function is the convolution of a Hermite-polynomial structure with a Gaussian — non-Gaussian but nonnegative). This is the same \"Gaussian smoothing kills negativity\" mechanism that the Cahill–Glauber $s$-ordered family encodes [12]: at $s=-1$ one recovers the Husimi $Q$, nonnegative for every state regardless of how exotic.\n\n*Direction $\\mathbf{N}\\Rightarrow \\mathbf{G}$ holds trivially* — Gaussian states have Gaussian Wigner functions which are positive — but only because every Gaussian state has $W\\ge 0$. The interesting point is that the converse $\\mathbf{G}\\not\\Rightarrow \\mathbf{N}$ leaves a large class of operationally non-Gaussian mixed states wholly invisible to a negativity test. Photon-subtracted thermal states with sufficient thermal noise sit in exactly this hole, as do the convex hulls of cats studied as toy non-Gaussian resources [17].\n\n### C vs. N: Glauber–Sudarshan classical states need not have $W \\ge 0$, and vice versa\n\nThe Glauber $P$-representation writes $\\rho = \\int P(\\alpha)|\\alpha\\rangle\\langle\\alpha|\\,d^2\\alpha$ with $|\\alpha\\rangle$ coherent. A state is called \"classical\" when $P$ is a genuine probability density. The relation to $W$ is a Gaussian smoothing:\n$$W(\\alpha) = \\frac{2}{\\pi}\\int d^2\\beta\\, P(\\beta)\\,e^{-2|\\alpha-\\beta|^2}.$$\n\nThermal squeezed states with low enough squeezing are non-classical in the $P$-sense ($P$ is more singular than a delta or negative as a tempered distribution), yet they are Gaussian and so $W\\ge 0$ — so $\\mathbf{C}\\not\\Rightarrow \\mathbf{N}$. A coherent-state mixture with a *very broad* classical Gaussian noise on $\\alpha$ is $P\\ge 0$ (classical) and $W\\ge 0$ — both criteria agree as they should. But consider a photon-subtracted thermal state $\\hat a\\,\\rho_{\\rm th}(\\bar n)\\,\\hat a^\\dagger / \\mathrm{Tr}(\\cdots)$: for moderate $\\bar n$ it has $W(0,0)\u003c0$ while its $P$ — recovered by anti-normally ordered inverse — is non-classical in the strict sense (not a probability density). In the limit of large thermal noise, however, the negativity is washed out by the Gaussian convolution while the state remains non-classical by $P$-criteria. So $\\mathbf{N}$ and $\\mathbf{C}$ are independent witnesses, each blind to a regime where the other fires. The textbook claim that \"negative Wigner ⇒ non-classical\" is the *only* direction that holds, and it is just the contrapositive of \"every classical state has $W \\ge 0$\", which follows from $W$ being a Gaussian-smoothed $P$.\n\nA useful one-line ordering: $\\mathbf{C} \\supsetneq \\mathbf{N}$ for *single-mode states with regular $P$*, $\\mathbf{C} \\not\\sim \\mathbf{N}$ once distributional $P$ is allowed. Schleich's textbook [16] lays out the ordering cleanly; many experimental papers do not.\n\n### N vs. X: discrete Wigner functions and Spekkens contextuality\n\nGross built a discrete Wigner function $W_d$ on $(\\mathbb{Z}_d)^{2n}$ for odd-prime $d$, with marginals on every \"line\" of the discrete phase space equal to the Born-rule probabilities for stabilizer measurements. Stabilizer states have $W_d \\ge 0$; the Clifford group acts as symplectic permutations of phase space. In this discrete setting the parallel to Mari–Eisert / Veitch et al. [15, 25] runs cleanly: $W_d \\ge 0$ together with Clifford operations and stabilizer measurements admits efficient classical simulation, so $\\mathbf{N}_d$ is *necessary* for magic-state quantum advantage. Howard, Wallman, Veitch and Emerson then sharpened this to an equivalence with *contextuality* — the resource that the GHZ / Mermin no-go statements isolate — *under the stabilizer-measurement subtheory*: $\\mathbf{N}_d \\Leftrightarrow \\mathbf{X}$ in the odd-$d$ stabilizer setting.\n\nThe equivalence is fragile. It breaks for $d=2$ (qubits), where rebit subtheories restore it only after restricting to real-valued density matrices and a CSS-like measurement set [21, 22]. For continuous variables, Haferkamp and Bermejo-Vega [23] establish an analogous equivalence between Wigner negativity and contextuality, but again only after fixing an operational scenario — Gaussian measurements with finite-precision binning. Outside these restricted operational regimes, $\\mathbf{N}$ and $\\mathbf{X}$ part company. Contextuality demands a *coherent assignment problem* across a non-commutative measurement context; negativity is a *representational* property of one quasi-distribution. A state can be contextual under one measurement set and not another, while $W_\\rho$ is an invariant of $\\rho$.\n\nThe slogan \"negativity is contextuality\" is therefore a theorem about a triple $(\\rho, \\mathcal{M}, \\mathcal{O})$ — state, measurements, operations — not about $\\rho$ alone. Treating $\\mathbf{N}$ as a stand-in for $\\mathbf{X}$ outside that triple smuggles in operational assumptions that few experimental papers state.\n\n### G vs. C, and the four-way diagram\n\nClosing the square: $\\mathbf{G}$ and $\\mathbf{C}$ are also distinct. The thermal state $\\rho_{\\rm th}(\\bar n)$ is Gaussian and classical ($P$ a positive Gaussian); a coherent state is Gaussian and on the boundary of classicality ($P$ a delta); a squeezed vacuum is Gaussian and non-classical ($P$ a tempered distribution that fails positivity). A Fock state is non-Gaussian, non-classical *and* Wigner-negative — the only regime in which the four notions agree.\n\nA minimal map for mixed states:\n\n| Witness | Pure state criterion | Mixed-state status | Resource theorem |\n|---|---|---|---|\n| $\\mathbf{C}$ ($P\\not\\ge 0$) | $\\psi \\ne$ coherent | Strongest; many flavors of singularity | Photodetection nonclassicality |\n| $\\mathbf{G}$ (non-Gaussian) | $\\psi$ not Gaussian | Convex set of Gaussians as free [17] | Resource theory of non-Gaussianity |\n| $\\mathbf{N}$ ($W\u003c0$ somewhere) | $\\equiv \\mathbf{G}$ by Hudson [9, 10] | Strictly weaker than $\\mathbf{C}$ and $\\mathbf{G}$ | Necessary for CV computational advantage [15] |\n| $\\mathbf{X}$ (contextual) | depends on $(\\mathcal{M},\\mathcal{O})$ | $\\Leftrightarrow \\mathbf{N}_d$ only in restricted scenarios [21, 22, 23] | Magic / qudit advantage [25] |\n\nThe single most consequential misuse is the slide from \"$\\mathbf{N}$ necessary $\\Rightarrow$ $\\mathbf{N}$ sufficient\" for quantum advantage, addressed in §7. The second is using $\\mathbf{N}$ as a nonclassicality test for mixed states where $\\mathbf{C}$ is the correct object. The third is invoking $\\mathbf{N}_d \\Leftrightarrow \\mathbf{X}$ without naming the measurement set. Each of these conflations has a clean counterexample within the formalism of §3 — and each of them appears in print every month."}, {"id": "negativity-as-resource", "title": "Negativity as Resource: Mari–Eisert, Veitch, and the Necessity-Not-Sufficiency Trap", "markdown": "## Negativity as Resource: Mari–Eisert, Veitch, and the Necessity-Not-Sufficiency Trap\n\nTwo papers in the same year — Mari–Eisert in continuous variables [15] and Veitch–Ferrie–Gross–Emerson in odd-prime dimensions [25] — promoted Wigner negativity from a curiosity into a candidate resource for quantum computational advantage. They are both routinely paraphrased as \"negativity is the resource for quantum computing.\" Both proved something narrower and harder: negativity is *necessary* for advantage under a specific free-operation class, and the converse is genuinely false. The logical content is one implication, not two, and the noise behaviour shows why the missing direction is not a technicality.\n\n### What Mari–Eisert actually prove\n\nMari and Eisert work in a multimode bosonic Hilbert space and fix three hypotheses simultaneously [15]:\n\n(i) the input state $\\rho$ has a non-negative Wigner function, $W_\\rho(\\mathbf{x},\\mathbf{p}) \\ge 0$;\n(ii) the evolution is a Gaussian unitary $U_G$ — generated by Hamiltonians at most quadratic in $\\hat q_i,\\hat p_i$ — acting linearly on phase-space coordinates via a symplectic matrix $S\\in \\mathrm{Sp}(2N,\\mathbb{R})$;\n(iii) the measurement is described by a POVM whose elements have non-negative Wigner symbols (homodyne, heterodyne, Gaussian-filtered photon counting, but *not* photon-number resolving detection).\n\nUnder (i)–(iii), the joint distribution of measurement outcomes is\n$$ p(\\mathbf{m}) = \\int d^{2N}\\mathbf{r}\\; W_\\rho(\\mathbf{r})\\, W_{E_\\mathbf{m}}(S\\mathbf{r}), $$\na convolution of two genuine probability densities. The classical algorithm is then trivial in principle: sample $\\mathbf{r}\\sim W_\\rho$, propagate by $S$, sample $\\mathbf{m}\\sim W_{E_\\mathbf{m}}(S\\mathbf{r})$. Mari–Eisert close the loop by showing the sampling can be carried out in time polynomial in mode number and inverse precision, given polynomial-size descriptions of the input Wigner function and the measurement symbol. The theorem is a statement about a *triple* (state, evolution, measurement). Take away any one of the three non-negativity assumptions — non-Gaussian input, non-Gaussian unitary, non-Gaussian POVM — and the proof breaks. This is why photon counting is the standard non-Gaussian element that re-enables advantage in CV linear optics: its POVM symbols have negativity even when the state does not.\n\n### What Veitch et al. actually prove\n\nThe Veitch–Ferrie–Gross–Emerson theorem is the discrete analogue, sharpened by a quirk of odd dimensions [25]. For Hilbert spaces of odd prime dimension $d$, Gross's discrete Wigner function on the phase space $\\mathbb{Z}_d \\times \\mathbb{Z}_d$ is uniquely fixed (up to relabelling) by covariance and Clifford-equivariance, and obeys two structural facts: pure stabilizer states have $W \\ge 0$, and Clifford unitaries permute Wigner points. Veitch et al. add that the Wigner symbols of Pauli measurements are also non-negative. Combining,\n$$ W_\\rho \\ge 0,\\quad U\\in\\mathcal{C}_d,\\quad M\\in\\mathcal{P}_d \\;\\Longrightarrow\\; \\text{efficient classical sampling}, $$\nwhich is the qudit analogue of Mari–Eisert and a strictly stronger statement than Gottesman–Knill: it covers any non-stabilizer input whose discrete Wigner function happens to remain non-negative (these exist; convex mixtures of stabilizer states are the obvious examples, but bound-magic states sit here too). The proof again is a phase-space Monte Carlo built on the positivity of all three ingredients.\n\nFor *even* $d$ — the qubit case — Gross's uniqueness theorem fails and no covariant non-negative-on-stabilizers Wigner function exists. This is the gap the later Raussendorf–Delfosse program patches with rebit phase spaces and contextuality witnesses [21, 22], at the cost of giving up state-independent positivity for stabilizer states.\n\n### The converse fails — and Gaussian noise is the cleanest witness\n\nThe implication is one-way. Wigner negativity is necessary for advantage under these free operations; it is not sufficient. Concrete obstruction:\n\nConsider a single-mode state $\\rho$ with negative $W_\\rho$ — a Fock state $\\lvert 1\\rangle$, a photon-subtracted squeezed vacuum, an odd cat. Pass it through a Gaussian channel of transmissivity $\\eta$ followed by additive Gaussian noise of variance $\\sigma^2$. The output Wigner function is the convolution\n$$ W_{\\rho'}(\\alpha) = \\int d^2\\beta\\, G_\\Sigma(\\alpha-\\sqrt{\\eta}\\,\\beta)\\, W_\\rho(\\beta), $$\nwith $\\Sigma = (1-\\eta)/2 + \\sigma^2$. The Cahill–Glauber identification of the $s$-ordered family [12] makes the rest immediate: for $\\Sigma \\ge 1/2$ the channel is the Wigner-to-Husimi smoothing and the output is non-negative for *any* input. So a finite, controllable amount of Gaussian noise destroys negativity entirely — at which point Mari–Eisert applies and the state is classically simulable in the relevant free-operation class. The advantage promised by negativity has been continuously erased while the state was still manifestly non-classical in every other operational sense (it is still non-Gaussian, still has $P$-function singularities, still produces sub-Poissonian counting statistics until $\\Sigma$ is large). Negativity is *fragile*; the resource-theoretic implication runs in the direction the theorems prove and no further. Photon-subtracted thermal states and weakly squeezed Schrödinger-kitten states are textbook examples: negative-$W$ but with vanishing operational margin against $\\Sigma$.\n\n### Kenfack–Życzkowski: a witness, not a monotone\n\nThe standard scalar measure of \"how much negativity\" is the Kenfack–Życzkowski volume,\n$$ \\mathcal{N}_{KZ}(\\rho) = \\int d^2\\alpha\\,\\lvert W_\\rho(\\alpha)\\rvert - 1, $$\nintroduced in 2004 as an \"indicator of non-classicality\" [20] and now ubiquitous in experimental papers. Two cautions that the literature elides. First, $\\mathcal{N}_{KZ}$ is defined with respect to *the* Wigner function $W$ at $s=0$; for any of the other $s$-ordered representatives it gives a different number, and below the Husimi threshold the indicator is identically zero — non-classicality measured this way is a property of the chosen quasi-probability, not the state alone. Second, $\\mathcal{N}_{KZ}$ is *not a monotone* under any operationally motivated free-operation set. It can be increased by Gaussian unitaries that squeeze the negative regions to make them taller and narrower; it can be decreased by partial mixing in ways that do not correspond to a free channel; it carries no convertibility content. It is a scalar witness — a positive number whose strict positivity certifies a quantum feature — and nothing more. Calling it a \"measure of negativity\" is correct; calling it a \"measure of the resource\" is not.\n\nThe monotones that actually behave correctly under Clifford/Gaussian-and-measurement-style free operations are different objects. In the discrete setting, the *mana*\n$$ \\mathcal{M}(\\rho) = \\log \\sum_{\\mathbf{u}\\in\\mathbb{Z}_d\\times\\mathbb{Z}_d} \\lvert W_\\rho(\\mathbf{u})\\rvert $$\nis a faithful monotone under Clifford operations and stabilizer measurements with classical post-processing in odd prime dimension (Veitch–Mousavian–Gottesman–Emerson, 2014) (verify) — it is additive on tensor products, sub-additive under mixing, and admits an operational interpretation in terms of magic-state distillation overhead. In CV, the natural analogue is the Wigner logarithmic negativity\n$$ \\mathrm{LN}_W(\\rho) = \\log\\!\\int d^{2N}\\alpha\\, \\lvert W_\\rho(\\alpha)\\rvert, $$\nwhich Albarelli, Genoni, Paris, and Ferraro (verify) showed is a monotone under Gaussian unitaries, Gaussian measurements, partial traces, and convex mixing. Both are defined as logarithms of the *full* $L^1$ norm — they include the \"$+1$\" that $\\mathcal{N}_{KZ}$ subtracts, and the logarithm is what makes them additive on independent modes. The difference between a witness and a monotone is exactly this: $\\log\\lVert W\\rVert_1$ governs convertibility under free operations; $\\lVert W\\rVert_1 - 1$ tells you only that the state is not free.\n\nThe cleanest one-line summary of the necessity-not-sufficiency trap, then, is structural: Mari–Eisert and Veitch et al. prove non-negativity is a sufficient condition for free simulation, which makes negativity a *necessary* condition for any computational separation within their free-operation class — and the operationally meaningful \"amount of resource\" is set not by the Kenfack–Życzkowski volume but by the mana / Wigner-logarithmic-negativity hierarchy, which alone respects the convertibility structure the resource theory is built to track."}, {"id": "frontier-and-open-problems", "title": "Frontier: Discrete Wigner Functions, Magic, and What Negativity Cannot Tell You", "markdown": "## Frontier: Discrete Wigner Functions, Magic, and What Negativity Cannot Tell You\n\nThe phase-space picture migrated to finite dimensions twice: once for pedagogy (Wootters 1987, Gibbons–Hoffman–Wootters 2004) and once, decisively, for resource theory (Gross 2006 (verify)). Gross's theorem is the discrete Hudson: for a single qudit of odd prime dimension $d$, a pure state has nonnegative Wigner function on the affine plane $\\mathbb{Z}_d \\times \\mathbb{Z}_d$ if and only if it is a stabilizer state, and the Clifford group is precisely the set of unitaries that preserve nonnegativity of $W_d$. This is what gives the Veitch–Ferrie–Gross–Emerson resource theory its teeth [25]: negativity in $W_d$ is necessary for state injection to drive a Gottesman–Knill simulator out of the polynomial regime, and the integrated absolute value\n$$ \\mathcal{M}(\\rho) \\;=\\; \\log \\sum_{\\mathbf{u}\\in\\mathbb{Z}_d^{2}} \\bigl|W_d(\\mathbf{u}\\mid\\rho)\\bigr| $$\n— mana — is a faithful, computable, additive magic monotone under stabilizer operations.\n\n### The even-dimensional fracture\n\nThe clean odd-prime story has no qubit analogue. There is no Wigner function on $\\mathbb{Z}_2^{2n}$ that is Clifford-covariant, real, and has all stabilizer states nonnegative simultaneously. Three workarounds dominate. Delfosse–Allard Guerin–Bian–Raussendorf [21] use a rebit (real-amplitude) phase space in which contextuality, not negativity, is the sharp resource for magic-state-injected computation; Raussendorf–Browne–Delfosse–Okay–Bermejo-Vega [22] generalise this to a class of qubit Wigner functions and prove a strict implication chain — contextuality $\\Rightarrow$ negativity, with the converse failing. The take-away for fault-tolerant architectures is uncomfortable: in $d=2$ the resource that survives Clifford noise channels and tracks the boundary of efficient classical simulation is contextuality of the input + measurement assemblage, not negativity of any single quasi-distribution. Quoting \"negativity is the magic\" in the qubit setting is a category error inherited from the odd-prime case.\n\n### CV magic, monotones, and a vocabulary problem\n\nIn continuous variables the analogous resource theory is younger and less unique. Albarelli–Genoni–Paris–Ferraro (2018, [Phys. Rev. A 98, 052350](https://journals.aps.org/pra/abstract/10.1103/PhysRevA.98.052350)) proposed the Wigner logarithmic negativity\n$$ \\mathcal{N}_W(\\rho) \\;=\\; \\log \\!\\int d^{2}\\alpha \\,\\bigl|W(\\alpha\\mid\\rho)\\bigr| $$\nas the CV analogue of mana. It is convex, monotone under Gaussian channels and Gaussian measurements with classical feed-forward, and additive on tensor products — the minimum bar for a resource monotone. It is *not*, however, faithful in the same operational sense as mana: Gaussian noise erodes $\\mathcal{N}_W$ continuously, and the gap between \"$\\mathcal{N}_W \u003e 0$\" and \"useful for a CV magic protocol\" can be opened by an arbitrarily lossy channel. Haferkamp and Bermejo-Vega [23] sharpen this by showing that contextuality in CV quantum optics is equivalent to Wigner negativity *only* under a specific operational restriction (Gaussian effects, displacement-covariant POVMs); outside that fragment the two come apart. Conflation #4 of §6 — \"the Wigner function\" as a singular object — is the live trap here, because different smoothings yield genuinely different resource hierarchies, and the relevant $s$ is rarely stated in CV-magic talks.\n\nA second active direction asks whether magic is a *bipartite* or higher resource. Zhang and Li [26] introduce a \"mutual mana\" in the discrete setting, showing that local magic can be converted into magic correlations via Clifford beamsplitters at a rate strictly below the local content — an effect with no entanglement analogue, since LOCC cannot increase entanglement at all. Whether a CV mutual-Wigner-negativity has comparable structure is open; existing definitions either fail subadditivity or collapse to the entanglement of formation under Gaussian operations.\n\n### Negativity is not the right entanglement witness — even when it sees it\n\nWalschaers, Fabre, Parigi, and Treps [17] showed that for multimode pure non-Gaussian states the marginal Wigner negativity carries strictly less information than the entanglement structure: states with identical $\\int |W|$ can have entanglement graphs differing by a mode permutation that no scalar negativity can detect. Practically, this means a single-number negativity is the wrong figure of merit for cluster-state-based CV computation; one needs at least the modewise distribution of negativity, and probably its symplectic-eigenvalue decomposition under the covariance matrix. Field deployments — non-Gaussian states transmitted through deployed telecom fibre by Breum et al. [27] — confirm experimentally what theory has been saying for a decade: negativity survives loss only above $\\eta \\gtrsim 1/2$ for single-photon-subtracted inputs, exactly the threshold that follows from convolving $W$ with the loss-induced Gaussian of variance $(1-\\eta)/2\\eta$.\n\n### Detector-robust certification\n\nThe §5 detector problem — efficiency convolves $W$ into nonnegativity — has its mirror image in the *detector's own* phase-space representation. Hloušek, Ježek, and Fiurášek [28] certified, model-independently, that single-photon click detectors themselves possess negative Wigner-effect functions; the certification uses only coherent-state probes and a finite set of measured click probabilities, with statistical confidence intervals on $W_\\Pi(0)$ rather than a reconstructed surface. This is the right template for any future negativity claim that must be robust to a detection-model: forget the picture, bound $W(0,0)$ (or $W_\\Pi(0)$) with explicit error bars and an explicit POVM, and refuse to call a tomographic dip \"negativity\" unless the bound is significant after deconvolution. The community has been slow to adopt this discipline; many claimed negativities in cavity-QED and circuit-QED papers post-Haroche are tomographic dips without published deconvolution kernels.\n\n### Bounded-negativity classical simulators\n\n[Pashayan, Wallman, and Bartlett (PRL 115, 070501)](https://link.aps.org/doi/10.1103/PhysRevLett.115.070501) gave the sampling counterpart to Mari–Eisert's necessity theorem: outcome probabilities of a quasi-probability circuit can be estimated to additive error $\\varepsilon$ with sample complexity $O(\\mathcal{N}^2/\\varepsilon^2)$, where\n$$ \\mathcal{N}(\\rho) \\;=\\; \\int d^{2}\\alpha\\, \\bigl|W(\\alpha\\mid\\rho)\\bigr| \\;\\geq\\; 1 $$\nis the *sum-negativity* of the entire circuit's quasi-distribution. This is *not* the Kenfack–Życzkowski volume $\\int|W|-1$ [20]; the two differ by an additive constant that matters for sample complexity. Conflation watch: review talks routinely equate Kenfack's scalar with PWB's $\\mathcal{N}$, then quote PWB's polynomial-simulation threshold using Kenfack numbers. A subsequent line ([Seddon–Bartlett 2019, Heinrich–Gross 2019](https://arxiv.org/abs/2002.06181)) sharpened the simulator using stabilizer-rank and dyadic-negativity monotones; for CV the analogous tightening is still open and is, by my reading, the single sharpest unsolved technical question on this map.\n\n### What is still genuinely open\n\n(i) A *faithful* CV magic monotone: $\\mathcal{N}_W$ is monotone but loose, and known to overestimate the resource cost of useful protocols by factors that grow with mode number. (ii) A detector-deconvolved, statistical-test-style certification of negativity that becomes a publication standard, replacing the eyeball-the-dip plot. (iii) The status of negativity under fault-tolerant encoding: GKP magic states have negative $W$ on the torus, but the relevant resource for FT-CV computation is closer to the symplectic-non-Gaussianity of the encoded distribution than to integrated negativity. (iv) Whether contextuality and negativity will converge in the qubit setting under some operational closure, or remain distinct resources whose relative weighting depends on the protocol — a question that decides which scalar belongs on the $y$-axis of every future \"quantum-advantage threshold\" plot. The honest answer in 2026 is that the field has resource monotones it can compute and resource monotones it can *use*, and they are not yet the same monotones.\n\nSources:\n- [Albarelli et al., Phys. Rev. A 98, 052350 (2018)](https://journals.aps.org/pra/abstract/10.1103/PhysRevA.98.052350)\n- [Gross, \"Non-negative Wigner functions in prime dimensions\"](https://arxiv.org/pdf/quant-ph/0702004)\n- [Pashayan, Wallman, Bartlett, Phys. Rev. Lett. 115, 070501](https://link.aps.org/doi/10.1103/PhysRevLett.115.070501)\n- [Seddon–Bartlett / Heinrich–Gross magic monotone tightening](https://arxiv.org/abs/2002.06181)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier arguing that the Wigner function is a richer and stranger object than the textbook treatment grants. Here is where I will plant my flag.\n\n### What I will defend\n\nThe displaced-parity identity $W(\\alpha) = \\tfrac{2}{\\pi}\\,\\mathrm{Tr}\\!\\left[\\rho\\, D(\\alpha)\\,\\Pi\\,D^\\dagger(\\alpha)\\right]$ is, in my view, the single most underrated equation in continuous-variable quantum optics, and the credit line on it — Grossmann 1976, Royer 1977, Bell-Saunders earlier still in spirit — is the cleanest example of an attribution error that the community could fix overnight and refuses to. I will also defend, without qualification, the Soto–Claverie extension of Hudson as the correct multimode pure-state statement; any paper invoking \"Hudson's theorem\" for a two-mode squeezed vacuum without citing Soto–Claverie is sloppy, full stop. And I will defend Groenewold 1946 as the true birth of deformation quantization. Moyal gave it a probabilistic skin; Groenewold gave it the no-go theorem and the star-product, and was rewarded with a thesis nobody read for thirty years.\n\n### What is shakier than advertised\n\nThree loadbearing assumptions in the modern resource literature are quietly doing more work than they admit.\n\nFirst, the leap from *necessity* (Mari–Eisert, Veitch et al.) to *sufficiency* in the slogan \"negativity is the resource for quantum advantage\" is unjustified. The proofs furnish an efficient classical simulation when $W \\geq 0$ *and* operations are Gaussian (or Clifford, in the discrete case) *and* measurements are likewise restricted. Strip any one of those and the simulation algorithm dies; the converse direction — that every negative state confers advantage — has never been proved and is, I suspect, false in a measure-theoretic sense.\n\nSecond, the equivalence between Wigner negativity and contextuality in odd prime dimensions (Howard–Wallman–Veitch–Emerson; Delfosse et al.) is a theorem about a specific operational restriction (stabilizer states, Pauli measurements, Clifford operations). Quoting it as if it lifted to general qudit dynamics is a category error. The even-dimensional case has no clean Wigner representation at all without contextual sleight of hand at the Heisenberg–Weyl level, and our community continues to publish numerics on qubit \"Wigner negativity\" without flagging which non-canonical construction is in play.\n\nThird — and this is the empirical one — almost every reported single-photon Wigner negativity below $\\eta \\approx 0.6$ is, to my reading, indistinguishable from a reconstruction artifact unless the authors explicitly deconvolve the detector POVM and report the variance of $W(0,0)$. The Hudson-like threshold $\\eta_c \\approx 0.5$ for a Fock-state $|1\\rangle$ is not a nuisance; it is the experiment.\n\n### Three open problems, ranked\n\n1. **A sharp sufficiency theorem (or a clean counterexample) for Wigner negativity as a CV computational resource.** This is the question Mari–Eisert opened and nobody has closed; the answer would either canonize or demote the whole resource-theoretic program.\n2. **A continuous-variable analogue of *contextuality* that reduces to Spekkens' notion in the discrete limit and to Wigner negativity in the Gaussian limit.** The current literature has two disconnected halves and one bridge of hand-waving.\n3. **An operationally meaningful, detector-loss-robust witness of Wigner negativity that does not require full tomography.** Direct displaced-parity sampling à la Lutterbach–Davidovich is the right idea; making it loss-tolerant is the unsolved engineering problem.\n\n**Reading path:**\n\n1. Wigner 1932 [1] — read it for the explicit acknowledgement of Szilard in the footnote, and notice the derivation is two pages.\n2. Groenewold's 1946 Utrecht thesis — the no-go theorem and the star-product, before either had a name (verify; reprinted in *On the Principles of Elementary Quantum Mechanics*).\n3. Royer 1977 — the displaced-parity identity, stated cleanly, fifteen years before \"direct measurement of the Wigner function\" became a phrase (verify).\n4. Hudson 1974 together with Soto–Claverie 1983 — read as a pair; the multimode extension is the one you actually use.\n5. Veitch–Ferrie–Gross–Emerson and Mari–Eisert (2012) — the resource-theoretic pivot; read them adversarially, with the necessity/sufficiency distinction in hand."}], "references": [{"n": 1, "title": "On the quantum correction for thermodynamic equilibrium", "authors": ["E. Wigner"], "year": 1932, "venue": "Physical Review 40, 749", "url": "https://doi.org/10.1103/PhysRev.40.749", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "The Recollections of Eugene P. Wigner — as told to Andrew Szanton", "authors": ["E. P. Wigner", "A. Szanton"], "year": 1992, "venue": "Plenum Press, New York", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Negative probability", "authors": ["M. S. Bartlett"], "year": 1945, "venue": "Proceedings of the Cambridge Philosophical Society 41, 71", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Negative probability", "authors": ["R. P. Feynman"], "year": 1987, "venue": "in Quantum Implications: Essays in Honour of David Bohm, eds B. J. Hiley \u0026 F. D. Peat (Routledge \u0026 Kegan Paul)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Distribution functions in physics: Fundamentals", "authors": ["M. Hillery", "R. F. O'Connell", "M. O. Scully", "E. P. Wigner"], "year": 1984, "venue": "Physics Reports 106, 121", "url": "https://doi.org/10.1016/0370-1573(84)90160-1", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "On the principles of elementary quantum mechanics", "authors": ["H. J. Groenewold"], "year": 1946, "venue": "Physica 12, 405 (Utrecht doctoral thesis, supervisor L. Rosenfeld)", "url": "10.1016/S0031-8914(46)80059-4", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Quantum mechanics as a statistical theory", "authors": ["J. E. Moyal"], "year": 1949, "venue": "Proceedings of the Cambridge Philosophical Society 45, 99", "url": "https://doi.org/10.1017/S0305004100000487", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Maverick Mathematician: The Life and Science of J. E. Moyal", "authors": ["Ann Moyal"], "year": 2006, "venue": "ANU E Press, Canberra", "url": "https://press.anu.edu.au/publications/series/anu-lives-series-biography/maverick-mathematician", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "When is the Wigner quasi-probability density non-negative?", "authors": ["R. L. Hudson"], "year": 1974, "venue": "Reports on Mathematical Physics 6, 249", "url": "https://doi.org/10.1016/0034-4877(74)90007-X", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "When is the Wigner function of multidimensional systems non-negative?", "authors": ["F. Soto", "P. Claverie"], "year": 1983, "venue": "Journal of Mathematical Physics 24, 97", "url": "https://doi.org/10.1063/1.525607", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "Wigner function as the expectation value of a parity operator
