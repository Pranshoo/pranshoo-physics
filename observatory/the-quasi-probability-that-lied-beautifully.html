1974, and everything since is application. Every clause of that sentence is either incomplete or wrong about who did the work. The actual pre-history involves four actors — Szilard, Bartlett, Groenewold, Moyal — three of whom were either erased from the standard citation or actively resisted by the orthodox community at the time. What follows is the record as the actors themselves left it, before the textbook redactions. Wigner 1932, and the footnote that named Szilard Wigner's \"On the quantum correction for thermodynamic equilibrium\" is, on its surface, a paper about quantum corrections to the classical partition function for a gas of interacting particles. The phase-space distribution is introduced en route, almost as bookkeeping: an object whose marginals reproduce \\psi(q) ^{2} and \\tilde\\psi(p) ^{2} and which, when smoothed by e^{-\\beta H}, yields the leading \\hbar^{2} correction to the Boltzmann weight. Wigner himself flagged that W \"cannot be really interpreted as a probability of simultaneous values of q and p\" because it takes negative values. The negativity is observed, named, and then set aside — the goal was a thermodynamic correction, not a new mechanics. The footnote on the first page of is the part that the canonical attribution has quietly dropped. Wigner writes that the expression was \"found by L. Szilard and the present author some years ago for another purpose.\" That \"other purpose\" — never published — concerned the statistical thermodynamics of a quantum gas; the two had derived the kernel jointly, probably around 1929–1931, in connection with information-theoretic questions Szilard was then pursuing in parallel with his demon paper. Wigner reiterates the joint origin in the autobiographical recollections compiled by Szanton , where he is unambiguous that Szilard had the formula in hand before its appearance in print. Szilard never claimed credit. The name \"Wigner function\" is a posthumous editorial decision of the community, not a priority statement by either author. Two interpretive points follow. First, the 1932 paper does not treat W as a representation of states — it is a calculational tool, and the question of how observables map into it is not posed. Second, the negativity is not yet a quantum signature; Wigner describes it as a feature of the corrected classical distribution, not as a property whose persistence under physical operations might be diagnostic. The conceptual content that we now load onto \"Wigner negativity\" is grafted on later. Bartlett 1945: signed measures as legitimate objects The next move came from outside physics. M. S. Bartlett, a statistician at Cambridge, asked whether a probability-like object that takes negative values could be given a coherent mathematical status . His answer was technical and decisive: a signed measure with positive marginals along every classical projection is a well-defined object in measure theory; expectations against bounded test functions remain finite; characteristic functions can carry the negativity into a representation where the underlying object is unambiguously normalizable. Bartlett did not write down the Wigner function — his framing was abstract — but he gave the conceptual permission slip that the field needed to take negative quasi-distributions seriously rather than dismiss them as paradox. Feynman's 1987 essay \"Negative probability\" is the citation that nearly every modern paper uses when it wants to philosophically justify W \u003c 0. Feynman does not cite Bartlett. Bartlett's 1945 paper had done the work four decades earlier, with greater rigor and less folkloric framing. The displacement is total: a literature search for the phrase \"negative probability\" in quantum-optics review articles will turn up Feynman more often than Bartlett by a factor of order 10^{2}. Bartlett's name does not appear in the Hillery–O'Connell–Scully–Wigner review either. Groenewold 1946: the formalism that \"Wigner–Moyal\" should have been called Hilbrand Groenewold's Utrecht doctoral thesis , supervised by Rosenfeld, is the document in which the phase-space formalism actually becomes a formalism. Three results appear there essentially for the first time, all in the body of one paper: 1. The star product , f \\star g, that makes the space of phase-space functions into an associative noncommutative algebra reproducing operator multiplication under the Wigner transform. 2. The von Neumann–type no-go theorem on canonical quantization: there is no map f \\mapsto \\hat f from smooth phase-space functions to self-adjoint operators that is linear, takes Poisson brackets to commutators up to order \\hbar^{2}, and preserves the algebra of polynomials beyond degree two. This is what is now (wrongly) sometimes called the \"Groenewold–van Hove theorem\"; van Hove's contribution came in 1951, and the foundational statement is Groenewold's. 3. The proof that the Wigner transform is a faithful representation — the map between density operators and Wigner functions is invertible and isometric in the Hilbert–Schmidt inner product, so W is not an approximation or a semiclassical artifact but a complete repackaging of the quantum state. These are the three pillars of the Wigner–Weyl–Moyal calculus. None of them is in Wigner 1932. All three are Groenewold's. The thesis was published in Physica in the same year, but the journal had limited international circulation in the immediate post-war period, and Groenewold's career stayed in Utrecht rather than crossing the Atlantic; the work was rediscovered piecemeal by Bayen–Flato–Fronsdal–Lichnerowicz–Sternheimer in the 1970s deformation-quantization program. The phrase \"Moyal product\" that one finds throughout the modern literature on deformation quantization is, almost without exception, Groenewold's product. Zachos, Fairlie, and Curtright have argued this point publicly for two decades; the citation pattern has barely shifted. Moyal 1949, and Dirac's refusal José Enrique Moyal arrived at the phase-space program from a different direction — probability theory and stochastic processes — and submitted his manuscript to Proceedings of the Cambridge Philosophical Society in 1947. The published version is what the field knows: quantum mechanics recast as a statistical theory on phase space, with the bracket (the sine bracket whose leading term is the Poisson bracket and whose all-orders content reproduces the commutator) carrying the dynamics. Moyal did not know of Groenewold's thesis when he wrote the paper; the star product is implicit in his bracket but not isolated as an algebra. The independence of the two derivations is well established. What is less widely remembered is that Moyal had circulated drafts to Dirac for nearly a decade before publication, and Dirac refused the program. The correspondence — preserved and reproduced by Ann Moyal in — shows Dirac arguing that any reformulation of quantum mechanics on phase space must be either equivalent to the Hilbert-space formulation (in which case it is at best a notational variant) or inequivalent (in which case it is wrong); the option that the reformulation might expose structure invisible in the operator picture — which is exactly what the deformation-quantization community would later argue is its real content — Dirac did not entertain. Moyal's paper was held up, his academic position in Britain became untenable, and he eventually moved to Australia. The marginalization was concrete, not merely citational. What the textbook attribution falsifies The standard sentence \"the Wigner function was introduced by Wigner in 1932 and reformulated by Moyal in 1949\" is wrong on three counts. (i) The function was introduced by Wigner and Szilard , with the joint origin documented in Wigner's own footnote and recollections [1, 2]. (ii) The reformulation as an algebra — the part that makes the phase-space picture a working framework rather than a curiosity — is Groenewold's , not Moyal's, and predates Moyal's publication by three years. (iii) The conceptual rehabilitation of \"negative probability\" as a mathematically respectable object is Bartlett's , not Feynman's . Each of these displacements is documented in the primary sources; none is controversial historiographically; all four remain in force in the citation practice of the field. The sections that follow will assume this corrected lineage rather than the textbook one. The Formalism: Wigner Transform, Weyl Symbols, and the Moyal Bracket The Formalism: Wigner Transform, Weyl Symbols, and the Moyal Bracket The transform and what it is of The object Wigner wrote down in 1932 , for a one-dimensional system in a pure state \\psi, is For a general (possibly mixed) state \\rho the same construction reads where the sign in the exponent is the textbook convention chosen so that the p-marginal comes out right; the two forms differ only by y\\!\\to\\!-y. Either way, W is a real function on \\mathbb R^{2} — not a probability density. It is the Wigner symbol of \\rho, i.e. its image under the Wigner transform, which is the inverse of the Weyl quantization map. Three identities make this concrete: Both marginals are bona fide probability densities. The trouble is hidden in joint statements: there exists no real-valued W on phase space that reproduces both marginals correctly and is everywhere nonnegative, unless \\psi is a Gaussian — that is the content (later) of Hudson and Soto–Claverie . Weyl quantization and its inverse Weyl's symmetrization rule assigns to a phase-space function a(q,p) the operator The inverse map — Wigner's transform on operators — sends \\hat A to its Weyl symbol With these conventions W(q,p) = (2\\pi\\hbar)^{-1}\\,a {\\rho}(q,p): the Wigner function is the Weyl symbol of \\rho, normalized for phase-space integration. The whole formalism is then a dictionary The last line — the trace inner product as a phase-space overlap — is the workhorse of every later result. With \\hat A=\\rho {1}, \\hat B=\\rho {2} one finds \\operatorname{tr}(\\rho {1}\\rho {2}) = 2\\pi\\hbar \\iint W {1}W {2}\\,dq\\,dp. Two consequences are immediate. First, because 0 \\le \\operatorname{tr}(\\rho {1}\\rho {2}) \\le 1 and one may set \\rho {2}=\\rho {1}= \\psi\\rangle\\langle\\psi , Second — the bound asked for — set \\rho {2} equal to the displaced parity \\hat\\Pi(\\alpha)=\\hat D(\\alpha)\\hat\\Pi\\hat D^{\\dagger}(\\alpha). Royer's identity writes W as an expectation value of a bounded operator with spectrum \\{+1,-1\\}, so This is a state-independent pointwise ceiling — a peculiarity of s=0 in the Cahill–Glauber family — and the value 1/\\pi\\hbar is saturated only by states for which \\rho is mapped to \\pm the displaced parity, i.e. coherent states (positive saturation) and odd Fock-like superpositions at the origin (negative saturation, W(0,0)=-1/\\pi\\hbar for 1\\rangle). It is also the cleanest answer to \"how negative can a Wigner function get\": exactly as negative as it can be positive. Royer's formula is what makes \"negativity\" an observable — \\hat\\Pi(\\alpha) is measured directly by photon-number parity after displacement [13, 14]. Star product and Moyal bracket The composition law \\widehat{a\\star b} = \\hat A\\hat B defines Groenewold's star product : Expanding the exponential generates an \\hbar-series whose zeroth term is the pointwise product and whose first antisymmetric term reproduces \\{a,b\\} {\\mathrm{PB}}. The antisymmetrized star is the Moyal bracket , so the von Neumann equation becomes For Hamiltonians at most quadratic in (q,p) all higher terms vanish and the Moyal flow is identical to the classical Liouville flow: Gaussian states stay Gaussian, and a nonnegative W stays nonnegative. Negativity, when it appears, is therefore strictly an artefact of (i) non-Gaussian initial states or (ii) non-quadratic Hamiltonians — and it cannot be produced by passive linear optics acting on coherent or thermal light. This already telegraphs why Mari–Eisert's simulation theorem cleaves cleanly along the quadratic/Gaussian boundary. Credit-wise, the entire star/Moyal apparatus is Groenewold's thesis with Moyal independent and concurrent ; the modern label \"Wigner–Moyal\" undercredits Groenewold systematically (see §1 and ). Where negativity is forced — geometry of fringes and sub-Planck cells Take a coherent superposition \\psi\\rangle = \\mathcal N( \\alpha\\rangle + {-\\alpha}\\rangle) with \\alpha\\in\\mathbb R, \\alpha\\gg 1. Its Wigner function decomposes into two Gaussian \"lobes\" centered at (\\pm\\sqrt{2\\hbar}\\,\\alpha,0) plus a cross term: The third term is the interference fringe. Its sign oscillates with momentum period \\Delta p = \\pi\\hbar/q {0}; on either side of a fringe maximum sits a fringe minimum of equal amplitude. Because the envelope of the cross term has the coherent-state width \\sqrt{\\hbar} in both q and p, a single fringe occupies an area i.e. smaller than a Planck cell . This is Zurek's \"sub-Planck structure\": negativity packs phase-space oscillations into regions tighter than the coherent-state uncertainty product, which is precisely the geometry that makes such states ultra-sensitive (and decoherence-fragile). Hudson's theorem says the same thing from the other side — any non-Gaussian pure state must show such fringes somewhere — and Soto–Claverie extend it to N modes. Figure: phase-space anatomy of \\alpha\\rangle+ -\\alpha\\rangle. Two Gaussian lobes (blue) carry W 0; between them sits a striped band of alternating positive (orange) and negative (pink) fringes with momentum period \\pi\\hbar/q {0} — sub-Planck in area though enveloped by a \\sqrt{\\hbar}-wide Gaussian. The Royer bound W \\le 1/\\pi\\hbar is saturated by both the lobes and the central fringe, with opposite sign. Why the bracket and the bound matter together The Royer bound and the Moyal flow conspire to make negativity robust under unitary evolution but fragile under coarse-graining . Quadratic Hamiltonians shuffle fringes around symplectically without ever erasing them; Gaussian convolution — equivalent to advancing s from 0 toward -1 in the Cahill–Glauber family , or to coupling to a thermal/vacuum bath — kills oscillations exponentially in their wavenumber, and the sub-Planck fringes go first. This is the formal reason the Husimi Q is nonnegative for every state: it is the convolution of W with a coherent-state Gaussian of width \\sqrt{\\hbar/2}, exactly the scale that washes out fringes whose envelope sits within \\sqrt{\\hbar}. Negativity, then, is not a pathology to be fixed by smoothing — it is the thing that smoothing destroys. The next section formalises this through the s-ordered family and the Hudson / Soto–Claverie theorem. The s-Ordered Family and Hudson's (Soto–Claverie) Theorem The s-Ordered Family and Hudson's (Soto–Claverie) Theorem The one-parameter family The Wigner function is not unique among phase-space representatives of \\rho; it is the symmetric (Weyl) member of a one-parameter family that Cahill and Glauber organized in 1969 . Define the s-ordered displacement characteristic function and its complex Fourier transform Three values pick out the named distributions: s=+1 gives the Glauber–Sudarshan P-function (often distributional, the diagonal coherent-state expansion); s=0 gives the Wigner function W (Weyl-symmetric ordering); s=-1 gives the Husimi Q(\\alpha)=\\langle\\alpha \\rho \\alpha\\rangle/\\pi (anti-normal ordering). Operator products are reconstructed by integrating the s-symbol against the corresponding kernel; expectation values of s-ordered monomials become moments of W(\\alpha,s). The choice of s is therefore the choice of operator ordering convention , dressed as a choice of statistics. The bridge between members of the family is a Gaussian convolution. For s'\u003cs, Setting s=0, s'=-1 yields the standard statement: Q is W smeared with a Gaussian of variance 1/2 (in coherent-state units), i.e. the vacuum Wigner function. Because a convolution with a strictly positive kernel cannot produce negative values from a non-pathological input, Q\\ge 0 for every state — the Husimi function is structurally non-negative not because of any physical taming of \"quantumness\" but because we have band-limited away exactly the spatial scales smaller than \\sqrt{\\hbar/2} on which the Wigner negativity oscillates. This is the precise sense in which Gaussian smoothing of width (1-s)/2 \"silently restores positivity\": once 1-s exceeds the support scale of the negative lobes — typically \\mathcal{O}(\\hbar) on Fock states or cat states — the surviving distribution is, by construction, a probability density and tells the unwary observer nothing about the underlying non-classicality. Cahill and Glauber were explicit that the family is interpolating an ordering , not an amount of classicality ; the literature has not always honoured that distinction (see §6). Hudson's pure-state theorem For pure states the question \"when is W\\ge 0?\" has a complete and surprisingly clean answer, due to Hudson : Theorem (Hudson 1974). For a pure state \\psi\\in L^{2}(\\mathbb{R}), the Wigner function W {\\psi}(q,p) is non-negative on all of phase space if and only if \\psi is a Gaussian, i.e. \\psi(q)=\\exp(-\\tfrac{1}{2}aq^{2}+bq+c) with \\mathrm{Re}\\,a 0. Derivation sketch (Bochner / Paley–Wiener). For a pure state, the Wigner function is the Weyl transform of the rank-one projector \\psi\\rangle\\langle\\psi , so its symplectic Fourier transform is the ambiguity function If W {\\psi}\\ge 0 everywhere, then — since \\int W {\\psi}=\\ \\psi\\ ^{2}=1 — it is a genuine probability density and its Fourier transform A {\\psi} is the characteristic function of a probability measure on \\mathbb{R}^{2}. By Bochner's theorem A {\\psi} is positive definite. But A {\\psi}(\\xi,\\eta) is, in \\eta, the Fourier transform of \\overline{\\psi(q-\\eta/2)}\\psi(q+\\eta/2) for each fixed q, hence an entire function of exponential type in (\\xi,\\eta) when \\psi has compact support — and more generally, on the Paley–Wiener side, an entire function of order 2. A positive-definite entire function of order \\le 2 on \\mathbb{R}^{2} is, by the Marcinkiewicz–Lévy theorem (a classical companion to Bochner), the characteristic function of a Gaussian measure. Inverting, W {\\psi} is Gaussian, hence \\psi is Gaussian. The standard pedagogical reconstructions in Schleich and Hillery–O'Connell–Scully–Wigner are variants of this Bochner / entire-function argument. Two corollaries deserve emphasis. First , Hudson's theorem already determines that the only pure states reachable from vacuum by Gaussian unitaries — displacements, single-mode squeezers, phase rotations — have W\\ge 0; equivalently, the only pure CV states with classical-looking phase space are those generated by the symplectic group on the vacuum. Second , the theorem says nothing about mixed states: as in the conflation list, mixtures of Gaussians give W\\ge 0 but are not the only W\\ge 0 mixed states, and they include manifestly non-classical objects such as photon-number-stabilized thermal squeezed states. Hudson's theorem is a knife-edge result that mixed-state intuition routinely over-extends. Soto–Claverie: the multimode statement actually cited The result invoked in modern continuous-variable optics — that a pure N-mode state has W\\ge 0 on \\mathbb{R}^{2N} iff it is a (possibly squeezed, displaced) multimode Gaussian — is not in Hudson 1974. It was proved nine years later by F. Soto and P. Claverie , who extended the Bochner/entire-function machinery to \\mathbb{R}^{2N} and dealt with the cross-mode quadratic forms. Their statement: Theorem (Soto–Claverie 1983). A pure state \\psi\\in L^{2}(\\mathbb{R}^{N}) has W {\\psi}\\ge 0 on \\mathbb{R}^{2N} iff \\psi(\\mathbf{q})=\\exp(-\\tfrac{1}{2}\\mathbf{q}^{T}\\!A\\,\\mathbf{q}+\\mathbf{b}^{T}\\!\\mathbf{q}+c) with A a complex symmetric matrix of positive-definite real part. Multimode reviews and the resource-theoretic papers [15, 17] depend on this statement; references that read \"by Hudson's theorem\" in the N-mode context are, with rare exceptions, citing Soto–Claverie under Hudson's name. The credit audit is unambiguous on this point — the theorem deserves both names. Royer's parity identity The third pillar of this section is operational. Royer showed in 1977 that the Wigner function is, pointwise , the expectation value of a displaced parity : The derivation is one line once the Weyl symbol of the parity operator is computed: \\Pi has Wigner symbol \\tfrac{\\pi}{2}\\delta^{(2)}(\\alpha), so the trace \\mathrm{Tr}[\\rho\\Pi]=\\tfrac{2}{\\pi}W(0), and translation covariance under D(\\alpha) extends this to every phase-space point. The identity has three operational consequences. (i) W is bounded : W(\\alpha) \\le 2/\\pi, since \\Pi has spectrum \\{\\pm 1\\} — a bound the literature still sometimes misquotes. (ii) The negative lobes of W are physically the regions where the displaced state has an excess of odd photon number over even, an observable parity excess. (iii) The expression makes direct, un-smoothed Wigner reconstruction possible: displace by -\\alpha and measure photon-number parity. This is the route taken by Banaszek–Wódkiewicz for travelling fields and by Haroche's cavity-QED group for intracavity states, where parity is read off the dispersive phase shift on a Rydberg atom traversing the cavity. The standard textbook attribution to Banaszek–Wódkiewicz alone, without Royer (and Grossmann, independently in 1976), is one of the cleaner cases of erased priority in the field. Royer's identity also clarifies why every \"direct\" Wigner measurement is a measurement of a bounded, signed, but otherwise ordinary observable: there is no metaphysics of negative probability at the detector — only the expectation of a Hermitian operator that happens to take both signs. Whether the negative values of W are then a resource in any operational sense is the question that §7 takes up. Landmark Experiments: From Smithey to Cavity QED to Mechanical Cats Landmark Experiments: From Smithey to Cavity QED to Mechanical Cats For its first sixty years the Wigner function was an object only theorists looked at. Two distinct experimental philosophies broke that silence in the 1990s and they are not interchangeable. The first reconstructs W(q,p) tomographically from quadrature histograms — a noisy inverse problem that lets detection inefficiency masquerade as Gaussian smoothing. The second samples W pointwise via Royer's parity identity , turning the question into an interferometric measurement whose contrast is degraded by inefficiency but whose location and depth of negativity are not blurred away. Which philosophy was used decides, in every experiment below, whether the reported \"dip\" is a true property of the state or an artifact rescued by post-processing. 4.1 Smithey–Beck–Raymer–Faridani 1993: the inverse-Radon era The first Wigner reconstruction of a quantum-optical state was performed on the squeezed vacuum and vacuum from a degenerate optical parametric amplifier . Balanced homodyne detection at \\sim 85\\% photodiode quantum efficiency yielded phase-binned quadrature histograms p \\theta(x); the Wigner function was recovered by inverting the Radon transform No negativity was observed and none should have been: a squeezed vacuum is Gaussian and so W \\ge 0 by Hudson's theorem . The contribution was methodological — the demonstration that W is operationally accessible from marginals — not a witness of non-classicality. It is a common misreading to credit the 1993 paper with the first observation of Wigner negativity; it observed the first Wigner function . The same year Vogel and Risken's pattern-function inversion [\\[Vogel–Risken PRA 40, 2847 (1989)\\]](https://journals.aps.org/pra/abstract/10.1103/PhysRevA.40.2847) (verify) made the analysis tractable. 4.2 Royer's parity and the cavity-QED ladder Royer's 1977 identity reduces the measurement of W at a single phase-space point to the measurement of a displaced photon-number parity. Banaszek and Wódkiewicz proposed implementing this by counting photons after a beamsplitter displacement; Lutterbach and Davidovich (PRL 78, 2547, 1997) (link) showed that in cavity QED the parity is read out by Ramsey interferometry on a dispersively coupled atom — the field is never demolished, the signal is an atomic population, and detector inefficiency suppresses the contrast but does not convolve W with anything. This robustness, more than the conceptual elegance, is what made the ENS Haroche-group program possible . Bertet, Auffèves et al. PRL 89, 200402 (2002) (link) executed the Lutterbach–Davidovich recipe on a one-photon Fock state in a high-Q microwave cavity. The theoretical value W { 1\\rangle}(0) = -2/\\pi was reduced by experimental imperfections (atomic-velocity dispersion, cavity damping during the 300\\,\\mu\\mathrm{s} interrogation) to an observed central value near -0.32 in normalised units, but the dip survived without loss correction. Deléglise et al. Nature 455, 510 (2008) (link) extended this to even and odd Schrödinger cat states \\alpha\\rangle \\pm \\!-\\!\\alpha\\rangle with \\alpha ^2 up to \\sim 3.5 photons, scanning W on a full phase-space grid. Snapshots taken at successive cavity-damping times traced the interference fringes washing out at the predicted rate \\propto \\alpha ^2 \\kappa, providing a direct picture of the quantum-to-classical transition. Negativities of order -2/\\pi appeared in the raw data; the role of post-processing was only to extract a density matrix, not to recover negativity from a smoothed image. 4.3 Lvovsky 2001: the optical Fock state at the 50% threshold Lvovsky, Hansen, Aichele, Benson, Mlynek, Schiller PRL 87, 050402 (2001) (link) performed homodyne tomography on a heralded single photon from SPDC, total detection efficiency \\eta \\approx 0.55. The reconstructed W(0,0) was negative on raw data, with a value near -0.13/\\pi — small but statistically resolved. The number is not arbitrary. Finite efficiency \\eta at homodyne detection is equivalent to mixing the signal with vacuum at a beamsplitter of transmissivity \\eta, which convolves the true Wigner function with a Gaussian of variance (1-\\eta)/2\\eta. For the single-photon state W { 1\\rangle}(0) = -2/\\pi this gives so W \\eta(0,0) \u003c 0 iff \\eta 1/2. Lvovsky's \\eta = 0.55 sat 5\\% above the threshold and predicted W \\eta(0,0) \\approx -0.10/\\pi, matching observation. This is the experiment that turned the \\eta = 0.5 inequality from a textbook statement into a publishable claim, and it is the warning the negativity literature has internalised: report \\eta or you have not measured negativity . 4.4 Superconducting cavities: Hofheinz–Martinis 2009 Hofheinz et al. Nature 459, 546 (2009) (link) synthesised arbitrary superpositions of Fock states up to 6\\rangle in a coplanar-waveguide resonator coupled to a phase qubit, and measured the full Wigner function via qubit-mediated dispersive parity — the circuit-QED descendant of Lutterbach–Davidovich. Negativities were resolved on every non-Gaussian state and no inefficiency deconvolution was needed: the parity readout extracts \\langle \\Pi \\rangle as the contrast of a Ramsey-like signal on the qubit, and qubit-readout error reduces SNR rather than blurring the phase-space image. Subsequent circuit-QED work (Vlastakis 2013, Sun 2014) extended the technique to cats of \\sim 100 photons. 4.5 Mechanical Wigner negativity: 2018 onward Two simultaneous Nature papers in 2018 brought parity-based Wigner imaging to phonons. Chu et al. Nature 563, 666 (2018) (link) prepared multi-phonon Fock states in a bulk acoustic-wave resonator coupled to a transmon; Satzinger et al. Nature 563, 661 (2018) generated a single-phonon state in a surface-acoustic-wave resonator coupled to a transmon. In both cases the Wigner function was reconstructed via the same dispersive-parity protocol used for microwave photons; in both cases negativity appeared in the raw data, requiring no efficiency correction. Independent of the dispersive route, Brown et al. arXiv:2203.03053 reconstructed the motional Wigner function of a single neutral atom in an optical tweezer by time-of-flight expansion — a return, on a single-particle mechanical mode, to the quadrature-tomography philosophy of Smithey, with single-atom imaging replacing balanced photodetection. A scoreboard of the lineage: Experiment State Method \\eta regime Negativity in raw data? --- --- --- --- --- Smithey 1993 squeezed vacuum inverse Radon \\sim 0.85 n/a (Gaussian) Lvovsky 2001 \\mid 1\\rangle optical inverse Radon 0.55 yes, marginal Bertet 2002 \\mid 1\\rangle microwave disp. parity (Rydberg) cavity-limited yes Deléglise 2008 cats \\mid\\alpha\\rangle\\pm\\mid\\!-\\!\\alpha\\rangle disp. parity (Rydberg) cavity-limited yes Hofheinz 2009 Fock \\mid n\\rangle to \\mid 6\\rangle disp. parity (qubit) qubit-limited yes Chu / Satzinger 2018 phonon Fock disp. parity (transmon) qubit-limited yes Brown 2022 atomic motion time-of-flight imaging-limited yes The pattern is unambiguous: every experiment that produced negativity in raw data used a parity-based pointwise sampling; every experiment that needed loss correction or deconvolution used quadrature tomography. The instrumental moral — explored further in §5 — is that the choice of detection scheme is not a matter of taste. It selects which of two distinct mathematical objects you are reconstructing, and for the inverse-Radon route the negativity you publish is the negativity your detector left intact. Use, Abuse, and the Detector That Eats Negativity Use, Abuse, and the Detector That Eats Negativity Four habits dominate the modern use of Wigner negativity, and three of them are wrong. The pattern is the same in each case: a clean theorem proved under tight hypotheses gets quoted as a slogan, the hypotheses get dropped in transit, and a measurement artifact gets re-labelled as physics. This section names the four habits and writes down the operational statement that should replace the slogan. Abuse 1 — Hudson applied to mixed states Hudson's 1974 theorem , extended to many modes by Soto and Claverie , is unambiguous: for a pure state \\rho= \\psi\\rangle\\langle\\psi , W \\psi\\ge 0 everywhere on phase space iff \\psi\\rangle is a Gaussian wavepacket — equivalently a squeezed-displaced vacuum. Nothing in the proof survives convex combinations. The map \\rho\\mapsto W \\rho is linear, so and an incoherent mixture of two Gaussians displaced far apart is manifestly W\\ge 0 while being arbitrarily far from any single Gaussian. The textbook habit of writing \"W\\ge 0\\Leftrightarrow classical\" without the word pure is just wrong, and the error matters because almost every laboratory state is mixed. Two clean counterexamples expose how badly the slogan fails. (a) Two-mode squeezed thermal states. Take the TMST \\rho {AB} — a two-mode squeezed vacuum that has been passed through symmetric thermal channels of mean occupation \\bar n. Its Wigner function is a centred Gaussian with covariance matrix with \\nu = (2\\bar n+1)\\cosh(2r)/?… in any case W\\ge 0 throughout, because every Gaussian state has W\\ge 0. The state is nevertheless entangled whenever the partial-transpose criterion fails, which it does for r above a threshold set by \\bar n. Here is a state with positive Wigner function, non-trivial entanglement, and no classical P-representation in the Glauber–Sudarshan sense. Negativity has missed all of the non-classicality on offer. (b) Photon-subtracted thermal states. Apply \\hat a to a thermal state \\rho {\\rm th}(\\bar n) and renormalise. The resulting state is non-Gaussian, has W that dips below zero near the origin for any \\bar n\u003c\\infty, and yet — as \\bar n\\to\\infty — its operational distance from a classical mixture vanishes in any reasonable metric. The negativity is real but small and decoration; the state's \"non-classicality budget\" lives almost entirely in higher-order moments that negativity does not see. The same Wigner-negativity number can therefore describe a single-photon Fock state (operationally exquisite) and a near-thermal photon-subtracted mixture (operationally banal). The honest summary: for mixed states, W-negativity is sufficient for the strict non-classicality usually meant (no positive P-representation, not a mixture of coherent states) but not necessary for non-classicality in any wider sense — entanglement, non-Gaussianity, or contextuality. Kenfack–Życzkowski's volume \\mathcal N(\\rho)=\\tfrac12\\!\\int(\\, W -W\\,)\\,d^2\\alpha is a useful scalar but it is a witness, not a measure. Abuse 2 — Negativity, non-Gaussianity, nonclassicality, and contextuality conflated These four are equivalent only on the Hudson locus — pure single-mode states. Off it, they peel apart in every direction. Gaussian-mixed thermal states are non-classical (no P\\ge 0) yet have W\\ge 0 and zero non-Gaussianity. Convex mixtures of coherent states displaced on a non-Gaussian distribution are non-Gaussian yet have W\\ge 0. Photon-subtracted Gaussians are non-Gaussian and W-negative but contextually trivial in the operational sense of Spekkens. And in the discrete (qudit) Wigner setting, contextuality is a strictly stronger resource than negativity in odd dimensions and the equivalence holds only under tight operational restrictions — magic-state injection with stabiliser operations [21, 22], or specific CV settings . Four words, four resources, four theorems; the literature treats them as synonyms. Abuse 3 — The detector that eats negativity This is the hardest one, because it dresses an artifact as a result. Model a finite-efficiency photodetector as a beamsplitter of transmission \\eta followed by a unit-efficiency ideal detector, with vacuum entering the unused port. The Wigner function of the mode actually being measured is the Wigner function of the input convolved with the vacuum Wigner of the lost mode: This is Gaussian smoothing on a scale \\sigma \\eta^2=(1-\\eta)/2\\eta. It interpolates between W (\\eta=1) and the Husimi Q (\\eta\\to 0): exactly the s-ordered family of Cahill–Glauber re-read as a physical loss channel. The single-photon Fock state, whose ideal Wigner reaches W(0,0)=-2/\\pi, has its central dip filled in for \\eta\u003c1/2 — the same threshold that appears in the Hudson-type analysis of when a smoothed W first becomes everywhere non-negative. Figure: Finite detection efficiency η implements Gaussian smoothing of the input Wigner function on a scale σ²=(1−η)/2η. For the single-photon Fock state the central dip is preserved only for η above ≈ 1/2; below that the measured W is everywhere non-negative even though the input state's negativity is intact. Any reported W(0) without a deconvolution of the detection POVM is reporting the detector, not the field. The consequence is brutal. A reconstructed W(0,0)\u003c0 measured with \\eta=0.6 does not imply that the same source measured with \\eta=0.4 would still show negativity; it would not. Conversely, the absence of a dip at \\eta=0.4 does not falsify the source. The proper observable is not W {\\rm meas} but the deconvolved input W {\\rm in}, with the detection POVM treated as part of the inverse problem. Direct displaced-parity measurements à la Royer and Banaszek–Wódkiewicz inherit the same convolution through the parity operator's photon-counting decomposition — the parity expectation value at \\eta\u003c1 is the expectation of a Gaussian-smeared parity, which lifts the spectrum off \\{-1,+1\\} and shrinks the achievable extremum of W {\\rm meas} below 2/\\pi. Abuse 4 — Reconstruction artifacts mistaken for physics Inverse-Radon tomography of the kind pioneered by Smithey et al. is unbiased but has unbounded variance in the limit of fine binning. Filtered back-projection or maximum-likelihood pattern-function reconstructions therefore produce a W with sample-driven fluctuations whose excursions below zero scale as 1/\\sqrt{N} in shot number and diverge as the binning is refined. A single dip in a reconstructed Wigner without (a) a quantitative confidence interval on W(0,0), (b) an explicit forward model of the detection POVM, and (c) a check that the negative volume exceeds what one would obtain from reconstructing the smoothed measurement of a known classical state at matched statistics, is not evidence of non-classicality. The proper operational statement What should replace \"negative Wigner equals quantum\" is the following, which is what the theorems actually say. Let \\rho be the state of a single bosonic mode and let \\Lambda \\eta denote the lossy channel of transmission \\eta implemented by the detection chain. Define W \\rho^{(\\eta)}=W {\\Lambda \\eta\\rho}, equivalently the s-ordered quasi-distribution of \\rho with s=2\\eta-1 . Then: (i) W \\rho^{(1)}\u003c0 at some point is sufficient to certify that \\rho has no Glauber–Sudarshan P-representation, and for pure \\rho this is equivalent to \\rho being non-Gaussian [9, 10]; (ii) for mixed \\rho, W \\rho^{(1)}\\ge 0 is consistent with non-classicality, non-Gaussianity, and entanglement ; (iii) any experimental claim of negativity must report \\eta, the deconvolved W \\rho^{(1)}(0,0) with its full uncertainty, and the value of s^ at which the smoothed distribution first becomes everywhere non-negative — call this the negativity-loss budget of the source. Negativity is real, witnessable, and resourceful. It is also fragile, regime-dependent, and detector-coupled. The literature's casual conflation of \"W\u003c0\" with \"quantum\" is the price paid for sixty years of treating Hudson's theorem as a slogan rather than a hypothesis-laden theorem about pure states observed with perfect detectors. The next section turns to the four conceptual conflations that survive even this operational cleanup. Four Conflations the Literature Lives With Four Conflations the Literature Lives With The literature on Wigner negativity carries four distinct concepts under three or four names, used almost interchangeably. The damage is not just rhetorical: theorems whose proofs require one notion get invoked to license claims about another, and \"necessary\" silently upgrades to \"necessary and sufficient\" between paragraphs. The four objects are - N : Wigner-negativity — the statement \\inf {q,p} W(q,p) \u003c 0, equivalently a non-vanishing Kenfack–Życzkowski volume \\nu = \\tfrac{1}{2}\\!\\int( W -W)\\,dq\\,dp 0 . - G : non-Gaussianity — \\rho is not a Gaussian state, i.e. its characteristic function is not the exponential of a quadratic. - C : nonclassicality in the Glauber–Sudarshan sense — the P-function fails to be a bona fide probability density (it is negative, or more singular than a delta). - X : contextuality of an operational theory built on \\rho together with a fixed set of measurements, in the Spekkens / Kochen–Specker sense. Pairwise, none of these implications run both ways for mixed states; for pure single-mode states three of them collapse onto one, which is the source of the confusion. N vs. G: Hudson is a pure-state theorem Hudson (multimode: Soto–Claverie ) proves W \\psi \\ge 0 \\Leftrightarrow \\psi Gaussian. Read as a biconditional this looks like \"\\mathbf{N}\\Leftrightarrow \\mathbf{G}\"; it is not. The theorem fails in both directions for mixed states. Direction \\mathbf{G}\\Rightarrow \\mathbf{N} fails. Take any non-Gaussian pure state \\psi\\rangle with W \\psi taking negative values — a Fock state, a Schrödinger cat — and convolve it with a Gaussian of variance \\sigma^2 \\ge 1/2. The convolution is the partial trace over an ancillary thermal bath of mean photon number \\bar n = \\sigma^2 - 1/2, and the resulting mixed state has W \\rho \\ge 0 everywhere, while remaining manifestly non-Gaussian (its Wigner function is the convolution of a Hermite-polynomial structure with a Gaussian — non-Gaussian but nonnegative). This is the same \"Gaussian smoothing kills negativity\" mechanism that the Cahill–Glauber s-ordered family encodes : at s=-1 one recovers the Husimi Q, nonnegative for every state regardless of how exotic. Direction \\mathbf{N}\\Rightarrow \\mathbf{G} holds trivially — Gaussian states have Gaussian Wigner functions which are positive — but only because every Gaussian state has W\\ge 0. The interesting point is that the converse \\mathbf{G}\\not\\Rightarrow \\mathbf{N} leaves a large class of operationally non-Gaussian mixed states wholly invisible to a negativity test. Photon-subtracted thermal states with sufficient thermal noise sit in exactly this hole, as do the convex hulls of cats studied as toy non-Gaussian resources . C vs. N: Glauber–Sudarshan classical states need not have W \\ge 0, and vice versa The Glauber P-representation writes \\rho = \\int P(\\alpha) \\alpha\\rangle\\langle\\alpha \\,d^2\\alpha with \\alpha\\rangle coherent. A state is called \"classical\" when P is a genuine probability density. The relation to W is a Gaussian smoothing: Thermal squeezed states with low enough squeezing are non-classical in the P-sense (P is more singular than a delta or negative as a tempered distribution), yet they are Gaussian and so W\\ge 0 — so \\mathbf{C}\\not\\Rightarrow \\mathbf{N}. A coherent-state mixture with a very broad classical Gaussian noise on \\alpha is P\\ge 0 (classical) and W\\ge 0 — both criteria agree as they should. But consider a photon-subtracted thermal state \\hat a\\,\\rho {\\rm th}(\\bar n)\\,\\hat a^\\dagger / \\mathrm{Tr}(\\cdots): for moderate \\bar n it has W(0,0)\u003c0 while its P — recovered by anti-normally ordered inverse — is non-classical in the strict sense (not a probability density). In the limit of large thermal noise, however, the negativity is washed out by the Gaussian convolution while the state remains non-classical by P-criteria. So \\mathbf{N} and \\mathbf{C} are independent witnesses, each blind to a regime where the other fires. The textbook claim that \"negative Wigner ⇒ non-classical\" is the only direction that holds, and it is just the contrapositive of \"every classical state has W \\ge 0\", which follows from W being a Gaussian-smoothed P. A useful one-line ordering: \\mathbf{C} \\supsetneq \\mathbf{N} for single-mode states with regular P , \\mathbf{C} \\not\\sim \\mathbf{N} once distributional P is allowed. Schleich's textbook lays out the ordering cleanly; many experimental papers do not. N vs. X: discrete Wigner functions and Spekkens contextuality Gross built a discrete Wigner function W d on (\\mathbb{Z} d)^{2n} for odd-prime d, with marginals on every \"line\" of the discrete phase space equal to the Born-rule probabilities for stabilizer measurements. Stabilizer states have W d \\ge 0; the Clifford group acts as symplectic permutations of phase space. In this discrete setting the parallel to Mari–Eisert / Veitch et al. [15, 25] runs cleanly: W d \\ge 0 together with Clifford operations and stabilizer measurements admits efficient classical simulation, so \\mathbf{N} d is necessary for magic-state quantum advantage. Howard, Wallman, Veitch and Emerson then sharpened this to an equivalence with contextuality — the resource that the GHZ / Mermin no-go statements isolate — under the stabilizer-measurement subtheory : \\mathbf{N} d \\Leftrightarrow \\mathbf{X} in the odd-d stabilizer setting. The equivalence is fragile. It breaks for d=2 (qubits), where rebit subtheories restore it only after restricting to real-valued density matrices and a CSS-like measurement set [21, 22]. For continuous variables, Haferkamp and Bermejo-Vega establish an analogous equivalence between Wigner negativity and contextuality, but again only after fixing an operational scenario — Gaussian measurements with finite-precision binning. Outside these restricted operational regimes, \\mathbf{N} and \\mathbf{X} part company. Contextuality demands a coherent assignment problem across a non-commutative measurement context; negativity is a representational property of one quasi-distribution. A state can be contextual under one measurement set and not another, while W \\rho is an invariant of \\rho. The slogan \"negativity is contextuality\" is therefore a theorem about a triple (\\rho, \\mathcal{M}, \\mathcal{O}) — state, measurements, operations — not about \\rho alone. Treating \\mathbf{N} as a stand-in for \\mathbf{X} outside that triple smuggles in operational assumptions that few experimental papers state. G vs. C, and the four-way diagram Closing the square: \\mathbf{G} and \\mathbf{C} are also distinct. The thermal state \\rho {\\rm th}(\\bar n) is Gaussian and classical (P a positive Gaussian); a coherent state is Gaussian and on the boundary of classicality (P a delta); a squeezed vacuum is Gaussian and non-classical (P a tempered distribution that fails positivity). A Fock state is non-Gaussian, non-classical and Wigner-negative — the only regime in which the four notions agree. A minimal map for mixed states: Witness Pure state criterion Mixed-state status Resource theorem --- --- --- --- \\mathbf{C} (P\\not\\ge 0) \\psi \\ne coherent Strongest; many flavors of singularity Photodetection nonclassicality \\mathbf{G} (non-Gaussian) \\psi not Gaussian Convex set of Gaussians as free Resource theory of non-Gaussianity \\mathbf{N} (W\u003c0 somewhere) \\equiv \\mathbf{G} by Hudson [9, 10] Strictly weaker than \\mathbf{C} and \\mathbf{G} Necessary for CV computational advantage \\mathbf{X} (contextual) depends on (\\mathcal{M},\\mathcal{O}) \\Leftrightarrow \\mathbf{N} d only in restricted scenarios [21, 22, 23] Magic / qudit advantage The single most consequential misuse is the slide from \"\\mathbf{N} necessary \\Rightarrow \\mathbf{N} sufficient\" for quantum advantage, addressed in §7. The second is using \\mathbf{N} as a nonclassicality test for mixed states where \\mathbf{C} is the correct object. The third is invoking \\mathbf{N} d \\Leftrightarrow \\mathbf{X} without naming the measurement set. Each of these conflations has a clean counterexample within the formalism of §3 — and each of them appears in print every month. Negativity as Resource: Mari–Eisert, Veitch, and the Necessity-Not-Sufficiency Trap Negativity as Resource: Mari–Eisert, Veitch, and the Necessity-Not-Sufficiency Trap Two papers in the same year — Mari–Eisert in continuous variables and Veitch–Ferrie–Gross–Emerson in odd-prime dimensions — promoted Wigner negativity from a curiosity into a candidate resource for quantum computational advantage. They are both routinely paraphrased as \"negativity is the resource for quantum computing.\" Both proved something narrower and harder: negativity is necessary for advantage under a specific free-operation class, and the converse is genuinely false. The logical content is one implication, not two, and the noise behaviour shows why the missing direction is not a technicality. What Mari–Eisert actually prove Mari and Eisert work in a multimode bosonic Hilbert space and fix three hypotheses simultaneously : (i) the input state \\rho has a non-negative Wigner function, W \\rho(\\mathbf{x},\\mathbf{p}) \\ge 0; (ii) the evolution is a Gaussian unitary U G — generated by Hamiltonians at most quadratic in \\hat q i,\\hat p i — acting linearly on phase-space coordinates via a symplectic matrix S\\in \\mathrm{Sp}(2N,\\mathbb{R}); (iii) the measurement is described by a POVM whose elements have non-negative Wigner symbols (homodyne, heterodyne, Gaussian-filtered photon counting, but not photon-number resolving detection). Under (i)–(iii), the joint distribution of measurement outcomes is a convolution of two genuine probability densities. The classical algorithm is then trivial in principle: sample \\mathbf{r}\\sim W \\rho, propagate by S, sample \\mathbf{m}\\sim W {E \\mathbf{m}}(S\\mathbf{r}). Mari–Eisert close the loop by showing the sampling can be carried out in time polynomial in mode number and inverse precision, given polynomial-size descriptions of the input Wigner function and the measurement symbol. The theorem is a statement about a triple (state, evolution, measurement). Take away any one of the three non-negativity assumptions — non-Gaussian input, non-Gaussian unitary, non-Gaussian POVM — and the proof breaks. This is why photon counting is the standard non-Gaussian element that re-enables advantage in CV linear optics: its POVM symbols have negativity even when the state does not. What Veitch et al. actually prove The Veitch–Ferrie–Gross–Emerson theorem is the discrete analogue, sharpened by a quirk of odd dimensions . For Hilbert spaces of odd prime dimension d, Gross's discrete Wigner function on the phase space \\mathbb{Z} d \\times \\mathbb{Z} d is uniquely fixed (up to relabelling) by covariance and Clifford-equivariance, and obeys two structural facts: pure stabilizer states have W \\ge 0, and Clifford unitaries permute Wigner points. Veitch et al. add that the Wigner symbols of Pauli measurements are also non-negative. Combining, which is the qudit analogue of Mari–Eisert and a strictly stronger statement than Gottesman–Knill: it covers any non-stabilizer input whose discrete Wigner function happens to remain non-negative (these exist; convex mixtures of stabilizer states are the obvious examples, but bound-magic states sit here too). The proof again is a phase-space Monte Carlo built on the positivity of all three ingredients. For even d — the qubit case — Gross's uniqueness theorem fails and no covariant non-negative-on-stabilizers Wigner function exists. This is the gap the later Raussendorf–Delfosse program patches with rebit phase spaces and contextuality witnesses [21, 22], at the cost of giving up state-independent positivity for stabilizer states. The converse fails — and Gaussian noise is the cleanest witness The implication is one-way. Wigner negativity is necessary for advantage under these free operations; it is not sufficient. Concrete obstruction: Consider a single-mode state \\rho with negative W \\rho — a Fock state \\lvert 1\\rangle, a photon-subtracted squeezed vacuum, an odd cat. Pass it through a Gaussian channel of transmissivity \\eta followed by additive Gaussian noise of variance \\sigma^2. The output Wigner function is the convolution with \\Sigma = (1-\\eta)/2 + \\sigma^2. The Cahill–Glauber identification of the s-ordered family makes the rest immediate: for \\Sigma \\ge 1/2 the channel is the Wigner-to-Husimi smoothing and the output is non-negative for any input. So a finite, controllable amount of Gaussian noise destroys negativity entirely — at which point Mari–Eisert applies and the state is classically simulable in the relevant free-operation class. The advantage promised by negativity has been continuously erased while the state was still manifestly non-classical in every other operational sense (it is still non-Gaussian, still has P-function singularities, still produces sub-Poissonian counting statistics until \\Sigma is large). Negativity is fragile ; the resource-theoretic implication runs in the direction the theorems prove and no further. Photon-subtracted thermal states and weakly squeezed Schrödinger-kitten states are textbook examples: negative-W but with vanishing operational margin against \\Sigma. Kenfack–Życzkowski: a witness, not a monotone The standard scalar measure of \"how much negativity\" is the Kenfack–Życzkowski volume, introduced in 2004 as an \"indicator of non-classicality\" and now ubiquitous in experimental papers. Two cautions that the literature elides. First, \\mathcal{N} {KZ} is defined with respect to the Wigner function W at s=0; for any of the other s-ordered representatives it gives a different number, and below the Husimi threshold the indicator is identically zero — non-classicality measured this way is a property of the chosen quasi-probability, not the state alone. Second, \\mathcal{N} {KZ} is not a monotone under any operationally motivated free-operation set. It can be increased by Gaussian unitaries that squeeze the negative regions to make them taller and narrower; it can be decreased by partial mixing in ways that do not correspond to a free channel; it carries no convertibility content. It is a scalar witness — a positive number whose strict positivity certifies a quantum feature — and nothing more. Calling it a \"measure of negativity\" is correct; calling it a \"measure of the resource\" is not. The monotones that actually behave correctly under Clifford/Gaussian-and-measurement-style free operations are different objects. In the discrete setting, the mana is a faithful monotone under Clifford operations and stabilizer measurements with classical post-processing in odd prime dimension (Veitch–Mousavian–Gottesman–Emerson, 2014) (verify) — it is additive on tensor products, sub-additive under mixing, and admits an operational interpretation in terms of magic-state distillation overhead. In CV, the natural analogue is the Wigner logarithmic negativity which Albarelli, Genoni, Paris, and Ferraro (verify) showed is a monotone under Gaussian unitaries, Gaussian measurements, partial traces, and convex mixing. Both are defined as logarithms of the full L^1 norm — they include the \"+1\" that \\mathcal{N} {KZ} subtracts, and the logarithm is what makes them additive on independent modes. The difference between a witness and a monotone is exactly this: \\log\\lVert W\\rVert 1 governs convertibility under free operations; \\lVert W\\rVert 1 - 1 tells you only that the state is not free. The cleanest one-line summary of the necessity-not-sufficiency trap, then, is structural: Mari–Eisert and Veitch et al. prove non-negativity is a sufficient condition for free simulation, which makes negativity a necessary condition for any computational separation within their free-operation class — and the operationally meaningful \"amount of resource\" is set not by the Kenfack–Życzkowski volume but by the mana / Wigner-logarithmic-negativity hierarchy, which alone respects the convertibility structure the resource theory is built to track. Frontier: Discrete Wigner Functions, Magic, and What Negativity Cannot Tell You Frontier: Discrete Wigner Functions, Magic, and What Negativity Cannot Tell You The phase-space picture migrated to finite dimensions twice: once for pedagogy (Wootters 1987, Gibbons–Hoffman–Wootters 2004) and once, decisively, for resource theory (Gross 2006 (verify)). Gross's theorem is the discrete Hudson: for a single qudit of odd prime dimension d, a pure state has nonnegative Wigner function on the affine plane \\mathbb{Z} d \\times \\mathbb{Z} d if and only if it is a stabilizer state, and the Clifford group is precisely the set of unitaries that preserve nonnegativity of W d. This is what gives the Veitch–Ferrie–Gross–Emerson resource theory its teeth : negativity in W d is necessary for state injection to drive a Gottesman–Knill simulator out of the polynomial regime, and the integrated absolute value — mana — is a faithful, computable, additive magic monotone under stabilizer operations. The even-dimensional fracture The clean odd-prime story has no qubit analogue. There is no Wigner function on \\mathbb{Z} 2^{2n} that is Clifford-covariant, real, and has all stabilizer states nonnegative simultaneously. Three workarounds dominate. Delfosse–Allard Guerin–Bian–Raussendorf use a rebit (real-amplitude) phase space in which contextuality, not negativity, is the sharp resource for magic-state-injected computation; Raussendorf–Browne–Delfosse–Okay–Bermejo-Vega generalise this to a class of qubit Wigner functions and prove a strict implication chain — contextuality \\Rightarrow negativity, with the converse failing. The take-away for fault-tolerant architectures is uncomfortable: in d=2 the resource that survives Clifford noise channels and tracks the boundary of efficient classical simulation is contextuality of the input + measurement assemblage, not negativity of any single quasi-distribution. Quoting \"negativity is the magic\" in the qubit setting is a category error inherited from the odd-prime case. CV magic, monotones, and a vocabulary problem In continuous variables the analogous resource theory is younger and less unique. Albarelli–Genoni–Paris–Ferraro (2018, Phys. Rev. A 98, 052350) proposed the Wigner logarithmic negativity as the CV analogue of mana. It is convex, monotone under Gaussian channels and Gaussian measurements with classical feed-forward, and additive on tensor products — the minimum bar for a resource monotone. It is not , however, faithful in the same operational sense as mana: Gaussian noise erodes \\mathcal{N} W continuously, and the gap between \"\\mathcal{N} W 0\" and \"useful for a CV magic protocol\" can be opened by an arbitrarily lossy channel. Haferkamp and Bermejo-Vega sharpen this by showing that contextuality in CV quantum optics is equivalent to Wigner negativity only under a specific operational restriction (Gaussian effects, displacement-covariant POVMs); outside that fragment the two come apart. Conflation 4 of §6 — \"the Wigner function\" as a singular object — is the live trap here, because different smoothings yield genuinely different resource hierarchies, and the relevant s is rarely stated in CV-magic talks. A second active direction asks whether magic is a bipartite or higher resource. Zhang and Li introduce a \"mutual mana\" in the discrete setting, showing that local magic can be converted into magic correlations via Clifford beamsplitters at a rate strictly below the local content — an effect with no entanglement analogue, since LOCC cannot increase entanglement at all. Whether a CV mutual-Wigner-negativity has comparable structure is open; existing definitions either fail subadditivity or collapse to the entanglement of formation under Gaussian operations. Negativity is not the right entanglement witness — even when it sees it Walschaers, Fabre, Parigi, and Treps showed that for multimode pure non-Gaussian states the marginal Wigner negativity carries strictly less information than the entanglement structure: states with identical \\int W can have entanglement graphs differing by a mode permutation that no scalar negativity can detect. Practically, this means a single-number negativity is the wrong figure of merit for cluster-state-based CV computation; one needs at least the modewise distribution of negativity, and probably its symplectic-eigenvalue decomposition under the covariance matrix. Field deployments — non-Gaussian states transmitted through deployed telecom fibre by Breum et al. — confirm experimentally what theory has been saying for a decade: negativity survives loss only above \\eta \\gtrsim 1/2 for single-photon-subtracted inputs, exactly the threshold that follows from convolving W with the loss-induced Gaussian of variance (1-\\eta)/2\\eta. Detector-robust certification The §5 detector problem — efficiency convolves W into nonnegativity — has its mirror image in the detector's own phase-space representation. Hloušek, Ježek, and Fiurášek certified, model-independently, that single-photon click detectors themselves possess negative Wigner-effect functions; the certification uses only coherent-state probes and a finite set of measured click probabilities, with statistical confidence intervals on W \\Pi(0) rather than a reconstructed surface. This is the right template for any future negativity claim that must be robust to a detection-model: forget the picture, bound W(0,0) (or W \\Pi(0)) with explicit error bars and an explicit POVM, and refuse to call a tomographic dip \"negativity\" unless the bound is significant after deconvolution. The community has been slow to adopt this discipline; many claimed negativities in cavity-QED and circuit-QED papers post-Haroche are tomographic dips without published deconvolution kernels. Bounded-negativity classical simulators Pashayan, Wallman, and Bartlett (PRL 115, 070501) gave the sampling counterpart to Mari–Eisert's necessity theorem: outcome probabilities of a quasi-probability circuit can be estimated to additive error \\varepsilon with sample complexity O(\\mathcal{N}^2/\\varepsilon^2), where is the sum-negativity of the entire circuit's quasi-distribution. This is not the Kenfack–Życzkowski volume \\int W -1 ; the two differ by an additive constant that ma"}</script>

e derivation was jointly his and Szilard's; Szilard's name has been erased from the textbook story. (ii) The algebraic machinery — star-product, no-go theorem, the very notion that W furnishes a faithful representation rather than an ad-hoc trick — is Groenewold's 1946 Utrecht thesis, with Moyal independently constructing the statistical-theory side; both were resisted by Dirac and the orthodox community, and the 'Wigner–Weyl–Moyal' label that now circulates underweights Groenewold systematically. (iii) 'Hudson's theorem' as used in modern multimode CV optics is Hudson (1974) + Soto–Claverie (1983); papers routinely cite only Hudson. (iv) The displaced-parity formula for direct Wigner measurement is Royer 1977 (also Grossmann 1976), but is widely attributed to Banaszek–Wodkiewicz 1996, who acknowledged Royer in subsequent work. (v) Feynman is conventionally credited with normalizing 'negative probability' — Bartlett 1945 had done the work four decades earlier and Feynman's 1987 essay does not cite him. The pattern is consistent: each step was taken once before its now-canonical citation, and the priority claims are documented in the actors' own writing.", "timeline": [{"year": 1932, "event": "Phase-space quasi-distribution W(q,p) published; footnote acknowledges prior unpublished joint derivation with Szilard; negativity noted but not weaponized", "who": "Eugene P. Wigner (with credit to Leo Szilard)", "work": "'On the quantum correction for thermodynamic equilibrium', Phys. Rev. 40, 749", "kind": "formalization", "ref": 1}, {"year": 1945, "event": "Negative probabilities placed on a rigorous footing — characteristic functions allowed to define signed measures", "who": "M. S. Bartlett", "work": "'Negative probability', Proc. Camb. Phil. Soc. 41, 71", "kind": "theory", "ref": 3}, {"year": 1946, "event": "Star product, von Neumann correspondence theorem (no-go on canonical quantization), and the Wigner transform as a complete representation — buried in a Utrecht thesis", "who": "Hilbrand J. Groenewold", "work": "'On the principles of elementary quantum mechanics', Physica 12, 405 (thesis, Utrecht, supervisor Rosenfeld)", "kind": "formalization", "ref": 6}, {"year": 1949, "event": "Phase space recast as a complete statistical theory with Moyal bracket; Dirac corresponded but refused the program", "who": "José Enrique Moyal", "work": "'Quantum mechanics as a statistical theory', Proc. Camb. Phil. Soc. 45, 99", "kind": "formalization", "ref": 7}, {"year": 1969, "event": "s-ordered family unifies P (s=+1), W (s=0), Q (s=−1); makes precise how Gaussian smoothing of W into Q kills negativity", "who": "K. E. Cahill, R. J. Glauber", "work": "'Density operators and quasiprobability distributions', Phys. Rev. 177, 1882", "kind": "theory", "ref": 12}, {"year": 1974, "event": "Pure-state theorem: W ≥ 0 ⇔ state is Gaussian — turning negativity into a sharp witness of non-classicality for pure states", "who": "Robin L. Hudson", "work": "'When is the Wigner quasi-probability density non-negative?', Rep. Math. Phys. 6, 249", "kind": "theory", "ref": 9}, {"year": 1977, "event": "Wigner value at a point identified as the expectation of the displaced parity operator — the conceptual basis for later 'point-wise' measurements", "who": "Antoine Royer", "work": "'Wigner function as the expectation value of a parity operator', Phys. Rev. A 15, 449", "kind": "theory", "ref": 11}, {"year": 1983, "event": "Multimode extension of Hudson's theorem to N pure modes — routinely cited as 'Hudson's theorem' though jointly due to these authors", "who": "F. Soto, P. Claverie", "work": "'When is the Wigner function of multidimensional systems non-negative?', J. Math. Phys. 24, 97", "kind": "theory", "ref": 10}, {"year": 1984, "event": "Hillery–O'Connell–Scully–Wigner consolidate the field; this review (not Wigner 1932) is what most modern authors actually learn from", "who": "M. Hillery, R. F. O'Connell, M. O. Scully, E. P. Wigner", "work": "'Distribution functions in physics: Fundamentals', Phys. Rep. 106, 121", "kind": "revival", "ref": 5}, {"year": 1986, "event": "Bell's EPW essay: a positive Wigner function for the EPR state furnishes a local hidden-variable model — making negativity a necessary condition for Bell violation in CV", "who": "J. S. Bell", "work": "'EPR correlations and EPW distributions', Ann. NY Acad. Sci. 480, 263", "kind": "theory", "ref": 24}, {"year": 1987, "event": "Feynman defends negative probabilities as legitimate intermediate book-keeping; influential in normalizing the language", "who": "R. P. Feynman", "work": "'Negative probability', in Quantum Implications: Essays in Honour of David Bohm, eds Hiley \u0026 Peat (Routledge)", "kind": "theory", "ref": 4}, {"year": 1993, "event": "First tomographic reconstruction of a quantum-optical Wigner function (squeezed vacuum) by inverse Radon — opens the experimental era", "who": "D. T. Smithey, M. Beck, M. G. Raymer, A. Faridani", "work": "'Measurement of the Wigner distribution and the density matrix of a light mode using optical homodyne tomography', Phys. Rev. Lett. 70, 1244", "kind": "observation", "ref": 18}, {"year": 1996, "event": "Direct (un-smoothed) sampling of W at a phase-space point via displaced photon-number parity — the route used by Haroche's cavity-QED group to image cat-state negativity", "who": "K. Banaszek, K. Wódkiewicz", "work": "'Direct probing of quantum phase space by photon counting', Phys. Rev. Lett. 76, 4344", "kind": "theory", "ref": 13}, {"year": 2004, "event": "Operational quantifier — the integrated absolute negativity volume ∫|W|−1 — becomes the standard scalar 'amount of negativity'", "who": "A. Kenfack, K. Życzkowski", "work": "'Negativity of the Wigner function as an indicator of non-classicality', J. Opt. B 6, 396", "kind": "theory", "ref": 20}, {"year": 2012, "event": "Resource theorem: nonnegative Wigner ⇒ efficient classical simulation of CV quantum computation (Mari–Eisert) and of stabilizer/qudit subtheories (Veitch et al.) — negativity is necessary for quantum advantage", "who": "A. Mari \u0026 J. Eisert; V. Veitch, C. Ferrie, D. Gross, J. Emerson", "work": "PRL 109, 230503 and NJP 14, 113011", "kind": "revival", "ref": 15}], "neglected": [{"name": "Leo Szilard", "role": "Co-derived the Wigner distribution in unpublished work with Wigner before 1932; explicitly credited in the footnote of Wigner's own paper ('found by L. Szilard and the present author some years ago for another purpose') yet absent from every textbook attribution", "evidence": "Wigner's footnote in Phys. Rev. 40, 749 itself; Wigner reiterates the joint derivation in his autobiographical recollections", "ref": 2}, {"name": "Hilbrand J. Groenewold", "role": "Built the full phase-space formalism — star-product, von Neumann/no-go theorem on quantization, Wigner transform as faithful representation — in his 1946 Utrecht thesis under Rosenfeld; nearly all 'Wigner–Moyal' machinery is in fact Groenewold's", "evidence": "Physica 12, 405 (1946), reprinted with commentary in Zachos–Fairlie–Curtright's compendium", "ref": 6}, {"name": "José Enrique Moyal", "role": "Independently formulated quantum mechanics as a phase-space statistical theory and identified the bracket that bears his name; Dirac rejected the program in private correspondence and Moyal's contribution was marginalized for two decades", "evidence": "Moyal's 1949 paper; the Moyal–Dirac correspondence is reproduced in Ann Moyal's biography of her father", "ref": 8}, {"name": "M. S. Bartlett", "role": "Made 'negative probability' a coherent mathematical object (signed measures with positive marginals) in 1945 — the conceptual move Feynman is usually credited for forty years later", "evidence": "Bartlett, Proc. Camb. Phil. Soc. 41, 71 (1945)", "ref": 3}, {"name": "F. Soto \u0026 P. Claverie", "role": "Proved the multimode generalization of Hudson's theorem (1983); modern citations to 'Hudson's theorem' in CV quantum optics almost always mean Soto–Claverie's statement", "evidence": "J. Math. Phys. 24, 97 (1983)", "ref": 10}, {"name": "Antoine Royer", "role": "Showed in 1977 that W(α) = (2/π)⟨D(α) P D†(α)⟩ — the parity-expectation identity underlying every direct (un-smoothed) Wigner measurement done since cavity QED experiments began", "evidence": "Phys. Rev. A 15, 449 (1977); rederived independently by Grossmann in the same year and again by Banaszek–Wodkiewicz almost two decades later without initial attribution", "ref": 11}], "conflations": [{"claim": "Wigner negativity = nonclassicality, full stop — applied indiscriminately to mixed states", "clarification": "Hudson's theorem holds only for pure states. Many mixed nonclassical states (e.g. mixtures of two coherent states with classical noise far above shot noise, or thermal squeezed states) have W ≥ 0 yet remain operationally non-classical and even entangled; conversely, photon-subtracted thermal states can be 'classical' in the Glauber–Sudarshan sense (P ≥ 0 in a distributional limit) and still display W-negativity in some regimes. Negativity is a sufficient — not necessary — witness for mixed-state non-classicality, despite the way it is commonly cited."}, {"claim": "Negativity, non-Gaussianity, nonclassicality, and contextuality are interchangeable", "clarification": "For pure single-mode states they coincide via Hudson; for mixed states they part company. Non-Gaussian states can have W ≥ 0 (e.g. convex mixtures of coherent states displaced on a non-Gaussian distribution); Gaussian states are always W ≥ 0 but include thermal mixtures that are 'classical'. Contextuality is a stricter resource than negativity in finite-dimensional Wigner-like representations (Spekkens / Gross discrete-Wigner setting), and the equivalence holds only under specific operational restrictions (Raussendorf, Delfosse, Haferkamp–Bermejo-Vega [29, 34, 36])."}, {"claim": "A reconstructed dip below zero in a tomographic Wigner function proves non-classical input", "clarification": "Inverse Radon and pattern-function reconstructions are unbiased but high-variance; statistical fluctuations can produce sub-zero artifacts. Worse, any finite detection efficiency η acts as a beam splitter with vacuum and convolves W with a Gaussian of width (1−η)/2η — for η below the Hudson-like threshold (≈ 0.5 for single photons) the true negativity is washed out and any remaining dip is a reconstruction artifact. The proper statement requires error bars on W(0,0) and a deconvolution accounting for the detection POVM."}, {"claim": "'The' Wigner function — singular and canonical", "clarification": "The s-ordered Cahill–Glauber family interpolates from P (s=+1, often singular) to W (s=0) to Q (s=−1, always nonnegative). 'Negativity of the quasi-probability' depends on s; the Husimi Q never goes negative for any state because it is a Gaussian-smoothed Wigner function. Comparisons across the literature that ignore which s is in play are not comparing the same object."}, {"claim": "Negativity is the resource for quantum computational advantage", "clarification": "Mari–Eisert and Veitch et al. prove necessity (W ≥ 0 + Gaussian operations + Gaussian measurements ⇒ efficient classical simulation), not sufficiency. There exist negative Wigner states whose advantage is destroyed by added Gaussian noise; contextuality plus negativity is closer to the operational resource in the discrete setting. Saying 'negativity is the resource' is correct only for the necessary-condition half."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins, Footnotes, and the Erased Co-Authors", "markdown": "## Origins, Footnotes, and the Erased Co-Authors\n\nThe textbook story is short enough to fit on a napkin: Wigner wrote down a phase-space distribution in 1932, Moyal turned it into a bracket in 1949, Hudson proved the positivity theorem in 1974, and everything since is application. Every clause of that sentence is either incomplete or wrong about who did the work. The actual pre-history involves four actors — Szilard, Bartlett, Groenewold, Moyal — three of whom were either erased from the standard citation or actively resisted by the orthodox community at the time. What follows is the record as the actors themselves left it, before the textbook redactions.\n\n### Wigner 1932, and the footnote that named Szilard\n\nWigner's \"On the quantum correction for thermodynamic equilibrium\" [1] is, on its surface, a paper about quantum corrections to the classical partition function for a gas of interacting particles. The phase-space distribution\n\n$$W(q,p) = \\frac{1}{\\pi\\hbar}\\int_{-\\infty}^{\\infty} dy\\; \\psi^{*}(q+y)\\,\\psi(q-y)\\,e^{2ipy/\\hbar}$$\n\nis introduced en route, almost as bookkeeping: an object whose marginals reproduce $|\\psi(q)|^{2}$ and $|\\tilde\\psi(p)|^{2}$ and which, when smoothed by $e^{-\\beta H}$, yields the leading $\\hbar^{2}$ correction to the Boltzmann weight. Wigner himself flagged that $W$ \"cannot be really interpreted as a probability of simultaneous values of $q$ and $p$\" because it takes negative values. The negativity is observed, named, and then set aside — the goal was a thermodynamic correction, not a new mechanics.\n\nThe footnote on the first page of [1] is the part that the canonical attribution has quietly dropped. Wigner writes that the expression was \"found by L. Szilard and the present author some years ago for another purpose.\" That \"other purpose\" — never published — concerned the statistical thermodynamics of a quantum gas; the two had derived the kernel jointly, probably around 1929–1931, in connection with information-theoretic questions Szilard was then pursuing in parallel with his demon paper. Wigner reiterates the joint origin in the autobiographical recollections compiled by Szanton [2], where he is unambiguous that Szilard had the formula in hand before its appearance in print. Szilard never claimed credit. The name \"Wigner function\" is a posthumous editorial decision of the community, not a priority statement by either author.\n\nTwo interpretive points follow. First, the 1932 paper does not treat $W$ as a representation of states — it is a calculational tool, and the question of how observables map into it is not posed. Second, the negativity is not yet a quantum signature; Wigner describes it as a feature of the corrected classical distribution, not as a property whose persistence under physical operations might be diagnostic. The conceptual content that we now load onto \"Wigner negativity\" is grafted on later.\n\n### Bartlett 1945: signed measures as legitimate objects\n\nThe next move came from outside physics. M. S. Bartlett, a statistician at Cambridge, asked whether a probability-like object that takes negative values could be given a coherent mathematical status [3]. His answer was technical and decisive: a signed measure with positive marginals along every classical projection is a well-defined object in measure theory; expectations against bounded test functions remain finite; characteristic functions can carry the negativity into a representation where the underlying object is unambiguously normalizable. Bartlett did not write down the Wigner function — his framing was abstract — but he gave the conceptual permission slip that the field needed to take negative quasi-distributions seriously rather than dismiss them as paradox.\n\nFeynman's 1987 essay \"Negative probability\" [4] is the citation that nearly every modern paper uses when it wants to philosophically justify $W \u003c 0$. Feynman does not cite Bartlett. Bartlett's 1945 paper had done the work four decades earlier, with greater rigor and less folkloric framing. The displacement is total: a literature search for the phrase \"negative probability\" in quantum-optics review articles will turn up Feynman more often than Bartlett by a factor of order $10^{2}$. Bartlett's name does not appear in the Hillery–O'Connell–Scully–Wigner review [5] either.\n\n### Groenewold 1946: the formalism that \"Wigner–Moyal\" should have been called\n\nHilbrand Groenewold's Utrecht doctoral thesis [6], supervised by Rosenfeld, is the document in which the phase-space formalism actually becomes a formalism. Three results appear there essentially for the first time, all in the body of one paper:\n\n1. The **star product**, $f \\star g$, that makes the space of phase-space functions into an associative noncommutative algebra reproducing operator multiplication under the Wigner transform.\n2. The **von Neumann–type no-go theorem** on canonical quantization: there is no map $f \\mapsto \\hat f$ from smooth phase-space functions to self-adjoint operators that is linear, takes Poisson brackets to commutators up to order $\\hbar^{2}$, and preserves the algebra of polynomials beyond degree two. This is what is now (wrongly) sometimes called the \"Groenewold–van Hove theorem\"; van Hove's contribution came in 1951, and the foundational statement is Groenewold's.\n3. The proof that the Wigner transform is a **faithful** representation — the map between density operators and Wigner functions is invertible and isometric in the Hilbert–Schmidt inner product, so $W$ is not an approximation or a semiclassical artifact but a complete repackaging of the quantum state.\n\nThese are the three pillars of the Wigner–Weyl–Moyal calculus. None of them is in Wigner 1932. All three are Groenewold's. The thesis was published in *Physica* in the same year, but the journal had limited international circulation in the immediate post-war period, and Groenewold's career stayed in Utrecht rather than crossing the Atlantic; the work was rediscovered piecemeal by Bayen–Flato–Fronsdal–Lichnerowicz–Sternheimer in the 1970s deformation-quantization program. The phrase \"Moyal product\" that one finds throughout the modern literature on deformation quantization is, almost without exception, Groenewold's product. Zachos, Fairlie, and Curtright have argued this point publicly for two decad
