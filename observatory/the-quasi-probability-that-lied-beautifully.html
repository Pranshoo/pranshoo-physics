<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Quasi-Probability That Lied Beautifully", "alternativeHeadline": "Wigner function negativity", "name": "Wigner function negativity", "description": "Wigner-function negativity from Szilard's footnote to the resource theory of magic", "inLanguage": "en", "keywords": ["Wigner function negativity", "Wigner quasi-probability negativity", "phase-space negativity", "Wigner negativity", "negativity of the Wigner distribution", "non-positivity of W(x,p)", "Wigner logarithmic negativity (Kenfack–Życzkowski measure)", "quantum optics"], "about": [{"@type": "Thing", "name": "Wigner function negativity"}, {"@type": "Thing", "name": "Wigner quasi-probability negativity"}, {"@type": "Thing", "name": "phase-space negativity"}, {"@type": "Thing", "name": "Wigner negativity"}, {"@type": "Thing", "name": "negativity of the Wigner distribution"}, {"@type": "Thing", "name": "non-positivity of W(x,p)"}, {"@type": "Thing", "name": "Wigner logarithmic negativity (Kenfack–Życzkowski measure)"}], "articleSection": "quantum optics", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-quasi-probability-that-lied-beautifully.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-quasi-probability-that-lied-beautifully.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Szilard's Footnote, Weyl's Calculus, and the Long Prehistory of a Negative Probability Szilard's Footnote, Weyl's Calculus, and the Long Prehistory of a Negative Probability The standard pedagogical lineage of the Wigner function runs Wigner (1932) → Hudson (1974) → Kenfack–Życzkowski (2004), with Moyal (1949) inserted as the man whose bracket carries dynamics. This is tidy, it is teachable, and it is wrong in at least four places. The object Wigner wrote down was not new in its algebra, not original in its motivating idea, and not unique in its formulation; the negativity that we now treat as the defining feature was, in 1932, a calculational annoyance to be integrated away. The story worth telling is the one in which a footnote, a thesis, a wartime letter, and a refereeing dispute did most of the conceptual work. Weyl 1927: the algebraic substrate By the time Wigner sat down to compute the quantum correction to the classical partition function, the operator–c-number dictionary needed to do so already existed. Hermann Weyl had introduced what we now call the Weyl symbol in Gruppentheorie und Quantenmechanik and in his 1927 Zeitschrift für Physik paper, defining for any sufficiently nice phase-space function a(x,p) the operator i.e., the symmetrically ordered correspondence that promotes e^{i(\\xi x+\\eta p)} to the displacement operator e^{i(\\xi\\hat{x}+\\eta\\hat{p})/\\hbar}. This is the algebraic substrate of every later phase-space quasi-distribution: the Wigner function W is nothing other than the Weyl symbol of (2\\pi\\hbar)^{-1}\\hat{\\rho}. Weyl's project was group-theoretic — to make the canonical commutation relations into a projective representation of \\mathbb{R}^{2n} — and he had no interest in quasi-probabilities. But the formula W=\\mathrm{Symb} {\\mathrm{W}}(\\rho)/(2\\pi\\hbar) is already implicit there; Wigner's contribution five years later was to evaluate this object on a specific class of states and ask whether one could use it as a distribution. That an entire algebraic apparatus precedes the quasi-distribution is rarely communicated in textbook accounts. The pedagogical effect is that students meet W as a clever guess of Wigner's rather than as a specific symbol on a calculus that already existed and would later be completed by Groenewold. Szilard's footnote Wigner's 1932 paper computes in order to express \\mathrm{Tr}(\\hat{\\rho}\\,e^{-\\beta \\hat{H}}) as a phase-space integral whose leading correction in \\hbar recovers the Wigner–Kirkwood expansion. The negativity of W is acknowledged in passing and dismissed: marginals are positive, expectation values are correct, and the question of whether W \"is\" a probability is set aside as physically uninteresting for a thermodynamic computation. What is not dismissed — though it is buried — is the credit. A footnote on the first page states, in Wigner's own words, that the idea of representing the quantum state by a function on phase space was due to Leo Szilard, with whom Wigner had discussed the problem in Berlin. Wigner repeats this attribution in the Hillery–O'Connell–Scully–Wigner review and in his collected works. No Szilard manuscript on the subject survives; the idea, in the sense of a documented derivation, is Wigner's. The idea in the sense of the founding intuition is Szilard's, and the modern habit of speaking of \"the Wigner distribution\" tout court is a small but persistent erasure (verify, for the precise phrasing of Szilard's contribution as transmitted only orally). There is a second silent omission. Wigner's 1932 paper is conventionally read as introducing the quasi-distribution; it is in fact a paper about the quantum correction to a classical equilibrium average. The negativity is not a feature he advertises — it is a defect in an integrand that fortunately integrates to a sensible thermodynamic potential. The reinterpretation of negativity as physically meaningful happens elsewhere, decades later, and against considerable resistance. Bartlett 1945: negative probability as a coherent concept The intellectual move that legitimised W\u003c0 as something one could reason about rather than integrate over was made not by a quantum physicist but by a statistician. M. S. Bartlett's \"Negative probability\" (Proc. Camb. Phil. Soc. 41, 71, 1945) argued that signed measures could appear as intermediate objects in admissible calculations provided only that the marginals on observable events were honest probabilities. Bartlett's framework is exactly the one Wigner needed and did not have in 1932: a quasi-distribution is a linear functional on a function space, not a measure on an event space, and negativity is a feature of the dual pairing rather than of any countable-additivity failure. Bartlett went on to mediate the correspondence between Moyal and Dirac on the statistical interpretation of quantum mechanics, and his framework underpins the modern view of W as the symplectic Fourier transform of a characteristic function rather than as a \"probability that misbehaves\". Bartlett is almost never cited in physics treatments of the Wigner function. He is the single most important missing name on the standard genealogy. Groenewold 1946: the star product and a no-go theorem Hilbrand Groenewold's Utrecht thesis did three things that the textbook story bundles separately or omits. First, it defined the star product making the Weyl symbol map an algebra homomorphism and turning phase-space quantum mechanics into an autonomous formulation rather than a representation trick. Second, it proved the no-go theorem on quantization — that no linear map from classical observables to operators can simultaneously preserve Poisson brackets and irreducibly represent position and momentum — which is now generally cited as \"Groenewold–van Hove\" but which, in its sharpest form, is Groenewold's. Third, it identified the antisymmetric part of \\star as the bracket whose lowest-order term reproduces \\{\\cdot,\\cdot\\} {\\mathrm{PB}}. That bracket would, three years later, acquire someone else's name. Moyal 1949 and the Dirac dispute José Enrique Moyal's Quantum Mechanics as a Statistical Theory reached print in 1949 but had been circulated as a manuscript since 1944 and had been the subject of an unusually hostile correspondence with Dirac, who refereed the paper. Dirac's objection was philosophical: he held that a statistical reading of the wavefunction collapsed the distinction between quantum amplitudes and classical probabilities. Moyal's reply — preserved in the Bartlett–Moyal–Dirac letters reproduced in Ann Moyal's Maverick Mathematician — was that the quasi-distribution and its bracket were consistent precisely because the underlying object was signed. The Moyal bracket that students meet without context is Groenewold's antisymmetric star, rebranded after a priority dispute that the literature has politely forgotten. Moyal's own contribution — the statistical reinterpretation, the moment-generating-function viewpoint, the explicit connection to classical stochastic processes — is independent of Groenewold's and worth its own credit; but the bracket is shared property, and the standard usage erases Groenewold. What the three-name lineage hides Pulled together, the prehistory of W\u003c0 is a four-step inheritance: Weyl gave the calculus, Szilard gave the idea, Wigner computed the object, Bartlett legitimised its sign, Groenewold made it dynamical, Moyal made it statistical. The textbook compression to \"Wigner (1932), Moyal (1949)\" attributes algebra to physics, erases a statistician, obscures a Dutch thesis, and silently resolves a priority dispute in favour of the loser. Hudson's theorem , which we will reach in §3, only makes sense once one has noticed that the object on which it operates was already a composite invention by the time anyone thought to ask whether its sign was physically meaningful. The Object Itself: Weyl Symbols, the Star Product, and W as a Displaced-Parity Expectation The Object Itself: Weyl Symbols, the Star Product, and W as a Displaced-Parity Expectation The Wigner function is not, in its native habitat, a probability density that someone forgot to normalize. It is a symbol — in the precise sense Weyl gave the word in 1927 — the c-number image of an operator under an isomorphism of vector spaces that intertwines the noncommutative product on \\mathcal{B}(L^2(\\mathbb{R})) with a noncommutative product on C^\\infty(\\mathbb{R}^2). Everything that looks paradoxical about W — the negative values, the unbounded oscillations on sub-Planck scales, the failure of Bayes' rule — is a consequence of refusing to treat it as anything else. The Weyl correspondence and the characteristic function Fix one bosonic mode with [\\hat x,\\hat p]=i\\hbar. Weyl's prescription [archive entry implicit; not in corpus] assigns to a phase-space function a(x,p) the operator i.e. one symmetrizes the exponential — the only ordering compatible with linearity, reality, and covariance under the metaplectic action. The inverse map, \\hat A\\mapsto a, is the Weyl symbol . The Wigner function is the Weyl symbol of the density operator, normalized so that \\int W\\,dx\\,dp=\\mathrm{Tr}\\,\\hat\\rho: The equivalent — and structurally cleaner — formulation runs through the characteristic function \\chi(\\xi,\\eta)=\\mathrm{Tr}\\bigl[\\hat\\rho\\, e^{i(\\xi\\hat x+\\eta\\hat p)}\\bigr]. Then a symplectic Fourier transform. Two consequences are immediate. First, W(x,p) \\le 1/(\\pi\\hbar): the same Cauchy–Schwarz bound that makes W uniformly bounded also forbids it from concentrating into a delta — it cannot mimic a sharp classical point, which is the technical reason a phase-space cell of area \\hbar is the natural resolution. Second, the marginals are true probability densities, but no integral of W over a general phase-space region is, in general, in . Treating W as a joint density and applying classical inference is the source of the standard paradoxes . The Moyal star product and the Groenewold–van Hove obstruction The Weyl correspondence transports operator multiplication into the Moyal star product on symbols, and its antisymmetrization, the Moyal bracket , which reduces to the Poisson bracket at leading order in \\hbar. The dynamics of W is then a \\hbar-deformation of Liouville's equation. The history here is not the textbook story of \"Wigner 1932 → Moyal 1949\". Groenewold's 1946 Utrecht thesis contains both the star product and the obstruction theorem usually filed under \"Groenewold–van Hove\": no Lie-algebra homomorphism from (C^\\infty(\\mathbb{R}^2),\\{\\cdot,\\cdot\\} {\\text{PB}}) into the operator commutator algebra exists beyond polynomials of degree \\le 2. This is what forces ordering ambiguity into quantization and what gives the Moyal bracket its O(\\hbar^2) corrections any nontrivial content. Moyal's 1949 paper was the independent rediscovery — refereed hostilely by Dirac, who disliked the statistical reinterpretation — and brought the formalism into the Anglophone literature. The s-ordered family: P, W, Q as one Gaussian flow Cahill and Glauber (1969) (verify) parametrized the operator-ordering ambiguity with a single real parameter s\\in[-1,1]. The s-ordered quasi-distribution is the symplectic Fourier transform of \\chi(\\xi,\\eta)\\,e^{s(\\xi^2+\\eta^2)/4} (in dimensionless quadratures). The three canonical points are s name ordering regularity --- --- --- --- +1 Glauber–Sudarshan P normal distributional, can be highly singular \\;\\;0 Wigner W symmetric (Weyl) bounded, can be negative -1 Husimi Q antinormal smooth, \\ge 0 for every \\hat\\rho Moving in s is Gaussian convolution: W = P \\ast G {1/2}, \\;Q = W \\ast G {1/2} = P \\ast G {1}, where G \\sigma is the isotropic Gaussian of variance \\sigma per quadrature. This single fact organizes most of the conflations in §4: the more one smooths, the less nonclassicality survives, and at s=-1 everything has been smoothed away — which is why Q\\ge 0 carries no information about classicality, and why detector inefficiency \\eta\u003c1 converts an observed W into a partially Husimi-smoothed object with variance (1-\\eta)/(2\\eta) added per quadrature. Figure: The Cahill–Glauber s-ordered family viewed as a one-parameter Gaussian convolution semigroup. P-singularity is the strongest nonclassicality witness, W-negativity is strictly weaker, and Q-positivity is content-free; detector loss with efficiency \\eta enters as an extra convolution that pushes the displayed distribution toward the Husimi end. Royer's identity: W as a displaced-parity expectation The single formula that turns W from a calculational device into a measurable observable is Royer's 1977 identity : with \\hat\\Pi=\\sum n (-1)^n n\\rangle\\langle n the photon-number parity and \\hat D(\\alpha)=\\exp(\\alpha\\hat a^\\dagger-\\alpha^ \\hat a) the displacement operator, (with \\hbar=1, dimensionless complex \\alpha=(x+ip)/\\sqrt 2). W(\\alpha) is the expectation of a bounded Hermitian operator with spectrum \\{+1,-1\\} : its values are quantum expectation values of a parity observable measured after displacing the state by -\\alpha. Two consequences flow from this. First, W(\\alpha) \\le 2/\\pi is now manifest as \\langle\\hat\\Pi(\\alpha)\\rangle \\le 1. Second, every \"direct\" or point-wise measurement of W in cavity QED (Bertet et al., Deléglise et al.) and in circuit QED (Vlastakis et al., Wang et al.) (verify) is, operationally, a parity readout following a controlled displacement; the older homodyne route reconstructs W via the Radon transform on the marginals [8, 9], but Royer's identity is what makes the pointwise protocol exist. Negativity is, in this language, the statement that there exists a phase-space point \\alpha at which the quantum parity expectation is negative — i.e., the displaced state has more weight on odd Fock numbers than on even. That is the gauge-invariant fact the rest of the dossier will track: the inequalities Hudson's theorem proves about, the experimental dip Smithey could not yet see and Lvovsky did, the resource the Mari–Eisert simulation theorem consumes. Hudson's Theorem and What It Does Not Say Hudson's Theorem and What It Does Not Say By the early 1970s the Wigner function had been around for forty years, the star product for nearly thirty, and yet no clean theorem existed that turned W \u003c 0 into a structural statement about the state. The folklore — that nonclassicality \"shows up\" as negativity — was a slogan in search of a proof. Robin Hudson supplied one, in three pages, in 1974 . The result is sharper and narrower than the way it is usually quoted. The theorem, stated honestly Hudson (1974). Let \\psi \\in L^2(\\mathbb{R}) be normalized and let W \\psi be its Wigner function. Then W \\psi(x,p) \\geq 0 for all (x,p) if and only if \\psi is a Gaussian wavefunction , i.e. Every word matters. Pure state : W \\psi is the Wigner symbol of a rank-one projector \\psi\\rangle\\langle\\psi . Gaussian : complex quadratic exponent, hence a coherent or squeezed state up to displacement and phase. The \"if\" direction is the elementary calculation: the Wigner transform of a Gaussian is a Gaussian on \\mathbb{R}^2, manifestly nonnegative. The \"only if\" direction is the content. Proof sketch (Hudson's argument, modernized) Suppose W \\psi \\geq 0. Hudson's trick is to look at the Wigner characteristic function , the symplectic Fourier transform which is the expectation of a displacement operator. Two facts collide. (a) Because W \\psi \\geq 0 and \\int W \\psi = 1, the function W \\psi is a bona fide probability density on \\mathbb{R}^2, so \\chi \\psi is the characteristic function of a probability measure. By Bochner's theorem \\chi \\psi is of positive type : for any finite collection \\{(\\xi k,\\eta k)\\} the matrix \\chi \\psi(\\xi k-\\xi \\ell,\\eta k-\\eta \\ell) is positive semidefinite. (b) Independently, \\chi \\psi is the matrix element of a unitary displacement operator on a pure state. A direct calculation gives the modulus bound and one shows that \\chi \\psi extends to an entire function of order \\leq 2 in the complex variables (\\xi,\\eta), with Gaussian growth on the real axis. Combining (a) and (b): an entire function of order 2 that is also the characteristic function of a probability measure must, by Marcinkiewicz's theorem (1939), be the exponential of a polynomial of degree at most 2. Hence so the underlying W \\psi is Gaussian and the wavefunction \\psi is Gaussian as well. Marcinkiewicz's theorem is doing the real work; Hudson's contribution was to recognize that the unitarity of displacements forces the order to be exactly 2, closing the loophole that distinguishes Wigner functions from arbitrary characteristic functions. Soto–Claverie (1983): the multimode statement actually used in CV optics Hudson wrote the theorem for one degree of freedom. The natural generalization to \\mathbb{R}^{2n} — every pure multimode state with W \\geq 0 is a multimode Gaussian — is not a trivial corollary, because Marcinkiewicz's theorem is delicate in higher dimensions. Soto and Claverie filled the gap , showing that for pure \\psi \\in L^2(\\mathbb{R}^n), This is the version actually invoked in continuous-variable quantum optics, in CV cluster-state computing, and in the Mari–Eisert simulation theorem . Textbooks routinely cite \"Hudson 1974\" for the multimode result; the correct citation is \"Hudson 1974 + Soto–Claverie 1983.\" The Hillery–O'Connell–Scully–Wigner review is one of the few standard references that names both. Gross (2006): the finite-dimensional analogue In odd prime power dimension d, Wootters's discrete phase space \\mathbb{Z} d \\times \\mathbb{Z} d supports a covariant Wigner function W \\rho(q,p) with all the right marginals. Gross proved the discrete Hudson theorem: Stabilizer states are the discrete Gaussians — they are the orbit of the computational basis under the Clifford group, which is precisely the finite-dimensional metaplectic representation. The proof again exploits a uniqueness theorem (here, the structure of the discrete Heisenberg–Weyl group) to force a quadratic exponent on the discrete characteristic function. This is the result that turns \"negativity is necessary for quantum advantage\" into a sharp statement for qudit circuits and underwrites the entire magic-state resource theory developed by Veitch, Ferrie, Gross, Emerson and successors. It also explains why d must be odd : in even dimension there is no covariant nonnegative Wigner function for stabilizer states, and the analogue fails — a point we will return to in §8. What the theorem does not say The pure-state hypothesis is not cosmetic. Drop it and every direction of the equivalence breaks. Counterexample 1 — mixed non-Gaussian states with W \\geq 0. Bröcker and Werner (1995) constructed explicit mixed states whose Wigner function is everywhere nonnegative but which are not convex combinations of Gaussians; Mandilara, Karpov and Cerf (2009) gave a constructive family. These states are nonclassical by the P-representation criterion yet have W \\geq 0. Hudson does not forbid them. Counterexample 2 — Wigner-positive mixtures of Wigner-negative pure states. The thermal-photon mixture \\rho = \\sum n p n n\\rangle\\langle n with sufficient noise has W \\geq 0 even though each n\\rangle for n \\geq 1 has W \u003c 0. The \"if\" direction of Hudson — Gaussian pure \\Rightarrow W \\geq 0 — has no mixed-state converse: positivity of W on a mixed state does not imply the state is a Gaussian mixture. Counterexample 3 — non-Gaussian channels acting on Gaussians. A photon-number-resolving measurement on one arm of a two-mode Gaussian state yields a heralded mode whose Wigner function is, generically, non-Gaussian and negative . The non-Gaussianity comes from the measurement, not the input — confirming that Gaussianity of the prepared state is the controlled assumption in Hudson, not a property of the dynamics. Counterexample 4 — degenerate Gaussians. Hudson tacitly assumes \\operatorname{Re}(a) 0, i.e. a normalizable Gaussian. Improper \"Gaussians\" with \\operatorname{Re}(a) = 0 (position eigenstates, momentum eigenstates) are not in L^2(\\mathbb{R}) and do not have Wigner functions in the usual sense; they sit outside the theorem. The mixed-state failure is the most consequential. Several modern claims — \"we observed W \\geq 0, therefore the state is classical-Gaussian\" — silently promote Hudson from a pure-state to a mixed-state statement and are simply wrong. The correct mixed-state question is whether \\rho lies in the convex hull of Gaussian pure states; this is the Wigner-positive but classically simulable class identified by Mari–Eisert , and it is strictly larger than the Gaussian mixed states. The boundary is the resource-theoretic object that §7 will dissect. The theorem, then, does one thing very cleanly: it pins nonnegativity of W to Gaussianity for pure states . Everything past that boundary — mixed-state nonclassicality, simulability, contextuality, magic — requires more than Hudson. It requires the language assembled in 2006–2012, to which we turn after first cataloguing the conflations that occupy the intervening literature. Use and Abuse: Six Conflations That Pollute the Modern Literature Use and Abuse: Six Conflations That Pollute the Modern Literature Four decades of nomenclature drift have left \"Wigner negativity\" doing work it cannot do. The phrase appears in talks as a synonym for non-Gaussianity, for nonclassicality, for contextuality, for entanglement, and — in the worst cases — for a probability that one is then invited to condition on. The Hillery–O'Connell–Scully–Wigner review already warned, in 1984, that the s-ordered family makes most of these identifications regime-dependent; the warning did not survive the textbook treatment. What follows is a triage of six confusions, each stated as it actually appears in the literature, with the regime in which it happens to be locally true. 4.1 \"W\u003c0 is THE signature of non-classicality\" Hudson's theorem , and its multimode extension by Soto and Claverie , establishes a sharp equivalence between W\\ge 0 and Gaussianity for pure states . The slide from \"pure states with W\\ge 0 are Gaussian\" to \"states with W\\ge 0 are classical\" is a quantifier error. Counterexamples come in two flavours. (i) Mixed non-Gaussian states with W\\ge 0: take a single-photon Fock state 1\\rangle\\langle 1 and mix it with vacuum, which is everywhere non-negative once \\eta\\le 1/2, yet the state is non-Gaussian and is nonclassical in the Glauber–Sudarshan sense for any \\eta 0. (ii) Squeezed thermal states, which have W\\ge 0 Gaussian (so on Hudson grounds look \"free\") but whose P representation is a tempered distribution that is not a probability density — the textbook nonclassicality of squeezing lives entirely in W\\ge 0 territory. Where the slogan happens to be right: for pure CV states, and inside the resource-theoretic accounting where the free operations are Gaussian and classical mixing is allowed . There W\\ge 0 is exactly the free set. 4.2 \"Wigner negativity = non-Gaussianity\" This is the same conflation in a different disguise, and it is widespread in the multimode quantum-optics literature where non-Gaussian state engineering is the experimental currency . For pure states the equivalence is Hudson–Soto–Claverie and is clean. For mixed states it fails in both directions: - A non-Gaussian mixed state may have W\\ge 0 (the \\eta=1/2 Fock–vacuum mixture above; convex combinations of widely separated coherent states; any state in the convex hull of coherent states, which is by definition P-positive and therefore W\\ge 0). - A Wigner-negative state passed through a Gaussian loss channel of transmissivity \\eta has its Wigner function convolved with a Gaussian of variance (1-\\eta)/(2\\eta) per quadrature; below a state-dependent \\eta {\\rm c} the convolution erases the negativity, but the output is still non-Gaussian — non-Gaussianity is invariant under Gaussian unitaries and decreases under Gaussian channels, but it does not vanish at the same threshold where negativity does . Walschaers and collaborators have made the multimode version of this distinction operational : entanglement structure and negativity structure of non-Gaussian states are independent axes, and conflating them produces wrong predictions for which beamsplitter networks generate useful resources. 4.3 \"P-singularity and W\u003c0 are the same nonclassicality criterion\" The s-ordered family W s interpolates between Glauber–Sudarshan P (s=+1), Wigner W (s=0), and Husimi Q (s=-1), each obtained from the next by Gaussian convolution of variance (s'-s)/2. Nonclassicality at level s is strictly stronger than nonclassicality at level s-2: P failing to be a probability density is weaker than W\u003c0, which is weaker than Q\u003c0 (which never happens). Concretely: the squeezed vacuum has W\\ge 0 Gaussian and a P that is a derivative of a delta — singular, not a probability — so it is \"P-nonclassical\" but Wigner-positive. The single-photon state has both P highly singular and W(0)=-2/\\pi. The cat state \\alpha\\rangle+ -\\alpha\\rangle has W negativity at the origin of order 2/\\pi regardless of \\alpha , but its P is more singular still. Reading P-singularity arguments (Mandel, Glauber) and W\u003c0 arguments (Kenfack–Życzkowski , Mari–Eisert ) as the same criterion misranks every borderline state and is a recurring error in homodyne tomography papers. 4.4 \"Detector inefficiency that erases the dip proves the state became classical\" Detector efficiency \\eta\u003c1 acts on the reconstructed Wigner function as Gaussian convolution with kernel variance (1-\\eta)/(2\\eta). For n\\rangle the central value satisfies W(0)\u003c0 iff \\eta n/(2n+1); for n=1 the threshold is \\eta=1/2. Above the threshold one sees a dip; below, the reconstruction is non-negative everywhere — not because the state is classical , but because one is looking at the Husimi-side of the smoothing axis. Lvovsky et al. state the inversion explicitly: their reported W(0)\\approx -1/\\pi is after loss correction, the raw reconstruction is positive. Reports of \"loss of nonclassicality\" that do not name \\eta and the smoothing kernel are unfalsifiable. This is the Husimi trap viewed from the experimental side: Gaussian smoothing is the same operation as moving toward Q, and Q\\ge 0 for all states . 4.5 \"W is a probability density that just happens to go negative\" W is the symplectic Fourier transform of the characteristic function \\chi(\\xi,\\eta)=\\mathrm{Tr}\\bigl[\\rho\\,D(\\xi+i\\eta)\\bigr]; equivalently, by Royer , which is the expectation value of a bounded operator with spectrum \\pm 2/\\pi. The marginals along any quadrature are bona fide probability densities; W itself is not countably additive on phase-space cells of area less than \\hbar, and applying Bayes' rule, rejection sampling, or any classical conditioning to W produces nonsense at sub-Planck scales. The slogan \"negative probability\" — Bartlett's coinage, Wigner's footnote pointing at Szilard — is a calculational device, not an ontological commitment, and Spekkens's operational argument later made the precise sense in which the negativity is not removable by reinterpretation. 4.6 \"Vidal–Werner entanglement negativity is Wigner negativity\" A periodic name collision: entanglement negativity is \\mathcal{N}(\\rho)=(\\Vert\\rho^{T B}\\Vert 1 - 1)/2, a partial-transpose monotone on a bipartite Hilbert space, with no phase-space content. Wigner negativity is \\nu(\\rho)=\\int W(x,p) \\,dx\\,dp - 1 , a single-mode (or multimode) phase-space integral. The two coincide only by accident of vocabulary; there is no general inequality between them. 4.7 \"Q\\ge 0 certifies the Q-positive states as classical\" Q\\ge 0 is universal — it holds for n\\rangle, for cats, for GKP states, for every density operator . Treating Q-positivity as a nonclassicality criterion empties the word. What carries content in Q is the rate of approach to a delta (equivalent to P-representability) and the existence of sub-Planck structure \\Delta x\\Delta p \\ll \\hbar that survives the Gaussian smoothing. Claim True regime False regime --- --- --- W\\ge 0\\Rightarrow classical pure CV states mixed states; squeezed thermal W\u003c0\\Leftrightarrow non-Gaussian pure states (Hudson, Soto–Claverie) mixed states either way P singular \\Leftrightarrow W\u003c0 never strictly always: P is strictly weaker No dip \\Rightarrow classical \\eta=1 ideal detection any \\eta\u003c\\eta {\\rm c}(\\rho) W is a probability quadrature marginals only joint phase-space inference Negativity = entanglement negativity none always — different objects Q\\ge 0 \\Rightarrow classical never always Six confusions, one mechanism: each substitutes a necessary condition for a sufficient one, usually by quietly promoting a pure-state theorem to mixed states or a single s-slice to the whole family. The resource-theoretic frameworks of §7 are precisely the apparatus that refuses these substitutions. From Smithey to Lvovsky to Circuit QED: Seeing the Dip From Smithey to Lvovsky to Circuit QED: Seeing the Dip By the late 1980s the Wigner function had a clean operational identity (Royer's displaced parity ) and a clean nonclassicality theorem (Hudson , extended by Soto–Claverie ), but no one had ever drawn one from data. The obstruction was not conceptual — Bertrand and Bertrand had already supplied the inversion formula — but technological: balanced homodyne detection of a stable local oscillator at the shot-noise limit, with phase control good enough to bin quadratures by \\theta at the few-percent level, only became routine in the Raymer group at Oregon around 1992. The Bertrand–Bertrand identity Bertrand and Bertrand (Found. Phys. 17, 397, 1987) (verify) observed that the marginal of W along the rotated quadrature x \\theta = x\\cos\\theta + p\\sin\\theta, is the Radon transform of W over \\theta\\in[0,\\pi). Inversion is the filtered back-projection familiar from X-ray CT, with \\tilde{\\mathrm{pr}} the Fourier transform of the marginal in x \\theta. The \\xi ramp filter is precisely the high-frequency amplification that the better-known Vogel–Risken paper (Phys. Rev. A 40, 2847, 1989) (verify) re-derived two years later in a purely quantum-optical language. Vogel and Risken are credited in the experimental literature; Bertrand and Bertrand were mathematicians publishing in Foundations of Physics , and the discoverability gap is a textbook example of community walls in citation. Smithey 1993: the apparatus, not the dip The first reconstruction was performed by Smithey, Beck, Raymer, and Faridani at Oregon on a pulsed squeezed vacuum produced by degenerate parametric down-conversion . They binned \\sim 4\\times 10^5 homodyne samples into \\sim 27 phase bins across [0,\\pi), applied filtered back-projection, and obtained a Wigner function that was an elongated Gaussian with minor-axis variance below shot noise by roughly 0.5 dB. The reconstructed W was nowhere negative. This is structural, not anecdotal: a squeezed vacuum is a Gaussian pure state, so Hudson's theorem guarantees W\\ge 0. What Smithey et al. demonstrated was the inversion machinery itself, and the marginal-by-marginal calibration of an apparatus capable, in principle, of resolving sub-Planck features. Their efficiency budget — detector quantum efficiency \\eta d \\approx 0.85, mode-matching visibility \\mathcal{V}\\approx 0.78, propagation \\approx 0.97 — combined to an effective \\eta \\approx 0.55. They reported quadratures without deconvolving \\eta: the published W is the Wigner function of the lossy-channel output, which for Gaussian inputs is simply a more thermalised Gaussian. Because there is no negativity to lose, the lack of correction is harmless. It would be catastrophic for the next experiment. The 2000/2001 priority question The first directly observed W\u003c0 is the subject of a genuine, unresolved priority dispute. Nogues, Rauschenbeutel, Osnaghi, Brune, Raimond, Haroche (Phys. Rev. A 62, 054101, 2000) (verify) measured a quantity proportional to the Wigner function of a single-photon Fock state stored in a high-Q microwave cavity, using a circular-Rydberg atom as a parity probe in the spirit of Lutterbach–Davidovich (Phys. Rev. Lett. 78, 2547, 1997) (verify). They reported W(0)\u003c0 for the 1\\rangle Fock state at the few-sigma level, with the central value consistent with the ideal -2/\\pi \\approx -0.637 after correction for thermal background (\\bar n\\approx 0.1) and Ramsey contrast. Lvovsky, Hansen, Aichele, Benson, Mlynek, Schiller performed full optical-homodyne tomography of a heralded single photon from a pulsed parametric down-converter, recovering a Wigner function whose value at the origin was W(0,0) = -0.13 \\pm 0.01 in the raw reconstruction, and W(0,0)\\approx -1/\\pi \\approx -0.318 after efficiency correction with \\eta\\approx 0.55 (detector QE \\times mode-matching \\times trigger conditioning). Figure: The two 2000–2001 experiments observed W\u003c0 on physically distinct modes by inversion procedures with different epistemic content. Nogues et al. read W(\\alpha) pointwise from atomic populations at chosen displacements; Lvovsky et al. inverted a full Radon transform of an optical mode. The priority question is therefore not \"who saw negative first\" but \"what counts as seeing W.\" If W is defined by Royer's displaced-parity identity W(\\alpha)=(2/\\pi)\\langle D(\\alpha)\\Pi D^\\dagger(\\alpha)\\rangle , then Nogues et al. measured it directly at a discrete set of \\alpha — no inversion, no smoothing kernel, no efficiency deconvolution beyond a thermal-occupation correction. If W is defined as the symplectic Fourier transform of the characteristic function reconstructed from homodyne marginals of a propagating field, then Lvovsky et al. were first to a full reconstruction. The two communities tend to cite themselves; the historically honest statement is \"first directly observed in cavity QED (Nogues 2000), first tomographically reconstructed on a propagating optical mode (Lvovsky 2001).\" Efficiency and the threshold for seeing the dip Lvovsky's raw -0.13 versus corrected -0.318 is the entire pedagogical point of §6: detector inefficiency acts on W as Gaussian convolution of variance \\sigma^2 = (1-\\eta)/(2\\eta), so for 1\\rangle the reconstructed W(0,0) has the closed form A more useful way to write it: for the Fock state n\\rangle the central value W \\eta(0,0) = (-1)^n(2/\\pi)(2\\eta-1)^n for \\eta 1/2, crossing zero at \\eta=1/2 and never returning negative for any finite loss below threshold. Lvovsky's \\eta\\approx 0.55 left him a W(0,0)\\approx-(2/\\pi)(0.1)\\approx -0.064 before mode-matching and trigger-conditioning factors; the published -0.13 implies they reported the negativity of an inferred state that had been partially corrected for finite trigger purity but not for the lossy channel itself. Whether one reports the raw reconstruction, the channel-deconvolved state, or both is the central ethical question in Wigner-tomography papers from this period. From Lutterbach–Davidovich to circuit QED Lutterbach and Davidovich (1997) (verify) recast Royer's identity into an experimental protocol: prepare a cavity in state \\rho, displace by \\alpha, send a two-level probe through the cavity for an interaction time \\tau such that \\chi\\tau = \\pi (dispersive coupling \\chi), and read the probe's z-population. The probe's excited-state probability is P e(\\alpha) = \\tfrac{1}{2}[1 + \\pi\\, W(\\alpha)/2], returning W(\\alpha) scan-by-scan with no inversion and no efficiency-deconvolution kernel — only an overall contrast factor. This is now the dominant cavity-Wigner protocol in superconducting circuits. Vlastakis et al. (Science 342, 607, 2013) (verify) used dispersive coupling of a transmon to a 3D microwave cavity to map the Wigner functions of cat states \\alpha\\rangle + -\\alpha\\rangle with \\alpha ^2 up to \\sim 110 photons, resolving the central interference fringe with W\u003c0 at the percent level. Sun et al. (Nature 511, 444, 2014) (verify) read out W stroboscopically to track decoherence of cat states with Ramsey-like protocols. The Schoelkopf and Devoret groups' subsequent bosonic-code work — Ofek et al. (2016) (verify) on break-even cat-code memories, Campagne-Ibarcq et al. (2020) (verify) on GKP — uses the same Lutterbach–Davidovich primitive to certify state preparation: a negative dip in the right place is the experimental signature that the codespace is being populated. The lineage is therefore not Wigner \\to Smithey \\to Lvovsky \\to circuit QED as a single line of inheritance. It bifurcates at 1977: Royer's parity identity feeds the cavity/circuit-QED branch via Lutterbach–Davidovich and was first deployed by Nogues; Bertrand–Bertrand's Radon inversion feeds the homodyne branch via Smithey and was first pushed to negativity by Lvovsky. Both branches needed efficiency \\eta 1/2 for a single photon, and both, by 2001, had it. Detector Efficiency, Smoothing Kernels, and the Husimi Trap Detector Efficiency, Smoothing Kernels, and the Husimi Trap By 2001 the negative dip was no longer a theoretical curio — Lvovsky's heralded Fock state had put W(0,0) \\approx -1/\\pi on a single-channel oscilloscope trace . What followed in the decade after was a quieter, less glamorous discovery: that the dip is fragile in a very specific, calculable way, and that the standard reporting practice — \"we measured W and saw negativity\" — hides three independent layers of inference (loss, smoothing, regularization) each of which can manufacture or destroy a sign change without anyone noticing. This section is the accounting of those layers. The loss channel as a Gaussian convolution The starting point is the pure-loss channel \\mathcal{L} \\eta, which models a beam-splitter of transmissivity \\eta with vacuum at the unused port — equivalently, the action of a detector of quantum efficiency \\eta. On the level of characteristic functions \\chi(\\lambda) = \\mathrm{tr}\\,\\rho\\,D(\\lambda) the channel acts as \\chi(\\lambda) \\to \\chi(\\sqrt{\\eta}\\,\\lambda)\\,\\exp\\!\\left[-\\tfrac{1-\\eta}{2} \\lambda ^2\\right], and the corresponding map on the Wigner function is a rescaling followed by Gaussian convolution. After absorbing the dilation \\alpha \\to \\alpha/\\sqrt{\\eta} into the coordinates — which is what an experimentalist who normalizes to the reconstructed shot noise does automatically — the reconstructed Wigner function is This is the relation usually quoted as \"loss smooths W.\" The variance \\sigma^2 interpolates monotonically between two named distributions of the s-ordered family : \\sigma^2 = 0 at \\eta = 1 (the true W, s=0) and \\sigma^2 = 1/2 at \\eta = 1/2, where W \\eta becomes precisely the Husimi Q function (s=-1). Half-efficient detection is not \"approximately the Wigner function with extra noise\"; it is exactly the Husimi function on the unmagnified mode. Anything below \\eta = 1/2 is worse than Q, i.e. lies outside the convex hull of the s-ordered family on the negative-s side, and is positive for every quantum state. State-dependent efficiency thresholds For a Fock state n\\rangle the Wigner function is with L n the Laguerre polynomial. The Gaussian convolution above acts diagonally in the photon-number basis on the density operator, mapping n\\rangle\\langle n to a binomial mixture \\sum k \\binom{n}{k}\\eta^k(1-\\eta)^{n-k}\\, k\\rangle\\langle k . The reconstructed W at the origin then evaluates cleanly: The dip survives — W \\eta^{(n)}(0) \u003c 0 — iff n is odd and \\eta 1/2, or n is even and… never (the origin value is positive for 0\\rangle, 2\\rangle, 4\\rangle… because their underlying W is already positive at the origin). The clean \"\\eta 1/2 to see negativity in 1\\rangle\" rule is the n=1 instance of this identity, originally pinned down in this form by Leonhardt and Paul in the mid-1990s and rediscovered by everyone who has since tried to certify a single photon. For higher Fock states the origin is a misleading test point — the dominant negativity of n\\rangle lives in the outer rings of L n, not at \\alpha = 0. A more honest figure of merit is the threshold above which some point of W \\eta^{(n)} goes negative. A standard calculation (extremize W \\eta^{(n)} over \\alpha for the mixed-state representation above) gives the asymptotic threshold so 2\\rangle needs \\eta 4/5, 5\\rangle needs \\eta 10/11, and the photon-number-cat states used in bosonic codes need efficiencies that climb toward unity as the code distance grows. The negativity of a large-n Fock state is a finer signal than that of a single photon, not a coarser one — a fact frequently lost in claims that \"higher Fock states are more nonclassical.\" They are more nonclassical, and proportionally harder to see . Why an absent dip is not evidence of classicality The pair of statements (i) \\rho has W \u003c 0 somewhere, and (ii) the reconstructed W \\eta has W \\eta \u003c 0 somewhere, are related by a one-way implication only: (i) does not imply (ii) when \\eta is below the state-dependent threshold; (ii) implies (i) for any \\eta 0, because Gaussian convolution cannot create negativity (it is a CPTP map that takes the positive cone of Wigner-positive states into itself). A reported \"loss of nonclassicality at low efficiency\" is therefore a statement about the reconstruction, not the state. The conflation alert from §4 — that this is read as evidence the underlying state has become classical — is the Husimi trap : the experimentalist, having unwittingly reconstructed Q or something close to it, concludes from Q \\geq 0 what only W \\geq 0 would entail, namely something about the state itself. The asymmetry is structural. Hudson's theorem , extended by Soto–Claverie , is a statement about W; the Husimi function is positive for every state and carries no analogous theorem . Reconstruction artefacts: MaxLik bias and kernel regularization The smoothing argument above treats reconstruction as transparent — as if one had direct access to W \\eta. Two real reconstruction methods break this assumption in opposite directions. Maximum-likelihood (MaxLik) reconstruction in a truncated Fock basis, as deployed since Lvovsky's iterative algorithm of 2004, enforces \\rho \\geq 0 as a hard constraint. This is correct as a quantum-mechanical prior but biases the estimator toward more negative Wigner functions: the boundary of the positive cone is where pure states live, and pure non-Gaussian states (Hudson ) have W \u003c 0. A statistically marginal homodyne dataset, fed to MaxLik with too low a photon-number cutoff, will tend to return a state that overshoots toward purity and reports a dip whose statistical significance is not what a Gaussian error bar would suggest. The cure is bootstrapped error bars on W(\\alpha), not on \\rho. Inverse-Radon (filtered backprojection) reconstruction has the opposite pathology. The exact inversion involves a k filter in the radial Fourier variable that is unbounded; any practical implementation regularizes it with a low-pass cutoff k {\\max}. The cutoff is itself a Gaussian (or sinc) convolution on W — an additional smoothing kernel of width set by 1/k {\\max}, stacked on top of the loss kernel \\sigma^2 = (1-\\eta)/(2\\eta). The total reconstructed object is W convolved with a kernel of variance \\sigma^2 {\\rm tot} = \\sigma^2 \\eta + \\sigma^2 {\\rm reg}, and the same state-dependent thresholds apply with \\sigma^2 replaced by \\sigma^2 {\\rm tot}. A reconstruction quoted as \"\\eta = 0.6\" with aggressive radial regularization can be operationally indistinguishable from \\eta = 0.45 with none; the dip can disappear for a reason that has nothing to do with the optics. The honest report A Wigner reconstruction that claims to witness negativity should specify three numbers — the detection efficiency \\eta, the effective post-reconstruction kernel variance \\sigma^2 {\\rm tot}, and the state-dependent threshold \\eta c above which the target state's negativity survives convolution by that kernel — and report the dip together with confidence intervals derived from the homodyne shot record, not from the reconstructed density matrix. Anything less is reporting on the algorithm. Negativity as a Resource: Mari–Eisert, Veitch–Ferrie–Gross–Emerson, and the Spekkens Bridge Negativity as a Resource: Mari–Eisert, Veitch–Ferrie–Gross–Emerson, and the Spekkens Bridge For seventy-six years W\u003c0 was a curiosity in search of a job. Hudson's theorem said it was the signature of non-Gaussianity for pure states; Kenfack–Życzkowski said it could be integrated; Lvovsky's heralded Fock state said it was real. None of this told you what negativity was for . The reframing — negativity is the fuel that quantum computers burn — happened in two stages between 2008 and 2012, and required a conceptual bridge built by Spekkens that most quantum-optics papers still elide. Quantifying the dip Three quantitative measures coexist in the literature; they are not interchangeable and the field has been sloppy about saying so. The Kenfack–Życzkowski indicator is the L^1 excess of W over its modulus, where W^{-}=\\max(-W,0). Two normalisation conventions circulate: Kenfack–Życzkowski's original takes \\int W -1 (no factor of 1/2); the resource-theoretic literature prefers \\tfrac12(\\int W -1) so that \\nu=\\int W^-, which is what enters the simulation bounds. Always state which. Mari and Eisert then promoted negativity to a resource monotone — really, to its logarithm, the Wigner logarithmic negativity , an unfortunate name-collision with the Vidal–Werner entanglement negativity but a real mathematical sibling: both are \\log\\lVert\\,\\cdot\\,\\rVert 1 of an object whose L^1 norm collapses to 1 exactly on the free states (PPT states there, Gaussian-positive states here). The defining property is sub-additivity under Gaussian channels: \\mathcal{N} does not increase under Gaussian unitaries, Gaussian measurements with feed-forward, and partial traces — the natural CV \"free operations\". A non-Gaussian channel can manufacture negativity; a Gaussian one cannot. For odd prime d, Veitch, Ferrie, Gross, and Emerson built the discrete analogue on Gross's finite-dimensional Hudson theorem . Define the discrete Wigner W \\rho(u) over the phase space \\mathbb{Z} d\\times\\mathbb{Z} d and set The latter is mana . Mana is faithful (\\mathcal{M}=0 iff \\rho is a non-negatively represented state, i.e. a convex mixture of stabilizer states by Gross's theorem ), monotone under stabilizer operations, and additive under tensor products. It is the magic-state analogue of CV Wigner negativity; the parallel is not metaphor but theorem. The classical-simulation theorems The reason 2012 was the watershed is that two papers, one CV and one finite-dimensional (Veitch–Ferrie–Gross–Emerson, New J. Phys. 14, 113011, the same year), proved structurally identical statements: a state with W\\ge 0 is a classical probability distribution over phase space that the computer can sample from in poly time, provided the dynamics also preserve positivity. In the CV setting the statement is sharp. If 1. the input state \\rho {\\mathrm{in}} has W {\\rho {\\mathrm{in}}}\\ge 0 everywhere, 2. all gates are Gaussian (symplectic affine transformations of (x,p), plus displacements), 3. all measurements are Gaussian (homodyne, heterodyne, Gaussian POVMs), then the output statistics of the circuit can be sampled in classical poly time. The proof is essentially one line once the framework is in place: Gaussian unitaries act on W as classical symplectic flows, Gaussian measurements correspond to marginalising over half of phase space, and a non-negative W is then a literal probability density on the unmeasured subspace which one samples by Monte Carlo. Quantum speed-up therefore requires either a Wigner-negative input or a non-Gaussian operation — there is no third source. The Veitch–Ferrie–Gross–Emerson theorem is the same statement in the odd-prime qudit world, with Gross's discrete Wigner in place of the continuous one and Clifford gates in place of Gaussian unitaries. A state with W\\ge 0 on \\mathbb{Z} d\\times\\mathbb{Z} d — equivalently, a positively represented state, equivalently, by , a convex mixture of stabilizer states — fed through Clifford circuits and measured in Pauli bases admits efficient classical simulation. Magic states (non-stabilizer ancillas distilled to fault-tolerant T-like resources) are precisely the states for which W goes negative; their mana lower-bounds the cost of magic-state distillation. Two warnings the literature regularly fails to issue. First, both theorems are sufficient conditions for hardness of simulation, not characterisations: W\u003c0 is necessary for quantum speed-up in these settings but a state can have copious negativity and still be classically simulable (e.g. low Schmidt rank tensor products of single-mode Wigner-negative states with efficient tensor-network descriptions). Second, the discrete Hudson theorem holds only in odd prime dimension. The qubit case (d=2) is genuinely different — the natural discrete Wigner is not unique, every Pauli eigenstate carries negativity in most constructions, and the resource theory has to be rebuilt around contextuality rather than negativity itself. This is the gap that Delfosse et al. and Raussendorf et al. filled for rebits and qubits respectively, and it is why \"d=2 magic\" needed a separate program. The Spekkens bridge Why should W\u003c0 — a sign on a Fourier transform of a density matrix — track computational power at all? The conceptual link, missing from both 2012 papers as a citation but present in their thinking, is Spekkens's 2008 theorem (Phys. Rev. Lett. 101, 020401): the existence of a non-negative quasi-probability representation of an operational theory is equivalent to non-contextuality of that theory in the generalised (preparation- and measurement-) sense. Negativity in any quasi-probability representation — Wigner, discrete Wigner, Kirkwood–Dirac — is therefore not an artefact of choosing a bad representation; it is the operational signature of contextuality, which Kochen–Specker and its successors had already identified as a non-classical structural feature. Mari–Eisert and Veitch–Ferrie–Gross–Emerson together translated this ontological statement into a computational one: contextuality, witnessed as Wigner negativity, is what a classical sampler cannot reproduce in poly time. The chain is now standard. Hudson / Soto–Claverie / Gross identify the free states (Gaussian or stabilizer); Spekkens identifies the structural feature distinguishing free from non-free as preparation contextuality; Mari–Eisert and VFGE turn that feature into a simulation lower bound; mana and CV log-negativity quantify the rate. The subsequent equivalence between contextuality and Wigner negativity in CV and in qubit/rebit computation [17, 18] closed the loop: in every regime where the resource theory works, \"negative\" and \"contextual\" name the same thing. What this reframing buys, and what it does not. It buys a precise operational meaning for W\u003c0: it is the unit of computational non-classicality, distillable, monotone, and additive (mana) or sub-additive (CV negativity) under the free operations. It does not buy a uniqueness theorem — Kirkwood–Dirac quasi-probabilities support a parallel resource theory with different free operations, and the choice of representation is itself a modelling decision with operational content. Negativity is the resource; which negativity depends on which classical theory you are trying to beat. Open Fronts: Even-Dimensional Qudits, Bosonic Codes, and the Ontology Question Open Fronts: Even-Dimensional Qudits, Bosonic Codes, and the Ontology Question The even-dimensional gap Gross's theorem — for odd prime power dimension d, the discrete Wigner function is non-negative iff the state is a stabilizer — is what makes the Veitch–Ferrie–Gross–Emerson resource theory clean. The proof exploits the fact that in odd d the Heisenberg–Weyl group admits a unique (up to gauge) translation-covariant Wigner function whose positivity facets coincide with the stabilizer polytope. In d = 2 the construction collapses. Any translation-covariant Wigner function for n qubits must assign negative values to some stabilizer states; the textbook witness is +y\\rangle, which is a stabilizer state but produces W \u003c 0 in every Wootters-type GF(2^n) construction. This is not cosmetic. Qubit fault tolerance is the practically dominant model, and the cleanest negativity-as-resource statement does not directly apply to it. Three work-arounds organize the literature: - The Delfosse–Allard Guérin–Bian–Raussendorf rebit theorem recovers Hudson cleanly for real-amplitude qubits: the Wootters discrete W over GF(2) becomes an operational contextuality witness for rebit measurement-based computation. The cost is the restriction to the real subtheory, which excludes the magic states most relevant to practical fault tolerance. - Raussendorf–Browne–Delfosse–Okay–Bermejo-Vega then extended the framework to full qubit MBQC by replacing translation-covariance with a cocycle-determined quasi-distribution. The price: the stabilizer polytope is replaced by a state-dependent positivity condition, and the resulting equivalence is strictly weaker than its odd-d counterpart. - Haferkamp–Bermejo-Vega proved a CV analogue: for continuous-variable optics with measurements drawn from a Gaussian-positive POVM class, operational contextuality and Wigner negativity coincide. The qubit obstruction is thus genuinely dimensional — absent in the bosonic continuum, structural in d=2^n. The unresolved question is whether the obstruction can be lifted by enlarging the symmetry group. Campos-Uscanga and collaborators have recently identified magic-state structure inside the asymmetric quantum Rabi model that hints at a translation-covariant Wigner construction on a quotient phase space, but a clean even-d Hudson theorem remains absent. The Zhang–Li construction of \"mutual mana\" via discrete beamsplitters formalizes the conversion of local magic into correlation, sharpening the question without answering it. Bosonic codes: negativity as the encoding The bosonic error-correcting codes — GKP (2001), cat (Mirrahimi–Leghtas), binomial (Michael et al.) — all live in the manifestly non-Gaussian sector, and all carry W \u003c 0 as a structural feature rather than an accident. For ideal GKP, logical states are formal Dirac combs \\mu\\rangle \\text{GKP} \\propto \\sum {s \\in \\mathbb{Z}} (2s+\\mu)\\sqrt{\\pi}\\rangle. The Wigner function is a lattice of delta peaks with signs determined by the symplectic dual, so half the peaks are negative . Finite-energy approximations smear the deltas into Gaussian bumps of width \\Delta; the sign pattern survives whenever \\Delta \\ll \\sqrt{\\pi}. The negativity volume scales linearly with the number of resolved peaks, hence logarithmically with the squeezing parameter — now an observable quantity in trapped-ion and circuit-QED hardware. The unresolved theoretical question, partially addressed by Walschaers–Fabre–Parigi–Treps for multimode non-Gaussian states , is whether \\nu(\\rho) is a faithful monotone for the code's fault-tolerance threshold, or only correlated with it. The two diverge for the cat code, whose logical errors are dominated by parity (a continuous-symmetry-protected quantity) rather than by negativity per se. Cat states \\mathcal{C} \\pm\\rangle \\propto \\alpha\\rangle \\pm {-}\\alpha\\rangle exhibit interference fringes of amplitude \\sim 2 e^{-2 \\alpha ^2}/\\pi, oscillating in sign on the line between the lobes. Squeezing the cat protects the negativity against amplitude damping by reshaping the Wigner support into the orthogonal direction ; the protection is geometric, not topological, and there is no clean negativity threshold for fault tolerance. Recent quantifications of optical cat-state coherence use \\nu(\\rho) as a witness, but the gap between \\nu and the operationally relevant code-distance metric is unaddressed. Binomial codes sit between GKP and cat: finite Fock support means bounded negativity (no diverging delta-comb) and fault-tolerance analysis is most natural in the Fock basis, where negativity is derived rather than primary. The taxonomic lesson is uncomfortable for the resource-theory program — different bosonic codes promote different aspects of non-Gaussianity to the protected role, and it is not obvious that any single phase-space scalar captures all of them. Ontology: contextuality, Kirkwood–Dirac, and the realism question Spekkens's 2008 operational equivalence — negativity of any quasi-probability representation is equivalent to contextuality of the underlying ontological model — has been sharpened on two fronts. For CV , the equivalence holds under explicit restrictions on the measurement class. For qubit MBQC , contextuality (not negativity directly) is the necessary resource, and negativity is a witness only inside the restricted Wigner constructions above. The cleanest open question is whether negativity is ontologically primary or a symptom of a deeper contextual structure. The Kirkwood–Dirac distribution has had a quiet revival in weak-measurement and foundations contexts; Spriet–Langrenez–Brummelhuis–De Bièvre argue that the KD distribution is singled out among quasi-probabilities by producing natural conditional expectations, suggesting that KD negativity is operationally equivalent to W negativity for many witnesses but emerges from a different symmetry group. The implication is that negativity is a generic feature of non-commuting-operator representations rather than a property privileged to phase space. In this writer's view, this is the most under-discussed foundational question in the area, and the one most likely to dissolve into a precise no-go statement within the decade. Recent experimental tests of noncontextuality without causal-chain assumptions close one of the looser knots in the Spekkens framework; transporting the same closure to the CV setting is open. Negativity under noise: monotonicity, faithfulness, and the resource gap The most actionable open problem for experimentalists is the status of \\nu(\\rho) = \\int W(q,p) \\,dq\\,dp - 1 as a faithful nonclassicality monotone under realistic noise. The current picture: - Under Gaussian channels, \\nu is monotone non-increasing — this is the operational backbone of the Husimi-smoothing argument from §6, and it has no known counterexample. - Under non-Gaussian channels, \\nu is not monotone. Photon subtraction following amplitude damping can transiently increase \\nu because loss-induced smoothing reshapes a broad oscillating W into a more sharply oscillating one. Le Jeannic et al. demonstrate the effect in optics; a clean theorem distinguishing \"good\" from \"pathological\" channels with respect to \\nu is missing. - For mixed states there is no known analogue of Hudson's theorem [5, 11], even in the loose sense of a representation-independent positivity criterion. The Solinas–Donelli–Gherardini operational criterion bypasses full tomography by computing \\nu from a moment-generating expectation, but it does not resolve the monotonicity question — it presupposes that \\nu is the right quantity to certify. Walschaers and collaborators tie multimode Wigner negativity to entanglement structure, pointing toward a future in which negativity is decomposed mode-by-mode and the resource theory becomes a graded object rather than a single scalar. Whether such a decomposition admits a clean monotonicity theorem under arbitrary CPTP noise is, at present, the central open question of the program — and the one on which the dossier's verdict turns. The AETHER Verdict The AETHER Verdict I have spent this dossier picking at seventy years of attribution and forty years of vocabulary drift. Here is where I will plant a flag. (a) What I will defend with my reputation Three claims, in descending order of how loudly I am willing to argue them. First: the Wigner function is a symbol, not a distribution that misbehaves. Everything coherent that has ever been said about W — Groenewold's no-go , Hudson's theorem , Royer's displaced-parity formula , the Mari–Eisert quasi-probability simulation bound — is a statement about the Weyl–Wigner map A \\mapsto W A and the Moyal product \\star, not about W as a misfit probability. The pedagog"}</script>

te) Wigner function over Galois phase space — the structure later used to define negativity for qudits and stabilizer codes", "who": "William K. Wootters", "work": "Annals of Physics 176, 1", "kind": "theory", "ref": null}, {"year": 1993, "event": "First tomographic reconstruction of a Wigner function from optical homodyne data (squeezed vacuum) — positive W but the experimental machinery to see negativity", "who": "D. T. Smithey, M. Beck, M. G. Raymer, A. Faridani", "work": "Phys. Rev. Lett. 70, 1244", "kind": "observation", "ref": null}, {"year": 2001, "event": "Direct observation of W \u003c 0: heralded single-photon Fock state reconstructed with W(0) ≈ −1/π (corrected for efficiency)", "who": "A. I. Lvovsky, H. Hansen, T. Aichele, O. Benson, J. Mlynek, S. Schiller", "work": "Phys. Rev. Lett. 87, 050402", "kind": "observation", "ref": null}, {"year": 2004, "event": "Quantitative negativity measure ν(ρ) = ∫|W| dx dp − 1 proposed as a non-classicality indicator", "who": "Anatole Kenfack, Karol Życzkowski", "work": "J. Opt. B 6, 396", "kind": "formalization", "ref": null}, {"year": 2006, "event": "Hudson's theorem for odd-prime-dimensional systems: discrete Wigner is non-negative iff the state is a stabilizer state — the bridge to magic-state resource theory", "who": "David Gross", "work": "J. Math. Phys. 47, 122107", "kind": "theory", "ref": null}, {"year": 2008, "event": "Equivalence of operational negativity and (preparation/measurement) contextuality — negativity as a deep ontological signature, not just a quasi-probability quirk", "who": "Robert W. Spekkens", "work": "Phys. Rev. Lett. 101, 020401", "kind": "revival", "ref": null}, {"year": 2012, "event": "Resource-theoretic turn: positive Wigner functions ⇒ efficient classical simulation of CV (Mari–Eisert) and odd-dim qudit (Veitch–Ferrie–Gross–Emerson) quantum computation — negativity is necessary for computational advantage", "who": "Andrea Mari, Jens Eisert; Victor Veitch, Christopher Ferrie, David Gross, J "ref": null}, {"name": "José E. Moyal", "role": "Independent rederivation of phase-space QM and its dynamics; the Moyal bracket is named but the priority dispute with Dirac (who refereed the paper hostilely) is rarely mentioned", "evidence": "Moyal, Proc. Camb. Phil. Soc. 45, 99 (1949); Moyal–Dirac correspondence reproduced in Ann Moyal's biography \"Maverick Mathematician\" (ANU Press, 2006)", "ref": null}, {"name": "Jacques Bertrand \u0026 Pierre Bertrand", "role": "Showed that homodyne marginals of W invert via the Radon transform — the mathematical foundation of optical Wigner tomography, two years before Vogel–Risken's better-known paper", "evidence": "Bertrand \u0026 Bertrand, Found. Phys. 17, 397 (1987)", "ref": null}], "conflations": [{"claim": "W \u003c 0 is THE signature of non-classicality for any state", "clarification": "Hudson's theorem holds for PURE states only. There exist (i) mixed non-classical states with W ≥ 0 everywhere (e.g., sufficiently noisy cat states, thermal Fock mixtures), and (ii) Gaussian mixed states whose nonclassicality lives entirely in W ≥ 0 territory but is witnessed by P-function singularity. Negativity of W is sufficient but not necessary for nonclassicality even when nonclassicality is sharply defined."}, {"claim": "Wigner negativity = non-Gaussianity", "clarification": "Equivalent only for pure states (Hudson). For mixed states the relation breaks both ways: non-Gaussian mixed states can have W ≥ 0, and Gaussian channels acting on Wigner-negative states can leave them non-Gaussian yet positive."}, {"claim": "P-function singularity/negativity and W \u003c 0 are the same nonclassicality criterion", "clarification": "They are nested. The Glauber–Sudarshan P is the most singular of the s-ordered family (s = +1); W (s = 0) is its Gaussian smoothing of width 1/2; Husimi Q (s = −1) is a further smoothing and is always ≥ 0. P being non-positive/singular is the standard quantum-optics notion of nonclassicality and is strictly WEAKER than W \u003c 0. Many \"nonclassical\" states (squeezed vacuum, low-amplitude coherent superpositions) fail the P test but still have W ≥ 0."}, {"claim": "A reconstructed W with no observed dip below zero proves the state is classical-like", "clarification": "Detector inefficiency η \u003c 1 acts on W as Gaussian convolution of variance (1 − η)/(2η); for η below a state-dependent threshold (roughly 1/2 for single photons, 1 − 1/(2n+1) for |n⟩) the negativity is washed out exactly because Gaussian smoothing restores positivity (Husimi limit). The negativity of the underlying state can survive while the reconstructed W is non-negative. Reports of \"loss of nonclassicality\" must specify η and the smoothing kernel."}, {"claim": "The Wigner function is a probability density that just happens to be negative sometimes", "clarification": "W is the symplectic Fourier transform of the characteristic function and is bounded by 2/h per mode; its marginals are true probability densities but W itself is not — there is no event space on which it is countably additive. Treating W as a probability and applying classical inference (e.g., Bayes' rule) is the source of many paradoxes."}, {"claim": "\"Negativity\" in the entanglement literature (Vidal–Werner) and Wigner negativity are the same object", "clarification": "Entanglement negativity is ‖ρ^{T_B}‖₁ − 1, a partial-transpose monotone on a bipartite Hilbert space. Wigner negativity is ∫|W| dx dp − 1 on phase space. Different domains, different operational meanings, occasional name collision."}, {"claim": "Husimi Q ≥ 0 means the Q-positive states are classical", "clarification": "Q is ≥ 0 for EVERY quantum state, classical or not — it is the trivial half of the s-ordered family. Q-positivity has no nonclassicality content; only the rate at which Q approaches a delta (P-representability) or the structure of Q (e.g., sub-Planck features) carries quantum information."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Szilard's Footnote, Weyl's Calculus, and the Long Prehistory of a Negative Probability", "markdown": "## Szilard's Footnote, Weyl's Calculus, and the Long Prehistory of a Negative Probability\n\nThe standard pedagogical lineage of the Wigner function runs Wigner (1932) → Hudson (1974) → Kenfack–Życzkowski (2004), with Moyal (1949) inserted as the man whose bracket carries dynamics. This is tidy, it is teachable, and it is wrong in at least four places. The object Wigner wrote down was not new in its algebra, not original in its motivating idea, and not unique in its formulation; the negativity that we now treat as the defining feature was, in 1932, a calculational annoyance to be integrated away. The story worth telling is the one in which a footnote, a thesis, a wartime letter, and a refereeing dispute did most of the conceptual work.\n\n### Weyl 1927: the algebraic substrate\n\nBy the time Wigner sat down to compute the quantum correction to the classical partition function, the operator–c-number dictionary needed to do so already existed. Hermann Weyl had introduced what we now call the Weyl symbol in *Gruppentheorie und Quantenmechanik* and in his 1927 *Zeitschrift für Physik* paper, defining for any sufficiently nice phase-space function $a(x,p)$ the operator\n\n$$\\hat{A} = \\frac{1}{(2\\pi\\hbar)^2}\\!\\int\\!\\!\\int a(x,p)\\, e^{i(\\xi(\\hat{x}-x)+\\eta(\\hat{p}-p))/\\hbar}\\, dx\\, dp\\, d\\xi\\, d\\eta,$$\n\ni.e., the symmetrically ordered correspondence that promotes $e^{i(\\xi x+\\eta p)}$ to the displacement operator $e^{i(\\xi\\hat{x}+\\eta\\hat{p})/\\hbar}$. This is the algebraic substrate of every later phase-space quasi-distribution: the Wigner function $W$ is nothing other than the Weyl symbol of $(2\\pi\\hbar)^{-1}\\hat{\\rho}$. Weyl's project was group-theoretic — to make the canonical commutation relations into a projective representation of $\\mathbb{R}^{2n}$ — and he had no interest in quasi-probabilities. But the formula $W=\\mathrm{Symb}_{\\mathrm{W}}(\\rho)/(2\\pi\\hbar)$ is already implicit there; Wigner's contribution five years later was to evaluate this object on a specific class of states and ask whether one could use it as a distribution.\n\nThat an entire algebraic apparatus precedes the quasi-distribution is rarely communicated in textbook accounts. The pedagogical effect is that students meet $W$ as a clever guess of Wigner's rather than as a specific symbol on a calculus that already existed and would later be completed by Groenewold.\n\n### Szilard's footnote\n\nWigner's 1932 paper [1] computes\n$$W(x,p)=\\frac{1}{\\pi\\hbar}\\!\\int\\!\\psi^{*}(x+y)\\,\\psi(x-y)\\,e^{2ipy/\\hbar}\\,dy$$\nin order to express $\\mathrm{Tr}(\\hat{\\rho}\\,e^{-\\beta \\hat{H}})$ as a phase-space integral whose leading correction in $\\hbar$ recovers the Wigner–Kirkwood expansion. The negativity of $W$ is acknowledged in passing and dismissed: marginals are positive, expectation values are correct, and the question of whether $W$ \"is\" a probability is set aside as physically uninteresting for a thermodynamic computation. What is *not* dismissed — though it is buried — is the credit. A footnote on the first page states, in Wigner's own words, that the idea of representing the quantum state by a function on phase space was due to Leo Szilard, with whom Wigner had discussed the problem in Berlin. Wigner repeats this attribution in the Hillery–O'Connell–Scully–Wigner review [2] and in his collected works. No Szilard manuscript on the subject survives; the idea, in the sense of a documented derivation, is Wigner's. The idea in the sense of the founding intuition is Szilard's, and the modern habit of speaking of \"the Wigner distribution\" tout court is a small but persistent erasure (verify, for the precise phrasing of Szilard's contribution as transmitted only orally).\n\nThere is a second silent omission. Wigner's 1932 paper is conventionally read as introducing the quasi-distribution; it is in fact a paper about the *quantum correction* to a classical equilibrium average. The negativity is not a feature he advertises — it is a defect in an integrand that fortunately integrates to a sensible thermodynamic potential. The reinterpretation of negativity as physically meaningful happens elsewhere, decades later, and against considerable resistance.\n\n### Bartlett 1945: negative probability as a coherent concept\n\nThe intellectual move that legitimised $W\u003c0$ as something one could reason about rather than integrate over was made not by a quantum physicist but by a statistician. M. S. Bartlett's \"Negative probability\" (Proc. Camb. Phil. Soc. 41, 71, 1945) argued that signed measures could appear as intermediate objects in admissible calculations provided only that the marginals on observable events were honest probabilities. Bartlett's framework is exactly the one Wigner needed and did not have in 1932: a quasi-distribution is a linear functional on a function space, not a measure on an event space, and negativity is a feature of the dual pairing rather than of any countable-additivity failure. Bartlett went on to mediate the correspondence between Moyal and Dirac on the statistical interpretation of quantum mechanics, and his framework underpins the modern view of $W$ as the symplectic Fourier transform of a characteristic function rather than as a \"probability that misbehaves\".\n\nBartlett is almost never cited in physics treatments of the Wigner function. He is the single most important missing name on the standard genealogy.\n\n### Groenewold 1946: the star product and a no-go theorem\n\nHilbrand Groenewold's Utrecht thesis [3] did three things that the textbook story bundles separately or omits. First, it defined the star product\n$$(a\\star b)(x,p) = a(x,p)\\,\\exp\\!\\Big[\\tfrac{i\\hbar}{2}(\\overleftarrow{\\partial_x}\\overrightarrow{\\partial_p}-\\overleftarrow{\\partial_p}\\overrightarrow{\\partial_x})\\Big]\\,b(x,p),$$\nmaking the Weyl symbol map an algebra homomorphism and turning phase-space quantum mechanics into an autonomous formulation rather than a representation trick. Second, it proved the no-go theorem on quantization — that no linear map from classical observables to operators can simultaneously preserve Poisson brackets and irreducibly represent position and momentum — which is now generally cited as \"Groenewold–van Hove\" but which, in its sharpest form, is Groenewold's. Third, it identified the antisymmetric part of $\\star$ as the bracket whose lowest-order term reproduces $\\{\\cdot,\\cdot\\}_{\\mathrm{PB}}$. That bracket would, three years later, acquire someone else's name.\n\n### Moyal 1949 and the Dirac dispute\n\nJosé Enrique Moyal's *Quantum Mechanics as a Statistical Theory* [4] reached print in 1949 but had been circulated as a manuscript since 1944 and had been the subject of an unusually hostile correspondence with Dirac, who refereed the paper. Dirac's objection was philosophical: he held that a statistical reading of the wavefunction collapsed the distinction between quantum amplitudes and classical probabilities. Moyal's reply — preserved in the Bartlett–Moyal–Dirac letters reproduced in Ann Moyal's *Maverick Mathematician* — was that the quasi-distribution and its bracket were consistent precisely because the underlying object was signed. The Moyal bracket\n$$\\{a,b\\}_{\\mathrm{M}} = \\frac{1}{i\\hbar}(a\\star b - b\\star a)$$\nthat students meet without context is Groenewold's antisymmetric star, rebranded after a priority dispute that the literature has politely forgotten. Moyal's own contribution — the *statistical* reinterpretation, the moment-generating-function viewpoint, the explicit connection to classical stochastic processes — is independent of Groenewold's and worth its own credit; but the bracket is shared property, and the standard usage erases Groenewold.\n\n### What the three-name lineage hides\n\nPulled together, the prehistory of $W\u003c0$ is a four-step inheritance: Weyl gave the calculus, Szilard gave the idea, Wigner computed the object, Bartlett legitimised its sign, Groenewold made it dynamical, Moyal made it statistical. The textbook compression to \"Wigner (1932), Moyal (1949)\" attributes algebra to physics, erases a statistician, obscures a Dutch thesis, and silently resolves a priority dispute in favour of the loser. Hudson's theorem [5], which we will reach in §3, only makes sense once one has noticed that the object on which it operates was already a composite invention by the time anyone thought to ask whether its sign was physically meaningful."}, {"id": "phase-space-formalism", "title": "The Object Itself: Weyl Symbols, the Star Product, and W as a Displaced-Parity Expectation", "markdown": "## The Object Itself: Weyl Symbols, the Star Product, and W as a Displaced-Parity Expectation\n\nThe Wigner function is not, in its native habitat, a probability density that someone forgot to normalize. It is a symbol — in the precise sense Weyl gave the word in 1927 — the c-number image of an operator under an isomorphism of vector spaces that intertwines the noncommutative product on $\\mathcal{B}(L^2(\\mathbb{R}))$ with a noncommutative product on $C^\\infty(\\mathbb{R}^2)$. Everything that looks paradoxical about $W$ — the negative values, the unbounded oscillations on sub-Planck scales, the failure of Bayes' rule — is a consequence of refusing to treat it as anything else.\n\n### The Weyl correspondence and the characteristic function\n\nFix one bosonic mode with $[\\hat x,\\hat p]=i\\hbar$. Weyl's prescription [archive entry implicit; not in corpus] assigns to a phase-space function $a(x,p)$ the operator\n\n$$\\hat A \\;=\\; \\frac{1}{(2\\pi)^2}\\!\\int\\!\\! d\\xi\\, d\\eta\\,\\tilde a(\\xi,\\eta)\\,e^{i(\\xi\\hat x+\\eta\\hat p)},\\qquad \\tilde a(\\xi,\\eta)=\\!\\int\\!\\! dx\\, dp\\, a(x,p)\\, e^{-i(\\xi x+\\eta p)},$$\n\ni.e. one symmetrizes the exponential — the only ordering compatible with linearity, reality,
