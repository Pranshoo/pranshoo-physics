<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "Beyond Bose and Fermi: The Braided History and Hidden Algebra of Anyons", "alternativeHeadline": "anyons or beyond fermions and boson systems", "name": "anyons or beyond fermions and boson systems", "description": "From Oslo 1977 to the ν=1/3 collider — what we discovered, what we named, and what we still confuse", "inLanguage": "en", "keywords": ["anyons or beyond fermions and boson systems", "fractional-statistics particles", "braid-statistics particles", "Leinaas–Myrheim particles", "plektons (non-Abelian, Fröhlich)", "intermediate-statistics particles (historical, ambiguous)"], "about": [{"@type": "Thing", "name": "anyons or beyond fermions and boson systems"}, {"@type": "Thing", "name": "fractional-statistics particles"}, {"@type": "Thing", "name": "braid-statistics particles"}, {"@type": "Thing", "name": "Leinaas–Myrheim particles"}, {"@type": "Thing", "name": "plektons (non-Abelian, Fröhlich)"}, {"@type": "Thing", "name": "intermediate-statistics particles (historical, ambiguous)"}], "articleSection": "BRIEFING", "datePublished": "2026-06-15", "dateModified": "2026-06-15", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/beyond-bose-and-fermi-the-braided-history-and-hidden-algebra.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/beyond-bose-and-fermi-the-braided-history-and-hidden-algebra.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins and Forgotten Pioneers: Oslo Before Princeton Origins and Forgotten Pioneers: Oslo Before Princeton The textbook story — \"Wilczek imagined particles that could have any statistics in 1982, called them anyons, and the field was born\" — is wrong by five years, by one ocean, and by at least three uncredited contributions. The reconstruction below follows the actual paper trail. The first \"beyond Bose/Fermi\": Green 1953 The earliest published generalisation of bosonic/fermionic quantisation is H. S. Green's parastatistics . Green replaced the bilinear [a,a^\\dagger] \\mp relations with the trilinear which admit families labelled by an integer order p (paraboson, parafermion). This is genuinely \"beyond Bose/Fermi\", but it is not anyonic: parastatistics lives in d=3+1, is discrete in p, and was shown by Doplicher–Haag–Roberts to be equivalent to ordinary statistics on an internal SU(p) multiplet (verify). The persistent popular conflation of parastatistics with anyons is a category error — different dimension, different algebra, different physical content. The configuration-space machinery: Laidlaw and DeWitt-Morette 1971 The decisive technical move was made not by a condensed-matter physicist but by two field-theorists working on Feynman path integrals. Laidlaw and DeWitt-Morette argued that for N indistinguishable particles in \\mathbb{R}^d the configuration space is the quotient and that distinct quantisations correspond to one-dimensional unitary representations of \\pi 1(Q N). For d\\ge 3 they computed \\pi 1 = S N, whose only 1D reps are the trivial and sign characters — hence Bose or Fermi, full stop. The 1971 paper is overwhelmingly cited for that negative result , which obscures the punch line written between the lines: in d=2 the diagonal \\Delta has codimension 2, paths can wind, and \\pi 1 is no longer S N. The machinery was already in place; nobody turned the crank. Oslo 1977: Leinaas and Myrheim turn the crank That step was taken at the University of Oslo by Jon Magne Leinaas and Jan Myrheim, published in Nuovo Cimento B . They identified \\pi 1(Q N(\\mathbb{R}^2)) = B N, the Artin braid group, and observed that its 1D unitary representations form a continuous family parametrised by a phase e^{i\\theta} with \\theta\\in[0,2\\pi) — Bose (\\theta=0) and Fermi (\\theta=\\pi) as two points of a circle, with everything between physically admissible. They wrote the multivalued wavefunctions, discussed the two-body Hamiltonian on the cone \\mathbb{R}^2/\\mathbb{Z} 2, and noted the consequences for hard-core interactions. Every essential ingredient — braid group, continuous \\theta, configuration-space derivation — is in that 1977 paper. It received almost no Western citations until after 1982. The independent rederivation: Goldin–Menikoff–Sharp 1980–81 Working in the algebra-of-local-currents tradition descended from Dashen–Sharp, Goldin, Menikoff and Sharp arrived at the same conclusion through a different door . Unitary representations of the diffeomorphism group on a non-simply-connected manifold are labelled by \\pi 1 of that manifold; in d=2 this again yields a U(1) family. Crucially, they identified the resulting phase as a topological Aharonov–Bohm flux attached to each particle — the physical picture later popularised as Wilczek's flux tube. This work is cited in Wilczek's 1990 monograph but rarely appears in pedagogical accounts. Princeton 1982: what Wilczek actually added Wilczek's two PRLs [6, 7] did two things that the preceding literature had not done together. First, he gave a concrete, calculable model — a charge orbiting a thin solenoid — that makes the fractional spin and statistics physically transparent and ties them together via a spin–statistics relation valid in d=2. Second, in the second paper he coined the name anyon . The model and the name are genuine contributions; the discovery is not. To Wilczek's credit, the introduction of explicitly attributes priority to Leinaas–Myrheim. The credit drift — \"Wilczek discovered anyons\" — is a phenomenon of third-party pedagogy, not of Wilczek's own claims. The clean statement: Oslo 1977 found the physics, Princeton 1982 named it. Both halves matter; one is older than the standard story admits. The Physics Itself: Configuration Space, Braid Group, and the Berry Phase The Physics Itself: Configuration Space, Braid Group, and the Berry Phase The whole subject reduces to a single question: what is \\pi 1 of the configuration space of N indistinguishable particles? Following Laidlaw–DeWitt-Morette , take the classical configuration manifold where \\Delta is the coincidence set and S N permutes labels. A Feynman propagator on a multiply-connected space decomposes into a sum over homotopy classes of paths weighted by a one-dimensional unitary representation \\chi:\\pi 1(Q N)\\to U(1) (or, more generally, a higher-dimensional representation acting on an internal Hilbert space). The statistics of the system is that representation . Everything else is consequence. For d\\geq 3, \\pi 1(Q N)=S N, whose only 1D unitary representations are the trivial one and the sign — Bose and Fermi, full stop. For d=2, removing \\Delta obstructs the contraction of exchange loops: a counter-clockwise half-revolution of particles i,i+1 is no longer homotopic to its inverse, and Artin's braid group. The Yang–Baxter relation is forced by topology, not chosen. This is precisely Leinaas–Myrheim's 1977 observation , rederived from the local-current algebra by Goldin–Menikoff–Sharp and recast as braid-group representation theory by Wu . Figure: The braid generator \\sigma i exchanges strands i,i+1 with a definite over-crossing; in d{=}2 this is topologically distinct from \\sigma i^{-1}, so \\rho(\\sigma i) is not constrained to square to the identity. The right column collects the three resulting representation classes and the spin–statistics relation that links the Abelian phase to the Aharonov–Bohm flux composite. The 1D irreducible representations of B N are \\rho(\\sigma i)=e^{i\\theta} for all i — a single continuous parameter, the statistics angle . Wilczek's charged-particle/flux-tube avatar [6, 7] makes this concrete: bind charge q to flux \\Phi, encircle a partner, pick up the Aharonov–Bohm phase e^{iq\\Phi}, and halve it for an exchange: so spin and statistics co-vary continuously — the 2D spin–statistics relation, proved properly in axiomatic form by Fröhlich–Marchetti . The Arovas–Schrieffer–Wilczek calculation turns this into an experimental object on the Laughlin state \\Psi {1/m}=\\prod {i\u003cj}(z i-z j)^m e^{-\\sum z k ^2/4\\ell B^2}. A quasihole at w is created by \\prod i(z i-w). Adiabatically transporting one quasihole around a loop \\mathcal{C} enclosing area A yields a Berry phase i.e. the Aharonov–Bohm phase of a charge e^ =e/m. Enclosing a second quasihole reduces the density by 1/m of an electron, contributing an additional 2\\pi/m; an exchange is half of that, giving the braid phase For m=3 this is the 2\\pi/3 monodromy verified in the Manfra interferometer and the Bartolomei collider . Halperin's hierarchy had proposed exactly this assignment from a counting argument; ASW supplied the wavefunction derivation. Moore–Read showed the construction has a non-Abelian extension. Their Pfaffian candidate for \\nu=5/2, binds a chiral p-wave pairing of composite fermions to the Laughlin Jastrow factor. With 2n quasiholes the ground space is 2^{n-1}-dimensional, and \\rho(\\sigma i) becomes a matrix in this degenerate space — the Ising anyons, with fusion rules Here \\theta is no longer a number but an element of a modular tensor category; the braid group acts as the Jones representation at level 2. That category — not a U(1) phase — is the right home of the modern subject [15, 16, 17], and it is what makes the \\nu=5/2 programme [18, 19] interesting at all. From U(1) Phases to Modular Tensor Categories: What Superseded What From U(1) Phases to Modular Tensor Categories: What Superseded What The formal chain reads Wu (1984) → Moore–Read (1991) → Kitaev (1997, published 2003) → modular tensor category. Each step embeds its predecessors as a special case while exposing structure invisible at the previous level. Wu 1984: braid groups as the symmetry that matters recast the Leinaas–Myrheim continuous-\\theta family in the language of unitary representations of the Artin braid group B N, whose generators \\sigma i — exchange of strands i and i+1 — satisfy The Abelian anyons of [3, 4, 6, 7] correspond to one-dimensional reps \\sigma i\\mapsto e^{i\\theta}. Wu's contribution was to ask the obvious — but, until then, unasked — question: what about higher-dimensional unitary reps? The answer demolishes the \"interpolation between bosons and fermions\" picture. For 1D reps, \\theta smoothly connects 0 (Bose) to \\pi (Fermi); the moment \\dim\\rho 1 no path inside U(d) can carry \\mathbb{1} to -\\mathbb{1} while respecting the braid relations as a family. The phase variable loses its meaning the instant non-Abelian reps appear. Moore–Read 1991: the first non-Abelian wavefunction supplied the concrete system. With 2n Pfaffian quasiholes pinned, the ground space has dimension 2^{n-1}, and the elementary exchange acts as a matrix in the spinor representation of \\mathrm{Spin}(2n) — read off directly from Ising-model conformal blocks. This was the first time the qualitative claim \"fractional statistics is matrix-valued, not phase-valued\" was anchored to a microscopic wavefunction. The flux–charge picture of survives here only as the Abelian U(1) sub-sector of the full Ising fusion category. Kitaev 1997/2003: anyons as abstract algebraic data performed the decisive abstraction. Fault tolerance forced the question: what intrinsic data specifies an anyon model, independent of Hamiltonian or wavefunction? The answer is (i) a finite label set of superselection sectors, (ii) fusion rules, (iii) associators, (iv) braidings, with closure conditions. The microscopic system became irrelevant; only the algebra mattered. This is also where topological quantum computation acquired its definition: protected unitaries are exactly the matrix entries of braid generators in that algebra. The modular tensor category consolidation The synthesis, implicit in and codified in , identifies the right object as a unitary modular tensor category, with data (scalars in multiplicity-free models; matrices in general). The associator F relabels (a\\times b)\\times c \\to a\\times(b\\times c); the braiding R exchanges a,b on a fixed fusion channel c. Consistency forces the pentagon equation on F alone — five reassociations of four objects must agree — and the hexagon equations on (F,R) jointly. Modularity is non-degeneracy of S {ab}\\propto\\sum c d c\\,\\mathrm{tr}(R^{ab} c R^{ba} c); modular invariance under SL(2,\\mathbb{Z}) acting on torus characters then encodes everything topological. Figure: The two structural moves of an anyon model. F relabels the internal fusion channel of a tree (intermediate e\\!\\to\\!f); R inserts a half-twist on a single fusion vertex. Pentagon and hexagon equations close the algebra; any solution is a unitary fusion category, and a non-degenerate S-matrix promotes it to an MTC. Abelian anyons are the rank-1 (1D associators, U(1)-valued R) special case. What this framework superseded — and what survives only as restricted special cases: - U(1) braid phase. The Abelian sub-MTC \\mathbb{Z} n; the original Leinaas–Myrheim/Wilczek anyons of [3, 6, 7]. - Wu's B N representations . Now read off from R-symbols of a chosen MTC; for non-Abelian categories the matrices fail to commute and \"e^{i\\theta}\" is meaningless. - Flux–charge composite . The Abelian Chern–Simons sub-theory at level k; generates only \\mathbb{Z} k anyons, never Ising or Fibonacci. - Parastatistics and quons . Outside the framework entirely: by Doplicher–Haag–Roberts (verify) they reduce to ordinary statistics on an internal multiplet in d\\ge 3, with no honest 2D anyon analogue. The \"interpolation between Bose and Fermi\" reading of either is, in two dimensions, a category error. Conflation Watch: Four Things the Literature Calls 'Fractional Statistics' Conflation Watch: Four Things the Literature Calls 'Fractional Statistics' The phrase fractional statistics is overloaded. Four logically distinct constructions travel under the name, and the resulting confusions are not pedagogical curiosities — they propagate into published equations whose domain of validity has been silently erased. The taxonomy below names each construction, fixes its regime, and flags the standard misuse. (i) Braid statistics vs. Haldane exclusion statistics Leinaas–Myrheim/Wilczek statistics [3, 6, 7] are a property of the configuration-space wavefunction : under continuous exchange of two indistinguishable particles in d=2, \\psi \\to e^{i\\theta}\\psi, with \\theta the one-dimensional unitary representation of B N. Haldane's 1991 \"fractional statistics\" is something else entirely: a state-counting rule generalising Pauli exclusion (g=1) and Bose accumulation (g=0). It is defined for any spatial dimension and makes no reference to a braid group or to a phase. The two coincide only where the Hilbert space is effectively one-dimensional — chiral edge modes, the lowest Landau level projected to a single edge, the Calogero–Sutherland line — because in 1D braids degenerate to crossings and the exchange phase reduces to a phase shift in the S-matrix that controls level counting. Equations of the form \"anyons with statistics \\theta = \\pi g\" circulate (sometimes uncited) outside that 1D/edge regime; they are folklore there, not theorems. Haldane statistics is dimension-blind; braid statistics is dimension-locked to d=2. (ii) Parastatistics vs. quons vs. anyons Green's parastatistics generalises canonical (anti)commutators to trilinear relations with an order parameter p\\in\\mathbb{N}. By the Doplicher–Haag–Roberts reconstruction it is equivalent, in d\\ge 3{+}1 with local observables, to ordinary Bose/Fermi statistics carried on an internal SU(p) multiplet — i.e., \"hidden colour\", not a genuinely new exchange law. Greenberg quons deform the oscillator algebra to a i a j^{\\dagger} - q\\,a j^{\\dagger} a i = \\delta {ij}, q\\in[-1,1], interpolating Bose (q{=}1) and Fermi (q{=}-1). The quon algebra is mathematically consistent in any dimension but admits no local relativistic field theory for q \u003c1 — it survives as a phenomenological bound on statistics violations, not as a physical phase of matter. Anyons [3, 6, 7] are unitary representations of B N(\\mathbb{R}^2) realised as gapped excitations of a local 2+1D theory. The three constructions answer different questions (internal symmetry vs. algebra deformation vs. configuration-space topology) and are routinely fused in introductions, especially where \"q-deformed\" and \"anyonic\" appear in the same sentence. (iii) Abelian interpolation vs. non-Abelian matrix action For Abelian anyons there is a genuine continuous knob, \\theta\\in[0,\\pi], joining bosons to fermions. For non-Abelian anyons (Moore–Read , Ising, Fibonacci) the braid generators act as unitary matrices \\rho(\\sigma i) on a degenerate fusion space whose dimension grows as d a^N with quantum dimension d a 1 [15, 16]. There is no path from Bose to Fermi through this data; the appropriate object is a modular tensor category, and statements like \"non-Abelian anyons have statistics \\theta = 2\\pi/5\" are at best the eigenphase of one generator in one basis — the physical content lives in the F and R symbols, not in a scalar. (iv) Anyons vs. topological order vs. SPT Topological order [21, 17, 22] is a property of a gapped ground state: degeneracy on higher-genus surfaces, long-range entanglement, robust ground-state manifold. Anyons are its low-energy probes; the modular S, T matrices encode the order. Symmetry-protected topological (SPT) phases [23, 24] are gapped, short-range entangled, and host no deconfined bulk anyons — their nontriviality lives on the boundary and requires a protecting symmetry. The slogan \"SPT phases have anyonic edge statistics\" is true only after gauging the protecting symmetry, at which point one has left the SPT class for a topologically ordered phase . Conflating the two erases the distinction between intrinsic and symmetry-protected long-range entanglement — the very distinction the post-2010 classification programme exists to enforce. The Current Frontier: From Interferometers to Fault-Tolerant Braiding The Current Frontier: From Interferometers to Fault-Tolerant Braiding The interferometric record: \"consistent with\" → \"direct\" Camino, Zhou and Goldman observed Fabry–Pérot oscillations at \\nu=1/3 with periodicity and phase-slip patterns consistent with an e^{i2\\pi/3} exchange phase . The community accepted the data and disputed the inference: Coulomb-dominated regimes, edge reconstruction and lobe-superperiodicity reproduce similar signatures, and the device could not cleanly separate Aharonov–Bohm flux periodicity from quantum-dot charging. The same critique blunted the Willett \\nu=5/2 shot-noise and interferometry campaigns of the 2000s–2010s. The 2020 pair of experiments closed that loophole. Nakamura et al. ran a screened Fabry–Pérot in the Aharonov–Bohm regime, identified discrete \\Delta\\phi = 2\\pi/3 jumps as bulk anyon-number changes, and read the slope of \"pajama\" lines in (V g,B) to extract the exchange phase directly . Bartolomei et al. analysed a Hong–Ou–Mandel-style two-anyon collider and fit the generalised current cross-correlations to the braiding form, again recovering \\theta=\\pi/3 . Replications in bilayer-graphene Fabry–Pérots have since reproduced the phase jumps with cleaner Coulomb/Aharonov–Bohm separation and dwell times exceeding 20 minutes (Werkmeister et al., Science 2024; arXiv:2403.19628). \\nu=5/2: the unresolved Pfaffian trilemma Figure: The three candidate topological orders at \\nu=5/2 predict distinct integer-half-integer chiral central charges (and hence quantised \\kappa {xy}). The Banerjee et al. 2018 measurement landed on the PH-Pfaffian value, but microscopic numerics favour the anti-Pfaffian — the leading reconciliation invokes disorder-induced edge equilibration rather than a true PH-Pfaffian bulk. Ising and Fibonacci: the Majorana detour and what it is not The Sau–Tewari–Lutchyn–Stanescu–Das Sarma and Lutchyn–Oreg programmes predicted Ising-anyon (Majorana zero mode, MZM) endpoints of 1D topological superconductors in InSb/InAs–Al hybrids [26, 18]. After the 2018 Delft retraction, Microsoft's February 2025 Majorana 1 announcement reported single-shot interferometric fermion-parity readout on InAs–Al (Microsoft/Azure Quantum). The journal's own editorial note states explicitly that the data \"do not represent evidence for the presence of Majorana zero modes\" ( Science News ; Science news). Even granting MZMs, Ising braiding generates only the Clifford group: it is fault-tolerant in storage but not in gates , demanding magic-state distillation for universality . True topological universality wants Fibonacci anyons, or parafermion zero modes from Abelian-FQH/superconductor heterostructures [27, 28, 19]. No condensed-matter platform has produced them. The 2023–2024 \"non-Abelian braiding\" demonstrations on Quantinuum H2 (Ising/D 4) and on a superconducting Fibonacci string-net (Xu et al., Nature Physics 2024; Quantinuum H2) execute the modular tensor category on encoded qubits — they simulate the braid algebra, they do not protect the qubit from local noise. Conflating the two dissolves the fault-tolerance Kitaev's 1997 proposal was designed to deliver . Recent theory shows non-Abelian fusion channels can emerge inside Abelian FQH phases from realistic interactions , which may shorten the path; the experimental gap — a physical anyon whose worldlines actually compute — remains the field's central open problem. The AETHER Verdict The AETHER Verdict I have spent four sections being a historian. Allow me one section of being a referee. (a) What I would defend with my reputation That \\pi 1 of the configuration space of N indistinguishable point particles in d=2 is the braid group B N, not S N, and that this is not a model assumption but a topological theorem — Leinaas–Myrheim got this right in 1977 and nothing in the intervening half-century has touched it. I will defend, equally firmly, that the \\nu=1/3 Laughlin quasihole carries exchange phase \\theta=\\pi/3: the Berry-phase calculation is correct on Laughlin states, the numerical confirmation on realistic Coulomb ground states is robust, and the anyon collider and Fabry–Pérot experiments have now closed the loop. The Abelian fractional-statistics program is, in 2026, settled physics. I will also defend that the correct algebraic object for non-Abelian anyons is a unitary modular tensor category, not a group, not a Lie algebra, not a \"generalized symmetry.\" Kitaev's appendix to is, in my judgement, the most important single document in the field after Leinaas–Myrheim. (b) What is shakier than the literature admits Three loose joints, in order of how loudly they are papered over. First, the gauge-invariance of the non-Abelian Berry holonomy under realistic perturbations. The Moore–Read argument and its descendants assume adiabaticity with respect to a gap that, in the \\nu=5/2 system, may be 100 mK and is demonstrably non-universal across samples. Whether the holonomy measured in a real device is the MTC F- and R-matrix or a sample-specific dressing of it is, to my mind, an open empirical question, not a settled one. Second, the quasiparticle-as-particle idealization. Every braid-statistics statement treats the anyon as a localizable excitation with a well-defined worldline. In the FQHE this is an asymptotic statement about widely separated, slowly moved quasiholes on an incompressible background; at the densities and timescales of any proposed topological qubit, the worldline approximation is doing more work than the literature admits. The \"anyon\" of is an inferred phase shift in a current correlator, not a tracked object. Third, the routine identification of Ising anyons in \\nu=5/2 with the Moore–Read Pfaffian. The PH-Pfaffian/anti-Pfaffian discussion is still live; the thermal-Hall data is consistent with multiple topological orders, and citing \"Ising anyons at 5/2\" as fact — as several review articles do — overruns the evidence. (c) The three open questions I would actually work on 1. A model-independent, finite-gap bound on non-Abelian holonomy error. Because without it, \"topological protection\" is a slogan, not a theorem about the device. 2. Direct detection of a non-Abelian F-move , not merely a non-Abelian R. Braiding alone underdetermines the MTC; an interferometer sensitive to fusion-channel interference would. 3. The fate of braid statistics under realistic edge reconstruction in \\nu=5/2. The bulk MTC is irrelevant if the edge that you actually couple to has decohered the anyonic information before you read it. (d) Reading path In order, with reason: 1. Leinaas \u0026 Myrheim, Nuovo Cimento B 37, 1 (1977) — read the original; the modern pedagogy has flattened its subtleties. 2. Wu, Phys. Rev. Lett. 52, 2103 (1984) — the cleanest derivation of why B N, not S N, and the first honest treatment of higher-dimensional representations. 3. Arovas, Schrieffer \u0026 Wilczek, Phys. Rev. Lett. 53, 722 (1984) — the Berry-phase template; every later \"compute \\theta\" calculation is a variation on this. 4. Moore \u0026 Read, Nucl. Phys. B 360, 362 (1991) — where non-Abelian statistics enters condensed matter from CFT; read it for the method , not just the Pfaffian. 5. Kitaev, Ann. Phys. 321, 2 (2006), Appendix E — the MTC dictionary, written by the person who actually built it; if you read only one thing on this list, read this."}</script>

.obar a.back{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.obar a.back:hover{color:var(--accent)}
.obar .wm{font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;text-decoration:none}
.obar .wm span{color:var(--accent)}
.tbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:none;cursor:pointer;transition:border-color .25s}
.tbtn:hover{border-color:var(--accent)}
.tbtn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.4}
/* landing hero */
.lhero{padding:84px 0 38px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px;margin-bottom:20px}
.kick::after{content:"";height:1px;flex:0 0 56px;background:var(--accent);opacity:.5}
h1.big{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8vw,92px);line-height:1.0;letter-spacing:-.02em;margin-bottom:22px}
.lhero p.manifesto{font-size:21px;font-style:italic;color:var(--ink-2);max-width:680px;line-height:1.6}
.lhero p.note{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:24px;text-transform:uppercase}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:46px 0 6px;border-top:1px solid var(--line-soft);padding-top:24px}
.filter button{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:none;border-radius:99px;padding:8px 15px;cursor:pointer;transition:all .2s}
.filter button:hover{border-color:var(--accent);color:var(--accent)}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* card grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:34px 0 100px}
a.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;background:var(--elev);padding:30px 30px 26px;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative;overflow:hidden}
a.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
a.card .ctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;margin-bottom:16px}
a.card .ctag b{font-weight:400;color:var(--muted)}
a.card h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.18;letter-spacing:-.01em;margin-bottom:8px}
a.card .csubj{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
a.card p{font-size:15.5px;color:var(--ink-2);line-height:1.6;flex:1}
a.card .cfoot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between}
a.card .cfoot .arr{color:var(--accent);transition:transform .25s}
a.card:hover .cfoot .arr{transform:translateX(4px)}
.empty{padding:60px 0;color:var(--muted);font-style:italic}
/* reader */
.rmast{padding:64px 0 30px}
.rmast .kind{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.rmast h1{font-family:var(--serif);font-weight:500;font-size:clamp(33px,5vw,56px);line-height:1.08;letter-spacing:-.015em;margin-bottom:18px}
.rmast .sub{font-size:21px;font-style:italic;color:var(--ink-2);max-width:760px;line-height:1.5}
.rmast .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 20px;text-transform:uppercase}
.aka{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;align-items:center}
.aka .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aka i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px}
.aka i.subj{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.callout{border:1px solid var(--line-soft);border-left:2px solid var(--accent);background:var(--elev);border-radius:0 4px 4px 0;padding:18px 24px;margin:30px 0}
.callout h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.callout p{font-size:15.5px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--gold)}
.callout.warn h4{color:var(--gold)}
.rgrid{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;padding-bottom:40px}
.toc{position:sticky;top:84px;font-family:var(--mono);font-size:11px;line-height:1.5}
.toc .tl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 12px;border-left:1px solid var(--line-soft);transition:color .2s,border-color .2s}
.toc a:hover,.toc a.on{color:var(--accent);border-color:var(--accent)}
article.body{min-width:0;max-width:760px}
.sec{padding:14px 0 8px;scroll-margin-top:80px}
.sec.verdict{border:1px solid var(--line);border-radius:6px;background:var(--elev);padding:8px 34px 24px;margin-top:30px}
.prose h2{font-family:var(--serif);font-weight:500;font-size:clamp(25px,3.4vw,33px);line-height:1.18;letter-spacing:-.01em;margin:40px 0 16px}
.prose h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:30px 0 10px}
.prose h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:24px 0 8px}
.prose p{margin:0 0 1.25em;color:var(--ink-2)}
.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.prose a:hover{color:var(--accent)}
.prose ul,.prose ol{margin:0 0 1.25em 1.3em;color:var(--ink-2)}
.prose li{margin-bottom:.5em}
.prose blockquote{margin:1.4em 0;padding:4px 0 4px 24px;border-left:2px solid var(--accent);font-style:italic;color:var(--ink)}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.prose pre{background:var(--elev);border:1px solid var(--line-soft);border-radius:5px;padding:16px;overflow:auto;margin:0 0 1.25em}
.prose pre code{background:none;padding:0}
.prose hr{border:none;border-top:1px solid var(--line-soft);margin:2em 0}
.prose table{border-collapse:collapse;width:100%;margin:0 0 1.25em;font-size:15px}
.prose th,.prose td{border:1px solid var(--line-soft);padding:8px 12px;text-align:left}
.prose th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* generated SVGs use hardcoded light strokes, so figures keep a dark plate
   in BOTH themes — exactly like the AETHER app */
.fig{margin:26px 0;padding:20px;border:1px solid #222a3a;border-radius:8px;background:#10141d;text-align:center;overflow-x:auto;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.fig svg{max-width:100%;height:auto}
.fig+p em,.figcap{color:var(--muted)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.mathraw{font-family:var(--mono);font-size:.82em;color:var(--ink-2);background:var(--accent-soft);padding:1px 5px;border-radius:3px}
a.cite{color:var(--accent);text-decoration:none;font-size:.84em;vertical-align:super;border:none;padding:0 1px}
a.cite:hover{text-decoration:underline}
/* blocks: timeline / neglected / conflations / refs */
.block{padding:46px 0 8px;border-top:1px solid var(--line-soft);margin-top:40px}
.block>h3{font-family:var(--serif);font-weight:500;font-size:27px;margin-bottom:6px}
.block>.lead{font-size:15px;color:var(--muted);font-style:italic;margin-bottom:26px}
/* origins timeline — horizontal scrollable filmstrip ("slider") */
.tslider{display:flex;gap:14px;overflow-x:auto;padding:10px 2px 16px;scroll-snap-type:x proximity;cursor:grab;
  background:linear-gradient(var(--line),var(--line)) left bottom/100% 1px no-repeat;
  -webkit-overflow-scrolling:touch}
.tslider.grab{cursor:grabbing}
.tslider::-webkit-scrollbar{height:6px}
.tslider::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.tslider::-webkit-scrollbar-track{background:transparent}
.tcard{position:relative;min-width:215px;max-width:240px;flex:0 0 auto;border:1px solid var(--line);border-radius:7px;background:var(--elev);padding:14px 16px 16px;scroll-snap-align:start}
.tcard::after{content:"";position:absolute;left:16px;bottom:-16px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent)}
.tcard .yr{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--accent);font-weight:500}
.tcard .ev{font-size:14px;color:var(--ink);margin:7px 0;line-height:1.42}
.tcard .who{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5}
.tcard .kd{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:9px}
.tcard .kd .cite{vertical-align:baseline}
.thint{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:12px;text-align:right}
.ncards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ncard{border:1px solid var(--line-soft);border-radius:5px;padding:20px 22px;background:var(--elev)}
.ncard .nm{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:4px}
.ncard .ro{font-size:14.5px;color:var(--ink-2);margin-bottom:8px}
.ncard .ev{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.conf{list-style:none}
.conf li{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.conf .claim{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:4px;padding:8px 12px;display:inline-block;margin-bottom:8px}
.conf .clar{font-size:15px;color:var(--ink-2)}
.conf .clar::before{content:"→ ";color:var(--accent)}
.refs{list-style:none;counter-reset:r}
.refs li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14px;scroll-margin-top:80px}
.refs li .rn{font-family:var(--mono);font-size:11px;color:var(--accent)}
.refs li .rt{color:var(--ink)}
.refs li .ra{color:var(--muted);font-size:13px}
.refs li a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.refs li a:hover{color:var(--accent);border-color:var(--accent)}
.refs li .bk{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:2px 7px;margin-left:6px}
/* footer */
footer{border-top:1px solid var(--line);padding:28px 0 40px;margin-top:60px}
footer .fr{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
footer em{font-family:var(--serif);font-style:italic;text-transform:none;font-size:12.5px}
@media(max-width:880px){.grid{grid-template-columns:1fr}.rgrid{grid-template-columns:1fr;gap:8px}.toc{display:none}.ncards{grid-template-columns:1fr}body{font-size:16.5px}}
