anz, Ehrenberg–Siday, and the 1949 Priority The textbook sentence — \"Aharonov and Bohm predicted in 1959 that a confined magnetic flux would shift an electron interference pattern, and Chambers confirmed it in 1960\" — is, as a matter of historical fact, wrong in its first clause and incomplete in its second. The magnetic-flux phase shift had been written down, in print, in English, in an unambiguous two-beam electron-interferometric geometry, ten years before Aharonov and Bohm's paper . There is, in addition, a credible but evidentially fragile claim that the same result was stated orally a further decade earlier, in Danzig, in 1939 . To reconstruct what was actually known in 1959, one must work backwards from the kinematic prerequisites. The kinematic prerequisites: matter waves and electron diffraction The Ehrenberg–Siday–Aharonov–Bohm (ESAB) effect is a statement about the phase of an electron wavefunction transported along a path in a region where \\mathbf{B}=0 but \\mathbf{A}\\neq 0. Before this phase could be written down, two things had to exist: the de Broglie relation, and the experimental demonstration that electrons actually interfere. De Broglie's 1924 Sorbonne thesis postulated p = h/\\lambda for material particles and gave the dispersion relation that makes \"electron optics\" a meaningful phrase at all . The kinematic identification of an electron with a wave of definite wavevector is the sine qua non of every subsequent argument: the AB phase \\Delta\\Phi = (e/\\hbar)\\oint \\mathbf{A}\\cdot d\\boldsymbol{\\ell} is the integrated correction to the dynamical phase \\int \\mathbf{k}\\cdot d\\boldsymbol{\\ell} in the minimally-coupled WKB expression Without de Broglie, there is no \\mathbf{k} to correct. Three years later, Davisson and Germer at Bell Labs, and independently G. P. Thomson at Aberdeen, made electron diffraction a laboratory phenomenon . By the early 1930s, Knoll and Ruska's electron microscope had recast the optical analogy into a working engineering discipline: lenses, apertures, refractive indices, all derived from the Hamilton-optical analogy in which the role of the optical path length \\int n\\,ds is played by the action \\int \\mathbf{p}\\cdot d\\boldsymbol{\\ell}/\\hbar. This is the conceptual world in which Ehrenberg–Siday would write — the world of electron optics rather than the world of foundational quantum mechanics. The distinction matters: it explains why their paper sat in the electron-microscopy literature for a decade without attracting the attention of the foundations community, and why Aharonov and Bohm's reframing of the same equation as a statement about the ontology of the potentials counts as a genuinely separate contribution. Franz at Danzig, 1939: the murkiest item in the record The earliest claim to priority belongs to Walter Franz, who reportedly presented an argument for the magnetic-flux phase shift at a meeting of the Deutsche Physikalische Gesellschaft in Danzig in May 1939 . The sources for this are Hiley's historical reconstructions and the introductory matter of Peshkin and Tonomura's monograph ; both report it as something Franz himself later asserted in correspondence, and both treat it with appropriate caution. The published proceedings entry is hard to locate, the talk was given in a venue and a moment (Danzig, four months before the German invasion of Poland) calculated to ensure that whatever was said there would not propagate, and Franz himself only returned to the subject in print in the 1960s, after AB. The honest classification is: plausible but disputed . There is no extant manuscript that I have been able to verify; what circulates is an oral testimony chain. Franz's later technical competence in exactly this area lends the claim credibility, but credibility is not evidence. The conscientious move in this dossier is to mention Franz in every priority discussion and to refuse to write him into the canonical chain until the Danzig proceedings are recovered. Ehrenberg and Siday, 1949: the unambiguous derivation The decisive pre-AB document is the paper of Werner Ehrenberg and Raymond E. Siday, \"The Refractive Index in Electron Optics and the Principles of Dynamics,\" published in Proceedings of the Physical Society B in 1949 . Ehrenberg was a Jewish refugee from Berlin who had built the X-ray and electron-optics laboratory at Birkbeck College, London; Siday was his student and co-worker. The paper's stated aim is electron-optical: to derive, from Hamilton's principle, the correct refractive index for electrons in arbitrary static electromagnetic fields, and to identify the conditions under which two electron-optical paths interfere coherently. Three results in that paper bear on the present dossier. First, they write the action along a ray as and identify the phase difference between two rays \\gamma 1, \\gamma 2 from a common source to a common image point as Second, they observe that if one subtracts the field-free dynamical phases — i.e., compares the situation with and without a confined magnetic source threaded between the two paths — what remains is exactly where the loop encloses the flux but the electron passes only through field-free space. Third — and this is the point the textbook tradition has effectively erased — they state explicitly that this phase shift will be observable as a displacement of the interference fringes in a two-beam electron interferometer. They write the result in the geometry that will, eight years later, become the Möllenstedt–Düker biprism ; they understand that the magnetic source can be confined; they understand the gauge-invariance of the loop integral. What they do not do is reframe the result as a statement that the potentials are physically more fundamental than the fields. They are doing electron optics, not foundations. What was known before Aharonov and Bohm wrote By the time of Aharonov and Bohm's submission in May 1959 , the following were already in print: (i) the relativistic minimal-coupling prescription \\mathbf{p}\\to\\mathbf{p}-e\\mathbf{A} in quantum mechanics (textbook material since Pauli's 1933 Handbuch article); (ii) the explicit formula \\Delta\\Phi = e\\Phi B/\\hbar for the two-beam electron interferometer with an enclosed flux ; (iii) the gauge-invariance of the loop integral; (iv) the prediction that this shift would be observable as a fringe displacement; (v) a working biprism electron interferometer in which such a shift could in principle be measured . Aharonov and Bohm cite Ehrenberg–Siday — the reference appears at submission, not as an added in proof afterthought . The reframing they contribute, and which Ehrenberg–Siday emphatically do not, is the foundational claim that in a non-simply-connected configuration the potentials carry locally meaningful information that the field tensor does not — a claim that takes the equation out of electron optics and places it at the center of the gauge-theory program that Wu and Yang will later formalize. The priority is therefore split, cleanly, between the equation (Ehrenberg–Siday, 1949, with a possible Franz precursor in 1939) and the interpretation (Aharonov–Bohm, 1959). The standard textbook compression of both into a single attribution is, by the lights of the actual published record, indefensible. The community label that survives this audit — Ehrenberg–Siday–Aharonov–Bohm effect — is the one used by Peshkin and Tonomura , by Olariu and Popescu , and by Hiley ; it is the label this dossier will use throughout. The Physics Itself: Minimal Coupling, the Line Integral, and the Two-Path Phase The Physics Itself: Minimal Coupling, the Line Integral, and the Two-Path Phase Start with minimal coupling. For a charge q (write q=-e for the electron, e 0) in an external electromagnetic field, the Schrödinger equation is obtained by the canonical substitution \\hat{\\mathbf{p}}\\to\\hat{\\mathbf{p}}-q\\mathbf{A}, i\\hbar\\,\\partial t\\to i\\hbar\\,\\partial t - q\\varphi: Under a gauge transformation \\mathbf{A}\\to\\mathbf{A}+\\nabla\\chi, \\varphi\\to\\varphi-\\partial t\\chi, the wavefunction transforms as \\psi\\to e^{iq\\chi/\\hbar}\\psi; the equation is form-invariant. In a region \\mathcal{R} where \\mathbf{B}=\\nabla\\times\\mathbf{A}=0 and \\mathbf{E}=-\\nabla\\varphi-\\partial t\\mathbf{A}=0, the potentials are locally pure gauge — but they need not be globally pure gauge if \\mathcal{R} is not simply connected. This is the topological hinge. Semiclassical (eikonal) derivation Factorize \\psi = \\psi 0\\,e^{iS/\\hbar}, where \\psi 0 solves the field-free problem and S is the field-induced phase. Substituting and keeping leading order in \\hbar (WKB), one finds that along a classical trajectory \\mathbf{r}(t), so the accumulated phase along a path \\Gamma from spacetime event a to b is For two paths \\Gamma 1,\\Gamma 2 from source to detector the phase difference is In the static magnetic case (no scalar potential), Stokes' theorem gives with \\Sigma any surface bounded by the closed loop. For an electron, \\Delta\\Phi =e\\Phi B/\\hbar. This is precisely the formula Ehrenberg and Siday wrote down in 1949 from a refractive-index argument in semiclassical electron optics , and which Aharonov and Bohm rederived from the Schrödinger equation in 1959 . The eikonal route makes the assumption set transparent: classical trajectories well-defined, paraxial envelope, \\hbar\\to 0. The result, however, survives outside that regime — which is the content of the path-integral derivation. Path-integral derivation In Feynman's formulation the propagator from a to b is with the electromagnetic action S {\\text{em}}=q\\!\\int(\\mathbf{A}\\cdot d\\boldsymbol{\\ell}-\\varphi\\,dt). Now suppose the configuration space is doubly connected — the plane minus the solenoid's cross-section, say — so that paths from a to b partition into homotopy classes labeled by winding number n\\in\\mathbb{Z}. Within a class, two paths can be continuously deformed into each other, and on any such deformation \\int\\mathbf{A}\\cdot d\\boldsymbol{\\ell} is invariant because \\mathbf{B}=0 in the accessible region (Stokes again). The propagator factorizes, where K^{(0)} n is the free propagator restricted to class n and \\Phi B is the flux through one elementary loop around the obstruction . For a two-arm interferometer one keeps the two leading classes (\"above\" and \"below\" the solenoid) and the cross term in K ^2 carries the phase factor \\exp(iq\\Phi B/\\hbar). Two features deserve emphasis. First, the result is exact in \\hbar — no WKB was invoked. Second, \\Delta\\Phi depends only on the homotopy class of the relative loop, not on its length, shape, or the electron's energy. That is what makes AB a topological phase, distinct from a generic geometrical (Berry) phase whose value depends on the geometry of the path in parameter space . Wu and Yang made the geometric content precise: the gauge-invariant datum is the holonomy \\exp\\!\\bigl(iq\\!\\oint\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell}/\\hbar\\bigr)\\in U(1) of a flat connection on a non-simply-connected base . Figure: Left — magnetic AB. Two electron paths encircle a confined flux \\Phi B; \\mathbf{B}=0 on both trajectories. The phase difference is the line integral of \\mathbf{A} around the closed loop, equal to \\Phi B by Stokes, depending only on the homotopy class. Right — electric AB. Two halves of a coherent wavepacket sit inside conducting Faraday cylinders held at potentials \\varphi 1(t),\\varphi 2(t) during the transit; \\mathbf{E}=0 in the interiors. The phase difference becomes the time integral of the potential difference. The electric variant on equal footing The 1959 paper proposed a second geometry . A coherent wavepacket is split; the two halves enter conducting Faraday cylinders held at potentials \\varphi 1(t),\\varphi 2(t) that are switched on only while the packets are deep inside. With \\mathbf{E}=0 everywhere on the trajectories, the minimal-coupling piece contributes This is the temporal analogue of the magnetic line integral — a holonomy of A 0 along the worldlines in a region where F {\\mu\\nu}=0 on the paths. In manifestly covariant form, the loop traced in spacetime around a region of nontrivial F {\\mu\\nu}. Magnetic AB encircles a spacelike worldtube of flux; electric AB brackets a timelike interval of \\varphi 1-\\varphi 2. The two variants are 4-covariantly the same statement but experimentally inequivalent, with quite different signal-to-noise budgets and very different histories of clean confirmation [10, 7, 13] — to be untangled in §6. Why the multiply connected configuration space matters If \\mathcal{R} is simply connected, the loop \\oint\\mathbf{A}\\cdot d\\boldsymbol{\\ell} bounds a surface entirely in \\mathcal{R}, on which \\mathbf{B}=0, so \\Phi B=0: no effect. AB requires both (i) \\mathbf{B}=0 throughout the accessible region (classical mechanics predicts nothing) and (ii) nontrivial \\pi {1}(\\mathcal{R}) (so the line integral cannot be eliminated by a global gauge transformation). The connection one-form A=\\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell} is closed but not exact; \\oint A pairs its de Rham class with the cycle [\\Gamma 1-\\Gamma 2]. Wu and Yang made this the operational definition of the field ; Berry generalized to curved connections on parameter space . The observable is the holonomy e^{i\\Delta\\Phi}\\in U(1), defined only modulo 2\\pi — already a warning against the careless reading that \"\\mathbf{A} itself is physical.\" Assumptions, regimes, what survives The derivations above assume (a) non-relativistic kinematics (in the eikonal version); relativistic corrections are organized by the same covariant line integral and are negligible at the tens-of-keV electron energies of every historical AB experiment. (b) The test charge is a probe; back-reaction on the source is neglected — a non-trivial omission once one starts asking where the missing momentum goes during the encounter, returned to in §7. (c) The flux is static (or slow on the transit time) in the magnetic case, and switching of \\varphi 1-\\varphi 2 is confined to the in-cylinder interval in the electric case; outside those regimes the simple line-integral formula picks up corrections from radiated fields. (d) The phase is gauge-invariant only as \\exp(i\\Delta\\Phi)\\in U(1), never as \\Delta\\Phi\\in\\mathbb{R} — the integer ambiguity of the loop integral is the same ambiguity that gives flux quantization in superconductors and is not a defect of the formalism. The clean, geometry-independent persistence of \\Delta\\Phi under deformation of the electron trajectory inside a fixed homotopy class is what marks AB as topological and distinguishes it from a generic Berry phase, even though Berry's framework formally contains it [9, 12, 10]. Biprism, Not Double Slit: The Geometry the Textbooks Erased Biprism, Not Double Slit: The Geometry the Textbooks Erased Every undergraduate text reaches for the same diagram: a point source, two narrow slits, a screen, and — improbably — a tiny solenoid floating between the slits. The pattern slides sideways as flux threads the solenoid. This image entered physics through Feynman's Lectures Volume III §15-5 and has been redrawn essentially unchanged for sixty years. It is a piece of pedagogy. None of the historic Aharonov–Bohm measurements used a double slit. The geometry that actually carried the field is the electron biprism , introduced by Möllenstedt and Düker at Tübingen in 1955 — four years before the Aharonov–Bohm paper and six years after Ehrenberg and Siday already had the line-integral phase in print . A biprism is not two slits. It is a thin metallized filament (typically a quartz fibre \\sim 0.5\\,\\mum in diameter, sputtered with gold) suspended between two grounded plates and biased to a few volts. The two halves of the incident electron wavefront pass on opposite sides of the wire and are deflected inward by the quasi-cylindrical field — wavefront division , the electron analogue of the Fresnel optical biprism. After the wire one has two coherent virtual sources separated by where \\alpha \\propto U {\\mathrm f} is the small deflection angle set by the wire bias U {\\mathrm f} and L {1} is the source-to-wire distance. The fringe spacing on the recording plane at distance L {2} from the wire is continuously tunable through U {\\mathrm f} — a knob no fixed slit pair possesses. Why did the biprism, not a literal Young arrangement, become universal? Three reasons converge. First , coherence economy. Slit widths of order an electron wavelength (\\lambda {\\mathrm e}\\approx 0.037\\,\\text{Å} at 100\\,keV) squander the source. The biprism deflects the incident wavefront onto itself; the only source-size condition is the van Cittert–Zernike s\\alpha \\ll \\lambda {\\mathrm e}, easily met by a field-emission tip but never by a thermal cathode behind two 1\\,\\mum apertures. Second , mechanical and electrostatic stability. A pair of nanometric slits at micrometric separation drifts, contaminates, and charges; a gold-on-quartz fibre with two grounded shields ran for years in the Tübingen and Hitachi instruments [8, 14, 15]. Third , fabrication. In the 1950s no laboratory could reliably lithograph clean 0.3\\,\\mum slits at 1\\,\\mum pitch; Jönsson's celebrated 1961 grating required a multistage galvanic protocol that few groups duplicated . Until silicon micromachining was routine, the biprism was the only practical phase-coherent electron interferometer. Read the experimental record with this in mind. - Chambers (1960) mounted a Möllenstedt biprism in a modified electron microscope and placed a tapered iron whisker in the shadow of the wire. The whisker's varying flux density along its length produced a tilted fringe pattern whose shear is the AB shift. No double slit ever sat in his column. - Boersch and collaborators (1960–61) at the TH Berlin worked with the same wavefront-dividing wire, substituting magnetic foils and small solenoids for Chambers' whisker. - Möllenstedt and Bayh (1962) performed the cleanest pre-Tonomura measurement: a Möllenstedt biprism with a \\sim 14\\,\\mum-diameter tungsten-wound solenoid downstream of the wire. They drove a continuously variable current and recorded the continuous shift of the fringes as a function of enclosed flux — a moving-fringe movie, not a one-shot photograph. Geometry: biprism. - Tonomura et al. (1986) folded a toroidal permalloy magnet inside a niobium superconducting shell and threaded its interior between the two arms of an electron-holographic interferometer — once more, a Möllenstedt biprism, with the toroid as the doubly-connected flux carrier. The biprism wire is visible as the central dark line of Tonomura's published holograms. The genuine double slit — a literal Young experiment with electrons — is Jönsson's 1961 Tübingen work , performed in the very building where Möllenstedt and Düker had introduced the biprism six years before. Jönsson lithographed copper slits \\sim 0.3\\,\\mum wide at \\sim 1\\,\\mum pitch, in groups of two, three and five, and recorded multi-slit diffraction patterns. The experiment is rightly canonical; it was never repurposed for an AB measurement, then or since. Pedagogy fused two distinct Tübingen experiments — Möllenstedt's biprism and Jönsson's slits — into a single composite image, then drew Aharonov and Bohm's solenoid into the gap. Figure: Cross-section of the Möllenstedt–Düker electron biprism used (with variants) in Chambers , Boersch , Möllenstedt–Bayh , and Tonomura et al. . The biased wire splits a single wavefront into two coherent virtual sources separated by d=2\\alpha L {1}; the confined flux \\Phi sits inside the doubly-connected region enclosed by paths I and II. Why does the misattribution matter beyond bookkeeping? Three substantive points. (i) The biprism is wavefront-division : every point along the incident wavefront contributes to both virtual beams. There is no discrete pair of trajectories one could honestly call \"the two slits\". The AB phase is not the phase difference between two designated rays; it is the holonomy of the U(1) connection around the doubly-connected exterior of the flux tube, integrated over the family of pairs of paths that link the loop with winding number \\pm 1. The biprism geometry makes this manifest. The two-slit cartoon hides it behind the fiction of two crystalline rays. (ii) The slits-and-solenoid picture invites the question what would happen if I closed one slit? In a biprism there is no slit to close: obstructing half of the wavefront halves the intensity of both virtual sources and destroys the interferometer entirely. The which-way intuition the textbook diagram sells is geometrically misleading. (iii) The biprism's continuous tuning of d through U {\\mathrm f} is precisely what allowed Möllenstedt and Bayh to verify that the AB shift depends only on \\Phi and not on the path separation — a sharp prediction of the Ehrenberg–Siday line integral and of Aharonov–Bohm that a rigid double slit cannot test. The \"double slit plus solenoid\" is best understood as the Feynman cartoon that won — an intuition pump that overran its own caveats. The machine of every historic AB measurement was, and for high-resolution electron interferometry remains, the Möllenstedt–Düker biprism. Olariu and Popescu's encyclopedic review and the Peshkin–Tonomura monograph are unambiguous on this; the Hiley reconstruction makes the same point about the pre-history . The mythology persists because the cartoon is easy to draw and the technology is easy to ignore. Landmark Experiments: Chambers, Möllenstedt–Bayh, Boersch, Tonomura Landmark Experiments: Chambers, Möllenstedt–Bayh, Boersch, Tonomura The experimental record of the magnetic Aharonov–Bohm (AB) effect is not a single confirmation but a twenty-six-year sequence of progressively cleaner exclusions. Each generation of apparatus was designed to answer the specific objection that had been raised against the previous one. To read the literature carefully is to watch the loophole shrink — from \"the field might leak around your whisker\" to \"the field is excluded by the Meissner state of a superconducting shell\" — and to see how the community standard of evidence was negotiated in the laboratory rather than in the formalism. Chambers (1960): the iron-whisker proof of concept R. G. Chambers at Bristol delivered the first experimental claim within months of appearing in print . The interferometer was a Möllenstedt–Düker biprism : a fine positively biased wire, on the order of a micron in diameter, placed between two grounded plates, deflects the two halves of a coherent electron wavefront toward each other so that they overlap and interfere on a downstream plane. Chambers' innovation was to place an iron whisker — a magnetized single-crystal needle a few microns long and a few hundred ångströms thick, tapering to a point — behind the biprism wire, oriented transverse to the electron paths. Because the whisker tapers, the enclosed flux \\Phi(z) varies along the electron's direction of travel; the predicted fringe pattern is therefore tilted, not merely translated, and the tilt is a direct readout of \\Delta\\varphi = (e/\\hbar)\\oint\\!\\mathbf{A}\\!\\cdot\\!\\mathrm{d}\\boldsymbol{\\ell} accumulated between the two semiclassical paths. Chambers observed precisely this tilt and, within the limits of his fringe visibility, the slope matched the predicted e/h per flux quantum. The proof-of-concept was striking, but a careful experimentalist could lodge two objections. First, the whisker is a magnetized ferromagnet whose stray field is not zero outside the geometric cylinder of the needle; it falls off as a dipole, and the electron paths in Chambers' geometry passed within a few microns of the whisker. The classical Lorentz deflection from those residual fields, while small, was not obviously negligible compared with the AB tilt. Second, the tilt is a derivative measurement of the phase, susceptible to drifts of source position, biprism voltage, and stray magnetic fields in the column. A control of the form \"turn the flux off and watch the tilt vanish\" was unavailable because the whisker is a permanent magnet. These objections did not disprove the result, but they prevented anyone from claiming that the field-free hypothesis had been ruled out experimentally. Boersch and the Berlin group (1959–1961): the overlapping record In parallel, Hans Boersch's electron-optics group at the TH Berlin had been studying phase shifts in biprism interferometers since the late 1950s, motivated more by Möllenstedt's program than by . Boersch, Hamisch, Grohmann, and Wohlleben reported phase displacements consistent with magnetic-vector-potential coupling in a series of Zeitschrift für Physik papers around 1960–1961 (exact volumes vary; see , verify) using thin ferromagnetic foils and biprism geometries closely related to Chambers'. The Berlin work is often omitted in English-language reviews because (i) it was published in German, (ii) it was not framed as a test of but as an extension of Möllenstedt–Düker electron optics, and (iii) it suffered from the same residual-field objection as Chambers, with no obvious incremental cleanliness. Hiley's reconstruction and the Peshkin–Tonomura monograph are unusually careful about restoring this strand to the record, where elsewhere it tends to be absorbed into a one-line citation alongside Chambers. Möllenstedt and Bayh (1962): the continuous-current solenoid The first experiment that meaningfully reduced the leakage objection was Möllenstedt and Bayh's at Tübingen . The flux source was no longer a permanent magnet but a tungsten wire some 14 μm in diameter, wound as a tiny helical solenoid only a few tens of microns long, suspended behind the biprism. A current was passed through the winding; the enclosed flux was now a continuously tunable parameter set by the experimenter. The recorded observable was the displacement of the fringe pattern as a function of I, and the predicted period \\Phi 0 = h/e was reproduced over many cycles. Two methodological advances followed from the geometry. First, with a thin solenoid one can compute the external field rigorously — a finite-length solenoid has a calculable fringing dipole field, and Möllenstedt and Bayh argued that the classical deflection it would induce was orders of magnitude below the observed AB shift. Second, because \\Phi could be ramped, the experiment supplied an internal null: I = 0 produced no shift, while I \\neq 0 shifted the fringes linearly. This is the strongest pre-Tonomura confirmation, and English-language pedagogy that jumps from Chambers to Tonomura silently elides the experiment that did the most work to make the result quantitative. The Bocchieri–Loinger critique Through the 1970s, P. Bocchieri and A. Loinger mounted a sustained critique arguing that all extant experiments were consistent with classical Lorentz deflection from fringing fields, and that the AB effect, properly construed, did not exist as a distinct phenomenon. Their argument exploited the fact that no real solenoid is infinite: the field outside any finite flux source is nonzero, and at sufficient sensitivity one can attribute the observed phase to that residual field acting locally on the electron. The community response was twofold. Theoretically, had already settled the question of principle: the gauge-invariant content of the loop is the holonomy \\exp(ie\\oint\\!\\mathbf{A}\\!\\cdot\\!\\mathrm{d}\\boldsymbol{\\ell}/\\hbar), and on a non-simply-connected configuration space this is not reducible to local field action . Experimentally, the critique demanded a setup in which the field outside the flux source could be quantitatively bounded by a separately verifiable physical principle, not merely by a model calculation. That demand pointed directly to superconductivity. Tonomura (1986): the superconducting-toroid closure The Hitachi group led by Akira Tonomura closed the loophole with a geometry specifically designed against Bocchieri–Loinger . A toroidal permalloy magnet — a closed flux loop with no end faces, hence no axial fringing field — was coated with a niobium layer and cooled below T c. Three exclusions were now simultaneously enforced: (i) the toroidal topology eliminates the fringing field of an open solenoid by construction; (ii) the Meissner state expels any residual external \\mathbf{B} to within the London penetration depth (\\sim 40\\,\\mathrm{nm} for Nb); (iii) a copper overlayer screened any electric potential difference between the magnet and the electron beam. The interferometer was a Möllenstedt biprism feeding an electron-holographic detection stage, which records the phase as a fringe pattern reconstructed from the hologram, not as a position of fringes susceptible to drift. The observed phase shift between electrons threading the torus and those passing outside was \\pi for \\Phi = \\Phi 0/2 and 0 for \\Phi = \\Phi 0 — flux quantization in the superconductor providing the discrete calibration, a circumstance Tonomura exploited to verify \\Phi 0 = h/2e for the Cooper-pair condensate while measuring the single-electron phase against a fluxoid background. The result was unambiguous: the magnetic AB phase exists in a regime where the magnetic field on the electron trajectory is bounded by the Meissner exclusion, not by an a priori model of a fringing field [7, 19]. What each experiment actually excluded Experiment Flux source What it demonstrated What it could not exclude --- --- --- --- Chambers 1960 Iron whisker Fringe tilt \\propto \\mathrm{d}\\Phi/\\mathrm{d}z at the predicted slope Dipole stray field from the magnetized needle Boersch et al. ca. 1960 Ferromagnetic foils, biprism Phase displacements consistent with (e/\\hbar)\\oint\\!\\mathbf{A}\\!\\cdot\\!\\mathrm{d}\\boldsymbol{\\ell} Residual ferromagnetic stray field Möllenstedt–Bayh 1962 Microscopic tungsten solenoid, ramped I Continuous, linear, periodic \\Delta\\varphi(I) with period \\Phi 0 = h/e; internal null at I = 0 Calculated — not measured — fringing field of finite solenoid Tonomura et al. 1986 Permalloy torus, Nb-shielded, Cu-screened \\Delta\\varphi with \\mathbf{B} on the trajectory bounded by Meissner exclusion The interpretive question of \\mathbf{A} vs. holonomy — settled by , not by experiment The arc is instructive. The 1960 experiment proved the phenomenon was real to anyone willing to grant a model of the stray field. The 1962 experiment proved it to anyone who took the model seriously. The 1986 experiment proved it to anyone who would only grant the Meissner effect. By the time Bocchieri and Loinger's argument was experimentally answerable, the theoretical reframing of had already moved the conceptual goalposts: the phenomenon to be demonstrated was no longer \"phase shift in zero \\mathbf{B}\" but \"non-trivial U(1) holonomy on a non-simply-connected configuration space,\" and Tonomura's torus realized exactly that — a topological obstruction baked into the geometry of the apparatus. From Refractive Index to Fiber Bundle: Wu–Yang, Berry, and What Superseded What From Refractive Index to Fiber Bundle: Wu–Yang, Berry, and What Superseded What The magnetic flux phase has been written down four times in four different mathematical languages. Each rewriting absorbed its predecessor as a special case while quietly retiring some of the older language's claims to fundamentality. The honest map is not a chain of equivalences but a sequence of strict generalizations punctuated by reinterpretations. Ehrenberg–Siday, 1949: A refractive index for electrons Ehrenberg and Siday were doing electron optics, not foundations . Their starting point was the eikonal limit of the Klein–Gordon (or Pauli) equation: write \\psi = a\\,e^{iS/\\hbar}, expand to leading order in \\hbar, and the action S satisfies a Hamilton–Jacobi equation whose level surfaces play the role of wavefronts. In an external (\\varphi,\\mathbf{A}) field, minimal coupling \\mathbf{p}\\to\\mathbf{p}-q\\mathbf{A} gives, for a quasi-monochromatic electron of energy E in a static field, They read off an effective refractive index n \\text{eff}=p/p 0 + (q/p 0)\\,\\hat{\\mathbf{t}}\\!\\cdot\\!\\mathbf{A}, the vector-potential term being the magnetic correction. For two ray paths \\Gamma 1,\\Gamma 2 meeting at a screen the phase difference contains the gauge-invariant piece \\Delta\\Phi {AB}=(q/\\hbar)\\oint {\\Gamma 1-\\Gamma 2}\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell}. What this language can do: predict fringe shifts for any two-beam electron interferometer threaded by flux. What it cannot do: survive its own assumptions. The derivation is semiclassical (eikonal), confined to single-particle non-relativistic kinematics, and silent on why \\mathbf{A} should appear in a region where \\mathbf{B}=0. Ehrenberg–Siday treat the result as an optical curiosity — an unavoidable consequence of minimal coupling in the WKB regime. The line integral is real; the interpretive question is not posed. Verdict. Still valid as the leading-\\hbar approximation in electron-optical instruments. Quietly retired as a foundation : the result is now derived non-perturbatively from gauge invariance, not from an eikonal expansion. Aharonov–Bohm, 1959: Potentials as ontological primitives The 1959 paper derives the same phase shift from the full Schrödinger equation rather than the eikonal limit, and then makes an interpretive move that Ehrenberg–Siday did not. In a multiply connected region where \\mathbf{B}=0, the wave function in each simply connected patch can be gauge-transformed to the field-free solution by \\psi\\to e^{i(q/\\hbar)\\int\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell}}\\psi 0, but the patchwise phase factors do not glue to a single-valued function: their mismatch on a non-contractible loop is exactly (q/\\hbar)\\oint\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell}. Bohm's reading — that this elevates the potentials above the fields in QM — is the load-bearing claim, and it is the claim Wu and Yang later corrected. The AB paper also broadens the phenomenology: a scalar analogue using time-varying \\varphi in field-free regions, and the prediction that the magnetic effect is periodic in the enclosed flux with period h/q. The latter prediction is not in Ehrenberg–Siday and is the first hint that the right invariant is not the integral \\oint\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell} itself but its exponential. Verdict. The equation is the same; the kinematic regime of validity is wider (no eikonal); the ontological claim that \"\\mathbf{A} is more fundamental than \\mathbf{B}\" is superseded — see below. Wu–Yang, 1975: Holonomy of a U(1) connection Wu and Yang dissolved the field-vs-potential dispute by identifying what is neither : the set of non-integrable phase factors For any closed loop \\Gamma bounding a surface \\Sigma on which \\mathbf{A} is regular, Stokes gives U(\\partial\\Sigma)=\\exp[(iq/\\hbar)\\!\\int \\Sigma\\!\\mathbf{B}\\!\\cdot\\! d\\mathbf{S}], so the field content is recovered. For loops around an excluded flux tube (no such \\Sigma exists in the physical region) U(\\Gamma) carries strictly more information than the local \\mathbf{B} field, and strictly less than \\mathbf{A} — the gauge redundancy \\mathbf{A}\\to\\mathbf{A}+\\nabla\\chi leaves U(\\Gamma) invariant. The mathematical home is a principal U(1) bundle over the configuration space M=\\mathbb{R}^3\\setminus\\text{(flux line)}; \\mathbf{A} is a connection 1-form, U(\\Gamma) its holonomy. AB becomes the statement that this connection is flat but non-trivial : \\mathbf{B}=d\\mathbf{A}=0 on M, yet \\pi 1(M)=\\mathbb{Z} supports a non-trivial character. This reframing supersedes the ontological reading of 1959 in a clean technical sense. \"Potentials are more fundamental than fields\" becomes the precise statement: the gauge-invariant data are neither the local potential nor the local field, but the holonomy assignment H^1(M,U(1)). The h/q periodicity that AB had to announce as a separate prediction is now automatic from U(\\Gamma)\\in U(1). Figure: Each successor language enlarges, rather than replaces, the regime of its predecessor. Ehrenberg–Siday is the WKB shadow of the AB phase; AB is the flat, topologically non-trivial subclass of Wu–Yang U(1) connections; Wu–Yang is the gauge-theoretic instance of Berry's adiabatic holonomy on a general U(1) bundle. Berry, 1984: Adiabatic holonomy and what it does not generalize Berry's analysis of adiabatic transport showed that an eigenstate n(\\mathbf{R})\\rangle carried slowly around a loop C in parameter space \\mathbf{R} acquires, beyond the dynamical phase, the geometrical phase The 1-form \\mathcal{A} n is a U(1) connection on the parameter-space bundle of rays; its curvature \\mathcal{F} n=d\\mathcal{A} n generically does not vanish. AB is recovered by taking \\mathbf{R}=\\mathbf{R} 0 — the position of the electron centroid — and noting that the relevant connection is exactly the EM vector potential. Crucially, the AB connection is flat on its base (\\mathcal{F}=0 outside the solenoid), so AB is the topological sub-case of Berry's geometrical construction: the phase depends only on the homotopy class [C]\\in\\pi 1(M), not on the loop's shape. Conflating \"topological\" with \"geometric\" here is the standard pedagogical sin and is technically wrong (verify). Verdict. Berry's framework subsumes AB; it does not supersede Wu–Yang, because the gauge-theoretic content of EM is logically prior to the adiabatic setting in which Berry's phase lives. What was retired, what survived A tidy ledger of the supersession: Claim Origin Status today --- --- --- \\Delta\\Phi=(q/\\hbar)\\oint\\!\\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell} as a refractive correction Ehrenberg–Siday 1949 Valid as the WKB limit; retired as the foundational statement  locally measurable, and reproducible across observers is neither A \\mu nor F {\\mu\\nu} alone but the holonomy defined modulo 2\\pi on closed loops \\gamma. Wu and Yang made this precise in 1975 : the field tensor under-determines the physics in non-simply-connected regions (two configurations with identical F {\\mu\\nu} on the accessible region can give different interference patterns), while A \\mu over-determines it (gauge transformations A \\mu \\to A \\mu + \\partial \\mu\\Lambda leave U[\\gamma] untouched). The complete and non-redundant description is the connection on a U(1) principal bundle; AB is the holonomy of a non-contractible loop encircling the excluded flux tube. The regime in which the loose version misleads: any discussion of locality, hidden variables, or the \"ontology of gauge fields\" [23, 24, 25]. Saying \"A is real\" invites a non-local-action picture that is not what gauge theory says; saying \"only F is real\" denies AB its content. The correct slogan is operational: the gauge-invariant content of electromagnetism is the collection of holonomies on all loops in the configuration space accessible to the charged matter . In simply-connected regions the holonomy data is equivalent to F {\\mu\\nu} on the region; in multiply-connected regions it strictly exceeds it. 2. Magnetic vs. electric AB The 1959 paper proposed two effects related by 4-vector covariance: magnetic AB (\\oint \\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell} around a confined flux) and electric AB (\\frac{e}{\\hbar}\\int(\\varphi 1-\\varphi 2)\\,dt accumulated while a wave packet sits inside a Faraday cage held at potential \\varphi i). Modern usage routinely collapses both into \"the AB effect,\" which obscures three regime-distinguishing facts. (i) The magnetic case is force-free in the strong sense : the electron paths traverse a region in which \\mathbf{E}=\\mathbf{B}=0 at all times. The electric case is force-free only if the potential is switched while the wave packet is fully inside the cage; any non-adiabatic ramp produces real fields at the cage walls and the experiment is no longer manifestly potential-induced. (ii) The experimental records are not symmetric. The magnetic effect was confirmed in stages culminating in Tonomura . A clean electric analogue — wave packet manifestly inside a field-free conductor during a time-varying potential — has been far harder to realize, and the few claimed measurements (van Oudenaarden et al. on Aharonov–Casher-like phases, the various scalar AB schemes in atom and neutron interferometry ) are subtler and continue to be argued about . (iii) Covariantly, both are holonomies of the same U(1) connection — one around a spatial loop, one around a loop in spacetime. Pedagogically, conflating them invites the assumption that an electric-AB confirmation rides on the magnetic record. It does not. 3. Topological vs. geometrical phase After Berry , a habit set in of describing AB as \"a special case of the Berry phase.\" The containment relation is correct; the slogan flattens a distinction that matters. A topological phase depends only on the homotopy class [\\gamma]\\in\\pi 1(M) of the loop in the configuration space M, not on the loop's geometry. Magnetic AB on \\mathbb{R}^3\\setminus(\\text{flux line}) is topological: \\pi 1 = \\mathbb{Z}, and the phase is n\\Phi/\\Phi 0 for winding number n, exactly invariant under any continuous deformation of the electron trajectory that does not cross the flux tube. A geometrical phase in Berry's sense depends on the geometry of the path in parameter space and generically varies continuously with deformations of the path; it vanishes for trivial loops in a flat connection. AB fits inside Berry's framework as the holonomy of a flat U(1) connection on a non-simply-connected base — flatness kills any local curvature contribution, non-trivial topology supplies the phase. The regime in which the loose identification misleads: anywhere robustness to noise or deformation is the point. Topological quantum computing protocols [21, 27] rely on the homotopy invariance; calling the AB phase \"just a Berry phase\" suggests it can be tuned away by smooth deformation, which is exactly what it cannot do. The optics literature on Pancharatnam-type geometrical phases inherits the same confusion when its authors reach for AB as a precedent: those phases are curvature integrals on S^2 (Poincaré sphere) and are deformable — they are not in the same homotopy class of statements. 4. \"Chambers settled it\" Chambers' 1960 fringe-shift observation is presented in undergraduate texts as the confirmation. The professional record was never that simple. Chambers used a tapered iron whisker as the flux source; fringing fields at the tip — geometrically unavoidable for any non-toroidal magnetization — gave Bocchieri and Loinger, and later Roy and a small but persistent school of critics, room to argue through the 1970s and 1980s that the observed shift was a force-mediated classical deflection. The community-level closure came in two stages: Möllenstedt–Bayh's continuously-tunable microsolenoid , which made the linear-in-current dependence quantitative, and Tonomura et al.'s toroidal permalloy magnet enclosed in a superconducting Nb shell , which excluded both fringing fields (geometry) and any residual leakage (Meissner expulsion) at the same time. The regime in which \"Chambers settled it\" misleads: any historiographical or foundational discussion. Citing Chambers alone in a paper on, say, the reality of gauge potentials is a citation error of substance, because the very objection that paper is meant to address (residual fields) is the one Chambers' geometry could not exclude. The correct citation chain for \"the magnetic AB effect is experimentally established in the strictly field-free regime\" is Chambers \\to Möllenstedt–Bayh \\to Tonomura, with the load-bearing step at Tonomura. 5. \"Double slit plus solenoid\" The Feynman Lectures figure — point source, two slits, tiny solenoid between them, shifted fringes on the screen — is iconic and pedagogically efficient. It is also a fiction in the sense that no historical AB measurement used that geometry. Möllenstedt and Düker's electrostatic biprism , a charged wire that refracts a single coherent electron beam into two overlapping virtual sources, is the actual interferometer in every clean AB experiment from Chambers through Tonomura. Jönsson's 1961 multi-slit grating is the closest realization of a literal Young's experiment with electrons and was not used in any AB measurement. The regime in which the textbook image misleads: anywhere coherence budgets, fringe visibility, or beam-separation scales are computed. The biprism produces a wavefield with very different transverse coherence properties than a true double slit; estimates of the maximum solenoid radius compatible with fringe visibility are off by orders of magnitude if one assumes Young-type geometry. For pedagogy of the phase shift itself the cartoon is harmless; for any quantitative interferometric analysis it is wrong geometry. What survives all five corrections is exactly what Ehrenberg and Siday wrote down in 1949 and Aharonov and Bohm reinterpreted in 1959 : the line integral of A \\mu along a path is the relevant phase, the holonomy around an excluded flux is gauge-invariant and measurable, and the topology of the accessible region is part of the physical input. Everything else — the slogans about reality, the unified electric-magnetic narrative, the Berry-phase containment, Chambers as terminus, and the double slit cartoon — is approximation, useful only when its regime is named. Current Frontier: Electric AB, Dispersionless vs. Force-Free Debates, Non-Abelian and Gravitational Analogues Current Frontier: Electric AB, Dispersionless vs. Force-Free Debates, Non-Abelian and Gravitational Analogues The magnetic flux phase is settled physics; what surrounds it is not. Four debates and four generalizations remain genuinely open, and each carries an experimental prize whose criterion is sharper than the prose around it usually admits. Electric AB: still waiting for its Tonomura The 1959 paper's second prediction — two co-moving wave packets sent through conducting cylinders held at different time-dependent potentials V 1(t), V 2(t), acquiring a relative phase while the wave packets sit inside field-free interiors — has never been confirmed at the level Tonomura delivered for the magnetic case [2, 15, 7]. The reason is structural: enforcing \\mathbf{E}=0 along the entire electron trajectory while V varies requires shielding of a quality that has never been adequately demonstrated for a free electron beam. The two most-cited \"electric AB\" experiments — Matteucci–Pozzi (1985) and Schmid (1984) — both used dielectric or charged-line geometries in which fringe fields cannot be excluded by symmetry, exactly the Bocchieri–Loinger objection that haunted Chambers. A cleaner programme has moved to neutral matter waves: van Oudenaarden et al. and several BEC interferometry groups have demonstrated scalar AB phases for atomic clock states acquired in nominally field-free regions of inhomogeneous potentials . But \"scalar AB for atoms\" is not the original 1959 prediction — the source charge q is replaced by a differential polarizability or an internal-state energy shift — and the proper electron version remains the open prize. A decisive electron electric-AB experiment would need: (i) two macroscopic Faraday cages whose interior potential can be switched on and off entirely while a coherent electron wave packet is inside, with rise/fall completed before the packet exits; (ii) shielding demonstrably below the level at which any time-derivative-of-flux argument can reproduce the phase classically. Closing this loophole is the electrostatic analogue of replacing Chambers' whisker with Tonomura's superconducting torus. The Vaidman dispute: is AB force-free? In 2012 Vaidman re-examined the magnetic effect and argued that the phase can be derived from ordinary Lorentz forces — not on the electron, but on the source currents in the solenoid, induced by the passing electron's own field (Vaidman, Phys. Rev. A 86 , 040101(R), 2012). The standard reading — that the electron experiences no force yet acquires a phase — was, in Vaidman's account, a sleight of hand that hid where the dynamics actually live. Aharonov, Cohen, and Rohrlich replied ( Phys. Rev. A 92 , 026101, 2015) that the local action–reaction bookkeeping does not survive the requirement of relativistic locality plus single-electron coherence; their position, restated in compact form in , is that the holonomy is a genuinely non-local phenomenon and Vaidman's force-on-the-source account smuggles in a classical particle-trajectory picture incompatible with the interferometric setup. The empirical wedge is dispersion. If AB were mediated by a residual force, an electron wave packet traversing the interferometer would acquire a time delay proportional to the phase, splitting the packet's group from its phase velocity. Caprez, Barwick, and Batelaan measured the transit time across a macroscopic toroidal magnet ( Phys. Rev. Lett. 99 , 210401, 2007) and found no such delay at the predicted level — a result the Aharonov camp reads as a clean force-free confirmation, and the Vaidman camp reads as merely bounding the back-action regime. A definitive resolution would require a single-electron interferometer with simultaneous phase and time-of-flight resolution at the few-attosecond level, ideally with a switchable source whose recoil can be independently monitored. No such experiment has yet been performed; the debate is open in the sense that no one has produced data that both sides accept. Non-Abelian AB and Wilczek–Zee holonomy Wilczek and Zee (1984) generalized Berry's construction to degenerate eigenspaces, where the connection becomes a matrix-valued one-form and parallel transport along non-contractible loops yields non-commuting holonomies U \\gamma = \\mathcal{P}\\exp\\bigl(i\\oint A \\mu^a T^a\\,dx^\\mu\\bigr). The cleanest realizations are not in electron interferometry but in cold-atom and molecular settings: dressed-state manifolds in alkali atoms exposed to engineered light fields support synthetic non-Abelian gauge potentials , and the same algebraic structure underlies the quantum-double anyon models reviewed in . The relevant experimental claim — observation of non-commutativity by reversing loop order and detecting a residual unitary — has been reported in trapped-ion and superconducting-qubit platforms, but a non-Abelian AB experiment in the strict sense (a topological loop around an excluded non-Abelian flux) remains a target rather than an achievement. The honest summary is that synthetic non-Abelian connections are routinely engineered; topologically protected non-Abelian holonomy of a confined flux has not been cleanly isolated outside the simulation regime. Neutral-particle and dual phases Aharonov–Casher (1984) showed that a neutral particle with magnetic moment \\boldsymbol{\\mu} moving around a line of charge acquires a phase (1/\\hbar c^2)\\oint(\\boldsymbol{\\mu}\\times\\mathbf{E})\\cdot d\\boldsymbol{\\ell}; the He–McKellar–Wilkens (1993) effect is the dual for an electric dipole circulating a magnetic monopole line. Both have been measured in neutron and atom interferometry — Cimmino et al. for AC, lattice-interferometer demonstrations for HMW — and both fit the same fibre-bundle framework as AB once one identifies the appropriate U(1) connection [26, 20, 9, 10]. They are not curiosities: they decide whether the \"potentials are fundamental\" reading survives the move to neutral matter, and the answer is yes — what is fundamental is the connection, with the electromagnetic case being one realization among several. A related frontier is excitonic and polaritonic AB: in semiconductor rings threaded by flux, a neutral electron–hole pair acquires a non-trivial phase whenever its internal polarization is non-zero, with experimental signatures in photoluminescence Aharonov–Bohm oscillations. Fractional AB phases in quantum-Hall edge-state interferometers, where the encircling quasiparticle carries fractional charge e^ =\\nu e, give \\Delta\\Phi = 2\\pi\\nu(\\Phi/\\Phi 0) and are the closest thing condensed matter has to a direct measurement of anyonic statistics . Gravitational analogues Two distinct effects circulate under \"gravitational AB\". The first is the gravitomagnetic phase: a slowly rotating mass generates a Lense–Thirring frame-dragging field \\mathbf{B} g \\sim G\\mathbf{J}/r^3, and a particle encircling its angular-momentum axis acquires \\Delta\\Phi g \\propto \\oint \\mathbf{A} g \\cdot d\\boldsymbol{\\ell}. Estimated for Earth-based atom interferometers it is below current sensitivity by two orders of magnitude (verify), though next-generation long-baseline atom interferometers (MAGIS, AION) close the gap. The second is the conical-defect AB: a cosmic string, or any conical singularity, produces a flat exterior geometry with deficit angle \\delta, and matter waves encircling it pick up a phase that depends only on the topology — a literal gravitational holonomy. Laboratory analogues in liquid-crystal disclinations and graphene cones have demonstrated the wave-mechanical effect . Crucially, the COW (Colella–Overhauser–Werner, 1975) phase, often miscalled \"gravitational AB\", is not AB-like at all: it arises from a non-zero gravitational force along the interferometer arms. Genuine gravitational AB requires a force-free region with non-trivial topology around a confined source. What would count as decisive Four experiments would close four debates: (1) a switchable Faraday-cage electric-AB measurement with quantified shielding, completing the magnetic-case programme for the electric variant; (2) attosecond-resolved transit timing in a single-electron AB interferometer, adjudicating Vaidman's force-on-source account against the holonomy reading; (3) sequential non-commuting loops around a topologically isolated non-Abelian flux source, proving non-Abelian AB rather than non-Abelian Berry; (4) detection of the gravitomagnetic AB phase from a controllably rotated source mass in an atom interferometer, separating it from the COW force contribution. None requires new physics. Each requires a level of experimental control that did not exist a decade ago and now plausibly does. The AETHER Verdict The AETHER Verdict I have spent six sections arguing that the textbook compression of this story is wrong in roughly four ways simultaneously. Here is where I will plant my flag. (a) What I defend with my reputation The magnetic flux phase \\Delta\\Phi = (q/\\hbar)\\oint A\\!\\cdot\\!d\\boldsymbol{\\ell}, read as the holonomy \\exp(iq\\Phi/\\hbar) of a U(1) connection around a non-contractible loop, is settled physics. It was derived correctly by Ehrenberg and Siday in 1949 from semiclassical electron optics; it was rederived and — more importantly — reinterpreted by Aharonov and Bohm in 1959; and it was experimentally isolated from any conceivable residual-field artefact by Tonomura's superconductor-shielded toroid in 1986. The Möllenstedt–Bayh continuous-solenoid measurement of 1962, not Chambers 1960, is the first experiment I would put in front of a sceptic without an asterisk. I will defend, in equal seriousness, the claim that the correct mathematical home of the effect is Wu–Yang's bundle picture, not the \"potentials are real\" slogan: the gauge-invariant object is the holonomy class, and the slogan is a casualty of pedagogy. (b) What is shakier than the literature admits Three things, named specifically. First, the Franz 1939 precursor . Hiley and Peshkin–Tonomura cite it; I have never seen the Danzig proceedings entry quoted verbatim in the secondary literature, and the chain of attribution is suspiciously short. Until somebody reproduces the actual paragraph, \"Franz anticipated AB\" should be tagged plausible but unverified , not folded into the historical record. Second, \"force-free\" propaganda around the magnetic AB effect . The claim that the electron experiences no local Lorentz force in the field-free region is true at the level of expectation values for a wave packet that stays outside the flux tube, but it is routinely overstated. Boyer's long-running dissent and the more recent semiclassical analyses of lateral momentum transfer have not been cleanly killed; they have been argued past. The honest statement is: the phase is force-free; the individual trajectory in any realistic preparation is a separate and unfinished discussion. Third, the electric AB experimental record . The magnetic case is closed; the electric case is not. The cleanest measurements (van Oudenaarden-style mesoscopic, and the dispersionless time-dependent variants) are subtler than their citations admit, and the textbook habit of writing \"and similarly for the electric case\" papers over a genuinely thinner empirical floor. (c) Three open questions I would actually work on, ranked 1. Dispersionless electric AB with a true time-dependent scalar potential — the cleanest test of 4-vector covariance of the phase, and the place I expect the next decisive experiment. 2. Non-Abelian AB / Wilczek–Zee holonomy in cold-atom or photonic synthetic gauge fields — the regime where \"holonomy\" stops commuting and the bundle picture earns its keep. 3. Gravitational AB via the COW-successor interferometers — whether the Christoffel-connection holonomy around a mass-excluded region is observable in principle, and what counts as \"excluded\" when the connection is not flat. (d) Reading path Five works, in order, each chosen to do one job. 1. Ehrenberg \u0026 Siday (1949) — read first, because everything textbooks attribute to 1959 is already here, in electron-optical language. 2. Aharonov \u0026 Bohm (1959) — read second, for the interpretive move (potentials as locally meaningful in QM) that Ehrenberg–Siday did not make. 3. Möllenstedt \u0026 Bayh (1962) — read third, as the first experiment a referee cannot impeach on stray-field grounds. 4. Wu \u0026 Yang (1975) — read fourth, because this is where the slogan dies and the connection-on-a-fibre-bundle picture takes over. 5. Tonomura et al. (1986) — read fifth, as the experimental capstone and the reason the Bocchieri–Loinger objection is no longer a live position. Read in that order, t"}</script>

t framing is therefore not a later pedagogical gloss but the original geometry. Experimental verification followed in the same Bristol group (Chambers 1960, using a tapered iron whisker behind a Möllenstedt biprism), in Tübingen (Boersch 1961; Möllenstedt and Bayh 1962, with macroscopic solenoids), and was made watertight against flux-leakage objections by Tonomura's Hitachi group (1986) using toroidal ferromagnets fully enclosed in a superconductor.", "credit_audit": "Textbook usage almost universally reads \"the Aharonov–Bohm effect, predicted by Aharonov and Bohm in 1959 and confirmed by Chambers in 1960.\" The historical record is more layered. (i) Ehrenberg and Siday published the magnetic-flux phase shift in 1949, in the explicit two-beam-electron-interferometer geometry, deriving ΔΦ = (e/ℏ)∮A·dℓ from semiclassical electron optics. Aharonov and Bohm cite them at submission; most textbooks do not. The conscientious community label is \"Ehrenberg–Siday–Aharonov–Bohm effect,\" which appears in Peshkin–Tonomura, Olariu–Popescu, and Hiley's writings but rarely in pedagogy. (ii) Walter Franz is cited by a thread of historiography (Hiley; Peshkin–Tonomura) as having stated something close to the result at a 1939 Danzig meeting — established record vs. folklore here is debatable; the proceedings entry has not, to my knowledge, been authoritatively reproduced. (iii) On the experimental side, Chambers (1960) is the canonical first observation, but the iron-whisker geometry left an honest physicist room to argue that fringing fields might leak into the electron paths; the truly clean confirmations are Möllenstedt–Bayh (1962, continuous-current solenoid) and Tonomura et al. (1986, superconductor-shielded torus). Pedagogy compresses these into a single citation. (iv) Aharonov and Bohm's distinct contribution is not the equation but its interpretive reframing: potentials, not fields, are the locally meaningful objects in QM. That reframing motivated Wu–Yang's holonomy formulation and Berry's geometric phase — none of which is in Ehrenberg–Siday. So the priority is split: equation and two-slit geometry to Ehrenberg–Siday (with a possible Franz precursor), foundational interpretation to Aharonov–Bohm, clean experiment to Tonomura.", "timeline": [{"year": 1924, "event": "de Broglie postulates matter waves; the kinematic prerequisite for any electron interference effect", "who": "Louis de Broglie", "work": "Doctoral thesis, Sorbonne; later Ann. Phys.", "kind": "theory", "ref": 5}, {"year": 1927, "event": "Electron diffraction experimentally established (Davisson–Germer at Bell; Thomson at Aberdeen); makes phase-coherent electron optics conceivable", "who": "C. Davisson, L. Germer, G. P. Thomson", "work": "Nature / Phys. Rev.; recognized by 1937 Nobel Prize", "kind": "observation", "ref": 6}, {"year": 1939, "event": "Walter Franz reports (allegedly) the magnetic-flux phase shift at a Danzig DPG meeting, on the eve of WWII; the talk circulates in central-European electron-optics circles but is essentially lost", "who": "Walter Franz", "work": "Verhandlungen der Deutschen Physikalischen Gesellschaft, Danzig session (verify)", "kind": "theory", "ref": 3}, {"year": 1949, "event": "Ehrenberg and Siday derive ΔΦ = (e/ℏ)∮A·dℓ as a refractive-index correction in electron optics and explicitly note that a confined flux shifts the interference pattern of a two-beam electron interferometer — the actual first published statement of the effect", "who": "W. Ehrenberg, R. E. Siday", "work": "Proc. Phys. Soc. B 62, 8–21", "kind": "theory", "ref": 1}, {"year": 1955, "event": "Möllenstedt–Düker electron biprism: an electrostatic wire that splits and recombines an electron beam, providing the practical interferometer in which AB will be measured", "who": "G. Möllenstedt, H. Düker", "work": "Naturwissenschaften 42, 41", "kind": "observation", "ref": 8}, {"year": 1959, "event": "Aharonov and Bohm publish the canonical paper; rederive the magnetic case from the Schrödinger equation in an explicit two-slit + solenoid geometry, propose the electric (cylinder) analogue, and reinterpret the result as evidence for the ontological primacy of potentials in QM", "who": "Y. Aharonov, D. Bohm", "work": "Phys. Rev. 115, 485 (received May 1959; cites Ehrenberg–Siday at submission)", "kind": "formalization", "ref": 2}, {"year": 1960, "event": "First experimental verification: Chambers at Bristol uses a Möllenstedt biprism with a tapered iron whisker as the flux carrier and observes the predicted fringe shift", "who": "R. G. Chambers", "work": "Phys. Rev. Lett. 5, 3", "kind": "observation", "ref": 17}, {"year": 1961, "event": "Jönsson realizes the genuine multi-slit electron diffraction grating (Tübingen), supplying the literal Young's-experiment-with-electrons that pedagogy welds to AB", "who": "Claus Jönsson", "work": "Z. Phys. 161, 454", "kind": "observation", "ref": 16}, {"year": 1962, "event": "Möllenstedt and Bayh measure a continuous fringe shift versus current in a tiny tungsten-wound solenoid, confirming AB with a true confined flux source", "who": "G. Möllenstedt, W. Bayh", "work": "Naturwissenschaften 49, 81", "kind": "observation", "ref": 18}, {"year": 1964, "event": "Feynman lectures III explicitly present AB as a magnetic-flux-induced shift of a two-slit electron interference pattern, fixing the modern textbook image", "who": "R. P. Feynman", "work": "The Feynman Lectures on Physics III, §15-5", "kind": "naming", "ref": 14}, {"year": 1975, "event": "Wu and Yang recast AB as the statement that the gauge-invariant content of electromagnetism is the set of non-integrable phase factors exp(ie∮A·dℓ/ℏ); AB becomes the prototype of holonomy in a U(1) bundle", "who": "T. T. Wu, C. N. Yang", "work": "Phys. Rev. D 12, 3845", "kind": "formalization", "ref": 11}, {"year": 1984, "event": "Berry's geometric phase identifies AB as a special case of adiabatic holonomy in parameter space, embedding it in the wider geometric-phase program", "who": "M. V. Berry", "work": "Proc. R. Soc. A 392, 45", "kind": "revival", "ref": 9}, {"year": 1985, "event": "Olariu and Popescu publish the encyclopedic review settling many disputed interpretations and collating two decades of experiments", "who": "S. Olariu, I. I. Popescu", "work": "Rev. Mod. Phys. 57, 339", "kind": "formalization", "ref": 12}, {"year": 1986, "event": "Tonomura et al. at Hitachi enclose a toroidal permalloy magnet in a superconducting Nb shell and observe the predicted fringe shift with field strictly excluded from the electron paths — closing the residual leakage loophole", "who": "A. Tonomura, N. Osakabe, T. Matsuda, T. Kawasaki, J. Endo, S. Yano, H. Yamada", "work": "Phys. Rev. Lett. 56, 792", "kind": "observation", "ref": 10}, {"year": 1989, "event": "Peshkin and Tonomura's monograph consolidates the theoretical and experimental record and is the first source to systematically credit Ehrenberg–Siday in pedagogical form", "who": "M. Peshkin, A. Tonomura", "work": "The Aharonov–Bohm Effect, Lecture Notes in Physics 340, Springer", "kind": "revival", "ref": 15}, {"year": 2009, "event": "Hiley's historical reconstruction documents how the 1959 paper came about, Bohm's role, and the misplaced priority", "who": "B. J. Hiley", "work": "\"The Early History of the Aharonov–Bohm Effect\", arXiv:1304.4736 / Festschrift contributions", "kind": "revival", "ref": 7}], "neglected": [{"name": "Werner Ehrenberg \u0026 Raymond E. Siday", "role": "Derived the magnetic-flux phase shift in a two-beam electron interferometer in 1949 — a full decade before Aharonov–Bohm — within an electron-optics refractive-index framework. Ehrenberg was a Jewish refugee from Berlin who built Birkbeck's X-ray and electron-optics group; Siday was his student. The paper was cited in the AB paper itself but vanished from textbook attribution.", "evidence": "The 1949 Proc. Phys. Soc. B paper is explicit; Hiley's historical articles and Peshkin–Tonomura's monograph both reconstruct the priority.", "ref": 1}, {"name": "Walter Franz", "role": "Reportedly presented the magnetic phase-shift argument at a 1939 Danzig DPG meeting, predating Ehrenberg–Siday; the war and the venue made the talk effectively unrecoverable. Franz revisited the topic in print in the 1960s after AB.", "evidence": "Discussed by Hiley (2013) and in Peshkin–Tonomura (1989); the original proceedings entry is hard to verify (verify).", "ref": 3}, {"name": "Hans Boersch", "role": "Performed early biprism electron-interference experiments at the TH Berlin in which the influence of magnetic vector potentials on electron phases was investigated independently of, and overlapping with, Chambers' Bristol work.", "evidence": "Boersch's papers in Z. Phys. ca. 1960–1961 on phase shifts in electron interferometers; cited in Peshkin–Tonomura.", "ref": 28}, {"name": "Gottfried Möllenstedt \u0026 Wolfgang Bayh", "role": "Produced the cleanest pre-Tonomura experimental confirmation using continuously variable current in a microscopic solenoid, fully separating field and beam — Tübingen, 1962. Routinely under-cited in English-language textbooks that jump from Chambers (1960) straight to Tonomura (1986).", "evidence": "Möllenstedt \u0026 Bayh, Naturwissenschaften 49 (1962); Bayh's Tübingen dissertation (verify).", "ref": 18}, {"name": "Akira Tonomura", "role": "More than just \"the experimentalist who confirmed AB\" — designed the toroidal superconductor-shielded magnet that defeated every flux-leakage objection. His later electron-holography work generalized AB measurement to flux quantization and vortex imaging.", "evidence": "1986 PRL; his memoir/obituary in Physics Today (2012) and Hitachi-published retrospectives.", "ref": 4}], "conflations": [{"claim": "\"The Aharonov–Bohm effect proves that the vector potential A is more fundamental than the magnetic field B.\"", "clarification": "What is gauge-invariant and physical is the holonomy exp(ie∮A·dℓ/ℏ) — equivalently, the line integral mod 2π — not A itself. Wu and Yang (1975) made this precise: in non-simply-connected regions the field tensor under-determines the physics, but A also over-determines it (it carries gauge redundancy). The correct statement is that electromagnetism in QM is a U(1) connection, and AB is the holonomy of a non-trivial loop around an excluded flux."}, {"claim": "\"The AB effect is the magnetic flux shifting a Young double-slit pattern.\"", "clarification": "The 1959 paper proposed two distinct effects: (a) magnetic AB — a confined flux between two interfering electron paths; (b) electric AB — two conducting cylinders held at different potentials through which wave packets pass during the time the potential is on. They are related by 4-vector covariance but the electric variant has different experimental signatures and a different (and more contested) experimental record. Conflating them under \"the AB effect\" obscures that the cleanest electric-AB confirmations are far more recent and far more subtle."}, {"claim": "\"The AB phase is just a special case of Berry's geometric phase.\"", "clarification": "AB is a topological phase (depends only on the winding around an excluded region, independent of path geometry within a homotopy class), whereas Berry's phase is generally geometrical (depends on the geometry of the path in parameter space, vanishing only for trivial loops in flat parameter spaces). AB fits inside Berry's framework as the abelian holonomy of a flat connection on a non-simply-connected base — but the topological vs. geometrical distinction matters for, e.g., why AB is exactly preserved under deformations of the electron trajectory while a generic Berry phase is not."}, {"claim": "\"Chambers' 1960 experiment settled the question.\"", "clarification": "Chambers used an iron whisker, not a confined flux; sceptics (notably Bocchieri and Loinger in a series of 1978+ critiques) maintained that residual fringing fields and not the vector potential were responsible. The community-level settlement came only with Tonomura's superconducting-toroid experiments (1986)."}, {"claim": "\"AB is the electron-double-slit experiment with a magnet behind the screen.\"", "clarification": "The standard demonstration geometry is a biprism (Möllenstedt–Düker), not a Young-type double slit; Jönsson's 1961 multi-slit grating is the closest to a literal Young experiment and was not the geometry used in any historic AB measurement. The \"double slit + solenoid\" image originates with Feynman's pedagogical figure in Lectures III, not with the experiments."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins and Forgotten Pioneers: Franz, Ehrenberg–Siday, and the 1949 Priority", "markdown": "## Origins and Forgotten Pioneers: Franz, Ehrenberg–Siday, and the 1949 Priority\n\nThe textbook sentence — *\"Aharonov and Bohm predicted in 1959 that a confined magnetic flux would shift an electron interference pattern, and Chambers confirmed it in 1960\"* — is, as a matter of historical fact, wrong in its first clause and incomplete in its second. The magnetic-flux phase shift had been written down, in print, in English, in an unambiguous two-beam electron-interferometric geometry, ten years before Aharonov and Bohm's paper [1][2]. There is, in addition, a credible but evidentially fragile claim that the same result was stated orally a further decade earlier, in Danzig, in 1939 [3][4]. To reconstruct what was actually known in 1959, one must work backwards from the kinematic prerequisites.\n\n### The kinematic prerequisites: matter waves and electron diffraction\n\nThe Ehrenberg–Siday–Aharonov–Bohm (ESAB) effect is a statement about the phase of an electron wavefunction transported along a path in a region where $\\mathbf{B}=0$ but $\\mathbf{A}\\neq 0$. Before this phase could be written down, two things had to exist: the de Broglie relation, and the experimental demonstration that electrons actually interfere.\n\nDe Broglie's 1924 Sorbonne thesis postulated $p = h/\\lambda$ for material particles and gave the dispersion relation that makes \"electron optics\" a meaningful phrase at all [5]. The kinematic identification of an electron with a wave of definite wavevector is the *sine qua non* of every subsequent argument: the AB phase $\\Delta\\Phi = (e/\\hbar)\\oint \\mathbf{A}\\cdot d\\boldsymbol{\\ell}$ is the integrated correction to the dynamical phase $\\int \\mathbf{k}\\cdot d\\boldsymbol{\\ell}$ in the minimally-coupled WKB expression\n$$\\psi(\\mathbf{r}) \\;\\sim\\; \\exp\\!\\left[\\frac{i}{\\hbar}\\int_{\\gamma}\\!\\bigl(\\mathbf{p} - e\\mathbf{A}\\bigr)\\cdot d\\boldsymbol{\\ell}\\right].$$\nWithout de Broglie, there is no $\\mathbf{k}$ to correct.\n\nThree years later, Davisson and Germer at Bell Labs, and independently G. P. Thomson at Aberdeen, made electron diffraction a laboratory phenomenon [6]. By the early 1930s, Knoll and Ruska's electron microscope had recast the optical analogy into a working engineering discipline: lenses, apertures, refractive indices, all derived from the Hamilton-optical analogy in which the role of the optical path length $\\int n\\,ds$ is played by the action $\\int \\mathbf{p}\\cdot d\\boldsymbol{\\ell}/\\hbar$. *This* is the conceptual world in which Ehrenberg–Siday would write — the world of electron optics rather than the world of foundational quantum mechanics. The distinction matters: it explains why their paper sat in the electron-microscopy literature for a decade without attracting the attention of the foundations community, and why Aharonov and Bohm's reframing of the same equation as a statement about *the ontology of the potentials* counts as a genuinely separate contribution.\n\n### Franz at Danzig, 1939: the murkiest item in the record\n\nThe earliest claim to priority belongs to Walter Franz, who reportedly presented an argument for the magnetic-flux phase shift at a meeting of the Deutsche Physikalische Gesellschaft in Danzig in May 1939 [3]. The sources for this are Hiley's historical reconstructions [4] and the introductory matter of Peshkin and Tonomura's monograph [7]; both report it as something Franz himself later asserted in correspondence, and both treat it with appropriate caution. The published proceedings entry is hard to locate, the talk was given in a venue and a moment (Danzig, four months before the German invasion of Poland) calculated to ensure that whatever was said there would not propagate, and Franz himself only returned to the subject in print in the 1960s, after AB.\n\nThe honest classification is: **plausible but disputed**. There is no extant manuscript that I have been able to verify; what circulates is an oral testimony chain. Franz's later technical competence in exactly this area lends the claim credibility, but credibility is not evidence. The conscientious move in this dossier is to mention Franz in every priority discussion and to refuse to write him into the canonical chain until the Danzig proceedings are recovered.\n\n### Ehrenberg and Siday, 1949: the unambiguous derivation\n\nThe decisive pre-AB document is the paper of Werner Ehrenberg and Raymond E. Siday, *\"The Refractive Index in Electron Optics and the Principles of Dynamics,\"* published in *Proceedings of the Physical Society B* in 1949 [1]. Ehrenberg was a Jewish refugee from Berlin who had built the X-ray and electron-optics laboratory at Birkbeck College, London; Siday was his student and co-worker. The paper's stated aim is electron-optical: to derive, from Hamilton's principle, the correct refractive index for electrons in arbitrary static electromagnetic fields, and to identify the conditions under which two electron-optical paths interfere coherently.\n\nThree results in that paper bear on the present dossier.\n\nFirst, they write the action along a ray as\n$$S[\\gamma] \\;=\\; \\int_{\\gamma}\\!\\bigl(\\mathbf{p} - e\\mathbf{A}\\bigr)\\cdot d\\boldsymbol{\\ell},$$\nand identify the phase difference between two rays $\\gamma_1, \\gamma_2$ from a common source to a common image point as\n$$\\Delta\\Phi \\;=\\; \\frac{1}{\\hbar}\\bigl(S[\\gamma_1] - S[\\gamma_2]\\bigr).$$\n\nSecond, they observe that if one subtracts the field-free dynamical phases — i.e., compares the situation with and without a confined magnetic source threaded between the two paths — what remains is exactly\n$$\\Delta\\Phi_{\\text{AB}} \\;=\\; \\frac{e}{\\hbar}\\oint_{\\gamma_1 - \\gamma_2}\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell} \\;=\\; \\frac{e\\,\\Phi_B}{\\hbar},$$\nwhere the loop encloses the flux but the electron passes only through field-free space.\n\nThird — and this is the point the textbook tradition has effectively erased — they state explicitly that this phase shift will *be observable as a displacement of the interference fringes* in a two-beam electron interferometer. They write the result in the geometry that will, eight years later, become the Möllenstedt–Düker biprism [8]; they understand that the magnetic source can be confined; they understand the gauge-invariance of the loop integral. What they do *not* do is reframe the result as a statement that the potentials are physically more fundamental than the fields. They are doing electron optics, not foundations.\n\n### What was known before Aharonov and Bohm wrote\n\nBy the time of Aharonov and Bohm's submission in May 1959 [2], the following were already in print: (i) the relativistic minimal-coupling prescription $\\mathbf{p}\\to\\mathbf{p}-e\\mathbf{A}$ in quantum mechanics (textbook material since Pauli's 1933 *Handbuch* article); (ii) the explicit formula $\\Delta\\Phi = e\\Phi_B/\\hbar$ for the two-beam electron interferometer with an enclosed flux [1]; (iii) the gauge-invariance of the loop integral; (iv) the prediction that this shift would be observable as a fringe displacement; (v) a working biprism electron interferometer in which such a shift could in principle be measured [8]. Aharonov and Bohm cite Ehrenberg–Sida
