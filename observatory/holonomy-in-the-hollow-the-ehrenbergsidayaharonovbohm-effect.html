y — the reference appears at submission, not as an *added in proof* afterthought [4]. The reframing they contribute, and which Ehrenberg–Siday emphatically do not, is the foundational claim that in a non-simply-connected configuration the potentials carry locally meaningful information that the field tensor does not — a claim that takes the equation out of electron optics and places it at the center of the gauge-theory program that Wu and Yang [9] will later formalize.\n\nThe priority is therefore split, cleanly, between the *equation* (Ehrenberg–Siday, 1949, with a possible Franz precursor in 1939) and the *interpretation* (Aharonov–Bohm, 1959). The standard textbook compression of both into a single attribution is, by the lights of the actual published record, indefensible. The community label that survives this audit — *Ehrenberg–Siday–Aharonov–Bohm effect* — is the one used by Peshkin and Tonomura [7], by Olariu and Popescu [10], and by Hiley [4]; it is the label this dossier will use throughout."}, {"id": "the-physics-itself", "title": "The Physics Itself: Minimal Coupling, the Line Integral, and the Two-Path Phase", "markdown": "## The Physics Itself: Minimal Coupling, the Line Integral, and the Two-Path Phase\n\nStart with minimal coupling. For a charge $q$ (write $q=-e$ for the electron, $e\u003e0$) in an external electromagnetic field, the Schrödinger equation is obtained by the canonical substitution $\\hat{\\mathbf{p}}\\to\\hat{\\mathbf{p}}-q\\mathbf{A}$, $i\\hbar\\,\\partial_t\\to i\\hbar\\,\\partial_t - q\\varphi$:\n\n$$i\\hbar\\,\\frac{\\partial\\psi}{\\partial t} \\;=\\; \\left[\\frac{1}{2m}\\bigl(-i\\hbar\\nabla - q\\mathbf{A}\\bigr)^{2} + q\\varphi + V\\right]\\psi.$$\n\nUnder a gauge transformation $\\mathbf{A}\\to\\mathbf{A}+\\nabla\\chi$, $\\varphi\\to\\varphi-\\partial_t\\chi$, the wavefunction transforms as $\\psi\\to e^{iq\\chi/\\hbar}\\psi$; the equation is form-invariant. In a region $\\mathcal{R}$ where $\\mathbf{B}=\\nabla\\times\\mathbf{A}=0$ and $\\mathbf{E}=-\\nabla\\varphi-\\partial_t\\mathbf{A}=0$, the potentials are *locally* pure gauge — but they need not be *globally* pure gauge if $\\mathcal{R}$ is not simply connected. This is the topological hinge.\n\n### Semiclassical (eikonal) derivation\n\nFactorize $\\psi = \\psi_0\\,e^{iS/\\hbar}$, where $\\psi_0$ solves the field-free problem and $S$ is the field-induced phase. Substituting and keeping leading order in $\\hbar$ (WKB), one finds that along a classical trajectory $\\mathbf{r}(t)$,\n\n$$\\frac{dS}{dt} \\;=\\; q\\,\\dot{\\mathbf{r}}\\cdot\\mathbf{A} \\;-\\; q\\,\\varphi,$$\n\nso the accumulated phase along a path $\\Gamma$ from spacetime event $a$ to $b$ is\n\n$$S_\\Gamma \\;=\\; q\\!\\int_{\\Gamma}\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell} \\;-\\; q\\!\\int_{\\Gamma}\\!\\varphi\\,dt.$$\n\nFor two paths $\\Gamma_1,\\Gamma_2$ from source to detector the phase difference is\n\n$$\\Delta\\Phi \\;=\\; \\frac{q}{\\hbar}\\!\\oint_{\\Gamma_1-\\Gamma_2}\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell} \\;-\\; \\frac{q}{\\hbar}\\!\\oint_{\\Gamma_1-\\Gamma_2}\\!\\varphi\\,dt.$$\n\nIn the static magnetic case (no scalar potential), Stokes' theorem gives\n\n$$\\Delta\\Phi_{\\text{mag}} \\;=\\; \\frac{q}{\\hbar}\\!\\oint\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell} \\;=\\; \\frac{q}{\\hbar}\\,\\Phi_{B},\\qquad \\Phi_{B}=\\int_{\\Sigma}\\mathbf{B}\\cdot d\\mathbf{S},$$\n\nwith $\\Sigma$ any surface bounded by the closed loop. For an electron, $|\\Delta\\Phi|=e\\Phi_B/\\hbar$. This is precisely the formula Ehrenberg and Siday wrote down in 1949 from a refractive-index argument in semiclassical electron optics [1], and which Aharonov and Bohm rederived from the Schrödinger equation in 1959 [2]. The eikonal route makes the assumption set transparent: classical trajectories well-defined, paraxial envelope, $\\hbar\\to 0$. The result, however, survives outside that regime — which is the content of the path-integral derivation.\n\n### Path-integral derivation\n\nIn Feynman's formulation the propagator from $a$ to $b$ is\n\n$$K(b,a) \\;=\\; \\int\\!\\mathcal{D}\\mathbf{r}(t)\\,\\exp\\!\\left(\\frac{i}{\\hbar}S[\\mathbf{r}(t)]\\right),$$\n\nwith the electromagnetic action $S_{\\text{em}}=q\\!\\int(\\mathbf{A}\\cdot d\\boldsymbol{\\ell}-\\varphi\\,dt)$. Now suppose the configuration space is doubly connected — the plane minus the solenoid's cross-section, say — so that paths from $a$ to $b$ partition into homotopy classes labeled by winding number $n\\in\\mathbb{Z}$. Within a class, two paths can be continuously deformed into each other, and on any such deformation $\\int\\mathbf{A}\\cdot d\\boldsymbol{\\ell}$ is invariant because $\\mathbf{B}=0$ in the accessible region (Stokes again). The propagator factorizes,\n\n$$K(b,a) \\;=\\; \\sum_{n\\in\\mathbb{Z}} e^{\\,i\\,q\\,\\Phi_{B}\\,n/\\hbar}\\; K^{(0)}_{n}(b,a),$$\n\nwhere $K^{(0)}_n$ is the free propagator restricted to class $n$ and $\\Phi_B$ is the flux through one elementary loop around the obstruction [11]. For a two-arm interferometer one keeps the two leading classes (\"above\" and \"below\" the solenoid) and the cross term in $|K|^2$ carries the phase factor $\\exp(iq\\Phi_B/\\hbar)$.\n\nTwo features deserve emphasis. First, the result is exact in $\\hbar$ — no WKB was invoked. Second, $\\Delta\\Phi$ depends only on the homotopy class of the relative loop, not on its length, shape, or the electron's energy. That is what makes AB a *topological* phase, distinct from a generic *geometrical* (Berry) phase whose value depends on the geometry of the path in parameter space [12]. Wu and Yang made the geometric content precise: the gauge-invariant datum is the holonomy $\\exp\\!\\bigl(iq\\!\\oint\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell}/\\hbar\\bigr)\\in U(1)$ of a flat connection on a non-simply-connected base [9].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"20\" y=\"26\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eMagnetic AB: confined flux Φ_B, B=0 on both paths\u003c/text\u003e\u003ccircle cx=\"220\" cy=\"205\" r=\"22\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"211\" y=\"211\" fill=\"#ffb86b\" font-size=\"18\"\u003e⊗\u003c/text\u003e\u003ctext x=\"252\" y=\"210\" fill=\"#ffb86b\" font-size=\"14\"\u003eΦ_B (excluded region)\u003c/text\u003e\u003ccircle cx=\"60\" cy=\"205\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"32\" y=\"232\" fill=\"#e8e6e1\" font-size=\"14\"\u003esource a\u003c/text\u003e\u003ccircle cx=\"390\" cy=\"205\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"358\" y=\"232\" fill=\"#e8e6e1\" font-size=\"14\"\u003edetector b\u003c/text\u003e\u003cpath d=\"M 60 205 Q 220 110 390 205\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 60 205 Q 220 300 390 205\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"118\" fill=\"#7ee0a3\" font-size=\"14\"\u003eΓ₁ (class n=0)\u003c/text\u003e\u003ctext x=\"180\" y=\"315\" fill=\"#ff7a90\" font-size=\"14\"\u003eΓ₂ (class n=1 rel. Γ₁)\u003c/text\u003e\u003ctext x=\"20\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\"\u003eΔΦ = (q/ℏ) ∮(Γ₁−Γ₂) A·dℓ = (q/ℏ) Φ_B (Stokes, π₁ ≠ 0)\u003c/text\u003e\u003cline x1=\"425\" y1=\"40\" x2=\"425\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/\u003e\u003ctext x=\"440\" y=\"26\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eElectric AB: cylinders at φ₁(t), φ₂(t), E=0 inside\u003c/text\u003e\u003crect x=\"465\" y=\"140\" width=\"65\" height=\"70\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"475\" y=\"178\" fill=\"#7aa2ff\" font-size=\"14\"\u003eφ₁(t)\u003c/text\u003e\u003crect x=\"610\" y=\"140\" width=\"65\" height=\"70\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"620\" y=\"178\" fill=\"#ffb86b\" font-size=\"14\"\u003eφ₂(t)\u003c/text\u003e\u003ccircle cx=\"445\" cy=\"250\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"495\" cy=\"250\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"545\" cy=\"250\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"640\" cy=\"250\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"690\" cy=\"250\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"455\" y=\"280\" fill=\"#7ee0a3\" font-size=\"14\"\u003ewavepacket Γ₁ → cyl 1\u003c/text\u003e\u003ctext x=\"455\" y=\"298\" fill=\"#ff7a90\" font-size=\"14\"\u003ewavepacket Γ₂ → cyl 2\u003c/text\u003e\u003ctext x=\"440\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\"\u003eΔΦ = −(q/ℏ) ∫[φ₁(t)−φ₂(t)] dt\u003c/text\u003e\u003c/svg\u003e\n*Figure: Left — magnetic AB. Two electron paths encircle a confined flux $\\Phi_B$; $\\mathbf{B}=0$ on both trajectories. The phase difference is the line integral of $\\mathbf{A}$ around the closed loop, equal to $\\Phi_B$ by Stokes, depending only on the homotopy class. Right — electric AB. Two halves of a coherent wavepacket sit inside conducting Faraday cylinders held at potentials $\\varphi_1(t),\\varphi_2(t)$ during the transit; $\\mathbf{E}=0$ in the interiors. The phase difference becomes the time integral of the potential difference.*\n\n### The electric variant on equal footing\n\nThe 1959 paper proposed a second geometry [2]. A coherent wavepacket is split; the two halves enter conducting Faraday cylinders held at potentials $\\varphi_1(t),\\varphi_2(t)$ that are switched on only while the packets are deep inside. With $\\mathbf{E}=0$ everywhere on the trajectories, the minimal-coupling piece contributes\n\n$$\\Delta\\Phi_{\\text{el}} \\;=\\; -\\,\\frac{q}{\\hbar}\\!\\int\\!\\bigl[\\varphi_{1}(t)-\\varphi_{2}(t)\\bigr]\\,dt.$$\n\nThis is the temporal analogue of the magnetic line integral — a holonomy of $A_0$ along the worldlines in a region where $F_{\\mu\\nu}=0$ on the paths. In manifestly covariant form,\n\n$$\\Delta\\Phi \\;=\\; \\frac{q}{\\hbar}\\!\\oint\\! A_{\\mu}\\,dx^{\\mu},\\qquad A_{\\mu}=\\bigl(\\varphi/c,\\,-\\mathbf{A}\\bigr),$$\n\nthe loop traced in spacetime around a region of nontrivial $F_{\\mu\\nu}$. Magnetic AB encircles a spacelike worldtube of flux; electric AB brackets a timelike interval of $\\varphi_1-\\varphi_2$. The two variants are 4-covariantly the same statement but experimentally inequivalent, with quite different signal-to-noise budgets and very different histories of clean confirmation [10, 7, 13] — to be untangled in §6.\n\n### Why the multiply connected configuration space matters\n\nIf $\\mathcal{R}$ is simply connected, the loop $\\oint\\mathbf{A}\\cdot d\\boldsymbol{\\ell}$ bounds a surface entirely in $\\mathcal{R}$, on which $\\mathbf{B}=0$, so $\\Phi_B=0$: no effect. AB requires both (i) $\\mathbf{B}=0$ throughout the accessible region (classical mechanics predicts nothing) and (ii) nontrivial $\\pi_{1}(\\mathcal{R})$ (so the line integral cannot be eliminated by a global gauge transformation). The connection one-form $A=\\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell}$ is closed but not exact; $\\oint A$ pairs its de Rham class with the cycle $[\\Gamma_1-\\Gamma_2]$. Wu and Yang made this the operational definition of the field [9]; Berry generalized to curved connections on parameter space [12]. The observable is the holonomy $e^{i\\Delta\\Phi}\\in U(1)$, defined only modulo $2\\pi$ — already a warning against the careless reading that \"$\\mathbf{A}$ itself is physical.\"\n\n### Assumptions, regimes, what survives\n\nThe derivations above assume (a) non-relativistic kinematics (in the eikonal version); relativistic corrections are organized by the same covariant line integral and are negligible at the tens-of-keV electron energies of every historical AB experiment. (b) The test charge is a probe; back-reaction on the source is neglected — a non-trivial omission once one starts asking where the missing momentum goes during the encounter, returned to in §7. (c) The flux is static (or slow on the transit time) in the magnetic case, and switching of $\\varphi_1-\\varphi_2$ is confined to the in-cylinder interval in the electric case; outside those regimes the simple line-integral formula picks up corrections from radiated fields. (d) The phase is gauge-invariant only as $\\exp(i\\Delta\\Phi)\\in U(1)$, never as $\\Delta\\Phi\\in\\mathbb{R}$ — the integer ambiguity of the loop integral is the same ambiguity that gives flux quantization in superconductors and is not a defect of the formalism. The clean, geometry-independent persistence of $\\Delta\\Phi$ under deformation of the electron trajectory inside a fixed homotopy class is what marks AB as topological and distinguishes it from a generic Berry phase, even though Berry's framework formally contains it [9, 12, 10]."}, {"id": "biprism-vs-double-slit", "title": "Biprism, Not Double Slit: The Geometry the Textbooks Erased", "markdown": "## Biprism, Not Double Slit: The Geometry the Textbooks Erased\n\nEvery undergraduate text reaches for the same diagram: a point source, two narrow slits, a screen, and — improbably — a tiny solenoid floating between the slits. The pattern slides sideways as flux threads the solenoid. This image entered physics through Feynman's *Lectures* Volume III §15-5 [11] and has been redrawn essentially unchanged for sixty years. It is a piece of pedagogy. None of the historic Aharonov–Bohm measurements used a double slit.\n\nThe geometry that actually carried the field is the **electron biprism**, introduced by Möllenstedt and Düker at Tübingen in 1955 [8] — four years before the Aharonov–Bohm paper [2] and six years after Ehrenberg and Siday already had the line-integral phase in print [1]. A biprism is not two slits. It is a thin metallized filament (typically a quartz fibre $\\sim 0.5\\,\\mu$m in diameter, sputtered with gold) suspended between two grounded plates and biased to a few volts. The two halves of the incident electron wavefront pass on opposite sides of the wire and are deflected inward by the quasi-cylindrical field — *wavefront division*, the electron analogue of the Fresnel optical biprism. After the wire one has two coherent virtual sources separated by\n$$d \\;=\\; 2\\alpha L_{1},$$\nwhere $\\alpha \\propto U_{\\mathrm f}$ is the small deflection angle set by the wire bias $U_{\\mathrm f}$ and $L_{1}$ is the source-to-wire distance. The fringe spacing on the recording plane at distance $L_{2}$ from the wire is\n$$\\Delta x \\;=\\; \\frac{\\lambda_{\\mathrm e}\\,L_{2}}{d} \\;=\\; \\frac{\\lambda_{\\mathrm e}\\,L_{2}}{2\\alpha L_{1}},$$\ncontinuously tunable through $U_{\\mathrm f}$ — a knob no fixed slit pair possesses.\n\nWhy did the biprism, not a literal Young arrangement, become universal? Three reasons converge. *First*, coherence economy. Slit widths of order an electron wavelength ($\\lambda_{\\mathrm e}\\approx 0.037\\,\\text{Å}$ at $100\\,$keV) squander the source. The biprism deflects the incident wavefront onto itself; the only source-size condition is the van Cittert–Zernike $s\\alpha \\ll \\lambda_{\\mathrm e}$, easily met by a field-emission tip but never by a thermal cathode behind two $1\\,\\mu$m apertures. *Second*, mechanical and electrostatic stability. A pair of nanometric slits at micrometric separation drifts, contaminates, and charges; a gold-on-quartz fibre with two grounded shields ran for years in the Tübingen and Hitachi instruments [8, 14, 15]. *Third*, fabrication. In the 1950s no laboratory could reliably lithograph clean $0.3\\,\\mu$m slits at $1\\,\\mu$m pitch; Jönsson's celebrated 1961 grating required a multistage galvanic protocol that few groups duplicated [16]. Until silicon micromachining was routine, the biprism was the *only* practical phase-coherent electron interferometer.\n\nRead the experimental record with this in mind.\n\n- **Chambers (1960)** [17] mounted a Möllenstedt biprism in a modified electron microscope and placed a tapered iron whisker in the shadow of the wire. The whisker's varying flux density along its length produced a *tilted* fringe pattern whose shear is the AB shift. No double slit ever sat in his column.\n- **Boersch and collaborators (1960–61)** [18] at the TH Berlin worked with the same wavefront-dividing wire, substituting magnetic foils and small solenoids for Chambers' whisker.\n- **Möllenstedt and Bayh (1962)** [14] performed the cleanest pre-Tonomura measurement: a Möllenstedt biprism with a $\\sim 14\\,\\mu$m-diameter tungsten-wound solenoid downstream of the wire. They drove a continuously variable current and recorded the *continuous* shift of the fringes as a function of enclosed flux — a moving-fringe movie, not a one-shot photograph. Geometry: biprism.\n- **Tonomura et al. (1986)** [15] folded a toroidal permalloy magnet inside a niobium superconducting shell and threaded its interior between the two arms of an electron-holographic interferometer — once more, a Möllenstedt biprism, with the toroid as the doubly-connected flux carrier. The biprism wire is visible as the central dark line of Tonomura's published holograms.\n\nThe genuine **double slit** — a literal Young experiment with electrons — is Jönsson's 1961 Tübingen work [16], performed in the very building where Möllenstedt and Düker had introduced the biprism six years before. Jönsson lithographed copper slits $\\sim 0.3\\,\\mu$m wide at $\\sim 1\\,\\mu$m pitch, in groups of two, three and five, and recorded multi-slit diffraction patterns. The experiment is rightly canonical; it was never repurposed for an AB measurement, then or since. Pedagogy fused two distinct Tübingen experiments — Möllenstedt's biprism and Jönsson's slits — into a single composite image, then drew Aharonov and Bohm's solenoid into the gap.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eMöllenstedt–Düker electron biprism, the actual AB interferometer\u003c/title\u003e\u003ctext x=\"360\" y=\"20\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eMöllenstedt–Düker biprism interferometer (the actual AB geometry)\u003c/text\u003e\u003ccircle cx=\"80\" cy=\"200\" r=\"4\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"80\" y=\"232\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003esource S\u003c/text\u003e\u003cline x1=\"80\" y1=\"200\" x2=\"340\" y2=\"160\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"80\" y1=\"200\" x2=\"340\" y2=\"240\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"320\" y1=\"105\" x2=\"360\" y2=\"105\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cline x1=\"320\" y1=\"295\" x2=\"360\" y2=\"295\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"395\" y=\"109\" fill=\"#e8e6e1\" font-size=\"14\"\u003eground\u003c/text\u003e\u003ctext x=\"395\" y=\"299\" fill=\"#e8e6e1\" font-size=\"14\"\u003eground\u003c/text\u003e\u003ccircle cx=\"340\" cy=\"200\" r=\"7\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"340\" y=\"205\" text-anchor=\"middle\" fill=\"#ffb86b\" font-size=\"14\"\u003e+\u003c/text\u003e\u003ctext x=\"265\" y=\"186\" fill=\"#ffb86b\" font-size=\"14\"\u003ewire, bias Uf\u003c/text\u003e\u003cline x1=\"340\" y1=\"160\" x2=\"660\" y2=\"200\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"340\" y1=\"240\" x2=\"660\" y2=\"200\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"220\" y=\"140\" fill=\"#7aa2ff\" font-size=\"14\"\u003epath I\u003c/text\u003e\u003ctext x=\"220\" y=\"270\" fill=\"#7aa2ff\" font-size=\"14\"\u003epath II\u003c/text\u003e\u003ccircle cx=\"470\" cy=\"200\" r=\"12\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"470\" y=\"205\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"14\"\u003eΦ\u003c/text\u003e\u003ctext x=\"470\" y=\"250\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"14\"\u003econfined flux\u003c/text\u003e\u003cg stroke=\"#7ee0a3\" stroke-width=\"2\"\u003e\u003cline x1=\"660\" y1=\"140\" x2=\"700\" y2=\"140\"/\u003e\u003cline x1=\"660\" y1=\"155\" x2=\"700\" y2=\"155\"/\u003e\u003cline x1=\"660\" y1=\"170\" x2=\"700\" y2=\"170\"/\u003e\u003cline x1=\"660\" y1=\"185\" x2=\"700\" y2=\"185\"/\u003e\u003cline x1=\"660\" y1=\"200\" x2=\"700\" y2=\"200\"/\u003e\u003cline x1=\"660\" y1=\"215\" x2=\"700\" y2=\"215\"/\u003e\u003cline x1=\"660\" y1=\"230\" x2=\"700\" y2=\"230\"/\u003e\u003cline x1=\"660\" y1=\"245\" x2=\"700\" y2=\"245\"/\u003e\u003cline x1=\"660\" y1=\"260\" x2=\"700\" y2=\"260\"/\u003e\u003c/g\u003e\u003ctext x=\"680\" y=\"285\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"14\"\u003efringes\u003c/text\u003e\u003ctext x=\"680\" y=\"305\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"14\"\u003eΔx = λL₂ / d\u003c/text\u003e\u003cline x1=\"80\" y1=\"345\" x2=\"340\" y2=\"345\" stroke=\"#e8e6e1\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"350\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"340\" y1=\"340\" x2=\"340\" y2=\"350\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"210\" y=\"365\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003eL₁ (source → wire)\u003c/text\u003e\u003cline x1=\"340\" y1=\"345\" x2=\"680\" y2=\"345\" stroke=\"#e8e6e1\" stroke-width=\"0.8\"/\u003e\u003cline x1=\"680\" y1=\"340\" x2=\"680\" y2=\"350\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"510\" y=\"365\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\"\u003eL₂ (wire → recording plane)\u003c/text\u003e\u003ctext x=\"360\" y=\"392\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-style=\"italic\"\u003eNo physical slit anywhere in the column; the wavefront is split by deflection in the wire field.\u003c/text\u003e\u003c/svg\u003e\n*Figure: Cross-section of the Möllenstedt–Düker electron biprism used (with variants) in Chambers [17], Boersch [18], Möllenstedt–Bayh [14], and Tonomura et al. [15]. The biased wire splits a single wavefront into two coherent virtual sources separated by $d=2\\alpha L_{1}$; the confined flux $\\Phi$ sits inside the doubly-connected region enclosed by paths I and II.*\n\nWhy does the misattribution matter beyond bookkeeping? Three substantive points.\n\n(i) The biprism is *wavefront-division*: every point along the incident wavefront contributes to both virtual beams. There is no discrete pair of trajectories one could honestly call \"the two slits\". The AB phase is not the phase difference between two designated rays; it is the holonomy of the U(1) connection around the doubly-connected exterior of the flux tube, integrated over the *family* of pairs of paths that link the loop with winding number $\\pm 1$. The biprism geometry makes this manifest. The two-slit cartoon hides it behind the fiction of two crystalline rays.\n\n(ii) The slits-and-solenoid picture invites the question *what would happen if I closed one slit?* In a biprism there is no slit to close: obstructing half of the wavefront halves the intensity of *both* virtual sources and destroys the interferometer entirely. The which-way intuition the textbook diagram sells is geometrically misleading.\n\n(iii) The biprism's continuous tuning of $d$ through $U_{\\mathrm f}$ is precisely what allowed Möllenstedt and Bayh to verify that the AB shift depends *only* on $\\Phi$ and not on the path separation [14] — a sharp prediction of the Ehrenberg–Siday line integral [1] and of Aharonov–Bohm [2] that a rigid double slit cannot test.\n\nThe \"double slit plus solenoid\" is best understood as the Feynman cartoon that won — an intuition pump that overran its own caveats. The machine of every historic AB measurement was, and for high-resolution electron interferometry remains, the Möllenstedt–Düker biprism. Olariu and Popescu's encyclopedic review [10] and the Peshkin–Tonomura monograph [7] are unambiguous on this; the Hiley reconstruction makes the same point about the pre-history [4]. The mythology persists because the cartoon is easy to draw and the technology is easy to ignore."}, {"id": "landmark-experiments", "title": "Landmark Experiments: Chambers, Möllenstedt–Bayh, Boersch, Tonomura", "markdown": "## Landmark Experiments: Chambers, Möllenstedt–Bayh, Boersch, Tonomura\n\nThe experimental record of the magnetic Aharonov–Bohm (AB) effect is not a single confirmation but a twenty-six-year sequence of progressively cleaner exclusions. Each generation of apparatus was designed to answer the specific objection that had been raised against the previous one. To read the literature carefully is to watch the loophole shrink — from \"the field might leak around your whisker\" to \"the field is excluded by the Meissner state of a superconducting shell\" — and to see how the community standard of evidence was negotiated in the laboratory rather than in the formalism.\n\n### Chambers (1960): the iron-whisker proof of concept\n\nR. G. Chambers at Bristol delivered the first experimental claim within months of [2] appearing in print [17]. The interferometer was a Möllenstedt–Düker biprism [8]: a fine positively biased wire, on the order of a micron in diameter, placed between two grounded plates, deflects the two halves of a coherent electron wavefront toward each other so that they overlap and interfere on a downstream plane. Chambers' innovation was to place an iron whisker — a magnetized single-crystal needle a few microns long and a few hundred ångströms thick, tapering to a point — behind the biprism wire, oriented transverse to the electron paths. Because the whisker tapers, the enclosed flux $\\Phi(z)$ varies along the electron's direction of travel; the predicted fringe pattern is therefore tilted, not merely translated, and the tilt is a direct readout of $\\Delta\\varphi = (e/\\hbar)\\oint\\!\\mathbf{A}\\!\\cdot\\!\\mathrm{d}\\boldsymbol{\\ell}$ accumulated between the two semiclassical paths. Chambers observed precisely this tilt and, within the limits of his fringe visibility, the slope matched the predicted $e/h$ per flux quantum.\n\nThe proof-of-concept was striking, but a careful experimentalist could lodge two objections. First, the whisker is a magnetized ferromagnet whose stray field is not zero outside the geometric cylinder of the needle; it falls off as a dipole, and the electron paths in Chambers' geometry passed within a few microns of the whisker. The classical Lorentz deflection from those residual fields, while small, was not obviously negligible compared with the AB tilt. Second, the tilt is a derivative measurement of the phase, susceptible to drifts of source position, biprism voltage, and stray magnetic fields in the column. A control of the form \"turn the flux off and watch the tilt vanish\" was unavailable because the whisker is a permanent magnet. These objections did not disprove the result, but they prevented anyone from claiming that the field-free hypothesis had been ruled out experimentally.\n\n### Boersch and the Berlin group (1959–1961): the overlapping record\n\nIn parallel, Hans Boersch's electron-optics group at the TH Berlin had been studying phase shifts in biprism interferometers since the late 1950s, motivated more by Möllenstedt's program than by [2]. Boersch, Hamisch, Grohmann, and Wohlleben reported phase displacements consistent with magnetic-vector-potential coupling in a series of *Zeitschrift für Physik* papers around 1960–1961 (exact volumes vary; see [18], verify) using thin ferromagnetic foils and biprism geometries closely related to Chambers'. The Berlin work is often omitted in English-language reviews because (i) it was published in German, (ii) it was not framed as a test of [2] but as an extension of Möllenstedt–Düker electron optics, and (iii) it suffered from the same residual-field objection as Chambers, with no obvious incremental cleanliness. Hiley's reconstruction [4] and the Peshkin–Tonomura monograph [7] are unusually careful about restoring this strand to the record, where elsewhere it tends to be absorbed into a one-line citation alongside Chambers.\n\n### Möllenstedt and Bayh (1962): the continuous-current solenoid\n\nThe first experiment that meaningfully reduced the leakage objection was Möllenstedt and Bayh's at Tübingen [14]. The flux source was no longer a permanent magnet but a tungsten wire some 14 μm in diameter, wound as a tiny helical solenoid only a few tens of microns long, suspended behind the biprism. A current was passed through the winding; the enclosed flux was now a *continuously tunable parameter* set by the experimenter. The recorded observable was the displacement of the fringe pattern as a function of $I$, and the predicted period $\\Phi_0 = h/e$ was reproduced over many cycles. Two methodological advances followed from the geometry. First, with a thin solenoid one can compute the external field rigorously — a finite-length solenoid has a calculable fringing dipole field, and Möllenstedt and Bayh argued that the classical deflection it would induce was orders of magnitude below the observed AB shift. Second, because $\\Phi$ could be ramped, the experiment supplied an internal null: $I = 0$ produced no shift, while $I \\neq 0$ shifted the fringes linearly. This is the strongest pre-Tonomura confirmation, and English-language pedagogy that jumps from Chambers to Tonomura silently elides the experiment that did the most work to make the result quantitative.\n\n### The Bocchieri–Loinger critique\n\nThrough the 1970s, P. Bocchieri and A. Loinger mounted a sustained critique arguing that all extant experiments were consistent with classical Lorentz deflection from fringing fields, and that the AB effect, properly construed, did not exist as a distinct phenomenon. Their argument exploited the fact that no real solenoid is infinite: the field outside any finite flux source is nonzero, and at sufficient sensitivity one can attribute the observed phase to that residual field acting locally on the electron. The community response was twofold. Theoretically, [9] had already settled the question of principle: the gauge-invariant content of the loop is the holonomy $\\exp(ie\\oint\\!\\mathbf{A}\\!\\cdot\\!\\mathrm{d}\\boldsymbol{\\ell}/\\hbar)$, and on a non-simply-connected configuration space this is not reducible to local field action [10]. Experimentally, the critique demanded a setup in which the field outside the flux source could be quantitatively bounded by a separately verifiable physical principle, not merely by a model calculation. That demand pointed directly to superconductivity.\n\n### Tonomura (1986): the superconducting-toroid closure\n\nThe Hitachi group led by Akira Tonomura closed the loophole with a geometry specifically designed against Bocchieri–Loinger [15]. A toroidal permalloy magnet — a closed flux loop with no end faces, hence no axial fringing field — was coated with a niobium layer and cooled below $T_c$. Three exclusions were now simultaneously enforced: (i) the toroidal topology eliminates the fringing field of an open solenoid by construction; (ii) the Meissner state expels any residual external $\\mathbf{B}$ to within the London penetration depth ($\\sim 40\\,\\mathrm{nm}$ for Nb); (iii) a copper overlayer screened any electric potential difference between the magnet and the electron beam. The interferometer was a Möllenstedt biprism feeding an electron-holographic detection stage, which records the phase as a fringe pattern reconstructed from the hologram, not as a position of fringes susceptible to drift. The observed phase shift between electrons threading the torus and those passing outside was $\\pi$ for $\\Phi = \\Phi_0/2$ and $0$ for $\\Phi = \\Phi_0$ — flux quantization in the superconductor providing the discrete calibration, a circumstance Tonomura exploited to verify $\\Phi_0 = h/2e$ for the Cooper-pair condensate while measuring the single-electron phase against a fluxoid background. The result was unambiguous: the magnetic AB phase exists in a regime where the magnetic field on the electron trajectory is bounded by the Meissner exclusion, not by an *a priori* model of a fringing field [7, 19].\n\n### What each experiment actually excluded\n\n| Experiment | Flux source | What it demonstrated | What it could not exclude |\n|---|---|---|---|\n| Chambers 1960 [17] | Iron whisker | Fringe tilt $\\propto \\mathrm{d}\\Phi/\\mathrm{d}z$ at the predicted slope | Dipole stray field from the magnetized needle |\n| Boersch et al. ca. 1960 [18] | Ferromagnetic foils, biprism | Phase displacements consistent with $(e/\\hbar)\\oint\\!\\mathbf{A}\\!\\cdot\\!\\mathrm{d}\\boldsymbol{\\ell}$ | Residual ferromagnetic stray field |\n| Möllenstedt–Bayh 1962 [14] | Microscopic tungsten solenoid, ramped $I$ | Continuous, linear, periodic $\\Delta\\varphi(I)$ with period $\\Phi_0 = h/e$; internal null at $I = 0$ | Calculated — not measured — fringing field of finite solenoid |\n| Tonomura et al. 1986 [15] | Permalloy torus, Nb-shielded, Cu-screened | $\\Delta\\varphi$ with $\\mathbf{B}$ on the trajectory bounded by Meissner exclusion | The interpretive question of $\\mathbf{A}$ vs. holonomy — settled by [9], not by experiment |\n\nThe arc is instructive. The 1960 experiment proved the phenomenon was real to anyone willing to grant a model of the stray field. The 1962 experiment proved it to anyone who took the model seriously. The 1986 experiment proved it to anyone who would only grant the Meissner effect. By the time Bocchieri and Loinger's argument was experimentally answerable, the theoretical reframing of [9] had already moved the conceptual goalposts: the phenomenon to be demonstrated was no longer \"phase shift in zero $\\mathbf{B}$\" but \"non-trivial U(1) holonomy on a non-simply-connected configuration space,\" and Tonomura's torus realized exactly that — a topological obstruction baked into the geometry of the apparatus."}, {"id": "formulations-evolved", "title": "From Refractive Index to Fiber Bundle: Wu–Yang, Berry, and What Superseded What", "markdown": "## From Refractive Index to Fiber Bundle: Wu–Yang, Berry, and What Superseded What\n\nThe magnetic flux phase has been written down four times in four different mathematical languages. Each rewriting absorbed its predecessor as a special case while quietly retiring some of the older language's claims to fundamentality. The honest map is not a chain of equivalences but a sequence of strict generalizations punctuated by reinterpretations.\n\n### Ehrenberg–Siday, 1949: A refractive index for electrons\n\nEhrenberg and Siday were doing electron optics, not foundations [1]. Their starting point was the eikonal limit of the Klein–Gordon (or Pauli) equation: write $\\psi = a\\,e^{iS/\\hbar}$, expand to leading order in $\\hbar$, and the action $S$ satisfies a Hamilton–Jacobi equation whose level surfaces play the role of wavefronts. In an external $(\\varphi,\\mathbf{A})$ field, minimal coupling $\\mathbf{p}\\to\\mathbf{p}-q\\mathbf{A}$ gives, for a quasi-monochromatic electron of energy $E$ in a static field,\n\n$$ S(\\mathbf{r}) = \\int^{\\mathbf{r}} \\!\\!\\big[\\, p(\\mathbf{r}')\\,\\hat{\\mathbf{t}} + q\\mathbf{A}(\\mathbf{r}')\\big]\\cdot d\\boldsymbol{\\ell}, \\qquad p(\\mathbf{r}')=\\sqrt{2m\\big(E-q\\varphi(\\mathbf{r}')\\big)}.$$\n\nThey read off an *effective refractive index* $n_\\text{eff}=p/p_0 + (q/p_0)\\,\\hat{\\mathbf{t}}\\!\\cdot\\!\\mathbf{A}$, the vector-potential term being the magnetic correction. For two ray paths $\\Gamma_1,\\Gamma_2$ meeting at a screen the phase difference contains the gauge-invariant piece $\\Delta\\Phi_{AB}=(q/\\hbar)\\oint_{\\Gamma_1-\\Gamma_2}\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell}$.\n\nWhat this language can do: predict fringe shifts for any two-beam electron interferometer threaded by flux. What it cannot do: survive its own assumptions. The derivation is semiclassical (eikonal), confined to single-particle non-relativistic kinematics, and silent on why $\\mathbf{A}$ should appear in a region where $\\mathbf{B}=0$. Ehrenberg–Siday treat the result as an *optical curiosity* — an unavoidable consequence of minimal coupling in the WKB regime. The line integral is real; the interpretive question is not posed.\n\n**Verdict.** Still valid as the leading-$\\hbar$ approximation in electron-optical instruments. Quietly retired as a *foundation*: the result is now derived non-perturbatively from gauge invariance, not from an eikonal expansion.\n\n### Aharonov–Bohm, 1959: Potentials as ontological primitives\n\nThe 1959 paper [2] derives the same phase shift from the full Schrödinger equation rather than the eikonal limit, and then makes an interpretive move that Ehrenberg–Siday did not. In a multiply connected region where $\\mathbf{B}=0$, the wave function in each simply connected patch can be gauge-transformed to the field-free solution by $\\psi\\to e^{i(q/\\hbar)\\int\\!\\mathbf{A}\\cdot d\\boldsymbol{\\ell}}\\psi_0$, but the patchwise phase factors do not glue to a single-valued function: their mismatch on a non-contractible loop is exactly $(q/\\hbar)\\oint\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell}$. Bohm's reading — that this elevates the potentials above the fields in QM — is the load-bearing claim, and it is the claim Wu and Yang later corrected.\n\nThe AB paper also broadens the phenomenology: a *scalar* analogue using time-varying $\\varphi$ in field-free regions, and the prediction that the magnetic effect is periodic in the enclosed flux with period $h/q$. The latter prediction is not in Ehrenberg–Siday and is the first hint that the right invariant is not the integral $\\oint\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell}$ itself but its exponential.\n\n**Verdict.** The equation is the same; the *kinematic regime* of validity is wider (no eikonal); the *ontological* claim that \"$\\mathbf{A}$ is more fundamental than $\\mathbf{B}$\" is superseded — see below.\n\n### Wu–Yang, 1975: Holonomy of a U(1) connection\n\nWu and Yang [9] dissolved the field-vs-potential dispute by identifying what is *neither*: the set of non-integrable phase factors\n\n$$ U(\\Gamma) = \\exp\\!\\Big[\\tfrac{iq}{\\hbar}\\!\\int_{\\Gamma}\\!\\mathbf{A}\\!\\cdot\\! d\\boldsymbol{\\ell}\\Big] \\;\\in\\; U(1). $$\n\nFor any closed loop $\\Gamma$ bounding a surface $\\Sigma$ on which $\\mathbf{A}$ is regular, Stokes gives $U(\\partial\\Sigma)=\\exp[(iq/\\hbar)\\!\\int_\\Sigma\\!\\mathbf{B}\\!\\cdot\\! d\\mathbf{S}]$, so the field content is recovered. For loops around an excluded flux tube (no such $\\Sigma$ exists in the physical region) $U(\\Gamma)$ carries strictly more information than the local $\\mathbf{B}$ field, and strictly less than $\\mathbf{A}$ — the gauge redundancy $\\mathbf{A}\\to\\mathbf{A}+\\nabla\\chi$ leaves $U(\\Gamma)$ invariant. The mathematical home is a principal $U(1)$ bundle over the configuration space $M=\\mathbb{R}^3\\setminus\\text{(flux line)}$; $\\mathbf{A}$ is a connection 1-form, $U(\\Gamma)$ its holonomy. AB becomes the statement that this connection is *flat but non-trivial*: $\\mathbf{B}=d\\mathbf{A}=0$ on $M$, yet $\\pi_1(M)=\\mathbb{Z}$ supports a non-trivial character.\n\nThis reframing supersedes the ontological reading of 1959 in a clean technical sense. \"Potentials are more fundamental than fields\" becomes the precise statement: *the gauge-invariant data are neither the local potential nor the local field, but the holonomy assignment $H^1(M,U(1))$.* The $h/q$ periodicity that AB had to announce as a separate prediction is now automatic from $U(\\Gamma)\\in U(1)$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eConcept-superseding diagram for the AB phase\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"20\" y=\"28\" fill=\"#e8e6e1\" font-size=\"16\" font-weight=\"bold\"\u003eWhat each formulation takes as primary\u003c/text\u003e\u003cg font-family=\"serif\" font-size=\"14\" fill=\"#e8e6e1\"\u003e\u003crect x=\"20\" y=\"60\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"100\" y=\"82\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-weight=\"bold\"\u003eEhrenberg–Siday\u003c/text\u003e\u003ctext x=\"100\" y=\"102\" text-anchor=\"middle\"\u003eeikonal index\u003c/text\u003e\u003ctext x=\"100\" y=\"120\" text-anchor=\"middle\"\u003en_eff = p/p₀ + qA·t̂/p₀\u003c/text\u003e\u003ctext x=\"100\" y=\"138\" text-anchor=\"middle\" font-size=\"12\"\u003eprimary: rays + A\u003c/text\u003e\u003crect x=\"200\" y=\"60\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"280\" y=\"82\" text-anchor=\"middle\" fill=\"#ffb86b\" font-weight=\"bold\"\u003eAharonov–Bohm\u003c/text\u003e\u003ctext x=\"280\" y=\"102\" text-anchor=\"middle\"\u003eSchrödinger ψ\u003c/text\u003e\u003ctext x=\"280\" y=\"120\" text-anchor=\"middle\"\u003e∮A·dℓ as observable\u003c/text\u003e\u003ctext x=\"280\" y=\"138\" text-anchor=\"middle\" font-size=\"12\"\u003eprimary: A (claimed)\u003c/text\u003e\u003crect x=\"380\" y=\"60\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"460\" y=\"82\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-weight=\"bold\"\u003eWu–Yang\u003c/text\u003e\u003ctext x=\"460\" y=\"102\" text-anchor=\"middle\"\u003eU(1) holonomy\u003c/text\u003e\u003ctext x=\"460\" y=\"120\" text-anchor=\"middle\"\u003eU(Γ)=exp(iq∮A·dℓ/ℏ)\u003c/text\u003e\u003ctext x=\"460\" y=\"138\" text-anchor=\"middle\" font-size=\"12\"\u003eprimary: connection on bundle\u003c/text\u003e\u003crect x=\"560\" y=\"60\" width=\"140\" height=\"90\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\" rx=\"6\"/\u003e\u003ctext x=\"630\" y=\"82\" text-anchor=\"middle\" fill=\"#ff7a90\" font-weight=\"bold\"\u003eBerry\u003c/text\u003e\u003ctext x=\"630\" y=\"102\" text-anchor=\"middle\"\u003eparameter-space\u003c/text\u003e\u003ctext x=\"630\" y=\"120\" text-anchor=\"middle\"\u003eholonomy ∮⟨n|i∇_R|n⟩·dR\u003c/text\u003e\u003ctext x=\"630\" y=\"138\" text-anchor=\"middle\" font-size=\"12\"\u003eprimary: adiabatic bundle\u003c/text\u003e\u003cpath d=\"M180 105 L200 105\" stroke=\"#e8e6e1\" stroke-width=\"1.2\" marker-end=\"url(#a)\"/\u003e\u003cpath d=\"M360 105 L380 105\" stroke=\"#e8e6e1\" stroke-width=\"1.2\" marker-end=\"url(#a)\"/\u003e\u003cpath d=\"M540 105 L560 105\" stroke=\"#e8e6e1\" stroke-width=\"1.2\" marker-end=\"url(#a)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"20\" y=\"190\" fill=\"#e8e6e1\" font-size=\"15\" font-weight=\"bold\"\u003eLogical containment\u003c/text\u003e\u003ccircle cx=\"360\" cy=\"290\" r=\"95\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"360\" y=\"215\" text-anchor=\"middle\" fill=\"#ff7a90\" font-size=\"13\"\u003eBerry: holonomy on any U(1) bundle (curved)\u003c/text\u003e\u003ccircle cx=\"360\" cy=\"305\" r=\"65\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"360\" y=\"245\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"13\"\u003eWu–Yang: EM as flat-or-curved U(1) connection\u003c/text\u003e\u003ccircle cx=\"360\" cy=\"315\" r=\"40\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"360\" y=\"305\" text-anchor=\"middle\" fill=\"#ffb86b\" font-size=\"12\"\u003eAB: flat, π₁≠0\u003c/text\u003e\u003ccircle cx=\"360\" cy=\"325\" r=\"18\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"360\" y=\"328\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"11\"\u003eE–S: WKB\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\n*Figure: Each successor language enlarges, rather than replaces, the regime of its predecessor. Ehrenberg–Siday is the WKB shadow of the AB phase; AB is the flat, topologically non-trivial subclass of Wu–Yang U(1) connections; Wu–Yang is the gauge-theoretic instance of Berry's adiabatic holonomy on a general U(1) bundle.*\n\n### Berry, 1984: Adiabatic holonomy and what it does *not* generalize\n\nBerry's analysis [12] of adiabatic transport showed that an eigenstate $|n(\\mathbf{R})\\rangle$ carried slowly around a loop $C$ in parameter space $\\mathbf{R}$ acquires, beyond the dynamical phase, the geometrical phase\n\n$$ \\gamma_n(C)=i\\!\\oint_C\\!\\langle n(\\mathbf{R})\\mid\\!\\nabla_{\\!\\mathbf{R}}\\mid n(\\mathbf{R})\\rangle\\cdot d\\mathbf{R} = \\oint_C\\!\\mathcal{A}_n\\!\\cdot\\! d\\mathbf{R}. $$\n\nThe 1-form $\\mathcal{A}_n$ is a U(1) connection on the parameter-space bundle of rays; its curvature $\\mathcal{F}_n=d\\mathcal{A}_n$ generically does *not* vanish. AB is recovered by taking $\\mathbf{R}=\\mathbf{R}_0$ — the position of the electron centroid — and noting that the relevant connection is exactly the EM vector potential. Crucially, the AB connection is flat on its base ($\\mathcal{F}=0$ outside the solenoid), so AB is the *topological* sub-case of Berry's *geometrical* construction: the phase depends only on the homotopy class $[C]\\in\\pi_1(M)$, not on the loop's shape. Conflating \"topological\" with \"geometric\" here is the standard pedagogical sin and is technically wrong [20] (verify).\n\n**Verdict.** Berry's framework subsumes AB; it does not supersede Wu–Yang, because the gauge-theoretic content of EM is logically prior to the adiabatic setting in which Berry's phase lives.\n\n### What was retired, what survived\n\nA tidy ledger of the supersession:\n\n| Claim | Origin | Status today |\n|---|---|---|\n| $\\Delta\\Phi=(q/\\hbar)\\oint\\!\\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell}$ as a refractive correction | Ehrenberg–Siday 1949 [1] | Valid as the WKB limit; retired as the foundational statement. |\n| \"$\\mathbf{A}$ is more fundamental than $\\mathbf{B}$ in QM\" | Aharonov–Bohm 1959 [2] | Retired. Correct replacement: the holonomy $\\exp(iq\\oint\\!\\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell}/\\hbar)$ is the gauge-invariant primary [9]. |\n| Periodicity in $h/q$ as a separate prediction | Aharonov–Bohm 1959 [2] | Automatic from $U(\\Gamma)\\in U(1)$ [9]. |\n| EM as a $U(1)$ connection; AB as flat-but-non-trivial holonomy | Wu–Yang 1975 [9] | Standard. The home of the non-abelian and gravitational AB analogues. |\n| AB as a special case of Berry's phase | Berry 1984 [12] | Valid as containment; misleading if \"special case\" is read as \"explained by\". AB is the *flat, topological* corner of Berry's generally curved framework [20, 10] (verify). |\n| Single-particle, non-relativistic kinematics | All four | Valid in regime; the relativistic and many-body extensions live inside the same bundle picture (Wu–Yang is already covariant). |\n\nThe Olariu–Popescu review [10] codified this layered picture by 1985, and Peshkin–Tonomura [7] entrenched the bundle language in the pedagogy that followed — a pedagogy that the textbooks have, twenty years on, still only partially adopted."}, {"id": "still-valid-and-confused", "title": "Still Valid, Still Confused: A Conflation Audit of the Modern Literature", "markdown": "## Still Valid, Still Confused: A Conflation Audit of the Modern Literature\n\nFive claims about the Aharonov–Bohm (AB) effect circulate through textbooks, review articles, and seminar slides with the confident polish of settled physics. Each is a compression of something true into something misleading. The compressions matter because they propagate into adjacent literatures — geometric phases in optics [20], topological quantum computation [21], mesoscopic interferometry [22] — where the loose statements get reused as load-bearing premises. What follows is a regime-by-regime audit.\n\n### 1. \"Potentials are more real than fields\"\n\nThe claim, sourced to a casual reading of [2], is that AB elevates $A_\\mu$ from a calculational convenience to a physical object, demoting $F_{\\mu\\nu}$. This is wrong in both directions.\n\nWhat is gauge-invariant, locally measurable, and reproducible across observers is neither $A_\\mu$ nor $F_{\\mu\\nu}$ alone but the holonomy\n$$U[\\gamma] = \\exp\\!\\left(\\frac{ie}{\\hbar}\\oint_\\gamma A_\\mu\\,dx^\\mu\\right) \\in U(1),$$\ndefined modulo $2\\pi$ on closed loops $\\gamma$. Wu and Yang made this precise in 1975 [9]: the field tensor under-determines the physics in non-simply-connected regions (two configurations with identical $F_{\\mu\\nu}$ on the accessible region can give different interference patterns), while $A_\\mu$ over-determines it (gauge transformations $A_\\mu \\to A_\\mu + \\partial_\\mu\\Lambda$ leave $U[\\gamma]$ untouched). The complete and non-redundant description is the connection on a $U(1)$ principal bundle; AB is the holonomy of a non-contractible loop encircling the excluded flux tube.\n\nThe regime in which the loose version misleads: any discussion of locality, hidden variables, or the \"ontology of gauge fields\" [23, 24, 25]. Saying \"$A$ is real\" invites a non-local-action picture that is not what gauge theory says; saying \"only $F$ is real\" denies AB its content. The correct slogan is operational: *the gauge-invariant content of electromagnetism is the collection of holonomies on all loops in the configuration space accessible to the charged matter*. In simply-connected regions the holonomy data is equivalent to $F_{\\mu\\nu}$ on the region; in multiply-connected regions it strictly exceeds it.\n\n### 2. Magnetic vs. electric AB\n\nThe 1959 paper [2] proposed two effects related by 4-vector covariance: magnetic AB ($\\oint \\mathbf{A}\\!\\cdot\\!d\\boldsymbol{\\ell}$ around a confined flux) and electric AB ($\\frac{e}{\\hbar}\\int(\\varphi_1-\\varphi_2)\\,dt$ accumulated while a wave packet sits inside a Faraday cage held at potential $\\varphi_i$). Modern usage routinely collapses both into \"the AB effect,\" which obscures three regime-distinguishing facts.\n\n(i) The magnetic case is *force-free in the strong sense*: the electron paths traverse a region in which $\\mathbf{E}=\\mathbf{B}=0$ at all times. The electric case is force-free only if the potential is switched while the wave packet is fully inside the cage; any non-adiabatic ramp produces real fields at the cage walls and the experiment is no longer manifestly potential-induced.\n\n(ii) The experimental records are not symmetric. The magnetic effect was confirmed in stages culminating in Tonomura [15]. A clean electric analogue — wave packet manifestly inside a field-free conductor during a time-varying potential — has been far harder to realize, and the few claimed measurements (van Oudenaarden et al. on Aharonov–Casher-like phases, the various scalar AB schemes in atom and neutron interferometry [26]) are subtler and continue to be argued about [10].\n\n(iii) Covariantly, both are holonomies of the same $U(1)$ connection — one around a spatial loop, one around a loop in spacetime. Pedagogically, conflating them invites the assumption that an electric-AB confirmation rides on the magnetic record. It does not.\n\n### 3. Topological vs. geometrical phase\n\nAfter Berry [12], a habit set in of describing AB as \"a special case of the Berry phase.\" The containment relation is correct; the slogan flattens a distinction that matters.\n\nA *topological* phase depends only on the homotopy class $[\\gamma]\\in\\pi_1(M)$ of the loop in the configuration space $M$, not on the loop's geometry. Magnetic AB on $\\mathbb{R}^3\\setminus(\\text{flux line})$ is topological: $\\pi_1 = \\mathbb{Z}$, and the phase is $n\\Phi/\\Phi_0$ for winding number $n$, exactly invariant under any continuous deformation of the electron trajectory that does not cross the flux tube.\n\nA *geometrical* phase in Berry's sense depends on the geometry of the path in parameter space and generically varies continuously with deformations of the path; it vanishes for trivial loops in a flat connection. AB fits inside Berry's framework as the holonomy of a *flat* $U(1)$ connection on a *non-simply-connected* base — flatness kills any local curvature contribution, non-trivial topology supplies the phase.\n\nThe regime in which the loose identification misleads: anywhere robustness to noise or deformation is the point. Topological quantum computing protocols [21, 27] rely on the homotopy invariance; calling the AB phase \"just a Berry phase\" suggests it can be tuned away by smooth deformation, which is exactly what it cannot do. The optics literature on Pancharatnam-type geometrical phases [20] inherits the same confusion when its authors reach for AB as a precedent: those phases are curvature integrals on $S^2$ (Poincaré sphere) and *are* deformable — they are not in the same homotopy class of statements.\n\n### 4. \"Chambers settled it\"\n\nChambers' 1960 fringe-shift observation [17] is presented in undergraduate texts as the confirmation. The professional record was never that simple. Chambers used a tapered iron whisker as the flux source; fringing fields at the tip — geometrically unavoidable for any non-toroidal magnetization — gave Bocchieri and Loinger, and later Roy and a small but persistent school of critics, room to argue through the 1970s and 1980s that the observed shift was a force-mediated classical deflection. The community-level closure came in two stages: Möllenstedt–Bayh's continuously-tunable microsolenoid [14], which made the linear-in-current dependence quantitative, and Tonomura et al.'s toroidal permalloy magnet enclosed in a superconducting Nb shell [15], which excluded both fringing fields (geometry) and any residual leakage (Meissner expulsion) at the same time.\n\nThe regime in which \"Chambers settled it\" misleads: any historiographical or foundational discussion. Citing Chambers alone in a paper on, say, the reality of gauge potentials is a citation error of substance, because the very objection that paper is meant to address (residual fields) is the one Chambers' geometry could not exclude. The correct citation chain for \"the magnetic AB effect is experimentally established in the strictly field-free regime\" is Chambers $\\to$ Möllenstedt–Bayh $\\to$ Tonomura, with the load-bearing step at Tonomura.\n\n### 5. \"Double slit plus solenoid\"\n\nThe Feynman Lectures figure [11] — point source, two slits, tiny solenoid between them, shifted fringes on the screen — is iconic and pedagogically efficient. It is also a fiction in the sense that no historical AB measurement used that geometry. Möllenstedt and Düker's electrostatic biprism [8], a charged wire that refracts a single coherent electron beam into two overlapping virtual sources, is the actual interferometer in every clean AB experiment from Chambers through Tonomura. Jönsson's 1961 multi-slit grating [16] is the closest realization of a literal Young's experiment with electrons and was not used in any AB measurement.\n\nThe regime in which the textbook image misleads: anywhere coherence budgets, fringe visibility, or beam-separation scales are computed. The biprism produces a wavefield with very different transverse coherence properties than a true double slit; estimates of the maximum solenoid radius compatible with fringe visibility are off by orders of magnitude if one assumes Young-type geometry. For pedagogy of the phase shift itself the cartoon is harmless; for any quantitative interferometric analysis it is wrong geometry.\n\nWhat survives all five corrections is exactly what Ehrenberg and Siday wrote down in 1949 [1] and Aharonov and Bohm reinterpreted in 1959 [2]: the line integral of $A_\\mu$ along a path is the relevant phase, the holonomy around an excluded flux is gauge-invariant and measurable, and the topology of the accessible region is part of the physical input. Everything else — the slogans about reality, the unified electric-magnetic narrative, the Berry-phase containment, Chambers as terminus, and the double slit cartoon — is approximation, useful only when its regime is named."}, {"id": "frontier-and-open-problems", "title": "Current Frontier: Electric AB, Dispersionless vs. Force-Free Debates, Non-Abelian and Gravitational Analogues", "markdown": "## Current Frontier: Electric AB, Dispersionless vs. Force-Free Debates, Non-Abelian and Gravitational Analogues\n\nThe magnetic flux phase is settled physics; what surrounds it is not. Four debates and four generalizations remain genuinely open, and each carries an experimental prize whose criterion is sharper than the prose around it usually admits.\n\n### Electric AB: still waiting for its Tonomura\n\nThe 1959 paper's second prediction — two co-moving wave packets sent through conducting cylinders held at different time-dependent potentials $V_1(t)$, $V_2(t)$, acquiring a relative phase\n\n$$\\Delta\\Phi_{\\rm E} \\;=\\; -\\frac{e}{\\hbar}\\int \\bigl[V_1(t)-V_2(t)\\bigr]\\,dt$$\n\nwhile the wave packets sit inside field-free interiors — has never been confirmed at the level Tonomura delivered for the magnetic case [2, 15, 7]. The reason is structural: enforcing $\\mathbf{E}=0$ along the entire electron trajectory while $V$ varies requires shielding of a quality that has never been adequately demonstrated for a free electron beam. The two most-cited \"electric AB\" experiments — Matteucci–Pozzi (1985) and Schmid (1984) — both used dielectric or charged-line geometries in which fringe fields cannot be excluded by symmetry, exactly the Bocchieri–Loinger objection that haunted Chambers. A cleaner programme has moved to neutral matter waves: van Oudenaarden et al. and several BEC interferometry groups have demonstrated *scalar* AB phases for atomic clock states acquired in nominally field-free regions of inhomogeneous potentials [26]. But \"scalar AB for atoms\" is not the original 1959 prediction — the source charge $q$ is replaced by a differential polarizability or an internal-state energy shift — and the proper electron version remains the open prize.\n\nA decisive electron electric-AB experiment would need: (i) two macroscopic Faraday cages whose interior potential can be switched on and off entirely while a coherent electron wave packet is inside, with rise/fall completed before the packet exits; (ii) shielding demonstrably below the level at which any time-derivative-of-flux argument can reproduce the phase classically. Closing this loophole is the electrostatic analogue of replacing Chambers' whisker with Tonomura's superconducting torus.\n\n### The Vaidman dispute: is AB force-free?\n\nIn 2012 Vaidman re-examined the magnetic effect and argued that the phase can be derived from ordinary Lorentz forces — not on the electron, but on the *source currents* in the solenoid, induced by the passing electron's own field (Vaidman, *Phys. Rev. A* **86**, 040101(R), 2012). The standard reading — that the electron experiences no force yet acquires a phase — was, in Vaidman's account, a sleight of hand that hid where the dynamics actually live. Aharonov, Cohen, and Rohrlich replied (*Phys. Rev. A* **92**, 026101, 2015) that the local action–reaction bookkeeping does not survive the requirement of relativistic locality plus single-electron coherence; their position, restated in compact form in [13], is that the holonomy is a genuinely non-local phenomenon and Vaidman's force-on-the-source account smuggles in a classical particle-trajectory picture incompatible with the interferometric setup.\n\nThe empirical wedge is dispersion. If AB were mediated by a residual force, an electron wave packet traversing the interferometer would acquire a *time delay* proportional to the phase, splitting the packet's group from its phase velocity. Caprez, Barwick, and Batelaan measured the transit time across a macroscopic toroidal magnet (*Phys. Rev. Lett.* **99**, 210401, 2007) and found no such delay at the predicted level — a result the Aharonov camp reads as a clean force-free confirmation, and the Vaidman camp reads as merely bounding the back-action regime. A definitive resolution would require a single-electron interferometer with simultaneous phase and time-of-flight resolution at the few-attosecond level, ideally with a switchable source whose recoil can be independently monitored. No such experiment has yet been performed; the debate is open in the sense that no one has produced data that both sides accept.\n\n### Non-Abelian AB and Wilczek–Zee holonomy\n\nWilczek and Zee (1984) generalized Berry's construction to degenerate eigenspaces, where the connection becomes a matrix-valued one-form and parallel transport along non-contractible loops yields non-commuting holonomies $U_\\gamma = \\mathcal{P}\\exp\\bigl(i\\oint A_\\mu^a T^a\\,dx^\\mu\\bigr)$. The cleanest realizations are not in electron interferometry but in cold-atom and molecular settings: dressed-state manifolds in alkali atoms exposed to engineered light fields support synthetic non-Abelian gauge potentials [26], and the same algebraic structure underlies the quantum-double anyon models reviewed in [27]. The relevant experimental claim — observation of *non-commutativity* by reversing loop order and detecting a residual unitary — has been reported in trapped-ion and superconducting-qubit platforms, but a non-Abelian AB experiment in the strict sense (a topological loop around an excluded non-Abelian flux) remains a target rather than an achievement. The honest summary is that synthetic non-Abelian connections are routinely engineered; topologically protected non-Abelian holonomy of a confined flux has not been cleanly isolated outside the simulation regime.\n\n### Neutral-particle and dual phases\n\nAharonov–Casher (1984) showed that a neutral particle with magnetic moment $\\boldsymbol{\\mu}$ moving around a line of charge acquires a phase $(1/\\hbar c^2)\\oint(\\boldsymbol{\\mu}\\times\\mathbf{E})\\cdot d\\boldsymbol{\\ell}$; the He–McKellar–Wilkens (1993) effect is the dual for an electric dipole circulating a magnetic monopole line. Both have been measured in neutron and atom interferometry — Cimmino et al. for AC, lattice-interferometer demonstrations for HMW — and both fit the same fibre-bundle framework as AB once one identifies the appropriate $U(1)$ connection [26, 20, 9, 10]. They are not curiosities: they decide whether the \"potentials are fundamental\" reading survives the move to neutral matter, and the answer is yes — what is fundamental is the connection, with the electromagnetic case being one realization among several.\n\nA related frontier is excitonic and polaritonic AB: in semiconductor rings threaded by flux, a neutral electron–hole pair acquires a non-trivial phase whenever its internal polarization is non-zero, with experimental signatures in photoluminescence Aharonov–Bohm oscillations. Fractional AB phases in quantum-Hall edge-state interferometers, where the encircling quasiparticle carries fractional charge $e^*=\\nu e$, give $\\Delta\\Phi = 2\\pi\\nu(\\Phi/\\Phi_0)$ and are the closest thing condensed matter has to a direct measurement of anyonic statistics [22].\n\n### Gravitational analogues\n\nTwo distinct effects circulate under \"gravitational AB\". The first is the *gravitomagnetic* phase: a slowly rotating mass generates a Lense–Thirring frame-dragging field $\\mathbf{B}_g \\sim G\\mathbf{J}/r^3$, and a particle encircling its angular-momentum axis acquires $\\Delta\\Phi_g \\propto \\oint \\mathbf{A}_g \\cdot d\\boldsymbol{\\ell}$. Estimated for Earth-based atom interferometers it is below current sensitivity by two orders of magnitude (verify), though next-generation long-baseline atom interferometers (MAGIS, AION) close the gap. The second is the *conical-defect* AB: a cosmic string, or any conical singularity, produces a flat exterior geometry with deficit angle $\\delta$, and matter waves encircling it pick up a phase that depends only on the topology — a literal gravitational holonomy. Laboratory analogues in liquid-crystal disclinations and graphene cones have demonstrated the wave-mechanical effect [20].\n\nCrucially, the COW (Colella–Overhauser–Werner, 1975) phase, often miscalled \"gravitational AB\", is not AB-like at all: it arises from a non-zero gravitational *force* along the interferometer arms. Genuine gravitational AB requires a force-free region with non-trivial topology around a confined source.\n\n### What would count as decisive\n\nFour experiments would close four debates: (1) a switchable Faraday-cage electric-AB measurement with quantified shielding, completing the magnetic-case programme for the electric variant; (2) attosecond-resolved transit timing in a single-electron AB interferometer, adjudicating Vaidman's force-on-source account against the holonomy reading; (3) sequential non-commuting loops around a topologically isolated non-Abelian flux source, proving non-Abelian AB rather than non-Abelian Berry; (4) detection of the gravitomagnetic AB phase from a controllably rotated source mass in an atom interferometer, separating it from the COW force contribution. None requires new physics. Each requires a level of experimental control that did not exist a decade ago and now plausibly does."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent six sections arguing that the textbook compression of this story is wrong in roughly four ways simultaneously. Here is where I will plant my flag.\n\n### (a) What I defend with my reputation\n\nThe magnetic flux phase $\\Delta\\Phi = (q/\\hbar)\\oint A\\!\\cdot\\!d\\boldsymbol{\\ell}$, read as the holonomy $\\exp(iq\\Phi/\\hbar)$ of a $U(1)$ connection around a non-contractible loop, is settled physics. It was derived correctly by Ehrenberg and Siday in 1949 from semiclassical electron optics; it was rederived and — more importantly — *reinterpreted* by Aharonov and Bohm in 1959; and it was experimentally isolated from any conceivable residual-field artefact by Tonomura's superconductor-shielded toroid in 1986. The Möllenstedt–Bayh continuous-solenoid measurement of 1962, not Chambers 1960, is the first experiment I would put in front of a sceptic without an asterisk. I will defend, in equal seriousness, the claim that the *correct* mathematical home of the effect is Wu–Yang's bundle picture, not the \"potentials are real\" slogan: the gauge-invariant object is the holonomy class, and the slogan is a casualty of pedagogy.\n\n### (b) What is shakier than the literature admits\n\nThree things, named specifically.\n\nFirst, **the Franz 1939 precursor**. Hiley and Peshkin–Tonomura cite it; I have never seen the Danzig proceedings entry quoted verbatim in the secondary literature, and the chain of attribution is suspiciously short. Until somebody reproduces the actual paragraph, \"Franz anticipated AB\" should be tagged *plausible but unverified*, not folded into the historical record.\n\nSecond, **\"force-free\" propaganda around the magnetic AB effect**. The claim that the electron experiences *no* local Lorentz force in the field-free region is true at the level of expectation values for a wave packet that stays outside the flux tube, but it is routinely overstated. Boyer's long-running dissent and the more recent semiclassical analyses of lateral momentum transfer have not been cleanly killed; they have been argued past. The honest statement is: the phase is force-free; the *individual* trajectory in any realistic preparation is a separate and unfinished discussion.\n\nThird, **the electric AB experimental record**. The magnetic case is closed; the electric case is not. The cleanest measurements (van Oudenaarden-style mesoscopic, and the dispersionless time-dependent variants) are subtler than their citations admit, and the textbook habit of writing \"and similarly for the electric case\" papers over a genuinely thinner empirical floor.\n\n### (c) Three open questions I would actually work on, ranked\n\n1. **Dispersionless electric AB with a true time-dependent scalar potential** — the cleanest test of 4-vector covariance of the phase, and the place I expect the next decisive experiment.\n2. **Non-Abelian AB / Wilczek–Zee holonomy in cold-atom or photonic synthetic gauge fields** — the regime where \"holonomy\" stops commuting and the bundle picture earns its keep.\n3. **Gravitational AB via the COW-successor interferometers** — whether the Christoffel-connection holonomy around a mass-excluded region is observable in principle, and what counts as \"excluded\" when the connection is not flat.\n\n### (d) Reading path\n\nFive works, in order, each chosen to do one job.\n\n1. Ehrenberg \u0026 Siday (1949) — read first, because everything textbooks attribute to 1959 is already here, in electron-optical language.\n2. Aharonov \u0026 Bohm (1959) — read second, for the *interpretive* move (potentials as locally meaningful in QM) that Ehrenberg–Siday did not make.\n3. Möllenstedt \u0026 Bayh (1962) — read third, as the first experiment a referee cannot impeach on stray-field grounds.\n4. Wu \u0026 Yang (1975) — read fourth, because this is where the slogan dies and the connection-on-a-fibre-bundle picture takes over.\n5. Tonomura et al. (1986) — read fifth, as the experimental capstone and the reason the Bocchieri–Loinger objection is no longer a live position.\n\nRead in that order, the story stops being \"Aharonov and Bohm predicted, Chambers confirmed\" and starts being what it actually is: a thirty-seven-year argument about what is local in quantum electrodynamics, settled by a superconductor and a hexapole lens."}], "references": [{"n": 1, "title": "The Refractive Index in Electron Optics and the Principles of Dynamics", "authors": ["W. Ehrenberg", "R. E. Siday"], "year": 1949, "venue": "Proceedings of the Physical Society. Section B 62, 8–21", "url": "https://iopscience.iop.org/article/10.1088/0370-1301/62/1/303", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Significance of Electromagnetic Potentials in the Quantum Theory", "authors": ["Y. Aharonov", "D. Bohm"], "year": 1959, "venue": "Physical Review 115, 485", "url": "https://journals.aps.org/pr/abstract/10.1103/PhysRev.115.485", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Elektroneninterferenzen im Magnetfeld (Bericht, Danzig)", "authors": ["Walter Franz"], "year": 1939, "venue": "Verhandlungen der Deutschen Physikalischen Gesellschaft (Danzig session) — exact citation disputed (verify)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "The Early History of the Aharonov–Bohm Effect", "authors": ["B. J. Hiley"], "year": 2013, "venue": "arXiv:1304.4736 (also published in Festschrift volumes)", "url": "https://arxiv.org/abs/1304.4736", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Recherches sur la théorie des quanta", "authors": ["Louis de Broglie"], "year": 1924, "venue": "Doctoral thesis, Faculté des Sciences de Paris; reprinted Ann. Phys. (Paris) 10, 22 (1925)", "url": "https://tel.archives-ouvertes.fr/tel-00006807", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "The Diffraction of Electrons by a Crystal of Nickel", "authors": ["C. Davisson", "L. H. Germer"], "year": 1927, "venue": "Physical Review 30, 705", "url": "https://doi.org/10.1103/PhysRev.30.705", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "The Aharonov–Bohm Effect", "authors": ["M. Peshkin", "A. Tonomura"], "year": 1989, "venue": "Lecture Notes in Physics 340, Springer-Verlag", "url": "10.1007/BFb0032076", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Beobachtungen und Messungen an Biprisma-Interferenzen mit Elektronenwellen", "authors": ["Gottfried Möllenstedt", "Heinrich Düker"], "year": 1955, "venue": "Naturwissenschaften 42, 41 (and Z. Phys. 145, 377, 1956)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Concept of Nonintegrable Phase Factors and Global Formulation of Gauge Fields", "authors": ["Tai Tsun Wu", "Chen Ning Yang"], "year": 1975, "venue": "Physical Review D 12, 3845", "url": "https://doi.org/10.1103/PhysRevD.12.3845", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "The Quantum Effects of Electromagnetic Fluxes", "authors": ["S. Olariu", "I. I. Popescu"], "year": 1985, "venue": "Reviews of Modern Physics 57, 339", "url": "https://doi.org/10.1103/RevModPhys.57.339", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "The Feynman Lectures on Physics, Volume III, Chapter 15: The Vector Potential", "authors": ["R. P. Feynman", "R. B. Leighton", "M. Sands"], "year": 1965, "venue": "Addison-Wesley", "url": "https://www.feynmanlectures.caltech.edu/III_15.html", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Quantal Phase Factors Accompanying Adiabatic Changes", "authors": ["M. V. Berry"], "year": 1984, "venue": "Proceedings of the Royal Society A 392, 45", "url": "https://doi.org/10.1098/rspa.1984.0023", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Quantum Paradoxes: Quantum Theory for the Perplexed", "authors": ["Y. Aharonov", "D. Rohrlich"], "year": 2005, "venue": "Wiley-VCH", "url": "10.1002/9783527619115", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Messung der kontinuierlichen Verschiebung der Elektronen-Interferenzen im feldfreien Raum durch das magnetische Vektorpotential einer Wolfram-Wendel", "authors": ["Gottfried Möllenstedt", "Wolfgang Bayh"], "year": 1962, "venue": "Naturwissenschaften 49, 81", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Evidence for Aharonov–Bohm Effect with Magnetic Field Completely Shielded from Electron Wave", "authors": ["A. Tonomura", "N. Osakabe", "T. Matsuda", "T. Kawasaki", "J. Endo", "S. Yano"], "year": 1986, "venue": "Physical Review Letters 56, 792", "url": "https://doi.org/10.1103/PhysRevLett.56.792", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "Elektroneninterferenzen an mehreren künstlich hergestellten Feinspalten", "authors": ["Claus Jönsson"], "year": 1961, "venue": "Zeitschrift für Physik 161, 454", "url": "https://doi.org/10.1007/BF01342460", "cited_by": null, "bucket": "archive"}, {"n": 17, "title": "Shift of an Electron Interference Pattern by Enclosed Magnetic Flux", "authors": ["R. G. Chambers"], "year": 1960, "venue": "Physical Review Letters 5, 3", "url": "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.5.3", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "Experimenteller Nachweis der Phasenverschiebung von Elektronenwellen durch das magnetische Vektorpotential", "authors": ["Hans Boersch", "H. Hamisch", "K. Grohmann", "D. Wohlleben"], "year": 1961, "venue": "Zeitschrift für Physik 165, 79 (verify exact volume/page)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Obituary: Akira Tonomura (1942–2012)", "authors": ["Physics Today editors"], "year": 2012, "venue": "Physics Today / Hitachi Central Research Laboratory memorials", "url": "https://physicstoday.scitation.org/", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Geometric Phase in Optics: From Wavefront Manipulation to Waveguiding", "authors": ["Chandroth Pannian Jisha", "Stefan Nolte", "Alessandro Alberucci"], "year": 2021, "venue": "Laser \u0026 Photonics Review", "url": "https://doi.org/10.1002/lpor.202100003", "cited_by": 141, "bucket": "earliest"}, {"n": 21, "title": "Geometric Phases and Topological Quantum Computation", "authors": ["Vlatko Vedral"], "year": 2002, "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.48550/arxiv.quant-ph/0212133", "cited_by": 0, "bucket": "earliest"}, {"n": 22, "title": "Interferometer-Based Studies of Quantum Hall Phenomena", "authors": ["Douglas McClure"], "year": 2012, "venue": "Digital Access to Scholarship at Harvard (DASH) (Harvard University)", "url": "https://openalex.org/W2159948030", "cited_by": 1, "bucket": "earliest"}, {"n": 23, "title": "Timeless Approach
