f linear response: χ''(ω) is fixed by equilibrium fluctuations via fluctuation–dissipation, χ'(ω) by the Hilbert transform. KK becomes a statement about many-body correlation functions, not about optical media.", "who": "Ryogo Kubo", "work": "The fluctuation-dissipation theorem, Rep. Prog. Phys. 29, 255", "kind": "theory", "ref": 22}, {"year": 1972, "event": "Nussenzveig's monograph gives the mature treatment — Titchmarsh's theorem, subtracted relations, superconvergence and sum rules, phase-retrieval ambiguity, and the precise hypotheses under which each holds. It is the reference that most modern KK users cite and few read.", "who": "H. M. Nussenzveig", "work": "Causality and Dispersion Relations, Academic Press (Mathematics in Science and Engineering, Vol. 95)", "kind": "formalization", "ref": 21}, {"year": 2016, "event": "The Kramers–Kronig coherent receiver: a deliberately engineered minimum-phase optical field lets the full complex signal be reconstructed from intensity-only detection. The relation is no longer a constraint discovered in a medium but a design specification imposed on a signal — the same mutation now driving KK quantitative phase imaging [67].", "who": "Antonio Mecozzi, Cristian Antonelli, Mark Shtaif", "work": "Kramers–Kronig coherent receiver, Optica 3, 1220–1227", "kind": "revival", "ref": 32}], "neglected": [{"name": "Rudolf Ladenburg and Fritz Reiche", "role": "Built the quantum dispersion formula in which the real refractive index is assembled from absorption transition probabilities — the physical content KK later made model-independent. Reiche also stands behind the Thomas–Reiche–Kuhn sum rule, the asymptotic condition that makes the unsubtracted KK relation converge.", "evidence": "Their 1923 Naturwissenschaften paper introduces the Ersatzoszillator scheme and the redefinition of the number of dispersion electrons; Kramers' 1924 Nature letter is explicitly a generalization of Ladenburg's theory.", "ref": 3}, {"name": "Ralph de Laer Kronig", "role": "Published first (1926), on the physically harder X-ray problem, and is nonetheless the second name in the hyphenation — and the eponym most often dropped entirely when people write simply 'dispersion relations'. He is also the man who worked out electron spin before Uhlenbeck and Goudsmit and was talked out of publishing it.", "evidence": "Kronig's own retrospective essay in the Pauli memorial volume gives his account of the spin episode; Pauli's Nobel lecture acknowledges the surrounding history; the KNAW memorial notice records his career at Delft. Bohren shows Kronig himself later miscited his 1926 result, muddying his own priority.", "ref": 39}, {"name": "John S. Toll", "role": "Proved that causality and the dispersion relation are logically equivalent — the statement every textbook now attributes to Kramers and Kronig — and, in the same work, showed that recovering phase from modulus is unique only up to a Blaschke product. He left research for university administration, and the result is cited far less than its centrality warrants.", "evidence": "1952 Princeton thesis under Wheeler, later published as Phys. Rev. 104, 1760 (1956); portions were reproduced as an appendix to Jauch and Rohrlich's The Theory of Photons and Electrons (1955).", "ref": 9}, {"name": "Hendrik Wade Bode", "role": "Derived the identical Hilbert-transform pair for network gain and phase in an industrial (Bell Labs) context, and stated the minimum-phase precondition explicitly — a caveat the optics literature then spent decades rediscovering under the name 'the phase-retrieval problem'. Essentially never cited in condensed-matter or optics KK papers.", "evidence": "Network Analysis and Feedback Amplifier Design (1945), Ch. XIV: the attenuation determines the phase uniquely only for a minimum-phase network with no poles or zeros in the right half plane.", "ref": 8}, {"name": "N. G. van Kampen", "role": "Gave the first rigorous derivation that a causality condition forces the scattering S-matrix to be analytic with singularities only in the lower half plane — a year before the Gell-Mann–Goldberger–Thirring paper that is universally credited with launching dispersion theory in particle physics.", "evidence": "Phys. Rev. 89, 1072 (1953) and its sequel Phys. Rev. 91, 1267 (1953) on nonrelativistic particles; GGT (1954) work in the same causality framework but receive the citation.", "ref": 11}, {"name": "Arnold Sommerfeld and Léon Brillouin", "role": "Supplied the actual physical premise both 1926–27 derivations used — that the signal front propagates at exactly c in any dispersive medium — a decade before either. Their names survive attached to 'precursors', not to causality in linear response.", "evidence": "The 1914 twin papers in Annalen der Physik 44 (Sommerfeld 177–202, Brillouin 203–240), written on a problem Sommerfeld set for Brillouin.", "ref": 2}], "conflations": [{"claim": "'Causality implies the Kramers–Kronig relations.'", "clarification": "Causality (χ(t\u003c0)=0) gives analyticity of χ(ω) in the upper half plane. The CONTOUR ARGUMENT additionally requires: (i) χ(ω) → 0 fast enough that the large semicircle drops out, or an explicitly subtracted relation; (ii) χ ∈ L² on the real axis, which is the hypothesis of Titchmarsh's theorem, the actual theorem being invoked; (iii) no poles on the real axis. A metal's Drude conductivity has σ(ω) ~ i·ne²/(mω) — a pole at ω=0 — and a nonzero χ_∞ violates (i). Both are handled in practice by silent subtraction; the subtraction constant is an assumption, not a consequence of causality."}, {"claim": "'KK inversion of measured reflectivity yields the phase, therefore the optical constants are measured.'", "clarification": "Two independent leaks. (a) The KK integral for ln r(ω) requires r(ω) to be MINIMUM-PHASE — no zeros of r in the upper half plane. Causality does not supply this; a Blaschke factor B(ω) with |B|=1 on the real axis changes the phase while leaving the measured |r| identical [86]. Bode stated this in 1945 [82]. (b) The principal-value integral runs over (0,∞) while data span typically two decades; the retrieved phase at ω₀ is a weighted average of the assumed tails, and low-frequency Hagen–Rubens/Drude and high-frequency ω^-4 or free-electron extrapolations are inventions. The honest procedure is a KK-constrained variational or oscillator fit that makes the tail an explicit, reported model parameter [88], and quoted phases should carry a tail-sensitivity band. A phase obtained this way is a model output, not a datum."}, {"claim": "'Kramers–Kronig relation', 'dispersion relation', 'Hilbert transform pair', and 'sum rule' are used interchangeably.", "clarification": "Four distinct objects. The Hilbert-transform pair is the pure mathematics (Plemelj/Sokhotski). The KK relation is that pair applied to a linear, time-invariant, causal susceptibility. A 'dispersion relation' in the particle-physics sense [10][11][85] additionally carries the full analytic structure — bound-state poles, crossing symmetry, subtractions, unitarity via the optical theorem — and is a strictly stronger statement. Sum rules (f-sum, Thomas–Reiche–Kuhn, ⟨n(ω)⟩=1) are superconvergence consequences of the ASYMPTOTIC behavior, and each one silently encodes a specific high-frequency tail; quoting a sum-rule 'check' on data that were themselves KK-inverted using an assumed tail is circular."}, {"claim": "'KK applies to metamaterials, so the retrieved ε(ω) and μ(ω) must satisfy it.'", "clarification": "KK constrains the response of a LOCAL medium at a point. Effective ε(ω), μ(ω) retrieved by S-parameter inversion of a periodic structure are fit parameters of a slab, not local response functions; with spatial dispersion, the physical object is ε(ω,k), which is KK-analytic in ω at fixed k but generally not as a function of ω alone at fixed geometry. Similarly, the modal index of a guided or surface wave need not obey a KK relation, because the mode is a boundary-value construct rather than a bulk causal response. Apparent 'KK violations' in these settings usually indicate that the retrieved quantity was never a susceptibility."}, {"claim": "'KK relations do not hold in nonlinear optics.' / 'KK relations hold for the nonlinear index.'", "clarification": "Both are wrong as stated. For self-action effects the valid statement is NON-DEGENERATE: with the pump frequency held fixed, Δn(ω;ω_pump) and Δα(ω;ω_pump) as functions of the PROBE frequency ω form a KK pair, because the probe response is still causal and linear in the probe field [89]. The fully degenerate χ⁽³⁾(ω;ω,ω,−ω) does not satisfy a KK relation in ω. Applying a one-variable KK transform to a pump–probe or transient-absorption spectrum treats a non-stationary, non-time-invariant system as an LTI one and is unjustified; time-invariance is a hypothesis of the theorem, not a technicality."}, {"claim": "'Im χ(ω) \u003e 0 for ω \u003e 0 follows from causality.'", "clarification": "That is passivity (positive dissipation), an independent thermodynamic input. KK is sign-blind: it relates the two parts but constrains neither's sign. Gain media with Im χ \u003c 0 satisfy KK exactly. Conversely, passivity plus KK together give the Herglotz/positive-real structure from which the f-sum rule and the ⟨n⟩=1 sum rule follow — those results need both ingredients, and papers that attribute them to 'causality' alone are dropping a hypothesis."}, {"claim": "'Kramers–Kronig' names a single theorem attached to a single Kramers and a single Kronig result.", "clarification": "Kramers' name also carries Kramers degeneracy, the Kramers escape rate, Kramers' opacity law, the Kramers–Heisenberg formula, the WKB(J)–Kramers connection formulae and the Kramers–Moyal expansion; Kronig's carries the Kronig–Penney model and the Coster–Kronig transition. More to the point, 'the Kramers–Kronig relation' in the modern literature denotes at least three inequivalent statements: the unsubtracted pair for χ(ω), the once-subtracted pair for n(ω) or ε(ω) with ε_∞, and the log-modulus/phase pair for a reflection or transmission coefficient — the last of which requires a minimum-phase hypothesis the first two do not."}], "sections": [{"id": "prehistory-and-canonization", "title": "Prehistory, 1914–1956: Who Actually Proved What", "markdown": "## Prehistory, 1914–1956: Who Actually Proved What\n\nThe sentence that opens most treatments — *Kramers and Kronig showed in 1926–27 that causality alone forces the real and imaginary parts of any linear response function to be Hilbert transforms of one another* — is wrong in three separable ways. Neither man worked from causality alone; Kronig obtained only one member of the pair; and the model-independent theorem is a product of 1945–1956. Bohren's reconstruction [1] establishes the first two from the papers themselves; the third is visible in the citation record.\n\n### The premise nobody credits: 1914\n\nThe physical input both 1926–27 derivations use is not \"causality\" in the abstract but the *signal-front* condition: in a dispersive medium the leading edge of a truncated wave train propagates at exactly $c$, regardless of how large or small $n(\\omega)$ is in the body of the pulse. Sommerfeld proved it, Brillouin worked out the precursors, and the two papers appeared back to back in *Annalen der Physik* **44** in 1914 [2]. This is what converted \"no effect before its cause\" from a slogan into a boundary condition on $n(\\omega)$ that a contour integral can exploit. Their names survive attached to *precursors*, not to linear response.\n\n### Dispersion synthesized from absorption: 1923–1924\n\nThe claim that the dispersive part of the response is *computable from* the absorptive part is older than KK and was quantitative before it was general. Ladenburg and Reiche's *Ersatzoszillator* scheme [3] replaced the classical dispersion electrons with fictitious oscillators whose strengths are fixed by Einstein transition probabilities, so that $n(\\omega)$ is assembled term by term out of spectroscopic absorption data. Reiche also stands behind the Thomas–Reiche–Kuhn sum rule, i.e. the asymptotic condition $\\chi(\\omega)\\to -\\omega_p^2/\\omega^2$ that later makes the *unsubtracted* relation converge at all. Kramers' 1924 *Nature* letter [4] generalized Ladenburg's formula to include negative terms for transitions downward,\n\n$$\\alpha(\\omega)\\ \\propto\\ \\sum_{k\u003ea}\\frac{f_{ak}}{\\omega_{ak}^{2}-\\omega^{2}}\\;-\\;\\sum_{j\u003ca}\\frac{f_{ja}}{\\omega_{ja}^{2}-\\omega^{2}},$$\n\nthe immediate ancestor of Kramers–Heisenberg. This is the substantive prehistory that KK reviews omit.\n\n### What Kronig and Kramers each actually did\n\nKronig's 1926 JOSA paper [5] treats X-rays scattered by an atomic gas. Using the finite-front condition, he obtains the refractive index as a principal-value integral over the atomic absorption coefficient — schematically\n\n$$n(\\omega)-1=\\frac{c}{\\pi}\\,\\mathrm{P}\\!\\!\\int_{0}^{\\infty}\\frac{\\mu(\\omega')\\,d\\omega'}{\\omega'^{2}-\\omega^{2}},$$\n\none relation, inside a model. He did not derive the converse. Kramers, at the Volta centenary congress at Como in September 1927, stated *both* directions in a French-language proceedings contribution [6] — dispersion from absorption and absorption from dispersion — and, as Bohren documents [1], explicitly *speculated* that his model results might hold more generally rather than proving it. The 1928 joint paper in *Zeitschrift für Physik* [7] welded the two names together while both relations still rested on the atomic-gas calculation.\n\nThen the record drifts. In 1936, Gorter and Kronig (*Physica* **3**, 1009) cite Kronig's 1926 paper as the source of relations it does not contain and attribute the other to Kramers as though it had been derived rather than conjectured [1]. Kronig, in other words, is a primary source for the misattribution of his own priority.\n\n### Where the theorem was actually proved: 1945–1956\n\n**Bode, 1945** [8]. In feedback-amplifier design, $\\log|H|$ and $\\arg H$ are a Hilbert pair — *provided the network is minimum-phase*, with no poles or zeros in the right half plane. Bode stated the caveat at the outset. Optics spent decades rediscovering it as \"the phase-retrieval problem.\"\n\n**Toll, 1952/1956** [9][10]. Toll's Princeton thesis under Wheeler, and its published distillation, prove the *equivalence*: strict causality $\\Leftrightarrow$ the dispersion relation. The theorem being invoked is Titchmarsh's — for $\\chi\\in L^{2}(\\mathbb{R})$, vanishing of $\\chi(t\u003c0)$, holomorphy of $\\chi(\\omega)$ in $\\mathrm{Im}\\,\\omega\u003e0$, and\n\n$$\\chi'(\\omega)=\\frac{2}{\\pi}\\,\\mathrm{P}\\!\\!\\int_{0}^{\\infty}\\frac{\\omega'\\chi''(\\omega')}{\\omega'^{2}-\\omega^{2}}\\,d\\omega',\\qquad \\chi''(\\omega)=-\\frac{2\\omega}{\\pi}\\,\\mathrm{P}\\!\\!\\int_{0}^{\\infty}\\frac{\\chi'(\\omega')}{\\omega'^{2}-\\omega^{2}}\\,d\\omega'$$\n\nare mutually equivalent. Toll also proved, in the same breath, that the modulus fixes the phase only up to an all-pass Blaschke factor. The statement every textbook credits to 1926 belongs here.\n\n**Van Kampen, 1953** [11]. First rigorous causality $\\to$ analyticity theorem for scattering: singularities of the S-matrix confined to the lower half plane, asymptotics specified — a year before the paper universally credited with launching dispersion theory.\n\n**Gell-Mann, Goldberger and Thirring, 1954** [12]. Microcausality — vanishing commutators at spacelike separation — as the field-theoretic premise, exported as *forward dispersion relations*.\n\n### How the hyphen was fixed\n\nThe S-matrix program needed a respectable ancestor, and canonized one. Goldberger's 1955 papers remove perturbation theory from the derivation and, with Miyazawa and Oehme, apply \"the generalized Kramers–Kronig dispersion relations\" to pion–nucleon scattering [13][14][15]. Through the early 1950s usage was genuinely unsettled: the dielectrics and network-theory literature writes **Kronig–Kramers** [16][17][18] — Macdonald's 1952 relaxation-time paper, Brachman and Macdonald's 1956 immittance-kernel paper, Gourary's tensor generalization — while the same authors elsewhere write the other order [19][20]. What broke the tie was not chronology (which favors Kronig) but the citation volume of the particle-physics papers, and Nussenzveig's 1972 monograph [21] then codified the mature mathematics under the fixed name. The deepest credit failure is not between the two eponyms at all: Ladenburg and Reiche made \"dispersion is determined by absorption\" quantitative, and Toll proved the theorem — neither appears in the hyphenation."}, {"id": "the-theorem-with-hypotheses-numbered", "title": "The Physics, Properly: Titchmarsh, Plemelj, and Eight Numbered Hypotheses", "markdown": "## The Physics, Properly: Titchmarsh, Plemelj, and Eight Numbered Hypotheses\n\nEverything in the previous section was about who wrote what. This section is about what is actually true, and under exactly which hypotheses. The theorem is not \"causality ⇒ Hilbert pair.\" The theorem is a chain, and each link is a separate assumption that experiments break in different ways.\n\n### The constitutive setup: A1–A4\n\nWrite the response of a medium to a field $E$ as $P(t)=\\int dt'\\,\\chi(t,t')E(t')$. Getting to the object KK talks about already costs four assumptions:\n\n- **A1 (Linearity).** $P$ is linear in $E$; superposition holds. Without it there is no single $\\chi(\\omega)$ to relate.\n- **A2 (Time-invariance / stationarity).** $\\chi(t,t')=\\chi(t-t')$, so the kernel Fourier-transforms in one variable. A pumped, transient, or aging system violates this outright — the reason a one-variable KK transform applied to a transient-absorption spectrum is not an approximation but a category error.\n- **A3 (Locality).** $P(\\mathbf r,t)$ depends on $E$ at the same $\\mathbf r$. With spatial dispersion the honest object is $\\chi(\\omega,\\mathbf k)$, analytic in $\\omega$ at *fixed* $\\mathbf k$; nothing guarantees analyticity in $\\omega$ alone along a dispersion branch $k(\\omega)$.\n- **A4 (Strict retardation).** $\\chi(\\tau)=0$ for $\\tau\u003c0$ — the *primitive* causality of Sommerfeld and Brillouin's signal front [2], not a vague \"effects follow causes.\"\n\n### Titchmarsh: what A4 actually buys\n\nDefine $\\chi(\\omega)=\\int_0^\\infty d\\tau\\,\\chi(\\tau)e^{i\\omega\\tau}$. For $\\omega=\\omega'+i\\omega''$ with $\\omega''\u003e0$ the kernel $e^{i\\omega\\tau}=e^{i\\omega'\\tau}e^{-\\omega''\\tau}$ is exponentially damped on the support of $\\chi$, so the integral converges and defines a function holomorphic in the open upper half plane (UHP), continuous up to the real axis, and bounded there. That is the whole content of causality. Titchmarsh's theorem supplies the converse and the sharp hypothesis:\n\n- **A5 (Square-integrability / specified falloff).** $\\chi(\\omega')\\in L^2(\\mathbb R)$. Then the three statements — $\\chi(\\tau)$ vanishes for $\\tau\u003c0$; $\\chi$ is the boundary value of a function holomorphic in the UHP with $\\sup_{\\omega''\u003e0}\\int|\\chi|^2 d\\omega'\u003c\\infty$ (a Hardy-class $H^2$ function); and the Hilbert-transform pair holds — are *equivalent*. Not \"implied by causality\": equivalent, given A5. Nussenzveig states the hypotheses in precisely this form [21], and this is the theorem essentially everyone cites Kramers and Kronig for.\n\nThe pair itself is Sokhotski–Plemelj, not contour cleverness. For $\\chi\\in H^2$, $\\oint \\chi(z)/(z-\\omega)\\,dz=0$ over the closed UHP contour; indenting around $z=\\omega$ and using\n\n$$\\frac{1}{\\omega'-\\omega\\mp i0}=\\mathrm{P}\\frac{1}{\\omega'-\\omega}\\pm i\\pi\\delta(\\omega'-\\omega)$$\n\ngives $\\chi(\\omega)=\\frac{1}{i\\pi}\\mathrm{P}\\!\\int \\frac{\\chi(\\omega')}{\\omega'-\\omega}d\\omega'$, whose real and imaginary parts are the relations. The $\\delta$-function *is* the theorem; the principal value is what's left over.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003cline x1=\"40\" y1=\"300\" x2=\"690\" y2=\"300\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"365\" y1=\"360\" x2=\"365\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"675\" y=\"322\" fill=\"#e8e6e1\" font-size=\"15\"\u003eRe ω\u003c/text\u003e\u003ctext x=\"378\" y=\"52\" fill=\"#e8e6e1\" font-size=\"15\"\u003eIm ω\u003c/text\u003e\u003ctext x=\"60\" y=\"80\" fill=\"#7ee0a3\" font-size=\"16\"\u003eUPPER HALF PLANE: χ holomorphic (A4)\u003c/text\u003e\u003ctext x=\"60\" y=\"352\" fill=\"#ff7a90\" font-size=\"16\"\u003eLOWER HALF PLANE: all poles live here\u003c/text\u003e\u003cpath d=\"M 120 300 A 245 245 0 0 1 610 300\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"150\" y=\"150\" fill=\"#7aa2ff\" font-size=\"15\"\u003elarge semicircle → 0 requires A5\u003c/text\u003e\u003ctext x=\"150\" y=\"172\" fill=\"#7aa2ff\" font-size=\"14\"\u003e(else: subtract, get ε∞)\u003c/text\u003e\u003cline x1=\"120\" y1=\"300\" x2=\"440\" y2=\"300\" stroke=\"#7aa2ff\" stroke-width=\"2.5\"/\u003e\u003cpath d=\"M 440 300 A 25 25 0 0 1 490 300\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"490\" y1=\"300\" x2=\"610\" y2=\"300\" stroke=\"#7aa2ff\" stroke-width=\"2.5\"/\u003e\u003ccircle cx=\"465\" cy=\"300\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"440\" y=\"262\" fill=\"#ffb86b\" font-size=\"15\"\u003eω (Plemelj: P + iπδ)\u003c/text\u003e\u003ccircle cx=\"365\" cy=\"300\" r=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003cpath d=\"M 345 300 A 20 20 0 0 1 385 300\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"200\" y=\"332\" fill=\"#ff7a90\" font-size=\"15\"\u003eω=0 Drude pole σ ~ ine²/mω — A6 fails\u003c/text\u003e\u003ccircle cx=\"250\" cy=\"200\" r=\"5\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"200\" y=\"192\" fill=\"#ffb86b\" font-size=\"14\"\u003ezero of r(ω): kills A8\u003c/text\u003e\u003ccircle cx=\"300\" cy=\"378\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"430\" cy=\"368\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"60\" y=\"118\" fill=\"#e8e6e1\" font-size=\"14\"\u003eContour closes ⟺ A5 ∧ A6. A8 is invisible here: a Blaschke\u003c/text\u003e\u003ctext x=\"60\" y=\"138\" fill=\"#e8e6e1\" font-size=\"14\"\u003efactor is holomorphic in the UHP and unimodular on ℝ.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The contour argument with each hypothesis attached to the geometry it protects. A4 empties the UHP of singularities; A5 kills the arc; A6 keeps the real axis clean except at the Plemelj point $\\omega$. A zero of $r(\\omega)$ in the UHP (orange circle) leaves the contour argument for $\\chi$ untouched but destroys uniqueness of the retrieved phase.*\n\n### Where the contour argument leaks: A6–A8\n\n- **A6 (No poles on the real axis).** A Drude metal has $\\sigma(\\omega)\\simeq i n e^2/(m\\omega)$ as $\\omega\\to0$. The standard fix — deform above the pole and add the explicit $\\delta(\\omega)$ / $1/\\omega$ term by hand — is a *statement about the DC limit*, not a consequence of A4.\n- **A7 (Passivity).** $\\mathrm{Im}\\,\\chi(\\omega)\u003e0$ for $\\omega\u003e0$ is thermodynamics, not causality. KK is sign-blind; gain media satisfy it exactly. Passivity plus A4–A5 gives Herglotz structure, and only then do positivity-based sum rules follow. In the Kubo framing, $\\chi''$ is fixed by equilibrium fluctuations and $\\chi'$ by the Hilbert transform — passivity enters through the equilibrium density matrix, i.e. through $\\beta\u003e0$ [22].\n- **A8 (Minimum phase).** Required *only* for log-modulus/phase pairs. If $r(\\omega)$ has zeros in the UHP, $\\ln r$ is not holomorphic there, and $r\\to rB$ with a Blaschke product $B$ leaves $|r|$ untouched on the real axis while shifting $\\arg r$ [10]. Bode stated the condition in 1945 [8]; the optics literature calls it the phase-retrieval problem.\n\n### Subtractions and what a sum rule really encodes\n\nWhen A5 fails because $\\chi\\to\\chi_\\infty\\neq0$, apply the argument to $[\\chi(\\omega)-\\chi_\\infty]/(\\omega^2-\\omega_0^2)$. One subtraction gives\n\n$$\\varepsilon_1(\\omega)-\\varepsilon_\\infty=\\frac{2}{\\pi}\\,\\mathrm{P}\\!\\!\\int_0^\\infty\\frac{\\omega'\\varepsilon_2(\\omega')}{\\omega'^2-\\omega^2}\\,d\\omega'.$$\n\n$\\varepsilon_\\infty$ is an integration constant — an assumption about the unmeasured UV, promoted by habit to a fitted material parameter. Superconvergence then turns asymptotics into sum rules: expanding the subtracted relation at large $\\omega$ against the free-electron limit $\\varepsilon(\\omega)\\to1-\\omega_p^2/\\omega^2$ gives the f-sum rule $\\int_0^\\infty \\omega\\varepsilon_2\\,d\\omega=\\tfrac{\\pi}{2}\\omega_p^2$ — which encodes precisely the $\\omega^{-2}$ tail, nothing else. TRK, $\\sum_n f_{n0}=Z$, is the same statement at the atomic level and is the microscopic reason that tail exists; Reiche's fingerprint on the convergence of the unsubtracted relation [3]. The $\\langle n\\rangle=1$ rule encodes the $\\omega^{-4}$ tail of $n-1$. Each rule is a tail in disguise, which is why \"checking\" a sum rule on data KK-inverted with an assumed tail is circular — the check returns the assumption. The tabulated $f_1$ from $f_2$ inversions in the standard X-ray atomic scattering tables are built on exactly this superconvergent scaffolding [23], and constrained variational analysis exists to make the tail an explicit reported parameter rather than a silent one [24]."}, {"id": "failure-modes-assumption-by-assumption", "title": "Where Each Hypothesis Breaks: The Validity Domain, A1 through A8", "markdown": "## Where Each Hypothesis Breaks: The Validity Domain, A1 through A8\n\nThe eight hypotheses of §2 are not decorative. Each one is violated by a class of experiments that nonetheless publishes Kramers–Kronig-processed numbers. What follows is the failure catalogue, hypothesis by hypothesis, with the regime and — where it can be given — the size of the error.\n\n### A1 (linearity) and A2 (time-translation invariance): nonlinear and pump–probe optics\n\nThese two fail together and are almost always violated together, which is why the literature's treatment of them is so confused. The correct statement, due to Hutchings, Sheik-Bahae, Hagan and Van Stryland [25], is *non-degenerate*: hold the pump at $\\omega_p$ with fixed intensity $I$, and the probe-frequency response\n\n$$\\Delta n(\\omega;\\omega_p)\\ \\longleftrightarrow\\ \\Delta\\alpha(\\omega;\\omega_p),\\qquad \\Delta n(\\omega;\\omega_p)=\\frac{c}{\\pi}\\,\\mathrm{P}\\!\\!\\int_0^\\infty \\frac{\\Delta\\alpha(\\omega';\\omega_p)}{\\omega'^2-\\omega^2}\\,d\\omega'$$\n\nis a legitimate KK pair, because the medium *as dressed by the pump* is a new LTI system for the probe: linear in the probe field (A1 restored perturbatively), and stationary provided the pump is CW or long compared to all material memory (A2 restored by fiat). The pump index enters as a parameter, not a variable.\n\nWhat does not survive is the fully degenerate self-action coefficient $\\chi^{(3)}(\\omega;\\omega,\\omega,-\\omega)$, whose real and imaginary parts ($n_2$ and $\\beta$) are *not* Hilbert-transform partners in $\\omega$. The reason is structural: varying $\\omega$ moves all four frequency arguments simultaneously, so the analytic continuation is in a diagonal direction through a multivariable analyticity domain, and the single-variable Titchmarsh theorem has nothing to say about it. Papers that Hilbert-transform a measured $\\beta(\\omega)$ to obtain $n_2(\\omega)$ are using the non-degenerate theorem outside its stated domain; the two agree only where the dispersion of $\\Delta n$ with $\\omega_p$ is negligible, i.e. far from any two-photon resonance.\n\nA2 fails outright, and irreparably, for genuine transient spectroscopy. A pump–probe or transient-absorption spectrum measured at delay $\\tau$ is a snapshot of a *non-stationary* system; the response kernel is $\\chi(t,t')$, not $\\chi(t-t')$, and there is no single-variable Fourier transform to be analytic in. One may still write a KK relation at each fixed $\\tau$ if — and only if — the material memory is short compared to $\\tau$-dynamics (the adiabatic/quasi-stationary limit). For carrier cooling on 100 fs timescales probed with 20 fs pulses, that condition is violated by construction, and the transform-derived \"index change\" is an artifact whose magnitude is set by the pulse bandwidth, not by the material.\n\n### A3 (locality): spatial dispersion and metamaterials\n\nLocality is the hypothesis that $\\mathbf{P}(\\mathbf{r},t)$ depends on $\\mathbf{E}$ at the same $\\mathbf{r}$. Relax it and the response is $\\varepsilon(\\omega,k)$, which is KK-analytic in $\\omega$ *at fixed $k$* — the causal-memory argument is untouched — but not along any trajectory $k=k(\\omega)$, which is what a fixed-geometry measurement traces out. This is the exact content of the metamaterial \"KK violation\" literature. S-parameter retrieval inverts $S_{11},S_{21}$ of a finite slab for an effective $\\varepsilon_{\\rm eff}(\\omega),\\mu_{\\rm eff}(\\omega)$; those are slab fit parameters that absorb the Bloch-mode structure, surface impedance, and branch-cut choices of the inversion. When such a pair fails KK — as in the wide-band negative-permeability retrievals [26] — the correct inference is not that causality is broken but that the retrieved object was never a local susceptibility. The same caution applies to guided- and surface-mode indices: a polariton dispersion $n_{\\rm eff}(\\omega)$ is a boundary-value construct, and strong-coupling polariton branches [27] anticross in ways that no bulk KK pair need reproduce.\n\n### A5 (integrability / no real-axis poles) and A6 (decay at infinity): the DC pole and $\\chi_\\infty$\n\nFor a metal, $\\sigma(\\omega)\\to i n e^2/(m\\omega)$ as $\\omega\\to0$: a first-order pole *on* the contour. The standard fix is to treat it as a pole displaced into the lower half plane by $i/\\tau$ and to subtract its contribution analytically, which amounts to asserting that the $\\omega\\to0$ limit is Drude. That is a model. For a superconductor the pole is genuine ($\\delta$-function at $\\omega=0$ in $\\sigma_1$, $\\sigma_2\\sim1/\\omega$), and the KK integral must be written with the condensate term separated out by hand — the missing-area/Ferrell–Glover–Tinkham argument is precisely the bookkeeping of that separated pole.\n\nA6 fails whenever $\\chi(\\omega)\\not\\to0$, i.e. whenever an electronic background $\\varepsilon_\\infty$ lies above the measured window. The remedy is the once-subtracted relation\n\n$$\\varepsilon_1(\\omega)-\\varepsilon_\\infty=\\frac{2}{\\pi}\\,\\mathrm{P}\\!\\!\\int_0^\\infty\\frac{\\omega'\\varepsilon_2(\\omega')}{\\omega'^2-\\omega^2}\\,d\\omega',$$\n\nand the subtraction constant $\\varepsilon_\\infty$ is an *input*, not an output. Causality does not supply it; it is fixed by extrapolation, by an oscillator fit, or by fiat. Every quoted $\\varepsilon_\\infty$ is a statement about spectral weight outside the window.\n\n### A7 (passivity is not causality): gain media\n\n$\\mathrm{Im}\\,\\chi(\\omega)\u003e0$ for $\\omega\u003e0$ is thermodynamics, not analyticity. An inverted medium with $\\mathrm{Im}\\,\\chi\u003c0$ over the gain band satisfies KK exactly, and the anomalous-dispersion slope that accompanies gain is *required* by KK, not in tension with it. The corollary matters more than the statement: the $f$-sum rule and $\\langle n\\rangle=1$ superconvergence results need passivity (Herglotz/positive-real structure) *in addition to* causality. A paper that derives a sum rule \"from causality\" has dropped a hypothesis; a gain medium is the counterexample.\n\n### A8 (minimum phase): the Blaschke ambiguity, quantified\n\nFor reflectivity inversion one transforms $\\ln r=\\ln|r|+i\\theta$, which requires $r(\\omega)$ to have no zeros in the upper half plane — Bode's minimum-phase condition, stated in 1945 [8] and proved to be independent of causality by Toll [9][10]. Multiplying by $B(\\omega)=\\prod_j(\\omega-\\omega_j)/(\\omega-\\omega_j^*)$ leaves $|r|$ pointwise identical and shifts $\\theta$ by up to $2\\pi$ per factor. No reflectivity dataset can detect this.\n\nThe tail problem is separately quantifiable. The phase kernel weights $\\ln|r|$ as $\\ln\\!\\bigl\\lvert(\\omega'+\\omega)/(\\omega'-\\omega)\\bigr\\rvert$, which decays only as $2\\omega/\\omega'$ — so a two-decade window $[\\omega_L,\\omega_H]=[\\omega_0/10,10\\,\\omega_0]$ leaves the high tail contributing at order $\\omega_0/\\omega_H\\sim10\\%$ of $\\theta$ per e-fold of assumed $R$-slope, and the Hagen–Rubens low tail a comparable amount near the window edge. In practice a swing between $R\\propto\\omega^{-4}$ and free-electron $\\omega^{-2}$ high-frequency extrapolations moves $\\theta(\\omega_0)$ by tens of milliradians mid-window and by 0.1–0.3 rad within a decade of either edge — which propagates to 10–30% errors in $\\sigma_1$ near the edges, where the interesting physics (pseudogaps, low-energy spectral weight) usually lives. The honest procedure is Kuzmenko's KK-constrained variational analysis [24], in which the tail is an explicit, reported model parameter and the anchor points are stated; the same discipline in electrochemical impedance takes the form of the Lin-KK/measurement-model residual test [28][29]. Quoted phases without a tail-sensitivity band are model outputs presented as data."}, {"id": "signatures-direct-and-circumstantial", "title": "Signatures: What Actually Tests Causality, and What Only Looks Like It", "markdown": "## Signatures: What Actually Tests Causality, and What Only Looks Like It\n\nA causality test worthy of the name must have a falsifiable outcome. The structure required is always the same: measure two independent quantities over a *common* spectral window, feed one into the Hilbert transform, and compare the output against the other. Anything that instead *uses* the transform to generate the second quantity has produced an interpolation, not a test. The literature is dense with the second kind wearing the clothes of the first.\n\n### The genuine class: two independent observables, one common window\n\n**Field-resolved time-domain measurement.** THz time-domain spectroscopy records $E(t)$ directly by electro-optic sampling — amplitude and phase of the transmitted field are measured simultaneously, so $\\tilde{n}(\\omega) = n(\\omega) + i\\kappa(\\omega)$ follows from a single ratio $E_{\\text{sam}}(\\omega)/E_{\\text{ref}}(\\omega)$ with no dispersion integral anywhere [30]. KK is then a *prediction* about the measured pair, and it can fail: if it does, either the sample is nonstationary during the scan, the reference and sample paths differ, or Fabry–Pérot echoes were windowed inconsistently. This is the strongest routine test available, and its power comes entirely from the fact that the phase was never manufactured.\n\n**Ellipsometry.** Measuring $\\rho = r_p/r_s = \\tan\\Psi\\, e^{i\\Delta}$ delivers two independent real numbers per frequency [31]. The KK check has teeth *only* if the analysis is point-by-point inversion; the moment a Kramers–Kronig-consistent oscillator basis (Lorentz, Tauc–Lorentz, Gaussian-with-KK-partner) is used as the fitting model, consistency is imposed by construction and the residual tests the oscillator basis, not causality. The published claim \"our ellipsometric $\\varepsilon(\\omega)$ is KK-consistent\" is nearly always the tautological version. The discriminating question to ask any such paper: *was the dielectric function parameterized?*\n\n**Spectroscopic interferometry and heterodyne/holographic detection.** White-light interferometry, dual-comb, and off-axis holography all recover $\\arg t(\\omega)$ from a fringe pattern — a geometric measurement, independent of any analyticity assumption. Note the sharp contrast with the \"Kramers–Kronig receiver\" of coherent optical communications [32] and its imaging analogue [33]: those *assume* minimum phase (deliberately engineered, by adding a strong carrier that pushes all zeros of the analytic signal out of the upper half plane) and reconstruct phase from intensity alone. They are beautiful engineering and they are not causality tests — they are demonstrations that a minimum-phase condition can be *manufactured*, which is precisely the hypothesis Toll showed KK cannot supply on its own [10][8].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eGenuine versus circular Kramers-Kronig tests\u003c/title\u003e\u003ctext x=\"20\" y=\"26\" fill=\"#e8e6e1\" font-size=\"17\" font-weight=\"bold\"\u003eGENUINE TEST — two independent measurements\u003c/text\u003e\u003crect x=\"20\" y=\"42\" width=\"150\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"95\" y=\"64\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003emeasure |t|, α(ω)\u003c/text\u003e\u003ctext x=\"95\" y=\"83\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e(intensity)\u003c/text\u003e\u003crect x=\"20\" y=\"112\" width=\"150\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"95\" y=\"134\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003emeasure φ(ω), n(ω)\u003c/text\u003e\u003ctext x=\"95\" y=\"153\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e(field / fringe)\u003c/text\u003e\u003cline x1=\"170\" y1=\"68\" x2=\"250\" y2=\"90\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"250,90 240,84 240,94\" fill=\"#7ee0a3\"/\u003e\u003cline x1=\"170\" y1=\"138\" x2=\"250\" y2=\"118\" stroke=\"#7ee0a3\" stroke-width=\"2\" stroke-dasharray=\"5,4\"/\u003e\u003cpolygon points=\"250,118 240,114 240,124\" fill=\"#7ee0a3\"/\u003e\u003crect x=\"252\" y=\"78\" width=\"140\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"322\" y=\"100\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eHilbert transform\u003c/text\u003e\u003ctext x=\"322\" y=\"119\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eof the solid input\u003c/text\u003e\u003cline x1=\"392\" y1=\"104\" x2=\"452\" y2=\"104\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"452,104 442,99 442,109\" fill=\"#7aa2ff\"/\u003e\u003crect x=\"454\" y=\"78\" width=\"240\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"574\" y=\"100\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eCOMPARE predicted vs measured\u003c/text\u003e\u003ctext x=\"574\" y=\"119\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eresidual can be nonzero → falsifiable\u003c/text\u003e\u003cline x1=\"20\" y1=\"196\" x2=\"700\" y2=\"196\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3,5\"/\u003e\u003ctext x=\"20\" y=\"230\" fill=\"#e8e6e1\" font-size=\"17\" font-weight=\"bold\"\u003eCIRCULAR TEST — one measurement, phase synthesized\u003c/text\u003e\u003crect x=\"20\" y=\"246\" width=\"150\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"95\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003emeasure R(ω)\u003c/text\u003e\u003ctext x=\"95\" y=\"287\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eon finite window\u003c/text\u003e\u003cline x1=\"170\" y1=\"272\" x2=\"248\" y2=\"272\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"248,272 238,267 238,277\" fill=\"#ff7a90\"/\u003e\u003crect x=\"250\" y=\"240\" width=\"150\" height=\"64\" rx=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"325\" y=\"262\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eKK on ln r + assumed\u003c/text\u003e\u003ctext x=\"325\" y=\"281\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003etails + minimum\u003c/text\u003e\u003ctext x=\"325\" y=\"299\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ephase (no Blaschke)\u003c/text\u003e\u003cline x1=\"400\" y1=\"272\" x2=\"458\" y2=\"272\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"458,272 448,267 448,277\" fill=\"#ff7a90\"/\u003e\u003crect x=\"460\" y=\"246\" width=\"234\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"577\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eσ(ω), ε(ω), then \"check\" f-sum\u003c/text\u003e\u003ctext x=\"577\" y=\"287\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003erule → tests the tail you chose\u003c/text\u003e\u003cpath d=\"M 577 298 C 577 340, 325 348, 325 306\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/\u003e\u003cpolygon points=\"325,306 320,318 330,318\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"451\" y=\"352\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003ethe loop closes on itself\u003c/text\u003e\u003ctext x=\"20\" y=\"386\" fill=\"#e8e6e1\" font-size=\"14\"\u003eSolid arrow = measured datum · Dashed = independent check · Red loop = assumption re-emerging as \"result\"\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The topological difference between a KK test and a KK interpolation. In the upper path two observables enter independently and the residual is free to be nonzero. In the lower path the only external datum is $R(\\omega)$; the tail extrapolation and the minimum-phase assumption enter at the transform and re-emerge downstream as the \"verified\" sum rule.*\n\n### The circumstantial class, and what actually causes each\n\n**A self-consistent KK-inverted reflectivity.** Self-consistency here is an identity, not evidence: the Philipp–Ehrenreich procedure [34] constructs $\\phi(\\omega)$ *so that* $\\ln r$ is an analytic pair. What varies between analyses is the tail, and the retrieved phase at $\\omega_0$ is a weighted average over assumed Hagen–Rubens and $\\omega^{-4}$ regions. *Discriminating test:* re-run the inversion with two defensibly different tail families and publish the spread, or use a KK-constrained variational fit in which the tail is an explicit reported parameter [24]. A phase whose tail-sensitivity band is not quoted is a model output presented as a datum.\n\n**A satisfied f-sum rule.** If $\\sigma_1(\\omega)$ was obtained by KK inversion under an assumed high-frequency tail, then $\\int_0^\\infty \\sigma_1\\,d\\omega = \\pi n e^2/2m$ largely re-tests the tail. The sum rule is a superconvergence statement about asymptotics [21][22]; it becomes independent evidence only when $\\sigma_1$ comes from directly measured absorption over the full weight-bearing range, as in the graphite/graphene optical-conductance work where the plateau $\\sigma = \\pi e^2/2h$ is read off transmission directly [35]. *Discriminating test:* was the integrand ever passed through a Hilbert transform? If yes, the check is circular.\n\n**A Drude-like low-frequency form.** $\\sigma(\\omega) = \\sigma_0/(1-i\\omega\\tau)$ is causal, but so is essentially everything; a Drude fit tests the scattering model, not analyticity. Alternative causes of the same lineshape: an unresolved distribution of relaxation times [16], a Cole–Cole/constant-phase-element response in electrochemical impedance [28][29], grain-boundary or contact impedance in series. *Discriminating test:* the Lin-KK / measurement-model residual test used in impedance spectroscopy — fit a purely RC (hence automatically KK-satisfying) Voigt ladder and inspect whether residuals are structured; structured residuals indicate nonstationarity during the sweep, not a causality violation [28][29].\n\n**Apparent superluminal group velocity in an absorption band.** $v_g = c/(n + \\omega\\,dn/d\\omega) \u003e c$ or negative inside anomalous dispersion is *required* by KK, not in tension with it — the same analyticity that forbids a signal before the front produces the pulse-peak advance. The peak is not a signal. *Discriminating test:* the only front-velocity observable that is not model-laundered is the Sommerfeld–Brillouin precursor structure [2] — the leading, chirped, weakly-damped forerunner arriving at exactly $t = L/c$, ahead of the main signal, in a medium where $n\u003c1$ over a band. Detecting the forerunner at $L/c$ measures the front velocity; measuring a pulse envelope's centroid measures reshaping.\n\n**A negative-$\\varepsilon$ or negative-$\\mu$ retrieval \"violating KK\".** Almost always the retrieved quantity was never a local susceptibility — S-parameter inversion of a slab returns fit parameters, and with spatial dispersion the causal object is $\\varepsilon(\\omega,k)$ [26][36]. *Discriminating test:* vary the slab thickness. A genuine local response is thickness-independent; a violation that scales with the number of unit cells is a retrieval artifact.\n\nThe general rule: an indirect signature earns evidential weight only in proportion to the number of *independent* inputs it consumes. One measured spectrum plus one Hilbert transform is one input, however elaborate the downstream processing."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: The Phase That Is a Model Output Quoted as a Datum", "markdown": "## Use \u0026 Abuse: The Phase That Is a Model Output Quoted as a Datum\n\nThe pathologies below are not exotic. Each is a standard, publishable procedure whose stated hypotheses were discharged decades ago and are now carried silently.\n\n### Pattern 1: reflectance inversion with invented tails\n\nThe Philipp–Ehrenreich workflow [34] measures normal-incidence $R(\\omega)=|r|^2$ over a finite window and recovers the phase from\n\n$$\\theta(\\omega_0)=-\\frac{2\\omega_0}{\\pi}\\,\\mathrm{P}\\!\\!\\int_0^\\infty \\frac{\\ln|r(\\omega)|-\\ln|r(\\omega_0)|}{\\omega^2-\\omega_0^2}\\,d\\omega,$$\n\nthen builds $\\varepsilon(\\omega)$ from $(|r|,\\theta)$. Two hypotheses enter here that causality does not supply. First, this integral is the *log-modulus/phase* pair, not the $\\chi'/\\chi''$ pair; it requires $r(\\omega)$ to be minimum-phase — no zeros of $r$ in the upper half plane. Toll showed the retrieved phase is unique only up to a Blaschke factor $B(\\omega)=\\prod_j(\\omega-\\omega_j)/(\\omega-\\omega_j^*)$ with $|B|=1$ on the real axis [10]; Bode had stated the same precondition for networks in 1945 [8]. Zeros of $r$ are not pathological — $r$ vanishes wherever the sample is impedance-matched to vacuum, and near a Berreman-type or interference condition a thin film on a substrate is routinely non-minimum-phase. The physics-facing statement of this, that a zero in the upper half plane is exactly what breaks the modulus→phase map while leaving causality intact, is [Bechhoefer's *Kramers–Kronig, Bode, and the meaning of zero*](https://www.sfu.ca/chaos/assets/papers/2011/KK-Bode-MeaningZero.pdf) (Am. J. Phys. 2011) (verify page range).\n\nSecond, the integral runs over $(0,\\infty)$; the data span perhaps two decades. The tails are supplied by a Hagen–Rubens form $1-R\\propto\\sqrt{\\omega}$ or a Drude continuation below, and a power law $R\\propto\\omega^{-s}$ ($s\\approx 4$ for free-carrier-free insulators) or Henke-table atomic scattering factors [23] above. Because the kernel $(\\omega^2-\\omega_0^2)^{-1}$ decays only as $\\omega^{-2}$, the tail contribution to $\\theta(\\omega_0)$ is not small — it is the dominant systematic near the window edges, and it propagates directly into the quoted $\\sigma_1(\\omega)$ and into any spectral-weight integral $\\int_0^{\\Omega}\\sigma_1\\,d\\omega$ built from it. A published $\\sigma_1(\\omega)$ with no stated extrapolation and no error band is not a measurement of the optical conductivity; it is one point in a family parameterized by unreported choices.\n\n### Pattern 2: one-variable KK on transient and pump–probe spectra\n\nApplying $\\Delta n(\\omega)=\\frac{c}{\\pi}\\mathrm{P}\\int \\Delta\\alpha(\\omega')/(\\omega'^2-\\omega^2)\\,d\\omega'$ to a transient-absorption trace at fixed delay $\\tau$ treats a system that is manifestly *not* time-invariant as LTI. Time-translation invariance is a hypothesis of Titchmarsh's theorem, not a technicality: a pumped medium has a two-time response $\\chi(t,t')\\ne\\chi(t-t')$, and the Fourier variable conjugate to $t-t'$ is not the same object as the probe frequency in a finite-delay experiment. The defensible statement is the non-degenerate one [25]: with the pump *held fixed and stationary*, the probe response is linear and causal in the probe field, so $\\Delta n(\\omega;\\omega_p)$ and $\\Delta\\alpha(\\omega;\\omega_p)$ are a KK pair in the probe variable $\\omega$ alone. The fully degenerate $\\chi^{(3)}(\\omega;\\omega,\\omega,-\\omega)$ is not. Attosecond transient absorption, where the probe bandwidth exceeds the pump-induced dynamical timescale, sits squarely outside the hypothesis — the field has begun to treat this explicitly ([Optica **10**, 142, 2023](https://opg.optica.org/abstract.cfm?uri=optica-10-2-142)) (verify), but the routine practice of KK-transforming a $\\Delta A(\\lambda,\\tau)$ map delay-by-delay remains uncorrected.\n\n### Pattern 3: \"KK violations\" that are category errors\n\nEffective $\\varepsilon_{\\rm eff}(\\omega),\\mu_{\\rm eff}(\\omega)$ from Nicolson–Ross–Weir/S-parameter inversion of a metamaterial slab are fit parameters of a *boundary-value problem*, not local response functions [36]. The much-reported antiresonance — $\\mathrm{Im}\\,\\mu_{\\rm eff}\u003c0$ over a band adjacent to a resonance — is not a causality violation; it is the signature of spatial dispersion, the physical response being $\\varepsilon(\\omega,k)$, analytic in $\\omega$ at fixed $k$ and not as a function of $\\omega$ at fixed geometry. Homogenization schemes built on point-dipole Maxwell-Garnett approximations manufacture non-causal $\\varepsilon_{\\rm eff}$ as an artifact of the truncation, and retrieval methods that restore weak spatial dispersion recover KK compliance in exactly the bands where the naive method fails ([Alù et al. arXiv:1303.5807](https://arxiv.org/pdf/1303.5807)). The same applies to modal indices of guided and surface waves. When a \"KK violation\" is announced, the first question is whether the retrieved quantity was ever a susceptibility.\n\n### Pattern 4: passivity billed as causality\n\n$\\mathrm{Im}\\,\\chi(\\omega)\u003e0$ for $\\omega\u003e0$ is a thermodynamic statement, not a consequence of KK. KK is sign-blind; a gain medium with $\\mathrm{Im}\\,\\chi\u003c0$ satisfies it exactly. Passivity *plus* KK gives the Herglotz structure from which the $f$-sum rule and $\\langle n\\rangle=1$ follow. Papers deriving those from \"causality\" have quietly dropped a hypothesis — and via fluctuation–dissipation [22], the positivity is really the KMS/detailed-balance input, i.e. equilibrium, which a driven sample does not have.\n\n### Pattern 5: the four-way conflation\n\nThe Hilbert pair (Plemelj) is mathematics. The KK relation is that pair applied to a causal LTI susceptibility. A \"dispersion relation\" in the S-matrix sense [12][14][15] carries bound-state poles, crossing, unitarity and stated subtractions — strictly stronger. Sum rules are superconvergence statements about the *asymptotics*, each encoding a specific tail. A sum-rule \"check\" on data that were KK-inverted using an assumed tail is circular arithmetic, not validation.\n\n### Tells of a hollow claim\n\n| Tell | What it means |\n|---|---|\n| No extrapolation model stated | The reported phase is one member of an unreported family |\n| No tail-sensitivity band on $\\sigma_1$ or spectral weight | The dominant systematic was never estimated |\n| \"Minimum phase\" absent where $\\ln r$ was transformed | Blaschke ambiguity unexamined [10][8] |\n| Nussenzveig [21] cited but subtractions unmentioned | Cited as authority, not read |\n| KK applied per-delay to $\\Delta A(\\lambda,\\tau)$ | Time-invariance assumed away |\n| $f$-sum rule quoted as a check on KK-inverted data | Circular |\n\n### The honest alternative\n\nParameterize $\\varepsilon_2$ on an anchor mesh (or as oscillators), couple $\\varepsilon_1$ to it *by construction* through the KK transform, and fit all measured channels simultaneously — this is Kuzmenko's variational analysis [24], and its virtue is that the extrapolation becomes an explicit, reportable, error-barred parameter rather than a step in a pipeline. Better still, close the loop with a second independent observable: ellipsometry delivers $(\\psi,\\Delta)$ directly [31], and combining it with reflectance over a common window converts KK from an inversion into a falsifiable consistency test. Electrochemistry has institutionalized precisely this — the linear-KK/measurement-model residual test ([Boukamp 1995](https://ris.utwente.nl/ws/files/6513880/J.%20Electrochem.%20Soc.-1995-Boukamp-1885-94.pdf); [29][28]) treats KK compliance as a hypothesis about the data, with structured residuals flagging drift and nonstationarity. Optics, which invented the method, mostly does not. And the one community that takes minimum-phase seriously is telecom: the KK coherent receiver [32] *engineers* the condition with a carrier tone, with a CSPR threshold (~6 dB) below which reconstruction demonstrably fails ([JLT **38**, 6214, 2020](https://opg.optica.org/jlt/abstract.cfm?uri=jlt-38-22-6214)). A hypothesis you must pay dB to satisfy is not one a condensed-matter paper gets for free."}, {"id": "status-and-believers-checklist", "title": "Status: Mutated, Load-Bearing, and Rarely Audited — The Believer's Checklist", "markdown": "## Status: Mutated, Load-Bearing, and Rarely Audited — The Believer's Checklist\n\nThe subject is in an unusual condition: its mathematics is finished, its physics claim has drifted, and its most important theorem is the one nobody cites. These three layers must be assessed separately, because they fail — and don't fail — in completely different ways.\n\n### Settled, and not worth re-litigating\n\nThe analytic core is closed. Titchmarsh's theorem, as presented in Nussenzveig's monograph [21], is a biconditional on $L^2(\\mathbb{R})$: square-integrability plus vanishing of the inverse transform for $t\u003c0$ is *equivalent* to the Hilbert-pair structure and to the existence of a holomorphic extension into the upper half plane with uniformly bounded $L^2$ norm on horizontal lines. Nothing has been added to that statement in fifty years, and nothing needs to be. The Plemelj–Sokhotski decomposition, the once- and twice-subtracted forms, the superconvergence theorems that yield the $f$-sum rule and $\\langle n\\rangle = 1$ — all of it is textbook and correct. Kubo's placement of the pair inside linear response [22], with $\\chi''$ fixed by equilibrium fluctuations and $\\chi'$ by the transform, is likewise secure.\n\nThe engineering practice is also, in one corner, exemplary. The Kramers–Kronig coherent receiver [32] is the only widely deployed application in which the minimum-phase hypothesis is *manufactured rather than assumed*: a CW carrier is added with enough power that the received field's analytic signal is provably zero-free in the upper half plane, and the required carrier-to-signal power ratio (conventionally $\\gtrsim 6$ dB, with a substantial literature since on pushing it lower) is a specified, measurable operating condition. That is what discharging A-hypotheses looks like. It is instructive that the field which took Bode's 1945 caveat [8] seriously is the one descended from Bode's own institution.\n\n### Regime-limited, and usually presented as if it weren't\n\nEverything downstream of a *finite* measurement window is regime-limited. The Philipp–Ehrenreich reflectance-inversion pipeline [34] and its descendants — including the Henke–Gullikson–Davis atomic scattering-factor tables [23], where $f_1$ is obtained from measured $f_2$ by a dispersion integral over an assembled, partly theoretical absorption spectrum, and which now underpin essentially all X-ray optics design — are correct *given* their tails. Those tails are model choices. Kuzmenko's variational analysis [24] remains the right response: parameterize $\\varepsilon_2$ on an anchor mesh, couple $\\varepsilon_1$ by an exact KK transform, and let the extrapolation appear as a reported, fitted object rather than a footnote. It is cited far more often than it is used.\n\nRegime-limited too: the nonlinear case, where only the *non-degenerate* pair $\\Delta n(\\omega;\\omega_p)$, $\\Delta\\alpha(\\omega;\\omega_p)$ at fixed pump satisfies a KK relation in the probe variable [25]; effective-medium retrievals of $\\varepsilon,\\mu$ for structured media, where the KK-analytic object is $\\varepsilon(\\omega,k)$ and the retrieved slab parameters are not local susceptibilities [26]; and the entire space-domain phase-retrieval family now proliferating in microscopy [33], where the Hilbert pair is in a *spatial* frequency variable and \"causality\" is a support condition on the pupil, not a statement about time ordering. That transplant is mathematically legitimate and physically a different theorem wearing the same name.\n\n### Folklore\n\nThree claims circulate with no support and should be treated as false on sight. (i) *\"Causality alone determines the complex response\"* — the model-independent theorem is a 1945–1956 product [8][9][10], and Bohren's reconstruction [1] shows the 1926–27 papers do not contain it. (ii) *\"KK inversion measures the phase.\"* It computes a phase, conditional on a minimum-phase assumption that causality does not supply — Toll's Blaschke ambiguity [10] means $|r(\\omega)|$ is compatible with a one-parameter family of phases, and this remains the most-ignored central result in the subject. (iii) *\"KK-compliance validates data.\"* In impedance spectroscopy the [linear KK / Lin-KK test](https://iopscience.iop.org/article/10.1149/1.2044210) fits a fixed RC-relaxation basis and inspects residuals; it detects drift and nonlinearity, which is genuinely useful [28][29], but a passing test certifies LTI consistency, not correctness of the physical model — and DRT inversions built on the same data inherit that gap [37][38].\n\n### The Believer's Checklist\n\nAETHER accepts a KK-derived number only when the paper states, in the text and not the supplement:\n\n1. **Which relation.** Unsubtracted $\\chi$, once-subtracted $\\varepsilon$ with $\\varepsilon_\\infty$, or log-modulus/phase for $r(\\omega)$ — these are inequivalent, and only the third needs minimum phase.\n2. **The measurement window**, in the same units as the integral, with the fraction of the principal-value integrand's weight at $\\omega_0$ that lies *outside* it.\n3. **The tail model, explicitly**, plus a sensitivity band: repeat the inversion with at least two defensible extrapolations and quote the spread as a systematic error on every derived quantity.\n4. **A minimum-phase argument or a Blaschke disclaimer.** Either demonstrate zero-freeness in the upper half plane (as the KK receiver does by construction [32]), or state that the retrieved phase is one member of a family.\n5. **Subtraction constants declared** as fitted parameters with uncertainties — $\\varepsilon_\\infty$ is an assumption, not a consequence of causality.\n6. **LTI, stationarity, and locality justified for the actual system**: fluence-independence demonstrated for pump–probe; $k$-independence argued for anything structured or spatially dispersive.\n7. **No circular sum rules.** An $f$-sum check on spectra that were themselves KK-inverted with an assumed tail tests the tail against itself. Sum rules count as validation only against an independently measured quantity.\n8. **One out-of-sample prediction.** A KK-derived $\\varepsilon(\\omega)$ must reproduce something it was not fitted to — ellipsometric $\\Psi,\\Delta$ at another angle [31], transmission through a different thickness, a second sample geometry. Absent that, the phase is a model output, and should be labelled one.\n\nSources: [Boukamp, J. Electrochem. Soc. 142, 1885 (1995)](https://iopscience.iop.org/article/10.1149/1.2044210) · [Kuzmenko, cond-mat/0503565](https://arxiv.org/abs/cond-mat/0503565) · [Minimum phase conditions in KK optical receivers](https://www.researchgate.net/publication/342909235_Minimum_Phase_Conditions_in_Kramers-Kronig_Optical_Receivers) · [Handheld KK phase-imaging smartscope, Laser Photonics Rev. (2026)](https://onlinelibrary.wiley.com/doi/10.1002/lpor.71115)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier taking apart a phrase. Let me say plainly what I think survives.\n\n### (a) What I would defend with my reputation\n\nThe mathematics. Titchmarsh's theorem is a theorem: for $\\chi \\in L^2(\\mathbb{R})$, the three statements — vanishing of $\\chi(t)$ for $t\u003c0$, holomorphic extension into the upper half plane with uniformly bounded $L^2$ norm on horizontal lines, and the Hilbert-transform pair\n\n$$\\operatorname{Re}\\chi(\\omega) = \\frac{1}{\\pi}\\,\\mathrm{P}\\!\\!\\int_{-\\infty}^{\\infty}\\frac{\\operatorname{Im}\\chi(\\omega')}{\\omega'-\\omega}\\,d\\omega'$$\n\n— are mutually equivalent, no physics attached. Nothing in the last century has dented that, and the Plemelj–Sokhotski decomposition underneath it is older than the physics it serves. I will also defend, without qualification, the historical claim: the model-independent theorem is Toll's [9][10], not Kramers' and not Kronig's. Kronig 1926 [5] has one relation inside a gas model; Kramers 1927 [6] has the pair, partly conjecturally, with a Sommerfeld–Brillouin signal-front condition [2] doing real work. Bohren went and read the papers [1]; anyone who disputes the reconstruction should do the same before disputing it. And I will defend the practical claim that KK-*constrained* fitting — where the tail is an explicit, reported model parameter [24] — is strictly better epistemics than KK *inversion* with a silent extrapolation. That is not a stylistic preference. It is the difference between a datum and a posterior.\n\n### (b) What is shakier than the literature admits\n\nFour assumptions, named.\n\n**Square-integrability.** Every citation of \"causality ⟹ KK\" is invoking Titchmarsh, whose hypothesis is $L^2$. Drude conductivity is not $L^2$; $\\varepsilon_\\infty \\neq 0$ is not $L^2$. The fix — subtraction — introduces a constant that is *assumed*, not derived. Papers that write \"by causality\" above a once-subtracted relation have imported an unstated physical input.\n\n**Minimum phase.** The reflectivity-phase industry rests on the absence of zeros of $r(\\omega)$ in the upper half plane. Causality does not supply this; a Blaschke factor leaves $|r|$ untouched and moves the phase [8][10]. I have never seen this hypothesis *tested* in an experimental paper. Not argued away — tested.\n\n**Time invariance.** Transient-absorption and pump–probe spectra are routinely one-variable KK-transformed. The system is not LTI during the probe window. The correct statement is the non-degenerate one, pump fixed, probe swept [25]. This is the single most common quiet error in modern optics.\n\n**Locality.** S-parameter-retrieved $\\varepsilon(\\omega),\\mu(\\omega)$ for a metamaterial slab are fit parameters, not local susceptibilities; the physical object is $\\varepsilon(\\omega,k)$. \"KK violation\" here is almost always a diagnosis of the retrieval, not of causality.\n\n### (c) The three I would work on, ranked\n\n1. **A quantitative Blaschke bound from data.** Given measured $|r(\\omega)|$ on a finite window plus one independent phase measurement (THz-TDS, ellipsometry) at a few frequencies, how tightly can one bound the admissible Blaschke content? This converts an untested hypothesis into a reported interval, and it is tractable now.\n2. **KK-analytic structure at fixed $k$ for spatially dispersive media.** The clean object exists; the extraction protocol does not. Without it, every metamaterial \"causality check\" is uninterpretable.\n3. **Falsifiable causality tests in non-equilibrium matter.** Floquet and driven systems break time invariance by construction; what replaces KK — a two-time or Floquet-sideband relation with a genuinely falsifiable outcome — is open, and the field is currently publishing LTI-processed numbers into it.\n\n### Reading path\n\n1. **Bohren (2010) [1]** — read the credit audit before the theorem; it inoculates you against the textbook sentence.\n2. **Kronig (1926) [5]** and **Kramers (1927) [6]** — see the atomic model and the front condition with your own eyes; twenty minutes, permanently clarifying.\n3. **Bode (1945) [8]** — the minimum-phase condition stated correctly, by an engineer, before physicists needed it.\n4. **Toll (1956) [10]** — the actual theorem, plus the Blaschke counterexample, in the paper whose name is not on the relations.\n5. **Kuzmenko (2005) [24]** — how to make the tail an honest parameter rather than an invisible one; the only item here you will use next week."}], "references": [{"n": 1, "title": "What did Kramers and Kronig do and how did they do it?", "authors": ["Craig F. Bohren"], "year": 2010, "venue": "European Journal of Physics 31, 573–577", "url": "https://iopscience.iop.org/article/10.1088/0143-0807/31/3/014", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Über die Fortpflanzung des Lichtes in dispergierenden Medien", "authors": ["A. Sommerfeld"], "year": 1914, "venue": "Annalen der Physik (Leipzig) 44, 177–202 (companion paper by L. Brillouin, ibid. 203–240)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Absorption, Zerstreuung und Dispersion in der Bohrschen Atomtheorie", "authors": ["R. Ladenburg", "F. Reiche"], "year": 1923, "venue": "Die Naturwissenschaften 11, 584–598", "url": "https://link.springer.com/article/10.1007/BF01554355", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "The Law of Dispersion and Bohr's Theory of Spectra", "authors": ["H. A. Kramers"], "year": 1924, "venue": "Nature 113, 673–674", "url": "https://www.nature.com/articles/113673a0", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "On the Theory of Dispersion of X-Rays", "authors": ["R. de L. Kronig"], "year": 1926, "venue": "Journal of the Optical Society of America 12, 547–557", "url": "https://opg.optica.org/josa/abstract.cfm?uri=josa-12-6-547", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "La diffusion de la lumière par les atomes", "authors": ["H. A. Kramers"], "year": 1927, "venue": "Atti del Congresso Internazionale dei Fisici (Como–Pavia–Roma), Vol. 2, 545–557; Zanichelli, Bologna", "url": "https://www.lorentz.leidenuniv.nl/IL-publications/Kramers.html", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Zur Theorie der Absorption und Dispersion in den Röntgenspektren", "authors": ["R. de L. Kronig", "H. A. Kramers"], "year": 1928, "venue": "Zeitschrift für Physik 48, 174–179", "url": "https://link.springer.com/article/10.1007/BF01351301", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Network Analysis and Feedback Amplifier Design", "authors": ["Hendrik W. Bode"], "year": 1945, "venue": "D. Van Nostrand, New York (Ch. XIV: relations between real and imaginary parts of network functions)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "The Dispersion Relation for Light and its Application to Problems Involving Electron Pairs", "authors": ["John S. Toll"], "year": 1952, "venue": "PhD thesis, Princeton University (adviser: John A. Wheeler)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Causality and the Dispersion Relation: Logical Foundations", "authors": ["John S. Toll"], "year": 1956, "venue": "Physical Review 104, 1760", "url": "https://link.aps.org/doi/10.1103/PhysRev.104.1760", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "S-Matrix and Causality Condition. I. Maxwell Field", "authors": ["N. G. van Kampen"], "year": 1953, "venue": "Physical Review 89, 1072", "url": "https://link.aps.org/doi/10.1103/PhysRev.89.1072", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Use of Causality Conditions in Quantum Theory", "authors": ["M. Gell-Mann", "M. L. Goldberger", "W. E. Thirring"], "year": 1954, "venue": "Physical Review 95, 1612–1627", "url": "https://link.aps.org/doi/10.1103/PhysRev.95.1612", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Use of Causality Conditions in Quantum Theory", "authors": ["M. L. Goldberger"], "year": 1955, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.97.508", "cited_by": 71, "bucket": "earliest"}, {"n": 14, "title": "Causality Conditions and Dispersion Relations. I. Boson Fields", "authors": ["M. L. Goldberger"], "year": 1955, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.99.979", "cited_by": 151, "bucket": "earliest"}, {"n": 15, "title": "Application of Dispersion Relations to Pion-Nucleon Scattering", "authors": ["M. L. Goldberger", "H. Miyazawa", "Reinhard Oehme"], "year": 1955, "venue": "Physical Review", "url": "https://doi.org/10.1103/physrev.99.986", "cited_by": 210, "bucket": "earliest"}, {"n": 16, "title": "Dielectric Dispersion in Materials Having a Distribution of Relaxation Times", "authors": ["J. Ross Macdonald"], "year": 1952, "venue": "The Journal of Chemical Physics", "url": "https://doi.org/10.1063/1.1700675", "cited_by": 28, "bucket": "earliest"}, {"n": 17, "title": "Generalized immittance kernels and the Kronig-Kramers relations", "authors": ["Malcolm K. Brachman", "J. Ross Macdonald"], "year": 1956, "venue": "Physica", "url": "https://doi.org/10.1016/s0031-8914(56)80018-9", "cited_by": 6, "bucket": "earliest"}, {"n": 18, "title": "Dispersion Relations for Tensor Media and Their Application to Ferrites", "authors": ["Barry S. Gourary"], "year": 1957, "venue": "Journal of Applied Physics", "url": "https://doi.org/10.1063/1.1722731", "cited_by": 18, "bucket": "earliest"}, {"n": 19, "title": "Relaxation-time distribution functions and the kramers-kronig relations", "authors": ["Malcolm K. Brachman", "J. Ross Macdonald"], "year": 1954, "venue": "Physica", "url": "https://doi.org/10.1016/s0031-8914(54)80271-0", "cited_by": 13, "bucket": "earliest"}, {"n": 20, "title": "Note on the Kramers-Kronig Relations", "authors": ["Malcolm K. Brachman"], "year": 1955, "venue": "Journal of Applied Physics", "url": "https://doi.org/10.1063/1.1722029", "cited_by": 4, "bucket": "earliest"}, {"n": 21, "title": "Causality and Dispersion Relations", "authors": ["H. M. Nussenzveig"], "year": 1972, "venue": "Academic Press, New York (Mathematics in Science and Engineering, Vol. 95)", "url": "https://archive.org/details/causalitydispers0095nuss", "cited_by": null, "bucket": "archive"}, {"n": 22, "title": "The fluctuation-dissipation theorem", "authors": ["Ryogo Kubo"], "year": 1966, "venue": "Reports on Progress in Physics", "url": "https://doi.org/10.1088/0034-4885/29/1/306", "cited_by": 5082, "bucket": "canon"}, {"n": 23, "title": "X-Ray Interactions: Photoabsorption, Scattering, Transmission, and Reflection at E = 50-30,000 eV, Z = 1-92", "authors": ["B. L. Henke", "Eric M. Gullikson", "J.C. Davis"], "year": 1993, "venue": "Atomic Data and Nuclear Data Tables", "url": "https://doi.org/10.1006/adnd.1993.1013", "cited_by": 6209, "bucket": "canon"}, {"n": 24, "title": "Kramers–Kronig constrained variational analysis of optical spectra", "authors": ["A. B. Kuzmenko"], "year": 2005, "venue": "Review of Scientific Instruments 76, 083108", "url": "https://arxiv.org/abs/cond-mat/0503565", "cited_by r wet and dry cathode feeding on aged anion exchange membrane water electrolyzer: Electrochemical insights from impedance and distribution of relaxation time", "authors": ["Pouya Beigzadeh Arough", "Ataollah Niyati", "Ombretta Paladino"], "year": 2026, "venue": "Journal of Power Sources", "url": "https://doi.org/10.1016/j.jpowsour.2026.241108", "cited_by": 0, "bucket": "recent"}, {"n": 39, "title": "The Turning Point", "authors": ["R. de L. Kronig"], "year": 1960, "venue": "in M. Fierz and V. F. Weisskopf (eds.), Theoretical Physics in the Twentieth Century: A Memorial Volume to Wolfgang Paul", "url": "https://archive.org/details/in.ernet.dli.2015.176929", "cited_by": null, "bucket": "archive"}], "nsec": 7, "nref": 39, "teaser": "How a model-dependent X-ray calculation and a French-language conference talk became the canonical statement that causality alone determines the complex response — and what the retrieved phase actually is."}</script>
