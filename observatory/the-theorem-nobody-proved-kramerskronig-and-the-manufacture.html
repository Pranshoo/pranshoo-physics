<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Theorem Nobody Proved: Kramers–Kronig and the Manufacture of a Causal Certainty", "alternativeHeadline": "Kramers-Kronig relations", "name": "Kramers-Kronig relations", "description": "How a model-dependent X-ray calculation and a French-language conference talk became the canonical statement that causality alone determines the complex response — and what the retrieved phase actually is.", "inLanguage": "en", "keywords": ["Kramers-Kronig relations", "Kronig–Kramers relations", "KK relations", "Kramers–Kronig dispersion relations", "dispersion relations (optics/particle physics usage)", "Hilbert-transform pair for a causal response function", "Bode gain–phase relations (electrical-engineering lineage)", "Plemelj/Sokhotski relations (mathematical substrate)", "reflectivity KK inversion / KK phase retrieval (spectroscopic usage)", "optics / condensed matter / many-body response theory"], "about": [{"@type": "Thing", "name": "Kramers-Kronig relations"}, {"@type": "Thing", "name": "Kronig–Kramers relations"}, {"@type": "Thing", "name": "KK relations"}, {"@type": "Thing", "name": "Kramers–Kronig dispersion relations"}, {"@type": "Thing", "name": "dispersion relations (optics/particle physics usage)"}, {"@type": "Thing", "name": "Hilbert-transform pair for a causal response function"}, {"@type": "Thing", "name": "Bode gain–phase relations (electrical-engineering lineage)"}, {"@type": "Thing", "name": "Plemelj/Sokhotski relations (mathematical substrate)"}], "articleSection": "optics / condensed matter / many-body response theory", "datePublished": "2026-08-10", "dateModified": "2026-08-10", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-theorem-nobody-proved-kramerskronig-and-the-manufacture.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-theorem-nobody-proved-kramerskronig-and-the-manufacture.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Prehistory, 1914–1956: Who Actually Proved What Prehistory, 1914–1956: Who Actually Proved What The sentence that opens most treatments — Kramers and Kronig showed in 1926–27 that causality alone forces the real and imaginary parts of any linear response function to be Hilbert transforms of one another — is wrong in three separable ways. Neither man worked from causality alone; Kronig obtained only one member of the pair; and the model-independent theorem is a product of 1945–1956. Bohren's reconstruction establishes the first two from the papers themselves; the third is visible in the citation record. The premise nobody credits: 1914 The physical input both 1926–27 derivations use is not \"causality\" in the abstract but the signal-front condition: in a dispersive medium the leading edge of a truncated wave train propagates at exactly c, regardless of how large or small n(\\omega) is in the body of the pulse. Sommerfeld proved it, Brillouin worked out the precursors, and the two papers appeared back to back in Annalen der Physik 44 in 1914 . This is what converted \"no effect before its cause\" from a slogan into a boundary condition on n(\\omega) that a contour integral can exploit. Their names survive attached to precursors , not to linear response. Dispersion synthesized from absorption: 1923–1924 The claim that the dispersive part of the response is computable from the absorptive part is older than KK and was quantitative before it was general. Ladenburg and Reiche's Ersatzoszillator scheme replaced the classical dispersion electrons with fictitious oscillators whose strengths are fixed by Einstein transition probabilities, so that n(\\omega) is assembled term by term out of spectroscopic absorption data. Reiche also stands behind the Thomas–Reiche–Kuhn sum rule, i.e. the asymptotic condition \\chi(\\omega)\\to -\\omega p^2/\\omega^2 that later makes the unsubtracted relation converge at all. Kramers' 1924 Nature letter generalized Ladenburg's formula to include negative terms for transitions downward, the immediate ancestor of Kramers–Heisenberg. This is the substantive prehistory that KK reviews omit. What Kronig and Kramers each actually did Kronig's 1926 JOSA paper treats X-rays scattered by an atomic gas. Using the finite-front condition, he obtains the refractive index as a principal-value integral over the atomic absorption coefficient — schematically one relation, inside a model. He did not derive the converse. Kramers, at the Volta centenary congress at Como in September 1927, stated both directions in a French-language proceedings contribution — dispersion from absorption and absorption from dispersion — and, as Bohren documents , explicitly speculated that his model results might hold more generally rather than proving it. The 1928 joint paper in Zeitschrift für Physik welded the two names together while both relations still rested on the atomic-gas calculation. Then the record drifts. In 1936, Gorter and Kronig ( Physica 3 , 1009) cite Kronig's 1926 paper as the source of relations it does not contain and attribute the other to Kramers as though it had been derived rather than conjectured . Kronig, in other words, is a primary source for the misattribution of his own priority. Where the theorem was actually proved: 1945–1956 Bode, 1945 . In feedback-amplifier design, \\log H and \\arg H are a Hilbert pair — provided the network is minimum-phase , with no poles or zeros in the right half plane. Bode stated the caveat at the outset. Optics spent decades rediscovering it as \"the phase-retrieval problem.\" Toll, 1952/1956 . Toll's Princeton thesis under Wheeler, and its published distillation, prove the equivalence : strict causality \\Leftrightarrow the dispersion relation. The theorem being invoked is Titchmarsh's — for \\chi\\in L^{2}(\\mathbb{R}), vanishing of \\chi(t\u003c0), holomorphy of \\chi(\\omega) in \\mathrm{Im}\\,\\omega 0, and are mutually equivalent. Toll also proved, in the same breath, that the modulus fixes the phase only up to an all-pass Blaschke factor. The statement every textbook credits to 1926 belongs here. Van Kampen, 1953 . First rigorous causality \\to analyticity theorem for scattering: singularities of the S-matrix confined to the lower half plane, asymptotics specified — a year before the paper universally credited with launching dispersion theory. Gell-Mann, Goldberger and Thirring, 1954 . Microcausality — vanishing commutators at spacelike separation — as the field-theoretic premise, exported as forward dispersion relations . How the hyphen was fixed The S-matrix program needed a respectable ancestor, and canonized one. Goldberger's 1955 papers remove perturbation theory from the derivation and, with Miyazawa and Oehme, apply \"the generalized Kramers–Kronig dispersion relations\" to pion–nucleon scattering . Through the early 1950s usage was genuinely unsettled: the dielectrics and network-theory literature writes Kronig–Kramers — Macdonald's 1952 relaxation-time paper, Brachman and Macdonald's 1956 immittance-kernel paper, Gourary's tensor generalization — while the same authors elsewhere write the other order . What broke the tie was not chronology (which favors Kronig) but the citation volume of the particle-physics papers, and Nussenzveig's 1972 monograph then codified the mature mathematics under the fixed name. The deepest credit failure is not between the two eponyms at all: Ladenburg and Reiche made \"dispersion is determined by absorption\" quantitative, and Toll proved the theorem — neither appears in the hyphenation. The Physics, Properly: Titchmarsh, Plemelj, and Eight Numbered Hypotheses The Physics, Properly: Titchmarsh, Plemelj, and Eight Numbered Hypotheses Everything in the previous section was about who wrote what. This section is about what is actually true, and under exactly which hypotheses. The theorem is not \"causality ⇒ Hilbert pair.\" The theorem is a chain, and each link is a separate assumption that experiments break in different ways. The constitutive setup: A1–A4 Write the response of a medium to a field E as P(t)=\\int dt'\\,\\chi(t,t')E(t'). Getting to the object KK talks about already costs four assumptions: - A1 (Linearity). P is linear in E; superposition holds. Without it there is no single \\chi(\\omega) to relate. - A2 (Time-invariance / stationarity). \\chi(t,t')=\\chi(t-t'), so the kernel Fourier-transforms in one variable. A pumped, transient, or aging system violates this outright — the reason a one-variable KK transform applied to a transient-absorption spectrum is not an approximation but a category error. - A3 (Locality). P(\\mathbf r,t) depends on E at the same \\mathbf r. With spatial dispersion the honest object is \\chi(\\omega,\\mathbf k), analytic in \\omega at fixed \\mathbf k; nothing guarantees analyticity in \\omega alone along a dispersion branch k(\\omega). - A4 (Strict retardation). \\chi(\\tau)=0 for \\tau\u003c0 — the primitive causality of Sommerfeld and Brillouin's signal front , not a vague \"effects follow causes.\" Titchmarsh: what A4 actually buys Define \\chi(\\omega)=\\int 0^\\infty d\\tau\\,\\chi(\\tau)e^{i\\omega\\tau}. For \\omega=\\omega'+i\\omega'' with \\omega'' 0 the kernel e^{i\\omega\\tau}=e^{i\\omega'\\tau}e^{-\\omega''\\tau} is exponentially damped on the support of \\chi, so the integral converges and defines a function holomorphic in the open upper half plane (UHP), continuous up to the real axis, and bounded there. That is the whole content of causality. Titchmarsh's theorem supplies the converse and the sharp hypothesis: - A5 (Square-integrability / specified falloff). \\chi(\\omega')\\in L^2(\\mathbb R). Then the three statements — \\chi(\\tau) vanishes for \\tau\u003c0; \\chi is the boundary value of a function holomorphic in the UHP with \\sup {\\omega'' 0}\\int \\chi ^2 d\\omega'\u003c\\infty (a Hardy-class H^2 function); and the Hilbert-transform pair holds — are equivalent . Not \"implied by causality\": equivalent, given A5. Nussenzveig states the hypotheses in precisely this form , and this is the theorem essentially everyone cites Kramers and Kronig for. The pair itself is Sokhotski–Plemelj, not contour cleverness. For \\chi\\in H^2, \\oint \\chi(z)/(z-\\omega)\\,dz=0 over the closed UHP contour; indenting around z=\\omega and using gives \\chi(\\omega)=\\frac{1}{i\\pi}\\mathrm{P}\\!\\int \\frac{\\chi(\\omega')}{\\omega'-\\omega}d\\omega', whose real and imaginary parts are the relations. The \\delta-function is the theorem; the principal value is what's left over. Figure: The contour argument with each hypothesis attached to the geometry it protects. A4 empties the UHP of singularities; A5 kills the arc; A6 keeps the real axis clean except at the Plemelj point \\omega. A zero of r(\\omega) in the UHP (orange circle) leaves the contour argument for \\chi untouched but destroys uniqueness of the retrieved phase. Where the contour argument leaks: A6–A8 - A6 (No poles on the real axis). A Drude metal has \\sigma(\\omega)\\simeq i n e^2/(m\\omega) as \\omega\\to0. The standard fix — deform above the pole and add the explicit \\delta(\\omega) / 1/\\omega term by hand — is a statement about the DC limit , not a consequence of A4. - A7 (Passivity). \\mathrm{Im}\\,\\chi(\\omega) 0 for \\omega 0 is thermodynamics, not causality. KK is sign-blind; gain media satisfy it exactly. Passivity plus A4–A5 gives Herglotz structure, and only then do positivity-based sum rules follow. In the Kubo framing, \\chi'' is fixed by equilibrium fluctuations and \\chi' by the Hilbert transform — passivity enters through the equilibrium density matrix, i.e. through \\beta 0 . - A8 (Minimum phase). Required only for log-modulus/phase pairs. If r(\\omega) has zeros in the UHP, \\ln r is not holomorphic there, and r\\to rB with a Blaschke product B leaves r untouched on the real axis while shifting \\arg r . Bode stated the condition in 1945 ; the optics literature calls it the phase-retrieval problem. Subtractions and what a sum rule really encodes When A5 fails because \\chi\\to\\chi \\infty\\neq0, apply the argument to [\\chi(\\omega)-\\chi \\infty]/(\\omega^2-\\omega 0^2). One subtraction gives \\varepsilon \\infty is an integration constant — an assumption about the unmeasured UV, promoted by habit to a fitted material parameter. Superconvergence then turns asymptotics into sum rules: expanding the subtracted relation at large \\omega against the free-electron limit \\varepsilon(\\omega)\\to1-\\omega p^2/\\omega^2 gives the f-sum rule \\int 0^\\infty \\omega\\varepsilon 2\\,d\\omega=\\tfrac{\\pi}{2}\\omega p^2 — which encodes precisely the \\omega^{-2} tail, nothing else. TRK, \\sum n f {n0}=Z, is the same statement at the atomic level and is the microscopic reason that tail exists; Reiche's fingerprint on the convergence of the unsubtracted relation . The \\langle n\\rangle=1 rule encodes the \\omega^{-4} tail of n-1. Each rule is a tail in disguise, which is why \"checking\" a sum rule on data KK-inverted with an assumed tail is circular — the check returns the assumption. The tabulated f 1 from f 2 inversions in the standard X-ray atomic scattering tables are built on exactly this superconvergent scaffolding , and constrained variational analysis exists to make the tail an explicit reported parameter rather than a silent one . Where Each Hypothesis Breaks: The Validity Domain, A1 through A8 Where Each Hypothesis Breaks: The Validity Domain, A1 through A8 The eight hypotheses of §2 are not decorative. Each one is violated by a class of experiments that nonetheless publishes Kramers–Kronig-processed numbers. What follows is the failure catalogue, hypothesis by hypothesis, with the regime and — where it can be given — the size of the error. A1 (linearity) and A2 (time-translation invariance): nonlinear and pump–probe optics These two fail together and are almost always violated together, which is why the literature's treatment of them is so confused. The correct statement, due to Hutchings, Sheik-Bahae, Hagan and Van Stryland , is non-degenerate : hold the pump at \\omega p with fixed intensity I, and the probe-frequency response is a legitimate KK pair, because the medium as dressed by the pump is a new LTI system for the probe: linear in the probe field (A1 restored perturbatively), and stationary provided the pump is CW or long compared to all material memory (A2 restored by fiat). The pump index enters as a parameter, not a variable. What does not survive is the fully degenerate self-action coefficient \\chi^{(3)}(\\omega;\\omega,\\omega,-\\omega), whose real and imaginary parts (n 2 and \\beta) are not Hilbert-transform partners in \\omega. The reason is structural: varying \\omega moves all four frequency arguments simultaneously, so the analytic continuation is in a diagonal direction through a multivariable analyticity domain, and the single-variable Titchmarsh theorem has nothing to say about it. Papers that Hilbert-transform a measured \\beta(\\omega) to obtain n 2(\\omega) are using the non-degenerate theorem outside its stated domain; the two agree only where the dispersion of \\Delta n with \\omega p is negligible, i.e. far from any two-photon resonance. A2 fails outright, and irreparably, for genuine transient spectroscopy. A pump–probe or transient-absorption spectrum measured at delay \\tau is a snapshot of a non-stationary system; the response kernel is \\chi(t,t'), not \\chi(t-t'), and there is no single-variable Fourier transform to be analytic in. One may still write a KK relation at each fixed \\tau if — and only if — the material memory is short compared to \\tau-dynamics (the adiabatic/quasi-stationary limit). For carrier cooling on 100 fs timescales probed with 20 fs pulses, that condition is violated by construction, and the transform-derived \"index change\" is an artifact whose magnitude is set by the pulse bandwidth, not by the material. A3 (locality): spatial dispersion and metamaterials Locality is the hypothesis that \\mathbf{P}(\\mathbf{r},t) depends on \\mathbf{E} at the same \\mathbf{r}. Relax it and the response is \\varepsilon(\\omega,k), which is KK-analytic in \\omega at fixed k — the causal-memory argument is untouched — but not along any trajectory k=k(\\omega), which is what a fixed-geometry measurement traces out. This is the exact content of the metamaterial \"KK violation\" literature. S-parameter retrieval inverts S {11},S {21} of a finite slab for an effective \\varepsilon {\\rm eff}(\\omega),\\mu {\\rm eff}(\\omega); those are slab fit parameters that absorb the Bloch-mode structure, surface impedance, and branch-cut choices of the inversion. When such a pair fails KK — as in the wide-band negative-permeability retrievals — the correct inference is not that causality is broken but that the retrieved object was never a local susceptibility. The same caution applies to guided- and surface-mode indices: a polariton dispersion n {\\rm eff}(\\omega) is a boundary-value construct, and strong-coupling polariton branches anticross in ways that no bulk KK pair need reproduce. A5 (integrability / no real-axis poles) and A6 (decay at infinity): the DC pole and \\chi \\infty For a metal, \\sigma(\\omega)\\to i n e^2/(m\\omega) as \\omega\\to0: a first-order pole on the contour. The standard fix is to treat it as a pole displaced into the lower half plane by i/\\tau and to subtract its contribution analytically, which amounts to asserting that the \\omega\\to0 limit is Drude. That is a model. For a superconductor the pole is genuine (\\delta-function at \\omega=0 in \\sigma 1, \\sigma 2\\sim1/\\omega), and the KK integral must be written with the condensate term separated out by hand — the missing-area/Ferrell–Glover–Tinkham argument is precisely the bookkeeping of that separated pole. A6 fails whenever \\chi(\\omega)\\not\\to0, i.e. whenever an electronic background \\varepsilon \\infty lies above the measured window. The remedy is the once-subtracted relation and the subtraction constant \\varepsilon \\infty is an input , not an output. Causality does not supply it; it is fixed by extrapolation, by an oscillator fit, or by fiat. Every quoted \\varepsilon \\infty is a statement about spectral weight outside the window. A7 (passivity is not causality): gain media \\mathrm{Im}\\,\\chi(\\omega) 0 for \\omega 0 is thermodynamics, not analyticity. An inverted medium with \\mathrm{Im}\\,\\chi\u003c0 over the gain band satisfies KK exactly, and the anomalous-dispersion slope that accompanies gain is required by KK, not in tension with it. The corollary matters more than the statement: the f-sum rule and \\langle n\\rangle=1 superconvergence results need passivity (Herglotz/positive-real structure) in addition to causality. A paper that derives a sum rule \"from causality\" has dropped a hypothesis; a gain medium is the counterexample. A8 (minimum phase): the Blaschke ambiguity, quantified For reflectivity inversion one transforms \\ln r=\\ln r +i\\theta, which requires r(\\omega) to have no zeros in the upper half plane — Bode's minimum-phase condition, stated in 1945 and proved to be independent of causality by Toll . Multiplying by B(\\omega)=\\prod j(\\omega-\\omega j)/(\\omega-\\omega j^ ) leaves r pointwise identical and shifts \\theta by up to 2\\pi per factor. No reflectivity dataset can detect this. The tail problem is separately quantifiable. The phase kernel weights \\ln r as \\ln\\!\\bigl\\lvert(\\omega'+\\omega)/(\\omega'-\\omega)\\bigr\\rvert, which decays only as 2\\omega/\\omega' — so a two-decade window [\\omega L,\\omega H]=[\\omega 0/10,10\\,\\omega 0] leaves the high tail contributing at order \\omega 0/\\omega H\\sim10\\% of \\theta per e-fold of assumed R-slope, and the Hagen–Rubens low tail a comparable amount near the window edge. In practice a swing between R\\propto\\omega^{-4} and free-electron \\omega^{-2} high-frequency extrapolations moves \\theta(\\omega 0) by tens of milliradians mid-window and by 0.1–0.3 rad within a decade of either edge — which propagates to 10–30% errors in \\sigma 1 near the edges, where the interesting physics (pseudogaps, low-energy spectral weight) usually lives. The honest procedure is Kuzmenko's KK-constrained variational analysis , in which the tail is an explicit, reported model parameter and the anchor points are stated; the same discipline in electrochemical impedance takes the form of the Lin-KK/measurement-model residual test . Quoted phases without a tail-sensitivity band are model outputs presented as data. Signatures: What Actually Tests Causality, and What Only Looks Like It Signatures: What Actually Tests Causality, and What Only Looks Like It A causality test worthy of the name must have a falsifiable outcome. The structure required is always the same: measure two independent quantities over a common spectral window, feed one into the Hilbert transform, and compare the output against the other. Anything that instead uses the transform to generate the second quantity has produced an interpolation, not a test. The literature is dense with the second kind wearing the clothes of the first. The genuine class: two independent observables, one common window Field-resolved time-domain measurement. THz time-domain spectroscopy records E(t) directly by electro-optic sampling — amplitude and phase of the transmitted field are measured simultaneously, so \\tilde{n}(\\omega) = n(\\omega) + i\\kappa(\\omega) follows from a single ratio E {\\text{sam}}(\\omega)/E {\\text{ref}}(\\omega) with no dispersion integral anywhere . KK is then a prediction about the measured pair, and it can fail: if it does, either the sample is nonstationary during the scan, the reference and sample paths differ, or Fabry–Pérot echoes were windowed inconsistently. This is the strongest routine test available, and its power comes entirely from the fact that the phase was never manufactured. Ellipsometry. Measuring \\rho = r p/r s = \\tan\\Psi\\, e^{i\\Delta} delivers two independent real numbers per frequency . The KK check has teeth only if the analysis is point-by-point inversion; the moment a Kramers–Kronig-consistent oscillator basis (Lorentz, Tauc–Lorentz, Gaussian-with-KK-partner) is used as the fitting model, consistency is imposed by construction and the residual tests the oscillator basis, not causality. The published claim \"our ellipsometric \\varepsilon(\\omega) is KK-consistent\" is nearly always the tautological version. The discriminating question to ask any such paper: was the dielectric function parameterized? Spectroscopic interferometry and heterodyne/holographic detection. White-light interferometry, dual-comb, and off-axis holography all recover \\arg t(\\omega) from a fringe pattern — a geometric measurement, independent of any analyticity assumption. Note the sharp contrast with the \"Kramers–Kronig receiver\" of coherent optical communications and its imaging analogue : those assume minimum phase (deliberately engineered, by adding a strong carrier that pushes all zeros of the analytic signal out of the upper half plane) and reconstruct phase from intensity alone. They are beautiful engineering and they are not causality tests — they are demonstrations that a minimum-phase condition can be manufactured , which is precisely the hypothesis Toll showed KK cannot supply on its own . Figure: The topological difference between a KK test and a KK interpolation. In the upper path two observables enter independently and the residual is free to be nonzero. In the lower path the only external datum is R(\\omega); the tail extrapolation and the minimum-phase assumption enter at the transform and re-emerge downstream as the \"verified\" sum rule. The circumstantial class, and what actually causes each A self-consistent KK-inverted reflectivity. Self-consistency here is an identity, not evidence: the Philipp–Ehrenreich procedure constructs \\phi(\\omega) so that \\ln r is an analytic pair. What varies between analyses is the tail, and the retrieved phase at \\omega 0 is a weighted average over assumed Hagen–Rubens and \\omega^{-4} regions. Discriminating test: re-run the inversion with two defensibly different tail families and publish the spread, or use a KK-constrained variational fit in which the tail is an explicit reported parameter . A phase whose tail-sensitivity band is not quoted is a model output presented as a datum. A satisfied f-sum rule. If \\sigma 1(\\omega) was obtained by KK inversion under an assumed high-frequency tail, then \\int 0^\\infty \\sigma 1\\,d\\omega = \\pi n e^2/2m largely re-tests the tail. The sum rule is a superconvergence statement about asymptotics ; it becomes independent evidence only when \\sigma 1 comes from directly measured absorption over the full weight-bearing range, as in the graphite/graphene optical-conductance work where the plateau \\sigma = \\pi e^2/2h is read off transmission directly . Discriminating test: was the integrand ever passed through a Hilbert transform? If yes, the check is circular. A Drude-like low-frequency form. \\sigma(\\omega) = \\sigma 0/(1-i\\omega\\tau) is causal, but so is essentially everything; a Drude fit tests the scattering model, not analyticity. Alternative causes of the same lineshape: an unresolved distribution of relaxation times , a Cole–Cole/constant-phase-element response in electrochemical impedance , grain-boundary or contact impedance in series. Discriminating test: the Lin-KK / measurement-model residual test used in impedance spectroscopy — fit a purely RC (hence automatically KK-satisfying) Voigt ladder and inspect whether residuals are structured; structured residuals indicate nonstationarity during the sweep, not a causality violation . Apparent superluminal group velocity in an absorption band. v g = c/(n + \\omega\\,dn/d\\omega) c or negative inside anomalous dispersion is required by KK, not in tension with it — the same analyticity that forbids a signal before the front produces the pulse-peak advance. The peak is not a signal. Discriminating test: the only front-velocity observable that is not model-laundered is the Sommerfeld–Brillouin precursor structure — the leading, chirped, weakly-damped forerunner arriving at exactly t = L/c, ahead of the main signal, in a medium where n\u003c1 over a band. Detecting the forerunner at L/c measures the front velocity; measuring a pulse envelope's centroid measures reshaping. A negative-\\varepsilon or negative-\\mu retrieval \"violating KK\". Almost always the retrieved quantity was never a local susceptibility — S-parameter inversion of a slab returns fit parameters, and with spatial dispersion the causal object is \\varepsilon(\\omega,k) . Discriminating test: vary the slab thickness. A genuine local response is thickness-independent; a violation that scales with the number of unit cells is a retrieval artifact. The general rule: an indirect signature earns evidential weight only in proportion to the number of independent inputs it consumes. One measured spectrum plus one Hilbert transform is one input, however elaborate the downstream processing. Use \u0026 Abuse: The Phase That Is a Model Output Quoted as a Datum Use \u0026 Abuse: The Phase That Is a Model Output Quoted as a Datum The pathologies below are not exotic. Each is a standard, publishable procedure whose stated hypotheses were discharged decades ago and are now carried silently. Pattern 1: reflectance inversion with invented tails The Philipp–Ehrenreich workflow measures normal-incidence R(\\omega)= r ^2 over a finite window and recovers the phase from then builds \\varepsilon(\\omega) from ( r ,\\theta). Two hypotheses enter here that causality does not supply. First, this integral is the log-modulus/phase pair, not the \\chi'/\\chi'' pair; it requires r(\\omega) to be minimum-phase — no zeros of r in the upper half plane. Toll showed the retrieved phase is unique only up to a Blaschke factor B(\\omega)=\\prod j(\\omega-\\omega j)/(\\omega-\\omega j^ ) with B =1 on the real axis ; Bode had stated the same precondition for networks in 1945 . Zeros of r are not pathological — r vanishes wherever the sample is impedance-matched to vacuum, and near a Berreman-type or interference condition a thin film on a substrate is routinely non-minimum-phase. The physics-facing statement of this, that a zero in the upper half plane is exactly what breaks the modulus→phase map while leaving causality intact, is Bechhoefer's Kramers–Kronig, Bode, and the meaning of zero (Am. J. Phys. 2011) (verify page range). Second, the integral runs over (0,\\infty); the data span perhaps two decades. The tails are supplied by a Hagen–Rubens form 1-R\\propto\\sqrt{\\omega} or a Drude continuation below, and a power law R\\propto\\omega^{-s} (s\\approx 4 for free-carrier-free insulators) or Henke-table atomic scattering factors above. Because the kernel (\\omega^2-\\omega 0^2)^{-1} decays only as \\omega^{-2}, the tail contribution to \\theta(\\omega 0) is not small — it is the dominant systematic near the window edges, and it propagates directly into the quoted \\sigma 1(\\omega) and into any spectral-weight integral \\int 0^{\\Omega}\\sigma 1\\,d\\omega built from it. A published \\sigma 1(\\omega) with no stated extrapolation and no error band is not a measurement of the optical conductivity; it is one point in a family parameterized by unreported choices. Pattern 2: one-variable KK on transient and pump–probe spectra Applying \\Delta n(\\omega)=\\frac{c}{\\pi}\\mathrm{P}\\int \\Delta\\alpha(\\omega')/(\\omega'^2-\\omega^2)\\,d\\omega' to a transient-absorption trace at fixed delay \\tau treats a system that is manifestly not time-invariant as LTI. Time-translation invariance is a hypothesis of Titchmarsh's theorem, not a technicality: a pumped medium has a two-time response \\chi(t,t')\\ne\\chi(t-t'), and the Fourier variable conjugate to t-t' is not the same object as the probe frequency in a finite-delay experiment. The defensible statement is the non-degenerate one : with the pump held fixed and stationary , the probe response is linear and causal in the probe field, so \\Delta n(\\omega;\\omega p) and \\Delta\\alpha(\\omega;\\omega p) are a KK pair in the probe variable \\omega alone. The fully degenerate \\chi^{(3)}(\\omega;\\omega,\\omega,-\\omega) is not. Attosecond transient absorption, where the probe bandwidth exceeds the pump-induced dynamical timescale, sits squarely outside the hypothesis — the field has begun to treat this explicitly (Optica 10 , 142, 2023) (verify), but the routine practice of KK-transforming a \\Delta A(\\lambda,\\tau) map delay-by-delay remains uncorrected. Pattern 3: \"KK violations\" that are category errors Effective \\varepsilon {\\rm eff}(\\omega),\\mu {\\rm eff}(\\omega) from Nicolson–Ross–Weir/S-parameter inversion of a metamaterial slab are fit parameters of a boundary-value problem , not local response functions . The much-reported antiresonance — \\mathrm{Im}\\,\\mu {\\rm eff}\u003c0 over a band adjacent to a resonance — is not a causality violation; it is the signature of spatial dispersion, the physical response being \\varepsilon(\\omega,k), analytic in \\omega at fixed k and not as a function of \\omega at fixed geometry. Homogenization schemes built on point-dipole Maxwell-Garnett approximations manufacture non-causal \\varepsilon {\\rm eff} as an artifact of the truncation, and retrieval methods that restore weak spatial dispersion recover KK compliance in exactly the bands where the naive method fails (Alù et al. arXiv:1303.5807). The same applies to modal indices of guided and surface waves. When a \"KK violation\" is announced, the first question is whether the retrieved quantity was ever a susceptibility. Pattern 4: passivity billed as causality \\mathrm{Im}\\,\\chi(\\omega) 0 for \\omega 0 is a thermodynamic statement, not a consequence of KK. KK is sign-blind; a gain medium with \\mathrm{Im}\\,\\chi\u003c0 satisfies it exactly. Passivity plus KK gives the Herglotz structure from which the f-sum rule and \\langle n\\rangle=1 follow. Papers deriving those from \"causality\" have quietly dropped a hypothesis — and via fluctuation–dissipation , the positivity is really the KMS/detailed-balance input, i.e. equilibrium, which a driven sample does not have. Pattern 5: the four-way conflation The Hilbert pair (Plemelj) is mathematics. The KK relation is that pair applied to a causal LTI susceptibility. A \"dispersion relation\" in the S-matrix sense carries bound-state poles, crossing, unitarity and stated subtractions — strictly stronger. Sum rules are superconvergence statements about the asymptotics , each encoding a specific tail. A sum-rule \"check\" on data that were KK-inverted using an assumed tail is circular arithmetic, not validation. Tells of a hollow claim Tell What it means --- --- No extrapolation model stated The reported phase is one member of an unreported family No tail-sensitivity band on \\sigma 1 or spectral weight The dominant systematic was never estimated \"Minimum phase\" absent where \\ln r was transformed Blaschke ambiguity unexamined Nussenzveig cited but subtractions unmentioned Cited as authority, not read KK applied per-delay to \\Delta A(\\lambda,\\tau) Time-invariance assumed away f-sum rule quoted as a check on KK-inverted data Circular The honest alternative Parameterize \\varepsilon 2 on an anchor mesh (or as oscillators), couple \\varepsilon 1 to it by construction through the KK transform, and fit all measured channels simultaneously — this is Kuzmenko's variational analysis , and its virtue is that the extrapolation becomes an explicit, reportable, error-barred parameter rather than a step in a pipeline. Better still, close the loop with a second independent observable: ellipsometry delivers (\\psi,\\Delta) directly , and combining it with reflectance over a common window converts KK from an inversion into a falsifiable consistency test. Electrochemistry has institutionalized precisely this — the linear-KK/measurement-model residual test (Boukamp 1995; ) treats KK compliance as a hypothesis about the data, with structured residuals flagging drift and nonstationarity. Optics, which invented the method, mostly does not. And the one community that takes minimum-phase seriously is telecom: the KK coherent receiver engineers the condition with a carrier tone, with a CSPR threshold ( 6 dB) below which reconstruction demonstrably fails (JLT 38 , 6214, 2020). A hypothesis you must pay dB to satisfy is not one a condensed-matter paper gets for free. Status: Mutated, Load-Bearing, and Rarely Audited — The Believer's Checklist Status: Mutated, Load-Bearing, and Rarely Audited — The Believer's Checklist The subject is in an unusual condition: its mathematics is finished, its physics claim has drifted, and its most important theorem is the one nobody cites. These three layers must be assessed separately, because they fail — and don't fail — in completely different ways. Settled, and not worth re-litigating The analytic core is closed. Titchmarsh's theorem, as presented in Nussenzveig's monograph , is a biconditional on L^2(\\mathbb{R}): square-integrability plus vanishing of the inverse transform for t\u003c0 is equivalent to the Hilbert-pair structure and to the existence of a holomorphic extension into the upper half plane with uniformly bounded L^2 norm on horizontal lines. Nothing has been added to that statement in fifty years, and nothing needs to be. The Plemelj–Sokhotski decomposition, the once- and twice-subtracted forms, the superconvergence theorems that yield the f-sum rule and \\langle n\\rangle = 1 — all of it is textbook and correct. Kubo's placement of the pair inside linear response , with \\chi'' fixed by equilibrium fluctuations and \\chi' by the transform, is likewise secure. The engineering practice is also, in one corner, exemplary. The Kramers–Kronig coherent receiver is the only widely deployed application in which the minimum-phase hypothesis is manufactured rather than assumed : a CW carrier is added with enough power that the received field's analytic signal is provably zero-free in the upper half plane, and the required carrier-to-signal power ratio (conventionally \\gtrsim 6 dB, with a substantial literature since on pushing it lower) is a specified, measurable operating condition. That is what discharging A-hypotheses looks like. It is instructive that the field which took Bode's 1945 caveat seriously is the one descended from Bode's own institution. Regime-limited, and usually presented as if it weren't Everything downstream of a finite measurement window is regime-limited. The Philipp–Ehrenreich reflectance-inversion pipeline and its descendants — including the Henke–Gullikson–Davis atomic scattering-factor tables , where f 1 is obtained from measured f 2 by a dispersion integral over an assembled, partly theoretical absorption spectrum, and which now underpin essentially all X-ray optics design — are correct given their tails. Those tails are model choices. Kuzmenko's variational analysis remains the right response: parameterize \\varepsilon 2 on an anchor mesh, couple \\varepsilon 1 by an exact KK transform, and let the extrapolation appear as a reported, fitted object rather than a footnote. It is cited far more often than it is used. Regime-limited too: the nonlinear case, where only the non-degenerate pair \\Delta n(\\omega;\\omega p), \\Delta\\alpha(\\omega;\\omega p) at fixed pump satisfies a KK relation in the probe variable ; effective-medium retrievals of \\varepsilon,\\mu for structured media, where the KK-analytic object is \\varepsilon(\\omega,k) and the retrieved slab parameters are not local susceptibilities ; and the entire space-domain phase-retrieval family now proliferating in microscopy , where the Hilbert pair is in a spatial frequency variable and \"causality\" is a support condition on the pupil, not a statement about time ordering. That transplant is mathematically legitimate and physically a different theorem wearing the same name. Folklore Three claims circulate with no support and should be treated as false on sight. (i) \"Causality alone determines the complex response\" — the model-independent theorem is a 1945–1956 product , and Bohren's reconstruction shows the 1926–27 papers do not contain it. (ii) \"KK inversion measures the phase.\" It computes a phase, conditional on a minimum-phase assumption that causality does not supply — Toll's Blaschke ambiguity means r(\\omega) is compatible with a one-parameter family of phases, and this remains the most-ignored central result in the subject. (iii) \"KK-compliance validates data.\" In impedance spectroscopy the linear KK / Lin-KK test fits a fixed RC-relaxation basis and inspects residuals; it detects drift and nonlinearity, which is genuinely useful , but a passing test certifies LTI consistency, not correctness of the physical model — and DRT inversions built on the same data inherit that gap . The Believer's Checklist AETHER accepts a KK-derived number only when the paper states, in the text and not the supplement: 1. Which relation. Unsubtracted \\chi, once-subtracted \\varepsilon with \\varepsilon \\infty, or log-modulus/phase for r(\\omega) — these are inequivalent, and only the third needs minimum phase. 2. The measurement window , in the same units as the integral, with the fraction of the principal-value integrand's weight at \\omega 0 that lies outside it. 3. The tail model, explicitly , plus a sensitivity band: repeat the inversion with at least two defensible extrapolations and quote the spread as a systematic error on every derived quantity. 4. A minimum-phase argument or a Blaschke disclaimer. Either demonstrate zero-freeness in the upper half plane (as the KK receiver does by construction ), or state that the retrieved phase is one member of a family. 5. Subtraction constants declared as fitted parameters with uncertainties — \\varepsilon \\infty is an assumption, not a consequence of causality. 6. LTI, stationarity, and locality justified for the actual system : fluence-independence demonstrated for pump–probe; k-independence argued for anything structured or spatially dispersive. 7. No circular sum rules. An f-sum check on spectra that were themselves KK-inverted with an assumed tail tests the tail against itself. Sum rules count as validation only against an independently measured quantity. 8. One out-of-sample prediction. A KK-derived \\varepsilon(\\omega) must reproduce something it was not fitted to — ellipsometric \\Psi,\\Delta at another angle , transmission through a different thickness, a second sample geometry. Absent that, the phase is a model output, and should be labelled one. Sources: Boukamp, J. Electrochem. Soc. 142, 1885 (1995) · Kuzmenko, cond-mat/0503565 · Minimum phase conditions in KK optical receivers · Handheld KK phase-imaging smartscope, Laser Photonics Rev. (2026) The AETHER Verdict The AETHER Verdict I have spent this dossier taking apart a phrase. Let me say plainly what I think survives. (a) What I would defend with my reputation The mathematics. Titchmarsh's theorem is a theorem: for \\chi \\in L^2(\\mathbb{R}), the three statements — vanishing of \\chi(t) for t\u003c0, holomorphic extension into the upper half plane with uniformly bounded L^2 norm on horizontal lines, and the Hilbert-transform pair — are mutually equivalent, no physics attached. Nothing in the last century has dented that, and the Plemelj–Sokhotski decomposition underneath it is older than the physics it serves. I will also defend, without qualification, the historical claim: the model-independent theorem is Toll's , not Kramers' and not Kronig's. Kronig 1926 has one relation inside a gas model; Kramers 1927 has the pair, partly conjecturally, with a Sommerfeld–Brillouin signal-front condition doing real work. Bohren went and read the papers ; anyone who disputes the reconstruction should do the same before disputing it. And I will defend the practical claim that KK- constrained fitting — where the tail is an explicit, reported model parameter — is strictly better epistemics than KK inversion with a silent extrapolation. That is not a stylistic preference. It is the difference between a datum and a posterior. (b) What is shakier than the literature admits Four assumptions, named. Square-integrability. Every citation of \"causality ⟹ KK\" is invoking Titchmarsh, whose hypothesis is L^2. Drude conductivity is not L^2; \\varepsilon \\infty \\neq 0 is not L^2. The fix — subtraction — introduces a constant that is assumed , not derived. Papers that write \"by causality\" above a once-subtracted relation have imported an unstated physical input. Minimum phase. The reflectivity-phase industry rests on the absence of zeros of r(\\omega) in the upper half plane. Causality does not supply this; a Blaschke factor leaves r untouched and moves the phase . I have never seen this hypothesis tested in an experimental paper. Not argued away — tested. Time invariance. Transient-absorption and pump–probe spectra are routinely one-variable KK-transformed. The system is not LTI during the probe window. The correct statement is the non-degenerate one, pump fixed, probe swept . This is the single most common quiet error in modern optics. Locality. S-parameter-retrieved \\varepsilon(\\omega),\\mu(\\omega) for a metamaterial slab are fit parameters, not local susceptibilities; the physical object is \\varepsilon(\\omega,k). \"KK violation\" here is almost always a diagnosis of the retrieval, not of causality. (c) The three I would work on, ranked 1. A quantitative Blaschke bound from data. Given measured r(\\omega) on a finite window plus one independent phase measurement (THz-TDS, ellipsometry) at a few frequencies, how tightly can one bound the admissible Blaschke content? This converts an untested hypothesis into a reported interval, and it is tractable now. 2. KK-analytic structure at fixed k for spatially dispersive media. The clean object exists; the extraction protocol does not. Without it, every metamaterial \"causality check\" is uninterpretable. 3. Falsifiable causality tests in non-equilibrium matter. Floquet and driven systems break time invariance by construction; what replaces KK — a two-time or Floquet-sideband relation with a genuinely falsifiable outcome — is open, and the field is currently publishing LTI-processed numbers into it. Reading path 1. Bohren (2010) — read the credit audit before the theorem; it inoculates you against the textbook sentence. 2. Kronig (1926) and Kramers (1927) — see the atomic model and the front condition with your own eyes; twenty minutes, permanently clarifying. 3. Bode (1945) — the minimum-phase condition stated correctly, by an engineer, before physicists needed it. 4. Toll (1956) — the actual theorem, plus the Blaschke counterexample, in the paper whose name is not on the relations. 5. Kuzmenko (2005) — how to make the tail an honest parameter rather than an invisible one; the only item here you will use next week."}</script>

<script type="application/json" id="aether-data">{"slug": "the-theorem-nobody-proved-kramerskronig-and-the-manufacture", "topic": "Kramers-Kronig relations", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "The Theorem Nobody Proved: Kramers–Kronig and the Manufacture of a Causal Certainty", "subtitle": "How a model-dependent X-ray calculation and a French-language conference talk became the canonical statement that causality alone determines the complex response — and what the retrieved phase actually is.", "domain": "optics / condensed matter / many-body response theory", "era": "1926-1927 (Kronig, Kramers); load-bearing from dispersion theory through the 1950s S-matrix program to modern spectroscopy", "why_big": "Kronig and Kramers showed that the real and imaginary parts of a linear response function are not independent data but Hilbert transforms of each other, forced by causality alone — no model of the medium required. This was the first time a purely analytic statement (holomorphy of chi(omega) in the upper half plane) was shown to encode a physical principle, and it became the template for everything from the optical theorem and forward dispersion relations in particle physics to sum rules (f-sum, Thomas-Reiche-Kuhn) and the modern extraction of optical constants from reflectivity. It is the reason a single measured spectrum can, in principle, determine an entire complex response.", "abuse": "The derivation requires linearity, time-invariance, passivity, and a specified high-frequency asymptotic falloff — yet KK inversion is routinely applied to reflectivity data truncated over two decades with invented Drude-Lorentz extrapolations, to nonlinear and pump-probe signals, to metamaterials with spatial dispersion where the local chi(omega) does not exist, and to systems with a DC conductivity pole handled by silent subtraction. The phase retrieved this way is then quoted as a measurement rather than as an artifact of the assumed tail.", "date": "August 10, 2026", "ts": 1786410218.878148, "engine": "Claude Code CLI · default model", "aliases": ["Kronig–Kramers relations", "KK relations", "Kramers–Kronig dispersion relations", "dispersion relations (optics/particle physics usage)", "Hilbert-transform pair for a causal response function", "Bode gain–phase relations (electrical-engineering lineage)", "Plemelj/Sokhotski relations (mathematical substrate)", "reflectivity KK inversion / KK phase retrieval (spectroscopic usage)"], "origin_story": "The relations were born inside the last, most baroque phase of the old quantum theory, not inside electrodynamics. Ladenburg's 1921 reinterpretation of the classical dispersion formula and the 1923 Ladenburg–Reiche synthesis [75] replaced Lorentz's real electrons with 'Ersatzoszillatoren' whose strengths were fixed by Einstein A/B coefficients — making the statement 'the refractive index is built out of the absorption lines' quantitative for the first time. Kramers' 1924 Nature letters [74] completed that formula with negative (stimulated-emission) terms, and the Kramers–Heisenberg dispersion formula of 1925 gave it its final old-quantum-theory form. Against that background, Ralph Kronig — then in the United States, working on the anomalous dispersion of X-rays where no bound-electron model was trustworthy — asked in JOSA 1926 [71] what could be said about n(ω) knowing only the atomic absorption coefficient, and produced a relation expressing the refractive index as a principal-value integral over absorption, arguing from the requirement that no scattered wave precede the incident one. Kramers, independently, announced the pair of relations at the Volta centenary congress in Como in September 1927 [72] in a short French-language proceedings contribution that most physicists have never read, and the two men then published jointly on X-ray absorption and dispersion in Zeitschrift für Physik in 1928 [73]. Crucially, neither derivation was the modern one: both leaned on an atomic-gas model plus the finite signal-front argument descended from Sommerfeld and Brillouin's 1914 twin papers on propagation in dispersive media [81], and Kronig obtained only one member of the pair while Kramers obtained both [76]. The purely analytic reading — χ(ω) holomorphic in the upper half plane ⟺ χ(t) retarded, with the two relations as the Plemelj decomposition of the Cauchy kernel — was assembled much later, in Bode's feedback-amplifier theory [82], in Toll's Princeton thesis under Wheeler [83], and then, under the pressure of the S-matrix program, by van Kampen [84] and Gell-Mann–Goldberger–Thirring [85]. The model-independent, causality-only KK relation that every textbook now presents as the 1926–27 discovery is in fact a 1950s reconstruction of it.", "credit_audit": "The textbook sentence — 'Kramers and Kronig showed in 1926–27 that causality alone forces the real and imaginary parts of any linear response function to be Hilbert transforms of each other' — is wrong in three separate ways, and Bohren's 2010 reconstruction [76] documents each. First, neither man derived the relations from causality alone: both worked inside an explicit atomic-gas model, using the finite-signal-front condition inherited from Sommerfeld and Brillouin [81] as an auxiliary constraint. Second, Kronig obtained only one of the two relations in 1926 [71]; the pair appears in Kramers' Como proceedings contribution of 1927 [72], and even there partly as conjecture. Third, the model-independent statement — retarded χ(t) ⟺ χ(ω) holomorphic and suitably bounded in the upper half plane, with the relations as the Plemelj decomposition — is a product of 1945–1956: Bode in circuit theory [82], Toll's thesis and 1956 paper in the strongest form [83][86], van Kampen [84], and Gell-Mann–Goldberger–Thirring [85]. The mid-1950s S-matrix community, needing a respectable ancestor for forward dispersion relations, reached back and canonized 'the dispersion relations of Kramers and Kronig' [10][11], and that phrase — with that word order — is what fixed the attribution; through the early 1950s the literature is still split, with 'Kronig-Kramers' the common form in dielectrics and network theory [4][12][15] and 'Kramers-Kronig' in the field-theory papers [8][10][11]. Kronig contributed to the confusion himself: his 1936 paper with Gorter cites his 1926 work for a relation it does not contain [76]. The deeper credit failure is not between Kramers and Kronig at all — it is that Ladenburg and Reiche [75], who made 'dispersion is determined by absorption' a quantitative claim, and Toll [83][86], who proved the theorem everyone now quotes, are absent from the name. Kramers himself, whose eponyms outnumber almost anyone's, never received a Nobel Prize; Kronig, whose spin priority was surrendered on Pauli's discouragement [78][80], likewise did not — the closest the Nobel record comes to this circle of ideas is Onsager's 1968 citation for reciprocal relations in irreversible thermodynamics, a different theorem from a neighboring cause.", "timeline": [{"year": 1914, "event": "Sommerfeld and Brillouin's twin Annalen papers show the wave front in a dispersive medium travels at exactly c: causality becomes a quantitative constraint on n(ω) rather than a philosophical remark. This 'no signal before the front' argument is the physical premise Kronig and Kramers both invoke.", "who": "Arnold Sommerfeld; Léon Brillouin", "work": "Über die Fortpflanzung des Lichtes in dispergierenden Medien, Ann. Phys. (Leipzig) 44, 177 and 203", "kind": "theory", "ref": 2}, {"year": 1923, "event": "Ladenburg and Reiche's 'Ersatzoszillator' scheme ties the dispersion formula to Einstein transition probabilities, so that the real part of the response is explicitly synthesized from the absorption spectrum. This is the substantive prehistory that KK reviews almost never cite.", "who": "Rudolf Ladenburg, Fritz Reiche", "work": "Absorption, Zerstreuung und Dispersion in der Bohrschen Atomtheorie, Naturwissenschaften 11, 584–598", "kind": "theory", "ref": 3}, {"year": 1924, "event": "Kramers publishes the quantum dispersion formula with negative oscillator terms, the immediate ancestor of Kramers–Heisenberg and the first place a response function is built entirely from transition data.", "who": "H. A. Kramers", "work": "The Law of Dispersion and Bohr's Theory of Spectra, Nature 113, 673–674 (and Nature 114, 310, 1924)", "kind": "theory", "ref": 4}, {"year": 1926, "event": "Kronig derives, for X-rays, the refractive index as a principal-value integral over the atomic absorption coefficient, appealing to the finite-front/retardation condition. He obtains ONE member of the pair, not both, and still uses an atomic-gas model.", "who": "Ralph de Laer Kronig", "work": "On the Theory of Dispersion of X-Rays, J. Opt. Soc. Am. 12, 547–557", "kind": "formalization", "ref": 5}, {"year": 1927, "event": "Kramers, at the Volta centenary congress in Como, states both relations — dispersion from absorption AND absorption from dispersion — in a French-language proceedings contribution that remains one of the least-read foundational papers in optics.", "who": "H. A. Kramers", "work": "La diffusion de la lumière par les atomes, Atti del Congresso Internazionale dei Fisici (Como), Vol. 2, 545–557, Zanichelli, Bologna", "kind": "formalization", "ref": 6}, {"year": 1928, "event": "Kronig and Kramers publish jointly on absorption and dispersion in X-ray spectra, cementing the pairing of the two names before either relation had a model-independent proof.", "who": "R. de L. Kronig, H. A. Kramers", "work": "Zur Theorie der Absorption und Dispersion in den Röntgenspektren, Z. Phys. 48, 174–179 (received 10 March 1928)", "kind": "theory", "ref": 7}, {"year": 1936, "event": "Kronig (with Gorter) cites his own 1926 paper for a relation it does not contain and attributes the other to Kramers' 1927 paper where it was still conjectural — the point at which the historical record begins to drift from what was actually proved. Documented by Bohren, who shows the modern anecdote ('they derived it from causality alone') is a retrofit.", "who": "R. de L. Kronig and C. J. Gorter; historiography by Craig F. Bohren", "work": "What did Kramers and Kronig do and how did they do it?, Eur. J. Phys. 31, 573–577 (2010)", "kind": "revival", "ref": 1}, {"year": 1945, "event": "Bode publishes the gain–phase integral for feedback amplifiers: for a MINIMUM-PHASE network, log|H| and arg H are a Hilbert-transform pair — the same theorem, derived independently, and with the minimum-phase caveat stated explicitly from the outset. The optics community rediscovered that caveat only decades later.", "who": "Hendrik Wade Bode", "work": "Network Analysis and Feedback Amplifier Design, Van Nostrand (Ch. XIV)", "kind": "formalization", "ref": 8}, {"year": 1952, "event": "Toll's Princeton PhD thesis under Wheeler proves the logical equivalence: strict causality ⟺ dispersion relation, and identifies the phase-retrieval ambiguity (zeros in the upper half plane / Blaschke factors) that KK cannot resolve. The thesis is the true origin of the 'causality alone' formulation.", "who": "John S. Toll (adviser: John A. Wheeler)", "work": "The Dispersion Relation for Light and its Application to Problems Involving Electron Pairs, PhD thesis, Princeton University", "kind": "formalization", "ref": 9}, {"year": 1953, "event": "Van Kampen derives S-matrix analyticity rigorously from a causality condition for scattering of the Maxwell field by a finite target — poles confined to the lower half plane, asymptotics specified. First rigorous causality→analyticity theorem in scattering.", "who": "N. G. van Kampen", "work": "S-Matrix and Causality Condition. I. Maxwell Field, Phys. Rev. 89, 1072", "kind": "theory", "ref": 11}, {"year": 1954, "event": "Gell-Mann, Goldberger and Thirring derive KK from microcausality (vanishing of field-operator
