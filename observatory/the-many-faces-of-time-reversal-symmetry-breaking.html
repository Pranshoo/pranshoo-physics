iunitary representation theory [10]. The second half is the formal core on which every later statement about TRS breaking rests. We collect it here in the form a working theorist actually uses.\n\n### Why T must be antiunitary\n\nDemand that the Heisenberg equation\n$$i\\hbar\\, \\dot A = [A,H]$$\nremain consistent under $A \\mapsto T A T^{-1}$, $t \\mapsto -t$, with $T H T^{-1} = H$. Reading off both sides forces\n$$T(i\\hbar)T^{-1} = -i\\hbar,$$\ni.e. $T$ does not commute with the scalar $i$. By Wigner's theorem, any map preserving transition probabilities $|\\langle\\phi\\mid\\psi\\rangle|^2$ is either unitary or antiunitary; consistency with the canonical algebra $[X,P]=i\\hbar$ under $X\\mapsto X$, $P\\mapsto -P$ forces the antiunitary branch. Concretely $T = U K$ with $U$ unitary and $K$ complex conjugation in a chosen basis. The single identity one ever needs is\n$$\\langle T\\phi \\mid T\\psi \\rangle \\;=\\; \\langle \\psi \\mid \\phi \\rangle \\;=\\; \\overline{\\langle\\phi\\mid\\psi\\rangle}.$$\n\n### The T²=±1 dichotomy\n\n$T^2$ commutes with every observable, so on an irreducible representation Schur gives $T^2 = e^{i\\alpha}\\mathbb{1}$. Antiunitarity conjugates the eigenvalue under one factor in $T^2\\cdot T = T\\cdot T^2$, forcing $e^{i\\alpha}=e^{-i\\alpha}$, i.e.\n$$T^2 = \\pm \\mathbb{1}.$$\n\nThe sign is not a choice. On angular momentum, $T \\mathbf J T^{-1} = -\\mathbf J$ together with standard phase conventions gives $T = e^{-i\\pi J_y/\\hbar}K$ and\n$$T^2 = (-1)^{2J}.$$\nInteger spin: $T^2 = +1$; half-integer spin: $T^2 = -1$. For spin-$\\tfrac{1}{2}$ this is the familiar $T = -i\\sigma_y K$. The dichotomy is representation-theoretic: $T^2 = +1$ endows the Hilbert space with a real (orthogonal) structure, $T^2 = -1$ with a quaternionic (symplectic) one. Dyson's threefold way and the Altland–Zirnbauer tenfold way are direct descendants of this single sign; so is the bulk of modern topological band classification, as Haldane's Nobel lecture recapitulates [16].\n\n### Kramers' degeneracy, in two lines\n\nKramers proved his theorem in 1930 [9], two years *before* Wigner gave $T$ its antiunitary form. Suppose $[H,T]=0$ and $H|\\psi\\rangle = E|\\psi\\rangle$. Then $H(T|\\psi\\rangle) = E(T|\\psi\\rangle)$. To show $|\\psi\\rangle$ and $T|\\psi\\rangle$ are independent, apply antiunitarity with $\\phi = T\\psi$, $\\chi = \\psi$ in $\\langle T\\phi\\mid T\\chi\\rangle = \\langle \\chi\\mid\\phi\\rangle$:\n$$\\langle T(T\\psi) \\mid T\\psi \\rangle \\;=\\; \\langle \\psi \\mid T\\psi \\rangle.$$\nFor $T^2 = -\\mathbb{1}$ the left side equals $-\\langle\\psi\\mid T\\psi\\rangle$, so\n$$\\langle \\psi \\mid T\\psi \\rangle = 0.$$\nEvery eigenvalue is at least doubly degenerate. For $T^2 = +\\mathbb{1}$ the same calculation gives $\\langle\\psi\\mid T\\psi\\rangle = \\langle\\psi\\mid T\\psi\\rangle$ — vacuous — and one can in fact choose a real eigenbasis (no protection).\n\nWhat the theorem says, and does not say:\n\n- It requires an odd number of half-integer constituents (total $J$ half-integer) and $H$ commuting with an antiunitary $T$ obeying $T^2 = -1$. Spin–orbit coupling does *not* destroy it; an applied $\\mathbf B$, an exchange field, or any time-odd term in $H$ does.\n- The partners are $|\\psi\\rangle$ and $T|\\psi\\rangle$; their orthogonality is a property of $T^2=-1$, not of $H$.\n- In a crystal, $T$ maps Bloch states at $\\mathbf k$ and $-\\mathbf k$; at TR-invariant momenta ($\\mathbf k = -\\mathbf k$ mod $\\mathbf G$) every band is doubly degenerate — the unit cell of the $\\mathbb Z_2$ topological-insulator index.\n\n\u003csvg viewBox=\"0 0 720 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eKramers degeneracy under a TRS-breaking field\u003c/title\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"340\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"200\" y=\"346\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eapplied field B\u003c/text\u003e\u003ctext x=\"30\" y=\"190\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 30 190)\"\u003eenergy\u003c/text\u003e\u003ctext x=\"200\" y=\"42\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003espin-½ (T²=−1): Kramers pair\u003c/text\u003e\u003cline x1=\"80\" y1=\"190\" x2=\"135\" y2=\"190\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003ctext x=\"146\" y=\"184\" fill=\"#7aa2ff\" font-size=\"13\"\u003e|ψ⟩,\u003c/text\u003e\u003ctext x=\"146\" y=\"200\" fill=\"#7aa2ff\" font-size=\"13\"\u003eT|ψ⟩ degenerate\u003c/text\u003e\u003cline x1=\"135\" y1=\"190\" x2=\"330\" y2=\"120\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cline x1=\"135\" y1=\"190\" x2=\"330\" y2=\"260\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"245\" y=\"115\" fill=\"#7aa2ff\" font-size=\"13\"\u003e+½ gμ_B B\u003c/text\u003e\u003ctext x=\"245\" y=\"278\" fill=\"#7aa2ff\" font-size=\"13\"\u003e−½ gμ_B B\u003c/text\u003e\u003cline x1=\"400\" y1=\"320\" x2=\"680\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"400\" y1=\"60\" x2=\"400\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"540\" y=\"346\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eapplied field B\u003c/text\u003e\u003ctext x=\"540\" y=\"42\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003espin-1 (T²=+1): no protection\u003c/text\u003e\u003cline x1=\"415\" y1=\"150\" x2=\"465\" y2=\"150\" stroke=\"#ffb86b\" stroke-width=\"3\"/\u003e\u003cline x1=\"415\" y1=\"210\" x2=\"465\" y2=\"210\" stroke=\"#ffb86b\" stroke-width=\"3\"/\u003e\u003cline x1=\"415\" y1=\"270\" x2=\"465\" y2=\"270\" stroke=\"#ffb86b\" stroke-width=\"3\"/\u003e\u003ctext x=\"475\" y=\"154\" fill=\"#ffb86b\" font-size=\"13\"\u003em=+1\u003c/text\u003e\u003ctext x=\"475\" y=\"214\" fill=\"#ffb86b\" font-size=\"13\"\u003em=0 (split by D at B=0)\u003c/text\u003e\u003ctext x=\"475\" y=\"274\" fill=\"#ffb86b\" font-size=\"13\"\u003em=−1\u003c/text\u003e\u003cline x1=\"465\" y1=\"150\" x2=\"670\" y2=\"100\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"465\" y1=\"210\" x2=\"670\" y2=\"210\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"465\" y1=\"270\" x2=\"670\" y2=\"320\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003c/svg\u003e\n*Figure: With $T^2=-1$ every level is at least doubly degenerate at $B=0$ and splits linearly only once $T$ is broken explicitly. With $T^2=+1$ (integer spin) crystal-field terms generically lift the degeneracy at $B=0$; there is no symmetry-protected pair to split.*\n\n### Onsager–Casimir reciprocity\n\nLinear-response coefficients $L_{ij}$ relate currents $J_i$ to thermodynamic forces $X_j$ via $J_i = \\sum_j L_{ij}X_j$. Onsager [2, 3] derived from microscopic reversibility — TRS of equilibrium correlators — the identity $L_{ij} = L_{ji}$. Casimir [12] supplied the piece without which the relations fail in any realistic conductor: under $T$ external time-odd parameters flip sign, $\\mathbf B \\to -\\mathbf B$, $\\boldsymbol\\Omega \\to -\\boldsymbol\\Omega$, $\\mathbf M \\to -\\mathbf M$ (for a magnetization treated as a frozen background). With $\\varepsilon_i = \\pm 1$ the T-parity of the conjugate force $X_i$,\n$$\\boxed{\\;L_{ij}(\\mathbf B, \\mathbf M) \\;=\\; \\varepsilon_i\\,\\varepsilon_j\\, L_{ji}(-\\mathbf B, -\\mathbf M).\\;}$$\nThe most-quoted special case is $\\sigma_{ij}(\\mathbf B) = \\sigma_{ji}(-\\mathbf B)$, splitting into a symmetric (ordinary) and an antisymmetric (Hall) part with even and odd dependence on $\\mathbf B$ respectively. Every claim about Hall, Nernst, or thermal-Hall responses descends from this identity.\n\n### Operators versus parameters: where conflations breed\n\nThe pedagogical hazard sits in the words \"$T$ commutes with $H$\". Two distinct readings are in circulation, and both are correct — for different questions.\n\n- **(O) $T$ acts only on dynamical operators.** Any $\\mathbf B$-coupling $-\\boldsymbol\\mu\\cdot\\mathbf B$ inside $H$ is an explicit T-breaking term; $[T,H]\\neq 0$; Kramers fails the moment $\\mathbf B \\neq 0$. This is the right reading for spectra and degeneracies at fixed $\\mathbf B$: Kramers, the $\\mathbb Z_2$ classification, gap-closing arguments.\n- **(P) $T$ acts on operators *and* on time-odd parameters.** Then $T H(\\mathbf B) T^{-1} = H(-\\mathbf B)$: there is no symmetry of a single Hamiltonian, but a symmetry of the family $\\{H(\\mathbf B)\\}$. This is the right reading for response coefficients as functions of $\\mathbf B$: Onsager–Casimir, the symmetry of the Hall conductivity, magnetochiral anisotropy.\n\nCalling either one \"the\" TRS is the most common source of cross-talk between condensed-matter, mesoscopic, and high-energy usages. Loschmidt's irreversibility paradox, antiferromagnetic \"T-broken-but-$T\\tau$-preserved\" arguments, the Haldane construction, and the altermagnet debate of the last few years each pivot on which convention is implicit. We shall meet that ambiguity, in different costumes, in every section that follows."}, {"id": "h-vs-state", "title": "Hamiltonian versus State: The Four Senses of 'Broken TRS'", "markdown": "## Hamiltonian versus State: The Four Senses of 'Broken TRS'\n\nWhen a speaker says \"TRS is broken\" the listener almost always has to guess which of four statements is meant. The four are logically distinct, fail in different regimes, and conflating them produces the most consequential errors in this part of the literature. The taxonomy below sorts them by *what* is being asked of $T$ — invariance of the generator of dynamics, of a state, of the underlying action, or of a non-equilibrium ensemble.\n\nAnchor the language first. $T$ is antiunitary [10], with $T^2=\\pm 1$ depending on the spin parity of the Hilbert space; it acts as $T\\hat{\\mathbf{r}}T^{-1}=\\hat{\\mathbf{r}}$, $T\\hat{\\mathbf{p}}T^{-1}=-\\hat{\\mathbf{p}}$, $T\\hat{\\mathbf{S}}T^{-1}=-\\hat{\\mathbf{S}}$. \"TRS of the dynamics\" means $[T,H]=0$ (equivalently $THT^{-1}=H$). \"TRS of the state\" means $T|\\psi\\rangle=e^{i\\phi}|\\psi\\rangle$ for a pure state, or $T\\rho T^{-1}=\\rho$ for a density matrix. These are independent properties: a TRS-invariant $H$ can host a TRS-non-invariant ground state, and conversely an explicitly T-violating $H$ has, generically, no T-invariant state in its spectrum.\n\n### (a) Explicit breaking of $H$\n\nThe narrowest sense. A T-odd term is added to the Hamiltonian by hand,\n$$H \\;=\\; H_0 \\;-\\; g\\mu_B\\,\\mathbf{B}\\cdot\\hat{\\mathbf{S}} \\;+\\; \\mu_b\\, j_b\\,\\hat{q}_b \\;+\\;\\dots,$$\neach added term flipping sign under $T$. The Zeeman coupling is the canonical example; current biases, chiral chemical potentials, and circularly polarised optical drives are operationally similar. The signature is unambiguous: Kramers degeneracies, which require $T^2=-1$ together with $[T,H]=0$ [9, 10], are lifted, and magnetotransport acquires a Hall response odd in $\\mathbf{B}$.\n\nThere is a long-standing semantic trap. If $\\mathbf{B}$ is regarded as an *external parameter* rather than as part of $H$, the Onsager–Casimir convention extends the action of $T$ to parameters, $T:\\mathbf{B}\\to-\\mathbf{B}$, and the resulting identity $L_{ij}(\\mathbf{B})=L_{ji}(-\\mathbf{B})$ is then advertised as \"TRS preserved\" [2, 3, 12]. Both usages are defensible; they are not equivalent statements, and writing one while meaning the other has caused decades of avoidable confusion in linear-response theory.\n\n### (b) Spontaneous breaking by the state\n\nThe Hamiltonian commutes with $T$; a specific eigenstate — typically the ground state in the thermodynamic limit — does not. The Heisenberg ferromagnet\n$$H \\;=\\; -J\\sum_{\\langle ij\\rangle}\\hat{\\mathbf{S}}_i\\cdot\\hat{\\mathbf{S}}_j,\\qquad J\u003e0,$$\nis the textbook case [6]: $T$ commutes with $H$, yet the ground-state manifold consists of states with $\\langle\\hat{\\mathbf{S}}_i\\rangle = \\mathbf{m}\\neq 0$, and $T$ maps such a state to the one with $-\\mathbf{m}$. The order parameter $\\mathbf{m}$ is T-odd; it is precisely the *non*-invariant quantity whose non-zero expectation diagnoses the broken symmetry. Mean-field theory of this kind is older — Weiss's molecular field [4] is the genuine prototype, with Heisenberg supplying the microscopic exchange justification [6] — but the modern formulation as *spontaneous symmetry breaking* belongs to Anderson and the Nambu–Goldstone programme [5].\n\nTwo extensions of (b) deserve flagging because they are routinely misclassified. First, *antiferromagnets and ferrimagnets* [7]: $T$ alone is broken in a Néel state, but $T\\cdot\\tau$ — $T$ composed with a sublattice-connecting translation — is preserved. This combined antiunitary symmetry protects Kramers-like degeneracies in centrosymmetric antiferromagnets and is the antiunitary half of the Shubnikov magnetic-group classification [15]. \"AFM breaks TRS\" is a half-truth that miscounts degeneracies if one stops there. Second, *anomalous Hall and Chern insulators*: the Haldane model [17] is an explicit band Hamiltonian with complex next-nearest-neighbour hoppings whose phases sum to zero flux per unit cell. At the single-particle level it is sense (a); in any microscopic realisation the T-breaking complex hopping is supplied either by an underlying spontaneous magnetic order (sense (b)) or by an external T-odd drive. The pedagogical importance of [17] is precisely that it severs \"broken TRS\" from \"applied $\\mathbf{B}$\" [16].\n\n### (c) Fundamental T-violation in the Lagrangian\n\nA statement about the *action*, not about any state or any effective $H$. The CPT theorem [13] establishes that, given Lorentz invariance, locality, and hermiticity, any T-violating piece of $\\mathcal{L}$ is equivalent to a CP-violating piece. The experimental anchor is the 1964 observation of $K^0_L\\to\\pi\\pi$ by Christenson, Cronin, Fitch, and Turlay [14], which by CPT is a measurement of fundamental T-violation; the dedicated direct measurement followed in CPLEAR by comparing $K^0\\to\\bar K^0$ and $\\bar K^0\\to K^0$ rates (1998, verify).\n\nThe Standard Model parameterises this in two places: the single physical phase $\\delta_{\\mathrm{CP}}$ of the CKM matrix, and the strong-sector $\\theta$-term $\\mathcal{L}_\\theta=\\theta\\,(g_s^2/32\\pi^2)\\,G^a_{\\mu\\nu}\\tilde G^{a\\,\\mu\\nu}$, which is T-odd and whose smallness ($|\\theta|\\lesssim 10^{-10}$ from neutron-EDM bounds) is the strong-CP problem. Crucially, (c) is not a property of any condensed-matter system: when a solid-state paper writes \"TRS-breaking term\" it almost always means (a). Equating CP-violation in $K$-mesons with a ferromagnet's broken symmetry — done occasionally even in serious texts — is the most consequential conflation in this taxonomy [18, 19].\n\n### (d) Non-equilibrium effective breaking\n\nA driven-dissipative system in a non-equilibrium steady state (NESS) carries non-zero probability currents in configuration space; detailed balance, $W(x\\to y)\\,\\pi_{\\mathrm{ss}}(x)=W(y\\to x)\\,\\pi_{\\mathrm{ss}}(y)$, fails. This is *not* an antiunitary-symmetry statement about $H$. The underlying microscopic dynamics is generically still T-invariant; what fails is the time-reversal symmetry of the *trajectory ensemble*, quantified by\n$$\\Sigma \\;=\\; \\Big\\langle\\ln \\frac{\\mathcal{P}[\\gamma]}{\\mathcal{P}[\\bar\\gamma]}\\Big\\rangle\\;\\geq\\;0,$$\nthe mean entropy production whose distribution satisfies the Gallavotti–Cohen, Crooks, and Jarzynski fluctuation theorems. These theorems *rest on* underlying microscopic T-symmetry; they quantify how strongly the steady state departs from one in which $T$ would act trivially. Floquet \"time crystals\" sit here as well: they break a discrete time-translation symmetry of the drive, not TRS in the antiunitary sense, and the no-go theorems for equilibrium time crystals do not bind them.\n\n\u003csvg viewBox=\"0 0 760 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"380\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#e8e6e1\"\u003eFour senses of \"broken TRS\" — dynamics vs ensemble\u003c/text\u003e\u003ctext x=\"380\" y=\"62\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003e[T, H] = 0 ?\u003c/text\u003e\u003ctext x=\"255\" y=\"88\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7ee0a3\"\u003eYES\u003c/text\u003e\u003ctext x=\"555\" y=\"88\" text-anchor=\"middle\" font-size=\"14\" fill=\"#ff7a90\"\u003eNO\u003c/text\u003e\u003ctext x=\"36\" y=\"232\" font-size=\"14\" fill=\"#e8e6e1\" transform=\"rotate(-90 36 232)\"\u003eT|ψ⟩ = e^{iφ}|ψ⟩ ?\u003c/text\u003e\u003ctext x=\"80\" y=\"168\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7ee0a3\"\u003eYES\u003c/text\u003e\u003ctext x=\"80\" y=\"312\" text-anchor=\"middle\" font-size=\"14\" fill=\"#ff7a90\"\u003eNO\u003c/text\u003e\u003crect x=\"110\" y=\"100\" width=\"290\" height=\"130\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"255\" y=\"135\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003eparamagnet / vacuum\u003c/text\u003e\u003ctext x=\"255\" y=\"165\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003eno T-odd order parameter\u003c/text\u003e\u003ctext x=\"255\" y=\"200\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003e— baseline —\u003c/text\u003e\u003crect x=\"410\" y=\"100\" width=\"290\" height=\"130\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"555\" y=\"128\" text-anchor=\"middle\" font-size=\"14\" fill=\"#ffb86b\"\u003e(a) Explicit breaking of H\u003c/text\u003e\u003ctext x=\"555\" y=\"155\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003eZeeman –B·S, current bias,\u003c/text\u003e\u003ctext x=\"555\" y=\"178\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003ecirc. polarised drive\u003c/text\u003e\u003ctext x=\"555\" y=\"208\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003e⟨M⟩ forced; Kramers lifted\u003c/text\u003e\u003crect x=\"110\" y=\"248\" width=\"290\" height=\"130\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"255\" y=\"275\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7aa2ff\"\u003e(b) Spontaneous (state only)\u003c/text\u003e\u003ctext x=\"255\" y=\"300\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003eHeisenberg FM; AFM (T·τ);\u003c/text\u003e\u003ctext x=\"255\" y=\"323\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003eChern / Haldane insulator\u003c/text\u003e\u003ctext x=\"255\" y=\"352\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003e⟨M⟩ ≠ 0 with [T,H] = 0\u003c/text\u003e\u003crect x=\"410\" y=\"248\" width=\"290\" height=\"130\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"555\" y=\"270\" text-anchor=\"middle\" font-size=\"14\" fill=\"#ff7a90\"\u003e(c) Fundamental T-viol. in ℒ\u003c/text\u003e\u003ctext x=\"555\" y=\"291\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003eCKM δ_CP, θ_QCD, K⁰→ππ\u003c/text\u003e\u003ctext x=\"555\" y=\"322\" text-anchor=\"middle\" font-size=\"14\" fill=\"#ff7a90\"\u003e(d) NESS / Liouvillian\u003c/text\u003e\u003ctext x=\"555\" y=\"343\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003edrive + dissipation;\u003c/text\u003e\u003ctext x=\"555\" y=\"364\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003edetailed balance fails\u003c/text\u003e\u003ctext x=\"380\" y=\"408\" text-anchor=\"middle\" font-size=\"14\" fill=\"#e8e6e1\"\u003e(c) sharpens (a) at the action level; (d) lives in trajectory space, not in H\u003c/text\u003e\u003c/svg\u003e\n*Figure: The 2×2 separating symmetry of the dynamics from symmetry of the state. (a) and (b) are the everyday condensed-matter cases. (c) is the deepest version of (a), at the level of the Lagrangian. (d) is orthogonal to both axes: it concerns the symmetry of an ensemble of trajectories, not of any Hamiltonian.*\n\nThe order-parameter language unifies (a) and (b) but separates them from (c) and (d). In both (a) and (b) the diagnostic is a non-zero expectation value of a T-odd operator — magnetisation, Néel vector, orbital-current loop, Berry-curvature integral — and the question \"is the state T-invariant?\" reduces to whether such an order parameter is non-zero. The distinction is *why* it is non-zero: a coupling in $H$ (a), or a spontaneous choice from a T-related multiplet of degenerate states (b). In (c) the diagnostic is an observable that would vanish by CPT in a T-symmetric theory — a permanent electric dipole moment of a fundamental particle, a CP-asymmetric decay rate; the Hilbert-space state is irrelevant. In (d) the diagnostic is a non-vanishing steady-state probability current or, equivalently, a strictly positive average entropy production; no single static operator suffices.\n\nA small but useful piece of bookkeeping closes the section. The Onsager–Casimir convention discussed under (a) [12] effectively places the \"$\\mathbf{B}$ as parameter\" case in cell (b) rather than (a), because under the extended action of $T$ on parameters the dynamics *do* commute with $T$ and the symmetry survives as a reciprocity relation. The taxonomy is therefore not absolute; it is relative to a declared choice of what is dynamical and what is parameter. Making that choice explicit, every time, is the cleanest defence against the conflations the remainder of this dossier will keep encountering."}, {"id": "ferromagnetism-and-its-cousins", "title": "Ferromagnetism, Antiferromagnetism, and the Magnetic Symmetry Groups", "markdown": "## Ferromagnetism, Antiferromagnetism, and the Magnetic Symmetry Groups\n\nThe four senses of broken TRS sorted out in §3 must now be illustrated on the system that historically forced the distinction: ordered magnetism. Ferromagnetism is the prototype of *spontaneously broken* TRS — the Hamiltonian commutes with $T$, the ground state does not. Antiferromagnetism is the prototype of *combined* symmetry: $T$ alone fails, but $T\\tau$, where $\\tau$ is a sublattice-exchanging translation, is preserved. The whole apparatus of magnetic point and space groups exists to make the second statement quantitative.\n\n### The Weiss–Heisenberg–Dirac chain\n\nWeiss [4] postulated a phenomenological molecular field $H_{\\text{mol}} = N M$ acting on each atomic moment in proportion to the bulk magnetization, with self-consistency\n\n$$\nM = M_0\\, B_J\\!\\bigl(\\beta g\\mu_B J (H + N M)\\bigr).\n$$\n\nBelow $T_C = NC$ (Curie constant $C$), this admits $M\\neq 0$ at $H=0$ — the empirical fact of spontaneous magnetization, with no microscopic origin. The TRS structure is implicit but unmistakable: under $t\\to -t$, $H + NM \\to -(H + NM)$, and the self-consistency equation is invariant under $M\\to -M$, yet selects $|M|\\neq 0$.\n\nHeisenberg [6] supplied the mechanism: Coulomb exchange between non-orthogonal one-electron orbitals yields an effective spin–spin coupling\n\n$$\nH_{\\text{Heis}} \\;=\\; -\\sum_{\\langle ij\\rangle} J_{ij}\\,\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j.\n$$\n\nDirac (verify; *Proc. R. Soc. A* 123, 714, 1929) immediately recast the exchange interaction on a spin-$\\tfrac12$ pair as the permutation $P_{ij} = \\tfrac12(1+\\boldsymbol\\sigma_i\\!\\cdot\\!\\boldsymbol\\sigma_j)$, making the spin form an identity and not just an analogy. Under the antiunitary $T$ each spin reverses, $T\\mathbf{S}_iT^{-1} = -\\mathbf{S}_i$, so $\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j$ is *even* and $[H_{\\text{Heis}},T]=0$. Nothing in the Hamiltonian distinguishes \"up\" from \"down\".\n\nThe ferromagnetic ground state with $J\u003e0$ on a bipartite lattice nevertheless has $\\langle \\mathbf{S}_i\\rangle = S\\,\\hat n$ for some direction $\\hat n$. Applying $T$ to this state gives $\\langle T\\psi|\\mathbf{S}_i|T\\psi\\rangle = -S\\,\\hat n$. The two states $|\\psi_{\\hat n}\\rangle$ and $|\\psi_{-\\hat n}\\rangle$ are orthogonal in the thermodynamic limit — an Anderson superselection sector [5] — and $T$ exchanges them: TRS is spontaneously broken to a $\\mathbb Z_2$ coset. The order parameter $\\mathbf{M} = g\\mu_B\\sum_i\\langle\\mathbf{S}_i\\rangle$ transforms as $T\\mathbf MT^{-1} = -\\mathbf M$ — Ising-like along the easy axis once spin–orbit anisotropy lifts the continuous SU(2) of the bare exchange. (The continuous part of the broken symmetry produces the Goldstone magnon; the *discrete* TRS coset is what makes the ordered manifold double-valued.)\n\nNéel's Nobel lecture [8] credits Weiss for the *idea* and Heisenberg for the *mechanism* in exactly that order, and emphasises that the molecular-field picture survives quantitatively only above $T_C$ and in the saturated regime — a validity remark the textbooks tend to elide.\n\n### Néel and the surviving combined symmetry\n\nFor antiferromagnets and ferrimagnets [7], the magnetic unit cell contains at least two sublattices $A,B$ with $\\langle\\mathbf S_A\\rangle = -\\langle\\mathbf S_B\\rangle$ (collinear AFM) or $|\\langle\\mathbf S_A\\rangle|\\neq|\\langle\\mathbf S_B\\rangle|$ (ferri). The order parameter is the *Néel vector* $\\mathbf L = \\langle\\mathbf S_A\\rangle - \\langle\\mathbf S_B\\rangle$, with $\\mathbf M = 0$ in the collinear AFM. Under $T$, $\\mathbf L \\to -\\mathbf L$, so a naive reading concludes \"AFM breaks TRS just like FM\".\n\nIt does not. Let $\\tau$ be a primitive translation of the *chemical* lattice that maps $A\\to B$. Then $\\tau\\mathbf L\\tau^{-1} = -\\mathbf L$, so the composite $T\\tau$ leaves $\\mathbf L$ invariant. Acting on Bloch states, $T\\tau$ is antiunitary and inverts crystal momentum just as $T$ does, but $(T\\tau)^2 = T^2\\,e^{-i\\mathbf k\\cdot\\mathbf R_\\tau}$ now carries a momentum-dependent phase rather than a universal $\\pm 1$. This combined antiunitary is the symmetry that survives Néel order, and ignoring it is the single most consequential mistake one can make in AFM band theory.\n\n### Shubnikov colour groups and Tavger–Zaitsev\n\nThe general framework was built in Moscow. Shubnikov (1951) introduced *antisymmetry*: a two-valued colour (\"black/white\", i.e. spin up/down) that group elements may permute (consolidated with Belov in [15], 1964). The output is the 1651 *magnetic space groups* — 230 ordinary \"colourless\" groups for diamagnets, 230 \"grey\" groups that contain $T$ as an independent element for paramagnets, and 1191 \"black-and-white\" groups that contain $T$ only in combination with a non-trivial spatial operation. AFM and ferrimagnetic structures live in the third class. Tavger and Zaitsev (verify; *Sov. Phys. JETP* 3, 430, 1956) reduced this to the 122 *magnetic point groups* that govern macroscopic tensor responses: which scalars and pseudoscalars survive, which off-diagonal magnetoelectric coefficients are allowed, which Hall-like responses are forbidden. Dzyaloshinskii [20] used precisely this apparatus to predict the magnetoelectric effect in Cr₂O₃, whose magnetic point group $\\bar3'm'$ permits a linear $\\alpha_{ij}E_jH_i$ coupling while forbidding spontaneous $\\mathbf M$.\n\nThe credit history is uncomfortable. The classification almost universally called \"magnetic point groups\" predates by decades the condensed-matter pedagogy that uses it; modern topological-band-theory papers routinely deploy the Shubnikov–Belov–Tavger–Zaitsev tables wholesale without citing them.\n\n### Why $T\\tau$ protects degeneracies and $\\mathbb Z_2$ indices\n\nThe spectral consequences are sharp. Suppose $[H, T\\tau]=0$ with $(T\\tau)^2 = -e^{-i\\mathbf k\\cdot\\mathbf R_\\tau}$ on a Bloch state at momentum $\\mathbf k$. At momenta $\\mathbf k_*$ where $\\mathbf k_*\\cdot\\mathbf R_\\tau \\in 2\\pi\\mathbb Z$ (so $(T\\tau)^2 = -1$) a *Kramers-like* degeneracy reappears: $|\\psi_{\\mathbf k_*}\\rangle$ and $T\\tau|\\psi_{\\mathbf k_*}\\rangle$ are orthogonal, pairing every level. This is the basis of the $\\mathbb Z_2$ classification of AFM topological insulators (Mong–Essin–Moore 2010, verify): the topological index is defined at $T\\tau$-invariant momenta and counts the parity of band inversions there. Treating the AFM as merely \"TRS-broken\" loses both the degeneracy and the invariant.\n\nResponse selection rules follow the same logic. Any tensor $\\chi$ must satisfy $\\chi = (T\\tau)\\chi(T\\tau)^{-1}$. On the anomalous Hall vector $\\boldsymbol\\sigma^{AH}$ — a $T$-odd axial vector that the bare $T$ alone would already forbid — the constraint from $T\\tau$ acting on a collinear AFM state forbids $\\boldsymbol\\sigma^{AH}\\parallel \\mathbf L$ as well: anomalous Hall is *zero* in a collinear AFM despite $T$ being broken. Only when $T\\tau$ is *also* broken — by spin canting, non-collinear order, or the spin-split bands of an altermagnet — does the Hall response open. The textbook short-cut \"AFM breaks TRS, so all $T$-odd responses are allowed\" is wrong, and the magnetic-group bookkeeping is exactly what tells one which responses are still locked. The regime where $T\\tau$ itself fails is what §8 will reach.\n\nThe lesson of §3 in concrete form: FM and AFM both break $T$, but only one of them breaks every antiunitary symmetry the lattice supports, and the difference is the entire content of magnetic-group theory."}, {"id": "trs-without-magnetic-field", "title": "Severing TRS from B: Haldane, Anomalous Hall, and Magnetoelectrics", "markdown": "## Severing TRS from B: Haldane, Anomalous Hall, and Magnetoelectrics\n\nThree threads converge in this section. The first is empirical: the anomalous Hall effect, observed by E. H. Hall in iron in 1881, shows a transverse voltage proportional to the magnetisation rather than to the applied field — already evidence that \"TRS broken by something\" need not equal \"applied $B$ field\". The second is theoretical: Karplus and Luttinger in 1954 located the intrinsic part of this response in the Bloch-band wavefunctions themselves; what was missing was a clean lattice model that made the point unambiguous (verify). The third is symmetric: in 1959 Dzyaloshinskii predicted the linear magnetoelectric effect in Cr₂O₃, the cleanest example of a state that breaks $T$ and $P$ separately while preserving $PT$ [20].\n\nThe sharpest severing of \"TRS breaking\" from \"applied magnetic field\" is the 1988 Haldane model [17].\n\n### The Haldane construction\n\nTake a honeycomb lattice with two sublattices $A$ and $B$. The Hamiltonian has three terms,\n\n$$H = t_1 \\sum_{\\langle ij \\rangle} c_i^\\dagger c_j \\;+\\; t_2 \\sum_{\\langle\\!\\langle ij \\rangle\\!\\rangle} e^{i\\nu_{ij}\\phi}\\, c_i^\\dagger c_j \\;+\\; M \\sum_i \\xi_i\\, c_i^\\dagger c_i,$$\n\nwith $t_1$ real nearest-neighbour hopping, $t_2$ next-nearest-neighbour (NNN) hopping carrying a phase $\\phi$, signs $\\nu_{ij}=\\pm 1$ fixed by the chirality of the NNN bond around its hexagon, and $\\xi_i = \\pm 1$ on the two sublattices — the Semenoff mass that breaks inversion.\n\nThe crucial geometric fact: each NNN bond lies entirely within a single sublattice, and the three NNN bonds around an inscribed $A$-triangle and the corresponding $B$-triangle carry phases that sum to $+3\\phi$ and $-3\\phi$ respectively. Per hexagonal unit cell the total flux is zero. There is no net $B$ field anywhere on average, no Landau levels, no Aharonov–Bohm phase that one could attribute to a uniform background vector potential. The flux is *staggered*, and TRS is broken only because the complex hopping phases are not invariant under $T:\\, e^{i\\phi}\\to e^{-i\\phi}$.\n\nFor $\\phi \\notin \\{0,\\pi\\}$ and $|M| \u003c 3\\sqrt{3}\\,|t_2 \\sin\\phi|$, the lower band carries Chern number $C = -\\mathrm{sgn}(\\sin\\phi)$ and the Hall conductivity is exactly $\\sigma_{xy} = C\\, e^2/h$. Tune $M$ across the boundary and one of the two Dirac cones (at $K$ or $K'$) inverts its mass; the Chern number jumps by $\\pm 1$. This is the entire content of \"topology from broken TRS without $B$\" [17].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003ePhase diagram of the Haldane model\u003c/title\u003e\u003cpath d=\"M 360,200 Q 500,-40 640,200 Q 500,440 360,200 Z\" fill=\"#7aa2ff\" fill-opacity=\"0.18\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 80,200 Q 220,-40 360,200 Q 220,440 80,200 Z\" fill=\"#ffb86b\" fill-opacity=\"0.18\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"80\" y1=\"40\" x2=\"80\" y2=\"360\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/\u003e\u003cline x1=\"640\" y1=\"40\" x2=\"640\" y2=\"360\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/\u003e\u003cline x1=\"360\" y1=\"40\" x2=\"360\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/\u003e\u003cline x1=\"80\" y1=\"200\" x2=\"680\" y2=\"200\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"360\" y1=\"36\" x2=\"360\" y2=\"364\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"80\" y1=\"196\" x2=\"80\" y2=\"204\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"220\" y1=\"196\" x2=\"220\" y2=\"204\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"500\" y1=\"196\" x2=\"500\" y2=\"204\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"640\" y1=\"196\" x2=\"640\" y2=\"204\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"356\" y1=\"80\" x2=\"364\" y2=\"80\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"356\" y1=\"320\" x2=\"364\" y2=\"320\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"80\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003e−π\u003c/text\u003e\u003ctext x=\"220\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003e−π/2\u003c/text\u003e\u003ctext x=\"500\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eπ/2\u003c/text\u003e\u003ctext x=\"640\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eπ\u003c/text\u003e\u003ctext x=\"370\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"start\" font-family=\"serif\"\u003e0\u003c/text\u003e\u003ctext x=\"700\" y=\"205\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\" font-style=\"italic\"\u003eφ\u003c/text\u003e\u003ctext x=\"352\" y=\"84\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\" font-family=\"serif\"\u003e+1\u003c/text\u003e\u003ctext x=\"352\" y=\"324\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\" font-family=\"serif\"\u003e−1\u003c/text\u003e\u003ctext x=\"354\" y=\"32\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\" font-family=\"serif\"\u003eM / (3√3 t₂)\u003c/text\u003e\u003ctext x=\"500\" y=\"206\" fill=\"#7aa2ff\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"serif\"\u003eC = −1\u003c/text\u003e\u003ctext x=\"220\" y=\"206\" fill=\"#ffb86b\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"serif\"\u003eC = +1\u003c/text\u003e\u003ctext x=\"620\" y=\"90\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eC = 0 (trivial)\u003c/text\u003e\u003ctext x=\"100\" y=\"90\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eC = 0 (trivial)\u003c/text\u003e\u003ctext x=\"620\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eC = 0 (trivial)\u003c/text\u003e\u003ctext x=\"100\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eC = 0 (trivial)\u003c/text\u003e\u003ctext x=\"80\" y=\"32\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\" font-family=\"serif\"\u003eT-symmetric\u003c/text\u003e\u003ctext x=\"640\" y=\"32\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\" font-family=\"serif\"\u003eT-symmetric\u003c/text\u003e\u003ctext x=\"360\" y=\"392\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\" font-family=\"serif\"\u003ephase boundaries: M = ±3√3 t₂ sin φ (Dirac gap closes at K or K′)\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Phase diagram of the Haldane model in the $(\\phi, M)$ plane. The two lens-shaped regions carry $\\sigma_{xy} = \\pm e^2/h$ despite zero net flux per unit cell; the red-dashed lines $\\phi=0,\\pm\\pi$ are the TRS-invariant slices, on which only the trivial $C=0$ phase exists.*\n\n### The anomalous Hall effect as a Berry-curvature integral\n\nFor any insulator the intrinsic Hall conductivity is the Brillouin-zone integral\n\n$$\\sigma_{xy} = -\\frac{e^2}{\\hbar} \\sum_{n \\in \\text{occ}} \\int_{\\text{BZ}} \\frac{d^2k}{(2\\pi)^2}\\, \\Omega_n(\\mathbf{k}), \\qquad \\Omega_n(\\mathbf k) = i \\langle \\partial_{k_x} u_n | \\partial_{k_y} u_n\\rangle - (x\\!\\leftrightarrow\\!y).$$\n\nUnder $T$, the Berry curvature transforms as $\\Omega_n(\\mathbf{k}) \\to -\\Omega_n(-\\mathbf{k})$. A T-invariant band Hamiltonian therefore has $\\sigma_{xy}\\equiv 0$ once the BZ integration is done. Breaking $T$ — by *any* mechanism — opens the possibility of a non-vanishing $\\sigma_{xy}$. Haldane's model is the bare-minimum lattice model that realises this without invoking a vector potential. The TKNN (Thouless–Kohmoto–Nightingale–den Nijs, 1982) integer is the same Chern number; the AHE in ferromagnetic metals (Karplus–Luttinger 1954, vindicated through the early 2000s as the dominant intrinsic mechanism in many transition-metal ferromagnets) is its partial-occupation cousin (verify).\n\nThe conceptual partition is now clean:\n- **TRS broken by a $B$ field**: $\\Omega(\\mathbf k)$ acquires an orbital contribution; Landau levels appear; $\\sigma_{xy}$ is quantised in the integer QHE.\n- **TRS broken by the state**: exchange-split bands have $\\Omega(\\mathbf k)\\neq -\\Omega(-\\mathbf k)$; $\\sigma_{xy}$ is the AHE — quantised if a band is a Chern band, continuous otherwise.\n- **TRS broken by the Hamiltonian without $B$**: the Haldane phases. Same low-energy theory as IQHE, no tesla of field anywhere.\n\n### Magnetoelectrics: PT survives where T and P die\n\nCr₂O₃ in its corundum structure has crystallographic inversion. The magnetic ordering — Cr³⁺ spins along the $c$-axis in a $(\\uparrow\\downarrow\\downarrow\\uparrow)$ pattern — breaks $T$ (spins flip) and breaks the crystal $P$ (which interchanges $\\uparrow$ and $\\downarrow$ Cr sites), yet the composite $PT$ leaves the state invariant. Dzyaloshinskii showed in 1959 that exactly this symmetry profile permits a *linear* magnetoelectric tensor,\n\n$$P_i = \\alpha_{ij}\\, H_j, \\qquad M_i = \\alpha_{ji}\\, E_j,$$\n\nwith $\\alpha_{ij}$ a pseudotensor odd under both $T$ and $P$ separately, even under $PT$ [20]. Astrov's 1960 measurement confirmed it within the year (verify). The systematic accounting of *which* magnetic point groups admit *which* tensors — Shubnikov's 1951 colour-group monograph, consolidated by Belov and Shubnikov [15] — is what made these statements predictive rather than empirical.\n\nThis is the cleanest live counterexample to two persistent slogans. \"Broken TRS implies a time-odd transport response\" is false in any pure form: $\\alpha$ is a time-odd pseudotensor coexisting with ordinary time-even ones, and which components survive is dictated by the *residual* magnetic point group, not by the bare fact of T-breaking. \"Antiferromagnets have no Hall response\" is also false; what is true is that $PT$-symmetry forces the $\\mathbf k$-integrated $\\sigma_{xy}$ to vanish — relax $PT$ (as in the non-collinear AFMs Mn₃Sn, Mn₃Ge) and a large intrinsic AHE returns despite zero net moment.\n\n### TRS as a classifying symmetry: the tenfold way\n\nThe modern home of these distinctions is the Altland–Zirnbauer classification (1997), in which the only data needed to place a non-interacting Hamiltonian in one of ten symmetry classes are: time-reversal $T$ with $T^2=+1,-1,$ or absent; particle-hole $C$ with $C^2=+1,-1,$ or absent; and chiral $S=TC$, present or absent.\n\nHaldane's model sits in class A (no $T$, no $C$, no $S$) in $d=2$: classification $\\mathbb Z$, label = Chern number. A T-invariant 2D insulator with $T^2 = -1$ sits in class AII: classification $\\mathbb Z_2$, label = Kane–Mele index — Kramers degeneracy at the time-reversal-invariant momenta is the structural reason the integer flattens to a parity. Haldane's Nobel lecture is explicit that the periodic table is the right global map and that his 1988 toy was an early data point on it [16].\n\nThe lesson the tenfold way encodes — and the lesson this dossier insists on — is that \"TRS\" is not a yes/no badge stuck onto a Hamiltonian. It is one of three operators whose presences and squares jointly dictate what topological invariants the system can carry. \"Broken TRS\" with no further qualifier tells you only that you have left class AII (or AI) for some other class; *which* other class — A, D, C, BDI, … — is what governs the physics, and conflating the exit from AII with a unique destination is precisely the error this section is meant to retire."}, {"id": "fundamental-t-violation", "title": "Fundamental T-Violation: From Lüders–Pauli CPT to Cronin–Fitch–Turlay", "markdown": "## Fundamental T-Violation: From Lüders–Pauli CPT to Cronin–Fitch–Turlay\n\nThe four senses of broken TRS catalogued in §3 share a word, not a physics. Sense (c) — a genuine asymmetry in the microscopic laws — sits on the opposite side of an ontological line from senses (a), (b), and (d). Weiss-type spontaneous breaking lives in the *state*: the Hamiltonian commutes with $T$, the ground state does not, and one can in principle prepare the time-reversed configuration by an experimentally accessible operation (flip every spin). Fundamental T-violation lives in the *Lagrangian*: no preparation, no thermodynamic limit, no external field will recover the symmetry, because the symmetry was never there. The mistake of treating the two on the same footing — \"$K_L^0 \\to \\pi\\pi$ is just another TRS-breaking phase, like a ferromagnet\" — recurs often enough that it deserves a separate section.\n\n### The CPT theorem and the Lüders–Pauli credit problem\n\nThe relevant invariance principle for relativistic local quantum field theory is not $T$ alone but the combined antiunitary operation $\\Theta = CPT$. Under very general assumptions — Lorentz invariance, locality (microcausality), the spin–statistics connection, and a stable lowest-energy state — any Hermitian Lagrangian density built from local field operators is invariant under $\\Theta$. The proof exists in two complementary flavours: a Lagrangian/field-theoretic version due to Lüders [13], and an axiomatic version in the Wightman framework due to Jost (1957), where $CPT$ invariance becomes equivalent to *weak local commutativity* at Jost points.\n\nThe textbook citation is almost invariably \"Pauli 1955\" — the essay \"Exclusion principle, Lorentz group and reflection of space-time and charge\" in the Niels Bohr 70th-birthday Festschrift. Pauli's contribution is real: he gave the cleanest published statement, tied the theorem firmly to spin–statistics, and put it in front of every working field theorist. But the priority belongs to Lüders [13], whose 1954 Mat.-Fys. Medd. paper Pauli himself cites as the source. Schwinger (1951, on charge conjugation) and Bell (1955, in his Birmingham thesis) are also part of the genealogy. The clean historical statement is: Lüders proved it, Pauli explained it, Jost axiomatised it. Calling the result \"Pauli's theorem\" is shorthand of the same kind as calling Onsager–Casimir \"Onsager\" — it elides the contribution that actually did the technical work.\n\nFor our purposes the consequence is sharp. If $\\Theta = CPT$ is an exact symmetry, then any observed CP violation is, *by theorem*, accompanied by an equal and opposite T-violation:\n\n$$\\text{CPT exact} \\;\\Longrightarrow\\; \\mathcal{A}_{CP} \\neq 0 \\;\\Longleftrightarrow\\; \\mathcal{A}_{T} \\neq 0.$$\n\nThis is the logical bridge from the 1964 K-meson discovery to a statement about time-reversal in the laws of nature. Without it, \"CP violation\" and \"T violation\" would be empirically independent.\n\n### Christenson, Cronin, Fitch, Turlay 1964\n\nThe Brookhaven experiment of Christenson, Cronin, Fitch, and Turlay [14] looked at the long-lived neutral kaon $K_L^0$ decaying in flight inside a helium bag at the end of a 57-foot vacuum tube. In the Gell-Mann–Pais picture, $K_L^0$ is the (nearly) CP-odd combination of $K^0$ and $\\bar{K}^0$ and should not decay to the CP-even $\\pi^+ \\pi^-$ state. The signature was a small peak ($\\sim 45$ events out of $\\sim 22{,}700$ decays, branching ratio $\\approx 2 \\times 10^{-3}$) at $\\cos\\theta = 1$ in the angle between the reconstructed two-pion momentum and the beam direction, with invariant mass at the kaon. The result implied $\\eta_{+-} = A(K_L \\to \\pi^+\\pi^-)/A(K_S \\to \\pi^+\\pi^-) \\neq 0$, and hence direct evidence that CP is not exact.\n\nThe Nobel was awarded in 1980 to Cronin and Fitch [18]. Christenson and Turlay are equally on the paper; the standard pedagogical contraction to \"Cronin–Fitch\" is one of the cleanest examples in modern physics of the Matthew effect amplified by the prize roster. Cronin's lecture itself is careful to name all four collaborators and the wider Princeton/Brookhaven team. In a section that is explicitly about credit audit, one writes *Christenson–Cronin–Fitch–Turlay*.\n\nA second priority correction belongs here. Indirect evidence that something was off in the neutral-kaon system existed before 1964 — the $K_L$–$K_S$ mass splitting and the regeneration phenomena of Pais and Piccioni (1955) — but those are *CP-conserving* consequences of $K^0$–$\\bar K^0$ mixing. Direct CP violation in *decay* (sometimes called $\\epsilon'$, established by NA31 / NA48 / KTeV decades later) is a separate phenomenon from the *mixing* CP violation ($\\epsilon$) that Christenson et al. discovered. Conflating $\\epsilon$ and $\\epsilon'$ is a routine error in popular accounts.\n\n### Direct T-violation: CPLEAR and B-factory measurements\n\nChristenson et al. measured CP, not T. The CPT theorem implies the T-violation, but a direct measurement is methodologically distinct and was not achieved until 1998. The CPLEAR collaboration at CERN exploited tagged $K^0$ and $\\bar K^0$ produced in $p\\bar p \\to K^\\mp \\pi^\\pm K^0(\\bar K^0)$ annihilations and compared the time-dependent rates of $K^0 \\to \\bar K^0$ and $\\bar K^0 \\to K^0$. A non-zero Kabir asymmetry,\n\n$$A_T \\;=\\; \\frac{R(\\bar K^0 \\to K^0) - R(K^0 \\to \\bar K^0)}{R(\\bar K^0 \\to K^0) + R(K^0 \\to \\bar K^0)} \\;\\approx\\; (6.6 \\pm 1.6) \\times 10^{-3},$$\n\nis *direct* evidence that the underlying dynamics is not T-symmetric. The result is what one would have predicted from $\\epsilon$ and CPT, but CPLEAR demonstrated it without invoking the CPT theorem. BaBar (2012) extended this to the $B^0$ system with a four-way comparison of flavor- and CP-tagged transitions exploiting EPR-correlated $B^0 \\bar B^0$ pairs from $\\Upsilon(4S)$, yielding a $14\\sigma$ T-asymmetry. After BaBar 2012 the existence of T-violation in nature is established independently of any appeal to CPT.\n\n### EDMs: the precision frontier\n\nAn electric dipole moment $\\vec d$ of a non-degenerate state, aligned with its spin $\\vec S$, would imply an interaction $H_{EDM} = -d\\, \\vec S \\cdot \\vec E / S$. Under $T$, $\\vec S \\to -\\vec S$ while $\\vec E$ is invariant, so $H_{EDM}$ flips sign: a permanent EDM is a $T$-odd, $P$-odd interaction whose existence directly tests fundamental T-violation. The Standard-Model CKM contribution to the electron EDM is $|d_e| \\lesssim 10^{-38}\\, e\\cdot{\\rm cm}$, many orders below current sensitivity, so any non-zero signal at the present level would be new physics. The bound from ACME II (ThO molecules, 2018) and JILA (HfF$^+$ ions, 2023) stands at $|d_e| \u003c 4.1 \\times 10^{-30}\\, e\\cdot{\\rm cm}$ (verify), and the neutron EDM bound is $|d_n| \u003c 1.8 \\times 10^{-26}\\, e\\cdot{\\rm cm}$ (verify) — the latter being the empirical anchor of the *strong CP problem* and the motivation for the Peccei–Quinn axion.\n\n### Why this is categorically not Weiss-type breaking\n\nThree structural differences settle the matter.\n\n(i) *Locus.* Spontaneous TRS breaking is a property of a state $|\\Omega\\rangle$ with $[H,T]=0$ but $T|\\Omega\\rangle \\neq e^{i\\alpha}|\\Omega\\rangle$ [4, 6, 5]. Fundamental T-violation is a property of $H$ itself: $[H,T] \\neq 0$, with no state-dependence at all. The ferromagnetic ground state has a domain-reversed partner of identical energy; the CKM Lagrangian has no T-conjugate partner anywhere in its parameter space.\n\n(ii) *Reversibility of preparation.* A ferromagnet can be demagnetised, the spin configuration can be flipped, the symmetric ensemble can be assembled by averaging over domains. There is no analogous operation on the weak Lagrangian.\n\n(iii) *Counting of broken symmetries.* Spontaneous breaking of a discrete symmetry (FM, $\\mathbb Z_2$) gives domain walls, no Goldstone modes, and a sharp order parameter ($\\vec M$). Fundamental T-violation gives no order parameter, no domain wall, no phase transition — only a complex phase ($\\delta_{CKM}$, $\\bar\\theta_{QCD}$) in the action that cannot be rotated away by field redefinitions.\n\nThe cleanest one-line slogan: Weiss broke TRS in a *state*, Christenson–Cronin–Fitch–Turlay (via Lüders' theorem) showed nature broke it in the *action*. The two phenomena answer different questions and deserve different vocabularies — a discipline §7 will need when we cross into non-equilibrium, where the locus of \"broken TRS\" shifts a third time."}, {"id": "nonequilibrium-and-time-crystals", "title": "Non-Equilibrium TRS: Detailed Balance, Fluctuation Theorems, and Time Crystals", "markdown": "## Non-Equilibrium TRS: Detailed Balance, Fluctuation Theorems, and Time Crystals\n\nThe four senses of broken TRS sorted out in §3 were all framed around closed Hamiltonian dynamics. Once a system is driven, dissipative, or both, three further notions begin to circulate under the same label: detailed balance, microscopic reversibility, and time-translation symmetry. They are not the same notion, and the literature slides between them constantly. The slide is most consequential in the time-crystal corner, where a discrete symmetry of a drive periodically gets rebranded as the antiunitary $T$ of §2.\n\n### Detailed balance is not microscopic reversibility\n\nFor a Markov process on configurations $\\mathcal{C}$ with rates $W(\\mathcal{C} \\to \\mathcal{C}')$ and stationary distribution $P_\\mathrm{st}$, detailed balance is the local condition\n\n$$P_\\mathrm{st}(\\mathcal{C})\\,W(\\mathcal{C}\\to\\mathcal{C}') = P_\\mathrm{st}(\\mathcal{C}')\\,W(\\mathcal{C}'\\to\\mathcal{C}).$$\n\nA non-equilibrium steady state (NESS) is one where $P_\\mathrm{st}$ is still stationary but probability currents $J(\\mathcal{C}\\to\\mathcal{C}') = P_\\mathrm{st}(\\mathcal{C})W(\\mathcal{C}\\to\\mathcal{C}') - (\\mathcal{C}\\leftrightarrow\\mathcal{C}')$ are non-zero on some loops in configuration space. This is the precise content of \"broken detailed balance\".\n\nMicroscopic reversibility is the statement that the underlying *unitary* dynamics (or its classical analogue) is invariant under $T$ — in the Onsager–Casimir form, with the convention $B \\to -B$ on any external time-odd parameter [2, 3, 12]. A driven Hamiltonian system that produces a NESS via coupling to two thermal reservoirs at different temperatures has fully $T$-symmetric microscopic equations of motion and yet a steady state that violates detailed balance. The distinction was emphasised in Onsager's papers in passing and made operationally sharp by the next generation: detailed balance is a property of the *projected* dynamics on coarse-grained states, not of the underlying Liouvillian.\n\nThis is the same conflation, in a new guise, between $T$-breaking of the Hamiltonian (sense (a) of §3) and $T$-breaking of the state (sense (b)). The NESS realises a fourth species: a state that breaks neither $T$ of $H$ nor any spatial symmetry, but breaks the *equilibrium* condition itself. Calling this \"broken TRS\" is a category error that nonetheless saturates the literature on driven open systems.\n\n### Fluctuation theorems *use* microscopic TRS to *quantify* non-equilibrium\n\nThe deepest result of late-twentieth-century statistical mechanics in this corner is that the asymmetry of trajectories in a driven system is controlled by a microscopic identity that itself rests on $T$. Three near-simultaneous discoveries are routinely conflated:\n\n- **Gallavotti–Cohen (1995)** for thermostated chaotic dynamics in NESS: the large-deviation function $e(\\sigma)$ for the entropy production rate satisfies $e(\\sigma) - e(-\\sigma) = \\sigma$. The proof requires a reversible Anosov flow and the chaotic hypothesis ([Gallavotti \u0026 Cohen, PRL 74, 2694](https://link.aps.org/doi/10.1103/PhysRevLett.74.2694)).\n- **Jarzynski (1997)**: for a system driven by an external protocol from one equilibrium to a *non-equilibrium* endpoint, $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$, where the average is over many realisations and $\\Delta F$ is the equilibrium free-energy difference ([Jarzynski, PRL 78, 2690](https://link.aps.org/doi/10.1103/PhysRevLett.78.2690)).\n- **Crooks (1999)**: the ratio of forward and reverse trajectory probabilities is $P_F(W)/P_R(-W) = e^{\\beta(W-\\Delta F)}$. Jarzynski's identity is the first moment of Crooks' ([Crooks, PRE 60, 2721](https://doi.org/10.1103/PhysRevE.60.2721)).\n\nThe structural point is the same in all three: the derivation begins by writing a trajectory probability $\\mathcal{P}[\\gamma]$ and the time-reversed-protocol probability $\\mathcal{P}^*[\\bar\\gamma]$ for the reversed trajectory, then applies *microscopic reversibility* — the antiunitary $T$ acting on the dynamics with $B \\to -B$ — to relate the two. The non-equilibrium asymmetry being measured (entropy production, dissipated work) is the *consequence* of breaking detailed balance; the identity that *quantifies* it survives only because $T$ remains a symmetry of the microscopic generator. The Hatano–Sasa extension to transitions between NESS preserves this logic.\n\nA statement one therefore hears — \"fluctuation theorems are non-equilibrium expressions of TRS\" — is correct only with the right reading. They are statements *about* macroscopic irreversibility that exist *because* microscopic dynamics is $T$-symmetric. A system in which $T$ is genuinely broken in $H$ (a CP-violating sector; an explicit time-odd Hamiltonian term not handled by the Casimir parameter convention) requires modified versions of the identities, with extra terms tracking the asymmetry that $T$ no longer enforces.\n\n### The time-crystal saga\n\nWilczek's 2012 proposal asked whether continuous time-translation symmetry could be spontaneously broken in a *ground state*, in literal analogy with crystals breaking spatial translation ([Wilczek, PRL 109, 160401](https://doi.org/10.1103/PhysRevLett.109.160401); Shapere–Wilczek classical companion, [PRL 109, 160402](https://doi.org/10.1103/PhysRevLett.109.160402)). The proposal triggered immediate objections — Bruno's superconductor counter-example (2013) and Nozières' critique — and was definitively closed off by Watanabe and Oshikawa in 2015, who proved that for a generic local Hamiltonian with not-too-long-range interactions, the equal-time–shifted correlator of any local order parameter has $\\lim_{t\\to\\infty}\\langle O(t)O(0)\\rangle_\\mathrm{eq} \\to |\\langle O\\rangle_\\mathrm{eq}|^2$ in the ground state and thermal Gibbs state, ruling out long-range temporal order ([Watanabe \u0026 Oshikawa, PRL 114, 251603](https://doi.org/10.1103/PhysRevLett.114.251603)).\n\nThe loophole is to abandon equilibrium. In a Floquet system with Hamiltonian $H(t) = H(t+T_d)$ the only time-translation symmetry is the discrete $\\mathbb{Z}$ generated by $t \\to t+T_d$. A *discrete time crystal* (DTC) is a phase in which a local observable exhibits robust subharmonic response at period $nT_d$, $n \\geq 2$, spontaneously breaking this $\\mathbb{Z}$ down to $n\\mathbb{Z}$. Stability against generic perturbations of the drive requires a mechanism that prevents heating to infinite temperature; the original 2016 constructions used many-body localisation. Khemani–Lazarides–Moessner–Sondhi identified the phase structure ([PRL 116, 250401](https://doi.org/10.1103/PhysRevLett.116.250401)); Else–Bauer–Nayak gave the symmetry-based definition and the name \"Floquet time crystal\" ([PRL 117, 090402](https://doi.org/10.1103/PhysRevLett.117.090402)).\n\nThe first experimental observations followed within a year: Zhang et al. on a trapped-ion chain ([Nature 543, 217](https://www.nature.com/articles/nature21413), 2017) and Choi et al. on NV centres in diamond (Nature 543, 221, 2017). Prethermal DTCs (Else–Machado–Nayak–Yao), critical and two-frequency variants, and superconducting-qubit realisations on Google's Sycamore (Mi et al., 2022) followed.\n\nHere is where the slide happens. A DTC breaks **discrete time-translation** — a unitary symmetry of the driven generator. It does *not* break antiunitary $T$. The two share the word \"time\" and nothing else: $T$ is the $t\\to -t$ involution of §2; the Floquet $\\mathbb{Z}$ is the $t \\to t+T_d$ translation. Many semi-popular accounts and not a few research summaries assert the latter is an instance of the former. It is not. Whether a DTC additionally breaks $T$ depends on the drive: a circularly polarised Floquet drive does (sense (a) of §3), a linearly polarised one need not, and the DTC order parameter is logically independent of either choice.\n\nDissipative time crystals add a third sub-category — open-system limit cycles of a Lindbladian $\\mathcal{L}$ that spontaneously break the continuous time-translation symmetry of $\\mathcal{L}$ in the thermodynamic limit (Iemini et al., boundary time crystals, 2018; subsequent superradiant realisations). These are NESS phenomena; the underlying microscopic dynamics is $T$-symmetric, the steady-state breaks detailed balance, and a continuous limit cycle emerges as a many-body analogue of a classical Hopf bifurcation. Whether to grant these the title \"time crystal\" is partly a labelling dispute. They are emphatically not equilibrium time crystals (Watanabe–Oshikawa applies only there), and they have no a priori relation to $T$.\n\n### Where it remains murky\n\nThree sliding points worth flagging for §8. First, the Lindbladian time-translation symmetry of an open driven system is sometimes equated with microscopic $T$; it is the analogue of detailed balance, not of $T$. Second, \"prethermal time crystal\" is used both for Floquet systems heated slowly enough to exhibit a long-lived DTC plateau and for genuinely time-independent prethermal phases with broken $\\mathrm{U}(1)$; these are distinct. Third, the question of whether MBL — the original stabilisation mechanism for the Floquet DTC — survives in dimensions $d \\geq 2$ at infinite times remains open at the rigorous level, which leaves the most robustly observed DTCs (the Sycamore and trapped-ion ones) on a prethermal rather than asymptotic footing — a subtlety routinely flattened in summaries that simply assert \"a time crystal has been observed\"."}, {"id": "frontier-and-open-problems", "title": "Current Frontier: Altermagnets, PT-symmetric Non-Hermitians, and What Remains Murky", "markdown": "## Current Frontier: Altermagnets, PT-symmetric Non-Hermitians, and What Remains Murky\n\nThe seven preceding sections have closed the historical record: by 2016 the language of broken TRS had stabilised into the four senses of §3, applied across magnetism, topology, particle physics, and stochastic thermodynamics. The decade since has not so much overturned that picture as exposed regions where it pixelates. Four such regions deserve naming: altermagnets, non-Hermitian platforms with PT or anti-PT structure, TRS-protected orders beyond the tenfold way, and the orbital-current candidate phases of kagome metals and cuprates.\n\n### Altermagnets\n\nUntil 2022 the symmetry classification of collinear magnets was binary: ferromagnet (net $M\\neq 0$, T broken globally) or antiferromagnet (T·$\\boldsymbol{\\tau}$ preserved, Kramers degeneracy on every band). The altermagnetic class, sharpened by Šmejkal, Sinova, and Jungwirth ([PRX 12, 040501; 12, 031042, 2022](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.12.040501)) and given a full spin-space-group account by Liu, Li, Han, Wan, and Liu ([PRX 12, 021016, 2022](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.12.021016)), occupies the gap. The two sublattices carry opposite moments yet are *not* related by any pure $\\boldsymbol{\\tau}$ or $P$; they are related by a *rotation* or *mirror* of the lattice. The consequence is operationally striking:\n\n$$\\varepsilon_{\\uparrow}(\\mathbf{k}) \\;=\\; \\varepsilon_{\\downarrow}(R\\mathbf{k}), \\qquad \\varepsilon_{\\uparrow}(\\mathbf{k}) \\neq \\varepsilon_{\\downarrow}(\\mathbf{k}),$$\n\nwith $R$ a non-trivial point-group element. Bands are spin-split *without spin–orbit coupling* and *without net magnetization*, with a $d$-, $g$-, or $i$-wave nodal structure in $\\mathbf{k}$-space. In the language of §4, this is a fifth Shubnikov-type situation that the Shubnikov–Belov groups [15] could not capture because they treated spin and lattice rotations as locked together; only the *spin-space groups*, in which they decouple, expose it.\n\nThe experimental status is uneven. ARPES on $\\alpha$-MnTe has reported the predicted lifting of Kramers degeneracy across $T_N$ with splittings of order $0.4$–$0.8$ eV, far larger than the spin–orbit gap, in [Krempaský et al. Nature 626, 517 (2024)](https://www.nature.com/articles/s41586-023-06907-7) and [Lee et al., PRB 109, 115102 (2024)](https://link.aps.org/doi/10.1103/PhysRevB.109.115102). The case for RuO$_2$, the original poster child, has *not* held up: $\\mu$SR and polarised-neutron diffraction in [Hiraishi et al., PRL 132, 166702 (2024)](https://journals.aps.org/prl/abstract/10.1103/PhysRevL.132.166702) and [Kessler et al., npj Spintronics 2, 50 (2024)](https://www.nature.com/articles/s44306-024-00055-y) bound any local moment well below $0.1\\,\\mu_B$, with the (100) Bragg peak originally interpreted as magnetic identified as predominantly nuclear. The principle survives, the prototype does not.\n\nThe conflation watch here is sharp. \"Altermagnetism\" is sometimes glossed as \"a new kind of TRS breaking\". It is not new in §3 sense (b): it is a spontaneous breaking of T in the state with the *same* logical status as ferromagnetism — what is novel is the *residual* symmetry $\\{T \\mid R\\}$ replacing the Néel $\\{T\\mid \\boldsymbol{\\tau}\\}$. The Onsager–Casimir [12] reciprocity is reorganised accordingly: a $d$-wave altermagnet supports a *crystal* anomalous Hall response in directions selected by $R$, even when summed magnetisation vanishes.\n\n### PT-symmetric and anti-PT non-Hermitian platforms\n\nBender and Boettcher noticed in 1998 that complex Hamiltonians invariant under $PT$ can have entirely real spectra; Mostafazadeh ([J. Math. Phys. 43, 205 (2002)](https://pubs.aip.org/aip/jmp/article/43/1/205/231022)) showed that this is a special case of *pseudo-Hermiticity*, $\\eta H \\eta^{-1} = H^{\\dagger}$ for some positive metric $\\eta$. The relevance to our dossier is that $T$ here is the antiunitary of §2, but $H$ is not Hermitian: the two structures interact through a *new* phase transition, the spontaneous breaking of PT, at which complex-conjugate eigenvalue pairs collide on the real axis at an *exceptional point* where the Hamiltonian becomes non-diagonalisable. This is genuinely outside the §3 taxonomy because the dynamics itself is non-unitary.\n\nThe Altland–Zirnbauer tenfold way invoked in [16] is enlarged accordingly. Kawabata, Shiozaki, Ueda, and Sato ([PRX 9, 041015, 2019](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.9.041015)) showed that the loss of Hermiticity bifurcates $T$ into a true antiunitary and its transpose partner, $C$ into conjugation and transposition variants, and *promotes pseudo-Hermiticity to an independent symmetry* — yielding 38 classes, of which the original ten are diagonal entries. Anti-PT systems ($\\{PT, H\\}=0$) realise a separate route: real spectra collapse to imaginary, with a different sensitivity to dissipation, and have become the natural language for [non-Hermitian cavity magnonics](https://www.researchgate.net/publication/405468566) and dissipative cold-atom chains. The non-Hermitian skin effect, in which $\\mathcal{O}(N)$ states pile up at a boundary, is a separate dimensional structure entirely.\n\nWhat is folklore here, and worth flagging: the equation \"PT symmetry $=$ time-reversal symmetry\" is wrong. $PT$ in Bender–Boettcher is unitary in even-parity sectors and antiunitary overall; it is invariance under $PT$ that is being imposed, not under $T$ alone, and the relation to a genuine arrow of time is indirect. The exceptional-point sensitivity advertised for sensing relies on a square-root spectral splitting that is intrinsically a non-unitary phenomenon — not a TRS-breaking signature in any §3 sense.\n\n### TRS-protected order beyond the tenfold way\n\nThe classification consolidated by Haldane in his Nobel lecture [16] treats $T$ as one of three internal symmetries. The crystalline-SPT programme of Chen, Kapustin, Else, Thorngren, and others has shown that adjoining space-group symmetries enlarges the table substantially: $T$-protected higher-order topological insulators with hinge or corner modes, magnetic topological crystalline insulators classified by magnetic space groups (returning Shubnikov [15] to centre stage), and beyond-cohomology phases for which the natural invariant is not a group-cohomology class. The role of $T$ in these constructions is now to enforce a *crystalline equivariant K-theory class*, not a $\\mathbb{Z}_2$ index in isolation. For experimental purposes this means that \"TRS-protected\" without specifying the accompanying crystal symmetry is now a category error.\n\n### Loop-current candidates: kagome and the pseudogap\n\nTwo condensed-matter systems remain genuinely unresolved. In the kagome metals AV$_3$Sb$_5$, polar Kerr ([Xu et al., Nature Physics 18, 1470, 2022](https://www.nature.com/articles/s41567-022-01805-7)), $\\mu$SR ([Mielke et al., Nature 602, 245, 2022](https://www.nature.com/articles/s41586-021-04327-z)), and magneto-optical signatures point to a TRS-breaking charge-density-wave phase below $\\sim 70$–$80$ K — most naturally interpreted as a chiral loop-current order. Independent measurements ([Saykin et al., PRL 130, 126001, 2023](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.130.126001)) have placed tight upper bounds on any zero-field Kerr signal, and the picture remains contested. In the cuprate pseudogap, Varma's intra-unit-cell loop-current state ([PRB 73, 155113, 2006](https://journals.aps.org/prb/abstract/10.1103/PhysRevB.73.155113)) is supported by polarised-neutron diffraction in YBCO and Hg-1201 and by polar Kerr onset at $T^{*}$, but resists detection in NMR/$\\mu$SR with the magnitudes the neutron data would imply. Both cases are best described as established TRS-breaking signals of *some* origin, with the orbital-current identification plausible but not closed.\n\n### The AETHER verdict on what remains murky\n\nEstablished: altermagnetism as a symmetry class (spin-space-group construction; ARPES on MnTe); the 38-fold non-Hermitian classification as the correct enlargement of Altland–Zirnbauer; the existence of TRS-breaking onsets in CsV$_3$Sb$_5$ and the cuprate pseudogap. Disputed: RuO$_2$ as a realisation, the chiral-loop microscopic identification in both kagome and cuprate cases, and whether anti-PT phases admit a meaningful thermodynamic limit. Folklore: that \"PT symmetric\" means TRS, that \"altermagnet\" is a new species of TRS breaking rather than a new residual symmetry, and that exceptional-point physics shares a common cause with §3-sense breaking. The honest summary is that \"broken time-reversal symmetry\" is now a label as polysemous as \"phase transition\" was a century ago — and that, as before, the cure is to specify *which symmetry, of what object, in which regime*, every time."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nThe literature on time-reversal symmetry breaking is in the unusual position of being technically mature and linguistically chaotic. The mathematics has been stable since Wigner 1932 and Lüders 1954; what drifts is the vocabulary, and most of the genuine confusions in §§3–7 are not about physics but about which of four distinct things a writer means by five letters.\n\n### (a) What I will defend\n\nI will defend, without qualification, the following: that the antiunitary operator $T$ with $T^2 = (-1)^{2J}$ is the *only* object the word \"time-reversal\" should denote in a quantum context, and that every productive disagreement in the field becomes tractable the moment one writes down which $T$ — bare, composed with a translation $\\tau$, with a point-group element $g$, or with charge conjugation — one is asking about. The Onsager–Casimir relation $L_{ij}(\\mathbf{B}) = L_{ji}(-\\mathbf{B})$ is not a weakening of TRS; it is what TRS *is* when one is honest that $\\mathbf{B}$ is a parameter, not a degree of freedom, and the persistent claim that \"a magnetic field breaks TRS\" without that qualification is sloppy. I will also defend Haldane 1988 as the cleanest pedagogical object in the entire subject: it severs \"broken $T$\" from \"net flux\" in three lines of algebra and ends an argument that should never have lasted as long as it did.\n\n### (b) What is shakier than advertised\n\nThree loadbearing assumptions deserve more scrutiny than they get:\n\n1. **That \"spontaneous TRS breaking\" is well-defined in finite systems.** The standard story — degenerate ground states, infinitesimal field selects one — requires the thermodynamic limit and an order of limits ($V\\to\\infty$ before $h\\to 0$) that is rarely stated. In mesoscopic ferromagnets the \"broken-symmetry\" ground state is a tunnelling-split doublet whose splitting one can in principle measure; the symmetry is not broken, it is *slow*. Pedagogy that treats Weiss-style spontaneous breaking as exact in arbitrary geometries is misleading.\n2. **That altermagnets are a *new* symmetry class rather than a relabelling.** The spin-group analyses on which the claim rests (Šmejkal et al.) are real and the band-structure consequences are real, but the magnetic space groups of Shubnikov already classified these states; what is new is recognising which entries in that table support spin-split bands without net moment. Calling this a \"third magnetic phase\" is marketing.\n3. **That fluctuation theorems \"rest on\" microscopic reversibility in a strong sense.** They rest on a measure-theoretic involution of trajectory space that *coincides* with $T$ in Hamiltonian systems but does not require antiunitarity; the Crooks identity holds for stochastic dynamics with no $T$ at all, provided the local detailed-balance condition on rates holds. The conflation of these two \"reversibilities\" pollutes the stochastic-thermodynamics literature.\n\n### (c) Three open problems I would work on\n\n1. **A clean experimental signature distinguishing altermagnetic from collinear-AFM bands beyond ARPES spin-splitting.** Because the *transport* consequences in zero field are subtle and easily mimicked.\n2. **Sharpening the order-of-limits in \"spontaneous TRS breaking\" for finite-range interacting fermion systems.** Because the textbook argument is a classical-spin argument in quantum clothing.\n3. **A categorical statement of what symmetry the steady state of a Floquet time crystal *does* preserve.** Because \"breaks discrete time translation\" is a statement about what fails; we lack the dual statement about what survives.\n\n### (d) Reading path\n\n1. Wigner, *Group Theory and Its Application to the Quantum Mechanics of Atomic Spectra* — the antiunitary $T$ as he actually wrote it, not as it is paraphrased.\n2. Casimir, *Rev. Mod. Phys.* **17**, 343 (1945) — the magnetic-field-reversed reciprocity relations, properly attributed.\n3. Lüders, *Dan. Mat. Fys. Medd.* **28**, 5 (1954) — the CPT theorem in its original form, before Pauli's gloss.\n4. Haldane, *Phys. Rev. Lett.* **61**, 2015 (1988) — three pages that detach broken $T$ from applied $\\mathbf{B}$ once and for all.\n5. Šmejkal, Sinova, Jungwirth, *Phys. Rev. X* **12**, 040501 (2022) — the altermagnet synthesis; read it last, with the Shubnikov tables open, and decide for yourself."}], "references": [{"n": 1, "title": "Über den Zustand des Wärmegleichgewichtes eines Systems von Körpern mit Rücksicht auf die Schwerkraft (Zweite Abhandlung)", "authors": ["Josef Loschmidt"], "year": 1876, "venue": "Sitzungsberichte der Kaiserlichen Akademie der Wissenschaften, Wien, Math.-Naturwiss. Kl. II, 73, 128", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Reciprocal Relations in Irreversible Processes. I.", "authors": ["Lars Onsager"], "year": 1931, "venue": "Physical Review 37, 405", "url": "https://doi.org/10.1103/PhysRev.37.405", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Reciprocal Relations in Irreversible Processes. II.", "authors": ["Lars Onsager"], "year": 1931, "venue": "Physical Review 38, 2265", "url": "https://doi.org/10.1103/PhysRev.38.2265", "cited_by": null, "bucket": "archive"}, {"n": <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
