anshoo.github.io/pranshoo-physics/observatory/the-many-faces-of-time-reversal-symmetry-breaking.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins: Loschmidt, Weiss, Kramers, and the Pre-history of an Antiunitary Idea Origins: Loschmidt, Weiss, Kramers, and the Pre-history of an Antiunitary Idea The phrase \"time-reversal symmetry\" is mid-twentieth-century. The physics of asking what t \\to -t does to a microscopic system is half a century older, and three of its most consequential statements were already in the literature before anyone had written down the antiunitary operator T. Reconstructing that pre-history reveals that what now travels as a single concept entered physics along three independent lines that did not fully fuse until the 1950s. Loschmidt 1876: the first sharp question Boltzmann's 1872 H-theorem produced a deceptively complete picture: the kinetic equation for a dilute gas predicts dH/dt \\leq 0 monotonically. The objection that physicists now call the Umkehreinwand — the reversibility paradox — appears as a side remark inside Loschmidt's second 1876 memoir on gravitating systems in thermal equilibrium . Loschmidt was Boltzmann's mentor in Vienna; the objection is not hostile but structural. Newton's equations are invariant under (t, \\mathbf{r}, \\mathbf{p}) \\to (-t, \\mathbf{r}, -\\mathbf{p}). Take any trajectory along which H decreases; reverse every velocity at some instant; the time-reversed trajectory is also a solution, and along it H must increase . A monotone law cannot follow from a symmetric dynamics by purely mechanical means. This is the first place in physics where the contrast between microscopic t \\to -t invariance and macroscopic monotonicity is posed as a clean question — not a confusion to be dissolved, but a constraint that the eventual resolution (initial conditions, ensembles, coarse-graining) must respect. Every later TRS discussion at the boundary of statistical mechanics — Onsager reciprocity [2, 3], detailed balance, modern fluctuation theorems — inherits its terms from this paragraph of Loschmidt's. The paper is almost never cited; the Umkehreinwand is usually quoted only as a foil that \"Boltzmann answered with his statistical interpretation\". Loschmidt's name is attached to a number (N L) and, in most curricula, to nothing else. Weiss 1907: the empirical prototype of spontaneous breaking Twenty years before Heisenberg supplied a microscopic mechanism, Pierre Weiss assembled the entire phenomenology of ferromagnetism from a single phenomenological postulate: each magnetic carrier sees an internal champ moléculaire H m = \\alpha M proportional to the local magnetization . Linearised, the self-consistency gives the Curie–Weiss law \\chi = C/(T - T c) with T c = \\alpha C, and the full nonlinear (Langevin) version admits M \\neq 0 at H {\\text{ext}} = 0 below T c. What is now read off this construction — and was not available to read off in 1907 — is that the Hamiltonian implicit in Weiss's model is invariant under the operation that flips all magnetic moments, while the state below T c is not. This is the empirical prototype of what the Anderson programme of the 1960s later christened \"spontaneous symmetry breaking\" of a discrete TRS. Heisenberg's 1928 exchange paper supplied the quantum-mechanical microscopic origin (with Dirac's spin form following in 1929), and Néel's 1948 work extended the picture to ordering patterns where T alone is broken but a combined antiunitary symmetry survives — the question we return to in §3. The textbook habit of collapsing \"mean-field FM\" directly into \"Heisenberg\" erases the empirical step. Néel's own Nobel lecture is unambiguous: the molecular field is Weiss's, the microscopic mechanism is Heisenberg's, the antiferromagnetic generalisation is his. Kramers 1930: spectral consequences without the formalism Working on paramagnetic salts, Kramers asked a narrower question : in a crystal with no external magnetic field, what does an odd number of electrons imply for the level structure? He showed every level is at least doubly degenerate. The argument is essentially the modern one — an antiunitary operation acting on the wavefunction produces a partner that is orthogonal to the original because the squared operator equals -\\mathbf{1} on half-integer spin: so \\psi\\rangle and T \\psi\\rangle span a two-dimensional invariant subspace at every energy. Kramers did not name T as antiunitary, did not give the classification T^2 = \\pm \\mathbf{1}, and did not formulate the result as a representation-theoretic constraint. He proved the physical theorem. That formalisation is Wigner's 1932 paper : T is shown to be antiunitary by general arguments about preserving transition probabilities and the canonical commutation relations, the classification T^2 = \\pm \\mathbf{1} is given, and Kramers' degeneracy is recovered as a structural corollary, the way Bloch's theorem is a corollary of translational symmetry. Wigner's Nobel lecture is careful about the order. Most condensed-matter textbooks are not: they present \"Wigner's antiunitary T\" first and then \"Kramers degeneracy\" as an application, inverting the historical sequence by two years. The under-credited tail The Loschmidt–Weiss–Kramers triad does not exhaust the pre-history. Several later contributions made the apparatus operational and are routinely abbreviated away: - Casimir 1945 . Onsager's 1931 reciprocity L {ij} = L {ji} [2, 3] is derived under T-invariance of equilibrium correlators. In any magnetotransport measurement the field \\mathbf{B} is time-odd, and the actual identity used is L {ij}(\\mathbf{B}) = L {ji}(-\\mathbf{B}). That extension is Casimir's. \"Onsager reciprocity\" as cited is almost always Onsager–Casimir reciprocity, and the half doing the work in any experiment with applied \\mathbf{B} is the half attributed to the name dropped from the shorthand. - Lüders 1954 . The first rigorous CPT theorem, tying T-violation to CP-violation via Lorentz invariance and locality, is Lüders's Copenhagen memoir. Pauli's 1955 essay in the Bohr-festschrift is a refinement and a cleaner pedagogical statement; it is also what physicists cite. Pauli's text references Lüders. - Turlay . The 1964 K^0 L \\to \\pi\\pi paper has four authors: Christenson, Cronin, Fitch, Turlay . The 1980 Nobel went to Cronin and Fitch. Christenson and Turlay routinely vanish from textbook accounts of the experiment. - Shubnikov 1951; Tavger and Zaitsev 1956 . The statement that antiferromagnets preserve T \\cdot \\tau — time reversal composed with a sublattice translation — is implicit in Néel but becomes a usable classification only with Shubnikov's coloured-symmetry (magnetic) groups, consolidated in , and the magnetic point groups of Tavger and Zaitsev. Without that crystallographic machinery, \"AFM breaks TRS\" is the wrong slogan; with it, the precise broken/preserved bookkeeping that underlies modern AFM topological invariants is available. What the pre-history teaches Read in chronological order, the foundational moves are not derivations of one another. Loschmidt 1876 poses a statistical-mechanics question about the compatibility of t \\to -t symmetric microdynamics with monotone macroscopic laws. Weiss 1907 produces, accidentally, the canonical example of an ordered state that fails to share its Hamiltonian's T-invariance. Kramers 1930 extracts a spectral consequence of antiunitary T on a single quantum system. These are three logically independent statements; the modern phrase \"TRS breaking\" obscures that independence by treating them as instances of one phenomenon. The remaining sections of this dossier keep them deliberately distinct, because almost every conflation flagged in the AETHER audit reduces to one of these three threads being mistaken for another. The Antiunitary Core: T, T²=±1, Kramers, and the Onsager–Casimir Relations The Antiunitary Core: T, T²=±1, Kramers, and the Onsager–Casimir Relations By 1932 the question Loschmidt had posed in 1876 had split in two: a thermodynamic half, which Boltzmann answered with H-theorems and coarse-graining, and a kinematic half — what does t \\to -t do to a quantum state? — which Wigner answered with antiunitary representation theory . The second half is the formal core on which every later statement about TRS breaking rests. We collect it here in the form a working theorist actually uses. Why T must be antiunitary Demand that the Heisenberg equation remain consistent under A \\mapsto T A T^{-1}, t \\mapsto -t, with T H T^{-1} = H. Reading off both sides forces i.e. T does not commute with the scalar i. By Wigner's theorem, any map preserving transition probabilities \\langle\\phi\\mid\\psi\\rangle ^2 is either unitary or antiunitary; consistency with the canonical algebra [X,P]=i\\hbar under X\\mapsto X, P\\mapsto -P forces the antiunitary branch. Concretely T = U K with U unitary and K complex conjugation in a chosen basis. The single identity one ever needs is The T²=±1 dichotomy T^2 commutes with every observable, so on an irreducible representation Schur gives T^2 = e^{i\\alpha}\\mathbb{1}. Antiunitarity conjugates the eigenvalue under one factor in T^2\\cdot T = T\\cdot T^2, forcing e^{i\\alpha}=e^{-i\\alpha}, i.e. The sign is not a choice. On angular momentum, T \\mathbf J T^{-1} = -\\mathbf J together with standard phase conventions gives T = e^{-i\\pi J y/\\hbar}K and Integer spin: T^2 = +1; half-integer spin: T^2 = -1. For spin-\\tfrac{1}{2} this is the familiar T = -i\\sigma y K. The dichotomy is representation-theoretic: T^2 = +1 endows the Hilbert space with a real (orthogonal) structure, T^2 = -1 with a quaternionic (symplectic) one. Dyson's threefold way and the Altland–Zirnbauer tenfold way are direct descendants of this single sign; so is the bulk of modern topological band classification, as Haldane's Nobel lecture recapitulates . Kramers' degeneracy, in two lines Kramers proved his theorem in 1930 , two years before Wigner gave T its antiunitary form. Suppose [H,T]=0 and H \\psi\\rangle = E \\psi\\rangle. Then H(T \\psi\\rangle) = E(T \\psi\\rangle). To show \\psi\\rangle and T \\psi\\rangle are independent, apply antiunitarity with \\phi = T\\psi, \\chi = \\psi in \\langle T\\phi\\mid T\\chi\\rangle = \\langle \\chi\\mid\\phi\\rangle: For T^2 = -\\mathbb{1} the left side equals -\\langle\\psi\\mid T\\psi\\rangle, so Every eigenvalue is at least doubly degenerate. For T^2 = +\\mathbb{1} the same calculation gives \\langle\\psi\\mid T\\psi\\rangle = \\langle\\psi\\mid T\\psi\\rangle — vacuous — and one can in fact choose a real eigenbasis (no protection). What the theorem says, and does not say: - It requires an odd number of half-integer constituents (total J half-integer) and H commuting with an antiunitary T obeying T^2 = -1. Spin–orbit coupling does not destroy it; an applied \\mathbf B, an exchange field, or any time-odd term in H does. - The partners are \\psi\\rangle and T \\psi\\rangle; their orthogonality is a property of T^2=-1, not of H. - In a crystal, T maps Bloch states at \\mathbf k and -\\mathbf k; at TR-invariant momenta (\\mathbf k = -\\mathbf k mod \\mathbf G) every band is doubly degenerate — the unit cell of the \\mathbb Z 2 topological-insulator index. Figure: With T^2=-1 every level is at least doubly degenerate at B=0 and splits linearly only once T is broken explicitly. With T^2=+1 (integer spin) crystal-field terms generically lift the degeneracy at B=0; there is no symmetry-protected pair to split. Onsager–Casimir reciprocity Linear-response coefficients L {ij} relate currents J i to thermodynamic forces X j via J i = \\sum j L {ij}X j. Onsager [2, 3] derived from microscopic reversibility — TRS of equilibrium correlators — the identity L {ij} = L {ji}. Casimir supplied the piece without which the relations fail in any realistic conductor: under T external time-odd parameters flip sign, \\mathbf B \\to -\\mathbf B, \\boldsymbol\\Omega \\to -\\boldsymbol\\Omega, \\mathbf M \\to -\\mathbf M (for a magnetization treated as a frozen background). With \\varepsilon i = \\pm 1 the T-parity of the conjugate force X i, The most-quoted special case is \\sigma {ij}(\\mathbf B) = \\sigma {ji}(-\\mathbf B), splitting into a symmetric (ordinary) and an antisymmetric (Hall) part with even and odd dependence on \\mathbf B respectively. Every claim about Hall, Nernst, or thermal-Hall responses descends from this identity. Operators versus parameters: where conflations breed The pedagogical hazard sits in the words \"T commutes with H\". Two distinct readings are in circulation, and both are correct — for different questions. - (O) T acts only on dynamical operators. Any \\mathbf B-coupling -\\boldsymbol\\mu\\cdot\\mathbf B inside H is an explicit T-breaking term; [T,H]\\neq 0; Kramers fails the moment \\mathbf B \\neq 0. This is the right reading for spectra and degeneracies at fixed \\mathbf B: Kramers, the \\mathbb Z 2 classification, gap-closing arguments. - (P) T acts on operators and on time-odd parameters. Then T H(\\mathbf B) T^{-1} = H(-\\mathbf B): there is no symmetry of a single Hamiltonian, but a symmetry of the family \\{H(\\mathbf B)\\}. This is the right reading for response coefficients as functions of \\mathbf B: Onsager–Casimir, the symmetry of the Hall conductivity, magnetochiral anisotropy. Calling either one \"the\" TRS is the most common source of cross-talk between condensed-matter, mesoscopic, and high-energy usages. Loschmidt's irreversibility paradox, antiferromagnetic \"T-broken-but-T\\tau-preserved\" arguments, the Haldane construction, and the altermagnet debate of the last few years each pivot on which convention is implicit. We shall meet that ambiguity, in different costumes, in every section that follows. Hamiltonian versus State: The Four Senses of 'Broken TRS' Hamiltonian versus State: The Four Senses of 'Broken TRS' When a speaker says \"TRS is broken\" the listener almost always has to guess which of four statements is meant. The four are logically distinct, fail in different regimes, and conflating them produces the most consequential errors in this part of the literature. The taxonomy below sorts them by what is being asked of T — invariance of the generator of dynamics, of a state, of the underlying action, or of a non-equilibrium ensemble. Anchor the language first. T is antiunitary , with T^2=\\pm 1 depending on the spin parity of the Hilbert space; it acts as T\\hat{\\mathbf{r}}T^{-1}=\\hat{\\mathbf{r}}, T\\hat{\\mathbf{p}}T^{-1}=-\\hat{\\mathbf{p}}, T\\hat{\\mathbf{S}}T^{-1}=-\\hat{\\mathbf{S}}. \"TRS of the dynamics\" means [T,H]=0 (equivalently THT^{-1}=H). \"TRS of the state\" means T \\psi\\rangle=e^{i\\phi} \\psi\\rangle for a pure state, or T\\rho T^{-1}=\\rho for a density matrix. These are independent properties: a TRS-invariant H can host a TRS-non-invariant ground state, and conversely an explicitly T-violating H has, generically, no T-invariant state in its spectrum. (a) Explicit breaking of H The narrowest sense. A T-odd term is added to the Hamiltonian by hand, each added term flipping sign under T. The Zeeman coupling is the canonical example; current biases, chiral chemical potentials, and circularly polarised optical drives are operationally similar. The signature is unambiguous: Kramers degeneracies, which require T^2=-1 together with [T,H]=0 [9, 10], are lifted, and magnetotransport acquires a Hall response odd in \\mathbf{B}. There is a long-standing semantic trap. If \\mathbf{B} is regarded as an external parameter rather than as part of H, the Onsager–Casimir convention extends the action of T to parameters, T:\\mathbf{B}\\to-\\mathbf{B}, and the resulting identity L {ij}(\\mathbf{B})=L {ji}(-\\mathbf{B}) is then advertised as \"TRS preserved\" [2, 3, 12]. Both usages are defensible; they are not equivalent statements, and writing one while meaning the other has caused decades of avoidable confusion in linear-response theory. (b) Spontaneous breaking by the state The Hamiltonian commutes with T; a specific eigenstate — typically the ground state in the thermodynamic limit — does not. The Heisenberg ferromagnet is the textbook case : T commutes with H, yet the ground-state manifold consists of states with \\langle\\hat{\\mathbf{S}} i\\rangle = \\mathbf{m}\\neq 0, and T maps such a state to the one with -\\mathbf{m}. The order parameter \\mathbf{m} is T-odd; it is precisely the non -invariant quantity whose non-zero expectation diagnoses the broken symmetry. Mean-field theory of this kind is older — Weiss's molecular field is the genuine prototype, with Heisenberg supplying the microscopic exchange justification — but the modern formulation as spontaneous symmetry breaking belongs to Anderson and the Nambu–Goldstone programme . Two extensions of (b) deserve flagging because they are routinely misclassified. First, antiferromagnets and ferrimagnets : T alone is broken in a Néel state, but T\\cdot\\tau — T composed with a sublattice-connecting translation — is preserved. This combined antiunitary symmetry protects Kramers-like degeneracies in centrosymmetric antiferromagnets and is the antiunitary half of the Shubnikov magnetic-group classification . \"AFM breaks TRS\" is a half-truth that miscounts degeneracies if one stops there. Second, anomalous Hall and Chern insulators : the Haldane model is an explicit band Hamiltonian with complex next-nearest-neighbour hoppings whose phases sum to zero flux per unit cell. At the single-particle level it is sense (a); in any microscopic realisation the T-breaking complex hopping is supplied either by an underlying spontaneous magnetic order (sense (b)) or by an external T-odd drive. The pedagogical importance of is precisely that it severs \"broken TRS\" from \"applied \\mathbf{B}\" . (c) Fundamental T-violation in the Lagrangian A statement about the action , not about any state or any effective H. The CPT theorem establishes that, given Lorentz invariance, locality, and hermiticity, any T-violating piece of \\mathcal{L} is equivalent to a CP-violating piece. The experimental anchor is the 1964 observation of K^0 L\\to\\pi\\pi by Christenson, Cronin, Fitch, and Turlay , which by CPT is a measurement of fundamental T-violation; the dedicated direct measurement followed in CPLEAR by comparing K^0\\to\\bar K^0 and \\bar K^0\\to K^0 rates (1998, verify). The Standard Model parameterises this in two places: the single physical phase \\delta {\\mathrm{CP}} of the CKM matrix, and the strong-sector \\theta-term \\mathcal{L} \\theta=\\theta\\,(g s^2/32\\pi^2)\\,G^a {\\mu\\nu}\\tilde G^{a\\,\\mu\\nu}, which is T-odd and whose smallness ( \\theta \\lesssim 10^{-10} from neutron-EDM bounds) is the strong-CP problem. Crucially, (c) is not a property of any condensed-matter system: when a solid-state paper writes \"TRS-breaking term\" it almost always means (a). Equating CP-violation in K-mesons with a ferromagnet's broken symmetry — done occasionally even in serious texts — is the most consequential conflation in this taxonomy [18, 19]. (d) Non-equilibrium effective breaking A driven-dissipative system in a non-equilibrium steady state (NESS) carries non-zero probability currents in configuration space; detailed balance, W(x\\to y)\\,\\pi {\\mathrm{ss}}(x)=W(y\\to x)\\,\\pi {\\mathrm{ss}}(y), fails. This is not an antiunitary-symmetry statement about H. The underlying microscopic dynamics is generically still T-invariant; what fails is the time-reversal symmetry of the trajectory ensemble , quantified by the mean entropy production whose distribution satisfies the Gallavotti–Cohen, Crooks, and Jarzynski fluctuation theorems. These theorems rest on underlying microscopic T-symmetry; they quantify how strongly the steady state departs from one in which T would act trivially. Floquet \"time crystals\" sit here as well: they break a discrete time-translation symmetry of the drive, not TRS in the antiunitary sense, and the no-go theorems for equilibrium time crystals do not bind them. Figure: The 2×2 separating symmetry of the dynamics from symmetry of the state. (a) and (b) are the everyday condensed-matter cases. (c) is the deepest version of (a), at the level of the Lagrangian. (d) is orthogonal to both axes: it concerns the symmetry of an ensemble of trajectories, not of any Hamiltonian. The order-parameter language unifies (a) and (b) but separates them from (c) and (d). In both (a) and (b) the diagnostic is a non-zero expectation value of a T-odd operator — magnetisation, Néel vector, orbital-current loop, Berry-curvature integral — and the question \"is the state T-invariant?\" reduces to whether such an order parameter is non-zero. The distinction is why it is non-zero: a coupling in H (a), or a spontaneous choice from a T-related multiplet of degenerate states (b). In (c) the diagnostic is an observable that would vanish by CPT in a T-symmetric theory — a permanent electric dipole moment of a fundamental particle, a CP-asymmetric decay rate; the Hilbert-space state is irrelevant. In (d) the diagnostic is a non-vanishing steady-state probability current or, equivalently, a strictly positive average entropy production; no single static operator suffices. A small but useful piece of bookkeeping closes the section. The Onsager–Casimir convention discussed under (a) effectively places the \"\\mathbf{B} as parameter\" case in cell (b) rather than (a), because under the extended action of T on parameters the dynamics do commute with T and the symmetry survives as a reciprocity relation. The taxonomy is therefore not absolute; it is relative to a declared choice of what is dynamical and what is parameter. Making that choice explicit, every time, is the cleanest defence against the conflations the remainder of this dossier will keep encountering. Ferromagnetism, Antiferromagnetism, and the Magnetic Symmetry Groups Ferromagnetism, Antiferromagnetism, and the Magnetic Symmetry Groups The four senses of broken TRS sorted out in §3 must now be illustrated on the system that historically forced the distinction: ordered magnetism. Ferromagnetism is the prototype of spontaneously broken TRS — the Hamiltonian commutes with T, the ground state does not. Antiferromagnetism is the prototype of combined symmetry: T alone fails, but T\\tau, where \\tau is a sublattice-exchanging translation, is preserved. The whole apparatus of magnetic point and space groups exists to make the second statement quantitative. The Weiss–Heisenberg–Dirac chain Weiss postulated a phenomenological molecular field H {\\text{mol}} = N M acting on each atomic moment in proportion to the bulk magnetization, with self-consistency Below T C = NC (Curie constant C), this admits M\\neq 0 at H=0 — the empirical fact of spontaneous magnetization, with no microscopic origin. The TRS structure is implicit but unmistakable: under t\\to -t, H + NM \\to -(H + NM), and the self-consistency equation is invariant under M\\to -M, yet selects M \\neq 0. Heisenberg supplied the mechanism: Coulomb exchange between non-orthogonal one-electron orbitals yields an effective spin–spin coupling Dirac (verify; Proc. R. Soc. A 123, 714, 1929) immediately recast the exchange interaction on a spin-\\tfrac12 pair as the permutation P {ij} = \\tfrac12(1+\\boldsymbol\\sigma i\\!\\cdot\\!\\boldsymbol\\sigma j), making the spin form an identity and not just an analogy. Under the antiunitary T each spin reverses, T\\mathbf{S} iT^{-1} = -\\mathbf{S} i, so \\mathbf{S} i\\!\\cdot\\!\\mathbf{S} j is even and [H {\\text{Heis}},T]=0. Nothing in the Hamiltonian distinguishes \"up\" from \"down\". The ferromagnetic ground state with J 0 on a bipartite lattice nevertheless has \\langle \\mathbf{S} i\\rangle = S\\,\\hat n for some direction \\hat n. Applying T to this state gives \\langle T\\psi \\mathbf{S} i T\\psi\\rangle = -S\\,\\hat n. The two states \\psi {\\hat n}\\rangle and \\psi {-\\hat n}\\rangle are orthogonal in the thermodynamic limit — an Anderson superselection sector — and T exchanges them: TRS is spontaneously broken to a \\mathbb Z 2 coset. The order parameter \\mathbf{M} = g\\mu B\\sum i\\langle\\mathbf{S} i\\rangle transforms as T\\mathbf MT^{-1} = -\\mathbf M — Ising-like along the easy axis once spin–orbit anisotropy lifts the continuous SU(2) of the bare exchange. (The continuous part of the broken symmetry produces the Goldstone magnon; the discrete TRS coset is what makes the ordered manifold double-valued.) Néel's Nobel lecture credits Weiss for the idea and Heisenberg for the mechanism in exactly that order, and emphasises that the molecular-field picture survives quantitatively only above T C and in the saturated regime — a validity remark the textbooks tend to elide. Néel and the surviving combined symmetry For antiferromagnets and ferrimagnets , the magnetic unit cell contains at least two sublattices A,B with \\langle\\mathbf S A\\rangle = -\\langle\\mathbf S B\\rangle (collinear AFM) or \\langle\\mathbf S A\\rangle \\neq \\langle\\mathbf S B\\rangle (ferri). The order parameter is the Néel vector \\mathbf L = \\langle\\mathbf S A\\rangle - \\langle\\mathbf S B\\rangle, with \\mathbf M = 0 in the collinear AFM. Under T, \\mathbf L \\to -\\mathbf L, so a naive reading concludes \"AFM breaks TRS just like FM\". It does not. Let \\tau be a primitive translation of the chemical lattice that maps A\\to B. Then \\tau\\mathbf L\\tau^{-1} = -\\mathbf L, so the composite T\\tau leaves \\mathbf L invariant. Acting on Bloch states, T\\tau is antiunitary and inverts crystal momentum just as T does, but (T\\tau)^2 = T^2\\,e^{-i\\mathbf k\\cdot\\mathbf R \\tau} now carries a momentum-dependent phase rather than a universal \\pm 1. This combined antiunitary is the symmetry that survives Néel order, and ignoring it is the single most consequential mistake one can make in AFM band theory. Shubnikov colour groups and Tavger–Zaitsev The general framework was built in Moscow. Shubnikov (1951) introduced antisymmetry : a two-valued colour (\"black/white\", i.e. spin up/down) that group elements may permute (consolidated with Belov in , 1964). The output is the 1651 magnetic space groups — 230 ordinary \"colourless\" groups for diamagnets, 230 \"grey\" groups that contain T as an independent element for paramagnets, and 1191 \"black-and-white\" groups that contain T only in combination with a non-trivial spatial operation. AFM and ferrimagnetic structures live in the third class. Tavger and Zaitsev (verify; Sov. Phys. JETP 3, 430, 1956) reduced this to the 122 magnetic point groups that govern macroscopic tensor responses: which scalars and pseudoscalars survive, which off-diagonal magnetoelectric coefficients are allowed, which Hall-like responses are forbidden. Dzyaloshinskii used precisely this apparatus to predict the magnetoelectric effect in Cr₂O₃, whose magnetic point group \\bar3'm' permits a linear \\alpha {ij}E jH i coupling while forbidding spontaneous \\mathbf M. The credit history is uncomfortable. The classification almost universally called \"magnetic point groups\" predates by decades the condensed-matter pedagogy that uses it; modern topological-band-theory papers routinely deploy the Shubnikov–Belov–Tavger–Zaitsev tables wholesale without citing them. Why T\\tau protects degeneracies and \\mathbb Z 2 indices The spectral consequences are sharp. Suppose [H, T\\tau]=0 with (T\\tau)^2 = -e^{-i\\mathbf k\\cdot\\mathbf R \\tau} on a Bloch state at momentum \\mathbf k. At momenta \\mathbf k where \\mathbf k \\cdot\\mathbf R \\tau \\in 2\\pi\\mathbb Z (so (T\\tau)^2 = -1) a Kramers-like degeneracy reappears: \\psi {\\mathbf k }\\rangle and T\\tau \\psi {\\mathbf k }\\rangle are orthogonal, pairing every level. This is the basis of the \\mathbb Z 2 classification of AFM topological insulators (Mong–Essin–Moore 2010, verify): the topological index is defined at T\\tau-invariant momenta and counts the parity of band inversions there. Treating the AFM as merely \"TRS-broken\" loses both the degeneracy and the invariant. Response selection rules follow the same logic. Any tensor \\chi must satisfy \\chi = (T\\tau)\\chi(T\\tau)^{-1}. On the anomalous Hall vector \\boldsymbol\\sigma^{AH} — a T-odd axial vector that the bare T alone would already forbid — the constraint from T\\tau acting on a collinear AFM state forbids \\boldsymbol\\sigma^{AH}\\parallel \\mathbf L as well: anomalous Hall is zero in a collinear AFM despite T being broken. Only when T\\tau is also broken — by spin canting, non-collinear order, or the spin-split bands of an altermagnet — does the Hall response open. The textbook short-cut \"AFM breaks TRS, so all T-odd responses are allowed\" is wrong, and the magnetic-group bookkeeping is exactly what tells one which responses are still locked. The regime where T\\tau itself fails is what §8 will reach. The lesson of §3 in concrete form: FM and AFM both break T, but only one of them breaks every antiunitary symmetry the lattice supports, and the difference is the entire content of magnetic-group theory. Severing TRS from B: Haldane, Anomalous Hall, and Magnetoelectrics Severing TRS from B: Haldane, Anomalous Hall, and Magnetoelectrics Three threads converge in this section. The first is empirical: the anomalous Hall effect, observed by E. H. Hall in iron in 1881, shows a transverse voltage proportional to the magnetisation rather than to the applied field — already evidence that \"TRS broken by something\" need not equal \"applied B field\". The second is theoretical: Karplus and Luttinger in 1954 located the intrinsic part of this response in the Bloch-band wavefunctions themselves; what was missing was a clean lattice model that made the point unambiguous (verify). The third is symmetric: in 1959 Dzyaloshinskii predicted the linear magnetoelectric effect in Cr₂O₃, the cleanest example of a state that breaks T and P separately while preserving PT . The sharpest severing of \"TRS breaking\" from \"applied magnetic field\" is the 1988 Haldane model . The Haldane construction Take a honeycomb lattice with two sublattices A and B. The Hamiltonian has three terms, with t 1 real nearest-neighbour hopping, t 2 next-nearest-neighbour (NNN) hopping carrying a phase \\phi, signs \\nu {ij}=\\pm 1 fixed by the chirality of the NNN bond around its hexagon, and \\xi i = \\pm 1 on the two sublattices — the Semenoff mass that breaks inversion. The crucial geometric fact: each NNN bond lies entirely within a single sublattice, and the three NNN bonds around an inscribed A-triangle and the corresponding B-triangle carry phases that sum to +3\\phi and -3\\phi respectively. Per hexagonal unit cell the total flux is zero. There is no net B field anywhere on average, no Landau levels, no Aharonov–Bohm phase that one could attribute to a uniform background vector potential. The flux is staggered , and TRS is broken only because the complex hopping phases are not invariant under T:\\, e^{i\\phi}\\to e^{-i\\phi}. For \\phi \\notin \\{0,\\pi\\} and M \u003c 3\\sqrt{3}\\, t 2 \\sin\\phi , the lower band carries Chern number C = -\\mathrm{sgn}(\\sin\\phi) and the Hall conductivity is exactly \\sigma {xy} = C\\, e^2/h. Tune M across the boundary and one of the two Dirac cones (at K or K') inverts its mass; the Chern number jumps by \\pm 1. This is the entire content of \"topology from broken TRS without B\" . Figure: Phase diagram of the Haldane model in the (\\phi, M) plane. The two lens-shaped regions carry \\sigma {xy} = \\pm e^2/h despite zero net flux per unit cell; the red-dashed lines \\phi=0,\\pm\\pi are the TRS-invariant slices, on which only the trivial C=0 phase exists. The anomalous Hall effect as a Berry-curvature integral For any insulator the intrinsic Hall conductivity is the Brillouin-zone integral Under T, the Berry curvature transforms as \\Omega n(\\mathbf{k}) \\to -\\Omega n(-\\mathbf{k}). A T-invariant band Hamiltonian therefore has \\sigma {xy}\\equiv 0 once the BZ integration is done. Breaking T — by any mechanism — opens the possibility of a non-vanishing \\sigma {xy}. Haldane's model is the bare-minimum lattice model that realises this without invoking a vector potential. The TKNN (Thouless–Kohmoto–Nightingale–den Nijs, 1982) integer is the same Chern number; the AHE in ferromagnetic metals (Karplus–Luttinger 1954, vindicated through the early 2000s as the dominant intrinsic mechanism in many transition-metal ferromagnets) is its partial-occupation cousin (verify). The conceptual partition is now clean: - TRS broken by a B field : \\Omega(\\mathbf k) acquires an orbital contribution; Landau levels appear; \\sigma {xy} is quantised in the integer QHE. - TRS broken by the state : exchange-split bands have \\Omega(\\mathbf k)\\neq -\\Omega(-\\mathbf k); \\sigma {xy} is the AHE — quantised if a band is a Chern band, continuous otherwise. - TRS broken by the Hamiltonian without B : the Haldane phases. Same low-energy theory as IQHE, no tesla of field anywhere. Magnetoelectrics: PT survives where T and P die Cr₂O₃ in its corundum structure has crystallographic inversion. The magnetic ordering — Cr³⁺ spins along the c-axis in a (\\uparrow\\downarrow\\downarrow\\uparrow) pattern — breaks T (spins flip) and breaks the crystal P (which interchanges \\uparrow and \\downarrow Cr sites), yet the composite PT leaves the state invariant. Dzyaloshinskii showed in 1959 that exactly this symmetry profile permits a linear magnetoelectric tensor, with \\alpha {ij} a pseudotensor odd under both T and P separately, even under PT . Astrov's 1960 measurement confirmed it within the year (verify). The systematic accounting of which magnetic point groups admit which tensors — Shubnikov's 1951 colour-group monograph, consolidated by Belov and Shubnikov — is what made these statements predictive rather than empirical. This is the cleanest live counterexample to two persistent slogans. \"Broken TRS implies a time-odd transport response\" is false in any pure form: \\alpha is a time-odd pseudotensor coexisting with ordinary time-even ones, and which components survive is dictated by the residual magnetic point group, not by the bare fact of T-breaking. \"Antiferromagnets have no Hall response\" is also false; what is true is that PT-symmetry forces the \\mathbf k-integrated \\sigma {xy} to vanish — relax PT (as in the non-collinear AFMs Mn₃Sn, Mn₃Ge) and a large intrinsic AHE returns despite zero net moment. TRS as a classifying symmetry: the tenfold way The modern home of these distinctions is the Altland–Zirnbauer classification (1997), in which the only data needed to place a non-interacting Hamiltonian in one of ten symmetry classes are: time-reversal T with T^2=+1,-1, or absent; particle-hole C with C^2=+1,-1, or absent; and chiral S=TC, present or absent. Haldane's model sits in class A (no T, no C, no S) in d=2: classification \\mathbb Z, label = Chern number. A T-invariant 2D insulator with T^2 = -1 sits in class AII: classification \\mathbb Z 2, label = Kane–Mele index — Kramers degeneracy at the time-reversal-invariant momenta is the structural reason the integer flattens to a parity. Haldane's Nobel lecture is explicit that the periodic table is the right global map and that his 1988 toy was an early data point on it . The lesson the tenfold way encodes — and the lesson this dossier insists on — is that \"TRS\" is not a yes/no badge stuck onto a Hamiltonian. It is one of three operators whose presences and squares jointly dictate what topological invariants the system can carry. \"Broken TRS\" with no further qualifier tells you only that you have left class AII (or AI) for some other class; which other class — A, D, C, BDI, … — is what governs the physics, and conflating the exit from AII with a unique destination is precisely the error this section is meant to retire. Fundamental T-Violation: From Lüders–Pauli CPT to Cronin–Fitch–Turlay Fundamental T-Violation: From Lüders–Pauli CPT to Cronin–Fitch–Turlay The four senses of broken TRS catalogued in §3 share a word, not a physics. Sense (c) — a genuine asymmetry in the microscopic laws — sits on the opposite side of an ontological line from senses (a), (b), and (d). Weiss-type spontaneous breaking lives in the state : the Hamiltonian commutes with T, the ground state does not, and one can in principle prepare the time-reversed configuration by an experimentally accessible operation (flip every spin). Fundamental T-violation lives in the Lagrangian : no preparation, no thermodynamic limit, no external field will recover the symmetry, because the symmetry was never there. The mistake of treating the two on the same footing — \"K L^0 \\to \\pi\\pi is just another TRS-breaking phase, like a ferromagnet\" — recurs often enough that it deserves a separate section. The CPT theorem and the Lüders–Pauli credit problem The relevant invariance principle for relativistic local quantum field theory is not T alone but the combined antiunitary operation \\Theta = CPT. Under very general assumptions — Lorentz invariance, locality (microcausality), the spin–statistics connection, and a stable lowest-energy state — any Hermitian Lagrangian density built from local field operators is invariant under \\Theta. The proof exists in two complementary flavours: a Lagrangian/field-theoretic version due to Lüders , and an axiomatic version in the Wightman framework due to Jost (1957), where CPT invariance becomes equivalent to weak local commutativity at Jost points. The textbook citation is almost invariably \"Pauli 1955\" — the essay \"Exclusion principle, Lorentz group and reflection of space-time and charge\" in the Niels Bohr 70th-birthday Festschrift. Pauli's contribution is real: he gave the cleanest published statement, tied the theorem firmly to spin–statistics, and put it in front of every working field theorist. But the priority belongs to Lüders , whose 1954 Mat.-Fys. Medd. paper Pauli himself cites as the source. Schwinger (1951, on charge conjugation) and Bell (1955, in his Birmingham thesis) are also part of the genealogy. The clean historical statement is: Lüders proved it, Pauli explained it, Jost axiomatised it. Calling the result \"Pauli's theorem\" is shorthand of the same kind as calling Onsager–Casimir \"Onsager\" — it elides the contribution that actually did the technical work. For our purposes the consequence is sharp. If \\Theta = CPT is an exact symmetry, then any observed CP violation is, by theorem , accompanied by an equal and opposite T-violation: This is the logical bridge from the 1964 K-meson discovery to a statement about time-reversal in the laws of nature. Without it, \"CP violation\" and \"T violation\" would be empirically independent. Christenson, Cronin, Fitch, Turlay 1964 The Brookhaven experiment of Christenson, Cronin, Fitch, and Turlay looked at the long-lived neutral kaon K L^0 decaying in flight inside a helium bag at the end of a 57-foot vacuum tube. In the Gell-Mann–Pais picture, K L^0 is the (nearly) CP-odd combination of K^0 and \\bar{K}^0 and should not decay to the CP-even \\pi^+ \\pi^- state. The signature was a small peak (\\sim 45 events out of \\sim 22{,}700 decays, branching ratio \\approx 2 \\times 10^{-3}) at \\cos\\theta = 1 in the angle between the reconstructed two-pion momentum and the beam direction, with invariant mass at the kaon. The result implied \\eta {+-} = A(K L \\to \\pi^+\\pi^-)/A(K S \\to \\pi^+\\pi^-) \\neq 0, and hence direct evidence that CP is not exact. The Nobel was awarded in 1980 to Cronin and Fitch . Christenson and Turlay are equally on the paper; the standard pedagogical contraction to \"Cronin–Fitch\" is one of the cleanest examples in modern physics of the Matthew effect amplified by the prize roster. Cronin's lecture itself is careful to name all four collaborators and the wider Princeton/Brookhaven team. In a section that is explicitly about credit audit, one writes Christenson–Cronin–Fitch–Turlay . A second priority correction belongs here. Indirect evidence that something was off in the neutral-kaon system existed before 1964 — the K L–K S mass splitting and the regeneration phenomena of Pais and Piccioni (1955) — but those are CP-conserving consequences of K^0–\\bar K^0 mixing. Direct CP violation in decay (sometimes called \\epsilon', established by NA31 / NA48 / KTeV decades later) is a separate phenomenon from the mixing CP violation (\\epsilon) that Christenson et al. discovered. Conflating \\epsilon and \\epsilon' is a routine error in popular accounts. Direct T-violation: CPLEAR and B-factory measurements Christenson et al. measured CP, not T. The CPT theorem implies the T-violation, but a direct measurement is methodologically distinct and was not achieved until 1998. The CPLEAR collaboration at CERN exploited tagged K^0 and \\bar K^0 produced in p\\bar p \\to K^\\mp \\pi^\\pm K^0(\\bar K^0) annihilations and compared the time-dependent rates of K^0 \\to \\bar K^0 and \\bar K^0 \\to K^0. A non-zero Kabir asymmetry, is direct evidence that the underlying dynamics is not T-symmetric. The result is what one would have predicted from \\epsilon and CPT, but CPLEAR demonstrated it without invoking the CPT theorem. BaBar (2012) extended this to the B^0 system with a four-way comparison of flavor- and CP-tagged transitions exploiting EPR-correlated B^0 \\bar B^0 pairs from \\Upsilon(4S), yielding a 14\\sigma T-asymmetry. After BaBar 2012 the existence of T-violation in nature is established independently of any appeal to CPT. EDMs: the precision frontier An electric dipole moment \\vec d of a non-degenerate state, aligned with its spin \\vec S, would imply an interaction H {EDM} = -d\\, \\vec S \\cdot \\vec E / S. Under T, \\vec S \\to -\\vec S while \\vec E is invariant, so H {EDM} flips sign: a permanent EDM is a T-odd, P-odd interaction whose existence directly tests fundamental T-violation. The Standard-Model CKM contribution to the electron EDM is d e \\lesssim 10^{-38}\\, e\\cdot{\\rm cm}, many orders below current sensitivity, so any non-zero signal at the present level would be new physics. The bound from ACME II (ThO molecules, 2018) and JILA (HfF^+ ions, 2023) stands at d e \u003c 4.1 \\times 10^{-30}\\, e\\cdot{\\rm cm} (verify), and the neutron EDM bound is d n \u003c 1.8 \\times 10^{-26}\\, e\\cdot{\\rm cm} (verify) — the latter being the empirical anchor of the strong CP problem and the motivation for the Peccei–Quinn axion. Why this is categorically not Weiss-type breaking Three structural differences settle the matter. (i) Locus. Spontaneous TRS breaking is a property of a state \\Omega\\rangle with [H,T]=0 but T \\Omega\\rangle \\neq e^{i\\alpha} \\Omega\\rangle [4, 6, 5]. Fundamental T-violation is a property of H itself: [H,T] \\neq 0, with no state-dependence at all. The ferromagnetic ground state has a domain-reversed partner of identical energy; the CKM Lagrangian has no T-conjugate partner anywhere in its parameter space. (ii) Reversibility of preparation. A ferromagnet can be demagnetised, the spin configuration can be flipped, the symmetric ensemble can be assembled by averaging over domains. There is no analogous operation on the weak Lagrangian. (iii) Counting of broken symmetries. Spontaneous breaking of a discrete symmetry (FM, \\mathbb Z 2) gives domain walls, no Goldstone modes, and a sharp order parameter (\\vec M). Fundamental T-violation gives no order parameter, no domain wall, no phase transition — only a complex phase (\\delta {CKM}, \\bar\\theta {QCD}) in the action that cannot be rotated away by field redefinitions. The cleanest one-line slogan: Weiss broke TRS in a state , Christenson–Cronin–Fitch–Turlay (via Lüders' theorem) showed nature broke it in the action . The two phenomena answer different questions and deserve different vocabularies — a discipline §7 will need when we cross into non-equilibrium, where the locus of \"broken TRS\" shifts a third time. Non-Equilibrium TRS: Detailed Balance, Fluctuation Theorems, and Time Crystals Non-Equilibrium TRS: Detailed Balance, Fluctuation Theorems, and Time Crystals The four senses of broken TRS sorted out in §3 were all framed around closed Hamiltonian dynamics. Once a system is driven, dissipative, or both, three further notions begin to circulate under the same label: detailed balance, microscopic reversibility, and time-translation symmetry. They are not the same notion, and the literature slides between them constantly. The slide is most consequential in the time-crystal corner, where a discrete symmetry of a drive periodically gets rebranded as the antiunitary T of §2. Detailed balance is not microscopic reversibility For a Markov process on configurations \\mathcal{C} with rates W(\\mathcal{C} \\to \\mathcal{C}') and stationary distribution P \\mathrm{st}, detailed balance is the local condition A non-equilibrium steady state (NESS) is one where P \\mathrm{st} is still stationary but probability currents J(\\mathcal{C}\\to\\mathcal{C}') = P \\mathrm{st}(\\mathcal{C})W(\\mathcal{C}\\to\\mathcal{C}') - (\\mathcal{C}\\leftrightarrow\\mathcal{C}') are non-zero on some loops in configuration space. This is the precise content of \"broken detailed balance\". Microscopic reversibility is the statement that the underlying unitary dynamics (or its classical analogue) is invariant under T — in the Onsager–Casimir form, with the convention B \\to -B on any external time-odd parameter [2, 3, 12]. A driven Hamiltonian system that produces a NESS via coupling to two thermal reservoirs at different temperatures has fully T-symmetric microscopic equations of motion and yet a steady state that violates detailed balance. The distinction was emphasised in Onsager's papers in passing and made operationally sharp by the next generation: detailed balance is a property of the projected dynamics on coarse-grained states, not of the underlying Liouvillian. This is the same conflation, in a new guise, between T-breaking of the Hamiltonian (sense (a) of §3) and T-breaking of the state (sense (b)). The NESS realises a fourth species: a state that breaks neither T of H nor any spatial symmetry, but breaks the equilibrium condition itself. Calling this \"broken TRS\" is a category error that nonetheless saturates the literature on driven open systems. Fluctuation theorems use microscopic TRS to quantify non-equilibrium The deepest result of late-twentieth-century statistical mechanics in this corner is that the asymmetry of trajectories in a driven system is controlled by a microscopic identity that itself rests on T. Three near-simultaneous discoveries are routinely conflated: - Gallavotti–Cohen (1995) for thermostated chaotic dynamics in NESS: the large-deviation function e(\\sigma) for the entropy production rate satisfies e(\\sigma) - e(-\\sigma) = \\sigma. The proof requires a reversible Anosov flow and the chaotic hypothesis (Gallavotti \u0026 Cohen, PRL 74, 2694). - Jarzynski (1997) : for a system driven by an external protocol from one equilibrium to a non-equilibrium endpoint, \\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}, where the average is over many realisations and \\Delta F is the equilibrium free-energy difference (Jarzynski, PRL 78, 2690). - Crooks (1999) : the ratio of forward and reverse trajectory probabilities is P F(W)/P R(-W) = e^{\\beta(W-\\Delta F)}. Jarzynski's identity is the first moment of Crooks' (Crooks, PRE 60, 2721). The structural point is the same in all three: the derivation begins by writing a trajectory probability \\mathcal{P}[\\gamma] and the time-reversed-protocol probability \\mathcal{P}^ [\\bar\\gamma] for the reversed trajectory, then applies microscopic reversibility — the antiunitary T acting on the dynamics with B \\to -B — to relate the two. The non-equilibrium asymmetry being measured (entropy production, dissipated work) is the consequence of breaking detailed balance; the identity that quantifies it survives only because T remains a symmetry of the microscopic generator. The Hatano–Sasa extension to transitions between NESS preserves this logic. A statement one therefore hears — \"fluctuation theorems are non-equilibrium expressions of TRS\" — is correct only with the right reading. They are statements about macroscopic irreversibility that exist because microscopic dynamics is T-symmetric. A system in which T is genuinely broken in H (a CP-violating sector; an explicit time-odd Hamiltonian term not handled by the Casimir parameter convention) requires modified versions of the identities, with extra terms tracking the asymmetry that T no longer enforces. The time-crystal saga Wilczek's 2012 proposal asked whether continuous time-translation symmetry could be spontaneously broken in a ground state , in literal analogy with crystals breaking spatial translation (Wilczek, PRL 109, 160401; Shapere–Wilczek classical companion, PRL 109, 160402). The proposal triggered immediate objections — Bruno's superconductor counter-example (2013) and Nozières' critique — and was definitively closed off by Watanabe and Oshikawa in 2015, who proved that for a generic local Hamiltonian with not-too-long-range interactions, the equal-time–shifted correlator of any local order parameter has \\lim {t\\to\\infty}\\langle O(t)O(0)\\rangle \\mathrm{eq} \\to \\langle O\\rangle \\mathrm{eq} ^2 in the ground state and thermal Gibbs state, ruling out long-range temporal order (Watanabe \u0026 Oshikawa, PRL 114, 251603). The loophole is to abandon equilibrium. In a Floquet system with Hamiltonian H(t) = H(t+T d) the only time-translation symmetry is the discrete \\mathbb{Z} generated by t \\to t+T d. A discrete time crystal (DTC) is a phase in which a local observable exhibits robust subharmonic response at period nT d, n \\geq 2, spontaneously breaking this \\mathbb{Z} down to n\\mathbb{Z}. Stability against generic perturbations of the drive requires a mechanism that prevents heating to infinite temperature; the original 2016 constructions used many-body localisation. Khemani–Lazarides–Moessner–Sondhi identified the phase structure (PRL 116, 250401); Else–Bauer–Nayak gave the symmetry-based definition and the name \"Floquet time crystal\" (PRL 117, 090402). The first experimental observations followed within a year: Zhang et al. on a trapped-ion chain (Nature 543, 217, 2017) and Choi et al. on NV centres in diamond (Nature 543, 221, 2017). Prethermal DTCs (Else–Machado–Nayak–Yao), critical and two-frequency variants, and superconducting-qubit realisations on Google's Sycamore (Mi et al., 2022) followed. Here is where the slide happens. A DTC breaks discrete time-translation — a unitary symmetry of the driven generator. It does not break antiunitary T. The two share the word \"time\" and nothing else: T is the t\\to -t involution of §2; the Floquet \\mathbb{Z} is the t \\to t+T d translation. Many semi-popular accounts and not a few research summaries assert the latter is an instance of the former. It is not. Whether a DTC additionally breaks T depends on the drive: a circularly polarised Floquet drive does (sense (a) of §3), a linearly polarised one need not, and the DTC order parameter is logically independent of either choice. Dissipative time crystals add a third sub-category — open-system limit cycles of a Lindbladian \\mathcal{L} that spontaneously break the continuous time-translation symmetry of \\mathcal{L} in the thermodynamic limit (Iemini et al., boundary time crystals, 2018; subsequent superradiant realisations). These are NESS phenomena; the underlying microscopic dynamics is T-symmetric, the steady-state breaks detailed balance, and a continuous limit cycle emerges as a many-body analogue of a classical Hopf bifurcation. Whether to grant these the title \"time crystal\" is partly a labelling dispute. They are emphatically not equilibrium time crystals (Watanabe–Oshikawa applies only there), and they have no a priori relation to T. Where it remains murky Three sliding points worth flagging for §8. First, the Lindbladian time-translation symmetry of an open driven system is sometimes equated with microscopic T; it is the analogue of detailed balance, not of T. Second, \"prethermal time crystal\" is used both for Floquet systems heated slowly enough to exhibit a long-lived DTC plateau and for genuinely time-independent prethermal phases with broken \\mathrm{U}(1); these are distinct. Third, the question of whether MBL — the original stabilisation mechanism for the Floquet DTC — survives in dimensions d \\geq 2 at infinite times remains open at the rigorous level, which leaves the most robustly observed DTCs (the Sycamore and trapped-ion ones) on a prethermal rather than asymptotic footing — a subtlety routinely flattened in summaries that simply assert \"a time crystal has been observed\". Current Frontier: Altermagnets, PT-symmetric Non-Hermitians, and What Remains Murky Current Frontier: Altermagnets, PT-symmetric Non-Hermitians, and What Remains Murky The seven preceding sections have closed the historical record: by 2016 the language of broken TRS had stabilised into the four senses of §3, applied across magnetism, topology, particle physics, and stochastic thermodynamics. The decade since has not so much overturned that picture as exposed regions where it pixelates. Four such regions deserve naming: altermagnets, non-Hermitian platforms with PT or anti-PT structure, TRS-protected orders beyond the tenfold way, and the orbital-current candidate phases of kagome metals and cuprates. Altermagnets Until 2022 the symmetry classification of collinear magnets was binary: ferromagnet (net M\\neq 0, T broken globally) or antiferromagnet (T·\\boldsymbol{\\tau} preserved, Kramers degeneracy on every band). The altermagnetic class, sharpened by Šmejkal, Sinova, and Jungwirth (PRX 12, 040501; 12, 031042, 2022) and given a full spin-space-group account by Liu, Li, Han, Wan, and Liu (PRX 12, 021016, 2022), occupies the gap. The two sublattices carry opposite moments yet are not related by any pure \\boldsymbol{\\tau} or P; they are related by a rotation or mirror of the lattice. The consequence is operationally striking: with R a non-trivial point-group element. Bands are spin-split without spin–orbit coupling and without net magnetization , with a d-, g-, or i-wave nodal structure in \\mathbf{k}-space. In the language of §4, this is a fifth Shubnikov-type situation that the Shubnikov–Belov groups could not capture because they treated spin and lattice rotations as locked together; only the spin-space groups , in which they decouple, expose it. The experimental status is uneven. ARPES on \\alpha-MnTe has reported the predicted lifting of Kramers degeneracy across T N with splittings of order 0.4–0.8 eV, far larger than the spin–orbit gap, in Krempaský et al. Nature 626, 517 (2024) and Lee et al., PRB 109, 115102 (2024). The case for RuO 2, the original poster child, has not held up: \\muSR and polarised-neutron diffraction in Hiraishi et al., PRL 132, 166702 (2024) and Kessler et al., npj Spintronics 2, 50 (2024) bound any local moment well below 0.1\\,\\mu B, with the (100) Bragg peak originally interpreted as magnetic identified as predominantly nuclear. The principle survives, the prototype does not. The conflation watch here is sharp. \"Altermagnetism\" is sometimes glossed as \"a new kind of TRS breaking\". It is not new in §3 sense (b): it is a spontaneous breaking of T in the state with the same logical status as ferromagnetism — what is novel is the residual symmetry \\{T \\mid R\\} replacing the Néel \\{T\\mid \\boldsymbol{\\tau}\\}. The Onsager–Casimir reciprocity is reorganised accordingly: a d-wave altermagnet supports a crystal anomalous Hall response in directions selected by R, even when summed magnetisation vanishes. PT-symmetric and anti-PT non-Hermitian platforms Bender and Boettcher noticed in 1998 that complex Hamiltonians invariant under PT can have entirely real spectra; Mostafazadeh (J. Math. Phys. 43, 205 (2002)) showed that this is a special case of pseudo-Hermiticity , \\eta H \\eta^{-1} = H^{\\dagger} for some positive metric \\eta. The relevance to our dossier is that T here is the antiunitary of §2, but H is not Hermitian: the two structures interact through a new phase transition, the spontaneous breaking of PT, at which complex-conjugate eigenvalue pairs collide on the real axis at an exceptional point where the Hamiltonian becomes non-diagonalisable. This is genuinely outside the §3 taxonomy because the dynamics itself is non-unitary. The Altland–Zirnbauer tenfold way invoked in is enlarged accordingly. Kawabata, Shiozaki, Ueda, and Sato (PRX 9, 041015, 2019) showed that the loss of Hermiticity bifurcates T into a true antiunitary and its transpose partner, C into conjugation and transposition variants, and promotes pseudo-Hermiticity to an independent symmetry — yielding 38 classes, of which the original ten are diagonal entries. Anti-PT systems (\\{PT, H\\}=0) realise a separate route: real spectra collapse to imaginary, with a different sensitivity to dissipation, and have become the natural language for non-Hermitian cavity magnonics and dissipative cold-atom chains. The non-Hermitian skin effect, in which \\mathcal{O}(N) states pile up at a boundary, is a separate dimensional structure entirely. What is folklore here, and worth flagging: the equation \"PT symmetry = time-reversal symmetry\" is wrong. PT in Bender–Boettcher is unitary in even-parity sectors and antiunitary overall; it is invariance under PT that is being imposed, not under T alone, and the relation to a genuine arrow of time is indirect. The exceptional-point sensitivity advertised for sensing relies on a square-root spectral splitting that is intrinsically a non-unitary phenomenon — not a TRS-breaking signature in any §3 sense. TRS-protected order beyond the tenfold way The classification consolidated by Haldane in his Nobel lecture treats T as one of three internal symmetries. The crystalline-SPT programme of Chen, Kapustin, Else, Thorngren, and others has shown that adjoining space-group symmetries enlarges the table substantially: T-protected higher-order topological insulators with hinge or corner modes, magnetic topological crystalline insulators classified by magnetic space groups (returning Shubnikov to centre stage), and beyond-cohomology phases for which the natural invariant is not a group-cohomology class. The role of T in these constructions is now to enforce a crystalline equivariant K-theory class , not a \\mathbb{Z} 2 index in isolation. For experimental purposes this means that \"TRS-protected\" without specifying the accompanying crystal symmetry is now a category error. Loop-current candidates: kagome and the pseudogap Two condensed-matter systems remain genuinely unresolved. In the kagome metals AV 3Sb 5, polar Kerr (Xu et al., Nature Physics 18, 1470, 2022), \\muSR (Mielke et al., Nature 602, 245, 2022), and magneto-optical signatures point to a TRS-breaking charge-density-wave phase below \\sim 70–80 K — most naturally interpreted as a chiral loop-current order. Independent measurements (Saykin et al., PRL 130, 126001, 2023) have placed tight upper bounds on any zero-field Kerr signal, and the picture remains contested. In the cuprate pseudogap, Varma's intra-unit-cell loop-current state (PRB 73, 155113, 2006) is supported by polarised-neutron diffraction in YBCO and Hg-1201 and by polar Kerr onset at T^{ }, but resists detection in NMR/\\muSR with the magnitudes the neutron data would imply. Both cases are best described as established TRS-breaking signals of some origin, with the orbital-current identification plausible but not closed. The AETHER verdict on what remains murky Established: altermagnetism as a symmetry class (spin-space-group construction; ARPES on MnTe); the 38-fold non-Hermitian classification as the correct enlargement of Altland–Zirnbauer; the existence of TRS-breaking onsets in CsV 3Sb 5 and the cuprate pseudogap. Disputed: RuO 2 as a realisation, the chiral-loop microscopic identification in both kagome and cuprate cases, and whether anti-PT phases admit a meaningful thermodynamic limit. Folklore: that \"PT symmetric\" means TRS, that \"altermagnet\" is a new species of TRS breaking rather than a new residual symmetry, and that exceptional-point physics shares a common cause with §3-sense breaking. The honest summary is that \"broken time-reversal symmetry\" is now a label as polysemous as \"phase transition\" was a century ago — and that, as before, the cure is to specify which symmetry, of what object, in which regime , every time. The AETHER Verdict The AETHER Verdict The literature on time-reversal symmetry breaking is in the unusual position of being technically mature and linguistically chaotic. The mathematics has been"}</script>

<script type="application/json" id="aether-data">{"slug": "the-many-faces-of-time-reversal-symmetry-breaking", "topic": "Clarity for Time reversal symmetry breaking, Spontaneous TRS breaking, TRS breaking of H vs the state, FM, and all things inlcuiding non-equ", "kind": "deep", "kind_tag": "DEEP DIVE", "kind_long": "A full excavation, back to the first works", "title": "The Many Faces of Time-Reversal Symmetry Breaking", "subtitle": "An archaeology and audit — from Loschmidt's paradox to Floquet time crystals", "domain": "", "era": "", "why_big": "", "abuse": "", "date": "June 28, 2026", "ts": 1782601997.81669, "engine": "Claude Code CLI · default model", "aliases": ["T-symmetry breaking", "T-violation", "broken time-reversal invariance", "antiunitary T symmetry", "microscopic reversibility (transport context)", "spontaneous magnetic-order TRS breaking (ferromagnetism, ferrimagnetism, anomalous Hall)"], "origin_story": "Time-reversal entered physics first as a classical-mechanical *embarrassment*: Loschmidt's 1876 reversibility objection to Boltzmann's H-theorem (the Umkehreinwand) made explicit that microscopic equations of motion are even under t→−t while observed macroscopic processes are not. The resolution split historically into two streams. (i) A transport/statistical-mechanical stream: Onsager (1931) showed that *microscopic reversibility* — properly the symmetry of two-time correlators under time-reversal — forces reciprocity of kinetic coefficients; Casimir (1945) extended this to systems in a magnetic field with the explicit B→−B rule, which is in fact the first systematic statement of how TRS acts on an external parameter rather than only on dynamical variables. (ii) A quantum-mechanical stream: Kramers (1930), studying paramagnetic rotation, observed the degeneracy now bearing his name for half-integer-spin systems; Wigner (1932, Nachrichten Göttingen) recognized that T must be implemented antiunitarily, gave the classification T²=±1, and thereby produced the modern operator-level formulation. Spontaneous TRS breaking — i.e. of the *state*, not the *Hamiltonian* — was already present in Weiss's 1907 molecular-field theory of ferromagnetism, but its mechanism awaited Heisenberg (1928) and Dirac (1929) exchange; Néel (1932/1948) then generalised to antiferro- and ferrimagnetism, where T is broken but a combined T·τ (translation) survives. Finally, *fundamental* T-violation was pried apart from spontaneous TRS breaking only after Lüders (1954) and Pauli (1955) gave the CPT theorem and Christenson, Cronin, Fitch \u0026 Turlay (1964) observed CP violation in K⁰ decay. The conceptual hygiene — explicit vs spontaneous, of H vs of the state, equilibrium vs driven — was sharpened in the broken-symmetry programme synthesised by Anderson (1972) and is, even now, routinely muddled.", "credit_audit": "The textbook narrative usually runs 'Wigner formalised T; Kramers degeneracy follows; Onsager wrote down reciprocity; Pauli proved CPT; Cronin–Fitch found CP violation'. The historical record is messier. (1) Kramers' 1930 degeneracy theorem precedes Wigner's 1932 antiunitary T by two years; Wigner generalised but did not first encounter the phenomenon. (2) 'Onsager reciprocity' as actually applied — i.e. with magnetic-field reversal — is Casimir's 1945 extension; calling it 'Onsager' is shorthand that obscures the part doing the work. (3) The CPT theorem is Lüders 1954, not Pauli 1955; Pauli's essay is more readable and is what most physicists cite. (4) The 1964 CP-violation paper has four authors (Christenson–Cronin–Fitch–Turlay); two received the Nobel, two did not, and the post-hoc reading of 'who measured what' has been retold to fit the prize list. (5) Spontaneous TRS breaking in ferromagnetism is conceptually due to Weiss (1907), with the *microscopic* mechanism due to Heisenberg (1928) and the cleaner spin-form to Dirac (1929); the modern *language* of 'spontaneous symmetry breaking' is from the Nambu–Goldstone–Anderson p ng of H, of the state, and of combined symmetries.", "who": "I. E. Dzyaloshinskii", "work": "On the magnetoelectrical effect in antiferromagnets, Sov. Phys. JETP 10, 628", "kind": "theory", "ref": 13}, {"year": 1964, "event": "Observation of CP violation in K⁰_L→ππ — by CPT, the first experimental evidence for fundamental T-violation. Conceptually distinct from any condensed-matter 'TRS breaking'.", "who": "Christenson, Cronin, Fitch, Turlay", "work": "Evidence for the 2π Decay of the K⁰₂ Meson, Phys. Rev. Lett. 13, 138", "kind": "observation", "ref": 20}, {"year": 1972, "event": "Anderson crystallises the broken-symmetry paradigm: explicit vs spontaneous, of H vs of the state, with ferromagnetism as canonical case of spontaneously broken (discrete) TRS.", "who": "P. W. Anderson", "work": "More Is Different, Science 177, 393", "kind": "formalization", "ref": 14}, {"year": 1988, "event": "Haldane model: a TRS-breaking band Hamiltonian with zero net magnetic flux through the unit cell — quantised Hall response without Landau levels; severs 'broken TRS' from 'applied B field' once and for all.", "who": "F. D. M. Haldane", "work": "Model for a Quantum Hall Effect without Landau Levels…, Phys. Rev. Lett. 61, 2015", "kind": "theory", "ref": 5}, {"year": 2016, "event": "Haldane Nobel lecture consolidates the modern view: TRS as one of the Altland–Zirnbauer 'tenfold-way' classifying symmetries; clean separation of magnetic-order TRS breaking from topological/anomalous TRS breaking.", "who": "F. D. M. Haldane", "work": "Topological Quantum Matter, Nobel Lecture, Stockholm", "kind": "revival", "ref": 16}], "neglected": [{"name": "Josef Loschmidt", "role": "Posed the reversibility paradox that frames *every* later discussion of TRS at the micro/macro boundary; usually mentioned only as a foil to Boltzmann, his actual 1876 paper almost never cited.", "evidence": "Original Wiener Berichte paper; subsequent statistical-mechanics histories.", "ref": 1}, {"name": "H. A. Kramers", " tements are not contradictory; they are different definitions of what 'T-invariant' means."}, {"claim": "'Antiferromagnets break TRS.'", "clarification": "T alone is broken, but T composed with a sublattice translation τ — i.e. T·τ — is preserved. This combined antiunitary symmetry is what gives AFM topological insulators their Z₂ index and what protects spin degeneracies; ignoring it produces wrong selection rules and miscounts of degeneracies."}, {"claim": "'TRS breaking' is one phenomenon.", "clarification": "Four logically distinct things share the phrase: (a) explicit breaking of H by a time-odd term (applied B, current bias, circularly polarised drive); (b) spontaneous breaking of the *state* by an ordered phase with a TRS-invariant H (FM, anomalous Hall in a Chern insulator); (c) fundamental T-violation in the underlying laws (weak-interaction CP/T); (d) effective TRS breaking in non-equilibrium steady states from driving plus dissipation. Conflating (a) with (b) is the most common error; conflating (b) with (c) is the most consequential."}, {"claim": "'Kramers degeneracy applies to any system with an odd number of electrons.'", "clarification": "It requires (i) half-integer total angular momentum and (ii) the Hamiltonian to commute with an antiunitary T satisfying T²=−1. Strong spin-orbit alone does not destroy it; an explicit T-breaking term (exchange field, applied B) does. The degeneracy is between |ψ⟩ and T|ψ⟩, which are orthogonal precisely because T²=−1."}, {"claim": "'CP violation is just another instance of TRS breaking like ferromagnetism.'", "clarification": "It is the opposite. CP violation in K⁰ is a property of the *Lagrangian* (a fundamental phase in the CKM matrix); ferromagnetic order is a property of a *state* whose Hamiltonian is TRS-invariant. The CPT theorem ties CP-violation to T-violation; no such fundamental statement applies to FM, where the symmetry of the dynamics is intact."}, {"claim": "'Driving a system out of equilibrium breaks TRS.'", "clarification": "It breaks *detailed balance*, which is a statement about probability currents being non-zero in the steady state. That is distinct from TRS of the underlying dynamics, and it is distinct again from *spontaneous* TRS breaking of a non-equilibrium phase. Fluctuation theorems (Crooks, Jarzynski, Gallavotti–Cohen) precisely quantify this and rest on the underlying microscopic T-symmetry even when the macroscopic state violates detailed balance."}, {"claim": "'Time crystals break time-translation/time-reversal symmetry.'", "clarification": "Two different no-go and yes-go statements are routinely conflated. Wilczek's 2012 *equilibrium* time crystals were ruled out by Watanabe–Oshikawa-type theorems. The experimentally realised Floquet/discrete time crystals break a *discrete* time-translation symmetry of a driven system; they do not break TRS in the antiunitary sense at all."}, {"claim": "'The Haldane model needs a magnetic field.'", "clarification": "It needs broken TRS in the band Hamiltonian (complex next-nearest-neighbour hoppings whose phases sum to zero per unit cell), but explicitly *not* a net magnetic flux. This is the cleanest illustration that 'broken TRS' and 'magnetic field' are independent concepts — the entire point of Haldane's 1988 construction."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: Loschmidt, Weiss, Kramers, and the Pre-history of an Antiunitary Idea", "markdown": "## Origins: Loschmidt, Weiss, Kramers, and the Pre-history of an Antiunitary Idea\n\nThe phrase \"time-reversal symmetry\" is mid-twentieth-century. The *physics* of asking what $t \\to -t$ does to a microscopic system is half a century older, and three of its most consequential statements were already in the literature before anyone had written down the antiunitary operator $T$. Reconstructing that pre-history reveals that what now travels as a single concept entered physics along three independent lines that did not fully fuse until the 1950s.\n\n### Loschmidt 1876: the first sharp question\n\nBoltzmann's 1872 H-theorem produced a deceptively complete picture: the kinetic equation for a dilute gas predicts $dH/dt \\leq 0$ monotonically. The objection that physicists now call the *Umkehreinwand* — the reversibility paradox — appears as a side remark inside Loschmidt's second 1876 memoir on gravitating systems in thermal equilibrium [1]. Loschmidt was Boltzmann's mentor in Vienna; the objection is not hostile but structural. Newton's equations are invariant under $(t, \\mathbf{r}, \\mathbf{p}) \\to (-t, \\mathbf{r}, -\\mathbf{p})$. Take any trajectory along which $H$ decreases; reverse every velocity at some instant; the time-reversed trajectory is also a solution, and along it $H$ must *increase*. A monotone law cannot follow from a symmetric dynamics by purely mechanical means.\n\nThis is the first place in physics where the contrast between microscopic $t \\to -t$ invariance and macroscopic monotonicity is posed as a clean question — not a confusion to be dissolved, but a constraint that the eventual resolution (initial conditions, ensembles, coarse-graining) must respect. Every later TRS discussion at the boundary of statistical mechanics — Onsager reciprocity [2, 3], detailed balance, modern fluctuation theorems — inherits its terms from this paragraph of Loschmidt's. The paper is almost never cited; the *Umkehreinwand* is usually quoted only as a foil that \"Boltzmann answered with his statistical interpretation\". Loschmidt's name is attached to a number ($N_L$) and, in most curricula, to nothing else.\n\n### Weiss 1907: the empirical prototype of spontaneous breaking\n\nTwenty years before Heisenberg supplied a microscopic mechanism, Pierre Weiss assembled the entire phenomenology of ferromagnetism from a single phenomenological postulate: each magnetic carrier sees an internal *champ moléculaire* $H_m = \\alpha M$ proportional to the local magnetization [4]. Linearised, the self-consistency\n\n$$M = \\chi_{\\text{Curie}}(T)\\,\\bigl(H_{\\text{ext}} + \\alpha M\\bigr), \\qquad \\chi_{\\text{Curie}}(T) = \\frac{C}{T},$$\n\ngives the Curie–Weiss law $\\chi = C/(T - T_c)$ with $T_c = \\alpha C$, and the full nonlinear (Langevin) version admits $M \\neq 0$ at $H_{\\text{ext}} = 0$ below $T_c$. What is now read off this construction — and was not available to read off in 1907 — is that the Hamiltonian implicit in Weiss's model is invariant under the operation that flips all magnetic moments, while the *state* below $T_c$ is not. This is the empirical prototype of what the Anderson programme of the 1960s [5] later christened \"spontaneous symmetry breaking\" of a discrete TRS. Heisenberg's 1928 exchange paper [6] supplied the quantum-mechanical microscopic origin (with Dirac's spin form following in 1929), and Néel's 1948 work [7] extended the picture to ordering patterns where $T$ alone is broken but a combined antiunitary symmetry survives — the question we return to in §3.\n\nThe textbook habit of collapsing \"mean-field FM\" directly into \"Heisenberg\" erases the empirical step. Néel's own Nobel lecture [8] is unambiguous: the molecular field is Weiss's, the microscopic mechanism is Heisenberg's, the antiferromagnetic generalisation is his.\n\n### Kramers 1930: spectral consequences without the formalism\n\nWorking on paramagnetic salts, Kramers asked a narrower question [9]: in a crystal with no external magnetic field, what does an odd number of electrons imply for the level structure? He showed every level is at least doubly degenerate. The argument is essentially the modern one — an antiunitary operation acting on the wavefunction produces a partner that is orthogonal to the original because the squared operator equals $-\\mathbf{1}$ on half-integer spin:\n\n$$T^2 = -\\mathbf{1} \\quad\\Longrightarrow\\quad \\langle \\psi \\mid T\\psi \\rangle = 0,$$\n\nso $|\\psi\\rangle$ and $T|\\psi\\rangle$ span a two-dimensional invariant subspace at every energy. Kramers did not name $T$ as antiunitary, did not give the classification $T^2 = \\pm \\mathbf{1}$, and did not formulate the result as a representation-theoretic constraint. He proved the physical theorem.\n\nThat formalisation is Wigner's 1932 paper [10]: $T$ is shown to be antiunitary by general arguments about preserving transition probabilities and the canonical commutation relations, the classification $T^2 = \\pm \\mathbf{1}$ is given, and Kramers' degeneracy is recovered as a structural corollary, the way Bloch's theorem is a corollary of translational symmetry. Wigner's Nobel lecture [11] is careful about the order. Most condensed-matter textbooks are not: they present \"Wigner's antiunitary $T$\" first and then \"Kramers degeneracy\" as an application, inverting the historical sequence by two years.\n\n### The under-credited tail\n\nThe Loschmidt–Weiss–Kramers triad does not exhaust the pre-history. Several later contributions made the apparatus operational and are routinely abbreviated away:\n\n- **Casimir 1945** [12]. Onsager's 1931 reciprocity $L_{ij} = L_{ji}$ [2, 3] is derived under $T$-invariance of equilibrium correlators. In any magnetotransport measurement the field $\\mathbf{B}$ is time-odd, and the actual identity used is $L_{ij}(\\mathbf{B}) = L_{ji}(-\\mathbf{B})$. That extension is Casimir's. \"Onsager reciprocity\" as cited is almost always Onsager–Casimir reciprocity, and the half doing the work in any experiment with applied $\\mathbf{B}$ is the half attributed to the name dropped from the shorthand.\n\n- **Lüders 1954** [13]. The first rigorous CPT theorem, tying T-violation to CP-violation via Lorentz invariance and locality, is Lüders's Copenhagen memoir. Pauli's 1955 essay in the Bohr-festschrift is a refinement and a cleaner pedagogical statement; it is also what physicists cite. Pauli's text references Lüders.\n\n- **Turlay**. The 1964 $K^0_L \\to \\pi\\pi$ paper has four authors: Christenson, Cronin, Fitch, Turlay [14]. The 1980 Nobel went to Cronin and Fitch. Christenson and Turlay routinely vanish from textbook accounts of the experiment.\n\n- **Shubnikov 1951; Tavger and Zaitsev 1956**. The statement that antiferromagnets preserve $T \\cdot \\tau$ — time reversal composed with a sublattice translation — is implicit in Néel but becomes a usable classification only with Shubnikov's coloured-symmetry (magnetic) groups, consolidated in [15], and the magnetic point groups of Tavger and Zaitsev. Without that crystallographic machinery, \"AFM breaks TRS\" is the wrong slogan; with it, the precise broken/preserved bookkeeping that underlies modern AFM topological invariants is available.\n\n### What the pre-history teaches\n\nRead in chronological order, the foundational moves are not derivations of one another. Loschmidt 1876 poses a statistical-mechanics question about the compatibility of $t \\to -t$ symmetric microdynamics with monotone macroscopic laws. Weiss 1907 produces, accidentally, the canonical example of an ordered state that fails to share its Hamiltonian's $T$-invariance. Kramers 1930 extracts a spectral consequence of antiunitary $T$ on a single quantum system. These are three logically independent statements; the modern phrase \"TRS breaking\" obscures that independence by treating them as instances of one phenomenon. The remaining sections of this dossier keep them deliberately distinct, because almost every conflation flagged in the AETHER audit reduces to one of these three threads being mistaken for another."}, {"id": "antiunitary-core", "title": "The Antiunitary Core: T, T²=±1, Kramers, and the Onsager–Casimir Relations", "markdown": "## The Antiunitary Core: T, T²=±1, Kramers, and the Onsager–Casimir Relations\n\nBy 1932 the question Loschmidt had posed in 1876 had split in two: a thermodynamic half, which Boltzmann answered with $H$-theorems and coarse-graining, and a kinematic half — *what does $t \\to -t$ do to a quantum state?* — which Wigner answered with ant
