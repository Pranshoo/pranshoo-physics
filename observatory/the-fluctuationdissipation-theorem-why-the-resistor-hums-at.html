amic derivation ⟨V²⟩ = 4k_BTRΔf via the equipartition energy of a transmission-line eigenmode — the first FDT identity in closed form", "who": "Harry Nyquist", "work": "Physical Review 32, 110", "kind": "theory", "ref": null}, {"year": 1931, "event": "Reciprocal relations and the regression hypothesis: equilibrium fluctuations decay on average like macroscopic perturbations — the conceptual bridge that makes a general FDT possible", "who": "Lars Onsager", "work": "Phys. Rev. 37, 405 and 38, 2265", "kind": "theory", "ref": 10}, {"year": 1945, "event": "Quantum reformulation of the Nyquist relation using the full Planck spectrum 2ℏω coth(ℏω/2k_BT) — extends the resistor formula to the radiation-pressure / blackbody regime", "who": "Hendrik Casimir", "work": "Philips Research Reports / unpublished Bell-Labs-era note (verify)", "kind": "theory", "ref": null}, {"year": 1951, "event": "General Callen–Welton FDT: ⟨{A,A}⟩_ω = ℏ coth(ℏω/2k_BT) χ''_AA(ω), proved for any system perturbed by a weak external force — the first universal quantum statement", "who": "Herbert B. Callen, Theodore A. Welton", "work": "Physical Review 83, 34", "kind": "formalization", "ref": null}, {"year": 1952, "event": "Extensions of Callen–Welton to include irreversible thermodynamic fluxes and the Onsager coefficients (Callen with Greene and with Welton, several follow-ups)", "who": "Herbert B. Callen, Richard F. Greene", "work": "Physical Review 86, 702; 88, 1387", "kind": "formalization", "ref": null}, {"year": 1953, "event": "Independent statement in the Soviet literature linking generalized impedance to fluctuation spectra; later generalized to electromagnetic stress fluctuations (Lifshitz 1955, Rytov 1953)", "who": "Sergei M. Rytov", "work": "Theory of Electrical Fluctuations and Thermal Radiation (Moscow, Acad. Sci. USSR press)", "kind": "formalization", "ref": null}, {"year": 1957, "event": "Kubo linear-response framework: the FDT becomes a corollary of the Kubo formula σ(ω) = (1/ℏω) ∫dt e^{iωt} ⟨[J(t),J(0)]⟩, with the 'second FDT' for the GLE memory kernel", "who": "Ryogo Kubo", "work": "J. Phys. Soc. Japan 12, 570", "kind": "formalization", "ref": 46}, {"year": 1959, "event": "Stratonovich gives the FDT in the symmetric-product (white-noise) Langevin language and proves its consistency with detailed balance", "who": "Ruslan L. Stratonovich", "work": "Topics in the Theory of Random Noise (English transl. 1963)", "kind": "formalization", "ref": null}, {"year": 1966, "event": "Kubo's Reports on Progress in Physics review consolidates the 'first' and 'second' FDTs and codifies the phrase 'fluctuation-dissipation theorem' in English-language physics", "who": "Ryogo Kubo", "work": "Rep. Prog. Phys. 29, 255", "kind": "naming", "ref": 52}, {"year": 1993, "event": "Cugliandolo–Kurchan introduce the FDT-violation ratio X(t,t') for aging glasses, defining an 'effective temperature' T_eff = T/X — the canonical modern abuse-and-extension", "who": "Leticia F. Cugliandolo, Jorge Kurchan", "work": "Phys. Rev. Lett. 71, 173", "kind": "revival", "ref": null}, {"year": 2009, "event": "Harada–Sasa equality: in non-equilibrium steady states, the gap between response and correlation equals the dissipation rate — a constructive replacement for the FDT out of equilibrium", "who": "Takahiro Harada, Shin-ichi Sasa", "work": "Phys. Rev. Lett. 95, 130602 (2005); review Prog. Theor. Phys. Suppl. 130, 29 (2009)", "kind": "revival", "ref": null}], "neglected": [{"name": "Walter Schottky", "role": "First to predict thermal noise in conductors (1918), explicitly separating it from shot noise; the relation ⟨V²⟩ ∝ RT appears in his discussion as a conjectured 'Wärmeeffekt' a decade before Johnson and Nyquist", "evidence": "Schottky 1918 Ann. Phys. paper; documented in C. Beenakker \u0026 C. Schönenberger, Physics Today 56 (May 2003) 'Quantum shot noise' and in L. Reggiani's noise-history reviews", "ref": null}, {"name": "Geertruida de Haas-Lorentz", "role": "Her 1912 Leiden thesis (under H. A. Lorentz) applied Einstein's fluctuation theory to electrons in conductors and effectively predicted electronic thermal noise in metals — anticipating Schottky's thermal-noise idea by six years; almost never cited", "evidence": "G. L. de Haas-Lorentz, 'Die Brownsche Bewegung und einige verwandte Erscheinungen', dissertation, Leiden 1912 (Vieweg, Braunschweig); discussed in van der Ziel's 1986 'Noise in Solid State Devices' historical preface", "ref": null}, {"name": "Sergei M. Rytov / Mikhail Leontovich", "role": "The Soviet school built a fully general theory of electromagnetic fluctuations (Rytov 1953) and a linear-response form of the FDT independently of Callen–Welton; Leontovich's 1935 fluctuation-electrodynamics work is a direct precursor", "evidence": "Rytov, 'Teoriya elektricheskikh fluktuatsii i teplovogo izlucheniya' (1953); Landau–Lifshitz Stat. Phys. vol. 5 §124 footnote credits the Soviet line; English summary in Rytov, Kravtsov, Tatarskii 'Principles of Statistical Radiophysics' (Springer 1989)", "ref": null}, {"name": "Melville S. Green", "role": "Green's 1952 and 1954 papers gave a current-current correlation expression for transport coefficients (the 'Green' in Green–Kubo) before Kubo's 1957 synthesis; standardly under-credited in Western textbooks that say only 'Kubo formula'", "evidence": "M. S. Green, J. Chem. Phys. 20, 1281 (1952); 22, 398 (1954); discussed in Zwanzig's 'Nonequilibrium Statistical Mechanics' (Oxford 2001) historical notes", "ref": null}, {"name": "Richard F. Greene (with Callen)", "role": "Co-author of the 1952 extensions of Callen–Welton to irreversible thermodynamics; his name has effectively dropped out of the FDT citation chain even in graduate textbooks", "evidence": "Callen \u0026 Greene, Phys. Rev. 86, 702 (1952); Greene \u0026 Callen, Phys. Rev. 88, 1387 (1952)", "ref": null}, {"name": "Theodore A. Welton", "role": "Equal co-author of the canonical 1951 paper but routinely omitted: physicists say 'Callen's theorem'; Welton is best known for the Welton (vacuum-fluctuation) interpretation of the Lamb shift, also 1948", "evidence": "Callen \u0026 Welton, Phys. Rev. 83, 34 (1951); Welton's biographical memoir, Oak Ridge archives", "ref": null}], "conflations": [{"claim": "The FDT 'holds in the linear regime'", "clarification": "Two independent assumptions are being collapsed. (i) Linear response in the external probe — the susceptibility χ is defined to first order in the perturbation. (ii) The unperturbed state is true thermal equilibrium with a well-defined T. Driven steady states can be perfectly linear-response yet violate the FDT because (ii) fails. Calling a system 'linear' does not entitle one to use S(ω) = 2ℏ coth(ℏω/2k_BT) χ''(ω)."}, {"claim": "An 'effective temperature' extracted from FDT-violation measures the kinetic temperature of slow degrees of freedom", "clarification": "T_eff defined via X(t,t') = T_FDT/T (Cugliandolo–Kurchan) is observable-dependent in general non-equilibrium systems; it coincides with a true thermodynamic temperature only in a narrow class of mean-field aging glasses where time-scale separation holds. In active matter and driven steady states, different observables give different T_eff — the construction is descriptive, not diagnostic of equilibrium."}, {"claim": "Johnson noise and shot noise are 'two regimes' of the same FDT", "clarification": "They are physically distinct. Johnson–Nyquist noise is equilibrium FDT noise of a dissipative element: it requires only finite R and T, vanishes as T→0 (modulo zero-point), and is independent of current. Shot noise is non-equilibrium partition noise of discrete carriers crossing a barrier; it survives at T=0, scales with current I, and is captured not by FDT but by a scattering/Levitov–Lesovik formula. Schottky already distinguished them in 1918."}, {"claim": "The 'classical FDT' is S(ω) = (2k_BT/ω) χ''(ω) — period.", "clarification": "That form is the high-T limit of the symmetrized quantum FDT and it is asymmetric in two distinct ways that the modern literature blurs: (a) symmetrized vs Kubo-canonical correlator (factor (ℏω/2)coth(ℏω/2k_BT) vs (1−e^{−βℏω})^{−1}); (b) S(ω) vs S(−ω) detailed-balance asymmetry which is the entire content of the theorem at finite ℏ. Quoting the classical form in a quantum-optics or low-T solid-state context silently drops zero-point noise and the asymmetry that makes the theorem nontrivial."}, {"claim": "The Onsager regression hypothesis is 'the same thing as' the FDT", "clarification": "Onsager's hypothesis says equilibrium fluctuations regress on average like macroscopic relaxations — a statement about the *mean* response of fluctuations. The FDT is the stronger frequency-resolved statement about the *spectrum* of fluctuations and its connection to χ''(ω). The first is necessary but not sufficient; one also needs detailed balance and a Hamiltonian generator to obtain the FDT proper."}], "sections": [{"id": "why-this-mattered", "title": "Why This Mattered: From Brownian Diffusion to the Hissing Resistor", "markdown": "## Why This Mattered: From Brownian Diffusion to the Hissing Resistor\n\nThe fluctuation–dissipation theorem did not arrive as a theorem. It accreted, over half a century, around a single empirical bruise: every dissipative element radiates noise, and the noise is set by the same coefficient that sets the dissipation. Einstein's 1905 Brownian-motion paper gave the prototype — for a particle of mobility $\\mu$ in a thermal bath,\n\n$$D = \\mu\\, k_B T,$$\n\nbinding the random walk (a fluctuation) to the friction (a dissipation) by the temperature alone. Smoluchowski independently reached the same balance from a kinetic argument in 1906, and in 1908 Langevin recast it at the equation-of-motion level: a Newtonian particle obeys $m\\dot v = -\\gamma v + \\xi(t)$ with $\\langle \\xi(t)\\xi(t')\\rangle = 2\\gamma k_B T\\,\\delta(t-t')$. The friction $\\gamma$ and the noise variance are not independent inputs — one fixes the other. This is already the FDT in the harmonic-oscillator regime, but no one yet called it that.\n\nThe conceptual leap from a colloidal grain to a conductor was made not by Schottky but by Geertruida de Haas-Lorentz, in a Leiden thesis written under her father in 1912 [82]. She treated conduction electrons as Brownian particles in a Drude-like bath and, in modern language, computed the mean-square voltage fluctuation across a resistor — the first explicit application of Einstein's fluctuation theory to a circuit element ([Wikipedia: G. de Haas-Lorentz](https://en.wikipedia.org/wiki/Geertruida_de_Haas-Lorentz); [Lemons \u0026 Gythiel arXiv:2006.05399](https://arxiv.org/pdf/2006.05399)). Ornstein's 1917 paper cites her as the starting point. Outside Holland she has effectively vanished from the citation chain.\n\nSix years later, Schottky [71] separated, in a single *Annalen der Physik* paper on vacuum-tube noise, two intrinsic sources: the *Schroteffekt* (shot noise) from the discreteness of carriers and the *Wärmeeffekt* (heat noise) from thermal agitation in the electrode resistances. The shot-noise part he could compute; the thermal part he could only claim must exist, with magnitude proportional to $RT$ ([Beenakker \u0026 Schönenberger, *Physics Today*, May 2003](https://www.lorentz.leidenuniv.nl/beenakker/beenakkr/mesoscopics/topics/noise/noise.html)). Textbook histories that begin in 1928 quietly erase this prediction; they also erase the fact that Schottky had already drawn the line between equilibrium thermal noise and non-equilibrium partition noise that the modern literature regularly smears.\n\nJohnson's 1927 Bell Labs measurement and Nyquist's 1928 derivation [72, 73] then turned the conjecture into a quantitative law. Nyquist's argument is striking for what it does *not* assume: no microscopic model of the electrons, no Boltzmann equation. He couples the resistor to a lossless transmission line, lets the line equilibrate at temperature $T$, applies equipartition $\\tfrac12 k_B T$ per electromagnetic mode, and reads off\n\n$$\\langle V^2 \\rangle = 4\\,k_B T R\\,\\Delta f.$$\n\nPure thermodynamics — the FDT delivered by mode-counting. It is in this minimalism that the universality of the eventual theorem is foreshadowed: the resistor never appears as anything but a black box with one number, $R$.\n\nUniversality required a missing conceptual bridge, supplied by Onsager in 1931 [10, 11]: the *regression hypothesis* — that equilibrium fluctuations, on average, decay by the same linear laws that govern macroscopic relaxations. Without this, Nyquist's circuit identity is a special case; with it, one is licensed to expect a similar relation between *any* response function and *any* spontaneous correlator, and to derive reciprocity (Onsager symmetry) as a corollary. Modern texts often suppress the debt: Onsager is cited for the reciprocal relations and dropped from the FDT pedigree, even though the leap is his.\n\nCallen and Welton closed the loop in 1951 [74] with the first universal quantum statement. For a system perturbed by $-A F(t)$, the symmetrized fluctuation spectrum and the imaginary part of the susceptibility are related by\n\n$$S_{AA}(\\omega) = \\hbar\\,\\coth\\!\\left(\\frac{\\hbar\\omega}{2 k_B T}\\right)\\chi''_{AA}(\\omega).$$\n\nNyquist is the $\\hbar\\omega \\ll k_B T$ limit; $\\hbar\\omega \\gg k_B T$ is zero-point noise, born from the same coth. Welton's name has steadily eroded — physicists now say \"Callen's theorem\" — and the 1952 Callen–Greene and Greene–Callen sequels that bolted the result onto Onsager's irreversible-thermodynamic apparatus are almost never cited.\n\nA parallel Soviet line ran more or less independently. Leontovich's 1935 fluctuation electrodynamics and Rytov's 1953 monograph [77] built a fully general theory of electromagnetic fluctuations from a linear-response viewpoint, predating or paralleling Callen–Welton. Landau–Lifshitz §123–125 [78] compresses that whole tradition into one citation, which is how Anglophone graduate students typically meet it, if at all.\n\nKubo's 1957 paper [46] then gave the result its modern algebraic skeleton — the linear-response formula\n\n$$\\sigma(\\omega) = \\frac{1}{\\hbar\\omega}\\int_{-\\infty}^{\\infty} dt\\, e^{i\\omega t}\\,\\langle [J(t),J(0)]\\rangle,$$\n\nfrom which the FDT follows by combining commutator and anticommutator. Two further debts are usually unpaid. Melville Green's 1952 and 1954 papers [75] wrote the current–current correlation form of transport coefficients first; *Green–Kubo* survives in the transport literature but not in the FDT one. Mori's 1965 projection-operator derivation [76] is the calculation most modern textbook proofs actually reproduce. Kubo's 1966 *Rep. Prog. Phys.* review [52] then consolidated the \"first\" and \"second\" FDTs and welded the English-language phrase *fluctuation–dissipation theorem* onto a body of results whose authorship was already four decades and three national traditions deep."}, {"id": "the-physics-properly", "title": "The Physics, Properly: Callen–Welton, Kubo, and the Numbered Assumptions", "markdown": "## The Physics, Properly: Callen–Welton, Kubo, and the Numbered Assumptions\n\nThe FDT is a Lehmann identity wearing operator algebra. Strip the textbook hand-waving and seven hypotheses appear; each can — and historically did — fail somewhere useful. The labels below are reused verbatim in §3 (failure modes) and §6 (the believer's checklist).\n\n### The numbered hypotheses\n\n**A1 — Hamiltonian generator.** The unperturbed system evolves under a self-adjoint $H_0$ bounded below, with $A(t)=e^{iH_0t/\\hbar}\\,A\\,e^{-iH_0t/\\hbar}$. Fails for Lindbladian baths treated as \"the system\", for stroboscopic Floquet drives, and for active matter with explicit non-conservative forces.\n\n**A2 — Gibbs state at $T$.** $\\rho_0=e^{-\\beta H_0}/Z$ with one well-defined $\\beta=1/k_BT$ for the degrees of freedom in $A$. Fails in NESS, aging glasses [79], driven soft matter [70].\n\n**A3 — Weak external probe.** $H'(t)=-A f(t)$ with $\\lvert Af\\rvert$ small on the support of the relevant matrix elements.\n\n**A4 — First-order response.** The Dyson expansion is truncated at $O(f)$, so $\\langle\\delta A(t)\\rangle=\\int dt'\\,\\chi_{AA}(t-t')f(t')$.\n\n**A5 — Stationarity.** Two-time correlators depend on $t-t'$ only; equivalent to $[\\rho_0,H_0]=0$, hence guaranteed by A2 alone if A2 is taken strictly.\n\n**A6 — Time reversal / KMS / detailed balance.** $A$ has a definite signature under $\\mathcal{T}$ and $\\rho_0$ satisfies $\\langle A(t)A(0)\\rangle = \\langle A(0)A(t+i\\hbar\\beta)\\rangle$.\n\n**A7 — Ergodicity on the relevant timescale.** Time averages over the measurement window equal Gibbs averages; no slow sector escapes the ensemble during observation. Fails for MBL [68], glasses below the ergodic timescale, optically trapped colloids near barriers.\n\n### Derivation\n\nIn the eigenbasis $H_0\\lvert n\\rangle = E_n\\lvert n\\rangle$, the asymmetric (one-sided) spectrum is\n$$C_+(\\omega)\\;=\\;\\int dt\\,e^{i\\omega t}\\langle A(t)A(0)\\rangle_0\\;=\\;\\frac{2\\pi}{Z}\\sum_{n,m}e^{-\\beta E_n}\\lvert A_{nm}\\rvert^{2}\\,\\delta(\\omega-\\omega_{mn}),$$\nwith $\\omega_{mn}=(E_m-E_n)/\\hbar$. Repeating for $\\langle A(0)A(t)\\rangle$ and relabelling $n\\leftrightarrow m$ on the delta-function support,\n$$C_-(\\omega)\\;=\\;e^{-\\beta\\hbar\\omega}\\,C_+(\\omega)\\qquad\\text{(KMS, from A2+A6).}$$\nThat single line is the entire content of the theorem; everything else is bookkeeping.\n\n**Commutator spectrum.** Under A3–A4 the Kubo susceptibility is\n$$\\chi_{AA}(t)\\;=\\;\\frac{i}{\\hbar}\\,\\theta(t)\\,\\langle[A(t),A(0)]\\rangle_0,$$\nand its imaginary part obeys\n$$2\\hbar\\,\\chi''_{AA}(\\omega)\\;=\\;C_+(\\omega)-C_-(\\omega)\\;=\\;\\bigl(1-e^{-\\beta\\hbar\\omega}\\bigr)\\,C_+(\\omega).$$\n\n**Symmetrized correlator (Callen–Welton form, [74]).** With $S_{AA}(\\omega)=\\tfrac12\\!\\int dt\\,e^{i\\omega t}\\langle\\{A(t),A(0)\\}\\rangle_0=\\tfrac12(1+e^{-\\beta\\hbar\\omega})C_+(\\omega)$, eliminating $C_+$ gives\n$$\\boxed{\\;S_{AA}(\\omega)\\;=\\;\\hbar\\,\\coth\\!\\Bigl(\\tfrac{\\beta\\hbar\\omega}{2}\\Bigr)\\,\\chi''_{AA}(\\omega)\\;}$$\n— the canonical 1951 statement. Its $\\beta\\hbar\\omega\\to 0$ limit collapses to Nyquist's $S=(2k_BT/\\omega)\\chi''$ [73]; its $T\\to 0$ limit is $S=\\hbar\\lvert\\omega\\rvert\\chi''$, the zero-point floor that does *not* vanish.\n\n**Kubo-canonical form.** Kubo [46] preferred the canonical correlator\n$$C_K(t)\\;=\\;\\frac{1}{\\beta}\\!\\int_0^\\beta\\!d\\lambda\\,\\langle A(t-i\\hbar\\lambda)A(0)\\rangle_0,$$\nwhose Lehmann spectrum collapses cleanly to\n$$\\widetilde C_K(\\omega)\\;=\\;\\frac{2k_BT}{\\omega}\\,\\chi''_{AA}(\\omega).$$\nThe two forms are equivalent in content but differ in *appearance*: the Kubo correlator hides all quantum statistics inside the imaginary-time integral and looks classical at every $T$, while $S_{AA}$ wears its zero-point on the outside. The frequent claim that \"the classical FDT is $S=(2k_BT/\\omega)\\chi''$\" conflates the two; the formula is exact for $\\widetilde C_K$, only asymptotic for $S_{AA}$ (§1 conflation #4).\n\n**Detailed-balance asymmetry.** The one-sided spectrum itself obeys\n$$\\boxed{\\;\\frac{C_+(\\omega)}{C_+(-\\omega)}\\;=\\;e^{\\beta\\hbar\\omega}\\;}$$\n— the operational content of the theorem for any detector that distinguishes positive and negative frequencies (a photon counter, a calorimeter, a microwave radiometer). Symmetrizing throws this away by construction; nature does not symmetrize.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eKMS detailed balance between absorption and emission\u003c/title\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cpolygon points=\"60,52 54,66 66,66\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"40\" y=\"58\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eE\u003c/text\u003e\u003cline x1=\"90\" y1=\"290\" x2=\"320\" y2=\"290\" stroke=\"#e8e6e1\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"330\" y=\"295\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|n⟩, E_n\u003c/text\u003e\u003ctext x=\"330\" y=\"313\" fill=\"#7aa2ff\" font-size=\"13\"\u003ep_n ∝ e^(−βE_n)\u003c/text\u003e\u003cline x1=\"90\" y1=\"150\" x2=\"320\" y2=\"150\" stroke=\"#e8e6e1\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"330\" y=\"155\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|m⟩, E_m = E_n + ℏω\u003c/text\u003e\u003ctext x=\"330\" y=\"173\" fill=\"#7aa2ff\" font-size=\"13\"\u003ep_m ∝ e^(−βE_n)·e^(−βℏω)\u003c/text\u003e\u003cline x1=\"150\" y1=\"288\" x2=\"150\" y2=\"160\" stroke=\"#7ee0a3\" stroke-width=\"2.4\"/\u003e\u003cpolygon points=\"150,150 144,164 156,164\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"140\" y=\"225\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"end\"\u003eabsorb ℏω\u003c/text\u003e\u003ctext x=\"140\" y=\"243\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"end\"\u003e∝ p_n |A_(nm)|²\u003c/text\u003e\u003ctext x=\"140\" y=\"261\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"end\"\u003e→ C₊(ω)\u003c/text\u003e\u003cline x1=\"260\" y1=\"160\" x2=\"260\" y2=\"280\" stroke=\"#ffb86b\" stroke-width=\"2.4\"/\u003e\u003cpolygon points=\"260,290 254,276 266,276\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"275\" y=\"225\" fill=\"#ffb86b\" font-size=\"14\"\u003eemit ℏω\u003c/text\u003e\u003ctext x=\"275\" y=\"243\" fill=\"#ffb86b\" font-size=\"13\"\u003e∝ p_m |A_(nm)|²\u003c/text\u003e\u003ctext x=\"275\" y=\"261\" fill=\"#ffb86b\" font-size=\"13\"\u003e→ C₊(−ω) = C₋(ω)\u003c/text\u003e\u003cline x1=\"90\" y1=\"345\" x2=\"640\" y2=\"345\" stroke=\"#e8e6e1\" stroke-width=\"0.4\" stroke-dasharray=\"3,3\"/\u003e\u003ctext x=\"365\" y=\"380\" fill=\"#ff7a90\" font-size=\"17\" text-anchor=\"middle\"\u003eC₊(ω) / C₊(−ω) = p_n / p_m = exp(βℏω)   ⇒   S(ω) = ℏ coth(βℏω/2) χ″(ω)\u003c/text\u003e\u003c/svg\u003e\n*Figure: Detailed balance as a two-level cartoon. Absorption at $+\\omega$ samples the lower-population factor $p_n$; emission at $-\\omega$ samples $p_m=p_n e^{-\\beta\\hbar\\omega}$. The ratio of one-sided spectra is fixed entirely by A2+A6, with no reference to the matrix elements $A_{nm}$; the symmetrized FDT is the corollary obtained by averaging the two channels.*\n\n### The \"second FDT\": GLE memory kernel\n\nProject a privileged coordinate $x$ onto orthogonal bath modes (Mori 1965 [76]). The generalized Langevin equation\n$$M\\ddot x(t)\\;+\\;\\int_0^t\\!ds\\,\\gamma(t-s)\\,\\dot x(s)\\;=\\;F_{\\text{ext}}(t)\\;+\\;\\xi(t)$$\ninherits a strict constraint — Kubo's *second FDT* —\n$$\\tfrac12\\langle\\{\\xi(t),\\xi(t')\\}\\rangle\\;=\\;\\int\\!\\frac{d\\omega}{2\\pi}\\,e^{-i\\omega(t-t')}\\,\\hbar\\,\\coth\\!\\Bigl(\\tfrac{\\beta\\hbar\\omega}{2}\\Bigr)\\,\\widetilde\\gamma'(\\omega),$$\nwith $\\widetilde\\gamma'(\\omega)=\\operatorname{Re}\\widetilde\\gamma(\\omega)$ the dissipative part of the kernel. In the classical limit it collapses to $\\langle\\xi(t)\\xi(t')\\rangle=k_BT\\,\\gamma(\\lvert t-t'\\rvert)$ — the Einstein–Smoluchowski balance promoted from $D=\\mu k_BT$ to a memory kernel. Kubo's labelling distinguishes them by what they constrain: the *first* FDT ties response to fluctuations of the observed coordinate; the second ties the stochastic force driving the equation of motion to the dissipation kernel of the same equation. Both rest on A1–A7, and both fail in identical ways when any single hypothesis collapses — which §3 enumerates."}, {"id": "strict-conditions-failure-modes", "title": "Strict Conditions \u0026 Failure Modes: What Breaks When Each Ai Falls", "markdown": "## Strict Conditions \u0026 Failure Modes: What Breaks When Each Ai Falls\n\nThe seven assumptions of §2 — A1 Hamiltonian generator, A2 Gibbs state $\\rho \\propto e^{-\\beta H}$, A3 linearity in the probe, A4 unique stationary response kernel, A5 time-translation invariance, A6 microscopic reversibility (or its Onsager–Casimir generalization), A7 ergodic mixing on the observation window — are not co-equal. They fail in different physical regimes, with different signatures, and demand different repairs. Walking them in order:\n\n### A1: Hamiltonian generator → active drive\n\nThe Callen–Welton derivation [74] needs $\\dot{\\rho} = -\\tfrac{i}{\\hbar}[H_0+V(t),\\rho]$. The moment the generator includes a non-conservative drive at the *single-particle* level — chemical fuel turning over in a motor head, a self-propulsion velocity $v_0\\hat{n}_i$ in active matter [60] — the susceptibility decomposes into a reversible part obeying FDT and a non-reversible part that does not. For run-and-tumble or active-Brownian colloids with persistence time $\\tau_p$, the violation is concentrated at $\\omega \\lesssim \\tau_p^{-1}$ and vanishes at $\\omega\\tau_p \\gg 1$, where the active force decorrelates and looks thermal. Speck's analysis [70] makes this precise: the FDT violation in driven soft matter is exactly the entropy-production rate measured per mode.\n\n### A2: Gibbs state → NESS, glasses, aging\n\nA1 can hold (Hamiltonian bath) while A2 fails because the state is not $e^{-\\beta H}$. Three subclasses:\n\n1. **Driven steady states.** A voltage-biased mesoscopic conductor at $T$ has stationary $\\rho_{\\text{NESS}}$; the current correlator splits into the Johnson piece $4k_BTG\\Delta f$ and the non-equilibrium piece. At $eV \\ll k_BT$ noise is Johnsonian; at $eV \\gg k_BT$ it crosses over to shot $2eI\\Delta f$. The crossover $S_I(V,T) = 2eI\\coth(eV/2k_BT)$ is a textbook diagnostic that A2 has broken even though the channel is linear-response in $V$ around its biased point.\n2. **Structural glasses below $T_g$.** No Gibbs measure on the experimental timescale. The FDT-violation ratio $X(t,t_w)$ of Cugliandolo–Kurchan [79] is observable, with mean-field values clustered at $X \\approx 0.4$–$0.7$ for the $p$-spin and SK models — i.e. $T_{\\text{eff}} \\approx 1.4$–$2.5\\,T$. Whether this $T_{\\text{eff}}$ is a thermodynamic temperature or a curve fit depends on whether the time-scale separation that makes it observable-independent actually holds; outside mean field it usually does not [81].\n3. **Aging.** Even if the eventual state is Gibbsian, on $t_w$-dependent timescales the system has not reached it; this also voids A5 (see below).\n\n### A3–A4: linear and unique response → strong probes, harmonics\n\nA3 is the formal first-order-in-$V$ expansion. A4 is the stronger claim that the linear kernel $\\chi(t-t')$ exists and is unique. Both fail when the probe is large enough that $\\chi^{(3)}$ and higher matter. Nonlinear susceptibilities are not \"small FDT corrections\": $\\chi^{(3)}(\\omega_1,\\omega_2,\\omega_3)$ has its own sum-rule structure (Bouchaud–Biroli for glassy systems) but no two-point fluctuation partner. Second-harmonic generation in optical media is the canonical case where chasing an FDT identity is a category error. Asheichyk–Krüger [69] explicitly extend the FDT to non-conservative force fields *within* linear response; outside it there is no theorem to extend.\n\n### A5: time-translation invariance → aging, post-quench\n\nThe FDT is a statement about $C(\\omega), \\chi(\\omega)$, which presuppose stationarity. After a quench through $T_g$, the two-time correlator depends on both $t$ and $t_w$. Define $C(t,t_w) = \\langle A(t)A(t_w)\\rangle$ and $R(t,t_w) = \\delta\\langle A(t)\\rangle/\\delta h(t_w)$. The FDT $\\partial_{t_w}C = k_BT\\,R$ degrades to $\\partial_{t_w}C = (k_BT/X(t,t_w))\\,R$, and the equilibrium identity is recovered only in the limit $t_w\\to\\infty$ with $\\tau = t-t_w$ fixed and small. Confusing the $\\omega$-domain FDT with this two-time relation is one of the most common errors in the colloidal-aging literature.\n\n### A6: microscopic reversibility → magnetic fields, driven systems\n\nTime-reversal symmetry of $H_0$ is what allows the swap $\\chi_{AB}(\\omega) = \\chi_{BA}(\\omega)$ and the Kubo symmetrization. A finite $\\mathbf{B}$ flips signature parity; the correct identity is Onsager–Casimir, $L_{ij}(\\mathbf{B}) = \\epsilon_i\\epsilon_j L_{ji}(-\\mathbf{B})$ [10,11]. Hall response is the standard demonstration: the antisymmetric $\\sigma_{xy}$ does not obey naive FDT but does obey the Casimir-generalized form. Genuine driving breaks $\\mathcal{T}$ at the dynamical level and no field-reversal trick rescues it; Harada–Sasa [80] then give the substitute, $\\langle J\\rangle\\cdot F_{\\text{drive}} = \\int \\tfrac{d\\omega}{2\\pi}\\!\\left[\\tilde C(\\omega) - 2k_BT\\,\\tilde R'(\\omega)\\right]$, identifying the FDT-violation integral with the housekeeping dissipation rate. This is the constructive replacement once A6 is gone.\n\n### A7: ergodic mixing → spin glasses, MBL, kinetic constraints\n\nThe Kubo identity needs $\\lim_{T\\to\\infty}T^{-1}\\!\\int_0^T\\!dt\\,A(t) = \\langle A\\rangle_{\\text{eq}}$ over the observation window. Spin glasses with replica-symmetry breaking sample only one pure state; the longitudinal susceptibility $\\chi_{\\text{long}}$ exceeds the $\\chi_{\\text{FDT}}$ reconstructed from fluctuations by exactly the Edwards–Anderson order parameter — the *anomaly*. Many-body localized systems [68] retain memory of initial conditions over the entire accessible window; the local FDT fails not because dissipation vanishes but because the autocorrelator has a non-decaying plateau. Kinetically constrained models reach the same pathology by dynamical, not energetic, means.\n\n### Diagnostic hierarchy\n\nThe failures are nested in severity: A3–A4 produce *quantitative* corrections within a controlled expansion; A5 produces a *two-time* generalization with a well-defined limit; A6–A7 require *new identities* (Onsager–Casimir, replica FDT); A1–A2 require *abandoning* FDT and using its replacements — Harada–Sasa [80], the Marconi–Vulpiani response framework [81], or the Crooks/Jarzynski fluctuation theorems [65] which restore an exact identity at the cost of trading spectra for work distributions."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Direct vs Indirect, and What Else Could Fake Them", "markdown": "## Signatures: Direct vs Indirect, and What Else Could Fake Them\n\nThe FDT is not falsified by checking a spectrum — it is falsified by checking the *relation* between two independently measurable quantities on the same degree of freedom. Section 2 made this point algebraically; here it sets the experimental rule. A **direct** test measures the dissipative response $\\chi''_{AA}(\\omega)$ (or, equivalently, $\\mathrm{Re}\\,Z(\\omega)$) and the symmetrized correlator $S_{AA}(\\omega)$ on the same observable $A$, then asks whether\n$$S_{AA}(\\omega) \\;=\\; \\hbar\\,\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_B T}\\right)\\chi''_{AA}(\\omega)$$\nholds across frequency at a single, independently measured $T$. An **indirect** signature checks only one side — a spectral shape, a thermal scaling, a Johnson-like magnitude — and infers the FDT by elimination. Indirect signatures are cheap and almost always wrong about something.\n\n### Direct tests that have actually been done\n\n**Josephson junctions (Koch–Van Harlingen–Clarke, 1980–82) (verify).** A current-biased junction has a measurable differential conductance $G(\\omega)$ from the I-V curve and microwave response, and a measurable current-noise spectrum $S_I(\\omega)$ from a tuned SQUID amplifier. Sweeping $\\hbar\\omega/k_B T$ from $\\ll 1$ to $\\sim 5$, they recovered the full $\\coth$ crossover from the $4k_B T G$ plateau to the $2\\hbar\\omega G$ zero-point tail. This is the canonical direct test because (i) two independent measurements, (ii) one calibrated thermometer, (iii) one fit parameter ($T$) that must match.\n\n**LIGO suspension thermal noise (verify).** A pendulum's mechanical susceptibility $\\chi(\\omega)$ is mapped by ring-down and by driven calibration; the displacement noise $S_x(\\omega)$ is read out by the interferometer. Off-resonance, the FDT-predicted $S_x(\\omega) = (4 k_B T/\\omega^2)\\,\\mathrm{Im}\\,[1/Z_m(\\omega)]$ falls as a *structural*-damping tail (loss angle $\\phi$, not viscous $\\gamma$), and the data match to within the loss-angle uncertainty. The test is direct because both $\\chi$ and $S$ are read on the same mirror coordinate; it is also a powerful screen for $1/f$ coating-loss impostors.\n\n**Cavity-optomechanics sideband asymmetry [49].** The Stokes/anti-Stokes ratio $S_{xx}(+\\Omega_m)/S_{xx}(-\\Omega_m) = (n+1)/n = \\exp(\\hbar\\Omega_m/k_B T)$ is a direct detailed-balance check — the asymmetry *is* the FDT, with no fit. Observed ratio $\\neq$ Boltzmann factor means either non-equilibrium occupation or a violation of A2 (Gibbs state).\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eVoltage-noise spectrum: FDT vs its impostors\u003c/title\u003e\u003cline x1=\"90\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"90\" y1=\"340\" x2=\"90\" y2=\"50\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"385\" y=\"380\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003elog ω\u003c/text\u003e\u003ctext x=\"385\" y=\"395\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e(crossover at ω_T = k_BT/ℏ)\u003c/text\u003e\u003ctext x=\"35\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 35 195)\"\u003elog S_V(ω)\u003c/text\u003e\u003cline x1=\"400\" y1=\"340\" x2=\"400\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"0.8\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"400\" y=\"48\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eω_T = k_BT/ℏ\u003c/text\u003e\u003cpolyline points=\"110,205 200,205 290,205 360,203 400,198 440,182 500,148 560,110 620,72 660,48\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.8\"/\u003e\u003ctext x=\"150\" y=\"195\" fill=\"#7aa2ff\" font-size=\"13\"\u003e4k_BTR (Johnson plateau)\u003c/text\u003e\u003ctext x=\"540\" y=\"100\" fill=\"#7aa2ff\" font-size=\"13\"\u003e2ℏωR (zero-point tail)\u003c/text\u003e\u003ctext x=\"170\" y=\"225\" fill=\"#7aa2ff\" font-size=\"14\" font-weight=\"bold\"\u003eFDT: ℏω coth(ℏω/2k_BT) Re Z(ω)\u003c/text\u003e\u003cpolyline points=\"110,255 200,255 290,255 400,255 500,255 600,255 660,255\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\" stroke-dasharray=\"7 4\"/\u003e\u003ctext x=\"470\" y=\"248\" fill=\"#ffb86b\" font-size=\"13\"\u003e2eI shot (∝ I, not T; flat to ω ≈ eV/ℏ)\u003c/text\u003e\u003cpolyline points=\"110,80 170,118 230,156 290,194 350,232 400,260\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"115\" y=\"72\" fill=\"#ff7a90\" font-size=\"13\"\u003e1/f \u0026amp; telegraph (low-ω impostor)\u003c/text\u003e\u003cpolyline points=\"110,300 660,300\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\" stroke-dasharray=\"2 4\"/\u003e\u003ctext x=\"480\" y=\"318\" fill=\"#7ee0a3\" font-size=\"13\"\u003ecryogenic amplifier noise floor\u003c/text\u003e\u003cpolyline points=\"520,300 560,265 605,215 645,165\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"430\" y=\"155\" fill=\"#7ee0a3\" font-size=\"12\"\u003eamp gain rolloff can fake ℏω tail\u003c/text\u003e\u003c/svg\u003e\n*Figure: A log-log voltage-noise spectrum. The FDT curve (blue) is the unique signature: a $4k_BTR$ plateau and a slope-+1 zero-point tail joined at $\\omega_T = k_BT/\\hbar$. Impostors share *one* feature each — shot noise (orange) gives a flat plateau but scales with bias current $I$, not $T$; $1/f$ and telegraph noise (pink) rise at low $\\omega$; amplifier bandwidth (green) can mimic the zero-point rise. Only a simultaneous fit of plateau height, crossover frequency, and high-$\\omega$ slope to a single $T$ — together with an independent measurement of $\\mathrm{Re}\\,Z(\\omega)$ — is a direct FDT test.*\n\n### Indirect signatures and their impostors\n\n**(i) $S \\propto T$.** Sweep $T$ and watch the plateau move. Impostor: *shot noise* [71] scales with bias current $I$, not $T$, and survives at $T \\to 0$. **Discriminator:** vary $I$ at fixed $T$ (FDT noise unchanged; shot noise tracks $I$), and check the Fano factor $S/2eI$ against scattering predictions.\n\n**(ii) $S \\propto R$ at fixed $T$.** Swap the resistor. Impostor: ground-loop and common-mode pickup also scale with source impedance through the input divider. **Discriminator:** the noise must not depend on which leg of the resistor is grounded, and a shorted-input run must drop the spectrum to the amplifier floor.\n\n**(iii) Lorentzian shape.** Any single relaxor gives a Lorentzian. Impostors: a single two-level fluctuator, a slow trap, RC bandwidth of the readout. **Discriminator:** the Lorentzian corner $\\omega_c$ must agree with $1/RC$ from the *measured* impedance and must be temperature-independent in the same way $\\chi''(\\omega)$ is.\n\n**(iv) Low-frequency rise.** $1/f$ and random-telegraph noise produce a rising tail that is often misread as \"non-equilibrium FDT\" [80,81]. **Discriminator:** $1/f$ noise has a characteristic $T^{1.5}$–$T^2$ scaling (Dutta–Horn) rather than the strict $T^1$ Johnson scaling, and its amplitude depends on bias *current squared*. Cycle the current.\n\n**(v) High-frequency $\\propto \\omega$ tail.** This is the most expensive impostor: a cryogenic HEMT or SQUID amplifier with a gain rolloff can produce an apparent $\\hbar\\omega$ rise even at $T$ where the true crossover is far away. **Discriminator:** measure the amplifier transfer function in situ with a calibrated shot-noise source (a tunnel junction at known $I$ with $S = 2eI\\coth(eV/2k_BT)$ acts as a *primary* noise thermometer [73]); the FDT tail must persist after deconvolution and must shift with $T$ as $\\coth(\\hbar\\omega/2k_BT)$ — its temperature dependence is the key, since amplifier rolloff is $T$-independent.\n\n**(vi) Magnitude matches $4k_BTR$.** The seductive trap. Impostor: anything calibrated against Johnson noise will, by construction, agree with it. **Discriminator:** the magnitude must be predicted from an *independently* measured $R(\\omega)$ at the same frequency, on the same terminals — not inferred from a DC ohmmeter at room temperature. Frequency-dependent loss (skin effect, dielectric tan $\\delta$, two-level systems in oxide) makes the DC-$R$ shortcut fail by orders of magnitude in the GHz range, and the resulting \"FDT confirmation\" is circular."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: The 'Effective Temperature' Industry and Other Hollow Invocations", "markdown": "## Use \u0026 Abuse: The 'Effective Temperature' Industry and Other Hollow Invocations\n\nThe FDT has accumulated more abuse per unit citation than perhaps any equilibrium result. The pattern is structural, not accidental: a relation that is rigorously valid (§2) and whose failure modes are sharply diagnosable (§3) is also one that, if you only look at one side of the identity, can be satisfied \"by construction\" — pick a temperature that makes the two sides match. Below is a catalogue of the dominant abuses, the fields in which they have hardened into folklore, and the textual tells that flag a hollow invocation.\n\n### 5.1 The T_eff industry: from p-spin glass to cytoskeleton rheology\n\nCugliandolo and Kurchan's 1993 paper [79] introduced the FDT-violation ratio\n$$X(t,t') \\;=\\; \\frac{T\\,R(t,t')}{\\partial_{t'} C(t,t')},\\qquad T_{\\rm eff}(t,t')\\;=\\;\\frac{T}{X(t,t')}$$\nfor aging spin glasses. In the mean-field $p$-spin model, $T_{\\rm eff}$ is observable-independent in each slow time sector and obeys a partition-function-like construction — there, it has *thermodynamic* content. That special property does not survive into the general non-equilibrium settings into which the construction has been exported: driven granular media, sheared colloidal glasses, swimming-bacteria baths, motor-driven actomyosin networks, intracellular tracer experiments. In each of these, different observables give different $T_{\\rm eff}(\\omega)$, and the value depends on whether one inserts the symmetrized or causal response, on whether the probe is a bead or a stress component, and on the chosen window of time scales [60,81].\n\nThe abuse pattern is now stereotyped. An experiment measures $C(\\omega)$ and $\\chi''(\\omega)$ on, say, a driven cytoskeleton, defines\n$$T_{\\rm eff}(\\omega) \\;\\equiv\\; \\frac{\\omega\\,C(\\omega)}{2k_B\\,\\chi''(\\omega)},$$\nfinds $T_{\\rm eff}(\\omega)\\neq T_{\\rm bath}$, and reports this as a *measurement* of a non-equilibrium temperature. It is no such thing. It is a measurement of the FDT-violation spectrum displayed in temperature units. The Harada–Sasa equality [80] makes this explicit: the integrated gap between $C$ and $\\chi''$ equals the dissipation rate of the driven degree of freedom. Calling that gap a \"temperature\" rebrands ignorance as a thermodynamic quantity.\n\n**Tells.** \"We find $T_{\\rm eff}=X\\,T_{\\rm bath}$, consistent with the FDT.\" (Circular: the FDT is what defined $X$.) \"An effective temperature characterizes the non-equilibrium steady state.\" (Generally false: different observables give different $T_{\\rm eff}$.) \"Our $T_{\\rm eff}$ confirms thermodynamic consistency.\" (Confuses a definition with a constraint.) Active-matter and biological-soft-matter papers are the worst offenders; glassy rheology is more disciplined because the mean-field warrant is at least adjacent.\n\n### 5.2 Collapsing the two linearity assumptions\n\nThe FDT requires *both* (i) linear response in the probe (A3 of §2) and (ii) a Gibbs unperturbed state (A2). These are independent. A driven NESS can be perfectly linear in a weak readout field and still violate the FDT spectacularly because (ii) fails. The literature routinely loses this distinction. The signature phrase is \"in the linear regime, the FDT yields…\", deployed without comment on the unperturbed state. This is endemic in driven soft matter — Speck's review [70] is unusually careful to keep them separate — and in quantum-information noise budgets where a qubit is biased into a stationary but non-Gibbs state and the bath spectrum is then \"read off\" via $S(\\omega)=\\hbar\\coth(\\hbar\\omega/2k_BT)\\chi''(\\omega)$ as if (ii) followed from (i).\n\n### 5.3 The classical formula in low-T quantum settings\n\nThe classical Nyquist form\n$$S_{VV}(\\omega)\\;=\\;\\frac{2k_BT}{\\omega}\\,\\chi''(\\omega)$$\nis the $\\hbar\\omega\\ll k_BT$ limit of Callen–Welton [74]. Quoting it at $\\hbar\\omega\\gtrsim k_BT$ — typical of cavity optomechanics [49], circuit QED at millikelvin, and superconducting-qubit noise floors — silently drops zero-point noise *and* the detailed-balance asymmetry $S(\\omega)\\neq S(-\\omega)$ that is the quantum content of the theorem. The symmetrized form\n$$\\bar S_{AA}(\\omega)\\;=\\;\\hbar\\,\\coth\\!\\bigl(\\hbar\\omega/2k_BT\\bigr)\\,\\chi''(\\omega)$$\nreduces to the classical expression only as a limit; equating them is not a small error at GHz frequencies and tens of mK. **Tells.** \"We treat the bath as classical for simplicity\" in a measurement that already resolves $\\hbar\\omega/k_B\\sim 50$ mK; plotting $S(\\omega)$ and $S(-\\omega)$ as identical when a quantum-limited amplifier was used to obtain them.\n\n### 5.4 Johnson and shot noise as \"two regimes\" of the FDT\n\nSchottky [71] separated the two effects in 1918, and the distinction is not a regime: Johnson–Nyquist noise is the equilibrium FDT noise of $R$ at $T$, vanishing as $T\\to0$ apart from zero-point and independent of bias; shot noise is non-equilibrium partition noise of discrete carriers, scaling with current $I$ and surviving at $T=0$. The Levitov–Lesovik full-counting-statistics formula (verify) handles shot noise; FDT does not. Mesoscopic-transport papers still write \"the noise crosses over from FDT-like to Schottky-like at $eV\\sim k_BT$\" as if both limits were FDT regimes. They are not — one is the FDT, the other a non-equilibrium current-noise law that happens to share an additive form near the crossover.\n\n### 5.5 The Onsager regression hypothesis is not the FDT\n\nOnsager [10,11] established that equilibrium fluctuations regress *on average* like macroscopic relaxations. The FDT is the stronger frequency-resolved identity between $S(\\omega)$ and $\\chi''(\\omega)$, requiring detailed balance and a Hamiltonian generator (A1, A6 of §2). A dignified-looking abuse is to cite Onsager 1931 in support of a spectral statement: the regression hypothesis is necessary but not sufficient, and the inference does not close without the equilibrium spectral structure that Callen–Welton [74] supplied twenty years later.\n\n---\n\nAcross all five patterns the underlying error is the same: an identity provable under sharply listed conditions is invoked as if it were a *definition*, so that any measured pair $(C,\\chi'')$ can be made \"FDT-consistent\" by an appropriate redefinition. A claim that survives this section must do something the abuses do not — produce one of the falsifiable signatures of §4 on the same degree of freedom, using consistent correlator conventions, with the unperturbed state independently certified to be equilibrium."}, {"id": "status-believers-checklist", "title": "Status \u0026 the Believer's Checklist", "markdown": "## Status \u0026 the Believer's Checklist\n\nThe equilibrium FDT is among the most operationally load-bearing results in modern physics — three communities have promoted it from theorem to engineering practice.\n\n**Gravitational interferometry.** The Brownian noise budget of LIGO is computed by Levin's direct application of Callen–Welton [74]: the mirror displacement spectrum is read off from the mechanical loss angle of the dielectric coating via $S_{xx}(\\omega) = (4k_BT/\\omega^2)\\,\\mathrm{Im}\\{\\chi(\\omega)\\}$. Coating thermal noise dominates the strain budget between roughly 40 and 140 Hz, and the residual at the most sensitive band tracks the FDT prediction to within the parametric uncertainty of the loss angles — an indirect but exquisitely sharp test ([Braginsky et al., arXiv:0710.2710](https://arxiv.org/abs/0710.2710)).\n\n**Circuit QED.** Microwave resonators coupled to transmon qubits operate at $\\hbar\\omega/k_BT \\approx 12$ (5 GHz at 20 mK). The detailed-balance asymmetry $S(\\omega)/S(-\\omega) = e^{\\hbar\\omega/k_BT}$ is not a calibration choice — it is the ratio of qubit emission to absorption rates, and is read out directly by sideband spectroscopy ([Wang et al., arXiv:1801.00467](https://arxiv.org/abs/1801.00467)). Quantum-limited amplifiers built on these chips are textbook FDT in hardware.\n\n**Cavity optomechanics.** Phononic-engineered membrane-in-the-middle systems with $Q\\sim 10^8$ now demonstrate ponderomotive squeezing of light at room temperature [49], with the imprecision–backaction product approaching the FDT-derived Heisenberg bound $S_{xx}^{\\mathrm{imp}}\\,S_{FF}^{\\mathrm{ba}} \\ge \\hbar^2/4$ ([Saarinen et al., Nature 2024](https://pmc.ncbi.nlm.nih.gov/articles/PMC10866701/)). Single-molecule biophysics is the soft-matter analogue: optical-trap stiffness is calibrated through equilibrium FDT applied to the bead position spectrum, and quoted ~1 % accuracies require precisely that the bath be water at $T$.\n\n### The frontier is controlled failure\n\nOnce one accepts that the equilibrium theorem works, the research-grade question is what replaces it. Four programs are active:\n\n1. **Harada–Sasa equality** [80]. For overdamped Langevin systems in NESS, $\\int(d\\omega/2\\pi)[\\tilde C(\\omega) - 2k_BT\\,\\tilde R'(\\omega)] = \\langle J\\cdot v\\rangle$ — the integrated FDT violation equals the dissipation rate. This converts the broken theorem into a calorimeter and has been used to bound the heat output of kinesin-1.\n2. **Stochastic thermodynamics** [59]. Seifert's program treats trajectory entropy production as a fluctuating observable; the FDT becomes a corollary of Crooks symmetry [65] in the linear regime, and is replaced nonlinearly by entropy-production identities at the single-trajectory level.\n3. **Effective temperatures in mean-field glasses** [79]. $T_{\\mathrm{eff}} = T/X(t,t')$ is observable-independent in the $p$-spin spherical model and the SK glass below $T_c$, where a clean time-scale separation underwrites a partial-equilibrium argument. Outside that class — active matter, sheared fluids, driven granular media — observable-independence is a hypothesis, not a result ([Cugliandolo, arXiv:1104.4901](https://arxiv.org/pdf/1104.4901)).\n4. **Fluctuation theorems** [65]. Jarzynski's $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ and Crooks' $P_F(W)/P_R(-W) = e^{\\beta(W-\\Delta F)}$ reduce to the FDT in the linear regime and survive arbitrarily far from it. Verified at the few-percent level in RNA-pulling and single-electron transistor experiments.\n\n### The AETHER believer's checklist\n\nAny manuscript invoking the FDT must pass the following before AETHER signs off.\n\n1. **A1–A7 declared.** The seven assumptions of §2 — Hamiltonian generator, Gibbs state, linearity in the probe, unique stationary response kernel, time-translation invariance, KMS condition, regularity of $\\chi''$ on the relevant strip — are named individually and the operative ones identified. \"We use the FDT\" is not a citation; it is an evasion.\n2. **Equilibrium, not stationarity.** Evidence that the unperturbed state is canonical $\\rho\\propto e^{-\\beta H}$ rather than merely time-translation invariant. A driven NESS is stationary and routinely \"fits\" the FDT form; the test is whether currents vanish, not whether $\\partial_t\\rho = 0$.\n3. **Independent $\\chi''$ and $S$.** Response and spectrum measured *separately* and compared — not one inferred from the other. The frequent failure mode — quoting \"$T_{\\mathrm{eff}}$\" obtained by dividing a measured $S(\\omega)$ by a measured $\\chi''(\\omega)$ — is a one-parameter fit, not a test of the theorem.\n4. **Detailed-balance asymmetry where it matters.** At $\\hbar\\omega\\gtrsim k_BT$, $S(\\omega)$ and $S(-\\omega)$ differ by the Boltzmann factor. Reporting only the symmetrized combination silently discards the entire quantum content. Either both sidebands are measured, or the classical limit is justified explicitly.\n5. **$T_{\\mathrm{eff}}$ tested across observables.** If an effective temperature is invoked, extract it from at least two unrelated observable pairs $(A,B)$ and show coincidence. A single FDT-violation curve yields a fitted ratio, not a temperature.\n6. **The bath is what you claim.** In cold-atom or circuit-QED contexts, \"a thermal bath at $T_b$\" is shorthand for a specific Lindbladian with Born–Markov and secular approximations pre-imposed. Cite the approximation, or admit the FDT is being checked on a model that already enforces it.\n7. **Onsager regression is not the FDT.** Reports that \"fluctuations decay like the macroscopic response\" verify the regression hypothesis [10,11], not Callen–Welton [74]. The frequency-resolved spectral identity is strictly stronger than the time-domain mean-regression statement.\n\nFailure on items 1, 3, 4, or 5 is the modal pathology of the contemporary literature. A theorem this clean deserves better than its citations."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nThe equilibrium FDT is, in my judgment, one of the three or four most secure non-trivial results in statistical physics. It earns that status not from its derivations — which are routine once one accepts a Hamiltonian generator and a Gibbs state — but from the fact that two independent communities (precision metrology and quantum-limited measurement) have monetized it. The Boltzmann constant is now *defined* via Johnson-noise thermometry; LIGO's sensitivity budget is written in units of $\\chi''(\\omega)$. A theorem that survives being load-bearing in a kilometer-scale interferometer is not a theorem I am going to second-guess.\n\n### (a) What I will defend\n\nThe frequency-resolved identity\n\n$$S_{xx}(\\omega) \\;=\\; \\hbar\\coth\\!\\left(\\tfrac{\\beta\\hbar\\omega}{2}\\right)\\chi''_{xx}(\\omega)$$\n\nis, within its stated regime (A1–A7 of §2), as rigorous as the second law. I will defend, specifically: (i) the *quantum* form including the zero-point $\\tfrac{1}{2}\\hbar\\omega$ term — this is not a renormalization artifact, it is observable in homodyne photocurrent spectra and in the asymmetric absorption/emission noise of a driven qubit; (ii) the equivalence of Callen–Welton, Kubo, and Mori derivations modulo bookkeeping; (iii) the use of FDT as a *consistency check* on numerical equilibrium simulations — its violation in an MD trajectory means the thermostat is broken, not the theorem.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions get smuggled past the reader.\n\n**A2 (Gibbs state).** Most \"equilibrium\" experimental systems are quasi-equilibrium on the measurement window. The standard move — assume $\\rho \\propto e^{-\\beta H}$ because $\\tau_{\\text{obs}} \\ll \\tau_{\\text{drift}}$ — is rarely justified quantitatively. In glassy electronics and 1/f-dominated devices this is exactly where the theorem is silently misapplied.\n\n**A4 (unique stationary kernel).** Nonlinear and history-dependent susceptibilities are routinely linearized around an operating point and then fed into FDT as if the operating point were equilibrium. It usually isn't. The Cugliandolo–Kurchan $T_{\\text{eff}}$ industry is what you get when you do this and refuse to admit it.\n\n**A7 (closed system + bath separability).** In cavity QED and circuit QED the \"bath\" is structured, often non-Markovian, and sometimes squeezed. The colored-bath FDT exists but the *measured* $\\chi''$ and the *measured* $S$ refer to different operators once input–output theory is taken seriously. I see this confusion in referee reports monthly.\n\nAnd — to name it plainly — the *classical* form $S = (2k_B T/\\omega)\\chi''$ is quoted in low-temperature solid-state papers where $\\hbar\\omega \\gtrsim k_B T$. That is not a small correction; it is the entire content of the theorem.\n\n### (c) Three open questions I would actually work on\n\n1. **A first-principles FDT for driven-dissipative steady states with a structured bath.** Because every cQED experiment now lives there, and the field is using equilibrium intuition on non-equilibrium spectra.\n2. **An operational, observable-independent definition of $T_{\\text{eff}}$ in active matter — or a proof that none exists.** Because the current zoo of observable-dependent $T_{\\text{eff}}$'s is a symptom of a missing theorem, not a feature.\n3. **Quantitative FDT violation as a thermodynamic-uncertainty witness in mesoscopic transport.** Because TUR and Harada–Sasa give two inequalities on the same quantity ($\\langle \\dot{S}\\rangle$) and nobody has welded them in the quantum regime.\n\n### Reading path\n\n1. **Callen \u0026 Welton 1951** [12] — read first; the cleanest statement of what the theorem actually claims before Kubo's machinery obscures it.\n2. **Kubo 1957** [16] — the linear-response derivation everyone cites; read second so you see what generality costs.\n3. **Landau–Lifshitz vol. 5, §123–126** [22] — the Soviet electromagnetic-fluctuation route; reveals what the Western lineage left on the table.\n4. **Harada \u0026 Sasa 2005** [31] — the modern non-equilibrium extension; turns FDT-violation into a measurable entropy production rate.\n5. **Cugliandolo 2011 review** [38] — read last, with skepticism; the $T_{\\text{eff}}$ program at its most honest, and the clearest map of where the theorem stops."}], "references": [{"n": 1, "title": "Darwinism, and other essays /", "authors": ["John Fiske"], "year": 1894, "venue": "Houghton Mifflin eBooks", "url": "https://doi.org/10.5962/bhl.title.167401", "cited_by": 0, "bucket": "earliest"}, {"n": 2, "title": "The dynamical theory of sound", "authors": ["Horace Lamb"], "year": 1910, "venue": "E. Arnold eBooks", "url": "https://doi.org/10.5962/bhl.title.19498", "cited_by": 108, "bucket": "earliest"}, {"n": 3, "title": "Economic cycles, their law and cause", "authors": ["Henry Ludwell Moore"], "year": 1914, "venue": "Macmillan eBooks", "url": "https://doi.org/10.5962/bhl.title.27415", "cited_by": 29, "bucket": "earliest"}, {"n": 4, "title": "A study of the inductance of four-terminal resistance standards", "authors": ["F. B. Silsbee"], "year": 1916, "venue": "Bulletin of the Bureau of Standards", "url": "https://doi.org/10.6028/bulletin.307", "cited_by": 13, "bucket": "earliest"}, {"n": 5, "title": "Note on Methods of Observing Potential Differences Induced by the Earth's Magnetic Field in an Insulated Moving Wire", "authors": ["Carl Barus", "Maxwell Barus"], "year": 1918, "venue": "Proceedings of the National Academy of Sciences", "url": "https://doi.org/10.1073/pnas.4.3.66", "cited_by": 0, "bucket": "earliest"}, {"n": 6, "title": "Mathematical Theory of induced voltage in the high-tension magneto", "authors": ["F. B. Silsbee"], "year": 1921, "venue": "Scientific Papers of the Bureau of Standards", "url": "https://doi.org/10.6028/nbsscipaper.103", "cited_by": 0, "bucket": "earliest"}, {"n": 7, "title": "NACA Technical Reports", "authors": ["Hugh L. Dryden", "G. B. Schubauer", "Mock, W. C., Jr.", "H. K. Skramstad"], "year": 1926, "venue": "University of North Texas Digital Library (University of North Texas)", "url": "https://openalex.org/W7134707453", "cited_by": 0, "bucket": "earliest"}, {"n": 8, "title": "Homoiothermism; the origin of warm-blooded vertebrates, by A. A. Pearse and F. G. Hall ...", "authors": ["A. S. Pearse", "F. G. Hall"], "year": 1928, "venue": "", "url": "https://doi.org/10.5962/bhl.title.6418", "cited_by": 2, "bucket": "e <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
