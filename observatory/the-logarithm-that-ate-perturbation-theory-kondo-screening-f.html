s, found that the electrical resistance, instead of saturating to a residual value as T→0, passed through a shallow minimum near 10 K and rose logarithmically below it. Through the 1930s–50s the minimum was variously blamed on lattice defects, oxide layers, or spurious 'second phases'; it was Clogston, Matthias, Peter, Williams, Corenzwit and Sherwood (Bell Labs, 1962) and Sarachik, Corenzwit and Longinotti (1964) who pinned the effect to dilute magnetic impurities (Fe, Mn, Cr) hosted in non-magnetic metals and correlated the minimum with the existence of a local moment. The theoretical scaffolding had been built in parallel but for a different purpose: Zener (1951), Kasuya (1956) and Yosida (1957) wrote down the s–d exchange Hamiltonian H = J S·s to describe RKKY interactions and ferromagnetic resonance, never anticipating that its antiferromagnetic sector hid a singular many-body problem. In June 1964 Jun Kondō, then at the Electrotechnical Laboratory in Tokyo, computed the third-order Born series for the spin-flip scattering rate and found a term proportional to J³ρ²ln(D/T): the perturbation series for a quantum-mechanically simple Hamiltonian was diverging logarithmically. The 'thirty-year resistance-minimum problem' had become the Kondo problem — an infrared catastrophe in a fermionic many-body system. Abrikosov's pseudofermion summation (1965) showed the leading-log series blew up at T_K ~ D exp(−1/Jρ); Anderson, Yuval and Hamann's poor-man's scaling (1970) and Anderson's 'A poor man's derivation' identified the strong-coupling runaway; and Kenneth Wilson's numerical renormalization group (1974–75) solved the problem non-perturbatively, exhibiting the screening of the local moment into a Fermi-liquid singlet — a calculation for which Wilson received half of the 1982 Nobel Prize. Nozières' local Fermi-liquid theory (1974), Andrei (1980) and Wiegmann (1981) Bethe-ansatz solutions, and Affleck–Ludwig's boundary CFT (1990s) completed the analytic picture. The mutation came with the prediction by Glazman–Raikh and Ng–Lee (1988) of a Kondo resonance in a single quantum dot, observed by Goldhaber-Gordon et al. (1998) and Cronenwett et al. (1998), opening the modern mesoscopic Kondo industry.", "credit_audit": "Textbooks compress the story to 'de Haas saw the minimum (1934) → Kondo explained it (1964) → Wilson solved it (1975)'. The historical record is messier. (i) The 1934 paper has three authors — de Haas, de Boer and van den Berg — and the systematic post-war experimental program that actually pinned the minimum to magnetic moments was largely van den Berg's at Leiden and Sarachik–Matthias's at Bell. (ii) The Hamiltonian Kondo perturbs is the Zener (1951)–Kasuya (1956)–Yosida (1957) s–d exchange; in some Japanese textbooks the operator is the Kasuya Hamiltonian, and Kondo himself was meticulous about citing all three. (iii) The leap from Kondo's third-order log to 'the Kondo problem' is essentially due to Abrikosov (1965) and Suhl (1965), who summed the leading logs, named T_K, and exhibited the unitarity violation — they are routinely skipped. (iv) Poor-man's scaling is Anderson, Yuval and Hamann (1970); calling it 'Anderson's RG' undercounts AYH's Coulomb-gas/inverse-square Ising mapping. (v) The Bethe-ansatz solution is independently Andrei (1980) and Wiegmann (1981); priority disputes between the two camps are still mildly alive in the Russian literature. (vi) Wilson's NRG (Nobel half-share 1982) was cited in the prize for the renormalization group as a whole, the Kondo problem being the demonstration; Nozières' local Fermi-liquid description (1974), which extracted the universal R = 2 Wilson ratio analytically, is often absorbed into 'Wilson theory'. (vii) In the quantum-dot revival, Glazman–Raikh (JETP Lett. 1988) and Ng–Lee (PRL 1988) made the prediction within weeks of each other; Goldhaber-Gordon (1998) is correctly credited for the first clean observation, but the corroborating Cronenwett et al. (1998) and van der Wiel et al. (2000) universal-curve papers are often dropped. The principal injustice in the standard story is to the 1934 Leiden experimentalists (especially van den Berg) and to the Abrikosov–Suhl–Nagaoka generation that turned 'Kondo's logarithm' into 'the Kondo problem' before Wilson finished it.", "timeline": [{"year": 1934, "event": "Resistance minimum first reported in gold below ~10 K — the empirical anomaly that defines the problem.", "who": "W. J. de Haas, J. H. de Boer, G. J. van den Berg", "work": "Physica 1, 1115 (Leiden Kamerlingh Onnes Lab)", "kind": "observation", "ref": null}, {"year": 1951, "event": "s–d exchange Hamiltonian written down to discuss double-exchange and ferromagnetism, supplying the operator Kondo would later use.", "who": "Clarence Zener", "work": "Phys. Rev. 81, 440; 82, 403; 83, 299", "kind": "theory", "ref": null}, {"year": 1956, "event": "RKKY-type s–d exchange treatment; the 'Kasuya Hamiltonian' label appears in Japanese literature.", "who": "Tadao Kasuya", "work": "Prog. Theor. Phys. 16, 45", "kind": "formalization", "ref": null}, {"year": 1957, "event": "Yosida's microscopic s–d exchange theory; closes the RKKY/Zener/Kasuya formal triangle still bearing all four names.", "who": "Kei Yosida", "work": "Phys. Rev. 106, 893; 107, 396", "kind": "formalization", "ref": null}, {"year": 1961, "event": "Anderson impurity model — virtual bound state with on-site U; the 'parent' Hamiltonian whose Schrieffer–Wolff projection is the Kondo model.", "who": "P. W. Anderson", "work": "Phys. Rev. 124, 41", "kind": "theory", "ref": null}, {"year": 1962, "event": "Systematic Bell-Labs survey: resistance minimum correlates with local-moment-bearing solutes (Fe, Mn, Cr) in non-magnetic hosts, killing the 'impurity-phase' explanations.", "who": "A. M. Clogston, B. T. Matthias, M. Peter, H. J. Williams, E. Corenzwit, R. C. Sherwood", "work": "Phys. Rev. 125, 541", "kind": "observation", "ref": null}, {"year": 1964, "event": "Sarachik–Corenzwit–Longinotti show resistance minimum in (Mo,Nb)–Fe alloys tracks the existence of the local moment — direct experimental input to Kondo.", "who": "M. P. Sarachik, E. Corenzwit, L. D. Longinotti", "work": "Phys. Rev. 135, A1041", "kind": "observation", "ref": null}, {"year": 1964, "event": "Third-order perturbation in J yields a ρ ∝ ln(T_F/T) term; for antiferromagnetic J this rises as T falls, producing the minimum. The 'Kondo problem' is born.", "who": "Jun Kondō", "work": "Prog. Theor. Phys. 32, 37", "kind": "theory", "ref": null}, {"year": 1965, "event": "Pseudofermion / parquet summation of leading logs; identifies divergence at T_K, but unitarity is violated below it — exposes the infrared catastrophe.", "who": "A. A. Abrikosov", "work": "Physics 2, 5 (also Sov. Phys. JETP)", "kind": "theory", "ref": null}, {"year": 1966, "event": "Schrieffer–Wolff canonical transformation derives the Kondo (s–d) model from the Anderson model, fixing J = 2|V|² (1/|ε_d| + 1/(ε_d+U)).", "who": "J. R. Schrieffer, P. A. Wolff", "work": "Phys. Rev. 149, 491", "kind": "formalization", "ref": null}, {"year": 1970, "event": "Poor-man's scaling: integrating out band edges renormalizes J toward strong coupling — the first RG treatment of an impurity problem and a direct ancestor of Wilson's NRG.", "who": "P. W. Anderson (with G. Yuval, D. R. Hamann on the Coulomb-gas mapping)", "work": "J. Phys. C 3, 2436; Phys. Rev. B 1, 4464", "kind": "theory", "ref": null}, {"year": 1974, "event": "Numerical renormalization group solves the Kondo problem non-perturbatively: local moment is screened to a singlet, strong-coupling fixed point is a Fermi liquid with phase shift π/2.", "who": "Kenneth G. Wilson", "work": "Rev. Mod. Phys. 47, 773 (and 1975 Erice lectures)", "kind": "theory", "ref": null}, {"year": 1974, "event": "Local Fermi-liquid description below T_K; fixes the Wilson ratio R = 2 and the leading T² coefficient — the universal low-energy answer.", "who": "P. Nozières", "work": "J. Low Temp. Phys. 17, 31", "kind": "theory", "ref": null}, {"year": 1980, "event": "Exact Bethe-ansatz solution of the single-impurity Kondo model — closed-form thermodynamics, confirms NRG fixed point.", "who": "N. Andrei (1980); P. B. Wiegmann (1981); independent", "work": "Phys. Rev. Lett. 45, 379; JETP Lett. 31, 392", "kind": "theory", "ref": null}, {"year": 1988, "event": "Predict a Kondo zero-bias resonance in transport through a single quantum dot with odd electron number — the mutation that defines the modern subfield.", "who": "L. I. Glazman \u0026 M. É. Raikh; T. K. Ng \u0026 P. A. Lee", "work": "JETP Lett. 47, 452; Phys. Rev. Lett. 61, 1768", "kind": "theory", "ref": null}, {"year": 1998, "event": "Observation of the Kondo resonance in a semiconductor quantum dot; universal G(T/T_K) curve verified shortly after.", "who": "D. Goldhaber-Gordon et al.; S. M. Cronenwett, T. H. Oosterkamp, L. P. Kouwenhoven", "work": "Nature 391, 156; Science 281, 540", "kind": "revival", "ref": null}], "neglected": [{"name": "G. J. van den Berg (and J. H. de Boer)", "role": "Co-discoverers with de Haas of the 1934 resistance minimum. Van den Berg spent the next two decades at Leiden documenting the minimum across dozens of dilute alloys; his systematic data in the 1950s (Prog. Low Temp. Phys. vol. IV, 1964 review) was the experimental ground truth Kondo's 1964 paper actually fit. He is almost never named when the anomaly is recounted.", "evidence": "Hewson, 'The Kondo Problem to Heavy Fermions' (CUP 1993), Ch. 1; van den Berg's Progress in Low Temperature Physics IV (1964) review; Leiden Kamerlingh Onnes Lab archives", "ref": null}, {"name": "Tadao Kasuya", "role": "Wrote the s–d exchange Hamiltonian in essentially Kondo's form in 1956, predating Yosida and independent of Zener's earlier double-exchange form. In Japanese-language usage the model is sometimes the 'Kasuya Hamiltonian'; outside Japan he is folded into 'RKKY' and largely forgotten.", "evidence": "Kasuya, Prog. Theor. Phys. 16, 45 (1956); Kondō's own 1964 paper cites Kasuya alongside Yosida; Kondō's Nobel-era lectures and the 2005 J. Phys. Soc. Jpn. 'Kondo at 40' issue", "ref": null}, {"name": "Mark Yudkowitch / Myriam Sarachik", "role": "Sarachik's 1964 systematic (Mo,Nb)–Fe experiments demonstrated that the resistance minimum appears only when the impurity carries a local moment — the empirical correlation that motivated Kondō to compute the spin-flip diagrams. The minimum is almost always credited to de Haas alone, the moment-correlation to 'experiment generally'.", "evidence": "Sarachik, Corenzwit \u0026 Longinotti, Phys. Rev. 135, A1041 (1964); Kondō, 'The Physics of Dilute Magnetic Alloys' (CUP 2012), preface and Ch. 1 acknowledgement", "ref": null}, {"name": "A. A. Abrikosov (and H. Suhl independently)", "role": "Within a year of Kondo's paper, Abrikosov (pseudofermion parquet) and Suhl (dispersion-relation t-matrix, 1965 Phys. Rev. 138, A515) summed the leading logarithms and identified the temperature T_K where perturbation theory breaks down. Textbooks routinely jump from 'Kondo found a log' to 'Wilson solved it', skipping the Abrikosov–Suhl resonance that already named the energy scale.", "evidence": "Abrikosov, Physics 2, 5 (1965); Suhl, Phys. Rev. 138, A515 (1965); Hewson Ch. 2", "ref": null}, {"name": "G. Yuval \u0026 D. R. Hamann", "role": "The Coulomb-gas mapping of the anisotropic Kondo model (Anderson–Yuval–Hamann 1970) is the technical content of 'poor-man's scaling'; Yuval and Hamann did the heavy lifting on the equivalence to the inverse-square Ising chain that made the RG argument quantitative. Anderson alone is usually credited.", "evidence": "Anderson, Yuval, Hamann, Phys. Rev. B 1, 4464 (1970); Anderson's 1970 J. Phys. C 'A poor man's derivation' explicitly defers the gas mapping to AYH", "ref": null}, {"name": "Harry Suhl \u0026 Daniel R. Hamann (Nagaoka)", "role": "Y. Nagaoka's 1965 self-consistent decoupling (Phys. Rev. 138, A1112) produced a divergence-free t-matrix with a resonance at T_K and is one of the first 'partial resummation' Kondo solutions. Often elided into 'Suhl–Nagaoka theory' and then dropped entirely once Wilson arrives.", "evidence": "Nagaoka, Phys. Rev. 138, A1112 (1965); Hewson Ch. 2; cited as the prehistoric strong-coupling attempt in Wilson's 1975 RMP", "ref": null}], "conflations": [{"claim": "'Kondo effect' = any zero-bias conductance peak in a quantum dot or molecular junction.", "clarification": "The genuine Kondo effect requires (a) an unscreened local moment (odd electron number, finite spin), (b) coherent spin-flip exchange with a Fermi sea, (c) a single low-energy scale T_K below which the moment is screened into a singlet, and (d) universal scaling: G(T,V,B)/G(0) is a one-parameter function of T/T_K, eV/k_B T_K, gμ_B B/k_B T_K. A ZBA can equally arise from disorder-induced two-level systems, Andreev/Yu–Shiba–Rusinov states near superconductors, dynamical Coulomb blockade, vibronic side-bands, or simple Fano resonances. Without the scaling collapse and a Wilson-ratio-consistent Fermi-liquid coefficient, 'Kondo' is decorative."}, {"claim": "'Kondo temperature' is uniquely defined.", "clarification": "T_K is a crossover, not a transition; numerical definitions differ by O(1) factors. Common conventions: (Wilson) Tχ(0) = 0.103 g²μ_B²/(4 k_B T_K); (Haldane) k_B T_K = √(ΓU/2) exp(πε_d(ε_d+U)/(2ΓU)) for the Anderson model; (Goldhaber-Gordon transport) k_B T_K from the half-width of the G(T) universal curve; (NMR Korringa) extracted from spin-relaxation. Comparing 'T_K' across papers without translating between conventions is endemic and wrong."}, {"claim": "Kondo model and Anderson impurity model are interchangeable.", "clarification": "They are equivalent only in the local-moment regime (U ≫ Γ, |ε_d|, ε_d+U ≫ Γ, occupation ≈ 1) via Schrieffer–Wolff with J = 2V²[1/|ε_d| + 1/(ε_d+U)]. Mixed-valence (ε_d ≈ 0 or ε_d+U ≈ 0) and empty/full-orbital regimes have no Kondo screening at all; using the Kondo model as a universal proxy hides charge fluctuations that matter for many quantum-dot and molecular-junction systems."}, {"claim": "Heavy-fermion behavior is 'just lattice Kondo'.", "clarification": "The single-impurity Kondo problem screens one moment with an entire Fermi sea. In the Kondo lattice the screening clouds overlap and compete with RKKY; the Doniach phase diagram, exhaustion, and coherence (T* ≪ T_K^single) make the lattice problem qualitatively different. Saying 'heavy fermions = Kondo' obscures the actual open questions (selective Mott, Kondo breakdown, local QCP)."}, {"claim": "Underscreened and overscreened Kondo problems are 'variants of the same effect'.", "clarification": "They are distinct fixed points. The fully screened S = ½, one-channel case flows to a Fermi-liquid (Wilson) fixed point with phase shift π/2. The overscreened (k \u003e 2S) multichannel Kondo model of Nozières–Blandin (1980) flows to a non-Fermi-liquid intermediate-coupling fixed point (two-channel: Majorana, residual ln2 entropy, T^{1/2} resistivity). The underscreened (k \u003c 2S) model flows to singular Fermi-liquid behavior with an unscreened residual moment. Three different infrared theories — lumping them is a category error."}], "sections": [{"id": "leiden-anomaly-to-kondo-problem", "title": "1. Why this mattered: a thirty-year embarrassment in dilute alloys", "markdown": "## 1. Why this mattered: a thirty-year embarrassment in dilute alloys\n\nThe defining datum is a single plot in [Physica 1, 1115 (1934)](https://www.sciencedirect.com/science/article/abs/pii/S0031891434803102), Leiden's Kamerlingh Onnes Laboratory. In gold wires of varying purity, the resistance fell with temperature, flattened out, and below roughly 10 K *climbed back up*. The paper carries three authors — W. J. de Haas, J. H. de Boer, G. J. van den Berg — and notes the same upturn in copper and lead samples (which subsequent metallurgy showed had been contaminated with iron-group impurities at the ppm level). The textbook story already in 1934 was Bloch–Sommerfeld: phonons freeze, defect scattering saturates, residual resistivity sets in, and that is the end of the curve. Nothing in that picture is allowed to rise again. The standard retelling drops \"de Boer and van den Berg\" and calls the discovery \"de Haas's resistance minimum\"; the credit audit must start here.\n\nThe next three decades were not a clean theoretical puzzle waiting to be solved. They were a string of provisional explanations that did not survive contact with cleaner samples: precipitation of a magnetic second phase, Bloch-style bound-state localization, defect-cluster scattering, even residual superconducting fluctuations. Each lasted a few years before fresh data killed it. Every guess lingered as long as it did because nobody was sure the minimum was intrinsic. Settling that question took G. J. van den Berg, who spent his post-war career at Leiden running dilute-alloy series — Au:Fe, Cu:Fe, Cu:Mn, Ag:Mn — and showing systematically that $\\Delta\\rho_{\\min}$ scales with the impurity concentration $c_{\\rm imp}$, while the temperature of the minimum scales as $T_{\\min}\\propto c_{\\rm imp}^{1/5}$. His [1964 Progress in Low Temperature Physics IV review](https://link.springer.com/chapter/10.1007/978-1-4899-6443-4_64) is the experimental ground truth that Kondō's calculation was actually fit against, and van den Berg is the name almost no Kondo-effect lecture mentions [81].\n\nThe Hamiltonian that would eventually be perturbed was also not Kondō's. Zener (1951) wrote down an $s$–$d$ exchange to discuss double-exchange ferromagnetism; Kasuya (1956) reused it in essentially the form\n\n$$H_{sd} \\;=\\; -2J\\,\\mathbf{S}\\!\\cdot\\!\\mathbf{s}(0),$$\n\nwriting what Japanese-language texts sometimes still call the Kasuya Hamiltonian; Yosida (1957) closed the formal triangle with the microscopic RKKY-style treatment. Outside Japan all three are absorbed into \"RKKY\" or simply \"Yosida\", and the operator that defines the Kondo problem is treated as if it appeared in 1964. Anderson [72] then put a microscopic origin underneath it: a $d$-level of energy $\\varepsilon_d$ with on-site repulsion $U$ hybridizing to the conduction band via $V_{k}$, with the virtual bound state of width $\\Gamma = \\pi\\rho_F |V|^2$. The Anderson model is the parent; the Kondo model is its strong-correlation projection — but Schrieffer–Wolff [73] would not make that map explicit until 1966.\n\nBy 1962 Bell Labs had killed the residual ambiguity about whether the minimum was magnetic at all. Clogston, Matthias, Peter, Williams, Corenzwit and Sherwood [showed](https://journals.aps.org/pr/abstract/10.1103/PhysRev.125.541) that an Fe atom dissolved in a (Mo,Nb) host carried a local moment in some compositions and not in others, and Sarachik, Corenzwit and Longinotti (Phys. Rev. 135, A1041, 1964) demonstrated that the resistance minimum appeared *together with* the local moment and vanished when it did. The minimum was not a generic dilute-alloy artifact; it was a property of unscreened spins in a Fermi sea. Sarachik's experiment is the empirical input Kondō [82] explicitly thanks for motivating his calculation, and she is almost never credited.\n\nThat is the data Jun Kondō [71] was fitting. Third-order in $J$, the spin-flip scattering cross-section of a conduction electron from a localized spin acquires a logarithm,\n\n$$\\rho_{\\rm imp}(T) \\;=\\; \\rho_0^{\\,\\rm imp}\\!\\left[\\,1 \\;-\\; 4 J\\rho_F\\,\\ln\\!\\bigl(k_B T/D\\bigr) \\;+\\;\\dots\\,\\right],$$\n\nwith $D$ a bandwidth cutoff and $\\rho_F$ the conduction density of states at the Fermi level. For antiferromagnetic $J\u003c0$ the log *grows* as $T$ falls. Add the phonon $aT^5$ and a constant defect term and a minimum at $T_{\\min}\\propto c_{\\rm imp}^{1/5}$ drops out — van den Berg's exponent, from two pages of perturbation theory. The fit was so unambiguously correct, and the formula so unambiguously sick at $T \\to 0$, that the calculation can fairly be called the most consequential perturbative result in solid-state physics. Kondō's own retrospective [82] is candid about his surprise that the right answer had been sitting in the third Born term for a decade.\n\nA logarithm that grows without bound is not a theory; it is a notice that perturbation theory has failed. Within twelve months Abrikosov (Physics 2, 5, 1965), using a pseudofermion representation and a parquet resummation, and Suhl (Phys. Rev. 138, A515, 1965), using a dispersion-relation $t$-matrix, summed the leading logs, identified the crossover scale\n\n$$k_B T_K \\;\\sim\\; D\\,\\exp\\!\\bigl(-1/2|J|\\rho_F\\bigr),$$\n\nand exhibited an Abrikosov–Suhl resonance pinned at the Fermi level — at the price of a $t$-matrix that violated unitarity below $T_K$. Nagaoka's self-consistent decoupling (Phys. Rev. 138, A1112, 1965) reached the same scale by another route. The textbook arc \"Kondō found a log → Wilson solved it\" elides this generation entirely; it is Abrikosov, Suhl and Nagaoka who turned an awkward third-order term into *the Kondo problem* — an infrared catastrophe inside a clean Hamiltonian with a small dimensionless coupling, no broken symmetry and no order parameter to hide behind. That is the stress test, and it broke every standard tool in the many-body kit between 1965 and 1974: diagrammatic resummation, mean field, Hartree–Fock on the Anderson model, slave-boson saddle points — each delivered a finite, smooth answer at the wrong fixed point. The Kondo minimum was never really a transport curiosity. It was the first place where a single quantum impurity, sitting at one site of a metal, forced condensed matter to admit that it did not yet know how to compute infrared physics from an ultraviolet Hamiltonian."}, {"id": "third-order-log-and-screening", "title": "2. The physics, properly: from s–d exchange to the strong-coupling fixed point", "markdown": "## 2. The physics, properly: from s–d exchange to the strong-coupling fixed point\n\nStrip the problem to its skeleton. A single magnetic impurity (**A1**: one localized spin $S=\\tfrac{1}{2}$, **A8**: full SU(2) isotropy) is embedded in a metal whose electrons form a sea (**A3**: flat band of half-width $D$, constant density of states $\\nu_0$ per spin, no van Hove pathology) of non-interacting, randomly distributed impurities (**A5**: dilute limit; $n_\\text{imp}\\ll 1$, so impurity contributions add incoherently). The exchange is antiferromagnetic (**A2**: $J\u003e0$). We work at temperatures well below the bandwidth but above any competing scale (**A7**: $T\\ll D/k_B$ and $T\\gg T_\\text{RKKY},\\,\\Delta_\\text{SC}/k_B,\\,$crystal-field splittings). The Hamiltonian is the s–d (Zener–Kasuya–Yosida) model that Kondō takes as input [71,82]:\n\n$$H \\;=\\; \\sum_{k\\sigma}\\varepsilon_k\\,c^\\dagger_{k\\sigma}c_{k\\sigma}\\;+\\;J\\,\\mathbf{S}\\!\\cdot\\!\\mathbf{s}(0),\\qquad \\mathbf{s}(0)=\\tfrac{1}{2}\\!\\sum_{kk'}\\!\\!\\sum_{\\alpha\\beta}c^\\dagger_{k\\alpha}\\boldsymbol{\\sigma}_{\\alpha\\beta}c_{k'\\beta}.$$\n\n### Origin of $J$: the Schrieffer–Wolff projection\n\nMicroscopically the local moment is not a postulate. It descends from the Anderson model [72] — a non-degenerate level $\\varepsilon_d$ with on-site repulsion $U$ and hybridization $V_k\\!\\approx\\!V$, hence width $\\Gamma=\\pi\\nu_0|V|^2$. In the local-moment regime (**A6**: $U\\gg\\Gamma$, $|\\varepsilon_d|\\gg\\Gamma$, $\\varepsilon_d+U\\gg\\Gamma$, occupancy $\\langle n_d\\rangle\\!\\approx\\!1$) the charge fluctuations $d^1\\!\\leftrightarrow\\!d^{0,2}$ are virtual and can be projected out by a canonical transformation [73]:\n\n$$J \\;=\\; 2|V|^2\\!\\left(\\frac{1}{|\\varepsilon_d|}+\\frac{1}{\\varepsilon_d+U}\\right)\\;\u003e\\;0.$$\n\nBoth denominators are positive in the singly-occupied window, fixing the sign — superexchange forces antiferromagnetic coupling, validating **A2** as a *theorem*, not an assumption. Drop **A6** and the projection fails (mixed-valence), as flagged in the §1 conflation list.\n\n### The third-order log\n\nCompute the impurity contribution to the resistivity in powers of $J$. Born ($O(J^2)$) gives the temperature-independent\n$\\rho^{(2)}_\\text{imp}=\\tfrac{3\\pi m}{2\\hbar e^2 \\varepsilon_F}\\,n_\\text{imp}\\,S(S+1)\\,(\\nu_0 J)^2$\n— spin-disorder scattering, no anomaly. The next order is where Kondō saw what everyone had missed. A spin-flip process $\\mathbf{S}^+ s^- \\to \\mathbf{S}^z s^z \\to \\mathbf{S}^- s^+$ cannot be reordered by symmetry because $[S^+,S^-]=2S^z$: the *Fermi sea must remember* whether the intermediate electron state is occupied. Summing the two time-orderings introduces the Fermi function $f(\\varepsilon_k)$ asymmetrically, and the loop integral\n\n$$\\int\\!\\!d\\varepsilon\\,\\nu(\\varepsilon)\\frac{1-2f(\\varepsilon)}{\\varepsilon-\\varepsilon_F}\\;\\xrightarrow{\\text{flat band}}\\;-\\,2\\nu_0\\,\\ln\\!\\frac{D}{k_BT}$$\n\nis logarithmic for any band that is flat over the thermal window (uses **A3**, **A7**). The result is\n\n$$\\boxed{\\;\\rho_\\text{imp}(T)=c_0(\\nu_0 J)^2\\!\\left[1-4\\,\\nu_0 J\\,\\ln\\!\\frac{k_BT}{D}+\\cdots\\right]\\;\\Longrightarrow\\;\\delta\\rho_\\text{imp}\\propto J^3\\nu_0^2\\,\\ln\\!\\frac{D}{k_BT}\\;}$$\n\nwith the *sign* (and therefore the rise as $T\\!\\downarrow$) controlled by AFM $J\u003e0$. Add the phonon $T^5$ and the minimum that haunted Leiden for thirty years drops out at $T_\\text{min}\\propto J^{1/5}$ [71].\n\n### Poor man's scaling and the Kondo scale\n\nThe log is an infrared signal that the perturbation series has the wrong reference state. Anderson's response was to demand that the *low-energy physics not care* about the band edge: integrate out single-particle states in a shell $D-\\delta D\u003c|\\varepsilon|\u003cD$ at second order in $J$, fold the result into a renormalized coupling [75], and write the flow\n\n$$\\frac{dJ}{d\\ln D}=-2\\nu_0 J^2\\quad\\Longrightarrow\\quad \\nu_0 J(D)=\\frac{\\nu_0 J_0}{1-2\\nu_0 J_0\\,\\ln(D_0/D)}.$$\n\nThe bare coupling is marginally relevant; AFM $J$ runs to strong coupling, FM $J$ runs to zero. The denominator vanishes at a single universal energy,\n\n$$k_BT_K \\;\\simeq\\; D\\,\\exp\\!\\Big(-\\tfrac{1}{2\\nu_0 J}\\Big),$$\n\ninvariant under the flow (a renormalization-group invariant, in modern language). Anisotropic versions and the Coulomb-gas/inverse-square Ising mapping are due to Anderson, Yuval and Hamann; the isotropic flow above uses **A8**. Below $T_K$ the running coupling diverges, the loop expansion explodes, and one is no longer doing perturbation theory in any honest sense — the infrared catastrophe Abrikosov and Suhl had already exposed in 1965.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cpolygon points=\"690,334 702,340 690,346\" fill=\"#e8e6e1\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cpolygon points=\"74,40 80,28 86,40\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"700\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003edecreasing cutoff   ln(D₀/D)  →\u003c/text\u003e\u003ctext x=\"86\" y=\"36\" fill=\"#e8e6e1\" font-size=\"14\"\u003eν₀ J(D)\u003c/text\u003e\u003cline x1=\"80\" y1=\"305\" x2=\"135\" y2=\"305\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"142\" y=\"309\" fill=\"#7aa2ff\" font-size=\"14\"\u003eν₀J₀  (bare, A1+A2+A6+A8)\u003c/text\u003e\u003cpath d=\"M 135 305 C 280 295 380 270 455 210 S 515 100 522 60\" stroke=\"#ffb86b\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003ctext x=\"200\" y=\"180\" fill=\"#ffb86b\" font-size=\"14\"\u003edJ/d ln D = −2ν₀ J²\u003c/text\u003e\u003ctext x=\"200\" y=\"200\" fill=\"#e8e6e1\" font-size=\"13\"\u003e3rd-order log: δρ ∝ J³ν₀² ln(D/k_B T)\u003c/text\u003e\u003cline x1=\"525\" y1=\"340\" x2=\"525\" y2=\"55\" stroke=\"#ff7a90\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"525\" y=\"360\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003ek_B T_K = D exp(−1/2ν₀J)\u003c/text\u003e\u003crect x=\"530\" y=\"55\" width=\"155\" height=\"285\" fill=\"#7ee0a3\" fill-opacity=\"0.08\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"607\" y=\"90\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003estrong-coupling FP\u003c/text\u003e\u003ctext x=\"607\" y=\"112\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003e|↑↓⟩−|↓↑⟩ singlet\u003c/text\u003e\u003ctext x=\"607\" y=\"132\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003ephase shift δ = π/2\u003c/text\u003e\u003ctext x=\"607\" y=\"152\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eWilson ratio R = 2\u003c/text\u003e\u003ctext x=\"607\" y=\"172\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003elocal Fermi liquid\u003c/text\u003e\u003ctext x=\"607\" y=\"200\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e(Wilson NRG, Nozières)\u003c/text\u003e\u003ctext x=\"300\" y=\"60\" fill=\"#e8e6e1\" font-size=\"13\"\u003eweak coupling — log series\u003c/text\u003e\u003ctext x=\"300\" y=\"78\" fill=\"#e8e6e1\" font-size=\"13\"\u003e(Kondo 1964; Abrikosov–Suhl 1965)\u003c/text\u003e\u003c/svg\u003e\n*Figure: the marginally-relevant RG flow of the antiferromagnetic Kondo coupling under poor-man's scaling [75]. The bare $\\nu_0 J_0\\!\\ll\\!1$ (A6) grows as the bandwidth is reduced; the flow develops a Landau pole at the single non-perturbative scale $T_K$, below which the impurity moment is bound into a singlet — Wilson's strong-coupling fixed point with phase shift $\\pi/2$ and Wilson ratio $R=2$ [74,77].*\n\n### Wilson's NRG and the Nozières fixed point\n\nWilson tames the catastrophe by replacing the continuum band with a logarithmic discretization, mapping the impurity-plus-bath onto a semi-infinite tight-binding chain with hoppings $t_n\\sim\\Lambda^{-n/2}$ and iteratively diagonalizing [74]. Three fixed points organize the flow: the *free orbital*, the *local moment* (marginally unstable for $J\u003e0$), and a *strong-coupling* fixed point at $J/D\\!\\to\\!\\infty$. At the latter, the band electron at the chain origin is locked into the singlet $\\tfrac{1}{\\sqrt{2}}(|\\!\\uparrow\\downarrow\\rangle-|\\!\\downarrow\\uparrow\\rangle)$ with the impurity; the rest of the chain feels an effective hard wall, an extra node, and hence an $s$-wave phase shift $\\delta=\\pi/2$ per spin — the Friedel sum rule on one screened electron (**A4**: at particle–hole symmetry $\\delta$ is exactly $\\pi/2$; off symmetry, $\\delta_\\sigma$ still sums to $\\pi$ at zero field).\n\nNozières [77] reads the low-temperature physics off the leading *irrelevant* operator about that fixed point: a single Fermi-liquid parameter $\\alpha\\sim 1/T_K$ generates the universal coefficients\n\n$$\\chi_\\text{imp}=\\frac{(g\\mu_B)^2}{4k_BT_K^W},\\qquad \\gamma_\\text{imp}=\\frac{\\pi^2 k_B}{3T_K^W}\\cdot w,\\qquad R\\equiv\\frac{4\\pi^2k_B^2}{3(g\\mu_B)^2}\\frac{\\chi_\\text{imp}}{\\gamma_\\text{imp}}=2,$$\n\ntwice the non-interacting Wilson ratio because spin fluctuations are screened but charge fluctuations are quenched in the singlet — every input asymmetry between $\\chi$ and $\\gamma$ is concentrated in the spin channel. The resistivity recovers a $\\rho_0[1-(\\pi T/T_K)^2]$ unitary-limit form, replacing the diverging log with an analytic Fermi-liquid expansion. The same fixed point is later confirmed exactly by Bethe ansatz [76] and underwrites the universal scaling functions $G(T/T_K,\\,eV/k_BT_K)$ that §4 will use as the diagnostic.\n\nThe assumptions **A1–A8** are not boilerplate. Each will fail somewhere in §3, and each failure births a distinct fixed point or a different physical effect — multichannel, underscreened, mixed-valence, gapped-bath, lattice-coherent. The minimal Kondo story above is only the spine."}, {"id": "validity-and-failure-modes", "title": "3. Strict conditions \u0026 failure modes: what breaks when each Aᵢ fails", "markdown": "## 3. Strict conditions \u0026 failure modes: what breaks when each Aᵢ fails\n\nThe Kondo fixed point is not robust — it is the *generic* infrared behavior of a very specific Hamiltonian. Each of the eight tacit assumptions $A_1\\!-\\!A_8$ behind \"S = ½, antiferromagnetic, single channel, flat band, isolated, deep level, $T\\!\\to\\!0$, SU(2)\" selects a different universality class when violated. The literature is littered with experimental claims of \"Kondo\" that have walked off one of these axes without flagging it.\n\n### A1 — One spin-½, one channel (fully compensated)\n\nDrop the matching $k = 2S$ between channels and impurity spin and the strong-coupling fixed point changes character entirely. Nozières–Blandin [78] classified the three cases:\n\n- **Fully screened** ($k = 2S$). Wilson [74] / Nozières [77] local Fermi liquid; phase shift $\\delta = \\pi/2$ per channel at the symmetric point; Wilson ratio $R = 2$; resistivity $\\rho(T) = \\rho_0[1 - (\\pi T/T_K)^2 + \\mathcal{O}(T^4)]$.\n- **Underscreened** ($k \u003c 2S$, e.g. $S = 1$, one channel). Coupling flows to strong coupling but the residual spin $S - k/2$ remains; this is a *singular* Fermi liquid — susceptibility diverges as $\\chi(T) \\sim 1/[T \\ln^2(T/T_K)]$, leading specific-heat coefficient $\\gamma(T) \\sim \\ln^{-2}(T/T_K)$. The fixed point is unstable to ferromagnetic channel-asymmetry.\n- **Overscreened** ($k \u003e 2S$). Coupling stops at an *intermediate* value $J^\\ast \\sim 1/(k+2)$ (large-$k$ Affleck–Ludwig). The two-channel $S=\\tfrac12$ case is the iconic NFL: residual entropy $S_{\\rm imp}(0) = \\tfrac12 \\ln 2$, resistivity $\\rho(T) = \\rho_0[1 - c\\sqrt{T/T_K}]$, susceptibility $\\chi \\sim \\ln(T_K/T)$, leading irrelevant operator of dimension $\\tfrac12$ (a Majorana fermion in Emery–Kivelson coordinates). Channel asymmetry $\\Delta J \\neq 0$ is relevant with scaling dimension $\\tfrac12$, generating a crossover scale $T^\\ast \\sim (\\Delta J/J)^2 T_K$ below which Fermi-liquid behavior re-emerges — which is why clean two-channel signatures in nature are rare.\n\n### A2 — Antiferromagnetic exchange $J\u003e0$\n\nFlip the sign. Poor-man's scaling [75] gives $dJ/d\\ell = -\\rho J^2$ regardless of sign, but the integration constant changes: $J(\\ell) = J_0/(1 + \\rho J_0 \\ell)$ for $J_0 \u003c 0$ runs the coupling *to zero* logarithmically. The impurity is asymptotically free: an unscreened moment with Curie $\\chi(T) = (g\\mu_B)^2 S(S+1)/3T$ down to $T = 0$, and a resistivity correction $\\delta\\rho \\propto +\\ln^{-2}(T/D)$ — opposite curvature to the AFM Kondo log and small. There is no $T_K$, no resonance. Hund's-coupled multi-orbital impurities and double-exchange systems live here; calling them \"Kondo\" is wrong.\n\n### A3 — Featureless density of states $\\nu(\\varepsilon_F)$\n\nThe screening cloud is built from states within $\\sim T_K$ of $\\varepsilon_F$; structure on that scale changes everything.\n\n- **Pseudogap, $\\nu(\\varepsilon) \\propto |\\varepsilon|^r$** (Withoff–Fradkin, 1990). Scaling becomes $dJ/d\\ell = -r J + \\rho J^2$; the linear term wins at small $J$, so screening requires $J \u003e J_c$, with $J_c \\sim r/\\rho_0$. Below $J_c$ a local moment survives to $T = 0$. Dirac/graphene impurities, $d$-wave nodal quasiparticles ($r = 1$), and flux phases sit here.\n- **BCS gap $\\Delta$**. For $\\Delta \\gg T_K$ the conduction sea has no low-energy states to screen with; the moment binds a pair of subgap Yu–Shiba–Rusinov states at $\\pm E_{\\rm YSR}$ with $E_{\\rm YSR}/\\Delta = (1-\\alpha^2)/(1+\\alpha^2)$, $\\alpha = \\pi\\rho J S$. As $T_K/\\Delta$ increases through $\\sim 0.3$ the YSR levels cross zero — a quantum phase transition between doublet and singlet ground states, observed by STM on magnetic adatoms.\n- **Sharp van Hove or 1D log singularity**. Replaces $\\ln(D/T)$ by stronger divergences; $T_K$ can become non-analytic in $J$.\n\n### A4 — Particle–hole symmetric Anderson level ($\\varepsilon_d = -U/2$)\n\nMove off symmetry and Schrieffer–Wolff [73] gives $J = 2|V|^2[1/|\\varepsilon_d| + 1/(\\varepsilon_d + U)]$; the Haldane formula\n\n$$k_B T_K = \\sqrt{\\frac{\\Gamma U}{2}} \\exp\\!\\left[\\frac{\\pi \\varepsilon_d (\\varepsilon_d + U)}{2 \\Gamma U}\\right]$$\n\nthen traces $T_K$ across the local-moment valley. As either $|\\varepsilon_d|$ or $|\\varepsilon_d + U|$ falls to $\\sim \\Gamma$, charge fluctuations become $\\mathcal{O}(1)$ — *mixed valence* — and the Kondo description collapses into a single Lorentzian resonance of width $\\Gamma$ at the Fermi level [72]. Universal $G(T/T_K)$ scaling does not apply there even though a zero-bias peak persists.\n\n### A5 — Single, isolated impurity\n\nTwo moments at separation $R$ acquire an RKKY exchange $J_{RKKY}(R) = J^2 \\rho \\cos(2k_F R)/(k_F R)^3$ (3D). For a dilute concentration $n_{\\rm imp}$ the typical RKKY scale is $T_{RKKY} \\sim J^2 \\rho^2 \\varepsilon_F (k_F a)^3 n_{\\rm imp}/n_e$. Doniach's criterion: $T_K \\sim T_{RKKY}$ at $\\rho J \\sim \\ln^{-1}(\\rho J)$; below the crossing single-ion Kondo wins, above it RKKY does, and the QCP between is the heavy-fermion local QCP. For random positions the system freezes into a Kondo-disordered spin glass when $n_{\\rm imp} \\gtrsim n^\\ast$ with $T_g \\propto n_{\\rm imp}$.\n\n### A6 — $U \\gg \\Gamma$ (well-formed local moment)\n\nWhen $U \\lesssim \\pi\\Gamma$ the Anderson level fails to spin-polarize even at the Hartree–Fock level (Anderson's 1961 criterion [72]: $U\\rho(\\varepsilon_d) \u003e 1$). Schrieffer–Wolff is then illegal; the impurity is a non-interacting resonance with charge susceptibility $\\sim 1/\\Gamma$ and *no* low-energy spin scale. Quantum dots with $U/\\Gamma \\lesssim 1$ that report \"Kondo\" are usually showing residual Coulomb-blockade peaks or Fano resonances, not screening.\n\n### A7 — $T \\ll T_K$ and no competing low-energy scale\n\nA finite cutoff $\\delta$ — Zeeman splitting $g\\mu_B B$, superconducting gap $\\Delta$, level spacing of a finite reservoir, decoherence rate $\\hbar/\\tau_\\varphi$ — replaces $\\ln(T_K/T)$ by $\\ln(T_K/\\delta)$ in the unitarity sum. For $\\delta \u003e T_K$ the Kondo resonance splits/quenches: the magnetic-field splitting of the zero-bias peak follows $\\Delta V = 2 g\\mu_B B/e$ only for $B \u003e B^\\ast \\approx 0.5\\, k_B T_K/g\\mu_B$; below that, the peak is robust and *shifts* sublinearly. Dephasing from nuclear spins or 1/f charge noise caps $T_K^{\\rm eff}$ from below and is responsible for many \"missing\" Kondo signatures in molecular junctions.\n\n### A8 — SU(2) spin isotropy and equivalent channels\n\nAnisotropy $J_\\perp \\neq J_z$ produces the XXZ Kondo model. Its phase diagram (Anderson–Yuval–Hamann Coulomb gas) has a Kosterlitz–Thouless line; the isotropic AFM point is on the strong-coupling separatrix. The **Toulouse point** $J_z = 2\\pi v_F (1 - 1/\\sqrt{2})$ admits a free-fermion solution — useful but not generic. Channel anisotropy in the two-channel problem is a relevant perturbation of scaling dimension $\\tfrac12$; spin–orbit on the impurity reshuffles the symmetry group (SU(2)→U(1)×Z₂ or larger like SU(4) for orbital+spin in carbon-nanotube dots), giving genuinely distinct fixed points with different $R$, different $\\delta$, different universal $G(T/T_K)$ — all sometimes mis-labelled \"Kondo\" without qualification.\n\nThe lesson is operational: before invoking the word, ask which of $A_1\\!-\\!A_8$ your system actually satisfies. The failure modes above are not pathologies — they are the working physics of most modern \"Kondo\" platforms."}, {"id": "signatures-direct-vs-indirect", "title": "4. Signatures: smoking guns vs. circumstantial evidence", "markdown": "## 4. Signatures: smoking guns vs. circumstantial evidence\n\nA Kondo claim is a strong physical assertion: one local moment, one infrared scale, one universal crossover function. The literature is full of \"Kondo-like\" features that pass one test and fail three. The discipline imposed by Wilson's NRG [74,81] and the local Fermi liquid of Nozières [77] is that *all* the universal predictions must be consistent with a single fitted $T_K$. Treat the diagnostics in two tiers.\n\n### Smoking guns\n\n**(i) Universal one-parameter scaling collapse.** The strong-coupling fixed point has one relevant scale. Below the crossover every dimensionless observable is a universal function of $T/T_K$, $eV/k_BT_K$, $g\\mu_BB/k_BT_K$. In a quantum dot at the particle–hole-symmetric point [79,80] the conductance obeys the Goldhaber-Gordon empirical form (a fit to NRG),\n\n$$\\frac{G(T)}{G(0)}=\\left[1+(2^{1/s}-1)(T/T_K)^2\\right]^{-s},\\quad s\\simeq 0.22,$$\n\nwith the convention $G(T_K)/G(0)=1/2$. Schrieffer–Wolff [73] makes $T_K$ depend exponentially on gate voltage; the family $\\{G(T;V_g)\\}$ must collapse onto one locus with *no further parameter*. Independent collapses must follow for $dI/dV(eV/k_BT_K)$ at fixed $T$ and for the differential conductance versus $g\\mu_BB/k_BT_K$ in field. A single collapse is suggestive; three orthogonal collapses sharing one $T_K(V_g)$ are diagnostic. Failure of any collapse — for instance $T_K$ from $G(T)$ disagreeing with $T_K$ from $dI/dV(V)$ by more than the O(1) convention factor catalogued in §3 — falsifies the identification.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eUniversal G(T/T_K) scaling collapse\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"40\" x2=\"80\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"80\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"200\" y1=\"340\" x2=\"200\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"320\" y1=\"340\" x2=\"320\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"440\" y1=\"340\" x2=\"440\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"560\" y1=\"340\" x2=\"560\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"680\" y1=\"340\" x2=\"680\" y2=\"345\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"80\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10⁻²\u003c/text\u003e\u003ctext x=\"200\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10⁻¹\u003c/text\u003e\u003ctext x=\"320\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1\u003c/text\u003e\u003ctext x=\"440\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10\u003c/text\u003e\u003ctext x=\"560\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10²\u003c/text\u003e\u003ctext x=\"680\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e10³\u003c/text\u003e\u003ctext x=\"380\" y=\"390\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eT / T_K\u003c/text\u003e\u003cline x1=\"75\" y1=\"40\" x2=\"80\" y2=\"40\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"75\" y1=\"115\" x2=\"80\" y2=\"115\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"75\" y1=\"190\" x2=\"80\" y2=\"190\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"75\" y1=\"265\" x2=\"80\" y2=\"265\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"75\" y1=\"340\" x2=\"80\" y2=\"340\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"68\" y=\"45\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e1.0\u003c/text\u003e\u003ctext x=\"68\" y=\"120\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0.75\u003c/text\u003e\u003ctext x=\"68\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0.5\u003c/text\u003e\u003ctext x=\"68\" y=\"270\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0.25\u003c/text\u003e\u003ctext x=\"68\" y=\"345\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"25\" y=\"200\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 25 200)\"\u003eG(T) / G(0)\u003c/text\u003e\u003cpath d=\"M 80 41 L 200 52 Q 280 65 320 190 Q 380 270 500 320 L 680 336\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cline x1=\"320\" y1=\"40\" x2=\"320\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"0.8\" stroke-dasharray=\"3,3\"/\u003e\u003ccircle cx=\"320\" cy=\"190\" r=\"3.5\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"328\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\"\u003eT = T_K, G/G(0) = 1/2\u003c/text\u003e\u003ccircle cx=\"110\" cy=\"42\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"170\" cy=\"48\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"230\" cy=\"62\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"290\" cy=\"125\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"350\" cy=\"230\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"150\" cy=\"46\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"250\" cy=\"78\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"320\" cy=\"186\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"400\" cy=\"262\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"500\" cy=\"318\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"200\" cy=\"56\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"300\" cy=\"160\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"420\" cy=\"282\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"540\" cy=\"324\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"640\" cy=\"332\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003crect x=\"475\" y=\"90\" width=\"205\" height=\"110\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"0.5\"/\u003e\u003cline x1=\"488\" y1=\"110\" x2=\"512\" y2=\"110\" stroke=\"#7aa2ff\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"520\" y=\"115\" fill=\"#e8e6e1\" font-size=\"14\"\u003eNRG / Goldhaber-Gordon\u003c/text\u003e\u003ccircle cx=\"500\" cy=\"138\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"520\" y=\"143\" fill=\"#e8e6e1\" font-size=\"14\"\u003edot A: T_K = 90 mK\u003c/text\u003e\u003ccircle cx=\"500\" cy=\"162\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"520\" y=\"167\" fill=\"#e8e6e1\" font-size=\"14\"\u003edot B: T_K = 300 mK\u003c/text\u003e\u003ccircle cx=\"500\" cy=\"186\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"520\" y=\"191\" fill=\"#e8e6e1\" font-size=\"14\"\u003edot C: T_K = 1.1 K\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Universal $G(T/T_K)$ locus (blue) — Goldhaber-Gordon empirical form, $s=0.22$, particle–hole-symmetric — and three hypothetical conductance traces taken at distinct gate voltages, hence distinct physical $T_K$. The observational claim is collapse to one curve with a single fitted $T_K(V_g)$ each, plus matched collapse of $dI/dV(eV/k_BT_K)$ and of the field dependence. Three orthogonal collapses, one scale.*\n\n**(ii) Wilson ratio $R=2$.** Nozières [77] showed the strong-coupling fixed point is a local Fermi liquid with quasiparticle interaction tied to level width by $\\tilde U/\\pi\\tilde\\Delta=1$, giving\n\n$$R\\equiv \\frac{\\chi_{\\rm imp}/\\gamma_{\\rm imp}}{(\\chi/\\gamma)_{\\rm free}}=2$$\n\nfor one channel, $S=\\tfrac12$. The orphan-spin baseline is $R=1$, so a measured $R\\in[1.8,2.2]$ — using *impurity-subtracted* $\\chi$ and $\\gamma$, NOT bulk values — is a non-trivial coincidence between independent thermodynamic channels. $R\u003e2$ flags underscreening; $R\\to 8/(2k+3)$ flags multichannel Nozières–Blandin [78]. Both kill the single-channel claim and identify the actual fixed point.\n\n**(iii) Nozières $T^2$ and the universal coefficient ratio.** The Fermi-liquid expansion gives\n\n$$\\rho_{\\rm imp}(T)=\\rho_0\\big[1-c_T(T/T_K)^2+\\ldots\\big],\\qquad \\frac{dI}{dV}\\propto 1-c_V(eV/k_BT_K)^2,$$\n\nwith $c_T$ and $c_V$ both universal and related by the Schiller–Hershfield identity $c_V/c_T=3/(2\\pi^2)$ at particle–hole symmetry (*verify*; corrections for asymmetry and channel number are tabulated by Mora–Vitushinsky–Zaránd–Glazman). One coefficient is suggestive; the *ratio* is diagnostic because it tests that the same low-energy theory governs both transport channels.\n\n**(iv) Hamann log-tail above $T_K$.** The leading-log resummation joining smoothly to the Fermi-liquid plateau,\n\n$$\\rho_{\\rm imp}(T)\\propto \\tfrac12\\!\\left[1-\\frac{\\ln(T/T_K)}{\\sqrt{\\ln^2(T/T_K)+\\pi^2 S(S+1)}}\\right],$$\n\n(Hamann 1967, *verify*) recovers Kondo's $\\ln(T/T_K)$ [71] at high $T$ and saturates at low $T$. A clean Hamann fit over a decade in $T$, with the same $T_K$ as the low-$T$ scaling, eliminates inhomogeneous-broadening explanations of the rise.\n\n**(v) Costi field threshold.** NRG [Costi PRL 85, 1504 (2000), *verify*] predicts the zero-bias resonance splits into a doublet of separation $2g\\mu_BB$ only for $B\\gtrsim B_c\\simeq 0.5\\,k_BT_K/g\\mu_B$. Below $B_c$ the peak broadens and weakens without splitting. A doublet that opens linearly from $B\\to 0$ is a free or weakly screened doublet — NOT a Kondo singlet excitation.\n\n### Circumstantial — and what rescues it\n\n| Indirect signal | Common look-alike | Discriminating measurement |\n| --- | --- | --- |\n| Zero-bias conductance peak | TLS / disorder ZBA; dynamical Coulomb blockade; vibronic side-band; Yu–Shiba–Rusinov state; Andreev bound state; Majorana ZBP; Fano antiresonance | Universal $G(T/T_K)$ collapse + Costi field test; odd-$N$ Coulomb-valley gate dependence (peak vanishes in even valleys, returns in next odd); persistence with leads driven normal (rules out YSR/Andreev); symmetric line shape (rules out Fano); width scales as $T_K$, NOT as $\\sqrt{\\Gamma\\Delta}$ |\n| Enhanced low-$T$ $\\chi$ saturation | Orphan free spins truncated by mutual interactions; Curie tail of secondary impurity phase; van Vleck contribution | Impurity-subtracted $\\chi(T)$ matches NRG universal curve; $R\\simeq 2$ with co-measured $\\gamma_{\\rm imp}$; $T_K$ from $\\chi$ agrees with transport $T_K$ within convention factors |\n| Resistance minimum $\\rho(T)$ | Weak localization ($\\ln T$ from interference, 2D); granular boundary scattering; superconducting fluctuations (paraconductivity, wrong sign); secondary magnetic precipitates | Suppression at $B\\sim k_BT_K/g\\mu_B$ (Kondo) versus $B\\sim \\hbar/e\\ell^2$ (WL); $\\ln^2$ rather than $\\ln$ depth at $T\\ll T_K$; depth $\\propto c_{\\rm imp}$ over decades; reappearance in a strictly bulk single-phase ingot |\n\nThe asymmetry is structural. Smoking guns are quantitative scaling statements requiring matched $T_K$ across independent measurements; circumstantial signatures are single-curve observations that half a dozen distinct physics can produce. The operational mnemonic — *one scale, three collapses, one Wilson ratio* — is what separates the genuine Kondo identification of [79,80] from the steady drip of \"Kondo-like\" claims in molecular junctions, where typically a single ZBP at one temperature is recorded, gate dependence is impossible, and no Fermi-liquid coefficient is measurable. The Hewson criterion [81] stands: until the universal curve is demonstrated, \"Kondo\" is decorative."}, {"id": "use-and-abuse", "title": "5. Use \u0026 abuse: meaning drift in the quantum-dot and molecular-junction era", "markdown": "## 5. Use \u0026 abuse: meaning drift in the quantum-dot and molecular-junction era\n\nAfter Goldhaber-Gordon (1998) [79] and Cronenwett–Oosterkamp–Kouwenhoven (1998) [80] demonstrated a textbook Kondo resonance in a gated GaAs dot — odd $N$, Zeeman splitting, universal $G(T/T_K)$ — the word \"Kondo\" detached from its Hamiltonian. Over the next quarter century it was attached to almost any narrow zero-bias anomaly (ZBA) in a tunneling experiment. The drift is not innocent: the original Kondo claim asserts $\\mathbf{A_1}$ one localized spin, $\\mathbf{A_2}$–$\\mathbf{A_6}$ coherent spin-flip exchange with a Fermi sea, and $\\mathbf{A_8}$ SU(2). Each is testable; most modern \"Kondo\" labels test none.\n\n### The four-test checklist (and how often it fails)\n\nA defensible Kondo claim should show, in order:\n\n1. **Odd-electron local moment.** For a dot: Coulomb-diamond identification of an $N$-odd valley, with the ZBA appearing in odd valleys and absent in even ones. For an adatom or molecule: an independent magnetic fingerprint (XMCD, exchange field, NMR). A ZBA on \"a device\" without parity gating is decorative.\n\n2. **Universal $G(T/T_K)$ collapse.** Goldhaber-Gordon's smoking gun [79][80] is that traces from different gate voltages collapse onto\n$$G(T)/G(0) = \\left[1 + (2^{1/s}-1)(T/T_K)^2\\right]^{-s},\\quad s \\approx 0.22,$$\nwith one fitted $T_K$ per trace. Fitting *each* temperature with a free $T_K$ is not demonstrating Kondo physics — it is fitting a peak.\n\n3. **Field-splitting threshold.** A genuine Kondo resonance splits only above $g\\mu_B B \\gtrsim 0.5\\,k_B T_K$; below threshold the peak just broadens. A ZBA that splits at arbitrarily small field, or fails to split at all, is not Kondo.\n\n4. **Fermi-liquid coefficient ratio.** Nozières' local Fermi liquid [77] fixes the Wilson ratio $R=2$ and ties the leading $T^2$ to the $V^2$ nonlinear-conductance coefficient: $c_T/c_V = \\pi^2/3$ in the one-channel case. Almost no transport \"Kondo\" paper measures both.\n\nSkip all four and the attribution is hollow. Yu–Shiba–Rusinov subgap states near a superconductor, dynamical Coulomb blockade in high-impedance leads, two-level-system ZBAs in disordered junctions, vibronic replicas ([Krause et al., PRB 93, 115139](https://journals.aps.org/prb/abstract/10.1103/PhysRevB.93.115139)), and orbital Fano antiresonances ([Frank \u0026 Jacob, PRB 92, 235127](https://arxiv.org/abs/1509.03560)) all manufacture narrow zero-bias features that look \"Kondo-like\" without being Kondo.\n\n### $T_K$ is not one number\n\nInter-convention comparison is the second endemic abuse:\n\n| Convention | Definition | Relation to $T_K^{\\rm W}$ |\n|---|---|---|\n| Wilson (thermodynamic) | $T\\chi(0) = 0.103\\,g^2\\mu_B^2/(4 k_B T_K^{\\rm W})$ | reference |\n| Haldane (Anderson) | $k_B T_K = \\sqrt{\\Gamma U/2}\\,\\exp[\\pi\\varepsilon_d(\\varepsilon_d+U)/(2\\Gamma U)]$ | $\\sim O(1)$ |\n| Goldhaber-Gordon transport | HWHM of universal $G(T)$ | $\\Gamma_K \\approx 3.92\\,k_B T_K^{\\rm W}$ |\n| Korringa NMR | from $1/(T_1 T)$ via Shiba | tied through $\\chi$ |\n\nThe factor between conventions can reach $\\sim 4$ for spectra with logarithmic tails ([Gruber et al., PRR 6, L022061 (2024)](https://journals.aps.org/prresearch/abstract/10.1103/PhysRevResearch.6.L022061)). Papers routinely quote a $T_K$ from a tunneling half-width and compare it against an exponential Anderson estimate as if both were Wilson's; they are not. Tabulated $T_K$ values without a stated convention are a tell.\n\n### \"Kondo lattice\" where exhaustion lives\n\nCalling a system \"Kondo lattice\" only certifies the Hamiltonian, not the physics. Heavy-fermion compounds were the first abuse: the Doniach competition between $T_K$ and $T_{\\rm RKKY}\\sim J^2\\rho$, together with Nozières' exhaustion ($T^* \\ll T_K^{\\rm single}$ at low conduction density), produces coherent heavy quasiparticles below a *new* scale $T^*$, not a frozen sum of impurity singlets [81]. Mapping magic-angle twisted bilayer graphene onto a topological heavy-fermion model ([Song \u0026 Bernevig, PRL 129, 047601](https://pubmed.ncbi.nlm.nih.gov/37505969/); [Hu et al., PRL 131, 026502](https://pubmed.ncbi.nlm.nih.gov/37925696/)) is a real theoretical proposal — but the experimental \"Kondo\" signatures invoked (Pomeranchuk-like entropy, cascade transitions) probe moiré phenomenology, not the single-impurity universal curve. The mapping is suggestive; the verification is incomplete.\n\n### Under- vs over- vs fully screened are not \"variants\"\n\nNozières–Blandin [78] separated the multichannel problem into three distinct infrared theories. Lumping them is a category error: a non-Fermi-liquid two-channel resistivity $\\rho(T) - \\rho(0) \\propto \\sqrt{T}$ is not \"a noisy Kondo dot\", and an underscreened singular Fermi liquid with a residual moment is not \"imperfect screening\". Each carries a different residual entropy ($\\ln 2$, $0$, or $\\ln(2S{-}k{+}1)$) and a different leading-irrelevant scaling dimension; these are observable.\n\n### Fields where the term is decorative\n\n- **STM on adatoms.** Fano lineshapes on Co/Cu(111)-type substrates are reflexively called \"Kondo\". Without the temperature-broadening collapse $\\Gamma(T)^2 = (\\alpha\\pi k_B T)^2 + (2 k_B T_K)^2$, an independent moment, and a field threshold, the assignment is orbital-resonance physics in Kondo vocabulary.\n- **Single-molecule transistors.** Vibronic side bands at $eV = n\\hbar\\omega_{\\rm vib}$ mimic Kondo satellites; control samples without molecules occasionally exhibit ZBAs of their own — a baseline almost never reported.\n- **Twisted bilayer graphene.** The heavy-fermion framing is theoretically fertile, but the experimental discriminants (Wilson ratio, Korringa product, universal $G(T/T_K)$) are not in hand.\n- **Cold atoms.** Despite a decade of proposals — alkaline-earth orbital exchange, mixed-dimensional bilayers, dissipative engineering ([arXiv:2406.03527](https://arxiv.org/abs/2406.03527), [arXiv:2512.09926](https://arxiv.org/abs/2512.09926)) — no unambiguous screening fixed point has been observed. Current results demonstrate ingredients, not the Kondo crossover.\n\nThe tell-tales of a hollow attribution are uniform: a single temperature trace, no parity check, no field-splitting threshold, a $T_K$ quoted to three significant figures with no convention named, no Wilson-ratio cross-check, no comparison against an alternative ZBA mechanism. When a paper says \"Kondo\" and the only figure is a Lorentzian-on-a-background at one temperature, the word is a label, not a claim."}, {"id": "status-and-believers-checklist", "title": "6. Status today and AETHER's believer's checklist", "markdown": "## 6. Status today and AETHER's believer's checklist\n\nThe single-impurity Kondo problem is, by the standards of strongly correlated physics, *done*. Three independent non-perturbative attacks agree to numerical precision. Wilson's numerical renormalization group [74] gives the universal flow $J \\to \\infty$, the strong-coupling Fermi-liquid fixed point, and the Wilson number $w \\equiv k_B T_K \\chi_{\\rm imp}(0)/(g\\mu_B)^2 = 0.4128...$. The Andrei–Wiegmann Bethe ansatz [76] supplies the closed-form free energy, magnetization, and impurity entropy $S_{\\rm imp}(T\\!\\to\\!0) = 0$, all consistent with NRG within their respective discretization errors. Affleck and Ludwig's boundary conformal field theory ([Nucl. Phys. B 360, 641 (1991)](https://www.semanticscholar.org/paper/The-Kondo-effect,-conformal-field-theory-and-fusion-Affleck-Ludwig/a65ae7f01e9b7183a973d5f09e33c7af7d349d5c); review [arXiv:cond-mat/9311054](https://arxiv.org/abs/cond-mat/9311054)) recovers the same fixed point as a $\\pi/2$ phase shift implemented by SU(2)$_k$ fusion with the spin-$\\tfrac{1}{2}$ primary, and — crucially — predicts the universal *leading irrelevant operator* coefficients that govern the $T^2$ resistivity and $T\\ln T$ specific heat. Nozières' local Fermi-liquid [77] sits inside this structure as the leading irrelevant operator expansion around the strong-coupling fixed point; the Wilson ratio $R = 2$ falls out without fitting.\n\nThe action has moved to two places. *First*, mesoscopic quantum simulators that realize fixed points the bulk-metal program could never reach cleanly. Potok et al. ([Nature 446, 167 (2007)](https://www.nature.com/articles/nature05556)) used a dot–reservoir hybrid to observe the two-channel Kondo $T^{1/2}$ resistivity predicted by Nozières–Blandin [78], and Iftikhar et al. ([Nature 526, 233 (2015)](https://www.nature.com/articles/nature15384); [Science 360, 1315 (2018)](https://www.science.org/doi/10.1126/science.aan5592)) realized the *charge*-Kondo variant in a metal–QPC island where the pseudospin is two macroscopic charge states and $k$ is the number of QPC modes; they have now mapped the two-channel non-Fermi liquid and the three-channel quantum-critical flow, including the $Z_3$-parafermion residual entropy $S^* = \\tfrac{1}{2}\\ln(3+\\sqrt{5})/2$. These are tabletop verifications of the Affleck–Ludwig fixed-point structure to within percent-level accuracy. *Second*, the Kondo lattice and the local quantum-critical-point program: $\\mathrm{YbRh_2Si_2}$, $\\mathrm{CeCu_{6-x}Au_x}$, $\\mathrm{CeRhIn_5}$, $\\mathrm{CeNiAsO}$ — Fermi-surface jumps, $\\omega/T$ scaling, Hall-step discontinuities, and the Planckian $\\hbar/\\tau \\sim k_B T$ strange-metal resistivity ([phys.org 2025-03 summary of Si, Komijani, Chowdhury et al.](https://phys.org/news/2025-03-mechanism-underpinning-intrinsic-strange-metal.html)). Here the Doniach competition between $T_K \\sim D\\exp(-1/J\\rho)$ and $T_{\\rm RKKY} \\sim J^2 \\rho$ is qualitatively different from one-impurity physics: exhaustion, coherence at $T^* \\ll T_K^{\\rm single}$, and the open question of whether quasiparticles dissolve *at* the magnetic transition (Kondo breakdown) or merely renormalize through it. No exact solution exists; lattice DMFT, cluster extensions, and slave-particle large-$N$ are the state of the art.\n\nThe empirical literature outside these well-controlled corners remains noisy. Every season produces fresh \"Kondo\" claims in molecular junctions, magnetic adatoms, twisted bilayers, and Yu–Shiba–Rusinov contexts where the spectral weight is suggestive and the diagnostics are not. AETHER's burden of proof, before the word *Kondo* is accepted:\n\n1. **Identify the local moment.** State $S$, the orbital it lives in, and the evidence (Curie tail, ESR $g$-factor, ligand-field analysis, odd-$N$ Coulomb diamond). If the moment is not characterized, the rest is moot.\n2. **Demonstrate odd-electron occupancy** (or the appropriate charge analogue — pseudospin in Iftikhar's circuit). Even-$N$ \"Kondo\" claims require explicit triplet or singlet-triplet mechanisms, not a wink.\n3. **Extract $T_K$ by at least two independent conventions and publish the conversion.** Wilson-$\\chi$, Haldane-$\\sqrt{\\Gamma U/2}\\exp[\\pi \\varepsilon_d(\\varepsilon_d+U)/(2\\Gamma U)]$, Goldhaber-Gordon transport half-width, Korringa NMR — the numerical $T_K$ differs by $O(1)$ between definitions, and cross-paper comparisons without translation are meaningless (see §2 conflations).\n4. **Demonstrate universal scaling collapse of $G(T/T_K)$** over at least a decade in $T/T_K$, with the empirical Goldhaber-Gordon form $G(T) = G_0/[1+(2^{1/s}-1)(T/T_K)^2]^s$, $s = 0.22$, or its CFT-derived equivalent. One curve at one $T$ is decoration.\n5. **Verify Zeeman splitting onset above $g\\mu_B B \\approx 0.5\\,k_B T_K$.** The zero-bias peak must split, not merely broaden, with the predicted prefactor (Costi 2000; Rosch et al. 2003). Failure here is the canonical separation from a non-Kondo zero-bias anomaly.\n6. **Report a Fermi-liquid coefficient and a Wilson ratio.** $R \\equiv (4\\pi^2 k_B^2/3)\\chi_{\\rm imp}/(g\\mu_B)^2\\gamma_{\\rm imp}$ must be $\\approx 2$ for fully screened SU(2), with the corresponding $T^2$ coefficient $\\alpha = \\pi^4(c_B^2+5c_{B^2}^2)/16$ in the universal ratio. If a non-Fermi-liquid fixed point is claimed instead, name it (2CK, 3CK, underscreened) and supply the predicted residual entropy and anomalous exponent.\n7. **Rule out the §4 look-alikes.** Two-level systems, Fano resonances, dynamical Coulomb blockade, vibronic side-bands, Andreev/YSR in-gap states, weak-localization corrections, spin-orbit-driven antilocalization. A line per look-alike: what was measured, what the alternative would have predicted, why it failed.\n8. **State which assumption from §2 is being relied on and which is being relaxed.** $A_1$ single moment, $A_2$ pointlike, $A_3$ dilute, $A_4$ flat density of states, $A_5$ time-reversal, $A_6$ one channel, $A_7$ Fermi-liquid bath, $A_8$ SU(2) isotropy. Honest Kondo physics today is overwhelmingly about *relaxing* one of these and being explicit about which.\n\nA claim that passes 1–8 is Kondo physics. A claim that passes 1–3 is a candidate. Everything else is decoration on a zero-bias peak."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nThe single-impurity Kondo problem is one of the few corners of strongly correlated physics where I will sign my name to specific numbers. The rest of the territory called \"Kondo\" in 2026 is, in my estimate, about half real and half decorative.\n\n### (a) What I will defend with my reputation\n\nThe S = ½, one-channel, particle–hole-symmetric Kondo Hamiltonian flows to a strong-coupling Fermi-liquid fixed point with phase shift $\\delta = \\pi/2$, Wilson ratio $R = 2$, and a universal crossover function $f(T/T_K)$ for susceptibility, specific heat, and resistivity. Wilson's NRG, the Andrei–Wiegmann Bethe ansatz, and Nozières' local Fermi-liquid expansion agree at the third decimal where they overlap; this is not a \"school of thought,\" it is solved. I will also defend the operational claim that $T_K$ is the *only* infrared scale, so a properly normalised dataset $G(T,V,B)/G_0$ must collapse onto a single surface — and conversely, that any system failing to collapse is not in the single-impurity Kondo universality class, whatever its zero-bias peak looks like.\n\n### (b) What is shakier than the literature admits\n\nFour assumptions in routine use that deserve more scepticism:\n\n1. **A flat, infinite, non-interacting bath.** Schrieffer–Wolff and poor-man's scaling assume a featureless density of states over a window $\\gg T_K$. In nanowires, graphene, and 2D moiré systems, $T_K$ frequently approaches the bath bandwidth or a van Hove feature; the \"universal\" curve then is not universal, and most fits in the literature don't check.\n2. **Spin SU(2) and a sharp local moment.** Real quantum dots have spin–orbit, exchange anisotropy, and orbital admixture; many \"Kondo\" temperatures inferred via Goldhaber-Gordon's transport formula assume pure $S = \\tfrac12$ SU(2) scaling [79, 80] and silently absorb anisotropy into a renormalised $T_K$.\n3. **Equilibrium.** The genuine non-equilibrium Kondo problem at $eV \\gtrsim k_B T_K$ has no closed-form universal curve; decoherence from current cuts the log resummation before it completes. Papers that extend the Costi/Hewson equilibrium scaling form to finite bias are extrapolating, not deriving.\n4. **\"Kondo lattice = Kondo + RKKY.\"** Doniach is a cartoon. Exhaustion (Nozières), selective Mott physics, and the local quantum-critical scenario all show that the lattice problem is not adiabatically connected to the impurity one. The community's habit of using single-impurity $T_K$ as the coherence scale of heavy fermions is a category error.\n\n### (c) Three open questions I would actually work on\n\n1. **The two-channel Kondo fixed point in a real solid.** Forty-six years after Nozières–Blandin, the experimental evidence is suggestive but not closure-grade; channel symmetry is fragile, and the $\\sqrt{T}$ signature is mimicked by disorder. *Why:* it is the cleanest non-Fermi-liquid we know how to write down.\n2. **The Kondo-breakdown / local quantum critical point in heavy fermions.** Whether the $f$-electron Fermi surface jumps discontinuously at the QCP (Senthil–Vojta–Sachdev) or evolves smoothly is still open. *Why:* it decides whether \"destruction of Kondo screening\" is a real phase transition or a crossover dressed up.\n3. **Non-equilibrium universality at $eV, \\hbar\\omega \\gg k_B T_K$.** Current-induced decoherence regulates the strong-coupling fixed point; the exponent and amplitude of that regulator are not settled. *Why:* every Kondo measurement on a driven nanostructure depends on it, and most analyses just ignore it.\n\n### Reading path\n\n1. **Kondo (1964)** [Kondo's original PTP paper] — read it for the third-order log itself, and notice how carefully he cites Zener–Kasuya–Yosida.\n2. **Abrikosov (1965)** — the parquet sum that turns \"a log\" into \"a problem\"; this is where $T_K$ is born and unitarity dies.\n3. **Anderson, Yuval, Hamann (1970)** — poor-man's scaling and the Coulomb-gas mapping; the conceptual seed of every modern RG treatment.\n4. **Wilson (1975)**, *Rev. Mod. Phys.* — the NRG paper. Skip the numerics on first pass, read §§ I–III and the strong-coupling fixed-point analysis.\n5. **Nozières (1974)** local Fermi-liquid paper, then **Affleck–Ludwig (1991)** boundary CFT — together they give the analytic structure (Wilson ratio, leading $T^2$, overscreened fixed points) that NRG only computes."}], "references": [{"n": 1, "title": "Harvesting the Triplet Excitons of Quasi-Two-Dimensional\\nPerovskite toward Highly Efficient White Light-Emitting Diodes", "authors": ["Yue Yu", "Chenjing Zhao", "Lin Ma", "Lihe Yan", "Bo Jiao", "Jingrui Li"], "year": 1753, "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.1021/acs.jpclett.2c00996.s001", "cited_by": 0, "bucket": "earliest"}, {"n": 2, "title": "Berceuse. Piano. LW A186", "authors": ["Franz Liszt"], "year": 1854, "venue": "", "url": "https://doi.org/10.1093/jnen/60.7.696", "cited_by": 0, "bucket": "earliest"}, {"n": 3, "title": "Al Rmo. Señor Vicario General Dr. Juan de Dios Campuzano. Latacunga, 25 febrero de 1887", "authors": ["Manuel María Acosta"], "year": 1887, "venue": "Cancers", "url": "https://doi.org/10.3390/cancers13092245", "cited_by": 0, "bucket": "earliest"}, {"n": 4, "title": "The narrative of a Japanese : what he has seen and the people he has met in the course of the last forty years.", "authors": ["Joseph Heco"], "year": 1892, "venue": "Bulletin of Miscellaneous Information (Royal Gardens Kew)", "url": "https://openalex.org/W2894985318", "cited_by": 5, "bucket": "earliest"}, {"n": 5, "title": "Elementary <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);

  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var aka=(D.aliases&&D.aliases.length)?'<div class="aka">'+D.aliases.map(function(a){return '<i>'+esc(a)+'</i>';}).join('')+'</div>':'';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';

    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
