T\n\nThree years later Langevin compressed the entire Brownian problem into a single stochastic ODE [4]:\n\n$$m\\dot v = -\\gamma v + \\xi(t), \\qquad \\langle \\xi(t)\\xi(t') \\rangle = 2 \\gamma k_B T \\, \\delta(t-t').$$\n\nThis is already a fluctuation–dissipation theorem. The friction coefficient $\\gamma$ — a dissipative parameter — fixes the noise variance through $k_B T$. Equilibrium is *imposed* by the requirement $\\langle \\tfrac12 m v^2 \\rangle = \\tfrac12 k_B T$ at late times, and that requirement is what locks the noise amplitude to the friction. This is the prototype of what Kubo would later call the \"second\" FDT. Mori's 1965 projection-operator construction [5] generalizes exactly this statement to non-Markovian memory kernels $K(t-s)$; the modern form $\\langle \\xi(t) \\xi(0) \\rangle = k_B T \\, K(t)$ is a direct lineal descendant of Langevin 1908, not of any 1950s result.\n\nLangevin's own framing was almost casual — a two-page note in *Comptes Rendus* — and he did not advertise the noise–friction identity as a separate principle. That advertisement waits another half-century.\n\n### Schottky's shot noise: the spectral-density habit\n\nBefore Johnson and Nyquist, there was Schottky [6]. In 1918 he analysed current fluctuations in vacuum tubes and showed that the discrete arrival of electrons at the anode produces a current noise of spectral density $S_I = 2eI$. This is *not* a thermal-equilibrium statement — it is a counting-statistics statement — and it should not be conflated with Johnson noise, which it routinely is. What Schottky bequeathed to the Bell Labs community of the 1920s was something subtler and more important than a specific formula: the habit of describing electrical noise by a frequency-resolved spectral density rather than an integrated RMS. Without that conceptual move Nyquist's derivation does not have a language to land in.\n\n### Johnson's measurement and Nyquist's page\n\nIn 1928 John B. Johnson at Bell Labs reported a careful set of measurements showing that any resistor, regardless of material, geometry, or current history, exhibits a voltage noise across its terminals with a flat spectral density proportional to its resistance and to the absolute temperature [7]. The universality is the point. A carbon resistor, an electrolytic cell, and a wire-wound metal all sat on the same curve once one normalized by $R$ and $T$. This is an empirical fact about *equilibrium*, not about any specific microscopic mechanism, and that universality is the reason an FDT exists at all.\n\nHarry Nyquist, also at Bell Labs, was handed the data and produced — within months — a one-page thermodynamic derivation [8]:\n\n$$S_V(\\omega) = 4 k_B T R, \\qquad \\hbar \\omega \\ll k_B T.$$\n\nHis argument is the cleanest pre-quantum FDT in the literature: imagine the resistor terminated by a lossless transmission line of length $L$, count standing-wave modes in $[\\omega, \\omega+d\\omega]$, give each $k_B T$ by equipartition, demand that in equilibrium the resistor radiates as much power into the line as the line delivers to it, and solve for the source spectral density. There is no microscopic model anywhere in the derivation — the noise is fixed by equilibrium plus the dissipative parameter $R$.\n\nThe standard shorthand \"Nyquist's theorem\" reliably erases Johnson. Nyquist himself does not — his paper opens by saying it exists to explain Johnson's measurements. Bell Labs internal practice referred to \"Johnson noise\" for the phenomenon and \"Nyquist's formula\" for the theory, and that is the historically accurate split.\n\n### What was on the table by 1928\n\nBy the late 1920s, four pieces were sitting in plain view, each tied to a different community: the Sutherland–Einstein relation in colloid science, Smoluchowski's collision picture in probability theory, Langevin's stochastic equation in mechanics, and the Johnson–Nyquist law in electrical engineering. Each is a fluctuation–dissipation statement. None of the authors used that phrase, and none of them recognized that the four were instances of one identity. The recognition that they were — and the quantum generalization that subsumes all of them — was Callen and Welton's job in 1951, and it is the subject of the next section. Welton, like Sutherland and like Johnson, is mostly absent from the way the result is now cited."}, {"id": "pedagogical-core", "title": "The Theorem Itself: Three Statements, One Identity", "markdown": "## The Theorem Itself: Three Statements, One Identity\n\nThe fluctuation–dissipation theorem is taught as if it were a single equation. It is not. Three distinct identities circulate under the name, and each rests on a different combination of hypotheses. Section 1 traced their separate genealogies; here we derive them in one pass, watch them collapse to a single line of algebra, and mark the bookkeeping where they cease to be equivalent.\n\n### Setting\n\nLet $H_0$ be a Hamiltonian with canonical density matrix $\\rho_0 = Z^{-1} e^{-\\beta H_0}$, $\\beta = 1/k_B T$. Couple an external field $f(t)$ to a Hermitian operator $B$,\n$$H(t) = H_0 - f(t)\\, B,$$\nand ask for the linear response of an observable $A$. Standard interaction-picture algebra [9, 10] gives\n$$\\delta\\langle A\\rangle(t) = \\int_{-\\infty}^{\\infty} dt'\\; \\chi_{AB}(t-t')\\, f(t'),\\qquad \\chi_{AB}(t) = \\frac{i}{\\hbar}\\,\\theta(t)\\,\\big\\langle [A_H(t),\\,B(0)]\\big\\rangle_0,$$\nwith angled brackets denoting the unperturbed canonical average and $A_H(t) = e^{iH_0 t/\\hbar} A\\, e^{-iH_0 t/\\hbar}$. Taking the one-sided Fourier transform,\n$$\\boxed{\\;\\chi_{AB}(\\omega) \\;=\\; \\frac{i}{\\hbar}\\int_0^\\infty dt\\, e^{i\\omega t}\\,\\big\\langle[A(t), B(0)]\\big\\rangle_0\\;}$$\nThis is the **Kubo formula** [9]. It is the answer to a question that does not yet involve fluctuations: how does $\\langle A\\rangle$ shift under the perturbation $-fB$? Nothing here demands canonical equilibrium; the same expression survives in any stationary state, with the appropriate replacement for $\\langle\\cdot\\rangle_0$.\n\n### From Kubo to Callen–Welton: the role of KMS\n\nNow use the explicit form of $\\rho_0$. Cyclic invariance of the trace and analytic continuation give the Kubo–Martin–Schwinger condition,\n$$\\langle A(t) B(0)\\rangle_0 = \\langle B(0)\\, A(t + i\\hbar\\beta)\\rangle_0,$$\nequivalent, after Fourier transform, to the detailed-balance relation for spectra,\n$$S_{AB}(\\omega) \\;\\equiv\\; \\int_{-\\infty}^{\\infty} dt\\, e^{i\\omega t}\\,\\langle A(t) B(0)\\rangle_0 \\;=\\; e^{\\beta\\hbar\\omega}\\, S_{BA}(-\\omega).$$\nSplit the commutator's spectrum into emission and absorption pieces and apply this identity. After a few lines,\n$$\\chi''_{AB}(\\omega) \\;=\\; \\frac{1}{2\\hbar}\\,\\big(1 - e^{-\\beta\\hbar\\omega}\\big)\\, S_{AB}(\\omega),$$\nwhich is most often written in the symmetrized form\n$$\\boxed{\\;\\tfrac{1}{2}\\big[S_{AA}(\\omega) + S_{AA}(-\\omega)\\big] \\;=\\; \\hbar\\,\\coth\\!\\Big(\\tfrac{\\beta\\hbar\\omega}{2}\\Big)\\,\\chi''_{AA}(\\omega).\\;}$$\nThis is the **Callen–Welton theorem** [11], the equation that christened the field. In the high-temperature limit $\\hbar\\omega \\ll k_B T$, $\\coth(\\beta\\hbar\\omega/2) \\to 2/(\\beta\\hbar\\omega)$ and one recovers the classical Nyquist–Einstein shape\n$$S_{AA}(\\omega) = \\frac{2 k_B T}{\\omega}\\,\\chi''_{AA}(\\omega).$$\nThe asymmetry between $S(\\omega)$ and $S(-\\omega)$ — emission stronger than absorption by the Boltzmann factor $e^{\\beta\\hbar\\omega}$ — is not a perturbative quantum correction. It is the entire signature of facing a thermal bath rather than a vacuum, and section 7 returns to it when sideband cooling and the standard quantum limit enter.\n\n### The second kind: noise locks the memory kernel\n\nThe third statement lives at the level of stochastic dynamics. Following Mori [5], project the Heisenberg evolution of a vector observable $\\mathbf v$ onto itself and orthogonally; the result is the **generalized Langevin equation**\n$$m\\dot{\\mathbf v}(t) = -\\int_0^t K(t-s)\\,\\mathbf v(s)\\,ds + \\boldsymbol{\\xi}(t),$$\nwith $K(t)$ the projected memory kernel and $\\boldsymbol\\xi(t)$ the orthogonal residue. Because the projector is built from the canonical inner product $(A,B) = \\beta^{-1}\\langle A^\\dagger B\\rangle_0$, the noise covariance is fixed:\n$$\\boxed{\\;\\big\\langle \\xi_i(t)\\,\\xi_j(0)\\big\\rangle \\;=\\; k_B T\\, K_{ij}(t).\\;}$$\nThis is the **second-kind FDT**. Its Markovian shadow is Langevin's 1908 identity $\\langle\\xi(t)\\xi(0)\\rangle = 2\\gamma k_B T\\,\\delta(t)$ [4]; the operator-valued extension on a bilinearly coupled bath is the Feynman–Vernon influence functional [12], whose symmetric noise kernel reproduces the same $\\coth(\\beta\\hbar\\omega/2)$ encountered above.\n\n### Onsager's regression hypothesis is the entire content\n\nThe three identities look distinct only because they speak different formal dialects. In a single line:\n\n\u003e **Onsager's claim** [13, 14]: the average decay of a spontaneous fluctuation is governed by the same linear law as the macroscopic relaxation.\n\nPrepare the system with a small static bias $f$ adiabatically switched off at $t=0$. The classical canonical ensemble gives $\\langle A(0)\\rangle_{\\rm bias} = \\beta\\, C_{AA}(0)\\, f$ and, by Onsager, $\\langle A(t)\\rangle_{\\rm bias} = \\beta\\,C_{AA}(t)\\, f$ for $t\u003e0$. Reading off the response,\n$$\\chi_{AA}(t) = -\\beta\\,\\dot C_{AA}(t)\\,\\theta(t) \\quad\\Longrightarrow\\quad \\chi''_{AA}(\\omega) = \\tfrac{\\beta\\omega}{2}\\,C_{AA}(\\omega).$$\nThat is the classical first-kind FDT. The quantum upgrade replaces $\\beta C$ by the Kubo canonical correlator $\\int_0^\\beta d\\lambda\\,\\langle A(-i\\hbar\\lambda)A(t)\\rangle$ and $C(\\omega)$ by the symmetrized spectrum — algebra, not new physics. The second-kind statement is the same identity differentiated once: if $\\mathbf v$ regresses according to $K$, the residual noise must carry exactly the variance $k_B T K(t)$ needed to keep equipartition self-consistent under the dynamics it generates.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eThree statements of the FDT and their common root\u003c/title\u003e\u003ccircle cx=\"360\" cy=\"210\" r=\"78\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"360\" y=\"198\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003ecanonical ρ₀\u003c/text\u003e\u003ctext x=\"360\" y=\"218\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003e+ linear response\u003c/text\u003e\u003ctext x=\"360\" y=\"240\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003e(KMS / regression)\u003c/text\u003e\u003cline x1=\"320\" y1=\"156\" x2=\"200\" y2=\"80\" stroke=\"#7aa2ff\" stroke-width=\"1.4\"/\u003e\u003cline x1=\"282\" y1=\"210\" x2=\"140\" y2=\"210\" stroke=\"#7aa2ff\" stroke-width=\"1.4\"/\u003e\u003cline x1=\"320\" y1=\"264\" x2=\"200\" y2=\"340\" stroke=\"#7aa2ff\" stroke-width=\"1.4\"/\u003e\u003cline x1=\"438\" y1=\"210\" x2=\"600\" y2=\"210\" stroke=\"#ffb86b\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"170\" y=\"58\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"15\" font-family=\"serif\"\u003eKubo (1957)\u003c/text\u003e\u003ctext x=\"170\" y=\"78\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eχ = (i/ℏ)∫e^{iωt}⟨[A(t),B]⟩\u003c/text\u003e\u003ctext x=\"78\" y=\"200\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"15\" font-family=\"serif\"\u003eCallen–Welton\u003c/text\u003e\u003ctext x=\"78\" y=\"222\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eS = ℏ coth(βℏω/2) χ''\u003c/text\u003e\u003ctext x=\"170\" y=\"358\" text-anchor=\"middle\" fill=\"#7aa2ff\" font-size=\"15\" font-family=\"serif\"\u003eMori / Langevin\u003c/text\u003e\u003ctext x=\"170\" y=\"378\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e⟨ξ(t)ξ(0)⟩ = k_B T K(t)\u003c/text\u003e\u003ctext x=\"650\" y=\"200\" text-anchor=\"middle\" fill=\"#ffb86b\" font-size=\"15\" font-family=\"serif\"\u003eEinstein (1905)\u003c/text\u003e\u003ctext x=\"650\" y=\"222\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eμ = D / k_B T (ω→0)\u003c/text\u003e\u003ctext x=\"360\" y=\"378\" text-anchor=\"middle\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"serif\"\u003eclassical limit ℏω ≪ k_B T: coth(βℏω/2) → 2/(βℏω)\u003c/text\u003e\u003c/svg\u003e\n*Figure: The three identities sold under the name \"FDT\" radiate from a single hypothesis — a canonical density matrix subjected to a linear external perturbation. The Einstein relation is the zero-frequency, classical-limit shadow that section 1 traced to 1905; the equivalence among the upper three is essentially Onsager's regression hypothesis written in three notations.*\n\n### Where the three statements stop being one\n\nEach derivation invoked the same two assumptions and no others. Strip either and the identities diverge.\n\n- **Drop \"canonical $\\rho_0$\"** (a driven steady state, an aged glass, an active fluid). The Kubo formula still holds for $\\chi_{AB}$, because it asks only about deterministic response to an external field. The KMS relation fails: $S(\\omega) \\ne e^{\\beta\\hbar\\omega} S(-\\omega)$, so Callen–Welton evaporates. The Mori construction also survives — it is purely algebraic — but the noise covariance is no longer $k_B T$ times the kernel; an additional correlator carrying the non-equilibrium currents must be tracked. Sections 6 and 8 audit those corrections, including the Baiesi–Maes–Wynants \"frenetic\" term that restores an identity by explicitly measuring an activity correlator.\n\n- **Drop \"linear\"** (large drives, nonlinear susceptibilities $\\chi^{(n)}$). One then needs higher-order Kubo formulas with multi-time commutators, and the simple $\\chi'' \\leftrightarrow S$ pairing fragments into a tower of identities between $n$-point response and $(n{+}1)$-point correlation [15].\n\nThe architectural point is clean: there is one theorem, written three ways. Kubo gave the framework, Callen and Welton the most general spectral form, Mori the stochastic-equation form, and Onsager — over twenty years before any of them — the structural identity that makes all three say the same thing."}, {"id": "from-nyquist-to-kubo", "title": "From Nyquist's Transmission Line to Kubo's Commutator: How the Formulation Evolved", "markdown": "## From Nyquist's Transmission Line to Kubo's Commutator: How the Formulation Evolved\n\nThe FDT was not derived once. It was rederived six times between 1928 and 1965, each time on a wider hypothesis-base, each time absorbing its predecessor as a special case. The structural ascent is worth tracing carefully because most modern \"derivations\" — the half-page ones that appear as appendix B of papers on stochastic thermodynamics or quantum noise — silently borrow from the strongest link in the chain (Kubo) while invoking the weakest (Nyquist) for intuition. The audit below names what each step actually contributed.\n\n### Nyquist 1928: equipartition over modes\n\nNyquist's derivation of $S_V(\\omega) = 4 k_B T R$ is a thermodynamic argument, not a microscopic one [8]. Connect two resistors $R$ at temperature $T$ through a lossless transmission line of length $L$ and characteristic impedance $R$. In equilibrium the line is filled with standing-wave modes; equipartition gives $k_B T$ per mode; matched termination means each mode carries equal forward and backward power. Setting forward $=$ backward in the line and demanding zero net heat flow between the resistors fixes the noise spectrum each resistor must emit. The whole calculation fits on one page and uses no detail of the resistor — only that it is in equilibrium and dissipates real power.\n\nWhat this preserves: the identity *\"dissipation at $T$ implies a definite noise spectrum\"*. What it cannot reach: any frequency where $\\hbar \\omega \\gtrsim k_B T$ (equipartition fails), any nonlinear element, and any observable other than voltage on a two-terminal black box. Nyquist himself noted the Planck correction in a footnote and replaced $k_B T$ by $\\hbar\\omega / (e^{\\hbar\\omega/k_BT} - 1)$ — but this is still a mode-counting argument, not a statement about operators.\n\nModern textbooks that present \"FDT for resistors\" as a transmission-line argument and then *quote* the quantum spectrum with the zero-point $\\hbar\\omega/2$ term are committing a category error: the zero-point piece is not in the Nyquist argument and cannot be put there. It comes from Callen–Welton.\n\n### Onsager 1931: regression and reciprocity\n\nOnsager did not state the FDT. He stated the structural lemma that makes it inevitable [13, 14]. The reciprocal relations $L_{ij} = L_{ji}$ are derived from microscopic time-reversal invariance applied to the *decay of spontaneous fluctuations*. The hinge is the regression hypothesis: the average decay of a fluctuation $\\langle \\delta A(t) \\delta A(0)\\rangle / \\langle \\delta A^2\\rangle$ obeys the same macroscopic equation that governs the relaxation of an externally prepared deviation. Casimir 1945 extended this to magnetic fields, fixing $L_{ij}(B) = L_{ji}(-B)$ [16].\n\nWhat this preserves and supplies: a microscopic justification for treating the correlation function $C_{AA}(t)$ and the relaxation function as the same object. Nyquist's equipartition becomes a corollary: $C(t)$ at $t=0$ is set by equipartition, $C(t)$ for $t\u003e0$ obeys the macroscopic relaxation law, and the spectrum is their Fourier transform. What it leaves open: how to compute $\\chi''(\\omega)$ from first principles, and what replaces equipartition in the quantum regime. Onsager's regression is classical; it is silent on commutators.\n\n### Callen and Welton 1951: the quantum theorem and the name\n\nCallen and Welton wrote down the full statement [11]:\n\n$$S_{AA}(\\omega) \\;=\\; \\frac{\\hbar}{\\pi}\\,\\coth\\!\\!\\left(\\frac{\\hbar\\omega}{2 k_B T}\\right) \\chi''_{AA}(\\omega).$$\n\nThe derivation is second-order time-dependent perturbation theory on a generic Hamiltonian system weakly coupled to a perturbation $-A F(t)$, plus the canonical density matrix. Two pieces of physics enter that Nyquist could not see. First, $\\chi''_{AA}$ is computed as a difference of transition rates: $|\\langle m | A | n\\rangle|^2 [\\rho_n - \\rho_m] \\delta(\\hbar\\omega - E_m + E_n)$. Second, $S_{AA}$ is computed as a sum of the same matrix elements weighted by $\\rho_n + \\rho_m$. The ratio $(\\rho_n + \\rho_m)/(\\rho_n - \\rho_m) = \\coth(\\hbar\\omega/2k_BT)$ produces the theorem in one line.\n\nWhat this preserves: every classical case. The high-$T$ limit reduces $\\coth$ to $2k_B T/\\hbar\\omega$, recovering Nyquist and the Einstein relation. What is genuinely new: the asymmetric quantum spectrum (the emission-vs-absorption distinction tracked in §2) and the zero-point term $\\hbar|\\omega|/2 \\cdot 2\\chi''$ that survives $T \\to 0$. The Callen–Welton derivation is microscopic, model-independent, and quantum from the start. It is also the first paper to use the phrase \"fluctuation–dissipation theorem\".\n\nWhat it does not give: a route to *compute* $\\chi''$ for an interacting many-body system, and no recipe for transport coefficients (currents do not couple linearly to scalar fields in the Callen–Welton setup).\n\n### Green 1952–54: time-correlation functions for transport\n\nGreen did not work on the FDT; he worked on transport coefficients [17, 18]. The output is the expression now folkloric as \"Green–Kubo\":\n\n$$\\sigma_{\\alpha\\beta} \\;=\\; \\frac{1}{V k_B T}\\int_0^\\infty \\!dt\\, \\langle J_\\alpha(t) J_\\beta(0)\\rangle_{\\rm eq}.$$\n\nGreen derived this through a Markov-process treatment of phase-space densities and a careful $t \\to \\infty$ limit. It is the structural twin of the FDT — a transport coefficient (real-frequency dissipation at $\\omega \\to 0$) written as the integral of an equilibrium correlation function — but the derivation does not pass through linear response. Modern citations almost uniformly attribute the formula to Kubo 1957. The 1952 priority is unambiguous on the page.\n\n### Kubo 1957: linear response absorbs everything\n\nKubo's contribution is structural [9, 19]. Perturb a canonical density matrix $\\rho_0 = e^{-\\beta H_0}/Z$ by $H_1(t) = -B F(t)$ and compute $\\langle A(t)\\rangle$ to first order in $F$. The result is the Kubo formula\n\n$$\\chi_{AB}(\\omega) = \\frac{i}{\\hbar}\\int_0^\\infty \\!dt\\, e^{i\\omega t}\\,\\langle [A(t), B(0)]\\rangle_{\\rm eq},$$\n\nvalid for *any* observables $A, B$. From this single object three previously separate results fall out as corollaries: (i) the Callen–Welton FDT, by relating the commutator to the anticommutator through the canonical $\\rho_0$; (ii) Green's transport formulas, by taking $A = B = J$ and $\\omega \\to 0$; (iii) Onsager reciprocity, by exchanging $A \\leftrightarrow B$ and using time-reversal on $H_0$.\n\nWhat this preserves: every earlier statement, as a special case. What it newly enables: systematic computation in interacting systems via diagrammatic perturbation theory on the commutator, and a clean separation between *linear response* (a statement about $\\rho_0$, true in or out of equilibrium for arbitrary $\\rho_0$) and the *FDT* (a statement that holds only when $\\rho_0$ is canonical). The conflation flagged in §2 — \"FDT = Kubo formula\" — is dissolved precisely here: Kubo gives the formula; equilibrium gives the theorem.\n\n### Mori 1965: projection operators and the non-Markovian second FDT\n\nMori treated the question Kubo did not: what equation does a chosen slow variable $A$ actually obey [5]? Projecting Liouville dynamics onto the subspace spanned by $A$ yields the generalized Langevin equation\n\n$$\\dot A(t) = i\\Omega\\, A(t) - \\int_0^t K(t-s)\\, A(s)\\, ds + \\xi(t),$$\n\nwith frequency $\\Omega$, memory kernel $K(t)$, and orthogonal noise $\\xi(t)$. The second-kind FDT in its non-Markovian form,\n\n$$\\langle \\xi(t)\\xi(0)\\rangle = \\langle A^2\\rangle_{\\rm eq}\\, K(t),$$\n\nis a *theorem* of the projection: noise and dissipation share a single function because both come from the same projected dynamics. Langevin 1908 [4] is the Markov special case $K(t) = 2\\gamma \\delta(t)$.\n\nWhat this preserves: Kubo's first-kind FDT (it emerges by Fourier-transforming the GLE in the linear regime). What is genuinely new: a microscopic *construction* of $\\gamma$ and $\\xi$ from the underlying Hamiltonian, rather than a phenomenological postulate. Zwanzig's reformulation of the same construction [15] is what most modern papers cite; the form of the FDT they call \"Kubo\" is in fact Mori's.\n\n### The chain, audited\n\nEach link absorbs its predecessor and adds one ingredient that the predecessor cannot supply: Nyquist supplies mode equipartition; Onsager supplies the regression hypothesis; Callen–Welton supplies the quantum spectrum and the name; Green supplies the correlation-function form of transport; Kubo supplies the linear-response framework that unifies them; Mori supplies the projected microscopic derivation of the Langevin form. A \"derivation\" that starts from Nyquist's transmission line and ends at the quantum coth-spectrum is not a derivation — it is a sleight of hand. The honest short proof is Callen–Welton's; the honest general proof is Kubo's; the honest Langevin-form proof is Mori's. Citations that compress all three into \"Kubo's theorem\" erase precisely the structural ascent that makes the theorem more than a coincidence."}, {"id": "landmark-experiments", "title": "Landmark Measurements: Brownian Trajectories, Resistor Hum, Quantum Zero-Point Noise", "markdown": "## Landmark Measurements: Brownian Trajectories, Resistor Hum, Quantum Zero-Point Noise\n\nA theorem that ties dissipation to fluctuation lives or dies on whether the two can be measured against the same yardstick. Four experimental episodes, spaced a century apart, have done that test in regimes the theorem must cover if it is to deserve the name. Each constrains a different slice of the identity. Together they bracket the FDT from the classical limit through the quantum vacuum and into the disordered regimes where the equality breaks.\n\n### Perrin's colloids: the first calibration of $D=\\mu k_B T$\n\nThe Einstein–Sutherland prediction [2] was a closed identity between three measurable quantities — diffusion constant $D$, mobility $\\mu=1/(6\\pi\\eta a)$, and temperature $T$ — with $k_B$ (equivalently $N_A=R/k_B$) as the only unknown. Jean Perrin and his students at the Sorbonne (1908–1913) turned that identity into a number. The dossier work proceeded along two complementary tracks: (i) **sedimentation equilibrium**, where the height distribution of gamboge and mastic spheres in a vertical column was photographed and fit to a barometric law $n(z)\\propto e^{-mgz/k_B T}$; (ii) **direct Brownian trajectory recording**, where the projected displacements $\\Delta x$ of individual spheres were timed under the microscope and the Einstein relation $\\langle\\Delta x^2\\rangle=2Dt$ inverted for $D$. Holding $\\eta$ and $a$ (the latter measured by Stokes' settling rate and by direct counting) fixed, Perrin found $N_A \\simeq 6.5$–$7.2\\times 10^{23}$ across particle masses varied by a factor of $\\sim 1.5\\times 10^4$ — the systematic agreement is the experimental content, not any single number ([Perrin's Brownian Motion Experiments — Oxford](https://academic.oup.com/book/33527/chapter/287871930); [Perrin, J. Phys. Théor. Appl. 1910](https://web.lemoyne.edu/~giunta/perrin.html)).\n\nWhat Perrin's data actually constrain is the **zero-frequency, classical limit** of the FDT specialized to a mechanical observable: the Einstein relation $\\mu=D/k_B T$. The result rules out any kinetic theory in which $D$ and $\\mu$ are independent material parameters; it does not test the spectral form of the noise — the colloidal trajectory is sampled at intervals long compared to the velocity-correlation time $m/\\gamma\\sim 10^{-7}\\,$s, so what survives is the integrated (DC) statement.\n\n### Johnson 1928: the universal hum\n\nTwenty years later, J. B. Johnson built a calibrated thermionic-amplifier chain at Bell Labs and measured the open-circuit voltage spectrum across resistors fabricated from copper sulfate solutions, vacuum carbon, electrolyte, metallic films, and several alloys, spanning $R$ from $10^3$ to $10^6\\,\\Omega$ and $T$ from $\\sim 78\\,$K (liquid air) to $\\sim 360\\,$K [7]. The astonishing result was that, after correcting for amplifier gain and bandwidth, the noise power per unit bandwidth collapsed to a single line: $S_V=4 k_B T R$, with the slope yielding $k_B$ to a few percent — independent of material, geometry, electrode shape, or the chemical nature of the conduction. Within hours of seeing the data Nyquist supplied the thermodynamic derivation on a transmission line [8]. The experimental content is the **universality**: a noise spectrum that depends only on the macroscopic linear-response coefficient $R(\\omega)$ and on $T$, exactly as a fluctuation–dissipation identity demands. Johnson's measurements occupied the regime $\\hbar\\omega\\ll k_B T$ ($\\omega/2\\pi \\lesssim 50\\,$kHz at room temperature, six orders below the crossover) — they test the classical FDT and say nothing about $\\hbar\\omega/2$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eQuantum FDT spectrum and the regimes probed by each landmark measurement\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"70\" y1=\"40\" x2=\"70\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"380\" y=\"378\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003elog( ℏω / k_B T)\u003c/text\u003e\u003ctext x=\"20\" y=\"190\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 20 190)\"\u003elog S(ω) / (k_B T · Re Z)\u003c/text\u003e\u003cline x1=\"70\" y1=\"220\" x2=\"380\" y2=\"220\" stroke=\"#7aa2ff\" stroke-width=\"2.4\"/\u003e\u003cpath d=\"M380 220 Q 460 180 690 60\" stroke=\"#7aa2ff\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003ctext x=\"180\" y=\"208\" fill=\"#7aa2ff\" font-size=\"14\"\u003eclassical plateau S = 4 k_B T R\u003c/text\u003e\u003ctext x=\"500\" y=\"120\" fill=\"#7aa2ff\" font-size=\"14\"\u003eℏω·coth(ℏω/2k_B T) → ℏω\u003c/text\u003e\u003cpath d=\"M380 220 Q 470 280 690 330\" stroke=\"#ff7a90\" stroke-width=\"2.2\" fill=\"none\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"510\" y=\"320\" fill=\"#ff7a90\" font-size=\"14\"\u003eemission side: e^(−ℏω/k_B T) suppressed\u003c/text\u003e\u003cline x1=\"380\" y1=\"40\" x2=\"380\" y2=\"340\" stroke=\"#ffb86b\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"380\" y=\"32\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eℏω ≈ k_B T crossover\u003c/text\u003e\u003crect x=\"90\" y=\"50\" width=\"170\" height=\"22\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"175\" y=\"66\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003ePerrin 1908 · Johnson 1928\u003c/text\u003e\u003crect x=\"430\" y=\"50\" width=\"240\" height=\"22\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"550\" y=\"66\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eKoch–Van Harlingen–Clarke 1981\u003c/text\u003e\u003crect x=\"470\" y=\"80\" width=\"200\" height=\"22\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1\"/\u003e\u003ctext x=\"570\" y=\"96\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eoptomechanics, circuit QED\u003c/text\u003e\u003ccircle cx=\"120\" cy=\"220\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"200\" cy=\"220\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"280\" cy=\"220\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"500\" cy=\"155\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"580\" cy=\"110\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"640\" cy=\"80\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003c/svg\u003e\n*Figure: The quantum FDT noise spectrum (blue, symmetrized) flattens to the Nyquist plateau for $\\hbar\\omega\\ll k_BT$ and grows linearly with $\\omega$ — the zero-point branch — for $\\hbar\\omega\\gg k_BT$. The asymmetric (red, dashed) emission side is exponentially suppressed at $T\\to 0$. Perrin and Johnson sit in the plateau; Koch–Van Harlingen–Clarke straddle the crossover at $\\sim 0.4$ K and 500 GHz; optomechanical and circuit-QED experiments resolve the emission/absorption asymmetry directly.*\n\n### The zero-point branch: Josephson junctions, optomechanics, circuit QED\n\nThe high-frequency content of the Callen–Welton spectrum [11], $S_V(\\omega)=2\\hbar\\omega\\,\\mathrm{Re}\\,Z(\\omega)\\,[\\tfrac{1}{2}+1/(e^{\\hbar\\omega/k_BT}-1)]$, has a piece that does not vanish at $T=0$ — the $\\hbar\\omega/2$ zero-point noise. **Koch, Van Harlingen, and Clarke** ([PRL 47, 1216 (1981)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.47.1216)) demonstrated this directly. They biased a resistively shunted Nb–NbO$_x$–Pb Josephson tunnel junction so that the AC Josephson effect ($\\omega_J=2eV/\\hbar$, tunable up to $\\sim 500\\,$GHz) acted as a heterodyne mixer between the shunt resistor's noise at $\\omega_J$ and the measurement band at low frequency. They cooled the junction to $T=1.6$ K and $T=4.2$ K and measured the down-mixed noise as a function of $\\omega_J$. The data tracked the full $\\hbar\\omega\\coth(\\hbar\\omega/2k_BT)$ form, with the deviation from the classical $4k_BT R$ plateau matching the zero-point contribution at the percent level — and crucially showed that the limit $\\omega\\to\\infty$ at fixed $T$ does not flatten the spectrum. This is the FDT identified as a quantum statement, not merely $k\\to\\hbar/(\\beta\\hbar)$ bookkeeping.\n\nThe optomechanical generation of this test reads off the **asymmetry** between Stokes ($\\omega_L-\\Omega_m$) and anti-Stokes ($\\omega_L+\\Omega_m$) scattering rates: the ratio is $(n+1)/n$, with $n$ the mechanical occupation, because emission requires a phonon while absorption proceeds even from $n=0$. **Safavi-Naeini, Chan, Hill, Alegre, Krause, and Painter** ([PRL 108, 033602 (2012)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.108.033602)) measured this ratio on a sideband-cooled optomechanical crystal at $\\Omega_m/2\\pi=3.68\\,$GHz and $n=2.6\\pm0.2$, recovering the predicted asymmetry within a few percent. The general framework — qubits and cavities as quantum spectrometers of $S(\\omega)$ at $\\omega\u003e0$ versus $\\omega\u003c0$ — was set out by Schoelkopf, Clerk, Girvin, Lehnert, and Devoret ([arXiv:cond-mat/0210247](https://arxiv.org/abs/cond-mat/0210247)). Circuit-QED implementations have since verified the asymmetric quantum spectrum across decades in $\\hbar\\omega/k_BT$, with the same Feynman–Vernon influence-functional accounting [12] supplying the theoretical template.\n\n### Where the theorem breaks: aging spin glasses\n\nThe cleanest measurement of a controlled FDT violation is **Hérisson and Ocio** ([PRL 88, 257202 (2002)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.88.257202)) on the insulating Heisenberg spin glass CdCr$_{1.7}$In$_{0.3}$S$_4$ below $T_g\\simeq 16.7$ K. They simultaneously recorded the thermoremanent magnetization $M(t,t_w)$ (the integrated response $\\chi$) and the spontaneous magnetization fluctuations $\\langle\\delta M(t)\\delta M(t_w)\\rangle$ (the correlation $C$) with a SQUID over six decades of time. Plotting $\\chi$ against $C$ parametrically by time recovers the equilibrium line $\\chi=(C(0)-C)/k_BT$ at short separations and a second, shallower line at long separations — the slope of which defines $T_\\mathrm{eff}\u003eT$ in precisely the Cugliandolo–Kurchan sense [20]. The experimental content is that $T_\\mathrm{eff}$ is observable-independent within their precision over the aging plateau, the property that justifies calling it a temperature at all. This is the strongest existing case that the FDR generalization survives experimental scrutiny somewhere; it is also the case the active-matter and biophysics literatures routinely invoke without performing the parametric test that gives it meaning."}, {"id": "what-is-still-valid", "title": "Validity Audit: Where the Theorem Holds, Where It Has Been Stripped of Its Hypotheses", "markdown": "## Validity Audit: Where the Theorem Holds, Where It Has Been Stripped of Its Hypotheses\n\nThe fluctuation–dissipation theorem is unusual among results of statistical mechanics in that its hypotheses are short, its conclusion is sharp, and its abuses are industrial. The hypothesis set fits on one line — canonical equilibrium, linear response of a stationary observable, finite (integrable) susceptibility, and a meaningful single temperature — yet a remarkable fraction of the modern literature invokes the theorem after one or more of these has been quietly struck from the list.\n\n### The hypothesis set, stated as the proof requires\n\nTake the unperturbed Hamiltonian $H_0$, density matrix $\\rho_0 = e^{-\\beta H_0}/Z$, observable $A$, and a perturbation $H_1(t) = -B f(t)$. The Callen–Welton derivation [11] and its modern restatements [9, 19, 10] each require all four of the following:\n\n**(i) Canonical equilibrium of the unperturbed state.** The trace $\\langle\\,\\cdot\\,\\rangle_0 = \\mathrm{Tr}(\\rho_0\\,\\cdot\\,)$ is taken in the Gibbs ensemble at a single temperature $T$. The proof uses $[\\rho_0,H_0]=0$ and the KMS condition $\\langle A(t)B(0)\\rangle_0 = \\langle B(0)A(t+i\\hbar\\beta)\\rangle_0$ explicitly; remove either and the symmetric/antisymmetric decomposition that isolates $\\chi''$ falls apart.\n\n**(ii) Linear regime.** The response $\\langle A(t)\\rangle - \\langle A\\rangle_0 = \\int dt'\\,\\chi_{AB}(t-t')f(t')$ is the first term in a series in $f$. The FDT constrains $\\chi_{AB}$, not $\\chi^{(2)},\\chi^{(3)},\\ldots$; higher Kubo kernels obey their own nonlinear FDRs [21] which are not the theorem usually being invoked.\n\n**(iii) Time-translation invariance / stationarity.** Both $\\chi_{AB}(t,t')$ and $C_{AB}(t,t')$ must depend on $t-t'$ alone, so Fourier transforms exist as ordinary functions and Kramers–Kronig is available. Aging systems with explicit two-time dependence violate this at the outset — they require a two-time formulation [20], not the textbook identity.\n\n**(iv) Finite, integrable susceptibility.** The relation\n$$S_{AA}(\\omega) = \\frac{2\\hbar}{1-e^{-\\beta\\hbar\\omega}}\\,\\chi''_{AA}(\\omega)$$\nis meaningful only where $\\chi''_{AA}(\\omega)$ is well-defined and the time integral $\\int dt\\,e^{i\\omega t}\\chi(t)$ converges. Long-tailed memory kernels — anomalous diffusion, $1/f$ tails, glassy correlators — violate this on finite frequency windows, with documented consequences for the Langevin form [22, 23].\n\nTo these four explicit hypotheses one must add a tacit fifth: the bath whose statistics enter $\\chi''$ must be the *same* bath whose noise enters $S_{AA}$. Whenever an experimentalist measures response through one channel and noise through another, this is a non-trivial assumption rather than a definition.\n\n### Sin 1 — the coth amputation\n\nThe quantum FDT for a Hermitian observable reads\n$$S_{AA}(\\omega) = \\hbar\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_B T}\\right)\\chi''_{AA}(\\omega).$$\nThe classical limit $\\hbar\\omega \\ll k_B T$ collapses $\\hbar\\coth(\\hbar\\omega/2k_B T)\\to 2k_B T/\\omega$, leaving a symmetric, real spectrum with no zero-point piece. Two failure modes are routine:\n\n*Mode A — the low-temperature amputation.* Cryogenic experiments on superconducting circuits, optomechanical cavities, and gravitational-wave interferometers operate where $\\hbar\\omega \\gtrsim k_B T$. Replacing the coth by its classical asymptote underestimates the noise floor by exactly the zero-point contribution $\\hbar\\omega/2$. The result that survives at $T\\to 0$ is $S_{AA}(\\omega) = \\hbar\\,\\mathrm{sgn}(\\omega)\\,\\chi''_{AA}(\\omega)$; the zero-point spectrum is real physics, not a textbook decoration, and it sets the standard quantum limit of linear amplifiers and the back-action of continuous position measurement [24, 12].\n\n*Mode B — the symmetrization.* Even careful texts symmetrize, writing $\\bar S(\\omega) = \\tfrac{1}{2}(S(\\omega)+S(-\\omega)) = \\tfrac{\\hbar}{2}\\coth(\\hbar\\omega/2k_B T)\\chi''(\\omega)$. The symmetrization is *not* an identity but a choice; it discards the asymmetry $S(\\omega)/S(-\\omega) = e^{\\hbar\\omega/k_B T}$ that distinguishes emission from absorption sidebands and that a cold quantum detector resolves. Quantum-limited measurement is precisely the regime in which symmetrization erases the signal of interest.\n\n### Sin 2 — applying the classical form across $\\hbar\\omega \\sim k_B T$\n\nNyquist's $S_V = 4k_B T R$ [7, 8] requires $\\hbar\\omega \\ll k_B T$. At room temperature this fails at $\\omega/2\\pi \\gtrsim 6\\,\\mathrm{THz}$; at a 10 mK dilution-fridge stage it fails for $\\omega/2\\pi \\gtrsim 200\\,\\mathrm{MHz}$ — squarely inside the band of microwave qubit electronics. Substituting the classical formula there underestimates the noise by the zero-point term and overestimates the *symmetric* part by a coth factor that is no longer linearizable. The mistake is widespread enough that quantum-electronics texts often quote the Caves bound on amplifier noise without re-deriving the FDT it relies on — a pedagogical layer that hides which hypothesis is in force.\n\n### Sin 3 — conflating the Kubo formula with the FDT\n\nThe Kubo formula\n$$\\chi_{AB}(\\omega) = \\frac{i}{\\hbar}\\int_0^\\infty dt\\,e^{i\\omega t}\\langle [A(t),B(0)]\\rangle_0$$\nis a linear-response identity. It holds whenever the expansion in $f$ is justified — including expansions about *non-equilibrium* steady states, about projected reduced dynamics, and about Floquet states of periodically driven systems. Kubo survives the loss of canonical equilibrium; the FDT does not. Conflating them licenses the casual gesture \"by the FDT\" to mean \"by linear response,\" after which any obstruction to the FDT gets blamed on linear-response theory rather than on the violated hypothesis. Recent work has had to re-prove that linear-response expansions around non-equilibrium *stationary* states yield modified FDRs whose extra terms encode entropy production [25, 26, 27], with additive corrections of frenetic / activity type [28, 29]. None of this is a failure of Kubo; it is the price of equilibrium having left the room.\n\n### Sin 4 — the Einstein relation as the theorem\n\nThe Einstein–Sutherland relation $\\mu = D/k_B T$ [2, 1] is the FDT at one point: zero frequency, mechanical response of position to a constant force, overdamped limit of the Langevin equation [4]. It is the easiest case in which the theorem produces a number, and is for that reason often quoted as if it *were* the theorem. Three regimes break this conflation.\n\n*Frequency-dependent mobility.* The full statement is $D(\\omega) = k_B T\\,\\mathrm{Re}\\,\\mu(\\omega)$, and $D(\\omega)\\neq D(0)$ for any non-Markovian bath; the GLE construction of Mori [5] reproduces both ends [10, 15].\n\n*Memory.* When $K(t)$ in the generalized Langevin equation carries a non-integrable tail, the zero-frequency mobility diverges or vanishes — the Einstein relation reads $0 = 0/k_B T$ or $\\infty = \\infty/k_B T$ and conveys nothing. Anomalous-diffusion systems [22, 23] live here and exhibit ergodicity-breaking that the standard derivation forbids.\n\n*Microcanonical and finite-bath cases.* In closed systems with finite heat capacity the FDT acquires explicit $1/N$ corrections; the microcanonical version [30] is not obtained by replacing $T$ in the canonical formula with the microcanonical temperature. Calling the Einstein relation \"the FDT\" obscures that the linkage between $\\mu$ and $D$ is itself a derivative quantity that need not exist.\n\n### Two further hypothesis-failures worth naming\n\n*Absorbing states and metastability.* When the unperturbed dynamics is not truly ergodic over the relevant timescale — metastable basins, absorbing boundaries, broken symmetry sectors — the trace defining $\\chi$ and the trace defining $C$ are taken over different effective ensembles. Specialized FDRs exist for these cases [31, 32], but the textbook identity is not one of them.\n\n*Driving and non-conservative forces.* For non-gradient drives, the standard FDT does not apply because the perturbation is not derived from a Hamiltonian term $-Bf(t)$; the appropriate generalization invokes a stochastic-thermodynamics framework with an explicit entropy-production current [25, 28, 27].\n\nThe pattern is consistent. Each \"violation\" of the FDT in the modern literature corresponds, on inspection, to a hypothesis silently struck from the list at the top of this section. The theorem itself has not weakened in seventy-five years; what has weakened is the discipline of stating the conditions under which it is being invoked."}, {"id": "use-and-abuse", "title": "Use and Abuse: Effective Temperatures, Active Matter, and the Frenetic Correction", "markdown": "## Use and Abuse: Effective Temperatures, Active Matter, and the Frenetic Correction\n\nThe fluctuation–dissipation theorem is a relation between two measurable objects — a response function $\\chi''(\\omega)$ and a correlation function $C(\\omega)$ — at one parameter, the bath temperature $T$. The two functions can always be measured separately. The theorem says that, in canonical equilibrium,\n\n$$C_{AA}(\\omega) \\;=\\; \\frac{2 k_B T}{\\omega}\\,\\chi''_{AA}(\\omega)$$\n\nfor every observable $A$. Outside equilibrium, $\\chi''$ and $C$ continue to exist. What ceases to exist is the *single number* $T$ that converts one into the other. The temptation — and the abuse — is to write the relation anyway, with $T$ promoted to a frequency- and observable-dependent fit parameter $T_{\\text{eff}}(\\omega; A)$, and then to interpret the fit as physics.\n\n### Two phenomena, one label\n\n\"FDT violation\" is a single phrase covering two structurally different situations.\n\n*Genuine breakdown.* The microscopic state is not Gibbsian. Detailed balance fails. The Kubo identity that derives $\\chi''$ from $\\langle [A(t), A(0)] \\rangle/(2\\hbar)$ still holds — linear response is not equilibrium physics — but the canonical-ensemble step that converts the commutator into $\\coth(\\hbar\\omega/2k_B T)\\,\\chi''$ is no longer available [9, 19]. There is no $T$ that links $C$ to $\\chi''$ because there is no temperature in the problem.\n\n*Hidden slow variables.* The system *is* in some stationary state, but the dynamics carry a current; the response splits into a piece that is FDT-like and a piece that is not. This is the situation in which a \"frenetic\" correction restores an honest identity. The two cases are routinely conflated under the same banner.\n\n### The legitimate $T_{\\text{eff}}$: aging glasses\n\nThe one regime in which an effective temperature behaves like a temperature is the one Cugliandolo and Kurchan opened in 1993 [20]. In the $p$-spin spherical model — the mean-field caricature of a structural glass — the off-equilibrium dynamics after a deep quench obeys, at long times, a two-time relation\n\n$$\\chi(t,t_w) \\;=\\; \\frac{1}{k_B T_{\\text{eff}}}\\bigl[\\,C(t,t)-C(t,t_w)\\bigr]$$\n\nwhere $t_w$ is the waiting time. Plotting $\\chi$ against $1-C/C(t,t)$ produces a two-slope curve: the fast portion has slope $1/(k_B T)$ — the bath temperature, where FDT survives — while the slow, aging portion has a different, shallower slope $1/(k_B T_{\\text{eff}})$, with $T_{\\text{eff}} \u003e T$. The slow modes act as a second thermal reservoir at a higher temperature, and the construction has a real thermodynamic interpretation in the limit of widely separated timescales: a thermometer coupled to the slow modes equilibrates at $T_{\\text{eff}}$; the configurational entropy and the inherent-structure landscape are linked by it; and — the non-trivial part — $T_{\\text{eff}}$ is *the same* across observables that probe the slow sector. The observable-independence check is what promotes $T_{\\text{eff}}$ from a fit to a temperature. Parisi's Nobel lecture treats this as one of the durable structural facts the spin-glass program produced [33].\n\nThe check has been verified analytically in mean-field models and in finite-dimensional simulations to a controlled approximation [(Crisanti–Ritort review)](https://arxiv.org/abs/cond-mat/0212490). It is not a general guarantee. It works because the long-time spin-glass dynamics asymptotically approaches a state in which the slow manifold has its own quasi-Gibbs measure parametrized by $T_{\\text{eff}}$.\n\n### The folklore $T_{\\text{eff}}$: driven and active matter\n\nOnce the literature began applying the same parametric plot to sheared liquids, granular flows, and self-propelled particles, the observable-independence check quietly fell away. Reviews of active matter [34] and of driven soft matter [27] catalogue many systems in which one fits\n\n$$T_{\\text{eff}}(\\omega) \\;\\equiv\\; \\frac{\\omega\\, C(\\omega)}{2 k_B\\, \\chi''(\\omega)}$$\n\nfor a single observable — typically a tracer position — and reports the answer as *the* effective temperature of the bath. Loi, Mossa, and Cugliandolo, working on self-propelled polymers, found that the relation can be made to look thermodynamic for some observables; the same construction applied to translational versus orientational degrees of freedom returns different numbers [(Loi–Mossa–Cugliandolo)](https://arxiv.org/abs/1012.2745). Across the active-matter literature, $T_{\\text{eff}}$ extracted from tracer drag, density fluctuations, and rotational diffusion routinely disagree, and the disagreement grows with the Péclet-like activity parameter [(Cugliandolo review of $T_{\\text{eff}}$)](https://arxiv.org/abs/1104.4901). The honest statement is that linear response and correlation each remain well-defined; the *quotient* is a phenomenological frequency-dependent number whose interpretation as a temperature requires evidence the authors usually do not provide.\n\nThis is the abuse the dossier flagged. It is not that $T_{\\text{eff}}$ is meaningless — in the Cugliandolo–Kurchan regime it has thermodynamic content — but that the label is applied in regimes where the prerequisite check has not been done and typically fails.\n\n### The frenetic correction: an honest replacement\n\nBaiesi, Maes, and Wynants (2009) provided the structural replacement [(BMW, PRL 103, 010602)](https://arxiv.org/abs/0902.3955). For any first-order Markov dynamics with a stationary measure, the response of an observable $A$ to a perturbation $h_s$ conjugate to $V$ decomposes as\n\n$$R_{AV}(t,s) \\;=\\; \\frac{1}{2 k_B}\\,\\partial_s \\langle A(t)\\,V(s)\\rangle \\;-\\; \\frac{1}{2 k_B}\\,\\langle A(t)\\,K(s)\\rangle.$$\n\nThe first term is the entropic part: it is half of the time-derivative of the equilibrium-style correlation, and in equilibrium it *is* the FDT. The second term involves the *dynamical activity* (or \"traffic\", or \"frenesy\") $K$ — the time-symmetric counterpart of entropy production, counting how busy the trajectory is, not how dissipative. In a detailed-balance state the frenetic correlator vanishes and one recovers the FDT identically. Out of equilibrium it is nonzero and computable; later work [(Baiesi–Maes review)](https://arxiv.org/abs/1205.4655) showed that *every* nonequilibrium linear-response formula of Agarwal, Cugliandolo–Kurchan, Lippiello–Corberi–Zannetti, and Speck–Seifert is a special projection of this single decomposition.\n\nThree consequences follow.\n\n(i) \"FDT violation\" is now diagnosable: measure $K$ and the correction is no longer a fit parameter but a quantity in its own right, related to the activity-perturbation overlap. Asheichyk and Krüger showed that even nonconservative perturbations — for which there is no Hamiltonian $V$ — fit into the same decomposition [28]. Speck demonstrated the entropy-production reading explicitly for driven colloids [27], and Seifert's stochastic-thermodynamics review embeds the relation in the broader fluctuation-theorem hierarchy [25].\n\n(ii) The frenetic term explains why $T_{\\text{eff}}$ extracted from different observables disagrees in active systems: the activity correlator $\\langle A K\\rangle$ depends on $A$, and forcing the relation into the FDT mold lumps that observable-dependence into the fitted $T_{\\text{eff}}$. The \"temperature\" is not a property of the bath; it is a residual from the missing frenetic piece, redistributed onto the bath label.\n\n(iii) The Cugliandolo–Kurchan $T_{\\text{eff}}$ in aging glasses is recovered in BMW as the *limit in which the frenetic term aligns with the entropic term over the slow sector*, so the decomposition collapses to a single-temperature form. This is why observable-independence holds there and not elsewhere: it is a structural property of the slow manifold, not a generic feature of nonequilibrium states.\n\nThe discipline this enforces is straightforward. If one writes $C = (2 k_B T_{\\text{eff}}/\\omega)\\chi''$ for a driven system, one must either demonstrate that $T_{\\text{eff}}$ is observable-independent on the relevant window — the Cugliandolo–Kurchan check — or report the frenetic correlator that the parametrization is silently swallowing. Anything else is bookkeeping presented as thermometry, and the FDT is being invoked in a regime where its hypotheses [9, 19, 15] are absent."}, {"id": "quantum-signatures", "title": "Quantum Signatures: Asymmetric Spectra, Zero-Point Noise, and the Standard Quantum Limit", "markdown": "## Quantum Signatures: Asymmetric Spectra, Zero-Point Noise, and the Standard Quantum Limit\n\nThe classical fluctuation–dissipation identity is even in frequency: $S^{\\text{cl}}_{AA}(\\omega) = (2k_BT/\\omega)\\,\\chi''_{AA}(\\omega)$, with $S(\\omega)=S(-\\omega)$. The quantum identity is not. Callen and Welton's 1951 derivation [11], rewritten in the symmetrized convention favored by the noise literature, gives\n\n$$S_{AA}(\\omega) \\;=\\; \\hbar\\,\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_BT}\\right)\\chi''_{AA}(\\omega),$$\n\nbut the *unsymmetrized* spectrum — the one that an actual detector reports — splits into emission and absorption sidebands,\n\n$$S_{AA}(\\omega) \\;=\\; \\frac{2\\hbar}{1-e^{-\\hbar\\omega/k_BT}}\\,\\chi''_{AA}(\\omega), \\qquad \\frac{S_{AA}(\\omega)}{S_{AA}(-\\omega)} \\;=\\; e^{\\hbar\\omega/k_BT}.$$\n\nThis last ratio is the detailed-balance signature. It says that at finite $T$ the bath emits and absorbs quanta of energy $\\hbar\\omega$ with weights set by the Boltzmann factor; at $T\\to 0$ the absorption sideband vanishes while the emission sideband saturates at $S_{AA}(\\omega\u003e0) = 2\\hbar\\,\\chi''_{AA}(\\omega)$ — the zero-point floor. The asymmetry is not a correction to a classical baseline; it *is* the structure that classical statistics throws away.\n\n### The detector convention and what \"noise at frequency $\\omega$\" means\n\nA two-level system tuned to splitting $\\hbar\\omega_0\u003e0$ with coupling $-\\hat A\\hat\\sigma_x$ has its up/down transition rates set by $S_{AA}(-\\omega_0)$ and $S_{AA}(+\\omega_0)$ respectively — Fermi's golden rule applied to the bath operator $\\hat A$. The detailed-balance ratio above is therefore directly measurable: drive a qubit at $\\omega_0$, read off $\\Gamma_\\uparrow/\\Gamma_\\downarrow = e^{-\\hbar\\omega_0/k_BT}$. This is the operational content of the quantum FDT and the reason careful work in mesoscopic noise (Lesovik–Loosen; Aguado–Kouwenhoven; Schoelkopf and collaborators) distinguishes $S(+\\omega)$ from $S(-\\omega)$ rather than collapsing them into the symmetrized object. Classical noise theory cannot tell these apart because positive- and negative-frequency components of a real classical signal are complex conjugates of one another; quantum-mechanically $\\hat A(t)$ and $\\hat A(0)$ do not commute and the time-ordered correlator is genuinely complex.\n\n### Caldeira–Leggett and the Feynman–Vernon route\n\nThe microscopic justification for treating dissipation as a heat bath with prescribed FDT spectrum comes from the influence-functional construction of Feynman and Vernon [12]: couple a system bilinearly to an infinite set of harmonic oscillators with spectral density $J(\\omega)$, integrate the bath out exactly, and the reduced dynamics inherits a noise kernel whose Fourier transform is\n\n$$K_{\\text{noise}}(\\omega) \\;=\\; \\hbar\\,J(\\omega)\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_BT}\\right),$$\n\nand a friction kernel given by $J(\\omega)$ itself — Mori's \"second\" FDT [5] re-derived from the Hamiltonian. The Caldeira–Leggett choice $J(\\omega)=\\eta\\omega$ (ohmic) reproduces Markovian friction in the classical limit and a quantum noise spectrum saturating at $\\hbar\\eta\\omega$ as $T\\to 0$. Every modern treatment of macroscopic quantum tunneling with dissipation, every derivation of cavity-input/output noise, and every textbook quantum Langevin equation rides on this construction; the FDT enters as a consistency condition the bath spectral function must satisfy, not as a separate postulate. The reduction is reviewed thoroughly in Weiss's monograph and in the review by Hänggi, Talkner, and Borkovec [35].\n\n### The standard quantum limit as an FDT bound\n\nThe standard quantum limit for continuous linear position measurement is, in its cleanest formulation, an FDT statement about the *measurement apparatus*. A linear amplifier with input port $\\hat A$ and output port $\\hat B$ has back-action noise $S_{AA}$, imprecision noise $S_{BB}$, and a cross-spectrum $S_{AB}$ obeying\n\n$$S_{AA}(\\omega)\\,S_{BB}(\\omega) - |S_{AB}(\\omega)|^2 \\;\\geq\\; \\hbar^2|\\chi_{BA}(\\omega) - \\chi_{AB}^*(\\omega)|^2/4,$$\n\nthe Heisenberg–Robertson inequality applied to the symmetrized spectra. When the amplifier is in thermal equilibrium with its bath, $S_{AA}$ and $S_{BB}$ saturate at the quantum FDT floor and the inequality tightens to the SQL on position monitoring of a mechanical oscillator, $S_{xx}^{\\text{add,SQL}}(\\omega)=\\hbar|\\chi_{xx}(\\omega)|$. Cavity optomechanics — reviewed comprehensively in [24] — is the experimental theatre where this bound is reached and, by judicious engineering of $S_{AB}$ (back-action evasion, squeezed light), beaten in one quadrature at the cost of the other. The SQL is not a fundamental impossibility theorem; it is the FDT applied to an amplifier no smarter than its own thermal bath. The Caves–Clerk–Devoret–Girvin–Marquardt–Schoelkopf review of quantum noise gives the canonical pedagogical account.\n\n### Sideband cooling: pumping the asymmetry to do work\n\nIf a mechanical oscillator of frequency $\\Omega_m$ is coupled parametrically to an optical mode such that the cavity bath presents an *asymmetric* noise spectrum $S_{FF}(\\omega)$ at $\\omega=\\pm\\Omega_m$, the mechanical mode equilibrates not to the ambient temperature but to an effective temperature set by\n\n$$\\bar n_{\\text{eff}} \\;=\\; \\frac{S_{FF}(-\\Omega_m)}{S_{FF}(+\\Omega_m)-S_{FF}(-\\Omega_m)},$$\n\n— exactly the detailed-balance form, but with the bath asymmetry now engineered rather than thermal. Red-detuning the drive ($\\Delta=-\\Omega_m$) makes $S_{FF}(+\\Omega_m)\\gg S_{FF}(-\\Omega_m)$, and $\\bar n_{\\text{eff}}$ can be pushed below unity. Ground-state cooling experiments [24] demonstrate that the quantum FDT's asymmetry is not philosophy: it is the resource being spent. The classical FDT predicts symmetric sidebands and forbids net cooling below the bath; the quantum FDT predicts a structural asymmetry that, once the bath is non-thermal, becomes a controllable refrigeration mechanism.\n\n### Why $\\hbar\\to 0$ is singular\n\nA naive reading of $\\coth(\\hbar\\omega/2k_BT)\\to 2k_BT/\\hbar\\omega$ as $\\hbar\\to 0$ recovers the classical FDT and seems to render the quantum result a small correction at low frequency or high temperature. Two things hide in this limit. First, the *asymmetry* $S(\\omega)/S(-\\omega)-1 = e^{\\hbar\\omega/k_BT}-1 \\to \\hbar\\omega/k_BT$ is linear in $\\hbar$ but finite; for a microwave-frequency mode at $\\Omega_m/2\\pi=5\\,\\text{GHz}$ and $T=20\\,\\text{mK}$ the ratio $\\hbar\\Omega_m/k_BT\\approx 12$ and the absorption sideband is suppressed by $e^{-12}$. Detection-side asymmetry of order unity is the regime of interest for circuit-QED amplifiers, and it is wholly invisible in any $\\hbar\\to 0$ expansion. Second, the zero-point term $\\hbar|\\omega|\\chi''(\\omega)$ persists in the symmetrized spectrum even as $T\\to\\infty$ if one then sends $\\omega\\to\\infty$ with $\\hbar\\omega/k_BT$ fixed — the limit is non-uniform. Cold sensors operate where the classical expansion has no leading term; the FDT must be used with the quantum kernel from the start. This is the regime in which Kubo's [19] careful distinction between the symmetrized and unsymmetrized correlators stops being a textbook nicety and becomes the difference between a working amplifier and a useless one.\n\n### Where the quantum FDT itself can be tested\n\nThe Aguado–Kouwenhoven proposal of using a tunnel junction as an on-chip spectrum analyzer (verify) and its experimental realization in superconducting qubits (Astafiev et al., Schoelkopf group) provide direct measurements of $S(+\\omega)$ versus $S(-\\omega)$ across resistive elements. The asymmetry ratio agrees with $e^{\\hbar\\omega/k_BT}$ to within experimental uncertainty across decades of $\\hbar\\omega/k_BT$ — a quantitative confirmation that Johnson noise [7] continues to obey the Callen–Welton form [11] all the way to its quantum-asymmetric extreme. The FDT survives the journey from a 1928 hot-resistor measurement to a 20-mK qubit because the underlying identity is structural: it is what canonical equilibrium *means* at the level of two-time correlation functions, and the asymmetry is the trace that $[\\hat A(t),\\hat A(0)]\\neq 0$ leaves on every spectrum a real instrument can record."}, {"id": "frontier-and-open-problems", "title": "Frontier: Nonequilibrium FDRs, Stochastic Thermodynamics, and the Limits of 'Equilibrium' as a Constraint", "markdown": "## Frontier: Nonequilibrium FDRs, Stochastic Thermodynamics, and the Limits of 'Equilibrium' as a Constraint\n\nThe FDT was built on a hypothesis — canonical equilibrium — that twenty-first-century statistical mechanics treats as a corner case. Three programs have rebuilt the relation around objects that survive when that hypothesis is dropped: the Harada–Sasa equality, which converts the FDT *violation* into a thermodynamic observable; the stochastic-thermodynamics framework, which gives trajectory-level meaning to heat and entropy production; and the quantum open-systems machinery, which extends FDRs to Lindbladian steady states. In each case the equilibrium identity becomes a *limit* — the detailed-balance fixed point — of a wider relation that is operationally testable.\n\n### The Harada–Sasa equality: dissipation as the integrated FDT violation\n\nFor an overdamped Langevin particle driven into a nonequilibrium steady state (NESS) by a nonconservative force,\n$$\\gamma \\dot{x} = -\\partial_x U(x) + f_{\\mathrm{nc}}(x) + \\xi(t), \\qquad \\langle \\xi(t)\\xi(0)\\rangle = 2\\gamma k_B T \\,\\delta(t),$$\nHarada and Sasa (2005) proved that the mean rate of heat dissipated into the bath equals\n$$\\langle J_{\\mathrm{diss}}\\rangle \\;=\\; \\gamma\\!\\left[\\bar{v}^{\\,2} + \\int_{-\\infty}^{\\infty}\\!\\frac{d\\omega}{2\\pi}\\,\\Big(\\tilde{C}(\\omega) - \\tfrac{2k_B T}{\\omega}\\,\\tilde{R}''(\\omega)\\Big)\\right],$$\nwhere $\\tilde{C}(\\omega)$ is the velocity power spectrum, $\\tilde{R}''(\\omega)$ the imaginary part of the velocity response, and $\\bar v$ the mean drift ([Harada \u0026 Sasa, PRL 95, 130602, 2005](https://link.aps.org/doi/10.1103/PhysRevLett.95.130602)). The bracketed integrand is precisely the *FDT violation* spectrum. By measuring response and correlation separately — neither requiring access to the driving force — one reads off dissipation. The relation has since been generalised to underdamped and field-variable descriptions, to coloured noise, and tested experimentally on driven beads and rotary motors (verify).\n\nThe conceptual move is to demote the FDT from identity to *probe*. Where Kubo's 1966 review [19] treated $C(\\omega) = (2k_BT/\\omega)\\chi''(\\omega)$ as a sharp consequence of canonical equilibrium, Harada–Sasa treats its breakdown as a measurable, integrable quantity equal — modulo the kinetic term — to the entropy production rate $\\sigma = \\langle J_{\\mathrm{diss}}\\rangle/T$. Equilibrium is recovered as the zero of an observable, not assumed at the start.\n\n### Stochastic thermodynamics: the FDT as a corollary of detailed balance\n\nSeifert's framework [25] assigns to every trajectory $\\{x(t)\\}_0^\\tau$ a heat $q[x]$, a work $w[x]$, and a total entropy production $\\Delta s_{\\mathrm{tot}}[x]$ obeying the integral fluctuation theorem $\\langle e^{-\\Delta s_{\\mathrm{tot}}}\\rangle = 1$ and the Crooks relation $P(+\\Delta s)/P(-\\Delta s) = e^{\\Delta s}$ [26]. The equilibrium FDT is the Jensen-bound saturation $\\Delta s_{\\mathrm{tot}} = 0$; out of equilibrium it generalises to the Baiesi–Maes–Wynants identity ([PRL 103, 010602, 2009](https://userswww.pd.infn.it/~baiesi/papers/FDR_II_arxiv.pdf)),\n$$R_{AB}(t,s) \\;=\\; \\tfrac{1}{2}\\beta\\,\\partial_s \\langle A(t) B(s)\\rangle \\;-\\; \\tfrac{1}{2}\\beta\\,\\langle A(t)\\,\\mathcal{K}[B](s)\\rangle,$$\nwhere $\\mathcal{K}[B]$ is the *frenesy* — a time-symmetric component of the trajectory action built from dynamical activity (\"traffic\" between configurations). The frenetic term is the precise NESS analogue of the equilibrium correlation derivative and is the resolution to point (5) of the §5 conflation table: an \"FDT violation\" in a NESS does not signal failure of linear response, only that the response has acquired a time-symmetric partner that vanishes in equilibrium by parity.\n\nTwo adjacent developments tighten this picture. First, the *thermodynamic uncertainty relation* (Barato–Seifert 2015; Gingrich–Horowitz–Perunov–England 2016) bounds the precision of any current by the entropy production, $\\mathrm{Var}(J)/\\langle J\\rangle^2 \\ge 2k_B/\\Sigma$; this is a nonlinear cousin of the FDT, with equality reached only in the linear-response regime where Harada–Sasa is tight. Second, *information-thermodynamic* extensions (Sagawa–Ueda) incorporate measurement and feedback, with response functions that include mutual-information contributions absent from any equilibrium FDR. The unifying message is that the FDT was the equilibrium projection of a richer trajectory-level structure that stochastic thermodynamics has made explicit.\n\n### Quantum trajectories and Lindbladian steady states\n\nThe Callen–Welton spectrum $S(\\omega) = \\hbar\\coth(\\hbar\\omega/2k_BT)\\chi''(\\omega)$ [11] assumes a Gibbs state $\\rho \\propto e^{-\\beta H}$. For an open quantum system relaxing under a Lindblad generator $\\mathcal{L}$ to a steady state $\\rho_{\\mathrm{ss}}$, this assumption fails unless $\\mathcal{L}$ satisfies quantum detailed balance with respect to $\\rho_{\\mathrm{ss}}$ — the Kossakowski–Frigerio–Verri–Gorini condition. When it does, $\\beta H$ in the equilibrium FDT is replaced by $-\\log\\rho_{\\mathrm{ss}}$ and an Agarwal-type identity (verify) holds; otherwise the symmetric two-time function $\\langle\\{A(t),A(0)\\}\\rangle$ and the antisymmetric $\\langle[A(t),A(0)]\\rangle$ are independent objects with no fixed ratio.\n\nThree open fronts:\n\n1. **Photon counting and homodyne FDRs.** Stochastic master equations admit a \"quantum Harada–Sasa\": the rate of entropy flowing to the photon environment equals an integrated violation of the bath-mediated FDT [28, 36, 37]. This makes the noise floor of any optomechanical or circuit-QED experiment operated below the bath temperature — the regime exploited throughout [24] — an active test of the quantum FDR rather than a verification of equilibrium.\n2. **MBL, prethermal and Floquet steady states.** In many-body-localised regimes (cf. [38]) the steady state of a driven slice is athermal on accessible timescales; numerically observed FDT-like relations are governed by effective temperatures that depend on the observable, violating the operational equilibrium criterion. A microscopic frenetic decomposition has not yet been formulated here.\n3. **Driven-dissipative quantum matter** (driven cavities, exciton-polariton condensates, dissipative spin chains). The Keldysh effective action carries an explicit FDR as a relation between retarded, advanced and Keldysh self-energies, $\\Sigma^K = (\\Sigma^R - \\Sigma^A)\\coth(\\hbar\\omega/2k_BT)$; the breakdown of this constraint along the Keldysh contour is the field-theoretic signature of genuine nonequilibrium criticality.\n\n### Glassy and active systems: where the program is still incomplete\n\nThe Cugliandolo–Kurchan effective temperature [20], extended by Parisi and collaborators (Nobel lecture, 2021 [33]), remains the cleanest setting in which a deformed FDT survives off equilibrium: in the aging regime of mean-field glasses, $T_{\\mathrm{eff}}(C)$ is well-defined and observable-independent within a correlation sector, and admits a thermodynamic reading as the slow-mode temperature. Whether this picture survives in finite-dimensional structural glasses is open; colloidal-glass experiments give mixed signatures and the relevant timescale separation is not cleanly present.\n\nIn active matter [34] the situation is more compromised. Self-propelled colloids break time-reversal symmetry at the single-particle level, and the \"violation\" of the FDT is not parametrised by a single $T_{\\mathrm{eff}}$ but by an activity-dependent kernel [27]. The Baiesi–Maes–Wynants frenetic term is the mathematically clean correction, but extracting it experimentally requires resolving time-symmetric currents — dynamical activities, not fluxes — that most setups do not access. Recent work extending the FDT to nonconservative force protocols [28] partially closes this gap by separating the conservative and circulating components of the response.\n\n### What the FDT is still load-bearing for — and what it is not\n\nThree undiminished roles. *First*, in equilibrium the FDT remains the only general identity tying response to fluctuation — the foundation of every linear-response calculation in condensed-matter theory: Kubo conductivities, optical susceptibilities, quantum-limited noise floors. *Second*, in any NESS the *deviation* from the FDT is the entropy-production probe — Harada–Sasa turns the violated identity into a thermometer for irreversibility. *Third*, the asymmetric Callen–Welton spectrum defines the standard quantum limit and the sideband-cooling asymmetry exploited by every optomechanical and circuit-QED experiment that has touched the quantum ground state.\n\nWhat has been outgrown is the textbook assertion that the FDT *requires* equilibrium. The honest modern statement, traceable through Onsager [13, 14] → Callen–Welton [11] → Kubo–Mori [9, 5] → Seifert [25] → Harada–Sasa, is narrower and more useful: the FDT is the equilibrium fixed point of a trajectory-level identity between time-symmetric and time-antisymmetric observables, and its violation is itself a thermodynamic quantity. Equilibrium is no longer the hypothesis under which the relation is *true*; it is the hypothesis under which the correction term vanishes."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have been circling this theorem for the length of a dossier; here is where I plant my flag.\n\n### (a) What I will defend with my reputation\n\nThe first-kind FDT, in its quantum form\n\n$$S_{AA}(\\omega) \\;=\\; \\frac{2\\hbar}{1 - e^{-\\hbar\\omega/k_B T}}\\,\\chi''_{AA}(\\omega),$$\n\nis, within its hypotheses (canonical equilibrium of the unperturbed system, linear coupling, finite susceptibility), as secure as any non-trivial identity in physics. It is not a model, not a phenomenology, and not an approximation: it is an algebraic consequence of the KMS condition $\\langle A(t)B\\rangle = \\langle B A(t+i\\hbar\\beta)\\rangle$ and the spectral representation of $\\chi$. Every honest experimental test in the last seventy years — Johnson–Nyquist on resistors, Koch–Van Harlingen–Clarke on Josephson shot-and-zero-point spectra, optomechanical sideband asymmetry on near-ground-state mechanical modes — has confirmed it to the precision of the calibration. I would also defend the Einstein relation $\\mu = D/k_BT$ as the same statement at $\\omega=0$, and the Callen–Welton derivation as the cleanest existing one — cleaner than Kubo's, which buys generality at the price of obscuring why the canonical ensemble is doing all the work.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely sanded off in modern usage:\n\n1. **Linearity in the probe.** The Kubo formula is a first-order expansion. Anywhere the susceptibility itself depends on drive amplitude — driven Josephson arrays, optomechanics past the bistability, NV centers under strong microwave — papers quote \"FDT-derived\" noise floors that have no derivation. The second-order response theory exists (Bernard–Gaspard, Andrieux–Gaspard) and is almost never used.\n2. **Existence of a temperature.** Half the \"effective temperature\" literature in active matter and aging glasses uses $T_{\\text{eff}}(\\omega) = \\omega C(\\omega)/2\\chi''(\\omega)$ as a *definition* and then reports it as a *measurement*. The non-trivial claim — that this ratio is observable-independent over a finite window — is rarely checked. Cugliandolo–Kurchan in mean-field spin glasses is the exception; everything else is, charitably, a fit.\n3. **The Markovian Langevin form.** $\\langle\\xi(t)\\xi(0)\\rangle = 2\\gamma k_B T\\,\\delta(t)$ is a degenerate limit of the Mori memory kernel $K(t)$ and is invoked in regimes (sub-picosecond solvation dynamics, low-temperature electron baths, structured photonic reservoirs) where the kernel manifestly has structure on the timescale of interest. The white-noise FDT is then used to back out a $\\gamma$ that absorbs the lie.\n\nA fourth, quieter problem: the textbook proof assumes the susceptibility $\\chi(\\omega)$ is integrable enough for Kramers–Kronig to apply. In gapped systems and in any setup with a finite high-frequency cutoff that isn't physical, the dispersion integrals are subtraction-dependent and people pick the subtraction that gives the answer they want.\n\n### (c) Three open questions, ranked\n\n1. **A constructive, *predictive* non-equilibrium FDR with a measurable frenetic term.** Baiesi–Maes–Wynants gave the structure; we still cannot, given a NESS, compute $\\langle A\\cdot\\text{activity}\\rangle$ from first principles for any non-trivial driven system. This is the right problem.\n2. **Quantum FDT for non-Gaussian, non-Hermitian (Lindblad) steady states.** The KMS condition fails; what replaces it, and does the asymmetry $S(\\omega)/S(-\\omega) = e^{\\hbar\\omega/k_BT}$ survive in any modified form? Relevant immediately for engineered reservoirs and dissipative state preparation.\n3. **Operational tests of $T_{\\text{eff}}$ observable-independence in active matter.** Not another fit — a designed experiment that tries to *falsify* observable-independence across at least three independent probes in the same sample.\n\n### Reading path\n\n1. Einstein 1905 — the original argument; read it to see that the FDT is older than the word \"fluctuation.\"\n2. Nyquist 1928 — two pages, transmission-line derivation; the cleanest physical intuition ever written for the theorem.\n3. Callen \u0026 Welton 1951 — the quantum statement; second-order perturbation theory done with unusual honesty about its hypotheses.\n4. Kubo 1957 (*J. Phys. Soc. Jpn.*) — linear response as a framework; read it to understand what Kubo did and did not add.\n5. Cugliandolo \u0026 Kurchan on aging FDT, plus Baiesi–Maes–Wynants on the frenetic correction — the only serious attempts to extend the theorem past its hypotheses without lying about it."}], "references": [{"n": 1, "title": "A Dynamical Theory of Diffusion for Non-Electrolytes and the Molecular Mass of Albumin", "authors": ["William Sutherland"], "year": 1905, "venue": "Philosophical Magazine, Series 6, vol. 9, 781–785", "url": "https://doi.org/10.1080/14786440509463331", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen", "authors": ["Albert Einstein"], "year": 1905, "venue": "Annalen der Physik 17, 549–560", "url": "https://doi.org/10.1002/andp.19053220806", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Zur kinetischen Theorie der Brownschen Molekularbewegung und der Suspensionen", "authors": ["Marian von Smoluchowski"], "year": 1906, "venue": "Annalen der Physik 21, 756–780", "url": "https://doi.org/10.1002/andp.19063261405", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Sur la théorie du mouvement brownien", "authors": ["Pau <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
