"Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins: Sutherland, Einstein, Smoluchowski, Langevin, Johnson — and the Names That Got Sanded Off Origins: Sutherland, Einstein, Smoluchowski, Langevin, Johnson — and the Names That Got Sanded Off The fluctuation–dissipation theorem did not arrive as a theorem. It accreted, between 1905 and 1928, from four problems that nobody at the time recognized as the same problem: the diffusion of albumin in water, the Brownian dance of pollen grains, the dynamics of a particle suffering random kicks, and the hiss across the terminals of a wire-wound resistor. Each problem had its first observer, its first explainer, and — almost always — a second author who got erased. Sutherland and Einstein: a relation with one name on it The identity that opens the entire subject, is universally taught as the Einstein relation. The historical record is unambiguous: William Sutherland, working in Melbourne, derived it independently and published it first . His paper \"A Dynamical Theory of Diffusion for Non-Electrolytes and the Molecular Mass of Albumin\" appeared in the March 1905 issue of the Philosophical Magazine , having been read to the Australasian Association for the Advancement of Science in January 1904 and submitted in November 1904. Einstein's paper in Annalen der Physik was received by the journal on 11 May 1905 and printed in July. Sutherland's derivation runs through osmotic pressure balanced against Stokes drag for a non-electrolyte; Einstein's, through a parallel argument tying the diffusion flux to a thermodynamic gradient — the two routes are essentially identical at the level of the final equation. Naming inertia did the rest. Australian and biophysical literature kept \"Sutherland–Einstein\"; the German-language tradition that fed into Smoluchowski 1906, Langevin 1908, Perrin's Les Atomes , and ultimately into the Statistical Mechanics canon, dropped Sutherland. By the time Kubo and Welton are writing in the 1950s, he is gone from the citation graph. The honest attribution is Sutherland–Einstein ; the textbook attribution is wrong. What matters physically: this relation is the FDT in its lowest, mechanical incarnation. The mobility \\mu = 1/(6\\pi\\eta a) is a dissipative coefficient — it parametrizes irreversible energy loss to the fluid. The diffusion constant D is a fluctuation coefficient — it parametrizes the mean-square spread of a tagged particle. The relation \\mu = D / k B T says these are not independent: fix the temperature and one determines the other. Every later FDT statement, classical or quantum, is an extension of this single identity to a wider class of observables. Smoluchowski: the collision picture that the literature actually uses In 1906, Marian Smoluchowski published in Annalen der Physik a probabilistic theory of Brownian motion built from the statistics of molecular collisions . Where Einstein worked from osmotic-pressure thermodynamics, Smoluchowski worked from a random-walk argument that gave, in modern language, the central-limit-theorem behaviour of the displacement directly. He recovered the same \\langle x^2 \\rangle = 2Dt scaling, and he did so by a route that more closely resembles what graduate students later see — the Chapman–Kolmogorov equation, the diffusion equation as a coarse-graining of a Markov process, and (in his 1916 sequel) the structure that Fokker and Planck would inherit. The \"Einstein–Smoluchowski\" pairing has survived better than \"Sutherland–Einstein\" — partly because Einstein himself cited Smoluchowski explicitly in 1908 — but the asymmetry of credit is still striking. Smoluchowski's collision picture is the one the Langevin and Fokker–Planck literatures use. Einstein's thermodynamic picture is the one the textbooks reproduce. Langevin: the equation that is, structurally, the FDT Three years later Langevin compressed the entire Brownian problem into a single stochastic ODE : This is already a fluctuation–dissipation theorem. The friction coefficient \\gamma — a dissipative parameter — fixes the noise variance through k B T. Equilibrium is imposed by the requirement \\langle \\tfrac12 m v^2 \\rangle = \\tfrac12 k B T at late times, and that requirement is what locks the noise amplitude to the friction. This is the prototype of what Kubo would later call the \"second\" FDT. Mori's 1965 projection-operator construction generalizes exactly this statement to non-Markovian memory kernels K(t-s); the modern form \\langle \\xi(t) \\xi(0) \\rangle = k B T \\, K(t) is a direct lineal descendant of Langevin 1908, not of any 1950s result. Langevin's own framing was almost casual — a two-page note in Comptes Rendus — and he did not advertise the noise–friction identity as a separate principle. That advertisement waits another half-century. Schottky's shot noise: the spectral-density habit Before Johnson and Nyquist, there was Schottky . In 1918 he analysed current fluctuations in vacuum tubes and showed that the discrete arrival of electrons at the anode produces a current noise of spectral density S I = 2eI. This is not a thermal-equilibrium statement — it is a counting-statistics statement — and it should not be conflated with Johnson noise, which it routinely is. What Schottky bequeathed to the Bell Labs community of the 1920s was something subtler and more important than a specific formula: the habit of describing electrical noise by a frequency-resolved spectral density rather than an integrated RMS. Without that conceptual move Nyquist's derivation does not have a language to land in. Johnson's measurement and Nyquist's page In 1928 John B. Johnson at Bell Labs reported a careful set of measurements showing that any resistor, regardless of material, geometry, or current history, exhibits a voltage noise across its terminals with a flat spectral density proportional to its resistance and to the absolute temperature . The universality is the point. A carbon resistor, an electrolytic cell, and a wire-wound metal all sat on the same curve once one normalized by R and T. This is an empirical fact about equilibrium , not about any specific microscopic mechanism, and that universality is the reason an FDT exists at all. Harry Nyquist, also at Bell Labs, was handed the data and produced — within months — a one-page thermodynamic derivation : His argument is the cleanest pre-quantum FDT in the literature: imagine the resistor terminated by a lossless transmission line of length L, count standing-wave modes in [\\omega, \\omega+d\\omega], give each k B T by equipartition, demand that in equilibrium the resistor radiates as much power into the line as the line delivers to it, and solve for the source spectral density. There is no microscopic model anywhere in the derivation — the noise is fixed by equilibrium plus the dissipative parameter R. The standard shorthand \"Nyquist's theorem\" reliably erases Johnson. Nyquist himself does not — his paper opens by saying it exists to explain Johnson's measurements. Bell Labs internal practice referred to \"Johnson noise\" for the phenomenon and \"Nyquist's formula\" for the theory, and that is the historically accurate split. What was on the table by 1928 By the late 1920s, four pieces were sitting in plain view, each tied to a different community: the Sutherland–Einstein relation in colloid science, Smoluchowski's collision picture in probability theory, Langevin's stochastic equation in mechanics, and the Johnson–Nyquist law in electrical engineering. Each is a fluctuation–dissipation statement. None of the authors used that phrase, and none of them recognized that the four were instances of one identity. The recognition that they were — and the quantum generalization that subsumes all of them — was Callen and Welton's job in 1951, and it is the subject of the next section. Welton, like Sutherland and like Johnson, is mostly absent from the way the result is now cited. The Theorem Itself: Three Statements, One Identity The Theorem Itself: Three Statements, One Identity The fluctuation–dissipation theorem is taught as if it were a single equation. It is not. Three distinct identities circulate under the name, and each rests on a different combination of hypotheses. Section 1 traced their separate genealogies; here we derive them in one pass, watch them collapse to a single line of algebra, and mark the bookkeeping where they cease to be equivalent. Setting Let H 0 be a Hamiltonian with canonical density matrix \\rho 0 = Z^{-1} e^{-\\beta H 0}, \\beta = 1/k B T. Couple an external field f(t) to a Hermitian operator B, and ask for the linear response of an observable A. Standard interaction-picture algebra [9, 10] gives with angled brackets denoting the unperturbed canonical average and A H(t) = e^{iH 0 t/\\hbar} A\\, e^{-iH 0 t/\\hbar}. Taking the one-sided Fourier transform, This is the Kubo formula . It is the answer to a question that does not yet involve fluctuations: how does \\langle A\\rangle shift under the perturbation -fB? Nothing here demands canonical equilibrium; the same expression survives in any stationary state, with the appropriate replacement for \\langle\\cdot\\rangle 0. From Kubo to Callen–Welton: the role of KMS Now use the explicit form of \\rho 0. Cyclic invariance of the trace and analytic continuation give the Kubo–Martin–Schwinger condition, equivalent, after Fourier transform, to the detailed-balance relation for spectra, Split the commutator's spectrum into emission and absorption pieces and apply this identity. After a few lines, which is most often written in the symmetrized form This is the Callen–Welton theorem , the equation that christened the field. In the high-temperature limit \\hbar\\omega \\ll k B T, \\coth(\\beta\\hbar\\omega/2) \\to 2/(\\beta\\hbar\\omega) and one recovers the classical Nyquist–Einstein shape The asymmetry between S(\\omega) and S(-\\omega) — emission stronger than absorption by the Boltzmann factor e^{\\beta\\hbar\\omega} — is not a perturbative quantum correction. It is the entire signature of facing a thermal bath rather than a vacuum, and section 7 returns to it when sideband cooling and the standard quantum limit enter. The second kind: noise locks the memory kernel The third statement lives at the level of stochastic dynamics. Following Mori , project the Heisenberg evolution of a vector observable \\mathbf v onto itself and orthogonally; the result is the generalized Langevin equation with K(t) the projected memory kernel and \\boldsymbol\\xi(t) the orthogonal residue. Because the projector is built from the canonical inner product (A,B) = \\beta^{-1}\\langle A^\\dagger B\\rangle 0, the noise covariance is fixed: This is the second-kind FDT . Its Markovian shadow is Langevin's 1908 identity \\langle\\xi(t)\\xi(0)\\rangle = 2\\gamma k B T\\,\\delta(t) ; the operator-valued extension on a bilinearly coupled bath is the Feynman–Vernon influence functional , whose symmetric noise kernel reproduces the same \\coth(\\beta\\hbar\\omega/2) encountered above. Onsager's regression hypothesis is the entire content The three identities look distinct only because they speak different formal dialects. In a single line: Onsager's claim [13, 14]: the average decay of a spontaneous fluctuation is governed by the same linear law as the macroscopic relaxation. Prepare the system with a small static bias f adiabatically switched off at t=0. The classical canonical ensemble gives \\langle A(0)\\rangle {\\rm bias} = \\beta\\, C {AA}(0)\\, f and, by Onsager, \\langle A(t)\\rangle {\\rm bias} = \\beta\\,C {AA}(t)\\, f for t 0. Reading off the response, That is the classical first-kind FDT. The quantum upgrade replaces \\beta C by the Kubo canonical correlator \\int 0^\\beta d\\lambda\\,\\langle A(-i\\hbar\\lambda)A(t)\\rangle and C(\\omega) by the symmetrized spectrum — algebra, not new physics. The second-kind statement is the same identity differentiated once: if \\mathbf v regresses according to K, the residual noise must carry exactly the variance k B T K(t) needed to keep equipartition self-consistent under the dynamics it generates. Figure: The three identities sold under the name \"FDT\" radiate from a single hypothesis — a canonical density matrix subjected to a linear external perturbation. The Einstein relation is the zero-frequency, classical-limit shadow that section 1 traced to 1905; the equivalence among the upper three is essentially Onsager's regression hypothesis written in three notations. Where the three statements stop being one Each derivation invoked the same two assumptions and no others. Strip either and the identities diverge. - Drop \"canonical \\rho 0\" (a driven steady state, an aged glass, an active fluid). The Kubo formula still holds for \\chi {AB}, because it asks only about deterministic response to an external field. The KMS relation fails: S(\\omega) \\ne e^{\\beta\\hbar\\omega} S(-\\omega), so Callen–Welton evaporates. The Mori construction also survives — it is purely algebraic — but the noise covariance is no longer k B T times the kernel; an additional correlator carrying the non-equilibrium currents must be tracked. Sections 6 and 8 audit those corrections, including the Baiesi–Maes–Wynants \"frenetic\" term that restores an identity by explicitly measuring an activity correlator. - Drop \"linear\" (large drives, nonlinear susceptibilities \\chi^{(n)}). One then needs higher-order Kubo formulas with multi-time commutators, and the simple \\chi'' \\leftrightarrow S pairing fragments into a tower of identities between n-point response and (n{+}1)-point correlation . The architectural point is clean: there is one theorem, written three ways. Kubo gave the framework, Callen and Welton the most general spectral form, Mori the stochastic-equation form, and Onsager — over twenty years before any of them — the structural identity that makes all three say the same thing. From Nyquist's Transmission Line to Kubo's Commutator: How the Formulation Evolved From Nyquist's Transmission Line to Kubo's Commutator: How the Formulation Evolved The FDT was not derived once. It was rederived six times between 1928 and 1965, each time on a wider hypothesis-base, each time absorbing its predecessor as a special case. The structural ascent is worth tracing carefully because most modern \"derivations\" — the half-page ones that appear as appendix B of papers on stochastic thermodynamics or quantum noise — silently borrow from the strongest link in the chain (Kubo) while invoking the weakest (Nyquist) for intuition. The audit below names what each step actually contributed. Nyquist 1928: equipartition over modes Nyquist's derivation of S V(\\omega) = 4 k B T R is a thermodynamic argument, not a microscopic one . Connect two resistors R at temperature T through a lossless transmission line of length L and characteristic impedance R. In equilibrium the line is filled with standing-wave modes; equipartition gives k B T per mode; matched termination means each mode carries equal forward and backward power. Setting forward = backward in the line and demanding zero net heat flow between the resistors fixes the noise spectrum each resistor must emit. The whole calculation fits on one page and uses no detail of the resistor — only that it is in equilibrium and dissipates real power. What this preserves: the identity \"dissipation at T implies a definite noise spectrum\" . What it cannot reach: any frequency where \\hbar \\omega \\gtrsim k B T (equipartition fails), any nonlinear element, and any observable other than voltage on a two-terminal black box. Nyquist himself noted the Planck correction in a footnote and replaced k B T by \\hbar\\omega / (e^{\\hbar\\omega/k BT} - 1) — but this is still a mode-counting argument, not a statement about operators. Modern textbooks that present \"FDT for resistors\" as a transmission-line argument and then quote the quantum spectrum with the zero-point \\hbar\\omega/2 term are committing a category error: the zero-point piece is not in the Nyquist argument and cannot be put there. It comes from Callen–Welton. Onsager 1931: regression and reciprocity Onsager did not state the FDT. He stated the structural lemma that makes it inevitable [13, 14]. The reciprocal relations L {ij} = L {ji} are derived from microscopic time-reversal invariance applied to the decay of spontaneous fluctuations . The hinge is the regression hypothesis: the average decay of a fluctuation \\langle \\delta A(t) \\delta A(0)\\rangle / \\langle \\delta A^2\\rangle obeys the same macroscopic equation that governs the relaxation of an externally prepared deviation. Casimir 1945 extended this to magnetic fields, fixing L {ij}(B) = L {ji}(-B) . What this preserves and supplies: a microscopic justification for treating the correlation function C {AA}(t) and the relaxation function as the same object. Nyquist's equipartition becomes a corollary: C(t) at t=0 is set by equipartition, C(t) for t 0 obeys the macroscopic relaxation law, and the spectrum is their Fourier transform. What it leaves open: how to compute \\chi''(\\omega) from first principles, and what replaces equipartition in the quantum regime. Onsager's regression is classical; it is silent on commutators. Callen and Welton 1951: the quantum theorem and the name Callen and Welton wrote down the full statement : The derivation is second-order time-dependent perturbation theory on a generic Hamiltonian system weakly coupled to a perturbation -A F(t), plus the canonical density matrix. Two pieces of physics enter that Nyquist could not see. First, \\chi'' {AA} is computed as a difference of transition rates: \\langle m A n\\rangle ^2 [\\rho n - \\rho m] \\delta(\\hbar\\omega - E m + E n). Second, S {AA} is computed as a sum of the same matrix elements weighted by \\rho n + \\rho m. The ratio (\\rho n + \\rho m)/(\\rho n - \\rho m) = \\coth(\\hbar\\omega/2k BT) produces the theorem in one line. What this preserves: every classical case. The high-T limit reduces \\coth to 2k B T/\\hbar\\omega, recovering Nyquist and the Einstein relation. What is genuinely new: the asymmetric quantum spectrum (the emission-vs-absorption distinction tracked in §2) and the zero-point term \\hbar \\omega /2 \\cdot 2\\chi'' that survives T \\to 0. The Callen–Welton derivation is microscopic, model-independent, and quantum from the start. It is also the first paper to use the phrase \"fluctuation–dissipation theorem\". What it does not give: a route to compute \\chi'' for an interacting many-body system, and no recipe for transport coefficients (currents do not couple linearly to scalar fields in the Callen–Welton setup). Green 1952–54: time-correlation functions for transport Green did not work on the FDT; he worked on transport coefficients [17, 18]. The output is the expression now folkloric as \"Green–Kubo\": Green derived this through a Markov-process treatment of phase-space densities and a careful t \\to \\infty limit. It is the structural twin of the FDT — a transport coefficient (real-frequency dissipation at \\omega \\to 0) written as the integral of an equilibrium correlation function — but the derivation does not pass through linear response. Modern citations almost uniformly attribute the formula to Kubo 1957. The 1952 priority is unambiguous on the page. Kubo 1957: linear response absorbs everything Kubo's contribution is structural [9, 19]. Perturb a canonical density matrix \\rho 0 = e^{-\\beta H 0}/Z by H 1(t) = -B F(t) and compute \\langle A(t)\\rangle to first order in F. The result is the Kubo formula valid for any observables A, B. From this single object three previously separate results fall out as corollaries: (i) the Callen–Welton FDT, by relating the commutator to the anticommutator through the canonical \\rho 0; (ii) Green's transport formulas, by taking A = B = J and \\omega \\to 0; (iii) Onsager reciprocity, by exchanging A \\leftrightarrow B and using time-reversal on H 0. What this preserves: every earlier statement, as a special case. What it newly enables: systematic computation in interacting systems via diagrammatic perturbation theory on the commutator, and a clean separation between linear response (a statement about \\rho 0, true in or out of equilibrium for arbitrary \\rho 0) and the FDT (a statement that holds only when \\rho 0 is canonical). The conflation flagged in §2 — \"FDT = Kubo formula\" — is dissolved precisely here: Kubo gives the formula; equilibrium gives the theorem. Mori 1965: projection operators and the non-Markovian second FDT Mori treated the question Kubo did not: what equation does a chosen slow variable A actually obey ? Projecting Liouville dynamics onto the subspace spanned by A yields the generalized Langevin equation with frequency \\Omega, memory kernel K(t), and orthogonal noise \\xi(t). The second-kind FDT in its non-Markovian form, is a theorem of the projection: noise and dissipation share a single function because both come from the same projected dynamics. Langevin 1908 is the Markov special case K(t) = 2\\gamma \\delta(t). What this preserves: Kubo's first-kind FDT (it emerges by Fourier-transforming the GLE in the linear regime). What is genuinely new: a microscopic construction of \\gamma and \\xi from the underlying Hamiltonian, rather than a phenomenological postulate. Zwanzig's reformulation of the same construction is what most modern papers cite; the form of the FDT they call \"Kubo\" is in fact Mori's. The chain, audited Each link absorbs its predecessor and adds one ingredient that the predecessor cannot supply: Nyquist supplies mode equipartition; Onsager supplies the regression hypothesis; Callen–Welton supplies the quantum spectrum and the name; Green supplies the correlation-function form of transport; Kubo supplies the linear-response framework that unifies them; Mori supplies the projected microscopic derivation of the Langevin form. A \"derivation\" that starts from Nyquist's transmission line and ends at the quantum coth-spectrum is not a derivation — it is a sleight of hand. The honest short proof is Callen–Welton's; the honest general proof is Kubo's; the honest Langevin-form proof is Mori's. Citations that compress all three into \"Kubo's theorem\" erase precisely the structural ascent that makes the theorem more than a coincidence. Landmark Measurements: Brownian Trajectories, Resistor Hum, Quantum Zero-Point Noise Landmark Measurements: Brownian Trajectories, Resistor Hum, Quantum Zero-Point Noise A theorem that ties dissipation to fluctuation lives or dies on whether the two can be measured against the same yardstick. Four experimental episodes, spaced a century apart, have done that test in regimes the theorem must cover if it is to deserve the name. Each constrains a different slice of the identity. Together they bracket the FDT from the classical limit through the quantum vacuum and into the disordered regimes where the equality breaks. Perrin's colloids: the first calibration of D=\\mu k B T The Einstein–Sutherland prediction was a closed identity between three measurable quantities — diffusion constant D, mobility \\mu=1/(6\\pi\\eta a), and temperature T — with k B (equivalently N A=R/k B) as the only unknown. Jean Perrin and his students at the Sorbonne (1908–1913) turned that identity into a number. The dossier work proceeded along two complementary tracks: (i) sedimentation equilibrium , where the height distribution of gamboge and mastic spheres in a vertical column was photographed and fit to a barometric law n(z)\\propto e^{-mgz/k B T}; (ii) direct Brownian trajectory recording , where the projected displacements \\Delta x of individual spheres were timed under the microscope and the Einstein relation \\langle\\Delta x^2\\rangle=2Dt inverted for D. Holding \\eta and a (the latter measured by Stokes' settling rate and by direct counting) fixed, Perrin found N A \\simeq 6.5–7.2\\times 10^{23} across particle masses varied by a factor of \\sim 1.5\\times 10^4 — the systematic agreement is the experimental content, not any single number (Perrin's Brownian Motion Experiments — Oxford; Perrin, J. Phys. Théor. Appl. 1910). What Perrin's data actually constrain is the zero-frequency, classical limit of the FDT specialized to a mechanical observable: the Einstein relation \\mu=D/k B T. The result rules out any kinetic theory in which D and \\mu are independent material parameters; it does not test the spectral form of the noise — the colloidal trajectory is sampled at intervals long compared to the velocity-correlation time m/\\gamma\\sim 10^{-7}\\,s, so what survives is the integrated (DC) statement. Johnson 1928: the universal hum Twenty years later, J. B. Johnson built a calibrated thermionic-amplifier chain at Bell Labs and measured the open-circuit voltage spectrum across resistors fabricated from copper sulfate solutions, vacuum carbon, electrolyte, metallic films, and several alloys, spanning R from 10^3 to 10^6\\,\\Omega and T from \\sim 78\\,K (liquid air) to \\sim 360\\,K . The astonishing result was that, after correcting for amplifier gain and bandwidth, the noise power per unit bandwidth collapsed to a single line: S V=4 k B T R, with the slope yielding k B to a few percent — independent of material, geometry, electrode shape, or the chemical nature of the conduction. Within hours of seeing the data Nyquist supplied the thermodynamic derivation on a transmission line . The experimental content is the universality : a noise spectrum that depends only on the macroscopic linear-response coefficient R(\\omega) and on T, exactly as a fluctuation–dissipation identity demands. Johnson's measurements occupied the regime \\hbar\\omega\\ll k B T (\\omega/2\\pi \\lesssim 50\\,kHz at room temperature, six orders below the crossover) — they test the classical FDT and say nothing about \\hbar\\omega/2. Figure: The quantum FDT noise spectrum (blue, symmetrized) flattens to the Nyquist plateau for \\hbar\\omega\\ll k BT and grows linearly with \\omega — the zero-point branch — for \\hbar\\omega\\gg k BT. The asymmetric (red, dashed) emission side is exponentially suppressed at T\\to 0. Perrin and Johnson sit in the plateau; Koch–Van Harlingen–Clarke straddle the crossover at \\sim 0.4 K and 500 GHz; optomechanical and circuit-QED experiments resolve the emission/absorption asymmetry directly. The zero-point branch: Josephson junctions, optomechanics, circuit QED The high-frequency content of the Callen–Welton spectrum , S V(\\omega)=2\\hbar\\omega\\,\\mathrm{Re}\\,Z(\\omega)\\,[\\tfrac{1}{2}+1/(e^{\\hbar\\omega/k BT}-1)], has a piece that does not vanish at T=0 — the \\hbar\\omega/2 zero-point noise. Koch, Van Harlingen, and Clarke (PRL 47, 1216 (1981)) demonstrated this directly. They biased a resistively shunted Nb–NbO x–Pb Josephson tunnel junction so that the AC Josephson effect (\\omega J=2eV/\\hbar, tunable up to \\sim 500\\,GHz) acted as a heterodyne mixer between the shunt resistor's noise at \\omega J and the measurement band at low frequency. They cooled the junction to T=1.6 K and T=4.2 K and measured the down-mixed noise as a function of \\omega J. The data tracked the full \\hbar\\omega\\coth(\\hbar\\omega/2k BT) form, with the deviation from the classical 4k BT R plateau matching the zero-point contribution at the percent level — and crucially showed that the limit \\omega\\to\\infty at fixed T does not flatten the spectrum. This is the FDT identified as a quantum statement, not merely k\\to\\hbar/(\\beta\\hbar) bookkeeping. The optomechanical generation of this test reads off the asymmetry between Stokes (\\omega L-\\Omega m) and anti-Stokes (\\omega L+\\Omega m) scattering rates: the ratio is (n+1)/n, with n the mechanical occupation, because emission requires a phonon while absorption proceeds even from n=0. Safavi-Naeini, Chan, Hill, Alegre, Krause, and Painter (PRL 108, 033602 (2012)) measured this ratio on a sideband-cooled optomechanical crystal at \\Omega m/2\\pi=3.68\\,GHz and n=2.6\\pm0.2, recovering the predicted asymmetry within a few percent. The general framework — qubits and cavities as quantum spectrometers of S(\\omega) at \\omega 0 versus \\omega\u003c0 — was set out by Schoelkopf, Clerk, Girvin, Lehnert, and Devoret (arXiv:cond-mat/0210247). Circuit-QED implementations have since verified the asymmetric quantum spectrum across decades in \\hbar\\omega/k BT, with the same Feynman–Vernon influence-functional accounting supplying the theoretical template. Where the theorem breaks: aging spin glasses The cleanest measurement of a controlled FDT violation is Hérisson and Ocio (PRL 88, 257202 (2002)) on the insulating Heisenberg spin glass CdCr {1.7}In {0.3}S 4 below T g\\simeq 16.7 K. They simultaneously recorded the thermoremanent magnetization M(t,t w) (the integrated response \\chi) and the spontaneous magnetization fluctuations \\langle\\delta M(t)\\delta M(t w)\\rangle (the correlation C) with a SQUID over six decades of time. Plotting \\chi against C parametrically by time recovers the equilibrium line \\chi=(C(0)-C)/k BT at short separations and a second, shallower line at long separations — the slope of which defines T \\mathrm{eff} T in precisely the Cugliandolo–Kurchan sense . The experimental content is that T \\mathrm{eff} is observable-independent within their precision over the aging plateau, the property that justifies calling it a temperature at all. This is the strongest existing case that the FDR generalization survives experimental scrutiny somewhere; it is also the case the active-matter and biophysics literatures routinely invoke without performing the parametric test that gives it meaning. Validity Audit: Where the Theorem Holds, Where It Has Been Stripped of Its Hypotheses Validity Audit: Where the Theorem Holds, Where It Has Been Stripped of Its Hypotheses The fluctuation–dissipation theorem is unusual among results of statistical mechanics in that its hypotheses are short, its conclusion is sharp, and its abuses are industrial. The hypothesis set fits on one line — canonical equilibrium, linear response of a stationary observable, finite (integrable) susceptibility, and a meaningful single temperature — yet a remarkable fraction of the modern literature invokes the theorem after one or more of these has been quietly struck from the list. The hypothesis set, stated as the proof requires Take the unperturbed Hamiltonian H 0, density matrix \\rho 0 = e^{-\\beta H 0}/Z, observable A, and a perturbation H 1(t) = -B f(t). The Callen–Welton derivation and its modern restatements [9, 19, 10] each require all four of the following: (i) Canonical equilibrium of the unperturbed state. The trace \\langle\\,\\cdot\\,\\rangle 0 = \\mathrm{Tr}(\\rho 0\\,\\cdot\\,) is taken in the Gibbs ensemble at a single temperature T. The proof uses [\\rho 0,H 0]=0 and the KMS condition \\langle A(t)B(0)\\rangle 0 = \\langle B(0)A(t+i\\hbar\\beta)\\rangle 0 explicitly; remove either and the symmetric/antisymmetric decomposition that isolates \\chi'' falls apart. (ii) Linear regime. The response \\langle A(t)\\rangle - \\langle A\\rangle 0 = \\int dt'\\,\\chi {AB}(t-t')f(t') is the first term in a series in f. The FDT constrains \\chi {AB}, not \\chi^{(2)},\\chi^{(3)},\\ldots; higher Kubo kernels obey their own nonlinear FDRs which are not the theorem usually being invoked. (iii) Time-translation invariance / stationarity. Both \\chi {AB}(t,t') and C {AB}(t,t') must depend on t-t' alone, so Fourier transforms exist as ordinary functions and Kramers–Kronig is available. Aging systems with explicit two-time dependence violate this at the outset — they require a two-time formulation , not the textbook identity. (iv) Finite, integrable susceptibility. The relation is meaningful only where \\chi'' {AA}(\\omega) is well-defined and the time integral \\int dt\\,e^{i\\omega t}\\chi(t) converges. Long-tailed memory kernels — anomalous diffusion, 1/f tails, glassy correlators — violate this on finite frequency windows, with documented consequences for the Langevin form [22, 23]. To these four explicit hypotheses one must add a tacit fifth: the bath whose statistics enter \\chi'' must be the same bath whose noise enters S {AA}. Whenever an experimentalist measures response through one channel and noise through another, this is a non-trivial assumption rather than a definition. Sin 1 — the coth amputation The quantum FDT for a Hermitian observable reads The classical limit \\hbar\\omega \\ll k B T collapses \\hbar\\coth(\\hbar\\omega/2k B T)\\to 2k B T/\\omega, leaving a symmetric, real spectrum with no zero-point piece. Two failure modes are routine: Mode A — the low-temperature amputation. Cryogenic experiments on superconducting circuits, optomechanical cavities, and gravitational-wave interferometers operate where \\hbar\\omega \\gtrsim k B T. Replacing the coth by its classical asymptote underestimates the noise floor by exactly the zero-point contribution \\hbar\\omega/2. The result that survives at T\\to 0 is S {AA}(\\omega) = \\hbar\\,\\mathrm{sgn}(\\omega)\\,\\chi'' {AA}(\\omega); the zero-point spectrum is real physics, not a textbook decoration, and it sets the standard quantum limit of linear amplifiers and the back-action of continuous position measurement [24, 12]. Mode B — the symmetrization. Even careful texts symmetrize, writing \\bar S(\\omega) = \\tfrac{1}{2}(S(\\omega)+S(-\\omega)) = \\tfrac{\\hbar}{2}\\coth(\\hbar\\omega/2k B T)\\chi''(\\omega). The symmetrization is not an identity but a choice; it discards the asymmetry S(\\omega)/S(-\\omega) = e^{\\hbar\\omega/k B T} that distinguishes emission from absorption sidebands and that a cold quantum detector resolves. Quantum-limited measurement is precisely the regime in which symmetrization erases the signal of interest. Sin 2 — applying the classical form across \\hbar\\omega \\sim k B T Nyquist's S V = 4k B T R [7, 8] requires \\hbar\\omega \\ll k B T. At room temperature this fails at \\omega/2\\pi \\gtrsim 6\\,\\mathrm{THz}; at a 10 mK dilution-fridge stage it fails for \\omega/2\\pi \\gtrsim 200\\,\\mathrm{MHz} — squarely inside the band of microwave qubit electronics. Substituting the classical formula there underestimates the noise by the zero-point term and overestimates the symmetric part by a coth factor that is no longer linearizable. The mistake is widespread enough that quantum-electronics texts often quote the Caves bound on amplifier noise without re-deriving the FDT it relies on — a pedagogical layer that hides which hypothesis is in force. Sin 3 — conflating the Kubo formula with the FDT The Kubo formula is a linear-response identity. It holds whenever the expansion in f is justified — including expansions about non-equilibrium steady states, about projected reduced dynamics, and about Floquet states of periodically driven systems. Kubo survives the loss of canonical equilibrium; the FDT does not. Conflating them licenses the casual gesture \"by the FDT\" to mean \"by linear response,\" after which any obstruction to the FDT gets blamed on linear-response theory rather than on the violated hypothesis. Recent work has had to re-prove that linear-response expansions around non-equilibrium stationary states yield modified FDRs whose extra terms encode entropy production [25, 26, 27], with additive corrections of frenetic / activity type [28, 29]. None of this is a failure of Kubo; it is the price of equilibrium having left the room. Sin 4 — the Einstein relation as the theorem The Einstein–Sutherland relation \\mu = D/k B T [2, 1] is the FDT at one point: zero frequency, mechanical response of position to a constant force, overdamped limit of the Langevin equation . It is the easiest case in which the theorem produces a number, and is for that reason often quoted as if it were the theorem. Three regimes break this conflation. Frequency-dependent mobility. The full statement is D(\\omega) = k B T\\,\\mathrm{Re}\\,\\mu(\\omega), and D(\\omega)\\neq D(0) for any non-Markovian bath; the GLE construction of Mori reproduces both ends [10, 15]. Memory. When K(t) in the generalized Langevin equation carries a non-integrable tail, the zero-frequency mobility diverges or vanishes — the Einstein relation reads 0 = 0/k B T or \\infty = \\infty/k B T and conveys nothing. Anomalous-diffusion systems [22, 23] live here and exhibit ergodicity-breaking that the standard derivation forbids. Microcanonical and finite-bath cases. In closed systems with finite heat capacity the FDT acquires explicit 1/N corrections; the microcanonical version is not obtained by replacing T in the canonical formula with the microcanonical temperature. Calling the Einstein relation \"the FDT\" obscures that the linkage between \\mu and D is itself a derivative quantity that need not exist. Two further hypothesis-failures worth naming Absorbing states and metastability. When the unperturbed dynamics is not truly ergodic over the relevant timescale — metastable basins, absorbing boundaries, broken symmetry sectors — the trace defining \\chi and the trace defining C are taken over different effective ensembles. Specialized FDRs exist for these cases [31, 32], but the textbook identity is not one of them. Driving and non-conservative forces. For non-gradient drives, the standard FDT does not apply because the perturbation is not derived from a Hamiltonian term -Bf(t); the appropriate generalization invokes a stochastic-thermodynamics framework with an explicit entropy-production current [25, 28, 27]. The pattern is consistent. Each \"violation\" of the FDT in the modern literature corresponds, on inspection, to a hypothesis silently struck from the list at the top of this section. The theorem itself has not weakened in seventy-five years; what has weakened is the discipline of stating the conditions under which it is being invoked. Use and Abuse: Effective Temperatures, Active Matter, and the Frenetic Correction Use and Abuse: Effective Temperatures, Active Matter, and the Frenetic Correction The fluctuation–dissipation theorem is a relation between two measurable objects — a response function \\chi''(\\omega) and a correlation function C(\\omega) — at one parameter, the bath temperature T. The two functions can always be measured separately. The theorem says that, in canonical equilibrium, for every observable A. Outside equilibrium, \\chi'' and C continue to exist. What ceases to exist is the single number T that converts one into the other. The temptation — and the abuse — is to write the relation anyway, with T promoted to a frequency- and observable-dependent fit parameter T {\\text{eff}}(\\omega; A), and then to interpret the fit as physics. Two phenomena, one label \"FDT violation\" is a single phrase covering two structurally different situations. Genuine breakdown. The microscopic state is not Gibbsian. Detailed balance fails. The Kubo identity that derives \\chi'' from \\langle [A(t), A(0)] \\rangle/(2\\hbar) still holds — linear response is not equilibrium physics — but the canonical-ensemble step that converts the commutator into \\coth(\\hbar\\omega/2k B T)\\,\\chi'' is no longer available [9, 19]. There is no T that links C to \\chi'' because there is no temperature in the problem. Hidden slow variables. The system is in some stationary state, but the dynamics carry a current; the response splits into a piece that is FDT-like and a piece that is not. This is the situation in which a \"frenetic\" correction restores an honest identity. The two cases are routinely conflated under the same banner. The legitimate T {\\text{eff}}: aging glasses The one regime in which an effective temperature behaves like a temperature is the one Cugliandolo and Kurchan opened in 1993 . In the p-spin spherical model — the mean-field caricature of a structural glass — the off-equilibrium dynamics after a deep quench obeys, at long times, a two-time relation where t w is the waiting time. Plotting \\chi against 1-C/C(t,t) produces a two-slope curve: the fast portion has slope 1/(k B T) — the bath temperature, where FDT survives — while the slow, aging portion has a different, shallower slope 1/(k B T {\\text{eff}}), with T {\\text{eff}} T. The slow modes act as a second thermal reservoir at a higher temperature, and the construction has a real thermodynamic interpretation in the limit of widely separated timescales: a thermometer coupled to the slow modes equilibrates at T {\\text{eff}}; the configurational entropy and the inherent-structure landscape are linked by it; and — the non-trivial part — T {\\text{eff}} is the same across observables that probe the slow sector. The observable-independence check is what promotes T {\\text{eff}} from a fit to a temperature. Parisi's Nobel lecture treats this as one of the durable structural facts the spin-glass program produced . The check has been verified analytically in mean-field models and in finite-dimensional simulations to a controlled approximation (Crisanti–Ritort review). It is not a general guarantee. It works because the long-time spin-glass dynamics asymptotically approaches a state in which the slow manifold has its own quasi-Gibbs measure parametrized by T {\\text{eff}}. The folklore T {\\text{eff}}: driven and active matter Once the literature began applying the same parametric plot to sheared liquids, granular flows, and self-propelled particles, the observable-independence check quietly fell away. Reviews of active matter and of driven soft matter catalogue many systems in which one fits for a single observable — typically a tracer position — and reports the answer as the effective temperature of the bath. Loi, Mossa, and Cugliandolo, working on self-propelled polymers, found that the relation can be made to look thermodynamic for some observables; the same construction applied to translational versus orientational degrees of freedom returns different numbers (Loi–Mossa–Cugliandolo). Across the active-matter literature, T {\\text{eff}} extracted from tracer drag, density fluctuations, and rotational diffusion routinely disagree, and the disagreement grows with the Péclet-like activity parameter (Cugliandolo review of T {\\text{eff}}). The honest statement is that linear response and correlation each remain well-defined; the quotient is a phenomenological frequency-dependent number whose interpretation as a temperature requires evidence the authors usually do not provide. This is the abuse the dossier flagged. It is not that T {\\text{eff}} is meaningless — in the Cugliandolo–Kurchan regime it has thermodynamic content — but that the label is applied in regimes where the prerequisite check has not been done and typically fails. The frenetic correction: an honest replacement Baiesi, Maes, and Wynants (2009) provided the structural replacement (BMW, PRL 103, 010602). For any first-order Markov dynamics with a stationary measure, the response of an observable A to a perturbation h s conjugate to V decomposes as The first term is the entropic part: it is half of the time-derivative of the equilibrium-style correlation, and in equilibrium it is the FDT. The second term involves the dynamical activity (or \"traffic\", or \"frenesy\") K — the time-symmetric counterpart of entropy production, counting how busy the trajectory is, not how dissipative. In a detailed-balance state the frenetic correlator vanishes and one recovers the FDT identically. Out of equilibrium it is nonzero and computable; later work (Baiesi–Maes review) showed that every nonequilibrium linear-response formula of Agarwal, Cugliandolo–Kurchan, Lippiello–Corberi–Zannetti, and Speck–Seifert is a special projection of this single decomposition. Three consequences follow. (i) \"FDT violation\" is now diagnosable: measure K and the correction is no longer a fit parameter but a quantity in its own right, related to the activity-perturbation overlap. Asheichyk and Krüger showed that even nonconservative perturbations — for which there is no Hamiltonian V — fit into the same decomposition . Speck demonstrated the entropy-production reading explicitly for driven colloids , and Seifert's stochastic-thermodynamics review embeds the relation in the broader fluctuation-theorem hierarchy . (ii) The frenetic term explains why T {\\text{eff}} extracted from different observables disagrees in active systems: the activity correlator \\langle A K\\rangle depends on A, and forcing the relation into the FDT mold lumps that observable-dependence into the fitted T {\\text{eff}}. The \"temperature\" is not a property of the bath; it is a residual from the missing frenetic piece, redistributed onto the bath label. (iii) The Cugliandolo–Kurchan T {\\text{eff}} in aging glasses is recovered in BMW as the limit in which the frenetic term aligns with the entropic term over the slow sector , so the decomposition collapses to a single-temperature form. This is why observable-independence holds there and not elsewhere: it is a structural property of the slow manifold, not a generic feature of nonequilibrium states. The discipline this enforces is straightforward. If one writes C = (2 k B T {\\text{eff}}/\\omega)\\chi'' for a driven system, one must either demonstrate that T {\\text{eff}} is observable-independent on the relevant window — the Cugliandolo–Kurchan check — or report the frenetic correlator that the parametrization is silently swallowing. Anything else is bookkeeping presented as thermometry, and the FDT is being invoked in a regime where its hypotheses [9, 19, 15] are absent. Quantum Signatures: Asymmetric Spectra, Zero-Point Noise, and the Standard Quantum Limit Quantum Signatures: Asymmetric Spectra, Zero-Point Noise, and the Standard Quantum Limit The classical fluctuation–dissipation identity is even in frequency: S^{\\text{cl}} {AA}(\\omega) = (2k BT/\\omega)\\,\\chi'' {AA}(\\omega), with S(\\omega)=S(-\\omega). The quantum identity is not. Callen and Welton's 1951 derivation , rewritten in the symmetrized convention favored by the noise literature, gives but the unsymmetrized spectrum — the one that an actual detector reports — splits into emission and absorption sidebands, This last ratio is the detailed-balance signature. It says that at finite T the bath emits and absorbs quanta of energy \\hbar\\omega with weights set by the Boltzmann factor; at T\\to 0 the absorption sideband vanishes while the emission sideband saturates at S {AA}(\\omega 0) = 2\\hbar\\,\\chi'' {AA}(\\omega) — the zero-point floor. The asymmetry is not a correction to a classical baseline; it is the structure that classical statistics throws away. The detector convention and what \"noise at frequency \\omega\" means A two-level system tuned to splitting \\hbar\\omega 0 0 with coupling -\\hat A\\hat\\sigma x has its up/down transition rates set by S {AA}(-\\omega 0) and S {AA}(+\\omega 0) respectively — Fermi's golden rule applied to the bath operator \\hat A. The detailed-balance ratio above is therefore directly measurable: drive a qubit at \\omega 0, read off \\Gamma \\uparrow/\\Gamma \\downarrow = e^{-\\hbar\\omega 0/k BT}. This is the operational content of the quantum FDT and the reason careful work in mesoscopic noise (Lesovik–Loosen; Aguado–Kouwenhoven; Schoelkopf and collaborators) distinguishes S(+\\omega) from S(-\\omega) rather than collapsing them into the symmetrized object. Classical noise theory cannot tell these apart because positive- and negative-frequency components of a real classical signal are complex conjugates of one another; quantum-mechanically \\hat A(t) and \\hat A(0) do not commute and the time-ordered correlator is genuinely complex. Caldeira–Leggett and the Feynman–Vernon route The microscopic justification for treating dissipation as a heat bath with prescribed FDT spectrum comes from the influence-functional construction of Feynman and Vernon : couple a system bilinearly to an infinite set of harmonic oscillators with spectral density J(\\omega), integrate the bath out exactly, and the reduced dynamics inherits a noise kernel whose Fourier transform is and a friction kernel given by J(\\omega) itself — Mori's \"second\" FDT re-derived from the Hamiltonian. The Caldeira–Leggett choice J(\\omega)=\\eta\\omega (ohmic) reproduces Markovian friction in the classical limit and a quantum noise spectrum saturating at \\hbar\\eta\\omega as T\\to 0. Every modern treatment of macroscopic quantum tunneling with dissipation, every derivation of cavity-input/output noise, and every textbook quantum Langevin equation rides on this construction; the FDT enters as a consistency condition the bath spectral function must satisfy, not as a separate postulate. The reduction is reviewed thoroughly in Weiss's monograph and in the review by Hänggi, Talkner, and Borkovec . The standard quantum limit as an FDT bound The standard quantum limit for continuous linear position measurement is, in its cleanest formulation, an FDT statement about the measurement apparatus . A linear amplifier with input port \\hat A and output port \\hat B has back-action noise S {AA}, imprecision noise S {BB}, and a cross-spectrum S {AB} obeying the Heisenberg–Robertson inequality applied to the symmetrized spectra. When the amplifier is in thermal equilibrium with its bath, S {AA} and S {BB} saturate at the quantum FDT floor and the inequality tightens to the SQL on position monitoring of a mechanical oscillator, S {xx}^{\\text{add,SQL}}(\\omega)=\\hbar \\chi {xx}(\\omega) . Cavity optomechanics — reviewed comprehensively in — is the experimental theatre where this bound is reached and, by judicious engineering of S {AB} (back-action evasion, squeezed light), beaten in one quadrature at the cost of the other. The SQL is not a fundamental impossibility theorem; it is the FDT applied to an amplifier no smarter than its own thermal bath. The Caves–Clerk–Devoret–Girvin–Marquardt–Schoelkopf review of quantum noise gives the canonical pedagogical account. Sideband cooling: pumping the asymmetry to do work If a mechanical oscillator of frequency \\Omega m is coupled parametrically to an optical mode such that the cavity bath presents an asymmetric noise spectrum S {FF}(\\omega) at \\omega=\\pm\\Omega m, the mechanical mode equilibrates not to the ambient temperature but to an effective temperature set by — exactly the detailed-balance form, but with the bath asymmetry now engineered rather than thermal. Red-detuning the drive (\\Delta=-\\Omega m) makes S {FF}(+\\Omega m)\\gg S {FF}(-\\Omega m), and \\bar n {\\text{eff}} can be pushed below unity. Ground-state cooling experiments demonstrate that the quantum FDT's asymmetry is not philosophy: it is the resource being spent. The classical FDT predicts symmetric sidebands and forbids net cooling below the bath; the quantum FDT predicts a structural asymmetry that, once the bath is non-thermal, becomes a controllable refrigeration mechanism. Why \\hbar\\to 0 is singular A naive reading of \\coth(\\hbar\\omega/2k BT)\\to 2k BT/\\hbar\\omega as \\hbar\\to 0 recovers the classical FDT and seems to render the quantum result a small correction at low frequency or high temperature. Two things hide in this limit. First, the asymmetry S(\\omega)/S(-\\omega)-1 = e^{\\hbar\\omega/k BT}-1 \\to \\hbar\\omega/k BT is linear in \\hbar but finite; for a microwave-frequency mode at \\Omega m/2\\pi=5\\,\\text{GHz} and T=20\\,\\text{mK} the ratio \\hbar\\Omega m/k BT\\approx 12 and the absorption sideband is suppressed by e^{-12}. Detection-side asymmetry of order unity is the regime of interest for circuit-QED amplifiers, and it is wholly invisible in any \\hbar\\to 0 expansion. Second, the zero-point term \\hbar \\omega \\chi''(\\omega) persists in the symmetrized spectrum even as T\\to\\infty if one then sends \\omega\\to\\infty with \\hbar\\omega/k BT fixed — the limit is non-uniform. Cold sensors operate where the classical expansion has no leading term; the FDT must be used with the quantum kernel from the start. This is the regime in which Kubo's careful distinction between the symmetrized and unsymmetrized correlators stops being a textbook nicety and becomes the difference between a working amplifier and a useless one. Where the quantum FDT itself can be tested The Aguado–Kouwenhoven proposal of using a tunnel junction as an on-chip spectrum analyzer (verify) and its experimental realization in superconducting qubits (Astafiev et al., Schoelkopf group) provide direct measurements of S(+\\omega) versus S(-\\omega) across resistive elements. The asymmetry ratio agrees with e^{\\hbar\\omega/k BT} to within experimental uncertainty across decades of \\hbar\\omega/k BT — a quantitative confirmation that Johnson noise continues to obey the Callen–Welton form all the way to its quantum-asymmetric extreme. The FDT survives the journey from a 1928 hot-resistor measurement to a 20-mK qubit because the underlying identity is structural: it is what canonical equilibrium means at the level of two-time correlation functions, and the asymmetry is the trace that [\\hat A(t),\\hat A(0)]\\neq 0 leaves on every spectrum a real instrument can record. Frontier: Nonequilibrium FDRs, Stochastic Thermodynamics, and the Limits of 'Equilibrium' as a Constraint Frontier: Nonequilibrium FDRs, Stochastic Thermodynamics, and the Limits of 'Equilibrium' as a Constraint The FDT was built on a hypothesis — canonical equilibrium — that twenty-first-century statistical mechanics treats as a corner case. Three programs have rebuilt the relation around objects that survive when that hypothesis is dropped: the Harada–Sasa equality, which converts the FDT violation into a thermodynamic observable; the stochastic-thermodynamics framework, which gives trajectory-level meaning to heat and entropy production; and the quantum open-systems machinery, which extends FDRs to Lindbladian steady states. In each case the equilibrium identity becomes a limit — the detailed-balance fixed point — of a wider relation that is operationally testable. The Harada–Sasa equality: dissipation as the integrated FDT violation For an overdamped Langevin particle driven into a nonequilibrium steady state (NESS) by a nonconservative force, Harada and Sasa (2005) proved that the mean rate of heat dissipated into the bath equals where \\tilde{C}(\\omega) is the velocity power spectrum, \\tilde{R}''(\\omega) the imaginary part of the velocity response, and \\bar v the mean drift (Harada \u0026 Sasa, PRL 95, 130602, 2005). The bracketed integrand is precisely the FDT violation spectrum. By measuring response and correlation separately — neither requiring access to the driving force — one reads off dissipation. The relation has since been generalised to underdamped and field-variable descriptions, to coloured noise, and tested experimentally on driven beads and rotary motors (verify). The conceptual move is to demote the FDT from identity to probe . Where Kubo's 1966 review treated C(\\omega) = (2k BT/\\omega)\\chi''(\\omega) as a sharp consequence of canonical equilibrium, Harada–Sasa treats its breakdown as a measurable, integrable quantity equal — modulo the kinetic term — to the entropy production rate \\sigma = \\langle J {\\mathrm{diss}}\\rangle/T. Equilibrium is recovered as the zero of an observable, not assumed at the start. Stochastic thermodynamics: the FDT as a corollary of detailed balance Seifert's framework assigns to every trajectory \\{x(t)\\} 0^\\tau a heat q[x], a work w[x], and a total entropy production \\Delta s {\\mathrm{tot}}[x] obeying the integral fluctuation theorem \\langle e^{-\\Delta s {\\mathrm{tot}}}\\rangle = 1 and the Crooks relation P(+\\Delta s)/P(-\\Delta s) = e^{\\Delta s} . The equilibrium FDT is the Jensen-bound saturation \\Delta s {\\mathrm{tot}} = 0; out of equilibrium it generalises to the Baiesi–Maes–Wynants identity (PRL 103, 010602, 2009), where \\mathcal{K}[B] is the frenesy — a time-symmetric component of the trajectory action built from dynamical activity (\"traffic\" between configurations). The frenetic term is the precise NESS analogue of the equilibrium correlation derivative and is the resolution to point (5) of the §5 conflation table: an \"FDT violation\" in a NESS does not signal failure of linear response, only that the response has acquired a time-symmetric partner that vanishes in equilibrium by parity. Two adjacent developments tighten this picture. First, the thermodynamic uncertainty relation (Barato–Seifert 2015; Gingrich–Horowitz–Perunov–England 2016) bounds the precision of any current by the entropy production, \\mathrm{Var}(J)/\\langle J\\rangle^2 \\ge 2k B/\\Sigma; this is a nonlinear cousin of the FDT, with equality reached only in the linear-response regime where Harada–Sasa is tight. Second, information-thermodynamic extensions (Sagawa–Ueda) incorporate measurement and feedback, with response functions that include mutual-information contributions absent from any equilibrium FDR. The unifying message is that the FDT was the equilibrium projection of a richer trajectory-level structure that stochastic thermodynamics has made explicit. Quantum trajectories and Lindbladian steady states The Callen–Welton spectrum S(\\omega) = \\hbar\\coth(\\hbar\\omega/2k BT)\\chi''(\\omega) assumes a Gibbs state \\rho \\propto e^{-\\beta H}. For an open quantum system relaxing under a Lindblad generator \\mathcal{L} to a steady state \\rho {\\mathrm{ss}}, this assumption fails unless \\mathcal{L} satisfies quantum detailed balance with respect to \\rho {\\mathrm{ss}} — the Kossakowski–Frigerio–Verri–Gorini condition. When it does, \\beta H in the equilibrium FDT is replaced by -\\log\\rho {\\mathrm{ss}} and an Agarwal-type identity (verify) holds; otherwise the symmetric two-time function \\langle\\{A(t),A(0)\\}\\rangle and the antisymmetric \\langle[A(t),A(0)]\\rangle are independent objects with no fixed ratio. Three open fronts: 1. Photon counting and homodyne FDRs. Stochastic master equations admit a \"quantum Harada–Sasa\": the rate of entropy flowing to the photon environment equals an integrated violation of the bath-mediated FDT [28, 36, 37]. This makes the noise floor of any optomechanical or circuit-QED experiment operated below the bath temperature — the regime exploited throughout — an active test of the quantum FDR rather than a verification of equilibrium. 2. MBL, prethermal and Floquet steady states. In many-body-localised regimes (cf. ) the steady state of a driven slice is athermal on accessible timescales; numerically observed FDT-like relations are governed by effective temperatures that depend on the observable, violating the operational equilibrium criterion. A microscopic frenetic decomposition has not yet been formulated here. 3. Driven-dissipative quantum matter (driven cavities, exciton-polariton condensates, dissipative spin chains). The Keldysh effective action carries an explicit FDR as a relation between retarded, advanced and Keldysh self-energies, \\Sigma^K = (\\Sigma^R - \\Sigma^A)\\coth(\\hbar\\omega/2k BT); the breakdown of this constraint along the Keldysh contour is the field-theoretic signature of genuine nonequilibrium criticality. Glassy and active systems: where the program is still incomplete The Cugliandolo–Kurchan effective temperature , extended by Parisi and collaborators (Nobel lecture, 2021 ), remains the cleanest setting in which a deformed FDT survives off equilibrium: in the aging regime of mean-field glasses, T {\\mathrm{eff}}(C) is well-defined and observable-independent within a correlation sector, and admits a thermodynamic reading as the slow-mode temperature. Whether this picture survives in finite-dimensional structural glasses is open; colloidal-glass experiments give mixed signatures and the relevant timescale separation is not cleanly present. In active matter the situation is more compromised. Self-propelled colloids break time-reversal symmetry at the single-particle level, and the \"violation\" of the FDT is not parametrised by a single T {\\mathrm{eff}} but by an activity-dependent kernel . The Baiesi–Maes–Wynants frenetic term is the mathematically clean correction, but extracting it experimentally requires resolving time-symmetric currents — dynamical activities, not fluxes — that most setups do not access. Recent work extending the FDT to nonconservative force protocols partially closes this gap by separating the conservative and circulating components of the response. What the FDT is still load-bearing for — and what it is not Three undiminished roles. First , in equilibrium the FDT remains the only general identity tying response to fluctuation"}</script>

wnian motion. (ii) Langevin 1908 promoted this into the stochastic-equation form: the random force on a Brownian particle has a white spectrum fixed by the same friction γ that dissipates energy — the prototype of what Kubo would later call the 'second' FDT. (iii) At Bell Labs in 1926–28, J. B. Johnson measured a universal voltage noise across resistors whose spectrum depended only on R and T, and H. Nyquist gave a one-page thermodynamic derivation (transmission-line modes, equipartition) producing S_V(ω) = 4 k_B T R — the first frequency-domain FDT. (iv) Callen and Welton 1951 generalized Nyquist's argument quantum-mechanically, using second-order perturbation theory on a generic dissipative quantum system, and arrived at the modern form S_AA(ω) = (ℏ/π) coth(ℏω/2k_B T) χ''_AA(ω). Onsager's 1931 regression hypothesis and Green's 1952–54 time-correlation formulas furnished the bridge; Kubo 1957 then absorbed everything into linear-response theory, where the FDT becomes a corollary of the Kubo identity for the canonical ensemble. Kubo's 1966 review fixed the modern terminology — including the distinction between the 'first' (response–correlation) and 'second' (noise–friction) FDT.", "credit_audit": "The folk attribution 'Kubo's theorem' or 'Callen–Welton theorem' compresses a half-century chain. The physics content — that linear dissipation forces a definite noise spectrum at temperature T — is already present in Einstein 1905 (Brownian motion) and Nyquist 1928 (resistor noise); both are special cases of a quantum result Callen and Welton wrote down in 1951 using textbook second-order perturbation theory. Kubo's contribution was not the theorem but the framework: linear-response theory recasts the FDT as one identity among many that follow from a canonical density matrix and a perturbing field. The 'Green–Kubo' formulas are partly Green's (1952–54) and were treated as such in the early literature; modern usage routinely drops Green. The Langevin-form ('second') FDT ⟨ξ(t)ξ(0)⟩ = 2γ k_B T δ(t) traces to Langevin 1908 and to Mori 1965 in its non-Markovian generalization, yet is also cited as 'Kubo'. Onsager's 1931 reciprocity and regression hypothesis is the missing structural link — the FDT is essentially the regression hypothesis plus equipartition — but does not itself state the theorem. Finally, the experimentalist John B. Johnson is reliably erased from 'Nyquist's theorem', even though Nyquist's paper exists to explain Johnson's measurements.", "timeline": [{"year": 1905, "event": "D = μ k_B T derived from kinetic theory; diffusion of a colloidal particle tied to its Stokes drag and temperature.", "who": "Albert Einstein", "work": "Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen, Annalen der Physik 17, 549", "kind": "theory", "ref": 2}, {"year": 1905, "event": "Independent derivation of the same Stokes–Einstein relation, from a kinetic argument about albumin diffusion; published months before Einstein's paper reached print.", "who": "William Sutherland", "work": "A Dynamical Theory of Diffusion for Non-Electrolytes and the Molecular Mass of Albumin, Phil. Mag. 9, 781", "kind": "theory", "ref": 1}, {"year": 1906, "event": "Probabilistic theory of Brownian motion; mean-square displacement and diffusion constant from collision statistics — independent of Einstein.", "who": "Marian Smoluchowski", "work": "Zur kinetischen Theorie der Brownschen Molekularbewegung und der Suspensionen, Annalen der Physik 21, 756", "kind": "theory", "ref": 3}, {"year": 1908, "event": "Stochastic-equation reformulation: m v̇ = −γ v + ξ(t) with ⟨ξ(t)ξ(t')⟩ = 2γ k_B T δ(t−t'). The dissipation γ and the noise variance are locked together — the 'second' FDT in prototype.", "who": "Paul Langevin", "work": "Sur la théorie du mouvement brownien, Comptes Rendus Acad. Sci. Paris 146, 530", "kind": "formalization", "ref": 4}, {"year": 1918, "event": "Shot noise in vacuum tubes: a non-thermal precursor showing that microscopic discreteness generates a calculable current spectrum. Trained the Bell Labs community to think in spectral densities.", "who": "Walter Schottky", "work": "Über spontane Stromschwankungen in verschiedenen Elektrizitätsleitern, Annalen der Physik 57, 541", "kind": "observation", "ref": 6}, {"year": 1928, "event": "Experimental discovery of a universal, frequency-flat voltage noise across resistors, S_V = 4 k_B T R, independent of material or geometry — Johnson noise.", "who": "John B. Johnson", "work": "Thermal Agitation of Electricity in Conductors, Phys. Rev. 32, 97", "kind": "observation", "ref": 7}, {"year": 1928, "event": "One-page thermodynamic derivation of Johnson's law via equipartition over transmission-line modes — the first explicit FDT in the frequency domain.", "who": "Harry Nyquist", "work": "Thermal Agitation of Electric Charge in Conductors, Phys. Rev. 32, 110", "kind": "theory", "ref": 8}, {"year": 1931, "event": "Reciprocal relations L_ij = L_ji from microscopic reversibility; regression hypothesis: relaxation of a spontaneous fluctuation follows the macroscopic law. The conceptual hinge between fluctuation and response.", "who": "Lars Onsager", "work": "Reciprocal Relations in Irreversible Processes I, II, Phys. Rev. 37, 405 / 38, 2265", "kind": "theory", "ref": 13}, {"year": 1945, "event": "Extension of Onsager symmetry to systems with magnetic fields and Coriolis-like terms: L_ij(B) = L_ji(−B). Cleans up the machinery the FDT will inherit.", "who": "Hendrik B. G. Casimir", "work": "On Onsager's Principle of Microscopic Reversibility, Rev. Mod. Phys. 17, 343", "kind": "theory", "ref": 16}, {"year": 1951, "event": "Quantum FDT in full generality: S(ω) = (ℏ/π) coth(ℏω/2k_B T) χ''(ω). Second-order perturbation theory on a generic dissipative quantum system; the name 'fluctuation-dissipation theorem' originates here.", "who": "Herbert Callen and Theodore Welton", "work": "Irreversibility and Generalized Noise, Phys. Rev. 83, 34", "kind": "formalization", "ref": 11}, {"year": 1952, "event": "Time-correlation function expression for transport coefficients (the 'Green' of Green–Kubo); the precursor structure on which Kubo's 1957 paper builds.", "who": "Melville S. Green", "work": "Markoff Random Processes and the Statistical Mechanics of Time-Dependent Phenomena, J. Chem. Phys. 20, 1281", "kind": "theory", "ref": 17}, {"year": 1957, "event": "Linear-response theory: σ_αβ(ω) and other susceptibilities expressed as canonical-ensemble averages of commutators of currents. FDT becomes a corollary; Kubo formulas become the standard derivation route.", "who": "Ryogo Kubo", "work": "Statistical-Mechanical Theory of Irreversible Processes I, J. Phys. Soc. Jpn. 12, 570", "kind": "formalization", "ref": 9}, {"year": 1963, "event": "Influence-functional treatment of a quantum system bilinearly coupled to a thermal bath; reproduces the quantum FDT spectrum as the noise kernel of the reduced dynamics. The microscopic foundation later used by Caldeira–Leggett.", "who": "Richard Feynman and Frank Vernon", "work": "The Theory of a General Quantum System Interacting with a Linear Dissipative System, Ann. Phys. 24, 118", "kind": "theory", "ref": 12}, {"year": 1965, "event": "Projection-operator formalism producing a generalized Langevin equation with memory kernel K(t) and noise ξ(t) obeying ⟨ξ(t)ξ(0)⟩ = k_B T K(t) — the 'second' FDT in non-Markovian form.", "who": "Hazime Mori", "work": "Transport, Collective Motion, and Brownian Motion, Prog. Theor. Phys. 33, 423", "kind": "formalization", "ref": 5}, {"year": 1966, "event": "Canonical review fixing modern usage: the distinction between the 'first' FDT (response ↔ correlation) and the 'second' FDT (noise ↔ friction); explicit regime-of-validity statements.", "who": "Ryogo Kubo", "work": "The Fluctuation-Dissipation Theorem, Rep. Prog. Phys. 29, 255", "kind": "naming", "ref": 19}, {"year": 1993, "event": "FDT violation in aging spin glasses parametrized by an 'effective temperature' T_eff(ω) via the modified ratio χ''/(ω C); the move that the abuse_alert warns about.", "who": "Leticia Cugliandolo and Jorge Kurchan", "work": "Analytical Solution of the Off-Equilibrium Dynamics of a Long-Range Spin-Glass Model, Phys. Rev. Lett. 71, 173", "kind": "revival", "ref": 20}], "neglected": [{"name": "William Sutherland", "role": "Derived D = k_B T / (6πηa) for albumin diffusion independently of Einstein and published it slightly earlier; the relation should by rights be Sutherland–Einstein. Sutherland's name survives mainly in Australian physics and in viscosity formulas.", "evidence": "Sutherland's Phil. Mag. paper (March 1905 issue, received Nov 1904); discussed in R. W. Home's biographical work on Sutherland.", "ref": 1}, {"name": "Marian Smoluchowski", "role": "Built the probabilistic / random-walk picture of Brownian motion that the Langevin and Fokker–Planck literatures actually use. Einstein took the entropy-gradient route; Smoluchowski the collision route. Both produce the FDT seed D = μ k_B T.", "evidence": "Annalen der Physik 21, 756 (1906); Smoluchowski's 1916 paper on the Fokker–Planck precursor.", "ref": 3}, {"name": "John B. Johnson", "role": "The experimentalist who actually saw thermal noise and showed it was universal — Nyquist's paper exists because Johnson handed him the data. Textbooks routinely say 'Nyquist's theorem' and drop Johnson.", "evidence": "Johnson's own 1928 paper explicitly acknowledges Nyquist for the theory; Bell Labs internal history and Johnson's later writings record the experimental priority.", "ref": 7}, {"name": "Theodore A. Welton", "role": "Co-author of the 1951 paper that names the theorem; the calculation was largely his. He is consistently dropped in shorthand (citations to 'Callen's theorem'). Welton went on to nuclear theory at Oak Ridge and never claimed the credit.", "evidence": "Phys. Rev. 83, 34 (1951) joint authorship; Welton biographical memoir at Oak Ridge / APS.", "ref": 11}, {"name": "Melville S. Green", "role": "Established the time-correlation-function form of transport coefficients in 1952 and 1954 — what is now 'Green–Kubo' — five years before Kubo's 1957 paper. Often collapsed to 'Kubo formula' in modern usage.", "evidence": "J. Chem. Phys. 20, 1281 (1952) and 22, 398 (1954) predate Kubo 1957; Zwanzig's reviews credit Green for the correlation-function form.", "ref": 17}, {"name": "Hazime Mori", "role": "The projection-operator construction that yields the generalized Langevin equation — and with it the non-Markovian 'second' FDT relating memory kernel to noise covariance — is Mori's, not Kubo's. The two are routinely conflated under 'Mori–Zwanzig', with Mori's specific FDT statement attributed to Kubo.", "evidence": "Prog. Theor. Phys. 33, 423 (1965); see also Zwanzig's 'Nonequilibrium Statistical Mechanics' (2001) crediting Mori for the GLE-form FDT.", "ref": 5}], "conflations": [{"claim": "There is one 'FDT'.", "clarification": "There are at least three statements travelling under the name. (a) First-kind FDT: S_AA(ω) = (2ℏ / (1 − e^{−ℏω/k_B T})) χ''_AA(ω) — equilibrium spectrum of A is set by the imaginary part of A's susceptibility. (b) Second-kind FDT (Langevin / Mori): in a generalized Langevin equation m v̇ = −∫ K(t−s) v(s) ds + ξ(t), one has ⟨ξ(t)ξ(0)⟩ = k_B T K(t). (c) Einstein relation: μ = D / k_B T, the zero-frequency, mechanical specialization. Each has its own assumptions; (a) and (b) coincide only in canonical equilibrium."}, {"claim": "FDT and the Kubo formula are the same thing.", "clarification": "The Kubo formula is the general linear-response expression χ_AB(ω) = (i/ℏ) ∫₀^∞ dt e^{iωt} ⟨[A(t), B(0)]⟩ for any pair (A,B). The FDT is the specific relation between χ''_AA and S_AA that follows when the unperturbed state is the canonical ensemble. Linear response holds out of equilibrium too; the FDT does not."}, {"claim": "Johnson noise is 'thermal noise' is k_B T noise.", "clarification": "Three things often blurred. (i) The classical Nyquist spectrum S_V = 4 k_B T R holds only for ℏω ≪ k_B T. (ii) The full quantum result includes a zero-point term (ℏω/2) coth(ℏω/2k_B T)·2R that does not vanish at T → 0. (iii) 'Excess' or 1/f noise in real resistors is not Johnson noise and is not constrained by the FDT — it reflects non-equilibrium current-dependent fluctuations."}, {"claim": "FDT applies to driven steady states with an 'effective temperature'.", "clarification": "T_eff is a fit parameter extracted by imposing the FDT form C(ω) = (2 k_B T_eff / ω) χ''(ω) and reading off T_eff. It is meaningful only if T_eff turns out to be observable-independent over a frequency window — a check almost never performed. In aging glasses (Cugliandolo–Kurchan) this works in a precise asymptotic sense; in active matter and most NESS it is folklore. The honest statement is that linear-response and correlation functions exist separately; the FDT is what would link them if equilibrium held."}, {"claim": "FDT 'violations' diagnose non-equilibrium.", "clarification": "Two distinct phenomena get this label. (i) Genuine breakdown: the system is out of equilibrium, detailed balance fails, χ'' and C decouple. (ii) Hidden slow variables: the FDT holds, but only after augmenting the response with a 'frenetic' term ⟨A · activity⟩ (Baiesi–Maes–Wynants). The modern non-equilibrium FDR is not a failure of the theorem but a generalization with a measurable correction term."}, {"claim": "The classical FDT and the quantum FDT differ only by ℏ → 0.", "clarification": "The classical limit recovers S_AA(ω) = (2 k_B T / ω) χ''_AA(ω), which is symmetric in ω. The quantum spectrum is asymmetric (emission vs absorption sidebands differ by the Boltzmann factor e^{ℏω/k_B T}). This asymmetry is what makes a cold quantum sensor distinguish positive- from negative-frequency noise — the entire premise of quantum-limited amplification and sideband cooling, and not visible in any naive 'ℏ → 0' reading."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: Sutherland, Einstein, Smoluchowski, Langevin, Johnson — and the Names That Got Sanded Off", "markdown": "## Origins: Sutherland, Einstein, Smoluchowski, Langevin, Johnson — and the Names That Got Sanded Off\n\nThe fluctuation–dissipation theorem did not arrive as a theorem. It accreted, between 1905 and 1928, from four problems that nobody at the time recognized as the same problem: the diffusion of albumin in water, the Brownian dance of pollen grains, the dynamics of a particle suffering random kicks, and the hiss across the terminals of a wire-wound resistor. Each problem had its first observer, its first explainer, and — almost always — a second author who got erased.\n\n### Sutherland and Einstein: a relation with one name on it\n\nThe identity that opens the entire subject,\n\n$$D = \\frac{k_B T}{6 \\pi \\eta a},$$\n\nis universally taught as the Einstein relation. The historical record is unambiguous: William Sutherland, working in Melbourne, derived it independently and *published it first*. His paper \"A Dynamical Theory of Diffusion for Non-Electrolytes and the Molecular Mass of Albumin\" appeared in the March 1905 issue of the *Philosophical Magazine* [1], having been read to the Australasian Association for the Advancement of Science in January 1904 and submitted in November 1904. Einstein's paper in *Annalen der Physik* [2] was received by the journal on 11 May 1905 and printed in July. Sutherland's derivation runs through osmotic pressure balanced against Stokes drag for a non-electrolyte; Einstein's, through a parallel argument tying the diffusion flux to a thermodynamic gradient — the two routes are essentially identical at the level of the final equation.\n\nNaming inertia did the rest. Australian and biophysical literature kept \"Sutherland–Einstein\"; the German-language tradition that fed into Smoluchowski 1906, Langevin 1908, Perrin's *Les Atomes*, and ultimately into the Statistical Mechanics canon, dropped Sutherland. By the time Kubo and Welton are writing in the 1950s, he is gone from the citation graph. The honest attribution is **Sutherland–Einstein**; the textbook attribution is wrong.\n\nWhat matters physically: this relation is the FDT in its lowest, mechanical incarnation. The mobility $\\mu = 1/(6\\pi\\eta a)$ is a *dissipative* coefficient — it parametrizes irreversible energy loss to the fluid. The diffusion constant $D$ is a *fluctuation* coefficient — it parametrizes the mean-square spread of a tagged particle. The relation $\\mu = D / k_B T$ says these are not independent: fix the temperature and one determines the other. Every later FDT statement, classical or quantum, is an extension of this single identity to a wider class of observables.\n\n### Smoluchowski: the collision picture that the literature actually uses\n\nIn 1906, Marian Smoluchowski published in *Annalen der Physik* a probabilistic theory of Brownian motion built from the statistics of molecular collisions [3]. Where Einstein worked from osmotic-pressure thermodynamics, Smoluchowski worked from a random-walk argument that gave, in modern language, the central-limit-theorem behaviour of the displacement directly. He recovered the same $\\langle x^2 \\rangle = 2Dt$ scaling, and he did so by a route that more closely resembles what graduate students later see — the Chapman–Kolmogorov equation, the diffusion equation as a coarse-graining of a Markov process, and (in his 1916 sequel) the structure that Fokker and Planck would inherit.\n\nThe \"Einstein–Smoluchowski\" pairing has survived better than \"Sutherland–Einstein\" — partly because Einstein himself cited Smoluchowski explicitly in 1908 — but the asymmetry of credit is still striking. Smoluchowski's collision picture is the one the Langevin and Fokker–Planck literatures use. Einstein's thermodynamic picture is the one the textbooks reproduce.\n\n### Langevin: the equation that is, structurally, the FD
