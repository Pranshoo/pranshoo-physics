<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Determinism Inside the Chaos: Random Recurrent Networks from May to Mean-Field", "alternativeHeadline": "deterministic chaos in random recurrent networks", "name": "deterministic chaos in random recurrent networks", "description": "A genealogical and technical dossier on the Sompolinsky–Crisanti–Sommers transition and its hidden ancestry", "inLanguage": "en", "keywords": ["deterministic chaos in random recurrent networks", "SCS chaos", "rate-network chaos", "g→1 transition", "DMFT chaos in RNNs", "transition to chaos in random neural networks", "edge of chaos (engineering usage)"], "about": [{"@type": "Thing", "name": "deterministic chaos in random recurrent networks"}, {"@type": "Thing", "name": "SCS chaos"}, {"@type": "Thing", "name": "rate-network chaos"}, {"@type": "Thing", "name": "g→1 transition"}, {"@type": "Thing", "name": "DMFT chaos in RNNs"}, {"@type": "Thing", "name": "transition to chaos in random neural networks"}, {"@type": "Thing", "name": "edge of chaos (engineering usage)"}], "articleSection": "DEEP DIVE", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-determinism-inside-the-chaos-random-recurrent-networks-f.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-determinism-inside-the-chaos-random-recurrent-networks-f.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Before 1988: Amari, May, and the Buried Genealogy of Random-Network Chaos Before 1988: Amari, May, and the Buried Genealogy of Random-Network Chaos The 1988 letter of Sompolinsky, Crisanti and Sommers is short — three pages, two equations, one figure — and reads as a self-contained invention. It is nothing of the kind. By the time the manuscript reached Physical Review Letters , every technical ingredient of its argument had been in print for years, sometimes for sixteen. The closure that produces the chaotic order parameter was Sompolinsky and Zippelius's ; the functional that justifies the closure was de Dominicis's , built on Martin, Siggia and Rose ; the random-Jacobian spectrum that locates the instability at g=1 was May's , sharpened a few weeks before SCS by Sommers, Crisanti, Sompolinsky and Stein , itself a continuation of Girko's circular law ; and the random analog network — sigmoidal units, all-to-all Gaussian couplings, the very setup of SCS — had been written down and analyzed at the level of mean activity, two-point correlation, and linear stability by Amari in the same year May's stability theorem appeared. The novelty of is real but narrower than the legend: SCS were the first to push the soft-spin DMFT closure of past the stability line with asymmetric J, and to recognize that the resulting non-fixed-point order parameter C(\\tau) was the signature of mean-field chaos rather than of any disordered equilibrium. Amari 1972: the random analog network, written down Amari's 1972 paper is the document the field has worked hardest to forget. The model is with \\phi a bounded sigmoidal nonlinearity — the same equation that opens SCS88. Amari computed the self-consistent mean activity, derived a Gaussian closure for the two-point correlation by appealing to the central-limit structure of the recurrent sum, and read off the linear-stability condition on a fully random Jacobian. He did not have a dynamical functional, he did not consider asymmetric versus symmetric J as a phase-controlling parameter, and he did not push past the linear instability. But the closure rule — \"treat the recurrent field at each neuron as a Gaussian whose variance is determined self-consistently from the single-site nonlinear response\" — is exactly the rule SCS will elevate to a saddle point of a generating functional fifteen years later. The under-citation is severe and structural. Amari published in IEEE Transactions on Systems, Man, and Cybernetics , a venue physicists do not read; he wrote in the language of engineering cybernetics; the symmetric Hopfield wave of 1982 swept his work under \"associative memory\" and lost the disordered-asymmetric thread; and by 1988 the natural ancestor of SCS in citation terms was Sompolinsky–Zippelius 1982 , which Amari did not write. The historiographical record is unambiguous nonetheless: the random analog recurrent network with Gaussian couplings is Amari's model, and the first self-consistent treatment of its statistics is Amari's calculation . May 1972: the spectral threshold, without the dynamics In the same year, May asked a question phrased in ecology — when does a randomly coupled N-species community lose linear stability? — and gave the answer that random-matrix theory now treats as canonical. For a Jacobian -I + J with J {ij} i.i.d. mean-zero variance g^2/N, the eigenvalues of J fill a disk of radius g in the complex plane (the circular law, then a folklore extrapolation of Wigner and Ginibre); stability is lost when g \\to 1. This is the exact boundary at which SCS locate the chaos transition. May did not have the circular law as a theorem — Girko's proof arrived in 1984, in Russian, and the rigorous asymmetric-Gaussian spectrum that physicists actually cite is the elliptic refinement of Sommers, Crisanti, Sompolinsky and Stein — but the threshold is May's, and the fact that the post-instability phase is interesting (chaotic, not merely unstable) is what SCS contribute on top of him. The credit audit here is delicate. The folklore \"SCS found that the transition is at g=1\" is wrong as a discovery claim and right as a characterization claim: May identified the boundary as a linear-stability line; SCS identified it as a dynamical phase transition , with C(\\tau) as the order parameter and g as the control. These are different statements about the same number. Martin–Siggia–Rose 1973 and de Dominicis 1978: the functional substitute for replicas The technical backbone of every random-RNN mean-field calculation written after 1980 is the Martin–Siggia–Rose generating functional — a path integral for classical stochastic dynamics that turns expectation values of trajectory observables into saddle-point problems. As written in 1973, MSR was a formalism for stochastic field theory; it became a tool for quenched-disorder dynamics only after de Dominicis showed that a disorder average over a properly normalized MSR functional bypasses replicas entirely. Where the static spin-glass literature was tangled in n \\to 0 limits inherited from Sherrington–Kirkpatrick , the dynamical literature could march forward with one-replica generating functionals and Gaussian disorder averages that produce a single-site effective theory directly. De Dominicis's role is systematically underweighted in the neural-network literature. \"DMFT\" is invoked as if it were a single coherent technique; it is, operationally, the de Dominicis functional with the Sompolinsky–Zippelius closure rule, and the neural-network community tends to cite for both. The cleanest attribution is: functional method, de Dominicis (on MSR ); closure for soft spins, Sompolinsky–Zippelius ; transposition to asymmetric neural networks, SCS . Sompolinsky–Zippelius 1982: the closure SCS recycle The relaxational dynamics of the soft-spin Edwards–Anderson model is the immediate methodological ancestor of . Sompolinsky and Zippelius wrote the Langevin equation for soft spins with quenched Gaussian couplings, performed the disorder average inside the MSR–de Dominicis functional, and derived a self-consistent equation for the spin–spin correlator with the Gaussian recurrent field replaced by an effective noise of variance fixed by C(\\tau) itself. Their analysis was for symmetric J — the spin-glass regime — and produced aging and ergodicity breaking, not chaos. SCS's move was disarmingly simple: keep the closure, drop the symmetry. The same self-consistency, applied to an asymmetric ensemble that has no associated free energy and therefore no equilibrium, has a chaotic solution above g=1 and a quiescent solution below. Zippelius is the name most often dropped in shorthand citation, and the omission matters: the closure rule that defines what physicists now call \"DMFT for neural networks\" is hers as much as it is Sompolinsky's. Crisanti–Sompolinsky 1987: asymmetry, on a spherical model The unambiguous methodological dress-rehearsal for is Crisanti–Sompolinsky 1987 : Langevin dynamics for a continuous (spherical) spin system with randomly asymmetric bonds. The closure of is applied with J broken into symmetric and antisymmetric parts, and the resulting effective theory already exhibits the loss of fluctuation–dissipation and the persistent autocorrelations that, on a sigmoidal neural model a year later, will be labeled chaos. Reading and consecutively makes plain that the 1988 letter is the neural-network instantiation of a programme whose mechanics were settled in 1987. Sherrington–Kirkpatrick 1975 and the parallel attractor lineage Sherrington–Kirkpatrick sits sideways to this genealogy. It supplies the language — quenched disorder, infinite-range mean field, order parameters extracted from random couplings — without supplying the dynamics; the symmetric SK model has an equilibrium and an energy landscape, and the entire Hopfield programme (and Hopfield's 2024 Nobel lecture ) inherits that structure. SCS's transition cannot exist in that lineage: symmetric J forbids it. The honest statement is that random-RNN chaos and Hopfield-style attractor memory are cousins through SK , not parent and child; they share statistical mechanics but not phase diagrams. What was actually new in 1988 Stripped of folklore, the SCS contribution is three things: (i) the recognition that the relevant phase diagram of an asymmetric random neural network has a sharp transition at the May–Sommers–Girko spectral boundary g=1; (ii) the identification of the post-instability state as ergodic, aperiodic, finite-entropy mean-field dynamics — chaos , not glassy multistability; (iii) the deployment of the Sompolinsky–Zippelius closure inside a de Dominicis functional to produce a self-consistent equation for C(\\tau) that admits an explicit non-trivial solution. Everything else — the model, the closure, the functional, the spectral threshold — was already on the table. The historiographically defensible name is Amari–May–Sompolinsky–Zippelius–de Dominicis–Sommers–Crisanti–Sompolinsky chaos ; the literature has compressed it to three names, and the compression has cost Amari, Zippelius, de Dominicis, and Sommers most of the credit they are owed. The Pedagogical Core: DMFT Derivation of the g=1 Transition The Pedagogical Core: DMFT Derivation of the g=1 Transition The model is deliberately minimal. N rate units obey with \\phi=\\tanh and quenched i.i.d. couplings J {ij}\\sim\\mathcal{N}(0,g^2/N) — no enforced symmetry, so J {ij} and J {ji} are independent. This is the SCS model in ; its immediate ancestor is the asymmetric spherical Langevin system of , itself a graft of the Sompolinsky–Zippelius closure onto a non-Hermitian disorder ensemble. The goal of this section is to derive, from first principles, the equation for the stationary autocorrelator C(\\tau) and to extract from it the bifurcation at g=1. 1. MSRJD generating functional The Martin–Siggia–Rose / Janssen / de Dominicis path-integral representation [4, 3] writes the disorder-conditioned moment generating functional as with the noise-free deterministic action The response field \\hat{x} i is purely imaginary along the integration contour; correlators and response functions are obtained by source differentiation. No noise is introduced — the only randomness is the quenched matrix J. 2. Disorder average Because the coupling enters \\ln Z linearly, the Gaussian average over J is exact: Asymmetry kills the cross term \\hat{x} i(t)\\hat{x} j(t')\\phi(x j(t))\\phi(x i(t')) that would otherwise appear for symmetric J; that omission is precisely what permits the order parameter to be a single two-point function rather than a coupled (C,R) pair with an FDT-violating response. This is the technical reason the SCS regime cannot occur in the Hopfield/SK lineage [10, 12]. 3. Decoupling and large-N saddle Introduce the empirical order parameters and resolve them with conjugate Lagrange multipliers. The action becomes extensive in N; at the saddle point (N\\to\\infty) the sites factorize and one is left with a single-site stochastic problem with the self-consistency The brackets denote an average over \\eta, which is itself fixed (in the path-integral sense) by C. In a stationary state the saddle is time-translation invariant: C(t,t')=C(\\tau) with \\tau=t-t', and x(t) becomes a zero-mean Gaussian process with covariance \\Delta(\\tau)\\equiv\\langle x(t)x(t+\\tau)\\rangle. The crucial conceptual point — emphasized in and made operational in — is that \\eta is not a thermal noise; it is the disorder-averaged image of the deterministic recurrent input \\sum j J {ij}\\phi(x j), which for any single realization is a fixed function of the single trajectory. 4. Closure: the ODE for \\Delta(\\tau) Solving the linear single-site equation, \\Delta(\\omega)=g^2 C(\\omega)/(1+\\omega^2), equivalently where C(\\tau) is the Gaussian functional with \\Sigma=\\begin{pmatrix}\\Delta 0 \u0026 \\Delta(\\tau)\\\\ \\Delta(\\tau) \u0026 \\Delta 0\\end{pmatrix} and \\Delta 0\\equiv\\Delta(0). The functional C[\\Delta;\\Delta 0] is monotone in \\Delta at fixed \\Delta 0; this is all the structure the subsequent analysis needs. 5. The mechanical analogue Read \\tau as time and \\Delta as position: the closure is Newton's equation with conserved energy E=\\tfrac{1}{2}\\dot{\\Delta}^2+U(\\Delta;\\Delta 0). Two boundary conditions select the physical orbit: (i) by \\tau\\leftrightarrow-\\tau symmetry, \\dot{\\Delta}(0)=0; (ii) in any stationary phase without macroscopic frozen overlap, \\Delta(\\tau)\\to 0 and \\dot{\\Delta}(\\tau)\\to 0 as \\tau \\to\\infty. Together (i)+(ii) impose E=U(0;\\Delta 0)=0 and This single algebraic condition fixes the static variance \\Delta 0 as a function of g. Figure: The SCS closure as a 1D mechanical problem. The \"particle\" position is the autocovariance \\Delta(\\tau), the \"time\" is the lag \\tau. For g\u003c1 (blue) the origin is the only zero-energy turning point and \\Delta 0=0. At g=1 (orange) the well is marginal: U''(0)=0. For g 1 (green) two zeros at \\pm\\Delta 0 appear; the homoclinic orbit that leaves +\\Delta 0 at \\tau=0, reaches 0 as \\tau\\to\\infty, and is reflected for \\tau\u003c0 is the stationary chaotic correlator. 6. The bifurcation Differentiating (\\star) at \\Delta 0=0 and using \\partial \\Delta C(0;0)=\\langle\\phi'(x)^2\\rangle {x=0}=1 (because \\tanh'(0)=1) yields For g\u003c1 the only zero-energy turning point of U is \\Delta=0: the trivial fixed point x i\\equiv 0 is the unique stationary state, and small perturbations decay with correlation time \\tau c=(1-g^2)^{-1/2}. For g 1 the curvature flips and the cubic-in-\\Delta 0 correction to (\\star) (set by \\partial^2 \\Delta C\\big 0=\\langle\\phi''(x)^2\\rangle) generates a smooth second-order branch with the prefactor depending on the Gaussian moments of \\tanh. The autocorrelator C(\\tau) decays from C(0)=\\langle\\tanh^2(x)\\rangle\\sim\\Delta 0 to 0 on a diverging time scale \\tau c\\sim(g-1)^{-1/2} — the \"soft\" mode of the bifurcation. The transition is continuous, the order parameter is the variance of the population, and the broken object is not a symmetry but the trivial fixed point's stability. 7. Linear-stability reading: closing the loop to May and Sommers The same g=1 surfaces in two independent calculations that long predate the closure above. May observed in 1972 that the Jacobian of any large coupled system, when its off-diagonal entries are i.i.d. with variance g^2/N, has spectral radius g by a Wigner-style argument; instability of the zero fixed point sets in at g=1. Sommers, Crisanti, Sompolinsky and Stein sharpened this in the asymmetric Gaussian case using a Hermitization trick, obtaining the elliptic spectrum whose right edge — for purely asymmetric J — sits exactly at g, with Girko's circular law as the i.i.d. limit. The DMFT calculation reproduces g=1 as a nonlinear statement: (\\star) loses its trivial solution because U''(0) changes sign. The two derivations agree at the linear level because \\phi'(0)=1; were one to rescale \\phi\\to\\phi/a, both the spectral radius and the DMFT threshold would shift to g=a in lockstep. The chaos transition is thus the linear-stability edge of May/Sommers viewed from the other side — the side where one does not stop at \"the fixed point is unstable\" but asks what stationary measure the dynamics settles into. The answer, supplied by and refined by [15, 16], is the homoclinic orbit drawn above. The Anchoring Point: Why the DMFT 'Noise' Is Not Noise The Anchoring Point: Why the DMFT 'Noise' Is Not Noise The single-site equation that emerges from the SCS calculation is the Langevin-shaped object and the temptation, reinforced by every textbook that abbreviates it as a Langevin equation, is to read \\eta as a stochastic forcing — a Gaussian process pushing the unit around in time. That reading is wrong. It misidentifies the measure over which the angle brackets are taken, and from that misidentification follows a cottage industry of statements about \"noise-induced\" features of random-network chaos. The 2026 paper of Yadav, Shaidurov and Kadmon is best understood as a corrective: it does not introduce a new mechanism, it makes operational a fact already implicit in and used implicitly in [15, 16, 13]. Going through the path-integral derivation is the cleanest way to see why. The MSRJD construction, with the disorder average where it actually lives For the network \\dot{x} i = -x i + \\sum j J {ij}\\phi(x j) with J {ij}\\sim\\mathcal{N}(0,g^2/N) i.i.d., the Martin–Siggia–Rose / de Dominicis–Janssen generating functional is Two facts are essential. First, Z J is a functional of one fixed realization of J; for any such J the equations of motion are deterministic and Z J=1 trivially. Second, the response field \\hat{x} enters linearly in J {ij}, so the average is a Gaussian integral over the couplings. Performing it produces a four-field interaction that decouples after a Hubbard–Stratonovich on the population correlator C(t,t')=N^{-1}\\sum j\\phi(x j(t))\\phi(x j(t')) and the population response R(t,t'). The saddle-point at N\\to\\infty collapses to a single-site action whose physical-field sector is exactly the Langevin form above, with \\eta a centered Gaussian process of covariance g^2 C. This is the Sompolinsky–Zippelius closure of 1982 transposed from symmetric to fully asymmetric couplings. The decisive point is the location of the average. The Gaussian measure on \\eta is the image, under the Hubbard–Stratonovich change of variables, of the Gaussian measure on J {ij}. It is an ensemble average over disorder. There is no time-stochastic process in the original equations and none is introduced. The \"noise\" is the disorder, rewritten in single-site language. What \\eta really is for a fixed realization For a chosen J and a chosen initial condition x(0), the recurrent input to unit i, is a deterministic functional of the trajectory: \\eta i = \\mathcal{F} i[J;x(\\cdot)]. The DMFT result is that, in the N\\to\\infty limit, the single-unit marginal of \\eta i(t) over the disorder ensemble is Gaussian with covariance g^2 C(t,t'), where C is determined self-consistently. That is a statement about the ensemble distribution of a deterministic object. It is not a statement that the object is itself a sample path of a stochastic process. The correlation time of \\eta is the autocorrelation time of \\phi(x) — finite, and in the chaotic phase set by the very dynamics it is supposed to \"drive\". A genuine external Langevin force has none of this structure: its correlation time is independent of x and its realization is independent of J. Yadav, Shaidurov and Kadmon anchor this by showing, on individual realizations, that the chaotic mean-field trajectory is reproducible from (J,x(0)) alone — no auxiliary random-number stream is needed to integrate the effective single-site equation, because \\eta inherits its values from the same trajectory it generates. In path-integral language this is the trivial observation that the saddle-point equations are deterministic functional equations; in numerical practice it is the non-trivial observation that one can integrate them as such, instead of by Monte Carlo over a fictitious Gaussian process. Why this was implicit in SCS and operational by 2015–2018 The original SCS letter never wrote \"noise\". It worked entirely with the autocorrelation \\Delta(\\tau)=\\langle x(t)x(t+\\tau)\\rangle and obtained the second-order ODE where f is a Gaussian integral of \\phi. The variable here is the disorder-averaged two-point function, not a single trajectory; there is no place for a noise realization to enter. Kadmon and Sompolinsky extended the closure to networks with quiescent fixed points by tracking precisely these moment equations, and Schuecker, Goedeke and Helias wrote the driven version with an external input added to the deterministic single-site equation, separating cleanly the genuine input from the auxiliary \\eta. The Helias–Dahmen lecture notes make the construction fully explicit. None of these works treats \\eta as physical noise; the confusion is a reader's, not the literature's. What determinism does and does not imply Three corollaries are routinely mixed up. Lyapunov spectra are unaffected. The maximal Lyapunov exponent \\lambda {\\max}(g) measured by tangent-vector integration in finite-N networks is positive for g 1 and is a property of the deterministic flow on the synaptic realization. Mean-field determinism is what makes \\lambda {\\max} a meaningful object in the first place: there is a flow whose tangent map can be linearized. The SCS argument, recall, did not compute Lyapunov exponents — it inferred chaos from the non-decay of \\Delta(\\tau) — so nothing about the \\lambda side of the story changes when one re-emphasizes determinism. Self-averaging is a separate statement. \"C(t,t') is self-averaging\" means that the empirical population correlator on a single J-realization concentrates onto its disorder average as N\\to\\infty. This is what licenses identifying single-site quantities with population quantities and is the structural reason DMFT works. It is independent of whether \\eta is \"noise\": self-averaging holds for the deterministic recurrent input precisely because the law of large numbers acts on the index j in \\sum j J {ij}\\phi(x j). Ergodicity in DMFT means something specific. The closure assumes time-translation invariance of C in the chaotic phase and equates ensemble averages over J with time averages along a single trajectory. This is a structural assumption — empirically supported, not derived — and is what makes the second-order ODE for \\Delta(\\tau) well-posed. The 2026 demonstration of predictability does not undermine it; if anything it sharpens the question, since one can now compare individual realizations against the moment closure rather than against a sampled stochastic process. Read this way, the \"anchoring point\" is less a new result than a re-anchoring of vocabulary. The DMFT equations describe deterministic chaos in random ensembles. The Gaussian field \\eta is the disorder, dressed in a single-site coordinate system. Treating it as a Langevin force introduces phantom physics — noise-activated escape, stochastic resonance intuitions, dissipation–fluctuation reasoning — none of which has any operational meaning in a system whose only randomness is quenched. The 2026 paper makes this hard to forget by integrating the equations as the deterministic functional equations they always were. Landmark Evidence: Simulations, Lyapunov Spectra, and Biological Echoes Landmark Evidence: Simulations, Lyapunov Spectra, and Biological Echoes Theoretical claims about the g=1 transition rest on three layers of evidence: direct numerical integration of the network ODEs, dynamical-systems diagnostics (Lyapunov spectra, attractor dimensions, Kolmogorov–Sinai entropies) computed on those trajectories, and indirect signatures in biological recordings that the rate-network model is supposed to caricature. Each layer warrants different epistemic weight, and the literature regularly inflates the third. The original SCS simulations The 1988 letter reports numerical integration of N\\sim 200 rate units with J {ij}\\sim\\mathcal{N}(0,g^2/N) for several values of g, and overlays the simulated autocorrelation C(\\tau)=\\langle x i(t)\\,x i(t+\\tau)\\rangle with the self-consistent DMFT prediction. Agreement is good, the supercritical C(\\tau) is aperiodic and decays on a slow g-dependent timescale, and the equal-time amplitude C(0) tracks the DMFT curve across the transition. This is what SCS called \"chaos\": the existence of a stationary, non-fixed-point regime with a non-trivial mean-field correlator. Three caveats sit underneath. First, N=200 is small; finite-N corrections to DMFT scale as 1/\\sqrt{N} and are visible on the averaging windows SCS used, although the transition's location at g=1 is set by the spectrum of J — a quantity whose N\\to\\infty limit is sharp (the circular law of Girko and the asymmetric refinement of ). Second, no Lyapunov exponent was computed. The diagnostic was the shape of C(\\tau), not a direct estimate of \\lambda 1. Third, an aperiodic two-point function is, in principle, also consistent with quasiperiodic motion on a high-dimensional torus; the DMFT order parameter does not distinguish. The folk reading that \"SCS proved chaos\" therefore mildly overstates what is on the page. SCS proved the existence of a non-fixed-point phase with a self-consistent correlator and named it chaos by good-faith analogy. Direct Lyapunov spectra The Lyapunov gap took two decades to close. Wainrib and Touboul argued rigorously that the largest exponent in the SCS model is positive throughout g 1 and exhibits the scaling \\lambda 1\\sim(g-1)^2 near onset, a quadratic threshold that distinguishes the SCS bifurcation from a generic period-doubling route (verify). Engelken, Wolf, and Abbott then computed the full Lyapunov spectrum \\{\\lambda \\alpha\\} {\\alpha=1}^N by integrating the tangent dynamics with periodic QR re-orthogonalization (verify), and the empirical picture that emerged is the cleanest the field possesses: - the spectrum is intensive — \\lambda \\alpha=\\Lambda(\\alpha/N) approaches a smooth curve as N\\to\\infty, so h {KS}=\\sum {\\lambda \\alpha 0}\\lambda \\alpha and the Kaplan–Yorke dimension D {KY} are both extensive in N; - the Kaplan–Yorke dimension grows monotonically with g, with D {KY}/N saturating well below unity, and is quantitatively reproduced by the DMFT correlation time; - \\lambda 1(g) matches the analytic prediction from a two-replica DMFT calculation of cross-trajectory decorrelation — the same construction that underlies Kadmon–Sompolinsky and the driven extension by Schuecker, Goedeke and Helias . This is the load-bearing modern evidence: a theoretical prediction from DMFT compared against direct numerical exponents on the same ensemble, with explicit confirmation that the supercritical phase is deterministic positive-entropy chaos rather than the quasiperiodic alternative the bare C(\\tau) data could not have excluded. Figure: What SCS measured in 1988 (left) and what Engelken-era simulations finally measured (right). The aperiodic C(\\tau) was consistent with chaos but did not require it; the direct \\lambda 1(g) measurement with its quadratic onset closed that loophole and matches the two-replica DMFT prediction. A different chaos: sparse balanced networks The 1996 van Vreeswijk–Sompolinsky paper is frequently cited as the \"biological\" version of the SCS result. It is not. The model is sparse — K\\ll N inputs per neuron with K\\to\\infty in a specific scaling limit — and divides units into excitatory and inhibitory populations. Chaos there arises from a balance condition: mean excitatory and inhibitory drives cancel at order \\sqrt{K}, leaving order-one fluctuations that push each unit through threshold irregularly. There is no g=1 in the SCS sense; once K is large the balanced solution is generically chaotic, and the chaos is hybrid (continuous between spikes, discontinuous at firing events) so the Lyapunov apparatus must be adapted. The mechanism, the order parameter, and the bifurcation are all different from ; only the word survives. This matters because empirical biological irregularity — Fano factors near unity, near-Poisson interspike intervals, decorrelated population activity — is explained by balanced-network chaos, not by SCS rate chaos. Confusing the two underwrites the recurrent claim that \"SCS 1988 predicted cortical irregularity,\" which it did not. Biological echoes and where the overclaim lives The honest list of what rate-network DMFT predicts that is testable in cortex is short. A slow, broadband, low-rank component of population activity in the absence of input, with autocorrelation time longer than the single-unit membrane constant — observed in spontaneous cortical recordings, with the usual confounds. Amplification and aperiodic shaping of weak transient input — observed in preparatory motor and prefrontal activity, modeled by Sussillo and successors using random RNNs near g=1. A transition from quiescent to active spontaneous dynamics as effective recurrent gain rises — observed across development, anesthesia depth and arousal state, although the mapping from biological gain to the parameter g is an analogy, not a measurement. What the rate-network theory does not deliver — and is sometimes credited with — is the spiking irregularity itself, the millisecond-precision of cortical responses, or any quantitative Fano-factor prediction. Those belong to the balanced family , to escape-noise constructions, or to mechanisms outside this lineage. The slogan \"the brain operates at the edge of chaos\" is at best a re-naming of the Bertschinger–Natschläger reservoir result , transported across two model classes whose only shared feature is the word \"network\". What counts as experiment for a theoretical object A useful framing: the SCS transition is not a phenomenon in nature but a phenomenon in a precisely specified ensemble. The \"experiments\" that test it are numerical integrations of the same equations from which it is derived — internal-consistency checks of the mean-field closure against finite-N reality, and of the two-replica \\lambda 1 calculation against tangent-space Lyapunov measurements. Those checks have largely succeeded. The further claim — that biological cortex realizes the SCS attractor — is a modeling hypothesis, and the strength of evidence for it has not changed much since the irregular-firing analyses of . What Has Been Generalized, What Has Been Replaced What Has Been Generalized, What Has Been Replaced The 1988 letter makes a small number of structural assumptions: N\\to\\infty, fully connected J {ij} with i.i.d. Gaussian entries of variance g^2/N and zero mean, antisymmetric covariance set to zero (so \\langle J {ij}J {ji}\\rangle=0), single-neuron timescale fixed to one, and \\phi=\\tanh — odd, monotone, bounded, and saturating with \\phi'(0)=1. Each of these has been individually relaxed in the subsequent literature. The point of this section is to be precise about which relaxations leave the canonical result intact, which deform it in controlled ways, and which break the SCS picture qualitatively. What survives verbatim The DMFT closure itself is robust. The single-site equation and the self-consistent equation for C(\\tau)=\\langle x(t)x(t+\\tau)\\rangle, follow from the de Dominicis generating functional on top of Martin–Siggia–Rose under the sole conditions that the off-diagonal J {ij} are i.i.d. with finite variance, weakly correlated across rows, and that \\phi is bounded and Lipschitz. Gaussianity of J is convenient but not essential: by the standard universality argument for fully connected mean-field theories — equivalently, by the spectral universality that gives the circular law for any i.i.d. ensemble with unit variance and finite fourth moment [7, 6] — the leading-order DMFT equations depend on J only through g^2 = N\\mathrm{Var}(J {ij}). The transition location g c=1 is a property of the linearization \\phi'(0)=1 around the trivial fixed point and of the asymmetric-spectrum boundary \\lambda \\le g derived in ; it does not depend on the saturating tail of \\tanh. Partial symmetry: the elliptic deformation The first controlled extension is partial symmetry. Parametrize The asymmetric-spectrum calculation in gives an elliptic support already announced in and the precursor . The linear-stability threshold becomes g c(\\eta)=1/(1+\\eta). Two limits are instructive: \\eta\\to 1 recovers symmetric J (Sherrington–Kirkpatrick territory , Sompolinsky–Zippelius dynamics ) — no chaos, only glassy relaxation with an energy function; \\eta\\to -1 gives antisymmetric J and the spectrum collapses onto the imaginary axis, producing marginal oscillatory phases rather than aperiodic chaos. SCS chaos in the strong sense — finite intensive entropy production with aperiodic C(\\tau) — occupies the interior \\eta\u003c\\eta^\\ast, with \\eta^\\ast short of 1. Non-saturating \\phi and the quiescent phase Kadmon and Sompolinsky revisited the network when \\phi is allowed to be ReLU-like or, more generally, to have a vanishing gain region. The DMFT closure goes through unchanged; what changes is the structure of the fixed-point manifold and the route to chaos. With \\phi=\\tanh, there is a single trivial fixed point x=0 for g\u003c1, and chaos emerges continuously above g=1. With a thresholded or rectified \\phi with quiescent regime \\phi'\\equiv 0 on an interval, an entirely silent state coexists with active states, and the transition splits into (i) a quiescent-to-active transition at finite drive and (ii) a chaotic instability of the active phase governed by the effective gain g^2\\langle\\phi'(x)^2\\rangle evaluated on the active stationary distribution. This converts the bare g axis into a one-parameter family of effective gains, and recovers the canonical SCS line as a special case. The pedagogically important point: the textbook formula g c=1 holds as a statement about effective gain , not bare coupling, the moment one leaves odd-symmetric saturating \\phi. Driven networks: sequence memory and the shifted transition Schuecker, Goedeke, and Helias derived the DMFT equations with an explicit driving current I i(t) — temporally structured, statistically i.i.d. across i. Two results matter. First, the deterministic input contributes additively to the single-site Langevin form, with h Gaussian with the input statistics. Second, the chaotic instability shifts: input variance \\sigma h^2 moves the effective operating point along the active-stationary distribution, generically suppressing chaos by saturating \\phi. The headline finding — that optimal sequence memory sits at, not beyond, the chaotic transition — is a clean correction to the older reservoir-computing folklore (see below) that placed the computational sweet spot inside the chaotic phase. Their derivation is also the cleanest modern statement of the full path-integral apparatus and is the de facto reference for the field . Sparse and low-rank structure Two structured-disorder extensions are essential. Sparse J with mean connectivity K: provided K\\to\\infty with N\\to\\infty, the central-limit step in DMFT survives, the spectral support remains a disk , and SCS chaos persists. For finite K — the regime of and of cortical relevance — DMFT fails outright, since the recurrent input ceases to be Gaussian; the sparse-disorder dynamics require cavity methods on tree-like graphs, of which is the continuous-time formulation. Conflating sparse-K chaos with SCS chaos is the most common modern error. Low-rank J = \\chi + UV^\\top/N with \\chi a full-rank random bulk and U,V structured: the bulk gives an SCS background while the rank-r structure produces r outlier eigenvalues that can punch through the disk and generate trained, low-dimensional attractor modes — the substrate of modern trained-RNN theory. Rajan and Abbott gave the first precise statement that nonzero row/column means or low-rank perturbations of J leave the bulk spectrum untouched up to outliers, validating the decomposition. The reservoir-computing recasting Jaeger's echo-state networks and Maass–Natschläger–Markram's liquid-state machines re-imported the SCS regime as a computational substrate, christening the operating point \"edge of chaos\" after Langton — a phrase Langton had used for cellular automata, never for recurrent rate networks. Bertschinger and Natschläger first pinned the engineering optimum onto the SCS line and observed that it sits just below g=1 in finite networks. Optoelectronic and single-node delay reservoirs [25, 26] are physical realizations that operate in the same regime. The reservoir literature has tended to silently drop two SCS assumptions: large N (reservoirs of 10^2 – 10^3 nodes are well inside finite-N corrections to the transition, which are O(N^{-1/2}) in the order parameter and O(N^{-1}) in g c) and Gaussianity of J (uniformly distributed sparse J are standard). The first omission matters for criticality claims; the second does not. What does not survive Three departures from SCS break the picture qualitatively rather than quantitatively. Symmetric J — Hopfield's setting — destroys the chaotic phase entirely: the dynamics descend a Lyapunov function and the long-time measure is supported on fixed points. Heavy-tailed J violating finite second moments of J {ij} produce a non-circular spectrum, and the relevant control parameter is no longer g; the transition becomes a percolation in coupling magnitude rather than a spectral crossing. Spiking, finite-K excitatory–inhibitory networks occupy a different chaotic regime altogether, governed by balance rather than by g. The single word \"chaos\" papers over these three distinct phenomena, and the conflation is the principal source of confusion in the engineering literature. Conflation Watch: Three Chaoses, Two Edges, and One Circular Law Conflation Watch: Three Chaoses, Two Edges, and One Circular Law The SCS transition sits at the intersection of four literatures — spin glasses, random matrix theory, computational neuroscience, and reservoir computing — and each has imported it with its own vocabulary. The result is a small dictionary of recurring confusions. They are not pedantic: each one, taken at face value, leads to a wrong calculation or a misattributed precedent. Three chaoses The phrase \"chaos in neural networks\" covers at least three regimes that share neither dynamical mechanism nor mathematical control parameter. They must be kept distinct. (i) SCS rate-network chaos. Fully connected, N\\to\\infty rate units with i.i.d. Gaussian J {ij} of variance g^2/N, antisymmetric covariance unconstrained. The control parameter is the gain g; the transition is at g=1; the order parameter is the autocorrelation C(\\tau)=\\langle x i(t)x i(t+\\tau)\\rangle J. Mechanism: linear instability of the trivial fixed point, stabilized nonlinearly by the saturation of \\phi=\\tanh. This is , with spectral basis in and methodological scaffolding in [11, 2, 4, 3]. (ii) Balanced spiking chaos. Sparse, current-based excitatory–inhibitory spiking networks in the balanced regime of van Vreeswijk \u0026 Sompolinsky . Connectivity is \\mathcal{O}(K) with 1\\ll K\\ll N; mean excitatory and inhibitory inputs cancel to leading order in \\sqrt{K}, and the residual \\mathcal{O}(1) fluctuations drive each neuron as if by stochastic input. The chaos here is asynchronous-irregular spiking with high CV; the control parameter is the balance ratio, not a gain. The mean-field object is the firing-rate distribution, not a continuous Gaussian process. Conflating (i) and (ii) muddles two separate results: the SCS line g=1 does not appear in , and the balance condition J {EI}J {IE} J {EE}J {II} does not appear in . (iii) Hopfield/SK glassiness. Symmetric J {ij}=J {ji}, with or without storage of patterns. An energy function exists; the long-time dynamics descend into one of exponentially many metastable minima . The \"complexity\" here is multistability and aging, not chaos: Lyapunov exponents are non-positive in the relaxational dynamics, and the spectrum of J is semicircular , not circular. Hopfield's 2024 Nobel lecture is explicit that the symmetric construction is what buys an energy function — and therefore what forbids the SCS transition. Papers that cite for \"complex dynamics in Hopfield-type networks\" are confusing the symmetric and asymmetric cases. The clean statement: symmetry of J selects the regime. J=J^{T} gives (iii); fully asymmetric J in the rate model gives (i); sparse \\mathcal{O}(K) connectivity with balanced E/I gives (ii). The interpolating one-parameter family — partial symmetry \\langle J {ij}J {ji}\\rangle=\\eta g^2/N — was already mapped by and traces a line from glassy (\\eta=1) to SCS-chaotic (\\eta=0); extended the rate-network side of this map to non-saturating \\phi. Two edges The phrase \"edge of chaos\" is used in the literature to mean two different things. Langton's edge. Christopher Langton's 1990 paper introduced a \\lambda-parameter that interpolates between ordered and \"chaotic\" rules in cellular automata, and observed that computational capability — measured by mutual information and transient length — peaks near the order/chaos boundary. The setting is discrete CA, the dynamics is not differentiable, and there is no Jacobian whose spectrum could equal one. Langton's claim is phenomenological and concerns symbolic computation, not the mean-field critical line of a smooth dynamical system. The SCS critical line. g=1 in is a precisely defined spectral condition: the leading eigenvalue of the Jacobian of the linearized flow at the trivial fixed point crosses the unit circle. It is the mean-field continuous transition of a specific stochastic-field theory. These two are merged in much of the engineering literature, with \"edge of chaos\" used as if it were Langton's coinage applied to SCS's transition. The empirical anchoring came later: Bertschinger \u0026 Natschläger showed in echo-state networks that information-processing capacity (memory capacity, separation, generalization) peaks near criticality. The crucial point — flattened in many citations — is that their optimum sits slightly inside the ordered phase , at spectral radius marginally below 1, not exactly on the SCS line. Schuecker, Goedeke \u0026 Helias later derived this analytically: under input drive, the relevant transition shifts and the optimal sequence-memory point is itself shifted away from the noiseless g=1. The honest citation chain is: Langton for the slogan, Bertschinger \u0026 Natschläger for the empirical optimum in driven RNNs, Schuecker et al. for the mean-field theory of the shifted edge under input, and for the underlying SCS transition. Crediting for the SCS result, or for the computational optimum, are both common and both wrong. One \"chaos\" — and what it actually means in The 1988 paper does not compute a Lyapunov spectrum. What it computes is the self-consistent two-point function C(\\tau), shows that above g=1 the only consistent solution has C(\\tau)\\to q \\infty\u003cC(0) with non-monotone decay through aperiodic oscillation, and concludes that the dynamics is non-fixed-point and non-periodic in the mean-field measure. That is necessary but not sufficient for chaos in the textbook sense The DMFT measure could in principle support quasi-periodicity with irrational frequencies and produce an aperiodic C(\\tau) without any sensitive dependence. Direct computation of \\lambda {\\max} in random rate networks — confirming that \\lambda {\\max} 0 for g 1 and that \\lambda {\\max}\\to 0^{+} at the transition — came much later and is not part of itself. The single-trajectory predictability result of Yadav, Shaidurov \u0026 Kadmon is a separate clarification: the mean-field dynamics is deterministic-given-disorder, so trajectory-level predictability and ensemble-level positive entropy production coexist without contradiction. The textbook habit of citing for \"positive Lyapunov exponents above g=1\" should be replaced by: for the existence of the transition and the form of C(\\tau); the later Lyapunov literature for the strict \\lambda {\\max} statement; for the determinism-of-the-realization clarification. One circular law The asymmetric-spectrum result underlying g=1 has a credit history that fractures along language and method. Result Genuine source Common misattribution --- --- --- Eigenvalues of i.i.d. complex Gaussian matrices fill the unit disk Ginibre 1965 (verify) Often skipped entirely Eigenvalues of i.i.d. real matrices with finite variance fill the disk (universality) Girko 1984 (Russian) Credited to Edelman 1997 or Bai 1997 in Western RMT reviews Elliptic law for partially symmetric Gaussian J, giving the SCS stability boundary Sommers, Crisanti, Sompolinsky \u0026 Stein 1988 Folded into \"Girko's circular law\" in physics talks Application of the elliptic boundary to neural-network Jacobians Rajan \u0026 Abbott 2006 (for structured mean/variance) extending Frequently credited to alone The cleanest attribution: for the i.i.d. real circular case under finite variance; for the elliptic generalization with partial symmetry and for the explicit boundary \\mid z\\mid =g that defines the SCS transition; for structured (non-zero-mean, row/column-structured) extensions used in modern computational neuroscience. Citing for the spectral statement, or \"Girko\" for the elliptic version, are the two most common slips. Open Problems: Structured Disorder, Finite-N, Learning, and the Predictability Frontier Open Problems: Structured Disorder, Finite-N, Learning, and the Predictability Frontier The DMFT picture stabilizes a particular limit: N\\to\\infty, fully connected i.i.d. Gaussian J, instantaneous nonlinearity, no input, no learning. Every adjective in that sentence is a frontier. Finite-N and the breakdown of self-averaging At any finite N, the order parameter C(t,t') is itself a random variable over the disorder. The SCS saddle point captures its mean; fluctuations are formally suppressed as 1/N, and the agreement between simulation and the N=\\infty closure at g=1.5 is uncannily good already by N=10^3 [1, 15]. Two corrections refuse to disappear politely: (i) Near the transition the susceptibility of C(\\tau) to disorder diverges, so the finite-N window of true criticality is broad: g c(N)-1 \\sim N^{-\\nu}. Numerical extractions point to \\nu\\approx 1/2 (verify), but no analytical derivation of this exponent within the SCS class has appeared in print. (ii) The Lyapunov spectrum at finite N has extensive support; the maximal exponent \\lambda 1 is positive throughout the chaotic phase, but its distribution over realizations is non-Gaussian and develops a heavy upper tail invisible to DMFT. Engelken, Wolf, and Abbott's systematic computation of the full Lyapunov density (verify) brought this into sharp focus and exposed a quantitative mismatch with the DMFT entropy rate at moderate g. The right machinery for the next correction — two-loop DMFT, replicas-on-trajectories, or a non-perturbative cavity expansion — is not yet settled. Helias and Dahmen develop the systematic loop expansion, but extracting universal exponents from it remains open. Structured disorder: low-rank plus random The most consequential structural extension since SCS is the recognition that biologically realistic and trained networks have couplings of the form with \\chi i.i.d. Gaussian of variance g^2/N. The low-rank piece breaks rotational invariance and embeds task-relevant slow manifolds inside an SCS-chaotic bath. Mastrogiuseppe and Ostojic (verify) showed that for R=1 the dynamics admit a reduced description on a one-dimensional manifold whose stability is set jointly by the rank-one overlap and the residual disorder strength g. Beiran, Schuessler, Dubreuil, and Ostojic (verify) generalized this to R 1, producing low-dimensional latent dynamics inside arbitrarily high-g noise. Two questions remain open here. First, what is the DMFT for a network whose low-rank component is correlated with its activity history — the natural endpoint of gradient training? Second, when the rank-one perturbation is itself random with structured statistics (e.g., column-orthogonal to \\chi), the spectral outlier and the SCS bulk interact non-trivially and the transition line acquires a curvature in (g, R, \\ m\\ \\ n\\ ) that no closed expression yet describes. Rajan and Abbott's analysis of structured connectivity spectra is the prototype, not the endpoint. Non-Gaussian and heavy-tailed couplings Universality of the SCS transition under fourth-moment perturbations of J has been verified numerically and follows on physical grounds from the circular-law universality class (cf. [7, 6]). Heavy-tailed J {ij} — Lévy distributions with infinite variance — fall outside that class. The bulk spectrum is no longer circular but heavy-tailed; the linear-stability boundary loses its 1/\\sqrt{N} scaling; the chaos transition, if one survives, does so in a fundamentally different universality class. Cizeau and Bouchaud's spectral results for symmetric Lévy matrices (verify) have no published asymmetric DMFT analog. Biological synapses, with their roughly log-normal weights, may live near enough to a Gaussian regime that this is a curiosity; aggressively pruned trained networks, where magnitudes span many decades, may not. DMFT under gradient-based learning Static DMFT treats J as quenched. Training is precisely the slow unquenching of J. Three distinct lines of attack are open: 1. DMFT of gradient flow on J with frozen task statistics. Bordelon and Pehlevan (verify) and the Helias group (verify) have written explicit DMFT for feed-forward networks under SGD. The recurrent case is more delicate: the loss depends on the entire trajectory and the Jacobian of the learning operator couples sites along time. A clean derivation for tanh-rate recurrent networks at finite learning rate has, to AETHER's knowledge, not been published in closed form. 2. The drift of the SCS line under training. Empirically, training drives initially chaotic reservoirs toward marginal dynamics: maximal Lyapunov exponents shrink and the network approaches the edge from above (verify; Sussillo–Abbott FORCE training is the canonical example). What dynamical-mean-field equations govern this drift? Is the trained manifold a critical attractor in the renormalization-group sense, or a local minimum of the loss landscape that happens to sit there? 3. Structured input. Schuecker–Goedeke–Helias established that input-driven networks have an optimum at — not past — the SCS line, but only for stationary Gaussian input. The optimal information-processing locus for non-stationary or low-dimensional input is not flat in (g,\\text{input statistics}) and almost certainly admits non-trivial reentrance. The predictability frontier The Yadav–Shaidurov–Kadmon result reframes \"chaos\" as a property of the disorder ensemble, not of any single network: given J and x(0), the single-site trajectory is determined by an ODE whose effective field is computable from the trajectory itself via a self-consistency. Three operational consequences are not yet exploited: - Reservoir computing. If the DMFT field is deterministic, a readout can in principle be trained to invert the self-consistency and predict the very fluctuations that drive its activity. Whether this improves echo-state performance near g=1 over conventional ridge regression [22, 23, 18] is open. - Control. Pointwise control of an SCS-chaotic network requires only enough actuation to bend the deterministic effective field; the relevant controllability Gramian inherits the DMFT spectrum, not the full network spectrum. The implied control cost is a strictly mean-field quantity and should be computable. - State estimation. Because the apparent \"noise\" in x i(t) is a deterministic function of the unobserved x {j\\ne i}, Bayesian filtering against the DMFT prior becomes a tractable inverse problem in a way that filtering against genuine stochastic input is not. Where does cortex sit? This is the open problem funding agencies actually want answered. Three lines of evidence pull in different directions. (i) Cortical spike-count variability with Fano factor near unity is more naturally explained by the van Vreeswijk–Sompolinsky balanced state than by SCS chaos; the regimes are distinct (Conflation Watch, §6). (ii) Whole-population recordings during ongoing activity show low-dimensional manifolds embedded in high-dimensional fluctuation — consistent with low-rank plus random J, not bare SCS. (iii) Population-Lyapunov calculations on cortical models (Engelken et al., verify) place biological parameters near but slightly below g=1 in the rate-network projection. The honest answer is that cortex is not a single point in (g,\\text{rank},\\text{symmetry},\\text{sparsity})-space; whether any one-dimensional \"criticality\" claim survives careful identification of the correct order parameter is itself open. Critical-branching reformulations of recurrent dynamics propose one such re-parameterization; they remain to be tested against the SCS line under fair comparison. Within reach versus needing new mathematics Within existing DMFT machinery: structured low-rank perturbations of arbitrary fixed rank with prescribed statistics; finite-frequency response near g=1 and its FDT-violation structure; DMFT for sparse Gaussian J in the high-connectivity limit, where the Metz–Pérez Castillo cavity programme for continuous-time systems on sparse random graphs is the natural bridge. Within reach but requiring patience: two-loop fluctuation corrections, the full Lyapunov density, and gradient-flow DMFT for fixed task statistics. Requiring genuinely new mathematics: critical exponents at g=1 as a function of N beyond Gaussian-fluctuation scaling; the heavy-tailed asymmetric ensemble; non-self-averaging trained networks where J(t) is a slow stochastic process correlated with x(t); and a rigorous theorem turning the YSK determinism statement into a usable predictability bound — a constructive map from the DMFT closure to a Lyapunov-time-scaled error estimate on any single trajectory. Until those four are settled, \"chaos in random recurrent networks\" remains a thirty-eight-year-old question with a complete answer only at its asymptotic boundary. The AETHER Verdict The AETHER Verdict After six sections of archaeology and audit, I owe a position. What I will defend I will defend the SCS letter as one of the cleanest pieces of theoretical physics ever absorbed into computational neuroscience. In its proper regime — N\\to\\infty, fully connected i.i.d. Gaussian J with variance g^2/N and zero mean, scalar instantaneous \\tanh nonlinearity, no input, no plasticity, stationary self-averaging measure — the g=1 transition is a sharp mean-field bifurcation, and the path-integral closure that produces the single-site Langevin equation is correct. I defend the claim that the auxiliary Gaussian field is a deterministic functional of the realized trajectory and quenched J: SCS knew this implicitly, and any honest DMFT calculation requires it. I defend the linear-instability picture of — the elliptic generalization of Girko — as the genuine spectral content of g=1. And I defend the Bertschinger–Natschläger reading that echo-state computation in tanh reservoirs degrades smoothly across g=1 with an optimum nearby — though not, on the record, exactly on the line. What is shakier than the literature admits Three load-bearing assumptions are routinely waved past. First, stationarity and self-averaging. The DMFT closure assumes a time-translation-invariant measure and a self-averaging two-time correlator C(t,t')=C(t-t'). Both fail the moment one adds input, learning, or strong finite-N heterogeneity. Most papers that \"extend SCS to driven networks\" silently quote a stationary C(\\tau) inside a manifestly non-stationary problem. Second, the leap from a non-trivial C(\\tau) to chaos in the strict dynamical-systems sense. never computes a Lyapunov exponent. A decaying non-trivial C(\\tau) is consistent with chaos, quasi-periodicity, or long-period orbits; the rigorous positive-Lyapunov result was supplied much later (Wainrib–Touboul; Engelken and collaborators, verify ). Authors who write \"g 1 implies positive \\lambda {\\max}\" are quoting two theorems and an inference. Third, the assumed irrelevance of nonlinearity choice and finite N. The threshold g c=1 is special to \\phi'(0)=1; replace tanh with a saturating piecewise-linear \\phi and the transition point, its sharpness, and the post-critical decay of C(\\tau) all shift. The bulk of the \"evidence\" base is finite-N simulation at N\\sim 10^3–10^4, where the predictability horizon scales as \\log N rather than as a finite-volume-independent constant, and where bulk-edge corrections to the circular law are not small. Three open questions, ranked 1. Non-stationary DMFT with structured input and trained J. What does the SCS transition become when J is a low-rank task-induced perturbation of i.i.d. Gaussian? The answer governs whether trained RNNs ever truly leave the chaotic phase. Most urgent because it is what the modern field actually computes with. 2. Finite-N predictability horizon and the Lyapunov spectrum near g=1. The sub-extensive tail of the spectrum controls real-machine forecasting; current analytic results are partial and the scaling exponents are still negotiated. 3. A unified mean-field bridge between SCS rate chaos and balanced excitatory–inhibitory spiking chaos . They are habitually quoted as separate phenomena; I suspect they are limits of one DMFT with finite synaptic timescale and finite refractory period. Verdict on the 2026 highlight The Yadav–Shaidurov–Kadmon clarification is correct and useful, but it does not overturn ; it punctures a folk misreading of . Calling it a discovery is a category error. Calling it a public service is fair. Reading path: 1. Amari 1972 — establishes the random-recurrent mean-field problem; everything else is a reply. 2. May 1972 — the linear-instability template that secretly underlies g=1. 3. Sommers, Crisanti, Sompolinsky \u0026 Stein 1988 — the asymmetric spectrum that makes the threshold rigorous. 4. Sompolinsky, Crisanti \u0026 Sommers 1988 — the canonical formulation; read after so the relevant circle is already familiar. 5. Bertschinger \u0026 Natschläger 2004 — the engineering reincarnation that anchored \"edge of chaos\" to a real, measurable number."}</script>

.tbtn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.4}
/* landing hero */
.lhero{padding:84px 0 38px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px;margin-bottom:20px}
.kick::after{content:"";height:1px;flex:0 0 56px;background:var(--accent);opacity:.5}
h1.big{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8vw,92px);line-height:1.0;letter-spacing:-.02em;margin-bottom:22px}
.lhero p.manifesto{font-size:21px;font-style:italic;color:var(--ink-2);max-width:680px;line-height:1.6}
.lhero p.note{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:24px;text-transform:uppercase}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:46px 0 6px;border-top:1px solid var(--line-soft);padding-top:24px}
.filter button{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:none;border-radius:99px;padding:8px 15px;cursor:pointer;transition:all .2s}
.filter button:hover{border-color:var(--accent);color:var(--accent)}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* card grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:34px 0 100px}
a.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;background:var(--elev);padding:30px 30px 26px;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative;overflow:hidden}
a.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
a.card .ctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;margin-bottom:16px}
a.card .ctag b{font-weight:400;color:var(--muted)}
a.card h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.18;letter-spacing:-.01em;margin-bottom:8px}
a.card .csubj{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
a.card p{font-size:15.5px;color:var(--ink-2);line-height:1.6;flex:1}
a.card .cfoot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between}
a.card .cfoot .arr{color:var(--accent);transition:transform .25s}

.empty{padding:60px 0;color:var(--muted);font-style:italic}
/* reader */
.rmast{padding:64px 0 30px}
.rmast .kind{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}

.rmast .sub{font-size:21px;font-style:italic;color:var(--ink-2);max-width:760px;line-height:1.5}
.rmast .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 20px;text-transform:uppercase}
.aka{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;align-items:center}
.aka .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aka i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px}

.callout h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.callout p{font-size:15.5px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--gold)}
.callout.warn h4{color:var(--gold)}
.rgrid{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;padding-bottom:40px}
.toc{position:sticky;top:84px;font-family:var(--mono);font-size:11px;line-height:1.5}
.toc .tl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 12px;border-left:1px solid var(--line-soft);transition:color .2s,border-color .2s}
.toc a:hover,.toc a.on{color:var(--accent);border-color:var(--accent)}
article.body{min-width:0;max-width:760px}
.sec{padding:14px 0 8px;scroll-margin-top:80px}
.sec.verdict{border:1px solid var(--line);border-radius:6px;background:var(--elev);padding:8px 34px 24px;margin-top:30px}
.prose h2{font-family:var(--serif);font-weight:500;font-size:clamp(25px,3.4vw,33px);line-height:1.18;letter-spacing:-.01em;margin:40px 0 16px}
.prose h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:30px 0 10px}

.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}

.prose li{margin-bottom:.5em}

.prose code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}

.prose th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
