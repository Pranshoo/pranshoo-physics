field) that SCS will recycle for neural networks.", "who": "Sompolinsky, Zippelius", "work": "'Relaxational dynamics of the Edwards–Anderson model…', Phys. Rev. B 25, 6860", "kind": "formalization", "ref": 2}, {"year": 1984, "event": "Circular law for i.i.d. random matrices (Russian-language priority).", "who": "V. L. Girko", "work": "'Circular Law', Theory Probab. Appl. 29, 694", "kind": "theory", "ref": 7}, {"year": 1987, "event": "Langevin dynamics of asymmetric-bond spin systems — the immediate methodological precursor of SCS88; the same closure, applied to a continuous spherical model.", "who": "Crisanti, Sompolinsky", "work": "'Dynamics of spin systems with randomly asymmetric bonds: Langevin dynamics and a spherical model', Phys. Rev. A 36, 4922", "kind": "theory", "ref": 11}, {"year": 1988, "event": "Spectrum of asymmetric Gaussian matrices computed analytically — gives the linear-stability boundary g=1 used in the chaos paper.", "who": "Sommers, Crisanti, Sompolinsky, Stein", "work": "'Spectrum of large random asymmetric matrices', Phys. Rev. Lett. 60, 1895", "kind": "theory", "ref": 6}, {"year": 1988, "event": "Canonical statement: DMFT closure + asymmetric J yields a continuous transition at g=1 from quiescence to deterministic chaos with aperiodic C(τ).", "who": "Sompolinsky, Crisanti, Sommers", "work": "'Chaos in random neural networks', Phys. Rev. Lett. 61, 259", "kind": "theory", "ref": 1}, {"year": 1990, "event": "Independent 'edge of chaos' coinage in cellular-automata/computation context — later conflated with the SCS transition in the engineering literature.", "who": "Christopher G. Langton", "work": "'Computation at the edge of chaos: Phase transitions and emergent computation', Physica D 42, 12", "kind": "naming", "ref": 24}, {"year": 1996, "event": "Distinct chaotic regime in sparse balanced excitatory–inhibitory spiking networks — establishes the conflation that 'cortical chaos' must be carefully distinguished from rate-network SCS chaos.", "who": "van Vreeswijk, Sompolinsky", "work": "'Chaos in neuronal networks with balanced excitatory and inhibitory activity', Science 274, 1724", "kind": "theory", "ref": 17}, {"year": 2002, "event": "Reservoir-computing revival: the SCS transition is recast as a computationally useful 'edge' for liquid-state machines and echo-state networks.", "who": "Maass, Natschläger, Markram (with parallel work by Jaeger 2001)", "work": "'Real-time computing without stable states', Neural Computation 14, 2531", "kind": "revival", "ref": 23}, {"year": 2015, "event": "Generalization to non-saturating nonlinearities and to networks with quiescent fixed points; sharp characterization of the marginal/chaotic phases and their information-processing properties.", "who": "Kadmon, Sompolinsky", "work": "'Transition to chaos in random neuronal networks', Phys. Rev. X 5, 041030", "kind": "revival", "ref": 15}, {"year": 2018, "event": "DMFT applied to driven random networks: optimal sequence memory occurs at — not beyond — the SCS transition; rigorous derivation of mean-field equations with input.", "who": "Schuecker, Goedeke, Helias", "work": "'Optimal sequence memory in driven random networks', Phys. Rev. X 8, 041029", "kind": "revival", "ref": 16}, {"year": 2026, "event": "Predictable mean-field chaos: explicit demonstration that the DMFT 'noise' is a deterministic functional of the single trajectory — the chaos is fully fixed by the realization of J and the initial condition.", "who": "Yadav, Shaidurov, Kadmon", "work": "'Predictable Mean-Field Chaos in Random Recurrent Networks', arXiv:2606.08805", "kind": "theory", "ref": 14}], "neglected": [{"name": "Shun-ichi Amari", "role": "In 1972 derived the mean-activity, two-point correlation, and stability of fully connected random analog neuron nets — sixteen years before SCS88. Standard accounts of 'chaos in random networks' rarely cite him; the Japanese-language and IEEE-engineering venues kept the work outside the physics canon.", "evidence": "His IEEE SMC paper [51] contains the random-coupling closure for sigmoidal units that SCS later promote to a dynamical functional.", "ref": 8}, {"name": "H. J. Sommers", "role": "Provided the random-matrix expertise behind both the asymmetric-spectrum paper [48] and the chaos paper [47]. Routinely dropped in shorthand citations as 'Sompolinsky–Crisanti'.", "evidence": "Co-authorship on PRL 60, 1895 and PRL 61, 259 within months in 1988; the spectral boundary that defines the transition is Sommers' calculation.", "ref": 6}, {"name": "Robert M. May", "role": "Predicted the g=1 instability threshold in 1972 from a Wigner-style RMT argument about random Jacobians of large dynamical systems. SCS88 is, in linear-stability terms, May's 1972 result extended past the instability.", "evidence": "Nature 238, 413 explicitly shows that a randomly coupled N-species system loses stability when interaction strength exceeds 1/√N.", "ref": 5}, {"name": "Cyrano de Dominicis", "role": "Authored the generating-functional substitute for replicas that the entire DMFT literature — including SCS88 — uses. Cited but rarely emphasized; the technique is more often called 'dynamical mean-field theory' than 'de Dominicis functional'.", "evidence": "Phys. Rev. B 18, 4913 is the immediate ancestor of every random-RNN mean-field derivation through Sompolinsky–Zippelius.", "ref": 3}, {"name": "Annette Zippelius", "role": "Co-developer of the relaxational DMFT for soft-spin spin glasses [50]. Her closure scheme is the template SCS adapt; her name often disappears in the neural-network literature even as 'DMFT' is invoked.", "evidence": "Phys. Rev. B 25, 6860 contains the self-consistent Gaussian effective-field calculation that SCS88 transposes essentially verbatim.", "ref": 2}], "conflations": [{"claim": "The SCS transition is 'chaos' in the strict positive-Lyapunov sense.", "clarification": "SCS88 demonstrated a non-trivial aperiodic two-point correlator C(τ) for the order parameter — sufficient evidence of ergodic, non-fixed-point dynamics, but not a direct Lyapunov spectrum computation. Rigorous Lyapunov-exponent calculations in random rate networks came much later (Wainrib–Touboul; Engelken and collaborators). 'Chaos' in [47] is shorthand for 'finite intensive entropy production in the mean-field measure', not the textbook strange-attractor definition."}, {"claim": "The Gaussian field in DMFT is stochastic noise driving the network.", "clarification": "It is not. The auxiliary field η_i(t) in the dynamical functional is a deterministic functional of the realized trajectory and the quenched J: it carries the same two-point statistics as the recurrent input Σ J_ij tanh(x_j) by construction, but is fixed once J and x(0) are. The mean-field 'stochasticity' is an average over the disorder ensemble, not over dynamics. This is the precise point the 2026 highlight [32] foregrounds."}, {"claim": "Edge of chaos (Langton) = SCS transition at g=1.", "clarification": "Langton's 1990 phrase [56] referred to a λ-parameter scan in cellular automata and to a generic computation-near-criticality intuition; it predates the engineering use in recurrent networks. Bertschinger \u0026 Natschläger 2004 [64] gave the first sharp identification of computational optima with the SCS line in echo-state networks, and even there the optimum often sits slightly inside the ordered phase, not exactly on the critical line."}, {"claim": "'Chaos in neural networks' uniformly refers to the SCS regime.", "clarification": "There are at least three distinct regimes regularly conflated: (i) SCS rate-network chaos with asymmetric Gaussian J [47]; (ii) balanced excitatory–inhibitory spiking chaos in sparse networks [57], driven by deterministic-but-decorrelated input statistics; (iii) attractor-network glassiness with symmetric J (Hopfield/SK lineage), which is multistable but not chaotic. The g, sparsity, and symmetry of J each control a different transition."}, {"claim": "Girko's circular law is the standard reference for the asymmetric spectrum used in the chaos transition.", "clarification": "The result physicists actually use in [47,48] is the Sommers–Crisanti–Sompolinsky–Stein refinement that handles partial symmetry and gives the elliptic generalization; Girko's 1984 paper [3] establishes the i.i.d. circular case in the Russian probability literature, and is often the only Russian-language source citable, but the bridge to the chaos transition was built independently in [48]."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Before 1988: Amari, May, and the Buried Genealogy of Random-Network Chaos", "markdown": "## Before 1988: Amari, May, and the Buried Genealogy of Random-Network Chaos\n\nThe 1988 letter of Sompolinsky, Crisanti and Sommers [1] is short — three pages, two equations, one figure — and reads as a self-contained invention. It is nothing of the kind. By the time the manuscript reached *Physical Review Letters*, every technical ingredient of its argument had been in print for years, sometimes for sixteen. The closure that produces the chaotic order parameter was Sompolinsky and Zippelius's [2]; the functional that justifies the closure was de Dominicis's [3], built on Martin, Siggia and Rose [4]; the random-Jacobian spectrum that locates the instability at $g=1$ was May's [5], sharpened a few weeks before SCS by Sommers, Crisanti, Sompolinsky and Stein [6], itself a continuation of Girko's circular law [7]; and the random analog network — sigmoidal units, all-to-all Gaussian couplings, the very setup of SCS — had been written down and analyzed at the level of mean activity, two-point correlation, and linear stability by Amari [8] in the same year May's stability theorem appeared. The novelty of [1] is real but narrower than the legend: SCS were the first to push the soft-spin DMFT closure of [2] *past the stability line* with *asymmetric* $J$, and to recognize that the resulting non-fixed-point order parameter $C(\\tau)$ was the signature of mean-field chaos rather than of any disordered equilibrium.\n\n### Amari 1972: the random analog network, written down\n\nAmari's 1972 paper [8] is the document the field has worked hardest to forget. The model is\n\n$$\\tau \\dot{x}_i = -x_i + \\sum_{j} J_{ij}\\,\\phi(x_j),\\qquad J_{ij}\\sim \\mathcal{N}(0, g^2/N),$$\n\nwith $\\phi$ a bounded sigmoidal nonlinearity — the same equation that opens SCS88. Amari computed the self-consistent mean activity, derived a Gaussian closure for the two-point correlation by appealing to the central-limit structure of the recurrent sum, and read off the linear-stability condition on a fully random Jacobian. He did not have a dynamical functional, he did not consider asymmetric versus symmetric $J$ as a phase-controlling parameter, and he did not push past the linear instability. But the closure rule — \"treat the recurrent field at each neuron as a Gaussian whose variance is determined self-consistently from the single-site nonlinear response\" — is exactly the rule SCS will elevate to a saddle point of a generating functional fifteen years later.\n\nThe under-citation is severe and structural. Amari published in *IEEE Transactions on Systems, Man, and Cybernetics*, a venue physicists do not read; he wrote in the language of engineering cybernetics; the symmetric Hopfield wave of 1982 swept his work under \"associative memory\" and lost the disordered-asymmetric thread; and by 1988 the natural ancestor of SCS in citation terms was Sompolinsky–Zippelius 1982 [2], which Amari did not write. The historiographical record is unambiguous nonetheless: the random analog recurrent network with Gaussian couplings is Amari's model, and the first self-consistent treatment of its statistics is Amari's calculation [8].\n\n### May 1972: the spectral threshold, without the dynamics\n\nIn the same year, May [5] asked a question phrased in ecology — when does a randomly coupled $N$-species community lose linear stability? — and gave the answer that random-matrix theory now treats as canonical. For a Jacobian $-I + J$ with $J_{ij}$ i.i.d. mean-zero variance $g^2/N$, the eigenvalues of $J$ fill a disk of radius $g$ in the complex plane (the circular law, then a folklore extrapolation of Wigner [9] and Ginibre); stability is lost when $g \\to 1$. This is the *exact* boundary at which SCS locate the chaos transition. May did not have the circular law as a theorem — Girko's proof [7] arrived in 1984, in Russian, and the rigorous asymmetric-Gaussian spectrum that physicists actually cite is the elliptic refinement of Sommers, Crisanti, Sompolinsky and Stein [6] — but the *threshold* is May's, and the fact that the post-instability phase is interesting (chaotic, not merely unstable) is what SCS contribute on top of him.\n\nThe credit audit here is delicate. The folklore \"SCS found that the transition is at $g=1$\" is wrong as a discovery claim and right as a *characterization* claim: May identified the boundary as a linear-stability line; SCS identified it as a *dynamical phase transition*, with $C(\\tau)$ as the order parameter and $g$ as the control. These are different statements about the same number.\n\n### Martin–Siggia–Rose 1973 and de Dominicis 1978: the functional substitute for replicas\n\nThe technical backbone of every random-RNN mean-field calculation written after 1980 is the Martin–Siggia–Rose generating functional [4] — a path integral for classical stochastic dynamics that turns expectation values of trajectory observables into saddle-point problems. As written in 1973, MSR was a formalism for stochastic field theory; it became a tool for *quenched-disorder dynamics* only after de Dominicis [3] showed that a disorder average over a properly normalized MSR functional bypasses replicas entirely. Where the static spin-glass literature was tangled in $n \\to 0$ limits inherited from Sherrington–Kirkpatrick [10], the dynamical literature could march forward with one-replica generating functionals and Gaussian disorder averages that produce a single-site effective theory directly.\n\nDe Dominicis's role is systematically underweighted in the neural-network literature. \"DMFT\" is invoked as if it were a single coherent technique; it is, operationally, the de Dominicis functional with the Sompolinsky–Zippelius closure rule, and the neural-network community tends to cite [2] for both. The cleanest attribution is: functional method, de Dominicis [3] (on MSR [4]); closure for soft spins, Sompolinsky–Zippelius [2]; transposition to asymmetric neural networks, SCS [1].\n\n### Sompolinsky–Zippelius 1982: the closure SCS recycle\n\nThe relaxational dynamics of the soft-spin Edwards–Anderson model [2] is the immediate methodological ancestor of [1]. Sompolinsky and Zippelius wrote the Langevin equation for soft spins with quenched Gaussian couplings, performed the disorder average inside the MSR–de Dominicis functional, and derived a self-consistent equation for the spin–spin correlator with the Gaussian recurrent field replaced by an effective noise of variance fixed by $C(\\tau)$ itself. Their analysis was for *symmetric* $J$ — the spin-glass regime — and produced aging and ergodicity breaking, not chaos. SCS's move was disarmingly simple: keep the closure, drop the symmetry. The same self-consistency, applied to an asymmetric ensemble that has no associated free energy and therefore no equilibrium, has a chaotic solution above $g=1$ and a quiescent solution below.\n\nZippelius is the name most often dropped in shorthand citation, and the omission matters: the closure rule that defines what physicists now call \"DMFT for neural networks\" is hers as much as it is Sompolinsky's.\n\n### Crisanti–Sompolinsky 1987: asymmetry, on a spherical model\n\nThe unambiguous methodological dress-rehearsal for [1] is Crisanti–Sompolinsky 1987 [11]: Langevin dynamics for a continuous (spherical) spin system with *randomly asymmetric* bonds. The closure of [2] is applied with $J$ broken into symmetric and antisymmetric parts, and the resulting effective theory already exhibits the loss of fluctuation–dissipation and the persistent autocorrelations that, on a sigmoidal neural model a year later, will be labeled chaos. Reading [11] and [1] consecutively makes plain that the 1988 letter is the neural-network instantiation of a programme whose mechanics were settled in 1987.\n\n### Sherrington–Kirkpatrick 1975 and the parallel attractor lineage\n\nSherrington–Kirkpatrick [10] sits sideways to this genealogy. It supplies the language — quenched disorder, infinite-range mean field, order parameters extracted from random couplings — without supplying the dynamics; the symmetric SK model has an equilibrium and an energy landscape, and the entire Hopfield programme (and Hopfield's 2024 Nobel lecture [12]) inherits that structure. SCS's transition cannot exist in that lineage: symmetric $J$ forbids it. The honest statement is that random-RNN chaos and Hopfield-style attractor memory are *cousins through SK*, not parent and child; they share statistical mechanics but not phase diagrams.\n\n### What was actually new in 1988\n\nStripped of folklore, the SCS contribution is three things: (i) the recognition that the relevant phase diagram of an asymmetric random neural network has a sharp transition at the May–Sommers–Girko spectral boundary $g=1$; (ii) the identification of the post-instability state as ergodic, aperiodic, finite-entropy mean-field dynamics — *chaos*, not glassy multistability; (iii) the deployment of the Sompolinsky–Zippelius closure inside a de Dominicis functional to produce a self-consistent equation for $C(\\tau)$ that admits an explicit non-trivial solution. Everything else — the model, the closure, the functional, the spectral threshold — was already on the table. The historiographically defensible name is *Amari–May–Sompolinsky–Zippelius–de Dominicis–Sommers–Crisanti–Sompolinsky chaos*; the literature has compressed it to three names, and the compression has cost Amari, Zippelius, de Dominicis, and Sommers most of the credit they are owed."}, {"id": "physics-of-scs-transition", "title": "The Pedagogical Core: DMFT Derivation of the g=1 Transition", "markdown": "## The Pedagogical Core: DMFT Derivation of the g=1 Transition\n\nThe model is deliberately minimal. $N$ rate units obey\n\n$$\\dot{x}_i(t) = -x_i(t) + \\sum_{j=1}^{N} J_{ij}\\,\\phi(x_j(t)), \\qquad i=1,\\dots,N,$$\n\nwith $\\phi=\\tanh$ and quenched i.i.d. couplings $J_{ij}\\sim\\mathcal{N}(0,g^2/N)$ — *no* enforced symmetry, so $J_{ij}$ and $J_{ji}$ are independent. This is the SCS model in [1]; its immediate ancestor is the asymmetric spherical Langevin system of [11], itself a graft of the Sompolinsky–Zippelius closure [2] onto a non-Hermitian disorder ensemble. The goal of this section is to derive, from first principles, the equation for the stationary autocorrelator $C(\\tau)$ and to extract from it the bifurcation at $g=1$.\n\n### 1. MSRJD generating functional\n\nThe Martin–Siggia–Rose / Janssen / de Dominicis path-integral representation [4, 3] writes the disorder-conditioned moment generating functional as\n\n$$Z[\\boldsymbol{\\ell},\\hat{\\boldsymbol{\\ell}}\\,\\mid J] = \\int \\mathcal{D}x\\,\\mathcal{D}\\hat{x}\\,\\exp\\!\\Big( -S_0[x,\\hat{x}] + i\\sum_{ij}\\!\\int\\!dt\\,\\hat{x}_i(t)J_{ij}\\phi(x_j(t)) + \\text{sources}\\Big),$$\n\nwith the noise-free deterministic action\n\n$$S_0[x,\\hat{x}] = -i\\sum_i\\!\\int\\!dt\\,\\hat{x}_i(t)\\big[\\dot{x}_i(t)+x_i(t)\\big].$$\n\nThe response field $\\hat{x}_i$ is purely imaginary along the integration contour; correlators and response functions are obtained by source differentiation. No noise is introduced — the only randomness is the quenched matrix $J$.\n\n### 2. Disorder average\n\nBecause the coupling enters $\\ln Z$ linearly, the Gaussian average over $J$ is exact:\n\n$$\\overline{\\exp\\Big(i\\sum_{ij}\\!\\int\\!dt\\,\\hat{x}_i J_{ij}\\phi(x_j)\\Big)} = \\exp\\!\\Big(-\\frac{g^2}{2N}\\sum_{ij}\\!\\iint\\!dt\\,dt'\\,\\hat{x}_i(t)\\hat{x}_i(t')\\,\\phi(x_j(t))\\phi(x_j(t'))\\Big).$$\n\nAsymmetry kills the cross term $\\hat{x}_i(t)\\hat{x}_j(t')\\phi(x_j(t))\\phi(x_i(t'))$ that would otherwise appear for symmetric $J$; that omission is precisely what permits the order parameter to be a *single* two-point function rather than a coupled (C,R) pair with an FDT-violating response. This is the technical reason the SCS regime cannot occur in the Hopfield/SK lineage [10, 12].\n\n### 3. Decoupling and large-$N$ saddle\n\nIntroduce the empirical order parameters\n\n$$Q_1(t,t') \\equiv \\frac{1}{N}\\sum_j \\phi(x_j(t))\\phi(x_j(t')),\\qquad Q_2(t,t')\\equiv\\frac{1}{N}\\sum_i \\hat{x}_i(t)\\hat{x}_i(t'),$$\n\nand resolve them with conjugate Lagrange multipliers. The action becomes extensive in $N$; at the saddle point ($N\\to\\infty$) the sites factorize and one is left with a single-site stochastic problem\n\n$$\\boxed{\\;\\dot{x}(t) = -x(t) + \\eta(t), \\qquad \\langle \\eta(t)\\eta(t')\\rangle_\\eta = g^2\\,C(t,t'),\\;}$$\n\nwith the self-consistency\n\n$$C(t,t') = \\big\\langle \\phi(x(t))\\phi(x(t'))\\big\\rangle.$$\n\nThe brackets denote an average over $\\eta$, which is itself fixed (in the path-integral sense) by $C$. In a stationary state the saddle is time-translation invariant: $C(t,t')=C(\\tau)$ with $\\tau=t-t'$, and $x(t)$ becomes a zero-mean Gaussian process with covariance $\\Delta(\\tau)\\equiv\\langle x(t)x(t+\\tau)\\rangle$. The crucial conceptual point — emphasized in [13] and made operational in [14] — is that $\\eta$ is *not* a thermal noise; it is the disorder-averaged image of the deterministic recurrent input $\\sum_j J_{ij}\\phi(x_j)$, which for any single realization is a fixed function of the single trajectory.\n\n### 4. Closure: the ODE for $\\Delta(\\tau)$\n\nSolving the linear single-site equation, $\\Delta(\\omega)=g^2 C(\\omega)/(1+\\omega^2)$, equivalently\n\n$$(1-\\partial_\\tau^2)\\,\\Delta(\\tau) = g^2\\, C(\\tau),$$\n\nwhere $C(\\tau)$ is the Gaussian functional\n\n$$C(\\tau) = \\int\\!\\frac{dx_1\\,dx_2}{2\\pi\\sqrt{\\Delta_0^2-\\Delta(\\tau)^2}}\\,\\tanh(x_1)\\tanh(x_2)\\,\\exp\\!\\Big(-\\tfrac{1}{2}(x_1,x_2)\\Sigma^{-1}(x_1,x_2)^{\\!\\top}\\Big),$$\n\nwith $\\Sigma=\\begin{pmatrix}\\Delta_0 \u0026 \\Delta(\\tau)\\\\ \\Delta(\\tau) \u0026 \\Delta_0\\end{pmatrix}$ and $\\Delta_0\\equiv\\Delta(0)$. The functional $C[\\Delta;\\Delta_0]$ is monotone in $\\Delta$ at fixed $\\Delta_0$; this is all the structure the subsequent analysis needs.\n\n### 5. The mechanical analogue\n\nRead $\\tau$ as time and $\\Delta$ as position: the closure is Newton's equation\n\n$$\\ddot{\\Delta}(\\tau) = -U'\\!\\big(\\Delta(\\tau);\\Delta_0\\big),\\qquad U(\\Delta;\\Delta_0) = -\\tfrac{1}{2}\\Delta^2 + g^2\\!\\!\\int_0^{\\Delta}\\!\\!C(\\Delta';\\Delta_0)\\,d\\Delta',$$\n\nwith conserved energy $E=\\tfrac{1}{2}\\dot{\\Delta}^2+U(\\Delta;\\Delta_0)$. Two boundary conditions select the physical orbit:\n\n(i) by $\\tau\\leftrightarrow-\\tau$ symmetry, $\\dot{\\Delta}(0)=0$;\n(ii) in any stationary phase without macroscopic frozen overlap, $\\Delta(\\tau)\\to 0$ and $\\dot{\\Delta}(\\tau)\\to 0$ as $|\\tau|\\to\\infty$.\n\nTogether (i)+(ii) impose $E=U(0;\\Delta_0)=0$ and\n\n$$U(\\Delta_0;\\Delta_0)=0\\;\\;\\Longleftrightarrow\\;\\;\\frac{\\Delta_0^2}{2}=g^2\\!\\!\\int_0^{\\Delta_0}\\!\\!C(\\Delta';\\Delta_0)\\,d\\Delta'.\\qquad(\\star)$$\n\nThis single algebraic condition fixes the static variance $\\Delta_0$ as a function of $g$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eEffective potential U(Delta) at three couplings\u003c/title\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"700\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"380\" y1=\"40\" x2=\"380\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"685\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\"\u003eΔ\u003c/text\u003e\u003ctext x=\"388\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\"\u003eU(Δ;Δ₀)\u003c/text\u003e\u003cpath d=\"M 80 340 Q 230 240 380 340 Q 530 240 680 340\" stroke=\"#7aa2ff\" stroke-width=\"2.2\" fill=\"none\"/\u003e\u003cpath d=\"M 80 340 Q 230 320 380 340 Q 530 320 680 340\" stroke=\"#ffb86b\" stroke-width=\"2.2\" fill=\"none\"/\u003e\u003cpath d=\"M 80 340 Q 230 360 380 340 Q 530 360 680 340\" stroke=\"#7ee0a3\" stroke-width=\"2.2\" fill=\"none\"/\u003e\u003ccircle cx=\"540\" cy=\"340\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"220\" cy=\"340\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003cpath d=\"M 540 340 Q 460 360 380 340\" stroke=\"#7ee0a3\" stroke-width=\"1\" fill=\"none\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"100\" y=\"220\" fill=\"#7aa2ff\" font-size=\"14\"\u003eg \u0026lt; 1: single max at Δ=0,\u003c/text\u003e\u003ctext x=\"100\" y=\"238\" fill=\"#7aa2ff\" font-size=\"14\"\u003eno homoclinic — trivial fixed point\u003c/text\u003e\u003ctext x=\"100\" y=\"305\" fill=\"#ffb86b\" font-size=\"14\"\u003eg = 1: marginal, U″(0)=0\u003c/text\u003e\u003ctext x=\"430\" y=\"382\" fill=\"#7ee0a3\" font-size=\"14\"\u003eg \u0026gt; 1: two zeros at ±Δ₀,\u003c/text\u003e\u003ctext x=\"430\" y=\"398\" fill=\"#7ee0a3\" font-size=\"14\"\u003ehomoclinic orbit Δ(τ) sweeps 0↔Δ₀\u003c/text\u003e\u003ctext x=\"225\" y=\"338\" fill=\"#7ee0a3\" font-size=\"13\"\u003e−Δ₀\u003c/text\u003e\u003ctext x=\"545\" y=\"338\" fill=\"#7ee0a3\" font-size=\"13\"\u003e+Δ₀\u003c/text\u003e\u003c/svg\u003e\n*Figure: The SCS closure as a 1D mechanical problem. The \"particle\" position is the autocovariance $\\Delta(\\tau)$, the \"time\" is the lag $\\tau$. For $g\u003c1$ (blue) the origin is the only zero-energy turning point and $\\Delta_0=0$. At $g=1$ (orange) the well is marginal: $U''(0)=0$. For $g\u003e1$ (green) two zeros at $\\pm\\Delta_0$ appear; the homoclinic orbit that leaves $+\\Delta_0$ at $\\tau=0$, reaches $0$ as $\\tau\\to\\infty$, and is reflected for $\\tau\u003c0$ is the stationary chaotic correlator.*\n\n### 6. The bifurcation\n\nDifferentiating ($\\star$) at $\\Delta_0=0$ and using $\\partial_\\Delta C(0;0)=\\langle\\phi'(x)^2\\rangle_{x=0}=1$ (because $\\tanh'(0)=1$) yields\n\n$$U''(0;0) = -1 + g^2.$$\n\nFor $g\u003c1$ the only zero-energy turning point of $U$ is $\\Delta=0$: the trivial fixed point $x_i\\equiv 0$ is the unique stationary state, and small perturbations decay with correlation time $\\tau_c=(1-g^2)^{-1/2}$. For $g\u003e1$ the curvature flips and the cubic-in-$\\Delta_0$ correction to ($\\star$) (set by $\\partial^2_\\Delta C\\big|_0=\\langle\\phi''(x)^2\\rangle$) generates a smooth second-order branch\n\n$$\\Delta_0 \\;\\sim\\; \\frac{3}{2}(g-1) + \\mathcal{O}\\!\\big((g-1)^2\\big),$$\n\nwith the prefactor depending on the Gaussian moments of $\\tanh$. The autocorrelator $C(\\tau)$ decays from $C(0)=\\langle\\tanh^2(x)\\rangle\\sim\\Delta_0$ to $0$ on a diverging time scale $\\tau_c\\sim(g-1)^{-1/2}$ — the \"soft\" mode of the bifurcation. The transition is continuous, the order parameter is the *variance* of the population, and the broken object is not a symmetry but the trivial fixed point's stability.\n\n### 7. Linear-stability reading: closing the loop to May and Sommers\n\nThe same $g=1$ surfaces in two independent calculations that long predate the closure above. May [5] observed in 1972 that the Jacobian of any large coupled system, when its off-diagonal entries are i.i.d. with variance $g^2/N$, has spectral radius $g$ by a Wigner-style argument; instability of the zero fixed point sets in at $g=1$. Sommers, Crisanti, Sompolinsky and Stein [6] sharpened this in the asymmetric Gaussian case using a Hermitization trick, obtaining the elliptic spectrum whose right edge — for purely asymmetric $J$ — sits exactly at $g$, with Girko's circular law [7] as the i.i.d. limit. The DMFT calculation reproduces $g=1$ as a *nonlinear* statement: ($\\star$) loses its trivial solution because $U''(0)$ changes sign. The two derivations agree at the linear level because $\\phi'(0)=1$; were one to rescale $\\phi\\to\\phi/a$, both the spectral radius and the DMFT threshold would shift to $g=a$ in lockstep. The chaos transition is thus the linear-stability edge of May/Sommers viewed *from the other side* — the side where one does not stop at \"the fixed point is unstable\" but asks what stationary measure the dynamics settles into. The answer, supplied by [1] and refined by [15, 16], is the homoclinic orbit drawn above."}, {"id": "determinism-of-mean-field-noise", "title": "The Anchoring Point: Why the DMFT 'Noise' Is Not Noise", "markdown": "## The Anchoring Point: Why the DMFT 'Noise' Is Not Noise\n\nThe single-site equation that emerges from the SCS calculation is the Langevin-shaped object\n$$\\dot{x}(t) = -x(t) + \\eta(t),\\qquad \\langle \\eta(t)\\eta(t')\\rangle = g^2\\,C(t,t'),\\quad C(t,t') = \\langle \\phi(x(t))\\phi(x(t'))\\rangle,$$\nand the temptation, reinforced by every textbook that abbreviates it as a Langevin equation, is to read $\\eta$ as a stochastic forcing — a Gaussian process pushing the unit around in time. That reading is wrong. It misidentifies the measure over which the angle brackets are taken, and from that misidentification follows a cottage industry of statements about \"noise-induced\" features of random-network chaos. The 2026 paper of Yadav, Shaidurov and Kadmon [14] is best understood as a corrective: it does not introduce a new mechanism, it makes operational a fact already implicit in [1] and used implicitly in [15, 16, 13]. Going through the path-integral derivation is the cleanest way to see why.\n\n### The MSRJD construction, with the disorder average where it actually lives\n\nFor the network $\\dot{x}_i = -x_i + \\sum_j J_{ij}\\phi(x_j)$ with $J_{ij}\\sim\\mathcal{N}(0,g^2/N)$ i.i.d., the Martin–Siggia–Rose [4] / de Dominicis–Janssen [3] generating functional is\n$$Z_J[\\ell,\\hat{\\ell}] = \\int \\mathcal{D}x\\,\\mathcal{D}\\hat{x}\\;\\exp\\!\\left\\{i\\!\\int dt\\,\\hat{x}_i\\!\\left[\\dot{x}_i + x_i - \\sum_j J_{ij}\\phi(x_j)\\right] + i\\!\\int(\\ell x + \\hat\\ell\\hat x)\\right\\}.$$\nTwo facts are essential. First, $Z_J$ is a functional of one fixed realization of $J$; for any such $J$ the equations of motion are deterministic and $Z_J=1$ trivially. Second, the response field $\\hat{x}$ enters linearly in $J_{ij}$, so the average\n$$\\overline{Z}[\\ell,\\hat\\ell] = \\mathbb{E}_J\\,Z_J[\\ell,\\hat\\ell]$$\nis a Gaussian integral over the couplings. Performing it produces a four-field interaction\n$$-\\frac{g^2}{2N}\\sum_{i,j}\\!\\int\\!dt\\,dt'\\,\\hat{x}_i(t)\\hat{x}_i(t')\\,\\phi(x_j(t))\\phi(x_j(t'))$$\nthat decouples after a Hubbard–Stratonovich on the population correlator $C(t,t')=N^{-1}\\sum_j\\phi(x_j(t))\\phi(x_j(t'))$ and the population response $R(t,t')$. The saddle-point at $N\\to\\infty$ collapses to a single-site action whose physical-field sector is exactly the Langevin form above, with $\\eta$ a centered Gaussian process of covariance $g^2 C$. This is the Sompolinsky–Zippelius closure [2] of 1982 transposed from symmetric to fully asymmetric couplings.\n\nThe decisive point is the location of the average. The Gaussian measure on $\\eta$ is the image, under the Hubbard–Stratonovich change of variables, of the Gaussian measure on $J_{ij}$. It is an ensemble average over disorder. There is no time-stochastic process in the original equations and none is introduced. The \"noise\" is the disorder, rewritten in single-site language.\n\n### What $\\eta$ really is for a fixed realization\n\nFor a chosen $J$ and a chosen initial condition $x(0)$, the recurrent input to unit $i$,\n$$\\eta_i(t)\\;=\\;\\sum_{j}J_{ij}\\,\\phi(x_j(t)),$$\nis a deterministic functional of the trajectory: $\\eta_i = \\mathcal{F}_i[J;x(\\cdot)]$. The DMFT result is that, in the $N\\to\\infty$ limit, the single-unit marginal of $\\eta_i(t)$ over the disorder ensemble is Gaussian with covariance $g^2 C(t,t')$, where $C$ is determined self-consistently. That is a statement about the ensemble distribution of a deterministic object. It is not a statement that the object is itself a sample path of a stochastic process. The correlation time of $\\eta$ is the autocorrelation time of $\\phi(x)$ — finite, and in the chaotic phase set by the very dynamics it is supposed to \"drive\". A genuine external Langevin force has none of this structure: its correlation time is independent of $x$ and its realization is independent of $J$.\n\nYadav, Shaidurov and Kadmon [14] anchor this by showing, on individual realizations, that the chaotic mean-field trajectory is reproducible from $(J,x(0))$ alone — no auxiliary random-number stream is needed to integrate the effective single-site equation, because $\\eta$ inherits its values from the same trajectory it generates. In path-integral language this is the trivial observation that the saddle-point equations are deterministic functional equations; in numerical practice it is the non-trivial observation that one can integrate them as such, instead of by Monte Carlo over a fictitious Gaussian process.\n\n### Why this was implicit in SCS and operational by 2015–2018\n\nThe original SCS letter [1] never wrote \"noise\". It worked entirely with the autocorrelation $\\Delta(\\tau)=\\langle x(t)x(t+\\tau)\\rangle$ and obtained the second-order ODE\n$$\\ddot{\\Delta}(\\tau)=\\Delta(\\tau)-g^2 f(\\Delta(\\tau),\\Delta(0)),$$\nwhere $f$ is a Gaussian integral of $\\phi$. The variable here is the disorder-averaged two-point function, not a single trajectory; there is no place for a noise realization to enter. Kadmon and Sompolinsky [15] extended the closure to networks with quiescent fixed points by tracking precisely these moment equations, and Schuecker, Goedeke and Helias [16] wrote the driven version with an external input added to the deterministic single-site equation, separating cleanly the genuine input from the auxiliary $\\eta$. The Helias–Dahmen lecture notes [13] make the construction fully explicit. None of these works treats $\\eta$ as physical noise; the confusion is a reader's, not the literature's.\n\n### What determinism does and does not imply\n\nThree corollaries are routinely mixed up.\n\n*Lyapunov spectra are unaffected.* The maximal Lyapunov exponent $\\lambda_{\\max}(g)$ measured by tangent-vector integration in finite-$N$ networks is positive for $g\u003e1$ and is a property of the deterministic flow on the synaptic realization. Mean-field determinism is what makes $\\lambda_{\\max}$ a meaningful object in the first place: there is a flow whose tangent map can be linearized. The SCS argument, recall, did not compute Lyapunov exponents — it inferred chaos from the non-decay of $\\Delta(\\tau)$ — so nothing about the $\\lambda$ side of the story changes when one re-emphasizes determinism.\n\n*Self-averaging is a separate statement.* \"$C(t,t')$ is self-averaging\" means that the empirical population correlator on a single $J$-realization concentrates onto its disorder average as $N\\to\\infty$. This is what licenses identifying single-site quantities with population quantities and is the structural reason DMFT works. It is independent of whether $\\eta$ is \"noise\": self-averaging holds for the deterministic recurrent input precisely because the law of large numbers acts on the index $j$ in $\\sum_j J_{ij}\\phi(x_j)$.\n\n*Ergodicity in DMFT means something specific.* The closure assumes time-translation invariance of $C$ in the chaotic phase and equates ensemble averages over $J$ with time averages along a single trajectory. This is a structural assumption — empirically supported, not derived — and is what makes the second-order ODE for $\\Delta(\\tau)$ well-posed. The 2026 demonstration of predictability does not undermine it; if anything it sharpens the question, since one can now compare individual realizations against the moment closure rather than against a sampled stochastic process.\n\nRead this way, the \"anchoring point\" is less a new result than a re-anchoring of vocabulary. The DMFT equations describe deterministic chaos in random ensembles. The Gaussian field $\\eta$ is the disorder, dressed in a single-site coordinate system. Treating it as a Langevin force introduces phantom physics — noise-activated escape, stochastic resonance intuitions, dissipation–fluctuation reasoning — none of which has any operational meaning in a system whose only randomness is quenched. The 2026 paper [14] makes this hard to forget by integrating the equations as the deterministic functional equations they always were."}, {"id": "landmark-numerical-and-experimental-evidence", "title": "Landmark Evidence: Simulations, Lyapunov Spectra, and Biological Echoes", "markdown": "## Landmark Evidence: Simulations, Lyapunov Spectra, and Biological Echoes\n\nTheoretical claims about the $g=1$ transition rest on three layers of evidence: direct numerical integration of the network ODEs, dynamical-systems diagnostics (Lyapunov spectra, attractor dimensions, Kolmogorov–Sinai entropies) computed on those trajectories, and indirect signatures in biological recordings that the rate-network model is supposed to caricature. Each layer warrants different epistemic weight, and the literature regularly inflates the third.\n\n### The original SCS simulations\n\nThe 1988 letter [1] reports numerical integration of $N\\sim 200$ rate units with $J_{ij}\\sim\\mathcal{N}(0,g^2/N)$ for several values of $g$, and overlays the simulated autocorrelation $C(\\tau)=\\langle x_i(t)\\,x_i(t+\\tau)\\rangle$ with the self-consistent DMFT prediction. Agreement is good, the supercritical $C(\\tau)$ is aperiodic and decays on a slow $g$-dependent timescale, and the equal-time amplitude $C(0)$ tracks the DMFT curve across the transition. This is what SCS called \"chaos\": the existence of a stationary, non-fixed-point regime with a non-trivial mean-field correlator.\n\nThree caveats sit underneath. First, $N=200$ is small; finite-$N$ corrections to DMFT scale as $1/\\sqrt{N}$ and are visible on the averaging windows SCS used, although the transition's location at $g=1$ is set by the spectrum of $J$ — a quantity whose $N\\to\\infty$ limit is sharp (the circular law of Girko [7] and the asymmetric refinement of [6]). Second, no Lyapunov exponent was computed. The diagnostic was the shape of $C(\\tau)$, not a direct estimate of $\\lambda_1$. Third, an aperiodic two-point function is, in principle, also consistent with quasiperiodic motion on a high-dimensional torus; the DMFT order parameter does not distinguish. The folk reading that \"SCS proved chaos\" therefore mildly overstates what is on the page. SCS proved the existence of a non-fixed-point phase with a self-consistent correlator and named it chaos by good-faith analogy.\n\n### Direct Lyapunov spectra\n\nThe Lyapunov gap took two decades to close. Wainrib and Touboul argued rigorously that the largest exponent in the SCS model is positive throughout $g\u003e1$ and exhibits the scaling $\\lambda_1\\sim(g-1)^2$ near onset, a quadratic threshold that distinguishes the SCS bifurcation from a generic period-doubling route (verify). Engelken, Wolf, and Abbott then computed the full Lyapunov spectrum $\\{\\lambda_\\alpha\\}_{\\alpha=1}^N$ by integrating the tangent dynamics with periodic QR re-orthogonalization (verify), and the empirical picture that emerged is the cleanest the field possesses:\n\n- the spectrum is intensive — $\\lambda_\\alpha=\\Lambda(\\alpha/N)$ approaches a smooth curve as $N\\to\\infty$, so $h_{KS}=\\sum_{\\lambda_\\alpha\u003e0}\\lambda_\\alpha$ and the Kaplan–Yorke dimension $D_{KY}$ are both extensive in $N$;\n- the Kaplan–Yorke dimension grows monotonically with $g$, with $D_{KY}/N$ saturating well below unity, and is quantitatively reproduced by the DMFT correlation time;\n- $\\lambda_1(g)$ matches the analytic prediction from a two-replica DMFT calculation of cross-trajectory decorrelation — the same construction that underlies Kadmon–Sompolinsky [15] and the driven extension by Schuecker, Goedeke and Helias [16].\n\nThis is the load-bearing modern evidence: a theoretical prediction from DMFT compared against direct numerical exponents on the same ensemble, with explicit confirmation that the supercritical phase is deterministic positive-entropy chaos rather than the quasiperiodic alternative the bare $C(\\tau)$ data could not have excluded.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eEmpirical diagnostics of the SCS transition\u003c/title\u003e\u003ctext x=\"360\" y=\"22\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eTwo faces of the same evidence — correlator shape (left), leading Lyapunov apex (right)\u003c/text\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"340\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"60\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"200\" y=\"358\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003elag τ (membrane units)\u003c/text\u003e\u003ctext x=\"22\" y=\"190\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\" transform=\"rotate(-90 22 190)\"\u003eC(τ)\u003c/text\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"60\" y2=\"324\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"200\" y1=\"320\" x2=\"200\" y2=\"324\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"340\" y1=\"320\" x2=\"340\" y2=\"324\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"60\" y=\"340\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"12\"\u003e0\u003c/text\u003e\u003ctext x=\"200\" y=\"340\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"12\"\u003e5\u003c/text\u003e\u003ctext x=\"340\" y=\"340\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"12\"\u003e10\u003c/text\u003e\u003cpath d=\"M 60 320 L 340 320\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpath d=\"M 60 240 Q 140 248, 210 270 T 340 308\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpath d=\"M 60 90 Q 110 130, 175 200 Q 240 260, 340 302\" stroke=\"#ff7a90\" stroke-width=\"2.2\" fill=\"none\"/\u003e\u003ctext x=\"158\" y=\"316\" fill=\"#7aa2ff\" font-size=\"13\"\u003eg = 0.8 (C ≡ 0, quiescent)\u003c/text\u003e\u003ctext x=\"220\" y=\"262\" fill=\"#ffb86b\" font-size=\"13\"\u003eg = 1.2\u003c/text\u003e\u003ctext x=\"78\" y=\"82\" fill=\"#ff7a90\" font-size=\"13\"\u003eg = 2.0 (aperiodic decay)\u003c/text\u003e\u003cline x1=\"430\" y1=\"320\" x2=\"700\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"430\" y1=\"320\" x2=\"430\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"565\" y=\"358\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003ecoupling gain g\u003c/text\u003e\u003ctext x=\"395\" y=\"190\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\" transform=\"rotate(-90 395 190)\"\u003eλ₁ (largest Lyapunov)\u003c/text\u003e\u003cline x1=\"430\" y1=\"320\" x2=\"430\" y2=\"324\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"538\" y1=\"320\" x2=\"538\" y2=\"324\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"646\" y1=\"320\" x2=\"646\" y2=\"324\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"430\" y=\"340\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"12\"\u003e0\u003c/text\u003e\u003ctext x=\"538\" y=\"340\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"12\"\u003e1\u003c/text\u003e\u003ctext x=\"646\" y=\"340\" text-anchor=\"middle\" fill=\"#e8e6e1\" font-size=\"12\"\u003e2\u003c/text\u003e\u003cpath d=\"M 430 320 L 538 320 Q 580 295, 620 215 T 695 92\" stroke=\"#7ee0a3\" stroke-width=\"2.5\" fill=\"none\"/\u003e\u003cline x1=\"538\" y1=\"60\" x2=\"538\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"0.8\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"544\" y=\"74\" fill=\"#e8e6e1\" font-size=\"12\"\u003eg = 1 (May 1972 / Sommers 1988)\u003c/text\u003e\u003ctext x=\"445\" y=\"206\" fill=\"#e8e6e1\" font-size=\"13\"\u003eλ₁ = 0 (linearly stable fixed point)\u003c/text\u003e\u003ctext x=\"588\" y=\"148\" fill=\"#7ee0a3\" font-size=\"13\"\u003eλ₁ ∼ (g − 1)²\u003c/text\u003e\u003ctext x=\"588\" y=\"166\" fill=\"#e8e6e1\" font-size=\"12\"\u003equadratic onset\u003c/text\u003e\u003c/svg\u003e\n*Figure: What SCS measured in 1988 (left) and what Engelken-era simulations finally measured (right). The aperiodic $C(\\tau)$ was consistent with chaos but did not require it; the direct $\\lambda_1(g)$ measurement with its quadratic onset closed that loophole and matches the two-replica DMFT prediction.*\n\n### A different chaos: sparse balanced networks\n\nThe 1996 van Vreeswijk–Sompolinsky paper [17] is frequently cited as the \"biological\" version of the SCS result. It is not. The model is sparse — $K\\ll N$ inputs per neuron with $K\\to\\infty$ in a specific scaling limit — and divides units into excitatory and inhibitory populations. Chaos there arises from a balance condition: mean excitatory and inhibitory drives cancel at order $\\sqrt{K}$, leaving order-one fluctuations that push each unit through threshold irregularly. There is no $g=1$ in the SCS sense; once $K$ is large the balanced solution is generically chaotic, and the chaos is hybrid (continuous between spikes, discontinuous at firing events) so the Lyapunov apparatus must be adapted. The mechanism, the order parameter, and the bifurcation are all different from [1]; only the word survives.\n\nThis matters because empirical biological irregularity — Fano factors near unity, near-Poisson interspike intervals, decorrelated population activity — is explained by balanced-network chaos, not by SCS rate chaos. Confusing the two underwrites the recurrent claim that \"SCS 1988 predicted cortical irregularity,\" which it did not.\n\n### Biological echoes and where the overclaim lives\n\nThe honest list of what rate-network DMFT predicts that is testable in cortex is short. A slow, broadband, low-rank component of population activity in the absence of input, with autocorrelation time longer than the single-unit membrane constant — observed in spontaneous cortical recordings, with the usual confounds. Amplification and aperiodic shaping of weak transient input — observed in preparatory motor and prefrontal activity, modeled by Sussillo and successors using random RNNs near $g=1$. A transition from quiescent to active spontaneous dynamics as effective recurrent gain rises — observed across development, anesthesia depth and arousal state, although the mapping from biological gain to the parameter $g$ is an analogy, not a measurement.\n\nWhat the rate-network theory does *not* deliver — and is sometimes credited with — is the spiking irregularity itself, the millisecond-precision of cortical responses, or any quantitative Fano-factor prediction. Those belong to the balanced family [17], to escape-noise constructions, or to mechanisms outside this lineage. The slogan \"the brain operates at the edge of chaos\" is at best a re-naming of the Bertschinger–Natschläger reservoir result [18], transported across two model classes whose only shared feature is the word \"network\".\n\n### What counts as experiment for a theoretical object\n\nA useful framing: the SCS transition is not a phenomenon in nature but a phenomenon in a precisely specified ensemble. The \"experiments\" that test it are numerical integrations of the same equations from which it is derived — internal-consistency checks of the mean-field closure against finite-$N$ reality, and of the two-replica $\\lambda_1$ calculation against tangent-space Lyapunov measurements. Those checks have largely succeeded. The further claim — that biological cortex realizes the SCS attractor — is a modeling hypothesis, and the strength of evidence for it has not changed much since the irregular-firing analyses of [19]."}, {"id": "evolution-and-supersession", "title": "What Has Been Generalized, What Has Been Replaced", "markdown": "## What Has Been Generalized, What Has Been Replaced\n\nThe 1988 letter [1] makes a small number of structural assumptions: $N\\to\\infty$, fully connected $J_{ij}$ with i.i.d. Gaussian entries of variance $g^2/N$ and zero mean, antisymmetric covariance set to zero (so $\\langle J_{ij}J_{ji}\\rangle=0$), single-neuron timescale fixed to one, and $\\phi=\\tanh$ — odd, monotone, bounded, and saturating with $\\phi'(0)=1$. Each of these has been individually relaxed in the subsequent literature. The point of this section is to be precise about which relaxations leave the canonical result intact, which deform it in controlled ways, and which break the SCS picture qualitatively.\n\n### What survives verbatim\n\nThe DMFT closure itself is robust. The single-site equation\n$$\\dot{x}(t) = -x(t) + \\eta(t),\\qquad \\langle\\eta(t)\\eta(t')\\rangle = g^2\\langle\\phi(x(t))\\phi(x(t'))\\rangle,$$\nand the self-consistent equation for $C(\\tau)=\\langle x(t)x(t+\\tau)\\rangle$, follow from the de Dominicis generating functional [3] on top of Martin–Siggia–Rose [4] under the sole conditions that the off-diagonal $J_{ij}$ are i.i.d. with finite variance, weakly correlated across rows, and that $\\phi$ is bounded and Lipschitz. Gaussianity of $J$ is convenient but not essential: by the standard universality argument for fully connected mean-field theories — equivalently, by the spectral universality that gives the circular law for any i.i.d. ensemble with unit variance and finite fourth moment [7, 6] — the leading-order DMFT equations depend on $J$ only through $g^2 = N\\mathrm{Var}(J_{ij})$. The transition location $g_c=1$ is a property of the linearization $\\phi'(0)=1$ around the trivial fixed point and of the asymmetric-spectrum boundary $|\\lambda|\\le g$ derived in [6]; it does not depend on the saturating tail of $\\tanh$.\n\n### Partial symmetry: the elliptic deformation\n\nThe first controlled extension is partial symmetry. Parametrize\n$$\\langle J_{ij}J_{ji}\\rangle = \\eta\\,g^2/N,\\qquad \\eta\\in[-1,1].$$\nThe asymmetric-spectrum calculation in [6] gives an *elliptic* support\n$$\\frac{(\\mathrm{Re}\\,\\lambda)^2}{(1+\\eta)^2}+\\frac{(\\mathrm{Im}\\,\\lambda)^2}{(1-\\eta)^2}\\le g^2,$$\nalready announced in [6] and the precursor [11]. The linear-stability threshold becomes $g_c(\\eta)=1/(1+\\eta)$. Two limits are instructive: $\\eta\\to 1$ recovers symmetric $J$ (Sherrington–Kirkpatrick territory [10], Sompolinsky–Zippelius dynamics [2]) — no chaos, only glassy relaxation with an energy function; $\\eta\\to -1$ gives antisymmetric $J$ and the spectrum collapses onto the imaginary axis, producing marginal oscillatory phases rather than aperiodic chaos. SCS chaos in the strong sense — finite intensive entropy production with aperiodic $C(\\tau)$ — occupies the interior $\\eta\u003c\\eta^\\ast$, with $\\eta^\\ast$ short of 1.\n\n### Non-saturating $\\phi$ and the quiescent phase\n\nKadmon and Sompolinsky [15] revisited the network when $\\phi$ is allowed to be ReLU-like or, more generally, to have a vanishing gain region. The DMFT closure goes through unchanged; what changes is the structure of the fixed-point manifold and the route to chaos. With $\\phi=\\tanh$, there is a single trivial fixed point $x=0$ for $g\u003c1$, and chaos emerges continuously above $g=1$. With a thresholded or rectified $\\phi$ with quiescent regime $\\phi'\\equiv 0$ on an interval, an entirely silent state coexists with active states, and the transition splits into (i) a quiescent-to-active transition at finite drive and (ii) a chaotic instability of the active phase governed by the *effective* gain $g^2\\langle\\phi'(x)^2\\rangle$ evaluated on the active stationary distribution. This converts the bare $g$ axis into a one-parameter family of effective gains, and recovers the canonical SCS line as a special case. The pedagogically important point: the textbook formula $g_c=1$ holds *as a statement about effective gain*, not bare coupling, the moment one leaves odd-symmetric saturating $\\phi$.\n\n### Driven networks: sequence memory and the shifted transition\n\nSchuecker, Goedeke, and Helias [16] derived the DMFT equations with an explicit driving current $I_i(t)$ — temporally structured, statistically i.i.d. across $i$. Two results matter. First, the deterministic input contributes additively to the single-site Langevin form,\n$$\\dot{x}(t) = -x(t) + \\eta(t) + h(t),$$\nwith $h$ Gaussian with the input statistics. Second, the chaotic instability shifts: input variance $\\sigma_h^2$ moves the effective operating point along the active-stationary distribution, generically *suppressing* chaos by saturating $\\phi$. The headline finding — that optimal sequence memory sits at, not beyond, the chaotic transition — is a clean correction to the older reservoir-computing folklore (see below) that placed the computational sweet spot inside the chaotic phase. Their derivation is also the cleanest modern statement of the full path-integral apparatus and is the de facto reference for the field [13].\n\n### Sparse and low-rank structure\n\nTwo structured-disorder extensions are essential. Sparse $J$ with mean connectivity $K$: provided $K\\to\\infty$ with $N\\to\\infty$, the central-limit step in DMFT survives, the spectral support remains a disk [6], and SCS chaos persists. For finite $K$ — the regime of [17] and of cortical relevance — DMFT fails outright, since the recurrent input ceases to be Gaussian; the sparse-disorder dynamics require cavity methods on tree-like graphs, of which [20] is the continuous-time formulation. Conflating sparse-$K$ chaos with SCS chaos is the most common modern error. Low-rank $J = \\chi + UV^\\top/N$ with $\\chi$ a full-rank random bulk and $U,V$ structured: the bulk gives an SCS background while the rank-$r$ structure produces $r$ outlier eigenvalues that can punch through the disk and generate trained, low-dimensional attractor modes — the substrate of modern trained-RNN theory. Rajan and Abbott [21] gave the first precise statement that nonzero row/column means or low-rank perturbations of $J$ leave the bulk spectrum untouched up to outliers, validating the decomposition.\n\n### The reservoir-computing recasting\n\nJaeger's echo-state networks [22] and Maass–Natschläger–Markram's liquid-state machines [23] re-imported the SCS regime as a computational substrate, christening the operating point \"edge of chaos\" after Langton [24] — a phrase Langton had used for cellular automata, never for recurrent rate networks. Bertschinger and Natschläger [18] first pinned the engineering optimum onto the SCS line and observed that it sits just below $g=1$ in finite networks. Optoelectronic and single-node delay reservoirs [25, 26] are physical realizations that operate in the same regime. The reservoir literature has tended to silently drop two SCS assumptions: large $N$ (reservoirs of $10^2$ – $10^3$ nodes are well inside finite-$N$ corrections to the transition, which are $O(N^{-1/2})$ in the order parameter and $O(N^{-1})$ in $g_c$) and Gaussianity of $J$ (uniformly distributed sparse $J$ are standard). The first omission matters for criticality claims; the second does not.\n\n### What does not survive\n\nThree departures from SCS break the picture qualitatively rather than quantitatively. Symmetric $J$ — Hopfield's setting [12] — destroys the chaotic phase entirely: the dynamics descend a Lyapunov function and the long-time measure is supported on fixed points. Heavy-tailed $J$ violating finite second moments of $J_{ij}$ produce a non-circular spectrum, and the relevant control parameter is no longer $g$; the transition becomes a percolation in coupling magnitude rather than a spectral crossing. Spiking, finite-$K$ excitatory–inhibitory networks [17] occupy a different chaotic regime altogether, governed by balance rather than by $g$. The single word \"chaos\" papers over these three distinct phenomena, and the conflation is the principal source of confusion in the engineering literature."}, {"id": "conflations-and-validity-audit", "title": "Conflation Watch: Three Chaoses, Two Edges, and One Circular Law", "markdown": "## Conflation Watch: Three Chaoses, Two Edges, and One Circular Law\n\nThe SCS transition sits at the intersection of four literatures — spin glasses, random matrix theory, computational neuroscience, and reservoir computing — and each has imported it with its own vocabulary. The result is a small dictionary of recurring confusions. They are not pedantic: each one, taken at face value, leads to a wrong calculation or a misattributed precedent.\n\n### Three chaoses\n\nThe phrase \"chaos in neural networks\" covers at least three regimes that share neither dynamical mechanism nor mathematical control parameter. They must be kept distinct.\n\n**(i) SCS rate-network chaos.** Fully connected, $N\\to\\infty$ rate units with i.i.d. Gaussian $J_{ij}$ of variance $g^2/N$, antisymmetric covariance unconstrained. The control parameter is the gain $g$; the transition is at $g=1$; the order parameter is the autocorrelation $C(\\tau)=\\langle x_i(t)x_i(t+\\tau)\\rangle_J$. Mechanism: linear instability of the trivial fixed point, stabilized nonlinearly by the saturation of $\\phi=\\tanh$. This is [1], with spectral basis in [6] and methodological scaffolding in [11, 2, 4, 3].\n\n**(ii) Balanced spiking chaos.** Sparse, current-based excitatory–inhibitory spiking networks in the balanced regime of van Vreeswijk \u0026 Sompolinsky [17]. Connectivity is $\\mathcal{O}(K)$ with $1\\ll K\\ll N$; mean excitatory and inhibitory inputs cancel to leading order in $\\sqrt{K}$, and the residual $\\mathcal{O}(1)$ fluctuations drive each neuron as if by stochastic input. The chaos here is asynchronous-irregular spiking with high CV; the control parameter is the balance ratio, not a gain. The mean-field object is the firing-rate distribution, not a continuous Gaussian process. Conflating (i) and (ii) muddles two separate results: the SCS line $g=1$ does not appear in [17], and the balance condition $J_{EI}J_{IE}\u003eJ_{EE}J_{II}$ does not appear in [1].\n\n**(iii) Hopfield/SK glassiness.** Symmetric $J_{ij}=J_{ji}$, with or without storage of patterns. An energy function exists; the long-time dynamics descend into one of exponentially many metastable minima [10]. The \"complexity\" here is multistability and aging, not chaos: Lyapunov exponents are non-positive in the relaxational dynamics, and the spectrum of $J$ is semicircular [9], not circular. Hopfield's 2024 Nobel lecture [12] is explicit that the symmetric construction is what buys an energy function — and therefore what forbids the SCS transition. Papers that cite [1] for \"complex dynamics in Hopfield-type networks\" are confusing the symmetric and asymmetric cases.\n\nThe clean statement: symmetry of $J$ selects the regime. $J=J^{T}$ gives (iii); fully asymmetric $J$ in the rate model gives (i); sparse $\\mathcal{O}(K)$ connectivity with balanced E/I gives (ii). The interpolating one-parameter family — partial symmetry $\\langle J_{ij}J_{ji}\\rangle=\\eta g^2/N$ — was already mapped by [11] and traces a line from glassy ($\\eta=1$) to SCS-chaotic ($\\eta=0$); [15] extended the rate-network side of this map to non-saturating $\\phi$.\n\n### Two edges\n\nThe phrase \"edge of chaos\" is used in the literature to mean two different things.\n\n**Langton's edge.** Christopher Langton's 1990 paper [24] introduced a $\\lambda$-parameter that interpolates between ordered and \"chaotic\" rules in cellular automata, and observed that computational capability — measured by mutual information and transient length — peaks near the order/chaos boundary. The setting is discrete CA, the dynamics is not differentiable, and there is no Jacobian whose spectrum could equal one. Langton's claim is phenomenological and concerns symbolic computation, not the mean-field critical line of a smooth dynamical system.\n\n**The SCS critical line.** $g=1$ in [1] is a precisely defined spectral condition: the leading eigenvalue of the Jacobian of the linearized flow at the trivial fixed point crosses the unit circle. It is the mean-field continuous transition of a specific stochastic-field theory.\n\nThese two are merged in much of the engineering literature, with \"edge of chaos\" used as if it were Langton's coinage applied to SCS's transition. The empirical anchoring came later: Bertschinger \u0026 Natschläger [18] showed in echo-state networks that information-processing capacity (memory capacity, separation, generalization) peaks near criticality. The crucial point — flattened in many citations — is that their optimum sits *slightly inside the ordered phase*, at spectral radius marginally below $1$, not exactly on the SCS line. Schuecker, Goedeke \u0026 Helias [16] later derived this analytically: under input drive, the relevant transition shifts and the optimal sequence-memory point is itself shifted away from the noiseless $g=1$. The honest citation chain is: Langton [24] for the slogan, Bertschinger \u0026 Natschläger [18] for the empirical optimum in driven RNNs, Schuecker et al. [16] for the mean-field theory of the shifted edge under input, and [1] for the underlying SCS transition. Crediting [24] for the SCS result, or [1] for the computational optimum, are both common and both wrong.\n\n### One \"chaos\" — and what it actually means in [1]\n\nThe 1988 paper does not compute a Lyapunov spectrum. What it computes is the self-consistent two-point function $C(\\tau)$, shows that above $g=1$ the only consistent solution has $C(\\tau)\\to q_\\infty\u003cC(0)$ with non-monotone decay through aperiodic oscillation, and concludes that the dynamics is non-fixed-point and non-periodic in the mean-field measure. That is necessary but not sufficient for chaos in the textbook sense\n\n$$\\lambda_{\\max}=\\lim_{t\\to\\infty}\\frac{1}{t}\\log\\frac{\\lVert\\delta x(t)\\rVert}{\\lVert\\delta x(0)\\rVert}\u003e0.$$\n\nThe DMFT measure could in principle support quasi-periodicity with irrational frequencies and produce an aperiodic $C(\\tau)$ without any sensitive dependence. Direct computation of $\\lambda_{\\max}$ in random rate networks — confirming that $\\lambda_{\\max}\u003e0$ for $g\u003e1$ and that $\\lambda_{\\max}\\to 0^{+}$ at the transition — came much later and is not part of [1] itself. The single-trajectory predictability result of Yadav, Shaidurov \u0026 Kadmon [14] is a separate clarification: the *mean-field* dynamics is deterministic-given-disorder, so trajectory-level predictability and ensemble-level positive entropy production coexist without contradiction. The textbook habit of citing [1] for \"positive Lyapunov exponents above $g=1$\" should be replaced by: [1] for the existence of the transition and the form of $C(\\tau)$; the later Lyapunov literature for the strict $\\lambda_{\\max}$ statement; [14] for the determinism-of-the-realization clarification.\n\n### One circular law\n\nThe asymmetric-spectrum result underlying $g=1$ has a credit history that fractures along language and method.\n\n| Result | Genuine source | Common misattribution |\n|---|---|---|\n| Eigenvalues of i.i.d. complex Gaussian matrices fill the unit disk | Ginibre 1965 (verify) | Often skipped entirely |\n| Eigenvalues of i.i.d. real matrices with finite variance fill the disk (universality) | Girko 1984 [7] (Russian) | Credited to Edelman 1997 or Bai 1997 in Western RMT reviews |\n| Elliptic law for partially symmetric Gaussian $J$, giving the SCS stability boundary | Sommers, Crisanti, Sompolinsky \u0026 Stein 1988 [6] | Folded into \"Girko's circular law\" in physics talks |\n| Application of the elliptic boundary to neural-network Jacobians | Rajan \u0026 Abbott 2006 [21] (for structured mean/variance) extending [6] | Frequently credited to [1] alone |\n\nThe cleanest attribution: [7] for the i.i.d. real circular case under finite variance; [6] for the elliptic generalization with partial symmetry and for the explicit boundary $\\mid z\\mid =g$ that defines the SCS transition; [21] for structured (non-zero-mean, row/column-structured) extensions used in modern computational neuroscience. Citing [1] for the spectral statement, or \"Girko\" for the elliptic version, are the two most common slips."}, {"id": "frontier-and-open-problems", "title": "Open Problems: Structured Disorder, Finite-N, Learning, and the Predictability Frontier", "markdown": "## Open Problems: Structured Disorder, Finite-N, Learning, and the Predictability Frontier\n\nThe DMFT picture stabilizes a particular limit: $N\\to\\infty$, fully connected i.i.d. Gaussian $J$, instantaneous nonlinearity, no input, no learning. Every adjective in that sentence is a frontier.\n\n### Finite-$N$ and the breakdown of self-averaging\n\nAt any finite $N$, the order parameter $C(t,t')$ is itself a random variable over the disorder. The SCS saddle point captures its mean; fluctuations are formally suppressed as $1/N$, and the agreement between simulation and the $N=\\infty$ closure at $g=1.5$ is uncannily good already by $N=10^3$ [1, 15]. Two corrections refuse to disappear politely:\n\n(i) Near the transition the susceptibility of $C(\\tau)$ to disorder diverges, so the finite-$N$ window of true criticality is broad: $g_c(N)-1 \\sim N^{-\\nu}$. Numerical extractions point to $\\nu\\approx 1/2$ (verify), but no analytical derivation of this exponent within the SCS class has appeared in print.\n\n(ii) The Lyapunov spectrum at finite $N$ has extensive support; the maximal exponent $\\lambda_1$ is positive throughout the chaotic phase, but its distribution over realizations is non-Gaussian and develops a heavy upper tail invisible to DMFT. Engelken, Wolf, and Abbott's systematic computation of the full Lyapunov density (verify) brought this into sharp focus and exposed a quantitative mismatch with the DMFT entropy rate at moderate $g$.\n\nThe right machinery for the next correction — two-loop DMFT, replicas-on-trajectories, or a non-perturbative cavity expansion — is not yet settled. Helias and Dahmen [13] develop the systematic loop expansion, but extracting universal exponents from it remains open.\n\n### Structured disorder: low-rank plus random\n\nThe most consequential structural extension since SCS is the recognition that biologically realistic and trained networks have couplings of the form\n$$J_{ij} = \\chi_{ij} + \\frac{1}{N}\\sum_{r=1}^{R} m_i^{(r)} n_j^{(r)},\\qquad R \\ll N,$$\nwith $\\chi$ i.i.d. Gaussian of variance $g^2/N$. The low-rank piece breaks rotational invariance and embeds task-relevant slow manifolds inside an SCS-chaotic bath. Mastrogiuseppe and Ostojic (verify) showed that for $R=1$ the dynamics admit a reduced description on a one-dimensional manifold whose stability is set jointly by the rank-one overlap and the residual disorder strength $g$. Beiran, Schuessler, Dubreuil, and Ostojic (verify) generalized this to $R\u003e1$, producing low-dimensional latent dynamics inside arbitrarily high-$g$ noise.\n\nTwo questions remain open here. First, what is the DMFT for a network whose low-rank component is *correlated with its activity history* — the natural endpoint of gradient training? Second, when the rank-one perturbation is itself random with structured statistics (e.g., column-orthogonal to $\\chi$), the spectral outlier and the SCS bulk interact non-trivially and the transition line acquires a curvature in $(g, R, \\|m\\|\\|n\\|)$ that no closed expression yet describes. Rajan and Abbott's analysis of structured connectivity spectra [21] is the prototype, not the endpoint.\n\n### Non-Gaussian and heavy-tailed couplings\n\nUniversality of the SCS transition under fourth-moment perturbations of $J$ has been verified numerically and follows on physical grounds from the circular-law universality class (cf. [7, 6]). Heavy-tailed $J_{ij}$ — Lévy distributions with infinite variance — fall outside that class. The bulk spectrum is no longer circular but heavy-tailed; the linear-stability boundary loses its $1/\\sqrt{N}$ scaling; the chaos transition, if one survives, does so in a fundamentally different universality class. Cizeau and Bouchaud's spectral results for symmetric Lévy matrices (verify) have no published asymmetric DMFT analog. Biological synapses, with their roughly log-normal weights, may live near enough to a Gaussian regime that this is a curiosity; aggressively pruned trained networks, where magnitudes span many decades, may not.\n\n### DMFT under gradient-based learning\n\nStatic DMFT treats $J$ as quenched. Training is precisely the slow unquenching of $J$. Three distinct lines of attack are open:\n\n1. **DMFT of gradient flow on $J$ with frozen task statistics.** Bordelon and Pehlevan (verify) and the Helias group (verify) have written explicit DMFT for feed-forward networks under SGD. The recurrent case is more delicate: the loss depends on the entire trajectory and the Jacobian of the learning operator couples sites along time. A clean derivation for tanh-rate recurrent networks at finite learning rate has, to AETHER's knowledge, not been published in closed form.\n\n2. **The drift of the SCS line under training.** Empirically, training drives initially chaotic reservoirs toward marginal dynamics: maximal Lyapunov exponents shrink and the network approaches the edge from above (verify; Sussillo–Abbott FORCE training is the canonical example). What dynamical-mean-field equations govern this drift? Is the trained manifold a critical attractor in the renormalization-group sense, or a local minimum of the loss landscape that happens to sit there?\n\n3. **Structured input.** Schuecker–Goedeke–Helias [16] established that input-driven networks have an optimum *at — not past —* the SCS line, but only for stationary Gaussian input. The optimal information-processing locus for non-stationary or low-dimensional input is not flat in $(g,\\text{input statistics})$ and almost certainly admits non-trivial reentrance.\n\n### The predictability frontier\n\nThe Yadav–Shaidurov–Kadmon result [14] reframes \"chaos\" as a property of the disorder ensemble, not of any single network: given $J$ and $x(0)$, the single-site trajectory is determined by an ODE whose effective field is computable from the trajectory itself via a self-consistency. Three operational consequences are not yet exploited:\n\n- **Reservoir computing.** If the DMFT field is deterministic, a readout can in principle be trained to invert the self-consistency and predict the very fluctuations that drive its activity. Whether this improves echo-state performance near $g=1$ over conventional ridge regression [22, 23, 18] is open.\n- **Control.** Pointwise control of an SCS-chaotic network requires only enough actuation to bend the deterministic effective field; the relevant controllability Gramian inherits the DMFT spectrum, not the full network spectrum. The implied control cost is a strictly mean-field quantity and should be computable.\n- **State estimation.** Because the apparent \"noise\" in $x_i(t)$ is a deterministic function of the unobserved $x_{j\\ne i}$, Bayesian filtering against the DMFT prior becomes a tractable inverse problem in a way that filtering against genuine stochastic input is not.\n\n### Where does cortex sit?\n\nThis is the open problem funding agencies actually want answered. Three lines of evidence pull in different directions. (i) Cortical spike-count variability with Fano factor near unity [19] is more naturally explained by the van Vreeswijk–Sompolinsky balanced state [17] than by SCS chaos; the regimes are distinct (Conflation Watch, §6). (ii) Whole-population recordings during ongoing activity show low-dimensional manifolds embedded in high-dimensional fluctuation — consistent with low-rank plus random $J$, not bare SCS. (iii) Population-Lyapunov calculations on cortical models (Engelken et al., verify) place biological parameters near but slightly below $g=1$ in the rate-network projection. The honest answer is that cortex is not a single point in $(g,\\text{rank},\\text{symmetry},\\text{sparsity})$-space; whether any one-dimensional \"criticality\" claim survives careful identification of the correct order parameter is itself open. Critical-branching reformulations of recurrent dynamics [27] propose one such re-parameterization; they remain to be tested against the SCS line under fair comparison.\n\n### Within reach versus needing new mathematics\n\nWithin existing DMFT machinery: structured low-rank perturbations of arbitrary fixed rank with prescribed statistics; finite-frequency response near $g=1$ and its FDT-violation structure; DMFT for sparse Gaussian $J$ in the high-connectivity limit, where the Metz–Pérez Castillo cavity programme [20] for continuous-time systems on sparse random graphs is the natural bridge. Within reach but requiring patience: two-loop fluctuation corrections, the full Lyapunov density, and gradient-flow DMFT for fixed task statistics.\n\nRequiring genuinely new mathematics: critical exponents at $g=1$ as a function of $N$ beyond Gaussian-fluctuation scaling; the heavy-tailed asymmetric ensemble; non-self-averaging trained networks where $J(t)$ is a slow stochastic process correlated with $x(t)$; and a rigorous theorem turning the YSK determinism statement [14] into a usable predictability bound — a constructive map from the DMFT closure to a Lyapunov-time-scaled error estimate on any single trajectory. Until those four are settled, \"chaos in random recurrent networks\" remains a thirty-eight-year-old question with a complete answer only at its asymptotic boundary."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nAfter six sections of archaeology and audit, I owe a position.\n\n### What I will defend\n\nI will defend the SCS letter [1] as one of the cleanest pieces of theoretical physics ever absorbed into computational neuroscience. In its proper regime — $N\\to\\infty$, fully connected i.i.d. Gaussian $J$ with variance $g^2/N$ and zero mean, scalar instantaneous $\\tanh$ nonlinearity, no input, no plasticity, stationary self-averaging measure — the $g=1$ transition is a sharp mean-field bifurcation, and the path-integral closure that produces the single-site Langevin equation is correct. I defend the claim that the auxiliary Gaussian field is a deterministic functional of the realized trajectory and quenched $J$: SCS knew this implicitly, and any honest DMFT calculation requires it. I defend the linear-instability picture of [6] — the elliptic generalization of Girko [7] — as the genuine spectral content of $g=1$. And I defend the Bertschinger–Natschläger reading [18] that echo-state computation in tanh reservoirs degrades smoothly across $g=1$ with an optimum nearby — though not, on the record, exactly on the line.\n\n### What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely waved past.\n\nFirst, **stationarity and self-averaging.** The DMFT closure assumes a time-translation-invariant measure and a self-averaging two-time correlator $C(t,t')=C(t-t')$. Both fail the moment one adds input, learning, or strong finite-$N$ heterogeneity. Most papers that \"extend SCS to driven networks\" silently quote a stationary $C(\\tau)$ inside a manifestly non-stationary problem.\n\nSecond, **the leap from a non-trivial $C(\\tau)$ to chaos in the strict dynamical-systems sense.** [1] never computes a Lyapunov exponent. A decaying non-trivial $C(\\tau)$ is consistent with chaos, quasi-periodicity, or long-period orbits; the rigorous positive-Lyapunov result was supplied much later (Wainrib–Touboul; Engelken and collaborators, *verify*). Authors who write \"$g\u003e1$ implies positive $\\lambda_{\\max}$\" are quoting two theorems and an inference.\n\nThird, **the assumed irrelevance of nonlinearity choice and finite $N$.** The threshold $g_c=1$ is special to $\\phi'(0)=1$; replace tanh with a saturating piecewise-linear $\\phi$ and the transition point, its sharpness, and the post-critical decay of $C(\\tau)$ all shift. The bulk of the \"evidence\" base is finite-$N$ simulation at $N\\sim 10^3$–$10^4$, where the predictability horizon scales as $\\log N$ rather than as a finite-volume-independent constant, and where bulk-edge corrections to the circular law are not small.\n\n### Three open questions, ranked\n\n1. **Non-stationary DMFT with structured input and trained $J$.** What does the SCS transition become when $J$ is a low-rank task-induced perturbation of i.i.d. Gaussian? The answer governs whether trained RNNs ever truly leave the chaotic phase. Most urgent because it is what the modern field actually computes with.\n2. **Finite-$N$ predictability horizon and the Lyapunov spectrum near $g=1$.** The sub-extensive tail of the spectrum controls real-machine forecasting; current analytic results are partial and the scaling exponents are still negotiated.\n3. **A unified mean-field bridge between SCS rate chaos and balanced excitatory–inhibitory spiking chaos [17].** They are habitually quoted as separate phenomena; I suspect they are limits of one DMFT with finite synaptic timescale and finite refractory period.\n\n### Verdict on the 2026 highlight\n\nThe Yadav–Shaidurov–Kadmon clarification [14] is correct and useful, but it does not overturn [1]; it punctures a folk *misreading* of [1]. Calling it a discovery is a category error. Calling it a public service is fair.\n\n**Reading path:**\n\n1. Amari 1972 [8] — establishes the random-recurrent mean-field problem; everything else is a reply.\n2. May 1972 [5] — the linear-instability template that secretly underlies $g=1$.\n3. Sommers, Crisanti, Sompolinsky \u0026 Stein 1988 [6] — the asymmetric spectrum that makes the threshold rigorous.\n4. Sompolinsky, Crisanti \u0026 Sommers 1988 [1] — the canonical <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
