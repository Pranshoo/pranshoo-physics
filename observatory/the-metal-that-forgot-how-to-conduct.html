<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Metal That Forgot How to Conduct", "alternativeHeadline": "Anderson localization disorder", "name": "Anderson localization disorder", "description": "Anderson localization: a theorem, its diaspora, and the word that escaped its proof", "inLanguage": "en", "keywords": ["Anderson localization disorder", "disorder-induced localization", "strong localization", "Anderson insulator", "Anderson transition (when used for the mobility-edge critical point)", "condensed matter"], "about": [{"@type": "Thing", "name": "Anderson localization disorder"}, {"@type": "Thing", "name": "disorder-induced localization"}, {"@type": "Thing", "name": "strong localization"}, {"@type": "Thing", "name": "Anderson insulator"}, {"@type": "Thing", "name": "Anderson transition (when used for the mobility-edge critical point)"}], "articleSection": "condensed matter", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-metal-that-forgot-how-to-conduct.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-metal-that-forgot-how-to-conduct.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins: Feher's Donors, Anderson's Locator, and the Names That Fell Off the Citation Origins: Feher's Donors, Anderson's Locator, and the Names That Fell Off the Citation The standard one-sentence history reads: Anderson, in 1958, proved that strong disorder localizes electrons; Mott named the mobility edge; the gang of four, in 1979, finished the job with scaling. Every clause in that sentence is wrong in a load-bearing way. The 1958 paper was not about electrons, not about conduction, and not — by its author's own later admission — a proof. The mobility edge was a 1968 phenomenological grafting onto a 1960 Soviet kinematic bound. The \"gang of four\" was a quartet, not a duo, and its empirical backbone was a graduate student whose name the field has quietly let fall away. Before we can read the locator expansion or the \\beta(g) flow honestly, the origin story has to be rebuilt. What Anderson was actually answering The paper that started the field opens with a question posed by George Feher's ENDOR experiments on phosphorus donors in silicon . Feher had measured the relaxation of donor nuclear spins and observed that the spin diffusion, instead of being exponential with the expected donor-donor coupling, was anomalously slow, with relaxation times that ran to hours. The puzzle was not , \"why is the resistivity of doped silicon what it is\" — at the relevant compensations, P:Si is plainly a conductor or plainly an insulator depending on which side of the metal–insulator transition one sits, and that transition was not yet operationalized. The puzzle was: why does a nuclear-polarization profile, prepared at one donor, fail to spread by the dipolar coupling network to its neighbors after an enormous number of natural hopping times? Anderson's title — \"Absence of Diffusion in Certain Random Lattices\" — should be read literally. The model is a single quantum particle (an excitation, originally a flipped spin) on a lattice with random on-site energies \\varepsilon i drawn i.i.d. from a distribution of width W and a fixed hopping t between neighbors: The result is a probabilistic statement about the convergence, with non-zero probability over the disorder, of the locator expansion — the renormalized perturbation series for the self-energy G {ii}(E) that propagates the excitation from site i back to itself along all self-avoiding walks through the lattice. When the typical value of the expansion converges, an eigenstate centered at i remains exponentially confined; spin polarization placed there does not spread. The criterion for sufficiently strong disorder is W/t \\gtrsim K \\ln K for a lattice of coordination K. Anderson himself, in the Nobel lecture two decades later , called the original write-up \"unreadable\" and conceded that no one — including its referees — had taken the locator expansion as a proof in the mathematician's sense; what it gave was a convergence argument for the typical-case self-energy, with the small-probability tails left in a state that the rigorous community would spend twenty-five years cleaning up [4, 5, 6]. Two consequences follow from this re-reading. First, the 1958 paper is not a transport paper. There is no Kubo formula, no conductivity, no Fermi surface. The connection to electrical conduction was made retroactively , by Mott in the late 1960s , when he introduced the mobility edge E c and identified the metal–insulator transition with the Fermi level crossing it. Second, the empirical anchor is Feher's ENDOR data on a magnetic problem — donor nuclear-spin diffusion — and not a resistance measurement. Textbooks routinely present 1958 as theory ex nihilo. Anderson's own framing, both in the paper's introduction and in the Nobel lecture, is unambiguous: Feher's experiments were the trigger. That Feher's name has migrated to a footnote, while \"Anderson localization\" became a noun, is the first credit slippage of the story. The 1D theorem: Mott, Twose, and the proof that Borland actually wrote The folklore \"in one dimension all states are localized for any disorder\" is universally attributed to Mott. The primary reference is the 1961 joint paper of N. F. Mott and W. D. Twose , which advanced the conjecture on the basis of a transfer-matrix sketch in the impurity-band limit. Twose was, at the time, a research student; in the convention of the era his name carried less weight in the field's collective memory, and within a decade the result was being cited as \"Mott's theorem\". It was never Mott's alone, and as stated in 1961 it was a conjecture, not a proof. The first reasonably rigorous derivation belongs to R. E. Borland , who in 1963 analyzed a one-dimensional chain of \\delta-function potentials at random positions by studying products of random transfer matrices. The argument is, in modern language, an early use of Furstenberg's theorem on positivity of Lyapunov exponents — a full decade before that machinery was rediscovered in the mathematical-physics community. Thouless cites Borland approvingly, but briefly; later textbooks elide him entirely. The rigorous capstone — pure-point spectrum and exponential localization for a continuous 1D random Schrödinger operator — is the 1977 theorem of Gol'dsheid, Molchanov, and Pastur . Western reviews that mark 1983, with Fröhlich–Spencer's multiscale proof , as the start of mathematical localization theory are skipping a Soviet paper that is six years older and, in d=1, strictly more general. Ioffe–Regel, not Mott–Ioffe–Regel The kinematic statement that Bloch transport ceases to make sense when the electronic mean free path \\ell becomes comparable to the Fermi wavelength, belongs to A. F. Ioffe and A. R. Regel , in the 1960 Soviet review on non-crystalline substances. The bound is a statement about kinematics: once \\ell \\lesssim 1/k F, the very notion of a momentum eigenstate dressed by weak scattering breaks down. Mott's contribution was the separate phenomenological extrapolation that, at this kinematic boundary, the conductivity attains a finite \"minimum metallic\" value \\sigma {\\min} \\sim e^2/\\hbar a below which no metallic state could exist. The two ideas were grafted into the hyphenated \"Mott–Ioffe–Regel limit\" of modern usage, and \\sigma {\\min} — now largely rejected, contradicted by the cuprates and other bad metals — has dragged the kinematic bound's reputation down with it. The bound itself, properly Ioffe–Regel, still has content; Mott's overload of it does not. The fourth man The 1979 scaling theory is signed by four names: E. Abrahams, P. W. Anderson, D. C. Licciardello, T. V. Ramakrishnan. The colloquial contraction \"AAR\", and the still shorter \"Abrahams–Anderson\", erases Licciardello, who as a Princeton graduate student under Thouless produced the numerical conductance-scaling data on which the single-parameter ansatz \\beta(g) = d\\ln g/d\\ln L rested. The historical preface of 50 Years of Anderson Localization is explicit on this point: the empirical justification for treating the dimensionless conductance g as the sole relevant variable came from Licciardello's Thouless-number computations, not from a field-theoretic argument; Wegner's \\sigma-model arrived in the same year but on a different track. Licciardello left academia shortly after the paper appeared, and the asymmetric afterlives of academic and non-academic authors did the rest. Four neglected names, then, line the entrance to the field: Feher, whose data posed the question; Twose, who co-conjectured the 1D theorem; Borland, who first proved it; and Licciardello, who supplied the scaling theory's numerical spine. The canonical \"Anderson 1958 → gang of four 1979\" headline collapses at least five distinct intellectual events — a magnetic-resonance puzzle, a probabilistic locator argument, a 1D conjecture-and-proof pair, a Soviet kinematic bound, and a numerical-plus-field-theoretic scaling synthesis — into one straight line. Everything that follows in this dossier inherits that compression, and most of the abuses we will catalogue trace back to forgetting which event one is actually invoking. The Physics: From the Locator Expansion to the Single-Parameter Flow The Physics: From the Locator Expansion to the Single-Parameter Flow The 1958 paper sets a single quantum particle on a lattice and asks whether a wavepacket released at site 0 ever escapes. The Hamiltonian is the now-canonical tight-binding form with hopping t {ij}=t on nearest neighbours of a d-dimensional cubic lattice and disorder strength W. There is no interaction, no phonon bath, no magnetic field; the question is purely spectral. Anderson's deliberate choice of uncorrelated site energies, motivated by Feher's ENDOR data on shallow donors in Si , is what gives the model its name and its difficulty: every standard perturbation theory in t/W encounters small denominators of the form (\\varepsilon i - \\varepsilon j)^{-1} which, for nearby site energies, blow up. The locator expansion Anderson's trick is to expand not in t but in the locator g i(E) = (E-\\varepsilon i)^{-1}, the bare site Green's function. The full resolvent matrix element between sites 0 and n admits a renormalised series over self-avoiding paths \\Gamma: 0\\!\\to\\! n, where \\tilde g i(E) = (E - \\varepsilon i - \\Sigma i(E))^{-1} carries a self-energy collecting all loops attached at i. A wavepacket fails to diffuse — the eigenstate at energy E is localized around the origin — iff this series converges with probability one and the typical decay is exponential, G {0n} \\sim e^{-n/\\xi(E)}, with \\xi(E) the localization length. Anderson's heuristic convergence criterion replaces the random products by their typical (geometric-mean) value. A path of length L on a lattice with coordination Z contributes a factor \\sim (Zt/W)^L times L small denominators, each typically \\sim W. After resumming over \\sim Z^L paths and demanding the typical term shrink, one obtains the criterion the famous logarithm that makes the bound non-trivial. This is not a theorem. Two well-known holes: (i) replacing products of random variables by their typical value is a uniform-convergence statement and ignores the rare large denominators that, in fact, dominate the mean Green's function; (ii) the self-avoidance constraint introduces correlations between segments that the multiplicative ansatz silently breaks. Anderson himself flagged the argument as \"almost certainly correct in the convergent regime, but for entirely the wrong reason\" in his Nobel lecture , and noted that the original 1958 manuscript was \"unreadable\" . The two strands of rigorous follow-up — multiscale induction and the fractional-moment method — fix exactly these two holes, the former by controlling rare resonances inductively over length scales, the latter by working with \\mathbb{E}\\!\\left[ G {0n} ^s\\right] for s\u003c1, where products of small denominators are integrable. The numerical value of W c/t at the band centre for the 3D cubic Anderson model lands at \\approx 16.5 from modern transfer-matrix and shift-invert studies — not far from the original locator estimate \\sim 2 Z e \\ln(\\text{stuff}), which is the genuinely surprising part of the heuristic. Thouless: from heuristic to scaling variable The 1958 picture is qualitative; what made it computational was Thouless's reformulation in the early 1970s . Take a finite cube of side L. Two energy scales live on it: - \\Delta E(L) = 1/[\\rho(E F) L^d], the mean level spacing at the Fermi energy; - \\delta E(L), the Thouless energy — the typical shift of an eigenvalue when boundary conditions are changed from periodic to antiperiodic. A delocalized eigenstate at scale L feels the boundary; a localized one does not. The dimensionless ratio is the Thouless number . Two independent calculations show that g(L) is — up to a constant — the dimensionless DC conductance G(L)/(e^2/h) of the same cube: \\delta E is set by the inverse diffusion time \\hbar D/L^2, and the Einstein relation gives G = e^2 \\rho D L^{d-2}, hence g \\propto G \\cdot h/e^2. So a spectral sensitivity is identified with a transport observable. This is what turned the locator-expansion regime (g\\ll 1, exponentially small wavefunction overlap with the boundary) into something one could measure and compute, and it is the engine of every later scaling argument. Figure: One-parameter scaling flow of Abrahams–Anderson–Licciardello–Ramakrishnan . Sign of \\beta(g) is the sign of d\\ln g/d\\ln L: \\beta 0 flows to a metal, \\beta\u003c0 to an insulator. Only d=3 admits an unstable fixed point g^\\ — the mobility-edge transition. In d=2 the curve sits entirely below zero, the signature prediction of the gang-of-four paper. The single-parameter flow The 1979 paper makes one bold ansatz: under a change of scale L\\to bL, g(bL) depends on L only through g(L). Then is a function of g alone, and its two asymptotes are fixed by physics one already trusts: - Ohmic regime, g\\to\\infty. Conductance scales as G = \\sigma L^{d-2} with \\sigma the bulk conductivity; hence \\beta(g)\\to d-2. - Strongly localized regime, g\\to 0. Exponential decay g(L)\\sim g 0 e^{-L/\\xi} gives \\beta(g)\\to \\ln(g/g 0), strictly negative. A smooth monotonic interpolation between these limits — the only piece that is assumed rather than derived — yields the celebrated qualitative picture. In d=1, \\beta(g) is negative everywhere, recovering the Mott–Twose–Borland result [8, 9] that all states are localized at any disorder. In d=3, \\beta crosses zero at an unstable fixed point g^\\ , which is the mobility edge of ; flow above g^\\ produces a metal, flow below it an insulator. The signature prediction is d=2: \\beta\\to 0^- from below as g\\to\\infty, so the marginal dimension sits just on the insulating side, and weak-localization corrections drive even a \"good metal\" to logarithmic insulating flow at large L in the orthogonal class. Three caveats the 1979 paper does not carry on its sleeve. First, single-parameter scaling is a hypothesis, sharpened later by Wegner's σ-model derivation in which the dimensionless coupling of a non-linear σ-model on a non-compact symmetric space is the renormalised conductance, and one-loop RG reproduces \\beta(g)=d-2-c/g+\\dots with c depending on the symmetry class. The orthogonal class gives c=2/\\pi; the unitary class has c=0 at one loop (no weak-localization correction); the symplectic class has c=-1/\\pi, positive \\beta at large g in 2D, and therefore a genuine 2D metal–insulator transition. The popular slogan \"all states in 2D are localized\" applies only to the orthogonal class of non-interacting electrons. Second, the flow is in g, which is a typical conductance; the full distribution P(\\ln g) broadens without bound on approach to the insulator, and the \"single parameter\" describes only its location, not its width. Numerical work since the 1990s has confirmed single-parameter scaling for the median of \\ln g but not for higher cumulants. Third, interactions are absent. The 1985 review of Lee and Ramakrishnan catalogues the Altshuler–Aronov logarithmic corrections that, in 2D, are of the same order as the weak-localization correction and have the opposite sign in some channels, so even the orthogonal-class scenario is only the non-interacting skeleton of the real problem. The locator expansion does not see any of this; Thouless's g does, but only if one is willing to redefine it operationally in terms of the actual measured conductance — which, as a matter of practical magnetotransport, is what every subsequent experimental test of the gang-of-four prediction has done. Formalization: σ-Models, Symmetry Classes, and the Rigorous Pillars Formalization: σ-Models, Symmetry Classes, and the Rigorous Pillars The 1958 locator expansion and the 1979 scaling flow are physics arguments: they assume what they want to compute (self-energies that do not feed back, a single scaling variable that does not fragment) and verify the assumption a posteriori. Between 1977 and 1993 the field acquired two genuinely rigorous backbones — a field theory whose symmetries dictate universality classes, and a probabilistic apparatus that proves exponential localization as a theorem. Neither backbone fully meets the other in the middle; the σ-model is non-rigorous as a measure, the multiscale machinery says nothing about the metallic phase. Treat them as complementary, not unified. Wegner's reformulation: the non-compact σ-model Wegner's 1979 paper does for localization what Hubbard–Stratonovich had done for magnetism: it converts a disorder average over Green's functions into a functional integral whose slow modes form a sigma-model on a symmetric space. The starting object is the two-particle Green's function whose low-frequency, long-distance limit controls the diffusion pole. After replicating (n copies) or supersymmetrizing, integrating out the disorder, and saddle-pointing the resulting matrix field Q, one obtains an action of the form The constraint Q^{2}=\\mathbb{1} forces Q onto a coset G/H — for the orthogonal (TRS, no SO) class this is \\mathrm{O}(2n,2n)/\\mathrm{O}(2n)\\times\\mathrm{O}(2n) in the replica trick, \\mathrm{OSp}(2,2 2)/\\mathrm{OSp}(2 1)\\times\\mathrm{OSp}(2 1) in Efetov's supersymmetric reformulation. The crucial word is non-compact : the boson sector of Q lives on a hyperboloid, not a sphere, because the relevant bilinear is G^{R}G^{A} with opposite-signed retarded/advanced contour pieces. Compactify by accident — as the early replica literature occasionally did — and one loses the diffusion mode entirely. Wegner's conjecture, made explicit at the end of , is the now-canonical β-function where the 1/g correction's sign is fixed by the symmetry class: a 0 (orthogonal) gives the AALR insulating flow in d=2 ; a=0 (unitary, broken TRS) admits a quantum-Hall-style line of extended states; a\u003c0 (symplectic, strong spin–orbit) reverses the flow and produces a genuine d=2 metal–insulator transition. Wegner had the three classes — orthogonal, unitary, symplectic — at the field-theoretic level before Altland and Zirnbauer extended the count to ten by adding particle-hole and chiral involutions (verify, for the 1997 AZ paper, which is not in the corpus). The three \"Wigner–Dyson\" classes are not numerology; they are the three real forms of the symmetric space compatible with the time-reversal and spin-rotation symmetries of a single-particle Hamiltonian, and the σ-model inherits them by construction. What Wegner's program proves: the structure of perturbation theory, the existence of universal beta-functions at each loop order, and — assuming a single relevant coupling — the dimensional dependence of the localization length exponent \\nu. What it does not prove: that the σ-model partition function is a legitimate object beyond formal manipulation, that the saddle is unique, or that strong-coupling fixed points exist as anything more than a name for the divergence of perturbation theory. The σ-model is the language in which one states universality; rigor enters elsewhere. Gol'dsheid, Molchanov, Pastur 1977: the Soviet pillar the textbooks skip The first complete theorem of Anderson-localization type is Gol'dsheid–Molchanov–Pastur : for the continuous one-dimensional random Schrödinger operator -\\partial {x}^{2} + V(x) with V a stationary stochastic process of sufficiently mixing type, the spectrum is pure point with probability one, and the eigenfunctions decay exponentially at a rate equal to the Lyapunov exponent of the associated transfer matrix. The proof rides on Furstenberg's theorem on products of i.i.d. matrices in \\mathrm{SL}(2,\\mathbb{R}): under non-compactness and irreducibility hypotheses, the Lyapunov exponent \\gamma(E) = \\lim {L\\to\\infty} L^{-1} \\ln \\ T {L}\\cdots T {1}\\ is strictly positive almost everywhere in E, which by Oseledets' theorem forces a one-dimensional contracting subspace at each energy — the localized eigenfunction. This pre-dates Fröhlich–Spencer by six years and is, in 1D, more general: it handles continuous potentials, not just discrete tight-binding, and arbitrary stationary disorder, not just i.i.d. Western reviews routinely date \"rigorous Anderson localization\" from 1983; the omission has been documented by Kunz, Souillard, and Bourgain among others. Borland's 1963 argument is in the same lineage — products of random matrices on \\mathrm{SL}(2) — but stops short of a measure-theoretic statement about spectrum. The 1977 paper is where the words \"pure point spectrum\" become a theorem. What proves: complete localization in d=1 for a wide class of stationary disorders, with explicit identification of the inverse localization length as the top Lyapunov exponent. What it does not prove: anything in d\\ge 2 (Furstenberg machinery is intrinsically one-dimensional; \\mathrm{SL}(2) has no useful higher analogue) and nothing about the mobility edge, which requires energy-resolved estimates the Lyapunov framework does not supply. Fröhlich–Spencer 1983: multiscale analysis in all dimensions Fröhlich and Spencer gave the first theorem valid in arbitrary dimension for the lattice Anderson Hamiltonian H = -\\Delta + \\lambda V {\\omega} with i.i.d. on-site V {\\omega} of bounded density. The statement: for \\lambda sufficiently large, or for energies E sufficiently far into the Lifshitz tails (band edges), the resolvent (H-E-i0)^{-1}(x,y) decays exponentially in x-y with probability one, uniformly in the system size. From resolvent decay one extracts dynamical localization and pure-point spectrum via standard arguments (Simon–Wolff, RAGE). The proof technique — multiscale analysis — is an induction on length scales L {k+1} \\sim L {k}^{\\alpha} with \\alpha\\in(1,2). At each scale one establishes a \"good box\" probability: the resolvent on a box of side L {k} decays exponentially except with probability \\le L {k}^{-p}, conditional on a Wegner estimate \\Pr[\\mathrm{dist}(\\sigma(H {L}),E)\u003c\\epsilon] \\le C \\epsilon L^{d}. The inductive step glues good boxes using a deterministic resolvent identity and Combes–Thomas decay outside resonances. The whole apparatus is engineered to defeat the small-denominator problem of Anderson's original locator expansion — the very issue handled only probabilistically. What proves: exponential decay of eigenfunctions in any d, but only in the strong-disorder or band-edge regime. What it does not prove: anything about the localization–delocalization transition in d\\ge 3 at moderate disorder, where the predicted mobility edge would live; nor anything about extended states. The metallic phase in d=3 remains, as of the corpus's date range, mathematically open. Anderson's 1958 conclusion (states localized for large W/t) is now a theorem; his 1958 transition (a mobility edge at intermediate W/t) is not. Aizenman–Molchanov 1993: the fractional-moment shortcut Aizenman and Molchanov replaced multiscale induction with a single-scale a-priori estimate on fractional moments of the Green's function. For s\\in(0,1), with \\mu 0 once disorder is strong enough, follows from a self-consistent inequality on the lattice combined with the elementary observation that fractional moments of G are finite even though G itself is heavy-tailed. From the moment bound, exponential decay of eigenfunctions and dynamical localization follow more or less directly via Chebyshev and a Borel–Cantelli argument. The proof is short (a few pages), the constants are tracked, and the technique extended to random Schrödinger operators with unbounded potentials and to certain quantum graphs. The trade-off: requires either large disorder or extreme energies, just like . It does not reach into the band centre at moderate disorder any more than multiscale does. The two methods have complementary strengths — fractional moments give sharper decay constants and extend to long-range hopping; multiscale survives weaker regularity assumptions on the disorder distribution — but they prove the same class of statements about the same regime. The Anderson model at d=3, W/t \\sim W {c}, sits outside both. Where the pillars do and do not meet The σ-model provides the vocabulary of universality — symmetry classes, β-functions, critical exponents — but no theorems about the underlying lattice problem. The probabilistic methods provide theorems — pure-point spectrum, exponential decay — but only in regimes (strong disorder, band tails, d=1) where universality is least at stake. The interesting middle, where the mobility edge actually lives and where the σ-model's irrelevant operators were supposed to be irrelevant, has no rigorous account. When a paper writes \"by Anderson localization,\" ask which pillar is being invoked: a 1979 scaling diagnosis, a 1977/1983/1993 theorem, or — most often — neither. Landmark Experiments: From P:Si to Photons, Microwaves, and Cold-Atom Speckle Landmark Experiments: From P:Si to Photons, Microwaves, and Cold-Atom Speckle The theorem of is about a single non-interacting quantum particle on a static disordered lattice in a time-reversal-symmetric Hamiltonian. Anything else — finite-temperature electrons in a real semiconductor, classical waves in a turbid medium, an interacting many-body wavefunction — shares the words \"exponential profile\" with the 1958 model but may not share its content. The experimental record falls into two piles: experiments that cleanly probe the non-interacting orthogonal universality class, and experiments that wear the name \"Anderson localization\" while carrying additional physics that the 1958 theorem says nothing about. The audit matters because the symbols agree across the divide while the conclusions do not. Feher's donors: the anchor that wasn't a localization experiment Feher's electron–nuclear double resonance (ENDOR) work on P:Si is, by Anderson's own account in , the empirical trigger for . What Feher measured was the contact hyperfine coupling of individual ^{31}\\mathrm{P} donor electrons to surrounding ^{29}\\mathrm{Si} nuclei — an envelope of the donor wavefunction with sub-lattice resolution. The point that lit Anderson's argument was not that the wavefunction was localized (an isolated donor in a deep central-cell potential is bound anyway) but that spin diffusion among donors via flip-flop processes shut down past a critical disorder, even though the spin-bearing electrons had energetically accessible neighbours. Feher's experiment is therefore the empirical seed of the locator expansion , not a measurement of an Anderson mobility edge. Modern textbooks that present as a transport prediction inverted by read history backwards. Si:P: the canonical electronic transition, and the exponent that wouldn't sit still Uncompensated Si:P, stress-tuned across the metal–insulator transition by Rosenbaum, Thomas, Paalanen and collaborators (1980–83), is the closest the solid state ever came to a controlled Anderson MIT in a real electron system. The conductivity at T \\to 0 followed \\sigma(n) \\propto (n/n c - 1)^\\nu with \\nu \\approx 0.5 — sharply at odds with the orthogonal scaling-theory expectation \\nu \\approx 1 deriving from . Compensated Si:P,B gave \\nu \\approx 1. Stupp, von Löhneysen and collaborators (1993) then argued that the \\nu = 1/2 figure was an artefact of an over-narrow critical window; isotopically purified ^{28}Si:P measurements by the Itoh group in the 2000s settled toward \\nu \\approx 1. The episode is the cleanest cautionary tale in the field: even in the textbook electronic MIT, the Coulomb interaction enters at the same order as disorder, so the experiment probes the Anderson–Mott fixed point of , not the universality class. Calling Si:P \"the\" Anderson transition is a generic shorthand worth resisting. Figure: experimental landmarks plotted by dimensionality (x) and strength of interactions/nonlinearity (y). Only the green points realize the universality class directly; orange ones add nonlinearity or absorption; red ones are common but inaccurate uses of the label. Microwave waveguides: the cleanest single-particle realization in the lab A scalar Helmholtz equation [\\nabla^2 + (\\omega/c)^2\\varepsilon(\\mathbf{r})]\\psi = 0 with disordered \\varepsilon is mathematically a one-particle Schrödinger problem in the orthogonal class, without interactions or thermal averaging. Microwaves in quasi-1D copper waveguides loaded with random scatterers — Genack, Chabanov, Stoytchev and collaborators from the late 1990s onward — gave the field its purest single-particle data. Transmission statistics P(T) exhibited the predicted crossover from Gaussian to log-normal as g = \\langle T \\rangle dropped below unity; the universal conductance-fluctuation regime (g \\gg 1) and the localized regime (g \\ll 1) were both attained on the same sample by tuning frequency. These experiments verified the Thouless-conductance scaling variable of in a setting that the theorem genuinely covers. Absorption, the perennial nuisance, was disentangled by comparing time-of-flight tails with the dynamic single-parameter scaling theory. Photonic lattices: classical, but watch the nonlinearity predicted that a sufficiently disordered dielectric near a Bragg pseudogap should localize light by the same mechanism as electrons. Direct optical demonstration required two-dimensional disordered photonic lattices in which a probe beam is launched at a single waveguide and its transverse spreading recorded — Schwartz, Bartal, Fishman, Segev (Nature 2007) is the standard reference, with the Silberberg group at Weizmann (Lahini et al. ) providing the 1D Aubry–André analogue. These are genuine orthogonal-class experiments at low intensity . Crank the input power up and the Kerr nonlinearity turns the system into a discrete nonlinear Schrödinger lattice, where \"localization\" is in part nonlinear self-trapping — a distinct phenomenon that the 1958 theorem does not cover. The disordered-core \"Anderson fibers\" reviewed in are bona fide transverse-localization devices for image transport, but their physics merges 2D AL with longitudinal propagation and modal coupling. Cold-atom matter-wave speckle: the cleanest direct profiles The 2008 Nature duo — Billy et al. (Institut d'Optique) for a 1D Bose–Einstein condensate expanding into a laser-speckle potential, and Roati et al. (Florence) for the Aubry–André transition in a bichromatic lattice — measured the exponential envelope of localized matter-wave packets directly. The speckle experiment in particular is single-particle to a controlled degree: the BEC is allowed to expand until the inter-atomic interaction energy is below the disorder scale, after which the cloud evolves as approximately independent particles in a random potential. 3D mobility-edge experiments — Kondov et al. (Illinois, 2011) and Jendrzejewski et al. (Palaiseau, 2012) — extracted a critical energy above which atoms escaped diffusively, with subtle complications from the non-Gaussian energy distribution of the expanding cloud and from anisotropic speckle statistics. These are the closest the field has come to a controlled 3D Anderson transition in the orthogonal class. Ultrasound and other classical waves Hu, Strybulevych, Page, Skipetrov, van Tiggelen ( Nature Phys. 2008) reported 3D ultrasound localization in disordered networks of aluminium beads, with transverse confinement of the diffuse halo as the smoking gun. As notes in its retrospective, classical-wave experiments are essential precisely because they sidestep the interaction problem that contaminates every solid-state attempt. Where the label is used loosely Three usages should be treated with caution. (i) \"Anderson localization\" is sometimes invoked for bound states of correlated random media — e.g. hyperuniform or short-range-correlated dielectrics — where the mobility-edge concept is borrowed without the underlying assumption of i.i.d. disorder. (ii) Trapped-ion and ultracold-atom emulators of many-body localization (Schreiber et al. , Smith et al. , mid-2010s) are routinely presented as \"interacting Anderson localization\", but as the conflations table makes explicit they probe Fock-space localization, whose existence in the thermodynamic limit is contested . (iii) Cuprate and pnictide transport above the Mott–Ioffe–Regel bound is occasionally framed as \"incipient Anderson localization\"; the inelastic scattering rate that defines k F\\ell \\sim 1 in those materials has nothing to do with the static disorder of . The honest summary: the cleanest verifications of the 1958 theorem are not in the electronic systems that motivated it. Microwaves, photons at low intensity, expanding cold atoms, and ultrasound do the work that Si:P could never quite finish. Use and Abuse: Exponential Tails Are Not Theorems Use and Abuse: Exponential Tails Are Not Theorems The 1958 theorem proves a precise statement about a precise object. The phrase \"Anderson localization\" has since been pasted onto a wide class of exponentially decaying intensity profiles in which one or more of the theorem's premises is silently absent. Most of these usages are not wrong because the underlying physics is fake; they are wrong because the cited authority does not cover them. This section catalogs the recurring abuses. The hypotheses one is allowed to invoke when writing \"by Anderson localization\" are: (a) a single quantum particle; (b) on a lattice (or in a continuum) with uncorrelated on-site disorder drawn i.i.d. from a bounded distribution; (c) a time-reversal-symmetric , spin-rotation-invariant Hamiltonian (Wigner–Dyson orthogonal class); (d) no interactions ; (e) a stationary potential. Drop any one of these and you exit the protection of , , , and you are using the name as a metaphor. Localization vs. bound states vs. classical attenuation The first abuse is dimensional. An eigenstate of a deep isolated potential well decays exponentially outside the well; so does an eigenstate of the random Hamiltonian H = -t\\sum {\\langle ij\\rangle} c i^\\dagger c j + \\sum i \\epsilon i n i in the strong-disorder regime . The two profiles look identical on a logarithmic plot, but the second is statistical (every eigenstate is exponentially localized about a different random center with localization length \\xi(E,W) characterized by a Lyapunov exponent \\gamma = \\xi^{-1} that exists almost surely by Furstenberg's theorem [9, 4]), while the first is a single bound state of a non-random Hamiltonian. Calling a deep-well bound state \"Anderson-localized\" is a category error that recurs in cold-atom and photonic literature where a single sufficiently deep speckle minimum traps a particle. The diagnostic is participation-ratio scaling with system size at fixed disorder, not the existence of an exponential tail. The second abuse is interpretational. Beer–Lambert attenuation in a lossy or scattering medium also produces exponential intensity decay, I(z) = I 0 e^{-z/\\ell {\\rm sca}}, with \\ell {\\rm sca} the scattering mean free path. This is classical transport: the diffuson, not the cooperon, with no phase coherence required. The localization length \\xi that appears in is parametrically distinct from \\ell {\\rm sca} — in 3D one has \\xi \\gg \\ell {\\rm sca} except very near the mobility edge, and in quasi-1D \\xi \\sim N \\ell {\\rm sca} with N the number of transverse channels. A measurement of exponential decay with \\xi \\sim \\ell {\\rm sca} is almost certainly absorption or single-scattering, not localization. The microwave-localization literature is careful about this ; the disordered-fiber literature is less so, and \"Anderson-localized\" imaging fibers are well-defined as engineering objects but the protected claim is restricted to the transverse direction of a quasi-2D guide, not to anything resembling the 1958 theorem. \"All 2D states are localized\" — only in one symmetry class The single-parameter scaling theorem of Abrahams, Anderson, Licciardello, and Ramakrishnan predicts that the \\beta-function lies below zero for all g in d \\le 2, so the flow runs to g \\to 0 at large L. This statement is made in the orthogonal class — time-reversal symmetric, no spin-orbit, no broken TRS. Wegner's \\sigma-model classification makes explicit that the field-theoretic target manifold depends on the symmetry, and so does \\beta(g). Two well-established counterexamples sit inside \"2D\" pedagogy: - Symplectic class (TRS preserved, spin-rotation broken by spin–orbit). Hikami–Larkin–Nagaoka perturbation theory gives a positive weak-localization correction (antilocalization), and the \\sigma-model on the symplectic target supports a genuine metal–insulator transition in 2D with a critical conductance of order e^2/h. Topological surface states and graphene with strong spin–orbit fall here. - Unitary class (TRS broken, e.g. magnetic field). The integer quantum Hall problem is the canonical case: a single delocalized energy floats up each Landau level, and the Hall plateau transitions are precisely the points where the localization length diverges. Extended states exist at isolated energies in 2D. A paper that writes \"all 2D states are localized \" while the sample has appreciable spin–orbit, broken TRS, or sublattice (chiral) structure is citing a theorem outside its symmetry class. The correct citation in those cases is the relevant \\sigma-model entry of Wegner's classification , not the gang-of-four paper. Mobility edge \\ne band edge Mott's 1968 construction places a sharp energy E c inside the band, with localized states below (or above) and extended states on the other side. The density of states is generically smooth and finite at E c; what diverges is the localization length, \\xi(E) \\sim E-E c ^{-\\nu}, with \\nu taking the values of the relevant universality class (\\nu \\approx 1.57 in the 3D orthogonal class from numerics). Band edges are kinematic — DOS goes to zero — and are entirely Bloch phenomena present without disorder. Confusing the two is endemic in the photonic-bandgap literature, where the \"pseudogap\" of hosts a region in which the photonic DOS is small and states are localized; the mobility edge is the energy at which \\xi diverges as one moves out of the pseudogap, not the band edge of the underlying periodic structure. Ioffe–Regel kinematic bound vs. Mott's minimum metallic conductivity The Ioffe–Regel criterion k F \\ell \\gtrsim 1 is a statement that the mean free path cannot be shorter than the de Broglie wavelength while a Bloch-wave description remains meaningful. It is kinematic and is alive and well in the bad-metal literature. Mott separately argued that at the disorder driving k F \\ell to unity one should find a non-zero minimum metallic conductivity \\sigma {\\rm min} \\sim e^2/(\\hbar a) below which a sample is an insulator. The scaling theory of killed this: the \\beta-function flow is continuous through g \\sim 1, and cuprates and other strongly correlated bad metals routinely violate \\sigma {\\rm min} while still satisfying k F\\ell \\gtrsim 1. Modern manuscripts that invoke \"Mott–Ioffe–Regel\" as a single object usually want only the Ioffe–Regel half . Weak localization \\ne strong localization The cooperon — the maximally-crossed diagram of time-reversed pairs — produces a logarithmic correction to the Drude conductance in 2D, which is a perturbative result valid for g \\gg 1. It shares its diagrammatic origin with the strong-localization regime, and feeding it into single-parameter scaling is precisely the route by which connects the two limits. But weak localization is not exponential localization of eigenstates; it is a coherent diffusion correction. Magnetoresistance experiments that measure \\delta\\sigma(B) from cooperon dephasing are mapping the same symmetry-class structure but should not be reported as \"evidence for Anderson localization\" — they are evidence for phase-coherent diffusion. The slippage is endemic in low-temperature transport papers . A consolidated test for \"is this Anderson localization?\" Premise of Violated by Correct framing --- --- --- Single particle many-body experiments at finite T MBL or thermalization [20, 19] — open Uncorrelated on-site disorder speckle with finite correlation length, Aubry–André, incommensurate correlated-disorder localization; mobility edge can appear in 1D TRS, orthogonal class spin–orbit, magnetic field symplectic / unitary \\sigma-model Non-interacting Coulomb, Hubbard U Altshuler–Aronov, MBL Stationary potential driven, Floquet, time-dependent speckle dynamical localization à la Anderson map The discipline that the 1958 paper deserves is to name which row applies before invoking the word. The Many-Body Frontier: Fock-Space Localization and the Existence Dispute The Many-Body Frontier: Fock-Space Localization and the Existence Dispute The 1958 theorem is silent about interactions. It concerns a single quantum particle in a static potential. Adding even weak two-body interactions changes the Hilbert space from a one-site index to a configuration space whose dimension grows exponentially in the number of particles, and the question of whether disorder still freezes transport becomes a separate problem with a separate name. That separate program — \"many-body localization\", MBL — has spent the last twenty years arguing about whether the phenomenon it names exists at all in the thermodynamic limit. The inherited word is a curse: it suggests corollary status to a 1958 theorem from which MBL inherits no rigor and only an imperfect intuition. The Basko–Aleiner–Altshuler argument The modern program begins with Basko, Aleiner, and Altshuler , who posed the following: take a band of single-particle Anderson-localized orbitals at finite temperature, add a short-range two-body interaction V, and compute the imaginary part of the self-energy to all orders in perturbation theory. They argued that for sufficiently small temperature and short-range V, the series has no convergent contribution to \\mathrm{Im}\\,\\Sigma — i.e. transport remains strictly absent and the system supports no finite DC conductivity even at T 0. Their construction is a hopping graph in many-body Fock space whose nodes are Slater determinants and whose edges are matrix elements of V. Localization on this graph is the diagnostic; the analysis recycles the locator-expansion logic of but on an exponentially larger lattice with correlated disorder (the on-site \"energies\" are sums of single-particle eigenvalues and are highly non-independent). Three points need plain statement. (i) BAA is perturbative; the argument is to all orders, but non-perturbative processes — instantons, resonances, rare regions — are left open. (ii) The conclusion is finite-T insulating behavior, not the stronger statement that all many-body eigenstates are non-thermal. (iii) The mapping to Anderson localization on the Fock-space graph is a heuristic; correlations among node energies and the graph's locally tree-like but globally non-tree topology are exactly the features that the avalanche literature would later exploit. l-bits and the eigenstate picture What turned MBL into a phase rather than a transport assertion was the local-integrals-of-motion (LIOM) phenomenology , developed by Huse–Nandkishore–Oganesyan and independently by Serbyn–Papić–Abanin around 2013–2014 (verify; not in supplied corpus). One postulates an extensive set of mutually commuting, quasi-local conserved operators \\{\\tau i^z\\} — the \"l-bits\" — related to the physical spins \\sigma i^z by a quasi-local unitary U: with J {ij},K {ijk},\\dots decaying exponentially in the separations. This is the cleanest statement of the MBL phase: the Hamiltonian becomes, after a quasi-local rotation, diagonal in a complete set of localized pseudospins . It is not derivable from and it is not proved from ; it is a constitutive ansatz. From it follow the field's signatures — Poisson level statistics in each symmetry sector, area-law entanglement of eigenstates, S(t)\\sim \\log t entanglement growth from product states (dephasing through the \\tau^z\\tau^z tail proceeds logarithmically), and absence of DC transport at any temperature. Imbrie's 2016 construction (verify) is the closest thing to a theorem: it builds the l-bits for a specific 1D random-field Ising chain under unproven level-attraction assumptions. The avalanche The first crack in the picture is non-perturbative. De Roeck and Huveneers (verify) showed that an MBL system is generically unstable to rare ergodic inclusions : a thermal \"bubble\" embedded in a localized background acts as a small bath; it absorbs the neighbouring l-bit, grows by one site, and is now a slightly larger and more effective bath. In dimensions d \\ge 2 the bubble's surface grows faster than the exponential suppression of the matrix elements connecting it to distant l-bits; the avalanche always wins and MBL is destroyed. In d=1 the rate competition is marginal: MBL survives only if l-bits decay faster than a critical rate set by the local bath spectrum. The avalanche is not a numerical artifact — it is a rigorous instability argument that voids MBL as a thermodynamic phase in d\\ge 2 for generic short-range models. The Šuntajs–Bonča–Prosen–Vidmar challenge reignited the dispute even in d=1. The standard numerical diagnostic — Thouless time t {\\mathrm{Th}} extracted from the spectral form factor, compared against Heisenberg time t H — drifts with system size in the canonical random-field Heisenberg chain in a way consistent with t {\\mathrm{Th}}/t H \\to 0 as L\\to\\infty at any fixed disorder. Their reading: there is no MBL transition at finite disorder in the thermodynamic limit, only a finite-size crossover whose apparent critical W c drifts linearly with L. The paper was contested immediately on the grounds that exact-diagonalization windows (L\\lesssim 24) cannot resolve the asymptotic behavior of a slow flow. Subsequent work by Sels and Polkovnikov (verify) on dynamical constraints and on l-bit fragility against finite ergodic regions sharpened the indictment; the 2024 IOP review by Sierant et al. gives the current dispassionate accounting. What is established, what is plausible-but-disputed, what is folklore Established. (a) The BAA perturbative argument is internally consistent to all orders . (b) Finite-size systems with strong disorder exhibit non-ergodic features — area-law eigenstates, logarithmic entanglement growth, Poisson statistics — over numerically and experimentally accessible scales. (c) The avalanche instability rules out MBL as a thermodynamic phase in d\\ge 2 for generic short-range models. Plausible but disputed. (a) Existence of a true MBL phase in the thermodynamic limit of a 1D random-field chain at any finite disorder. The literature is polarized: one camp (Šuntajs, Polkovnikov, Sels, Vidmar) reads the finite-size drift as evidence of asymptotic thermalization ; another (Sierant, Lewenstein, Imbrie, Abanin) holds that current numerics cannot exclude an MBL transition at large W. (b) Whether quasi-periodic models (interacting Aubry–André) host a genuine MBL phase distinct from the random case. Folklore. (a) \"MBL is Anderson localization plus interactions.\" It is not: Fock-space localization on an exponentially large graph with strongly correlated disorder is not the object of , and the proofs of [4, 5, 6] do not transfer. (b) \"Imbrie proved MBL.\" Imbrie's theorem is conditional on an unproven level-attraction assumption that has not been verified for any concrete model. (c) \"Experiments on cold-atom and trapped-ion chains settle the existence question.\" They demonstrate non-ergodic dynamics over the accessible timescales of the experiment; they do not, and cannot, probe the thermodynamic limit at which the avalanche argument bites. Why the name is misleading \"Many-body localization\" inherits from a connotation of rigor and universality that the present object does not possess. The 1958 theorem is a statement about the spectrum of a single-particle random Schrödinger operator with i.i.d. on-site disorder; the MBL conjecture is a statement about thermalization of an interacting closed quantum system — a constraint on the eigenstate thermalization hypothesis rather than on a spectrum. A more honest name would be interacting non-ergodicity or Fock-space slow dynamics : it would not promise a theorem, it would not borrow the prestige of , and it would prepare its users for the dispute the field is, twenty years in, still inside. Open Problems and Diagnostic Signatures Open Problems and Diagnostic Signatures The 1958 theorem settled one question for one model. Every direction this section surveys is a place where that settlement has not been extended, where the word \"Anderson localization\" is invoked with varying degrees of warrant. For each open front, a referee should demand a specific quantitative signature before accepting the label. The 3D mobility edge: exponents and multifractality The cleanest unsolved problem in the non-interacting theory is the precise critical behavior of the 3D orthogonal Anderson transition. The scaling theory predicts a divergent localization length \\xi \\sim E - E c ^{-\\nu} and, at criticality, a conductance distribution whose width is universal — independent of disorder strength and microscopic model. The numerical state of the art puts the orthogonal-class exponent at \\nu = 1.572 \\pm 0.003 from transfer-matrix finite-size scaling on cubic lattices (Slevin \u0026 Ohtsuki, NJP 2014); a 2025 large-scale simulation of electromagnetic transport through disordered dielectric spheres recovered \\nu \\approx 1.5 \\pm 0.3, consistent with the orthogonal class (Skipetrov, PRL 2025). What remains open is an analytic derivation: Wegner's \\sigma-model gives a \\varepsilon-expansion around d=2 that, taken to one loop, badly underestimates \\nu in three dimensions, and higher-loop resummations have not converged with the numerics. The deeper structural prediction is multifractality of the critical wavefunctions. At the mobility edge, the inverse participation ratios scale as with D q a non-trivial function of q, not a single fractal dimension. Symmetry forces the exact relation \\tau q = \\tau {1-q} + (q - 1/2)\\cdot 0 in appropriate variables (Mirlin–Fyodorov reciprocity). The signature a referee should demand: a measured spectrum f(\\alpha) from box-counted intensities that (i) is parabolic only to leading order in \\alpha - d , (ii) collapses with L at the claimed E c across at least a decade of system size, and (iii) exhibits the reciprocity relation. Anything short of this — a single exponent, a single energy, a single sample — is consistent with a crossover, not a transition. The 2D symplectic transition The \"no metal in 2D\" headline of the gang-of-four flow is a statement about the orthogonal class. With strong spin–orbit coupling the system enters the symplectic class, the \\beta-function changes sign, and a genuine 2D metal–insulator transition appears. Numerics on the SU(2) and Ando models give \\nu {\\rm sympl} \\approx 2.73\\text{–}2.75 (Asada, Slevin \u0026 Ohtsuki, PRL 2002), a value that has stabilized only after corrections to scaling were treated carefully — earlier reports ran from 2.0 to 2.9. Experimentally the symplectic class lives on the helical surface of strong topological insulators, in graphene with proximity-induced spin–orbit, and in 2D hole gases. A referee should demand: scaling collapse of \\sigma(T, L) onto a single curve through the candidate critical disorder, not just a non-monotonic \\sigma(T). Many \"2D MIT\" claims since the 1990s — most notoriously in dilute Si-MOSFETs (Kravchenko \u0026 Sarachik) — are now read as interaction effects in the orthogonal class rather than symplectic criticality. The two require different theories and different diagnostics; conflation [conflation 2 of the corpus] is the standard sin. Anderson–Mott crossover and the interacting 2D problem When interactions cannot be treated as a small correction, the Finkel'stein nonlinear \\sigma-model adds singlet and triplet interaction amplitudes to the Wegner action . The flow develops a metallic fixed point in the orthogonal class at finite triplet coupling (Punnoose \u0026 Finkel'stein), which is the cleanest theoretical candidate for the experimentally observed 2D MIT. The open question is whether the Anderson and Mott insulators are distinct phases or the same phase reached from different sides . The Anderson insulator has a finite single-particle density of states at \\mu and a soft Coulomb (Efros–Shklovskii) gap in the tunneling DOS; the Mott insulator has a hard correlation gap with no single-particle weight at \\mu. A referee should demand simultaneous tunneling-DOS spectroscopy and transport: a \"Mott–Anderson\" insulator labelled from \\sigma(T) alone is underdetermined. The Lee–Ramakrishnan review still defines the canonical diagnostic vocabulary here, and almost forty years on, no other comparably complete synthesis exists. Topological phases in disorder Two distinct phenomena travel under this banner. First, topological protection : the surface modes of a strong 3D topological insulator are immune to localization by time-reversal-symmetric disorder, because backscattering between Kramers partners is forbidden. The flow is \\beta(g) 0 at weak coupling for a single Dirac cone — a genuine 2D delocalized phase that the original scaling theory missed because it had no Dirac fermions. Second, topological Anderson insulator (TAI) : in HgTe/CdTe wells and 1D chiral wires, disorder can drive a trivial band structure into a topologically non-trivial phase by renormalizing the mass. The TAI was directly observed in an atomic-wire quantum simulator (Meier et al., Science 2018); a current review of the broader landscape, including non-Hermitian extensions, is . Diagnostic demand: quantized transport surviving disorder (\\sigma {xy} plateaus, G = 2 e^2/h on edge channels) plus a measured bulk gap; topology inferred from a single density-of-states feature is not enough. Non-Hermitian localization The Hatano–Nelson model (1996) — a 1D tight-binding chain with asymmetric hopping and random potentials — produces a depinning transition at which extended states appear in a quintessentially 1D system that, were it Hermitian, would localize completely . The same mathematics underlies the non-Hermitian skin effect : boundary accumulation of O(N) eigenstates with no disorder at all, driven purely by spectral winding under open boundaries. The dangerous confusion is reading boundary localization as Anderson localization. A referee should demand: a comparison of periodic and open boundary spectra (skin effect collapses under PBC, Anderson localization does not); generalized-Brillouin-zone analysis distinguishing winding-driven from disorder-driven exponential profiles; and, if both mechanisms are present, an explicit decomposition. Many-body localization: existence or slow thermalization? The BAA conjecture of a non-ergodic interacting phase is, six years after Šuntajs et al. , still contested rather than settled. The avalanche scenario — a rare thermal \"bubble\" seeded by an anomalously weak-disorder region grows, dressing nearby spins until it consumes the system — predicts a critical disorder W c that grows with system size, possibly without bound in d=1. Recent stability analyses argue the avalanche is bounded above some interaction-dependent W^ (2026 power-law-interaction study), but the thermodynamic-limit question is open. A referee should demand: scaling collapse of the gap-ratio statistic \\langle r \\rangle across the largest accessible L with the drift in apparent W c extrapolated ; Thouless-time scaling t {\\rm Th}(L) rather than just level statistics at fixed L; and an explicit position on whether the claim is asymptotic MBL, a prethermal regime, or a finite-size crossover. Any paper that conflates these three under one phrase belongs in the same drawer as the photonic literature that calls every exponential decay \"Anderson localization\" . Verdict: What Anderson Actually Proved, and What the Word Now Means Verdict: What Anderson Actually Proved, and What the Word Now Means The dossier has tracked a single sentence — strong disorder localizes electrons — through sixty‑seven years of theory, mathematics, experiment, and rhetorical inflation. What follows is the audit closed out: the theorem in its actual hypotheses, the credit chain that the textbook one‑liner mangles, the perimeter beyond which \"Anderson localization\" is a metaphor rather than an entailment, and a short reading list keyed to the corpus. The theorem, stripped to its hypotheses What establishes — and the sense in which the word \"establishes\" is to be read as \"argues with high physical confidence, later confirmed rigorously\" — is the following. Take the tight‑binding Hamiltonian with site energies \\varepsilon i independently drawn from a distribution of width W and hoppings t {ij} of characteristic scale t. Then for W/t above a model‑dependent threshold (and in d=1 for any nonzero W), a wavepacket released at site 0 does not diffuse: with probability one the return amplitude does not decay to zero, the eigenstates are exponentially localized about random centers, and the spectrum is pure point in the localized window. That is the theorem. Six conditions are doing all the work, and each is a place where the modern literature has been seen, in the preceding sections, to slip: 1. Single particle. No two‑body term. Interactions take you to §6 and to a different — and contested — claim. 2. Quenched on‑site disorder, statistically independent. Correlated disorder produces qualitatively different spectra (Dyson singularities, delocalization at special energies, mobility edges in 1D). 3. Time‑reversal symmetry, no spin–orbit. The orthogonal symmetry class. The unitary and symplectic classes obey different scaling, as Wegner made structural and as the experimental anomalies in §4 made tangible. 4. Static potential. Time‑periodic drive can delocalize a localized chain or localize an extended one; neither outcome is a corollary of . 5. Lattice tight binding. Continuum random Schrödinger operators require their own proofs; is the earliest fully rigorous one in 1D. 6. Exponential profile of eigenstates , not of arbitrary intensity. A bound state in a deep classical well and an absorbing medium with mean free path \\ell both produce exponential tails; neither is what is about. Each item is a hypothesis, not decoration. The phrase \"Anderson localization\" applied to a system that violates one of them is a metaphor — sometimes a productive one, sometimes a category error — and §5 catalogued the cost of failing to mark the difference. The corrected credit chain The textbook line is Anderson 1958 → Mott mobility edge → gang of four 1979 . The record actually reads: - Feher → Anderson. The 1958 paper is not a transport paper. It was triggered by Feher's ENDOR linewidths on phosphorus donors in silicon , which Anderson's Bell Labs colleagues could not reconcile with motional narrowing. Anderson said as much in print [3, 23]. Pedagogy that introduces as a conductivity calculation has the historical motivation backwards. - Mott → Twose → Borland in 1D. The one‑dimensional \"all states localized\" statement is routinely attributed to Mott alone. The 1961 paper is joint with Twose ; the first defensible proof is Borland 1963 , using what is recognizable in retrospect as Furstenberg products of random matrices. Both names are typically absent from the one‑line history. - Gol'dsheid–Molchanov–Pastur before Fröhlich–Spencer. The mathematical pillar of the field is almost always introduced via in 1983. The first fully rigorous proof of pure‑point spectrum and exponential localization for a continuous 1D random Schrödinger operator is in 1977 — older, and in 1D more general. Multiscale analysis and the fractional‑moment method are landmarks; they are not the first landmarks. - The full gang of four. is signed by Abrahams, Anderson, Licciardello, and Ramakrishnan. Conference lore has compressed this to \"Abrahams–Anderson\"; Licciardello's numerical conductance‑scaling work, much of it from his Princeton thesis, was the empirical backbone .lhero{padding:84px 0 38px}

.lhero p.manifesto{font-size:21px;font-style:italic;color:var(--ink-2);max-width:680px;line-height:1.6}
.lhero p.note{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:24px;text-transform:uppercase}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:46px 0 6px;border-top:1px solid var(--line-soft);padding-top:24px}
.filter button{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:none;border-radius:99px;padding:8px 15px;cursor:pointer;transition:all .2s}
.filter button:hover{border-color:var(--accent);color:var(--accent)}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:34px 0 100px}
a.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;background:var(--elev);padding:30px 30px 26px;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative;overflow:hidden}
a.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
a.card .ctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;margin-bottom:16px}

a.card .csubj{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);margin-bottom:10px}

a.card .cfoot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between}
a.card .cfoot .arr{color:var(--accent);transition:transform .25s}
a.card:hover .cfoot .arr{transform:translateX(4px)}
.empty{padding:60px 0;color:var(--muted);font-style:italic}

.rmast{padding:64px 0 30px}
.rmast .kind{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}

.callout{border:1px solid var(--line-soft);border-left:2px solid var(--accent);background:var(--elev);border-radius:0 4px 4px 0;padding:18px 24px;margin:30px 0}
.callout h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.callout p{font-size:15.5px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--gold)}

.toc{position:sticky;top:84px;font-family:var(--mono);font-size:11px;line-height:1.5}

.toc a:hover,.toc a.on{color:var(--accent);border-color:var(--accent)}

.sec{padding:14px 0 8px;scroll-margin-top:80px}

.prose li{margin-bottom:.5em}

.refs li a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.refs li a:hover{color:var(--accent);border-color:var(--accent)}
.refs li .bk{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:2px 7px;margin-left:6px}

ocalization via the sensitivity of eigenvalues to boundary conditions (the 'Thouless number' g = δE/ΔE); this is what later becomes the scaling variable.", "who": "D. J. Thouless", "work": "'Electrons in disordered systems and the theory of localization', Phys. Rep. 13, 93.", "kind": "formalization", "ref": 10}, {"year": 1977, "event": "First mathematically rigorous proof of pure-point spectrum and exponential localization for a continuous 1D random Schrödinger operator — predates and is more general than later western multiscale work.", "who": "I. Ya. Gol'dsheid, S. A. Molchanov, L. A. Pastur", "work": "'A pure point spectrum of the stochastic one-dimensional Schrödinger operator', Funct. Anal. Appl. 11, 1.", "kind": "formalization", "ref": 4}, {"year": 1977, "event": "Nobel Prize in Physics jointly to Anderson, Mott, Van Vleck 'for fundamental theoretical investigations of the electronic structure of magnetic and disordered systems'.", "who": "Royal Swedish Academy of Sciences", "work": "Nobel lecture by Anderson ('Local Moments and Localized States', 8 Dec 1977) explicitly walks through the 1958 argument.", "kind": "revival", "ref": 3}, {"year": 1979, "event": "Scaling theory of localization: single-parameter β(g)=d ln g / d ln L flow; key prediction that all states are localized in d ≤ 2 for orthogonal, time-reversal-symmetric, non-interacting electrons.", "who": "E. Abrahams, P. W. Anderson, D. C. Licciardello, T. V. Ramakrishnan ('gang of four')", "work": "'Scaling theory of localization', Phys. Rev. Lett. 42, 673.", "kind": "theory", "ref": 12}, {"year": 1979, "event": "Field-theoretic reformulation: the localization problem maps onto a nonlinear σ-model on a non-compact symmetric space; gives the symmetry classes (orthogonal/unitary/symplectic) that the scaling theory had read off phenomenologically.", "who": "F. J. Wegner", "work": "'The mobility edge problem: continuous symmetry and a conjecture', Z. Phys. B 35, 207.", "kind": "formalization", "ref": 14}, {"year": 1983, "event": "Multiscale analysis: rigorous proof of exponential localization for the d-dimensional tight-binding Anderson model at strong disorder or band edges, valid in all d.", "who": "J. Fröhlich, T. Spencer", "work": "'Absence of diffusion in the Anderson tight binding model for large disorder or low energy', Commun. Math. Phys. 88, 151.", "kind": "formalization", "ref": 5}, {"year": 1985, "event": "Comprehensive synthesis of disordered electronic systems: weak localization, interaction corrections, scaling theory; defines the canonical reading list for a generation.", "who": "P. A. Lee, T. V. Ramakrishnan", "work": "'Disordered electronic systems', Rev. Mod. Phys. 57, 287.", "kind": "revival", "ref": 15}, {"year": 1987, "event": "Anderson localization exported to electromagnetism: Sajeev John predicts strong photon localization in carefully disordered dielectrics with a 'pseudogap'.", "who": "S. John", "work": "'Strong localization of photons in certain disordered dielectric superlattices', Phys. Rev. Lett. 58, 2486.", "kind": "revival", "ref": 16}, {"year": 1993, "event": "Fractional-moment method: a shorter, more flexible proof of localization for tight-binding Anderson model that does not need multiscale induction.", "who": "M. Aizenman, S. Molchanov", "work": "'Localization at large disorder and at extreme energies: an elementary derivation', Commun. Math. Phys. 157, 245.", "kind": "formalization", "ref": 6}, {"year": 2006, "event": "Many-body localization (MBL) conjecture: weakly interacting electrons in a localized band stay non-ergodic at finite T below a critical temperature — Anderson localization 'in Fock space'.", "who": "D. M. Basko, I. L. Aleiner, B. L. Altshuler", "work": "'Metal–insulator transition in a weakly interacting many-electron system with localized single-particle states', Ann. Phys. 321, 1126.", "kind": "theory", "ref": 20}, {"year": 2020, "event": "Numerical evidence that the apparent MBL transition in 1D spin chains drifts with system size in a way consistent with eventual thermalization in the thermodynamic limit — opens still-unresolved priority/existence dispute.", "who": "J. Šuntajs, J. Bonča, T. Prosen, L. Vidmar", "work": "'Quantum chaos challenges many-body localization', Phys. Rev. E 102, 062144.", "kind": "theory", "ref": 19}], "neglected": [{"name": "George Feher", "role": "His Bell-Labs ENDOR measurements on P:Si donors were the empirical trigger for Anderson's 1958 paper; Anderson explicitly credits him in the opening of both the paper and the Nobel lecture, yet textbooks usually present the 1958 paper as pure theory ex nihilo.", "evidence": "Anderson, Nobel lecture 'Local Moments and Localized States' (1977), opening paragraphs of the localization half; Feher, Phys. Rev. 114, 1219 (1959).", "ref": 3}, {"name": "W. D. Twose", "role": "Co-author with Mott of the 1961 paper that first conjectured complete 1D localization at any disorder. Standard pedagogy says 'Mott showed that in 1D…'; Twose did the transfer-matrix work and never received comparable credit.", "evidence": "Mott \u0026 Twose, Adv. Phys. 10, 107 (1961); Twose's affiliation listing shows he was a research student, which likely contributed to the asymmetric credit.", "ref": 8}, {"name": "R. E. Borland", "role": "Provided the first reasonably rigorous proof (1963) of the Mott–Twose 1D conjecture using Furstenberg-type products of random matrices, a full decade before this approach was rediscovered in the mathematical-physics community.", "evidence": "Borland, Proc. R. Soc. A 274, 529 (1963); cited approvingly but briefly by Thouless 1974.", "ref": 9}, {"name": "Ilya Gol'dsheid, Stanislav Molchanov, Leonid Pastur", "role": "Gave the first fully rigorous proof of Anderson localization in a continuous 1D model (1977), years before Fröhlich–Spencer's celebrated multiscale paper. Western reviews routinely cite 1983 as the start of rigorous localization theory, skipping the Soviet work.", "evidence": "Gol'dsheid, Molchanov, Pastur, Funct. Anal. Appl. 11, 1 (1977); Kunz \u0026 Souillard (1980) and later Bourgain explicitly acknowledge precedence.", "ref": 4}, {"name": "Donald C. Licciardello", "role": "The 'L' of the gang of four; did much of the numerical conductance-scaling work on which the 1979 paper was built (his Princeton PhD thesis under Thouless). Left academia shortly after publication and is now almost invisible in retellings that say 'AAR' or just 'Anderson and Abrahams'.", "evidence": "PRL 42, 673 author list and acknowledgements; Abrahams, ed., '50 Years of Anderson Localization' (World Scientific, 2010), historical preface.", "ref": 12}, {"name": "A. F. Ioffe and A. R. Regel", "role": "Their 1960 Soviet review introduced the mean-free-path bound k_F ℓ ≳ 1 that defines the regime where Bloch transport must fail; the bound is universally attributed to 'Mott–Ioffe–Regel' even though Mott's contribution was to graft σ_min onto it.", "evidence": "Ioffe \u0026 Regel, Prog. Semicond. 4, 237 (1960); Gantmakher (2010) review of the rule's actual origin.", "ref": 11}], "conflations": [{"claim": "'Anderson localization' = exponential decay of any wavefunction in any disordered medium.", "clarification": "The 1958 theorem is about a SINGLE non-interacting quantum particle on a lattice with uncorrelated on-site disorder, in a time-reversal-symmetric Hamiltonian. Bound states in deep wells, ballistic scattering, classical-wave attenuation, and bound-state formation in correlated disorder are physically different phenomena that share only exponential profile."}, {"claim": "All states in 2D are localized, full stop.", "clarification": "The 1979 scaling argument predicts logarithmic flow to insulating behavior in the orthogonal class (time-reversal, no spin–orbit) of non-interacting electrons. In the symplectic class (strong spin–orbit) there is a true 2D metal–insulator transition; in the unitary class (broken TRS, e.g. quantum Hall) there are extended states at isolated energies. Interactions further change the story."}, {"claim": "'Many-body localization' is just Anderson localization with interactions.", "clarification": "MBL invokes localization of the MANY-BODY eigenstates in Fock space, a fundamentally different object. Its existence in the thermodynamic limit at any disorder is now actively contested (Šuntajs et al. 2020; later work on slow thermalization). It is not a corollary of the 1958 theorem and inherits none of its rigor."}, {"claim": "'Mott–Ioffe–Regel limit' bounds metallic conductivity from below at σ_min ~ e²/ħa.", "clarification": "The Ioffe–Regel bound k_F ℓ ≳ 1 is a kinematic statement on the mean free path; the minimum metallic conductivity σ_min was Mott's separate (and now largely rejected) phenomenological extrapolation. Experiments on cuprates and other 'bad metals' show that the σ_min picture is wrong even though k_F ℓ ≳ 1 still has content."}, {"claim": "Mobility edge = energy where DOS goes to zero.", "clarification": "The mobility edge is where the localization length diverges; the density of states is generically smooth and finite across it. Confusing the mobility edge with a band edge is a recurring error in the photonic-localization literature."}, {"claim": "Weak localization is the precursor of Anderson localization at small disorder.", "clarification": "Weak localization is the leading interference correction to Drude conductivity from time-reversed diffuson paths; it shares the cooperon diagram with strong localization but is perturbative and does not, by itself, imply exponentially localized eigenstates."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: Feher's Donors, Anderson's Locator, and the Names That Fell Off the Citation", "markdown": "## Origins: Feher's Donors, Anderson's Locator, and the Names That Fell Off the Citation\n\nThe standard one-sentence history reads: *Anderson, in 1958, proved that strong disorder localizes electrons; Mott named the mobility edge; the gang of four, in 1979, finished the job with scaling.* Every clause in that sentence is wrong in a load-bearing way. The 1958 paper was not about electrons, not about conduction, and not — by its author's own later admission — a proof. The mobility edge was a 1968 phenomenological grafting onto a 1960 Soviet kinematic bound. The \"gang of four\" was a quartet, not a duo, and its empirical backbone was a graduate student whose name the field has quietly let fall away. Before we can read the locator expansion or the $\\beta(g)$ flow honestly, the origin story has to be rebuilt.\n\n### What Anderson was actually answering\n\nThe paper that started the field [1] opens with a question posed by George Feher's ENDOR experiments on phosphorus donors in silicon [2]. Feher had measured the relaxation of donor nuclear spins and observed that the spin diffusion, instead of being exponential with the expected donor-donor coupling, was anomalously slow, with relaxation times that ran to hours. The puzzle was *not*, \"why is the resistivity of doped silicon what it is\" — at the relevant compensations, P:Si is plainly a conductor or plainly an insulator depending on which side of the metal–insulator transition one sits, and that transition was not yet operationalized. The puzzle was: why does a nuclear-polarization profile, prepared at one donor, fail to spread by the dipolar coupling network to its neighbors after an enormous number of natural hopping times?\n\nAnderson's title — \"Absence of Diffusion in Certain Random Lattices\" — should be read literally. The model is a single quantum particle (an excitation, originally a flipped spin) on a lattice with random on-site energies $\\varepsilon_i$ drawn i.i.d. from a distribution of width $W$ and a fixed hopping $t$ between neighbors:\n\n$$H = \\sum_i \\varepsilon_i \\, c_i^\\dagger c_i \\;+\\; t \\sum_{\\langle ij\\rangle} \\big(c_i^\\dagger c_j + \\mathrm{h.c.}\\big).$$\n\nThe result is a probabilistic statement about the convergence, with non-zero probability over the disorder, of the *locator expansion* — the renormalized perturbation series for the self-energy $G_{ii}(E)$ that propagates the excitation from site $i$ back to itself along all self-avoiding walks through the lattice. When the typical value of the expansion converges, an eigenstate centered at $i$ remains exponentially confined; spin polarization placed there does not spread. The criterion for sufficiently strong disorder is $W/t \\gtrsim K \\ln K$ for a lattice of coordination $K$. Anderson himself, in the Nobel lecture two decades later [3], called the original write-up \"unreadable\" and conceded that no one — including its referees — had taken the locator expansion as a *proof* in the mathematician's sense; what it gave was a convergence argument for the typical-case self-energy, with the small-probability tails left in a state that the rigorous community would spend twenty-five years cleaning up [4, 5, 6].\n\nTwo consequences follow from this re-reading. First, the 1958 paper is not a transport paper. There is no Kubo formula, no conductivity, no Fermi surface. The connection to electrical conduction was made *retroactively*, by Mott in the late 1960s [7], when he introduced the mobility edge $E_c$ and identified the metal–insulator transition with the Fermi level crossing it. Second, the empirical anchor is Feher's ENDOR data on a magnetic problem — donor nuclear-spin diffusion — and not a resistance measurement. Textbooks routinely present 1958 as theory ex nihilo. Anderson's own framing, both in the paper's introduction and in the Nobel lecture, is unambiguous: Feher's experiments were the trigger. That Feher's name has migrated to a footnote, while \"Anderson localization\" became a noun, is the first credit slippage of the story.\n\n### The 1D theorem: Mott, Twose, and the proof that Borland actually wrote\n\nThe folklore \"in one dimension all states are localized for any disorder\" is universally attributed to M
