ich-Spencer (1983) and Aizenman-Molchanov (1993) — none of whom appear in standard physics graduate curricula. Finally, Sajeev John's 1987 paper [47] is correctly credited for photonic AL, but Anderson himself had floated the same idea informally and the John–Anderson–Stephen 1987 paper on field-theoretic photon localization is sometimes elided in optics review articles.", "timeline": [{"year": 1958, "event": "Foundational paper: absence of diffusion in a random tight-binding lattice; locator expansion; criterion W/V \u003e critical value", "who": "P.W. Anderson", "work": "Phys. Rev. 109, 1492", "kind": "theory", "ref": null}, {"year": 1961, "event": "Argued all states are localized in a 1D disordered chain — first hint of dimensional sensitivity", "who": "N.F. Mott and W.D. Twose", "work": "Advances in Physics 10, 107", "kind": "theory", "ref": null}, {"year": 1963, "event": "Rigorous 1D result on exponential decay of eigenfunctions from product-of-random-matrices analysis (Furstenberg theorem applied to transfer matrices)", "who": "R.E. Borland", "work": "Proc. Roy. Soc. A 274, 529", "kind": "formalization", "ref": null}, {"year": 1967, "event": "Introduces the mobility edge: a sharp energy separating localized from extended states; coins much of the working vocabulary", "who": "N.F. Mott", "work": "Adv. Phys. 16, 49", "kind": "naming", "ref": null}, {"year": 1974, "event": "Phys. Rep. review reframes localization via sensitivity of eigenvalues to boundary conditions — the 'Thouless number' g(L), seed of finite-size scaling", "who": "D.J. Thouless", "work": "Physics Reports 13, 93", "kind": "formalization", "ref": null}, {"year": 1976, "event": "Field-theoretic reformulation: localization as the broken-symmetry phase of a nonlinear sigma model on the orthogonal/unitary/symplectic supergroup", "who": "F. Wegner", "work": "Z. Phys. B 25, 327", "kind": "formalization", "ref": null}, {"year": 1977, "event": "Rigorous proof of pure point spectrum (= localization) for the 1D Anderson model — published in Russian and long ignored in the West", "who": "I.Ya. Gol'dshtein, S.A. Molchanov, L.A. Pastur", "work": "Funkts. Anal. Prilozh. 11, 1", "kind": "formalization", "ref": null}, {"year": 1977, "event": "Nobel Prize in Physics shared by Anderson, Mott, Van Vleck 'for fundamental theoretical investigations of the electronic structure of magnetic and disordered systems'", "who": "Nobel Committee", "work": "Nobel Foundation", "kind": "revival", "ref": null}, {"year": 1979, "event": "Scaling theory of localization: one-parameter β(g) = d ln g/d ln L predicts d ≤ 2 always localized, d = 3 has a true metal–insulator transition", "who": "E. Abrahams, P.W. Anderson, D.C. Licciardello, T.V. Ramakrishnan", "work": "Phys. Rev. Lett. 42, 673", "kind": "theory", "ref": null}, {"year": 1983, "event": "First mathematically rigorous proof of localization for the multi-dimensional Anderson model at strong disorder via multiscale analysis", "who": "J. Fröhlich, T. Spencer", "work": "Commun. Math. Phys. 88, 151", "kind": "formalization", "ref": null}, {"year": 1983, "event": "Supersymmetric sigma-model technique — averaging over disorder without replicas; foundation of modern mesoscopic theory", "who": "K.B. Efetov", "work": "Adv. Phys. 32, 53", "kind": "formalization", "ref": null}, {"year": 1985, "event": "Definitive canonical review consolidating scaling theory, weak localization, interaction corrections, and experiments", "who": "P.A. Lee, T.V. Ramakrishnan", "work": "Rev. Mod. Phys. 57, 287", "kind": "revival", "ref": 58}, {"year": 1987, "event": "Extension of the localization concept to classical electromagnetic waves in periodic-with-disorder dielectrics — photonic Anderson localization", "who": "S. John", "work": "Phys. Rev. Lett. 58, 2486", "kind": "theory", "ref": 47}, {"year": 2006, "event": "Perturbative argument for the existence of many-body localization at finite energy density in disordered interacting fermions", "who": "D.M. Basko, I.L. Aleiner, B.L. Altshuler", "work": "Annals of Physics 321, 1126", "kind": "theory", "ref": null}, {"year": 2008, "event": "Direct imaging of an exponentially localized Bose–Einstein condensate wavefunction in a 1D speckle potential — first 'clean' textbook observation of AL", "who": "J. Billy, V. Josse, et al. (Aspect group)", "work": "Nature 453, 891", "kind": "observation", "ref": null}, {"year": 2020, "event": "Numerical evidence and analytical arguments that MBL may not survive the thermodynamic limit — the 'avalanche' instability debate", "who": "J. Šuntajs et al.; D. Sels \u0026 A. Polkovnikov", "work": "PRE 102, 062144; PRX 11, 031026", "kind": "revival", "ref": null}], "neglected": [{"name": "George Feher", "role": "Experimental motivation for the 1958 paper. Anderson explicitly credits Feher's ENDOR/spin-relaxation data on doped Si at Bell Labs as the puzzle that demanded a non-diffusive theory. Rarely named in textbooks, which present the paper as pure theory.", "evidence": "Anderson's 1977 Nobel lecture (Rev. Mod. Phys. 50, 191, 1978) and his autobiographical essay 'Local Moments and Localized States'", "ref": null}, {"name": "I.M. Lifshitz", "role": "Showed in the early 1960s that disorder generates exponential 'Lifshitz tails' of localized states at band edges and developed the optimal-fluctuation method — independent route to the same physics, largely under-cited in Western literature.", "evidence": "Lifshitz, Sov. Phys. Usp. 7, 549 (1965); his work surveyed in Lifshitz, Gredeskul, Pastur, Introduction to the Theory of Disordered Systems (Wiley, 1988) (verify)", "ref": null}, {"name": "R.E. Borland", "role": "Gave the first essentially rigorous derivation of 1D localization via transfer-matrix Lyapunov exponents — the result usually attributed to Mott-Twose. Almost never cited in modern reviews.", "evidence": "Proc. Roy. Soc. A 274, 529 (1963); discussed in Ishii's 1973 review (Suppl. Prog. Theor. Phys. 53, 77)", "ref": null}, {"name": "I.Ya. Gol'dshtein, S.A. Molchanov, L.A. Pastur", "role": "Delivered the first fully rigorous proof of localization (pure point spectrum) for the 1D Anderson model in 1977 — published in Russian, predating and predicting the multidimensional results that Western mathematicians later proved.", "evidence": "Funkts. Anal. Prilozh. 11, 1 (1977); cited in Carmona \u0026 Lacroix, Spectral Theory of Random Schrödinger Operators (Birkhäuser, 1990) (verify)", "ref": null}, {"name": "L.P. Gor'kov, A.I. Larkin, D.E. Khmelnitskii", "role": "Independently of AALR, derived the logarithmic 2D weak-localization correction (Pis'ma ZhETF 30, 248, 1979) — the experimental signature that confirmed scaling theory. Western reviews tend to credit AALR alone.", "evidence": "JETP Lett. 30, 228 (1979); acknowledged in Lee–Ramakrishnan review [58]", "ref": 58}, {"name": "D. Vollhardt and P. Wölfle", "role": "Self-consistent diagrammatic theory of the Anderson transition (1980–82) that gave the first quantitative predictions for the mobility edge and reconciled scaling theory with diagrammatic perturbation theory. Routinely omitted from popular accounts.", "evidence": "Phys. Rev. B 22, 4666 (1980); Phys. Rev. Lett. 48, 699 (1982)", "ref": null}, {"name": "Sergey E. Skipetrov \u0026 coworkers in classical-wave AL", "role": "Showed that several celebrated claims of 3D AL of light in powders (e.g. TiO₂, GaAs) are explainable by absorption/fluorescence artefacts — a recurring credit-and-validity correction the optics community has been slow to absorb.", "evidence": "Skipetrov et al., Nature Photonics 7, 48 (2013); Sperling et al., New J. Phys. 18, 013039 (2016) (verify)", "ref": null}], "conflations": [{"claim": "'Anderson localization' is used synonymously with 'weak localization'.", "clarification": "Weak localization is the leading O(1/g) quantum interference correction to the Drude conductivity in a weakly disordered metal — the system is still a metal, σ is finite, the correction is perturbative. Anderson (strong) localization is the non-perturbative regime where g flows to zero, σ = 0 at T = 0, and wavefunctions are exponentially bound. They are connected by the AALR scaling flow but are physically distinct phases."}, {"claim": "'Anderson localization' and 'Mott localization' are interchangeable.", "clarification": "Anderson localization is driven by quenched disorder in a non-interacting (or weakly interacting) system. Mott localization is driven by electron-electron interactions in a clean system (the Hubbard U opens a gap). The Mott-Anderson transition is the regime where both compete; conflating them erases what is being varied."}, {"claim": "Any exponentially decaying eigenmode in a disordered medium 'demonstrates Anderson localization'.", "clarification": "AL is a statement about the absolute spectrum of a single-particle Hamiltonian with random potential in the limit of a macroscopic system: pure point spectrum with exponentially decaying eigenfunctions, characterized by a positive Lyapunov exponent and zero diffusion. A single localized mode in a finite sample, especially in a system with absorption, gain, or strong nonlinearity, is not in general the same phenomenon."}, {"claim": "'Many-body localization' is the interacting generalization of Anderson localization and has been demonstrated.", "clarification": "MBL imports the language of AL but lives in Fock space, not real space, and concerns the absence of thermalization at finite energy density. Whether MBL survives in the thermodynamic limit (as opposed to merely existing as a prethermal/finite-size phenomenon) is genuinely contested as of the 2020–2024 'avalanche' literature."}, {"claim": "The scaling theory of localization is a proof.", "clarification": "AALR 1979 is a one-parameter scaling ansatz plus perturbative β(g) at large and small g, interpolated. Its 2D conclusion has been verified numerically and experimentally for orthogonal symmetry class but fails when spin-orbit (symplectic class) or broken time-reversal symmetry (unitary class) are present — the symmetry-class dependence is essential and is the seed of the entire tenfold-way classification of disordered systems."}, {"claim": "Anderson localization requires randomness.", "clarification": "Deterministic quasiperiodic potentials (Aubry-André, Fibonacci) exhibit a localization transition that is mathematically distinct from random AL: it occurs at finite disorder strength even in 1D and has a self-dual structure. Calling all such transitions 'Anderson localization' obscures the difference between random and quasi-random spectra."}], "sections": [{"id": "why-this-mattered", "title": "Why This Mattered: From Feher's Spins to the Death of Bloch Universality", "markdown": "## Why This Mattered: From Feher's Spins to the Death of Bloch Universality\n\nThe 1958 paper [71] is routinely framed as a piece of pure theoretical virtuosity — a 21-page essay on random tight-binding lattices arriving fully formed from a Bell Labs office. The historical record is more interesting and more constrained. Anderson was not chasing a formalism; he was trying to rescue a number. George Feher's ENDOR program at Murray Hill had just mapped the donor wavefunction in phosphorus-doped silicon site by site, and in doing so had measured electron spin-lattice relaxation times $T_1 \\gtrsim 10^3\\,\\mathrm{s}$ at helium temperatures with anomalously sluggish spatial spin transport between donors. Bloch's theory had no slot for that: in a disordered band one expects motional narrowing, a single Korringa-style $1/T_1 T$, and rapid spin diffusion. Feher saw none of it. Anderson opens his 1977 Nobel lecture [\"Local Moments and Localized States\"](https://www.nobelprize.org/uploads/2018/06/anderson-lecture-1.pdf) by naming this — the 1958 paper is, in his own words, an answer to a Feher experiment, and \"the theory was suggested by an effort to understand … spin diffusion\" in donor-doped Si. The accompanying experimental papers (Feher, *Phys. Rev.* **114**, 1219, 1959; Feher \u0026 Gere, **114**, 1245, 1959) appeared a year *after* the theory; the result is one of the rare cases where a paradigm-shifting calculation is published ahead of the published data it explains, because the author worked down the hall from the experimentalist.\n\nWhat Anderson then did was structurally subversive. Bloch's theorem licenses the entire edifice of band theory by assuming translational invariance; the standard treatment of disorder, the Boltzmann–Drude relaxation-time picture, treats randomness perturbatively around the clean limit. Anderson asked whether the eigenstates of\n$$\\hat H = \\sum_i \\varepsilon_i\\, c_i^\\dagger c_i + V \\sum_{\\langle i j\\rangle} (c_i^\\dagger c_j + \\text{h.c.}),\\qquad \\varepsilon_i \\sim \\text{uniform}[-W/2,W/2]$$\nare extended at all, and answered: for $W/V$ beyond a critical ratio (he estimated of order ten in 3D), they are not — with probability one the wavefunctions decay exponentially, and the dc conductivity at $T=0$ is identically zero. That is not a renormalization of Drude; it is the assertion that the symmetry that justifies Drude has been destroyed non-perturbatively. The locator expansion he invented to argue it — a self-energy series indexed by self-avoiding paths whose convergence radius defines the mobility — was, even in 1958, regarded by most readers as either a curiosity or a tour de force without consequence. Mott reports in his memoir that the paper was \"not understood\" for nearly a decade.\n\nThe decade-long thaw is a credit story worth getting right. Mott, working from chemical intuition about doped semiconductors and amorphous chalcogenides, introduced the *mobility edge* $E_c$ in 1967 [80] — the energy that separates localized from extended states inside a single band. The notion of a metal–insulator transition driven by disorder, rather than by interaction (Mott–Hubbard) or by band-filling (Wilson), entered the textbook through that lens, not Anderson's. When physicists today say \"Anderson localization\" they almost always mean the Mott-edge picture grafted onto Anderson's spectrum; the 1977 Nobel deliberately yoked the two names together, and the concept *as taught* is genuinely a hybrid. The clean Anderson-only statement — pure point spectrum, exponential eigenfunctions, vanishing diffusion constant — survives intact for the mathematicians, who in 1977 obtained the first rigorous proof in 1D (Gol'dshteĭn, Molchanov, Pastur [77], published in Russian and slow to reach the West) and in 1983 the first rigorous multiscale proof in $d\u003e1$ at strong disorder (Fröhlich–Spencer [78]). The often-cited Mott–Twose 1D result [73] from 1961 is, strictly read, a physical argument; Borland's 1963 transfer-matrix paper [74] is the first *essentially* rigorous statement, using what was later recognized as Furstenberg's theorem on products of random matrices, and it is almost universally omitted from modern reviews. Lifshitz's optimal-fluctuation method, developed in parallel ([Lifshitz, *Adv. Phys.* **13**, 483, 1964](https://link.aps.org/pdf/10.1103/PhysRevE.109.L032103)), produced the band-tail density of states $\\rho(E)\\sim\\exp(-c|E-E_0|^{-d/2})$ without ever invoking Anderson — a separate route to the same physics that Western literature still under-cites.\n\nThouless reframed everything in 1974 [75] by realizing that the right diagnostic is not a wavefunction but a *response*: the dimensionless conductance $g(L) = E_T/\\Delta$, the ratio of the Thouless energy (sensitivity of eigenvalues to boundary conditions) to the level spacing. This is the move that converts localization from a spectral curiosity into a renormalization-group flow. Five years later, Abrahams, Anderson, Licciardello, and Ramakrishnan [72] postulated a one-parameter $\\beta(g) = d\\ln g/d\\ln L$ and concluded that $d\\le 2$ is always localized, $d=3$ has a true metal–insulator transition, and the conductance at criticality is universal. Simultaneously and independently, Gor'kov, Larkin, and Khmelnitskii (*JETP Lett.* **30**, 228, 1979) derived the logarithmic 2D weak-localization correction from cooperon diagrams — the same conclusion from the opposite end of the flow, and the result that magnetoresistance experiments would actually verify. Western texts credit AALR; the Russian literature credits GLK; both are right, and the Lee–Ramakrishnan review [58] is one of the few that says so.\n\nWhat died in this arc was not Bloch's theorem — it remains exact for what it assumes — but Bloch *universality*: the working assumption that a generic solid is a perturbed crystal whose transport is governed by quasiparticles with a finite mean free path. Anderson's question, Mott's framing, and Thouless's scaling together established that disorder is its own organizing principle, not a correction to a clean limit, and that single-particle physics already contains a quantum phase transition with no broken symmetry, no order parameter in the Landau sense, and a universality class indexed by spatial dimension and the antiunitary symmetries of $\\hat H$ alone. The rest of the dossier inherits that frame.\n\nSources:\n- [Fifty years of Anderson localization — Physics Today](https://physicstoday.aip.org/features/fifty-years-of-anderson-localization)\n- [Anderson Nobel Lecture, \"Local Moments and Localized States\" (1977)](https://www.nobelprize.org/uploads/2018/06/anderson-lecture-1.pdf)\n- [Feher ENDOR on donors in silicon — *J. Phys. Radium* (1958)](https://jphysrad.journaldephysique.org/en/index.php?Itemid=129\u0026option=com_article\u0026access=dkey\u0026dkey=10.1051/jphysrad:019580019011083000)\n- [Scaling theory of localization (ETH lecture notes)](https://ethz.ch/content/dam/ethz/special-interest/phys/theoretical-physics/cmtm-dam/documents/tqn/02.pdf)\n- [Fluctuation corrections to Lifshitz tails — *Phys. Rev. E* (2024)](https://link.aps.org/pdf/10.1103/PhysRevE.109.L032103)"}, {"id": "the-physics-properly", "title": "The Physics, Properly: Locator Expansion, Thouless Number, and the Scaling Flow", "markdown": "## The Physics, Properly: Locator Expansion, Thouless Number, and the Scaling Flow\n\nThree derivations, three vocabularies, one phenomenon. Each makes a different set of assumptions explicit, and each has been weaponized in the literature with those assumptions silently dropped. The numbering A1–A8 introduced here is the contract the rest of the dossier holds the field to.\n\n**The minimal Hamiltonian.** On a lattice $\\Lambda \\subset \\mathbb{Z}^d$,\n\n$$H = \\sum_i \\varepsilon_i \\, c_i^\\dagger c_i + \\sum_{\\langle i j \\rangle} V_{ij}\\, c_i^\\dagger c_j,$$\n\nwith $\\varepsilon_i$ i.i.d. from a distribution $P(\\varepsilon)$ of width $W$ (the box $[-W/2, W/2]$ is conventional) and hopping $V_{ij} = V$ between nearest neighbours. This object embeds:\n\n- **A1** single-particle: one electron, a one-body Hilbert space;\n- **A2** quenched disorder: $\\varepsilon_i$ frozen, averaged *outside* observables;\n- **A3** no interactions: no $c^\\dagger c^\\dagger c c$ term;\n- **A6** short-range hopping: $V_{ij}$ decays faster than any power (nearest-neighbour suffices; long-range $1/r^\\alpha$ breaks the analysis for $\\alpha \\le d$);\n- **A8** linearity: $H$ acts on $\\psi$, not on $|\\psi|^2 \\psi$.\n\nTwo further assumptions enter when one passes from $H$ to its phase diagram: **A4** the symmetry class (here orthogonal — time-reversal preserved, no spin-orbit, no magnetic field), **A5** the thermodynamic limit $L \\to \\infty$ taken *after* disorder averaging, and **A7** unitarity of the evolution (no absorption, no gain, no leakage to an unmodelled bath).\n\n### Anderson 1958: the locator/forward-scattering expansion\n\nPick a site $0$ at energy $E$ close to $\\varepsilon_0$. Define the *locator* $g_i(E) = (E - \\varepsilon_i)^{-1}$. The resolvent matrix element to a distant site $n$ admits a sum over self-avoiding paths $\\Gamma: 0 \\to n$,\n\n$$G_{0n}(E) = \\sum_{\\Gamma} g_0 \\prod_{\\langle i j \\rangle \\in \\Gamma} V g_j \\cdot (\\text{self-energy renormalizations}),$$\n\neach term is a product of random numbers $V/(E-\\varepsilon_i)$ along the path. Anderson's [71] criterion asks when the *typical* (not the average — averages are dominated by anomalously small denominators) modulus of this sum decays exponentially in $|n|$. Taking the geometric mean and counting the $K \\sim (2d-1)^{|\\Gamma|}$ self-avoiding walks of length $|\\Gamma|$, localization at $E=0$ requires\n\n$$K \\, \\big\\langle \\ln \\mid V/(E-\\varepsilon)\\mid \\big\\rangle_P \u003c 0,$$\n\ni.e. for a box distribution\n\n$$\\frac{W}{V} \u003e \\frac{W_c}{V} \\sim e \\cdot K \\ln(K) \\quad \\text{(Anderson's estimate)}.$$\n\nThe number $W_c/V$ is famously *over*estimated by this argument — modern numerics give $W_c/V \\approx 16.5$ on the 3D cubic lattice at band centre, against Anderson's bound near 30 — because the forward-scattering tree ignores returning loops. The *structure* of the argument, however, is exact: it relies only on A1, A2, A3, A6, A8, plus convergence of the path sum (A5 to suppress finite-size resonances).\n\n### Thouless 1974: boundary-condition sensitivity\n\nCut the system at scale $L$. Compare eigenvalues under periodic vs. antiperiodic boundary conditions; the typical shift $\\delta E(L)$ measures how much wavefunctions feel the edges. Normalize by the mean level spacing $\\Delta(L) \\sim 1/(\\rho L^d)$ to define the dimensionless *Thouless number*\n\n$$g(L) = \\frac{\\delta E(L)}{\\Delta(L)}.$$\n\nThouless [75] identified this with the dimensionless conductance: $g = G / (e^2/h)$. Diffusive states give $g \\sim \\sigma L^{d-2}$; localized states give $g \\sim e^{-L/\\xi}$. The construction needs A1, A2, A6, A7 — the last because non-Hermitian terms make eigenvalues complex and $\\delta E$ stops being a real spectral quantity.\n\n### Abrahams–Anderson–Licciardello–Ramakrishnan 1979: one-parameter scaling\n\nThe leap of [72] is the ansatz that $g(L)$, *and nothing else*, determines its own renormalization-group flow:\n\n$$\\beta(g) \\equiv \\frac{d \\ln g}{d \\ln L}.$$\n\nTwo limits are perturbative:\n\n- $g \\gg 1$ (metal, weak disorder): $\\beta(g) \\to d-2 - a/g + \\mathcal{O}(g^{-2})$, with $a = 1/\\pi^2$ for class A (the $1/g$ term is *weak localization*; the Gor'kov–Larkin–Khmelnitskii Soviet derivation arrived the same year, see neglected list).\n- $g \\ll 1$ (insulator, strong disorder): $\\beta(g) \\to \\ln g$, since $g \\sim e^{-L/\\xi}$ gives $d\\ln g / d \\ln L = -L/\\xi = \\ln g + \\text{const}$.\n\nInterpolating monotonically:\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eOne-parameter beta function\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"80\" y1=\"40\" x2=\"80\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"690\" y=\"345\" fill=\"#e8e6e1\" font-size=\"15\"\u003eln g\u003c/text\u003e\u003ctext x=\"50\" y=\"40\" fill=\"#e8e6e1\" font-size=\"15\"\u003eβ(g)\u003c/text\u003e\u003cline x1=\"80\" y1=\"200\" x2=\"680\" y2=\"200\" stroke=\"#e8e6e1\" stroke-width=\"0.6\" stroke-dasharray=\"3 4\"/\u003e\u003ctext x=\"60\" y=\"205\" fill=\"#e8e6e1\" font-size=\"13\"\u003e0\u003c/text\u003e\u003cpath d=\"M 100 360 Q 250 330 380 280 T 670 130\" stroke=\"#7aa2ff\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003ctext x=\"540\" y=\"120\" fill=\"#7aa2ff\" font-size=\"14\"\u003ed = 3  (MIT at g*)\u003c/text\u003e\u003cpath d=\"M 100 360 Q 280 320 460 220 T 670 200\" stroke=\"#ffb86b\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003ctext x=\"540\" y=\"190\" fill=\"#ffb86b\" font-size=\"14\"\u003ed = 2  (β \u0026lt; 0 always)\u003c/text\u003e\u003cpath d=\"M 100 360 Q 260 330 450 280 T 670 250\" stroke=\"#ff7a90\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003ctext x=\"540\" y=\"245\" fill=\"#ff7a90\" font-size=\"14\"\u003ed = 1\u003c/text\u003e\u003ccircle cx=\"430\" cy=\"200\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"385\" y=\"185\" fill=\"#7ee0a3\" font-size=\"13\"\u003eg*  unstable fixed point\u003c/text\u003e\u003ctext x=\"600\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\"\u003emetal →\u003c/text\u003e\u003ctext x=\"95\" y=\"360\" fill=\"#e8e6e1\" font-size=\"12\"\u003e← insulator\u003c/text\u003e\u003ctext x=\"90\" y=\"60\" fill=\"#e8e6e1\" font-size=\"12\"\u003ed − 2\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: AALR β(g) for orthogonal symmetry class (A4). In d ≤ 2 the flow is everywhere downward — any disorder localizes. In d = 3 the curve crosses zero at g\\*, an unstable fixed point: the mobility edge. Symplectic and unitary classes lift β above this curve at small g and can produce a 2D metal — the bound is class-specific.*\n\nThree consequences fall out, and three caveats:\n\n1. **$d \\le 2$, A4 orthogonal:** $\\beta(g) \u003c 0$ for all $g$ — every state localizes, however weakly disordered. The 2D result reverses for symplectic class (spin-orbit, $\\beta \u003e 0$ at small $1/g$) and for unitary class with topology (quantum Hall). A4 is *not* cosmetic.\n2. **$d = 3$:** $\\beta(g^\\*) = 0$ is the Anderson transition. Linearizing $\\beta'(g^\\*) = 1/\\nu$ defines the correlation-length exponent; numerics give $\\nu \\approx 1.57$ (orthogonal, 3D).\n3. **Relation to A1.** One-parameter scaling assumes $g$ alone runs. Interactions (violating A3) introduce a second scale — the Coulomb gap, the Altshuler–Aronov correction — and the flow becomes two-parameter. This is the Finkel'stein program; it lives in [58] but is routinely forgotten when AALR is quoted as a universal theorem.\n\nThe locator expansion, Thouless's $g(L)$, and the $\\beta$-function are three projections of the same object — the resolvent's analytic structure as a functional of the disorder. Each fails differently when one of A1–A8 is violated, and §3 will catalogue exactly how."}, {"id": "strict-conditions-failure-modes", "title": "Strict Conditions and Failure Modes: Where Each Assumption Breaks", "markdown": "## Strict Conditions and Failure Modes: Where Each Assumption Breaks\n\nThe Anderson theorem, in any of its three guises, is a conditional statement. Drop a condition and the conclusion can survive, mutate, or evaporate — and the literature is littered with claims that quietly assume one regime while citing a result proven in another. Enumerate the assumptions as A1–A8 and audit them one by one.\n\n**A1 — Single-particle Hamiltonian on a lattice (or continuum with short-range potential).** Violations: long-range hopping $t_{ij} \\sim |i-j|^{-\\alpha}$. For $\\alpha \u003c d$ the locator expansion of [71] diverges term-by-term and Levitov resonance counting (1989) shows extended states survive at arbitrarily strong disorder; for $d \u003c \\alpha \u003c 3d/2$ the multifractal regime sets in; only $\\alpha \u003e 3d/2$ recovers the orthodox AL phenomenology. Dipolar ($\\alpha = 3$) and van der Waals ($\\alpha = 6$) Rydberg arrays sit on opposite sides of this boundary in $d=3$ — a routinely-elided distinction.\n\n**A2 — Quenched, statistically homogeneous disorder.** Annealed disorder (potential equilibrates with the electron) destroys localization by definition; the partition function self-averages and the locator expansion never appears. Correlated disorder is more subtle: short-range correlations renormalize $W$ but preserve the universality class, while power-law correlations $\\langle V(r)V(0)\\rangle \\sim r^{-\\beta}$ with $\\beta \u003c 1$ can produce a mobility edge in 1D (the Izrailev–Krokhin \"delocalization windows\"), violating Mott–Twose [73] and Borland [74]. Quasiperiodic potentials (Aubry–André) are a different beast entirely — a self-dual transition at $\\lambda = 2t$ even in 1D, with singular continuous spectrum at the critical point, not the pure-point spectrum of Goldsheid–Molchanov–Pastur [77].\n\n**A3 — Non-interacting electrons.** This is the load-bearing assumption and the one most often discarded silently. Two distinct failure modes:\n\n- *Mott–Anderson regime.* Adding on-site $U$ to a disordered Hubbard model lets a clean-system Mott gap and a disorder-driven mobility edge compete. The Lee–Ramakrishnan review [58] catalogues the perturbative interaction corrections to the conductivity: the Altshuler–Aronov term $\\delta\\sigma \\sim e^2/\\hbar\\,\\sqrt{T/D}$ in 3D and the logarithmic enhancement in 2D, which in dirty systems can *exceed* the weak-localization correction and was misattributed to AL throughout the early 1980s.\n- *Many-body localization.* The Basko–Aleiner–Altshuler argument [81] extends AL into Fock space at finite energy density: above a critical disorder $W_c(\\epsilon)$ and below a critical interaction, eigenstates fail the eigenstate thermalization hypothesis. The avalanche literature now contests whether MBL persists in the thermodynamic limit at all, or whether the apparent transition seen up to $L \\sim 24$ spins drifts to $W \\to \\infty$ with $L$. The honest statement: MBL is a real prethermal phenomenon; whether it is a true phase remains open.\n\n**A4 — Time-reversal symmetry, no spin–orbit coupling (orthogonal class AI).** This is where AALR [72] silently restricts itself. Break TRS by a magnetic field (unitary class A): the Cooperon mode is gapped, the weak-localization correction $\\delta\\sigma_{\\rm 2D} = -(e^2/\\pi^2\\hbar)\\ln(L/\\ell)$ vanishes, $\\beta(g)$ becomes monotonic, and a 2D metal–insulator transition appears (the integer quantum Hall transition is the cleanest example). Add strong spin–orbit (symplectic class AII): the Cooperon flips sign, weak *anti*localization appears, $\\beta(g) \u003e 0$ at large $g$ in 2D, and the 2D system can be a metal. The AALR conclusion \"all states localized in $d \\le 2$\" is *only* correct in class AI; in AII it is wrong, and topological classes (AIII, BDI, CII, D, DIII, C, CI) further fracture the picture into the tenfold way. Citing AALR for a spin-orbit-coupled film is a category error.\n\n**A5 — Thermodynamic limit.** Finite samples produce fake localization in two directions. (i) In 3D weakly disordered systems with localization length $\\xi \\gg L$, every eigenfunction looks \"localized\" on scale $L$ even though the system is metallic in the limit. (ii) In 2D with $\\xi \\sim \\ell\\,\\exp(\\pi k_F\\ell/2)$, $\\xi$ is astronomically larger than any experimental sample for $k_F\\ell \\gtrsim 5$, so 2D films appear metallic — AALR is correct in principle and invisible in practice. The 3D Anderson model on a cubic lattice has $W_c/V \\approx 16.5$ at band center [78, 75]; transfer-matrix scaling pins the critical exponent at $\\nu \\approx 1.57$. Any finite-size claim of a \"transition\" at a different $W_c$ is uncontrolled.\n\n**A6 — Zero temperature, no inelastic dephasing.** Inelastic scattering cuts off the Cooperon at the dephasing length $L_\\phi(T) \\sim T^{-p/2}$. At finite $T$ the localized phase has variable-range hopping with Mott's $\\sigma \\sim \\exp[-(T_0/T)^{1/(d+1)}]$ — finite conductivity, not zero. AL is a $T=0$ spectral statement; calling a $T \u003e 0$ resistivity upturn \"Anderson localization\" is sloppy unless $L_\\phi \\gg \\xi$.\n\n**A7 — Hermitian dynamics (no absorption or gain).** This is the optics-specific landmine. An absorbing medium decays intensity as $\\exp(-r/\\ell_a)$ regardless of disorder. Skipetrov and coworkers showed that the celebrated TiO₂ and GaAs 3D-AL-of-light claims are quantitatively accounted for by absorption and fluorescence — the exponential tails are real but not Anderson. The diagnostic is dimensionless: AL requires $k\\ell_t \\lesssim 1$ (Ioffe–Regel) *and* $\\ell_a \\gg \\xi$. Almost no 3D optical claim satisfies both.\n\n**A8 — Linear wave equation.** Kerr nonlinearity adds $\\chi^{(3)}|\\psi|^2\\psi$ to the stationary Schrödinger equation; the Aspect 1D BEC experiment [82] sits precisely on this knife edge. Nonlinearity produces self-trapped (soliton) modes whose exponential profile mimics AL but is dynamically generated rather than spectrally enforced. The clean test: extinguish the interaction (Feshbach to $a_s = 0$) and verify the profile persists; [82] did this, the early \"AL of light in nonlinear waveguides\" claims often did not."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Smoking Guns versus Circumstantial Evidence", "markdown": "## Signatures: Smoking Guns versus Circumstantial Evidence\n\nThe literature on Anderson localization is littered with claims of \"observation\" that, on inspection, are compatible with three or four mundane alternatives. The discipline of the field — what separates a clean demonstration from a press release — is knowing which signatures genuinely discriminate between localization and its impostors, and which require a controlled chain of nulls. The taxonomy below organizes the standard signatures by what they actually prove.\n\n### Smoking guns\n\n**(S1) Pure point spectrum with positive Lyapunov exponent.** This is the *definition* of localization in the mathematical sense (Gol'dshtein–Molchanov–Pastur [77], Fröhlich–Spencer [78]): the spectrum of $H = -\\Delta + V_\\omega$ has no absolutely continuous component, and the eigenfunctions decay as $|\\psi_E(x)| \\sim e^{-\\gamma(E)|x|}$ with $\\gamma(E) \u003e 0$. Experimentally it can be approached but never reached — one needs the thermodynamic limit and infinite spectral resolution. Direct quantitative access is possible in three near-mathematical settings: transfer-matrix Lyapunov computations on tight-binding chains, ultracold-atom kicked-rotor analogues where the quasi-energy spectrum is measurable, and microwave-cavity arrays where individual eigenmodes can be mapped. When achievable, this is incontrovertible.\n\n**(S2) Wigner–Dyson → Poisson level-statistics crossover.** In the metallic regime adjacent eigenvalues repel and obey GOE/GUE/GSE statistics depending on symmetry class — a consequence of Wegner's sigma-model structure [76] and Efetov's supersymmetric formulation [79]. In the localized regime, neighbouring eigenvalues belong to spatially disjoint states and become statistically independent: the level-spacing distribution collapses to $P(s) = e^{-s}$. The ratio $\\langle r \\rangle = \\langle \\min(s_n, s_{n+1})/\\max(s_n, s_{n+1})\\rangle$ moves from $\\approx 0.53$ (GOE) to $\\approx 0.39$ (Poisson). This is *the* numerical smoking gun for finite-size Anderson and MBL studies. It is dimension- and disorder-strength sensitive and effectively immune to the classical impostors below — but it requires resolving individual eigenstates, which limits it to spectroscopically clean platforms.\n\n**(S3) Direct imaging of an exponential single-particle envelope.** The Aspect group's 2008 BEC-in-speckle experiment [82] is the textbook case: an expanding $^{87}$Rb condensate freezes into a profile whose tails are linear in $\\log|\\psi|^2$ versus $x$ over more than a decade. Three features made it discriminating where decades of solid-state work were not: the disorder potential was independently characterized and tunable, single-particle dynamics was enforced by working at vanishing interaction, and the localization length matched the theoretical prediction $\\xi(E)$ as the speckle correlation length was varied. This is the cleanest macroscopic demonstration on record.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eSignature ladder\u003c/title\u003e\u003ctext x=\"360\" y=\"24\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" font-family=\"serif\"\u003eDiscriminating power of localization signatures\u003c/text\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"50\" y=\"65\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003estrong\u003c/text\u003e\u003ctext x=\"50\" y=\"370\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003eweak\u003c/text\u003e\u003ctext x=\"40\" y=\"220\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\" transform=\"rotate(-90 40 220)\"\u003ediscriminating power\u003c/text\u003e\u003crect x=\"80\" y=\"70\" width=\"260\" height=\"46\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"90\" y=\"92\" fill=\"#7ee0a3\" font-size=\"14\"\u003eS1  pure point spectrum, γ \u0026gt; 0\u003c/text\u003e\u003ctext x=\"90\" y=\"108\" fill=\"#e8e6e1\" font-size=\"12\"\u003edefinition; needs thermodynamic limit\u003c/text\u003e\u003crect x=\"80\" y=\"128\" width=\"260\" height=\"46\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"90\" y=\"150\" fill=\"#7ee0a3\" font-size=\"14\"\u003eS2  Wigner–Dyson → Poisson\u003c/text\u003e\u003ctext x=\"90\" y=\"166\" fill=\"#e8e6e1\" font-size=\"12\"\u003elevel repulsion lost; symmetry-class aware\u003c/text\u003e\u003crect x=\"80\" y=\"186\" width=\"260\" height=\"46\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"90\" y=\"208\" fill=\"#7ee0a3\" font-size=\"14\"\u003eS3  exponential |ψ(x)|² imaged\u003c/text\u003e\u003ctext x=\"90\" y=\"224\" fill=\"#e8e6e1\" font-size=\"12\"\u003erequires single-particle, known V(x)\u003c/text\u003e\u003crect x=\"380\" y=\"70\" width=\"280\" height=\"46\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"390\" y=\"92\" fill=\"#ffb86b\" font-size=\"14\"\u003eC1  exp. transmission T ∝ e^(−L/ξ)\u003c/text\u003e\u003ctext x=\"390\" y=\"108\" fill=\"#e8e6e1\" font-size=\"12\"\u003econfound: absorption, leakage\u003c/text\u003e\u003crect x=\"380\" y=\"128\" width=\"280\" height=\"46\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"390\" y=\"150\" fill=\"#ffb86b\" font-size=\"14\"\u003eC2  coherent backscattering cone\u003c/text\u003e\u003ctext x=\"390\" y=\"166\" fill=\"#e8e6e1\" font-size=\"12\"\u003econfound: only proves phase coherence\u003c/text\u003e\u003crect x=\"380\" y=\"186\" width=\"280\" height=\"46\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"390\" y=\"208\" fill=\"#ffb86b\" font-size=\"14\"\u003eC3  universal conductance fluctuations\u003c/text\u003e\u003ctext x=\"390\" y=\"224\" fill=\"#e8e6e1\" font-size=\"12\"\u003econfound: mesoscopic, not localized\u003c/text\u003e\u003crect x=\"380\" y=\"244\" width=\"280\" height=\"46\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"390\" y=\"266\" fill=\"#ff7a90\" font-size=\"14\"\u003eC4  τ(L) saturation in light powders\u003c/text\u003e\u003ctext x=\"390\" y=\"282\" fill=\"#e8e6e1\" font-size=\"12\"\u003econfound: fluorescence (Skipetrov)\u003c/text\u003e\u003crect x=\"380\" y=\"302\" width=\"280\" height=\"46\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"390\" y=\"324\" fill=\"#ff7a90\" font-size=\"14\"\u003eC5  σ_dc(T→0) → 0\u003c/text\u003e\u003ctext x=\"390\" y=\"340\" fill=\"#e8e6e1\" font-size=\"12\"\u003econfound: Mott gap, percolation, polaron\u003c/text\u003e\u003cline x1=\"340\" y1=\"60\" x2=\"340\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"0.5\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"210\" y=\"380\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003esmoking guns\u003c/text\u003e\u003ctext x=\"520\" y=\"380\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003ecircumstantial\u003c/text\u003e\u003c/svg\u003e\n*Figure: The discriminating signatures (left, green) directly probe the spectrum or the wavefunction; the circumstantial ones (right) probe transport or coherence and each admit at least one non-localization explanation listed below.*\n\n### Circumstantial signatures and their impostors\n\n**(C1) Exponential transmission decay, $T(L) \\propto e^{-L/\\xi}$.** Routinely reported as \"observation of localization\" in microwave, acoustic, and optical waveguide experiments. The problem: linear absorption produces the *same* exponential law with the absorption length $\\ell_a$ replacing $\\xi$. The control is to (i) vary $L$ at fixed disorder and extract $\\xi$, (ii) measure $\\ell_a$ independently via time-resolved decay in a known sample, (iii) check that $\\xi$ scales correctly with disorder strength rather than tracking sample chemistry. Skipetrov and coworkers showed that several headline 3D AL-of-light claims in TiO$_2$ and GaAs powders collapsed under exactly this audit — the \"exponential tails\" were fluorescence reemission from rare-earth impurities, not localized modes.\n\n**(C2) Coherent backscattering cone.** A factor-of-two enhancement of the reflected intensity in the exact backscattering direction. This proves time-reversed-path interference survives ensemble averaging — i.e., it certifies *weak* localization, the perturbative $O(1/g)$ correction discussed in Lee–Ramakrishnan [58]. It does *not* establish that $g$ has flowed to zero. A diffusive metal exhibits a perfectly good cone. Distinguishing strong from weak localization requires watching the cone's rounding scale ($1/\\ell^*$) and the diffusion constant $D(\\omega)$ vanish together.\n\n**(C3) Universal conductance fluctuations of order $e^2/h$.** Mesoscopic, sample-to-sample fluctuations that are a fingerprint of phase-coherent transport, not of localization per se. They survive deep into the metallic regime and merely set the scale on which any putative critical conductance must be interpreted.\n\n**(C4) Diffusion-constant suppression $D(t) \\to 0$ at long times.** In atomic kicked-rotor experiments this is a near-smoking-gun because the system is unitary and clean; in disordered optical powders it is a near-disaster because fluorescence, slow nonlinear reemission, and Mie resonances can mimic the same time dependence. The Skipetrov critique [Nat. Phot. 7, 48 (2013); New J. Phys. 18, 013039 (2016)] (verify) is the standard reference; the required control is to compare resonant and far-detuned excitation and to suppress inelastic channels.\n\n**(C5) Vanishing DC conductivity, $\\sigma_{\\text{dc}}(T\\to 0) \\to 0$.** The original Anderson-transition signature [71, 58] and the most heavily abused. Alternatives that produce indistinguishable $\\sigma(T)$ curves: (i) Mott–Hubbard gap opening (interaction-driven), (ii) classical percolation through a connectivity transition (no quantum interference required), (iii) polaronic self-trapping in strong electron-phonon coupling, (iv) prethermal glassy freezing in interacting disordered systems. The controls are magnetoresistance (weak antilocalization fingerprint), Hall coefficient (Mott versus Anderson), variable-range-hopping prefactor ($\\sigma \\sim \\exp[-(T_0/T)^{1/(d+1)}]$ for Mott VRH from a localized DOS — itself a *consequence* of localization, not an independent proof), and isotope substitution (kills polarons but leaves AL untouched).\n\n### A working checklist\n\nFor any claim of AL: demand a *direct* spectral or wavefunction probe (S1–S3) or, failing that, at least two independent transport probes whose combined null hypotheses exclude absorption, percolation, and Mott. The 1958 paper [71] is silent on detection; that absence is part of why the word has roamed so freely."}, {"id": "use-and-abuse", "title": "Use and Abuse: How the Word Escaped the Theorem", "markdown": "## Use and Abuse: How the Word Escaped the Theorem\n\nThe phrase \"Anderson localization\" carries the prestige of the 1958 theorem [71] and the 1979 scaling argument [72], but it is now applied across a phylum of systems where neither result strictly applies. Four conflations dominate the literature, and the same diagnostic questions expose nearly every hollow invocation.\n\n### The four conflations\n\n**1. Weak localization masquerading as strong.** AALR's $\\beta(g)$ flow says any 2D non-interacting orthogonal system is asymptotically localized [72]. It does not say a 10-period photonic lattice with quasi-2D geometry is \"in the localized phase.\" The coherent-backscattering cone, the $\\delta\\sigma \\sim -(e^2/\\pi h)\\ln(L/\\ell)$ correction, and its suppression by a perpendicular field are quantum-interference *corrections* to a Drude-like conductor — perturbative, dephasing-sensitive, and reversible. Lee and Ramakrishnan [58] are explicit that this is a sub-asymptotic regime. Papers reporting \"Anderson localization in 2D\" on the basis of a logarithmic conductance correction at finite $T$ are reporting weak localization.\n\n**2. Anderson where Mott is meant.** Disorder-driven AL is single-particle physics; the Mott transition is interaction-driven and clean. \"Mott–Anderson transition\" is legitimate for compensated semiconductors near the metal–insulator boundary where both compete. It is illegitimate as a shorthand for any disordered correlated insulator. The tell: a gap that closes when $U/t$ is tuned and is insensitive to $W$ is Mott, not Anderson, and the localization length is not a meaningful observable.\n\n**3. Random replaced by quasiperiodic.** The Aubry–André model has a self-dual localization transition at $\\lambda/J = 2$ in 1D — finite-strength, deterministic, with sharp mobility edges in generalized variants. This is *not* an Anderson transition in the sense of [71]: the spectrum is singular continuous at criticality, the cocycle Lyapunov exponent has explicit closed form, and Furstenberg's theorem does not apply. Most \"AL\" observations in 1D optical lattices (Roati et al. 2008 and successors, verify) realize Aubry–André; [82] (1D speckle) is the cleaner unambiguous random AL.\n\n**4. Any bound mode in a classical wave system.** A single exponentially decaying intensity profile in a finite disordered photonic, acoustic, or elastic sample is not AL. Sajeev John's proposal [47] required 3D randomness in a photonic pseudogap. The experimental record is a graveyard of retractions: Skipetrov and Page's [*Red light for Anderson localization*](https://iopscience.iop.org/article/10.1088/1367-2630/18/2/021001) (NJP 18, 021001, 2016) showed the canonical TiO$_2$-powder claims were artefacts of near-infrared fluorescence, and the GaAs-powder signature was consistent with absorption. The working consensus is that **3D AL of light has never been cleanly demonstrated**; the field has retreated to microwave networks, 2D waveguide arrays, and ultracold atoms.\n\n### Fields where the term is most casually invoked\n\n| Field | Typical claim | What is usually meant |\n|---|---|---|\n| Photonic waveguide arrays | \"Transverse AL\" of a single beam | Single-band 1D/2D tight-binding model, finite-size, classical |\n| 3D random photonics | \"AL of light in TiO$_2$ / GaAs / Si\" | Diffusion plus absorption or fluorescence; refuted in NJP 18, 021001 |\n| Cold atoms in optical potentials | \"Observation of AL\" | Aubry–André transition or 1D speckle — only [82] is unambiguously random AL |\n| Acoustics / elastic waves | \"Phonon AL in granular media\" | Mode trapping in finite samples; spectral statistics rarely shown |\n| Many-body localization | \"Interacting AL\" | A Fock-space conjecture whose thermodynamic-limit status is under [active dispute](https://arxiv.org/abs/2407.20985) |\n\nMBL deserves a separate flag. The Basko–Aleiner–Altshuler perturbative argument [81] motivated a decade of numerics on $L \\lesssim 24$ spin chains read as evidence for a true phase. The 2020s avalanche literature — Šuntajs, Sels–Polkovnikov, and the 2024–2025 follow-ups including [Morningstar et al. on thermalization fronts](https://arxiv.org/abs/2407.20985) and [recent avalanche studies in isolated systems](https://arxiv.org/abs/2506.04834) — argues that rare ergodic inclusions destabilize MBL at any finite disorder once $L \\to \\infty$. The state of play in mid-2026 is that MBL is at minimum a robust prethermal phenomenon and at most a finite-size mirage; calling it \"Anderson localization for interacting systems\" without that caveat is sloppy.\n\n### The diagnostic checklist\n\nGiven a claim of \"Anderson localization,\" the conditions A1–A8 from §3 reduce to eight probing questions:\n\n1. **Spectrum or single mode?** Was pure point spectrum demonstrated, or was one bound state imaged? Level-spacing statistics (Poisson vs Wigner–Dyson) are the operative test.\n2. **Random or quasiperiodic potential?** If quasiperiodic, cite Aubry–André, not Anderson 1958.\n3. **$\\xi$ saturated with $L$?** The localization length must stabilize as $L \\to \\infty$; if $\\xi \\sim L$, the system is sub-localized.\n4. **Symmetry class declared?** Orthogonal / unitary / symplectic give different $\\beta(g)$; AALR's 2D verdict is class-specific.\n5. **Dephasing controlled?** $\\ell_\\varphi \\gg \\xi$ is required, or the observation is weak localization at best.\n6. **Absorption ruled out?** In optics and acoustics, exponential intensity decay is the generic signature of absorption; only phase-coherent statistics (transmission distribution $P(T)$, $C_2/C_3$ correlations) distinguish AL.\n7. **Interactions weak compared to disorder?** Otherwise the claim belongs to MBL or Mott–Anderson, not Anderson proper.\n8. **Finite-size scaling shown?** A single sample size proves nothing about a thermodynamic phase.\n\nA claim that satisfies all eight is rare. A claim that fails three or more is, almost without exception, an exponentially decaying mode — not Anderson localization.\n\nSources:\n- [Red light for Anderson localization (Skipetrov \u0026 Page, NJP 18, 021001, 2016)](https://iopscience.iop.org/article/10.1088/1367-2630/18/2/021001)\n- [Thermalization propagation front and robustness against avalanches in localized systems (2024)](https://arxiv.org/abs/2407.20985)\n- [Thermal avalanches in isolated many-body localized systems (2025)](https://arxiv.org/abs/2506.04834)"}, {"id": "status-believers-checklist", "title": "Status and the Believer's Checklist: Canonical, Mutated, or Contested", "markdown": "## Status and the Believer's Checklist: Canonical, Mutated, or Contested\n\nThree tiers, in descending order of confidence.\n\n### Canonical and mathematically settled\n\nSingle-particle Anderson localization is, by 2026, one of the most thoroughly closed chapters in mathematical physics outside of integrable systems. The combination of multiscale analysis (Fröhlich–Spencer, 1983 [78]) and the fractional-moment method (Aizenman–Molchanov, 1993) yields rigorous proofs of pure-point spectrum, exponentially decaying eigenfunctions, and *dynamical* localization for the discrete Anderson model on $\\mathbb{Z}^d$ in two regimes: (i) large disorder $W/V$ at all energies, and (ii) any disorder at energies sufficiently close to the band edge — the Lifshitz-tail regime. The FMM gives stronger dynamical statements than MSA and now covers continuum operators, sign-indefinite single-site potentials, and certain non-monotone perturbations ([An Introduction to the Mathematics of Anderson Localization, arXiv:1104.2317](https://arxiv.org/abs/1104.2317)). What remains open in the strictly single-particle setting is narrow: a proof of the metal–insulator transition itself in $d=3$. The existence of an extended-states phase at weak disorder is still conjectural on $\\mathbb{Z}^3$; only on Bethe lattices and similar tree-like graphs is delocalization rigorously established.\n\nThe 1D case has been complete since Gol'dshtein–Molchanov–Pastur (1977) [77]; standard textbook attribution to Mott–Twose (1961) [73] or Borland (1963) [74] should be read as physically motivated arguments, not theorems.\n\n### Canonical within a symmetry class, mutated outside it\n\nThe 1979 scaling theory [72] — the $\\beta(g) = d\\ln g / d\\ln L$ flow that delivered \"all states localized in $d\\le 2$\" — is verified within the **orthogonal** symmetry class (TRS, spin-rotation symmetric). It is *wrong* without qualification in the **symplectic** class (broken spin-rotation, intact TRS), where a true 2D metal–insulator transition exists, and changes sign in the **unitary** class (broken TRS), where weak antilocalization replaces weak localization. The Altland–Zirnbauer tenfold way ([Chiu et al., arXiv:1505.03535](https://arxiv.org/pdf/1505.03535)) is therefore not an addendum to AALR but a *precondition* for invoking it: each of the ten classes has its own $\\beta$-function, its own lower critical dimension, and its own list of topologically protected delocalized states (chiral classes in odd $d$, surface modes of topological insulators/superconductors). Any paper that writes \"by AALR, this system is localized\" without naming the symmetry class is committing the most common error in the modern literature.\n\nThe Wegner [76] / Efetov [79] sigma-model derivation makes the symmetry dependence manifest — localization is the broken-symmetry phase of a $\\sigma$-model on a supergroup whose target manifold depends entirely on the AZ class — and is now the framework in which the field genuinely thinks. The Lee–Ramakrishnan review [58] codified the orthogonal-class version; the full classification is younger and not yet in most graduate texts.\n\n### Genuinely contested\n\nMany-body localization, in the thermodynamic limit, is the live wire. The Basko–Aleiner–Altshuler perturbative argument [81] convinced the community for roughly a decade that MBL was an extension of single-particle AL into Fock space. Since the Šuntajs–Sels–Polkovnikov avalanche line (2020 onward), consensus has cracked:\n\n- A 2025 study finds that, even at strong disorder, avalanches occur whenever a seed thermal region scales with system length above a finite ratio, and the \"intermediate\" subdiffusive phase between MBL and ergodic tends to vanish as $L\\to\\infty$ ([*Thermal avalanches in isolated many-body localized systems*, arXiv:2506.04834](https://arxiv.org/abs/2506.04834)).\n- Counter-claims of stability survive in models with sufficiently long-range (power-law) interactions above an interaction-dependent disorder threshold ([arXiv:2601.13485](https://arxiv.org/abs/2601.13485)).\n- Short-range finite-density spin-chain MBL is now widely regarded as a *prethermal* or finite-size phenomenon rather than a true thermodynamic phase, though dissent is loud and credentialed.\n\nTranslation: \"MBL has been observed\" in a finite-size cold-atom or trapped-ion experiment is true and unremarkable; \"MBL is a phase of matter\" is a claim the field is no longer prepared to grant without a tendentious definition of *phase*.\n\n### The believer's checklist\n\nAny paper claiming a new instance of Anderson localization must answer the following before AETHER will index it as such, not merely as \"exponentially decaying mode in disordered medium\":\n\n1. **Hamiltonian.** Write the single-particle (or many-body) Hamiltonian explicitly. Name the random variable, its distribution, and whether it is bounded with a density. Fractional-moment results require this.\n2. **Symmetry class.** Identify the Altland–Zirnbauer class. If the paper invokes scaling theory or weak-localization corrections, the class fixes the sign of the leading $\\beta(g)$ correction and the lower critical dimension.\n3. **Spectrum vs. dynamics.** State whether the claim is spectral (pure point), dynamical (no transport), or merely a single-realization eigenfunction. These are distinct theorems.\n4. **Lyapunov exponent / localization length.** Report $\\xi$ extracted from a finite-size scaling that does not saturate at sample size. If $\\xi \\gtrsim L$, the system is in the crossover and \"localized\" is editorial.\n5. **Rule out alternatives.** Absorption, gain, nonlinearity, decoherence, finite-temperature dephasing, sample-to-sample classical scattering — each mimics exponential decay. Skipetrov's critique of 3D photonic AL claims (Nature Photonics 7, 48 (2013)) is the working template.\n6. **Ensemble averaging.** Show the exponent is self-averaging: the distribution of $\\ln\\lvert\\psi\\rvert$ over disorder realizations, not a single trace.\n7. **Finite-size scaling.** Demonstrate the result is not a function of a single $L$. For MBL claims especially, $L\\le 24$ spin chains are evidence about $L\\le 24$ spin chains, not about the thermodynamic limit.\n8. **Disorder, not quasiperiodicity, unless argued.** If the potential is Aubry–André or Fibonacci, call the result *quasiperiodic* localization and cite the self-dual transition — not Anderson 1958 [71].\n9. **Interactions.** State whether the system is non-interacting, weakly interacting (perturbative regime around AL), or strongly interacting (MBL territory, contested).\n10. **The Mott–Anderson question.** If the experiment shows a metal–insulator transition, demonstrate that what is being varied is *disorder* at fixed interaction, not the converse. Otherwise the Mott contribution is doing the work and \"Anderson localization\" is the wrong label.\n\nA paper satisfying items 1–8 has earned the canonical label. Items 9–10 separate the genuine extensions from the rhetorical ones."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent six sections being careful. Here I will not be.\n\n### What I will defend with my reputation\n\nSingle-particle Anderson localization, as a mathematical statement about the spectrum of $H = -\\Delta + V_\\omega$ with i.i.d. random $V_\\omega$ on $\\mathbb{Z}^d$, is **settled physics**. The Fröhlich–Spencer multiscale analysis and the Aizenman–Molchanov fractional-moment method between them deliver pure point spectrum with exponentially decaying eigenfunctions at strong disorder or band edges in any dimension, and complete localization in $d=1$ for any non-zero disorder. The Lyapunov exponent is positive, the dynamics are non-spreading, and the conductivity is exactly zero at $T=0$. Anyone who tells you this is \"still open\" is conflating the theorem with one of its many cousins.\n\nI will likewise defend the **orthogonal-class AALR scaling picture in $d=1,2,3$** as a quantitatively correct description of the non-interacting flow. The numerics on transfer matrices and the 3D transition exponent $\\nu \\approx 1.57$ have closed that door. I will defend the symmetry-class dependence — orthogonal localizes in 2D, symplectic does not — as one of the cleanest predictions in disordered-systems theory, vindicated experimentally in spin-orbit-coupled 2D electron gases and in cold-atom kicked-rotor analogues.\n\n### What is shakier than the literature admits\n\nThree things, named.\n\nFirst, the **interacting extension**. The standard story — Basko–Aleiner–Altshuler perturbative MBL, then a wave of ED at $L \\le 20$ — rests on assumptions that the avalanche analyses of 2020–2024 have rendered uncomfortable: locality of the effective Hamiltonian under RG, absence of rare ergodic inclusions of sufficient measure, and a Thouless-time/Heisenberg-time separation that may simply not survive $L \\to \\infty$. I would not bet my reputation that MBL exists as a true thermodynamic phase. I would bet it as a robust prethermal regime, which is a much weaker claim than the one usually made.\n\nSecond, the **Mott mobility edge in 3D**, when invoked as a sharp object in real dirty metals. The non-interacting calculation gives a sharp $E_c$; the experimental \"mobility edge\" in doped semiconductors is dressed by Coulomb interactions, by the Altshuler–Aronov singularity, and by the soft Coulomb gap of Efros–Shklovskii. The textbook diagram showing $\\sigma(E)$ with a clean jump at $E_c$ is a non-interacting cartoon being passed off as a measured fact.\n\nThird, **photonic and acoustic AL claims in 3D**. The Maret group's milestones [47] were followed by the Wiersma-era debates over fluorescence and absorption mimicking localization signatures. The current evidence for genuine 3D photonic AL — as opposed to absorption-disguised diffusion — remains less airtight than optics reviews suggest.\n\n### Three open questions I would actually work on, ranked\n\n1. **Does MBL survive the avalanche in $d \\ge 2$?** Because the answer reorganizes our concept of phases at finite energy density.\n2. **What is the universality class, if any, of the quasiperiodic-to-random crossover?** Because Aubry–André and AL are routinely conflated and the critical theory of their interpolation is genuinely unknown.\n3. **Are the 3D photonic localization signatures separable from absorption *in situ*, not just by post-hoc fitting?** Because the field has lived on indirect evidence for thirty years.\n\n### Reading path\n\n1. [71] — Anderson 1958. Read it for the *locator expansion*, not the conclusion; the modern textbook version sands off his caution.\n2. Mott 1967 (verify) — the mobility-edge paper. Without it, half the vocabulary in §4 is unmotivated.\n3. [72] — AALR 1979. The four pages that reorganized the field; note how much is ansatz.\n4. Fröhlich–Spencer 1983 (verify) — the multiscale proof. The physicist's pain here is worth the rigor.\n5. [47] — John 1987. Read alongside a current avalanche-MBL preprint to feel the field's two open frontiers in one sitting."}], "references": [{"n": 1, "title": "Lithography-Free Plasmonic Color Printing with Femtosecond\\nLaser on Semicontinuous Silver Films", "authors": ["Sarah N. Chowdhury", "Piotr Nyga", "Zhaxylyk A. Kudyshev", "Esteban García Bravo", "Alexei Lagutchev", "Alexander V. Kildishev"], "year": 1753, "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.1021/acsphotonics.0c01506.s001", "cited_by": 0, "bucket": "earliest"}, {"n": 2, "title": "BALBOA [Material gráfico] : digno de memoria eterna y muerto en un cadalso", "authors": ["Tomás Rocafort", "Buenaventura Planella"], "year": 1801, "venue": "", "url": "https://doi.org/10.1093/cei/uxac093", "cited_by": 0, "bucket": "earliest"}, {"n": 3, "title": "De Raad van Neêrlandsch Indië", "authors": ["Christiaan Philip Karel Winckel"], "year": 1863, "venue": "Frontiers in Immunology", "url": "https://doi.org/10.3389/fimmu.2021.730088", "cited_by": 0, "bucket": "earl <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
