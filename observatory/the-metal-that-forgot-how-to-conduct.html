 "authors": ["F. J. Wegner"], "year": 1979, "venue": "Zeitschrift für Physik B 35, 207", "url": "https://doi.org/10.1007/BF01319839", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Disordered electronic systems", "authors": ["Patrick A. Lee", "T. V. Ramakrishnan"], "year": 1985, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.57.287", "cited_by": 6055, "bucket": "canon"}, {"n": 16, "title": "Strong localization of photons in certain disordered dielectric superlattices", "authors": ["Sajeev John"], "year": 1987, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/physrevlett.58.2486", "cited_by": 9945, "bucket": "canon"}, {"n": 17, "title": "Disordered Anderson Localization Optical Fibers for Image Transport - A Review", "authors": ["Arash Mafi", "John Ballato", "Karl W. Koch", "Axel Schulzgen"], "year": 2019, "venue": "arXiv", "url": "http://arxiv.org/abs/1902.00433v1", "cited_by": null, "bucket": "arXiv"}, {"n": 18, "title": "Fifty years of Anderson localization", "authors": ["A. Lagendijk", "B. van Tiggelen", "D. S. Wiersma"], "year": 2009, "venue": "Physics Today 62(8), 24", "url": "https://www.lcf.institutoptique.fr/sites/default/files/2019-05/lagendik_phystoday_09.pdf", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Quantum chaos challenges many-body localization", "authors": ["J. Šuntajs", "J. Bonča", "T. Prosen", "L. Vidmar"], "year": 2020, "venue": "Physical Review E 102, 062144", "url": "https://arxiv.org/abs/1905.06345", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Metal–insulator transition in a weakly interacting many-electron system with localized single-particle states", "authors": ["D. M. Basko", "I. L. Aleiner", "B. L. Altshuler"], "year": 2006, "venue": "Annals of Physics 321, 1126", "url": "https://arxiv.org/abs/cond-mat/0506617", "cited_by": null, "bucket": "archive"}, {"n": 21, "title": "Presence and Absence of Delocalization-localization Transition in Coherently Perturbed Disordered Lattices", "authors": ["Hiroaki S. Yamada", "Kensuke S. Ikeda"], "year": 2020, "venue": "arXiv", "url": "http://arxiv.org/abs/2011.07475v2", "cited_by": null, "bucket": "arXiv"}, {"n": 22, "title": "Recent progress on disorder-induced topological phases", "authors": ["Dan-Wei Zhang", "Ling-Zhi Tang"], "year": 2026, "venue": "Journal of Physics Condensed Matter", "url": "https://doi.org/10.1088/1361-648x/ae7cca", "cited_by": 0, "bucket": "recent"}, {"n": 23, "title": "Local moments and localized states", "authors": ["P. W. Anderson"], "year": 1978, "venue": "Reviews of Modern Physics 50, 191", "url": "https://doi.org/10.1103/RevModPhys.50.191", "cited_by": null, "bucket": "archive"}, {"n": 24, "title": "Electrons in Glass (Nobel Lecture, 8 December 1977)", "authors": ["N. F. Mott"], "year": 1977, "venue": "Nobel Foundation", "url": "https://www.nobelprize.org/uploads/2018/06/mott-lecture.pdf", "cited_by": null, "bucket": "archive"}, {"n": 25, "title": "John H. Van Vleck — Nobel Lecture: Quantum Mechanics, the Key to Understanding Magnetism (8 December 1977)", "authors": ["J. H. Van Vleck"], "year": 1977, "venue": "Nobel Foundation", "url": "https://www.nobelprize.org/prizes/physics/1977/vleck/lecture/", "cited_by": null, "bucket": "archive"}], "nsec": 9, "nref": 25, "teaser": "Anderson localization: a theorem, its diaspora, and the word that escaped its proof"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
