ott. The primary reference is the 1961 joint paper of N. F. Mott and W. D. Twose [8], which advanced the conjecture on the basis of a transfer-matrix sketch in the impurity-band limit. Twose was, at the time, a research student; in the convention of the era his name carried less weight in the field's collective memory, and within a decade the result was being cited as \"Mott's theorem\". It was never Mott's alone, and as stated in 1961 it was a conjecture, not a proof.\n\nThe first reasonably rigorous derivation belongs to R. E. Borland [9], who in 1963 analyzed a one-dimensional chain of $\\delta$-function potentials at random positions by studying products of random transfer matrices. The argument is, in modern language, an early use of Furstenberg's theorem on positivity of Lyapunov exponents — a full decade before that machinery was rediscovered in the mathematical-physics community. Thouless [10] cites Borland approvingly, but briefly; later textbooks elide him entirely. The rigorous capstone — pure-point spectrum and exponential localization for a continuous 1D random Schrödinger operator — is the 1977 theorem of Gol'dsheid, Molchanov, and Pastur [4]. Western reviews that mark 1983, with Fröhlich–Spencer's multiscale proof [5], as the start of mathematical localization theory are skipping a Soviet paper that is six years older and, in $d=1$, strictly more general.\n\n### Ioffe–Regel, not Mott–Ioffe–Regel\n\nThe kinematic statement that Bloch transport ceases to make sense when the electronic mean free path $\\ell$ becomes comparable to the Fermi wavelength,\n\n$$k_F \\, \\ell \\;\\gtrsim\\; 1,$$\n\nbelongs to A. F. Ioffe and A. R. Regel [11], in the 1960 Soviet review on non-crystalline substances. The bound is a statement about kinematics: once $\\ell \\lesssim 1/k_F$, the very notion of a momentum eigenstate dressed by weak scattering breaks down. Mott's contribution was the *separate* phenomenological extrapolation that, at this kinematic boundary, the conductivity attains a finite \"minimum metallic\" value $\\sigma_{\\min} \\sim e^2/\\hbar a$ below which no metallic state could exist. The two ideas were grafted into the hyphenated \"Mott–Ioffe–Regel limit\" of modern usage, and $\\sigma_{\\min}$ — now largely rejected, contradicted by the cuprates and other bad metals — has dragged the kinematic bound's reputation down with it. The bound itself, properly Ioffe–Regel, still has content; Mott's overload of it does not.\n\n### The fourth man\n\nThe 1979 scaling theory [12] is signed by four names: E. Abrahams, P. W. Anderson, D. C. Licciardello, T. V. Ramakrishnan. The colloquial contraction \"AAR\", and the still shorter \"Abrahams–Anderson\", erases Licciardello, who as a Princeton graduate student under Thouless produced the numerical conductance-scaling data on which the single-parameter ansatz $\\beta(g) = d\\ln g/d\\ln L$ rested. The historical preface of *50 Years of Anderson Localization* [13] is explicit on this point: the empirical justification for treating the dimensionless conductance $g$ as the sole relevant variable came from Licciardello's Thouless-number computations, not from a field-theoretic argument; Wegner's $\\sigma$-model [14] arrived in the same year but on a different track. Licciardello left academia shortly after the paper appeared, and the asymmetric afterlives of academic and non-academic authors did the rest.\n\nFour neglected names, then, line the entrance to the field: Feher, whose data posed the question; Twose, who co-conjectured the 1D theorem; Borland, who first proved it; and Licciardello, who supplied the scaling theory's numerical spine. The canonical \"Anderson 1958 → gang of four 1979\" headline collapses at least five distinct intellectual events — a magnetic-resonance puzzle, a probabilistic locator argument, a 1D conjecture-and-proof pair, a Soviet kinematic bound, and a numerical-plus-field-theoretic scaling synthesis — into one straight line. Everything that follows in this dossier inherits that compression, and most of the abuses we will catalogue trace back to forgetting which event one is actually invoking."}, {"id": "the-physics-locator-to-scaling", "title": "The Physics: From the Locator Expansion to the Single-Parameter Flow", "markdown": "## The Physics: From the Locator Expansion to the Single-Parameter Flow\n\nThe 1958 paper [1] sets a single quantum particle on a lattice and asks whether a wavepacket released at site $0$ ever escapes. The Hamiltonian is the now-canonical tight-binding form\n\n$$ H \\;=\\; \\sum_{i} \\varepsilon_i \\, c_i^\\dagger c_i \\;-\\; \\sum_{\\langle i j \\rangle} t_{ij}\\, c_i^\\dagger c_j, \\qquad \\varepsilon_i \\sim \\text{i.i.d. uniform on } [-W/2,\\,W/2], $$\n\nwith hopping $t_{ij}=t$ on nearest neighbours of a $d$-dimensional cubic lattice and disorder strength $W$. There is no interaction, no phonon bath, no magnetic field; the question is purely spectral. Anderson's deliberate choice of *uncorrelated* site energies, motivated by Feher's ENDOR data on shallow donors in Si [2], is what gives the model its name and its difficulty: every standard perturbation theory in $t/W$ encounters small denominators of the form $(\\varepsilon_i - \\varepsilon_j)^{-1}$ which, for nearby site energies, blow up.\n\n### The locator expansion\n\nAnderson's trick is to expand not in $t$ but in the *locator* $g_i(E) = (E-\\varepsilon_i)^{-1}$, the bare site Green's function. The full resolvent matrix element between sites $0$ and $n$ admits a renormalised series over self-avoiding paths $\\Gamma: 0\\!\\to\\! n$,\n\n$$ G_{0n}(E) \\;=\\; \\sum_{\\Gamma:\\,0\\to n} \\;\\prod_{i\\in\\Gamma}\\, \\tilde g_i(E)\\; \\prod_{\\langle ij\\rangle\\in\\Gamma} t_{ij}, $$\n\nwhere $\\tilde g_i(E) = (E - \\varepsilon_i - \\Sigma_i(E))^{-1}$ carries a self-energy collecting all loops attached at $i$. A wavepacket fails to diffuse — the eigenstate at energy $E$ is localized around the origin — iff this series converges with probability one and the typical decay is exponential, $|G_{0n}|\\sim e^{-n/\\xi(E)}$, with $\\xi(E)$ the localization length.\n\nAnderson's heuristic convergence criterion replaces the random products by their *typical* (geometric-mean) value. A path of length $L$ on a lattice with coordination $Z$ contributes a factor $\\sim (Zt/W)^L$ times $L$ small denominators, each typically $\\sim W$. After resumming over $\\sim Z^L$ paths and demanding the *typical* term shrink, one obtains the criterion\n\n$$ \\frac{Z\\, t}{W}\\, \\ln\\!\\left(\\frac{W}{t}\\right) \\;\\lesssim\\; 1 \\qquad \\Longleftrightarrow \\qquad W \\;\\gtrsim\\; W_c \\sim Z t \\ln(W/t), $$\n\nthe famous logarithm that makes the bound non-trivial. This is *not* a theorem. Two well-known holes: (i) replacing products of random variables by their typical value is a uniform-convergence statement and ignores the rare large denominators that, in fact, dominate the *mean* Green's function; (ii) the self-avoidance constraint introduces correlations between segments that the multiplicative ansatz silently breaks. Anderson himself flagged the argument as \"almost certainly correct in the convergent regime, but for entirely the wrong reason\" in his Nobel lecture [3], and noted that the original 1958 manuscript was \"unreadable\" [13]. The two strands of rigorous follow-up — multiscale induction [5] and the fractional-moment method [6] — fix exactly these two holes, the former by controlling rare resonances inductively over length scales, the latter by working with $\\mathbb{E}\\!\\left[|G_{0n}|^s\\right]$ for $s\u003c1$, where products of small denominators are integrable.\n\nThe numerical value of $W_c/t$ at the band centre for the 3D cubic Anderson model lands at $\\approx 16.5$ from modern transfer-matrix and shift-invert studies — not far from the original locator estimate $\\sim 2 Z e \\ln(\\text{stuff})$, which is the genuinely surprising part of the heuristic.\n\n### Thouless: from heuristic to scaling variable\n\nThe 1958 picture is qualitative; what made it computational was Thouless's reformulation in the early 1970s [10]. Take a finite cube of side $L$. Two energy scales live on it:\n\n- $\\Delta E(L) = 1/[\\rho(E_F) L^d]$, the mean level spacing at the Fermi energy;\n- $\\delta E(L)$, the *Thouless energy* — the typical shift of an eigenvalue when boundary conditions are changed from periodic to antiperiodic.\n\nA delocalized eigenstate at scale $L$ feels the boundary; a localized one does not. The dimensionless ratio\n\n$$ g(L) \\;=\\; \\frac{\\delta E(L)}{\\Delta E(L)} $$\n\nis the *Thouless number*. Two independent calculations show that $g(L)$ is — up to a constant — the dimensionless DC conductance $G(L)/(e^2/h)$ of the same cube: $\\delta E$ is set by the inverse diffusion time $\\hbar D/L^2$, and the Einstein relation gives $G = e^2 \\rho D L^{d-2}$, hence $g \\propto G \\cdot h/e^2$. So a *spectral* sensitivity is identified with a *transport* observable. This is what turned the locator-expansion regime ($g\\ll 1$, exponentially small wavefunction overlap with the boundary) into something one could measure and compute, and it is the engine of every later scaling argument.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eBeta function of single-parameter scaling theory\u003c/title\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"700\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"380\" y1=\"40\" x2=\"380\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"690\" y=\"362\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"end\"\u003eln g\u003c/text\u003e\u003ctext x=\"392\" y=\"52\" fill=\"#e8e6e1\" font-size=\"15\"\u003eβ(g) = d ln g / d ln L\u003c/text\u003e\u003ctext x=\"382\" y=\"358\" fill=\"#e8e6e1\" font-size=\"13\"\u003e0\u003c/text\u003e\u003cpath d=\"M 80 80 Q 250 130 380 220 T 700 300\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"120\" y=\"100\" fill=\"#7aa2ff\" font-size=\"14\"\u003ed = 3 (metal above g*)\u003c/text\u003e\u003cpath d=\"M 80 200 Q 250 240 380 290 T 700 335\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"120\" y=\"220\" fill=\"#ffb86b\" font-size=\"14\"\u003ed = 2 (β \u0026lt; 0 everywhere)\u003c/text\u003e\u003cpath d=\"M 80 280 Q 250 305 380 325 T 700 348\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"120\" y=\"298\" fill=\"#ff7a90\" font-size=\"14\"\u003ed = 1 (always insulating)\u003c/text\u003e\u003ccircle cx=\"455\" cy=\"252\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"465\" y=\"248\" fill=\"#7ee0a3\" font-size=\"14\"\u003eg*: unstable fixed point (d=3)\u003c/text\u003e\u003ctext x=\"465\" y=\"266\" fill=\"#7ee0a3\" font-size=\"12\"\u003emobility-edge transition\u003c/text\u003e\u003cline x1=\"60\" y1=\"180\" x2=\"700\" y2=\"180\" stroke=\"#e8e6e1\" stroke-width=\"0.6\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"66\" y=\"174\" fill=\"#e8e6e1\" font-size=\"12\"\u003elarge-g asymptote: β → d − 2\u003c/text\u003e\u003ctext x=\"66\" y=\"386\" fill=\"#e8e6e1\" font-size=\"12\"\u003esmall-g asymptote: β → ln(g/g_loc) (exponentially localized)\u003c/text\u003e\u003c/svg\u003e\n*Figure: One-parameter scaling flow of Abrahams–Anderson–Licciardello–Ramakrishnan [12]. Sign of $\\beta(g)$ is the sign of $d\\ln g/d\\ln L$: $\\beta\u003e0$ flows to a metal, $\\beta\u003c0$ to an insulator. Only $d=3$ admits an unstable fixed point $g^\\*$ — the mobility-edge transition. In $d=2$ the curve sits entirely below zero, the signature prediction of the gang-of-four paper.*\n\n### The single-parameter flow\n\nThe 1979 paper [12] makes one bold ansatz: under a change of scale $L\\to bL$, $g(bL)$ depends on $L$ *only through* $g(L)$. Then\n\n$$ \\beta(g) \\;\\equiv\\; \\frac{d\\ln g}{d\\ln L} $$\n\nis a function of $g$ alone, and its two asymptotes are fixed by physics one already trusts:\n\n- **Ohmic regime, $g\\to\\infty$.** Conductance scales as $G = \\sigma L^{d-2}$ with $\\sigma$ the bulk conductivity; hence $\\beta(g)\\to d-2$.\n- **Strongly localized regime, $g\\to 0$.** Exponential decay $g(L)\\sim g_0 e^{-L/\\xi}$ gives $\\beta(g)\\to \\ln(g/g_0)$, strictly negative.\n\nA smooth monotonic interpolation between these limits — the only piece that is *assumed* rather than derived — yields the celebrated qualitative picture. In $d=1$, $\\beta(g)$ is negative everywhere, recovering the Mott–Twose–Borland result [8, 9] that all states are localized at any disorder. In $d=3$, $\\beta$ crosses zero at an unstable fixed point $g^\\*$, which is the mobility edge of [7]; flow above $g^\\*$ produces a metal, flow below it an insulator. The signature prediction is $d=2$: $\\beta\\to 0^-$ from below as $g\\to\\infty$, so the marginal dimension sits *just* on the insulating side, and weak-localization corrections drive even a \"good metal\" to logarithmic insulating flow at large $L$ in the orthogonal class.\n\nThree caveats the 1979 paper does not carry on its sleeve. First, single-parameter scaling is a hypothesis, sharpened later by Wegner's σ-model derivation [14] in which the dimensionless coupling of a non-linear σ-model on a non-compact symmetric space *is* the renormalised conductance, and one-loop RG reproduces $\\beta(g)=d-2-c/g+\\dots$ with $c$ depending on the symmetry class. The orthogonal class gives $c=2/\\pi$; the unitary class has $c=0$ at one loop (no weak-localization correction); the symplectic class has $c=-1/\\pi$, *positive* $\\beta$ at large $g$ in 2D, and therefore a genuine 2D metal–insulator transition. The popular slogan \"all states in 2D are localized\" applies *only* to the orthogonal class of non-interacting electrons.\n\nSecond, the flow is in $g$, which is a *typical* conductance; the full distribution $P(\\ln g)$ broadens without bound on approach to the insulator, and the \"single parameter\" describes only its location, not its width. Numerical work since the 1990s has confirmed single-parameter scaling for the *median* of $\\ln g$ but not for higher cumulants.\n\nThird, interactions are absent. The 1985 review of Lee and Ramakrishnan [15] catalogues the Altshuler–Aronov logarithmic corrections that, in 2D, are of the *same* order as the weak-localization correction and have the *opposite* sign in some channels, so even the orthogonal-class scenario is only the non-interacting skeleton of the real problem. The locator expansion does not see any of this; Thouless's $g$ does, but only if one is willing to redefine it operationally in terms of the actual measured conductance — which, as a matter of practical magnetotransport, is what every subsequent experimental test of the gang-of-four prediction has done."}, {"id": "formalization-and-symmetry-classes", "title": "Formalization: σ-Models, Symmetry Classes, and the Rigorous Pillars", "markdown": "## Formalization: σ-Models, Symmetry Classes, and the Rigorous Pillars\n\nThe 1958 locator expansion [1] and the 1979 scaling flow [12] are physics arguments: they assume what they want to compute (self-energies that do not feed back, a single scaling variable that does not fragment) and verify the assumption a posteriori. Between 1977 and 1993 the field acquired two genuinely rigorous backbones — a field theory whose symmetries dictate universality classes, and a probabilistic apparatus that proves exponential localization as a theorem. Neither backbone fully meets the other in the middle; the σ-model is non-rigorous as a measure, the multiscale machinery says nothing about the metallic phase. Treat them as complementary, not unified.\n\n### Wegner's reformulation: the non-compact σ-model\n\nWegner's 1979 paper [14] does for localization what Hubbard–Stratonovich had done for magnetism: it converts a disorder average over Green's functions into a functional integral whose slow modes form a sigma-model on a symmetric space. The starting object is the two-particle Green's function\n\n$$\nK(E,\\omega;\\mathbf{r},\\mathbf{r}') = \\overline{ G^{R}(E+\\tfrac{\\omega}{2};\\mathbf{r},\\mathbf{r}') \\, G^{A}(E-\\tfrac{\\omega}{2};\\mathbf{r}',\\mathbf{r}) },\n$$\n\nwhose low-frequency, long-distance limit controls the diffusion pole. After replicating ($n$ copies) or supersymmetrizing, integrating out the disorder, and saddle-pointing the resulting matrix field $Q$, one obtains an action of the form\n\n$$\nS[Q] = \\frac{\\pi \\nu}{8} \\int d^{d}r \\, \\mathrm{Str}\\!\\left[ D_{0}\\,(\\nabla Q)^{2} - 2 i \\omega \\Lambda Q \\right], \\qquad Q^{2} = \\mathbb{1}.\n$$\n\nThe constraint $Q^{2}=\\mathbb{1}$ forces $Q$ onto a coset $G/H$ — for the orthogonal (TRS, no SO) class this is $\\mathrm{O}(2n,2n)/\\mathrm{O}(2n)\\times\\mathrm{O}(2n)$ in the replica trick, $\\mathrm{OSp}(2,2|2)/\\mathrm{OSp}(2|1)\\times\\mathrm{OSp}(2|1)$ in Efetov's supersymmetric reformulation. The crucial word is *non-compact*: the boson sector of $Q$ lives on a hyperboloid, not a sphere, because the relevant bilinear is $G^{R}G^{A}$ with opposite-signed retarded/advanced contour pieces. Compactify by accident — as the early replica literature occasionally did — and one loses the diffusion mode entirely.\n\nWegner's conjecture, made explicit at the end of [14], is the now-canonical β-function\n\n$$\n\\beta(g) \\;=\\; \\frac{d \\ln g}{d \\ln L} \\;=\\; (d-2) - \\frac{a}{g} - \\frac{b}{g^{2}} - \\cdots,\n$$\n\nwhere the $1/g$ correction's sign is fixed by the symmetry class: $a\u003e0$ (orthogonal) gives the AALR insulating flow in $d=2$ [12]; $a=0$ (unitary, broken TRS) admits a quantum-Hall-style line of extended states; $a\u003c0$ (symplectic, strong spin–orbit) reverses the flow and produces a genuine $d=2$ metal–insulator transition. Wegner had the three classes — orthogonal, unitary, symplectic — at the field-theoretic level before Altland and Zirnbauer extended the count to ten by adding particle-hole and chiral involutions (verify, for the 1997 AZ paper, which is not in the corpus). The three \"Wigner–Dyson\" classes are not numerology; they are the three real forms of the symmetric space compatible with the time-reversal and spin-rotation symmetries of a single-particle Hamiltonian, and the σ-model inherits them by construction.\n\nWhat Wegner's program proves: the structure of perturbation theory, the existence of universal beta-functions at each loop order, and — assuming a single relevant coupling — the dimensional dependence of the localization length exponent $\\nu$. What it does *not* prove: that the σ-model partition function is a legitimate object beyond formal manipulation, that the saddle is unique, or that strong-coupling fixed points exist as anything more than a name for the divergence of perturbation theory. The σ-model is the language in which one *states* universality; rigor enters elsewhere.\n\n### Gol'dsheid, Molchanov, Pastur 1977: the Soviet pillar the textbooks skip\n\nThe first complete theorem of Anderson-localization type is Gol'dsheid–Molchanov–Pastur [4]: for the continuous one-dimensional random Schrödinger operator $-\\partial_{x}^{2} + V(x)$ with $V$ a stationary stochastic process of sufficiently mixing type, the spectrum is pure point with probability one, and the eigenfunctions decay exponentially at a rate equal to the Lyapunov exponent of the associated transfer matrix. The proof rides on Furstenberg's theorem on products of i.i.d. matrices in $\\mathrm{SL}(2,\\mathbb{R})$: under non-compactness and irreducibility hypotheses, the Lyapunov exponent $\\gamma(E) = \\lim_{L\\to\\infty} L^{-1} \\ln \\|T_{L}\\cdots T_{1}\\|$ is strictly positive almost everywhere in $E$, which by Oseledets' theorem forces a one-dimensional contracting subspace at each energy — the localized eigenfunction.\n\nThis pre-dates Fröhlich–Spencer by six years and is, in 1D, more general: it handles continuous potentials, not just discrete tight-binding, and arbitrary stationary disorder, not just i.i.d. Western reviews routinely date \"rigorous Anderson localization\" from 1983; the omission has been documented by Kunz, Souillard, and Bourgain among others. Borland's 1963 argument [9] is in the same lineage — products of random matrices on $\\mathrm{SL}(2)$ — but stops short of a measure-theoretic statement about spectrum. The 1977 paper is where the words \"pure point spectrum\" become a theorem.\n\nWhat [4] proves: complete localization in $d=1$ for a wide class of stationary disorders, with explicit identification of the inverse localization length as the top Lyapunov exponent. What it does *not* prove: anything in $d\\ge 2$ (Furstenberg machinery is intrinsically one-dimensional; $\\mathrm{SL}(2)$ has no useful higher analogue) and nothing about the mobility edge, which requires energy-resolved estimates the Lyapunov framework does not supply.\n\n### Fröhlich–Spencer 1983: multiscale analysis in all dimensions\n\nFröhlich and Spencer [5] gave the first theorem valid in arbitrary dimension for the lattice Anderson Hamiltonian $H = -\\Delta + \\lambda V_{\\omega}$ with i.i.d. on-site $V_{\\omega}$ of bounded density. The statement: for $\\lambda$ sufficiently large, *or* for energies $E$ sufficiently far into the Lifshitz tails (band edges), the resolvent $(H-E-i0)^{-1}(x,y)$ decays exponentially in $|x-y|$ with probability one, uniformly in the system size. From resolvent decay one extracts dynamical localization and pure-point spectrum via standard arguments (Simon–Wolff, RAGE).\n\nThe proof technique — *multiscale analysis* — is an induction on length scales $L_{k+1} \\sim L_{k}^{\\alpha}$ with $\\alpha\\in(1,2)$. At each scale one establishes a \"good box\" probability: the resolvent on a box of side $L_{k}$ decays exponentially except with probability $\\le L_{k}^{-p}$, conditional on a Wegner estimate $\\Pr[\\mathrm{dist}(\\sigma(H_{L}),E)\u003c\\epsilon] \\le C \\epsilon L^{d}$. The inductive step glues good boxes using a deterministic resolvent identity and Combes–Thomas decay outside resonances. The whole apparatus is engineered to defeat the small-denominator problem of Anderson's original locator expansion — the very issue [1] handled only probabilistically.\n\nWhat [5] proves: exponential decay of eigenfunctions in any $d$, but only in the strong-disorder or band-edge regime. What it does *not* prove: anything about the localization–delocalization transition in $d\\ge 3$ at moderate disorder, where the predicted mobility edge would live; nor anything about extended states. The metallic phase in $d=3$ remains, as of the corpus's date range, mathematically open. Anderson's 1958 *conclusion* (states localized for large $W/t$) is now a theorem; his 1958 *transition* (a mobility edge at intermediate $W/t$) is not.\n\n### Aizenman–Molchanov 1993: the fractional-moment shortcut\n\nAizenman and Molchanov [6] replaced multiscale induction with a single-scale a-priori estimate on fractional moments of the Green's function. For $s\\in(0,1)$,\n\n$$\n\\mathbb{E}\\!\\left[\\, |G(x,y;E+i0)|^{s} \\,\\right] \\;\\le\\; A\\, e^{-\\mu |x-y|},\n$$\n\nwith $\\mu\u003e0$ once disorder is strong enough, follows from a self-consistent inequality on the lattice combined with the elementary observation that fractional moments of $|G|$ are finite even though $|G|$ itself is heavy-tailed. From the moment bound, exponential decay of eigenfunctions and dynamical localization follow more or less directly via Chebyshev and a Borel–Cantelli argument. The proof is short (a few pages), the constants are tracked, and the technique extended to random Schrödinger operators with unbounded potentials and to certain quantum graphs.\n\nThe trade-off: [6] requires either large disorder or extreme energies, just like [5]. It does not reach into the band centre at moderate disorder any more than multiscale does. The two methods have complementary strengths — fractional moments give sharper decay constants and extend to long-range hopping; multiscale survives weaker regularity assumptions on the disorder distribution — but they prove the same class of statements about the same regime. The Anderson model at $d=3$, $W/t \\sim W_{c}$, sits outside both.\n\n### Where the pillars do and do not meet\n\nThe σ-model provides the *vocabulary* of universality — symmetry classes, β-functions, critical exponents — but no theorems about the underlying lattice problem. The probabilistic methods provide *theorems* — pure-point spectrum, exponential decay — but only in regimes (strong disorder, band tails, $d=1$) where universality is least at stake. The interesting middle, where the mobility edge actually lives and where the σ-model's irrelevant operators were supposed to be irrelevant, has no rigorous account. When a paper writes \"by Anderson localization,\" ask which pillar is being invoked: a 1979 scaling diagnosis, a 1977/1983/1993 theorem, or — most often — neither."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From P:Si to Photons, Microwaves, and Cold-Atom Speckle", "markdown": "## Landmark Experiments: From P:Si to Photons, Microwaves, and Cold-Atom Speckle\n\nThe theorem of [1] is about a single non-interacting quantum particle on a static disordered lattice in a time-reversal-symmetric Hamiltonian. Anything else — finite-temperature electrons in a real semiconductor, classical waves in a turbid medium, an interacting many-body wavefunction — shares the words \"exponential profile\" with the 1958 model but may not share its content. The experimental record falls into two piles: experiments that cleanly probe the *non-interacting orthogonal* universality class, and experiments that wear the name \"Anderson localization\" while carrying additional physics that the 1958 theorem says nothing about. The audit matters because the symbols agree across the divide while the conclusions do not.\n\n### Feher's donors: the anchor that wasn't a localization experiment\n\nFeher's electron–nuclear double resonance (ENDOR) work on P:Si [2] is, by Anderson's own account in [3], the empirical trigger for [1]. What Feher *measured* was the contact hyperfine coupling of individual $^{31}\\mathrm{P}$ donor electrons to surrounding $^{29}\\mathrm{Si}$ nuclei — an envelope of the donor wavefunction with sub-lattice resolution. The point that lit Anderson's argument was not that the wavefunction was *localized* (an isolated donor in a deep central-cell potential is bound anyway) but that *spin diffusion* among donors via flip-flop processes shut down past a critical disorder, even though the spin-bearing electrons had energetically accessible neighbours. Feher's experiment is therefore the empirical seed of the *locator expansion*, not a measurement of an Anderson mobility edge. Modern textbooks that present [1] as a transport prediction inverted by [15] read history backwards.\n\n### Si:P: the canonical electronic transition, and the exponent that wouldn't sit still\n\nUncompensated Si:P, stress-tuned across the metal–insulator transition by Rosenbaum, Thomas, Paalanen and collaborators (1980–83), is the closest the solid state ever came to a controlled Anderson MIT in a real electron system. The conductivity at $T \\to 0$ followed $\\sigma(n) \\propto (n/n_c - 1)^\\nu$ with $\\nu \\approx 0.5$ — sharply at odds with the orthogonal scaling-theory expectation $\\nu \\approx 1$ deriving from [12]. Compensated Si:P,B gave $\\nu \\approx 1$. Stupp, von Löhneysen and collaborators (1993) then argued that the $\\nu = 1/2$ figure was an artefact of an over-narrow critical window; isotopically purified $^{28}$Si:P measurements by the Itoh group in the 2000s settled toward $\\nu \\approx 1$. The episode is the cleanest cautionary tale in the field: even in the textbook electronic MIT, the Coulomb interaction enters at the same order as disorder, so the experiment probes the *Anderson–Mott* fixed point of [15], not the [1] universality class. Calling Si:P \"the\" Anderson transition is a generic shorthand worth resisting.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eAudit of landmark experiments by what they actually probe\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eWhat each landmark experiment actually realizes\u003c/text\u003e\u003cline x1=\"80\" y1=\"60\" x2=\"80\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"80\" y1=\"370\" x2=\"700\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"60\" y=\"370\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003enone\u003c/text\u003e\u003ctext x=\"60\" y=\"220\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eweak\u003c/text\u003e\u003ctext x=\"60\" y=\"80\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003estrong\u003c/text\u003e\u003ctext x=\"40\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 40 200)\"\u003einteraction / nonlinearity\u003c/text\u003e\u003ctext x=\"160\" y=\"390\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e1D\u003c/text\u003e\u003ctext x=\"320\" y=\"390\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003equasi-1D\u003c/text\u003e\u003ctext x=\"480\" y=\"390\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e2D\u003c/text\u003e\u003ctext x=\"640\" y=\"390\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e3D\u003c/text\u003e\u003ctext x=\"390\" y=\"400\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\"\u003edimensionality of the disordered medium\u003c/text\u003e\u003ccircle cx=\"160\" cy=\"350\" r=\"9\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"180\" y=\"354\" fill=\"#7ee0a3\" font-size=\"13\"\u003ecold-atom speckle [Billy 2008]\u003c/text\u003e\u003ccircle cx=\"320\" cy=\"345\" r=\"9\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"340\" y=\"349\" fill=\"#7ee0a3\" font-size=\"13\"\u003emicrowave waveguide [Chabanov]\u003c/text\u003e\u003ccircle cx=\"480\" cy=\"345\" r=\"9\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"500\" y=\"349\" fill=\"#7ee0a3\" font-size=\"13\"\u003ephotonic lattice [Schwartz 2007]\u003c/text\u003e\u003ccircle cx=\"640\" cy=\"345\" r=\"9\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"640\" y=\"332\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eultrasound [Hu 2008]\u003c/text\u003e\u003ccircle cx=\"160\" cy=\"305\" r=\"9\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"180\" y=\"309\" fill=\"#ffb86b\" font-size=\"13\"\u003edisordered fiber [Karbasi-Mafi]\u003c/text\u003e\u003ccircle cx=\"320\" cy=\"250\" r=\"9\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"340\" y=\"254\" fill=\"#ffb86b\" font-size=\"13\"\u003enonlinear photonic lattice\u003c/text\u003e\u003ccircle cx=\"640\" cy=\"240\" r=\"9\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"640\" y=\"225\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003e3D cold atoms [Kondov 2011]\u003c/text\u003e\u003ccircle cx=\"640\" cy=\"120\" r=\"9\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"640\" y=\"105\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eSi:P MIT [Paalanen et al.]\u003c/text\u003e\u003ccircle cx=\"320\" cy=\"95\" r=\"9\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"340\" y=\"99\" fill=\"#ff7a90\" font-size=\"13\"\u003etrapped-ion/MBL emulators\u003c/text\u003e\u003ccircle cx=\"160\" cy=\"80\" r=\"9\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"180\" y=\"84\" fill=\"#ff7a90\" font-size=\"13\"\u003eFeher ENDOR (spin diffusion)\u003c/text\u003e\u003crect x=\"520\" y=\"60\" width=\"14\" height=\"14\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"540\" y=\"72\" fill=\"#e8e6e1\" font-size=\"12\"\u003esingle-particle AL\u003c/text\u003e\u003crect x=\"520\" y=\"80\" width=\"14\" height=\"14\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"540\" y=\"92\" fill=\"#e8e6e1\" font-size=\"12\"\u003eAL + extra physics\u003c/text\u003e\u003crect x=\"520\" y=\"100\" width=\"14\" height=\"14\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"540\" y=\"112\" fill=\"#e8e6e1\" font-size=\"12\"\u003ename used loosely\u003c/text\u003e\u003c/svg\u003e\n*Figure: experimental landmarks plotted by dimensionality (x) and strength of interactions/nonlinearity (y). Only the green points realize the [1] universality class directly; orange ones add nonlinearity or absorption; red ones are common but inaccurate uses of the label.*\n\n### Microwave waveguides: the cleanest single-particle realization in the lab\n\nA scalar Helmholtz equation $[\\nabla^2 + (\\omega/c)^2\\varepsilon(\\mathbf{r})]\\psi = 0$ with disordered $\\varepsilon$ is mathematically a one-particle Schrödinger problem in the orthogonal class, *without* interactions or thermal averaging. Microwaves in quasi-1D copper waveguides loaded with random scatterers — Genack, Chabanov, Stoytchev and collaborators from the late 1990s onward — gave the field its purest single-particle data. Transmission statistics $P(T)$ exhibited the predicted crossover from Gaussian to log-normal as $g = \\langle T \\rangle$ dropped below unity; the universal conductance-fluctuation regime ($g \\gg 1$) and the localized regime ($g \\ll 1$) were both attained on the same sample by tuning frequency. These experiments verified the Thouless-conductance scaling variable of [10] in a setting that the [1] theorem genuinely covers. Absorption, the perennial nuisance, was disentangled by comparing time-of-flight tails with the dynamic single-parameter scaling theory.\n\n### Photonic lattices: classical, but watch the nonlinearity\n\n[16] predicted that a sufficiently disordered dielectric near a Bragg pseudogap should localize light by the same mechanism as electrons. Direct optical demonstration required two-dimensional disordered photonic lattices in which a probe beam is launched at a single waveguide and its transverse spreading recorded — Schwartz, Bartal, Fishman, Segev (Nature 2007) is the standard reference, with the Silberberg group at Weizmann (Lahini *et al.*) providing the 1D Aubry–André analogue. These are genuine orthogonal-class experiments *at low intensity*. Crank the input power up and the Kerr nonlinearity turns the system into a discrete nonlinear Schrödinger lattice, where \"localization\" is in part nonlinear self-trapping — a distinct phenomenon that the 1958 theorem does not cover. The disordered-core \"Anderson fibers\" reviewed in [17] are bona fide transverse-localization devices for image transport, but their physics merges 2D AL with longitudinal propagation and modal coupling.\n\n### Cold-atom matter-wave speckle: the cleanest direct profiles\n\nThe 2008 *Nature* duo — Billy *et al.* (Institut d'Optique) for a 1D Bose–Einstein condensate expanding into a laser-speckle potential, and Roati *et al.* (Florence) for the Aubry–André transition in a bichromatic lattice — measured the exponential envelope of localized matter-wave packets directly. The speckle experiment in particular is single-particle to a controlled degree: the BEC is allowed to expand until the inter-atomic interaction energy is below the disorder scale, after which the cloud evolves as approximately independent particles in a random potential. 3D mobility-edge experiments — Kondov *et al.* (Illinois, 2011) and Jendrzejewski *et al.* (Palaiseau, 2012) — extracted a critical energy above which atoms escaped diffusively, with subtle complications from the non-Gaussian energy distribution of the expanding cloud and from anisotropic speckle statistics. These are the closest the field has come to a controlled $3$D Anderson transition in the orthogonal class.\n\n### Ultrasound and other classical waves\n\nHu, Strybulevych, Page, Skipetrov, van Tiggelen (*Nature Phys.* 2008) reported 3D ultrasound localization in disordered networks of aluminium beads, with transverse confinement of the diffuse halo as the smoking gun. As [18] notes in its retrospective, classical-wave experiments are essential precisely because they sidestep the interaction problem that contaminates every solid-state attempt.\n\n### Where the label is used loosely\n\nThree usages should be treated with caution. (i) \"Anderson localization\" is sometimes invoked for bound states of *correlated* random media — e.g. hyperuniform or short-range-correlated dielectrics — where the mobility-edge concept is borrowed without the underlying assumption of i.i.d. disorder. (ii) Trapped-ion and ultracold-atom emulators of many-body localization (Schreiber *et al.*, Smith *et al.*, mid-2010s) are routinely presented as \"interacting Anderson localization\", but as the conflations table makes explicit they probe Fock-space localization, whose existence in the thermodynamic limit is contested [19]. (iii) Cuprate and pnictide transport above the Mott–Ioffe–Regel bound is occasionally framed as \"incipient Anderson localization\"; the inelastic scattering rate that defines $k_F\\ell \\sim 1$ in those materials has nothing to do with the static disorder of [1].\n\nThe honest summary: the cleanest verifications of the 1958 theorem are not in the electronic systems that motivated it. Microwaves, photons at low intensity, expanding cold atoms, and ultrasound do the work that Si:P could never quite finish."}, {"id": "use-and-abuse", "title": "Use and Abuse: Exponential Tails Are Not Theorems", "markdown": "## Use and Abuse: Exponential Tails Are Not Theorems\n\nThe 1958 theorem [1] proves a precise statement about a precise object. The phrase \"Anderson localization\" has since been pasted onto a wide class of exponentially decaying intensity profiles in which one or more of the theorem's premises is silently absent. Most of these usages are not wrong because the underlying physics is fake; they are wrong because the cited authority does not cover them. This section catalogs the recurring abuses.\n\nThe hypotheses one is allowed to invoke when writing \"by Anderson localization\" are: (a) a **single** quantum particle; (b) on a lattice (or in a continuum) with **uncorrelated on-site disorder** drawn i.i.d. from a bounded distribution; (c) a **time-reversal-symmetric**, spin-rotation-invariant Hamiltonian (Wigner–Dyson orthogonal class); (d) **no interactions**; (e) a stationary potential. Drop any one of these and you exit the protection of [1], [5], [6], and you are using the name as a metaphor.\n\n### Localization vs. bound states vs. classical attenuation\n\nThe first abuse is dimensional. An eigenstate of a deep isolated potential well decays exponentially outside the well; so does an eigenstate of the random Hamiltonian $H = -t\\sum_{\\langle ij\\rangle} c_i^\\dagger c_j + \\sum_i \\epsilon_i n_i$ in the strong-disorder regime [1]. The two profiles look identical on a logarithmic plot, but the second is statistical (every eigenstate is exponentially localized about a *different* random center with localization length $\\xi(E,W)$ characterized by a Lyapunov exponent $\\gamma = \\xi^{-1}$ that exists almost surely by Furstenberg's theorem [9, 4]), while the first is a single bound state of a non-random Hamiltonian. Calling a deep-well bound state \"Anderson-localized\" is a category error that recurs in cold-atom and photonic literature where a single sufficiently deep speckle minimum traps a particle. The diagnostic is participation-ratio scaling with system size at fixed disorder, not the existence of an exponential tail.\n\nThe second abuse is interpretational. Beer–Lambert attenuation in a lossy or scattering medium also produces exponential intensity decay, $I(z) = I_0 e^{-z/\\ell_{\\rm sca}}$, with $\\ell_{\\rm sca}$ the scattering mean free path. This is **classical** transport: the diffuson, not the cooperon, with no phase coherence required. The localization length $\\xi$ that appears in [1] is parametrically distinct from $\\ell_{\\rm sca}$ — in 3D one has $\\xi \\gg \\ell_{\\rm sca}$ except very near the mobility edge, and in quasi-1D $\\xi \\sim N \\ell_{\\rm sca}$ with $N$ the number of transverse channels. A measurement of exponential decay with $\\xi \\sim \\ell_{\\rm sca}$ is almost certainly absorption or single-scattering, not localization. The microwave-localization literature is careful about this [18]; the disordered-fiber literature is less so, and \"Anderson-localized\" imaging fibers [17] are well-defined as engineering objects but the protected claim is restricted to the transverse direction of a quasi-2D guide, not to anything resembling the 1958 theorem.\n\n### \"All 2D states are localized\" — only in one symmetry class\n\nThe single-parameter scaling theorem of Abrahams, Anderson, Licciardello, and Ramakrishnan [12] predicts that the $\\beta$-function lies below zero for all $g$ in $d \\le 2$, so the flow runs to $g \\to 0$ at large $L$. This statement is made in the **orthogonal** class — time-reversal symmetric, no spin-orbit, no broken TRS. Wegner's $\\sigma$-model classification [14] makes explicit that the field-theoretic target manifold depends on the symmetry, and so does $\\beta(g)$.\n\nTwo well-established counterexamples sit inside \"2D\" pedagogy:\n\n- **Symplectic class** (TRS preserved, spin-rotation broken by spin–orbit). Hikami–Larkin–Nagaoka perturbation theory gives a *positive* weak-localization correction (antilocalization), and the $\\sigma$-model on the symplectic target supports a genuine metal–insulator transition in 2D with a critical conductance of order $e^2/h$. Topological surface states and graphene with strong spin–orbit fall here.\n- **Unitary class** (TRS broken, e.g. magnetic field). The integer quantum Hall problem is the canonical case: a single delocalized energy floats up each Landau level, and the Hall plateau transitions are precisely the points where the localization length diverges. Extended states exist at isolated energies in 2D.\n\nA paper that writes \"all 2D states are localized [12]\" while the sample has appreciable spin–orbit, broken TRS, or sublattice (chiral) structure is citing a theorem outside its symmetry class. The correct citation in those cases is the relevant $\\sigma$-model entry of Wegner's classification [14], not the gang-of-four paper.\n\n### Mobility edge $\\ne$ band edge\n\nMott's 1968 construction [7] places a sharp energy $E_c$ inside the band, with localized states below (or above) and extended states on the other side. The density of states is generically smooth and finite at $E_c$; what diverges is the localization length, $\\xi(E) \\sim |E-E_c|^{-\\nu}$, with $\\nu$ taking the values of the relevant universality class ($\\nu \\approx 1.57$ in the 3D orthogonal class from numerics). Band edges are kinematic — DOS goes to zero — and are entirely Bloch phenomena present without disorder. Confusing the two is endemic in the photonic-bandgap literature, where the \"pseudogap\" of [16] hosts a region in which the photonic DOS is small *and* states are localized; the mobility edge is the energy at which $\\xi$ diverges as one moves out of the pseudogap, not the band edge of the underlying periodic structure.\n\n### Ioffe–Regel kinematic bound vs. Mott's minimum metallic conductivity\n\nThe Ioffe–Regel criterion $k_F \\ell \\gtrsim 1$ [11] is a statement that the mean free path cannot be shorter than the de Broglie wavelength while a Bloch-wave description remains meaningful. It is kinematic and is alive and well in the bad-metal literature. Mott separately argued that at the disorder driving $k_F \\ell$ to unity one should find a non-zero **minimum metallic conductivity** $\\sigma_{\\rm min} \\sim e^2/(\\hbar a)$ below which a sample is an insulator. The scaling theory of [12] killed this: the $\\beta$-function flow is continuous through $g \\sim 1$, and cuprates and other strongly correlated bad metals routinely violate $\\sigma_{\\rm min}$ while still satisfying $k_F\\ell \\gtrsim 1$. Modern manuscripts that invoke \"Mott–Ioffe–Regel\" as a single object usually want only the Ioffe–Regel half [15].\n\n### Weak localization $\\ne$ strong localization\n\nThe cooperon — the maximally-crossed diagram of time-reversed pairs — produces a logarithmic correction to the Drude conductance in 2D,\n$$\\delta\\sigma(L) = -\\frac{e^2}{\\pi h}\\ln(L/\\ell),$$\nwhich is a perturbative result valid for $g \\gg 1$. It shares its diagrammatic origin with the strong-localization regime, and feeding it into single-parameter scaling is precisely the route by which [12] connects the two limits. But weak localization is *not* exponential localization of eigenstates; it is a coherent diffusion correction. Magnetoresistance experiments that measure $\\delta\\sigma(B)$ from cooperon dephasing are mapping the same symmetry-class structure but should not be reported as \"evidence for Anderson localization\" — they are evidence for phase-coherent diffusion. The slippage is endemic in low-temperature transport papers [15].\n\n### A consolidated test for \"is this Anderson localization?\"\n\n| Premise of [1] | Violated by | Correct framing |\n|---|---|---|\n| Single particle | many-body experiments at finite $T$ | MBL or thermalization [20, 19] — open |\n| Uncorrelated on-site disorder | speckle with finite correlation length, Aubry–André, incommensurate | correlated-disorder localization; mobility edge can appear in 1D |\n| TRS, orthogonal class | spin–orbit, magnetic field | symplectic / unitary $\\sigma$-model [14] |\n| Non-interacting | Coulomb, Hubbard $U$ | Altshuler–Aronov, MBL |\n| Stationary potential | driven, Floquet, time-dependent speckle | dynamical localization à la Anderson map [21] |\n\nThe discipline that the 1958 paper deserves is to name which row applies before invoking the word."}, {"id": "many-body-localization-frontier", "title": "The Many-Body Frontier: Fock-Space Localization and the Existence Dispute", "markdown": "## The Many-Body Frontier: Fock-Space Localization and the Existence Dispute\n\nThe 1958 theorem [1] is silent about interactions. It concerns a single quantum particle in a static potential. Adding even weak two-body interactions changes the Hilbert space from a one-site index to a configuration space whose dimension grows exponentially in the number of particles, and the question of whether disorder still freezes transport becomes a separate problem with a separate name. That separate program — \"many-body localization\", MBL — has spent the last twenty years arguing about whether the phenomenon it names exists at all in the thermodynamic limit. The inherited word is a curse: it suggests corollary status to a 1958 theorem from which MBL inherits no rigor and only an imperfect intuition.\n\n### The Basko–Aleiner–Altshuler argument\n\nThe modern program begins with Basko, Aleiner, and Altshuler [20], who posed the following: take a band of single-particle Anderson-localized orbitals at finite temperature, add a short-range two-body interaction $V$, and compute the imaginary part of the self-energy to all orders in perturbation theory. They argued that for sufficiently small temperature and short-range $V$, the series has no convergent contribution to $\\mathrm{Im}\\,\\Sigma$ — i.e. transport remains strictly absent and the system supports no finite DC conductivity even at $T\u003e0$. Their construction is a hopping graph in many-body Fock space whose nodes are Slater determinants and whose edges are matrix elements of $V$. Localization on this graph is the diagnostic; the analysis recycles the locator-expansion logic of [1] but on an exponentially larger lattice with correlated disorder (the on-site \"energies\" are sums of single-particle eigenvalues and are highly non-independent).\n\nThree points need plain statement. (i) BAA is perturbative; the argument is to all orders, but non-perturbative processes — instantons, resonances, rare regions — are left open. (ii) The conclusion is finite-$T$ insulating behavior, not the stronger statement that all many-body eigenstates are non-thermal. (iii) The mapping to Anderson localization on the Fock-space graph is a heuristic; correlations among node energies and the graph's locally tree-like but globally non-tree topology are exactly the features that the avalanche literature would later exploit.\n\n### l-bits and the eigenstate picture\n\nWhat turned MBL into a phase rather than a transport assertion was the **local-integrals-of-motion (LIOM) phenomenology**, developed by Huse–Nandkishore–Oganesyan and independently by Serbyn–Papić–Abanin around 2013–2014 (verify; not in supplied corpus). One postulates an extensive set of mutually commuting, quasi-local conserved operators $\\{\\tau_i^z\\}$ — the \"l-bits\" — related to the physical spins $\\sigma_i^z$ by a quasi-local unitary $U$:\n$$\\tau_i^z = U\\,\\sigma_i^z\\,U^\\dagger, \\qquad H \\;=\\; \\sum_i h_i\\,\\tau_i^z \\;+\\; \\sum_{i\u003cj} J_{ij}\\,\\tau_i^z\\tau_j^z \\;+\\; \\sum_{i\u003cj\u003ck} K_{ijk}\\,\\tau_i^z\\tau_j^z\\tau_k^z \\;+\\; \\cdots$$\nwith $J_{ij},K_{ijk},\\dots$ decaying exponentially in the separations. This is the cleanest statement of the MBL phase: the Hamiltonian becomes, after a quasi-local rotation, **diagonal in a complete set of localized pseudospins**. It is not derivable from [1] and it is not proved from [20]; it is a constitutive ansatz. From it follow the field's signatures — Poisson level statistics in each symmetry sector, area-law entanglement of eigenstates, $S(t)\\sim \\log t$ entanglement growth from product states (dephasing through the $\\tau^z\\tau^z$ tail proceeds logarithmically), and absence of DC transport at any temperature. [Imbrie's 2016 construction](https://arxiv.org/abs/1605.06035) (verify) is the closest thing to a theorem: it builds the l-bits for a specific 1D random-field Ising chain under unproven level-attraction assumptions.\n\n### The avalanche\n\nThe first crack in the picture is non-perturbative. [De Roeck and Huveneers](https://arxiv.org/abs/1608.01815) (verify) showed that an MBL system is generically unstable to **rare ergodic inclusions**: a thermal \"bubble\" embedded in a localized background acts as a small bath; it absorbs the neighbouring l-bit, grows by one site, and is now a slightly larger and more effective bath. In dimensions $d \\ge 2$ the bubble's surface grows faster than the exponential suppression of the matrix elements connecting it to distant l-bits; the avalanche always wins and MBL is destroyed. In $d=1$ the rate competition is marginal: MBL survives only if l-bits decay faster than a critical rate set by the local bath spectrum. The avalanche is not a numerical artifact — it is a rigorous instability argument that voids MBL as a thermodynamic phase in $d\\ge 2$ for generic short-range models.\n\n### The Šuntajs–Bonča–Prosen–Vidmar challenge\n\n[19] reignited the dispute even in $d=1$. The standard numerical diagnostic — Thouless time $t_{\\mathrm{Th}}$ extracted from the spectral form factor, compared against Heisenberg time $t_H$ — drifts with system size in the canonical random-field Heisenberg chain in a way consistent with $t_{\\mathrm{Th}}/t_H \\to 0$ as $L\\to\\infty$ at any fixed disorder. Their reading: there is no MBL transition at finite disorder in the thermodynamic limit, only a finite-size crossover whose apparent critical $W_c$ drifts linearly with $L$. The paper was contested immediately on the grounds that exact-diagonalization windows ($L\\lesssim 24$) cannot resolve the asymptotic behavior of a slow flow. Subsequent work by [Sels and Polkovnikov](https://arxiv.org/abs/2105.09348) (verify) on dynamical constraints and on l-bit fragility against finite ergodic regions sharpened the indictment; the [2024 IOP review by Sierant et al.](https://iopscience.iop.org/article/10.1088/1361-6633/ad9756) gives the current dispassionate accounting.\n\n### What is established, what is plausible-but-disputed, what is folklore\n\n**Established.** (a) The BAA perturbative argument is internally consistent to all orders [20]. (b) Finite-size systems with strong disorder exhibit non-ergodic features — area-law eigenstates, logarithmic entanglement growth, Poisson statistics — over numerically and experimentally accessible scales. (c) The avalanche instability rules out MBL as a thermodynamic phase in $d\\ge 2$ for generic short-range models.\n\n**Plausible but disputed.** (a) Existence of a true MBL phase in the thermodynamic limit of a 1D random-field chain at any finite disorder. The literature is polarized: one camp (Šuntajs, Polkovnikov, Sels, Vidmar) reads the finite-size drift as evidence of asymptotic thermalization [19]; another (Sierant, Lewenstein, Imbrie, Abanin) holds that current numerics cannot exclude an MBL transition at large $W$. (b) Whether quasi-periodic models (interacting Aubry–André) host a genuine MBL phase distinct from the random case.\n\n**Folklore.** (a) \"MBL is Anderson localization plus interactions.\" It is not: Fock-space localization on an exponentially large graph with strongly correlated disorder is not the object of [1], and the proofs of [4, 5, 6] do not transfer. (b) \"Imbrie proved MBL.\" Imbrie's theorem is conditional on an unproven level-attraction assumption that has not been verified for any concrete model. (c) \"Experiments on cold-atom and trapped-ion chains settle the existence question.\" They demonstrate non-ergodic dynamics over the accessible timescales of the experiment; they do not, and cannot, probe the thermodynamic limit at which the avalanche argument bites.\n\n### Why the name is misleading\n\n\"Many-body localization\" inherits from [1] a connotation of rigor and universality that the present object does not possess. The 1958 theorem is a statement about the spectrum of a single-particle random Schrödinger operator with i.i.d. on-site disorder; the MBL conjecture is a statement about thermalization of an interacting closed quantum system — a constraint on the eigenstate thermalization hypothesis rather than on a spectrum. A more honest name would be **interacting non-ergodicity** or **Fock-space slow dynamics**: it would not promise a theorem, it would not borrow the prestige of [1], and it would prepare its users for the dispute the field is, twenty years in, still inside."}, {"id": "open-problems-and-signatures", "title": "Open Problems and Diagnostic Signatures", "markdown": "## Open Problems and Diagnostic Signatures\n\nThe 1958 theorem [1] settled one question for one model. Every direction this section surveys is a place where that settlement has *not* been extended, where the word \"Anderson localization\" is invoked with varying degrees of warrant. For each open front, a referee should demand a specific quantitative signature before accepting the label.\n\n### The 3D mobility edge: exponents and multifractality\n\nThe cleanest unsolved problem in the non-interacting theory is the precise critical behavior of the 3D orthogonal Anderson transition. The scaling theory [12] predicts a divergent localization length $\\xi \\sim |E - E_c|^{-\\nu}$ and, at criticality, a conductance distribution whose width is universal — independent of disorder strength and microscopic model. The numerical state of the art puts the orthogonal-class exponent at $\\nu = 1.572 \\pm 0.003$ from transfer-matrix finite-size scaling on cubic lattices ([Slevin \u0026 Ohtsuki, NJP 2014](https://arxiv.org/abs/1307.4483)); a 2025 large-scale simulation of electromagnetic transport through disordered dielectric spheres recovered $\\nu \\approx 1.5 \\pm 0.3$, consistent with the orthogonal class ([Skipetrov, PRL 2025](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.134.046302)). What remains open is an analytic derivation: Wegner's $\\sigma$-model [14] gives a $\\varepsilon$-expansion around $d=2$ that, taken to one loop, badly underestimates $\\nu$ in three dimensions, and higher-loop resummations have not converged with the numerics.\n\nThe deeper structural prediction is *multifractality* of the critical wavefunctions. At the mobility edge, the inverse participation ratios scale as\n$$P_q = \\int d^d r\\, |\\psi(r)|^{2q} \\sim L^{-\\tau_q}, \\qquad \\tau_q = D_q (q-1),$$\nwith $D_q$ a non-trivial function of $q$, not a single fractal dimension. Symmetry forces the exact relation $\\tau_q = \\tau_{1-q} + (q - 1/2)\\cdot 0$ in appropriate variables (Mirlin–Fyodorov reciprocity). The signature a referee should demand: a measured spectrum $f(\\alpha)$ from box-counted intensities that (i) is parabolic only to leading order in $|\\alpha - d|$, (ii) collapses with $L$ at the claimed $E_c$ across at least a decade of system size, and (iii) exhibits the reciprocity relation. Anything short of this — a single exponent, a single energy, a single sample — is consistent with a crossover, not a transition.\n\n### The 2D symplectic transition\n\nThe \"no metal in 2D\" headline of the gang-of-four flow [12] is a statement about the orthogonal class. With strong spin–orbit coupling the system enters the symplectic class, the $\\beta$-function changes sign, and a genuine 2D metal–insulator transition appears. Numerics on the SU(2) and Ando models give $\\nu_{\\rm sympl} \\approx 2.73\\text{–}2.75$ ([Asada, Slevin \u0026 Ohtsuki, PRL 2002](https://pubmed.ncbi.nlm.nih.gov/12484908/)), a value that has stabilized only after corrections to scaling were treated carefully — earlier reports ran from 2.0 to 2.9. Experimentally the symplectic class lives on the helical surface of strong topological insulators, in graphene with proximity-induced spin–orbit, and in 2D hole gases. A referee should demand: scaling collapse of $\\sigma(T, L)$ onto a single curve through the candidate critical disorder, not just a non-monotonic $\\sigma(T)$. Many \"2D MIT\" claims since the 1990s — most notoriously in dilute Si-MOSFETs ([Kravchenko \u0026 Sarachik](https://arxiv.org/abs/cond-mat/0309140)) — are now read as interaction effects in the orthogonal class rather than symplectic criticality. The two require different theories and different diagnostics; conflation [conflation #2 of the corpus] is the standard sin.\n\n### Anderson–Mott crossover and the interacting 2D problem\n\nWhen interactions cannot be treated as a small correction, the Finkel'stein nonlinear $\\sigma$-model adds singlet and triplet interaction amplitudes to the Wegner action [14]. The flow develops a metallic fixed point in the orthogonal class at finite triplet coupling ([Punnoose \u0026 Finkel'stein](https://arxiv.org/abs/cond-mat/0507426)), which is the cleanest theoretical candidate for the experimentally observed 2D MIT. The open question is *whether the Anderson and Mott insulators are distinct phases or the same phase reached from different sides*. The Anderson insulator has a finite single-particle density of states at $\\mu$ and a soft Coulomb (Efros–Shklovskii) gap in the tunneling DOS; the Mott insulator has a hard correlation gap with no single-particle weight at $\\mu$. A referee should demand simultaneous tunneling-DOS spectroscopy and transport: a \"Mott–Anderson\" insulator labelled from $\\sigma(T)$ alone is underdetermined. The Lee–Ramakrishnan review [15] still defines the canonical diagnostic vocabulary here, and almost forty years on, no other comparably complete synthesis exists.\n\n### Topological phases in disorder\n\nTwo distinct phenomena travel under this banner. First, *topological protection*: the surface modes of a strong 3D topological insulator are immune to localization by time-reversal-symmetric disorder, because backscattering between Kramers partners is forbidden. The flow is $\\beta(g) \u003e 0$ at weak coupling for a single Dirac cone — a genuine 2D delocalized phase that the original scaling theory missed because it had no Dirac fermions. Second, *topological Anderson insulator (TAI)*: in HgTe/CdTe wells and 1D chiral wires, disorder can *drive* a trivial band structure into a topologically non-trivial phase by renormalizing the mass. The TAI was directly observed in an atomic-wire quantum simulator ([Meier et al., Science 2018](https://www.science.org/doi/10.1126/science.aat3406)); a current review of the broader landscape, including non-Hermitian extensions, is [22]. Diagnostic demand: quantized transport surviving disorder ($\\sigma_{xy}$ plateaus, $G = 2 e^2/h$ on edge channels) plus a measured bulk gap; topology inferred from a single density-of-states feature is not enough.\n\n### Non-Hermitian localization\n\nThe Hatano–Nelson model ([1996](https://arxiv.org/abs/cond-mat/9603165)) — a 1D tight-binding chain with asymmetric hopping and random potentials — produces a depinning transition at which extended states appear in a quintessentially 1D system that, were it Hermitian, would localize completely [8][9]. The same mathematics underlies the *non-Hermitian skin effect*: boundary accumulation of $O(N)$ eigenstates with no disorder at all, driven purely by spectral winding under open boundaries. The dangerous confusion is reading boundary localization as Anderson localization. A referee should demand: a comparison of periodic and open boundary spectra (skin effect collapses under PBC, Anderson localization does not); generalized-Brillouin-zone analysis distinguishing winding-driven from disorder-driven exponential profiles; and, if both mechanisms are present, an explicit decomposition.\n\n### Many-body localization: existence or slow thermalization?\n\nThe BAA conjecture [20] of a non-ergodic interacting phase is, six years after Šuntajs et al. [19], still contested rather than settled. The avalanche scenario — a rare thermal \"bubble\" seeded by an anomalously weak-disorder region grows, dressing nearby spins until it consumes the system — predicts a critical disorder $W_c$ that *grows* with system size, possibly without bound in $d=1$. Recent stability analyses argue the avalanche is bounded above some interaction-dependent $W^*$ ([2026 power-law-interaction study](https://arxiv.org/abs/2601.13485)), but the thermodynamic-limit question is open. A referee should demand: scaling collapse of the gap-ratio statistic $\\langle r \\rangle$ across the largest accessible $L$ *with the drift in apparent $W_c$ extrapolated*; Thouless-time scaling $t_{\\rm Th}(L)$ rather than just level statistics at fixed $L$; and an explicit position on whether the claim is asymptotic MBL, a prethermal regime, or a finite-size crossover. Any paper that conflates these three under one phrase belongs in the same drawer as the photonic literature that calls every exponential decay \"Anderson localization\" [16][18][13]."}, {"id": "verdict-and-reading-list", "title": "Verdict: What Anderson Actually Proved, and What the Word Now Means", "markdown": "## Verdict: What Anderson Actually Proved, and What the Word Now Means\n\nThe dossier has tracked a single sentence — *strong disorder localizes electrons* — through sixty‑seven years of theory, mathematics, experiment, and rhetorical inflation. What follows is the audit closed out: the theorem in its actual hypotheses, the credit chain that the textbook one‑liner mangles, the perimeter beyond which \"Anderson localization\" is a metaphor rather than an entailment, and a short reading list keyed to the corpus.\n\n### The theorem, stripped to its hypotheses\n\nWhat [1] establishes — and the sense in which the word \"establishes\" is to be read as \"argues with high physical confidence, later confirmed rigorously\" — is the following. Take the tight‑binding Hamiltonian\n\n$$ H \\;=\\; \\sum_i \\varepsilon_i \\, c_i^\\dagger c_i \\;+\\; \\sum_{\\langle i,j\\rangle} t_{ij}\\, c_i^\\dagger c_j, $$\n\nwith site energies $\\varepsilon_i$ independently drawn from a distribution of width $W$ and hoppings $t_{ij}$ of characteristic scale $t$. Then for $W/t$ above a model‑dependent threshold (and in $d=1$ for *any* nonzero $W$), a wavepacket released at site $0$ does not diffuse: with probability one the return amplitude does not decay to zero, the eigenstates are exponentially localized about random centers, and the spectrum is pure point in the localized window.\n\nThat is the theorem. Six conditions are doing all the work, and each is a place where the modern literature has been seen, in the preceding sections, to slip:\n\n1. **Single particle.** No two‑body term. Interactions take you to §6 and to a different — and contested — claim.\n2. **Quenched on‑site disorder, statistically independent.** Correlated disorder produces qualitatively different spectra (Dyson singularities, delocalization at special energies, mobility edges in 1D).\n3. **Time‑reversal symmetry, no spin–orbit.** The orthogonal symmetry class. The unitary and symplectic classes obey different scaling, as Wegner [14] made structural and as the experimental anomalies in §4 made tangible.\n4. **Static potential.** Time‑periodic drive can delocalize a localized chain or localize an extended one; neither outcome is a corollary of [1].\n5. **Lattice tight binding.** Continuum random Schrödinger operators require their own proofs; [4] is the earliest fully rigorous one in 1D.\n6. **Exponential profile of *eigenstates*, not of arbitrary intensity.** A bound state in a deep classical well and an absorbing medium with mean free path $\\ell$ both produce exponential tails; neither is what [1] is about.\n\nEach item is a hypothesis, not decoration. The phrase \"Anderson localization\" applied to a system that violates one of them is a metaphor — sometimes a productive one, sometimes a category error — and §5 catalogued the cost of failing to mark the difference.\n\n### The corrected credit chain\n\nThe textbook line is *Anderson 1958 → Mott mobility edge → gang of four 1979*. The record actually reads:\n\n- **Feher → Anderson.** The 1958 paper [1] is not a transport paper. It was triggered by Feher's ENDOR linewidths on phosphorus donors in silicon [2], which Anderson's Bell Labs colleagues could not reconcile with motional narrowing. Anderson said as much in print [3, 23]. Pedagogy that introduces [1] as a *conductivity* calculation has the historical motivation backwards.\n- **Mott → Twose → Borland in 1D.** The one‑dimensional \"all states localized\" statement is routinely attributed to Mott alone. The 1961 paper is joint with Twose [8]; the first defensible proof is Borland 1963 [9], using what is recognizable in retrospect as Furstenberg products of random matrices. Both names are typically absent from the one‑line history.\n- **Gol'dsheid–Molchanov–Pastur before Fröhlich–Spencer.** The mathematical pillar of the field is almost always introduced via [5] in 1983. The first fully rigorous proof of pure‑point spectrum and exponential localization for a continuous 1D random Schrödinger operator is [4] in 1977 — older, and in 1D more general. Multiscale analysis [5] and the fractional‑moment method [6] are landmarks; they are not the *first* landmarks.\n- **The full gang of four.** [12] is signed by Abrahams, Anderson, Licciardello, and Ramakrishnan. Conference lore has compressed this to \"Abrahams–Anderson\"; Licciardello's numerical conductance‑scaling work, much of it from his Princeton thesis, was the empirical backbone of the $\\beta(g)$ flow and is acknowledged in the paper itself and in the historical preface of [13].\n- **Ioffe–Regel ≠ Mott σ_min.** The kinematic bound $k_F\\ell \\gtrsim 1$ is due to Ioffe and Regel [11]. The minimum metallic conductivity $\\sigma_{\\min} \\sim e^2/\\hbar a$ was Mott's separate phenomenological extrapolation; \"bad metal\" data have largely sunk it, while $k_F\\ell \\gtrsim 1$ retains content. The compound noun \"Mott–Ioffe–Regel limit\" silently smuggles the second claim under the imprimatur of the first.\n- **The 1977 Nobel.** The citation is for \"fundamental theoretical investigations of the electronic structure of magnetic and disordered systems\", awarded jointly to Anderson, Mott, and Van Vleck [3, 24, 25]. Anderson's lecture devotes roughly half its length to local moments (Kondo physics) and half to localization. \"Anderson won the Nobel for Anderson localization\" is, strictly, false.\n\n### The perimeter of the name\n\nInside the perimeter, the word denotes a theorem with hypotheses (above), confirmed by the synthesis of [15], the rigorous program of [4, 5, 6], the σ‑model classification [14], and the experimental tradition culminating in P:Si [2], microwave [16]‑style photonic systems, and cold‑atom speckle (§4). Outside the perimeter — interacting systems, driven systems, classical waves with absorption, exponential tails from anything that is not a single‑particle quantum eigenstate of a static random potential — the word survives as a brand. The brand is not empty; it correctly tracks a family resemblance (interference of multiply scattered paths producing non‑diffusive transport). But the rigor does not travel with the noun. §5 named the routine abuses; §6 documented the open existence dispute for the many‑body extension [20, 19]; §7 catalogued the diagnostic ambiguities that follow.\n\nThe verdict, then, is double. *As a theorem*, Anderson localization is one of the most robustly established results in non‑relativistic condensed‑matter theory: proved in 1D ([9, 4]), proved in $d \\ge 2$ at strong disorder and at band edges ([5, 6]), structurally explained by the σ‑model [14] and the scaling flow [12], and visible in every clean experimental platform that respects its hypotheses. *As a word*, it has outrun its proof: it is now applied, often without qualification, to systems that violate one or more of the six hypotheses above. The right discipline is not to retire the word — its family‑resemblance use is genuinely informative — but to mark, in every invocation, which of the six hypotheses is being relaxed and what (if anything) survives the relaxation.\n\n### A compact reading list\n\n- **The 1958 paper itself** [1]. Read alongside Anderson's own retrospective in the Nobel lecture [3] and the 1978 *RMP* [23]; the lecture is the more readable entry point and is candid about the original paper's opacity.\n- **The 1D thread.** Mott–Twose [8] for the conjecture, Borland [9] for the first proof, Gol'dsheid–Molchanov–Pastur [4] for the first rigorous continuum statement. Thouless [10] connects 1D to the boundary‑sensitivity language that scaling theory will use.\n- **Scaling and field theory.** Abrahams–Anderson–Licciardello–Ramakrishnan [12] for the $\\beta(g)$ flow; Wegner [14] for the σ‑model and symmetry classes that explain why the flow has the shape it does.\n- **Rigorous mathematics.** Fröhlich–Spencer [5] (multiscale) and Aizenman–Molchanov [6] (fractional moments), read with the prior Soviet work [4] restored to the timeline.\n- **The 1985 synthesis.** Lee–Ramakrishnan [15] remains the canonical review for weak localization, interaction corrections, and the disordered Fermi liquid; nothing has displaced it as a single reading.\n- **The Mott/Ioffe–Regel side.** Mott's Nobel lecture [24] alongside Ioffe–Regel [11] for the kinematic bound, kept distinct from $\\sigma_{\\min}$.\n- **Diaspora and reuse.** John [16] for photons; the *Physics Today* fiftieth‑anniversary essay [18] for a candid practitioner's tour of the field's branches; the World Scientific anniversary volume [13] for the historical prefaces that name names the textbooks omit.\n- **The many‑body frontier.** Basko–Aleiner–Altshuler [20] for the original MBL proposal; Šuntajs *et al.* [19] for the numerical challenge that defines the present existence dispute. Read them as a pair, not in sequence.\n\nWhat Anderson actually proved was a sharp statement about a narrow object. What the word now means is broader, looser, and — handled with the perimeter in view — still useful."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nAfter eight sections of archaeology, I will plant flags. This field's central theorem is one of the cleanest results in twentieth‑century condensed matter; almost everything draped over it is softer than the citation graph suggests.\n\n### (a) What I will defend with my reputation\n\nThe 1958 locator result [1], read as it was actually written — a probabilistic statement about the convergence of a renormalized perturbation series for the self‑energy of a single non‑interacting particle on a lattice with bounded, uncorrelated on‑site disorder — is correct, and the mathematical descendants Gol'dsheid–Molchanov–Pastur (1977) and Fröhlich–Spencer (1983) have put it on a footing as solid as anything in non‑relativistic quantum mechanics. The 1D theorem (Mott–Twose 1961 phenomenology, Borland 1963 proof, generalized by GMP 1977) — *every* state localized for arbitrarily weak disorder in a strictly 1D nearest‑neighbour chain — is a theorem, not a folklore. The three Wigner–Dyson symmetry classes for non‑interacting electrons, and the qualitatively distinct flow diagrams that follow from them [12], are real and experimentally vindicated (symplectic MIT in 2D; quantum‑Hall extended states at isolated energies). And the single‑particle interference origin of weak‑localization magnetoresistance — Bergmann's experiments and the cooperon diagram — I will go to the mat for.\n\n### (b) What is shakier than the literature admits\n\nFour loadbearing claims are routinely repeated with the assumptions filed off:\n\n1. **Single‑parameter scaling beyond $\\beta(g)$.** The 1979 ansatz that the conductance alone controls the flow is an assumption, not a theorem; multifractal corrections, irrelevant operators near the orthogonal 3D critical point, and the failure to fit $\\nu$ within experimental error in P:Si all hint that \"single‑parameter\" is a useful caricature, not a law.\n2. **The thermodynamic existence of MBL.** The standard story (Basko–Aleiner–Altshuler perturbative argument; numerics up to $L\\approx 20$) does not survive the avalanche/finite‑size critique honestly. The phase may exist; the *proof* that it exists at $L\\to\\infty$ does not. Calling MBL \"established\" is sociology.\n3. **Anderson localization of classical waves.** Exponential intensity profiles in disordered photonics are reported as \"Anderson localization\" when absorption, finite system size, and near‑field correlations have not been independently subtracted. The 1958 theorem says nothing about Maxwell's equations with a position‑dependent $\\varepsilon(\\mathbf r)$ that is correlated on the wavelength scale.\n4. **The mobility edge as a sharp line.** In 3D experiments and in cold‑atom speckle, what is extracted is a *crossover* whose width is set by inelastic processes, finite‑size cutoffs, and the energy resolution of the probe. The literature still draws it as a vertical line.\n\n### (c) Three open problems I would actually work on\n\n1. **Does an MBL phase survive avalanche instabilities in $d\\ge 2$?** — Decides whether the entire MBL program is a finite‑size mirage or a genuine new phase of matter.\n2. **A non‑perturbative diagrammatic theory of the 3D orthogonal MIT.** — Sixty‑seven years in, we have $\\varepsilon$‑expansions and numerics; we do not have a controlled theory at $d=3$.\n3. **An honest separation of Anderson localization from trivial confinement in classical‑wave experiments.** — Until intensity statistics, not envelopes, are matched to the random‑matrix prediction, every \"photonic Anderson\" claim is provisional.\n\n### Reading path\n\n1. **Anderson 1958 [1]** — read the actual paper, not the textbook gloss; notice it is about spin diffusion in Si:P.\n2. **Mott \u0026 Twose 1961 / Borland 1963** — the 1D story, in the order it was actually told (the proof is Borland's).\n3. **Abrahams–Anderson–Licciardello–Ramakrishnan 1979 [12]** — the one‑page paper whose assumptions every subsequent debate has been about.\n4. **Fröhlich–Spencer 1983 / Gol'dsheid–Molchanov–Pastur 1977** — the rigorous spine; read GMP first if you want to see how little the 1D case actually requires.\n5. **Šuntajs et al. 2020 and the avalanche reply literature** — read last, with the previous four in hand, so you can judge whether MBL is a phase or a crossover.\n\nEverything else in the corpus is commentary on these five."}], "references": [{"n": 1, "title": "Absence of Diffusion in Certain Random Lattices", "authors": ["P. W. Anderson"], "year": 1958, "venue": "Physical Review 109, 1492", "url": "https://journals.aps.org/pr/abstract/10.1103/PhysRev.109.1492", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Electron Spin Resonance Experiments on Donors in Silicon. I. Electronic Structure of Donors by the Electron Nuclear Double Resonance Technique", "authors": ["G. Feher"], "year": 1959, "venue": "Physical Review 114, 1219", "url": "https://doi.org/10.1103/PhysRev.114.1219", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Local Moments and Localized States (Nobel Lecture, 8 December 1977)", "authors": ["P. W. Anderson"], "year": 1977, "venue": "Nobel Foundation", "url": "https://www.nobelprize.org/uploads/2018/06/anderson-lecture-1.pdf", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "A pure point spectrum of the stochastic one-dimensional Schrödinger operator", "authors": ["I. Ya. Gol'dsheid", "S. A. Molchanov", "L. A. Pastur"], "year": 1977, "venue": "Funktsional'nyi Analiz i ego Prilozheniya 11(1), 1; Engl. transl. Funct. Anal. Appl. 11, 1", "url": "https://doi.org/10.1007/BF01135526", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Absence of diffusion in the Anderson tight binding model for large disorder or low energy", "authors": ["J. Fröhlich", "T. Spencer"], "year": 1983, "venue": "Communications in Mathematical Physics 88, 151", "url": "https://doi.org/10.1007/BF01209475", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Localization at large disorder and at extreme energies: an elementary derivation", "authors": ["M. Aizenman", "S. Molchanov"], "year": 1993, "venue": "Communications in Mathematical Physics 157, 245", "url": "https://doi.org/10.1007/BF02099760", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Conduction in non-crystalline systems. I. Localized electronic states in disordered systems", "authors": ["N. F. Mott"], "year": 1968, "venue": "Philosophical Magazine 17, 1259", "url": "https://doi.org/10.1080/14786436808223200", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "The theory of impurity conduction", "authors": ["N. F. Mott", "W. D. Twose"], "year": 1961, "venue": "Advances in Physics 10, 107", "url": "https://doi.org/10.1080/00018736100101271", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "The nature of the electronic states in disordered one-dimensional systems", "authors": ["R. E. Borland"], "year": 1963, "venue": "Proceedings of the Royal Society A 274, 529", "url": "https://doi.org/10.1098/rspa.1963.0148", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Electrons in disordered systems and the theory of localization", "authors": ["D. J. Thouless"], "year": 1974, "venue": "Physics Reports 13, 93", "url": "https://doi.org/10.1016/0370-1573(74)90029-5", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "Non-crystalline substances", "authors": ["A. F. Ioffe", "A. R. Regel"], "year": 1960, "venue": "Progress in Semiconductors 4, 237 (J. Wiley)", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Scaling Theory of Localization: Absence of Quantum Diffusion in Two Dimensions", "authors": ["E. Abrahams", "P. W. Anderson", "D. C. Licciardello", "T. V. Ramakrishnan"], "year": 1979, "venue": "Physical Review Letters 42, 673", "url": "https://doi.org/10.1103/PhysRevLett.42.673", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "50 Years of Anderson Localization", "authors": ["E. Abrahams (editor)"], "year": 2010, "venue": "World Scientific (Singapore)", "url": "10.1142/7663", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "The mobility edge problem: Continuous symmetry and a conjecture",
