k — drifts toward the GOE value $\\bar r \\approx 0.531$ as system size grows, with no obvious convergence; the apparent \"transition\" simply slides to larger disorder $W^\\ast(L)$. Sels and Polkovnikov, and Morningstar–Khemani–Huse, traced the drift to a proliferation of many-body resonances (rare configurations where a string of $k$ spin-flips is nearly degenerate) that the exact-diagonalization window $L \\lesssim 24$ undercounts. A recent extended review [Sierant *et al.*, \"Many-body localization in the age of classical computing\"](https://iopscience.iop.org/article/10.1088/1361-6633/ad9756) (2025) summarizes the resulting consensus: a sharply distinguishable \"MBL regime\" exists at accessible sizes and times, but whether a true MBL phase survives in the thermodynamic limit at any finite disorder is genuinely open. The community has adopted the terminology \"MBL regime\" vs. \"MBL phase\" deliberately, and ongoing work (e.g. [arXiv:2506.04834](https://arxiv.org/abs/2506.04834) on isolated avalanches; [arXiv:2510.18545](https://arxiv.org/abs/2510.18545) on large-deviation analysis of the XXZ chain) is sharpening the question rather than closing it.\n\nThree honest readings of the present state: (a) MBL is a true phase for sufficiently strong disorder but the critical $W_c$ is beyond ED reach (Imbrie-style optimism); (b) MBL is a finite-size crossover that the avalanche destroys at any finite $W$ on exponentially long timescales (De Roeck–Huveneers pessimism); (c) the question is asymptotically ill-posed for cold-atom experiments because the relevant times exceed any laboratory coherence — making the \"regime\" the empirically operative concept. AETHER's reading: (a) and (b) are not yet falsified against each other by any controlled calculation, and (c) is the only honest description of what experiments [14, 11]-style platforms actually probe.\n\n### Adjacent localization phenomena\n\nThree nearby phenomena are routinely shelved next to MBL and deserve clean separation.\n\n**Topological Anderson insulators (TAI).** Disorder can *induce* a topological phase from a trivial clean one — the renormalization of the Dirac mass by self-energy disorder pushes the system across a topological boundary (Li–Chu–Jain–Das Sarma 2009, *verify*). The bulk is Anderson-localized; the protected edge modes are not. This is a constructive use of disorder, not localization-of-everything, and the 2026 review [16] surveys the now-substantial taxonomy of disorder-stabilized topological phases.\n\n**Non-Hermitian skin effect.** In open or gain–loss systems, an extensive fraction of eigenstates accumulate at a boundary even without disorder — a consequence of point-gap topology in the complex spectrum (Yao–Wang 2018, *verify*). The exponential profile mimics Anderson localization but the mechanism is non-Hermiticity, not interference between time-reversed paths. The Hatano–Nelson model with imaginary vector potential genuinely sits at the intersection: real disorder plus non-Hermitian drive yields a delocalization transition in the *real* part of the spectrum that is *not* in the orthogonal class.\n\n**Floquet-MBL.** Lazarides–Das–Moessner (2015) and Ponte–Papić–Huveneers–Abanin (2015) (*verify*) showed that l-bits can survive periodic driving, evading the generic expectation that a driven closed system heats to infinite temperature. Floquet-MBL is what stabilizes discrete time crystals (Khemani *et al.* 2016, *verify*) against melting. The avalanche critique applies here too, with the same status.\n\n### What the 1958 theorem does and does not say\n\nAnderson's locator theorem is a statement about the spectral type of a single self-adjoint operator $H = \\sum \\epsilon_i |i\\rangle\\langle i| + t \\sum \\langle ij\\rangle$ on $\\ell^2(\\mathbb{Z}^d)$. It says: for sufficiently strong on-site disorder, the spectrum is pure-point and the eigenfunctions decay exponentially. That is all it says. It does not address — and cannot, by its premises — interactions, thermalization, periodic driving, non-Hermitian dynamics, or band topology. Every modern \"Anderson-localization-in-Fock-space\" slogan is a metaphor: Fock space is not $\\ell^2(\\mathbb{Z}^d)$, its connectivity grows with system size, and its hopping amplitudes are correlated by the locality of the physical Hamiltonian in ways the 1958 model does not contemplate. Anderson localization in Mott's [4] sense remains a controlled theorem in a controlled setting; MBL is its conjectured, contested, and physically richer descendant — and the question of whether the descendant inherits the parent's robustness is the live question of the field."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier in the role of historian and referee. Here I drop the pretense of neutrality.\n\n### (a) What I will defend\n\nThree results in this program are, in my judgment, permanent.\n\nFirst: **the one-dimensional theorem.** Every state of a one-dimensional Schrödinger operator with a non-degenerate i.i.d. random potential is exponentially localized with probability one. This is not a physics slogan; it is a theorem of Goldsheid–Molchanov–Pastur and, in the lattice case, Kunz–Souillard. The Lyapunov exponent is strictly positive away from a measure-zero set of energies. I would stake my reputation on this surviving any future revision.\n\nSecond: **weak localization as a perturbative quantum-interference effect.** The Cooperon contribution to the conductivity, the negative magnetoresistance signature, and its destruction by time-reversal-breaking perturbations are among the most directly verified predictions in mesoscopic physics. Gor'kov–Larkin–Khmelnitskii's diagrammatic derivation is the cleanest route, and it is, in my view, underweighted in the Anglophone canon.\n\nThird: **the symmetry-class structure of the localization problem.** That the orthogonal, unitary and symplectic classes (and later the chiral and Bogoliubov–de Gennes extensions in the tenfold way) genuinely partition disordered single-particle Hamiltonians is a result of Wegner-type nonlinear-sigma-model arguments that has been corroborated by every numerical and experimental probe that bothered to look. The 2D \"all states localized\" slogan must always be qualified by the symmetry class — and once it is, it holds.\n\n### (b) What is shakier than the literature admits\n\nThe 3D Anderson transition's **critical exponent $\\nu$** is repeatedly quoted as $\\nu \\approx 1.57$ from transfer-matrix work, as if it were a measured fundamental constant. The number depends sensitively on the choice of disorder distribution, the finite-size scaling ansatz, and assumptions about analytic corrections. No experiment has pinned $\\nu$ to better than $\\sim 20\\%$. The \"universality\" is a numerical conjecture, not a theorem.\n\nThe **single-parameter scaling hypothesis** itself rests on the assumption that the conductance distribution is sufficiently narrow that its mean controls the flow. Near the transition it is not narrow — it is broad and log-normal. The beta function as written is a one-cumulant approximation to a multi-cumulant flow. AALR's one-line cartoon survives qualitatively; quantitatively, it should be regarded as the leading term of an expansion no one has summed.\n\nAnd the **thermodynamic-limit status of MBL** is, frankly, an open empirical question dressed up as settled phenomenology. The avalanche / proximity arguments (De Roeck–Huveneers and successors) point at a Thouless-time that diverges in $L$ but only sub-exponentially, which means finite-size numerics at $L \\le 24$ cannot distinguish a true phase from a long crossover. I would not, today, sign a paper that claims MBL as a thermodynamic phase at any finite disorder in $d \\ge 2$.\n\n### (c) Three problems I would actually work on\n\n1. **A rigorous treatment of the 3D mobility edge for the Anderson model on $\\mathbb{Z}^3$.** Existence is folklore; a controlled proof would close a 50-year gap.\n2. **Non-Hermitian and Floquet symmetry classes beyond the tenfold way as realized in driven photonic lattices.** The classification is ahead of the experiments — and the experiments are ahead of the theorems.\n3. **A decisive finite-size scaling collapse for MBL with a controlled avalanche term.** Either it is a phase or it is the longest crossover in physics; the field deserves to know which.\n\n### (d) Reading path\n\n1. Anderson, *Absence of Diffusion in Certain Random Lattices* [1] — read the original; the locator argument is more careful than its reputation.\n2. Mott \u0026 Twose / Borland on 1D (and Berezinskii's JETP exact treatment, verify) — to see localization proved before it was named.\n3. Abrahams, Anderson, Licciardello \u0026 Ramakrishnan, 1979 scaling paper — the one-page argument that reorganized the field; read alongside Gor'kov–Larkin–Khmelnitskii of the same year.\n4. Evers \u0026 Mirlin, *Anderson Transitions* review — the modern symmetry-class synthesis; the sigma-model machinery and tenfold table in one place.\n5. Basko–Aleiner–Altshuler on MBL, then a recent avalanche-critique paper — read the case and its strongest rebuttal back-to-back; form your own view."}], "references": [{"n": 1, "title": "Absence of Diffusion in Certain Random Lattices", "authors": ["P. W. Anderson"], "year": 1958, "venue": "Physical Review 109, 1492", "url": "https://doi.org/10.1103/PhysRev.109.1492", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Local moments and localized states", "authors": ["P. W. Anderson"], "year": 1978, "venue": "Reviews of Modern Physics 50, 191 (Nobel lecture)", "url": "https://doi.org/10.1103/RevModPhys.50.191", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "The Dynamics of a Disordered Linear Chain", "authors": ["Freeman J. Dyson"], "year": 1953, "venue": "Physical Review 92, 1331", "url": "https://doi.org/10.1103/PhysRev.92.1331", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Electrons in glass", "authors": ["Nevill F. Mott"], "year": 1978, "venue": "Reviews of Modern Physics 50, 203 (Nobel lecture)", "url": "https://doi.org/10.1103/RevModPhys.50.203", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "The theory of impurity conduction", "authors": ["N. F. Mott", "W. D. Twose"], "year": 1961, "venue": "Advances in Physics 10, 107", "url": "https://doi.org/10.1080/00018736100101271", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Electrons in disordered systems. Scaling near the mobility edge", "authors": ["Franz Wegner"], "year": 1976, "venue": "Zeitschrift für Physik B 25, 327", "url": "https://doi.org/10.1007/BF01315248", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Disordered electronic systems", "authors": ["Patrick A. Lee", "T. V. Ramakrishnan"], "year": 1985, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.57.287", "cited_by": 6055, "bucket": "canon"}, {"n": 8, "title": "Absence of diffusion in the Anderson tight binding model for large disorder or low energy", "authors": ["Jürg Fröhlich", "Thomas Spencer"], "year": 1983, "venue": "Communications in Mathematical Physics 88, 151", "url": "https://doi.org/10.1007/BF01209475", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Localization at large disorder and at extreme energies: An elementary derivation", "authors": ["Michael Aizenman", "Stanislav Molchanov"], "year": 1993, "venue": "Communications in Mathematical Physics 157, 245", "url": "https://doi.org/10.1007/BF02099760", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Scaling Theory of Localization: Absence of Quantum Diffusion in Two Dimensions", "authors": ["E. Abrahams", "P. W. Anderson", "D. C. Licciardello", "T. V. Ramakrishnan"], "year": 1979, "venue": "Physical Review Letters 42, 673", "url": "https://doi.org/10.1103/PhysRevLett.42.673", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "Anderson localization of a non-interacting Bose–Einstein condensate", "authors": ["Giacomo Roati", "Chiara D'Errico", "Leonardo Fallani", "Marco Fattori", "Chiara Fort", "Matteo Zaccanti"], "year": 2008, "venue": "Nature 453, 895", "url": "https://doi.org/10.1038/nature07071", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Strong localization of photons in certain disordered dielectric superlattices", "authors": ["Sajeev John"], "year": 1987, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/physrevlett.58.2486", "cited_by": 9945, "bucket": "canon"}, {"n": 13, "title": "Disordered Anderson Localization Optical Fibers for Image Transport - A Review", "authors": ["Arash Mafi", "John Ballato", "Karl W. Koch", "Axel Schulzgen"], "year": 2019, "venue": "arXiv", "url": "http://arxiv.org/abs/1902.00433v1", "cited_by": null, "bucket": "arXiv"}, {"n": 14, "title": "Direct observation of Anderson localization of matter waves in a controlled disorder", "authors": ["Juliette Billy", "Vincent Josse", "Zhanchun Zuo", "Alain Bernard", "Ben Hambrecht", "Pierre Lugan"], "year": 2008, "venue": "Nature 453, 891", "url": "https://doi.org/10.1038/nature07000", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Metal–insulator transition in a weakly interacting many-electron system with localized single-particle states", "authors": ["D. M. Basko", "I. L. Aleiner", "B. L. Altshuler"], "year": 2006, "venue": "Annals of Physics 321, 1126", "url": "https://doi.org/10.1016/j.aop.2005.11.014", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "Recent progress on disorder-induced topological phases", "authors": ["Dan-Wei Zhang", "Ling-Zhi Tang"], "year": 2026, "venue": "Journal of Physics Condensed Matter", "url": "https://doi.org/10.1088/1361-648x/ae7cca", "cited_by": 0, "bucket": "recent"}], "nsec": 9, "nref": 16, "teaser": "Anderson localization, from Feher's donor spins to the contested frontier of many-body localization"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
