event": "AALR 'Gang of Four' scaling theory: one-parameter beta-function argument shows all states localized in d≤2 for orthogonal symmetry class; gives the modern phase diagram. Parallel Soviet work by Gor'kov–Larkin–Khmelnitskii derives the logarithmic 2D conductivity correction from diagrammatics.", "who": "Abrahams, Anderson, Licciardello, Ramakrishnan; Gor'kov, Larkin, Khmelnitskii", "work": "Phys. Rev. Lett. 42, 673; JETP Lett. 30, 228", "kind": "theory", "ref": null}, {"year": 1983, "event": "Fröhlich–Spencer rigorous multi-scale analysis: mathematical proof of exponential localization for the d-dimensional Anderson model at strong disorder or band edges.", "who": "J. Fröhlich \u0026 T. Spencer", "work": "Communications in Mathematical Physics", "kind": "formalization", "ref": null}, {"year": 1985, "event": "Lee–Ramakrishnan canonical review of disordered electronic systems consolidates scaling theory, weak localization, and interaction corrections.", "who": "P. A. Lee \u0026 T. V. Ramakrishnan", "work": "Reviews of Modern Physics", "kind": "theory", "ref": 7}, {"year": 1987, "event": "John (and, in a separate paper, Anderson with John in mind) extends localization to classical electromagnetic waves in disordered dielectrics — 'photonic Anderson localization'.", "who": "S. John; P. W. Anderson", "work": "Phys. Rev. Lett.", "kind": "revival", "ref": 12}, {"year": 2006, "event": "Basko–Aleiner–Altshuler argue that a closed, weakly interacting fermion system with single-particle localized states does not thermalize at low enough temperature — birth of modern 'many-body localization'.", "who": "D. M. Basko, I. L. Aleiner, B. L. Altshuler", "work": "Annals of Physics", "kind": "revival", "ref": null}, {"year": 2008, "event": "Direct observation of Anderson localization of matter waves in 1D laser-speckle and quasi-periodic potentials with non-interacting BECs.", "who": "Billy et al. (Institut d'Optique); Roati et al. (LENS)", "work": "Nature 453, 891 \u0026 895", "kind": "observation", "ref": null}], "neglected": [{"name": "George Feher", "role": "His phosphorus-doped silicon ESR experiments at Bell Labs (mid-1950s) — anomalous spin-diffusion of donor electrons — were the empirical puzzle Anderson set out to explain. Anderson explicitly credits Feher's spin-diffusion data in the opening of the 1958 paper and again in his 1977 Nobel lecture, yet textbook accounts almost always present the model as a piece of pure theory.", "evidence": "Anderson 1958 PR 109, 1492 (acknowledgment and motivation paragraph); Anderson Nobel lecture 'Local Moments and Localized States', Rev. Mod. Phys. 50, 191 (1978).", "ref": null}, {"name": "Lev Gor'kov, Anatoly Larkin \u0026 David Khmelnitskii", "role": "Independently and simultaneously with AALR derived the logarithmic conductivity correction in 2D from impurity diagrammatics, anchoring the scaling theory in microscopic perturbation theory. In Russian-language priority accounts they share the discovery; in Western textbooks the result is often labelled simply 'AALR'.", "evidence": "JETP Letters 30, 228 (1979); discussed in Altshuler \u0026 Aronov reviews and in Khmelnitskii's later historical notes.", "ref": null}, {"name": "Vadim Berezinskii", "role": "Computed the 1D localization length to all orders by a systematic Cooperon-ladder resummation — six years before AALR — yet is rarely cited outside the 1D-localization literature, partly because the paper appeared only in Russian/JETP and was not translated into English textbooks until much later.", "evidence": "Berezinskii, Zh. Eksp. Teor. Fiz. 65, 1251 (1973) / Sov. Phys. JETP 38, 620 (1974); cited as the canonical 1D source in Efetov's supersymmetry monograph.", "ref": null}, {"name": "Franz Wegner", "role": "Recast the disorder-averaged two-particle Green's function as a nonlinear sigma model on the symmetric space U(2n)/U(n)×U(n) — the field-theoretic framework that legitimized the scaling theory and led to Efetov's supersymmetric formulation. Standard accounts foreground AALR's heuristic beta-function and bury the sigma-model derivation in appendices.", "evidence": "Wegner, Z. Phys. B 25, 327 (1976) and 35, 207 (1979); central in Efetov's 'Supersymmetry in Disorder and Chaos' (1997).", "ref": null}, {"name": "Sir Nevill Mott (under-credited side of his contribution)", "role": "Mott shared the 1977 Nobel, but the popular phrasing 'Anderson localization' tends to absorb the mobility-edge concept and the entire amorphous-semiconductor program, which were largely Mott's. Conversely, his 'minimum metallic conductivity' was wrong and is now usually mentioned only to be disproved — a one-sided memory of his role.", "evidence": "Mott Nobel lecture 'Electrons in Glass', Rev. Mod. Phys. 50, 203 (1978); Mott \u0026 Davis, 'Electronic Processes in Non-Crystalline Materials' (1971).", "ref": null}], "conflations": [{"claim": "Calling any exponentially decaying eigenmode in a disordered medium 'Anderson localization'.", "clarification": "Anderson's theorem is for a single quantum particle in a static, time-reversal-symmetric, non-interacting random potential (orthogonal symmetry class). Classical sound, light, and matter-wave realizations are valid wave-localization analogues, but the symmetry class (orthogonal vs unitary vs symplectic), the role of absorption, and the available scattering channels must be specified before quoting the AALR phase diagram. In particular, in 2D the 'all states localized' result fails once spin–orbit (symplectic) or magnetic-field breaking of time-reversal (unitary) is present, where genuine extended states or a true transition reappear."}, {"claim": "Treating 'weak localization' and 'Anderson (strong) localization' as the same phenomenon.", "clarification": "Weak localization is a perturbative quantum-interference correction to the Drude conductivity coming from time-reversed (Cooperon) diffusion loops; it is destroyed by a small magnetic field and by dephasing. Strong/Anderson localization is the non-perturbative regime in which all diffusion is shut off and the conductivity is exactly zero at T=0. The scaling theory unifies them on a single beta-function curve, but they are not interchangeable physical regimes."}, {"claim": "Conflating 'Anderson insulator' with 'Mott insulator'.", "clarification": "Anderson insulators are produced by disorder in a non-interacting (or weakly interacting) band; Mott insulators are produced by on-site Coulomb repulsion U exceeding the bandwidth in a clean system. They differ in their gap origin, their compressibility, and their response to doping. Real systems (doped semiconductors, transition-metal oxides) often sit in the Anderson–Mott crossover region, which is the actual subject of much of the 1980s disordered-electrons literature."}, {"claim": "Treating 'many-body localization' (MBL) as just Anderson localization with interactions.", "clarification": "MBL invokes localization in Fock space and a complete set of quasi-local integrals of motion; its phenomenology (logarithmic entanglement growth, absence of thermalization) is genuinely new. But the Basko–Aleiner–Altshuler argument is perturbative in interaction strength, and its survival in the thermodynamic limit at any finite disorder has been seriously challenged by exact-diagnostic and avalanche/proximity-effect arguments. The historical Anderson theorem says nothing about thermalization of interacting systems."}, {"claim": "Identifying the 'mobility edge' with a band edge.", "clarification": "The mobility edge E_c lies inside the density of states, separating localized states (in the band tails) from extended states (near the band centre). Localized states have nonzero density at E_c; only their participation ratio collapses. The DOS is generically smooth across E_c, which is why the transition cannot be diagnosed thermodynamically and instead requires a transport or level-statistics probe."}, {"claim": "Stating that 'minimum metallic conductivity' is a universal feature of the Anderson transition.", "clarification": "Mott's σ_min argument predicted a universal jump in conductivity at the transition. The scaling theory of localization showed this is incorrect: in 3D the dc conductivity vanishes continuously at the transition with a critical exponent. σ_min survives only as a phenomenological estimate, not a theorem."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: Feher's Donor Spins and the Pre-Anderson Lattice", "markdown": "## Origins: Feher's Donor Spins and the Pre-Anderson Lattice\n\nThe standard pedagogical narrative — that P. W. Anderson in 1958 [1] sat down with a tight-binding Hamiltonian, added on-site disorder $\\epsilon_i$ drawn from a box distribution of width $W$, and deduced by a brilliant act of perturbation theory that diffusion would die above some critical $W/t$ — is misleading in almost every particular except the Hamiltonian itself. Anderson did not begin from a Hamiltonian. He began from George Feher's ESR notebooks.\n\n### The Bell Labs experiment that demanded a theory\n\nThrough 1955–1957 Feher's group at Murray Hill had been mapping the electron paramagnetic resonance of phosphorus donors in silicon at liquid-helium temperatures. The donor electron in Si:P sits in a hydrogenic 1s state with Bohr radius $a_B^\\ast \\approx 20\\,\\text{\\AA}$. At concentrations $n_D \\lesssim 10^{17}\\,\\text{cm}^{-3}$ the donor wavefunctions barely overlap; Feher's invention of ENDOR (electron–nuclear double resonance) resolved the hyperfine coupling of the donor electron to each shell of $^{29}\\text{Si}$ nuclei it visited, and the lineshape was that of a strictly localized impurity. As the doping was pushed up toward the metal–insulator transition near $n_c \\approx 3.7 \\times 10^{18}\\,\\text{cm}^{-3}$, the lines broadened in an anomalous way: the spin–lattice relaxation $T_1$ and the spin-diffusion that should have transported polarization across the sample lagged badly behind what a percolating overlap network would predict. Polarization was getting *stuck* in regions of the crystal even though, by any naïve overlap criterion, the donor orbitals already touched.\n\nThis is the puzzle Anderson states, in his own words, in the opening of [1]: he is responding to Feher's data, not setting up a toy. He says the same thing, more reflectively, twenty years later in his Nobel lecture [2]: \"The original purpose was to explain some...experiments by Feher\". Textbook accounts amputate this empirical motivation, with the curious side-effect that the locator expansion is now taught as a pure-theory invention rather than as what it actually was — a Bell Labs response to a Bell Labs measurement. The model exists because the experiment existed first.\n\nWhat Anderson then did was technical: in the site basis $\\{|i\\rangle\\}$ with random on-site energies, he wrote the resolvent's self-energy as an infinite sum over self-avoiding paths returning to the origin, and asked for the *probability* (not the average) that the renormalized hopping ${\\rm Im}\\,\\Sigma_0(E+i0^+)$ vanished. Averages of $\\Sigma$ are dominated by rare resonances; probabilities are not. The criterion he extracted,\n\n$$\\left\\langle \\ln\\left|\\sum_{j\\ne 0} \\frac{t_{0j}}{E - \\epsilon_j}\\right| \\right\\rangle \u003c 0,$$\n\nis the seed of every subsequent rigorous localization proof. The result was a *critical* $W_c/t$ above which, with probability one, the on-site Green's function had a real limit on the real axis — no diffusion. The mechanism is the breakdown of perturbation theory not at any finite order, but in the convergence of the typical resummation. That distinction — typical vs. average — would have to be re-discovered several times before it became standard.\n\n### Dyson 1953 and Schmidt 1957: the random lattice before Anderson\n\nAnderson's locator expansion did not appear in a one-dimensional vacuum. Five years earlier, Dyson [3] had solved the *classical* analogue: a 1D harmonic chain with random masses. He reformulated the secular determinant as a continued-fraction product of random transfer matrices and obtained the integrated density of states $N(\\omega)$ in closed form for several mass distributions, exhibiting a Dyson singularity $N(\\omega) \\sim \\omega/\\ln^2(\\omega_0/\\omega)$ near the band edge for the symmetric binary chain. This is the first systematic treatment of a quantum spectral problem on a disordered crystal and the first appearance of the products-of-random-matrices machinery that Furstenberg would later make rigorous. Anderson does not cite Dyson in [1], but the kinship is structural: Dyson's chain is exactly the $d=1$ analogue with off-diagonal disorder rather than diagonal disorder, and his transfer-matrix construction is precisely what Borland (1963) would convert into a localization argument.\n\nSchmidt's 1957 *Phys. Rev.* paper on the spectra of disordered 1D crystals (verify) extended Dyson's method to electronic tight-binding chains with random site energies. He showed that the integrated density of states is self-averaging while the wavefunctions themselves are not — a foreshadowing of the typical-vs-average distinction Anderson would later make load-bearing. Schmidt's contribution is almost entirely forgotten; even Mott's Nobel lecture [4], which discusses the 1D problem at length, does not mention him.\n\n### From physical argument to rigorous structure: Mott–Twose, Borland, Furstenberg, Berezinskii\n\nIn 1961 Mott and Twose [5], in the course of a long survey of impurity conduction, made the much sharper claim — at the level of a physical argument — that *all* states in a one-dimensional random potential are localized, for arbitrarily weak disorder. The 1D problem is therefore qualitatively different from the 3D problem Anderson had treated: there is no critical $W_c$ at all. Their argument was not rigorous. Borland (1963) gave a cleaner version using the growth of the transfer-matrix product\n\n$$\\prod_{n=1}^{N} \\begin{pmatrix} (E-\\epsilon_n)/t \u0026 -1 \\\\ 1 \u0026 0 \\end{pmatrix},$$\n\nand shortly afterward Furstenberg's theorem on products of non-commuting i.i.d. random matrices supplied the missing piece: under a non-degeneracy condition the Lyapunov exponent $\\gamma(E) = \\lim_{N\\to\\infty} N^{-1} \\ln \\|\\prod M_n\\|$ is strictly positive, and this is the inverse localization length. The 1D Anderson model is, in this sense, a corollary of a theorem proved in a different department of mathematics for a different reason — and it was Goldsheid–Molchanov–Pastur in 1977 (the year of the Nobel) who first turned the corollary into a fully rigorous statement of pure-point spectrum.\n\nBerezinskii's 1973 JETP paper is the pre-AALR document Western literature systematically forgets. He computed the 1D localization length to all orders in disorder by a Cooperon-ladder resummation that is structurally identical to the diagrammatics Gor'kov, Larkin and Khmelnitskii would deploy in 2D six years later. Because the paper appeared in Russian and was technically dense, it travelled poorly; Efetov's later supersymmetry monograph treats it as canonical, condensed-matter textbooks barely cite it.\n\n### Wegner's sigma model: the bridge to what came next\n\nThe last piece of the pre-scaling-theory edifice is Wegner's 1976 paper [6], in which the disorder-averaged two-particle Green's function $\\langle G^R G^A \\rangle$ is recast as a functional integral over a matrix field $Q$ on the symmetric space $U(2n)/U(n)\\times U(n)$ in the replica $n\\to 0$ limit. This is the nonlinear sigma model of localization: a field theory whose renormalization group will, three years later, supply the microscopic foundation that the AALR heuristic beta-function lacks. Wegner's paper is also where the *symmetry classification* (orthogonal/unitary/symplectic) enters localization theory — a fact that AALR partially obscures by writing down only the orthogonal-class result. Modern usage absorbs all of this into the bare phrase \"Anderson localization\", but the physical content is layered: Feher saw it, Anderson named the mechanism, Dyson supplied the technique, Mott–Twose and Borland fixed $d=1$, Furstenberg made it a theorem, Berezinskii computed it to all orders, and Wegner gave it a field theory. The next section follows the locator expansion and the sigma model into the scaling theory that finally drew the phase diagram."}, {"id": "the-1958-paper-and-locator-expansion", "title": "The Anderson Model and the Locator Expansion", "markdown": "## The Anderson Model and the Locator Expansion\n\nThe 1958 paper [1] strips the disorder problem to a minimum. A single particle hops on a regular lattice with a fixed hopping amplitude $t$ and a random on-site potential:\n\n$$H \\;=\\; \\sum_i \\epsilon_i\\, c_i^\\dagger c_i \\;+\\; t \\sum_{\\langle ij \\rangle} \\left(c_i^\\dagger c_j + \\text{h.c.}\\right),$$\n\nwith $\\epsilon_i$ drawn independently from a box distribution $P(\\epsilon) = W^{-1}\\,\\Theta(W/2 - |\\epsilon|)$. There is no electron–electron interaction, no phonon coupling, no magnetic field, no spin–orbit coupling — those are all later additions. The lattice is taken regular (simple cubic in Anderson's numerical estimates); randomness lives entirely on the diagonal.\n\nThree features set the model apart from prior treatments of impurity scattering. First, the disorder is *dense* — every site is random — rather than dilute impurities embedded in a clean band. Second, the question asked is not the perturbative correction to a Bloch state but the global character of the eigenfunction at energy $E$: localized (exponentially decaying envelope) or extended. Third, the answer is sought as a property of *typical* configurations, not of an ensemble average. The third point — quenched randomness with attention to the typical realization — is what differentiates Anderson's treatment from Dyson's 1953 random-mass chain [3], which computed an averaged density of states without ever distinguishing localization from delocalization.\n\n### The bare locator\n\nWith $t$ turned off, $H_0 = \\sum_i \\epsilon_i c_i^\\dagger c_i$ is diagonal. Its single-site Green's function — the \"locator\" —\n\n$$g_i^{(0)}(E) \\;=\\; \\frac{1}{E - \\epsilon_i + i 0^+}$$\n\nis exact, and its eigenstates are trivially localized: each site carries one stationary mode at energy $\\epsilon_i$. Anderson treats $V = t\\sum_{\\langle ij\\rangle} c_i^\\dagger c_j$ as a perturbation around this fully localized starting point. The resolvent identity $G = G_0 + G_0 V G$, iterated, generates the locator expansion of the site-diagonal Green's function as a sum over closed walks on the lattice that begin and end at $i$. After resumming the trivial returns to site $i$, one obtains the renormalised form\n\n$$G_{ii}(E) \\;=\\; \\frac{1}{E - \\epsilon_i - \\Sigma_i(E)},$$\n\nwhere the self-energy $\\Sigma_i(E)$ is a sum over *self-avoiding* closed walks (re-entering at $i$) weighted by the locators of the intermediate sites. To leading orders in $t$,\n\n$$\\Sigma_i(E) \\;=\\; t^2\\!\\!\\sum_{j\\,\\text{n.n. of }i}\\!\\!\\frac{1}{E - \\epsilon_j} \\;+\\; t^3\\!\\!\\sum_{i\\to j\\to k\\to i}\\!\\!\\frac{1}{(E-\\epsilon_j)(E-\\epsilon_k)} \\;+\\;\\cdots\\;.$$\n\nIf this series converges to a finite, real-valued $\\Sigma_i(E)$ for almost every disorder realization, then $G_{ii}(E)$ has a pole on the real axis: the eigenstate is bound to a finite region around $i$ and the particle does not diffuse. *Convergence of the locator expansion is Anderson's criterion for localization.*\n\n### Why averaging fails — and what to compute instead\n\nThe mean of an individual locator is logarithmically divergent for a box distribution,\n\n$$\\Big\\langle\\frac{1}{E-\\epsilon_j}\\Big\\rangle \\;=\\; \\frac{1}{W}\\,\\text{P.V.}\\!\\!\\int_{-W/2}^{W/2}\\!\\!\\frac{d\\epsilon}{E-\\epsilon},$$\n\nand worse, $\\langle |g_j|\\rangle = \\infty$ absolutely. Term-by-term averaging therefore says nothing about the typical realization: a single near-resonant site ($\\epsilon_j \\approx E$) blows up an arithmetic mean while contributing negligibly to the median behaviour. Anderson's central technical move is to estimate not $\\langle |\\Sigma_i|\\rangle$ but the probability that $|\\Sigma_i|$ exceeds a fixed bound — for which fractional moments suffice. Choosing $0\u003cs\u003c1$,\n\n$$\\big\\langle |g_j|^s\\big\\rangle \\;=\\; \\frac{1}{W}\\!\\int_{-W/2}^{W/2}\\!\\!\\frac{d\\epsilon}{|E-\\epsilon|^s} \\;=\\; \\frac{2}{W(1-s)}\\!\\left(\\frac{W}{2}\\right)^{\\!1-s},$$\n\nwhich is finite for every $s\u003c1$. The expectation of the $s$-th power of an $n$-th-order locator term factorises over the independent sites along the walk; with $K$ the connectivity of the self-avoiding-walk graph (the lattice coordination $Z$ minus 1, or exactly $Z-1$ on a Bethe lattice), the total $n$-th-order contribution to $\\langle|\\Sigma_i|^s\\rangle$ is bounded by $(K\\,t^s\\,\\langle|g|^s\\rangle)^n$. The series converges in $s$-th mean — and hence almost surely — whenever\n\n$$K\\, t^s\\,\\big\\langle |g|^s\\big\\rangle \\;\u003c\\; 1.$$\n\nOptimising over $s$ for the box distribution gives the celebrated threshold\n\n$$\\boxed{\\;\\frac{W}{t} \\;\u003e\\; C\\, K \\ln K\\;}$$\n\nwith a $K$-independent constant $C$ of order unity. For the simple cubic lattice ($Z=6$, $K=5$), Anderson's own numerical estimate placed the threshold near $W_c/t \\approx 30$; modern transfer-matrix calculations at the band centre converge to $W_c/t \\approx 16.5$ [7]. The locator bound is therefore conservative by roughly a factor of two — exactly the overcount one expects from a self-avoiding-walk enumeration that ignores cancellation between paths.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eAnderson locator expansion\u003c/title\u003e\u003ctext x=\"20\" y=\"22\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eOn-site disorder ε_i drawn from a box of width W\u003c/text\u003e\u003cline x1=\"40\" y1=\"100\" x2=\"340\" y2=\"100\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"40\" y1=\"55\" x2=\"40\" y2=\"145\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"2\" y=\"58\" fill=\"#e8e6e1\" font-size=\"12\"\u003e+W/2\u003c/text\u003e\u003ctext x=\"2\" y=\"148\" fill=\"#e8e6e1\" font-size=\"12\"\u003e−W/2\u003c/text\u003e\u003ctext x=\"345\" y=\"104\" fill=\"#e8e6e1\" font-size=\"12\"\u003eE = 0\u003c/text\u003e\u003cline x1=\"65\" y1=\"78\" x2=\"65\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"100\" y1=\"120\" x2=\"100\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"135\" y1=\"70\" x2=\"135\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"170\" y1=\"115\" x2=\"170\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"205\" y1=\"99\" x2=\"205\" y2=\"100\" stroke=\"#ffb86b\" stroke-width=\"5\"/\u003e\u003cline x1=\"240\" y1=\"85\" x2=\"240\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"275\" y1=\"125\" x2=\"275\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"310\" y1=\"80\" x2=\"310\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003cline x1=\"205\" y1=\"100\" x2=\"205\" y2=\"165\" stroke=\"#ffb86b\" stroke-dasharray=\"2,3\" stroke-width=\"1\"/\u003e\u003ctext x=\"140\" y=\"180\" fill=\"#ffb86b\" font-size=\"13\"\u003enear-resonant site (kills the mean)\u003c/text\u003e\u003ctext x=\"20\" y=\"215\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eClosed self-avoiding walks contributing to Σ_i(E)\u003c/text\u003e\u003ccircle cx=\"65\" cy=\"295\" r=\"7\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"50\" y=\"320\" fill=\"#ffb86b\" font-size=\"13\"\u003esite i\u003c/text\u003e\u003ccircle cx=\"125\" cy=\"260\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"115\" y=\"252\" fill=\"#7aa2ff\" font-size=\"12\"\u003ej1\u003c/text\u003e\u003ccircle cx=\"195\" cy=\"285\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"200\" y=\"280\" fill=\"#7aa2ff\" font-size=\"12\"\u003ej2\u003c/text\u003e\u003ccircle cx=\"135\" cy=\"345\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"115\" y=\"365\" fill=\"#7aa2ff\" font-size=\"12\"\u003ej3\u003c/text\u003e\u003cline x1=\"65\" y1=\"295\" x2=\"125\" y2=\"260\" stroke=\"#7ee0a3\" stroke-width=\"1.8\"/\u003e\u003cline x1=\"125\" y1=\"260\" x2=\"195\" y2=\"285\" stroke=\"#7ee0a3\" stroke-width=\"1.8\"/\u003e\u003cline x1=\"195\" y1=\"285\" x2=\"135\" y2=\"345\" stroke=\"#7ee0a3\" stroke-width=\"1.8\"/\u003e\u003cline x1=\"135\" y1=\"345\" x2=\"65\" y2=\"295\" stroke=\"#7ee0a3\" stroke-width=\"1.8\"/\u003e\u003ctext x=\"20\" y=\"390\" fill=\"#7ee0a3\" font-size=\"12\"\u003elength-4 walk → weight t⁴ / [(E−ε_{j1})(E−ε_{j2})(E−ε_{j3})]\u003c/text\u003e\u003ctext x=\"395\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eProbabilistic convergence (fractional moment, 0\u0026lt;s\u0026lt;1)\u003c/text\u003e\u003ctext x=\"395\" y=\"85\" fill=\"#e8e6e1\" font-size=\"13\"\u003e⟨ |g|^s ⟩ = (2/W) (W/2)^(1−s) / (1−s) (finite)\u003c/text\u003e\u003ctext x=\"395\" y=\"115\" fill=\"#e8e6e1\" font-size=\"13\"\u003en-th order term: ⟨|Σ^(n)|^s⟩ ≤ ( K t^s ⟨|g|^s⟩)^n\u003c/text\u003e\u003ctext x=\"395\" y=\"148\" fill=\"#ffb86b\" font-size=\"13\"\u003eseries sums ⇔ K · t^s · ⟨|g|^s⟩ \u0026lt; 1\u003c/text\u003e\u003cline x1=\"395\" y1=\"170\" x2=\"700\" y2=\"170\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"395\" y=\"200\" fill=\"#e8e6e1\" font-size=\"13\"\u003eoptimise over s \u0026lt; 1:\u003c/text\u003e\u003ctext x=\"395\" y=\"235\" fill=\"#7ee0a3\" font-size=\"17\" font-family=\"serif\"\u003eW / t ≳ C · K · ln K\u003c/text\u003e\u003ctext x=\"395\" y=\"270\" fill=\"#e8e6e1\" font-size=\"13\"\u003e⇒ Σ_i(E) finite almost surely → eigenstate localized\u003c/text\u003e\u003ctext x=\"395\" y=\"305\" fill=\"#e8e6e1\" font-size=\"12\"\u003eband tails (|E| ~ W/2): criterion easiest\u003c/text\u003e\u003ctext x=\"395\" y=\"325\" fill=\"#e8e6e1\" font-size=\"12\"\u003eband centre (E = 0): criterion hardest\u003c/text\u003e\u003ctext x=\"395\" y=\"358\" fill=\"#e8e6e1\" font-size=\"12\"\u003e3D cubic, K=5: Anderson's bound W_c/t ≈ 30;\u003c/text\u003e\u003ctext x=\"395\" y=\"378\" fill=\"#e8e6e1\" font-size=\"12\"\u003emodern numerics at band centre W_c/t ≈ 16.5\u003c/text\u003e\u003c/svg\u003e\n*Figure: Left, a one-dimensional cut through the on-site disorder. One near-resonant site (orange) dominates a naive mean-locator estimate yet does not destroy the fractional-moment bound, since $\\langle|g|^s\\rangle$ is finite for any $s\u003c1$. Lower-left, a length-four closed self-avoiding walk contributes $t^4/\\!\\prod (E-\\epsilon_{j_k})$ to $\\Sigma_i$. Right, summing the resulting geometric series in $K t^s \\langle|g|^s\\rangle$ and optimising over $s$ yields Anderson's almost-sure localization threshold $W/t \\gtrsim C K \\ln K$.*\n\n### Regime of control — and what was assumed without proof\n\nThe locator expansion is controlled in two clean limits and one important geometry. (i) **Strong disorder**, $W/t \\gg K\\ln K$: the fractional-moment bound applies for *all* energies in the spectrum. (ii) **Band tails**, $|E|\\gtrsim W/2$: the typical denominator $|E-\\epsilon_j|$ is bounded below by $|E|-W/2$, and the same bound holds for any disorder strength — band tails are therefore localized first, giving the mobility edge its tail-inward sweep. (iii) **Bethe lattice / Cayley tree**: the absence of closed loops makes the self-avoiding constraint exact, and the locator series can be resummed to a self-consistent equation for the distribution of $\\Sigma$ — yielding an exact mobility edge $W_c(E)/t$ on that geometry (Abou-Chacra–Anderson–Thouless, 1973), the calculation Anderson would later single out in his Nobel lecture as the cleanest realisation of his original argument [2].\n\nWhat the 1958 argument does *not* establish: it does not prove a sharp delocalization–localization transition at finite disorder in $d=3$; it does not identify the spectral type (pure-point versus singular-continuous); it says nothing about the conductivity scaling at the mobility edge; and it tacitly identifies \"convergence of the locator expansion\" with \"exponential decay of the eigenfunction\" — a step plausible from the resolvent structure but not proved within the paper. Anderson himself flagged these gaps, and Mott noted in his own Nobel lecture that the locator scheme leaves the metallic side untouched [4]. The first gap was closed by the rigorous multi-scale analysis of Fröhlich and Spencer [8], who proved exponential decay of $|G_{ij}(E+i\\eta)|$ at strong disorder or at band edges; the second by the fractional-moment method of Aizenman and Molchanov [9], which formalised exactly the $\\langle |\\Sigma|^s\\rangle$ bound used heuristically above. Both rigorous programmes are, in essence, mathematical translations of the locator expansion — a case in which the physicist's intuitive scheme survived translation into a theorem with its skeleton intact, even as its quantitative threshold was sharpened by decades of numerics [7]."}, {"id": "scaling-theory-and-the-soviet-parallel", "title": "Scaling Theory: AALR, Gor'kov–Larkin–Khmelnitskii, and the Wegner Sigma Model", "markdown": "## Scaling Theory: AALR, Gor'kov–Larkin–Khmelnitskii, and the Wegner Sigma Model\n\nBy the late 1970s the localization problem had three loose threads. Anderson's locator expansion [1] gave a strong-disorder criterion but no controlled approach to the transition. Thouless had reframed conductance as a sensitivity of eigenvalues to boundary conditions, suggesting that a *single dimensionless number* might govern the flow from metal to insulator. And Wegner [6] had quietly rewritten the entire disorder-averaged problem as a field theory whose symmetry group dictated the answer. The 1979 synthesis — published within months of itself in *Physical Review Letters* and *JETP Letters* — wove these threads together.\n\n### The Thouless number and the AALR ansatz\n\nThouless's diagnostic is the ratio\n$$g(L) \\;=\\; \\frac{\\delta E(L)}{\\Delta(L)},$$\nwhere $\\delta E(L) \\sim \\hbar D/L^2$ is the shift in eigenvalues when periodic boundary conditions are replaced by antiperiodic, and $\\Delta(L) \\sim 1/[\\nu(E_F) L^d]$ is the mean level spacing in a block of side $L$. For a good metal $g(L) \\propto L^{d-2}$ via the Einstein relation $\\sigma = e^2 \\nu D$; for an insulator with localization length $\\xi$, the sensitivity falls exponentially, $g(L) \\sim e^{-L/\\xi}$. Either way $g$ is, up to factors of $e^2/h$, the *conductance* of the block.\n\nAbrahams, Anderson, Licciardello and Ramakrishnan [10] made one bold assumption: when blocks of size $L$ are joined to form blocks of size $bL$, the new conductance depends *only* on the old conductance. No second parameter, no density of states, no scattering rate. Then\n$$\\beta(g) \\;\\equiv\\; \\frac{d \\ln g}{d \\ln L}$$\nis a function of $g$ alone. The two asymptotes fix its shape: $\\beta(g) \\to d-2$ as $g \\to \\infty$ (Ohmic limit) and $\\beta(g) \\to \\ln g \\to -\\infty$ as $g \\to 0$ (exponential localization). Demanding monotonicity — the *only* nontrivial input — forces the curve to interpolate smoothly between these limits.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eAALR beta function\u003c/title\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"700\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"60\" y1=\"40\" x2=\"60\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"700\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eln g\u003c/text\u003e\u003ctext x=\"40\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\"\u003eβ(g)\u003c/text\u003e\u003cline x1=\"60\" y1=\"200\" x2=\"700\" y2=\"200\" stroke=\"#e8e6e1\" stroke-width=\"0.6\" stroke-dasharray=\"3 4\"/\u003e\u003ctext x=\"68\" y=\"195\" fill=\"#e8e6e1\" font-size=\"12\"\u003e0\u003c/text\u003e\u003cline x1=\"60\" y1=\"140\" x2=\"700\" y2=\"140\" stroke=\"#e8e6e1\" stroke-width=\"0.4\" stroke-dasharray=\"2 4\"/\u003e\u003ctext x=\"68\" y=\"135\" fill=\"#e8e6e1\" font-size=\"12\"\u003ed−2 (d=3)\u003c/text\u003e\u003cline x1=\"60\" y1=\"260\" x2=\"700\" y2=\"260\" stroke=\"#e8e6e1\" stroke-width=\"0.4\" stroke-dasharray=\"2 4\"/\u003e\u003ctext x=\"68\" y=\"275\" fill=\"#e8e6e1\" font-size=\"12\"\u003ed−2 (d=1)\u003c/text\u003e\u003cpath d=\"M 90 380 Q 280 360 420 300 T 700 140\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"540\" y=\"180\" fill=\"#7ee0a3\" font-size=\"14\"\u003ed = 3 (transition at g*)\u003c/text\u003e\u003cpath d=\"M 90 380 Q 280 360 460 250 T 700 200\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.2\" stroke-dasharray=\"6 3\"/\u003e\u003ctext x=\"540\" y=\"225\" fill=\"#ffb86b\" font-size=\"14\"\u003ed = 2 (marginal)\u003c/text\u003e\u003cpath d=\"M 90 380 Q 280 350 460 320 T 700 260\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.2\"/\u003e\u003ctext x=\"540\" y=\"305\" fill=\"#ff7a90\" font-size=\"14\"\u003ed = 1\u003c/text\u003e\u003ccircle cx=\"540\" cy=\"200\" r=\"5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"552\" y=\"196\" fill=\"#7aa2ff\" font-size=\"13\"\u003eg* (unstable FP, d=3)\u003c/text\u003e\u003ctext x=\"120\" y=\"370\" fill=\"#e8e6e1\" font-size=\"12\"\u003einsulator: β ≈ ln g\u003c/text\u003e\u003ctext x=\"500\" y=\"125\" fill=\"#e8e6e1\" font-size=\"12\"\u003emetal: β → d−2\u003c/text\u003e\u003c/svg\u003e\n*Figure: The AALR one-parameter beta function. In $d=3$ the curve crosses zero at an unstable fixed point $g^*$, giving a genuine metal–insulator transition. In $d=2$ orthogonal class $\\beta$ is everywhere negative, so the flow is always to the insulator — though only logarithmically slowly. In $d=1$ flow to localization is exponentially fast.*\n\nThe conclusion is read off the topology of the curve. In $d=3$, $\\beta$ crosses zero at an unstable fixed point $g^*$ — the mobility edge transition, with conductivity vanishing continuously as $\\sigma \\propto (g-g^*)^{\\nu(d-2)}$ rather than jumping by Mott's $\\sigma_{\\min}$. In $d=2$, $\\beta(g) \\to 0^-$ from below: every state is ultimately localized, but the slow logarithmic flow means a $d=2$ film looks metallic over enormous length scales before the localization length $\\xi \\sim \\ell\\, e^{\\pi k_F \\ell/2}$ ever bites. In $d=1$, the flow is to $g \\to 0$ from any starting point — recovering Mott–Twose [5] and Berezinskii.\n\n### Gor'kov, Larkin and Khmelnitskii: the microscopic anchor\n\nThe AALR argument, viewed cold, is one ansatz and a sketch. Its microscopic legitimacy came from the parallel JETP Letters paper by Gor'kov, Larkin and Khmelnitskii, who computed the leading quantum correction to the Drude conductivity from impurity-averaged diagrammatics. In the diffusive regime the dominant correction comes from maximally crossed (*Cooperon*) ladders — pairs of time-reversed paths interfering constructively at coincident endpoints. Summing the Cooperon ladder yields\n$$\\delta\\sigma \\;=\\; -\\,\\frac{e^2}{\\pi \\hbar} \\int \\frac{d^d q}{(2\\pi)^d} \\, \\frac{1}{D q^2},$$\nwhich in $d=2$ is logarithmically divergent in both UV (mean free path $\\ell$) and IR (phase-coherence length $L_\\phi$):\n$$\\delta\\sigma_{2D} \\;=\\; -\\,\\frac{e^2}{\\pi^2 \\hbar} \\ln\\!\\frac{L_\\phi}{\\ell}.$$\nThis is exactly the $\\beta(g) = -1/(\\pi^2 g)$ leading-order expansion of the AALR curve in $d=2$. Khmelnitskii's group identified the same logarithm; the Cooperon's destruction by a weak magnetic field — converting orthogonal to unitary class — became *the* experimental signature, the negative magnetoresistance of dirty films. Lee and Ramakrishnan's later review [7] documents the two derivations side by side. Western pedagogy compressed all of this into \"AALR / Gang of Four\"; the JETP-side credit is restored only in Soviet-tradition reviews and in Khmelnitskii's own historical notes.\n\n### Wegner's sigma model: why the heuristic worked\n\nWegner [6] had already shown what the AALR argument was secretly doing. Averaging products of retarded and advanced Green's functions over a Gaussian disorder potential generates an effective field theory of slow modes — the diffusons and Cooperons — whose target manifold is fixed by the symmetries of the Hamiltonian. For the orthogonal class (real $H$, time-reversal invariance, no spin–orbit) the replicated theory lives on\n$$\\mathcal{M}_O \\;=\\; \\frac{O(2n)}{O(n)\\times O(n)},$$\nwith unitary and symplectic analogues $U(2n)/U(n)\\times U(n)$ and $Sp(2n)/Sp(n)\\times Sp(n)$ obtained when time-reversal is broken (magnetic field) or spin–orbit coupling is present. The bare coupling of this nonlinear sigma model is precisely $1/g$. Its one-loop beta function in dimension $d = 2+\\epsilon$ is\n$$\\beta_O(t) \\;=\\; \\epsilon\\, t - t^2 + O(t^3), \\qquad t = 1/(\\pi g),$$\ngiving a fixed point $t^* = \\epsilon$ — Wegner's $\\epsilon$-expansion of the Anderson transition, parallel to Wilson's of the Heisenberg fixed point. The AALR ansatz of one-parameter scaling is, in this language, the statement that the sigma-model coupling is the only relevant operator near the Gaussian point.\n\nThe symmetry-class dependence is now structural rather than mysterious. Breaking time reversal (unitary class) eliminates the Cooperon and the leading log: $\\beta_U(t) = \\epsilon t - 2 t^3 + \\cdots$, so the negative correction in $d=2$ is much weaker and the localization length scales as $\\xi \\sim \\ell \\, e^{(\\pi k_F \\ell)^2}$ — astronomical, but finite. Adding spin–orbit (symplectic class) flips the sign of the Cooperon contribution: $\\beta_{Sp}(t) = \\epsilon t + t^2/2 + \\cdots$, opening a window of *anti*-localization and, in $d=2$, a genuine metallic phase up to a critical disorder. Hikami–Larkin–Nagaoka had extracted the same three signs from microscopic diagrammatics in 1980; the sigma model showed they were the only three possibilities allowed by the tenfold symmetry classification.\n\nWhat survives, then, is a layered attribution. The one-parameter scaling *idea* is Thouless and AALR [10]. The leading-order *coefficient* — and the experimental program of weak localization — is Gor'kov–Larkin–Khmelnitskii. The *RG skeleton* that lets one trust the heuristic, organize the symmetry classes, and write a controlled $\\epsilon$-expansion is Wegner [6], extended into supersymmetric form by Efetov a few years later. The three are usually compressed into one citation in textbooks; the historical record requires all three."}, {"id": "what-was-superseded", "title": "Validity Audit: What Survived, What Was Overturned", "markdown": "## Validity Audit: What Survived, What Was Overturned\n\nThree decades of refinement have left the Anderson program with a surprisingly small set of durable theorems and a much larger set of slogans that survive in the literature only because their assumptions are no longer read aloud. This section sorts them.\n\n### Mott's minimum metallic conductivity: dead\n\nMott's 1972 argument fixed a dimensional combination,\n$$\\sigma_{\\min} \\;\\sim\\; \\frac{e^2}{\\hbar}\\,\\frac{C}{a},$$\nwith $C\\!\\sim\\!0.025$–$0.1$ and $a$ a microscopic length, and asserted that the d.c. conductivity must jump discontinuously from this value to zero at the metal–insulator transition. The scaling theory killed it. The one-parameter $\\beta$-function of AALR [10] and the diagrammatic conductivity correction of Gor'kov–Larkin–Khmelnitskii put a smooth fixed point at $g=g_c$ in three dimensions, with\n$$\\sigma(T=0) \\;\\propto\\; (n - n_c)^{\\nu(d-2)},\\qquad d=3,$$\ni.e. a continuous power-law vanishing controlled by the localization-length exponent $\\nu$ (numerically $\\nu\\!\\approx\\!1.57$ for the 3D orthogonal class, established by transfer-matrix and finite-size scaling and reproduced in the nonlinear $\\sigma$-model expansion of Wegner [6]). The Si:P compensation-doping data on which $\\sigma_{\\min}$ was originally based were re-examined in the 1980s and the cleanest stress-tuning experiments collapse onto a continuous curve. Lee and Ramakrishnan canonized this verdict in their 1985 review [7]. $\\sigma_{\\min}$ now survives only as a phenomenological order-of-magnitude estimate, never as a theorem. The literature occasionally still quotes it; when it does, the citation is to Mott's monograph, not to any post-1979 derivation.\n\n### The mobility edge: alive, but not where it is usually drawn\n\nAnderson's locator expansion [1] and Mott's pre-scaling reasoning [4] both identified an energy $E_c$ separating localized from extended states. The scaling theory and the rigorous program (Fröhlich–Spencer [8], Aizenman–Molchanov [9]) confirmed its existence in $d\\ge 3$ for sufficiently weak disorder. What is routinely misdrawn is its location. The mobility edge lies inside the density of states, not at a band edge. The density of states $\\rho(E)$ is generically smooth and nonzero through $E_c$; what changes is the eigenfunction structure — the inverse participation ratio $P_2^{-1}=\\sum_i|\\psi_i|^4$ goes from $\\mathcal{O}(L^{-d})$ to $\\mathcal{O}(1)$, while $\\rho(E_c)$ shows no singularity. Two consequences follow that are still mishandled:\n\n(i) The transition is invisible to thermodynamics. There is no specific-heat anomaly, no compressibility jump. Diagnosis requires transport (Kubo $\\sigma(\\omega\\!\\to\\!0,T\\!\\to\\!0)$), level statistics (Wigner–Dyson $\\to$ Poisson crossover), or sensitivity to boundary conditions (the Thouless number).\n\n(ii) Statements that the mobility edge \"moves into the band as disorder grows, eventually swallowing the entire spectrum\" are correct — this is Mott's \"Anderson transition by band tail merging\" — but the inverse statement, that $E_c$ approaches a band edge in the clean limit, is wrong. As $W\\!\\to\\!0$ the mobility edges leave the spectrum entirely; all states become extended. Papers that write $E_c=E_{\\text{band edge}} + \\delta(W)$ as a regular expansion in small $W$ are silently invoking a band-tail picture that is not in Anderson's model.\n\n### \"All states localized in $d\\!\\le\\!2$\": valid only in the orthogonal class\n\nThe single most over-cited result of the program is the AALR conclusion that in two dimensions any nonzero disorder localizes every state [10]. The slogan is true — and important — but it holds only for the orthogonal Wigner–Dyson symmetry class: spinless (or spin-rotation symmetric) electrons in a static, time-reversal-symmetric, non-interacting random potential. The full picture, made precise by Wegner's sigma-model classification [6] and its later tenfold extension, has three two-dimensional cases:\n\n| Class | Symmetries broken | $\\beta(g)$ at large $g$ | 2D fate |\n|---|---|---|---|\n| Orthogonal (AI) | none | $-1/(\\pi g)$ | all states localized |\n| Unitary (A) | time reversal (e.g. magnetic field) | $-1/(2\\pi^2 g^2)$ | localized, but $\\xi$ exponentially larger; integer quantum Hall transitions inside |\n| Symplectic (AII) | spin rotation (spin–orbit), TR intact | $+1/(2\\pi g)$ | antilocalization; genuine metal–insulator transition in 2D |\n\nThe $+$ sign in the symplectic $\\beta$-function is the substantive point: weak antilocalization, established diagrammatically by Hikami, Larkin and Nagaoka (1980) and observed in magnetoconductance of strong-spin–orbit films, means a true 2D Anderson transition exists. The \"no metal in 2D\" slogan, quoted without symmetry-class qualification, is wrong by construction in any system with appreciable spin–orbit coupling — i.e., in most of the materials studied since the 2000s, including topological insulator surface states and many oxide interfaces. The slogan is also wrong, in a different way, once interactions enter: the Finkel'stein extension of the sigma model produces metallic fixed points in 2D for the symplectic and certain unitary universality classes that have nothing to do with the non-interacting theorem.\n\n### Equations quoted with assumptions stripped\n\nA short catalogue of formulas now in casual circulation whose preconditions have evaporated.\n\n**The weak-localization correction.** The textbook 2D quantum correction\n$$\\Delta\\sigma(L) \\;=\\; -\\,\\frac{e^2}{\\pi^2\\hbar}\\,\\ln\\!\\frac{L_\\varphi}{\\ell}$$\nis universally written without the orthogonal-class label. It changes sign in the symplectic class and acquires a $1/(2\\pi^2)$ prefactor with a different cutoff structure in the unitary class. Used unmodified for graphene, topological-insulator films, or InAs heterostructures, it is wrong in sign or magnitude.\n\n**The Thouless conductance criterion.** $g_T = E_T/\\Delta = \\hbar D/(L^2\\Delta)$, where $E_T$ is the Thouless energy and $\\Delta$ the level spacing, was derived assuming a diffusive metallic regime with well-defined $D$. Quoting it inside the localized phase, where $D=0$ and the relevant scale is $\\xi$, is conceptually empty; the correct localized-side analogue uses the typical, not the mean, level coupling. Reviews routinely blur this.\n\n**The Ioffe–Regel criterion** $k_F\\ell\\!\\sim\\!1$ as the Anderson transition condition. This is a heuristic for the disappearance of quasiparticles, not a derivation of the transition. The 3D Anderson critical disorder $W_c/t\\!\\approx\\!16.5$ (numerically established) does correspond to $k_F\\ell\\!\\sim\\!1$ at the band centre, but the criterion misses the band-edge mobility-edge structure entirely and is silent about symmetry class.\n\n**The single-parameter scaling ansatz.** $\\beta(g) = d\\ln g/d\\ln L$ depends only on $g$. This is an assumption, not a theorem; corrections from a second relevant scaling variable (notably at the integer quantum Hall transition and at the 3D symplectic transition) are now well established. Any modern numerical extraction of $\\nu$ that quotes 4-digit precision without acknowledging irrelevant-operator corrections is overstating its case.\n\n**Furstenberg / Goldsheid–Molchanov–Pastur in 1D.** The rigorous statement is that for the 1D random Schrödinger operator with sufficient potential regularity, the spectrum is almost-surely pure-point with exponentially decaying eigenfunctions. Cited in the optics literature as \"all 1D systems Anderson-localize\", it silently drops the i.i.d.-potential and finite-second-moment hypotheses that fail for correlated disorder, quasiperiodic potentials (whose phase diagram is genuinely richer — see [11]), and Lévy-tailed distributions.\n\nWhat remains, then, is a tight core: the locator expansion as a criterion for strong-disorder localization [1]; the multi-scale and fractional-moment proofs that make it rigorous [8, 9]; the sigma-model classification of universality classes [6]; the continuous 3D transition with a single relevant exponent in the orthogonal class; and the Wigner–Dyson-to-Poisson level-statistics diagnostic. Everything else in the modern toolkit is a regime-restricted formula whose validity is set by which symmetries are broken, whether interactions are present, and whether the disorder distribution has finite moments. The next section will show how reliably those qualifications are dropped once the formulas leave the disordered-electrons community."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From Si:P to Speckle BECs", "markdown": "## Landmark Experiments: From Si:P to Speckle BECs\n\nThe Anderson program is unusual among condensed-matter theories in that its empirical anchors span seven decades of experiment, four distinct platforms (electrons, microwaves, light, cold atoms), and a steady traffic between systems that satisfy the orthogonal-class hypotheses of the 1958 theorem and systems that violate one or more of them. A careful catalogue has to keep that distinction visible. What follows traces the landmarks in roughly chronological order, flagging in each case (i) what was actually measured, (ii) which of the Anderson assumptions held, and (iii) what the experiment did and did not establish.\n\n### Feher's spin diffusion in Si:P (1955–1959)\n\nThe seed experiment is George Feher's ENDOR (electron–nuclear double resonance) work at Bell Labs on phosphorus donors in silicon. Below the insulator–metal transition (donor concentrations $n_D \\lesssim 3\\times 10^{18}\\,\\text{cm}^{-3}$) the donor electron is bound in a hydrogenic $1s$ orbital of Bohr radius $a_B^\\ast \\approx 20\\,\\text{\\AA}$. Feher measured the spin–lattice relaxation $T_1$ and the spin-diffusion rate that transports polarization from one donor to another via the hyperfine-coupled $^{29}\\text{Si}$ nuclei. The puzzle was that spin diffusion across the donor array was anomalously slow — far slower than a naive hopping estimate based on wavefunction overlap. Anderson, then in the same building, read the diffusion as *absent on long scales* and asked under what conditions a tight-binding model on a disordered lattice would forbid it altogether. The 1958 paper [1] opens with an explicit nod to Feher's data, and the 1977 Nobel lecture restates the debt [2]. The Si:P system is single-particle, time-reversal-symmetric, and effectively non-interacting at low donor density — almost a textbook realization of the orthogonal class, which is why it remains the cleanest electronic platform.\n\n### Doped-semiconductor metal–insulator transitions: Si:P and Ge:Sb (1980s)\n\nThree decades later the same material — uncompensated Si:P — supplied the most quantitatively studied $d=3$ Anderson(–Mott) transition. The decisive measurements were the Rosenbaum–Andres–Bhatt–Thomas dc-conductivity scan across the critical density $n_c \\approx 3.74\\times 10^{18}\\,\\text{cm}^{-3}$ (verify), with uniaxial stress used as a fine tuning parameter to walk across $n_c$ continuously, and parallel work on Ge:Sb by Thomas and collaborators. The conductivity was found to vanish continuously,\n\n$$\\sigma(T\\to 0) \\;\\propto\\; \\bigl(n/n_c - 1\\bigr)^{\\nu_\\sigma},$$\n\nwith an exponent close to $\\nu_\\sigma \\approx 1/2$ for stress-tuned Si:P (verify) — *not* the discontinuous Mott jump. This is the single most often cited empirical refutation of Mott's minimum metallic conductivity; it also became the touchstone for the Lee–Ramakrishnan review [7]. Two caveats are routinely glossed over. First, Si:P is *not* in the non-interacting limit at $n_c$: the dimensionless Coulomb coupling $r_s$ is of order unity, and Altshuler–Aronov interaction corrections compete with localization corrections at every temperature actually achievable. The \"Anderson transition\" measured in Si:P is really an Anderson–Mott transition, and the disagreement between exponents extracted from different samples and protocols (the long-running $\\nu \\approx 0.5$ vs $\\nu \\approx 1$ controversy) is a direct symptom of that. Second, compensation (Si:P,B) shifts the universality class, because the random Coulomb potential of charged compensating acceptors changes the disorder distribution.\n\n### 2D MOSFETs: weak localization, not strong (1980–1982)\n\nThe AALR scaling theory [10] predicted a logarithmic *decrease* of the 2D sheet conductance with falling temperature,\n\n$$\\Delta\\sigma(T) \\;=\\; \\frac{e^2}{\\pi h}\\,p\\,\\ln(T/T_0),$$\n\nwhere $p$ depends on the dominant dephasing mechanism. The confirming experiments — Bishop, Tsui and Dynes on Si MOSFETs and Dolan and Osheroff on thin metallic films, around 1980 — measured exactly this $\\ln T$ correction and, crucially, its *negative magnetoresistance*: a perpendicular field of a few mT, far too weak to affect classical transport, suppresses the Cooperon and restores ordinary Drude conductivity. This is the experimental signature that the correction is interferometric, not classical. The cleanest single-parameter test came from comparing samples of different $k_F\\ell$: $p$ extracted from $\\Delta\\sigma(T)$ matched $p$ extracted from $\\Delta\\sigma(B)$, as Hikami–Larkin–Nagaoka theory required. These experiments confirmed *weak* localization and were repeatedly mis-labelled as observations of Anderson localization. They are not: the conductance was finite, the wavefunctions extended, and the $\\ln T$ correction is precisely the perturbative one-loop precursor on the metallic side of the would-be transition. The promised flow to $\\sigma=0$ at $T=0$ was masked at accessible temperatures by inelastic dephasing and, in MOSFETs, by electron–electron interaction corrections of the same logarithmic form — the Altshuler–Aronov terms — which a clean disentanglement of weak-localization and interaction contributions required magnetoresistance fingerprinting to separate.\n\n### Microwaves in disordered waveguides (Genack, Chabanov; 1990s–2000s)\n\nClassical electromagnetism in a copper waveguide stuffed with dielectric scatterers offers an arena where the *wave* part of Anderson's argument can be isolated from the *fermion* part. Chabanov, Stoytchev and Genack reported, in quasi-1D copper tubes packed with alumina spheres, statistics of transmission $T$ whose variance crossed from $\\langle (\\delta T)^2\\rangle/\\langle T\\rangle^2 \u003c 2/3$ (diffusive) to $\u003e 2/3$ (localized) as the dimensionless conductance $g = \\langle T\\rangle$ fell below unity. This was the first clean observation of the *localized regime* via fluctuation statistics rather than via mean transmission alone. Because the experiment is classical and time-reversal-symmetric, it sits in the orthogonal symmetry class; absorption (a non-Hermitian addition absent from Anderson's Hamiltonian) had to be deconvolved from the data, and the protocol for doing so is itself a small literature.\n\n### Photonic localization: De Raedt, Lagendijk, Wiersma (1989–2008)\n\nJohn's 1987 proposal [12] of strong photon localization in carefully engineered dielectric superlattices set the target: a real, positive $\\varepsilon(\\mathbf{r})$ disordered medium in which a photon mobility edge cuts the diffusive transport channel. The route through ordinary powders (TiO$_2$, GaAs, Ge) is hampered by the fact that the photonic Ioffe–Regel criterion $k\\ell^\\ast \\lesssim 1$ requires refractive-index contrast and absorption control that semiconductor powders barely deliver. Wiersma, Bartolini, Lagendijk and Righini reported in 1997 a deviation of the transmission from $1/L$ (diffusion) toward exponential decay in GaAs powders, interpreted as 3D photon localization; the result was contested on the grounds that residual absorption mimics localization in the mean transmission. Schwartz, Bartal, Fishman and Segev in 2007 demonstrated unambiguous *transverse* localization in a 2D photonic lattice with a disordered refractive-index profile — light propagating along $z$ obeys a paraxial Schrödinger equation in $(x,y)$ that maps exactly onto a 2D Anderson problem in the orthogonal class. This and the subsequent Anderson-localizing optical fibres reviewed by Mafi *et al.* [13] are the photonic platforms in which the mapping to Anderson's 1958 model is least ambiguous; bulk 3D photon localization in passive dielectrics remains, as of writing, unsettled.\n\n### Cold-atom matter waves: Billy *et al.* and Roati *et al.* (2008)\n\nThe single-particle, non-interacting, time-reversal-symmetric, static-random-potential limit — i.e. the literal Anderson Hamiltonian — was finally realized with cold atoms. Two papers appeared back-to-back in *Nature* in 2008. Billy *et al.* at Institut d'Optique [14] released a $^{87}$Rb BEC into a 1D laser-speckle potential, with interactions tuned away by ballistic expansion until the cloud was effectively non-interacting, and imaged the in-situ density profile after the diffusion had stopped. The wavefunction settled into an exponential envelope $|\\psi(z)| \\sim e^{-|z|/L_{\\text{loc}}}$ whose decay length tracked the predicted dependence on the speckle correlation length and the atomic kinetic energy. Roati *et al.* at LENS [11] used a quasi-periodic bichromatic lattice — the Aubry–André model — with a non-interacting $^{39}$K condensate (interactions tuned to zero via a Feshbach resonance), observing the localization transition at the predicted Aubry–André critical ratio of the two lattice depths. Two cautions belong on these landmark experiments. (a) Speckle is *correlated* disorder with a finite correlation length $\\sigma_R$; above an *effective mobility edge* $E \\sim \\hbar^2/m\\sigma_R^2$ the speckle Fourier spectrum has no support and single-particle states are anomalously extended — a 1D mobility edge that the AALR picture does not anticipate and which had to be sorted out theoretically before the Billy data could be interpreted cleanly. (b) Aubry–André is *quasi-periodic*, not random: its localization transition is driven by a self-dual structure and exists at finite disorder strength even in 1D, in contrast to Anderson's all-states-localized result for genuinely random 1D potentials. Calling both 2008 experiments \"Anderson localization\" without qualification glosses over precisely the symmetry/structure inputs that determine whether the AALR phase diagram applies.\n\n### What the catalogue establishes — and what it does not\n\nAcross these platforms the durable empirical claims are: (i) exponential localization of single-particle wavefunctions in 1D random potentials is real and quantitatively matches the Furstenberg/Berezinskii calculations; (ii) the $\\ln T$ weak-localization correction and its magnetoresistance fingerprint are universal in 2D diffusive metals; (iii) a continuous 3D metal–insulator transition exists in doped semiconductors, killing the minimum-metallic-conductivity conjecture; (iv) classical waves localize in the orthogonal class in quasi-1D and in 2D. What is *not* yet established with comparable rigor: a clean 3D bulk photon mobility edge in a passive dielectric, a Si:P critical exponent free of interaction contamination, and — the topic of §8 — any matter-wave experiment that resolves whether MBL survives the thermodynamic limit."}, {"id": "use-and-abuse", "title": "Use and Abuse: Conflations That Have Escaped the Theorem", "markdown": "## Use and Abuse: Conflations That Have Escaped the Theorem\n\nThe Anderson program has accumulated a vocabulary that travels faster than its premises. Five conflations recur in seminar talks, referee reports, and even respectable monographs. Each one is a slogan that has detached from a theorem and is now applied to systems where the theorem does not hold. A working referee should treat each as a checklist item.\n\n### (i) \"Exponentially localized eigenmode\" ≠ Anderson localization\n\nAnderson's theorem [1] concerns a single quantum particle in a static, on-site-disordered, time-reversal-symmetric, spinless lattice — the orthogonal Wigner–Dyson symmetry class ($\\beta=1$). The AALR $\\beta$-function [10] is derived in the same class. Three quantities must be specified before invoking either:\n\n- **Symmetry class.** Time reversal alone gives orthogonal. Time-reversal breaking (magnetic field, ferromagnetic exchange) gives unitary ($\\beta=2$). Strong spin–orbit gives symplectic ($\\beta=4$). The \"all states localized in $d=2$\" statement is *only* the orthogonal one. The symplectic class has a genuine 2D metal–insulator transition; the unitary class delocalizes at isolated critical energies (the integer-quantum-Hall plateau transitions). Quoting \"all states localized in 2D\" without naming the class is wrong as often as it is right.\n- **Absorption or gain.** Photonic and acoustic realizations obey a Helmholtz equation with complex $\\epsilon(\\mathbf r)$. Absorption introduces a length $\\ell_a$ that mimics localization in transmission: $T\\sim\\exp(-L/\\xi_{\\rm eff})$ with $\\xi_{\\rm eff}^{-1}=\\xi^{-1}+\\ell_a^{-1}$. A referee should demand an independent measurement of $\\ell_a$ (varying $L$, fitting both mean transmission and its fluctuations) before \"exponential decay\" is reported as localization. John's original photonic mechanism [12] is explicit on this point.\n- **Scattering channels.** Open boundaries, leads, and decoherence each fix a length. Localization claims are meaningful only when $L \\ll L_\\phi$ and the Thouless energy $E_{\\rm Th}=\\hbar D/L^2$ is well defined.\n\nDiagnostic check: name the class, give the absorption budget, give $L/L_\\phi$. Without these, \"Anderson localization\" is a description of a fit, not a statement about a state.\n\n### (ii) Weak localization is not \"the weak limit of strong localization\"\n\nWeak localization is a *perturbative* quantum-interference correction to the Drude conductivity, generated by maximally-crossed (Cooperon) diagrams [7]. In 2D it gives\n\n$$\\delta\\sigma(L)\\;=\\;-\\,\\frac{e^2}{\\pi h}\\,\\ln\\!\\left(\\frac{L_\\phi}{\\ell}\\right),$$\n\na logarithm killed by a magnetic field of order $B_c\\sim \\hbar/(eL_\\phi^2)$ and by dephasing as $T$ rises. Strong (Anderson) localization is the non-perturbative regime in which $\\sigma(T{=}0)\\equiv 0$ and wavefunctions are bounded by $\\xi$. They sit on the same $\\beta$-function curve [10] but are not interchangeable: weak localization is a temperature-dependent correction to a metallic background; strong localization is a thermodynamic phase. A magnetoconductance fitting the Hikami–Larkin–Nagaoka form is *evidence against* strong localization at the operating temperature, not for it. \"Negative magnetoresistance, therefore Anderson insulator\" should not survive review.\n\n### (iii) Anderson insulator ≠ Mott insulator\n\nThe two arise from orthogonal causes: $W/t$ (disorder over hopping) versus $U/t$ (Hubbard repulsion over bandwidth). They differ in three diagnostics that should always be reported together:\n\n- **Compressibility.** A Mott insulator has $\\partial n/\\partial\\mu=0$ inside its hard gap. An Anderson insulator has $\\partial n/\\partial\\mu\\neq 0$: the single-particle density of states is finite at the chemical potential, only the conductivity vanishes.\n- **Optical gap.** Mott systems show a hard charge gap of order $U$ with a Hubbard-band optical signature; Anderson insulators show a soft pseudogap (Efros–Shklovskii in the Coulomb-interacting case) that closes on the transport scale.\n- **Doping response.** Light doping drives a Mott insulator toward a correlated metal with a coherence scale set by $J\\sim t^2/U$. The same doping merely shifts the chemical potential through the band tail of an Anderson insulator.\n\nReal systems sit in the Anderson–Mott crossover [7, 4]; most of the 1980s disordered-electron literature was an attempt to disentangle the two contributions. Calling a half-filled disordered Hubbard insulator \"Anderson localized\" because $\\rho(T)$ diverges is a category error.\n\n### (iv) Mobility edge ≠ band edge\n\nThe mobility edge $E_c$ is a transport boundary, not a spectral edge. The density of states $\\rho(E)$ is smooth and finite across $E_c$; the inverse participation ratio collapses there, but no thermodynamic singularity exists [7, 4]. Three corollaries follow:\n\n- $E_c$ cannot be located by tunneling spectroscopy alone — measuring $\\rho(E_c)\\neq 0$ proves nothing.\n- $E_c$ cannot be located by photoemission lineshape — localized and extended states contribute alike to $\\rho(E)$.\n- $E_c$ *can* be located by transport (vanishing dc conductivity), by AC conductivity ($\\sigma(\\omega)\\sim\\omega^s$ in the localized phase), by level statistics (Wigner–Dyson → Poisson), or by the divergence of $\\xi$ extracted from finite-size scaling.\n\nA consequence: the \"mobility gap\" of an amorphous semiconductor is the interval $[E_c^v,E_c^c]$ between valence- and conduction-band mobility edges, not the optical gap. The two coincide only when band tails are negligible — which in real glasses they are not.\n\n### (v) Many-body localization inherits the name, not the theorem\n\nBasko–Aleiner–Altshuler [15] argued that adding weak short-range interactions to an Anderson-localized single-particle spectrum can leave the full many-body system non-ergodic at finite energy density. The conjecture invokes localization in Fock space and a complete set of quasi-local integrals of motion; its phenomenology — logarithmic entanglement growth, absence of thermalization, a level-statistics crossover at a putative transition — is genuinely new. Three points must be kept straight:\n\n- Anderson's 1958 theorem [1] says **nothing** about interacting thermodynamic systems. Citing [1, 8, 9] in defense of an MBL claim is a non sequitur; those proofs are all one-particle.\n- The BAA argument is perturbative in interaction strength and relies on a Cayley-tree resonance count. Whether the construction survives as a sharp transition in the thermodynamic limit at any finite disorder has been seriously contested by avalanche / thermal-inclusion arguments and by exact-diagonalization studies that exhibit pronounced drift of the apparent crossover with system size (verify).\n- The cold-atom platforms that gave us [14, 11] are non-interacting. They are clean tests of Anderson, not of MBL; the MBL experiments are a separate generation of optical-lattice work whose interpretation is itself the subject of the current debate.\n\nDiagnostic check: a referee evaluating an MBL claim should demand the system size, the energy density, the disorder-averaging protocol, and an explicit argument that the data are inconsistent with a finite-size crossover.\n\n### A referee's checklist\n\n| Claim under review | Required to grant it |\n|---|---|\n| \"Anderson-localized\" | Symmetry class stated; ratio $L/L_\\phi$; absorption budget for wave realizations |\n| \"All states localized in 2D\" | Orthogonal class confirmed: no spin–orbit, no TR breaking |\n| \"Magnetoresistance shows localization\" | HLN log-correction distinguished from variable-range hopping |\n| \"Mott-like gap\" | Compressibility, not only $\\rho(T)$ |\n| \"Mobility edge observed\" | Transport or level-statistics evidence; not a DOS kink |\n| \"Many-body localized phase\" | Finite-size scaling that excludes a crossover; protocol and energy density stated |\n\nAnderson's theorem is narrow, sharp, and durable. The slogans built on top of it are wider, looser, and frequently wrong. Most of the controversies that fill the field's seminar rooms are, on inspection, controversies about which of these boxes were left unchecked."}, {"id": "mathematical-rigor-and-the-other-community", "title": "The Parallel Mathematical Program", "markdown": "## The Parallel Mathematical Program\n\nAnderson's 1958 paper [1] is, by the standards of mathematical physics, a heuristic document. The locator expansion is a formal power series whose convergence is argued by counting self-avoiding paths and estimating their typical denominators; the conclusion — absence of diffusion above a critical disorder — is asserted, not proved. The physics community, having found the prediction confirmed by experiment and amplified by scaling theory [10], moved on. A separate community did not. Over the half-century after Anderson's paper, mathematical physicists built a rigorous lineage that physics textbooks almost never cite, and which now constitutes the only part of the Anderson program that meets the standard of a theorem. The lineage is worth tracing both because it is genuinely beautiful and because it draws the line — much narrower than the physics literature implies — between what has been *proved* and what is merely *believed*.\n\n### From products of random matrices to one dimension\n\nThe mathematical story starts before Anderson, with a question that looked unrelated. Furstenberg, in his 1963 paper on noncommuting random matrices, proved that for an i.i.d. sequence $\\{M_n\\}$ of $\\mathrm{SL}(2,\\mathbb{R})$ matrices satisfying mild irreducibility hypotheses, the norm of the product grows exponentially almost surely:\n$$\\gamma \\;=\\; \\lim_{N\\to\\infty}\\,\\frac{1}{N}\\,\\log\\|M_N M_{N-1}\\cdots M_1\\| \\;\u003e\\; 0 \\quad \\text{a.s.}$$\nThe constant $\\gamma$ — the Lyapunov exponent — is positive whenever the random matrices do not preserve a common invariant measure on projective space. This is a statement about ergodic theory; the connection to disordered quantum systems is the transfer-matrix representation of the 1D Schrödinger equation\n$$\\psi_{n+1} \\;=\\; (E - \\epsilon_n)\\,\\psi_n \\;-\\; \\psi_{n-1},$$\nwhich packages each step as multiplication by a random $\\mathrm{SL}(2,\\mathbb{R})$ matrix $T_n(E)$. Furstenberg's theorem then says that for almost every realization of the disorder and Lebesgue-a.e. energy, $\\|T_N\\cdots T_1\\| \\sim e^{\\gamma(E)N}$ with $\\gamma(E)\u003e0$. Solutions of the Schrödinger equation either grow or decay exponentially; the half-decaying ones — when they exist — give localized eigenfunctions with inverse localization length $\\gamma(E)$.\n\nTurning \"positive Lyapunov exponent\" into \"the spectrum is pure point with exponentially decaying eigenfunctions\" required more work. The decisive step was Goldsheid, Molchanov \u0026 Pastur in 1977: for the 1D random Schrödinger operator on $\\mathbb{Z}$ with i.i.d. on-site potential drawn from an absolutely continuous distribution of finite variance, the spectrum is almost surely pure point throughout, with eigenfunctions decaying at the Furstenberg rate. Kunz \u0026 Souillard reproved and sharpened this in 1980 with cleaner spectral-averaging methods that extended to a wider class of distributions and to lattice models with more than nearest-neighbor hopping. By 1980 the one-dimensional Anderson conjecture — Mott \u0026 Twose's \"all states localized for arbitrarily weak disorder\" [5] — was a theorem. It also dispatched the Berezinskii diagrammatic computation as a perturbative window onto a non-perturbative truth.\n\n### Quasi-1D and the supersymmetric detour\n\nThe 1D result extends naturally to strips $\\mathbb{Z}\\times\\{1,\\ldots,W\\}$ and to thick wires. The Lyapunov spectrum of an $\\mathrm{SL}(2W,\\mathbb{R})$ transfer matrix is generically simple (a theorem of Goldsheid \u0026 Margulis, 1989), so the smallest positive exponent — the inverse localization length of the wire — is strictly positive. All states in any quasi-1D wire of finite cross-section are exponentially localized. On the physics side, the same conclusion was obtained by Efetov–Larkin and by Dorokhov via the DMPK equation and the supersymmetric nonlinear sigma model — descendants of Wegner [6]. The mathematical and physical lineages agree quantitatively here: the localization length scales as $\\xi \\sim W \\ell$ with $\\ell$ the elastic mean free path, a result that is both proved (Lyapunov-exponent calculus) and computed (sigma model on a strip).\n\n### Multi-scale analysis: Fröhlich–Spencer\n\nThe genuinely hard case is $d \\ge 2$, where transfer matrices no longer suffice and the Schrödinger operator must be controlled directly. The decisive technique is the multi-scale analysis of Fröhlich \u0026 Spencer (1983) [8]. The idea is inductive. One shows that on a length scale $L_0$ the finite-volume resolvent $G_{L_0}(E;x,y) = \\langle x \\mid (H_{L_0} - E)^{-1} \\mid y\\rangle$ decays exponentially with high probability, provided the disorder is strong (large $W$ in the box-distribution Anderson model) or the energy lies in a Lifshitz tail near the band edge. One then iterates: a \"good\" box at scale $L_k$ implies, with probability $1 - L_k^{-p}$, a \"good\" box at scale $L_{k+1} = L_k^\\alpha$ for some $\\alpha\u003e1$, and the bad regions at scale $L_k$ are sparse enough that resonances between them can be excluded by a Wegner estimate\n$$\\mathbb{P}\\bigl(\\mathrm{dist}(\\sigma(H_\\Lambda),E) \u003c \\eta\\bigr) \\;\\le\\; C\\,\\eta\\,|\\Lambda|,$$\nwhich controls the probability that the random Hamiltonian on a box $\\Lambda$ has an eigenvalue dangerously close to $E$. Iterating to all scales gives exponential decay of $|G(E;x,y)|$ in the infinite volume and, via the RAGE theorem and spectral averaging, pure-point spectrum with exponentially localized eigenfunctions. The Fröhlich–Spencer theorem therefore covers, in any dimension $d$: (i) sufficiently strong disorder at every energy; (ii) energies sufficiently close to the unperturbed band edges (Lifshitz tail) at arbitrarily weak disorder.\n\nWhat it does not cover, and could not, is the interior of the band at weak disorder in $d\\ge 3$.\n\n### Aizenman–Molchanov: the fractional-moment method\n\nIn 1993, Aizenman \u0026 Molchanov [9] gave a substantially simpler proof of the same conclusions and more. Their fractional-moment method bounds\n$$\\mathbb{E}\\bigl[\\,|G(E;x,y)|^s\\,\\bigr] \\;\\le\\; C\\,e^{-\\mu|x-y|}, \\qquad 0\u003cs\u003c1,$$\nusing the fact that for $s\u003c1$ the expectation of $|a+\\epsilon|^{-s}$ over an absolutely continuous $\\epsilon$ is finite even though $|a+\\epsilon|^{-1}$ is not. A single-step decoupling estimate, iterated geometrically, replaces the elaborate scale induction. The method gives exponential decay of *all* fractional moments of the Green function — a strong form of dynamical localization — and works at strong disorder, in Lifshitz tails, at extreme energies, and on a wide variety of graphs including the Bethe lattice. Aizenman \u0026 Warzel later used the same machinery to prove the existence of an extended (absolutely continuous) phase on the Bethe lattice, the only Anderson-type model where a delocalized phase has been rigorously established.\n\n### What is proved, what is believed\n\nA compact ledger. *Proved*: in $d=1$, all states localized at any disorder (Goldsheid–Molchanov–Pastur; Kunz–Souillard). In quasi-1D wires of finite cross-section, all states localized (Goldsheid–Margulis). In any dimension $d\\ge 2$, exponential and dynamical localization at strong disorder and in Lifshitz band-edge tails at arbitrary disorder (Fröhlich–Spencer [8]; Aizenman–Molchanov [9]; Aizenman–Schenker–Friedrich–Hundertmark). Pure-point spectrum and exponential decay of eigenfunction correlators in those regimes. On the Bethe lattice, coexistence of localized and delocalized spectrum (Aizenman–Warzel). *Believed but not proved*: in $d=3$ at weak disorder, the existence of an absolutely continuous spectral component — i.e., genuinely extended states — over a finite energy window. The existence of a mobility edge $E_c$ as a sharp point of transition between pure-point and a.c. spectrum, with the AALR critical exponents. The very statement \"the conductivity vanishes continuously at the transition\" remains, mathematically, a conjecture.\n\nThis is the unflattering shape of the rigorous frontier. The 1979 phase diagram of [10] is, in $d=3$, a conjecture confirmed by experiments [7] and numerics, but not by a single theorem about the infinite-volume Schrödinger operator. The mathematical-physics community has been candid about this for forty years; the textbook tradition has not. A reader who learns Anderson localization from the scaling-theory literature alone will leave with the impression that the 3D mobility edge is as solid as the central limit theorem. It is not. It is the central open problem of the field, and the parallel mathematical program is the reason we know exactly how open it is."}, {"id": "frontier-mbl-and-open-problems", "title": "Frontier: Many-Body Localization and the Contested Thermodynamic Limit", "markdown": "## Frontier: Many-Body Localization and the Contested Thermodynamic Limit\n\nThe 1958 theorem [1] concerns one particle in a static random potential. Whether its phenomenology survives the addition of interactions and a thermodynamic density of other particles was unsettled for nearly half a century, and remains so. The modern frontier — many-body localization (MBL) — is the attempt to settle it, and as of this writing it is the most contested chapter of the Anderson program.\n\n### The Basko–Aleiner–Altshuler argument\n\nBasko, Aleiner and Altshuler (2006) [15] addressed a closed, weakly interacting fermion system whose single-particle states are already Anderson-localized with localization length $\\xi$. They asked whether a weak two-body interaction $\\lambda \\sum V_{ijkl} c_i^\\dagger c_j^\\dagger c_k c_l$ produces enough Fock-space connectivity to thermalize the system at finite energy density. Their calculation — a self-consistent Born analysis of the imaginary part of the Fock-space self-energy, extending an earlier Altshuler–Gefen–Kamenev–Levitov treatment of the quantum-dot problem — concluded that below a critical temperature $T_c(\\lambda)$ the inelastic scattering rate vanishes and the dc conductivity is exactly zero. The argument is perturbative in $\\lambda$ and in inverse Fock-space coordination; its conclusion is non-perturbative in the relaxation rate. This is the founding claim of MBL: a many-body mobility edge at finite energy density, separating an ergodic (ETH-obeying) phase from a non-thermal phase that retains memory of its initial state forever.\n\n### The l-bit phenomenology\n\nIf MBL exists as a stable phase, its low-frequency physics is organized by a complete set of quasi-local integrals of motion — \"l-bits\" $\\tau_i^z$ (Serbyn–Papić–Abanin; Huse–Nandkishore–Oganesyan, both 2013/14, *verify*). The effective Hamiltonian is\n\n$$\nH_{\\rm eff} \\;=\\; \\sum_i h_i \\tau_i^z \\;+\\; \\sum_{ij} J_{ij}\\,\\tau_i^z \\tau_j^z \\;+\\; \\sum_{ijk} K_{ijk}\\,\\tau_i^z \\tau_j^z \\tau_k^z \\;+\\; \\cdots,\n$$\n\nwith couplings $J_{ij} \\sim J_0 \\exp(-|i-j|/\\xi)$ and an analogous decay for higher strings. Two consequences follow that distinguish MBL from any single-particle Anderson insulator: (i) entanglement entropy of a quench grows as $S(t) \\propto \\log t$ rather than ballistically (Bardarson–Pollmann–Moore 2012; Žnidarič–Prosen–Prelovšek 2008, *verify*), a direct signature of dephasing without transport via the $J_{ij}$ couplings; (ii) the system possesses memory — initial density modulations persist with non-decaying contrast.\n\nImbrie (2016) [arXiv:1605.03003](https://arxiv.org/abs/1605.03003) proved, for a strongly disordered 1D quantum Ising chain with random transverse and longitudinal fields, that an l-bit construction converges via a KAM-like sequence of quasi-local unitaries, conditional on a level-attraction assumption (LLA) that bounds the probability of small denominators in the diagonalization. This is the only theorem-grade MBL result. It is 1D only — Imbrie's scheme uses the linear ordering of resonances — and the LLA itself is not proven. It is the strongest piece of mathematical support the field has, and it is also a target of the current critique.\n\n### The avalanche and the finite-size drift\n\nThe challenge originates with De Roeck and Huveneers (2017): suppose a putative MBL system contains a rare, locally thermal inclusion — a \"Griffiths bubble\" of low disorder. Coupled to the surrounding l-bits at strength $J_0 e^{-r/\\xi}$, the bubble's many-body level spacing scales as $\\delta \\sim 2^{-r}$. The bubble destabilizes a neighbour when the Fermi golden rule criterion $J_0 e^{-r/\\xi} \\gtrsim \\delta$ is met — but absorbing the neighbour doubles the bubble's Hilbert space and halves $\\delta$, so each successful absorption makes the next easier. The avalanche grows unless $\\xi \u003c \\xi_c = 1/\\ln 2$ (in units of lattice spacing). The argument is non-perturbative: any finite density of inclusions kills MBL for $\\xi \u003e \\xi_c$, regardless of how small the typical resonance probability is.\n\nThe numerical case caught up in 2019–2022. Šuntajs–Bonča–Prosen–Vidmar [arXiv:1905.06345](https://arxiv.org/abs/1905.06345) showed that the spectral-statistics indicator $\\bar{r}$ for the random-field Heisenberg chain — the canonical MBL benchmar
