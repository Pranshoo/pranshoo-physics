"https://pranshoo.github.io/pranshoo-physics/observatory/two-and-a-half-pages-four-theorems-one-broken-promise.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "September 1927: The Note Nobody Claimed September 1927: The Note Nobody Claimed The document is three printed pages, two and a half of them text. It carries the receipt stamp Eingegangen am 5. September 1927 and it opens not with a claim but with a concession. Before the first equation, before the abstract has even finished, Ehrenfest has told you that the problem was already solved: \"In a whole series of recent publications, it has been, in essence, clarified completely that classical mechanics remains valid for macroscopic processes to a high degree of approximation, and in what way that would be true (¹). However, please permit me to prove briefly a special elementary relation that follows exactly from Schrödinger's equation without leaving anything out, because it will perhaps make the connection between wave mechanics and classical mechanics even easier to survey.\" That is the whole of Ehrenfest's stated ambition: not a theorem, a survey aid . Footnote 1 then discharges the debt in a single dense line — ten bibliographic entries by six authors: de Broglie's 1924 thesis plus four of his papers, Brillouin ( J. phys. radium 7 , 353, 1926), Schrödinger ( Naturwiss. 14 , 664, 1926), Debye ( Phys. Zeit. 28 , 170, 1927), Heisenberg ( Z. Phys. 43 , 172, 1927), and Kennard ( Z. Phys. 44 , 326, 1927) . No textbook that names the theorem reproduces that footnote. What is actually in the paper Ehrenfest defines two moments, his equations (2) and (3), differentiates using (1) and (1^{ }), integrates by parts, and obtains — \"immediately (and with nothing left out)\" — Two points of philology. First, the Delphenich translation prints the middle member of (5) as dQ/dt; it must read dP/dt, and whether the misprint originates with Delphenich or with Zeitschrift für Physik I have not checked (verify). Second, and consequentially: Wheeler's otherwise excellent survey states that \"Ehrenfest did not draw explicit attention\" to d\\langle x\\rangle/dt = \\langle p\\rangle/m . The primary text refutes this. It is his equation (4), it precedes (5), and (5) is derived by differentiating it. The claim should not be repeated. Note also what (5) does not say. The force sits inside the integral. Ehrenfest's own gloss puts the crucial phrase in scare quotes — the acceleration of the centroid behaves Newtonianly under the force \"that acts upon the position of the wave packet\" — and prefaces it with the condition that carries the whole result: \"Any time that the width of the (probability) wave packet \\Psi\\Psi^{ } is relatively small (in comparison to macroscopic distances)\" . The abstract is blunter still: \"for a small wave packet that stays small (with m of order 1 g).\" He then supplies the numbers that bound his own claim. Reproducing Heisenberg's free-packet calculation (and crediting him on the page), he gets \\Omega^{2} = \\omega^{2} + \\hbar^{2}t^{2}/m^{2}\\omega^{2}, so the width doubles after where \\omega is the initial width — a length, 10^{-3} cm in his example, not a frequency. For m = 1 g this gives T \\approx 10^{21} s; for m = 1.7\\times10^{-24} g and \\omega = 10^{-8} cm, T \\approx 10^{-13} s . The man who is credited with proving that quantum mechanics goes over to classical mechanics ended his paper by printing the timescale on which it does not. The precursors, ranked by what they actually supplied The exact identity was two years old. Born and Jordan's September 1925 paper derives the matrix equations of motion \\dot q = \\partial H/\\partial p, \\dot p = -\\partial H/\\partial q from the canonical commutator ; take expectation values in any state and Ehrenfest's (4) and (5) fall out with no further work. Ehrenfest knew: his second footnote expands \\Psi in eigenfunctions precisely to exhibit \"its relationship to the matrices q {nm} and p {nm}\" . The one nontrivial case where the result is exact and unconditional belonged to Schrödinger, 1926 — the displaced Gaussian of the harmonic oscillator, translating rigidly along the classical orbit . Jammer assigns the priority to him in as many words . The exactly solvable linear-force packets — free particle, uniform field, magnetic field — belonged to Kennard, in the volume immediately preceding Ehrenfest's, along with the first rigorous \\sigma x\\sigma p \\geq \\hbar/2 and the first squeezed states . The spreading law was Heisenberg's . And the generalization everyone teaches — to arbitrary conservative systems of any number of particles, with the wave-mechanical virial theorem as a bonus — was Ruark's, within the year; his abstract calls it \"Ehrenfest's law of motion,\" an early instance of the attribution setting like concrete . What Ehrenfest contributed was compression: the relation in the exact averaged form \\langle -\\partial V/\\partial x\\rangle, on one page, holdable in one hand. Canonization by syllabus The theorem was not carried into the canon by citation; it was carried by textbooks. Kemble indexes \"Ehrenfest's theorem\" in 1937, p. 49 ; Schiff (p. 28), Merzbacher (p. 41), Powell–Crasemann (p. 98) and eventually Griffiths follow . Meanwhile Dirac's Principles and Landau–Lifshitz pass over it in silence — and here a standing claim needs correcting: Pauli is usually listed as a third omission, but Pauli's Wellenmechanik is a reprint of his 1926 Handbuch article and simply predates the note . That distribution is diagnostic. A result absent from the three most theoretically ambitious monographs of the era, and present in every introductory course, is a pedagogical instrument, not a research tool. The closing datum is the quiet one. Ehrenfest died on 25 September 1933, six years and twenty days after the note was received. Einstein's memorial essay ranks the adiabatic hypothesis and, above everything, the teaching ; Klein's biography likewise treats the 1927 note as a minor late paper . His contemporaries did not think this was what he had done. The ranking inverted only afterwards, and only in the classroom. The Physics, Properly: An Exact Identity and the Hierarchy That Never Closes The Physics, Properly: An Exact Identity and the Hierarchy That Never Closes Ehrenfest's note contains no approximation in its central step. The approximation arrives later, in the reading. It is worth separating the two with some care, because the assumptions that get silently dropped between the identity and its interpretation are precisely where the textbook myth lives. The derivation Ehrenfest actually wrote Take (A1) \\hat H = \\hat p^2/2m + V(\\hat x), with \\hat x and \\hat p carrying no explicit time dependence, and V real. Then for \\Psi(x,t) obeying i\\hbar\\,\\partial t\\Psi = \\hat H\\Psi, using the continuity equation \\partial t\\rho = -\\partial x j with j = (\\hbar/m)\\,\\mathrm{Im}(\\Psi^ \\partial x\\Psi). One integration by parts moves \\partial x off the current: which is Ehrenfest's equation (4) — stated by him explicitly, before and in service of the second-order relation, contrary to a claim occasionally made in the secondary literature . Differentiating once more and integrating by parts a second time (now moving a derivative off \\partial x\\Psi^ \\,\\partial x\\Psi) gives his equation (5): Both steps discarded a surface term. That is not free: (A2) \\Psi(t) must lie in a domain where the boundary terms [x\\,j] and [\\Psi^ \\partial x\\Psi - \\text{c.c.}] vanish. Self-adjointness of \\hat H does not suffice. The correct hypotheses — \\psi(t) in an appropriate form domain — were established only in 2009 by Friesecke and Koppen, who also verified that atomic and molecular Coulomb Hamiltonians satisfy them . The infinite square well is the standard counterexample: V' = 0 in the interior, yet \\langle p\\rangle is manifestly not constant, because the wall contributions are exactly what was thrown away. The same identity, two years earlier Nothing above is specific to x and p. For any observable \\hat A, which is the Heisenberg/Born–Jordan equation of motion with expectation brackets around it, in print since September 1925 . Setting \\hat A = \\hat x gives [\\hat x,\\hat p^2]/2mi\\hbar = \\hat p/m; setting \\hat A = \\hat p gives [\\hat p, V]/i\\hbar = -V'(\\hat x). Ehrenfest's two relations are one line of the Born–Jordan formalism. He knew: his second footnote points at the matrix elements q {nm}, p {nm} . The result that modern courses call the \"generalized Ehrenfest theorem\" is thus more general and less Ehrenfest's — the naming inflation runs backwards down the generality ladder. Where Newton is not \\langle -V'(x)\\rangle is the force averaged over the packet, never the force at the centroid. To compare with Newton one must expand, which requires (A3) V smooth enough near \\langle x\\rangle for a Taylor series with controlled remainder over the packet's support. Then, writing \\delta x = x - \\langle x\\rangle, Newton's law for the centroid holds exactly iff (A4) V''' \\equiv 0 — free, uniform, or harmonic. These are exactly the cases Kennard solved five months earlier and the oscillator Schrödinger had done in 1926 . Outside them, the equation for \\langle x\\rangle recruits \\sigma x^2; the equation for \\sigma x^2 recruits \\langle \\delta x^3\\rangle and \\langle \\delta x \\delta p + \\delta p \\delta x\\rangle; the third moment recruits the fourth. The hierarchy never closes. This is a moment-closure problem in the same structural family as BBGKY (one-particle distribution driven by the two-particle) and Reynolds-stress closure (mean flow driven by \\overline{u'u'}) — arguably the earliest instance in physics, and never labelled as such in Ehrenfest's own text. Figure: The Ehrenfest relations are the first rung of an unclosed moment hierarchy. The correction term ½σ x²V'''(⟨x⟩) is what couples rung 1 to rung 2; closure at rung 1 requires V''' ≡ 0 identically. The three boxes show what \"approximately classical\" then means in each potential class — and how long it lasts. The three assumptions that live in the interpretation Truncating after the first term requires (A5) \\sigma x small on the scale over which V'' varies: \\tfrac{1}{2}\\sigma x^2 V''' \\ll V' . This is Ehrenfest's own stated condition — \"whenever the width of the probability wave packet is relatively small\" . (A6) the packet stays narrow over the interval of interest. Ehrenfest checks this and gives the numbers that bound his own claim: \\sim 10^{21} s for m = 1 g, \\sim 10^{-13} s at proton scale . His estimate is diffusive and algebraic in \\hbar. For \\lambda 0 it is replaced by exponential growth \\sigma x(t)\\sim\\sigma 0 e^{\\lambda t}, so A6 expires after a logarithm — the subject of §3. (A7) a single trajectory is the right classical comparand. This is the assumption nobody states and the one that fails first. The classical limit of a generic quantum state is a Liouville ensemble; a centroid that follows no single orbit is exactly what a spread classical ensemble does too, so the Ehrenfest relations are neither necessary nor sufficient for classicality . Jammer's verdict stands: analogy, not reduction . Strict Conditions \u0026 Failure Modes: A1–A7 Under Load Strict Conditions \u0026 Failure Modes: A1–A7 Under Load The identity of §2 is exact; the theorem people quote is not. What separates them is a stack of hypotheses that are rarely written down. Below, each is pushed until it snaps, with numbers where numbers exist. A2: Domains, not just self-adjointness The derivation of \\frac{d}{dt}\\langle p\\rangle = -\\langle V'\\rangle requires two integrations by parts, and each leaves a boundary term. The standard course tacitly assumes those vanish because \\psi\\to 0 at infinity. That is a statement about the domain of the operators, and it is strictly stronger than the statement that H is self-adjoint. The infinite square well is the cheapest counterexample and the one most often taught wrongly. On [0,L] with Dirichlet conditions, V'\\equiv 0 in the interior, so the naive relation predicts \\frac{d}{dt}\\langle p\\rangle = 0 for every state — false for any state that is not stationary, since the packet reflects. The correct statement carries the wall terms, i.e. the pressure difference on the two walls. The force is entirely boundary, entirely absent from -\\langle V'\\rangle. The failure is not exotic: H here is a perfectly good self-adjoint operator with a complete eigenbasis. What fails is that p^2's domain and p's domain do not nest the way the manipulation assumes — \\psi\\in D(H) does not imply p\\psi\\in D(p). Remarkably, the hypotheses under which the relations do hold were not settled until 2009. Friesecke and Koppen showed that the correct sufficient condition is membership in the form domain — that \\psi(t) lie in the appropriate quadratic-form domain of H rather than merely in D(H) — and, importantly, that this condition is satisfied for atomic and molecular Coulomb Hamiltonians, singularities and all . So the theorem survives where chemistry needs it. That it took eighty-two years to state the hypotheses of a result taught in every second-year course is itself a datum about how the theorem was transmitted: as pedagogy, not as mathematics. Two adjacent traps. Delta-function potentials: V' is a distribution and \\langle V'\\rangle must be interpreted as a boundary term, not an integral against \\psi ^2 at the singular point. And states with heavy tails: a normalized \\psi with \\langle p^2\\rangle=\\infty (e.g. a wavefunction with a kink) has no \\frac{d}{dt}\\langle p\\rangle to speak of. A4/A5: The hierarchy leaks, and it leaks two different ways From §2, the exact expansion is The centroid obeys Newton iff the correction terms are negligible, which requires both \\sigma x small and V''' mild over the packet support. The relevant dimensionless number is not \\hbar but Everything now hinges on how \\sigma x(t) grows, and there are two qualitatively different laws. (i) Diffusive spreading — Ehrenfest's own estimate. For free or nearly-free motion, \\sigma x^{2}(t)=\\sigma 0^{2}+(\\hbar t/2m\\sigma 0)^{2}: the width grows algebraically , linearly in t at late times, and the time to double is \\propto m\\sigma 0^{2}/\\hbar. This is the regime Ehrenfest himself bounded, and he did the arithmetic honestly. His closing numbers give roughly 10^{21} s for a packet of mass m=1 g — longer than the age of the universe by eleven orders of magnitude — against \\sim 10^{-13} s for a proton-scale packet . The contrast is the whole content of his \"approximate validity\": macroscopic bodies are safe, nucleons are not. Note the scaling: algebraic in \\hbar, so pushing \\hbar\\to0 buys you time as a power law. (ii) Exponential spreading — the chaotic case. If the classical flow has a positive Lyapunov exponent \\lambda, the packet stretches as \\sigma x(t)\\sim\\sigma 0 e^{\\lambda t} along the unstable manifold. Then \\epsilon(t) reaches O(1) after with S a characteristic action. This scaling comes out of the systematic \\hbar-expansion of the quantum-minus-classical average for a nonlinear system started in a coherent state, done by Berman and Zaslavsky in 1978 — who did not invoke Ehrenfest at all . The name \"Ehrenfest time\" was attached a decade later by Chirikov, Izrailev and Shepelyansky . The difference between (i) and (ii) is not quantitative. A logarithm annihilates the comfort of 10^{21} s: with \\lambda\\sim1\\ \\mathrm{s^{-1}} and S/\\hbar\\sim10^{20}, \\tau E\\approx 46 s. Hyperion's tumbling — the standard example — gives decades, not eons. Quoting Ehrenfest's gram-scale reassurance while working on a chaotic Hamiltonian is the single commonest abuse of the theorem, and it is off by roughly twenty orders of magnitude in the exponent. A7: Narrow packets are not what classicality means The deepest failure is not that the relations break, but that keeping them buys less than advertised. Ballentine, Yang and Zibin showed that satisfaction of the Ehrenfest relations is neither necessary nor sufficient for the classical regime . Not sufficient : one can construct states for which the relations hold to excellent accuracy while the dynamics remain manifestly non-classical. Not necessary : the classical limit of a generic quantum state is a Liouville ensemble of orbits, not a single orbit, and the centroid of a broad classical ensemble also fails to follow any member trajectory. A classical probability density in a chaotic potential has \\ddot{\\bar{x}}\\neq -V'(\\bar{x}) for exactly the same moment-closure reason. The \"failure\" that τ E marks is therefore, in part, not a quantum failure at all — it is the failure of a centroid to represent a distribution , which happens classically too. The genuinely quantum content lies beyond that: interference between branches, which Liouville flow cannot produce. A real derivation of classical mechanics needs machinery the 1927 note does not contain. Two routes exist. First, coherent-state propagation with controlled error as \\hbar\\to0 — Hepp's 1974 theorem and Hagedorn's semiclassical wave-packet estimates give norm bounds on the difference between the true evolution and the classically-guided Gaussian, valid on times up to \\tau E and no further (verify). Second, environmental decoherence, which suppresses the long-range superpositions closed evolution generates and restores correspondence past \\tau E by injecting phase-space diffusion — the Zurek–Paz analysis, in which the decoherence rate must exceed a threshold set by \\lambda (verify). Both are post-1970 and neither is Ehrenfest's. The honest summary: A1–A7 are not fine print on a working theorem. They are the theorem. What survives unconditionally is an exact identity about two moments; what does not survive is the promise attached to it in the textbooks. Signatures: What Actually Tests the Theorem, and What Merely Rhymes With It Signatures: What Actually Tests the Theorem, and What Merely Rhymes With It The identity of §2 is exact, so \"testing Ehrenfest's theorem\" is a category error if taken literally: you cannot falsify m\\,d^2\\langle x\\rangle/dt^2 = -\\langle V'(x)\\rangle any more than you can falsify the product rule. What experiments actually probe is one of three distinct propositions, and conflating them is the standard failure of the literature: - (T1) The closure claim: \\langle V'\\rangle \\simeq V'(\\langle x\\rangle), i.e. the moment hierarchy truncates at first order. - (T2) The narrowness claim: the packet stays localized long enough for (T1) to remain true — the timescale question. - (T3) The classicality claim: (T1) + (T2) \\Rightarrow classical behavior. This is the one Ballentine, Yang and Zibin demolished , and it is the one most experiments are silently reported as confirming. A signature is direct only if it discriminates among these. Most published \"confirmations of Ehrenfest's theorem\" measure a first moment, find it moves roughly along a classical curve, and stop — which tests nothing, since a broad classical Liouville ensemble does the same thing badly in exactly the same way. Direct signatures Non-dispersing coherent-state motion. The harmonic trap is the one nontrivial potential where V''' \\equiv 0 and the hierarchy closes exactly . A displaced Gaussian rigidly translates: \\langle x\\rangle(t) = x 0\\cos\\omega t, \\sigma x(t) = \\sigma x(0), for all t, for arbitrary \\sigma x — no narrow-packet assumption required . This is a genuine smoking gun because it has a sharp negative control: any observed breathing at 2\\omega, or any secular growth of \\sigma x, signals either anharmonicity (V''' \\neq 0, feeding the second moment) or a squeezed initial condition. Kennard's linear-force solutions supply the free-fall and uniform-field analogues, where the centroid tracks the classical orbit exactly while \\sigma x spreads — the cleanest demonstration that centroid-following and packet-narrowness are independent properties. Ion traps and optical dipole traps realize both regimes with \\sigma x measurable by time-of-flight or by sideband thermometry. Direct measurement of the closure defect. The observable that actually tests (T1) is in a deliberately anharmonic potential — an anharmonic ion trap, a tilted optical lattice, or a transmon's cosine potential where V''' \\neq 0 is engineered rather than parasitic. The discriminating experiment measures \\sigma x^2 and \\langle x\\rangle independently and checks the predicted \\Delta against the observed centroid acceleration. Agreement at leading order with a measured, nonzero \\Delta is a positive test; agreement of the centroid with the classical orbit while \\Delta is large is a coincidence, not a confirmation. The \\ln(1/\\hbar) scaling of the breakdown time. This is the sharpest available test and the only one that distinguishes Ehrenfest's own diffusive spreading time from the chaotic Ehrenfest time. In a kicked rotor or kicked top realized with cold atoms in a pulsed standing wave, the effective Planck constant \\hbar {\\rm eff} = 8\\omega r T is a dial : change the pulse period T and you change \\hbar without changing the classical dynamics. The prediction from the Berman–Zaslavsky expansion , named by Chirikov, Izrailev and Shepelyansky , is with \\lambda the classical Lyapunov exponent measured independently from the classical map. A logarithm is a weak function; extracting it demands a decade or more in \\hbar {\\rm eff} and a fixed, unambiguous breakdown criterion (e.g. the time at which \\langle x\\rangle {\\rm qm} - x {\\rm cl} exceeds a fixed fraction of the phase-space scale). The falsifiable content is the slope : d\\tau E/d\\ln(1/\\hbar {\\rm eff}) = \\lambda^{-1}, with the classical \\lambda measured, not fitted. A power-law or \\hbar-independent breakdown falsifies the chaotic scaling and pushes you back toward Ehrenfest's algebraic T \\propto m\\omega^2/\\hbar . Interference-visibility survival as a control. Every claim that \"the system went classical at \\tau E\" must exclude decoherence as the cause. The control is an independent coherence measurement — Ramsey fringe contrast, or the visibility of a cat-state interference pattern prepared in the same apparatus. If visibility decays on \\tau D \\ll \\tau E, the observed classicality is environmental and the theorem is a bystander. Only when \\tau D \\gg \\tau E does the breakdown belong to the closed-system moment hierarchy. Figure: Decision structure for centroid-following observations. A first-moment measurement alone sits at the top node and is compatible with all three confounders; each branch names the measurement that resolves it. Indirect signatures and their confounders \"Trajectory-like\" centroid motion. Confounder: a classical Liouville ensemble of finite width also fails to follow any single orbit, and fails in the same qualitative way — the ensemble mean of a nonlinear flow is not the flow of the mean . Observing \\langle x\\rangle(t) deviate from x {\\rm cl}(t) therefore demonstrates nothing quantum. Discriminator: measure the full phase-space quasiprobability by Wigner tomography and test for negativity and for sub-Planck structure. A classical ensemble is a non-negative \\rho {\\rm cl}(x,p) evolving under Liouville; anything with W \u003c 0 is not. Comparing \\langle x\\rangle {\\rm qm}(t) against the Liouville-propagated classical ensemble with matched initial moments — not against a single classical orbit — is the correct null hypothesis, and it is almost never the one used. Apparent classicality from decoherence. Confounder: environmental monitoring suppresses the very superpositions the closed evolution builds, so the density matrix becomes approximately positive-Wigner and the system looks classical regardless of what the moment hierarchy is doing. This mechanism is stronger than Ehrenfest's and operates on a completely different timescale. Discriminator: vary the coupling to the environment (background gas pressure, photon scattering rate, engineered dephasing) and check whether the breakdown time moves. If it tracks the coupling, it is decoherence; a genuine Ehrenfest-time breakdown is coupling-independent and scales as \\lambda^{-1}\\ln(1/\\hbar {\\rm eff}) . Agreement of mean-field simulation with experiment. Confounder: a converged \"Ehrenfest dynamics\" (TDDFT/TDHF/AMD) calculation reproducing an experimental yield tests the ansatz — its functional, basis, and initial-condition sampling — not the 1927 identity, which those codes never actually invoke . Discriminator: target an observable where the mean-field ansatz is known to be wrong: population branching at a conical intersection, long-time detailed balance (Boltzmann ratios), or residual electronic coherence. If the simulation reproduces experiment there , something other than mean field is carrying the result — usually a decoherence correction or surface hopping bolted on top. Agreement in regimes where mean field cannot fail is not evidence. The asymmetry worth stating plainly: the direct signatures are all negative-control-rich — they specify what should happen when the claim is false. The indirect ones are all consistent with the theorem being irrelevant to the observation entirely. Use \u0026 Abuse: Four Ehrenfest Theorems, One Name Use \u0026 Abuse: Four Ehrenfest Theorems, One Name Four unrelated results circulate under Ehrenfest's name, and within the one that is actually his, at least three distinct claims get quoted interchangeably. What follows is a field guide to the collisions, ordered by how much damage each does. (i) \"\\langle x\\rangle obeys Newton's laws\" The single most repeated sentence about the theorem is false as written. What Ehrenfest derived is his eq. (5), the force averaged over the packet . Newton's law for the centroid requires \\langle V'(x)\\rangle = V'(\\langle x\\rangle), and expanding about the mean, the equality holds for all states iff V''' \\equiv 0 — free, uniform, or harmonic. Those are exactly the cases Kennard and Schrödinger had already solved exactly, which is a useful diagnostic in itself: the entire class of potentials for which the popular statement is true was in print before the note was written. Note also the direction of the error. The failure is not that the theorem is approximate; it is exact . The failure is that the moment hierarchy does not close, so a statement about \\langle x\\rangle alone is not a closed dynamical law. This is a textbook artifact, not Ehrenfest's — he wrote the averaged form and stated the narrowness condition in his own abstract. (ii) Quoting the macroscopic spreading time on a chaotic system Ehrenfest's closing numbers are the most-borrowed and least-transferable part of the note: 10^{21} s for a gram-scale packet, 10^{-13} s for a proton-scale one . Those come from diffusive free-particle spreading, algebraic in \\hbar. They say nothing whatever about a system with positive Lyapunov exponent \\lambda, where \\sigma x(t)\\sim\\sigma 0 e^{\\lambda t} and the leading correction \\tfrac12\\sigma x^2 V''' reaches O(1) after the calculation being Berman and Zaslavsky's and the name Chirikov–Izrailev–Shepelyansky's . The logarithm is brutal: \\ln(S/\\hbar) is a number like 30–70 for anything you can build, so \\tau E is a few tens of Lyapunov times regardless of mass . Zurek and Paz's Hyperion estimate — chaotic tumbling, upper bound of order 20 years before quantum and classical predictions diverge grossly — is the canonical illustration that \"macroscopic\" buys you nothing here (Scholarpedia, Ehrenfest time and chaos ). A lab-scale chaotic system with \\lambda \\sim 1\\ \\mathrm{s^{-1}} has \\tau E of order a minute. Any manuscript that cites Ehrenfest's 10^{21} s to reassure a referee about a nonlinear system has confused two timescales that differ in their functional dependence on \\hbar, not merely in their prefactor. (iii) \"Ehrenfest dynamics\" in TDDFT, TDHF, and nonadiabatic molecular dynamics A category error with its own literature. Ehrenfest's theorem is an exact identity inside one quantum state. \"Ehrenfest dynamics\" is a mean-field ansatz : nuclei move classically on the single averaged surface \\sum k c k ^2 \\nabla E k while the electronic amplitudes are propagated along that one trajectory. Its actual parentage is Mott's classical-path treatment of excitation by heavy-particle collisions (Proc. Camb. Phil. Soc. 27, 553 (1931)), and, for the propagation scheme itself, McLachlan's time-dependent variational principle, which minimizes the residual and yields the time-dependent Hartree equations . The name was welded on in molecular scattering by Billing in 1983 . The tell that it is a different object is that it has pathologies the theorem does not and cannot have. A single averaged trajectory cannot branch, so it is qualitatively wrong downstream of a conical intersection. It violates detailed balance and therefore relaxes to incorrect electronic populations at long times, with the mean energy failing to converge with system size (J. Chem. Phys. 150, 204124 (2019)). It retains spurious electronic coherence after the nuclear wavepackets should have separated. None of these are properties of m\\,d^2\\langle x\\rangle/dt^2 = -\\langle V'\\rangle, which is an identity and cannot be wrong. Surface hopping, decoherence corrections, and coupled-trajectory schemes exist to repair the ansatz, not the theorem. Citing Ehrenfest 1927 as the justification for mean-field nuclear trajectories is a derivation-shaped citation with no derivation inside it. (iv) Name collisions Ehrenfest's adiabatic hypothesis — invariance of \\oint p\\,dq under slow parameter change, and by his memorialists' ranking his major work — is thirteen years earlier and mathematically unrelated. Worse, the quantum adiabatic theorem (state remains in the instantaneous eigenstate under slow driving) is Born and Fock 1928, not Ehrenfest, yet is routinely filed under his name by association. Add the Ehrenfest classification of phase transitions (1933), the Ehrenfest urn model, and the Ehrenfest paradox of the rotating disc. \"Ehrenfest's theorem\" is not a unique designator; it needs a year attached. (v) The generality ladder, climbed backwards The identity taught as the \"generalized Ehrenfest theorem,\" is the Heisenberg/Born–Jordan equation of motion with expectation brackets around it, in print two years earlier and valid for every observable . Ehrenfest wrote two integrals for H = p^2/2m + V(x) in one dimension. The naming inflation runs the wrong way: the more general the statement, the less of it is his. Tells of a hollow claim - The force appears as V'(\\langle x\\rangle) rather than \\langle V'(x)\\rangle, with no statement of what was dropped. - Ehrenfest's macroscopic spreading time is quoted in a paper whose Hamiltonian is nonlinear, with no \\lambda^{-1}\\ln(S/\\hbar) anywhere. - \"By Ehrenfest's theorem, we propagate nuclei on the mean-field surface\" — the theorem licenses no ansatz. - The theorem is invoked as establishing the classical limit rather than as a consistency check; Jammer's verdict (analogy, not reduction) and Ballentine–Yang–Zibin's demonstration that it is neither necessary nor sufficient are both absent. - No mention of domain conditions, despite a hard-wall or singular potential in play — the boundary terms are real and were only pinned down in 2009 . - The citation is to a textbook page, never to Z. Phys. 45 , 455. Anyone who has read the two and a half pages knows Ehrenfest disclaimed the result in his first footnote. Status \u0026 the Believer's Checklist Status \u0026 the Believer's Checklist The verdict separates cleanly along the seam this dossier has been prying at: the identity is canonical; the concept attached to it has mutated. As mathematics, Ehrenfest's two equations are not merely correct but structurally load-bearing. They are the n=1 rung of the moment hierarchy of the Wigner–Moyal equation, the exactness condition that makes coherent states rigid in quadratic potentials, and — through the time-dependent variational principle — the reason mean-field quantum–classical propagation is even self-consistent at the level of first moments . Every TDHF, TDDFT, and Ehrenfest-MD code inherits momentum conservation from this identity, not from an approximation. Even the domain question, open for eighty-two years, has been closed in the direction the theorem needed: Friesecke and Koppen give hypotheses general enough to cover atomic and molecular Coulomb Hamiltonians, so the relations hold where chemistry actually needs them, and fail only in the boundary-pathological cases (hard walls, insufficient decay, singular form domains) that were always the honest exceptions . Nothing about the identity is in dispute, and nothing is likely to be. As a concept — \"Ehrenfest's theorem is the classical limit\" — the status is different, and the record is unusually one-sided. Jammer entered the historiographic refutation in 1966: the relations establish an analogy, not a reduction, because there is no superposition principle on the classical side for anything to reduce to , and the one genuinely classical-looking case (the oscillator) was Schrödinger's from 1926 . Ballentine, Yang and Zibin entered the physical refutation in 1994: satisfaction of the Ehrenfest relations is neither necessary nor sufficient for classicality, and the correct classical comparand for a generic quantum state is a Liouville ensemble, whose centroid also fails to follow any single orbit . Sixty and thirty-two years on respectively, neither refutation has propagated into the standard undergraduate treatment. This is the sharpest available demonstration that the theorem's canonical status was conferred by pedagogy rather than by research use — the same mechanism that named it in the first place . The live frontier is not whether correspondence breaks at \\tau E \\sim \\lambda^{-1}\\ln(S/\\hbar) — in closed chaotic systems it does, on timescales of seconds for ordinary macroscopic bodies — but whether an environment restores it, and at what price. Hernández, Ranard and Riedel prove, for Markovian dynamics with H=p^2/2m+V(x) and Hermitian linear Lindblad operators, that quantum and classical evolutions stay close for all observables and for times exponentially longer than \\tau E, provided the environment-induced diffusion satisfies with s H and D H the characteristic action and diffusion scales set by the Hamiltonian (arXiv:2306.13717, v2 May 2025). The exponent is the content: the required noise vanishes as \\hbar\\to 0, so classicality is recovered without spoiling reversibility in the limit — decoherence is doing the work, but asymptotically for free. The companion result extends this to general Lindbladians (arXiv:2307.05326). Treat both as the current state of the art rather than as settled folklore; the conjectural part (non-Markovian environments, non-Hermitian Lindblad operators, many-body V) is still open. The Believer's Checklist If a paper, talk, or referee report invokes Ehrenfest, these seven items are the minimum diligence. Failing any one of them is not pedantry — each corresponds to a documented error mode above. 1. Name the assumption you are actually using. State which of A1–A7 the argument leans on. \"By Ehrenfest's theorem\" is not a citation; \\langle -V'\\rangle \\approx -V'(\\langle x\\rangle) is a claim requiring justification, and the two are different equations. 2. Exhibit the neglected moment terms with a number. Write -\\langle V'\\rangle = -V'(\\langle x\\rangle) - \\tfrac12\\sigma x^2 V'''(\\langle x\\rangle) - \\tfrac16\\langle\\delta x^3\\rangle V''''(\\langle x\\rangle)-\\dots and estimate the first retained term against the leading one for your \\sigma x and your V. A ratio, not an adjective. If \\sigma x^2 V'''/2V' \\sim 10^{-2}, say so; if you cannot compute it, you do not know whether the hierarchy closes. 3. Declare which Ehrenfest time you mean, and its \\hbar-scaling. Ehrenfest's own diffusive spreading time is algebraic in \\hbar and macroscopically enormous (10^{21} s at m=1 g) . The chaotic \\tau E \\sim \\lambda^{-1}\\ln(S/\\hbar) is logarithmic and macroscopically short . Quoting the first while working in the regime of the second is the commonest abuse in the literature. 4. Distinguish theorem from ansatz, and cite the right lineage. If nuclei are moving on \\sum k c k ^2 \\nabla E k, that is mean-field propagation from a variational principle — McLachlan , named by Billing — not a consequence of the 1927 identity. Its pathologies (no branching at conical intersections, violated detailed balance, spurious residual coherences) are properties of the ansatz, and the ongoing repair literature is about the ansatz too. 5. Specify the classical comparand. Single trajectory or Liouville ensemble? Divergence of \\langle x\\rangle(t) from one orbit is expected behaviour for an ensemble and is evidence of nothing . 6. Check the boundary and domain conditions. Two integrations by parts must have vanishing boundary terms. Hard walls, non-decaying states, and singular potentials are not covered by self-adjointness of H alone; cite the actual hypotheses . 7. If decoherence is carrying the argument, say decoherence. Correspondence past \\tau E is a statement about environmental diffusion exceeding a threshold, with its own conditions and its own authors (Hernández–Ranard–Riedel). Attributing it to a two-and-a-half-page note from 1927 whose author explicitly disclaimed priority in his own footnote is the last inversion this dossier can flag . The AETHER Verdict The AETHER Verdict (a) What I would defend with my reputation Three things. First: the identity is exact and it is not Ehrenfest's alone. For H = p^2/2m + V(x) with \\psi(t) in the appropriate form domain, holds with no \\hbar\\to 0, no wave-packet assumption, no semiclassical anything. It is a corollary of the Born–Jordan equations of motion of September 1925 , and Ehrenfest said as much in his own abstract — \"a brief elementary calculation\" — and in a footnote naming seven prior works . Anyone who presents the 1927 note as the discovery of the result has not read the 1927 note. Second: the theorem does not deliver the classical limit, and Ehrenfest never said it did. The right-hand side is -\\langle V'\\rangle, not -V'(\\langle x\\rangle); the difference -\\tfrac12\\sigma x^2 V'''(\\langle x\\rangle) - \\dots vanishes identically only for V''' \\equiv 0. What you have otherwise is an unclosed moment hierarchy — the first cumulant driven by the second, the second by the third — structurally the same closure pathology as BBGKY. Jammer's 1966 reading, that this establishes an analogy and not a reduction (classical mechanics has no superposition principle to reduce to ), is the correct one and remains the single most reliably omitted paragraph in graduate instruction . Third: quoting Ehrenfest's 10^{21}\\,\\mathrm{s} at a chaotic system is malpractice. His estimate is a diffusive, algebraic-in-\\hbar spreading time for a regular packet . The chaotic Ehrenfest time is \\tau E \\sim \\lambda^{-1}\\ln(S/\\hbar) — logarithmic, hence brutally insensitive to how macroscopic your system is. These are not the same quantity with different numbers in it; they are different functional dependences wearing one name. (b) What is shakier than the literature admits The domain conditions . Every textbook derivation performs two integrations by parts and discards the boundary terms without comment. Self-adjointness of H does not license this — the required condition is membership in a suitable form domain, and it was not stated rigorously until 2009 . The infinite square well is not a pathological curiosity; it is the case everyone teaches first, and there the naive relation acquires wall contributions. The decoherence rescue . I accept environment-induced suppression of long-range superpositions as the physically operative mechanism, but the literature routinely elides two claims: that decoherence restores classical trajectories , and that it restores classical ensembles . Only the second is established. The pointer basis is derived from the interaction Hamiltonian in model systems, not in general, and the residual step from a diagonalized density matrix to definite outcomes is imported, not proven (verify). The \\hbar\\to0 theorems (Hepp, Hagedorn) (verify) are genuine, but their error bounds are stated for finite times and typically degrade as e^{\\lambda t} — precisely the regime where you wanted them. And a naming complaint that is really a physics complaint: \" Ehrenfest dynamics \" in TDDFT/TDHF is a mean-field ansatz descended from Mott's classical-path method (verify) and McLachlan's variational principle , christened by Billing in 1983 . It cannot branch at a conical intersection, violates detailed balance, and retains unphysical coherences. Citing the 1927 note in its methods section is a category error dressed as a derivation. (c) Three open questions, ranked 1. Under what environmental coupling strength is correspondence restored beyond \\tau E, sharply? The claim that diffusion above a threshold defeats logarithmic breakdown deserves a theorem with constants, not model demonstrations (verify) — it is the hinge on which macroscopic realism hangs. 2. What is the correct closure of the moment hierarchy for chaotic V? Truncating at second order is the physics equivalent of a Reynolds-stress guess; nobody has characterized the truncation error's growth rate against \\lambda. 3. Can the 2009 form-domain conditions be extended to unbounded and singular-boundary systems — walls, hard cores, confining traps — so the standard teaching example stops being the standard counterexample? Reading path: 1. Ehrenfest 1927 — two and a half pages; read the abstract's self-limitation and the footnote before anything written about it. 2. Born \u0026 Jordan 1925 — where the identity actually first appears, in full generality. 3. Ruark 1928 — the generalization to arbitrary conservative systems plus the quantum virial theorem, one year later and largely unread. 4. Jammer 1966 — the historiographic correction: analogy, not reduction. 5. Friesecke \u0026 Koppen 2009 — the hypotheses everyone integrates by parts past."}</script>

<script type="application/json" id="aether-data">{"slug": "two-and-a-half-pages-four-theorems-one-broken-promise", "topic": "Ehrenfest theorem classical limit", "kind": "seminar", "kind_tag": "SEMINAR", "kind_long": "The Seminar — a foundational phenomenon, taught properly", "title": "Two and a Half Pages, Four Theorems, One Broken Promise", "subtitle": "Ehrenfest 1927 as exact identity, textbook myth, and the logarithm that ends the classical limit.", "domain": "quantum mechanics / foundations, semiclassical dynamics", "era": "1927 (Ehrenfest, Z. Phys. 45, 455); dominant in the 1930s–60s textbook consolidation of the classical limit", "why_big": "Ehrenfest showed d⟨x⟩/dt = ⟨p⟩/m and d⟨p⟩/dt = −⟨∂V/∂x⟩ — exact operator identities that appeared, in the immediate aftermath of the 1925–27 formalism wars, to deliver the correspondence principle as a theorem rather than a postulate, and it was read that way by Bohr's circle as evidence that the new mechanics contained Newton. It became the standard bridge between the Schrödinger equation and Hamiltonian mechanics, and remains the structural backbone of mean-field and time-dependent variational dynamics (TDHF, Car–Parrinello-type 'Ehrenfest molecular dynamics', semiclassical laser–matter response). It is also the cleanest early instance of a hierarchy-closure problem in physics: the moment equations do not close unless the potential is at most quadratic.", "abuse": "The theorem is routinely quoted as 'quantum expectation values obey Newton's laws' — but ⟨∂V/∂x⟩ ≠ ∂V/∂x|⟨x⟩ except for free, linear, or harmonic potentials, and the correction terms (½⟨δx²⟩V''' + …) grow exponentially for classically chaotic V, so the Ehrenfest time scales only as ln(1/ħ) and the 'classical limit' claim silently fails at precisely the systems people invoke it for. Compounding this, 'Ehrenfest dynamics' in chemistry/AMD denotes a mean-field trajectory ansatz that does not conserve detailed balance and cannot branch — a different object from Ehrenfest's exact identity, yet the two are cited interchangeably, and the theorem is further conflated with Ehrenfest's unrelated adiabatic-invariant work and with his thermodynamic phase-transition classification.", "date": "August 28, 2026", "ts": 1787949274.333419, "engine": "Claude Code CLI · default model", "aliases": ["Ehrenfest relations", "Ehrenfest equations of motion", "generalized Ehrenfest theorem (= Heisenberg equation of motion for an arbitrary observable)", "Ehrenfest's law of motion (Ruark, 1928)", "quantum-mechanical Newton's second law", "mean-value theorem of quantum dynamics", "Ehrenfest correspondence", "(distinct object, same name) Ehrenfest dynamics / Ehrenfest molecular dynamics / mean-field TDSCF", "(derived, distinct) Ehrenfest time τ_E"], "origin_story": "Ehrenfest's note was not a discovery, it was a piece of housekeeping — and he said so in the first paragraph. By mid-1927 the question 'where is Newton inside the new mechanics?' had already been attacked from four directions: de Broglie's group-velocity/particle-as-wave-packet picture from the 1924 thesis [3], Brillouin's and Debye's short-wavelength correspondence arguments, Schrödinger's July 1926 Naturwissenschaften note showing that a displaced Gaussian in a harmonic oscillator oscillates rigidly on the classical orbit [5], Heisenberg's March 1927 Umdeutung/uncertainty paper with its free-particle Gaussian spreading [6], and Kennard's April 1927 Z. Phys. paper, which solved the free particle, the uniform field and the magnetic-field cases exactly and gave the first rigorous σ_x σ_p ≥ ħ/2 [7]. Ehrenfest, writing from Leiden and received 5 September 1927 — eleven days before Bohr's Como lecture and a month before the fifth Solvay congress — opened by conceding that this whole series of papers had 'in essence clarified completely' the macroscopic validity of classical mechanics, and asked only 'permit me to prove briefly a special elementary relation that follows exactly from Schrödinger's equation without leaving anything out' [1][2]. Two and a half pages: define Q(t) = ∫dx x ΨΨ*, P(t) = iħ∫dx Ψ ∂Ψ*/∂x, differentiate using the Schrödinger equation and its conjugate, integrate by parts twice, and out drop dQ/dt = P/m and m d²Q/dt² = ∫dx ΨΨ*(−∂V/∂x). The exact operator content had in fact been available since September 1925, when Born and Jordan derived the matrix equations of motion Ȧ = (1/iħ)[A,H] in 'Zur Quantenmechanik' [4]; sandwiching those between ⟨ψ| and |ψ⟩ for A = x and A = p reproduces Ehrenfest verbatim, and Ehrenfest's own second footnote acknowledges the link to the matrices q_nm, p_nm. What Ehrenfest supplied was not the identity but the *reading* of it — the framing that a narrow packet's centroid accelerates 'in the sense of Newton's equations of motion' — and he immediately bounded that reading with numbers: doubling the packet width takes T = √3 mω²/ħ ≈ 10²¹ s for m = 1 g and ω = 10⁻³ cm, but 10⁻¹³ s for a proton with ω = 10⁻⁸ cm [1][2]. The abstract itself restricts the claim to 'a small wave packet that stays small (with m of order 1 g).' The theorem entered the canon stripped of exactly that restriction.", "credit_audit": "The record is unusually clean on the primary document and unusually dirty on its reception. Ehrenfest made no priority claim whatever: his abstract calls the relation something derivable 'by a brief elementary calculation,' his opening paragraph states that a series of prior publications had 'in essence clarified completely' that classical mechanics survives for macroscopic processes, and his footnote names seven works by six authors [1][2]. The exact identity had been in print since Born and Jordan's matrix equations of motion two years earlier [4]; the physically nontrivial closed case (harmonic oscillator) belonged to Schrödinger [5]; the exactly-solvable linear-force packets belonged to Kennard [7]; the spreading calculation Ehrenfest reproduces he attributes to Heisenberg on the page [6]; and the generalization to arbitrary conservative systems, plus the quantum virial theorem, came from Ruark the following year [8]. What Ehrenfest actually contributed was rhetorical compression — a two-page statement in the exact form ⟨−∂V/∂x⟩ that a physicist could hold in one hand — and, crucially, an explicit self-limitation: the abstract restricts to 'a small wave packet that stays small (with m of order 1 g),' and the closing numbers give 10²¹ s for a gram-scale packet against 10⁻¹³ s for a proton-scale one [1][2]. The canonization ran through textbooks rather than through citations: Kemble indexes 'Ehrenfest's theorem' by 1937 [12], Schiff, Mertzbacher, Powell–Crassman and eventually Griffiths follow, while Dirac's Principles, Landau–Lifshitz and Pauli's Handbuch article omit the result entirely [14] — a distribution that tells you the theorem was carried by pedagogy, not by research need. Two secondary details deserve correction. First, it is sometimes said (Wheeler [14], §1) that Ehrenfest did not draw explicit attention to d⟨x⟩/dt = ⟨p⟩/m; the primary text refutes this — it is his equation (4), stated before the second-order relation and used to derive it [2]. Second, Ehrenfest is periodically credited with having 'proved the correspondence principle,' which he neither claimed nor did; Jammer's 1966 verdict — that the theorem establishes an analogy and not a conceptual reduction, since classical dynamics has no superposition principle to reduce to — remains the accurate summary and is the historiographic statement most reliably omitted from courses [13]. There is also a poignant negative datum: Ehrenfest died on 25 September 1933, six years after the note; neither Einstein's memorial essay [10] nor Klein's biography [11] treats the theorem as a headline achievement. His memorialists ranked it below the adiabatic hypothesis and below his teaching. The physics community's ranking inverted afterwards.", "timeline": [{"year": 1917, "event": "Ehrenfest publishes the abridged English statement of the adiabatic hypothesis — the work that made his name and that would later be conflated with the 1927 note under the single label 'Ehrenfest's theorem'", "who": "Paul Ehrenfest", "work": "\"Adiabatic invariants and the theory of quanta\", Phil. Mag. Ser. 6, 33 (198), 500–513", "kind": "theory", "ref": 19}, {"year": 1924, "event": "Particle identified with a wave-packet whose group velocity is the classical velocity — the first systematic attempt to locate Newtonian motion inside wave mechanics; Ehrenfest's 1927 footnote lists this thesis first among his precursors", "who": "Louis de Broglie", "work": "\"Recherches sur la théorie des quanta\", doctoral thesis, Faculté des Sciences de Paris", "kind": "theory", "ref": 20}, {"year": 1925, "event": "The exact operator identity is established two years early: Born and Jordan derive the matrix equations of motion q̇ = ∂H/∂p, ṗ = −∂H/∂q, i.e. Ȧ = (1/iħ)[A,H], from the canonical commutator. Taking expectation values in any state gives Ehrenfest's relations with no further work", "who": "Max Born, Pascual Jordan", "work": "\"Zur Quantenmechanik\", Z. Phys. 34, 858–888 (received 27 Sept 1925)", "kind": "formalization", "ref": 4}, {"year": 1926, "event": "Displaced Gaussian ground state of the harmonic oscillator shown to translate rigidly along the classical orbit without dispersing — the coherent state, and the one nontrivial potential for which the moment hierarchy actually closes. Jammer credits this, not Ehrenfest, with the first demonstration that wave mechanics reproduces classical motion", "who": "Erwin Schrödinger", "work": "\"Der stetige Übergang von der Mikro- zur Makromechanik\", Naturwissenschaften 14, 664–666", "kind": "theory", "ref": 5}, {"year": 1927, "event": "March: free-particle Gaussian packet dynamics and its spreading law derived as part of the uncertainty paper; Ehrenfest reproduces this calculation in his own §Remarks and explicitly credits Heisenberg for it", "who": "Werner Heisenberg", "work": "\"Über den anschaulichen Inhalt der quantentheoretischen Kinematik und Mechanik\", Z. Phys. 43, 172–198", "kind": "theory", "ref": 8}, {"year": 1927, "event": "April: exact wave-packet solutions for the free particle, the uniform force field and a magnetic field — the linear-potential cases in which the packet centroid follows the classical trajectory exactly. Contains the first rigorous σ_x σ_p ≥ ħ/2 and the first squeezed states. Published five months before Ehrenfest and cited by him", "who": "Earle Hesse Kennard", "work": "\"Zur Quantenmechanik einfacher Bewegungstypen\", Z. Phys. 44, 326–352", "kind": "theory", "ref": 7}, {"year": 1927, "event": "5 September: Ehrenfest's note received. Two and a half pages; derives dQ/dt = P/m (his eq. 4) and m d²Q/dt² = ∫dx ΨΨ*(−∂V/∂x) (his eq. 5). Note the exact form: the force is averaged over the packet, ⟨−V′⟩, never evaluated at the centroid", "who": "Paul Ehrenfest", "work": "\"Bemerkung über die angenäherte Gültigkeit der klassischen Mechanik innerhalb der Quantenmechanik\", Z. Phys. 45, 455–457", "kind": "theory", "ref": 1}, {"year": 1927, "event": "In the same note Ehrenfest disclaims priority in footnote 1 (de Broglie 1924/1925/1926, Brillouin 1926, Schrödinger 1926, Debye 1927, Heisenberg 1927, Kennard 1927), states the narrow-packet condition explicitly ('whenever the width of the probability wave packet is relatively small'), and gives the spreading times that bound his own claim: 10²¹ s for m = 1 g, 10⁻¹³ s for a proton-scale packet", "who": "Paul Ehrenfest (trans. D. H. Delphenich)", "work": "English translation of Z. Phys. 45, 455–457, with the original footnote apparatus intact", "kind": "observation", "ref": 2}, {"year": 1928, "event": "Ehrenfest's relation generalized from one degree of freedom to arbitrary conservative systems, and the quantum virial theorem derived alongside it, within a year of the original. Ruark calls it 'Ehrenfest's law of motion' — an early instance of the attribution hardening — and the extension itself is now essentially never cited", "who": "Arthur Edward Ruark", "work": "\"The Zeeman Effect and Stark Effect of Hydrogen in Wave Mechanics; The Force Equation and the Virial Theorem in Wave Mechanics\", Phys. Rev. 31, 533–538", "kind": "formalization", "ref": 9}, {"year": 1937, "event": "Earliest located textbook that indexes the result under the name 'Ehrenfest's theorem' (p. 49). Naming by textbook, not by the community's citation practice: Dirac's Principles, Landau–Lifshitz and Pauli's Handbuch article all pass over the result in silence", "who": "Edwin C. Kemble", "work": "The Fundamental Principles of Quantum Mechanics with Elementary Applications (McGraw-Hill)", "kind": "naming", "ref": 10}, {"year": 1964, "event": "The time-dependent variational principle that actually generates mean-field quantum–classical trajectories (and the time-dependent Hartree equations) is formulated — improving on Frenkel's by always minimizing the residual. This, not Ehrenfest's 1927 identity, is the mathematical parent of what chemistry now calls 'Ehrenfest dynamics'", "who": "Andrew D. McLachlan", "work": "\"A variational solution of the time-dependent Schrödinger equation\", Mol. Phys. 8(1), 39–44", "kind": "formalization", "ref": 17}, {"year": 1966, "event": "Historiographic verdict entered: Ehrenfest's result and Ruark's generalizations 'do not conceptually reduce quantum dynamics to Newtonian physics. They merely establish an analogy' — and the harmonic-oscillator case is assigned to Schrödinger. Widely ignored by the textbooks that followed", "who": "Max Jammer", "work": "The Conceptual Development of Quantum Mechanics (McGraw-Hill), p. 363", "kind": "revival", "ref": 6}, {"year": 1978, "event": "First systematic ħ-expansion of the difference between quantum and classical averages for a nonlinear (chaotic) system started in a coherent state — the calculation from which the logarithmic breakdown time follows. Berman and Zaslavsky did not themselves invoke Ehrenfest", "who": "Gennady P. Berman, George M. Zaslavsky", "work": "\"Condition of stochasticity in quantum nonlinear systems\", Physica A 91, 450", "kind": "theory", "ref": 14}, {"year": 1983, "event": "The mean-field classical-path scattering method is publicly attached to Ehrenfest's name in molecular collision theory — the moment at which a trajectory ansatz that Ehrenfest never wrote acquires his authority", "who": "Gert Due Billing", "work": "\"On the use of Ehrenfest's theorem in molecular scattering\", Chem. Phys. Lett. 100(6), 535–539", "kind": "naming", "ref": 18}, {"year": 1988, "event": "The term 'Ehrenfest time' is coined for τ_E ~ λ⁻¹ ln(S/ħ), the logarithmically short interval over which a chaotic system's packet stays narrow enough for the centroid to track a classical orbit. The scaling is qualitatively different from Ehrenfest's own diffusive spreading time T ∝ mω²/ħ", "who": "Boris V. Chirikov, Felix M. Izrailev, Dima L. Shepelyansky", "work": "\"Quantum chaos: localization vs. ergodicity\", Physica D 33, 77–88 (following their 1981 Sov. Sci. Rev. C 2, 209)", "kind": "naming", "ref": 15}, {"year": 1994, "event": "Direct attack on the textbook reading: satisfaction of Ehrenfest's relations is shown to be neither necessary nor sufficient for the classical regime. The classical limit of a quantum state is generically a Liouville *ensemble* of orbits, and a centroid failing to follow any single orbit is the normal behaviour of a classical ensemble too", "who": "Leslie E. Ballentine, Yumin Yang, J. P. Zibin", "work": "\"Inadequacy of Ehrenfest's theorem to characterize the classical regime\", Phys. Rev. A 50, 2854", "kind": "revival", "ref": 16}, {"year": 2009, "event": "First rigorous statement of the hypotheses: self-adjointness alone is insufficient; the identities require ψ(t) in a suitable form domain so the boundary terms of Ehrenfest's two partial integrations vanish. Established for atomic/molecular Coulomb Hamiltonians; the hard-wall box remains a genuine counterexample where naive application fails", "who": "Gero Friesecke, Mario Koppen", "work": "\"On the Ehrenfest theorem of quantum mechanics\", J. Math. Phys. 50, 082102", "kind": "formalization", "ref": 13}], "neglected": [{"name": "Max Born and Pascual Jordan", "role": "Derived, in September 1925, the matrix equations of motion whose expectation values ARE Ehrenfest's relations. The operator identity d⟨A⟩/dt = (1/iħ)⟨[A,H]⟩ + ⟨∂A/∂t⟩ — routinely taught as the 'generalized Ehrenfest theorem' — is the Born–Jordan/Heisenberg equation of motion with brackets around it. Ehrenfest's own second footnote points at the connection to the matrices q_nm, p_nm, so he knew.", "evidence": "Born \u0026 Jordan, Z. Phys. 34, 858 (1925), §2 (mechanical equations from a variational principle); Ehrenfest's footnote 1 to eq. (2)–(3) in the 1927 note.", "ref": 4}, {"name": "Earle Hesse Kennard", "role": "Five months before Ehrenfest, solved the free particle, uniform force field and magnetic field exactly, showing the Gaussian centroid obeys the classical equations in all the linear-force cases, and gave the first rigorous derivation of σ_x σ_p ≥ ħ/2 (plus the first squeezed states). Ehrenfest cites him; the textbooks that name the theorem do not.", "evidence": "Kennard, Z. Phys. 44, 326–352 (1927), cited by name in Ehrenfest's footnote 1; Kennard learned the new mechanics directly from Heisenberg and Jordan while on sabbatical from Cornell at Göttingen in 1926.", "ref": 7}, {"name": "Erwin Schrödinger", "role": "Demonstrated the classical-motion result a year earlier for the harmonic oscillator, in the one nontrivial case where it holds exactly and without any narrow-packet assumption. Jammer assigns the priority to him explicitly. Modern practice recovers this as the coherent state, cited to Glauber (1963), not to the 1926 note.", "evidence": "Schrödinger, Naturwissenschaften 14, 664 (1926), cited in Ehrenfest's footnote 1; Jammer, Conceptual Development, p. 363: 'That for the harmonic oscillator wave mechanics agrees with ordinary mechanics had already been shown by Schrödinger.'", "ref": 5}, {"name": "Arthur Edward Ruark", "role": "Within a year extended Ehrenfest's one-dimensional relation to arbitrary conservative systems and derived the wave-mechanical virial theorem in the same paper. The generalization every modern course teaches is Ruark's; his name survives essentially nowhere in it, partly because it was buried in a paper whose title leads with the Zeeman and Stark effects.", "evidence": "Ruark, Phys. Rev. 31, 533–538 (1928) — abstract states the extension of 'Ehrenfest's law of motion' to any conservative system; flagged by Jammer and by Wheeler's survey as the forgotten generalization.", "ref": 9}, {"name": "Louis de Broglie, Léon Brillouin, Peter Debye", "role": "The three whom Ehrenfest credits, in his own footnote, with having already settled the substantive question (de Broglie, Thèse 1924 and J. Phys. Radium 7, 1 \u0026 32, 1926; Brillouin, J. Phys. Radium 7, 353, 1926; Debye, Phys. Z. 28, 170, 1927). Ehrenfest's opening sentence assigns the result to 'a whole series of recent publications' and claims for himself only an elementary reformulation. No textbook reproduces that disclaimer.", "evidence": "Ehrenfest 1927, footnote 1 to the introductory paragraph, legible in the Delphenich translation of Z. Phys. 45, 455–457.", "ref": 2}, {"name": "Gennady P. Berman and George M. Zaslavsky", "role": "Did the calculation that kills the naive classical limit — the ħ-expansion of quantum minus classical averages for a nonlinear system in a coherent state (Physica A 91, 450, 1978; Zaslavsky, Phys. Rep. 80, 157, 1981) — without invoking Ehrenfest. The link to the theorem was made by Chirikov, Izrailev and Shepelyansky in 1981 and the name 'Ehrenfest time' attached in 1988. The timescale that most sharply limits Ehrenfest's theorem thus carries Ehrenfest's name rather than the names of the people who computed it.", "evidence": "Berman \u0026 Zaslavsky, Physica A 91, 450 (1978); attribution chain recorded in Shepelyansky's Scholarpedia article 'Ehrenfest time and chaos', which states Berman and Zaslavsky made the first such comparison and that Chirikov et al. coined the term.", "ref": 14}, {"name": "Andrew D. McLachlan", "role": "Supplied the time-dependent variational principle from which mean-field quantum–classical (\"Ehrenfest\") trajectories actually follow, and which yields the time-dependent Hartree equations. Every 'Ehrenfest molecular dynamics' code is running McLachlan's variational ansatz under Ehrenfest's name; the classical-path/mean-field idea itself traces further back to Mott's 1931 treatment of excitation by heavy-particle collisions (verify).", "evidence": "McLachlan, Mol. Phys. 8, 39–44 (1964) — abstract: closely related to Frenkel's principle but always a true minimum of the error; 'for several interacting systems it leads to the time-dependent Hartree equations.'", "ref": 17}], "conflations": [{"claim": "'Ehrenfest's theorem says quantum expectation values obey Newton's laws.'", "clarification": "It says m d²⟨x⟩/dt² = −⟨V′(x)⟩. The right-hand side is the force *averaged over the packet*, not the force evaluated at the centroid. Taylor-expanding about ⟨x⟩: −⟨V′⟩ = −V′(⟨x⟩) − ½σ_x² V′′′(⟨x⟩) − (1/6)⟨δx³⟩ V⁗(⟨x⟩) − … . Newton's law for ⟨x⟩ holds exactly iff V′′′ ≡ 0, i.e. V free, linear or harmonic. Otherwise the equation for the first moments couples to the second, the second to the third, and the hierarchy never closes — one of the earliest moment-closure problems in physics, structurally identical to BBGKY and to Reynolds-stress closure. Ehrenfest's own eq. (5) has the correct averaged form; the misstatement is a textbook artifact, not his."}, {"claim": "'Ehrenfest's theorem gives the classical limit.'", "clarification": "It constrains the first two moments only, and satisfying it is neither necessary nor sufficient for classicality [19]. The classical limit of a generic quantum state is a Liouville *ensemble* of orbits, not a single orbit; a centroid that fails to follow any classical trajectory is exactly what a broad classical ensemble does too. Recovering classical mechanics needs either a coherent-state/ħ→0 argument with control on the error (Hepp 1974, Hagedorn 1980) (verify) or environmental decoherence to suppress the long-range superpositions the closed evolution generates (Zurek–Paz) (verify). Ehrenfest's identity is a *consistency check*, not a derivation."}, {"claim": "The 'Ehrenfest time' is one timescale.", "clarification": "At least two distinct scalings share the name. (i) Ehrenfest's own: free/regular diffusive packet spreading, T = √3 mω²/ħ — algebraic in ħ, and for gram-scale masses astronomically long (his 10²¹ s) [1]. (ii) The chaotic Ehrenfest time τ_E ~ λ⁻¹ ln(S/ħ), where λ is the Lyapunov exponent — the width grows as σ(t) ~ σ₀e^{λt}, so the cubic correction ½σ²V′′′ reaches O(1) after only a logarithm [17][18]. These differ qualitatively, not quantitatively. Quoting Ehrenfest's reassuring macroscopic estimate while working on a chaotic system is the single commonest abuse: for chaotic V, 'classical' survives only until t ~ λ⁻¹ln(1/ħ), which for ordinary macroscopic systems is *seconds*, not the age of the universe. In closed systems the correspondence genuinely does break there; restoring it beyond τ_E requires environment-induced diffusion above a threshold (Hernández–Ranard–Riedel, arXiv:2306.13717, 2023) (verify)."}, {"claim": "'Ehrenfest dynamics' (chemistry, AMD, TDDFT, TDHF) is an application of Ehrenfest's theorem.", "clarification": "Different object. Ehrenfest's theorem is an exact operator identity within a single quantum state. 'Ehrenfest dynamics' is a mean-field *ansatz*: nuclei propagate on a single averaged potential Σ_k|c_k|²∇E_k while electrons evolve along that one trajectory. Its actual lineage is Mott's classical-path treatment (1931) (verify) and McLachlan's time-dependent variational principle [15]; the name was attached in molecular scattering by Billing in 1983 [16]. The ansatz has known pathologies the theorem does not: it cannot branch at conical intersections, it violates detailed balance (no correct Boltzmann populations at long times), and it produces unphysical residual electronic coherences — which is why surface-hopping exists. Citing Ehrenfest 1927 to justify mean-field nuclear trajectories is a category error dressed as a derivation."}, {"claim": "'Ehrenfest's theorem' = 'Ehrenfest's adiabatic theorem'.", "clarification": "Unrelated works, thirteen years apart. The 1916–17 adiabatic hypothesis [9] concerns adiabatic invariants of the old quantum theory (∮p dq under slow parameter change) and is Ehrenfest's genuinely major contribution. Compounding it, the *quantum* adiabatic theorem — state stays in the instantaneous eigenstate under slow driving — is Born and Fock (1928), not Ehrenfest, yet is frequently attributed to him. Add further name collisions: the Ehrenfest classification of phase transitions (1933, Proc. Amsterdam Acad. 36, 153), the Ehrenfest urn model, and the Ehrenfest paradox in relativity. Four distinct 'Ehrenfest theorems' circulate; only one is the 1927 note."}, {"claim": "Ehrenfest's relations hold for any self-adjoint H and any state.", "clarification": "No. The derivation requires two partial integrations whose boundary terms must vanish; self-adjointness of H is not sufficient. Rigorous hypotheses were not established until 2009 — ψ(t) must lie in an appropriate form domain, which does hold for atomic and molecular Coulomb Hamiltonians [20]. The infinite square well is the standard cautionary case: the naive relation d⟨p⟩/dt = −⟨V′⟩ acquires boundary contributions at the walls, and for states with insufficient decay the relation as usually written simply fails."}, {"claim": "The 'generalized Ehrenfest theorem,' d⟨A⟩/dt = (1/iħ)⟨[A,H]⟩ + ⟨∂A/∂t⟩, is Ehrenfest's.", "clarification": "That is the Heisenberg equation of motion in expectation, from Born–Jordan (Sept 1925) [4] and Heisenberg's picture generally — two years before Ehrenfest, and covering all observables rather than x and p in one dimension. Ehrenfest never wrote it; he wrote two specific integrals for a one-dimensional H = p²/2m + V(x). The naming inflation runs backwards down the generality ladder: the more general the statement, the less it is Ehrenfest's."}], "sections": [{"id": "the-note-and-its-precursors", "title": "September 1927: The Note Nobody Claimed", "markdown": "## September 1927: The Note Nobody Claimed\n\nThe document is three printed pages, two and a half of them text. It carries the receipt stamp *Eingegangen am 5. September 1927* and it opens not with a claim but with a concession. Before the first equation, before the abstract has even finished, Ehrenfest has told you that the problem was already solved:\n\n\u003e \"In a whole series of recent publications, it has been, in essence, clarified completely that classical mechanics remains valid for macroscopic processes to a high degree of approximation, and in what way that would be true (¹). However, please permit me to prove briefly a special elementary relation that follows exactly from Schrödinger's equation without leaving anything out, because it will perhaps make the connection between wave mechanics and classical mechanics even easier to survey.\" [1][2]\n\nThat is the whole of Ehrenfest's stated ambition: not a theorem, a *survey aid*. Footnote 1 then discharges the debt in a single dense line — ten bibliographic entries by six authors: de Broglie's 1924 thesis plus four of his papers, Brillouin (*J. phys. radium* **7**, 353, 1926), Schrödinger (*Naturwiss.* **14**, 664, 1926), Debye (*Phys. Zeit.* **28**, 170, 1927), Heisenberg (*Z. Phys.* **43**, 172, 1927), and Kennard (*Z. Phys.* **44**, 326, 1927) [2]. No textbook that names the theorem reproduces that footnote.\n\n### What is actually in the paper\n\nEhrenfest defines two moments, his equations (2) and (3),\n\n$$Q(t) \\equiv \\int_{-\\infty}^{+\\infty}\\! dx\\; x\\,\\Psi\\Psi^{*}, \\qquad P(t) \\equiv i\\hbar \\int_{-\\infty}^{+\\infty}\\! dx\\; \\Psi\\,\\frac{\\partial \\Psi^{*}}{\\partial x},$$\n\ndifferentiates using (1) and $(1^{*})$, integrates by parts, and obtains — \"immediately (and with nothing left out)\" —\n\n$$\\frac{dQ}{dt} = \\frac{1}{m}P \\qquad (4), \\qquad\\qquad m\\frac{d^{2}Q}{dt^{2}} = \\frac{dP}{dt} = \\int\\! dx\\;\\Psi\\Psi^{*}\\!\\left(-\\frac{\\partial V}{\\partial x}\\right) \\qquad (5).$$\n\nTwo points of philology. First, the Delphenich translation prints the middle member of (5) as $dQ/dt$; it must read $dP/dt$, and whether the misprint originates with Delphenich or with *Zeitschrift für Physik* I have not checked (verify). Second, and consequentially: Wheeler's otherwise excellent survey states that \"Ehrenfest did not draw explicit attention\" to $d\\langle x\\rangle/dt = \\langle p\\rangle/m$ [3]. The primary text refutes this. It is his equation (4), it precedes (5), and (5) is derived by differentiating it. The claim should not be repeated.\n\nNote also what (5) does *not* say. The force sits inside the integral. Ehrenfest's own gloss puts the crucial phrase in scare quotes — the acceleration of the centroid behaves Newtonianly under the force \"that acts upon the position of the wave packet\" — and prefaces it with the condition that carries the whole result: \"Any time that the width of the (probability) wave packet $\\Psi\\Psi^{*}$ is relatively small (in comparison to macroscopic distances)\" [2]. The abstract is blunter still: \"for a small wave packet that stays small (with $m$ of order 1 g).\"\n\nHe then supplies the numbers that bound his own claim. Reproducing Heisenberg's free-packet calculation (and crediting him on the page), he gets $\\Omega^{2} = \\omega^{2} + \\hbar^{2}t^{2}/m^{2}\\omega^{2}$, so the width doubles after\n\n$$T = \\sqrt{3}\\,\\frac{m\\omega^{2}}{\\hbar},$$\n\nwhere $\\omega$ is the *initial width* — a length, $10^{-3}$ cm in his example, not a frequency. For $m = 1$ g this gives $T \\approx 10^{21}$ s; for $m = 1.7\\times10^{-24}$ g and $\\omega = 10^{-8}$ cm, $T \\approx 10^{-13}$ s [1][2]. The man who is credited with proving that quantum mechanics goes over to classical mechanics ended his paper by printing the timescale on which it does not.\n\n### The precursors, ranked by what they actually supplied\n\nThe **exact identity** was two years old. Born and Jordan's September 1925 paper derives the matrix equations of motion $\\dot q = \\partial H/\\partial p$, $\\dot p = -\\partial H/\\partial q$ from the canonical commutator [4]; take expectation values in any state and Ehrenfest's (4) and (5) fall out with no further work. Ehrenfest knew: his second footnote expands $\\Psi$ in eigenfunctions precisely to exhibit \"its relationship to the matrices $q_{nm}$ and $p_{nm}$\" [2].\n\nThe **one nontrivial case where the result is exact and unconditional** belonged to Schrödinger, 1926 — the displaced Gaussian of the harmonic oscillator, translating rigidly along the classical orbit [5]. Jammer assigns the priority to him in as many words [6]. The **exactly solvable linear-force packets** — free particle, uniform field, magnetic field — belonged to Kennard, in the volume immediately preceding Ehrenfest's, along with the first rigorous $\\sigma_x\\sigma_p \\geq \\hbar/2$ and the first squeezed states [7]. The **spreading law** was Heisenberg's [8]. And the **generalization everyone teaches** — to arbitrary conservative systems of any number of particles, with the wave-mechanical virial theorem as a bonus — was Ruark's, within the year; his abstract calls it \"Ehrenfest's law of motion,\" an early instance of the attribution setting like concrete [9].\n\nWhat Ehrenfest contributed was compression: the relation in the exact averaged form $\\langle -\\partial V/\\partial x\\rangle$, on one page, holdable in one hand.\n\n### Canonization by syllabus\n\nThe theorem was not carried into the canon by citation; it was carried by textbooks. Kemble indexes \"Ehrenfest's theorem\" in 1937, p. 49 [10]; Schiff (p. 28), Merzbacher (p. 41), Powell–Crasemann (p. 98) and eventually Griffiths follow [3]. Meanwhile Dirac's *Principles* and Landau–Lifshitz pass over it in silence [3] — and here a standing claim needs correcting: Pauli is usually listed as a third omission, but Pauli's *Wellenmechanik* is a reprint of his 1926 *Handbuch* article and simply predates the note [3]. That distribution is diagnostic. A result absent from the three most theoretically ambitious monographs of the era, and present in every introductory course, is a pedagogical instrument, not a research tool.\n\nThe closing datum is the quiet one. Ehrenfest died on 25 September 1933, six years and twenty days after the note was received. Einstein's memorial essay ranks the adiabatic hypothesis and, above everything, the teaching [11]; Klein's biography likewise treats the 1927 note as a minor late paper [12]. His contemporaries did not think this was what he had done. The ranking inverted only afterwards, and only in the classroom."}, {"id": "the-identity-and-its-assumptions", "title": "The Physics, Properly: An Exact Identity and the Hierarchy That Never Closes", "markdown": "## The Physics, Properly: An Exact Identity and the Hierarchy That Never Closes\n\nEhrenfest's note contains no approximation in its central step. The approximation arrives later, in the reading. It is worth separating the two with some care, because the assumptions that get silently dropped between the identity and its interpretation are precisely where the textbook myth lives.\n\n### The derivation Ehrenfest actually wrote\n\nTake\n\n**(A1)** $\\hat H = \\hat p^2/2m + V(\\hat x)$, with $\\hat x$ and $\\hat p$ carrying no explicit time dependence, and $V$ real.\n\nThen for $\\Psi(x,t)$ obeying $i\\hbar\\,\\partial_t\\Psi = \\hat H\\Psi$,\n\n$$\\frac{d}{dt}\\langle x\\rangle = \\int dx\\; x\\,\\partial_t(\\Psi^*\\Psi) = \\frac{i\\hbar}{2m}\\int dx\\; x\\,\\partial_x\\!\\left(\\Psi^*\\partial_x\\Psi - \\Psi\\,\\partial_x\\Psi^*\\right),$$\n\nusing the continuity equation $\\partial_t\\rho = -\\partial_x j$ with $j = (\\hbar/m)\\,\\mathrm{Im}(\\Psi^*\\partial_x\\Psi)$. One integration by parts moves $\\partial_x$ off the current:\n\n$$\\frac{d}{dt}\\langle x\\rangle = \\Big[-x\\,j\\Big]_{-\\infty}^{+\\infty} + \\int dx\\; j = \\frac{\\langle p\\rangle}{m},$$\n\nwhich is Ehrenfest's equation (4) — stated by him explicitly, before and in service of the second-order relation, contrary to a claim occasionally made in the secondary literature [2][3]. Differentiating once more and integrating by parts a second time (now moving a derivative off $\\partial_x\\Psi^*\\,\\partial_x\\Psi$) gives his equation (5):\n\n$$m\\frac{d^2}{dt^2}\\langle x\\rangle = \\frac{d\\langle p\\rangle}{dt} = \\int dx\\;\\Psi^*\\Psi\\left(-\\frac{\\partial V}{\\partial x}\\right) = \\big\\langle -V'(x)\\big\\rangle.$$\n\nBoth steps discarded a surface term. That is not free:\n\n**(A2)** $\\Psi(t)$ must lie in a domain where the boundary terms $[x\\,j]$ and $[\\Psi^*\\partial_x\\Psi - \\text{c.c.}]$ vanish. Self-adjointness of $\\hat H$ does *not* suffice. The correct hypotheses — $\\psi(t)$ in an appropriate form domain — were established only in 2009 by Friesecke and Koppen, who also verified that atomic and molecular Coulomb Hamiltonians satisfy them [13]. The infinite square well is the standard counterexample: $V' = 0$ in the interior, yet $\\langle p\\rangle$ is manifestly not constant, because the wall contributions are exactly what was thrown away.\n\n### The same identity, two years earlier\n\nNothing above is specific to $x$ and $p$. For any observable $\\hat A$,\n\n$$\\frac{d\\langle A\\rangle}{dt} = \\frac{1}{i\\hbar}\\big\\langle[\\hat A,\\hat H]\\big\\rangle + \\Big\\langle \\frac{\\partial \\hat A}{\\partial t}\\Big\\rangle,$$\n\nwhich is the
