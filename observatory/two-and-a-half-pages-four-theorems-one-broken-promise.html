 Heisenberg/Born–Jordan equation of motion with expectation brackets around it, in print since September 1925 [4]. Setting $\\hat A = \\hat x$ gives $[\\hat x,\\hat p^2]/2mi\\hbar = \\hat p/m$; setting $\\hat A = \\hat p$ gives $[\\hat p, V]/i\\hbar = -V'(\\hat x)$. Ehrenfest's two relations are one line of the Born–Jordan formalism. He knew: his second footnote points at the matrix elements $q_{nm}, p_{nm}$ [1][2]. The result that modern courses call the \"generalized Ehrenfest theorem\" is thus more general *and* less Ehrenfest's — the naming inflation runs backwards down the generality ladder.\n\n### Where Newton is not\n\n$\\langle -V'(x)\\rangle$ is the force averaged over the packet, never the force at the centroid. To compare with Newton one must expand, which requires\n\n**(A3)** $V$ smooth enough near $\\langle x\\rangle$ for a Taylor series with controlled remainder over the packet's support. Then, writing $\\delta x = x - \\langle x\\rangle$,\n\n$$-\\langle V'(x)\\rangle = -V'(\\langle x\\rangle) - \\tfrac{1}{2}\\sigma_x^2\\,V'''(\\langle x\\rangle) - \\tfrac{1}{6}\\langle\\delta x^3\\rangle\\,V''''(\\langle x\\rangle) - \\cdots$$\n\nNewton's law for the centroid holds *exactly* iff\n\n**(A4)** $V''' \\equiv 0$ — free, uniform, or harmonic. These are exactly the cases Kennard solved five months earlier [7] and the oscillator Schrödinger had done in 1926 [5]. Outside them, the equation for $\\langle x\\rangle$ recruits $\\sigma_x^2$; the equation for $\\sigma_x^2$ recruits $\\langle \\delta x^3\\rangle$ and $\\langle \\delta x \\delta p + \\delta p \\delta x\\rangle$; the third moment recruits the fourth. **The hierarchy never closes.** This is a moment-closure problem in the same structural family as BBGKY (one-particle distribution driven by the two-particle) and Reynolds-stress closure (mean flow driven by $\\overline{u'u'}$) — arguably the earliest instance in physics, and never labelled as such in Ehrenfest's own text.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eMoment closure hierarchy\u003c/title\u003e\u003ctext x=\"20\" y=\"28\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"serif\"\u003eEach moment equation sources the next. Closure only if V''' = 0.\u003c/text\u003e\u003crect x=\"30\" y=\"60\" width=\"150\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"105\" y=\"83\" fill=\"#7aa2ff\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003e1st moments\u003c/text\u003e\u003ctext x=\"105\" y=\"102\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003e⟨x⟩, ⟨p⟩\u003c/text\u003e\u003crect x=\"240\" y=\"60\" width=\"150\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"315\" y=\"83\" fill=\"#ffb86b\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003e2nd moments\u003c/text\u003e\u003ctext x=\"315\" y=\"102\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eσx², σp², ⟨δxδp⟩\u003c/text\u003e\u003crect x=\"450\" y=\"60\" width=\"150\" height=\"52\" rx=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"525\" y=\"83\" fill=\"#ff7a90\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003e3rd moments\u003c/text\u003e\u003ctext x=\"525\" y=\"102\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003e⟨δx³⟩, …\u003c/text\u003e\u003ctext x=\"655\" y=\"93\" fill=\"#e8e6e1\" font-size=\"20\" font-family=\"serif\"\u003e⋯\u003c/text\u003e\u003cline x1=\"180\" y1=\"86\" x2=\"236\" y2=\"86\" stroke=\"#e8e6e1\" stroke-width=\"2\" marker-end=\"url(#a)\"/\u003e\u003cline x1=\"390\" y1=\"86\" x2=\"446\" y2=\"86\" stroke=\"#e8e6e1\" stroke-width=\"2\" marker-end=\"url(#a)\"/\u003e\u003cline x1=\"600\" y1=\"86\" x2=\"640\" y2=\"86\" stroke=\"#e8e6e1\" stroke-width=\"2\" marker-end=\"url(#a)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"208\" y=\"140\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003e½σx²V'''\u003c/text\u003e\u003ctext x=\"418\" y=\"140\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003e⅙⟨δx³⟩V''''\u003c/text\u003e\u003cline x1=\"30\" y1=\"175\" x2=\"690\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1\" opacity=\"0.4\"/\u003e\u003ctext x=\"20\" y=\"205\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eClosure by potential class:\u003c/text\u003e\u003crect x=\"30\" y=\"225\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"130\" y=\"248\" fill=\"#7ee0a3\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eV''' ≡ 0\u003c/text\u003e\u003ctext x=\"130\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003efree / linear / harmonic\u003c/text\u003e\u003ctext x=\"130\" y=\"308\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003ecentroid = classical orbit,\u003c/text\u003e\u003ctext x=\"130\" y=\"326\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eexactly, for ANY state\u003c/text\u003e\u003crect x=\"260\" y=\"225\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"360\" y=\"248\" fill=\"#ffb86b\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eV''' ≠ 0, regular\u003c/text\u003e\u003ctext x=\"360\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eanharmonic, bounded λ\u003c/text\u003e\u003ctext x=\"360\" y=\"308\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eerror grows algebraically;\u003c/text\u003e\u003ctext x=\"360\" y=\"326\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eA5–A6 buy finite time\u003c/text\u003e\u003crect x=\"490\" y=\"225\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"590\" y=\"248\" fill=\"#ff7a90\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eV''' ≠ 0, chaotic\u003c/text\u003e\u003ctext x=\"590\" y=\"268\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eLyapunov exponent λ \u0026gt; 0\u003c/text\u003e\u003ctext x=\"590\" y=\"308\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003eσx ~ σ₀e^{λt}: A6 fails at\u003c/text\u003e\u003ctext x=\"590\" y=\"326\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003et ~ λ⁻¹ ln(S/ħ)\u003c/text\u003e\u003ctext x=\"20\" y=\"372\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\" opacity=\"0.85\"\u003eA4 is the only exact closure. Everything else is a truncation with a lifetime.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The Ehrenfest relations are the first rung of an unclosed moment hierarchy. The correction term ½σ_x²V'''(⟨x⟩) is what couples rung 1 to rung 2; closure at rung 1 requires V''' ≡ 0 identically. The three boxes show what \"approximately classical\" then means in each potential class — and how long it lasts.*\n\n### The three assumptions that live in the interpretation\n\nTruncating after the first term requires\n\n**(A5)** $\\sigma_x$ small on the scale over which $V''$ varies: $\\tfrac{1}{2}\\sigma_x^2 |V'''| \\ll |V'|$. This is Ehrenfest's own stated condition — \"whenever the width of the probability wave packet is relatively small\" [1][2].\n\n**(A6)** the packet *stays* narrow over the interval of interest. Ehrenfest checks this and gives the numbers that bound his own claim: $\\sim 10^{21}$ s for $m = 1$ g, $\\sim 10^{-13}$ s at proton scale [1]. His estimate is diffusive and algebraic in $\\hbar$. For $\\lambda \u003e 0$ it is replaced by exponential growth $\\sigma_x(t)\\sim\\sigma_0 e^{\\lambda t}$, so A6 expires after a logarithm [14][15] — the subject of §3.\n\n**(A7)** a *single* trajectory is the right classical comparand. This is the assumption nobody states and the one that fails first. The classical limit of a generic quantum state is a Liouville ensemble; a centroid that follows no single orbit is exactly what a spread classical ensemble does too, so the Ehrenfest relations are neither necessary nor sufficient for classicality [16]. Jammer's verdict stands: analogy, not reduction [6]."}, {"id": "where-each-assumption-dies", "title": "Strict Conditions \u0026 Failure Modes: A1–A7 Under Load", "markdown": "## Strict Conditions \u0026 Failure Modes: A1–A7 Under Load\n\nThe identity of §2 is exact; the *theorem* people quote is not. What separates them is a stack of hypotheses that are rarely written down. Below, each is pushed until it snaps, with numbers where numbers exist.\n\n### A2: Domains, not just self-adjointness\n\nThe derivation of $\\frac{d}{dt}\\langle p\\rangle = -\\langle V'\\rangle$ requires two integrations by parts, and each leaves a boundary term. The standard course tacitly assumes those vanish because $\\psi\\to 0$ at infinity. That is a statement about the *domain* of the operators, and it is strictly stronger than the statement that $H$ is self-adjoint.\n\nThe infinite square well is the cheapest counterexample and the one most often taught wrongly. On $[0,L]$ with Dirichlet conditions, $V'\\equiv 0$ in the interior, so the naive relation predicts $\\frac{d}{dt}\\langle p\\rangle = 0$ for every state — false for any state that is not stationary, since the packet reflects. The correct statement carries the wall terms,\n\n$$\\frac{d}{dt}\\langle p\\rangle \\;=\\; \\frac{\\hbar^{2}}{2m}\\Big[\\,|\\partial_x\\psi(0,t)|^{2}-|\\partial_x\\psi(L,t)|^{2}\\Big],$$\n\ni.e. the pressure difference on the two walls. The force is entirely boundary, entirely absent from $-\\langle V'\\rangle$. The failure is not exotic: $H$ here is a perfectly good self-adjoint operator with a complete eigenbasis. What fails is that $p^2$'s domain and $p$'s domain do not nest the way the manipulation assumes — $\\psi\\in D(H)$ does not imply $p\\psi\\in D(p)$.\n\nRemarkably, the hypotheses under which the relations *do* hold were not settled until 2009. Friesecke and Koppen showed that the correct sufficient condition is membership in the form domain — that $\\psi(t)$ lie in the appropriate quadratic-form domain of $H$ rather than merely in $D(H)$ — and, importantly, that this condition is satisfied for atomic and molecular Coulomb Hamiltonians, singularities and all [13]. So the theorem survives where chemistry needs it. That it took eighty-two years to state the hypotheses of a result taught in every second-year course is itself a datum about how the theorem was transmitted: as pedagogy, not as mathematics.\n\nTwo adjacent traps. Delta-function potentials: $V' $ is a distribution and $\\langle V'\\rangle$ must be interpreted as a boundary term, not an integral against $|\\psi|^2$ at the singular point. And states with heavy tails: a normalized $\\psi$ with $\\langle p^2\\rangle=\\infty$ (e.g. a wavefunction with a kink) has no $\\frac{d}{dt}\\langle p\\rangle$ to speak of.\n\n### A4/A5: The hierarchy leaks, and it leaks two different ways\n\nFrom §2, the exact expansion is\n\n$$m\\ddot{\\langle x\\rangle} = -V'(\\langle x\\rangle) - \\tfrac{1}{2}\\sigma_x^{2}V'''(\\langle x\\rangle) - \\tfrac{1}{6}\\langle \\delta x^{3}\\rangle V^{(4)}(\\langle x\\rangle) - \\cdots$$\n\nThe centroid obeys Newton iff the correction terms are negligible, which requires *both* $\\sigma_x$ small *and* $V'''$ mild over the packet support. The relevant dimensionless number is not $\\hbar$ but\n\n$$\\epsilon(t) \\;=\\; \\frac{\\sigma_x^{2}(t)\\,|V'''|}{2\\,|V'|}.$$\n\nEverything now hinges on how $\\sigma_x(t)$ grows, and there are two qualitatively different laws.\n\n**(i) Diffusive spreading — Ehrenfest's own estimate.** For free or nearly-free motion, $\\sigma_x^{2}(t)=\\sigma_0^{2}+(\\hbar t/2m\\sigma_0)^{2}$: the width grows *algebraically*, linearly in $t$ at late times, and the time to double is $\\propto m\\sigma_0^{2}/\\hbar$. This is the regime Ehrenfest himself bounded, and he did the arithmetic honestly. His closing numbers give roughly $10^{21}$ s for a packet of mass $m=1$ g — longer than the age of the universe by eleven orders of magnitude — against $\\sim 10^{-13}$ s for a proton-scale packet [1][2]. The contrast is the whole content of his \"approximate validity\": macroscopic bodies are safe, nucleons are not. Note the scaling: algebraic in $\\hbar$, so pushing $\\hbar\\to0$ buys you time as a power law.\n\n**(ii) Exponential spreading — the chaotic case.** If the classical flow has a positive Lyapunov exponent $\\lambda$, the packet stretches as $\\sigma_x(t)\\sim\\sigma_0 e^{\\lambda t}$ along the unstable manifold. Then $\\epsilon(t)$ reaches $O(1)$ after\n\n$$\\tau_E \\;\\sim\\; \\frac{1}{\\lambda}\\,\\ln\\!\\frac{S}{\\hbar} \\;\\sim\\; \\frac{1}{2\\lambda}\\ln\\frac{1}{\\hbar},$$\n\nwith $S$ a characteristic action. This scaling comes out of the systematic $\\hbar$-expansion of the quantum-minus-classical average for a nonlinear system started in a coherent state, done by Berman and Zaslavsky in 1978 — who did not invoke Ehrenfest at all [14]. The name \"Ehrenfest time\" was attached a decade later by Chirikov, Izrailev and Shepelyansky [15].\n\nThe difference between (i) and (ii) is not quantitative. A logarithm annihilates the comfort of $10^{21}$ s: with $\\lambda\\sim1\\ \\mathrm{s^{-1}}$ and $S/\\hbar\\sim10^{20}$, $\\tau_E\\approx 46$ s. Hyperion's tumbling — the standard example — gives decades, not eons. Quoting Ehrenfest's gram-scale reassurance while working on a chaotic Hamiltonian is the single commonest abuse of the theorem, and it is off by roughly twenty orders of magnitude in the exponent.\n\n### A7: Narrow packets are not what classicality means\n\nThe deepest failure is not that the relations break, but that keeping them buys less than advertised. Ballentine, Yang and Zibin showed that satisfaction of the Ehrenfest relations is neither necessary nor sufficient for the classical regime [16]. Not *sufficient*: one can construct states for which the relations hold to excellent accuracy while the dynamics remain manifestly non-classical. Not *necessary*: the classical limit of a generic quantum state is a **Liouville ensemble** of orbits, not a single orbit, and the centroid of a broad classical ensemble also fails to follow any member trajectory. A classical probability density in a chaotic potential has $\\ddot{\\bar{x}}\\neq -V'(\\bar{x})$ for exactly the same moment-closure reason. The \"failure\" that τ_E marks is therefore, in part, not a quantum failure at all — it is the failure of a *centroid* to represent a *distribution*, which happens classically too. The genuinely quantum content lies beyond that: interference between branches, which Liouville flow cannot produce.\n\nA real derivation of classical mechanics needs machinery the 1927 note does not contain. Two routes exist. First, coherent-state propagation with controlled error as $\\hbar\\to0$ — Hepp's 1974 theorem and Hagedorn's semiclassical wave-packet estimates give norm bounds on the difference between the true evolution and the classically-guided Gaussian, valid on times up to $\\tau_E$ and no further (verify). Second, environmental decoherence, which suppresses the long-range superpositions closed evolution generates and restores correspondence past $\\tau_E$ by injecting phase-space diffusion — the Zurek–Paz analysis, in which the decoherence rate must exceed a threshold set by $\\lambda$ (verify). Both are post-1970 and neither is Ehrenfest's.\n\nThe honest summary: A1–A7 are not fine print on a working theorem. They are the theorem. What survives unconditionally is an exact identity about two moments; what does not survive is the promise attached to it in the textbooks."}, {"id": "signatures-direct-and-circumstantial", "title": "Signatures: What Actually Tests the Theorem, and What Merely Rhymes With It", "markdown": "## Signatures: What Actually Tests the Theorem, and What Merely Rhymes With It\n\nThe identity of §2 is exact, so \"testing Ehrenfest's theorem\" is a category error if taken literally: you cannot falsify $m\\,d^2\\langle x\\rangle/dt^2 = -\\langle V'(x)\\rangle$ any more than you can falsify the product rule. What experiments actually probe is one of three distinct propositions, and conflating them is the standard failure of the literature:\n\n- **(T1)** The *closure* claim: $\\langle V'\\rangle \\simeq V'(\\langle x\\rangle)$, i.e. the moment hierarchy truncates at first order.\n- **(T2)** The *narrowness* claim: the packet stays localized long enough for (T1) to remain true — the timescale question.\n- **(T3)** The *classicality* claim: (T1) + (T2) $\\Rightarrow$ classical behavior. This is the one Ballentine, Yang and Zibin demolished [16], and it is the one most experiments are silently reported as confirming.\n\nA signature is *direct* only if it discriminates among these. Most published \"confirmations of Ehrenfest's theorem\" measure a first moment, find it moves roughly along a classical curve, and stop — which tests nothing, since a broad classical Liouville ensemble does the same thing badly in exactly the same way.\n\n### Direct signatures\n\n**Non-dispersing coherent-state motion.** The harmonic trap is the one nontrivial potential where $V''' \\equiv 0$ and the hierarchy closes exactly [5]. A displaced Gaussian rigidly translates: $\\langle x\\rangle(t) = x_0\\cos\\omega t$, $\\sigma_x(t) = \\sigma_x(0)$, for all $t$, for arbitrary $\\sigma_x$ — *no narrow-packet assumption required*. This is a genuine smoking gun because it has a sharp negative control: any observed breathing at $2\\omega$, or any secular growth of $\\sigma_x$, signals either anharmonicity ($V''' \\neq 0$, feeding the second moment) or a squeezed initial condition. Kennard's linear-force solutions [7] supply the free-fall and uniform-field analogues, where the centroid tracks the classical orbit exactly while $\\sigma_x$ spreads — the cleanest demonstration that centroid-following and packet-narrowness are *independent* properties. Ion traps and optical dipole traps realize both regimes with $\\sigma_x$ measurable by time-of-flight or by sideband thermometry.\n\n**Direct measurement of the closure defect.** The observable that actually tests (T1) is\n$$\\Delta(t) \\equiv \\langle V'(x)\\rangle - V'(\\langle x\\rangle) = \\tfrac{1}{2}\\sigma_x^2\\,V'''(\\langle x\\rangle) + \\tfrac{1}{6}\\langle \\delta x^3\\rangle\\,V''''(\\langle x\\rangle) + \\cdots$$\nin a *deliberately* anharmonic potential — an anharmonic ion trap, a tilted optical lattice, or a transmon's cosine potential where $V''' \\neq 0$ is engineered rather than parasitic. The discriminating experiment measures $\\sigma_x^2$ and $\\langle x\\rangle$ independently and checks the *predicted* $\\Delta$ against the observed centroid acceleration. Agreement at leading order with a measured, nonzero $\\Delta$ is a positive test; agreement of the centroid with the classical orbit *while $\\Delta$ is large* is a coincidence, not a confirmation.\n\n**The $\\ln(1/\\hbar)$ scaling of the breakdown time.** This is the sharpest available test and the only one that distinguishes Ehrenfest's own diffusive spreading time from the chaotic Ehrenfest time. In a kicked rotor or kicked top realized with cold atoms in a pulsed standing wave, the effective Planck constant $\\hbar_{\\rm eff} = 8\\omega_r T$ is a *dial*: change the pulse period $T$ and you change $\\hbar$ without changing the classical dynamics. The prediction from the Berman–Zaslavsky expansion [14], named by Chirikov, Izrailev and Shepelyansky [15], is\n$$\\tau_E \\simeq \\lambda^{-1}\\ln(S/\\hbar_{\\rm eff}),$$\nwith $\\lambda$ the classical Lyapunov exponent measured independently from the classical map. A logarithm is a weak function; extracting it demands a decade or more in $\\hbar_{\\rm eff}$ and a fixed, unambiguous breakdown criterion (e.g. the time at which $|\\langle x\\rangle_{\\rm qm} - x_{\\rm cl}|$ exceeds a fixed fraction of the phase-space scale). The falsifiable content is the *slope*: $d\\tau_E/d\\ln(1/\\hbar_{\\rm eff}) = \\lambda^{-1}$, with the classical $\\lambda$ measured, not fitted. A power-law or $\\hbar$-independent breakdown falsifies the chaotic scaling and pushes you back toward Ehrenfest's algebraic $T \\propto m\\omega^2/\\hbar$ [1].\n\n**Interference-visibility survival as a control.** Every claim that \"the system went classical at $\\tau_E$\" must exclude decoherence as the cause. The control is an independent coherence measurement — Ramsey fringe contrast, or the visibility of a cat-state interference pattern prepared in the same apparatus. If visibility decays on $\\tau_D \\ll \\tau_E$, the observed classicality is environmental and the theorem is a bystander. Only when $\\tau_D \\gg \\tau_E$ does the breakdown belong to the closed-system moment hierarchy.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDiscriminating direct from indirect signatures of Ehrenfest dynamics\u003c/title\u003e\u003ctext x=\"20\" y=\"26\" fill=\"#e8e6e1\" font-size=\"16\" font-family=\"sans-serif\" font-weight=\"bold\"\u003eObserved: centroid follows a classical-looking curve\u003c/text\u003e\u003crect x=\"20\" y=\"38\" width=\"400\" height=\"2\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"30\" y=\"72\" fill=\"#ffb86b\" font-size=\"15\" font-family=\"sans-serif\"\u003eConfounder A: broad classical Liouville ensemble\u003c/text\u003e\u003ctext x=\"30\" y=\"94\" fill=\"#ffb86b\" font-size=\"15\" font-family=\"sans-serif\"\u003eConfounder B: environment-induced decoherence\u003c/text\u003e\u003ctext x=\"30\" y=\"116\" fill=\"#ffb86b\" font-size=\"15\" font-family=\"sans-serif\"\u003eConfounder C: fitted mean-field ansatz parameters\u003c/text\u003e\u003cline x1=\"120\" y1=\"126\" x2=\"120\" y2=\"168\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"360\" y1=\"126\" x2=\"360\" y2=\"168\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"600\" y1=\"126\" x2=\"600\" y2=\"168\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003crect x=\"20\" y=\"168\" width=\"200\" height=\"70\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\" rx=\"6\"/\u003e\u003ctext x=\"34\" y=\"192\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"sans-serif\"\u003eDiscriminator A:\u003c/text\u003e\u003ctext x=\"34\" y=\"212\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003eWigner tomography —\u003c/text\u003e\u003ctext x=\"34\" y=\"230\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003efull W(x,p), not moment 1\u003c/text\u003e\u003crect x=\"260\" y=\"168\" width=\"200\" height=\"70\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\" rx=\"6\"/\u003e\u003ctext x=\"274\" y=\"192\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"sans-serif\"\u003eDiscriminator B:\u003c/text\u003e\u003ctext x=\"274\" y=\"212\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003evisibility vs. time —\u003c/text\u003e\u003ctext x=\"274\" y=\"230\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003ecompare tau_D with tau_E\u003c/text\u003e\u003crect x=\"500\" y=\"168\" width=\"200\" height=\"70\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\" rx=\"6\"/\u003e\u003ctext x=\"514\" y=\"192\" fill=\"#7aa2ff\" font-size=\"14\" font-family=\"sans-serif\"\u003eDiscriminator C:\u003c/text\u003e\u003ctext x=\"514\" y=\"212\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003ebranching at conical\u003c/text\u003e\u003ctext x=\"514\" y=\"230\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\"\u003eintersection: present?\u003c/text\u003e\u003cline x1=\"120\" y1=\"238\" x2=\"120\" y2=\"280\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"360\" y1=\"238\" x2=\"360\" y2=\"280\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"600\" y1=\"238\" x2=\"600\" y2=\"280\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"34\" y=\"300\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003eW has negativity and\u003c/text\u003e\u003ctext x=\"34\" y=\"318\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003estays localized\u003c/text\u003e\u003ctext x=\"34\" y=\"336\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003eW spread, no negativity\u003c/text\u003e\u003ctext x=\"34\" y=\"354\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003e= classical ensemble [16]\u003c/text\u003e\u003ctext x=\"274\" y=\"300\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003etau_D \u0026gt;\u0026gt; tau_E: closed-\u003c/text\u003e\u003ctext x=\"274\" y=\"318\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003esystem hierarchy failure\u003c/text\u003e\u003ctext x=\"274\" y=\"336\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003etau_D \u0026lt;\u0026lt; tau_E: environment\u003c/text\u003e\u003ctext x=\"274\" y=\"354\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003edid it; theorem untested\u003c/text\u003e\u003ctext x=\"514\" y=\"300\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003ebranching seen: mean\u003c/text\u003e\u003ctext x=\"514\" y=\"318\" fill=\"#7ee0a3\" font-size=\"14\" font-family=\"sans-serif\"\u003efield is falsified there\u003c/text\u003e\u003ctext x=\"514\" y=\"336\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003eno branching: tests the\u003c/text\u003e\u003ctext x=\"514\" y=\"354\" fill=\"#ff7a90\" font-size=\"14\" font-family=\"sans-serif\"\u003eansatz [17][18], not [1]\u003c/text\u003e\u003ctext x=\"20\" y=\"386\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"sans-serif\" font-style=\"italic\"\u003eGreen = signature survives the control. Red = signature is confounded and carries no evidential weight.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Decision structure for centroid-following observations. A first-moment measurement alone sits at the top node and is compatible with all three confounders; each branch names the measurement that resolves it.*\n\n### Indirect signatures and their confounders\n\n**\"Trajectory-like\" centroid motion.** *Confounder:* a classical Liouville ensemble of finite width also fails to follow any single orbit, and fails in the same qualitative way — the ensemble mean of a nonlinear flow is not the flow of the mean [16]. Observing $\\langle x\\rangle(t)$ deviate from $x_{\\rm cl}(t)$ therefore demonstrates nothing quantum. *Discriminator:* measure the full phase-space quasiprobability by Wigner tomography and test for negativity and for sub-Planck structure. A classical ensemble is a non-negative $\\rho_{\\rm cl}(x,p)$ evolving under Liouville; anything with $W \u003c 0$ is not. Comparing $\\langle x\\rangle_{\\rm qm}(t)$ against the *Liouville-propagated* classical ensemble with matched initial moments — not against a single classical orbit — is the correct null hypothesis, and it is almost never the one used.\n\n**Apparent classicality from decoherence.** *Confounder:* environmental monitoring suppresses the very superpositions the closed evolution builds, so the density matrix becomes approximately positive-Wigner and the system looks classical regardless of what the moment hierarchy is doing. This mechanism is *stronger* than Ehrenfest's and operates on a completely different timescale. *Discriminator:* vary the coupling to the environment (background gas pressure, photon scattering rate, engineered dephasing) and check whether the breakdown time moves. If it tracks the coupling, it is decoherence; a genuine Ehrenfest-time breakdown is coupling-independent and scales as $\\lambda^{-1}\\ln(1/\\hbar_{\\rm eff})$ [14][15].\n\n**Agreement of mean-field simulation with experiment.** *Confounder:* a converged \"Ehrenfest dynamics\" (TDDFT/TDHF/AMD) calculation reproducing an experimental yield tests the *ansatz* — its functional, basis, and initial-condition sampling — not the 1927 identity, which those codes never actually invoke [17][18]. *Discriminator:* target an observable where the mean-field ansatz is known to be wrong: population branching at a conical intersection, long-time detailed balance (Boltzmann ratios), or residual electronic coherence. If the simulation reproduces experiment *there*, something other than mean field is carrying the result — usually a decoherence correction or surface hopping bolted on top. Agreement in regimes where mean field cannot fail is not evidence.\n\nThe asymmetry worth stating plainly: the direct signatures are all *negative-control-rich* — they specify what should happen when the claim is false. The indirect ones are all consistent with the theorem being irrelevant to the observation entirely."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: Four Ehrenfest Theorems, One Name", "markdown": "## Use \u0026 Abuse: Four Ehrenfest Theorems, One Name\n\nFour unrelated results circulate under Ehrenfest's name, and within the one that is actually his, at least three distinct claims get quoted interchangeably. What follows is a field guide to the collisions, ordered by how much damage each does.\n\n### (i) \"$\\langle x\\rangle$ obeys Newton's laws\"\n\nThe single most repeated sentence about the theorem is false as written. What Ehrenfest derived is his eq. (5),\n\n$$m\\frac{d^2\\langle x\\rangle}{dt^2} = \\int dx\\, \\Psi\\Psi^*\\!\\left(-\\frac{\\partial V}{\\partial x}\\right) = \\big\\langle -V'(x)\\big\\rangle,$$\n\nthe force *averaged over the packet* [1][2]. Newton's law for the centroid requires $\\langle V'(x)\\rangle = V'(\\langle x\\rangle)$, and expanding about the mean,\n\n$$-\\langle V'\\rangle = -V'(\\langle x\\rangle) - \\tfrac12\\sigma_x^2 V'''(\\langle x\\rangle) - \\tfrac16\\langle \\delta x^3\\rangle V''''(\\langle x\\rangle) - \\cdots,$$\n\nthe equality holds for all states iff $V''' \\equiv 0$ — free, uniform, or harmonic. Those are exactly the cases Kennard [7] and Schrödinger [5] had already solved exactly, which is a useful diagnostic in itself: the entire class of potentials for which the popular statement is true was in print before the note was written. Note also the direction of the error. The failure is not that the theorem is approximate; it is *exact*. The failure is that the moment hierarchy does not close, so a statement about $\\langle x\\rangle$ alone is not a closed dynamical law. This is a textbook artifact, not Ehrenfest's — he wrote the averaged form and stated the narrowness condition in his own abstract.\n\n### (ii) Quoting the macroscopic spreading time on a chaotic system\n\nEhrenfest's closing numbers are the most-borrowed and least-transferable part of the note: $10^{21}$ s for a gram-scale packet, $10^{-13}$ s for a proton-scale one [1]. Those come from *diffusive* free-particle spreading, algebraic in $\\hbar$. They say nothing whatever about a system with positive Lyapunov exponent $\\lambda$, where $\\sigma_x(t)\\sim\\sigma_0 e^{\\lambda t}$ and the leading correction $\\tfrac12\\sigma_x^2 V'''$ reaches $O(1)$ after\n\n$$\\tau_E \\sim \\lambda^{-1}\\ln(S/\\hbar),$$\n\nthe calculation being Berman and Zaslavsky's [14] and the name Chirikov–Izrailev–Shepelyansky's [15]. The logarithm is brutal: $\\ln(S/\\hbar)$ is a number like 30–70 for anything you can build, so $\\tau_E$ is a few tens of Lyapunov times *regardless of mass*. Zurek and Paz's Hyperion estimate — chaotic tumbling, upper bound of order 20 years before quantum and classical predictions diverge grossly — is the canonical illustration that \"macroscopic\" buys you nothing here ([Scholarpedia, *Ehrenfest time and chaos*](http://www.scholarpedia.org/article/Ehrenfest_time_and_chaos)). A lab-scale chaotic system with $\\lambda \\sim 1\\ \\mathrm{s^{-1}}$ has $\\tau_E$ of order a minute. Any manuscript that cites Ehrenfest's $10^{21}$ s to reassure a referee about a nonlinear system has confused two timescales that differ in their functional dependence on $\\hbar$, not merely in their prefactor.\n\n### (iii) \"Ehrenfest dynamics\" in TDDFT, TDHF, and nonadiabatic molecular dynamics\n\nA category error with its own literature. Ehrenfest's theorem is an exact identity inside one quantum state. \"Ehrenfest dynamics\" is a *mean-field ansatz*: nuclei move classically on the single averaged surface $\\sum_k |c_k|^2 \\nabla E_k$ while the electronic amplitudes are propagated along that one trajectory. Its actual parentage is Mott's classical-path treatment of excitation by heavy-particle collisions ([Proc. Camb. Phil. Soc. 27, 553 (1931)](https://www.cambridge.org/core/journals/mathematical-proceedings-of-the-cambridge-philosophical-society/article/abs/on-the-theory-of-excitation-by-collision-with-heavy-particles/85CEE6CA6B512E626BF020698F02A08E)), and, for the propagation scheme itself, McLachlan's time-dependent variational principle, which minimizes the residual and yields the time-dependent Hartree equations [17]. The name was welded on in molecular scattering by Billing in 1983 [18].\n\nThe tell that it is a different object is that it has pathologies the theorem does not and cannot have. A single averaged trajectory cannot branch, so it is qualitatively wrong downstream of a conical intersection. It violates detailed balance and therefore relaxes to incorrect electronic populations at long times, with the mean energy failing to converge with system size ([J. Chem. Phys. 150, 204124 (2019)](https://pubs.aip.org/aip/jcp/article/150/20/204124/198952/Ehrenfest-and-classical-path-dynamics-with)). It retains spurious electronic coherence after the nuclear wavepackets should have separated. None of these are properties of $m\\,d^2\\langle x\\rangle/dt^2 = -\\langle V'\\rangle$, which is an identity and cannot be wrong. Surface hopping, decoherence corrections, and coupled-trajectory schemes exist to repair the ansatz, not the theorem. Citing Ehrenfest 1927 as the justification for mean-field nuclear trajectories is a derivation-shaped citation with no derivation inside it.\n\n### (iv) Name collisions\n\nEhrenfest's *adiabatic hypothesis* [19] — invariance of $\\oint p\\,dq$ under slow parameter change, and by his memorialists' ranking his major work [11][12] — is thirteen years earlier and mathematically unrelated. Worse, the *quantum* adiabatic theorem (state remains in the instantaneous eigenstate under slow driving) is Born and Fock 1928, not Ehrenfest, yet is routinely filed under his name by association. Add the Ehrenfest classification of phase transitions (1933), the Ehrenfest urn model, and the Ehrenfest paradox of the rotating disc. \"Ehrenfest's theorem\" is not a unique designator; it needs a year attached.\n\n### (v) The generality ladder, climbed backwards\n\nThe identity taught as the \"generalized Ehrenfest theorem,\"\n\n$$\\frac{d\\langle A\\rangle}{dt} = \\frac{1}{i\\hbar}\\langle [A,H]\\rangle + \\Big\\langle \\frac{\\partial A}{\\partial t}\\Big\\rangle,$$\n\nis the Heisenberg/Born–Jordan equation of motion with expectation brackets around it, in print two years earlier and valid for every observable [4]. Ehrenfest wrote two integrals for $H = p^2/2m + V(x)$ in one dimension. The naming inflation runs the wrong way: the *more* general the statement, the *less* of it is his.\n\n### Tells of a hollow claim\n\n- The force appears as $V'(\\langle x\\rangle)$ rather than $\\langle V'(x)\\rangle$, with no statement of what was dropped.\n- Ehrenfest's macroscopic spreading time is quoted in a paper whose Hamiltonian is nonlinear, with no $\\lambda^{-1}\\ln(S/\\hbar)$ anywhere.\n- \"By Ehrenfest's theorem, we propagate nuclei on the mean-field surface\" — the theorem licenses no ansatz.\n- The theorem is invoked as *establishing* the classical limit rather than as a consistency check; Jammer's verdict (analogy, not reduction) [6] and Ballentine–Yang–Zibin's demonstration that it is neither necessary nor sufficient [16] are both absent.\n- No mention of domain conditions, despite a hard-wall or singular potential in play — the boundary terms are real and were only pinned down in 2009 [13].\n- The citation is to a textbook page, never to Z. Phys. **45**, 455. Anyone who has read the two and a half pages knows Ehrenfest disclaimed the result in his first footnote."}, {"id": "status-and-checklist", "title": "Status \u0026 the Believer's Checklist", "markdown": "## Status \u0026 the Believer's Checklist\n\nThe verdict separates cleanly along the seam this dossier has been prying at: **the identity is canonical; the concept attached to it has mutated.**\n\nAs mathematics, Ehrenfest's two equations are not merely correct but structurally load-bearing. They are the $n=1$ rung of the moment hierarchy of the Wigner–Moyal equation, the exactness condition that makes coherent states rigid in quadratic potentials, and — through the time-dependent variational principle — the reason mean-field quantum–classical propagation is even self-consistent at the level of first moments [17]. Every TDHF, TDDFT, and Ehrenfest-MD code inherits momentum conservation from this identity, not from an approximation. Even the domain question, open for eighty-two years, has been closed in the direction the theorem needed: Friesecke and Koppen give hypotheses general enough to cover atomic and molecular Coulomb Hamiltonians, so the relations hold where chemistry actually needs them, and fail only in the boundary-pathological cases (hard walls, insufficient decay, singular form domains) that were always the honest exceptions [13]. Nothing about the identity is in dispute, and nothing is likely to be.\n\nAs a *concept* — \"Ehrenfest's theorem is the classical limit\" — the status is different, and the record is unusually one-sided. Jammer entered the historiographic refutation in 1966: the relations establish an analogy, not a reduction, because there is no superposition principle on the classical side for anything to reduce *to*, and the one genuinely classical-looking case (the oscillator) was Schrödinger's from 1926 [6][5]. Ballentine, Yang and Zibin entered the physical refutation in 1994: satisfaction of the Ehrenfest relations is neither necessary nor sufficient for classicality, and the correct classical comparand for a generic quantum state is a Liouville ensemble, whose centroid also fails to follow any single orbit [16]. Sixty and thirty-two years on respectively, neither refutation has propagated into the standard undergraduate treatment. This is the sharpest available demonstration that the theorem's canonical status was conferred by pedagogy rather than by research use — the same mechanism that named it in the first place [10][3].\n\nThe live frontier is not whether correspondence breaks at $\\tau_E \\sim \\lambda^{-1}\\ln(S/\\hbar)$ — in closed chaotic systems it does, on timescales of seconds for ordinary macroscopic bodies [14][15] — but whether an environment restores it, and at what price. Hernández, Ranard and Riedel prove, for Markovian dynamics with $H=p^2/2m+V(x)$ and Hermitian linear Lindblad operators, that quantum and classical evolutions stay close for *all* observables and for times exponentially longer than $\\tau_E$, provided the environment-induced diffusion satisfies\n\n$$D \\;\\gg\\; \\left(\\frac{\\hbar}{s_H}\\right)^{4/3} D_H,$$\n\nwith $s_H$ and $D_H$ the characteristic action and diffusion scales set by the Hamiltonian ([arXiv:2306.13717](https://arxiv.org/abs/2306.13717), v2 May 2025). The exponent is the content: the required noise *vanishes* as $\\hbar\\to 0$, so classicality is recovered without spoiling reversibility in the limit — decoherence is doing the work, but asymptotically for free. The companion result extends this to general Lindbladians ([arXiv:2307.05326](https://arxiv.org/abs/2307.05326)). Treat both as the current state of the art rather than as settled folklore; the conjectural part (non-Markovian environments, non-Hermitian Lindblad operators, many-body $V$) is still open.\n\n### The Believer's Checklist\n\nIf a paper, talk, or referee report invokes Ehrenfest, these seven items are the minimum diligence. Failing any one of them is not pedantry — each corresponds to a documented error mode above.\n\n1. **Name the assumption you are actually using.** State which of A1–A7 the argument leans on. \"By Ehrenfest's theorem\" is not a citation; $\\langle -V'\\rangle \\approx -V'(\\langle x\\rangle)$ is a claim requiring justification, and the two are different equations.\n\n2. **Exhibit the neglected moment terms with a number.** Write $-\\langle V'\\rangle = -V'(\\langle x\\rangle) - \\tfrac12\\sigma_x^2 V'''(\\langle x\\rangle) - \\tfrac16\\langle\\delta x^3\\rangle V''''(\\langle x\\rangle)-\\dots$ and estimate the first retained term against the leading one for *your* $\\sigma_x$ and *your* $V$. A ratio, not an adjective. If $\\sigma_x^2 V'''/2V' \\sim 10^{-2}$, say so; if you cannot compute it, you do not know whether the hierarchy closes.\n\n3. **Declare which Ehrenfest time you mean, and its $\\hbar$-scaling.** Ehrenfest's own diffusive spreading time is algebraic in $\\hbar$ and macroscopically enormous ($10^{21}$ s at $m=1$ g) [1]. The chaotic $\\tau_E \\sim \\lambda^{-1}\\ln(S/\\hbar)$ is logarithmic and macroscopically *short* [15]. Quoting the first while working in the regime of the second is the commonest abuse in the literature.\n\n4. **Distinguish theorem from ansatz, and cite the right lineage.** If nuclei are moving on $\\sum_k |c_k|^2 \\nabla E_k$, that is mean-field propagation from a variational principle — McLachlan [17], named by Billing [18] — not a consequence of the 1927 identity. Its pathologies (no branching at conical intersections, violated detailed balance, spurious residual coherences) are properties of the ansatz, and the [ongoing repair literature](https://pubs.aip.org/aip/jcp/article/150/20/204124/198952/Ehrenfest-and-classical-path-dynamics-with) is about the ansatz too.\n\n5. **Specify the classical comparand.** Single trajectory or Liouville ensemble? Divergence of $\\langle x\\rangle(t)$ from one orbit is *expected* behaviour for an ensemble and is evidence of nothing [16].\n\n6. **Check the boundary and domain conditions.** Two integrations by parts must have vanishing boundary terms. Hard walls, non-decaying states, and singular potentials are not covered by self-adjointness of $H$ alone; cite the actual hypotheses [13].\n\n7. **If decoherence is carrying the argument, say decoherence.** Correspondence past $\\tau_E$ is a statement about environmental diffusion exceeding a threshold, with its own conditions and its own authors ([Hernández–Ranard–Riedel](https://arxiv.org/abs/2306.13717)). Attributing it to a two-and-a-half-page note from 1927 whose author explicitly disclaimed priority in his own footnote is the last inversion this dossier can flag [2]."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\n### (a) What I would defend with my reputation\n\nThree things.\n\nFirst: **the identity is exact and it is not Ehrenfest's alone.** For $H = p^2/2m + V(x)$ with $\\psi(t)$ in the appropriate form domain,\n\n$$m\\,\\frac{d^2\\langle x\\rangle}{dt^2} = -\\Big\\langle \\frac{\\partial V}{\\partial x}\\Big\\rangle$$\n\nholds with no $\\hbar\\to 0$, no wave-packet assumption, no semiclassical anything. It is a corollary of the Born–Jordan equations of motion of September 1925 [4], and Ehrenfest said as much in his own abstract — \"a brief elementary calculation\" — and in a footnote naming seven prior works [1][2]. Anyone who presents the 1927 note as the discovery of the result has not read the 1927 note.\n\nSecond: **the theorem does not deliver the classical limit, and Ehrenfest never said it did.** The right-hand side is $-\\langle V'\\rangle$, not $-V'(\\langle x\\rangle)$; the difference $-\\tfrac12\\sigma_x^2 V'''(\\langle x\\rangle) - \\dots$ vanishes identically only for $V''' \\equiv 0$. What you have otherwise is an unclosed moment hierarchy — the first cumulant driven by the second, the second by the third — structurally the same closure pathology as BBGKY. Jammer's 1966 reading, that this establishes an analogy and not a reduction (classical mechanics has no superposition principle to reduce *to*), is the correct one and remains the single most reliably omitted paragraph in graduate instruction [6].\n\nThird: **quoting Ehrenfest's $10^{21}\\,\\mathrm{s}$ at a chaotic system is malpractice.** His estimate is a diffusive, algebraic-in-$\\hbar$ spreading time for a regular packet [1]. The chaotic Ehrenfest time is $\\tau_E \\sim \\lambda^{-1}\\ln(S/\\hbar)$ [14][15] — logarithmic, hence brutally insensitive to how macroscopic your system is. These are not the same quantity with different numbers in it; they are different functional dependences wearing one name.\n\n### (b) What is shakier than the literature admits\n\nThe **domain conditions**. Every textbook derivation performs two integrations by parts and discards the boundary terms without comment. Self-adjointness of $H$ does not license this — the required condition is membership in a suitable form domain, and it was not stated rigorously until 2009 [13]. The infinite square well is not a pathological curiosity; it is the case everyone teaches first, and there the naive relation acquires wall contributions.\n\nThe **decoherence rescue**. I accept environment-induced suppression of long-range superpositions as the physically operative mechanism, but the literature routinely elides two claims: that decoherence restores *classical trajectories*, and that it restores *classical ensembles*. Only the second is established. The pointer basis is derived from the interaction Hamiltonian in model systems, not in general, and the residual step from a diagonalized density matrix to definite outcomes is imported, not proven (verify).\n\nThe **$\\hbar\\to0$ theorems** (Hepp, Hagedorn) (verify) are genuine, but their error bounds are stated for finite times and typically degrade as $e^{\\lambda t}$ — precisely the regime where you wanted them.\n\nAnd a naming complaint that is really a physics complaint: \"**Ehrenfest dynamics**\" in TDDFT/TDHF is a mean-field ansatz descended from Mott's classical-path method (verify) and McLachlan's variational principle [17], christened by Billing in 1983 [18]. It cannot branch at a conical intersection, violates detailed balance, and retains unphysical coherences. Citing the 1927 note in its methods section is a category error dressed as a derivation.\n\n### (c) Three open questions, ranked\n\n1. **Under what environmental coupling strength is correspondence restored beyond $\\tau_E$, sharply?** The claim that diffusion above a threshold defeats logarithmic breakdown deserves a theorem with constants, not model demonstrations (verify) — it is the hinge on which macroscopic realism hangs.\n2. **What is the correct closure of the moment hierarchy for chaotic $V$?** Truncating at second order is the physics equivalent of a Reynolds-stress guess; nobody has characterized the truncation error's growth rate against $\\lambda$.\n3. **Can the 2009 form-domain conditions [13] be extended to unbounded and singular-boundary systems** — walls, hard cores, confining traps — so the standard teaching example stops being the standard counterexample?\n\n**Reading path:**\n\n1. Ehrenfest 1927 [1][2] — two and a half pages; read the abstract's self-limitation and the footnote before anything written about it.\n2. Born \u0026 Jordan 1925 [4] — where the identity actually first appears, in full generality.\n3. Ruark 1928 [9] — the generalization to arbitrary conservative systems plus the quantum virial theorem, one year later and largely unread.\n4. Jammer 1966 [6] — the historiographic correction: analogy, not reduction.\n5. Friesecke \u0026 Koppen 2009 [13] — the hypotheses everyone integrates by parts past."}], "references": [{"n": 1, "title": "Bemerkung über die angenäherte Gültigkeit der klassischen Mechanik innerhalb der Quantenmechanik", "authors": ["Paul Ehrenfest"], "year": 1927, "venue": "Zeitschrift für Physik 45, 455–457 (received 5 September 1927)", "url": "https://link.springer.com/article/10.1007/BF01329203", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Remark on the approximate validity of classical mechanics within quantum mechanics", "authors": ["Paul Ehrenfest", "D. H. Delphenich (translator)"], "year": 1927, "venue": "English translation of Z. Phys. 45, 455–457; neo-classical-physics.info translation archive", "url": "http://www.neo-classical-physics.info/uploads/3/4/3/6/34363841/ehrenfest_-_theorem.pdf", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Remarks concerning the status \u0026 some ramifications of Ehrenfest's Theorem", "authors": ["Nicholas A. Wheeler"], "year": 1998, "venue": "Reed College Physics Department, unpublished essay", "url": "https://www.reed.edu/physics/faculty/wheeler/documents/Quantum%20Mechanics/Miscellaneous%20Essays/Ehrenfest's%20Theorem.pdf", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Zur Quantenmechanik", "authors": ["Max Born", "Pascual Jordan"], "year": 1925, "venue": "Zeitschrift für Physik 34, 858–888 (received 27 September 1925)", "url": "https://link.springer.com/article/10.1007/BF01328531", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Der stetige Übergang von der Mikro- zur Makromechanik", "authors": ["Erwin Schrödinger"], "year": 1926, "venue": "Die Naturwissenschaften 14, 664–666", "url": "https://link.springer.com/article/10.1007/BF01507634", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "The Conceptual Development of Quantum Mechanics", "authors": ["Max Jammer"], "year": 1966, "venue": "McGraw-Hill, New York (p. 363)", "url": "https://archive.org/details/conceptualdevelo0000jamm", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Zur Quantenmechanik einfacher Bewegungstypen", "authors": ["Earle Hesse Kennard"], "year": 1927, "venue": "Zeitschrift für Physik 44, 326–352", "url": "https://link.springer.com/article/10.1007/BF01391200", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Über den anschaulichen Inhalt der quantentheoretischen Kinematik und Mechanik", "authors": ["Werner Heisenberg"], "year": 1927, "venue": "Zeitschrift für Physik 43, 172–198", "url": "https://link.springer.com/article/10.1007/BF01397280", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "The Zeeman Effect and Stark Effect of Hydrogen in Wave Mechanics; The Force Equation and the Virial Theorem in Wave Mechanics", "authors": ["Arthur Edward Ruark"], "year": 1928, "venue": "Physical Review 31, 533–538", "url": "https://journals.aps.org/pr/abstract/10.1103/PhysRev.31.533", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "The Fundamental Principles of Quantum Mechanics with Elementary Applications", "authors": ["Edwin C. Kemble"], "year": 1937, "venue": "McGraw-Hill, New York (p. 49)", "url": "https://archive.org/details/fundamentalprinc0000kemb", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "Nachruf Paul Ehrenfest (translated as 'Paul Ehrenfest in Memoriam')", "authors": ["Albert Einstein"], "year": 1934, "venue": "Almanak van het Leidsche Studenten-Corps, Leiden; English version in Out of My Later Years (Philosophical Library, 1950)", "url": "https://ilorentz.org/history/einstein/struggles_of_Ehrenfest.pdf", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Paul Ehrenfest, Volume 1: The Making of a Theoretical Physicist", "authors": ["Martin J. Klein"], "year": 1970, "venue": "North-Holland, Amsterdam", "url": "https://archive.org/details/paulehrenfest0000klei", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "On the Ehrenfest theorem of quantum mechanics", "authors": ["Gero Friesecke", "Mario Koppen"], "year": 2009, "venue": "Journal of Mathematical Physics 50, 082102", "url": "https://arxiv.org/abs/0907.1877", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Condition of stochasticity in quantum nonlinear systems", "authors": ["G. P. Berman", "G. M. Zaslavsky"], "year": 1978, "venue": "Physica A 91, 450–460", "url": "https://ui.adsabs.harvard.edu/abs/1978PhyA...91..450B/abstract", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "Quantum chaos: localization vs. ergodicity", "authors": ["Boris V. Chirikov", "Felix M. Izrailev", "Dima L. Shepelyansky"], "year": 1988, "venue": "Physica D 33, 77–88 (following Sov. Sci. Rev. C 2, 209, 1981)", "url": "https://www.quantware.ups-tlse.fr/chirikov/publquant.html", "cited_by": null, "bucket": "archive"}, {"n": 16, "title": "Inadequacy of Ehrenfest's theorem to characterize the classical regime", "authors": ["Leslie E. Ballentine", "Yumin Yang", "J. P. Zibin"], "year": 1994, "venue": "Physical Review A 50, 2854–2859", "url": "https://link.aps.org/doi/10.1103/PhysRevA.50.2854", "cited_by": null, "bucket": "archive"}, {"n": 17, "title": "A variational solution of the time-dependent Schrödinger equation", "authors": ["A. D. McLachlan"], "year": 1964, "venue": "Molecular Physics 8(1), 39–44", "url": "https://www.tandfonline.com/doi/abs/10.1080/00268976400100041", "cited_by": null, "bucket": "archive"}, {"n": 18, "title": "On the use of Ehrenfest's theorem in molecular scattering", "authors": ["Gert Due Billing"], "year": 1983, "venue": "Chemical Physics Letters 100(6), 535–539", "url": "https://www.sciencedirect.com/science/article/abs/pii/0009261483874235", "cited_by": null, "bucket": "archive"}, {"n": 19, "title": "Adiabatic invariants and the theory of quanta", "authors": ["Paul Ehrenfest"], "year": 1917, "venue": "The London, Edinburgh, and Dublin Philosophical Magazine, Ser. 6, 33 (198), 500–513; reprinted in Van der Waerden, Sourc", "url": "https://www.tandfonline.com/doi/abs/10.1080/14786440608635664", "cited_by": null, "bucket": "archive"}, {"n": 20, "title": "Recherches sur la théorie des quanta", "authors": ["Louis de Broglie"], "year": 1924, "venue": "Doctoral thesis, Faculté des Sciences de Paris (Masson, 1925)", "url": "https://tel.archives-ouvertes.fr/tel-00006807", "cited_by": null, "bucket": "archive"}], "nsec": 7, "nref": 20, "teaser": "Ehrenfest 1927 as exact identity, textbook myth, and the logarithm that ends the classical limit."}</script>

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x
  .replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}')          /* \,^{2} term symbols */
  .replace(/([_^])\\([a-zA-Z]+)(?![A-Za-z{])/g,'$1{\\$2}') /* T_\min -> T_{\min} */
  .replace(/\\iiiint/g,'\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int\\!\\!\\!\\!\\int'); /* unsupported quad integral */}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* ---- special blocks, rendered BEFORE the prose (as in the app) ---- */
  var hasTL=D.timeline&&D.timeline.length, hasNG=D.neglected&&D.neglected.length, hasCF=D.conflations&&D.conflations.length;
  var pre='';
  if(hasTL){
    pre+='<section class="block" id="blk-timeline"><h3>Origins timeline</h3><div class="lead">How the field actually arrived — scroll through it, with the paper that marks each turn.</div>'+
      '<div class="tslider" id="tslider">'+
      D.timeline.map(function(t){var ref=(t.ref?' <a class="cite" href="#ref-'+(+t.ref||0)+'">['+esc(t.ref)+']</a>':'');
        return '<div class="tcard"><div class="yr">'+esc(t.year)+'</div><div class="ev">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' · '))+'</div>':'')+'<div class="kd">'+esc(t.kind||'')+ref+'</div></div>';}).join('')+
      '</div><div class="thint">drag or scroll through time →</div></section>';
  }
  if(hasNG){
    pre+='<section class="block" id="blk-forgotten"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){var ref=(n.ref?' <a class="cite" href="#ref-'+(+n.ref||0)+'">['+esc(n.ref)+']</a>':'');return '<div class="ncard"><div class="nm">'+esc(n.name)+ref+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>'+
      (D.credit_audit?'<div class="callout" style="margin-top:22px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>':'')+'</section>';
  }
  var langHtml='';
  if(hasCF){
    langHtml='<section class="block" id="blk-language"><h3>Watch your language</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></section>';
  }
  /* prose sections */
  var sectionsHtml=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* references (kept at the end) */
  var refsHtml='';
  if(D.references&&D.references.length){
    refsHtml='<div class="block" id="blk-refs"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  /* contents: the special blocks earn their place, then the sections, then refs */
  var tocItems=[];
  if(hasTL) tocItems.push('<a href="#blk-timeline">Origins timeline</a>');
  if(hasNG) tocItems.push('<a href="#blk-forgotten">The forgotten hands</a>');
  tocItems=tocItems.concat(D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}));
  if(hasCF) tocItems.push('<a href="#blk-language">Watch your language</a>');
  if(D.references&&D.references.length) tocItems.push('<a href="#blk-refs">References</a>');
  var toc='<nav class="toc"><div class="tl">Contents</div>'+tocItems.join('')+'</nav>';
  var body=pre+sectionsHtml+langHtml+refsHtml;
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* drag-to-scroll the timeline slider */
  var ts=document.getElementById('tslider');
  if(ts){var dn=false,sx=0,sl=0;
    ts.addEventListener('pointerdown',function(e){dn=true;sx=e.clientX;sl=ts.scrollLeft;ts.classList.add('grab');});
    ts.addEventListener('pointermove',function(e){if(dn)ts.scrollLeft=sl-(e.clientX-sx);});
    ts.addEventListener('pointerup',function(){dn=false;ts.classList.remove('grab');});
    ts.addEventListener('pointerleave',function(){dn=false;ts.classList.remove('grab');});
  }
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
