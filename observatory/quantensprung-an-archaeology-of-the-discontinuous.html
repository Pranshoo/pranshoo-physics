dern Physics 70, 101", "kind": "revival", "ref": null}, {"year": 2007, "event": "Quantum-jump trajectory of a photon number state in a microwave cavity QED experiment — jumps observed in a bosonic, not atomic, degree of freedom", "who": "Sébastien Gleyzes et al. (Haroche group)", "work": "Nature 446, 297", "kind": "observation", "ref": null}, {"year": 2019, "event": "Quantum jump in a superconducting artificial atom shown to be continuous, partly deterministic, and reversible mid-flight — revises Bohr's instantaneity dogma", "who": "Z. K. Minev et al. (Devoret group)", "work": "Nature 570, 200", "kind": "observation", "ref": null}], "neglected": [{"name": "John C. Slater", "role": "Co-author of BKS and originator of the virtual-oscillator picture; routinely omitted from English textbooks that credit only Bohr and Kramers for the 1924 statistical-jump proposal", "evidence": "Slater's own account in Physical Review 25, 395 (1925) and in his autobiographical 'Solid-State and Molecular Theory: A Scientific Biography' (Wiley, 1975)", "ref": null}, {"name": "Walther Bothe \u0026 Hans Geiger", "role": "Experimentally established that individual jumps conserve energy and momentum, refuting BKS; usually mentioned in passing but their 1925 coincidence technique was the decisive event making jumps 'real'", "evidence": "Bothe Nobel Lecture 1954; Zeitschr. f. Physik 32, 639 (1925)", "ref": null}, {"name": "Peter E. Toschek", "role": "Hamburg group leader behind the 1986 Sauter–Neuhauser–Blatt–Toschek observation; English-language reviews often privilege the Dehmelt and Wineland groups despite simultaneous publication", "evidence": "Toschek's review 'Quantum jumps' in Phys. Reports and Wineland Nobel Lecture (2013) explicitly cites the three-group simultaneity", "ref": null}, {"name": "Richard J. Cook", "role": "Co-author of the 1985 PRL that turned Dehmelt's qualitative shelving idea into a quantitative prediction (waiting-time distribution, telegraph statistics); rarely named alongside Kimble in textbooks", "evidence": "PRL 54, 1023 (1985); Cook's later monograph chapter in Progress in Optics 28 (1990)", "ref": null}, {"name": "Howard J. Carmichael", "role": "Independently developed the quantum-trajectory formalism (1989–93) that made 'jumps' a legitimate computational object; the Mølmer–Castin–Dalibard paper is more cited in Europe, Carmichael's Springer Lecture Notes (m18, 1993) more in the US", "evidence": "Carmichael, 'An Open Systems Approach to Quantum Optics', Springer LNP m18 (1993); his 1989 preprint circulated before Dalibard et al. submitted", "ref": null}], "conflations": [{"claim": "'Quantum jump' = a single discrete, instantaneous transition between energy eigenstates", "clarification": "Three distinct objects share the name: (i) Bohr's ontological discontinuity between stationary states, (ii) a click in a continuous-measurement record produced by a quantum filter (the telegraph signal in shelving experiments), and (iii) a stochastic discontinuity in a simulated state vector under a Monte-Carlo unravelling of a master equation. (ii) and (iii) depend on the choice of measurement / unravelling and are not unique; (i) was reinterpreted by Minev et al. 2019 as having finite duration and being partly predictable."}, {"claim": "Quantum jumps are intrinsically random and irreversible", "clarification": "Stochastic only relative to a particular measurement record. In a quantum-trajectory description, between jumps the wave function evolves under a non-Hermitian Hamiltonian; conditioning on the absence of a click already changes the state. Minev et al. 2019 explicitly demonstrated mid-flight reversal by intercepting the deterministic part of the trajectory."}, {"claim": "Einstein's 1917 A coefficients describe 'the' jump rate", "clarification": "They describe spontaneous emission of a free atom in vacuum and assume a Markovian, weak-coupling, rotating-wave regime. In strong-coupling cavity QED or structured reservoirs, fluorescence is non-exponential, jumps are non-Markovian, and the very notion of a well-defined jump time can fail."}, {"claim": "Quantum jumps and wavefunction collapse are the same phenomenon", "clarification": "Bohrian jumps are between energy eigenstates and are tied to emission/absorption; collapse is a more general projection onto a measurement basis. Quantum-trajectory jumps are projective only in the limit of perfect, instantaneous detection — they sit between the two in the open-systems hierarchy."}, {"claim": "BKS theory was a discarded curiosity", "clarification": "BKS is the historical hinge that forced the empirical question of whether single jumps conserve energy; the Bothe–Geiger and Compton–Simon experiments of 1925 are the actual reason post-1925 quantum mechanics retains exact conservation in individual events. The conceptual residue (virtual oscillators, response functions) re-emerged in Kramers–Heisenberg dispersion theory and later linear-response formalism."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins, Naming, and the Forgotten Hands", "markdown": "## Origins, Naming, and the Forgotten Hands\n\nThe concept now called the *quantum jump* and the word *Quantensprung* have separate histories that are routinely conflated in textbooks. The concept entered physics in July 1913 with Bohr's first trilogy paper [71]; the word, in anything like its modern polemical sense, was forged a dozen years later by Bohr's opponents — chiefly Schrödinger — and only retroactively glued onto the older idea. Recovering the gap between the two clarifies why Einstein, Bohr, and Schrödinger could appear to be discussing the same object while in fact arguing about different things.\n\n### 1913: Bohr's Übergang, not Sprung\n\nBohr's postulates as stated in the trilogy are linguistically modest. Atoms inhabit a discrete family of *stationary states* in which, by stipulation, no radiation is emitted; transitions between two such states with energies $E_n$ and $E_m$ are accompanied by monochromatic radiation of frequency\n\n$$h\\nu_{nm} = E_n - E_m.$$\n\nIn the orbital picture, the quantization condition that singles out the allowed states is\n\n$$L_n = n\\hbar, \\qquad n = 1,2,3,\\ldots,$$\n\nwith the hydrogenic spectrum $E_n = -\\tfrac{1}{2}m_e c^2 \\alpha^2/n^2$ following at once. Bohr writes — in English — of a \"passing of the systems between different stationary states\" and uses \"transition\" throughout; the closest he comes to dramatising the discontinuity is the phrase \"process not capable of being treated on the ordinary mechanical principles\" [71]. The standard German translation that propagated through Sommerfeld's Munich school renders this as *Übergang*, and Sommerfeld himself in *Atombau und Spektrallinien* (1919) uses *Übergang* and *Quantenübergang*, not *Sprung*. The discontinuity is mathematical (an index change $n \\to m$) rather than rhetorical. As [Bokulich's reconstruction of the early Bohr atom](https://arxiv.org/pdf/1311.0252) emphasises, Bohr deliberately avoided picturing what occurs *during* a transition; the silence was epistemic, not metaphysical.\n\n### 1916–1917: Einstein recasts the transition as a rate\n\nEinstein's *Zur Quantentheorie der Strahlung* [72], anticipated by the shorter *Mitteilungen der Physikalischen Gesellschaft Zürich* paper of 1916, performs two acts that durably altered the concept. First, the transition acquires a stochastic timing — Bohr's \"process\" becomes a Poissonian event with a *rate*. Second, three distinct elementary acts are introduced for a two-level system $\\{m,n\\}$ with $E_n\u003eE_m$: spontaneous emission with rate $A_{nm}$, and stimulated emission and absorption with rates $B_{nm}\\rho(\\nu)$ and $B_{mn}\\rho(\\nu)$ respectively. Detailed balance in thermal equilibrium fixes\n\n$$\\frac{A_{nm}}{B_{nm}} = \\frac{8\\pi h\\nu^3}{c^3}, \\qquad g_m B_{mn} = g_n B_{nm}.$$\n\nA subtlety routinely lost in modern citations is that Einstein's derivation also recovers momentum transfer $h\\nu/c$ to the atom in each elementary act — Einstein insists on this directional asymmetry precisely because, two years earlier, Bohr had been willing to entertain its absence (see §3 of [72] and Einstein's letter to Besso of 1916). The A/B framework is what most physicists now *mean* by \"the quantum jump rate,\" even when crediting Bohr.\n\nTwo limitations, silently dropped in the textbook lineage, must be flagged here because they recur in §2 and §7 of this dossier. (i) The derivation assumes weak coupling and a structureless, broadband reservoir; in cavity QED the very ratio above is renormalised by the Purcell factor. (ii) \"Spontaneous\" is a vacuum-state property of the joint atom–field system, not an intrinsic atomic attribute; the jump rate is a partial trace and inherits the assumptions of that trace.\n\n### 1924: BKS and the effacement of Slater\n\nThe third move belongs to a 23-year-old American postdoc. John C. Slater arrived in Copenhagen at the end of 1923 with a definite mechanical proposal: each atom in a stationary state acts as if surrounded by a \"virtual\" electromagnetic field, generated by oscillators tuned to the *transition* frequencies $\\nu_{nm}$, and this virtual field guides discrete light quanta carrying real energy and momentum. Slater's original picture, in short, retained the photon and retained strict energy–momentum conservation in individual events; the novelty was the virtual-oscillator response, which a year later Kramers and Heisenberg would convert into the dispersion formula and Heisenberg into matrix mechanics.\n\nWhat appeared as Bohr–Kramers–Slater in the Philosophical Magazine of May 1924 [73] is a hybrid in which Bohr and Kramers retained Slater's virtual oscillators but excised the photons and replaced strict conservation with statistical conservation: energy and momentum balance only on the ensemble, not in each elementary act. Slater objected at the time and, three decades later, made the point pointedly in his autobiographical *Solid-State and Molecular Theory* (1975), recalling that \"the paper had to be written entirely on Bohr's terms.\" Contemporary historical work corroborates the asymmetry: [Stolzenburg's editorial commentary in *Niels Bohr Collected Works* vol. 5](https://www.scientificlib.com/en/Physics/LX/BohrKramersSlaterTheory.html) and [Kragh's reconstruction](https://link.springer.com/chapter/10.1007/978-3-540-70626-7_19) both document that the abandonment of conservation \"was apparently due to Bohr and Kramers and originally rejected by Slater.\" English-language pedagogy nonetheless tends to flatten the three names into a single Copenhagen voice. The conceptual residue of Slater's authentic contribution — virtual oscillators as response functions at the transition frequencies — is precisely what Kramers–Heisenberg dispersion theory and, eventually, linear-response formalism inherited; that lineage runs through Slater, not through the abandoned non-conservation hypothesis.\n\n### 1925–1926: the polemical coinage of *Quantensprung*\n\nThe word *Quantensprung* in its now-familiar sense crystallised after wave mechanics gave Schrödinger a continuous alternative to attack. The decisive episode is Schrödinger's September 1926 visit to Bohr's house in Copenhagen, recounted by Heisenberg in *Der Teil und das Ganze* (1969) and quoted in essentially every history of quantum mechanics since: *\"Wenn es doch bei dieser verdammten Quantenspringerei bleiben soll, so bedauere ich, mich überhaupt jemals mit der Quantentheorie beschäftigt zu haben.\"* The recollection is Heisenberg's, written more than four decades after the fact; no contemporary minutes survive, and the exact wording should be treated as paraphrase rather than transcript (see the [Born Rule centenary review](https://arxiv.org/pdf/2502.08545) for the textual provenance). What is well documented is Schrödinger's published continuation of the argument: his 1952 *Are there quantum jumps?* essays [75] explicitly use *Quantensprünge* as a term of art for the very picture he is rejecting, and traces the usage to \"the now customary parlance\" that had hardened after 1927. The genealogy is therefore inverted relative to the textbook story: Bohr coined the *concept* and Sommerfeld's translators rendered it as *Übergang*; opponents of the Copenhagen ontology coined the *label* *Quantensprung*, and through a half-century of pedagogical osmosis the label was assigned back to Bohr.\n\nThat inversion matters for what follows. When the 1925 Bothe–Geiger coincidences [74] forced the empirical reality of energy-conserving single events back into the theory — the subject of §3 — what was vindicated was Slater's instinct, not Bohr's BKS retreat; and when, in 1952, Schrödinger asked *Sind Quantensprünge wirklich?*, the object of his polemic was a composite of three different things that nineteenth-century vocabulary had bundled under a single Germanic noun. Section 5 will untangle that bundle."}, {"id": "physics-of-the-jump", "title": "The Pedagogical Core: Rates, Amplitudes, and Unravellings", "markdown": "## The Pedagogical Core: Rates, Amplitudes, and Unravellings\n\nThree formal layers sit between Bohr's 1913 postulate and a modern photon-counting trace: Einstein's rate coefficients (1916/17), the Fermi-golden-rule amplitude calculation that supplies them, and the Lindblad master equation whose unravelling produces the individual jump records actually recorded in shelving and circuit-QED experiments. Each layer hardens specific assumptions into the formalism; many textbook applications strip those assumptions silently.\n\n### Einstein's coefficients: rates from detailed balance\n\nEinstein's 1916 derivation [72] requires no perturbation theory and no quantisation of the field. Take a two-level atom $\\{|g\\rangle,|e\\rangle\\}$ with gap $\\hbar\\omega_0$ in thermal contact with an isotropic radiation field of spectral density $u(\\omega,T)$. Postulate three elementary rates\n$$\\Gamma_{g\\to e}=B_{ge}u(\\omega_0),\\qquad \\Gamma_{e\\to g}^{\\text{stim}}=B_{eg}u(\\omega_0),\\qquad \\Gamma_{e\\to g}^{\\text{spont}}=A.$$\nDemanding steady state at every $T$ with Boltzmann populations $N_e/N_g=e^{-\\hbar\\omega_0/k_BT}$ forces $B_{ge}=B_{eg}\\equiv B$ and\n$$\\frac{A}{B}=\\frac{\\hbar\\omega_0^3}{\\pi^2 c^3}.$$\nThe argument is purely thermodynamic; the jumps themselves are postulated, not derived. What is genuinely new in 1916 is *stochasticity with a definite rate* — a step the 1913 trilogy [71] left undefined. Einstein already warns in the closing paragraph that the direction of each spontaneous emission is \"left to chance\", a remark Schrödinger later weaponised [75]. BKS [73] tried to drop exact conservation from this picture and was empirically defeated within a year.\n\nHidden assumptions: (i) thermal, isotropic, stationary radiation; (ii) sharp lines, so the rate depends on $u(\\omega_0)$ only; (iii) factorised statistics — the atom forgets each emission, equivalent to a Markov assumption on the field; (iv) a single mode pair couples to the transition.\n\n### Fermi's golden rule: where the rate comes from\n\nTo compute $A$ rather than postulate it, quantise the field and treat the dipole coupling perturbatively. In the interaction picture, $H_I(t)=-\\mathbf{d}\\cdot\\mathbf{E}(t)$. First-order time-dependent perturbation theory for $|i\\rangle\\to|f\\rangle$ gives\n$$P_{i\\to f}(t)=\\frac{1}{\\hbar^2}\\left|\\int_0^t dt'\\,\\langle f|H_I(t')|i\\rangle\\right|^2.$$\nSumming over a quasi-continuum of final field states with density $\\rho(\\omega_f)$ and taking $t$ large compared with the inverse reservoir bandwidth but small compared with the inverse population rate yields\n$$\\Gamma_{i\\to f}=\\frac{2\\pi}{\\hbar}\\,|\\langle f|V|i\\rangle|^2\\,\\rho(E_f).$$\nThe two limits are mutually consistent only if the reservoir is broad-band — the standard Markov condition — and the perturbation is weak enough that the population change over $t$ is small. Applied to the free-space vacuum mode density one recovers the Wigner–Weisskopf result\n$$A=\\frac{\\omega_0^3|\\mathbf{d}_{eg}|^2}{3\\pi\\varepsilon_0\\hbar c^3}.$$\nThe rotating-wave approximation (RWA) enters when one drops the $e^{+i(\\omega+\\omega_0)t}$ counter-rotating term; it is harmless for $|\\omega-\\omega_0|\\ll\\omega_0$ and lethal in ultrastrong coupling. The conceptual move from Einstein to Fermi is from *rate* to *amplitude* — Heisenberg's 1925 matrix mechanics made transition amplitudes between stationary states the kinematical primary, and the golden rule is the perturbative remnant of that move.\n\n### The Lindblad master equation\n\nFor a system coupled to a bath of harmonic modes, tracing out the bath under three nested assumptions — Born (weak coupling, factorised state at each instant), Markov (bath correlation time $\\tau_B$ much shorter than the system relaxation time $1/\\Gamma$), and secular/rotating-wave (drop terms oscillating faster than $\\Gamma$) — yields the Gorini–Kossakowski–Sudarshan–Lindblad form\n$$\\dot\\rho=-\\frac{i}{\\hbar}[H,\\rho]+\\sum_k\\!\\left(L_k\\rho L_k^\\dagger-\\tfrac12\\{L_k^\\dagger L_k,\\rho\\}\\right).$$\nFor a radiatively damped two-level atom $L=\\sqrt{\\Gamma}\\,\\sigma_-$ with $\\Gamma=A$. The equation is rigorously a completely positive trace-preserving (CPTP) semigroup; it inherits its physical legitimacy from the three approximations and loses it when any fails. Structured photonic reservoirs (band edges, photonic crystals) violate Markov; ultrastrong cavity coupling violates RWA; strong driving violates Born. Each failure has its own corrective formalism (time-convolutionless projection, polaron transformation, reaction-coordinate mapping), and each can predict non-exponential decay — the regime in which \"the jump rate\" ceases to be a well-defined number, as van Kampen emphasises generally for non-Markov processes [48].\n\n### Unravelling: from density matrix to single trajectories\n\nThe master equation describes an ensemble. A shelving record [77] or a single circuit-QED dispersive trace [82] is one realisation of a stochastic process whose mean reproduces $\\rho(t)$. The reconstruction is the *unravelling*. Following Dalibard–Castin–Mølmer [81] (and independently Carmichael, and Dum–Zoller–Ritsch), evolve a normalised state $|\\psi(t)\\rangle$ under the non-Hermitian effective Hamiltonian\n$$H_{\\text{eff}}=H-\\frac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k.$$\nBetween jumps the unnormalised norm decays at rate $\\sum_k\\langle L_k^\\dagger L_k\\rangle$. At each timestep $dt$ draw a uniform $\\epsilon\\in[0,1)$; if $\\epsilon\u003cdp=dt\\sum_k\\langle L_k^\\dagger L_k\\rangle$ apply the jump\n$$|\\psi\\rangle\\;\\longrightarrow\\;\\frac{L_k|\\psi\\rangle}{\\|L_k|\\psi\\rangle\\|}$$\nwith channel $k$ selected with weight $\\langle L_k^\\dagger L_k\\rangle/\\sum_j\\langle L_j^\\dagger L_j\\rangle$; otherwise rescale by $(1-dp)^{-1/2}$. Averaging $|\\psi(t)\\rangle\\langle\\psi(t)\\rangle$ over realisations recovers $\\rho(t)$ exactly.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eUnravelling a Lindblad equation into jump trajectories\u003c/title\u003e\u003cdefs\u003e\u003cmarker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"20\" y=\"28\" fill=\"#e8e6e1\" font-size=\"15\" font-family=\"serif\"\u003eExcited-state occupation: ensemble vs. two single trajectories\u003c/text\u003e\u003cline x1=\"60\" y1=\"350\" x2=\"700\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"1.2\" marker-end=\"url(#ar)\"/\u003e\u003cline x1=\"60\" y1=\"350\" x2=\"60\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1.2\" marker-end=\"url(#ar)\"/\u003e\u003ctext x=\"660\" y=\"375\" fill=\"#e8e6e1\" font-size=\"14\"\u003etime t\u003c/text\u003e\u003ctext x=\"14\" y=\"70\" fill=\"#e8e6e1\" font-size=\"14\"\u003eP_e(t)\u003c/text\u003e\u003ctext x=\"40\" y=\"105\" fill=\"#e8e6e1\" font-size=\"13\"\u003e1\u003c/text\u003e\u003ctext x=\"40\" y=\"354\" fill=\"#e8e6e1\" font-size=\"13\"\u003e0\u003c/text\u003e\u003cline x1=\"56\" y1=\"100\" x2=\"64\" y2=\"100\" stroke=\"#e8e6e1\"/\u003e\u003cpath d=\"M60,100 C 180,135 320,215 480,290 S 660,343 700,348\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.4\"/\u003e\u003ctext x=\"430\" y=\"265\" fill=\"#7aa2ff\" font-size=\"14\"\u003eensemble: exp(-Gamma t)\u003c/text\u003e\u003cpolyline points=\"60,100 200,100 200,350 320,350 320,100 460,100 460,350 560,350 560,100 640,100 640,350 700,350\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.8\"/\u003e\u003ctext x=\"210\" y=\"92\" fill=\"#ffb86b\" font-size=\"13\"\u003etrajectory 1: no-click rescaling, then sigma_- click\u003c/text\u003e\u003cpolyline points=\"60,100 140,100 140,350 260,350 260,100 380,100 380,350 700,350\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"385\" y=\"135\" fill=\"#7ee0a3\" font-size=\"13\"\u003etrajectory 2: earlier click pattern\u003c/text\u003e\u003cg fill=\"#ff7a90\"\u003e\u003ccircle cx=\"200\" cy=\"225\" r=\"4\"/\u003e\u003ccircle cx=\"320\" cy=\"225\" r=\"4\"/\u003e\u003ccircle cx=\"460\" cy=\"225\" r=\"4\"/\u003e\u003ccircle cx=\"560\" cy=\"225\" r=\"4\"/\u003e\u003ccircle cx=\"140\" cy=\"225\" r=\"4\"/\u003e\u003ccircle cx=\"260\" cy=\"225\" r=\"4\"/\u003e\u003ccircle cx=\"380\" cy=\"225\" r=\"4\"/\u003e\u003c/g\u003e\u003ctext x=\"420\" y=\"395\" fill=\"#ff7a90\" font-size=\"13\"\u003ered dots: photodetection clicks (jump times)\u003c/text\u003e\u003c/svg\u003e\n*Figure: A single excited-state trajectory is piecewise deterministic — population stays near unity between clicks, then is projected to ground — yet the average over realisations reproduces the smooth Lindblad decay $e^{-\\Gamma t}$.*\n\nTwo interpretive points are usually elided. First, the unravelling is *not unique*: the same Lindbladian admits a homodyne unravelling (continuous diffusion of $|\\psi\\rangle$, no jumps) and a heterodyne one (jumps with complex amplitudes). Which is \"physical\" is fixed by the detection scheme, not by the master equation. Second, between jumps $|\\psi\\rangle$ evolves *deterministically* under $H_{\\text{eff}}$ — the no-click record carries information, and conditioning on it bends the trajectory before any photon escapes. This is the formal hook the Minev experiment [82] exploited to catch a jump mid-flight.\n\n### Where each assumption lives\n\n| Step | Markov | Weak coupling | RWA / secular | Free-space specific |\n|---|---|---|---|---|\n| Einstein A, B [72] | yes (factorised emissions) | implicit (linear rates) | implicit (sharp $\\omega_0$) | yes (isotropic $u$) |\n| Fermi golden rule | yes ($t\\gg\\tau_B$) | yes (first order) | yes (drop counter-rotating) | no |\n| Lindblad / GKSL | yes (semigroup) | yes (Born) | yes (secular) | no |\n| MCWF unravelling [81] | inherited | inherited | inherited | no |\n\nThe pedagogical sequence Einstein $\\to$ Fermi $\\to$ Lindblad $\\to$ MCWF tightens the formal apparatus while propagating the same three approximations end-to-end. The historical sequence Bohr $\\to$ BKS $\\to$ Bothe–Geiger $\\to$ Heisenberg, treated in §3, is what licenses taking those approximations seriously in the first place."}, {"id": "bks-and-the-energy-conservation-crisis", "title": "BKS, Bothe–Geiger, and the Empirical Reality of the Jump", "markdown": "## BKS, Bothe–Geiger, and the Empirical Reality of the Jump\n\nBy the spring of 1924 the Bohr–Einstein picture of stationary states linked by discontinuous emissions had a problem that was at once philosophical and quantitative. Einstein's 1916/17 rate equations [72] gave a perfectly serviceable bookkeeping of intensities, but they did so by treating each individual emission as a stochastic event whose direction was unspecified — the notorious *Nadelstrahlung* that Einstein himself flagged as \"a weakness in the theory\". Bohr was unwilling to swallow needle radiation. Slater, then a postdoctoral visitor at Copenhagen, was unwilling to give up the wave aspect of light. The compromise they reached, with Kramers as the senior theorist in the room, is the paper now universally cited as BKS [73].\n\n### What BKS actually proposed\n\nThe Bohr–Kramers–Slater theory rests on three coupled hypotheses, and it is worth separating them because later commentary tends to fuse them into a single slogan (\"energy conservation is statistical\"):\n\n1. **Virtual oscillators.** Every stationary state of an atom is accompanied by a *Hilfsfeld* — a virtual radiation field whose Fourier components are oscillators tuned to every Bohr frequency $\\omega_{mn}=(E_m-E_n)/\\hbar$ connecting that state to others, *whether or not* the atom has yet jumped. This was Slater's idea, brought intact from his 1924 Harvard thesis; Bohr and Kramers initially resisted it and then absorbed it on condition that the virtual oscillators not actually carry energy.\n2. **Probabilistic coupling.** The virtual field induces transitions in distant atoms with probabilities computed from its classical intensity, but does so non-causally: an atom in Hamburg can be induced to absorb without any real photon having left Copenhagen.\n3. **Statistical conservation.** Energy and momentum are conserved only on the ensemble average. In the individual emission–absorption event there is, on the BKS account, *no* exact bookkeeping; the atom that emits and the atom that absorbs do not need to balance their accounts.\n\nThe third hypothesis is what Pauli, Einstein and Heisenberg pounced on, but the first two are what survived. Statement (3) is also where Slater later insisted he had been overruled: in his 1975 autobiography, and earlier in *Physical Review* **25**, 395 (1925) (verify), he is explicit that his own draft kept exact conservation for the *real* atomic transitions and used the virtual field only as a guide for transition probabilities — a position essentially identical to what Heisenberg–Kramers dispersion theory would adopt a year later. The German co-authors, he says, insisted on (3) over his objections, and his name went on the paper anyway. English-language textbooks routinely render \"BKS\" as a single voice; the historical record disagrees.\n\n### Why the proposal was not obviously absurd\n\nIt is tempting to read BKS as a desperate retreat, but in 1924 it was a serious theoretical option for two reasons. First, the Compton experiment of 1923 had been interpreted within the photon picture using *only* mean energies and momenta — nobody had yet demonstrated event-by-event correlation between the scattered photon and the recoil electron. Second, the Einstein A and B coefficients [72] were, structurally, ensemble quantities; reading them as describing what happens in a single event required an additional ontological commitment that BKS proposed to drop. The price — non-causal coupling between distant atoms — looked tolerable to Bohr because it preserved a wave description of the field and kept the discontinuity confined to atomic interiors.\n\n### Bothe–Geiger: coincidence as ontology\n\nThe decisive experiment was Bothe and Geiger's 1925 *Zeitschrift für Physik* paper [74]. The apparatus is conceptually a pair of detectors viewing a Compton scattering volume: one needle-counter for the scattered X-ray photon, one point-counter (Geiger's *Spitzenzähler*) for the recoil electron. If BKS were right, recoil electrons would appear at a rate set by the *mean* X-ray flux but with no event-by-event correlation; if Einstein were right, every recoil electron would coincide with a scattered photon within the apparatus resolving time.\n\nThe result was stark. Coincidences appeared at the rate demanded by exact per-event conservation, with an accidental-coincidence background consistent with the chance rate $\\tau\\, n_1 n_2$ for resolving time $\\tau\\!\\sim\\!10^{-3}\\,$s and singles rates $n_1,n_2$. Schematically the BKS prediction and the data stand in the relation\n\n$$\n\\frac{N_{\\text{coinc}}^{\\text{obs}}-N_{\\text{coinc}}^{\\text{acc}}}{N_{\\text{Compton}}^{\\text{expected}}}\\;\\approx\\;1,\\qquad\\text{BKS prediction: }\\;0.\n$$\n\nCompton and Simon's cloud-chamber work, published a few months later, made the same point geometrically: the angle of the recoil electron track and the angle of the scattered photon satisfied the kinematic Compton relation on a *per-event* basis, not merely in aggregate. Both results were in print before the year was out, and Bohr's reaction is well documented. In a letter to Fowler in April 1925 he conceded that \"we must be prepared for a still more drastic revision than we had imagined\" — by which he meant abandoning BKS hypothesis (3) wholesale.\n\nThe verdict matters for the present dossier because it converts the quantum jump from a *theoretical* posit into an *experimentally constrained* one. After Bothe–Geiger, any interpretation of quantum mechanics that does not deliver exact per-event conservation for emission–absorption pairs is dead on arrival. This is the constraint that, sixty years later, the single-ion shelving experiments [78,79,80] inherit when they demand that each fluorescence dropout correspond to a single shelving event — and which Minev et al. [82] respect even while showing the jump is not instantaneous.\n\n### What survived: virtual oscillators in Kramers–Heisenberg\n\nBKS hypothesis (3) was buried by Bothe–Geiger; hypotheses (1) and (2) were rehabilitated almost immediately. Within months Kramers and Heisenberg used the virtual-oscillator scheme — stripped of its statistical-conservation baggage — to derive the dispersion formula that bears their names, in which the polarizability of an atom in a field of frequency $\\omega$ takes the now-familiar form\n\n$$\n\\alpha(\\omega)\\;=\\;\\frac{e^2}{m}\\sum_n\\!\\left[\\frac{f_{ng}}{\\omega_{ng}^{2}-\\omega^{2}}\\right]\\;-\\;\\text{(emission terms with negative sign)},\n$$\n\nwith oscillator strengths $f_{ng}$ assigned to each Bohr transition, exactly as Slater's virtual oscillators would have demanded. The Kramers–Heisenberg formula is the direct ancestor of every linear-response calculation in modern condensed-matter physics, and a lineal descendant of BKS hypothesis (1). When Heisenberg shortly after wrote down matrix mechanics, the *Übergangsamplituden* $x_{mn}$ are recognisably the virtual-oscillator amplitudes rebranded as the primary kinematical objects — the jump itself promoted from event to matrix element.\n\n### Why BKS is a hinge, not a curiosity\n\nA common textbook gloss treats BKS as the \"wrong turn\" before \"true\" quantum mechanics. This misreads its function. BKS forced the empirical question that Einstein's 1917 formalism had left open — *do individual transitions conserve energy?* — and Bothe–Geiger answered it. Without that experimental closure, the post-1925 commitment to exact per-event conservation would have been a stipulation; with it, the conservation is a measured fact. Slater's virtual oscillators, meanwhile, propagated forward into dispersion theory, matrix mechanics, the Kramers–Kronig relations, and the entire response-function apparatus. The conceptual residue of a \"discarded\" theory is, in this case, half the toolkit of modern quantum optics — including, by a long inheritance, the non-Hermitian effective Hamiltonians under which a state vector evolves between jumps in the Dalibard–Castin–Mølmer unravelling [81]."}, {"id": "shelving-and-the-1986-triple-priority", "title": "Electron Shelving and the 1986 Three-Way Observation", "markdown": "## Electron Shelving and the 1986 Three-Way Observation\n\nBy the mid-1970s the empirical reality of the jump — established by Bothe–Geiger and absorbed into the Born rule — was no longer in dispute, but no one had ever *watched* a single quantum system jump in real time. Every fluorescence measurement averaged over $\\sim 10^{10}$ atoms, and every Stern–Gerlach-style projective measurement was destructive. The breakthrough came not from a theorem but from a piece of laboratory cunning: amplify a rare jump on a weak transition into a macroscopic optical signal by piggy-backing it on a strong, cycling transition in the same ion. This is *electron shelving*, and its three-stage history — Dehmelt's 1975 BAPS abstract, the Cook–Kimble 1985 quantitative theory, and the three-way 1986 observation — is one of the most badly compressed episodes in the textbook record.\n\n### Dehmelt's 1975 shelving idea\n\nHans Dehmelt's mono-ion oscillator program at Washington had, by 1973, succeeded in confining single Ba$^+$ and later Mg$^+$ ions in a Paul trap and laser-cooling them to the Lamb–Dicke regime. The motivation was metrological: a forbidden optical transition in a single trapped ion offered, in principle, a $\\Delta\\nu/\\nu \\sim 10^{-14}$ frequency standard. The problem was detection. A narrow $E2$ or $M1$ line scatters perhaps $1\\,\\text{photon}\\,\\text{s}^{-1}$ — undetectable above stray light. Dehmelt's resolution, sketched in a single-paragraph abstract for the 1975 Seattle APS meeting [76], was to use a three-level $\\Lambda$- or $V$-configuration: a strong dipole-allowed transition $|g\\rangle \\leftrightarrow |e\\rangle$ cycling at $\\sim 10^{8}\\,\\text{s}^{-1}$, and a weak transition $|g\\rangle \\leftrightarrow |s\\rangle$ to a long-lived \"shelf\" state. Whenever the ion is excited into $|s\\rangle$, the strong cycling fluorescence shuts off; when $|s\\rangle$ decays back, the fluorescence resumes. A single weak-transition jump thus modulates $\\sim 10^{9}$ photons of scattered light per shelf interval — a fluorescence telegraph.\n\nThe 1975 abstract is six lines long, contains no calculation, and was never followed by a full paper from Dehmelt alone. This is the document that the modern field's entire single-ion spectroscopy enterprise rests on, and it is essentially uncitable in any conventional bibliographic sense.\n\n### Cook–Kimble 1985: making shelving a theorem\n\nTen years later Richard Cook (then at Air Force Institute of Technology, not Caltech, a detail routinely garbled) and Jeff Kimble turned the qualitative shelving idea into a quantitative prediction [77]. Their PRL did three things that the 1975 abstract did not. First, they wrote down a rate-equation model for the three-level system and derived the *waiting-time distribution* between bright→dark and dark→bright transitions; both are exponentials with rates set by the weak-transition Einstein coefficients and the strong-transition saturation parameter. Second, they computed the second-order intensity correlation $g^{(2)}(\\tau)$ of the fluorescence and showed that telegraph statistics produce a characteristic super-Poissonian Mandel $Q$ parameter at long times — a signature distinguishable from detector noise. Third, and crucially for the experimenters, they specified the regime: weak transition saturation $\\ll 1$, strong-transition Rabi frequency comparable to its spontaneous linewidth, and detection efficiency adequate to register the strong-transition photons within one shelf lifetime.\n\nWhat Cook and Kimble did *not* do was invent shelving. Their paper opens by crediting Dehmelt's 1975 abstract explicitly. The textbook flattening — in which \"the Cook–Kimble proposal\" replaces \"the Dehmelt proposal, quantified by Cook and Kimble\" — appears to date from review articles of the early 1990s and has propagated ever since. Plenio and Knight's 1998 review attempts a corrective footnote but the canonical pedagogy did not absorb it.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eElectron shelving level scheme and telegraph signal\u003c/title\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"220\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"200\" x2=\"220\" y2=\"200\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"230\" y=\"345\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|g⟩  ground\u003c/text\u003e\u003ctext x=\"230\" y=\"125\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|e⟩  strong (Γ ~ 10⁸ s⁻¹)\u003c/text\u003e\u003ctext x=\"230\" y=\"205\" fill=\"#e8e6e1\" font-size=\"15\"\u003e|s⟩  shelf (γ ~ 1 s⁻¹)\u003c/text\u003e\u003cline x1=\"100\" y1=\"340\" x2=\"100\" y2=\"120\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/\u003e\u003cpolygon points=\"100,120 96,130 104,130\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"65\" y=\"235\" fill=\"#7aa2ff\" font-size=\"13\"\u003epump\u003c/text\u003e\u003cline x1=\"140\" y1=\"120\" x2=\"140\" y2=\"340\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"140,340 136,330 144,330\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"148\" y=\"235\" fill=\"#ffb86b\" font-size=\"13\"\u003escatter hν\u003c/text\u003e\u003cline x1=\"190\" y1=\"340\" x2=\"190\" y2=\"200\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"2 3\"/\u003e\u003cpolygon points=\"190,200 186,210 194,210\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"198\" y=\"275\" fill=\"#ff7a90\" font-size=\"13\"\u003eweak jump\u003c/text\u003e\u003cline x1=\"340\" y1=\"80\" x2=\"700\" y2=\"80\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"340\" y1=\"80\" x2=\"340\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"340\" y=\"70\" fill=\"#e8e6e1\" font-size=\"13\"\u003efluorescence count rate\u003c/text\u003e\u003ctext x=\"690\" y=\"395\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003etime →\u003c/text\u003e\u003cpolyline points=\"340,120 380,120 380,300 430,300 430,120 510,120 510,300 560,300 560,120 640,120 640,300 700,300\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"395\" y=\"115\" fill=\"#7ee0a3\" font-size=\"13\"\u003ebright\u003c/text\u003e\u003ctext x=\"445\" y=\"320\" fill=\"#ff7a90\" font-size=\"13\"\u003edark (shelved)\u003c/text\u003e\u003ctext x=\"345\" y=\"370\" fill=\"#e8e6e1\" font-size=\"12\"\u003eτ_bright ~ 1/R_pump→s\u003c/text\u003e\u003ctext x=\"510\" y=\"370\" fill=\"#e8e6e1\" font-size=\"12\"\u003eτ_dark ~ 1/γ_s\u003c/text\u003e\u003c/svg\u003e\n*Figure: The shelving scheme. A strong cycling transition $|g\\rangle\\!\\leftrightarrow\\!|e\\rangle$ provides $\\sim 10^9$ fluorescence photons per shelf interval; a rare weak excitation to $|s\\rangle$ extinguishes that signal. The telegraph trace at right is the observable predicted by Cook–Kimble [77] from the waiting-time distribution; the underlying jumps are the ones Dehmelt sketched in 1975 [76].*\n\n### 1986: three groups, three weeks, two ion species\n\nWhat followed in 1986 is one of the cleanest cases of independent simultaneous discovery in modern AMO. Three publications reach PRL within roughly two months, all reporting direct fluorescence-telegraph traces from single trapped ions:\n\n- **Nagourney, Sandberg, Dehmelt** (Washington, Ba$^+$): submitted 12 May 1986, published 23 June 1986 [78]. Uses a $6S_{1/2} \\leftrightarrow 6P_{1/2}$ cycling transition at 493 nm with shelving on $5D_{5/2}$; the trace is one of the most-reproduced figures in single-ion physics.\n- **Sauter, Neuhauser, Blatt, Toschek** (Hamburg, Ba$^+$): submitted 4 August 1986, published 13 October 1986 [79]. Same ion, different shelving pathway through $5D_{3/2}$; their analysis emphasises the waiting-time histogram and explicit comparison to Cook–Kimble.\n- **Bergquist, Hulet, Itano, Wineland** (NIST Boulder, Hg$^+$): submitted 18 August 1986, published 13 October 1986 [80]. Uses the $5d^{10}6s\\,^{2}\\!S_{1/2} \\leftrightarrow 5d^{10}6p\\,^{2}\\!P_{1/2}$ cycling transition at 194 nm with shelving on $5d^{9}6s^{2}\\,^{2}\\!D_{5/2}$. The Hg$^+$ choice was forced by the Boulder group's existing optical-frequency-standard program; it is also the only one of the three using a UV cycling transition, which made the photon-detection efficiency analysis hardest.\n\nThe three papers differ technically — ion species, shelving pathway, detection bandwidth — but conceptually they are doing the same thing. The credit audit therefore has two distinct distortions to flag. First, English-language pedagogy and especially post-2012 popular accounts often compress these into a \"Wineland observation\", consistent with the Nobel citation [80] but inconsistent with the historical record. The 2012 Nobel was for ion-trap quantum control as a whole, not for the 1986 jump observation; Wineland's own Nobel Lecture explicitly cites the three-group simultaneity. Second, the Hamburg group is the most under-cited of the three in US textbooks, partly because Sauter and Neuhauser published most of their follow-ups in *Physical Review A* and German-language conference proceedings rather than PRL, and partly because Toschek's earlier work on the same topic at Heidelberg (the 1979 NaK proposal with Janik and Nagourney — Nagourney himself crossed groups) is rarely reconstructed.\n\nThe deeper point is that the 1986 observations vindicated a chain of reasoning that began with Bohr's 1913 postulate, was made operational by Einstein's 1917 rate equations, was given empirical reality by Bothe–Geiger in 1925, and was finally rendered visible — as a literal trace on a chart recorder — by a piece of three-level optical engineering that Dehmelt sketched in six lines in 1975. Every step is collective; every step is routinely attributed to a single name."}, {"id": "trajectory-formalism-and-the-revival", "title": "Quantum Trajectories: Carmichael, Dalibard–Castin–Mølmer, Dum–Zoller–Ritsch", "markdown": "## Quantum Trajectories: Carmichael, Dalibard–Castin–Mølmer, Dum–Zoller–Ritsch\n\nBy 1989 the master equation in Lindblad form\n\n$$\\dot\\rho = -\\tfrac{i}{\\hbar}[H,\\rho] + \\sum_k \\left( L_k \\rho L_k^\\dagger - \\tfrac{1}{2}\\{L_k^\\dagger L_k,\\rho\\}\\right)$$\n\nwas the universally accepted description of a Markovian open quantum system. It was also, for any realistic quantum-optical problem above a handful of atomic levels, computationally hopeless: the density matrix lives in a Hilbert space of dimension $N^2$, and the dissipator couples its $N^2-1$ independent components. A two-level atom driven inside a cavity already pushes a brute-force solution into the regime where pre-1990 workstations choked. The Monte-Carlo wave-function (MCWF) method and Carmichael's quantum-trajectory unravelling were independent answers to the same practical question — *can one replace a single $N^2$-component evolution by an ensemble of $N$-component pure-state trajectories?* — and their near-simultaneous appearance has a well-documented but routinely flattened priority structure.\n\n### Carmichael's preprints and the LNP m18 lectures\n\nHoward Carmichael was already by 1987 thinking about photoemission as a sequence of conditional state reductions; his Waikato/Texas preprints of 1989–90, partially circulated as the *Open Systems Approach to Quantum Optics* lecture notes given in Brussels in 1991, contain what is, in modern language, the photodetection unravelling in full. The construction is operational: condition the system on a perfect photon-counting record from the environment, write the conditional state $|\\psi_c(t)\\rangle$ as a pure state evolving under a non-Hermitian effective Hamiltonian\n\n$$H_{\\rm eff} = H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k$$\n\nbetween detection events, and apply the jump operator $L_k/\\|L_k|\\psi_c\\rangle\\|$ at the random times when a photon is registered. Ensemble-averaging over records recovers $\\rho(t)$. The Springer Lecture Notes in Physics m18, published in 1993 [archive Carmichael LNP m18], is the canonical written record, but the conceptual move — that *a photodetection click is mathematically a Kraus operator applied to a conditional pure state* — was already in the 1989 preprints. Carmichael's framing was self-consciously physical: the trajectory is what an idealised observer with photodetectors at infinity actually sees, the \"jump\" is the registered click, and the non-Hermitian deterministic drift is the no-count Bayesian update.\n\n### The MCWF papers and the European line\n\nDalibard, Castin, and Mølmer's *Wave-function approach to dissipative processes in quantum optics* [81] arrived at PRL on 11 November 1991 and was published on 27 January 1992; the long companion paper appeared as Mølmer–Castin–Dalibard, *Monte Carlo wave-function method in quantum optics*, JOSA B 10, 524 (1993) (verify). The motivation was unapologetically computational — laser-cooling simulations of a $J_g{=}4 \\to J_e{=}5$ atom in a 3D optical molasses required a density-matrix size $(2J{+}1)^2$ multiplied by a Fourier grid of $\\sim 10^3$ momentum states per direction, which is exactly the regime where storing $\\rho$ is impossible but storing $|\\psi\\rangle$ is merely expensive. Their algorithm is operationally identical to Carmichael's: between random times distributed according to $\\delta p = \\langle\\psi|\\sum_k L_k^\\dagger L_k|\\psi\\rangle\\, dt$, the state evolves under $H_{\\rm eff}$ and is renormalised; at a jump, $|\\psi\\rangle \\mapsto L_k|\\psi\\rangle/\\|L_k|\\psi\\rangle\\|$ with $k$ drawn from the appropriate conditional distribution.\n\nDum, Zoller, and Ritsch, *Monte Carlo simulation of the atomic master equation for spontaneous emission*, Phys. Rev. A 45, 4879 (1992) (verify) submitted in October 1991 — earlier than Dalibard–Castin–Mølmer — and reached the same algorithm independently, with a derivation grounded in continuous quantum measurement theory (Davies, Srinivas–Davies, Barchielli) rather than in heuristic ensemble unravelling. The Dum–Zoller–Ritsch paper is the most explicit of the three about the connection to the underlying microscopic system-plus-bath model: their \"jumps\" are derived by integrating out the reservoir under the standard Born–Markov assumptions that already underlie [81]'s Lindblad starting point [48].\n\n### Equivalence and unravelling-dependence\n\nA point that the 1992 papers stated but the textbook tradition flattens: the photodetection unravelling is *one* unravelling. The Lindblad generator is invariant under\n\n$$L_k \\mapsto L_k' = \\sum_j U_{kj} L_j + \\alpha_k, \\qquad H \\mapsto H' = H + \\tfrac{1}{2i}\\sum_k(\\alpha_k^* L_k - \\alpha_k L_k^\\dagger)$$\n\nfor any unitary $U$ and complex $\\alpha_k$, while the *trajectories* are not. Mixing local oscillators ($\\alpha_k\\neq 0$) and the homodyne limit $|\\alpha_k|\\to\\infty$ converts the discontinuous jump unravelling into a diffusive quantum-state-diffusion (QSD) trajectory in which $|\\psi_c(t)\\rangle$ obeys a stochastic Schrödinger equation driven by real Wiener noise — Gisin and Percival's QSD (1992) and Wiseman–Milburn's quantum-optical homodyne theory (1993) (verify) make this precise. The operational corollary is that \"a quantum jump occurred\" is a statement about the *measurement* the environment performs, not about the system itself: a fluorescing atom monitored by photon counters undergoes telegraph-like jumps; the *same* atom monitored by a strong-local-oscillator homodyne setup undergoes continuous diffusion with no jumps at all, and both descriptions reproduce the *same* $\\rho(t)$ on averaging. This is the formal sense in which conflation (iii) in the §1 audit is unavoidable: the jump is real, but it is real relative to a measurement choice.\n\n### Plenio–Knight 1998 and the unification\n\nBy the mid-1990s three communities — quantum optics (Carmichael, Dalibard et al.), continuous-measurement theory (Barchielli, Belavkin), and the single-ion experimental community still digesting the 1986 shelving observations — were using \"quantum jump\" with three different operational meanings. Plenio and Knight's *Quantum-jump approach to dissipative dynamics in quantum optics*, Rev. Mod. Phys. 70, 101 (1998) (verify), did the unifying work: it derived the MCWF algorithm cleanly from the Lindblad equation, embedded the 1986 shelving telegraph as the photon-counting unravelling of a three-level Bloch equation, gave the waiting-time distribution $w(\\tau) = \\langle\\psi(0)|e^{iH_{\\rm eff}^\\dagger\\tau/\\hbar}\\sum_k L_k^\\dagger L_k e^{-iH_{\\rm eff}\\tau/\\hbar}|\\psi(0)\\rangle$ as the central computational object, and noted the equivalence to Carmichael's trajectory formulation. After 1998 it became impossible to publish a \"quantum-jump simulation\" paper without citing both the European PRL and the Springer LNP — though, as the bibliometric record shows, *which* one led the citation list still tracked the author's side of the Atlantic well into the 2000s.\n\n### Regional citation split\n\nTwo facts about the post-1992 literature deserve to be named. First, [81] accumulated citations roughly five times faster than Carmichael's LNP m18 through the 1990s, partly because PRL is indexed and an LNP volume is not, and partly because the Mølmer–Castin–Dalibard JOSA B exposition was pedagogically cleaner than the lecture-note format. Second, in US-based quantum-optics groups — particularly those with a Texas/JILA lineage — Carmichael's name appears first or alone in trajectory citations through at least 2005, while European and Asian groups citing the \"Monte-Carlo wave-function method\" name only the PRL trio. Dum–Zoller–Ritsch, despite chronological priority over [81] by roughly four weeks and a more rigorous derivation, are the most consistently under-cited of the four, appearing as a parenthetical \"see also\" in reviews that name the other two formulations in their title. The verdict of the credit audit in §1 stands: this is a four-way co-discovery (Carmichael; Dalibard–Castin–Mølmer; Dum–Zoller–Ritsch; with Barchielli–Belavkin supplying the prior measurement-theory scaffold) routinely compressed to a two-way one."}, {"id": "conflation-watch", "title": "Four Things Called 'Quantum Jump'", "markdown": "## Four Things Called 'Quantum Jump'\n\nThe phrase *quantum jump* carries at least four distinct technical meanings that the modern literature routinely conflates. They coincide only in a regime that is almost never stated out loud: Markovian dynamics, weak system–bath coupling, unit-efficiency detection of every emitted quantum, and a measurement basis aligned with the system's energy eigenbasis. Strip any one of these and the four objects come apart.\n\n### (A) The Bohrian ontological jump\n\nThis is the original object: a discrete, instantaneous, lawless transition between two stationary states $\\lvert m\\rangle \\to \\lvert n\\rangle$ accompanied by the emission of a quantum $h\\nu_{mn}=E_m-E_n$ [71]. In Bohr's 1913 trilogy the jump is *primitive* — neither the trajectory through Hilbert space nor the duration of the emission process is defined; only the asymptotic in- and out-states and the emitted photon are physical [71]. Einstein's 1917 recasting added a rate, $A_{mn}$, but inherited the same ontology: the *when* is stochastic, the *how* is not described [72]. Schrödinger's 1952 polemic targets exactly this object — the *instantaneous* discontinuity, not yet the photon click — and asks whether anything in nature actually behaves this way [75]. The Minev et al. 2019 experiment is best read as a direct empirical denial of (A) in its strict form: the transition has a measurable duration, a partly deterministic intermediate trajectory, and admits mid-flight reversal [82].\n\n### (B) The measurement-record click\n\nThis is the object the 1986 experiments actually saw [78,79,80]. The observer watches a *continuous* photocurrent — typically the fluorescence of a strong cycling transition coupled to a long-lived shelf — and *infers* an event when that current switches between two stable levels. The \"jump\" here is a discontinuity in the *classical record*, not in the state of the atom; the underlying quantum dynamics during the interval between clicks is the smooth evolution of a conditional state under a stochastic master equation. Formally, for a homodyne or photon-counting record $\\{dN(t)\\}$ with detection efficiency $\\eta$, the conditional state obeys\n\n$$d\\rho_c = -\\tfrac{i}{\\hbar}[H,\\rho_c]\\,dt + \\mathcal{D}[L]\\rho_c\\,dt + \\mathcal{H}[L]\\rho_c\\,dW,$$\n\n(diffusive case) or a jump update $\\rho_c \\to L\\rho_c L^\\dagger / \\mathrm{Tr}[L^\\dagger L\\rho_c]$ at each click [81]. The record-level click is sharp; the underlying *quantum filter* may be smooth, with cusps only at click times. Crucially, the times, the rates, and even the existence of well-defined \"jumps\" in the record depend on what one chooses to detect: photon counting yields clicks, heterodyne yields Gaussian noise, and the same physical atom produces qualitatively different \"jump traces\" in the two cases.\n\n### (C) The simulated state-vector jump in an unravelling\n\nThis is the Carmichael / Dalibard–Castin–Mølmer / Dum–Zoller–Ritsch object: a piecewise-deterministic stochastic process on Hilbert space that, when averaged, reproduces the Lindblad equation [81]. Between jumps,\n\n$$\\lvert\\psi(t+dt)\\rangle = \\frac{(1 - \\tfrac{i}{\\hbar}H_{\\text{eff}}\\,dt)\\lvert\\psi(t)\\rangle}{\\lVert\\cdot\\rVert},\\qquad H_{\\text{eff}}=H-\\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k,$$\n\nand with probability $dp_k=\\langle L_k^\\dagger L_k\\rangle dt$ the state is replaced by $L_k\\lvert\\psi\\rangle/\\lVert L_k\\lvert\\psi\\rangle\\rVert$. The jump operators $L_k$ are *not unique*: any unitary mixing $L_k'=\\sum_j U_{kj}L_j$ leaves the Lindbladian invariant but produces a different jump statistics, different waiting-time distributions, and even different \"no-jump\" trajectories. Jumps in (C) are therefore representation-dependent artefacts of a numerical method that happens to map, under the right physical correspondence, onto (B). They are real only in the sense that *some* unravelling matches the experimenter's detector — change the local oscillator and you change the jumps.\n\n### (D) Von Neumann projective collapse\n\nThe textbook object: an instantaneous projection $\\rho \\to \\Pi_n \\rho \\Pi_n / \\mathrm{Tr}[\\Pi_n\\rho]$ onto an eigenspace of a measured observable, with probability $\\mathrm{Tr}[\\Pi_n\\rho]$. (D) is more general than (A) — the projection is onto an arbitrary basis, not specifically the energy eigenbasis — and more idealised than (B,C) — it is exact, instantaneous, and unconditional on a continuous record. It enters open-system language only as a singular limit of strong, fast, basis-aligned measurement.\n\n### When the four coincide\n\nThe four objects agree in the following joint limit:\n\n| assumption | what it kills |\n|---|---|\n| Markovian, flat-spectrum reservoir | non-exponential waiting times; memory in the click record |\n| weak coupling, RWA | Lamb-shifted but otherwise unmodified $H_{\\text{eff}}$; well-defined $L_k$ |\n| unit detection efficiency $\\eta=1$ | residual mixedness in the conditional state |\n| measurement basis $=$ energy eigenbasis $=$ jump-operator basis | distinction between (B), (C), (D) |\n| zero detector dead-time / infinite bandwidth | finite click duration; the Minev regime |\n\nIn this corner the simulated trajectory (C) reproduces the experimental record (B) click-for-click, each click implements a projective update (D) onto an energy eigenstate, and the result is indistinguishable from an idealised Bohrian event (A). This is the regime tacitly assumed by Plenio–Knight's 1998 review and by every introductory treatment that writes \"the atom jumps from $\\lvert e\\rangle$ to $\\lvert g\\rangle$\" without qualification (verify).\n\n### Where the modern literature silently strips assumptions\n\nThree recurring abuses are worth naming explicitly.\n\n*Quoting Einstein's $A$ coefficient in a structured reservoir.* Cavity-QED and photonic-crystal papers routinely write \"the spontaneous emission rate is $\\Gamma$\" while operating in a non-Markovian regime where the emitter exhibits vacuum Rabi oscillations or fractional decay. Einstein's 1917 derivation [72] assumes a flat photon density of states; in a band-edge environment $\\Gamma(t)$ is not even monotone and the very notion of a jump rate fails. The literature then re-imports the word \"jump\" by appealing to (C), which can always be defined formally, masking the breakdown of (A).\n\n*Treating $L_k$ as physically given.* Master-equation papers often present a particular Lindblad form and then unravel it as if the resulting jumps were unique events in the world. They are not: only the Lindbladian is invariant; the jump operators are gauge. The Bothe–Geiger experiment [74] selects $L=\\sigma_-$ (emission of a quantum into the electromagnetic vacuum) as the *physical* unravelling; any other choice is a calculational convenience.\n\n*Identifying (D) with (B) at finite $\\eta$.* Inefficient detection produces a *filtered* conditional state that is strictly mixed; calling the corresponding record-level transition a \"projective collapse\" is wrong by an amount $1-\\eta$, which is often the entire experimentally interesting quantity (e.g.\\ in feedback cooling and error-correction stabilisation).\n\nThe Minev et al. result [82] is the cleanest demonstration that (A) is not (B): by reading the no-jump record of an ancillary level in a transmon, the experimenters obtained a continuous, deterministic warning of an impending jump and reversed it before completion. Bohr's instantaneity survives only as an idealisation of (B) in a regime where the detector bandwidth exceeds every system rate — a regime no actual circuit-QED or trapped-ion setup occupies."}, {"id": "landmark-experiments", "title": "Landmark Observations: From Single Ions to Bosonic Modes", "markdown": "## Landmark Observations: From Single Ions to Bosonic Modes\n\nBetween 1986 and 2007 the quantum jump migrated from a single atomic electron to a many-photon bosonic field, and along the way passed through molecules, defect centres, and mesoscopic charge devices. The migration matters because each platform forced a different answer to the question *what, exactly, is jumping?* — and only after the Haroche-group photon-number experiments was it unambiguous that the Bohrian discontinuity is a property of the measured observable and the chosen unravelling, not of the electron in particular.\n\n### The 1986 three-way ion result, reconsidered as measurement physics\n\nThe Seattle (Ba$^+$) [78], Hamburg (Ba$^+$) [79], and Boulder (Hg$^+$) [80] groups all implemented Dehmelt's 1975 shelving proposal [76] in essentially the same way. A strong dipole-allowed cycling transition (e.g. $6^2S_{1/2}\\!\\leftrightarrow\\!6^2P_{1/2}$ in Ba$^+$) is driven hard enough to scatter $\\sim 10^7$–$10^8$ photons per second into a photomultiplier; a weak laser drives the metastable shelving transition (e.g. $6^2S_{1/2}\\!\\leftrightarrow\\!5^2D_{5/2}$). What is *measured* is not the energy of the ion but a coarse-grained photon flux on the cycling line. The Bohrian jump $S\\!\\leftrightarrow\\!D$ is inferred indirectly as a binary switching of that flux between bright and dark intervals — the random telegraph signal whose statistics Cook and Kimble had computed in 1985 [77].\n\nThis is worth restating: in all three 1986 experiments, the observable record consists of *fluorescence clicks on a different transition than the one that jumps*. The waiting-time distribution of dark intervals is exponential with rate $\\Gamma_{D}\\,\\rho_{D D}^{\\rm ss}$ in the weak-shelving limit, which the Hamburg and Boulder groups verified directly by histogramming dwell times. The agreement with [77] — including the dependence on detuning and intensity of the shelving laser — was the experimental closure of the loop Bohr–Einstein–Cook–Kimble had opened in stages over seventy-three years.\n\nA subtlety often lost in retellings: the three groups did *not* observe identical objects. Seattle [78] used a single strong laser plus a hollow-cathode lamp; Hamburg [79] employed two cw lasers and reported jumps on both V- and $\\Lambda$-type configurations; Boulder [80] used Hg$^+$, whose $5d^{10}6s\\,^2S_{1/2}\\!\\leftrightarrow\\!5d^9 6s^2\\,^2D_{5/2}$ shelving line at 281.5 nm gave a much longer dark period ($\\sim$0.1 s) and so cleaner statistics. The simultaneity is real, the experiments are inequivalent, and the popular conflation into \"the Wineland result\" is a credit error worth flagging.\n\n### Molecules and solids: the jump in dirtier environments\n\nThe 1986 ions are pristine because the trapping potential decouples the internal degree of freedom from the motional bath at the $\\mu$K scale. The next decade asked whether the same telegraph statistics survive in systems with phonon baths, spectral diffusion, and inhomogeneous broadening.\n\nTwo lines of work answered yes, with qualifications:\n\n- **Single-molecule fluorescence in cryogenic matrices.** Orrit and Bernard's pentacene-in-$p$-terphenyl experiments (1990–93) and subsequent work on terrylene resolved intersystem-crossing jumps to the metastable triplet $T_1$ as bright/dark intervals on the $S_1\\!\\to\\!S_0$ fluorescence channel — formally identical to ionic shelving, with the $T_1$ lifetime playing the role of the metastable $D$ state. The waiting-time distributions, however, are *not* purely exponential: spectral diffusion induced by host phonons modulates the excitation rate, and the dark-time histogram acquires a stretched-exponential tail. The Bohrian jump survives; the Markovian assumption that underpins Cook–Kimble does not (verify, dates from memory; not in the supplied corpus).\n- **NV centres and quantum dots.** Optically detected magnetic resonance on single NV$^-$ centres in diamond (Wrachtrup, Jelezko, late 1990s) realised the same telegraph logic for an electronic spin state, with the singlet $^1A_1$ acting as shelving level. Single self-assembled InAs/GaAs quantum dots showed blinking telegraphs attributed to charge-state jumps of nearby trap states (verify). In both cases the \"jump\" is between *configurations of a strongly coupled many-body system*, not between bare atomic eigenstates — a quiet conceptual generalisation that the bosonic experiments of the 2000s would make explicit.\n\nA parallel story unfolded in mesoscopic charge devices: real-time detection of single-electron tunnelling through quantum dots and Cooper-pair boxes (Lu, Bylander, Aassime, Devoret and others, 2003–08) produced telegraph traces that are operationally indistinguishable from ionic shelving, but whose \"jumps\" are charge transfers across a tunnel barrier rather than dipole transitions (verify). The unifying message — already implicit in Carmichael's photodetection master equation — is that *any* dispersively coupled meter that resolves a system observable faster than the inverse system relaxation rate will produce a quantum-jump record.\n\n### 2007: photon-number jumps in a microwave cavity\n\nThe decisive generalisation was the Haroche-group quantum-non-demolition (QND) measurement of the photon number of a microwave field in a superconducting Fabry–Pérot cavity (Gleyzes *et al.*, Nature 446, 297, 2007; verify, not in the supplied corpus). Circular Rydberg atoms ($n\\!\\approx\\!50$) traversed the cavity one at a time and acquired a photon-number-dependent dispersive phase shift on the $\\lvert g\\rangle\\!\\leftrightarrow\\!\\lvert e\\rangle$ transition; Ramsey interferometry on each atom returned a single bit of information about $\\hat n$. After $\\sim$100 atoms the conditional photon-number distribution collapsed onto a single Fock state $\\lvert n\\rangle$, and the subsequent record — atoms continuing to fly through — tracked $\\hat n(t)$ in real time as it executed downward jumps $n\\!\\to\\!n-1$ driven by cavity loss at rate $\\kappa$.\n\nWhat was observed is structurally distinct from the 1986 ion experiments. The jumping object is a *bosonic field mode*, not an atomic electron; the measured operator is the *number operator* $\\hat n = a^\\dagger a$, which has unbounded spectrum and no privileged ground level on the same footing as the others; and the unravelling is realised by repeated weak QND probes rather than direct photon counting. The trajectories satisfy a Lindblad equation\n$$\\dot\\rho = \\kappa\\!\\left(a\\rho a^\\dagger - \\tfrac12\\{a^\\dagger a,\\rho\\}\\right) + \\kappa\\bar n_{\\rm th}\\!\\left(a^\\dagger\\rho a - \\tfrac12\\{a a^\\dagger,\\rho\\}\\right),$$\nunravelled by the Carmichael / Dalibard–Castin–Mølmer prescription [81] with jump operators $L_- = \\sqrt{\\kappa(1+\\bar n_{\\rm th})}\\,a$ and $L_+ = \\sqrt{\\kappa\\bar n_{\\rm th}}\\,a^\\dagger$. The dwell times in $\\lvert n\\rangle$ are exponentially distributed with rate $\\kappa\\,[n(1+\\bar n_{\\rm th}) + (n+1)\\bar n_{\\rm th}]$ — and this $n$-dependence, visible in the data, is what makes the field-mode case *generalise* rather than merely *imitate* the ionic case.\n\nThree consequences follow directly:\n\n1. The quantum jump is not tied to fermionic atomic structure. Any open quantum system with a discrete-spectrum observable and a continuously monitored decay channel produces them.\n2. The \"instantaneity\" of the jump is set by the *measurement bandwidth*, not by an intrinsic timescale of the system. The Haroche jumps are resolved on the $\\sim$ms scale of atomic transit; the underlying cavity-photon loss is on the $\\mu$s scale. The same field would yield a different trajectory under direct homodyne detection — diffusive rather than jumpy — exactly as Wiseman and Milburn's unravelling theorems require.\n3. Conditioning works upward as well as downward. The Haroche group later demonstrated quantum feedback that stabilised Fock states against thermal jumps, prefiguring the mid-flight reversal of [82] in a different dynamical regime.\n\n### What the platforms collectively establish\n\nAcross ions [78,79,80], molecules, defect centres, mesoscopic charge devices, and microwave Fock states, the empirical pattern is uniform: a continuously monitored discrete observable, weakly coupled to a Markovian bath, produces a telegraph-like record whose statistics match a Cook–Kimble–type calculation, unravelling a Lindblad master equation of the form first written down in [81]. The pattern's universality is the substantive content of the post-1986 landmark observations. The atomic case taught us that single jumps exist; the bosonic case taught us that the jump is a property of the measurement chain, not of the electron."}, {"id": "frontier-and-open-problems", "title": "Mid-Flight Reversal, Non-Markovian Jumps, and Current Frontier", "markdown": "## Mid-Flight Reversal, Non-Markovian Jumps, and Current Frontier\n\nThe 2019 Minev experiment [82] is the cleanest single-experimental statement that three of Bohr's four implicit dogmas about the *Quantensprung* — instantaneity, intrinsic randomness, irreversibility — survive only as ensemble statements about an unconditioned density matrix. At the level of a single conditioned trajectory all three fail; only discreteness of the *final outcome* and randomness of the *onset time* remain intact.\n\n### The Minev experiment in one paragraph\n\nThe artefact is a transmon–cQED three-level system $\\{|G\\rangle,|B\\rangle,|D\\rangle\\}$ with $|G\\rangle$–$|B\\rangle$ driven strongly on a fast cycling transition and $|G\\rangle$–$|D\\rangle$ driven weakly, so $\\Gamma_B \\gg \\Gamma_D$ — Dehmelt shelving exactly as in §4. A near–quantum-limited Josephson parametric amplifier monitors the cavity field dispersively coupled to $|B\\rangle$; the record is a heterodyne photocurrent reporting the bright-state click rate. A jump to $|D\\rangle$ appears as a sustained no-click interval. The Devoret group's contribution was to recognise that during this interval the conditional state evolves under the deterministic no-jump generator\n\n$$|\\psi(t)\\rangle \\propto \\exp(-iH_{\\rm eff} t/\\hbar)\\,|\\psi(0)\\rangle, \\qquad H_{\\rm eff} = H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k,$$\n\nwith $L_B = \\sqrt{\\Gamma_B}\\,|G\\rangle\\langle B|$ the dominant click operator. Integration of the filter shows a *deterministic* great-circle rotation on the $\\{|G\\rangle,|D\\rangle\\}$ Bloch sphere completed in $T_J \\sim 4/\\Gamma_B \\approx 4\\,\\mu$s, against $T_1(D) \\gg 100\\,\\mu$s. Pattern-matching the early no-click record to this path and firing a calibrated unitary mid-flight reverses the jump back to $|G\\rangle$ with reported single-shot fidelity around 74%. The remaining $\\sim 26\\%$ is dominated not by stochastic deviation of the path but by detector inefficiency and amplifier noise — i.e., by *which* filter is being implemented, not by intrinsic randomness of the dynamics.\n\n### Audit of Bohrian dogmas\n\n| Dogma | Ensemble (unconditioned $\\rho$) | Single trajectory (record-conditioned $|\\psi\\rangle$) |\n|---|---|---|\n| Discrete final outcome | survives | survives — asymptotic projection onto $\\mid G\\rangle$ or $\\mid D\\rangle$ |\n| Instantaneous transition | survives in the $T_J/T_1 \\to 0$ limit | **fails** — finite duration $\\sim 1/\\Gamma_B$ [82] |\n| Onset is intrinsically random | survives | survives — Poissonian waiting $p(\\tau) = \\Gamma_D e^{-\\Gamma_D \\tau}$ |\n| Mid-jump evolution is random | survives | **fails** — path is filter-deterministic given the record [82] |\n| Irreversibility | survives | **fails** — a mid-flight unitary on a recognised path returns $\\mid G\\rangle$ |\n\nThree caveats. First, \"deterministic\" is a statement about the *quantum filter*, not the system: the trajectory is the conditional state under a specified unravelling — switch from photon-counting to heterodyne and the path changes, switch off the record and you recover Bohr-Einstein statistics exactly. Second, \"advance warning\" is heralding, not prediction: the start time stays drawn from $p(\\tau)$; once the no-click bin crosses threshold, only the *continuation* is forced. Third, the entire construction lives inside Markovian quantum optics. Outside that regime there is no canonical filter, and the picture must be rebuilt.\n\n### Non-Markovian unravellings\n\nOnce the reservoir spectral density is structured on the system's own time scale, the Lindblad framework underpinning the filter breaks: time-local rates $\\gamma_k(t)$ become transiently negative, the signature of information backflow. Two distinct repairs are now standard, and they are not equivalent.\n\nThe first is the *non-Markovian quantum jump* (NMQJ) scheme introduced by Piilo, Härkönen, Maniscalco and Suominen ([PRL 100, 180402 (2008)](https://arxiv.org/abs/0706.4438); [PRA 79, 062112 (2009)](https://arxiv.org/abs/0902.3609)). When $\\gamma_k(t) \u003c 0$ on some interval the ensemble unravelling injects a *reverse jump* — with positive probability — that reinstates a member of the ensemble previously projected onto the post-jump state. The construction reproduces the master equation exactly but its single trajectories are ensemble-history-dependent: they are *not* the conditional state of any continuous measurement on the system alone. NMQJ is a sampling scheme, not a filter. Recent generalisations recast the rule as a rate-operator unravelling to absorb correlated channels ([Generalized Rate Operator Quantum Jumps, arXiv:2402.12445](https://arxiv.org/abs/2402.12445), verify).\n\nThe second repair is the *pseudomode* embedding (Garraway 1997; greatly extended in the last decade). The non-Markovian system + bath is reproduced exactly by coupling the system to a small set of auxiliary modes — possibly non-Hermitian — whose joint evolution *is* Lindbladian on the enlarged Hilbert space; non-Markovianity is the trace-over residue ([Non-Hermitian Pseudomodes, Phys. Rev. Research 6, 033237 (2024)](https://link.aps.org/doi/10.1103/PhysRevResearch.6.033237)). Inside the embedding ordinary jump unravellings and waiting-time statistics return — but the trajectories acquire operational meaning only once one prescribes how the pseudomode is to be measured, and that prescription is *not* unique once the microscopic environment has been integrated out. In circuit QED this is not academic: fluxonium qubits show non-Poissonian jumps driven by quasiparticle excitations ([Pop et al., Nature 508, 369 (2014)](https://arxiv.org/abs/1406.1769)), and transmons coupled to two-level-system baths exhibit revivals and negative-rate windows incompatible with any Markovian unravelling ([Smoking-gun signatures, arXiv:2302.09092](https://arxiv.org/abs/2302.09092), verify).\n\n### Current frontier (2024–2026)\n\nThree threads are active.\n\n(1) *Reversal as just-in-time error correction.* The Minev protocol has migrated from single-qutrit demonstrations to cat-code and GKP encodings, where mid-flight reversal functions as leakage suppression in a logical cycle rather than a curiosity. The relevant figure of merit is logical-leakage suppression per stabiliser cycle; reversal fidelity per attempt is now a tactical, not strategic, number.\n\n(2) *Machine-learned filters for imperfect detection.* When amplifier-chain efficiency $\\eta \u003c 1$ or calibration drifts, the analytic non-Hermitian filter ceases to be optimal. Recurrent networks trained on heterodyne records reconstruct conditional states above the closed-form filter's fidelity ([Monitoring fast superconducting qubit dynamics using a neural network, arXiv:2108.12023](https://arxiv.org/abs/2108.12023)). The conceptual residue is that the line between *observing* and *inferring* a jump has become operationally porous.\n\n(3) *Reversal in genuinely non-Markovian environments.* Whether the Minev filter survives outside the Born–Markov regime is unresolved. Both NMQJ and pseudomode pictures predict — for opposite reasons — that memory backflow should *raise* the reversal ceiling: under NMQJ a reverse jump becomes a physical event one can ride; under pseudomode embedding the extended-space filter has access to bath information the bare-system filter throws away. An experimental test is overdue.\n\n### The verdict\n\nBohr's 1913 discontinuity has not been disproved; it has been re-sited. As a statement about ensembles $\\rho(t)$ it remains correct and is exactly the limit obtained by tracing over any of the unravellings above. As a statement about single quantum systems it has been replaced — by quantum filtering, by quantum trajectories, and now by their non-Markovian extensions — with a continuous, partly deterministic, conditionally reversible piece of measurement-conditioned dynamics. What is *intrinsically* random is the Poissonian onset time and, in the non-Markovian regime, even that is suspect. The jump survives as the asymptotic shadow of the filter; the *Verdammten Quantenspringerei* survives as a useful approximation, no longer as an ontology.\n\nSources:\n- [To catch and reverse a quantum jump mid-flight (Nature 570, 200 (2019))](https://www.nature.com/articles/s41586-019-1287-z)\n- [Catching and Reversing a Quantum Jump Mid-Flight (arXiv:1902.10355)](https://arxiv.org/pdf/1902.10355)\n- [Non-Markovian quantum jumps (Piilo et al., arXiv:0706.4438)](https://arxiv.org/abs/0706.4438)\n- [Open system dynamics with non-Markovian quantum jumps (arXiv:0902.3609)](https://arxiv.org/abs/0902.3609)\n- [Generalized Rate Operator Quantum Jumps (arXiv:2402.12445)](https://arxiv.org/abs/2402.12445)\n- [Non-Hermitian pseudomodes (Phys. Rev. Research 6, 033237 (2024))](https://link.aps.org/doi/10.1103/PhysRevResearch.6.033237)\n- [Non-Poissonian Quantum Jumps of a Fluxonium Qubit (arXiv:1406.1769)](https://arxiv.org/abs/1406.1769)\n- [Smoking-gun signatures of non-Markovianity of a superconducting qubit (arXiv:2302.09092)](https://arxiv.org/abs/2302.09092)\n- [Monitoring fast superconducting qubit dynamics using a neural network (arXiv:2108.12023)](https://arxiv.org/abs/2108.12023)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\n### (a) What I will defend\n\nThree claims I would put my name to without qualification.\n\nFirst: the *Quantensprung* as Bohr meant it — an ontologically primitive, instantaneous, intrinsically random discontinuity between energy eigenstates — is dead, and has been dead since the Minev experiment closed the loop that began with Bothe–Geiger. What survives under that name is a derived object: a click in a measurement record, or a discontinuity in a conditional state, both of which are *theorems* in open-system quantum mechanics, not postulates. Anyone teaching the jump as a primitive in 2026 is teaching 1913.\n\nSecond: the Carmichael / Dalibard–Castin–Mølmer / Dum–Zoller–Ritsch unravelling is the correct way to *think* about photodetection, and the equivalence classes of unravellings (jump vs. diffusive, Wiseman–Milburn) are the correct way to think about the non-uniqueness. The pedagogy that presents the Lindblad master equation first and the trajectory picture as an afterthought has the conceptual order backwards: the trajectory is what the detector sees; the master equation is its ensemble average.\n\nThird: the 1986 priority is genuinely three-way. The flattening of Sauter / Nagourney / Bergquist into \"Wineland\" is a citation pathology, not a historical judgment, and the Hamburg group's data were if anything the cleanest of the three.\n\n### (b) What is shakier than the literature admits\n\nThe *deterministic* phase of the Minev trajectory is presented as a vindication of unitary evolution between jumps. It is nothing of the sort. It is a vindication of the *no-click conditional Hamiltonian* $H_{\\text{eff}} = H - \\tfrac{i\\hbar}{2}\\sum_k L_k^\\dagger L_k$, which is only well-defined under three quietly stripped assumptions: (i) the detector has unit efficiency on the channel being monitored, (ii) the Born–Markov approximation holds for the bath, and (iii) the unmonitored channels are genuinely Markovian rather than merely fast. Drop any one and \"the deterministic part of the trajectory\" becomes detector-dependent in a way that no current experiment controls for.\n\nLikewise, the modern habit of calling a jump in a Monte-Carlo wavefunction simulation \"the\" jump conflates a numerical artefact of one unravelling with a physical event. The jump statistics are unravelling-invariant only at the level of the reduced density matrix; the trajectories themselves are gauge.\n\nFinally, the non-Markovian-jump literature post-2010 routinely writes down \"jump operators\" for structured reservoirs without checking that the corresponding unravelling is positive. A substantial fraction of published \"non-Markovian quantum trajectories\" are, on inspection, formal manipulations of a non-completely-positive map.\n\n### (c) Three open questions, ranked\n\n1. **What is the operational content of a partial jump?** If Minev's mid-flight reversal works, the \"jump\" has internal structure on the $\\mu s$ scale set by $\\kappa^{-1}$. Can one resolve and *control* that structure in a system where the bath is not engineered (real atomic fluorescence)? — because that is the question Bohr's postulate forbade asking.\n\n2. **Unravelling-invariant signatures of non-Markovianity at the single-trajectory level.** Every existing measure (BLP, RHP) is defined on $\\rho(t)$. A genuinely trajectory-level invariant would tell us when \"non-Markovian jump\" is physics versus parametrisation.\n\n3. **The thermodynamic cost of the conditional Hamiltonian.** Conditioning on no-click extracts information; the resulting non-Hermitian evolution must have an entropic price. The Landauer accounting for $H_{\\text{eff}}$ is not, to my knowledge, settled.\n\n### Reading path\n\n1. Bohr 1913 [1] — read it in the original to see how thin the postulate actually is.\n2. Einstein 1917 [9] — the stochastic upgrade, and the reg
