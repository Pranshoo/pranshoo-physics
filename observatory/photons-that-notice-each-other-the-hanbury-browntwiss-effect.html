nly two authors, is the version that propagated into the quantum-optics canon.\n\n### The 1954 Phil. Mag. paper: theory before the optical demonstration\n\nThe full theoretical apparatus appeared in 1954 in the Philosophical Magazine paper \"A new type of interferometer for use in radio astronomy\" by Hanbury Brown and Twiss [2]. This paper is the technical foundation of everything that followed: it derives the relation between intensity correlation and $|\\gamma_{12}|^2$ for a chaotic source, computes the signal-to-noise of envelope-correlation detection against the shot-noise background, and identifies the wave-noise excess (later christened the Bose term by Purcell) that makes the technique fundamentally bandwidth-limited. The expression for the SNR — $\\mathrm{SNR} \\propto \\alpha\\, n\\, A\\, \\sqrt{\\Delta f\\, T} \\cdot |\\gamma_{12}|^2$, with $\\alpha$ the quantum efficiency, $n$ the photon degeneracy parameter, $A$ the collecting area, $\\Delta f$ the electronic bandwidth, and $T$ the integration time — is the equation that justified building Narrabri and, three-quarters of a century later, justifies returning to intensity interferometry on Cherenkov telescope arrays [7, 8].\n\n### The photoelectric beat precursor: Forrester, Gudmundsen, Johnson, 1955\n\nBefore the mercury-arc experiment of 1956, a separate group had already shown that the photodetection chain could register *classical intensity beats* between two incoherent optical components. Forrester, Gudmundsen, and Johnson, working on a Zeeman-split mercury line, observed a photoelectric beat at the Zeeman frequency [9]. The experiment is rarely listed as part of the HBT lineage because it was framed as a heterodyne demonstration rather than as a coherence-theory experiment, but it cleared exactly the conceptual obstacle that the Brannen–Ferguson [10] and Ádám–Jánossy–Varga [11] groups would shortly raise against HBT: that an \"incoherent\" thermal source could not produce time-correlated photoelectric events. Forrester *et al.* had already produced one. Hanbury Brown's group cited the work; the broader community did not absorb its implication until Purcell forced the issue.\n\n### Mercury arc and Sirius: 1956\n\nThe 1956 Nature paper [6] — \"Correlation between Photons in two Coherent Beams of Light\" — is the famous tabletop optical experiment: a mercury arc, a half-silvered mirror, two photomultipliers, a coincidence circuit, and the demonstration that the photocurrents at the two outputs of the beamsplitter were positively correlated on a timescale set by the optical coherence time $\\tau_c \\sim 1/\\Delta\\nu$. The same year, with the Jodrell Bank radio result behind them, Hanbury Brown and Twiss built a two-mirror optical instrument on a baseline of ${\\sim}\\,6$ m and measured the angular diameter of Sirius A: $\\theta_\\mathrm{LD} \\approx 6.9$ milliarcseconds, the first stellar diameter ever recovered by intensity interferometry in the visible [12]. The Sirius result is what convinced Hanbury Brown to commit to the Narrabri Stellar Intensity Interferometer (NSII), which over the next eighteen years measured thirty-two stellar diameters with John Davis as co-PI [13] — a programme that the textbook attribution to \"HBT\" silently erases, and which is the direct ancestor of the modern Cherenkov-array revival [7, 8].\n\n### A note on the name\n\nThe surname is *Hanbury Brown*, not *Brown*. His father, Basil Hanbury Brown, was a colonial officer in the Indian Civil Service; the double-barrel is the family name, not a middle name. The form \"R. H. Brown\" — common in the heavy-ion literature where the GGLP terminology dominates [14, 15] and the original optical work is a footnote — is a systematic error. The correct alphabetisation is under H, and the correct in-text citation is \"Hanbury Brown and Twiss\", not \"Brown and Twiss\". This is the trivial end of the credit audit, but it is the one that propagates fastest and is the easiest to fix."}, {"id": "the-physics-g2-and-the-classical-core", "title": "The Physics: Intensity Correlations, the Siegert Relation, and Why Bunching Is Classical", "markdown": "## The Physics: Intensity Correlations, the Siegert Relation, and Why Bunching Is Classical\n\nThe pedagogical lesson of HBT, often inverted in textbooks, is this: the 1956 result is a statement about classical stochastic optics that survives quantisation unchanged. Field operators only intrude when one wants $g^{(2)}(0)\u003c1$. Everything HBT measured, and everything Narrabri exploited, lives inside the Cauchy–Schwarz inequality.\n\n### The intensity correlator\n\nLet $E(t)$ be the complex analytic signal of a stationary, polarised, single-mode optical field at a detector, and $I(t)\\equiv E^{*}(t)E(t)$. Define the normalised first- and second-order coherence functions\n$$g^{(1)}(\\tau)=\\frac{\\langle E^{*}(t)E(t+\\tau)\\rangle}{\\langle I\\rangle},\\qquad g^{(2)}(\\tau)=\\frac{\\langle I(t)\\,I(t+\\tau)\\rangle}{\\langle I\\rangle^{2}}.$$\nThe angle brackets are ensemble averages, but by stationarity they coincide with the time averages an HBT correlator actually computes. $g^{(1)}$ is what a Michelson or Young apparatus measures (amplitude interferometry); $g^{(2)}$ is what HBT measures (intensity interferometry). The whole programme is the assertion that for many sources $g^{(2)}$ contains the same source information as $|g^{(1)}|^{2}$, but is accessible without preserving optical phase between detectors.\n\n### The Siegert relation from the Gaussian moment theorem\n\nChaotic light — a mercury arc behind a pinhole, the surface of a star, fluorescence from a dense atomic ensemble — is produced by a large number of statistically independent emitters. The central limit theorem forces $E(t)$ to a circular complex Gaussian process with zero mean. For such a field, the Isserlis–Wick theorem reduces every higher moment to pair contractions:\n$$\\langle E^{*}(t_{1})E^{*}(t_{2})E(t_{3})E(t_{4})\\rangle = \\langle E^{*}(t_{1})E(t_{3})\\rangle\\langle E^{*}(t_{2})E(t_{4})\\rangle + \\langle E^{*}(t_{1})E(t_{4})\\rangle\\langle E^{*}(t_{2})E(t_{3})\\rangle.$$\nSetting $t_{1}=t_{2}=t$ and $t_{3}=t_{4}=t+\\tau$:\n$$\\langle I(t)I(t+\\tau)\\rangle = \\langle I\\rangle^{2}+|\\langle E^{*}(t)E(t+\\tau)\\rangle|^{2},$$\nhence\n$$\\boxed{\\;g^{(2)}(\\tau)=1+|g^{(1)}(\\tau)|^{2}\\;}$$\nThis is the Siegert relation. Two consequences are immediate. At zero delay, $|g^{(1)}(0)|=1$ by construction, so $g^{(2)}(0)=2$: chaotic light always exhibits maximal bunching at the detector resolution limit. For $\\tau\\gg\\tau_{c}$ (the field coherence time), $g^{(1)}(\\tau)\\to 0$ and $g^{(2)}(\\tau)\\to 1$: independent intensities at well-separated times. The bunching peak has width $\\tau_{c}$, which by the Wiener–Khinchin theorem is the inverse spectral width.\n\nThree caveats are baked into this derivation. (i) Stationarity: pulsed sources, transient excitation, even slow lamp drift can violate it. (ii) Zero mean: a coherent admixture (laser leakage, local-oscillator pickup) shifts the mean and reduces $g^{(2)}(0)$ below 2. (iii) Gaussianity: parametric pair sources and two-mode squeezed vacuum can yield $g^{(2)}(0)$ values arbitrarily larger than 2 (\"superbunching\"). When any of (i–iii) fails, \"$g^{(2)}(0)=2$\" loses its standing as a thermal-light signature, and inverting the Siegert formula to recover $|g^{(1)}|$ becomes unsound. The 1957 Proc. Roy. Soc. paper [16] already states each condition explicitly; the textbook lineage tends to drop them, a habit a recent generalisation effort makes explicit [17].\n\n### The classical bound from Cauchy–Schwarz\n\nEven without Gaussianity, classical statistics force a lower bound on $g^{(2)}(0)$. For any non-negative random variable $I(t)\\ge 0$ with $\\mathrm{Var}(I)\\ge 0$,\n$$\\langle I^{2}\\rangle \\ge \\langle I\\rangle^{2}\\;\\Longrightarrow\\; g^{(2)}(0)\\ge 1.$$\nMore sharply, applying Cauchy–Schwarz to stationary intensities gives $\\langle I(t)I(t+\\tau)\\rangle\\le \\langle I^{2}\\rangle$, so $g^{(2)}(\\tau)\\le g^{(2)}(0)$: the equal-time correlator is the global maximum for any classical stochastic intensity. These two inequalities define the entire \"classically allowed\" region. A measurement of $g^{(2)}(0)\u003c1$ or of $g^{(2)}(\\tau)\u003eg^{(2)}(0)$ at some finite $\\tau$ is the operational definition of nonclassicality, and after Sudarshan [18] and Glauber [19, 20] it is equivalent to non-positivity of the diagonal $P$-representation. Bunching, by contrast, sits comfortably inside the inequality and requires no field quantisation at all — a point Purcell crystallised in print before Glauber's formalism existed [21].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eHBT geometry and the three regimes of g^(2)(tau)\u003c/title\u003e\u003cg fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"\u003e\u003ccircle cx=\"55\" cy=\"120\" r=\"22\" stroke=\"#ffb86b\"/\u003e\u003cline x1=\"77\" y1=\"120\" x2=\"190\" y2=\"120\"/\u003e\u003cline x1=\"190\" y1=\"100\" x2=\"240\" y2=\"60\"/\u003e\u003cline x1=\"190\" y1=\"140\" x2=\"240\" y2=\"180\"/\u003e\u003crect x=\"180\" y=\"105\" width=\"20\" height=\"30\" transform=\"rotate(45 190 120)\" stroke=\"#7aa2ff\"/\u003e\u003crect x=\"240\" y=\"45\" width=\"40\" height=\"30\" stroke=\"#7ee0a3\"/\u003e\u003crect x=\"240\" y=\"165\" width=\"40\" height=\"30\" stroke=\"#7ee0a3\"/\u003e\u003cline x1=\"280\" y1=\"60\" x2=\"335\" y2=\"100\"/\u003e\u003cline x1=\"280\" y1=\"180\" x2=\"335\" y2=\"140\"/\u003e\u003crect x=\"330\" y=\"95\" width=\"60\" height=\"50\" stroke=\"#ff7a90\"/\u003e\u003c/g\u003e\u003ctext x=\"55\" y=\"170\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003echaotic source\u003c/text\u003e\u003ctext x=\"190\" y=\"170\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003e50:50 BS\u003c/text\u003e\u003ctext x=\"260\" y=\"40\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eD1\u003c/text\u003e\u003ctext x=\"260\" y=\"215\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eD2\u003c/text\u003e\u003ctext x=\"360\" y=\"125\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003e×, τ\u003c/text\u003e\u003ctext x=\"360\" y=\"170\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003e⟨I₁(t)I₂(t+τ)⟩\u003c/text\u003e\u003cg fill=\"none\" stroke-width=\"1.2\"\u003e\u003cline x1=\"440\" y1=\"350\" x2=\"700\" y2=\"350\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"440\" y1=\"60\" x2=\"440\" y2=\"350\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"440\" y1=\"270\" x2=\"700\" y2=\"270\" stroke-dasharray=\"3,3\" stroke=\"#888\"/\u003e\u003cline x1=\"440\" y1=\"190\" x2=\"700\" y2=\"190\" stroke-dasharray=\"3,3\" stroke=\"#888\"/\u003e\u003c/g\u003e\u003ctext x=\"570\" y=\"372\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eτ / τc\u003c/text\u003e\u003ctext x=\"432\" y=\"274\" fill=\"#888\" font-size=\"14\" text-anchor=\"end\" font-family=\"sans-serif\"\u003e1\u003c/text\u003e\u003ctext x=\"432\" y=\"194\" fill=\"#888\" font-size=\"14\" text-anchor=\"end\" font-family=\"sans-serif\"\u003e2\u003c/text\u003e\u003ctext x=\"432\" y=\"65\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\" font-family=\"sans-serif\"\u003eg⁽²⁾(τ)\u003c/text\u003e\u003cpath d=\"M 440 270 Q 510 270 570 190 Q 630 270 700 270\" stroke=\"#ffb86b\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003cpath d=\"M 440 270 L 700 270\" stroke=\"#7aa2ff\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003cpath d=\"M 440 270 Q 510 270 570 340 Q 630 270 700 270\" stroke=\"#ff7a90\" stroke-width=\"2.4\" fill=\"none\"/\u003e\u003ctext x=\"695\" y=\"180\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"end\" font-family=\"sans-serif\"\u003echaotic: 1+|g⁽¹⁾|²\u003c/text\u003e\u003ctext x=\"695\" y=\"262\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"end\" font-family=\"sans-serif\"\u003ecoherent: 1\u003c/text\u003e\u003ctext x=\"695\" y=\"335\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"end\" font-family=\"sans-serif\"\u003eantibunched (nonclassical)\u003c/text\u003e\u003c/svg\u003e\n*Figure: Left — HBT geometry: a chaotic source illuminates a 50:50 beam splitter feeding two detectors whose photocurrents are multiplied with relative delay $\\tau$. Right — the three canonical curves: chaotic light obeys the Siegert relation and bunches to $g^{(2)}(0)=2$; an ideal coherent state is flat at unity; antibunched (single-emitter) light dips below the classical floor at $\\tau=0$, the unique nonclassical signature.*\n\n### Purcell's Bose-excess shot-noise argument\n\nPurcell's 1956 half-page reply [21] is the cleanest derivation in the controversy literature. Decompose the photocurrent into shot noise plus a fluctuating envelope. For a chaotic field populating each transverse-temporal mode with mean occupation $\\bar n_{\\mathrm{mode}}$, the photoelectron counting distribution within a coherence volume is Bose–Einstein, so the variance is\n$$\\langle (\\Delta n)^{2}\\rangle = \\langle n\\rangle\\bigl(1+\\bar n_{\\mathrm{mode}}\\bigr).$$\nThe \"$+\\,\\bar n_{\\mathrm{mode}}$\" term is the wave-noise (Bose excess) contribution; it is exactly the term that survives ensemble averaging of $|E|^{2}$ fluctuations and produces the HBT coincidence excess. For laboratory thermal light $\\bar n_{\\mathrm{mode}}\\ll 1$ and the excess is tiny per shot — which is precisely why one needs broad collection bandwidth, fast electronics, and long integration to dig it out. Purcell ended his note with the observation that the excess noise is the signature of bosons and that no quantum-electrodynamical mystery is involved: photoelectrons inherit the classical intensity fluctuations of a Gaussian field, and the apparent paradox of \"photons attracting each other\" dissolves into Bose statistics of mode occupation. The Mandel–Wolf monograph [22] codifies this view; Hanbury Brown's own monograph [5] credits Purcell as the conceptual closer of the dispute.\n\n### Spatial coherence and the van Cittert–Zernike connection\n\nThe same algebra carried over two detectors at points $\\mathbf r_{1},\\mathbf r_{2}$ separated by a baseline $\\mathbf b$ gives\n$$\\langle I(\\mathbf r_{1},t)\\,I(\\mathbf r_{2},t)\\rangle = \\langle I\\rangle^{2}\\bigl(1+|\\gamma_{12}(\\mathbf b)|^{2}\\bigr),$$\nwhere the equal-time mutual coherence\n$$\\gamma_{12}(\\mathbf b)=\\frac{\\langle E^{*}(\\mathbf r_{1},t)E(\\mathbf r_{2},t)\\rangle}{\\langle I\\rangle}$$\nis, by the van Cittert–Zernike theorem, the normalised Fourier transform of the source brightness distribution $I_{s}(\\boldsymbol\\theta)$:\n$$\\gamma_{12}(\\mathbf b)=\\frac{\\int I_{s}(\\boldsymbol\\theta)\\,e^{-i k\\,\\mathbf b\\cdot\\boldsymbol\\theta}\\,d^{2}\\theta}{\\int I_{s}(\\boldsymbol\\theta)\\,d^{2}\\theta}.$$\nThe intensity correlator therefore returns $|\\gamma_{12}(\\mathbf b)|^{2}$ — the squared modulus of the source's spatial Fourier component at baseline $\\mathbf b$. This is the entire content of Hanbury Brown and Twiss's 1954 radio-astronomy theory paper [2] and the 1957 Proc. Roy. Soc. formalisation [16]. Sweeping $\\mathbf b$ traces out a uv-coverage that, in principle, recovers $I_{s}$ up to phase. Modulus-squared erases the Fourier phase of the source visibility, leaving a centro-symmetric ambiguity in the recovered image. Hanbury Brown took this trade willingly because $|\\gamma_{12}|^{2}$ is immune to optical path fluctuations between the two telescopes — any phase noise common to the photocurrents at $\\mathbf r_{1}$ and $\\mathbf r_{2}$ cancels in the product. That is the engineering miracle that made Narrabri possible, and the same trade — phase for atmospheric immunity — drives the present-day Cherenkov-array revival [7, 8] and motivates the two-photon amplitude schemes that aim to recover the lost phase [23].\n\n### Where this leaves §3\n\nThree facts will recur. The bunching peak at $\\tau=0$ is classical (Cauchy–Schwarz + Bose excess). The Siegert relation $g^{(2)}=1+|g^{(1)}|^{2}$ is a theorem of stationary, zero-mean, Gaussian fields — not a definition of \"thermal light\". And the HBT correlator delivers $|\\gamma_{12}|^{2}$, not $\\gamma_{12}$. Brannen and Ferguson missed the first; the Budapest group [11] missed the second; and every modern paper that quotes $g^{(2)}(0)$ without naming its stationarity and Gaussianity assumptions misses the third. §3 takes up that 1956 confusion in earnest."}, {"id": "the-1956-controversy", "title": "The 1956 Controversy: Brannen–Ferguson, Ádám–Jánossy–Varga, Dirac, and Purcell's One-Page Verdict", "markdown": "## The 1956 Controversy: Brannen–Ferguson, Ádám–Jánossy–Varga, Dirac, and Purcell's One-Page Verdict\n\nThe 1956 Nature paper [6] did not land on a community that had been waiting for it. It landed on a community that, by and large, thought it could not possibly be right — and the loudest objections were not from cranks but from competent experimentalists and a textbook by Dirac that every working physicist owned. The dispute that followed in the same volume of *Nature*, and in *Acta Physica Hungarica* the year before, is worth reconstructing in its actual form, because the resolution that ended it was not authored by Hanbury Brown or Twiss. It was a half-page letter by Purcell [21], and the conceptual lesson — that the bunching of photoelectric counts is the Bose excess-noise term of a chaotic field, fully classical — is his, not theirs.\n\n### The Budapest precedent: Ádám, Jánossy and Varga (1955)\n\nA year before the mercury-arc paper appeared, the Budapest group of Ádám, Jánossy and Varga had performed essentially the same kind of measurement and reported the opposite conclusion [11]. They split a beam of light from a thermal source on a half-silvered mirror, sent the two outputs to a pair of photomultipliers, fed the photopulses into a coincidence circuit with a resolving time of order microseconds, and found no excess of coincidences over the accidental rate. They interpreted the null result as direct experimental evidence that individual photons traverse one arm or the other and never both — a position perfectly consistent with the Dirac dictum and, by their reading, incompatible with any \"correlation between photons in two coherent beams of light\".\n\nThe Budapest result was not a blunder. Their resolving time was several orders of magnitude longer than the coherence time of the filtered thermal source, $\\tau_R \\gg \\tau_c$, so the excess they were nominally looking for had been averaged down by a factor of order $\\tau_c/\\tau_R$ — exactly the degeneracy parameter that Hanbury Brown and Twiss spent the rest of the decade fighting against in their photon budget. The signature\n$$\n\\langle \\Delta n_1 \\, \\Delta n_2 \\rangle \\;=\\; \\eta_1 \\eta_2 \\, \\langle I \\rangle^2 \\int_{-\\tau_R}^{\\tau_R} \\!\\! |g^{(1)}(\\tau)|^2 \\, d\\tau\n$$\ncollapses to noise once $\\tau_R$ exceeds $\\tau_c$ by six orders of magnitude. Jánossy, whose instincts were always more conservative than the experiment warranted, took the null result at face value. The Budapest papers were cited by every European critic of HBT during 1956–57 and were known to Hanbury Brown, who discusses them at length in his monograph [5] and his autobiography [4]; they are written out of the modern story chiefly because they ended up on the losing side of an argument they had effectively framed first.\n\n### Brannen and Ferguson: the experiment recast as a paradox\n\nThe public dispute that defined the controversy began in the same volume of *Nature* as the HBT optical paper. Brannen and Ferguson at the University of Western Ontario reported their own coincidence experiment, found no excess coincidences within their resolving time, and concluded that \"if such a correlation did exist, it would call for a major revision of some fundamental concepts in quantum mechanics\" [10]. Their paper is short and unambiguous. They take Dirac's dictum — \"each photon then interferes only with itself; interference between two different photons never occurs\" [24] — as the operative quantum-mechanical statement, infer from it that two photoelectric events at separated detectors must be statistically independent for a true single-photon state, and treat the absence of an excess in their data as confirmation.\n\nTheir resolving time, however, was $\\sim 10^{-8}$ s while the coherence time of their filtered source was $\\sim 10^{-11}$ s, so the same degeneracy suppression that defeated Budapest defeated Ontario. The conceptual error was deeper than the timing one. Brannen and Ferguson had implicitly equated \"photon\" with a definite particle traversing one arm of the apparatus and read Dirac's sentence as a statement about counts at two detectors. Neither identification is forced by the formalism, and the second is simply wrong: Dirac's sentence is about the absence of cross terms between distinct single-photon amplitudes in the first-order interference pattern, not about coincidence statistics in second order. But the dictum was, by 1956, a piece of canonical authority. Three editions of *The Principles of Quantum Mechanics* had hammered it into a generation, and the fourth edition appeared two years later [24] with the sentence intact.\n\n### Dirac's dictum as the conceptual obstacle\n\nRe-reading the dispute from inside Dirac's framework clarifies why the experimental community split. The statement \"each photon interferes only with itself\" is correct as a statement about $g^{(1)}$: for a state with a definite photon number, the first-order coherence function $\\langle E^{(-)}(r_1,t_1) E^{(+)}(r_2,t_2)\\rangle$ contains no inter-photon cross terms because the Fock-state diagonal elements suffice. It is silent on $g^{(2)}$. The two-photon correlator\n$$\nG^{(2)}(r_1 t_1, r_2 t_2) \\;=\\; \\langle \\, \\hat{E}^{(-)}(r_1,t_1)\\hat{E}^{(-)}(r_2,t_2)\\hat{E}^{(+)}(r_2,t_2)\\hat{E}^{(+)}(r_1,t_1) \\, \\rangle\n$$\ninvolves a product of two annihilation operators and, for any state that is a superposition over photon-number, contains amplitudes for two photons to be removed at $(r_1,t_1)$ and $(r_2,t_2)$ by two different paths through the source — a genuinely two-photon interference. The Dirac dictum, taken as a metaphysical claim about photons-as-particles, blocks this perfectly real effect. Once one reads it instead as a precise statement about first-order coherence, the obstacle dissolves. The community of 1956 did not yet make that distinction sharply; Glauber's hierarchy that would make it canonical was seven years away [19, 20].\n\n### Purcell's verdict\n\nPurcell ended the debate in roughly six hundred words [21]. His letter does three things that neither Brannen–Ferguson, the Budapest group, nor the original HBT papers had done cleanly. First, he writes the photocount variance for a chaotic light field as the sum of a Poisson term and a Bose excess term,\n$$\n\\langle (\\Delta n)^2 \\rangle \\;=\\; \\langle n \\rangle \\,+\\, \\langle n \\rangle^2 / \\mathcal{M},\n$$\nwith $\\mathcal{M}$ the number of independent temporal modes within the counting interval. The \"correlation between photons\" is just the second term, the wave-noise contribution that classical statistical optics had known since the 1930s; it is what Einstein's 1909 fluctuation formula already required of any blackbody-like field. Second, he identifies the operational reason all earlier coincidence experiments had failed: the excess scales as $\\tau_c/\\tau_R$, and a thermal-lamp coherence time of $10^{-11}$ s buried inside a resolving window of $10^{-8}$ s suppresses it by three orders of magnitude — a number Brannen and Ferguson's signal-to-noise budget could not pay. Third, he rules on the conceptual content: nothing in the result is at odds with quantum mechanics, because the same expression follows from treating the field classically and applying shot-noise photodetection, or from treating it quantum-mechanically with the Bose statistics built into multimode coherent superpositions. The \"paradox\" was a misreading of Dirac.\n\nPurcell also slipped in the prophetic sentence that haunts every modern HBT measurement: the *same* analysis, with $\\mathcal{M} \\to 1$ and the sign of the excess reversed, would imply *anti*bunching for a source emitting one photon at a time. The community did not act on this hint for twenty-one years, until Kimble, Dagenais and Mandel observed it in resonance fluorescence [25].\n\n### Crediting the resolution\n\nHanbury Brown and Twiss were, by 1957, in a position to write the full coherence-theoretic defence themselves, and they did, in the Proc. Roy. Soc. A series [16]. But the *conceptual* victory in 1956 was not theirs. They had produced the experiment and a defensible if pedestrian semiclassical justification; Brannen, Ferguson and the Budapest group had produced data that was consistent with their apparatus and a misreading of Dirac that was widely shared; Purcell produced the explanation that everyone accepted. The HBT canon habitually compresses this into \"Hanbury Brown and Twiss showed photon bunching is consistent with quantum mechanics\", which is true only in the sense that an experiment is consistent with its eventual correct interpretation. Hanbury Brown himself, characteristically generous, credits Purcell explicitly in [5] and [4]. The textbooks largely do not."}, {"id": "from-hbt-to-glauber-and-sudarshan", "title": "Formalization: Coherent States, the Coherence Hierarchy, and the Sudarshan–Glauber Credit Question", "markdown": "## Formalization: Coherent States, the Coherence Hierarchy, and the Sudarshan–Glauber Credit Question\n\nBy the end of 1956 the experimental fact was secure and Purcell's letter [21] had supplied a one-paragraph classical explanation: a chaotic field's photocount excess is the Bose term in the shot-noise variance. What was missing was a *quantum* framework in which one could write down, without apology, why a coherent laser beam (not yet built when the controversy began) would *not* bunch, why a Fock state would anti-bunch, and how to talk about all of these on the same footing. That framework — the coherent-state formalism, the normal-ordered hierarchy $g^{(n)}$, and the diagonal $P$-representation — was assembled in a six-month window in 1963 by Glauber [19, 20] and, independently and almost simultaneously, by Sudarshan [18]. The HBT controversy is what made the assembly *necessary*; Glauber says so explicitly in his Nobel lecture [1].\n\n### Coherent states as the eigenvectors of the detection operator\n\nGlauber's starting point [19] is the photodetection model that Mandel and Wolf had been refining since the late 1950s: an ideal photodetector at point $\\mathbf{r}$ and time $t$ couples through the positive-frequency field $\\hat{E}^{(+)}(\\mathbf{r},t)$, so the joint probability of detecting one photon at $(\\mathbf{r}_1,t_1)$ and another at $(\\mathbf{r}_2,t_2)$ is proportional to the normal- and time-ordered correlation\n\n$$G^{(2)}(\\mathbf{r}_1,t_1;\\mathbf{r}_2,t_2) = \\left\\langle \\hat{E}^{(-)}(\\mathbf{r}_1,t_1)\\,\\hat{E}^{(-)}(\\mathbf{r}_2,t_2)\\,\\hat{E}^{(+)}(\\mathbf{r}_2,t_2)\\,\\hat{E}^{(+)}(\\mathbf{r}_1,t_1) \\right\\rangle.$$\n\nThe HBT coincidence rate *is* this object, evaluated at equal space points with a delay $\\tau$. Glauber's first move was to ask: which states diagonalize $\\hat{E}^{(+)}$? The answer — the right eigenstates $|\\alpha\\rangle$ of the annihilation operator $\\hat{a}|\\alpha\\rangle = \\alpha|\\alpha\\rangle$ for each mode — gives the *coherent states*, and they have the property that all normal-ordered correlation functions *factorize*:\n\n$$G^{(n)}(x_1,\\ldots,x_n;x_n,\\ldots,x_1) = \\prod_{j=1}^{n} G^{(1)}(x_j;x_j), \\qquad g^{(n)}(\\tau_1,\\ldots) \\equiv 1.$$\n\nThis is the operational definition Glauber proposed for a *fully coherent* field of order $n$: factorization of $G^{(n)}$ up to order $n$. A laser well above threshold approaches this; a chaotic source achieves only $g^{(1)}(0)=1$ and has $g^{(2)}(0)=2$; a single-emitter source has $g^{(2)}(0)=0$. The HBT measurement is precisely the *order-2 entry* in this hierarchy, and the controversy that preceded it disappears: bunching, no bunching, and anti-bunching correspond to three different rungs.\n\nIt is worth saying plainly what Glauber did *not* invent. Coherent states as Gaussian wavepackets minimising $\\Delta x\\,\\Delta p$ go back to Schrödinger 1926 (verify). The displaced number-state representation was used by Klauder in 1960 (verify). What Glauber contributed was (i) identifying $|\\alpha\\rangle$ as the operational eigenstate of optical photodetection, (ii) defining the coherence hierarchy via factorization, and (iii) tying both to a measurable quantity, $g^{(n)}$, that HBT had just put on the table.\n\n### The diagonal $P$-representation and Sudarshan's claim\n\nThe second 1963 paper [20] introduced the diagonal coherent-state representation,\n\n$$\\hat{\\rho} = \\int P(\\alpha)\\,|\\alpha\\rangle\\langle\\alpha|\\,d^2\\alpha,$$\n\nso that every normal-ordered expectation reads as a *classical* phase-space average over $P(\\alpha)$. For $P(\\alpha)\\ge 0$ a probability density, the field is indistinguishable from a classical stochastic mixture of coherent amplitudes, and the Cauchy–Schwarz inequality of Purcell's argument forces $g^{(2)}(0)\\ge 1$. The *operational* signature of nonclassicality is therefore $P$ failing to be a probability density — equivalently, $g^{(2)}(0)\u003c1$ or any negativity of $P$ smoothed against an admissible test function.\n\nThis is the exact construction Sudarshan published, as a 3-page PRL received 1 March 1963, in *Phys. Rev. Lett.* 10, 277 [18], titled \"Equivalence of Semiclassical and Quantum Mechanical Descriptions of Statistical Light Beams.\" Sudarshan proved a stronger statement than Glauber: that *every* density operator of the radiation field admits such a diagonal representation, provided one allows $P$ to be a tempered distribution (delta-functions, derivatives of delta-functions). The \"equivalence\" of the title is precisely the statement that any quantum state of light can be written *as if* it were a classical stochastic ensemble, with the proviso that the \"probability\" may be non-positive — which is exactly the residue of the genuine quantum content. Sudarshan's PRL appeared between Glauber's two *Phys. Rev.* papers [19, 20]; the relative chronology is debated, the conceptual content is essentially identical, and the modern community name \"$P$-representation\" or \"Glauber–Sudarshan $P$-function\" preserves the joint credit only inconsistently.\n\n### The credit audit\n\nThe textbook naming is uneven on every axis:\n\n- \"Glauber state\" for $|\\alpha\\rangle$ is now universal in quantum optics; \"Schrödinger coherent state\" is the historically correct older name.\n- \"$P$-representation\" without a name is the most common usage; \"Glauber–Sudarshan\" is the careful usage and is what Mandel and Wolf adopt [22]; \"Sudarshan diagonal representation\" is essentially never used.\n- The coherence hierarchy $g^{(n)}$ is uniformly attributed to Glauber [19].\n- The 2005 Nobel was awarded *to Glauber* \"for his contribution to the quantum theory of optical coherence\" — half of the physics prize, the other half going to Hall and Hänsch for optical frequency combs. Sudarshan was not on the citation.\n\nThe community reaction was not silent. Sudarshan wrote an open letter to the Nobel Committee in 2005 protesting the omission, and a sizable fraction of the quantum-optics community — including senior figures such as Mehta and members of the Indian Academy — supported it. The defenders of the Committee's choice, generally outside India, made two arguments: (i) Glauber's two 1963 papers built a wider edifice (the hierarchy, the photodetection theory, the multi-mode generalisation) of which the diagonal representation was one component; (ii) the Nobel rules forbid posthumous and unlimited-co-author awards. Sudarshan himself did not accept (i), and the technical historians who have examined the question — most accessibly Mandel and Wolf [22], who use \"Glauber–Sudarshan\" by convention — concede that the *mathematical* content of the $P$-representation appears in Sudarshan [18] before it appears in Glauber [20]. Glauber's own Nobel lecture [1] cites Sudarshan but treats the diagonal representation as a side-development of his own coherent-state programme, which is, at best, debatable.\n\nThe defensible AETHER reading: Glauber's hierarchy and his identification of $|\\alpha\\rangle$ as the eigenstate of $\\hat{E}^{(+)}$ are his alone and would have justified the Nobel by themselves. The diagonal representation is joint, with priority arguably Sudarshan's; the failure to share the prize on this latter point is a genuine omission, not a fabrication of partisans. The standard citation \"Glauber–Sudarshan $P$-function\" is the historically honest one and should be the default in any modern paper that uses $P(\\alpha)\u003c0$ as a nonclassicality witness.\n\n### What the formalism actually delivered for HBT\n\nWith $g^{(2)}(\\tau)$ defined as a quantum, normal-ordered, dimensionless object, three statements that had been muddled in 1956 became sharp:\n\n1. *Bunching as a classical phenomenon.* For any $P\\ge 0$, $g^{(2)}(0) = 1 + \\langle (\\Delta I)^2 \\rangle_P / \\langle I \\rangle_P^2 \\ge 1$. The HBT 1956 result lives entirely on this side.\n2. *Chaotic-thermal bound.* For a stationary zero-mean Gaussian field, the moment theorem gives $g^{(2)}(0) = 2$ exactly — the Siegert relation, which §2 has already treated. This is a *theorem* in the Glauber formalism, not a postulate.\n3. *Nonclassicality.* $g^{(2)}(0) \u003c 1$ requires $P$ to fail positivity. This is the precise sense in which Kimble–Dagenais–Mandel's 1977 antibunching [25] is \"nonclassical\": not because two detectors clicked, but because no $P\\ge 0$ can reproduce the suppression.\n\nThe formalism is, in this sense, the answer the 1956 controversy was waiting for. Brannen and Ferguson had been wrong because they conflated photon number eigenstates with the actual state of mercury-arc radiation; Ádám–Jánossy–Varga [11] had been operationally correct but starved of signal; Purcell had been conceptually correct but his argument was classical. Glauber and Sudarshan together built the bilingual dictionary in which all three statements could be made simultaneously, and HBT was promoted from a paradox to an entry — the $n=2$ entry — in a hierarchy."}, {"id": "landmark-descendants", "title": "Landmark Descendants: GGLP, Narrabri, Kimble–Dagenais–Mandel, and Atomic HBT", "markdown": "## Landmark Descendants: GGLP, Narrabri, Kimble–Dagenais–Mandel, and Atomic HBT\n\nBy the time Purcell's letter [21] had settled the conceptual dispute and Glauber's papers [19, 20] had supplied the formal apparatus, the Hanbury Brown–Twiss correlator had become a portable instrument. Between 1960 and the early 2000s, four programmes — pion interferometry, the Narrabri stellar campaign, resonance fluorescence antibunching, and atomic HBT — converted $g^{(2)}$ from an oddity into a metrology. Each instance reuses the same two-detector geometry and the same second-order coherence function, but each probes a different physical content. The cataloguing below makes that content explicit, and in particular explains why GGLP — known in nuclear physics for forty years as a distinct effect — is the HBT effect applied to a Bose field whose quanta happen to have rest mass.\n\n### GGLP (1960): HBT in the pion sea\n\nGoldhaber, Goldhaber, Lee, and Pais [14] were not looking for Hanbury Brown's effect. They were studying $\\bar{p}p$ annihilation at the Bevatron and trying to fit the angular distribution of like-sign pion pairs. The like-sign pairs ($\\pi^+\\pi^+$, $\\pi^-\\pi^-$) were preferentially correlated at small relative momentum compared to unlike-sign pairs — by a factor that no resonance or phase-space argument could absorb. They wrote down a two-particle wavefunction symmetrised over the production points and showed that the ratio\n\n$$\\mathcal{C}_2(q) \\;=\\; \\frac{P_2(p_1,p_2)}{P_1(p_1)P_1(p_2)} \\;=\\; 1 + |\\tilde{\\rho}(q)|^2,$$\n\nwith $q = p_1 - p_2$ and $\\tilde{\\rho}$ the Fourier transform of the (chaotic) emission source $\\rho(x)$, fitted the data with an emission radius of $\\sim 0.8$ fm. They did not cite Hanbury Brown.\n\nThe formal identity with HBT is exact under one assumption: that the pion source is *chaotic* — a sum of many independent emitters with random phases — so that the multi-pion density matrix factorises into single-particle Wigner functions plus a Bose-symmetrised exchange term. Under that assumption the two-pion correlator is literally the Siegert relation written in momentum rather than time:\n\n$$\\langle \\hat{n}(p_1)\\hat{n}(p_2)\\rangle = \\langle \\hat{n}(p_1)\\rangle\\langle \\hat{n}(p_2)\\rangle \\bigl(1 + |\\tilde{\\rho}(p_1-p_2)|^2\\bigr),$$\n\nwith $|\\tilde{\\rho}(q)|^2$ playing the role of $|g^{(1)}|^2$. The \"source radius\" extracted from a Gaussian fit is the same object as the Hanbury Brown–Twiss baseline-to-source-size ratio — a coherence length in the conjugate variable. That this is identical to $|\\gamma_{12}|^2$ in the van Cittert–Zernike sense was first noted in print by Shuryak and by Kopylov–Podgoretsky in the 1970s, and made canonical by Boal–Gelbke–Jennings [15] and Baym [26].\n\nThe pitfall is exactly the one Gyulassy flagged in 1982 [27]: collective flow, resonance feed-down, Coulomb final-state interactions, and partial coherence all modify $\\mathcal{C}_2$ independently of $\\rho(x)$. The \"HBT radii\" reported by STAR [28, 29] and quoted as fireball sizes are coherence lengths convolved with the dynamics of expansion. Florkowski's monograph [30] devotes an entire chapter to the corrections needed before $\\mathcal{C}_2(q)$ can be inverted geometrically. The Adams et al. polarisation paper [31] and Adam et al. [28] are downstream of this same machinery — the femtoscopy programme is HBT with a hadron Hilbert space and a hydrodynamic substrate. The recent attempt to extend the same correlator to exotic states via charmed-meson femtoscopy [32] is the direct lineal descendant of Goldhaber et al.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eHBT geometry and its three landmark realisations\u003c/title\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eOne correlator, three physical contents\u003c/text\u003e\u003cline x1=\"40\" y1=\"60\" x2=\"680\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"0.5\"/\u003e\u003ctext x=\"60\" y=\"90\" fill=\"#7aa2ff\" font-size=\"14\"\u003eHBT 1956 (photons)\u003c/text\u003e\u003ccircle cx=\"120\" cy=\"140\" r=\"18\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"120\" y=\"145\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eHg arc\u003c/text\u003e\u003cline x1=\"138\" y1=\"140\" x2=\"220\" y2=\"115\" stroke=\"#e8e6e1\" stroke-width=\"0.7\"/\u003e\u003cline x1=\"138\" y1=\"140\" x2=\"220\" y2=\"165\" stroke=\"#e8e6e1\" stroke-width=\"0.7\"/\u003e\u003crect x=\"220\" y=\"105\" width=\"22\" height=\"20\" fill=\"none\" stroke=\"#7aa2ff\"/\u003e\u003crect x=\"220\" y=\"155\" width=\"22\" height=\"20\" fill=\"none\" stroke=\"#7aa2ff\"/\u003e\u003ctext x=\"255\" y=\"120\" fill=\"#e8e6e1\" font-size=\"12\"\u003eD1\u003c/text\u003e\u003ctext x=\"255\" y=\"170\" fill=\"#e8e6e1\" font-size=\"12\"\u003eD2\u003c/text\u003e\u003ctext x=\"60\" y=\"200\" fill=\"#e8e6e1\" font-size=\"12\"\u003eg⁽²⁾(τ) = 1 + |γ₁₂(τ)|²\u003c/text\u003e\u003ctext x=\"60\" y=\"216\" fill=\"#e8e6e1\" font-size=\"12\"\u003eprobes optical coherence time\u003c/text\u003e\u003ctext x=\"290\" y=\"90\" fill=\"#ffb86b\" font-size=\"14\"\u003eGGLP 1960 (pions)\u003c/text\u003e\u003ccircle cx=\"350\" cy=\"140\" r=\"22\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/\u003e\u003ctext x=\"350\" y=\"145\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003efireball\u003c/text\u003e\u003cline x1=\"372\" y1=\"140\" x2=\"450\" y2=\"115\" stroke=\"#e8e6e1\" stroke-width=\"0.7\"/\u003e\u003cline x1=\"372\" y1=\"140\" x2=\"450\" y2=\"165\" stroke=\"#e8e6e1\" stroke-width=\"0.7\"/\u003e\u003ctext x=\"455\" y=\"120\" fill=\"#e8e6e1\" font-size=\"12\"\u003eπ(p₁)\u003c/text\u003e\u003ctext x=\"455\" y=\"170\" fill=\"#e8e6e1\" font-size=\"12\"\u003eπ(p₂)\u003c/text\u003e\u003ctext x=\"290\" y=\"200\" fill=\"#e8e6e1\" font-size=\"12\"\u003eC₂(q) = 1 + |ρ̃(q)|²\u003c/text\u003e\u003ctext x=\"290\" y=\"216\" fill=\"#e8e6e1\" font-size=\"12\"\u003eprobes source radius R\u003c/text\u003e\u003ctext x=\"510\" y=\"90\" fill=\"#7ee0a3\" font-size=\"14\"\u003eKDM 1977 (atom)\u003c/text\u003e\u003ccircle cx=\"560\" cy=\"140\" r=\"10\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"560\" y=\"170\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eNa⁺ ion\u003c/text\u003e\u003cline x1=\"570\" y1=\"140\" x2=\"650\" y2=\"115\" stroke=\"#e8e6e1\" stroke-width=\"0.7\"/\u003e\u003cline x1=\"570\" y1=\"140\" x2=\"650\" y2=\"165\" stroke=\"#e8e6e1\" stroke-width=\"0.7\"/\u003e\u003crect x=\"650\" y=\"105\" width=\"22\" height=\"20\" fill=\"none\" stroke=\"#7ee0a3\"/\u003e\u003crect x=\"650\" y=\"155\" width=\"22\" height=\"20\" fill=\"none\" stroke=\"#7ee0a3\"/\u003e\u003ctext x=\"510\" y=\"200\" fill=\"#e8e6e1\" font-size=\"12\"\u003eg⁽²⁾(0) \u0026lt; 1\u003c/text\u003e\u003ctext x=\"510\" y=\"216\" fill=\"#e8e6e1\" font-size=\"12\"\u003eprobes single-emitter regression\u003c/text\u003e\u003cline x1=\"40\" y1=\"250\" x2=\"680\" y2=\"250\" stroke=\"#e8e6e1\" stroke-width=\"0.5\"/\u003e\u003ctext x=\"360\" y=\"278\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eCommon quantity: g⁽²⁾(τ) = ⟨:Î(t)Î(t+τ):⟩ / ⟨Î⟩²\u003c/text\u003e\u003ctext x=\"360\" y=\"302\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eClassical bound g⁽²⁾(0) ≥ 1 violated only by KDM ⇒ first nonclassical signature\u003c/text\u003e\u003ctext x=\"360\" y=\"332\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eHBT/GGLP: chaotic field, Gaussian moments, Siegert relation\u003c/text\u003e\u003ctext x=\"360\" y=\"352\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eKDM: single quantum emitter, no Gaussian factorisation, P-function negative\u003c/text\u003e\u003ctext x=\"360\" y=\"380\" fill=\"#e8e6e1\" font-size=\"11\" text-anchor=\"middle\"\u003eSame apparatus. Opposite physics. The instrument does not know which.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The HBT correlator deployed in three landmark experiments. Bunching in the photon and pion cases arises from chaotic-source Bose statistics (Siegert/GGLP); antibunching in the Kimble–Dagenais–Mandel experiment arises from the impossibility of re-emitting before the upper level has been repopulated. The two-detector geometry is invariant.*\n\n### Narrabri (1964–1974): HBT becomes astronomy\n\nThe Narrabri Stellar Intensity Interferometer (NSII), built by Hanbury Brown with John Davis and L. R. Allen on a 188-m circular rail track in New South Wales, was the deliverable [5, 13]. Two 6.5-m mosaic-mirror \"light buckets\" focused starlight onto photomultipliers; the photocurrent fluctuations were correlated electronically over baselines from 10 to 188 m. Between 1965 and 1972 the NSII measured 32 angular diameters in the range $5\\times10^{-4}$ to $10^{-2}$ arcsec, including most of the bright early-type stars north of $\\delta \\approx -50°$ ([33, 34]; review in [35, 36]).\n\nThe diagnostic equation is the squared van Cittert–Zernike modulus,\n\n$$g^{(2)}(b,\\tau{=}0) - 1 \\;=\\; \\bigl|\\tilde{I}(\\mathbf{u})\\bigr|^2 \\big/ \\bigl(\\textstyle\\int I\\,\\mathrm{d}^2x\\bigr)^2, \\qquad \\mathbf{u} = \\mathbf{b}/\\lambda,$$\n\nwith $\\tilde{I}$ the Fourier transform of the surface brightness. For a uniform disk of angular radius $\\theta$ this is $[2J_1(\\pi\\theta b/\\lambda)/(\\pi\\theta b/\\lambda)]^2$, and the first zero locates $\\theta$. The phase of $\\tilde{I}$ is destroyed — a deliberate trade: phase noise from the atmosphere, the optics, and the photomultiplier electronics is destroyed with it. This is why Narrabri worked with 6.5-m mosaics that would have been useless for amplitude (Michelson) interferometry, and why VERITAS and CTA — gamma-ray telescopes whose mirror figure is far below diffraction-limited at optical wavelengths — could be repurposed as a stellar interferometer in the 2020 revival [8, 7] (treated in §8).\n\nThe NSII programme had a limiting magnitude near $V \\approx +2.5$ and required hundreds of hours per star. Davis's continuation through SUSI [33, 34] and Bonneau's optical-amplitude attempts [35] mark the lineage that later became the modern VLTI and CHARA arrays. The credit audit is sharp here: the Narrabri catalogue is universally quoted as Hanbury Brown's, but every diameter in it was measured by Davis and Allen running the instrument [5, 13].\n\n### Kimble–Dagenais–Mandel (1977): the sign flips\n\nIn May 1977 Kimble, Dagenais, and Mandel [25] reported coincidence rates from a beam of $\\mathrm{Na}$ atoms excited on resonance by a tuned dye laser. Their measured $g^{(2)}(\\tau)$ rose from a value *below* unity at $\\tau = 0$ to a plateau of unity at large $\\tau$. The classical Cauchy–Schwarz bound $g^{(2)}(0) \\geq g^{(2)}(\\tau)$ — equivalent to the requirement that the Glauber–Sudarshan $P$-function be a probability density [19, 18] — was violated. After background corrections the inferred single-atom $g^{(2)}(0)$ was indistinguishable from zero.\n\nThe physical content has no analogue in HBT: a single two-level emitter cannot radiate two photons simultaneously because the upper level must repopulate, a time set by the spontaneous-emission rate $\\Gamma$ and the Rabi frequency $\\Omega$. The optical Bloch equations give, on resonance,\n\n$$g^{(2)}(\\tau) \\;=\\; 1 - e^{-3\\Gamma\\tau/4}\\!\\left[\\cos\\Omega'\\tau + \\tfrac{3\\Gamma}{4\\Omega'}\\sin\\Omega'\\tau\\right], \\qquad \\Omega' = \\sqrt{\\Omega^2 - (\\Gamma/4)^2}.$$\n\nThis is not a Siegert relation. It is the quantum regression of the single-atom dipole-dipole correlator. Mandel's experiment is the operational birth certificate of nonclassical light and the direct ancestor of every modern single-photon-source characterisation [37, 38, 39, 40, 41, 42, 43]. The community convention $g^{(2)}(0) \u003c 0.5$ for \"single-photon\" emission is folklore descended from this paper; the theorem only says $g^{(2)}(0) \u003c 1$ certifies nonclassicality, nothing more (see §6).\n\n### Atomic HBT (2000s): bosons, fermions, and the sign of statistics\n\nThe translation of HBT to massive particles closed a half-century loop. Fölling et al. [44] released a Mott-insulating ${}^{87}\\mathrm{Rb}$ cloud from an optical lattice and measured the noise correlator $\\langle \\delta n(\\mathbf{k})\\delta n(\\mathbf{k}')\\rangle$ in the absorption image after time-of-flight. The bunching peaks at $\\mathbf{k} - \\mathbf{k}' = \\mathbf{G}$ — reciprocal-lattice vectors — directly imaging the periodicity through the Bose exchange term in $g^{(2)}$. Parallel and subsequent experiments (Schellekens, Hodgman, Westbrook and collaborators) used metastable ${}^4\\mathrm{He}^*$ and ${}^3\\mathrm{He}^*$ on micro-channel-plate detectors capable of single-atom timing: bosonic ${}^4\\mathrm{He}^*$ showed $g^{(2)}(0) = 2$ as predicted for a chaotic Gaussian field; fermionic ${}^3\\mathrm{He}^*$ showed $g^{(2)}(0) = 0$ — Pauli antibunching, the sign-flipped Siegert relation $g^{(2)}(\\tau) = 1 - |g^{(1)}(\\tau)|^2$. The Berrada et al. integrated Mach–Zehnder interferometer for BECs [45] is a coherent-source counterexample showing $g^{(2)}(0) \\to 1$ in the condensed mode, completing the demonstration that the bunching/antibunching/Poisson trichotomy survives intact when photons are replaced by atoms.\n\nThe unification is the point: HBT [6], GGLP [14], NSII [5], KDM [25], and atomic HBT [44] are not analogies. They are the same correlator $g^{(2)}$ evaluated on different fields — electromagnetic, hadronic, atomic — under different occupation statistics. The instrument cannot distinguish them; the regime of validity does."}, {"id": "use-and-abuse-of-g2", "title": "Use and Abuse: What g^(2)(0) Does and Does Not Certify", "markdown": "## Use and Abuse: What g^(2)(0) Does and Does Not Certify\n\nHBT bequeathed to quantum optics a single scalar — $g^{(2)}(0)$ — that has since become the most overloaded number in the field. A modern single-photon-source paper, a quasi-thermal lamp demonstration, and a heavy-ion femtoscopy fit all report it, and all routinely overstate what it certifies. The operational definition is unambiguous,\n\n$$g^{(2)}(\\tau) \\;=\\; \\frac{\\langle:\\hat I(t)\\,\\hat I(t+\\tau):\\rangle}{\\langle\\hat I(t)\\rangle\\,\\langle\\hat I(t+\\tau)\\rangle} \\;=\\; \\frac{\\langle \\hat a^\\dagger(t)\\,\\hat a^\\dagger(t+\\tau)\\,\\hat a(t+\\tau)\\,\\hat a(t)\\rangle}{\\langle \\hat a^\\dagger\\hat a\\rangle^{\\,2}},$$\n\nbut the conditions under which the canonical values $g^{(2)}(0) = 1,\\,2,\\,1-1/n$ apply are precisely what the abuses ignore.\n\n### The classical bound and the two abuses\n\nFor any classical (P-positive) field the Cauchy–Schwarz inequality on the stochastic intensity gives $\\langle I(t)^2\\rangle \\geq \\langle I(t)\\rangle^2$, hence $g^{(2)}(0) \\geq 1$ [21, 19, 18]. Sub-unity values are the *only* intrinsically quantum statement an HBT geometry can make. From this single inequality two textbook overreaches are routinely manufactured.\n\n**Abuse #1: \"$g^{(2)}(0) \u003e 1$ certifies thermal light.\"** The closed-form bound $g^{(2)}(0) = 2$ and the Siegert factorisation\n\n$$g^{(2)}(\\tau) \\;=\\; 1 + |g^{(1)}(\\tau)|^{\\,2}$$\n\nhold simultaneously only for a stationary, zero-mean, complex-circular Gaussian field [22]. Each adjective is load-bearing. Drop stationarity — pulsed chaotic sources, quasi-thermal rotating-ground-glass lamps [46] outside the slow-mode limit, atmospheric scintillation with a non-stationary log-amplitude statistic [47] — and the relation becomes an inequality whose value depends on the integration window. Drop Gaussianity, and superbunched fields with $g^{(2)}(0) \u003e 2$ emerge: conditionally prepared parametric-pair states, non-Gaussian classical mixtures, and intensity-doubled cascades all violate the bound. Conversely, a $k$-mode incoherent thermal mixture in equal weights gives $g^{(2)}(0) = 1 + 1/k$, which collapses toward unity as the mode count grows. Reporting a measurement of $g^{(2)}(0) = 1.9 \\pm 0.1$ as \"consistent with a chaotic source\" is therefore a category error until both stationarity and Gaussianity have been verified independently — by the spectrum, the first-order coherence $|g^{(1)}(\\tau)|$, or photon-number-resolved counting. The generalised-Siegert literature [17] makes the failure modes explicit.\n\n**Abuse #2: \"$g^{(2)}(0) \u003c 1$ certifies a single-photon source.\"** What sub-unity actually certifies is nonclassicality — the existence of a region where the Glauber–Sudarshan $P$-distribution must go negative [19, 18]. It does *not* certify single-photon Fock emission. In the weak-excitation limit a useful identity is\n\n$$g^{(2)}(0) \\;\\approx\\; \\frac{2\\,P(n\\!\\geq\\!2)}{\\langle n\\rangle^{\\,2}},$$\n\nwhich exposes $g^{(2)}(0)$ as a multi-photon-probability proxy rather than a Fock-state proxy. The community threshold \"$g^{(2)}(0) \u003c 0.5$\" is a convention with one defensible justification: it is the boundary between $N=1$ and $N\\geq 2$ identical independent emitters, since for $N$ such sources\n\n$$g^{(2)}_N(0) \\;=\\; 1 - \\frac{1 - g^{(2)}_1(0)}{N}.$$\n\nFor ideal single-photon emitters this gives $0$ for $N=1$, $1/2$ for $N=2$, $2/3$ for $N=3$. A reported \"0.45\" therefore certifies at best that the addressed mode is dominated by a single emitter — not that the emitted state is $|1\\rangle$. The 1977 Kimble–Dagenais–Mandel experiment [25] was honest about exactly this point.\n\n### Corrections that the raw number does not include\n\nFour standard distortions move $g^{(2)}_\\text{meas}(0)$ away from the source value $g^{(2)}_\\text{src}(0)$ and must be unwound before the result is interpretable.\n\n*Background and dark counts.* Let $\\rho = S/(S+B)$ be the signal-to-total ratio at the detectors. Treating background as a Poissonian increment uncorrelated with the source gives the standard linear correction\n\n$$g^{(2)}_\\text{meas}(0) \\;=\\; 1 + \\rho^{\\,2}\\bigl[g^{(2)}_\\text{src}(0) - 1\\bigr],\\qquad g^{(2)}_\\text{src}(0) \\;=\\; 1 + \\frac{g^{(2)}_\\text{meas}(0) - 1}{\\rho^{\\,2}}.$$\n\nA source with true $g^{(2)}(0) = 0$ and 30 % background ($\\rho = 0.7$) reads $g^{(2)}_\\text{meas}(0) \\approx 0.51$ — straddling the conventional threshold. Most \"$g^{(2)}(0) \u003c 0.5$\" claims in solid-state emitters [37, 38, 39, 40, 42] depend sensitively on the $\\rho^{\\,2}$ rescaling and on whether SPAD dark counts are subtracted as correlated or uncorrelated; the answer is almost always \"uncorrelated\", but only if the two SPADs are not seeing the same stray-light glow.\n\n*Detector timing jitter vs. emitter lifetime.* The measured coincidence histogram is the source $g^{(2)}(\\tau)$ convolved with the joint instrument response function (IRF). For an exponential antibunching dip $1 - e^{-\\Gamma|\\tau|}$ smeared by a Gaussian IRF of width $\\sigma_t$, the zero-delay value is lifted toward unity by a factor that, for $\\Gamma\\sigma_t \\gtrsim 1$, washes the dip out entirely. The qualitative rule is simple: if the emitter radiative lifetime is shorter than the SPAD jitter — perovskite quantum dots, plasmonically Purcell-enhanced emitters [42] — the raw $g^{(2)}_\\text{meas}(0)$ is meaningless without deconvolution, and most reports therefore quote a *fitted*, not a measured, zero-delay value. That distinction is rarely made loud.\n\n*Multi-emitter contamination.* The $N$-emitter formula above is the dominant background-free source of inflated zero-delay values. In confocal addressing of nominally identical quantum dots, NV centres, or hBN defects [39, 40], saturation of a single emitter within the diffraction spot is itself a fit parameter; quoting $g^{(2)}(0)$ without an independent confocal-saturation or photon-statistics check leaves $N$ undetermined.\n\n*Start–stop vs. full multi-start correlator.* The original HBT and KDM setups used a time-to-amplitude converter that records only the *first* stop after each start. The resulting waiting-time density is\n\n$$w(\\tau) \\;=\\; R\\,g^{(2)}(\\tau)\\,\\exp\\!\\left[-R\\!\\int_0^\\tau g^{(2)}(t')\\,dt'\\right],$$\n\nwhere $R$ is the mean count rate. For $R\\tau \\ll 1$ this collapses to $w(\\tau) \\propto g^{(2)}(\\tau)$; at higher rates or longer delays the dead-time exponential depresses the long-$\\tau$ baseline and systematically distorts the inferred contrast — a free 20 % suppression of the apparent bunching peak is easy to manufacture this way. Modern multi-start, multi-stop correlators (Becker–Hickl, qutools, FPGA arrays) reconstruct the true $g^{(2)}(\\tau)$ directly and are mandatory whenever $R\\tau_\\text{window} \\gtrsim 0.1$.\n\n### Residual conflations\n\n*HBT is not intrinsically quantum.* Purcell's 1956 letter [21] settled this within months: bunching is the Bose excess-fluctuation term in the shot noise of a chaotic field and survives a fully classical stochastic-optics derivation. Only $g^{(2)}(0) \u003c 1$ requires $P$-negativity, i.e. quantisation [19, 18].\n\n*HBT is not antibunching with the sign flipped.* The apparatus is identical — beamsplitter, two detectors, coincidence — and the measured object is the same $g^{(2)}(\\tau)$ [25]. The physics is not: bunching is a statement about the second moment of a positive stochastic intensity envelope; antibunching is a statement about the discreteness of the emitter's photon-number ladder. Calling a 2024 hBN-defect antibunching report \"an HBT measurement\" is geometrically accurate and conceptually misleading.\n\n*The GGLP/femtoscopy correlator is not a clean HBT.* In hadronic and heavy-ion final states the Bose–Einstein peak in the two-particle correlator [15, 28, 29, 32] is contaminated by collective flow, resonance feed-down, Coulomb and strong final-state interactions, and partial source coherence; Gyulassy's 1982 analysis [27] remains the canonical caution that the extracted \"HBT radius\" is a coherence length convolved with the source's dynamical evolution, not a Euclidean source size. Importing the optical Siegert relation into heavy-ion data without these corrections — still occasionally done — is wrong by construction.\n\nRead narrowly, then, a measured $g^{(2)}(0)$ certifies one of three things and only one: above unity, an excess of intensity (or particle-pair) correlations whose origin must be argued separately; near unity, consistency with a Poissonian (coherent, or strongly multimode) source; below unity, the existence of nonclassical photon-number statistics in the addressed mode. Thermal character, single-photon purity, and source size are all *downstream inferences* that require auxiliary measurements — and most of the published abuses of HBT consist of skipping that downstream step."}, {"id": "signatures-stationarity-and-gaussianity", "title": "Signatures and Their Regimes: Stationarity, Gaussianity, and Where the Siegert Relation Fails", "markdown": "## Signatures and Their Regimes: Stationarity, Gaussianity, and Where the Siegert Relation Fails\n\nThe Siegert relation\n$$g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2,\\qquad g^{(2)}(0)=2,$$\nis the textbook signature of \"chaotic\" light and the workhorse behind every claim that a measured $g^{(2)}(0)$ \"looks thermal\". It is a theorem with four explicit hypotheses: the analytic-signal field $E(t)$ is (i) **stationary**, (ii) **Gaussian** (the classical limit of a many-mode chaotic field by the central limit theorem), (iii) **zero-mean** (no coherent component), and (iv) sampled with detection bandwidth that resolves the coherence time. Strip any one and the relation fails — sometimes by a factor, sometimes by orders of magnitude. The modern literature is full of $g^{(2)}(0)$ numbers reported and interpreted as if the hypotheses were free. A general account of how those hypotheses can be relaxed, and what replaces them, has only recently been written down systematically [17].\n\n### Stationarity: pulsed envelopes, blinking emitters, modulated chaos\n\nA pulsed thermal source — supercontinuum, amplified spontaneous emission gated through a fast switch, a free-electron laser in SASE — has an envelope $\\langle I(t)\\rangle$ that is itself time-dependent. The relevant correlator becomes\n$$g^{(2)}(\\tau) = \\frac{\\overline{\\langle I(t)\\,I(t+\\tau)\\rangle}}{\\overline{\\langle I(t)\\rangle}\\,\\overline{\\langle I(t+\\tau)\\rangle}},$$\nwith the outer bar a time average. For a stochastic envelope multiplying a fast chaotic carrier, $g^{(2)}(0)$ acquires an envelope-variance factor, $g^{(2)}(0)\\simeq M^{-1}\\bigl(1+\\sigma_E^2/\\langle E\\rangle^2\\bigr)$, that overrides the mode-count piece [48]. The same algebra describes intermittent emitters: a single quantum dot telegraphing between bright and dark states, integrated over delays long compared with the blink correlation, gives\n$$g^{(2)}(0)=1+\\frac{\\mathrm{Var}(I)}{\\langle I\\rangle^2},$$\nwhich can sit far above 2 even though the bright state is a Fock-state emitter with $g^{(2)}(0)\\ll 1$ on nanosecond delays. Reporting a single number \"$g^{(2)}(0)$\" for such a source is meaningless without a stated integration window — a recurrent abuse in the room-temperature single-photon literature [40, 42].\n\n### Mode counting: the $1+1/M$ ceiling\n\nFor $M$ equally populated independent chaotic modes the bunching peak is\n$$g^{(2)}(0)=1+\\frac{1}{M},$$\nand for arbitrary occupations $p_k\\equiv\\langle n_k\\rangle/\\langle n\\rangle$,\n$$g^{(2)}(0)=1+\\sum_k p_k^2.$$\nThis is the equation that controls every stellar HBT measurement. The spatial coherence area $A_c=\\lambda^2/\\Omega_{\\rm src}$ on a detector of area $A_d$ gives $M_\\perp\\approx A_d/A_c$, and the spectral coherence time $\\tau_c$ against detector response $\\tau_d$ gives $M_\\parallel\\approx\\tau_d/\\tau_c$, so the bunching contrast scales as $1/(M_\\perp M_\\parallel)$ — typically $10^{-7}$–$10^{-9}$ at Narrabri [5, 13]. The pedagogical icon \"$g^{(2)}(0)=2$\" describes a single mode; every real instrument lives somewhere on the $1+1/M$ curve, and reporting $g^{(2)}(0)$ without an effective mode count quotes an apparatus, not a source. Cherenkov-array intensity interferometry [7, 8] survives precisely because $M_\\parallel$ can be driven up by sub-nanosecond electronics and $M_\\perp$ down by aperture stops, exposing the otherwise-buried bunching.\n\n### Nonzero mean: the coherent–chaotic mixture\n\nA coherent amplitude $\\alpha$ added to an independent thermal mode of mean $\\langle n_{\\rm th}\\rangle$ violates hypothesis (iii). The full formula\n$$g^{(2)}(0) = \\frac{|\\alpha|^4 + 4|\\alpha|^2\\langle n_{\\rm th}\\rangle + 2\\langle n_{\\rm th}\\rangle^2}{(|\\alpha|^2+\\langle n_{\\rm th}\\rangle)^2} = 1 + r^2,\\qquad r\\equiv\\frac{\\langle n_{\\rm th}\\rangle}{|\\alpha|^2+\\langle n_{\\rm th}\\rangle},$$\ninterpolates between Poisson ($r=0$) and chaotic ($r=1$). Laser leakage into a Martienssen-style pseudo-thermal demonstration [46] reads as *reduced* bunching that is indistinguishable, from a single-baseline $g^{(2)}(0)$, from a multi-mode chaotic source — separating the two requires an independent measurement of $g^{(1)}$ or of the photon-number distribution. The same regime is what makes resonance fluorescence with a strong elastic (Rayleigh) component refill the Kimble–Dagenais–Mandel antibunching dip [25] for reasons that have nothing to do with multiphoton emission.\n\n### Superbunching: $g^{(2)}(0)\u003e2$ and the failure of Gaussianity\n\nThe Gaussian field bound is strict: any classical $g^{(2)}(0)\u003e2$ requires a non-Gaussian (still positive) $P$-function, and any $g^{(2)}(0)\u003c1$ requires a negative $P$. Parametric pair sources realize both. Single-mode squeezed vacuum has\n$$g^{(2)}(0)=3+\\frac{1}{\\langle n\\rangle},$$\nwhich diverges as $\\langle n\\rangle\\to 0$: a low-gain SPDC source can show $g^{(2)}(0)$ in the hundreds [49, 50]. Two-mode squeezed vacuum produces marginally thermal statistics in each arm, $g^{(2)}_{ss}(0)=g^{(2)}_{ii}(0)=2$, but a cross-correlator\n$$g^{(2)}_{si}(0)=2+\\frac{1}{\\langle n\\rangle},$$\nthat also diverges at low gain, supplying the standard Cauchy–Schwarz violation $\\bigl|g^{(2)}_{si}\\bigr|^2 \u003e g^{(2)}_{ss}\\,g^{(2)}_{ii}$ used to certify nonclassical pair correlation [49]. Filtered or modulated chaos — random-telegraph modulation, two-photon-resonant excitation of a hot ensemble, frequency-filtered Stokes/anti-Stokes scattering [51] — can also push $g^{(2)}(0)$ above 2 without any quantization: the modulation renders the envelope non-Gaussian and the Siegert factorization simply does not apply [17]. Reading \"$g^{(2)}(0)=6$\" as evidence of \"thermal-like statistics with extra correlations\" is a Gaussianity violation, not a quantum signature.\n\n### Partial coherence and dynamics: the hadron-HBT lesson\n\nIn subatomic HBT the chaotic-source hypothesis is itself a model: the produced pion field is assumed to be a sum of many independent emitters, hence Gaussian by the central limit theorem, and the two-particle correlator\n$$C_2(\\mathbf{q}) = 1 + \\lambda\\,|\\tilde\\rho(\\mathbf{q})|^2$$\nis fit with a Gaussian source distribution $\\rho(\\mathbf{x})$ and a chaoticity parameter $\\lambda\\le 1$. Gyulassy's 1982 warning [27] is that $\\lambda$ and the apparent \"radius\" are not separable from dynamics: a coherent pion-condensate contribution suppresses $\\lambda$; collective flow correlates emission angle with emission point and shrinks the apparent transverse radius into a *coherence* length rather than a geometric size; resonance decays add a long-lived halo that contaminates small $\\mathbf{q}$; Coulomb final-state interactions distort the correlator independently of the source [15, 28, 30]. The HBT radii published as functions of $\\sqrt{s_{NN}}$ and centrality at RHIC and the LHC [28, 30, 52] must therefore be unfolded through a hydrodynamic source model, not read as ruler lengths. The recent femtoscopic reconstruction programmes for rare-particle sources [32, 53] make this explicit: the correlator is a forward problem, not a direct measurement of $\\rho(\\mathbf{x})$, and the same caveats now extend to charmed-meson and exotic-hadron pairs.\n\n### Phase loss: why HBT cannot image, and what two-photon amplitude interferometry recovers\n\nThe cleanest structural failure of HBT is information loss. The van Cittert–Zernike relation maps the source intensity distribution onto the *complex* mutual coherence $\\gamma_{12}(\\mathbf{b})$, but the intensity interferometer measures $|\\gamma_{12}(\\mathbf{b})|^2$. Phase is gone, so a single baseline cannot distinguish a centred symmetric disk from an asymmetric or displaced source — a binary with unequal components and a uniform ellipsoid can produce identical $|\\gamma_{12}|^2$ vs.\\ baseline. Hanbury Brown accepted this trade as the price of immunity to atmospheric phase noise [5, 13], and the Narrabri programme worked entirely with parametric model fits to sphericised stellar atmospheres. Modern revivals on Cherenkov arrays [7, 8] inherit the same limitation. The current attempt to escape it is *two-photon amplitude interferometry* [23]: spectrally and temporally resolved coincidences between detectors at separated sites illuminated by two independent sources measure interference of biphoton amplitudes whose phase encodes the relative source position with sub-microarcsecond sensitivity. This protocol is no longer Siegert — the second-order observable is a sum of indistinguishable amplitudes, not a modulus-squared first-order coherence — and it sits outside the chaotic-Gaussian framework that powered the 1956 result. Where standard HBT measures $|\\gamma_{12}|^2$ and discards the phase, the two-photon protocol measures a genuinely two-photon amplitude and recovers it, at the cost of photon-number-resolved, time-tagged coincidence on every detector and a tolerance for the entire chain of stationarity, mode-counting, and Gaussianity caveats catalogued above."}, {"id": "current-frontier", "title": "Current Frontier: Stellar Intensity Interferometry Reborn, Two-Photon Imaging, and Open Problems", "markdown": "## Current Frontier: Stellar Intensity Interferometry Reborn, Two-Photon Imaging, and Open Problems\n\nBy the mid-1990s the HBT programme on the sky had effectively ended: the Narrabri Stellar Intensity Interferometer (NSII) was decommissioned in 1974 [5] and amplitude (Michelson) interferometers — CHARA, NPOI, VLTI — took over the visible/infrared niche with three-orders-of-magnitude better sensitivity on hundred-metre baselines. The textbook verdict — \"intensity interferometry is too photon-starved to be useful\" — was correct for 1970s technology. It is no longer correct.\n\n### Stellar intensity interferometry reborn on Cherenkov arrays\n\nThe revival was made possible by the imaging atmospheric Cherenkov arrays (IACTs) built for TeV γ-ray astronomy. Each of VERITAS, MAGIC, H.E.S.S. and the future CTA carries ≳ 100 m² of light-collecting area on baselines from tens of metres to ~1.5 km [7]; they sit idle under bright moonlight; their nanosecond-class photon-timing electronics are already adequate for SII. They are accidentally excellent intensity interferometers.\n\nThe 2020 VERITAS demonstration [8] re-established the technique by recovering the angular diameters of two well-characterised standards. The pace since has been brisk: VERITAS measured β UMa at sub-mas level with the four-telescope array ([Acharyya et al. 2024](https://iopscience.iop.org/article/10.3847/1538-4357/ad2b68)); MAGIC has published ~22 stellar diameters in the 400–440 nm band with few-percent precision, including the oblateness of γ Cas ([MAGIC Collaboration 2024](https://academic.oup.com/mnras/article/529/4/4387/7625603)); H.E.S.S. has implemented simultaneous two-colour SII and now extracts diameters of fast rotators at the few-percent level ([Zmija et al. 2025](https://academic.oup.com/mnras/article/537/3/2334/7909095)) and is pushing toward third-order correlations $g^{(3)}$ as a probe of source asymmetry. The Asiago group has run an independent line — photon-counting SPAD detectors on small (0.5 m) telescopes with kilometre baselines — showing that SII works well below the giant-aperture regime once timing jitter beats the source coherence time ([Zampieri et al. 2024](https://academic.oup.com/rasti/article/3/1/66/7590805)).\n\nThe science case has also broadened. For CTA the projected number of independent baselines is in the thousands, sufficient — in principle — for genuine $|γ_{12}(\\mathbf{b})|^2$ image inversion (the phase problem of §6 returns here in earnest) [7]. A physically novel application is gravitational microlensing: Meena \u0026 Saha argue that the micro-image swarm of a lensed quasar imprints non-trivial intensity correlations and that SII on IACTs could probe dark-matter substructure through the resulting fluctuation statistics [54].\n\n### Two-photon amplitude interferometry: recovering the lost phase\n\nThe price Hanbury Brown paid for atmospheric and instrumental insensitivity was the phase of $γ_{12}$: SII delivers only the squared modulus. Stankus, Nomerotski, Slosar and Vintskevich proposed a route around this — a two-photon amplitude interferometer in which one photon from each of two sky sources is sent to each of two stations and made to interfere in a Hong–Ou–Mandel-like configuration [23]. The observable is a two-photon coincidence whose fringe phase encodes the source separation, but the link between stations need only be classical (timing) rather than phase-stable optical. Earth-rotation fringe scanning then yields relative astrometry at the microarcsecond level ([Brown et al., PRD 2023](https://journals.aps.org/prd/abstract/10.1103/PhysRevD.107.023015)). Benchtop analogues show the expected coincidence visibility; on-sky deployment is the next step. Conceptually this is HBT's lineal descendant — same shot-noise-limited budget — but it operates at the amplitude ($g^{(1)}$) rather than intensity ($g^{(2)}$) level, and so recovers what HBT discards. It is not \"quantum\" in the entanglement sense it is sometimes marketed as: as Scarani's recent broadside [55] reminds, no entanglement is consumed; the photons are independent thermal emissions and the interference is a two-particle amplitude effect (a generalisation of the Fano effect).\n\n### HBT for massive particles and exotic emitters\n\nOutside optics, intensity interferometry has continued its quiet colonisation of every Hilbert space with a counting detector. Spatial quantum-noise interferometry on time-of-flight images of ultracold atomic gases [44] resolves both bosonic bunching and fermionic antibunching in momentum-space correlations of *atoms*; the technique now extends to ultracold molecules ([Carroll et al. 2021](https://arxiv.org/abs/2111.09426)) and to genuine three-particle correlations in trapped-fermion systems. In optomechanics, Cohen et al. counted phonons in a silicon nanobeam mode via parametric up-conversion to single photons and then measured $g^{(2)}(τ)$ of the *phonon* field across the lasing threshold — the cleanest demonstration that the HBT geometry is a quantum-statistical thermometer indifferent to the carrier [41]. Single-photon-source characterisation in colour-centre platforms (NV, SiV, hBN, SiC) and in semiconductor and perovskite quantum dots is now uniformly reported as a $g^{(2)}(0)$ value [37, 38, 39, 40, 42], descended from Kimble–Dagenais–Mandel [25] rather than from HBT proper. Heavy-ion HBT, recast as femtoscopy, has expanded its remit to exotic hadronic correlations ([32, 53]) but the dynamical caveats of Gyulassy still bind.\n\n### What does $g^{(2)}$ even mean off the canonical road?\n\nThe frontier is harder than the experimental box scores suggest, because the language was forged for stationary, Gaussian, ergodic chaotic light and is now routinely applied where none of those conditions holds.\n\n- *Non-stationarity.* Pulsed and transient sources break $\\langle I(t)I(t+τ)\\rangle =$ function of $τ$ alone. Time-binned and conditional intensity correlators are now standard but no unique definition exists; different conventions yield different numbers for the same source.\n- *Non-Gaussianity.* Sub-Poissonian, super-bunched ($g^{(2)}(0)\u003e2$) and structured-mode emitters violate Siegert. Cui et al. give a *generalised Siegert relation* valid for arbitrary random fields and show that a \"correlation visibility\" rather than $g^{(2)}(0)$ is the correct invariant [17]; the textbook bound $g^{(2)}(0)=2$ is the Gaussian fixed point of a richer hierarchy.\n- *Non-classicality from $g^{(2)}$ alone.* Antibunching ($g^{(2)}(0)\u003c1$) certifies $P(α)\u003c0$ in the Glauber–Sudarshan sense [19, 18] but not Fock-state emission; modern criteria combine $g^{(2)}$ with $g^{(3)}$ or attenuation-resistant inequalities ([Lachman \u0026 Filip, PRR 2025](https://journals.aps.org/prresearch/abstract/10.1103/nbkg-8jz9)) to certify *quantum non-Gaussianity*, which is the operationally meaningful \"more than merely nonclassical\" property.\n- *Coherence within HBT.* Photon-correlation microscopy of correlated electron systems [56] and modelling of photon statistics in hybrid integrated photonic circuits [50] show that intensity correlations now probe many-body coherence, not just two-point geometry. The same applies to superradiant-LIDAR proposals [57], in which $g^{(2)}$ becomes a *ranging* observable rather than a source diagnostic.\n- *Imaging.* Tsang–Nair–Lu superresolution [58] proves that intensity-mode measurement is sub-optimal for two-point separation: an HBT detector throws away mode-projection information that an optimal measurement retains. This is the modern formalisation of Hanbury Brown's original sacrifice.\n\nThe open problem the field has not closed is conceptual: a unified definition of $g^{(n)}$ for *finite-duration, non-stationary, mode-structured* fields that reduces to the canonical $g^{(2)}(τ)$ in the Gaussian-stationary limit but does not pretend that limit always applies. Until that is settled, the most common error in the modern literature will continue to be the one Hanbury Brown and Twiss themselves never made — quoting a number labelled $g^{(2)}(0)$ without naming the regime in which it is defined."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier insisting that HBT is misremembered. Here is what I will and will not defend.\n\n### (a) What I defend with my reputation\n\nThe 1956 Nature result [6] is, as physics, *classical wave optics plus shot noise*. Purcell's one-page letter [21] is the correct conceptual closure of the controversy, and no subsequent quantum-electrodynamic reframing has changed that fact — Glauber's coherent-state machinery [19, 20] *explained* why the classical answer survives quantisation; it did not *replace* it. The Siegert relation $g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2$ is a theorem about stationary, zero-mean, complex-Gaussian fields, not a definition of \"thermal light\", and most violations reported in the literature are violations of those premises, not of the relation. Antibunching, $g^{(2)}(0) \u003c 1$, is the only signature in this lineage that is intrinsically nonclassical; Kimble–Dagenais–Mandel 1977 [9] — not HBT 1956 — is the actual birth certificate of experimental quantum optics. And in heavy-ion physics, the chaotic-source assumption underlying the GGLP-as-source-radius reading is the load-bearing assumption, exactly as Gyulassy warned [27]; the \"radius\" in those papers is a coherence length convolved with dynamics.\n\n### (b) What is shakier than the literature admits\n\nThree specific things.\n\nFirst, the standard \"$g^{(2)}(0) \u003c 0.5 \\Rightarrow$ single-photon source\" criterion is a community convention masquerading as a theorem. It is corrupted by background subtraction, by start–stop versus full $g^{(2)}$ definitions, and — most insidiously — by detector timing jitter that is comparable to or larger than the emitter lifetime, which fills the antibunching dip from below. A non-negligible fraction of \"$g^{(2)}(0) \\approx 0.05$\" claims in solid-state emitter literature would not survive a jitter-deconvolved reanalysis.\n\nSecond, the assumption of *stationarity* is taken for granted in essentially every quasi-thermal calibration. Rotating-ground-glass sources are not stationary on the timescale of a rotation period; pseudothermal light from speckle has correlations whose ensemble and time averages diverge once the integration is short. The reported $g^{(2)}(0) = 2$ is then an artefact of *averaging* over a non-stationary process, not a confirmation of Gaussian statistics.\n\nThird, modern stellar intensity interferometry revivals trade on the assumption that astrophysical sources are chaotic Gaussian emitters at optical frequencies. For thermal photospheres this is defensible; for line emission, masers, and any coherently driven component it is not, and the recovered \"diameter\" is then a model-dependent number, not a geometric one.\n\n### (c) Three open questions I would actually work on\n\n1. **Jitter-honest single-photon metrology.** A community-agreed deconvolution protocol for $g^{(2)}(0)$ that separates emitter physics from instrument response would invalidate or rehabilitate a decade of source claims — high leverage, low glamour.\n2. **Two-photon amplitude stellar interferometry with phase recovery.** The phase that Hanbury Brown deliberately threw away [12] is, in principle, recoverable via two-photon amplitude protocols [23]; whether the SNR survives realistic photon rates on a real telescope is the open question.\n3. **Non-Gaussian intensity interferometry as a probe of source dynamics.** Higher-order $g^{(n)}$ in heavy-ion and astrophysical contexts contains the information that $g^{(2)}$ averages away — specifically, the breakdown of the chaotic-source assumption [27]. Almost no one measures it cleanly.\n\n### Reading path\n\n1. Hanbury Brown \u0026 Twiss, *Nature* 1956 [6] — read the actual paper, not the textbook caricature; the authors are more careful than their reputation.\n2. Purcell, *Nature* 1956 [21] — one page; the conceptual debate ends here.\n3. Glauber, *Phys. Rev.* 1963 [19, 20] — the coherent-state hierarchy that made the classical answer respectable inside QED.\n4. Kimble, Dagenais \u0026 Mandel, *PRL* 1977 [9] — the first measurement that HBT *could not* have produced; the real start of experimental quantum optics.\n5. Gyulassy et al. 1979 / 1982 [27] — the corrective for anyone tempted to read a GGLP \"radius\" as a ruler."}], "references": [{"n": 1, "title": "One Hundred Years of Light Quanta (Nobel Lecture)", "authors": ["Roy J. Glauber"], "year": 2005, "venue": "Nobel Foundation / Rev. Mod. Phys. 78, 1267 (2006)", "url": "https://www.nobelprize.org/prizes/physics/2005/glauber/lecture/", "cited_by": null, "bucket": "archive"}, {"n": 2, "title
