static field B 0\\hat z plus a circularly polarized transverse field of amplitude B 1 rotating at frequency \\omega, showed that the spin-flip probability is The decisive technical move was to pass to the frame rotating at \\omega, in which the transverse field is static. This trick — eliminating the explicit time-dependence at the price of accepting a counter-rotating term that can be dropped when \\omega\\approx\\omega 0 — is the entire content of what later got rebranded as the rotating-wave approximation . Without it the Bloch equations have no closed-form solution; with it they reduce to precession about a static effective field. Every line of the 1963 Jaynes–Cummings Hamiltonian is engineered to make this same RWA available after the field has been promoted to a quantized mode. The intermediate step belongs to Bloch and Siegert (1940), who computed the leading correction to Rabi's formula when the linearly polarized 2B 1\\cos\\omega t is not decomposable into a single co-rotating component. Their shift, is precisely the error term that the RWA discards. It is worth flagging now what becomes a recurring confusion later in the dossier: the Bloch–Siegert shift is a classical statement about how badly the RWA fails for a strong driving field, and its quantum re-incarnation in the Rabi Hamiltonian (the counter-rotating a\\sigma - + a^\\dagger\\sigma + terms) is the precise object the JCM throws away. Cummings at Stanford: the algebra nobody else did The Hamiltonian that now bears Jaynes's name had to wait two decades because the missing ingredient was not physical insight but operator bookkeeping. Putting B 1 \\to (a+a^\\dagger) and keeping only the energy-conserving piece yields and one then has to notice that \\hat N = a^\\dagger a + \\tfrac12(\\sigma z+1) commutes with H {\\rm JC}, that this constant of motion partitions the Hilbert space into 2\\times 2 blocks \\{ n,e\\rangle, n+1,g\\rangle\\}, and that diagonalization of each block produces the dressed pair with the \\sqrt{n+1} spectrum that is the model's actual quantum content. This is the algebraic skeleton later canonized in textbooks [1, 2]; the historical record makes clear that it was written down by Fred Cummings, advised by Jaynes, in his 1962 Stanford doctoral dissertation. Two pieces of evidence pin this down. First, the 1965 single-author paper , submitted while Cummings was at Aerospace Corporation and at UC Riverside, already pushes well past the 1963 joint paper — extending the model to a coherent-state field and observing the collapse of Rabi oscillations under photon-number fluctuations — and reads as the natural continuation of a thesis-grade calculation rather than as a fresh start. Second, the Knight–Gerry–Birrittella–Alsing retrospective is explicit that \"most of the operator algebra in the original paper, including the dressed-state diagonalization, is Cummings's work\" — a recollection from people who knew the principals. Jaynes's own contribution to the 1963 paper was different in kind. He had been building the case, throughout the late 1950s and early 1960s, that the spontaneous-emission rate A of Einstein was an artifact of an unnecessary second quantization, and that a self-consistent semiclassical theory — atoms quantized, field classical, with the atomic dipole acting as a self-source — could reproduce the line shapes and saturation behaviour of beam masers and lasers. The JCM was constructed as a foil to this neoclassical theory: a fully quantized model simple enough that its predictions could be put side-by-side with the semiclassical ones and the discrepancy isolated. The discrepancy Jaynes wanted to highlight is exactly the one that makes the JCM famous: the quantum theory predicts oscillations (and, as Cummings would soon show, collapses and revivals) where the semiclassical theory predicts monotone decay or steady-state saturation. Jaynes read that as evidence against the necessity of field quantization; almost everyone else read it as the cleanest available demonstration of its consequences. The polemical framing explains a curiosity that is otherwise inexplicable: the 1963 paper appears not in Physical Review but in Proceedings of the IEEE , in a special issue on quantum electronics where Jaynes could argue at length that the maser community was over-quantizing. Harry Paul, Berlin 1963 The independent track is almost completely missing from English-language pedagogy. In the same year, Harry Paul at the Humboldt Universität in East Berlin published \"Induzierte Emission bei starker Einstrahlung\" in Annalen der Physik (Bd. 11, 411, 1963), in which the identical Hamiltonian — a single quantized mode coupled in the rotating-wave form to a two-level atom — is analyzed for stimulated-emission gain at strong drive. Paul derives the dressed eigenvalues, comments on the \\sqrt{n} spectrum, and applies the model to the maser amplifier problem (verify — the exact section structure of Paul's paper is recalled from secondary sources, principally the Shore–Knight review and Walther's Garching lecture notes, which cite Paul explicitly as a co-originator). It is for this reason that the Munich, Garching, and Berlin schools — and the German pedagogical literature in general — consistently write Jaynes–Cummings–Paul model . The 1987 Garching experimental paper , from Walther's group, was reviewed by people for whom the triple attribution was uncontroversial; the slow erosion of Paul's name in the anglophone literature is a textbook-propagation artefact, not a verdict on priority. Where the credit actually sits Reduced to a checklist: - Semiclassical kernel and the RWA logic — Rabi 1937 , with Bloch–Siegert 1940 as the explicit statement of what the RWA throws away. - The Hamiltonian, the conserved excitation number, the dressed ladder, the \\sqrt{n+1} spectrum — Cummings 1962 (thesis), reaching print in and consolidated in . - The polemical framing as a referendum on neoclassical radiation theory, and the choice of Proc. IEEE as venue — Jaynes 1963 . - Independent derivation of the same Hamiltonian with a maser-amplifier emphasis — Paul 1963 , Annalen der Physik 11, 411. - The N-atom collective extension that becomes the Dicke–Tavis–Cummings model — Tavis \u0026 Cummings 1968 , with the partial-symmetry refinement in . The naming convention \"Jaynes–Cummings\" is therefore historically a truncation : it under-weights Cummings's algebra, omits Paul entirely, and elevates the senior author's interpretive agenda over the technical machinery that actually solved the problem. The subsequent forty years of dressed-state physics, revivals, cavity QED ladders, and circuit-QED spectroscopy are built on Cummings's 2\\times 2 blocks and Paul's parallel maser analysis — a fact the literature has been quietly inheriting without quite acknowledging. The Hamiltonian, the Dressed Ladder, and the √n Spectrum The Hamiltonian, the Dressed Ladder, and the √n Spectrum Setting up the Hamiltonian Take a two-level atom of transition frequency \\Omega coupled to a single quantized cavity mode of frequency \\omega. Use Pauli operators \\sigma z, \\sigma \\pm on the atom and bosonic a, a^\\dagger on the field. In dipole-and-rotating-wave approximation (RWA), the full atom + field + interaction Hamiltonian is with single-photon vacuum coupling g = -d\\sqrt{\\omega/2\\varepsilon 0 V}\\,\\hat e\\cdot\\langle e\\mid\\mathbf{r}\\mid g\\rangle (units \\hbar=1). The two terms dropped by the RWA, g(a\\sigma - + a^\\dagger\\sigma +), do not commute with the bare excitation number and are suppressed by the smallness of g/(\\omega+\\Omega). Their reinstatement returns the full quantum Rabi Hamiltonian — a distinct model with no closed-form spectrum until Braak's 2011 G-function construction . Inside this section everything that follows assumes the RWA; this is the precise sense in which the JCM is integrable . The key structural fact is that the excitation number commutes with H. Hilbert space therefore decomposes into a one-dimensional ground sector \\{ 0,g\\rangle\\} — annihilated by the coupling — and an infinite tower of two-dimensional excitation-conserving doublets Each \\mathcal{H} n is independently invariant under H. The exact-solvability of the JCM is precisely this block-diagonal structure imposed by [\\hat N,H]=0. The 2\\times 2 block and the √n spectrum Writing \\delta \\equiv \\Omega - \\omega for the atom–field detuning, the matrix of H on \\mathcal{H} n in the basis \\bigl( n,e\\rangle,\\, n{+}1,g\\rangle\\bigr) is Diagonalization is the elementary 2\\times 2 Rabi problem, but with a quantized off-diagonal element. Defining the generalized n-photon Rabi frequency the eigenvalues are and the eigenvectors — the dressed states — are obtained with a Stückelberg mixing angle \\theta n defined by so that At resonance \\delta=0 the mixing is maximal, \\theta n=\\pi/4, and the doublet splits symmetrically by 2g\\sqrt{n+1}. The presence of the \\sqrt{n+1} — not n+1 — is the entire quantum content of the model. A harmonic ladder (\\sqrt{n+1}\\to n+1) would be the spectrum of two classically coupled oscillators; the genuinely nonclassical fingerprint is the anharmonicity \\sqrt{n+2}-\\sqrt{n+1}\\sim 1/(2\\sqrt{n}), which is what gives the √n-rung structure later resolved by Brune et al. in microwave cavity QED and by dispersive ladder spectroscopy in circuit QED [11, 12]. Vacuum Rabi splitting at n=0, by contrast, is reproduced by two coupled classical oscillators; it is the photon-number dependence of the splitting that is JC-specific, a point belaboured in the Shore–Knight review and in Gerry–Knight's textbook treatment . Figure: At resonance the bare doublets \\{ n,e\\rangle, n{+}1,g\\rangle\\} are degenerate; the JC coupling lifts each into a dressed pair \\pm,n\\rangle split by 2g\\sqrt{n+1}. The right column shows a uniformly spaced (classical) ladder for comparison — the JC ladder is anharmonic with √n-spaced rungs. Heisenberg-picture operator solution The same content can be read off without ever diagonalizing a matrix, by integrating the Heisenberg equations directly. With [\\hat N,H]=0, one promotes the c-number Rabi frequency to an operator, and finds, for the atomic inversion at resonance, with analogous expressions for a(t) and \\sigma \\pm(t) in which \\hat\\Omega sits underneath square roots in operator-ordered combinations. This is the operator perturbation theory of Ackerhalt and Rzążewski , and it is the form in which the model is most usefully presented for spectroscopy: every expectation value reduces to a photon-number sum over \\cos(\\Omega n t) and \\sin(\\Omega n t) weighted by the initial field distribution P(n). The collapse-and-revival phenomenology of §3 is built directly on this representation [14, 15]. Stenholm's Bargmann route The closed form that hides the matrix algebra most elegantly is Stenholm's Bargmann representation . Map the field onto the Hilbert space of entire functions f(z) with inner product \\langle f\\mid h\\rangle = \\pi^{-1}\\!\\int\\! e^{- z ^2} \\overline{f(z)} h(z)\\, d^2z, so that a^\\dagger \\to z and a \\to \\partial z. The wavefunction becomes a two-component holomorphic spinor \\bigl(\\psi e(z,t),\\,\\psi g(z,t)\\bigr)^\\top. The Schrödinger equation reads Excitation conservation collapses the system to a single first-order ODE for \\psi e after writing \\psi g(z,t) = z\\,\\chi(z,t), and the exact propagator is obtained as a contour-integral / generating-function expression — a calculation that takes a single page where direct number-state expansion takes several. Stenholm's representation is also the cleanest starting point for the multi-photon (k-photon) generalization of Sukumar and Buck , where a\\sigma + \\to a^k\\sigma + and integrability survives because \\hat N k = a^\\dagger a + k\\,\\sigma +\\sigma - is still conserved; the doublets become \\{ n,e\\rangle, n+k,g\\rangle\\} and the spectrum acquires the factor \\sqrt{n!/(n-k)!}\\,/\\,k! familiar from k-photon transitions. Holstein–Primakoff and Schwinger-boson reformulations reorganize the same algebra into spin language and prepare the ground for the Tavis–Cummings generalization handled in §4 [7, 8]. The arithmetic of the dressed ladder is therefore trivial; its physical content is not. The next section asks what the resulting dynamics — \\sigma z(t) for a coherent-state field — looks like once one sums the \\cos(\\Omega n t) terms over the Poisson distribution, and what is genuinely quantum about the collapse and revival that emerges. Collapse, Revival, and What Is Actually Quantum About Them Collapse, Revival, and What Is Actually Quantum About Them Take the resonant JCM with the atom prepared in e\\rangle and the cavity in a coherent state \\alpha\\rangle of mean photon number \\bar n = \\alpha ^2. The initial state is Inside each dressed doublet \\{ e,n\\rangle,\\, g,n+1\\rangle\\} the on-resonance Hamiltonian is just a Rabi rotation at angular frequency \\Omega n = 2g\\sqrt{n+1}, so The atomic inversion is a Poisson-weighted superposition of Rabi tones: (If one prefers the atom in g\\rangle, the overall sign flips and the radicand becomes \\sqrt{n}; nothing structural changes.) This is the central object of the section. The frequencies \\Omega n are incommensurate — they share no common period — yet they crowd around the mean \\bar\\Omega = 2g\\sqrt{\\bar n+1} when \\bar n \\gg 1. From the tension between those two facts emerge the collapse and the revival. The collapse: Gaussian dephasing on a \\bar n-independent timescale For a coherent state P n peaks sharply at n=\\bar n with rms spread \\Delta n = \\sqrt{\\bar n}. Linearizing the frequency about the peak, gives a Rabi-frequency packet of width The cancellation is the punch line: the width of the sampled Rabi distribution is set by g alone, independent of how bright the field is. Replacing the sum by a Gaussian integral in n, so the Rabi oscillations dephase as a Gaussian with collapse time The envelope decay was already visible in Cummings's single-author 1965 paper , which examined \"stimulated emission of radiation in a single mode\" for a coherent driving field but did not push to longer times. It also drops out trivially from Stenholm's Bargmann-representation solution . The revival: rephasing forced by integer n The Gaussian decay is not the end of the dynamics — it is the leading order in which \\Omega n is treated as a continuous variable. Keep the discreteness. Two adjacent components \\Omega n and \\Omega {n-1} slip in phase by The packet rephases — modulo 2\\pi — when this slip reaches 2\\pi, namely at producing a partial reappearance of the macroscopic Rabi oscillation. There is no analogue of t r in any continuous-frequency description of the field. This is the discovery of Eberly, Narozhny and Sanchez-Mondragon, announced as a Physical Review Letter in 1980 and developed the following year in Physical Review A under the unambiguous title \"Coherence versus incoherence: collapse and revival in a simple quantum model\" ; the companion conference abstract on two-time correlations reports the same numerics. Convention shortens this to \"Eberly's revivals\" — the recent Knight–Gerry retrospective still does — but it is genuinely a three-author result, and the 1981 title telegraphs the conceptual move I am about to make explicit. Figure: schematic \\langle\\sigma z(t)\\rangle for \\bar n\\sim 10. The carrier oscillates at \\bar\\Omega = 2g\\sqrt{\\bar n+1}; the orange envelopes are the Gaussian collapse e^{-g^2 t^2/2} centred at t=0 and a partial Gaussian revival of reduced amplitude centred at t r. What survives a classical distribution, and what does not Here is the conflation the textbook literature still propagates. Suppose, instead of a quantized field, we model the cavity as a classical oscillator whose amplitude A — hence whose Rabi frequency \\Omega(A) = 2gA — is drawn from a smooth probability density f(\\Omega). The inversion is then a Fourier–cosine transform, and by Riemann–Lebesgue it decays without recurrence as t\\to\\infty whenever f has finite width. Choose f Gaussian of width g centred at \\bar\\Omega and one recovers \\cos(\\bar\\Omega t)\\,e^{-g^2 t^2/2} bit for bit. The collapse, in other words, is just dephasing in any sufficiently broad mixture of classical Rabi frequencies; an experimentalist who saw only the decay envelope would not yet have evidence of a quantized field. Knight and Radmore made this point with unusual clarity in 1982 , framing the collapse as garden-variety inhomogeneous dephasing and locating the genuinely quantum content in the recurrences. The revival is different. A continuous f(\\Omega) produces a continuous spectrum, and the integral above admits no almost-periodicity; the sum defining \\langle\\sigma z\\rangle, by contrast, runs over the discrete lattice \\{\\sqrt{n+1}\\} and is therefore an almost-periodic function of t in the sense of H. Bohr. The first revival at t r, the successors at 2t r,\\,3t r,\\ldots, and the slow secular decay of revival amplitude due to incommensurability of the surds \\sqrt{n+1} — these are strictly quantum-mechanical features of the JCM. They have no classical mimic. Singh's study of generalized JCMs confirmed that revival structure persists across a range of initial photon statistics so long as the spectrum remains discrete; the Sanchez-Mondragon–Eberly coherent–thermal abstract showed thermal smearing of P n broadens but does not erase it. The Shore–Knight review and the Gerry–Knight textbook both lay the point out, but it migrates only sporadically into the wider quantum-optics literature. The numerology is illuminating. The ratio means that even a modest \\bar n\\sim 10 accommodates several dozen Rabi periods between collapse and first revival, while \\bar n\\sim 10^4 pushes t r beyond any realistic cavity decoherence time. That is precisely why the Garching one-atom maser is the historically decisive experiment — Rempe, Walther and Klein worked at \\bar n of order a few and at cavity Q high enough to keep t r inside the coherence time, then watched \\langle\\sigma z\\rangle rebuild itself out of the collapse plateau. That observation, more than any Rabi-splitting measurement, is what closed the question of whether the field's quantization shows up in atomic dynamics, because it is the one feature popular accounts misidentify as semiclassical that resolutely is not. Generalizations: Tavis–Cummings, k-Photon, Beyond RWA, and the Quantum Rabi Resurrection Generalizations: Tavis–Cummings, k-Photon, Beyond RWA, and the Quantum Rabi Resurrection From one atom to N: Tavis–Cummings The natural N-atom extension was published by Michael Tavis (then Cummings's Caltech student) and Cummings in 1968 , with the approximate-solution companion the following year . Replace single Pauli operators by collective spin J z=\\sum i\\sigma z^{(i)}/2, J \\pm=\\sum i\\sigma \\pm^{(i)}, all atoms on resonance with one cavity mode: The Hilbert space decomposes by total angular momentum J (a relic of permutation symmetry) and by the conserved excitation number \\hat N=a^\\dagger a+J z+J. Inside each (J,N) block the Hamiltonian is a finite tridiagonal matrix that diagonalises exactly. What is sometimes labelled \"Bethe-ansatz\" solution is, more honestly, block-tridiagonal linear algebra plus a polynomial Bethe-equation rewriting that becomes useful only in the large-J limit. Two 2026 papers [23, 24] revive a point that the textbook tradition lost: TC carries an accidental SU(2) symmetry that becomes manifest only in the Schwinger-boson representation, where J \\pm are encoded in two auxiliary bosons. Coane and Iachello have extended an analogous algebraic skeleton to dissipative Bose–Fermi systems covering both JCM and Dicke . The accidental symmetry is what enables global-control protocols that drive arbitrary collective states using the TC coupling alone . A textbook conflation worth flagging: the TC model in the RWA does not exhibit the Dicke superradiant phase transition. The genuine transition at g c=\\sqrt{\\omega\\Omega}/2 requires the counter-rotating terms; the RWA-truncated TC has only a smooth crossover in the thermodynamic limit. The \"JCM phase transition\" papers (e.g. ) achieve a critical point either by adding a Stark or driving term or by taking a singular coupling-rescaled limit, not by the bare H \\mathrm{JC}. k-Photon and intensity-dependent variants Sukumar and Buck generalised the interaction to so the atom exchanges k photons per transition. The (n,n{+}k) doublets still close, and eigenvalues acquire \\sqrt{n!/(n-k)!} in place of \\sqrt{n}. For k=2 this is the degenerate two-photon JCM (rotating-wave hyper-Raman); for k\\ge 3 the operator a^k\\sigma + is unbounded from below on the bare ladder unless an explicit photon-number cutoff or nonlinear field renormalisation is supplied — a subtlety quietly dropped in many follow-ups. Singh computed photon-number distributions in this family and showed that revivals survive but with modified periods replacing T R\\propto\\sqrt{\\bar n}/g. The Buck–Sukumar intensity-dependent coupling g\\sqrt{a^\\dagger a}\\,a\\sigma + +\\mathrm{h.c.} is an unrelated cousin in which the effective Rabi frequency loses its \\sqrt n dependence; the dynamics is exactly periodic — no collapse — which is useful as a counter-example for what is and is not \"quantum\" about the standard revival. Carneiro and Pellegrino derive both families through inverse Holstein–Primakoff manipulations on a single bosonic mode, embedding the TC ladder and the k-photon ladder in one algebraic frame. Other algebraic dressings — relativistic parametric amplifier and trapped-ion variants — fall in the same family . Driving, dissipation, and the loss of solubility Once the cavity leaks (\\kappa), the atom decays (\\gamma), or a classical drive is added, exact solubility is generally lost. The standard treatment writes a Lindblad equation, The dispersive limit \\Delta = \\Omega-\\omega \\gg g\\sqrt{\\bar n} reduces this to a photon-number-dependent qubit shift \\chi\\sigma z a^\\dagger a with \\chi\\simeq g^2/\\Delta, the workhorse of circuit-QED readout. Two warnings the dispersive shortcut conceals: (i) the Schrieffer–Wolff expansion diverges as \\bar n approaches the critical photon number n \\mathrm{crit}=\\Delta^2/(4g^2) (Blais et al., verify), beyond which the dispersive picture is unreliable; (ii) the dressed-state basis in which \\kappa physically acts is not the bare basis, so the naive Lindblad operators a and \\sigma - violate detailed balance once g/\\omega ceases to be small. Driving on the cavity produces photon blockade — the \\sqrt n anharmonicity forbids resonant two-photon excitation — and dispersive bistability. The driven JCM has been reformulated via Lewis–Riesenfeld invariants , its monochromatic-driving spectrum revisited , and recast as the host of a geometric finite-system criticality that is the JCM analogue of the Dicke transition. Beyond the RWA: the quantum Rabi resurrection The Hamiltonian before the RWA is the full quantum Rabi model, The counter-rotating terms a\\sigma - and a^\\dagger\\sigma + destroy the U(1) excitation-number conservation that makes the JCM exactly solvable, leaving only a \\mathbb Z 2 parity \\Pi=-\\sigma z\\,(-1)^{a^\\dagger a}. For decades the standard wisdom held that the model was non-integrable . Braak overturned this in 2011 by exhibiting, sector by sector, a transcendental G-function whose zeros give the entire spectrum — an integrability statement strong enough to settle the question while leaving closed-form eigenvalues out of reach. Braak's solution is the conceptual analogue of Bethe-ansatz integrability for a system with only discrete symmetry, and it sits on top of an earlier Bargmann-representation tradition for the JCM itself . The size of the Rabi correction matters as soon as g/\\omega leaves the few-percent range: regime g/\\omega JCM validity dominant correction --- --- --- --- weak \\ll \\kappa,\\gamma/\\omega exact none strong up to \\sim 10^{-2} excellent leading Bloch–Siegert shift \\sim g^2/4\\omega ultrastrong (USC) 0.1–1 qualitatively wrong virtual photons in the ground state; parity-protected level crossings deep-strong (DSC) \\gtrsim 1 invalid ground state is a displaced-oscillator Schrödinger-cat; gauge choice becomes physical Niemczyk et al. reported circuit-QED couplings of g/\\omega\\approx 0.12 in 2010; in the same year Forn-Díaz et al. resolved the Bloch–Siegert shift in a flux qubit coupled to an LC oscillator — a direct measurement of the leading non-RWA correction. By the late 2010s, DSC with g/\\omega 1 was reached in superconducting platforms and analogue simulators. De Bernardis, Mercurio and De Liberato have argued that for many DSC observables the JCM is not merely quantitatively wrong but qualitatively misleading : the choice between Coulomb and multipolar gauges, which is a passive bookkeeping operation in the strong-coupling regime, dictates which truncated Hamiltonian one is even approximating once the rotating-wave approximation fails. The anisotropic Rabi model — independent couplings g + and g - on the co- and counter-rotating channels — interpolates between JCM (g -=0) and the isotropic Rabi limit (g +=g -). Its spectrum carries a hidden \\mathbb Z 2 structure that protects degeneracies and has been exploited both for noise-biased qubits and for programmable spectral symmetries in superconducting simulators [35, 36]. Treated as a renormalisation-group endpoint, the JCM corresponds to a particular fixed point of an RG flow in coupling space . What survives, and where The JCM is essentially exact in the strong-coupling, low-photon, well-detuned regime — and that is precisely where circuit-QED quantum information lives. In USC it is a cartoon: useful for intuition, quantitatively wrong at leading order in g/\\omega, qualitatively wrong about ground-state structure. In DSC it ceases to be a starting point at all, and one must either solve the full Rabi Hamiltonian (Braak) or commit to a specific gauge truncation (De Bernardis–Liberato). The Knight–Gerry–Birrittella–Alsing retrospective makes the same point in personal terms: the JCM endures because the experimental frontier keeps engineering systems that sit inside its window of validity, not because the model itself has been extended to cover what lies outside it. Five Confusions the Literature Still Propagates Five Confusions the Literature Still Propagates The JCM is the most pedagogically over-rehearsed Hamiltonian in quantum optics, and that ubiquity has bred a small ecology of confusions — claims that survive in lecture notes, review articles, and even refereed papers because nobody re-derives what everyone already \"knows.\" Five recur often enough to deserve naming. 1. \"The Jaynes–Cummings model\" used as a synonym for the quantum Rabi model The JCM Hamiltonian is, strictly, with the counter-rotating terms a\\sigma - and a^\\dagger\\sigma + discarded. The full quantum Rabi model retains them: H {\\text{JC}} commutes with the excitation number N = a^\\dagger a + \\tfrac{1}{2}(\\sigma z + 1) and decouples into 2\\times 2 blocks; H {\\text{R}} has only the \\mathbb{Z} 2 parity P = e^{i\\pi N} as a conserved quantity and was shown integrable — in Braak's precise sense of a parity-resolved transcendental spectrum — only in 2011 . These are different physical models, valid in different regimes: the RWA is controlled by g/\\omega \\ll 1 and near-resonance \\omega-\\Omega \\ll \\omega+\\Omega, so the discarded terms oscillate at \\sim 2\\omega and average out. Where the modern literature gets this wrong is in ultrastrong (USC, g/\\omega \\gtrsim 0.1) and deep-strong (DSC, g/\\omega \\gtrsim 1) coupling, where papers and even some textbooks describe Bloch–Siegert shifts , parity-protected ground-state photons, and virtual-photon dressing as \"JCM physics in the USC regime.\" They are nothing of the kind: those phenomena exist because the JCM has broken down. De Bernardis, Mercurio and De Liberato make this point at length, and Forn-Díaz et al. demonstrate experimentally that the first surviving correction to the JCM spectrum at moderate coupling is precisely the term the RWA threw away. The cleaner usage — \"JC regime\" for H {\\text{JC}}, \"Rabi\" or \"USC\" for H {\\text{R}} — is followed in [31, 32, 33] and should be followed everywhere. 2. \"The JCM predicts spontaneous emission\" This appears in undergraduate quantum-optics texts and is, in a literal sense, false. Spontaneous emission in free space is the exponential, irreversible decay \\dot P e = -\\Gamma P e with \\Gamma = \\Omega^3 d ^2/(3\\pi\\epsilon 0 \\hbar c^3); the Wigner–Weisskopf derivation crucially uses a continuum of modes with a smooth density of states. The JCM has one mode and produces oscillatory energy exchange, P e(t) = \\cos^2(g\\sqrt{n+1}\\, t) for a Fock state n\\rangle. There is no decay, no Fermi golden rule, no \\Gamma. The 1963 paper used precisely this discrepancy as ammunition for neoclassical radiation theory: a quantized single mode does not reproduce free-space spontaneous emission, which Jaynes read as evidence that field quantization was unnecessary. The reading was wrong — the resolution is that a cavity is not free space, and tuning the mode density gives Purcell enhancement or inhibition, not Wigner–Weisskopf — but the historical irony stands. What the JCM does predict is vacuum Rabi oscillation , P e(t) = \\cos^2(gt) for n=0: a coherent, reversible exchange with a vacuum mode that has been observed cleanly in cavity QED and circuit QED . Calling this \"spontaneous emission\" is a category error that the Shore–Knight review is careful to avoid and many later texts are not. 3. Collapse-and-revival as a unitary signature of quantization This is the subtlest of the five. For a coherent-state field \\alpha\\rangle with \\bar n = \\alpha ^2 \\gg 1, the atomic inversion is The Poissonian width \\Delta n \\sim \\sqrt{\\bar n} produces a spread in Rabi frequencies \\Delta\\Omega R \\sim g/\\sqrt{\\bar n}\\, (more precisely, expanding \\sqrt{n+1} around \\bar n gives \\Delta\\Omega R \\approx g) and hence a Gaussian collapse on t c \\sim 1/g. But any classical statistical mixture of Rabi frequencies with comparable spread produces the same envelope: a thermal field, a chopped semiclassical pulse, even an inhomogeneously broadened ensemble. The collapse is not a quantum signature. What is a quantum signature is the revival at t r \\sim 2\\pi\\sqrt{\\bar n}/g, which exists only because the spectrum \\{\\sqrt{n+1}\\} is discrete and rationally commensurate at large n — the rephasing is a number-theoretic consequence of the integer photon ladder. Eberly, Narozhny and Sanchez-Mondragon [14, 15] made this distinction explicit, and Knight–Radmore gave the clean dressed-state diffusion picture; Rempe, Walther and Klein observed both in the Garching maser . The confusion in introductory accounts — including some that cite — is to advertise \"collapse and revival\" as a single quantum signature. Half of it is classical. 4. JCM and Tavis–Cummings as cosmetic variants The TC Hamiltonian replaces \\sigma \\pm by collective spin operators J \\pm = \\sum {i=1}^{N}\\sigma \\pm^{(i)} [7, 8]: It is not \"JCM with N atoms\" in any cosmetic sense. The total spin J^2 is conserved, the spectrum organises into SU(2) multiplets, and in the thermodynamic limit N\\to\\infty with g\\sqrt{N} fixed, the full Dicke model (TC plus counter-rotating terms) hosts a genuine superradiant phase transition at g\\sqrt{N}=\\sqrt{\\omega\\Omega}/2 — a critical point with broken parity and a soft mode. The JCM has no such transition: with one atom there is no order parameter. Even at finite N, TC has an accidental symmetry visible in the Schwinger-boson representation that has no JCM counterpart, and the recent Deliyannis–Marvian work on global control exploits exactly that structure. Papers that present TC as \"the obvious generalisation\" obscure the fact that the relevant generalisation depends on what one is after: k-photon JCM generalises the coupling , TC generalises the Hilbert space , and the two move in orthogonal directions. 5. \"Vacuum Rabi splitting\" as a JCM prediction The two-peak transmission spectrum at zero detuning, with splitting 2g, is reproduced exactly by two coupled classical oscillators — a fact known since the 1930s and routinely demonstrated with coupled pendula. The same splitting appears in classical dispersion theory and in any linear coupled-mode problem. It is therefore not a signature of field quantization. The genuinely quantum prediction of the JCM is the anharmonic \\sqrt{n} ladder: the n-th rung of the dressed manifold is split by 2g\\sqrt{n}, so a probe at the bare frequency cannot ladder-climb resonantly. The first unambiguous test of \\sqrt{n} scaling is Brune et al. ; the circuit-QED implementations [11, 12] resolve individual rungs of the ladder spectroscopically. Papers — and a depressing number of review introductions — that cite the observation of a vacuum-Rabi doublet as \"evidence of cavity QED in the quantum regime\" are reporting strong coupling, not quantization. The Shore–Knight review and Gerry–Knight state the distinction plainly; modern strong-coupling claims in plasmonic and molecular cavities frequently do not, and the question of whether a given doublet is \"really\" quantum is therefore harder to settle from a transmission spectrum alone than the literature usually admits. From the Garching Maser to Circuit QED: Experimental Realizations From the Garching Maser to Circuit QED: Experimental Realizations For its first twenty-four years the Jaynes–Cummings model was a paper Hamiltonian. The reasons are dimensional. To realize H {\\rm JC} one needs a single atom interacting with a single quantized mode at a coupling g large enough that the vacuum Rabi period \\pi/g is shorter than every loss timescale — cavity damping \\kappa^{-1}, atomic dephasing \\gamma \\perp^{-1}, and the atom's transit time T {\\rm transit} through the mode. In the optical domain with ordinary atoms the dipole matrix element is too small and the mode volume too large; one is unavoidably in weak coupling, where the model collapses to Purcell-enhanced exponential decay and the dressed ladder is invisible. Three experimental routes broke this impasse, in this order: Rydberg atoms in microwave cavities (Garching and ENS), then superconducting circuits coupled to coplanar resonators. Each tested a different feature of the JCM, and the popular accounts conflate what was tested with the model itself. Garching 1987: the revival, not the ladder The Munich one-atom maser of Meschede, Walther and Müller (1985) used velocity-selected ^{85}Rb atoms prepared in a circular Rydberg state with principal quantum numbers around n\\!\\sim\\!63, traversing a superconducting niobium cavity tuned to the 63p {3/2}\\!\\to\\!61d {5/2} transition at 21.5\\,GHz and cooled to \\sim\\!0.5\\,K so that the thermal photon number \\bar n {\\rm th} was of order unity. The decisive parameter was the cavity Q\\sim 3\\times 10^{10}, giving a photon lifetime of order 0.2\\,s — much longer than the 50–100\\,\\mus transit time, so the field memory survived from one atom to the next and the steady-state field could build up in a Fock-like distribution. Velocity selection (Fizeau wheel) fixed the interaction time t {\\rm int} to a few percent, which is what made the experiment a spectrometer in the time domain rather than a thermal averager. Rempe, Walther and Klein then varied t {\\rm int} and measured the inversion \\langle\\sigma z\\rangle(t {\\rm int}) at the cavity exit by state-selective field ionization. They observed the Cummings collapse near t c\\sim 1/g followed by a partial revival near t R\\sim 2\\pi\\sqrt{\\bar n}/g. This is the signature pinned on the JCM in every textbook. It is worth being precise about what was actually established: not the \\sqrt n spectrum (the inversion is a Fourier sum over \\sqrt n frequencies, but no individual line was resolved), and not the dressed states (no spectroscopy was performed), but the discreteness of the photon-number distribution. As emphasised by Eberly–Narozhny–Sanchez-Mondragon [14, 15] and re-explained by Knight–Radmore , the collapse alone is reproduced by any sufficiently broad classical distribution of Rabi frequencies; only the recurrence at t R is a signature of integer photon counting. Garching saw a clean recurrence and, with it, the first direct fingerprint of field quantization in a JCM regime. ENS 1996: the \\sqrt n ladder, properly resolved The parallel programme of Haroche, Raimond and Brune at the ENS used a higher-finesse open Fabry–Pérot superconducting cavity at 51\\,GHz and a more flexible Ramsey-interferometric readout: the atom traversed two low-Q classical microwave zones flanking the high-Q quantum cavity, and the relative phase of the Rydberg superposition was mapped onto a population difference. The result was the ability to do spectroscopy on the dressed ladder rather than time-domain inversion alone. Brune et al. 1996 prepared coherent and number states in the cavity and resolved the individual Rabi frequencies \\Omega n = 2g\\sqrt{n+1} for n=0,1,2 by Fourier transforming \\langle\\sigma z\\rangle(t). The peaks at g\\sqrt{1},g\\sqrt{2},g\\sqrt{3} — incommensurate, as the JCM uniquely demands — are the signature that distinguishes the anharmonic JC ladder from any harmonic-oscillator or semiclassical-strong-coupling model that reproduces vacuum-Rabi splitting at the linear-response level. The vacuum Rabi splitting itself is not a JCM-only prediction (two coupled classical oscillators give the same doublet), a point that the credit audit in §5 belabours; what the ENS experiment uniquely tested is the incommensurate \\sqrt n scaling. The same group later used the dispersive limit of the JCM to demonstrate quantum non-demolition photon counting (Gleyzes, Guerlin, Haroche et al. 2007; verify) — arguably the most direct realisation of the JCM dispersive Hamiltonian \\chi\\,a^\\dagger a\\,\\sigma z. The textbook attribution of \"first observation of JCM collapse-revival\" to Rempe–Walther–Klein is correct on date and on phenomenon. The textbook habit of stopping there and ignoring the ENS programme, which produced quantitatively sharper tests of the model's distinctively quantum predictions, is the under-credit flagged in the neglected-figures list. Haroche's 2012 Nobel lecture is explicit about this division of labour. Figure: The three platforms that converted the JCM from paper to apparatus, with the distinctively quantum prediction each one isolated. Note the four-orders-of-magnitude jump in g from cavity QED to circuit QED. Circuit QED 2004: a different regime, dispersively read out The Yale port replaced the Rydberg atom with a Cooper-pair-box qubit and the superconducting microwave cavity with a coplanar-waveguide resonator on the same chip. The relevant parameters changed by orders of magnitude: g/2\\pi went from \\sim\\!50\\,kHz (ENS) to \\sim\\!17\\,MHz (Wallraff et al.), with \\omega/2\\pi\\sim 6\\,GHz, so the dimensionless coupling g/\\omega\\sim 10^{-3} landed comfortably in the strong-coupling JCM regime while remaining far from any RWA failure. What made the experiment a circuit-QED rather than cavity-QED experiment is the fixed geometry: the artificial atom does not transit, it sits at a known field antinode for the duration of the cryostat run, and the coupling is engineered from the circuit Lagrangian rather than measured from a dipole matrix element. Wallraff et al. did not directly observe collapse-revival or resolve the \\sqrt n ladder; they did two things. First, they saw vacuum Rabi splitting in transmission — the avoided crossing of bare cavity and bare qubit lines as the qubit was tuned through resonance — which, as already noted, is not a JCM-exclusive prediction. Second, and crucially for the field, they operated in the dispersive limit \\Delta = \\omega-\\Omega \\gg g and used the JCM-derived dispersive Hamiltonian to read out the qubit state through the qubit-dependent cavity pull \\pm\\chi. The dispersive readout is the JCM result that has done the most economic and scientific work in the last twenty years; every superconducting quantum processor in operation today reads its qubits this way. Fink et al. subsequently resolved the JCM \\sqrt n ladder transitions in circuit QED by climbing the dressed states with multi-photon spectroscopy, finally closing the loop with the ENS \\sqrt n measurement of 1996 — but on a chip. By 2010 the same platform had pushed g/\\omega above 0.1 into the ultrastrong regime [31, 32], where the JCM itself ceases to apply and one must restore the counter-rotating terms — the subject of §7. Current Frontier: Ultrastrong Coupling, Driven-Dissipative Phases, and Quantum Simulation Current Frontier: Ultrastrong Coupling, Driven-Dissipative Phases, and Quantum Simulation After six decades, the Jaynes–Cummings model is no longer where the action is — but the action is being conducted almost entirely against it, either as a regime to escape, a baseline to refute, or a soluble corner of a larger non-integrable landscape. The live questions in 2026 cluster into four areas: nonperturbative coupling that voids the RWA, dissipative phase structure under coherent drive, the diaspora of JC physics across non-photonic platforms, and the unfinished integrability story of the parent quantum Rabi model. Deep-strong coupling and the virtual-photon vacuum The conventional regime ordering is now well-stratified by \\eta \\equiv g/\\omega: strong coupling at \\eta \\lesssim 10^{-2}, ultrastrong (USC) at 0.1 \\lesssim \\eta \u003c 1, deep-strong (DSC) at \\eta \\gtrsim 1. The JCM is reliable only in the first regime; the second and third demand the full quantum Rabi Hamiltonian. The first unambiguous USC observation was Niemczyk et al. in flux-qubit circuit QED with \\eta \\approx 0.12 , paired with Forn-Díaz's measurement of the Bloch–Siegert shift — itself a leading correction in \\eta^2 that JCM erases by construction . Subsequent flux-qubit/LC-resonator hybrids have pushed into DSC with \\eta 1, and magnetoplasmon mode-multiplexing has reached coupling fractions comparable to the bare matter resonance (Baydin et al. 2024). The conceptual cost is that the ground state G\\rangle of H {\\rm Rabi} ceases to be the bare vacuum 0,g\\rangle. In the polaron frame, the dressed ground state contains a finite density of virtual photons, which carry no radiation flux out of the cavity but renormalize every observable. JCM predicts \\langle a^\\dagger a\\rangle { G\\rangle} = 0 exactly; this is the single sharpest failure mode and the cleanest experimental discriminator. De Bernardis, Mercurio, and De Liberato pose the question explicitly — \"is the JCM still relevant?\" — and conclude that it remains a legitimate effective theory wherever \\eta \\ll 1 and gauge-fixing is handled carefully, but is structurally inadequate once one wants ground-state physics, non-adiabatic switching, or material truncation past the lowest two levels . Knight, Gerry, Birrittella, and Alsing make the complementary case from the optical side, arguing the model retains diagnostic value for any system where the rotating-wave structure can be reimposed by drive engineering . A subtlety the literature is still digesting: writing H {\\rm Rabi} in Coulomb (minimal coupling, \\propto \\mathbf{A}\\cdot\\mathbf{p}) versus dipole (Power–Zienau, \\propto \\mathbf{E}\\cdot\\mathbf{d}) gauges gives different spectra once the matter Hilbert space is truncated to two levels. The truncation breaks gauge invariance; the JCM inherits this pathology silently. Several USC predictions published between 2015 and 2020 were quietly corrected once the gauge issue was clarified (Di Stefano et al. 2019), and any 2020s paper that claims an USC observable without specifying its truncation scheme should be treated as RWA-laundered. Driven-dissipative JCM and the breakdown of blockade Add a coherent drive \\eta d(a e^{i\\omega d t} + {\\rm h.c.}) and Lindbladians \\kappa\\mathcal D[a], \\gamma\\mathcal D[\\sigma -], and the JCM becomes a nontrivial open system whose steady state can change discontinuously. The textbook phenomenon is photon blockade: the \\sqrt{n} anharmonicity of the JC ladder makes the 1\\rangle \\to 2\\rangle transition off-resonant with the 0\\rangle \\to 1\\rangle transition by g(\\sqrt{2}-1), suppressing two-photon absorption. As \\eta d grows, the blockade collapses through a first-order dissipative phase transition with a critical endpoint of Ising universality, as worked out by Carmichael (PRX 5, 031028); the critical scaling has since been verified in transmon-resonator devices (Fink et al. 2017). The 2026 work of Chen et al. on geometric criticality in the driven JCM extends this by giving the order-parameter manifold a Berry-phase structure tied to the drive's quadrature , and Bocanegra et al. offer a Lewis–Riesenfeld invariant approach that constructs exact dynamical solutions in the resonant driven regime . Ermann et al. show that monochromatic driving alone produces a chaotic-resonance structure in the Floquet spectrum without invoking dissipation , a regime where the RWA is itself the source of the integrability that makes \"transition to chaos\" claims meaningful at all. Coupled-cavity JCM lattices remain the canonical proposal for a photonic Mott–superfluid transition (Greentree–Hartmann–Brandão–Plenio circa 2006; not in the supplied corpus). Experimental progress has been slow because circuit-QED lattices struggle to combine on-site g, intersite hopping J, and loss \\kappa in the right ratio; the only clean dissipative-phase signatures so far live in 1D chains of \\sim 10 sites. A modified-JCM phase-transition analysis by Alexanian and a related supersymmetric treatment of dissipative Bose–Fermi systems by Coane and Iachello are recent attempts to put the open-system phase structure on a more controlled footing. JC physics beyond cavity QED The JCM has migrated almost everywhere a two-level system meets a harmonic mode. Trapped ions realize H {\\rm JC} as the resolved-sideband limit: an electronic qubit driven on its red motional sideband within the Lamb–Dicke regime \\eta {\\rm LD} \\ll 1 couples to a single phonon with effective strength g {\\rm eff} = \\eta {\\rm LD}\\Omega/2, and Zeng et al. extended this to two ions sharing a motional mode — a phononic Tavis–Cummings system . Optomechanics in the red-detuned linearized limit gives a beam-splitter Hamiltonian whose excitation-conserving structure is JCM-like, though the matter side is itself bosonic (a quadratic JCM cousin rather than the genuine two-level article). Cavity magnonics has reached strong and ultrastrong photon–magnon coupling routinely, but reaching the single-magnon JCM regime — where the magnon Kerr nonlinearity dominates — was achieved only by hybridizing a YIG sphere with a superconducting qubit (Lachance-Quirion et al. 2020). Plasmonic picocavities push the effective g/\\omega to \\sim 0.1 at room temperature for single dye molecules , though here the validity of any single-mode treatment — let alone JCM — is itself contested. Integrability beyond Braak Braak's 2011 demonstration that the standard Rabi model is quasi-exactly solvable rests on a \\mathbb Z 2 parity symmetry generated by \\Pi = -\\sigma z(-1)^{a^\\dagger a}, with the spectrum encoded in the zeros of his transcendental G-function . The natural follow-up programme — what survives when the symmetry is broken? — is incomplete. Adding a bias term \\epsilon\\sigma x breaks \\mathbb Z 2 in general but restores integrability at half-integer \\epsilon/\\omega via a hidden symmetry whose algebraic origin (constraint polynomials of the Heun confluent equation) is still being worked out (Li et al. 2021). The anisotropic Rabi model, with independent rotating and counter-rotating couplings g \\pm, retains \\mathbb Z 2 and admits an analogous G-function but acquires an additional U(1) symmetry exactly at g - = 0 — the JCM limit. Recent superconducting realizations of programmable anisotropic Rabi simulators [35, 36] and proposals to exploit the asymmetric branch as a noise-biased qubit make the symmetry classification of physical, not merely formal, interest. On the collective side, the Schwinger-boson \"accidental symmetry\" of Tavis–Cummings exposed by Deliyannis and Marvian underwrites a global-control protocol that has no JCM analogue — a reminder that single-atom and many-atom integrability structures should never be lumped together. What the 2020s literature is silently assuming Three RWA-laden claims circulate widely and deserve flagging. First, \"JCM ground-state entanglement\" is meaningful only when \\eta \u003c 0.1; in USC papers the entanglement frequently reported is a polaron artefact of the truncated dipole-gauge Hamiltonian. Second, claims of \"forbidden-transition driving\" in artificial atoms sometimes rely on RWA selection rules that the same papers are nominally violating; the consistent treatment requires the Rabi model with explicit gauge choice. Third, anomalous Autler–Townes splittings reported under bright squeezed-vacuum drive are JCM-like only at the lowest order in the squeezing parameter — the counter-rotating contribution of a broadband squeezed reservoir generically dresses the bare states in ways the JC dressing cannot reproduce. Where a paper writes H {\\rm JC} but means H {\\rm Rabi}, the conclusions usually survive; where it writes H {\\rm JC} and means it, the regime of validity is rarely stated. The model's continued utility is best understood as the limit one perturbs around, not the territory one lives in. The AETHER Verdict The AETHER Verdict After six decades, the Jaynes–Cummings model occupies an awkward dual status: it is simultaneously the most pedagogically over-rehearsed Hamiltonian in quantum optics and the most quietly misused. Let me state where I stand. (a) What I will defend The \\sqrt{n} ladder is real, and it is the only feature of the JCM I would still call a prediction in the strong sense. Everything else the model is famous for — vacuum Rabi splitting, collapse, even revival's envelope — has a classical or semiclassical shadow. The discreteness of the anharmonic ladder, resolved spectroscopically by Brune et al. in 1996 and routinely now in transmon–resonator dispersive readout, is the irreducibly quantum content. I will also defend the historiographical claim made above: Cummings did the algebra, Jaynes supplied the polemic, and Paul deserves co-naming. The German convention \"Jaynes–Cummings–Paul\" is correct and the Anglophone elision of Paul is a citation accident, not a judgment. I will defend, second, the structural claim that the JCM is not a model of spontaneous emission and never was. The 1963 paper used the single-mode Hamiltonian as a counterexample — to argue that quantization alone produced oscillations, not Wigner–Weisskopf exponentials — and the field has spent fifty years quietly inverting the moral. (b) What is shakier than the literature admits Three load-bearing assumptions are routinely smuggled past the reader: 1. The RWA itself. At g/\\omega \\gtrsim 10^{-2} the counter-rotating terms shift the ground state into a squeezed-vacuum admixture; ultrastrong-coupling circuit-QED is now squarely in this regime. Papers that report \"JC dynamics\" at g/\\omega \\sim 0.1 are reporting Rabi dynamics with a JC label. 2. The two-level approximation. For transmons, the third level sits only \\sim 200\\text{–}300 MHz below the second; the \"JC ladder\" measured dispersively is a projected slice of a Duffing–oscillator ladder, and the \\sqrt{n} scaling acquires anharmonic corrections that are usually absorbed into a fitted g. 3. Single-mode purity. Real cavities and resonators have mode combs whose tails contribute at the few-percent level to the dispersive shift; the celebrated agreement between JCM and circuit-QED is partly a fit, not a parameter-free prediction. The collapse-and-revival story is shakier still: the collapse envelope is reproduced by any sufficiently broad classical Rabi-frequency distribution, and the cleanest experimental \"revival\" signatures sit at the edge of the decoherence floor. Calling collapse a quantum signature, as introductory texts do, is wrong; only the revival's discreteness is. (c) Three open questions I would work on 1. Exact spectrum of the dissipative quantum Rabi model at deep-strong coupling. Braak solved the closed system; the Lindbladian version remains open and is where ultrastrong-coupling experiments actually live. 2. A clean experimental separation of the revival from inhomogeneous-broadening mimics. A definitive photon-number-resolved revival, not a coherent-state envelope, would settle a forty-year ambiguity. 3. The thermodynamic crossover from JCM to Tavis–Cummings as N grows in a single cavity with realistic atom–atom disorder. The Dicke superradiant phase transition is famously fragile under A^2 and disorder; the route between N=1 and N\\to\\infty is poorly mapped. (d) Reading path 1. Cummings, Phys. Rev. 140 , A1051 (1965) — the single-author paper where the algebra and the revival are already implicit; read this before the 1963 letter. 2. Jaynes \u0026 Cummings, Proc. IEEE 51 , 89 (1963) — read second, with the polemical context in mind. 3. Paul, Ann. Phys. (Leipzig) 466 , 411 (1963) — the independent derivation that justifies the third name. 4. Eberly, Narozhny \u0026 Sanchez-Mondragon, Phys. Rev. Lett. 44 , 1323 (1980) — the revival prediction stated cleanly, with the classical-mixture caveat in the text itself. 5. Shore \u0026 Knight, J. Mod. Opt. 40 , 1195 (1993) — the only review that gets the assumptions, the conflations, and the credit roughly right; read last as a corrective. Everything after Shore–Knight is engineering; everything before Cummings 1965 is prehistory."}</script>

.obar{position:sticky;top:0;z-index:40;height:60px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.obar .row{max-width:1140px;margin:0 auto;padding:0 28px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}
.obar a.back{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.obar a.back:hover{color:var(--accent)}
.obar .wm{font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;text-decoration:none}
.obar .wm span{color:var(--accent)}
.tbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:none;cursor:pointer;transition:border-color .25s}
.tbtn:hover{border-color:var(--accent)}
.tbtn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.4}
/* landing hero */
.lhero{padding:84px 0 38px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px;margin-bottom:20px}
.kick::after{content:"";height:1px;flex:0 0 56px;background:var(--accent);opacity:.5}
h1.big{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8vw,92px);line-height:1.0;letter-spacing:-.02em;margin-bottom:22px}
.lhero p.manifesto{font-size:21px;font-style:italic;color:var(--ink-2);max-width:680px;line-height:1.6}
.lhero p.note{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:24px;text-transform:uppercase}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:46px 0 6px;border-top:1px solid var(--line-soft);padding-top:24px}
.filter button{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:none;border-radius:99px;padding:8px 15px;cursor:pointer;transition:all .2s}
.filter button:hover{border-color:var(--accent);color:var(--accent)}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* card grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:34px 0 100px}
a.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;background:var(--elev);padding:30px 30px 26px;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative;overflow:hidden}
a.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
a.card .ctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;margin-bottom:16px}
a.card .ctag b{font-weight:400;color:var(--muted)}
a.card h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.18;letter-spacing:-.01em;margin-bottom:8px}
a.card .csubj{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
a.card p{font-size:15.5px;color:var(--ink-2);line-height:1.6;flex:1}
a.card .cfoot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between}
a.card .cfoot .arr{color:var(--accent);transition:transform .25s}
a.card:hover .cfoot .arr{transform:translateX(4px)}
.empty{padding:60px 0;color:var(--muted);font-style:italic}
/* reader */
.rmast{padding:64px 0 30px}
.rmast .kind{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.rmast h1{font-family:var(--serif);font-weight:500;font-size:clamp(33px,5vw,56px);line-height:1.08;letter-spacing:-.015em;margin-bottom:18px}
.rmast .sub{font-size:21px;font-style:italic;color:var(--ink-2);max-width:760px;line-height:1.5}
.rmast .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 20px;text-transform:uppercase}
.aka{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;align-items:center}
.aka .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aka i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px}
.aka i.subj{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.callout{border:1px solid var(--line-soft);border-left:2px solid var(--accent);background:var(--elev);border-radius:0 4px 4px 0;padding:18px 24px;margin:30px 0}
.callout h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.callout p{font-size:15.5px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--gold)}
.callout.warn h4{color:var(--gold)}
.rgrid{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;padding-bottom:40px}
.toc{position:sticky;top:84px;font-family:var(--mono);font-size:11px;line-height:1.5}
.toc .tl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 12px;border-left:1px solid var(--line-soft);transition:color .2s,border-color .2s}
.toc a:hover,.toc a.on{color:var(--accent);border-color:var(--accent)}
article.body{min-width:0;max-width:760px}
.sec{padding:14px 0 8px;scroll-margin-top:80px}
.sec.verdict{border:1px solid var(--line);border-radius:6px;background:var(--elev);padding:8px 34px 24px;margin-top:30px}
.prose h2{font-family:var(--serif);font-weight:500;font-size:clamp(25px,3.4vw,33px);line-height:1.18;letter-spacing:-.01em;margin:40px 0 16px}
.prose h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:30px 0 10px}
.prose h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:24px 0 8px}
.prose p{margin:0 0 1.25em;color:var(--ink-2)}
.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.prose a:hover{color:var(--accent)}
.prose ul,.prose ol{margin:0 0 1.25em 1.3em;color:var(--ink-2)}
.prose li{margin-bottom:.5em}
.prose blockquote{margin:1.4em 0;padding:4px 0 4px 24px;border-left:2px solid var(--accent);font-style:italic;color:var(--ink)}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.prose pre{background:var(--elev);border:1px solid var(--line-soft);border-radius:5px;padding:16px;overflow:auto;margin:0 0 1.25em}
.prose pre code{background:none;padding:0}
.prose hr{border:none;border-top:1px solid var(--line-soft);margin:2em 0}
.prose table{border-collapse:collapse;width:100%;margin:0 0 1.25em;font-size:15px}
.prose th,.prose td{border:1px solid var(--line-soft);padding:8px 12px;text-align:left}
.prose th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* generated SVGs use hardcoded light strokes, so figures keep a dark plate
   in BOTH themes — exactly like the AETHER app */
.fig{margin:26px 0;padding:20px;border:1px solid #222a3a;border-radius:8px;background:#10141d;text-align:center;overflow-x:auto;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.fig svg{max-width:100%;height:auto}
.fig+p em,.figcap{color:var(--muted)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.mathraw{font-family:var(--mono);font-size:.82em;color:var(--ink-2);background:var(--accent-soft);padding:1px 5px;border-radius:3px}
a.cite{color:var(--accent);text-decoration:none;font-size:.84em;vertical-align:super;border:none;padding:0 1px}
a.cite:hover{text-decoration:underline}
/* blocks: timeline / neglected / conflations / refs */
.block{padding:46px 0 8px;border-top:1px solid var(--line-soft);margin-top:40px}
.block>h3{font-family:var(--serif);font-weight:500;font-size:27px;margin-bottom:6px}
.block>.lead{font-size:15px;color:var(--muted);font-style:italic;margin-bottom:26px}
.tline{position:relative;margin-left:8px;padding-left:26px;border-left:1px solid var(--line)}
.tline .ev{position:relative;padding:0 0 22px}
.tline .ev::before{content:"";position:absolute;left:-31px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent)}
.tline .ev .yr{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent)}
.tline .ev .what{font-size:15.5px;color:var(--ink);margin:2px 0}
.tline .ev .who{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ncards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ncard{border:1px solid var(--line-soft);border-radius:5px;padding:20px 22px;background:var(--elev)}
.ncard .nm{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:4px}
.ncard .ro{font-size:14.5px;color:var(--ink-2);margin-bottom:8px}
.ncard .ev{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.conf{list-style:none}
.conf li{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.conf .claim{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:4px;padding:8px 12px;display:inline-block;margin-bottom:8px}
.conf .clar{font-size:15px;color:var(--ink-2)}
.conf .clar::before{content:"→ ";color:var(--accent)}
.refs{list-style:none;counter-reset:r}
.refs li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14px;scroll-margin-top:80px}
.refs li .rn{font-family:var(--mono);font-size:11px;color:var(--accent)}
.refs li .rt{color:var(--ink)}
.refs li .ra{color:var(--muted);font-size:13px}
.refs li a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.refs li a:hover{color:var(--accent);border-color:var(--accent)}
.refs li .bk{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:2px 7px;margin-left:6px}
/* footer */
footer{border-top:1px solid var(--line);padding:28px 0 40px;margin-top:60px}
footer .fr{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
footer em{font-family:var(--serif);font-style:italic;text-transform:none;font-size:12.5px}
@media(max-width:880px){.grid{grid-template-columns:1fr}.rgrid{grid-template-columns:1fr;gap:8px}.toc{display:none}.ncards{grid-template-columns:1fr}body{font-size:16.5px}}
