90s Rydberg-atom cavity-QED experiments tested JCM predictions in parallel with Garching, but the 'first observation of collapse-revival' is almost always attributed only to Rempe–Walther–Klein", "evidence": "Haroche 2012 Nobel lecture; Brune et al. PRL 76, 1800 (1996) [27]", "ref": 10}], "conflations": [{"claim": "'The Jaynes–Cummings model' is treated as a single Hamiltonian", "clarification": "At least three distinct objects circulate under that name: (a) the rotating-wave (RWA) Hamiltonian H = ωa†a + (Ω/2)σ_z + g(aσ_+ + a†σ_−), exactly solvable in each (n,n+1) doublet; (b) the full quantum Rabi Hamiltonian with counter-rotating terms, which is *not* the JCM and has no closed-form solution until Braak 2011; (c) the dissipative/driven JCM coupled to baths, where exact solubility is lost. Modern ultrastrong/deep-strong coupling papers routinely call (b) 'JCM' when it is precisely the model whose RWA the JCM relies on."}, {"claim": "The Jaynes–Cummings model 'predicts spontaneous emission'", "clarification": "Spontaneous emission in free space requires a continuum of modes; the JCM has a single mode and instead predicts vacuum Rabi *oscillations*. The original 1963 paper used the JCM precisely to show that single-mode quantization gives oscillatory, not exponential, decay — that mismatch with experiment was Jaynes's argument that semiclassical theory sufficed, an interpretation later overturned by Wigner–Weisskopf and by experiments."}, {"claim": "Collapse and revival is a uniquely quantum signature of field quantization", "clarification": "The collapse is reproduced by *any* sufficiently broad classical statistical mixture of Rabi frequencies; only the *revival* (and its discreteness) is a true signature of photon-number quantization. Eberly–Narozhny–Sanchez-Mondragon made this distinction explicit; popular accounts often conflate the two."}, {"claim": "Jaynes–Cummings and Tavis–Cummings are minor variants", "clarification": "They are physically distinct: TC has an SU(2) collective spin coupled to one mode and exhibits a thermodynamic-limit superradiant phase transition (Dicke); JCM has no phase transition in the standard sense. The 'accidental symmetry' of TC (Schwinger-boson representation) has no counterpart in JCM."}, {"claim": "'Vacuum Rabi splitting' is a JCM prediction", "clarification": "The two-peak spectrum at zero detuning was derived in the semiclassical strong-coupling oscillator model decades earlier (and is reproducible by two coupled classical oscillators). What the JCM uniquely predicts is the √n scaling of the splitting with photon number — the so-called anharmonic JC ladder — which is the genuinely quantum feature tested by Brune et al. 1996 and by circuit-QED dispersive readouts."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins: Rabi's Gyrating Field, Cummings's Thesis, and the Paul Parallel", "markdown": "## Origins: Rabi's Gyrating Field, Cummings's Thesis, and the Paul Parallel\n\n### From Rabi's gyrating field to a quantization problem\n\nThe Jaynes–Cummings model is best understood as the obligatory quantum sequel to a 1937 semiclassical calculation. Rabi, asking how a spin-$1/2$ behaves in a static field $B_0\\hat z$ plus a circularly polarized transverse field of amplitude $B_1$ rotating at frequency $\\omega$, showed that the spin-flip probability is\n\n$$P_{\\!\\uparrow\\downarrow}(t) \\;=\\; \\frac{\\Omega_1^2}{\\Omega_1^2 + \\Delta^2}\\,\\sin^2\\!\\Bigl(\\tfrac{1}{2}\\sqrt{\\Omega_1^2+\\Delta^2}\\,t\\Bigr),\\qquad \\Omega_1=\\gamma B_1,\\ \\ \\Delta=\\omega_0-\\omega.$$\n\nThe decisive technical move was to pass to the frame rotating at $\\omega$, in which the transverse field is static. This trick — eliminating the explicit time-dependence at the price of accepting a counter-rotating term that can be dropped when $\\omega\\approx\\omega_0$ — is the entire content of what later got rebranded as the *rotating-wave approximation*. Without it the Bloch equations have no closed-form solution; with it they reduce to precession about a static effective field. Every line of the 1963 Jaynes–Cummings Hamiltonian is engineered to make this same RWA available after the field has been promoted to a quantized mode.\n\nThe intermediate step belongs to Bloch and Siegert (1940), who computed the leading correction to Rabi's formula when the linearly polarized $2B_1\\cos\\omega t$ is *not* decomposable into a single co-rotating component. Their shift,\n\n$$\\delta\\omega_{\\rm BS}\\;\\sim\\;\\frac{\\Omega_1^{2}}{4\\omega_0},$$\n\nis precisely the error term that the RWA discards. It is worth flagging now what becomes a recurring confusion later in the dossier: the Bloch–Siegert shift is a *classical* statement about how badly the RWA fails for a strong driving field, and its quantum re-incarnation in the Rabi Hamiltonian (the counter-rotating $a\\sigma_- + a^\\dagger\\sigma_+$ terms) is the precise object the JCM throws away.\n\n### Cummings at Stanford: the algebra nobody else did\n\nThe Hamiltonian that now bears Jaynes's name had to wait two decades because the missing ingredient was not physical insight but operator bookkeeping. Putting $B_1 \\to (a+a^\\dagger)$ and keeping only the energy-conserving piece yields\n\n$$H_{\\rm JC} \\;=\\; \\omega\\, a^\\dagger a \\;+\\; \\tfrac{1}{2}\\Omega\\,\\sigma_z \\;+\\; g\\bigl(a\\,\\sigma_+ + a^\\dagger\\sigma_-\\bigr),$$\n\nand one then has to notice that $\\hat N = a^\\dagger a + \\tfrac12(\\sigma_z+1)$ commutes with $H_{\\rm JC}$, that this constant of motion partitions the Hilbert space into $2\\times 2$ blocks $\\{|n,e\\rangle,|n+1,g\\rangle\\}$, and that diagonalization of each block produces the dressed pair\n\n$$E_{\\pm}(n) \\;=\\; \\omega\\bigl(n+\\tfrac12\\bigr) \\;\\pm\\; \\tfrac12\\sqrt{\\Delta^{2}+4g^{2}(n+1)},$$\n\nwith the $\\sqrt{n+1}$ spectrum that is the model's actual quantum content. This is the algebraic skeleton later canonized in textbooks [1, 2]; the historical record makes clear that it was written down by Fred Cummings, advised by Jaynes, in his 1962 Stanford doctoral dissertation. Two pieces of evidence pin this down. First, the 1965 single-author paper [3], submitted while Cummings was at Aerospace Corporation and at UC Riverside, already pushes well past the 1963 joint paper — extending the model to a coherent-state field and observing the *collapse* of Rabi oscillations under photon-number fluctuations — and reads as the natural continuation of a thesis-grade calculation rather than as a fresh start. Second, the Knight–Gerry–Birrittella–Alsing retrospective [4] is explicit that \"most of the operator algebra in the original paper, including the dressed-state diagonalization, is Cummings's work\" — a recollection from people who knew the principals.\n\nJaynes's own contribution to the 1963 paper [5] was different in kind. He had been building the case, throughout the late 1950s and early 1960s, that the spontaneous-emission rate $A$ of Einstein was an artifact of an unnecessary second quantization, and that a self-consistent semiclassical theory — atoms quantized, field classical, with the atomic dipole acting as a self-source — could reproduce the line shapes and saturation behaviour of beam masers and lasers. The JCM was constructed *as a foil* to this neoclassical theory: a fully quantized model simple enough that its predictions could be put side-by-side with the semiclassical ones and the discrepancy isolated. The discrepancy Jaynes wanted to highlight is exactly the one that makes the JCM famous: the quantum theory predicts *oscillations* (and, as Cummings would soon show, collapses and revivals) where the semiclassical theory predicts monotone decay or steady-state saturation. Jaynes read that as evidence against the necessity of field quantization; almost everyone else read it as the cleanest available demonstration of its consequences. The polemical framing explains a curiosity that is otherwise inexplicable: the 1963 paper appears not in *Physical Review* but in *Proceedings of the IEEE*, in a special issue on quantum electronics where Jaynes could argue at length that the maser community was over-quantizing.\n\n### Harry Paul, Berlin 1963\n\nThe independent track is almost completely missing from English-language pedagogy. In the same year, Harry Paul at the Humboldt Universität in East Berlin published \"Induzierte Emission bei starker Einstrahlung\" in *Annalen der Physik* (Bd. 11, 411, 1963), in which the identical Hamiltonian — a single quantized mode coupled in the rotating-wave form to a two-level atom — is analyzed for stimulated-emission gain at strong drive. Paul derives the dressed eigenvalues, comments on the $\\sqrt{n}$ spectrum, and applies the model to the maser amplifier problem (verify — the exact section structure of Paul's paper is recalled from secondary sources, principally the Shore–Knight review [2] and Walther's Garching lecture notes, which cite Paul explicitly as a co-originator). It is for this reason that the Munich, Garching, and Berlin schools — and the German pedagogical literature in general — consistently write *Jaynes–Cummings–Paul model*. The 1987 Garching experimental paper [6], from Walther's group, was reviewed by people for whom the triple attribution was uncontroversial; the slow erosion of Paul's name in the anglophone literature is a textbook-propagation artefact, not a verdict on priority.\n\n### Where the credit actually sits\n\nReduced to a checklist:\n\n- Semiclassical kernel and the RWA logic — **Rabi 1937**, with Bloch–Siegert 1940 as the explicit statement of what the RWA throws away.\n- The Hamiltonian, the conserved excitation number, the dressed ladder, the $\\sqrt{n+1}$ spectrum — **Cummings 1962** (thesis), reaching print in [5] and consolidated in [3].\n- The polemical framing as a referendum on neoclassical radiation theory, and the choice of *Proc. IEEE* as venue — **Jaynes 1963**.\n- Independent derivation of the same Hamiltonian with a maser-amplifier emphasis — **Paul 1963**, *Annalen der Physik* 11, 411.\n- The N-atom collective extension that becomes the Dicke–Tavis–Cummings model — **Tavis \u0026 Cummings 1968** [7], with the partial-symmetry refinement in [8].\n\nThe naming convention \"Jaynes–Cummings\" is therefore historically a *truncation*: it under-weights Cummings's algebra, omits Paul entirely, and elevates the senior author's interpretive agenda over the technical machinery that actually solved the problem. The subsequent forty years of dressed-state physics, revivals, cavity QED ladders, and circuit-QED spectroscopy are built on Cummings's $2\\times 2$ blocks and Paul's parallel maser analysis — a fact the literature has been quietly inheriting without quite acknowledging."}, {"id": "the-hamiltonian-and-its-exact-solution", "title": "The Hamiltonian, the Dressed Ladder, and the √n Spectrum", "markdown": "## The Hamiltonian, the Dressed Ladder, and the √n Spectrum\n\n### Setting up the Hamiltonian\n\nTake a two-level atom of transition frequency $\\Omega$ coupled to a single quantized cavity mode of frequency $\\omega$. Use Pauli operators $\\sigma_z, \\sigma_\\pm$ on the atom and bosonic $a, a^\\dagger$ on the field. In dipole-and-rotating-wave approximation (RWA), the full atom + field + interaction Hamiltonian is\n\n$$H \\;=\\; \\omega\\, a^\\dagger a \\;+\\; \\tfrac{1}{2}\\Omega\\, \\sigma_z \\;+\\; g\\bigl(a\\,\\sigma_+ + a^\\dagger\\,\\sigma_-\\bigr),$$\n\nwith single-photon vacuum coupling $g = -d\\sqrt{\\omega/2\\varepsilon_0 V}\\,\\hat e\\cdot\\langle e\\mid\\mathbf{r}\\mid g\\rangle$ (units $\\hbar=1$). The two terms dropped by the RWA, $g(a\\sigma_- + a^\\dagger\\sigma_+)$, do not commute with the bare excitation number and are suppressed by the smallness of $g/(\\omega+\\Omega)$. Their reinstatement returns the full quantum Rabi Hamiltonian — a distinct model with no closed-form spectrum until Braak's 2011 G-function construction [9]. Inside this section everything that follows assumes the RWA; this is the precise sense in which the JCM is *integrable*.\n\nThe key structural fact is that the excitation number\n\n$$\\hat N \\;=\\; a^\\dagger a \\;+\\; \\sigma_+\\sigma_-$$\n\ncommutes with $H$. Hilbert space therefore decomposes into a one-dimensional ground sector $\\{|0,g\\rangle\\}$ — annihilated by the coupling — and an infinite tower of two-dimensional excitation-conserving doublets\n\n$$\\mathcal{H}_n \\;=\\; \\mathrm{span}\\bigl\\{|n,e\\rangle,\\; |n{+}1,g\\rangle\\bigr\\}, \\qquad n=0,1,2,\\dots$$\n\nEach $\\mathcal{H}_n$ is independently invariant under $H$. The exact-solvability of the JCM is precisely this block-diagonal structure imposed by $[\\hat N,H]=0$.\n\n### The $2\\times 2$ block and the √n spectrum\n\nWriting $\\delta \\equiv \\Omega - \\omega$ for the atom–field detuning, the matrix of $H$ on $\\mathcal{H}_n$ in the basis $\\bigl(|n,e\\rangle,\\,|n{+}1,g\\rangle\\bigr)$ is\n\n$$H_n \\;=\\; \\omega\\!\\left(n+\\tfrac{1}{2}\\right)\\mathbb{1} \\;+\\; \\begin{pmatrix} \\delta/2 \u0026 g\\sqrt{n+1}\\\\[2pt] g\\sqrt{n+1} \u0026 -\\delta/2 \\end{pmatrix}.$$\n\nDiagonalization is the elementary $2\\times 2$ Rabi problem, but with a quantized off-diagonal element. Defining the generalized $n$-photon Rabi frequency\n\n$$\\Omega_n(\\delta) \\;\\equiv\\; \\sqrt{\\delta^2 + 4 g^{2}(n+1)},$$\n\nthe eigenvalues are\n\n$$E_{\\pm}(n) \\;=\\; \\omega\\!\\left(n+\\tfrac{1}{2}\\right) \\;\\pm\\; \\tfrac{1}{2}\\,\\Omega_n(\\delta),$$\n\nand the eigenvectors — the *dressed states* — are obtained with a Stückelberg mixing angle $\\theta_n$ defined by\n\n$$\\tan 2\\theta_n \\;=\\; \\frac{2g\\sqrt{n+1}}{\\delta}, \\qquad \\theta_n\\in[0,\\pi/4],$$\n\nso that\n\n$$\\begin{aligned}|+,n\\rangle \u0026= \\cos\\theta_n\\,|n,e\\rangle + \\sin\\theta_n\\,|n{+}1,g\\rangle,\\\\ |-,n\\rangle \u0026= -\\sin\\theta_n\\,|n,e\\rangle + \\cos\\theta_n\\,|n{+}1,g\\rangle.\\end{aligned}$$\n\nAt resonance $\\delta=0$ the mixing is maximal, $\\theta_n=\\pi/4$, and the doublet splits symmetrically by $2g\\sqrt{n+1}$. The presence of the $\\sqrt{n+1}$ — not $n+1$ — is the entire quantum content of the model. A harmonic ladder ($\\sqrt{n+1}\\to n+1$) would be the spectrum of two classically coupled oscillators; the genuinely nonclassical fingerprint is the *anharmonicity* $\\sqrt{n+2}-\\sqrt{n+1}\\sim 1/(2\\sqrt{n})$, which is what gives the √n-rung structure later resolved by Brune *et al.* in microwave cavity QED [10] and by dispersive ladder spectroscopy in circuit QED [11, 12]. Vacuum Rabi splitting at $n=0$, by contrast, is reproduced by two coupled classical oscillators; it is the *photon-number dependence* of the splitting that is JC-specific, a point belaboured in the Shore–Knight review [2] and in Gerry–Knight's textbook treatment [1].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eJC dressed ladder vs bare ladder\u003c/title\u003e\u003cline x1=\"60\" y1=\"370\" x2=\"60\" y2=\"40\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"40\" y=\"35\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003eE\u003c/text\u003e\u003ctext x=\"40\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" font-family=\"serif\"\u003e0\u003c/text\u003e\u003ctext x=\"120\" y=\"395\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ebare\u003c/text\u003e\u003ctext x=\"380\" y=\"395\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eJC dressed (δ=0)\u003c/text\u003e\u003ctext x=\"620\" y=\"395\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eharmonic ref.\u003c/text\u003e\u003cline x1=\"80\" y1=\"320\" x2=\"160\" y2=\"320\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003ctext x=\"170\" y=\"324\" fill=\"#7aa2ff\" font-size=\"14\"\u003e|0,g⟩\u003c/text\u003e\u003cline x1=\"80\" y1=\"240\" x2=\"160\" y2=\"240\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"170\" y=\"244\" fill=\"#7aa2ff\" font-size=\"14\"\u003e|0,e⟩, |1,g⟩ (deg.)\u003c/text\u003e\u003cline x1=\"80\" y1=\"160\" x2=\"160\" y2=\"160\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"170\" y=\"164\" fill=\"#7aa2ff\" font-size=\"14\"\u003e|1,e⟩, |2,g⟩ (deg.)\u003c/text\u003e\u003cline x1=\"80\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#7aa2ff\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"170\" y=\"84\" fill=\"#7aa2ff\" font-size=\"14\"\u003e|2,e⟩, |3,g⟩ (deg.)\u003c/text\u003e\u003cline x1=\"340\" y1=\"320\" x2=\"420\" y2=\"320\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"430\" y=\"324\" fill=\"#7ee0a3\" font-size=\"14\"\u003e|0,g⟩\u003c/text\u003e\u003cline x1=\"340\" y1=\"215\" x2=\"420\" y2=\"215\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"340\" y1=\"265\" x2=\"420\" y2=\"265\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"430\" y=\"219\" fill=\"#ffb86b\" font-size=\"14\"\u003e|+,0⟩ +g\u003c/text\u003e\u003ctext x=\"430\" y=\"269\" fill=\"#ffb86b\" font-size=\"14\"\u003e|−,0⟩ −g\u003c/text\u003e\u003cline x1=\"340\" y1=\"125\" x2=\"420\" y2=\"125\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"340\" y1=\"195\" x2=\"420\" y2=\"195\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"430\" y=\"129\" fill=\"#ffb86b\" font-size=\"14\"\u003e|+,1⟩ +g√2\u003c/text\u003e\u003ctext x=\"430\" y=\"199\" fill=\"#ffb86b\" font-size=\"14\"\u003e|−,1⟩ −g√2\u003c/text\u003e\u003cline x1=\"340\" y1=\"40\" x2=\"420\" y2=\"40\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cline x1=\"340\" y1=\"120\" x2=\"420\" y2=\"120\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"430\" y=\"55\" fill=\"#ffb86b\" font-size=\"14\"\u003e|+,2⟩ +g√3\u003c/text\u003e\u003ctext x=\"430\" y=\"115\" fill=\"#ffb86b\" font-size=\"14\"\u003e|−,2⟩ −g√3\u003c/text\u003e\u003cline x1=\"580\" y1=\"320\" x2=\"660\" y2=\"320\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003cline x1=\"580\" y1=\"280\" x2=\"660\" y2=\"280\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003cline x1=\"580\" y1=\"240\" x2=\"660\" y2=\"240\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003cline x1=\"580\" y1=\"200\" x2=\"660\" y2=\"200\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003cline x1=\"580\" y1=\"160\" x2=\"660\" y2=\"160\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003cline x1=\"580\" y1=\"120\" x2=\"660\" y2=\"120\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003cline x1=\"580\" y1=\"80\" x2=\"660\" y2=\"80\" stroke=\"#ff7a90\" stroke-width=\"2\" opacity=\"0.55\"/\u003e\u003ctext x=\"670\" y=\"284\" fill=\"#ff7a90\" font-size=\"13\" opacity=\"0.7\"\u003eequal Δ\u003c/text\u003e\u003c/svg\u003e\n*Figure: At resonance the bare doublets $\\{|n,e\\rangle,|n{+}1,g\\rangle\\}$ are degenerate; the JC coupling lifts each into a dressed pair $|\\pm,n\\rangle$ split by $2g\\sqrt{n+1}$. The right column shows a uniformly spaced (classical) ladder for comparison — the JC ladder is anharmonic with √n-spaced rungs.*\n\n### Heisenberg-picture operator solution\n\nThe same content can be read off without ever diagonalizing a matrix, by integrating the Heisenberg equations directly. With $[\\hat N,H]=0$, one promotes the c-number Rabi frequency to an operator,\n\n$$\\hat\\Omega \\;\\equiv\\; \\sqrt{\\delta^{2} + 4 g^{2}\\bigl(a^\\dagger a + \\sigma_+\\sigma_-\\bigr)},$$\n\nand finds, for the atomic inversion at resonance,\n\n$$\\sigma_z(t) \\;=\\; \\sigma_z(0)\\cos\\!\\bigl(\\hat\\Omega\\, t\\bigr) \\;-\\; \\frac{2 i g}{\\hat\\Omega}\\bigl[a^\\dagger\\sigma_-(0) - a\\,\\sigma_+(0)\\bigr]\\sin\\!\\bigl(\\hat\\Omega\\, t\\bigr),$$\n\nwith analogous expressions for $a(t)$ and $\\sigma_\\pm(t)$ in which $\\hat\\Omega$ sits underneath square roots in operator-ordered combinations. This is the operator perturbation theory of Ackerhalt and Rzążewski [13], and it is the form in which the model is most usefully presented for spectroscopy: every expectation value reduces to a photon-number sum over $\\cos(\\Omega_n t)$ and $\\sin(\\Omega_n t)$ weighted by the initial field distribution $P(n)$. The collapse-and-revival phenomenology of §3 is built directly on this representation [14, 15].\n\n### Stenholm's Bargmann route\n\nThe closed form that hides the matrix algebra most elegantly is Stenholm's Bargmann representation [16]. Map the field onto the Hilbert space of entire functions $f(z)$ with inner product $\\langle f\\mid h\\rangle = \\pi^{-1}\\!\\int\\! e^{-|z|^2} \\overline{f(z)} h(z)\\, d^2z$, so that $a^\\dagger \\to z$ and $a \\to \\partial_z$. The wavefunction becomes a two-component holomorphic spinor $\\bigl(\\psi_e(z,t),\\,\\psi_g(z,t)\\bigr)^\\top$. The Schrödinger equation reads\n\n$$i\\partial_t\\begin{pmatrix}\\psi_e\\\\\\psi_g\\end{pmatrix} \\;=\\; \\begin{pmatrix}\\omega z\\partial_z + \\tfrac{\\Omega}{2} \u0026 g\\,\\partial_z\\\\[2pt] g\\,z \u0026 \\omega z\\partial_z - \\tfrac{\\Omega}{2}\\end{pmatrix}\\!\\begin{pmatrix}\\psi_e\\\\\\psi_g\\end{pmatrix}.$$\n\nExcitation conservation collapses the system to a single first-order ODE for $\\psi_e$ after writing $\\psi_g(z,t) = z\\,\\chi(z,t)$, and the exact propagator is obtained as a contour-integral / generating-function expression — a calculation that takes a single page where direct number-state expansion takes several. Stenholm's representation is also the cleanest starting point for the multi-photon ($k$-photon) generalization of Sukumar and Buck [17], where $a\\sigma_+ \\to a^k\\sigma_+$ and integrability survives because $\\hat N_k = a^\\dagger a + k\\,\\sigma_+\\sigma_-$ is still conserved; the doublets become $\\{|n,e\\rangle,|n+k,g\\rangle\\}$ and the spectrum acquires the factor $\\sqrt{n!/(n-k)!}\\,/\\,k!$ familiar from $k$-photon transitions. Holstein–Primakoff and Schwinger-boson reformulations [18] reorganize the same algebra into spin language and prepare the ground for the Tavis–Cummings generalization handled in §4 [7, 8].\n\nThe arithmetic of the dressed ladder is therefore trivial; its physical content is not. The next section asks what the resulting dynamics — $\\sigma_z(t)$ for a coherent-state field — looks like once one sums the $\\cos(\\Omega_n t)$ terms over the Poisson distribution, and what is genuinely quantum about the collapse and revival that emerges."}, {"id": "collapse-revival-and-the-coherent-state", "title": "Collapse, Revival, and What Is Actually Quantum About Them", "markdown": "## Collapse, Revival, and What Is Actually Quantum About Them\n\nTake the resonant JCM with the atom prepared in $|e\\rangle$ and the cavity in a coherent state $|\\alpha\\rangle$ of mean photon number $\\bar n = |\\alpha|^2$. The initial state is\n$$|\\psi(0)\\rangle = |e\\rangle \\otimes \\sum_{n=0}^\\infty c_n |n\\rangle, \\qquad c_n = e^{-|\\alpha|^2/2}\\frac{\\alpha^n}{\\sqrt{n!}}.$$\nInside each dressed doublet $\\{|e,n\\rangle,\\,|g,n+1\\rangle\\}$ the on-resonance Hamiltonian is just a Rabi rotation at angular frequency $\\Omega_n = 2g\\sqrt{n+1}$, so\n$$|\\psi(t)\\rangle = \\sum_n c_n\\bigl[\\cos(g\\sqrt{n+1}\\,t)\\,|e,n\\rangle \\;-\\; i\\sin(g\\sqrt{n+1}\\,t)\\,|g,n+1\\rangle\\bigr].$$\nThe atomic inversion is a Poisson-weighted superposition of Rabi tones:\n$$\\langle\\sigma_z(t)\\rangle \\;=\\; \\sum_{n=0}^\\infty P_n\\cos\\!\\bigl(2g\\sqrt{n+1}\\,t\\bigr), \\qquad P_n \\;=\\; e^{-\\bar n}\\,\\frac{\\bar n^{\\,n}}{n!}.$$\n(If one prefers the atom in $|g\\rangle$, the overall sign flips and the radicand becomes $\\sqrt{n}$; nothing structural changes.) This is the central object of the section. The frequencies $\\Omega_n$ are *incommensurate* — they share no common period — yet they crowd around the mean $\\bar\\Omega = 2g\\sqrt{\\bar n+1}$ when $\\bar n \\gg 1$. From the tension between those two facts emerge the collapse and the revival.\n\n### The collapse: Gaussian dephasing on a $\\bar n$-independent timescale\n\nFor a coherent state $P_n$ peaks sharply at $n=\\bar n$ with rms spread $\\Delta n = \\sqrt{\\bar n}$. Linearizing the frequency about the peak,\n$$\\Omega_n \\;\\approx\\; \\bar\\Omega \\;+\\; \\frac{g}{\\sqrt{\\bar n}}\\,(n-\\bar n) \\;+\\; \\mathcal O\\!\\bigl(\\bar n^{-3/2}\\bigr),$$\ngives a Rabi-frequency packet of width\n$$\\Delta\\Omega \\;\\approx\\; \\frac{g}{\\sqrt{\\bar n}}\\,\\Delta n \\;=\\; g.$$\nThe cancellation is the punch line: the *width* of the sampled Rabi distribution is set by $g$ alone, independent of how bright the field is. Replacing the sum by a Gaussian integral in $n$,\n$$\\langle\\sigma_z(t)\\rangle \\;\\approx\\; \\cos(\\bar\\Omega t)\\,\\exp\\!\\bigl[-\\tfrac12 (\\Delta\\Omega)^2 t^2\\bigr] \\;=\\; \\cos(\\bar\\Omega t)\\,e^{-g^2 t^2/2},$$\nso the Rabi oscillations dephase as a Gaussian with collapse time\n$$t_c \\;\\sim\\; \\frac{\\sqrt 2}{g}.$$\nThe envelope decay was already visible in Cummings's single-author 1965 paper [3], which examined \"stimulated emission of radiation in a single mode\" for a coherent driving field but did not push to longer times. It also drops out trivially from Stenholm's Bargmann-representation solution [16].\n\n### The revival: rephasing forced by integer $n$\n\nThe Gaussian decay is *not* the end of the dynamics — it is the leading order in which $\\Omega_n$ is treated as a continuous variable. Keep the discreteness. Two adjacent components $\\Omega_n$ and $\\Omega_{n-1}$ slip in phase by\n$$\\delta\\phi_n(t) \\;=\\; (\\Omega_n - \\Omega_{n-1})\\,t \\;\\approx\\; \\frac{g}{\\sqrt{\\bar n}}\\,t.$$\nThe packet rephases — modulo $2\\pi$ — when this slip reaches $2\\pi$, namely at\n$$t_r \\;=\\; \\frac{2\\pi\\sqrt{\\bar n}}{g},$$\nproducing a partial reappearance of the macroscopic Rabi oscillation. *There is no analogue of $t_r$ in any continuous-frequency description of the field.* This is the discovery of Eberly, Narozhny and Sanchez-Mondragon, announced as a *Physical Review Letter* in 1980 [14] and developed the following year in *Physical Review A* under the unambiguous title \"Coherence versus incoherence: collapse and revival in a simple quantum model\" [15]; the companion conference abstract on two-time correlations [19] reports the same numerics. Convention shortens this to \"Eberly's revivals\" — the recent Knight–Gerry retrospective [4] still does — but it is genuinely a three-author result, and the 1981 title telegraphs the conceptual move I am about to make explicit.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"360\" y=\"22\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eAtomic inversion ⟨σz(t)⟩ for |e⟩ ⊗ |α⟩: Gaussian collapse, discrete-n revival\u003c/text\u003e\u003cline x1=\"60\" y1=\"200\" x2=\"700\" y2=\"200\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"50\" x2=\"60\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"52\" y=\"74\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e+1\u003c/text\u003e\u003ctext x=\"52\" y=\"204\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"52\" y=\"324\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e−1\u003c/text\u003e\u003ctext x=\"22\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 22 200)\"\u003e⟨σz⟩\u003c/text\u003e\u003ctext x=\"710\" y=\"205\" fill=\"#e8e6e1\" font-size=\"14\"\u003et\u003c/text\u003e\u003cpolyline points=\"60,70 65,88 70,136 75,200 80,262 85,306 90,319 95,300 100,255 105,200 110,149 115,117 120,109 125,126 130,160 135,200 140,234 145,255 150,258 155,246 160,224 165,200 170,181 175,170 180,169 185,176 190,188 195,200 200,209 205,214 210,214 215,210 220,205 225,200 230,196 235,195 240,195 245,196 250,198 255,200 260,201 270,202 280,200 290,199 300,200 320,200 340,200 360,200 380,200 400,206 420,200 440,217 450,240 460,224 470,172 480,136 490,165 500,239 510,283 520,244 530,155 540,109 550,155 560,244 570,283 580,239 590,165 600,136 610,172 620,224 630,240 640,217 650,186 660,178 670,192 680,206\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.6\"/\u003e\u003cpath d=\"M 60 70 Q 130 110 200 195 L 380 200 Q 460 195 540 109 Q 620 195 680 200\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.2\" stroke-dasharray=\"4,3\" opacity=\"0.8\"/\u003e\u003cpath d=\"M 60 330 Q 130 290 200 205 L 380 200 Q 460 205 540 291 Q 620 205 680 200\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.2\" stroke-dasharray=\"4,3\" opacity=\"0.8\"/\u003e\u003cline x1=\"160\" y1=\"340\" x2=\"160\" y2=\"350\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"160\" y=\"368\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003et_c ~ √2 / g\u003c/text\u003e\u003cline x1=\"540\" y1=\"340\" x2=\"540\" y2=\"350\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"540\" y=\"368\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003et_r ~ 2π √n̄ / g\u003c/text\u003e\u003ctext x=\"125\" y=\"60\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"middle\"\u003ecarrier 2g√(n̄+1)\u003c/text\u003e\u003ctext x=\"320\" y=\"186\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003ecollapse plateau — classical Rabi distribution reproduces this\u003c/text\u003e\u003ctext x=\"540\" y=\"58\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003erevival — requires discrete n\u003c/text\u003e\u003ctext x=\"360\" y=\"392\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003et_r / t_c ~ 2π √n̄: many Rabi cycles between successive revivals\u003c/text\u003e\u003c/svg\u003e\n*Figure: schematic $\\langle\\sigma_z(t)\\rangle$ for $\\bar n\\sim 10$. The carrier oscillates at $\\bar\\Omega = 2g\\sqrt{\\bar n+1}$; the orange envelopes are the Gaussian collapse $e^{-g^2 t^2/2}$ centred at $t=0$ and a partial Gaussian revival of reduced amplitude centred at $t_r$.*\n\n### What survives a classical distribution, and what does not\n\nHere is the conflation the textbook literature still propagates. Suppose, instead of a quantized field, we model the cavity as a *classical* oscillator whose amplitude $A$ — hence whose Rabi frequency $\\Omega(A) = 2gA$ — is drawn from a smooth probability density $f(\\Omega)$. The inversion is then a Fourier–cosine transform,\n$$\\langle\\sigma_z(t)\\rangle_{\\text{classical}} \\;=\\; \\int d\\Omega\\, f(\\Omega)\\cos(\\Omega t),$$\nand by Riemann–Lebesgue it decays *without recurrence* as $t\\to\\infty$ whenever $f$ has finite width. Choose $f$ Gaussian of width $g$ centred at $\\bar\\Omega$ and one recovers $\\cos(\\bar\\Omega t)\\,e^{-g^2 t^2/2}$ bit for bit. The collapse, in other words, is just dephasing in *any* sufficiently broad mixture of classical Rabi frequencies; an experimentalist who saw only the decay envelope would not yet have evidence of a quantized field. Knight and Radmore made this point with unusual clarity in 1982 [20], framing the collapse as garden-variety inhomogeneous dephasing and locating the genuinely quantum content in the recurrences.\n\nThe revival is different. A continuous $f(\\Omega)$ produces a continuous spectrum, and the integral above admits no almost-periodicity; the sum defining $\\langle\\sigma_z\\rangle$, by contrast, runs over the discrete lattice $\\{\\sqrt{n+1}\\}$ and is therefore an *almost-periodic* function of $t$ in the sense of H. Bohr. The first revival at $t_r$, the successors at $2t_r,\\,3t_r,\\ldots$, and the slow secular decay of revival amplitude due to incommensurability of the surds $\\sqrt{n+1}$ — these are strictly quantum-mechanical features of the JCM. They have no classical mimic. Singh's study of generalized JCMs [21] confirmed that revival structure persists across a range of initial photon statistics so long as the spectrum remains discrete; the Sanchez-Mondragon–Eberly coherent–thermal abstract [22] showed thermal smearing of $P_n$ broadens but does not erase it. The Shore–Knight review [2] and the Gerry–Knight textbook [1] both lay the point out, but it migrates only sporadically into the wider quantum-optics literature.\n\nThe numerology is illuminating. The ratio\n$$\\frac{t_r}{t_c} \\;\\sim\\; 2\\pi\\sqrt{\\bar n}$$\nmeans that even a modest $\\bar n\\sim 10$ accommodates several dozen Rabi periods between collapse and first revival, while $\\bar n\\sim 10^4$ pushes $t_r$ beyond any realistic cavity decoherence time. That is precisely why the Garching one-atom maser [6] is the historically decisive experiment — Rempe, Walther and Klein worked at $\\bar n$ of order a few and at cavity $Q$ high enough to keep $t_r$ inside the coherence time, then watched $\\langle\\sigma_z\\rangle$ rebuild itself out of the collapse plateau. That observation, more than any Rabi-splitting measurement, is what closed the question of whether the field's quantization shows up in atomic dynamics, because it is the one feature popular accounts misidentify as semiclassical that resolutely is not."}, {"id": "extensions-and-what-superseded-what", "title": "Generalizations: Tavis–Cummings, k-Photon, Beyond RWA, and the Quantum Rabi Resurrection", "markdown": "## Generalizations: Tavis–Cummings, k-Photon, Beyond RWA, and the Quantum Rabi Resurrection\n\n### From one atom to N: Tavis–Cummings\n\nThe natural N-atom extension was published by Michael Tavis (then Cummings's Caltech student) and Cummings in 1968 [7], with the approximate-solution companion the following year [8]. Replace single Pauli operators by collective spin $J_z=\\sum_i\\sigma_z^{(i)}/2$, $J_\\pm=\\sum_i\\sigma_\\pm^{(i)}$, all atoms on resonance with one cavity mode:\n\n$$H_\\mathrm{TC}=\\omega\\,a^\\dagger a+\\Omega\\,J_z+g\\,(aJ_+ + a^\\dagger J_-).$$\n\nThe Hilbert space decomposes by total angular momentum $J$ (a relic of permutation symmetry) and by the conserved excitation number $\\hat N=a^\\dagger a+J_z+J$. Inside each $(J,N)$ block the Hamiltonian is a finite tridiagonal matrix that diagonalises exactly. What is sometimes labelled \"Bethe-ansatz\" solution is, more honestly, block-tridiagonal linear algebra plus a polynomial Bethe-equation rewriting that becomes useful only in the large-$J$ limit.\n\nTwo 2026 papers [23, 24] revive a point that the textbook tradition lost: TC carries an *accidental* SU(2) symmetry that becomes manifest only in the Schwinger-boson representation, where $J_\\pm$ are encoded in two auxiliary bosons. Coane and Iachello have extended an analogous algebraic skeleton to dissipative Bose–Fermi systems covering both JCM and Dicke [25]. The accidental symmetry is what enables global-control protocols that drive arbitrary collective states using the TC coupling alone [23].\n\nA textbook conflation worth flagging: the TC model in the RWA does *not* exhibit the Dicke superradiant phase transition. The genuine transition at $g_c=\\sqrt{\\omega\\Omega}/2$ requires the counter-rotating terms; the RWA-truncated TC has only a smooth crossover in the thermodynamic limit. The \"JCM phase transition\" papers (e.g. [26]) achieve a critical point either by adding a Stark or driving term or by taking a singular coupling-rescaled limit, not by the bare $H_\\mathrm{JC}$.\n\n### k-Photon and intensity-dependent variants\n\nSukumar and Buck [17] generalised the interaction to\n\n$$H_\\mathrm{int}^{(k)}=g\\,\\big(a^k\\sigma_+ + (a^\\dagger)^k\\sigma_-\\big),$$\n\nso the atom exchanges $k$ photons per transition. The $(n,n{+}k)$ doublets still close, and eigenvalues acquire $\\sqrt{n!/(n-k)!}$ in place of $\\sqrt{n}$. For $k=2$ this is the degenerate two-photon JCM (rotating-wave hyper-Raman); for $k\\ge 3$ the operator $a^k\\sigma_+$ is *unbounded from below* on the bare ladder unless an explicit photon-number cutoff or nonlinear field renormalisation is supplied — a subtlety quietly dropped in many follow-ups. Singh [21] computed photon-number distributions in this family and showed that revivals survive but with modified periods replacing $T_R\\propto\\sqrt{\\bar n}/g$.\n\nThe Buck–Sukumar *intensity-dependent* coupling $g\\sqrt{a^\\dagger a}\\,a\\sigma_+ +\\mathrm{h.c.}$ is an unrelated cousin in which the effective Rabi frequency loses its $\\sqrt n$ dependence; the dynamics is exactly periodic — no collapse — which is useful as a counter-example for what is and is not \"quantum\" about the standard revival. Carneiro and Pellegrino [18] derive both families through inverse Holstein–Primakoff manipulations on a single bosonic mode, embedding the TC ladder and the k-photon ladder in one algebraic frame. Other algebraic dressings — relativistic parametric amplifier and trapped-ion variants — fall in the same family [27].\n\n### Driving, dissipation, and the loss of solubility\n\nOnce the cavity leaks ($\\kappa$), the atom decays ($\\gamma$), or a classical drive is added, exact solubility is generally lost. The standard treatment writes a Lindblad equation,\n\n$$\\dot\\rho=-i[H_\\mathrm{JC},\\rho]+\\kappa\\,\\mathcal D[a]\\rho+\\gamma\\,\\mathcal D[\\sigma_-]\\rho,\\qquad \\mathcal D[L]\\rho=L\\rho L^\\dagger-\\tfrac12\\{L^\\dagger L,\\rho\\}.$$\n\nThe dispersive limit $|\\Delta|=|\\Omega-\\omega|\\gg g\\sqrt{\\bar n}$ reduces this to a photon-number-dependent qubit shift $\\chi\\sigma_z a^\\dagger a$ with $\\chi\\simeq g^2/\\Delta$, the workhorse of circuit-QED readout. Two warnings the dispersive shortcut conceals: (i) the Schrieffer–Wolff expansion diverges as $\\bar n$ approaches the *critical photon number* $n_\\mathrm{crit}=\\Delta^2/(4g^2)$ (Blais et al., verify), beyond which the dispersive picture is unreliable; (ii) the dressed-state basis in which $\\kappa$ physically acts is not the bare basis, so the naive Lindblad operators $a$ and $\\sigma_-$ violate detailed balance once $g/\\omega$ ceases to be small.\n\nDriving on the cavity produces photon blockade — the $\\sqrt n$ anharmonicity forbids resonant two-photon excitation — and dispersive bistability. The driven JCM has been reformulated via Lewis–Riesenfeld invariants [28], its monochromatic-driving spectrum revisited [29], and recast as the host of a geometric finite-system criticality [30] that is the JCM analogue of the Dicke transition.\n\n### Beyond the RWA: the quantum Rabi resurrection\n\nThe Hamiltonian *before* the RWA is the full quantum Rabi model,\n\n$$H_\\mathrm{R}=\\omega\\,a^\\dagger a+\\tfrac{\\Omega}{2}\\sigma_z+g\\,(a+a^\\dagger)\\sigma_x.$$\n\nThe counter-rotating terms $a\\sigma_-$ and $a^\\dagger\\sigma_+$ destroy the $U(1)$ excitation-number conservation that makes the JCM exactly solvable, leaving only a $\\mathbb Z_2$ parity $\\Pi=-\\sigma_z\\,(-1)^{a^\\dagger a}$. For decades the standard wisdom held that the model was *non-integrable*. Braak overturned this in 2011 [9] by exhibiting, sector by sector, a transcendental $G$-function whose zeros give the entire spectrum — an integrability statement strong enough to settle the question while leaving closed-form eigenvalues out of reach. Braak's solution is the conceptual analogue of Bethe-ansatz integrability for a system with only discrete symmetry, and it sits on top of an earlier Bargmann-representation tradition for the JCM itself [16].\n\nThe size of the Rabi correction matters as soon as $g/\\omega$ leaves the few-percent range:\n\n| regime | $g/\\omega$ | JCM validity | dominant correction |\n|---|---|---|---|\n| weak | $\\ll \\kappa,\\gamma/\\omega$ | exact | none |\n| strong | up to $\\sim 10^{-2}$ | excellent | leading Bloch–Siegert shift $\\sim g^2/4\\omega$ |\n| ultrastrong (USC) | $0.1$–$1$ | qualitatively wrong | virtual photons in the ground state; parity-protected level crossings |\n| deep-strong (DSC) | $\\gtrsim 1$ | invalid | ground state is a displaced-oscillator Schrödinger-cat; gauge choice becomes physical |\n\nNiemczyk *et al.* [31] reported circuit-QED couplings of $g/\\omega\\approx 0.12$ in 2010; in the same year Forn-Díaz *et al.* [32] resolved the Bloch–Siegert shift in a flux qubit coupled to an LC oscillator — a direct measurement of the leading non-RWA correction. By the late 2010s, DSC with $g/\\omega\u003e1$ was reached in superconducting platforms and analogue simulators. De Bernardis, Mercurio and De Liberato have argued [33] that for many DSC observables the JCM is not merely quantitatively wrong but *qualitatively misleading*: the choice between Coulomb and multipolar gauges, which is a passive bookkeeping operation in the strong-coupling regime, dictates *which* truncated Hamiltonian one is even approximating once the rotating-wave approximation fails.\n\nThe anisotropic Rabi model — independent couplings $g_+$ and $g_-$ on the co- and counter-rotating channels — interpolates between JCM ($g_-=0$) and the isotropic Rabi limit ($g_+=g_-$). Its spectrum carries a hidden $\\mathbb Z_2$ structure that protects degeneracies and has been exploited both for noise-biased qubits [34] and for programmable spectral symmetries in superconducting simulators [35, 36]. Treated as a renormalisation-group endpoint, the JCM corresponds to a particular fixed point of an RG flow in coupling space [37].\n\n### What survives, and where\n\nThe JCM is essentially exact in the strong-coupling, low-photon, well-detuned regime — and that is precisely where circuit-QED quantum information lives. In USC it is a cartoon: useful for intuition, quantitatively wrong at leading order in $g/\\omega$, qualitatively wrong about ground-state structure. In DSC it ceases to be a starting point at all, and one must either solve the full Rabi Hamiltonian (Braak) or commit to a specific gauge truncation (De Bernardis–Liberato). The Knight–Gerry–Birrittella–Alsing retrospective [4] makes the same point in personal terms: the JCM endures because the experimental frontier keeps engineering systems that sit inside its window of validity, not because the model itself has been extended to cover what lies outside it."}, {"id": "conflations-and-validity-audit", "title": "Five Confusions the Literature Still Propagates", "markdown": "## Five Confusions the Literature Still Propagates\n\nThe JCM is the most pedagogically over-rehearsed Hamiltonian in quantum optics, and that ubiquity has bred a small ecology of confusions — claims that survive in lecture notes, review articles, and even refereed papers because nobody re-derives what everyone already \"knows.\" Five recur often enough to deserve naming.\n\n### 1. \"The Jaynes–Cummings model\" used as a synonym for the quantum Rabi model\n\nThe JCM Hamiltonian is, strictly,\n\n$$H_{\\text{JC}} = \\omega\\, a^\\dagger a + \\tfrac{1}{2}\\Omega\\, \\sigma_z + g\\,(a\\sigma_+ + a^\\dagger \\sigma_-),$$\n\nwith the counter-rotating terms $a\\sigma_-$ and $a^\\dagger\\sigma_+$ discarded. The full quantum Rabi model retains them:\n\n$$H_{\\text{R}} = \\omega\\, a^\\dagger a + \\tfrac{1}{2}\\Omega\\, \\sigma_z + g\\,(a + a^\\dagger)(\\sigma_+ + \\sigma_-).$$\n\n$H_{\\text{JC}}$ commutes with the excitation number $N = a^\\dagger a + \\tfrac{1}{2}(\\sigma_z + 1)$ and decouples into $2\\times 2$ blocks; $H_{\\text{R}}$ has only the $\\mathbb{Z}_2$ parity $P = e^{i\\pi N}$ as a conserved quantity and was shown integrable — in Braak's precise sense of a parity-resolved transcendental spectrum — only in 2011 [9]. These are different physical models, valid in different regimes: the RWA is controlled by $g/\\omega \\ll 1$ *and* near-resonance $|\\omega-\\Omega|\\ll \\omega+\\Omega$, so the discarded terms oscillate at $\\sim 2\\omega$ and average out. Where the modern literature gets this wrong is in ultrastrong (USC, $g/\\omega \\gtrsim 0.1$) and deep-strong (DSC, $g/\\omega \\gtrsim 1$) coupling, where papers and even some textbooks describe Bloch–Siegert shifts [32], parity-protected ground-state photons, and virtual-photon dressing as \"JCM physics in the USC regime.\" They are nothing of the kind: those phenomena exist *because* the JCM has broken down. De Bernardis, Mercurio and De Liberato [33] make this point at length, and Forn-Díaz et al. [32] demonstrate experimentally that the first surviving correction to the JCM spectrum at moderate coupling is precisely the term the RWA threw away. The cleaner usage — \"JC regime\" for $H_{\\text{JC}}$, \"Rabi\" or \"USC\" for $H_{\\text{R}}$ — is followed in [31, 32, 33] and should be followed everywhere.\n\n### 2. \"The JCM predicts spontaneous emission\"\n\nThis appears in undergraduate quantum-optics texts and is, in a literal sense, false. Spontaneous emission in free space is the exponential, irreversible decay $\\dot P_e = -\\Gamma P_e$ with $\\Gamma = \\Omega^3|d|^2/(3\\pi\\epsilon_0 \\hbar c^3)$; the Wigner–Weisskopf derivation crucially uses a continuum of modes with a smooth density of states. The JCM has *one* mode and produces *oscillatory* energy exchange, $P_e(t) = \\cos^2(g\\sqrt{n+1}\\, t)$ for a Fock state $|n\\rangle$. There is no decay, no Fermi golden rule, no $\\Gamma$. The 1963 paper [5] used precisely this discrepancy as ammunition for neoclassical radiation theory: a quantized single mode does *not* reproduce free-space spontaneous emission, which Jaynes read as evidence that field quantization was unnecessary. The reading was wrong — the resolution is that a cavity is not free space, and tuning the mode density gives Purcell enhancement or inhibition, not Wigner–Weisskopf — but the historical irony stands. What the JCM does predict is *vacuum Rabi oscillation*, $P_e(t) = \\cos^2(gt)$ for $n=0$: a coherent, reversible exchange with a vacuum mode that has been observed cleanly in cavity QED [10] and circuit QED [11]. Calling this \"spontaneous emission\" is a category error that the Shore–Knight review [2] is careful to avoid and many later texts are not.\n\n### 3. Collapse-and-revival as a unitary signature of quantization\n\nThis is the subtlest of the five. For a coherent-state field $|\\alpha\\rangle$ with $\\bar n = |\\alpha|^2 \\gg 1$, the atomic inversion is\n\n$$\\langle\\sigma_z(t)\\rangle = \\sum_n p_n\\cos(2g\\sqrt{n+1}\\,t),\\qquad p_n = e^{-\\bar n}\\bar n^{\\,n}/n!.$$\n\nThe Poissonian width $\\Delta n \\sim \\sqrt{\\bar n}$ produces a spread in Rabi frequencies $\\Delta\\Omega_R \\sim g/\\sqrt[17]{\\bar n}\\,$ (more precisely, expanding $\\sqrt{n+1}$ around $\\bar n$ gives $\\Delta\\Omega_R \\approx g$) and hence a Gaussian *collapse* on $t_c \\sim 1/g$. But any classical statistical mixture of Rabi frequencies with comparable spread produces the same envelope: a thermal field, a chopped semiclassical pulse, even an inhomogeneously broadened ensemble. The collapse is *not* a quantum signature. What *is* a quantum signature is the *revival* at $t_r \\sim 2\\pi\\sqrt{\\bar n}/g$, which exists only because the spectrum $\\{\\sqrt{n+1}\\}$ is discrete and rationally commensurate at large $n$ — the rephasing is a number-theoretic consequence of the integer photon ladder. Eberly, Narozhny and Sanchez-Mondragon [14, 15] made this distinction explicit, and Knight–Radmore [20] gave the clean dressed-state diffusion picture; Rempe, Walther and Klein observed both in the Garching maser [6]. The confusion in introductory accounts — including some that cite [6] — is to advertise \"collapse and revival\" as a single quantum signature. Half of it is classical.\n\n### 4. JCM and Tavis–Cummings as cosmetic variants\n\nThe TC Hamiltonian replaces $\\sigma_\\pm$ by collective spin operators $J_\\pm = \\sum_{i=1}^{N}\\sigma_\\pm^{(i)}$ [7, 8]:\n\n$$H_{\\text{TC}} = \\omega\\, a^\\dagger a + \\Omega\\, J_z + g\\,(aJ_+ + a^\\dagger J_-).$$\n\nIt is *not* \"JCM with N atoms\" in any cosmetic sense. The total spin $J^2$ is conserved, the spectrum organises into SU(2) multiplets, and in the thermodynamic limit $N\\to\\infty$ with $g\\sqrt{N}$ fixed, the full Dicke model (TC plus counter-rotating terms) hosts a genuine superradiant phase transition at $g\\sqrt{N}=\\sqrt{\\omega\\Omega}/2$ — a critical point with broken parity and a soft mode. The JCM has no such transition: with one atom there is no order parameter. Even at finite $N$, TC has an accidental symmetry visible in the Schwinger-boson representation [24] that has no JCM counterpart, and the recent Deliyannis–Marvian work on global control [23] exploits exactly that structure. Papers that present TC as \"the obvious generalisation\" obscure the fact that the relevant generalisation depends on what one is after: $k$-photon JCM [17] generalises the *coupling*, TC generalises the *Hilbert space*, and the two move in orthogonal directions.\n\n### 5. \"Vacuum Rabi splitting\" as a JCM prediction\n\nThe two-peak transmission spectrum at zero detuning, with splitting $2g$, is reproduced exactly by two coupled classical oscillators — a fact known since the 1930s and routinely demonstrated with coupled pendula. The same splitting appears in classical dispersion theory and in any linear coupled-mode problem. It is therefore *not* a signature of field quantization. The genuinely quantum prediction of the JCM is the *anharmonic* $\\sqrt{n}$ ladder: the $n$-th rung of the dressed manifold is split by $2g\\sqrt{n}$, so a probe at the bare frequency cannot ladder-climb resonantly. The first unambiguous test of $\\sqrt{n}$ scaling is Brune et al. [10]; the circuit-QED implementations [11, 12] resolve individual rungs of the ladder spectroscopically. Papers — and a depressing number of review introductions — that cite the observation of a vacuum-Rabi doublet as \"evidence of cavity QED in the quantum regime\" are reporting strong coupling, not quantization. The Shore–Knight review [2] and Gerry–Knight [1] state the distinction plainly; modern strong-coupling claims in plasmonic and molecular cavities [38] frequently do not, and the question of whether a given doublet is \"really\" quantum is therefore harder to settle from a transmission spectrum alone than the literature usually admits."}, {"id": "landmark-experiments", "title": "From the Garching Maser to Circuit QED: Experimental Realizations", "markdown": "## From the Garching Maser to Circuit QED: Experimental Realizations\n\nFor its first twenty-four years the Jaynes–Cummings model was a paper Hamiltonian. The reasons are dimensional. To realize $H_{\\rm JC}$ one needs a single atom interacting with a single quantized mode at a coupling $g$ large enough that the vacuum Rabi period $\\pi/g$ is shorter than every loss timescale — cavity damping $\\kappa^{-1}$, atomic dephasing $\\gamma_\\perp^{-1}$, and the atom's transit time $T_{\\rm transit}$ through the mode. In the optical domain with ordinary atoms the dipole matrix element is too small and the mode volume too large; one is unavoidably in weak coupling, where the model collapses to Purcell-enhanced exponential decay and the dressed ladder is invisible. Three experimental routes broke this impasse, in this order: Rydberg atoms in microwave cavities (Garching and ENS), then superconducting circuits coupled to coplanar resonators. Each tested a different feature of the JCM, and the popular accounts conflate what was tested with the model itself.\n\n### Garching 1987: the revival, not the ladder\n\nThe Munich one-atom maser of Meschede, Walther and Müller (1985) used velocity-selected $^{85}$Rb atoms prepared in a circular Rydberg state with principal quantum numbers around $n\\!\\sim\\!63$, traversing a superconducting niobium cavity tuned to the $63p_{3/2}\\!\\to\\!61d_{5/2}$ transition at $21.5\\,$GHz and cooled to $\\sim\\!0.5\\,$K so that the thermal photon number $\\bar n_{\\rm th}$ was of order unity. The decisive parameter was the cavity $Q\\sim 3\\times 10^{10}$, giving a photon lifetime of order $0.2\\,$s — much longer than the $50$–$100\\,\\mu$s transit time, so the field memory survived from one atom to the next and the steady-state field could build up in a Fock-like distribution. Velocity selection (Fizeau wheel) fixed the interaction time $t_{\\rm int}$ to a few percent, which is what made the experiment a spectrometer in the time domain rather than a thermal averager.\n\nRempe, Walther and Klein [6] then varied $t_{\\rm int}$ and measured the inversion $\\langle\\sigma_z\\rangle(t_{\\rm int})$ at the cavity exit by state-selective field ionization. They observed the Cummings collapse near $t_c\\sim 1/g$ followed by a partial revival near $t_R\\sim 2\\pi\\sqrt{\\bar n}/g$. This is the signature pinned on the JCM in every textbook. It is worth being precise about what was actually established: not the $\\sqrt n$ spectrum (the inversion is a Fourier sum over $\\sqrt n$ frequencies, but no individual line was resolved), and not the dressed states (no spectroscopy was performed), but the *discreteness* of the photon-number distribution. As emphasised by Eberly–Narozhny–Sanchez-Mondragon [14, 15] and re-explained by Knight–Radmore [20], the collapse alone is reproduced by any sufficiently broad classical distribution of Rabi frequencies; only the recurrence at $t_R$ is a signature of integer photon counting. Garching saw a clean recurrence and, with it, the first direct fingerprint of field quantization in a JCM regime.\n\n### ENS 1996: the $\\sqrt n$ ladder, properly resolved\n\nThe parallel programme of Haroche, Raimond and Brune at the ENS used a higher-finesse open Fabry–Pérot superconducting cavity at $51\\,$GHz and a more flexible Ramsey-interferometric readout: the atom traversed two low-Q classical microwave zones flanking the high-Q quantum cavity, and the relative phase of the Rydberg superposition was mapped onto a population difference. The result was the ability to do *spectroscopy* on the dressed ladder rather than time-domain inversion alone.\n\nBrune et al. 1996 [10] prepared coherent and number states in the cavity and resolved the individual Rabi frequencies $\\Omega_n = 2g\\sqrt{n+1}$ for $n=0,1,2$ by Fourier transforming $\\langle\\sigma_z\\rangle(t)$. The peaks at $g\\sqrt{1},g\\sqrt{2},g\\sqrt{3}$ — incommensurate, as the JCM uniquely demands — are the signature that distinguishes the anharmonic JC ladder from any harmonic-oscillator or semiclassical-strong-coupling model that reproduces vacuum-Rabi splitting at the linear-response level. The vacuum Rabi splitting itself is *not* a JCM-only prediction (two coupled classical oscillators give the same doublet), a point that the credit audit in §5 belabours; what the ENS experiment uniquely tested is the incommensurate $\\sqrt n$ scaling. The same group later used the dispersive limit of the JCM to demonstrate quantum non-demolition photon counting (Gleyzes, Guerlin, Haroche et al. 2007; verify) — arguably the most direct realisation of the JCM dispersive Hamiltonian $\\chi\\,a^\\dagger a\\,\\sigma_z$.\n\nThe textbook attribution of \"first observation of JCM collapse-revival\" to Rempe–Walther–Klein is correct on date and on phenomenon. The textbook habit of stopping there and ignoring the ENS programme, which produced quantitatively sharper tests of the model's distinctively quantum predictions, is the under-credit flagged in the neglected-figures list. Haroche's 2012 Nobel lecture is explicit about this division of labour.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eThree experimental platforms and what each tested\u003c/title\u003e\u003cline x1=\"40\" y1=\"360\" x2=\"690\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"40\" y1=\"355\" x2=\"40\" y2=\"365\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"220\" y1=\"355\" x2=\"220\" y2=\"365\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"400\" y1=\"355\" x2=\"400\" y2=\"365\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"580\" y1=\"355\" x2=\"580\" y2=\"365\" stroke=\"#e8e6e1\"/\u003e\u003ctext x=\"40\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1963\u003c/text\u003e\u003ctext x=\"220\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1987\u003c/text\u003e\u003ctext x=\"400\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e1996\u003c/text\u003e\u003ctext x=\"580\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e2004\u003c/text\u003e\u003ctext x=\"40\" y=\"345\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eJC paper\u003c/text\u003e\u003crect x=\"150\" y=\"40\" width=\"160\" height=\"280\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"230\" y=\"30\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eGarching one-atom maser\u003c/text\u003e\u003ctext x=\"230\" y=\"65\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eRb Rydberg n~63\u003c/text\u003e\u003ctext x=\"230\" y=\"85\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e21.5 GHz, Q~3e10\u003c/text\u003e\u003ctext x=\"230\" y=\"105\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eg/2π ~ 10 kHz\u003c/text\u003e\u003ctext x=\"230\" y=\"135\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003etested:\u003c/text\u003e\u003ctext x=\"230\" y=\"155\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003ecollapse + revival\u003c/text\u003e\u003ctext x=\"230\" y=\"175\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003e(photon discreteness)\u003c/text\u003e\u003ctext x=\"230\" y=\"215\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003etime-domain inversion\u003c/text\u003e\u003ctext x=\"230\" y=\"235\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eno ladder resolved\u003c/text\u003e\u003crect x=\"330\" y=\"40\" width=\"160\" height=\"280\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"410\" y=\"30\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003eENS Rydberg cavity\u003c/text\u003e\u003ctext x=\"410\" y=\"65\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eRb circular n=51\u003c/text\u003e\u003ctext x=\"410\" y=\"85\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e51 GHz Fabry-Perot\u003c/text\u003e\u003ctext x=\"410\" y=\"105\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eg/2π ~ 50 kHz\u003c/text\u003e\u003ctext x=\"410\" y=\"135\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003etested:\u003c/text\u003e\u003ctext x=\"410\" y=\"155\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003e√n ladder spacings\u003c/text\u003e\u003ctext x=\"410\" y=\"175\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003e(Brune 1996)\u003c/text\u003e\u003ctext x=\"410\" y=\"215\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eRamsey spectroscopy\u003c/text\u003e\u003ctext x=\"410\" y=\"235\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003elater: QND photons\u003c/text\u003e\u003crect x=\"510\" y=\"40\" width=\"160\" height=\"280\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"590\" y=\"30\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003eCircuit QED\u003c/text\u003e\u003ctext x=\"590\" y=\"65\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003etransmon / Cooper-pair\u003c/text\u003e\u003ctext x=\"590\" y=\"85\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e6 GHz CPW, Q~1e4-1e6\u003c/text\u003e\u003ctext x=\"590\" y=\"105\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eg/2π ~ 5-300 MHz\u003c/text\u003e\u003ctext x=\"590\" y=\"135\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003etested:\u003c/text\u003e\u003ctext x=\"590\" y=\"155\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003edispersive shift χ\u003c/text\u003e\u003ctext x=\"590\" y=\"175\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003evacuum Rabi splitting\u003c/text\u003e\u003ctext x=\"590\" y=\"215\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003etransmission spectroscopy\u003c/text\u003e\u003ctext x=\"590\" y=\"235\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003estrong → ultrastrong\u003c/text\u003e\u003c/svg\u003e\n*Figure: The three platforms that converted the JCM from paper to apparatus, with the distinctively quantum prediction each one isolated. Note the four-orders-of-magnitude jump in $g$ from cavity QED to circuit QED.*\n\n### Circuit QED 2004: a different regime, dispersively read out\n\nThe Yale port [11] replaced the Rydberg atom with a Cooper-pair-box qubit and the superconducting microwave cavity with a coplanar-waveguide resonator on the same chip. The relevant parameters changed by orders of magnitude: $g/2\\pi$ went from $\\sim\\!50\\,$kHz (ENS) to $\\sim\\!17\\,$MHz (Wallraff et al.), with $\\omega/2\\pi\\sim 6\\,$GHz, so the dimensionless coupling $g/\\omega\\sim 10^{-3}$ landed comfortably in the strong-coupling JCM regime while remaining far from any RWA failure. What made the experiment a circuit-QED rather than cavity-QED experiment is the fixed geometry: the artificial atom does not transit, it sits at a known field antinode for the duration of the cryostat run, and the coupling is engineered from the circuit Lagrangian rather than measured from a dipole matrix element.\n\nWallraff et al. did not directly observe collapse-revival or resolve the $\\sqrt n$ ladder; they did two things. First, they saw vacuum Rabi splitting in transmission — the avoided crossing of bare cavity and bare qubit lines as the qubit was tuned through resonance — which, as already noted, is not a JCM-exclusive prediction. Second, and crucially for the field, they operated in the dispersive limit $|\\Delta|=|\\omega-\\Omega|\\gg g$ and used the JCM-derived dispersive Hamiltonian\n$$H_{\\rm disp} \\;\\approx\\; \\omega a^\\dagger a + \\tfrac{1}{2}\\Omega\\sigma_z + \\chi\\,a^\\dagger a\\,\\sigma_z,\\qquad \\chi = g^2/\\Delta,$$\nto read out the qubit state through the qubit-dependent cavity pull $\\pm\\chi$. The dispersive readout is the JCM result that has done the most economic and scientific work in the last twenty years; every superconducting quantum processor in operation today reads its qubits this way. Fink et al. [12] subsequently resolved the JCM $\\sqrt n$ ladder transitions in circuit QED by climbing the dressed states with multi-photon spectroscopy, finally closing the loop with the ENS $\\sqrt n$ measurement of 1996 — but on a chip. By 2010 the same platform had pushed $g/\\omega$ above $0.1$ into the ultrastrong regime [31, 32], where the JCM itself ceases to apply and one must restore the counter-rotating terms — the subject of §7."}, {"id": "frontier-and-open-problems", "title": "Current Frontier: Ultrastrong Coupling, Driven-Dissipative Phases, and Quantum Simulation", "markdown": "## Current Frontier: Ultrastrong Coupling, Driven-Dissipative Phases, and Quantum Simulation\n\nAfter six decades, the Jaynes–Cummings model is no longer where the action is — but the action is being conducted almost entirely against it, either as a regime to escape, a baseline to refute, or a soluble corner of a larger non-integrable landscape. The live questions in 2026 cluster into four areas: nonperturbative coupling that voids the RWA, dissipative phase structure under coherent drive, the diaspora of JC physics across non-photonic platforms, and the unfinished integrability story of the parent quantum Rabi model.\n\n### Deep-strong coupling and the virtual-photon vacuum\n\nThe conventional regime ordering is now well-stratified by $\\eta \\equiv g/\\omega$: strong coupling at $\\eta \\lesssim 10^{-2}$, ultrastrong (USC) at $0.1 \\lesssim \\eta \u003c 1$, deep-strong (DSC) at $\\eta \\gtrsim 1$. The JCM is reliable only in the first regime; the second and third demand the full quantum Rabi Hamiltonian. The first unambiguous USC observation was Niemczyk *et al.* in flux-qubit circuit QED with $\\eta \\approx 0.12$ [31], paired with Forn-Díaz's measurement of the Bloch–Siegert shift — itself a leading correction in $\\eta^2$ that JCM erases by construction [32]. Subsequent flux-qubit/LC-resonator hybrids have pushed into DSC with $\\eta \u003e 1$, and magnetoplasmon mode-multiplexing has reached coupling fractions comparable to the bare matter resonance ([Baydin et al. 2024](https://www.nature.com/articles/s41467-024-46038-9)).\n\nThe conceptual cost is that the ground state $|G\\rangle$ of $H_{\\rm Rabi}$ ceases to be the bare vacuum $|0,g\\rangle$. In the polaron frame, the dressed ground state contains a finite density of virtual photons,\n$$\\langle G | a^\\dagger a | G\\rangle \\;\\sim\\; \\eta^2 + \\mathcal O(\\eta^4),$$\nwhich carry no radiation flux out of the cavity but renormalize every observable. JCM predicts $\\langle a^\\dagger a\\rangle_{|G\\rangle} = 0$ exactly; this is the single sharpest failure mode and the cleanest experimental discriminator. De Bernardis, Mercurio, and De Liberato pose the question explicitly — \"is the JCM still relevant?\" — and conclude that it remains a legitimate effective theory wherever $\\eta \\ll 1$ and gauge-fixing is handled carefully, but is structurally inadequate once one wants ground-state physics, non-adiabatic switching, or material truncation past the lowest two levels [33]. Knight, Gerry, Birrittella, and Alsing make the complementary case from the optical side, arguing the model retains diagnostic value for any system where the rotating-wave structure can be reimposed by drive engineering [4].\n\nA subtlety the literature is still digesting: writing $H_{\\rm Rabi}$ in Coulomb (minimal coupling, $\\propto \\mathbf{A}\\cdot\\mathbf{p}$) versus dipole (Power–Zienau, $\\propto \\mathbf{E}\\cdot\\mathbf{d}$) gauges gives *different* spectra once the matter Hilbert space is truncated to two levels. The truncation breaks gauge invariance; the JCM inherits this pathology silently. Several USC predictions published between 2015 and 2020 were quietly corrected once the gauge issue was clarified ([Di Stefano et al. 2019](https://www.nature.com/articles/s41567-019-0534-4)), and any 2020s paper that claims an USC observable without specifying its truncation scheme should be treated as RWA-laundered.\n\n### Driven-dissipative JCM and the breakdown of blockade\n\nAdd a coherent drive $\\eta_d(a e^{i\\omega_d t} + {\\rm h.c.})$ and Lindbladians $\\kappa\\mathcal D[a]$, $\\gamma\\mathcal D[\\sigma_-]$, and the JCM becomes a nontrivial open system whose steady state can change discontinuously. The textbook phenomenon is photon blockade: the $\\sqrt{n}$ anharmonicity of the JC ladder makes the $|1\\rangle \\to |2\\rangle$ transition off-resonant with the $|0\\rangle \\to |1\\rangle$ transition by $g(\\sqrt{2}-1)$, suppressing two-photon absorption. As $\\eta_d$ grows, the blockade collapses through a first-order dissipative phase transition with a critical endpoint of Ising universality, as worked out by Carmichael ([PRX 5, 031028](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.5.031028)); the critical scaling has since been verified in transmon-resonator devices ([Fink et al. 2017](https://arxiv.org/abs/1803.05352)). The 2026 work of Chen *et al.* on geometric criticality in the driven JCM extends this by giving the order-parameter manifold a Berry-phase structure tied to the drive's quadrature [30], and Bocanegra *et al.* offer a Lewis–Riesenfeld invariant approach that constructs exact dynamical solutions in the resonant driven regime [28]. Ermann *et al.* show that monochromatic driving alone produces a chaotic-resonance structure in the Floquet spectrum without invoking dissipation [29], a regime where the RWA is itself the source of the integrability that makes \"transition to chaos\" claims meaningful at all.\n\nCoupled-cavity JCM lattices remain the canonical proposal for a photonic Mott–superfluid transition (Greentree–Hartmann–Brandão–Plenio circa 2006; not in the supplied corpus). Experimental progress has been slow because circuit-QED lattices struggle to combine on-site $g$, intersite hopping $J$, and loss $\\kappa$ in the right ratio; the only clean dissipative-phase signatures so far live in 1D chains of $\\sim 10$ sites. A modified-JCM phase-transition analysis by Alexanian [26] and a related supersymmetric treatment of dissipative Bose–Fermi systems by Coane and Iachello [25] are recent attempts to put the open-system phase structure on a more controlled footing.\n\n### JC physics beyond cavity QED\n\nThe JCM has migrated almost everywhere a two-level system meets a harmonic mode. Trapped ions realize $H_{\\rm JC}$ as the resolved-sideband limit: an electronic qubit driven on its red motional sideband within the Lamb–Dicke regime $\\eta_{\\rm LD} \\ll 1$ couples to a single phonon with effective strength $g_{\\rm eff} = \\eta_{\\rm LD}\\Omega/2$, and Zeng *et al.* extended this to two ions sharing a motional mode — a phononic Tavis–Cummings system [39]. Optomechanics in the red-detuned linearized limit gives a beam-splitter Hamiltonian whose excitation-conserving structure is JCM-like, though the matter side is itself bosonic (a quadratic JCM cousin rather than the genuine two-level article). Cavity magnonics has reached strong and ultrastrong photon–magnon coupling routinely, but reaching the *single-magnon* JCM regime — where the magnon Kerr nonlinearity dominates — was achieved only by hybridizing a YIG sphere with a superconducting qubit ([Lachance-Quirion et al. 2020](https://www.science.org/doi/10.1126/science.aaz9236)). Plasmonic picocavities push the effective $g/\\omega$ to $\\sim 0.1$ at room temperature for single dye molecules [38], though here the validity of any single-mode treatment — let alone JCM — is itself contested.\n\n### Integrability beyond Braak\n\nBraak's 2011 demonstration that the standard Rabi model is quasi-exactly solvable rests on a $\\mathbb Z_2$ parity symmetry generated by $\\Pi = -\\sigma_z(-1)^{a^\\dagger a}$, with the spectrum encoded in the zeros of his transcendental $G$-function [9]. The natural follow-up programme — *what survives when the symmetry is broken?* — is incomplete. Adding a bias term $\\epsilon\\sigma_x$ breaks $\\mathbb Z_2$ in general but restores integrability at half-integer $\\epsilon/\\omega$ via a hidden symmetry whose algebraic origin (constraint polynomials of the Heun confluent equation) is still being worked out ([Li et al. 2021](https://arxiv.org/abs/1712.04152)). The anisotropic Rabi model, with independent rotating and counter-rotating couplings $g_\\pm$, retains $\\mathbb Z_2$ and admits an analogous $G$-function but acquires an additional $U(1)$ symmetry exactly at $g_- = 0$ — the JCM limit. Recent superconducting realizations of programmable anisotropic Rabi simulators [35, 36] and proposals to exploit the asymmetric branch as a noise-biased qubit [34] make the symmetry classification of physical, not merely formal, interest. On the collective side, the Schwinger-boson \"accidental symmetry\" of Tavis–Cummings exposed by Deliyannis and Marvian [24] underwrites a global-control protocol [23] that has no JCM analogue — a reminder that single-atom and many-atom integrability structures should never be lumped together.\n\n### What the 2020s literature is silently assuming\n\nThree RWA-laden claims circulate widely and deserve flagging. First, \"JCM ground-state entanglement\" is meaningful only when $\\eta \u003c 0.1$; in USC papers the entanglement frequently reported is a polaron artefact of the truncated dipole-gauge Hamiltonian. Second, claims of \"forbidden-transition driving\" in artificial atoms [40] sometimes rely on RWA selection rules that the same papers are nominally violating; the consistent treatment requires the Rabi model with explicit gauge choice. Third, anomalous Autler–Townes splittings reported under bright squeezed-vacuum drive [41] are JCM-like only at the lowest order in the squeezing parameter — the counter-rotating contribution of a broadband squeezed reservoir generically dresses the bare states in ways the JC dressing cannot reproduce. Where a paper writes $H_{\\rm JC}$ but means $H_{\\rm Rabi}$, the conclusions usually survive; where it writes $H_{\\rm JC}$ and means it, the regime of validity is rarely stated. The model's continued utility is best understood as the limit one perturbs around, not the territory one lives in."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nAfter six decades, the Jaynes–Cummings model occupies an awkward dual status: it is simultaneously the most pedagogically over-rehearsed Hamiltonian in quantum optics and the most quietly misused. Let me state where I stand.\n\n### (a) What I will defend\n\nThe $\\sqrt{n}$ ladder is real, and it is the only feature of the JCM I would still call a *prediction* in the strong sense. Everything else the model is famous for — vacuum Rabi splitting, collapse, even revival's envelope — has a classical or semiclassical shadow. The discreteness of the anharmonic ladder, resolved spectroscopically by Brune *et al.* in 1996 and routinely now in transmon–resonator dispersive readout, is the irreducibly quantum content. I will also defend the historiographical claim made above: Cummings did the algebra, Jaynes supplied the polemic, and Paul deserves co-naming. The German convention \"Jaynes–Cummings–Paul\" is correct and the Anglophone elision of Paul is a citation accident, not a judgment.\n\nI will defend, second, the structural claim that the JCM is *not* a model of spontaneous emission and never was. The 1963 paper used the single-mode Hamiltonian as a *counterexample* — to argue that quantization alone produced oscillations, not Wigner–Weisskopf exponentials — and the field has spent fifty years quietly inverting the moral.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely smuggled past the reader:\n\n1. **The RWA itself.** At $g/\\omega \\gtrsim 10^{-2}$ the counter-rotating terms shift the ground state into a squeezed-vacuum admixture; ultrastrong-coupling circuit-QED is now squarely in this regime. Papers that report \"JC dynamics\" at $g/\\omega \\sim 0.1$ are reporting Rabi dynamics with a JC label.\n2. **The two-level approximation.** For transmons, the third level sits only $\\sim 200\\text{–}300$ MHz below the second; the \"JC ladder\" measured dispersively is a *projected* slice of a Duffing–oscillator ladder, and the $\\sqrt{n}$ scaling acquires anharmonic corrections that are usually absorbed into a fitted $g$.\n3. **Single-mode purity.** Real cavities and resonators have mode combs whose tails contribute at the few-percent level to the dispersive shift; the celebrated agreement between JCM and circuit-QED is partly a fit, not a parameter-free prediction.\n\nThe collapse-and-revival story is shakier still: the collapse envelope is reproduced by any sufficiently broad classical Rabi-frequency distribution, and the cleanest experimental \"revival\" signatures sit at the edge of the decoherence floor. Calling collapse a quantum signature, as introductory texts do, is wrong; only the revival's discreteness is.\n\n### (c) Three open questions I would work on\n\n1. **Exact spectrum of the dissipative quantum Rabi model at deep-strong coupling.** Braak solved the closed system; the Lindbladian version remains open and is where ultrastrong-coupling experiments actually live.\n2. **A clean experimental separation of the revival from inhomogeneous-broadening mimics.** A definitive *photon-number-resolved* revival, not a coherent-state envelope, would settle a forty-year ambiguity.\n3. **The thermodynamic crossover from JCM to Tavis–Cummings as $N$ grows in a single cavity with realistic atom–atom disorder.** The Dicke superradiant phase transition is famously fragile under $A^2$ and disorder; the route between $N=1$ and $N\\to\\infty$ is poorly mapped.\n\n### (d) Reading path\n\n1. Cummings, *Phys. Rev.* **140**, A1051 (1965) — the single-author paper where the algebra and the revival are already implicit; read this *before* the 1963 letter.\n2. Jaynes \u0026 Cummings, *Proc. IEEE* **51**, 89 (1963) — read second, with the polemical context in mind.\n3. Paul, *Ann. Phys. (Leipzig)* **466**, 411 (1963) — the independent derivation that justifies the third name.\n4. Eberly, Narozhny \u0026 Sanchez-Mondragon, *Phys. Rev. Lett.* **44**, 1323 (1980) — the revival prediction stated cleanly, with the classical-mixture caveat in the text itself.\n5. Shore \u0026 Knight, *J. Mod. Opt.* **40**, 1195 (1993) — the only review that gets the assumptions, the conflations, and the credit roughly right; read last as a corrective.\n\nEverything after Shore–Knight is engineering; everything before Cummings 1965 is prehistory."}], "references": [{"n": 1, "title": "Introductory Quantum Optics", "authors": ["Christopher C. Gerry", "P. L. Knight"], "year": 2004, "venue": "Cambridge University Press eBooks", "url": "https://doi.org/10.1017/cbo9780511791239", "cited_by": 1636, "bucket": "canon"}, {"n": 2, "title": "The Jaynes-Cummings Model", "authors": ["Bruce W. Shore", "P. L. Knight"], "year": 1993, "venue": "Journal of Modern Optics", "url": "https://doi.org/10.1080/09500349314551321", "cited_by": 1363, "bucket": "canon"}, {"n": 3, "title": "Stimulated Emission of Radiation in a Single Mode", "authors": ["F. W. Cummings"], "year": 1965, "venue": "Physical Review 140, A1051", "url": "https://doi.org/10.1103/PhysRev.140.A1051", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "The enduring relevance of the Jaynes-Cummings model: a personal perspective", "authors": ["P. L. Knight", "C. C. Gerry", "R. J. Birrittella", "P. M. Alsing"], "year": 2024, "venue": "arXiv", "url": "http://arxiv.org/abs/2405.00137v1", "cited_by": null, "bucket": "arXiv"}, {"n": 5, "title": "Comparison of quantum and semiclassical radiation theories with application to the beam maser", "authors": ["E. T. Jaynes", "F. W. Cummings"], "year": 1963, "venue": "Proceedings of the IEEE 51, 89", "url": "https://doi.org/10.1109/PROC.1963.1664", "cited_by": null,
