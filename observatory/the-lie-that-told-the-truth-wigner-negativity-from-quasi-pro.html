(Ann Moyal's biography reproduces the correspondence). The standard label 'Moyal bracket' should at minimum read 'Groenewold–Moyal'. (iii) Hudson's 1974 theorem is correctly attributed but routinely over-quoted: it covers pure states only. Bröcker–Werner (1995) showed there exist non-Gaussian mixed states with W ≥ 0, and Mandilara–Karpov–Cerf (2009) constructed explicit examples. Modern claims that 'a Wigner-positive state is Gaussian' are simply wrong in the mixed-state regime where most experiments actually live. (iv) On the resource-theory side, Spekkens 2008 (negativity ≡ contextuality) and Gross 2006 (discrete-Wigner Clifford covariance) are the load-bearing results behind Howard et al. 2014; the popular 'magic = negativity' headline collapses three theorems into a slogan.", "timeline": [{"year": 1927, "event": "Weyl symmetric quantization rule fixes the operator↔phase-space-symbol correspondence that underlies W", "who": "Hermann Weyl", "work": "Zeitschrift für Physik 46, 1 — 'Quantenmechanik und Gruppentheorie'", "kind": "formalization", "ref": null}, {"year": 1932, "event": "Introduction of the Wigner quasi-distribution; explicit remark that it can be negative; footnote credit to Szilard", "who": "Eugene P. Wigner", "work": "Physical Review 40, 749 — 'On the quantum correction for thermodynamic equilibrium'", "kind": "formalization", "ref": null}, {"year": 1946, "event": "Star product and the algebraic structure of phase-space quantum mechanics; first rigorous derivation that Wigner's W is the unique 'reasonable' phase-space symbol", "who": "Hilbrand J. Groenewold", "work": "Physica 12, 405 — 'On the principles of elementary quantum mechanics' (Utrecht PhD thesis)", "kind": "formalization", "ref": null}, {"year": 1949, "event": "Quantum mechanics rephrased as a statistical theory on phase space; Moyal bracket; correspondence with Dirac on whether such a formulation was admissible", "who": "José Enrique Moyal", "work": "Proc. Cambridge Phil. Soc. 45, 99", "kind": "formalization", "ref": null}, {"year": 1969, "event": "s-ordered family of quasi-distributions (P, W, Q as s = +1, 0, −1) — places Wigner negativity on a continuum with Glauber–Sudarshan P-negativity and Husimi non-negativity", "who": "Kenneth E. Cahill, Roy J. Glauber", "work": "Physical Review 177, 1857 \u0026 1882", "kind": "theory", "ref": null}, {"year": 1974, "event": "Hudson's theorem: a pure state has W ≥ 0 iff its wavefunction is Gaussian — turns negativity into a sharp witness of non-Gaussian non-classicality for pure states", "who": "Robin L. Hudson", "work": "Reports on Mathematical Physics 6, 249", "kind": "theory", "ref": null}, {"year": 1983, "event": "Soto–Claverie extension of Hudson's theorem to multimode (n-dimensional) pure states", "who": "F. Soto, Pierre Claverie", "work": "Journal of Mathematical Physics 24, 97", "kind": "theory", "ref": null}, {"year": 1984, "event": "Hillery–O'Connell–Scully–Wigner 'Distribution functions in physics: Fundamentals' — the review that canonised the W-function for the quantum-optics community", "who": "M. Hillery, R. F. O'Connell, M. O. Scully, E. P. Wigner", "work": "Physics Reports 106, 121", "kind": "theory", "ref": null}, {"year": 1987, "event": "Discrete-phase-space Wigner function for finite-dimensional systems — opens the door to negativity as a stabilizer/qudit resource", "who": "William K. Wootters", "work": "Annals of Physics 176, 1", "kind": "formalization", "ref": null}, {"year": 1993, "event": "First experimental tomographic reconstruction of an optical W-function (squeezed vacuum) by balanced homodyne — negativity becomes laboratory-measurable in principle", "who": "D. T. Smithey, M. Beck, M. G. Raymer, A. Faridani", "work": "Physical Review Letters 70, 1244", "kind": "observation", "ref": null}, {"year": 1995, "event": "Bröcker–Werner: for mixed states there exist non-Gaussian density operators with W ≥ 0 — Hudson's theorem does NOT extend; mixed-state negativity is sufficient but not necessary for non-classicality", "who": "T. Bröcker, R. F. Werner", "work": "Journal of Mathematical Physics 36, 62", "kind": "theory", "ref": null}, {"year": 2001, "event": "Direct observation of a negative dip at the phase-space origin for a heralded single photon — the textbook image of Wigner negativity", "who": "A. I. Lvovsky, H. Hansen, T. Aichele, O. Benson, J. Mlynek, S. Schiller", "work": "Physical Review Letters 87, 050402", "kind": "observation", "ref": null}, {"year": 2004, "event": "Kenfack–Życzkowski quantitative measure ∫|W|−1: 'negativity' as a scalar nonclassicality indicator", "who": "A. Kenfack, K. Życzkowski", "work": "Journal of Optics B 6, 396", "kind": "theory", "ref": null}, {"year": 2008, "event": "Spekkens proves that negativity in any quasi-probability representation is equivalent to generalised contextuality — reframes Wigner negativity as a foundational, not merely optical, resource", "who": "Robert W. Spekkens", "work": "Physical Review Letters 101, 020401", "kind": "theory", "ref": null}, {"year": 2012, "event": "Mari–Eisert: positive-W continuous-variable circuits with Gaussian measurements are classically efficiently simulable — negativity is necessary for quantum computational speed-up (CV setting)", "who": "A. Mari, J. Eisert", "work": "Physical Review Letters 109, 230503", "kind": "revival", "ref": null}, {"year": 2014, "event": "Howard–Wallman–Veitch–Emerson: contextuality (≡ discrete-Wigner negativity, via Gross 2006) is the resource powering magic-state distillation for qudit fault tolerance", "who": "M. Howard, J. Wallman, V. Veitch, J. Emerson", "work": "Nature 510, 351", "kind": "revival", "ref": null}], "neglected": [{"name": "Leo Szilard", "role": "Wigner's 1932 paper carries a footnote crediting Szilard with suggesting the basic form of the distribution; Szilard never published on it and is almost universally omitted from the attribution chain", "evidence": "Footnote 1 of Wigner, Phys. Rev. 40, 749 (1932); reaffirmed in Wigner's later review chapter in 'Perspectives in Quantum Theory' (Yourgrau \u0026 van der Merwe eds., MIT Press 1971) (verify)", "ref": null}, {"name": "Hilbrand J. Groenewold", "role": "His 1946 Utrecht thesis derived the star product, proved the no-go theorem (Groenewold–van Hove) against full Dirac quantization, and gave the first axiomatic justification that Wigner's W is the correct symbol — almost always cited via Moyal", "evidence": "Groenewold, Physica 12, 405 (1946); historical reconstruction in Curtright–Zachos, 'Quantum Mechanics in Phase Space' (World Scientific 2005)", "ref": null}, {"name": "José Enrique Moyal", "role": "Dirac initially rejected Moyal's phase-space program as wrong; the Bohr–Dirac–Moyal correspondence (preserved by Ann Moyal) shows priority-and-acceptance disputes that the textbook 'Moyal bracket' label hides", "evidence": "Ann Moyal, 'Maverick Mathematician: The Life and Science of J. E. Moyal' (ANU Press 2006); reprinted Dirac–Moyal letters therein", "ref": null}, {"name": "Hip Groenewold's no-go (Groenewold–van Hove)", "role": "The theorem that no quantization map can be simultaneously linear, send Poisson to commutator, and be irreducible — quietly underwrites why one must accept negative quasi-probabilities at all", "evidence": "Groenewold 1946; L. van Hove, Mém. Acad. Roy. Belgique 26 (1951) (verify)", "ref": null}, {"name": "K. E. Cahill \u0026 R. J. Glauber", "role": "Provided the s-ordered framework that subsumes Wigner negativity inside the broader Glauber–Sudarshan nonclassicality program; routinely cited for coherent states but their parameterized-distribution papers are what make 'Wigner is the s = 0 case' precise", "evidence": "Phys. Rev. 177, 1857 and 1882 (1969)", "ref": null}], "conflations": [{"claim": "'Wigner negativity' as a universal witness of non-classicality", "clarification": "True for pure states (Hudson 1974) and for the Glauber sense of non-classical light. For mixed states it is sufficient but not necessary: there exist non-Gaussian, manifestly non-classical mixed states with W ≥ 0 everywhere (Bröcker–Werner 1995; Mandilara–Karpov–Cerf 2009)."}, {"claim": "'Wigner negativity' and 'logarithmic negativity'", "clarification": "Completely distinct objects. Logarithmic negativity (Vidal–Werner 2002; Plenio 2005) is an entanglement monotone built from the partial transpose of ρ; Wigner negativity is a single-mode phase-space property of one quantum state. The shared word 'negativity' has caused real confusion in CV-entanglement literature."}, {"claim": "'A reconstructed dip below zero proves the state is non-classical'", "clarification": "Tomographic reconstructions are convolved with detector inefficiency η. The measured object is W_s with s = −(1−η)/η; for η ≲ 1/2 this is the Husimi Q-function, which is non-negative for every state. The Gaussian convolution silently restores positivity, so 'observed' negativity is η-dependent and must be loss-corrected. Smoothing kernels in maximum-likelihood reconstruction can similarly hide or fake negativity."}, {"claim": "'Hudson's theorem characterises Gaussianity'", "clarification": "It characterises Gaussianity only for pure states. The mixed-state analogue is false; Mandilara, Karpov, Cerf (PRA 79, 062302, 2009) construct explicit non-Gaussian mixed states with non-negative W."}, {"claim": "'Wigner function' on a qudit and on a mode are 'the same object'", "clarification": "Continuous Wigner (R²ⁿ) and discrete Wigner (Z_d × Z_d, Wootters 1987 / Gibbons–Hoffman–Wootters 2004 / Gross 2006) share formal properties (marginals, covariance) but their negativity theorems differ. Gross's covariance theorem and the Howard et al. magic-state result are statements about the discrete W only; importing them to CV systems requires the Mari–Eisert / Veitch et al. machinery."}, {"claim": "'Negativity volume ∫|W|−1 is a bona fide resource monotone'", "clarification": "Kenfack–Życzkowski negativity is a useful scalar indicator but is not, by itself, a monotone under all free operations in any standard resource theory; the proper monotones (mana for discrete systems, Wigner logarithmic negativity in the sense of Albarelli–Genoni–Ferraro–Serafini 2018) are different functionals."}], "sections": [{"id": "why-this-mattered", "title": "Why This Mattered: From a Thermodynamic Footnote to a Resource", "markdown": "## Why This Mattered: From a Thermodynamic Footnote to a Resource\n\nWigner's 1932 paper was not advertised as a foundational manifesto. Its title — \"On the quantum correction for thermodynamic equilibrium\" [71] — telegraphs the actual motivation: a perturbative $\\hbar^2$-correction to the classical Boltzmann distribution for a gas of particles in a potential. The phase-space object\n\n$$W(q,p) \\;=\\; \\frac{1}{\\pi\\hbar}\\int dy\\; \\psi^{*}(q+y)\\,\\psi(q-y)\\,e^{2ipy/\\hbar}$$\n\nappears almost in passing, with the bland remark that it \"cannot be really interpreted as the simultaneous probability of coordinates and momenta\" because it takes negative values. Wigner notes the negativity, sets it aside, and proceeds to extract the leading ${\\cal O}(\\hbar^2)$ correction to the free energy in terms of $\\langle(\\nabla V)^2\\rangle$ and $\\langle\\nabla^{2}V\\rangle$. That is the whole paper. A footnote on the first page credits L. Szilárd with co-inventing the expression \"some years ago for another purpose\" ([fixquotes transcript](https://fixquotes.com/works/on-the-quantum-correction-for-thermodynamic/); ADS record of Wigner 1932). The footnote is reproduced in essentially no modern textbook, and the \"other purpose\" is nowhere identified. The functional form may well have been Szilárd's; the published derivation was Wigner's; the asymmetry of credit began on day one.\n\nThe pre-history was Weyl 1927, whose symmetric ordering rule $\\hat A = \\int d\\xi d\\eta\\,\\tilde a(\\xi,\\eta)\\, e^{i(\\xi\\hat q + \\eta\\hat p)}$ fixed the operator↔phase-space-symbol correspondence that makes Wigner's $W$ the symbol of $\\hat\\rho$. Without Weyl, the integral above is a clever Fourier transform; with Weyl, it is *the* canonical phase-space representative of $\\hat\\rho$ under the unique covariant rule. Weyl himself never wrote $W$ in this form; his *Gruppentheorie und Quantenmechanik* treats the symbol calculus as representation theory rather than statistics, and this emphasis delayed the recognition that he had supplied the missing piece.\n\nThe synthesis came from Utrecht. Hilbrand Groenewold's 1946 dissertation [72] performed three connected acts: it defined the $\\star$-product\n\n$$f\\star g \\;=\\; f\\,\\exp\\!\\Big[\\tfrac{i\\hbar}{2}\\big(\\overleftarrow{\\partial}_{q}\\overrightarrow{\\partial}_{p}-\\overleftarrow{\\partial}_{p}\\overrightarrow{\\partial}_{q}\\big)\\Big]\\,g,$$\n\nit proved a uniqueness theorem singling out the Weyl–Wigner symbol as the only \"reasonable\" map with the right covariance, and it stated the no-go theorem (now usually called Groenewold–van Hove) that no quantization can simultaneously be linear, send Poisson brackets to commutators, and act irreducibly on polynomials of degree $\\geq 3$. The last result is the load-bearing fact behind everything that follows: ordering ambiguity is unavoidable, so negativity of $W$ for generic $\\hat\\rho$ is forced by a theorem rather than a defect of taste. Moyal's 1949 paper [73] re-derived the bracket structure as a statistical theory and appeared after the now-famous Bohr–Dirac–Moyal correspondence (1944–46) in which Dirac dismissed the phase-space program as incoherent on uniqueness and rigour grounds. The conventional label \"Moyal bracket\" is convenient and historically wrong by three years; \"Groenewold–Moyal\" is the minimum honest attribution.\n\nCahill and Glauber's 1969 papers [74] absorbed Wigner's $W$ into the one-parameter family of $s$-ordered quasi-distributions $W_{s}$, with $s=+1$ the Glauber–Sudarshan $P$, $s=0$ the Wigner $W$, and $s=-1$ the Husimi $Q$. The reframing matters: negativity is a property of a *representation*, not of \"the\" quasi-distribution. Wigner's $W$ sits exactly on the boundary between the singular ($P$) and the unconditionally smooth-and-positive ($Q$), which is why it remains the most permissive representation that still resolves sub-Planckian phase-space features.\n\nHudson's 1974 theorem [75] is the moment $W$ becomes a sharp witness rather than a heuristic: a pure state has $W\\geq 0$ on all of phase space iff its wavefunction is Gaussian. Soto and Claverie [76] extended the result to multimode pure states. The slogan that follows — \"negativity = non-Gaussianity\" — is exactly correct for pure states and silently wrong for mixed states. Bröcker and Werner [78] constructed non-Gaussian density operators with $W\\geq 0$ everywhere, demonstrating that the mixed-state converse fails. Most experimental states live in the mixed-state regime; the textbook formulation is therefore the wrong one to quote in the lab.\n\nHillery, O'Connell, Scully, and Wigner's 1984 *Physics Reports* review [77] canonised the apparatus for quantum-optics readers: marginals, the overlap identity $\\operatorname{Tr}(\\hat\\rho_{1}\\hat\\rho_{2}) = 2\\pi\\hbar\\int W_{1}W_{2}\\,dq\\,dp$, the Moyal evolution equation, and the $s$-ordered translation between representations. Before that review the literature was scattered across mathematical physics, statistical mechanics, and signal processing; after it, \"Wigner function\" became a single shared object.\n\nThen the laboratory caught up. Smithey, Beck, Raymer, and Faridani's balanced-homodyne tomography of squeezed vacuum [79] turned $W$ into a measured object, reconstructed from quadrature histograms via the inverse Radon transform. Lvovsky and collaborators [80] subsequently photographed the central dip $W(0,0)\u003c0$ for a heralded single-photon Fock state — the canonical textbook image. The dip is not raw $W$ but a loss-corrected reconstruction; the $\\eta$-dependence of apparent negativity is a conflation to be untangled later.\n\nThe final pivot, three quarters of a century after Wigner, was from witness to *resource*. Mari and Eisert [81] proved that continuous-variable circuits with $W\\geq 0$ throughout — input, evolution, and measurement — are classically efficiently simulable, making Wigner negativity *necessary* for any CV quantum speed-up. Howard, Wallman, Veitch, and Emerson [82] tied the discrete analogue to generalised contextuality and to magic-state distillation: negativity of the discrete Wigner function is the resource powering fault tolerance on qudits. A footnote about the $\\hbar^2$ correction to a Boltzmann tail had, after eighty-two years, become the operational currency of quantum advantage."}, {"id": "the-physics-properly", "title": "The Physics, Properly: Weyl Symbol, Star Product, and the Origin of Negativity", "markdown": "## The Physics, Properly: Weyl Symbol, Star Product, and the Origin of Negativity\n\n### From Weyl's quantization to Wigner's symbol\n\nFix the kinematical arena: a single Cartesian degree of freedom with canonical operators $\\hat q,\\hat p$ obeying $[\\hat q,\\hat p]=i\\hbar$. **(A1)** the phase space is continuous $\\mathbb{R}^{2n}$; **(A6)** we restrict to finite-mode systems, so the Stone–von Neumann theorem fixes the representation up to unitary equivalence.\n\nWeyl's 1927 prescription assigns to every classical symbol $a(q,p)$ an operator through the symmetric exponential ([Weyl, *Zeitschrift für Physik* 46, 1, verify])\n\n$$\\hat A \\;=\\; \\frac{1}{(2\\pi)^2}\\!\\int\\! d\\sigma\\,d\\tau\\;\\tilde a(\\sigma,\\tau)\\,e^{\\,i(\\sigma\\hat q+\\tau\\hat p)},\\qquad \\tilde a(\\sigma,\\tau)=\\!\\int dq\\,dp\\,a(q,p)\\,e^{-i(\\sigma q+\\tau p)}.$$\n\nThe symbol $a$ corresponding to a given $\\hat A$ is the **Weyl symbol** $a=W[\\hat A]$. **(A2)** we use exactly this symmetric ordering; the Cahill–Glauber $s$-parameter is $s=0$ [74]. Other orderings (Wick $s=+1$, anti-Wick $s=-1$) generate the Glauber–Sudarshan $P$ and the Husimi $Q$; the negativity structure shifts accordingly.\n\nApplied to the density operator $\\hat\\rho$ and divided by $2\\pi\\hbar$ for the right marginals, the Weyl symbol is Wigner's distribution [71]:\n\n$$\\boxed{\\;W(q,p)\\;=\\;\\frac{1}{\\pi\\hbar}\\!\\int_{-\\infty}^{\\infty}\\! dy\\;\\langle q+y\\mid\\hat\\rho\\mid q-y\\rangle\\,e^{-2ipy/\\hbar}\\;}$$\n\nEquivalently $W=(2\\pi\\hbar)^{-1}\\mathrm{Tr}\\!\\left[\\hat\\rho\\,\\hat\\Pi(q,p)\\right]$ with $\\hat\\Pi(q,p)=\\hat D(q,p)\\,\\hat P\\,\\hat D^\\dagger(q,p)$ the displaced parity operator (Grossmann–Royer); this is the form behind every direct phase-space sampling experiment.\n\n### The five properties that pin $W$ down\n\n1. **Reality.** $W\\in\\mathbb{R}$ because $\\hat\\rho^\\dagger=\\hat\\rho$.\n2. **Normalization.** $\\int W\\,dq\\,dp=\\mathrm{Tr}\\hat\\rho=1$.\n3. **Correct marginals.** $\\int W\\,dp=\\langle q\\mid\\hat\\rho\\mid q\\rangle$, $\\int W\\,dq=\\langle p\\mid\\hat\\rho\\mid p\\rangle$.\n4. **Galilean covariance.** Translations and linear symplectic maps in $(q,p)$ commute with the Weyl transform.\n5. **Overlap (trace) formula.**\n$$\\mathrm{Tr}(\\hat\\rho_1\\hat\\rho_2)\\;=\\;2\\pi\\hbar\\!\\int W_1(q,p)\\,W_2(q,p)\\,dq\\,dp.$$\n\nProperty 5 is the one that **forces negativity**. Set $\\hat\\rho_1=|\\psi\\rangle\\langle\\psi|$, $\\hat\\rho_2=|\\phi\\rangle\\langle\\phi|$ with $\\langle\\psi\\mid\\phi\\rangle=0$. Then $\\int W_\\psi W_\\phi=0$, yet $W_\\psi$ and $W_\\phi$ are individually bounded and nonzero. Two everywhere-nonnegative bounded functions cannot integrate to zero against each other; therefore **at least one** of $W_\\psi,W_\\phi$ must take negative values. Negativity is not pathology — it is the algebraic price of unitarily faithful representation of an inner product on a c-number phase space.\n\n### Star product, Moyal bracket, and the obstruction\n\nGroenewold's 1946 Utrecht thesis [72] supplied the algebraic skeleton: the operator product pulls back to a noncommutative ⋆-product of symbols,\n\n$$(a\\star b)(q,p)\\;=\\;a(q,p)\\,\\exp\\!\\left[\\frac{i\\hbar}{2}\\!\\left(\\overleftarrow{\\partial_q}\\overrightarrow{\\partial_p}-\\overleftarrow{\\partial_p}\\overrightarrow{\\partial_q}\\right)\\right]\\!b(q,p),$$\n\nand the commutator pulls back to the **Moyal bracket** $\\{a,b\\}_M=(a\\star b-b\\star a)/(i\\hbar)=\\{a,b\\}_{\\rm PB}+\\mathcal O(\\hbar^2)$, recovering the Poisson bracket only to leading order. The von Neumann equation becomes $\\partial_t W=\\{H,W\\}_M$ [73]. **(A5)** for Hamiltonians at most quadratic in $(q,p)$ the $\\mathcal O(\\hbar^2)$ terms vanish identically: Gaussian-free dynamics is classical Liouville flow on $W$, and Gaussian inputs remain Gaussian. This is precisely why squeezing, displacement, and beam-splitter networks preserve Wigner positivity.\n\nThe **Groenewold–van Hove obstruction** — proved in [72] and sharpened by van Hove (verify) — states that no linear map $Q:C^\\infty(\\mathbb{R}^{2n})\\to\\mathrm{Op}(\\mathcal H)$ can simultaneously (a) send Poisson brackets to $(i\\hbar)^{-1}$ commutators on all polynomials, (b) be irreducible, and (c) send $1\\mapsto\\mathbb 1$, $q\\mapsto\\hat q$, $p\\mapsto\\hat p$. Demanding Poisson→commutator beyond quadratic order fails at degree four. The phase-space picture survives this obstruction only by sacrificing **pointwise positivity** of the symbol: $W$ is the unique (up to ordering) representation that keeps marginals and overlaps at the cost of allowing $W\u003c0$. Negativity is, in a precise sense, what one buys to evade Groenewold–van Hove.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eQuantization map and the role of negativity\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"360\" y=\"28\" fill=\"#e8e6e1\" font-size=\"16\" text-anchor=\"middle\" font-family=\"serif\"\u003eQuantization: what can survive Groenewold–van Hove?\u003c/text\u003e\u003crect x=\"40\" y=\"70\" width=\"200\" height=\"80\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"140\" y=\"100\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eClassical algebra\u003c/text\u003e\u003ctext x=\"140\" y=\"120\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e$(C^\\infty(\\mathbb{R}^{2n}),\\{,\\}_{PB})$\u003c/text\u003e\u003ctext x=\"140\" y=\"140\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003epointwise positive ρ\u003c/text\u003e\u003crect x=\"480\" y=\"70\" width=\"200\" height=\"80\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"580\" y=\"100\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eOperator algebra\u003c/text\u003e\u003ctext x=\"580\" y=\"120\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e$(\\mathrm{Op}(\\mathcal H),[\\,,\\,]/i\\hbar)$\u003c/text\u003e\u003ctext x=\"580\" y=\"140\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e$\\hat\\rho\\succeq 0$, $\\mathrm{Tr}\\hat\\rho=1$\u003c/text\u003e\u003cpath d=\"M240 100 L480 100\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/\u003e\u003cpath d=\"M480 130 L240 130\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/\u003e\u003cdefs\u003e\u003cmarker id=\"a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7ee0a3\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"360\" y=\"92\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eWeyl: $a\\mapsto\\hat A$\u003c/text\u003e\u003ctext x=\"360\" y=\"148\" fill=\"#7ee0a3\" font-size=\"13\" text-anchor=\"middle\"\u003eWigner: $\\hat\\rho\\mapsto W$\u003c/text\u003e\u003crect x=\"240\" y=\"200\" width=\"240\" height=\"160\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"360\" y=\"225\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eMoyal–Groenewold\u003c/text\u003e\u003ctext x=\"360\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003estar algebra\u003c/text\u003e\u003ctext x=\"360\" y=\"270\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e$a\\star b = a\\,e^{(i\\hbar/2)\\overleftrightarrow{\\Lambda}}\\,b$\u003c/text\u003e\u003ctext x=\"360\" y=\"293\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003e$\\{a,b\\}_M = \\{a,b\\}_{PB}+O(\\hbar^2)$\u003c/text\u003e\u003ctext x=\"360\" y=\"320\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eG–vH no-go: cannot keep\u003c/text\u003e\u003ctext x=\"360\" y=\"338\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003ePB↔[,] beyond quadratics\u003c/text\u003e\u003ctext x=\"360\" y=\"356\" fill=\"#ff7a90\" font-size=\"13\" text-anchor=\"middle\"\u003eAND keep $W\\ge 0$\u003c/text\u003e\u003cpath d=\"M140 150 L300 200\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/\u003e\u003cpath d=\"M580 150 L420 200\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"40\" y=\"385\" fill=\"#e8e6e1\" font-size=\"12\"\u003ePrice paid by W: pointwise sign — recovered as marginals/overlaps faithful.\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The Weyl–Wigner map intertwines the classical and operator algebras through the Moyal star product. The Groenewold–van Hove obstruction forbids a fully faithful Poisson↔commutator correspondence; the phase-space representation survives only by surrendering pointwise positivity of $W$.*\n\n### Hudson, Soto–Claverie, and what \"non-Gaussian\" really witnesses\n\n**(A3)** Restrict to a pure state $|\\psi\\rangle$. Hudson's theorem [75] then asserts\n\n$$W_\\psi(q,p)\\ge 0\\;\\;\\forall\\,(q,p)\\quad\\Longleftrightarrow\\quad \\psi(q)=\\exp\\!\\bigl(-\\tfrac12 q^\\top\\!Aq+b^\\top q+c\\bigr),$$\n\nwith $\\mathrm{Re}\\,A$ positive definite — i.e. $|\\psi\\rangle$ is a Gaussian (coherent or squeezed) state. Soto–Claverie [76] extended this to $n$ modes on $\\mathbb{R}^{2n}$, closing the multimode pure-state case. The contrapositive is the slogan one actually wants: **for pure states, non-Gaussian ⇔ Wigner-negative somewhere.** Hillery–O'Connell–Scully–Wigner [77] consolidated the pure-state phase-space dictionary used by quantum optics ever since.\n\nThe hypothesis **(A3)** is load-bearing. Bröcker–Werner [78] proved that the analogue fails for mixed states: there exist non-Gaussian density operators with $W\\ge 0$ everywhere. Hudson positivity therefore characterises Gaussianity only on the boundary of the state space; in the interior, \"$W\\ge 0$\" is sufficient but not necessary for classicality, and the slogan \"Wigner-positive = Gaussian\" — still quoted in tutorials — is simply false off the pure-state stratum.\n\nFinally, **(A4)** every laboratory statement about negativity is mediated by a measurement. Tomographic reconstructions return not $W$ but the smoothed $s$-symbol with $s=-(1-\\eta)/\\eta$ set by detector efficiency [74][79][80]; for $\\eta\\le 1/2$ one is reading the Husimi $Q$, which is non-negative for every state. The Weyl symbol is the unique honest representative of $\\hat\\rho$, but only an idealization of detection lets us see its sign.\n\nThese six assumptions A1–A6 — continuous phase space, Weyl ordering, pure-state restriction, ideal measurement, Gaussian-free dynamics, finite-mode setting — are precisely the load-bearing hypotheses §3 will dismantle one at a time."}, {"id": "strict-conditions-failure-modes", "title": "Validity Domain: What Breaks When A1–A6 Are Violated", "markdown": "## Validity Domain: What Breaks When A1–A6 Are Violated\n\nSection 2 fixed the construction on six assumptions: A1 single Cartesian degree of freedom on $\\mathbb{R}^2$; A2 symmetric (Weyl, $s=0$) ordering; A3 pure state; A4 ideal homodyne ($\\eta=1$); A5 unitary evolution; A6 canonical CCR $[\\hat q,\\hat p]=i$. Each is load-bearing, and each fails in a different, characteristic way. Hudson's theorem, the s-ordered family, and Mari–Eisert simulability are best read as parallel responses to violating A3, A2, and A5 respectively.\n\n### A1, A6 — finite-dimensional Hilbert space (discrete Wigner)\n\nDrop canonical position–momentum and replace $\\mathbb{R}^2$ with $\\mathbb{Z}_d\\times\\mathbb{Z}_d$: Wootters (1987) built a Wigner function on the discrete torus from a complete set of phase-point operators $\\hat A(q,p)$. Gibbons–Hoffman–Wootters (2004) classified the freedom in choosing those operators via mutually unbiased bases. Gross (2006) cleaned the construction for odd prime power $d$ and proved the discrete analogue of Hudson: the pure states with non-negative discrete Wigner are *exactly* the stabilizer states, the Clifford group acts covariantly, and Pauli measurements have non-negative outcome statistics. This is the entire load-bearing structure under Howard–Wallman–Veitch–Emerson [82]: discrete-Wigner negativity ≡ contextuality ≡ resource for magic-state distillation. For even $d$ (notably $d=2$) the theorem fails — every qubit state can be written with non-negative quasi-probabilities in *some* frame — and the \"magic\" criterion must be rebuilt using mana or the rebit formalism. Translating any of this back to continuous variables requires the Mari–Eisert machinery [81]; the discrete and continuous theories share marginals and symplectic covariance but not their positivity theorems.\n\n### A2 — non-symmetric operator ordering ($s\\neq 0$)\n\nCahill–Glauber [74] parameterised the orderings by $s\\in[-1,1]$:\n$$W_s(\\alpha)=\\frac{1}{\\pi^2}\\int d^2\\xi\\;\\mathrm{Tr}\\!\\left[\\hat\\rho\\,\\hat D(\\xi)\\right]e^{s|\\xi|^2/2}\\,e^{\\xi^*\\alpha-\\xi\\alpha^*}.$$\n$s=+1$ is the Glauber–Sudarshan $P$, a genuine distribution only for classical mixtures of coherent states — for Fock $|n\\rangle$ it is the $n$-th derivative of $\\delta^{(2)}(\\alpha)$. $s=0$ is Wigner. $s=-1$ is Husimi $Q=\\langle\\alpha|\\hat\\rho|\\alpha\\rangle/\\pi\\geq 0$ for every state. The transformation between any two members is Gaussian convolution: $W_{s'}=W_s\\ast G_{(s-s')/2}$ for $s'\u003cs$. Negativity is therefore monotonic in $s$: it can only be *destroyed* by lowering $s$, never created. The Wigner zero of $|1\\rangle$ at the origin, $W_1(0)=-2/\\pi$, is washed out by convolution with the half-vacuum-width Gaussian that takes one to $Q$.\n\n### A3 — mixed states (Hudson's theorem fails)\n\nHudson [75] and Soto–Claverie [76] proved $W_\\psi\\geq 0\\Leftrightarrow \\psi$ Gaussian *for pure states only*. Bröcker–Werner [78] killed the mixed-state extension: there exist non-Gaussian density operators whose $W$ is everywhere non-negative. Mandilara, Karpov, Cerf (PRA 79, 062302, 2009) (verify) gave constructive examples — convex mixtures of phase-randomised squeezed thermal states — with manifestly non-Gaussian characteristic function yet $W\\geq 0$. The operational threshold is sharp: convolving any single-mode $W$ with a Gaussian of quadrature variance $\\geq 1/2$ (vacuum units) produces a non-negative function, because the convolution then dominates by $Q$. Equivalently, adding thermal noise with $\\bar n_{\\rm th}\\geq 1/2$ to *any* state forces Wigner positivity. So claims of the form \"Wigner-positive ⇒ Gaussian ⇒ classical\" survive only inside the pure-state regime where the experimentalist almost never lives.\n\n### A4 — lossy detection ($\\eta\u003c1$)\n\nModel a homodyne loss as a beam splitter of transmission $\\eta$ mixing the signal with vacuum. The reconstructed phase-space object is\n$$W_{\\rm obs}(\\alpha)=\\frac{1}{\\eta}\\,\\bigl(W_{\\rm in}\\ast G_{(1-\\eta)/(2\\eta)}\\bigr)(\\alpha/\\sqrt\\eta),$$\ni.e. a Gaussian convolution of width $(1-\\eta)/(2\\eta)$ per quadrature. In Cahill–Glauber language, lossy homodyne measures $W_s$ with $s=-(1-\\eta)/\\eta$. The critical threshold is $\\eta=1/2$: there the kernel width equals the vacuum width, $s=-1$, and what one \"reconstructs\" is the Husimi $Q$ — non-negative for every input. Below $\\eta=1/2$, *no* preparation can produce an observed negativity, however magical the state. Just above it, surviving negativity is depth-suppressed by an exponential in $(1-\\eta)/\\eta$; this is why the original single-photon dip [80] required $\\eta\\approx 0.55$ after loss-correction and why uncorrected tomograms routinely under-report negativity. Maximum-likelihood reconstruction with inadequate regularisation can run the failure in the opposite direction, smoothing away real dips or hallucinating spurious ones.\n\n### A5 — non-unitary dynamics (Gaussian channels)\n\nA channel is Gaussian iff its Heisenberg action on the displacement operators is affine-symplectic plus Gaussian noise. Such channels map Wigner-positive states to Wigner-positive states and Gaussian inputs to Gaussian outputs. This is the structural content behind Mari–Eisert [81]: circuits with Gaussian inputs, Gaussian unitaries, and Gaussian measurements are classically efficiently simulable, so *creating* Wigner negativity inside a CV computation requires a non-Gaussian resource at some stage — non-Gaussian state, non-Gaussian gate (e.g. cubic phase, photon counting), or non-Gaussian measurement. Pure dephasing in phase space (random displacement noise of variance $\\sigma^2$) erases the negativity of $|1\\rangle$ at $\\sigma^2\\geq 1/2$ — exactly the Husimi threshold of A4 from a different physical mechanism. The two limits are the same theorem worn differently.\n\nThe single thread tying the failures together: convolution with a Gaussian of vacuum width is universal. Every violation of A2–A5 that destroys negativity can be repackaged as \"you ended up looking at $Q$ instead of $W$\". A1/A6 violations are the exception — they replace the entire arena and require their own theorems."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Direct Negativity vs Circumstantial Nonclassicality", "markdown": "## Signatures: Direct Negativity vs Circumstantial Nonclassicality\n\nA claim of \"Wigner negativity\" carries two very different kinds of evidence. One is direct: a tomographically reconstructed phase-space density that is statistically below zero somewhere. The other is circumstantial: a scalar quantity (intensity correlation, quadrature variance, fringe visibility) that *requires* non-classicality in some operational sense but does not *imply* $W\u003c0$. Phase-space negativity is the strict witness; everything else is correlated evidence whose mimics must be ruled out one at a time.\n\n### The smoking gun: loss-corrected homodyne tomography\n\nBalanced homodyne measures the marginal $\\mathrm{pr}(x_\\theta)$ of the *detected* state. With photodetection efficiency $\\eta$, the reconstructed object is the $s$-ordered quasidistribution\n$$W_s(\\alpha)=\\frac{2}{\\pi(1-s)}\\!\\int\\! W(\\beta)\\,\\exp\\!\\Big(\\!-\\tfrac{2|\\alpha-\\beta|^2}{1-s}\\Big)\\,d^2\\beta,\\qquad s=-\\,\\frac{1-\\eta}{\\eta}.$$\nFor $\\eta=1$ one recovers $W$ ($s=0$); for $\\eta\\le \\tfrac12$ one obtains $W_{s\\le -1}$, i.e. an object at least as smoothed as the Husimi $Q$, which is non-negative for *every* state [74,77]. The convolution kernel is a Gaussian of width $\\sigma^2=(1-\\eta)/(2\\eta)$ vacuum units, and it is monotone-positivising: any negativity present at $s=0$ can be erased by a finite loss budget. The canonical demonstration is Lvovsky et al.'s heralded single photon [80], where inverse-Radon / max-likelihood reconstruction with explicit $\\eta$-deconvolution exhibits $W(0,0)\u003c0$ with statistical error bars set by the photon-count budget; the original Smithey et al. squeezed-vacuum tomography [79] is, by contrast, a Gaussian state and never produces $W\u003c0$, only sub-vacuum quadrature variance.\n\nThree procedural caveats decide whether a reported \"dip\" is real:\n\n1. **Efficiency floor.** $W(0,0)$ for the ideal Fock state $|1\\rangle$ is $-2/\\pi$. After loss it becomes $W(0,0;\\eta) = -(2/\\pi)(2\\eta-1)$, vanishing at $\\eta=\\tfrac12$. A dataset whose effective $\\eta$ — including mode-matching visibility $\\xi$, so $\\eta_{\\rm eff}=\\eta\\xi^2$ — is below this threshold cannot, in principle, return $W\u003c0$ without loss correction.\n2. **Smoothing in MaxLik.** Iterative reconstructions regularise; over-regularised priors can hide a true negative dip, while under-regularised inversion of noisy marginals can manufacture spurious oscillations. Negativity must survive a sweep of the regulariser, and the error on $W(0,0)$ must be propagated from the raw quadrature histograms (bootstrap, not just Fisher).\n3. **Loss model.** $\\eta$-deconvolution by inverse Gaussian filtering amplifies high-frequency noise; the honest report quotes both the *measured* $W_{s\u003c0}$ and the *inferred* $W_{s=0}$ with separate uncertainties.\n\nA direct, calibration-free alternative is the parity measurement: $W(0,0)=(2/\\pi)\\langle(-1)^{\\hat n}\\rangle$ (Royer/Cahill–Glauber form [74]). Displaced parity, used in cavity-QED and circuit-QED Wigner tomography, sidesteps Radon inversion entirely; the displaced version $W(\\alpha)=(2/\\pi)\\mathrm{Tr}[\\hat D(-\\alpha)\\rho\\hat D(\\alpha)(-1)^{\\hat n}]$ is what one actually plots in the modern microwave-cat experiments.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eLoss-induced positivisation of the single-photon Wigner function\u003c/title\u003e\u003cline x1=\"60\" y1=\"320\" x2=\"700\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"380\" y1=\"40\" x2=\"380\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"690\" y=\"340\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ex (vacuum units)\u003c/text\u003e\u003ctext x=\"390\" y=\"50\" fill=\"#e8e6e1\" font-size=\"14\"\u003eW(x,0)\u003c/text\u003e\u003cline x1=\"60\" y1=\"180\" x2=\"700\" y2=\"180\" stroke=\"#e8e6e1\" stroke-width=\"0.4\" stroke-dasharray=\"3 4\"/\u003e\u003ctext x=\"66\" y=\"176\" fill=\"#e8e6e1\" font-size=\"12\"\u003eW = 0\u003c/text\u003e\u003cpath d=\"M60 180 Q 200 180 300 180 Q 360 180 380 320 Q 400 180 460 180 Q 560 180 700 180\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003cpath d=\"M60 180 Q 200 182 300 188 Q 360 198 380 260 Q 400 198 460 188 Q 560 182 700 180\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003cpath d=\"M60 180 Q 200 184 300 196 Q 360 210 380 218 Q 400 210 460 196 Q 560 184 700 180\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cpath d=\"M60 180 Q 200 184 300 192 Q 360 196 380 180 Q 400 196 460 192 Q 560 184 700 180\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ccircle cx=\"380\" cy=\"320\" r=\"3.5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"392\" y=\"324\" fill=\"#ff7a90\" font-size=\"14\"\u003eη = 1.0  W(0,0) = −2/π\u003c/text\u003e\u003ccircle cx=\"380\" cy=\"260\" r=\"3.5\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"392\" y=\"264\" fill=\"#ffb86b\" font-size=\"14\"\u003eη = 0.75  dip survives\u003c/text\u003e\u003ccircle cx=\"380\" cy=\"218\" r=\"3.5\" fill=\"#7aa2ff\"/\u003e\u003ctext x=\"392\" y=\"222\" fill=\"#7aa2ff\" font-size=\"14\"\u003eη = 0.55  marginal\u003c/text\u003e\u003ccircle cx=\"380\" cy=\"180\" r=\"3.5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"392\" y=\"172\" fill=\"#7ee0a3\" font-size=\"14\"\u003eη = 0.50  Husimi floor, W ≥ 0\u003c/text\u003e\u003ctext x=\"60\" y=\"380\" fill=\"#e8e6e1\" font-size=\"12\"\u003eConvolution kernel σ² = (1−η)/(2η);  at η = 1/2 detected state is the Q-function.\u003c/text\u003e\u003c/svg\u003e\n*Figure: Detected single-photon Wigner profile along the q-axis as detection efficiency $\\eta$ degrades. The central dip is the smoking gun at $\\eta=1$ ($W(0,0)=-2/\\pi$) and is washed out monotonically by the Gaussian smoothing kernel; below $\\eta=1/2$ the reconstructed object is at least as smooth as the Husimi $Q$ and is non-negative for every state. Loss correction inverts this kernel — at the price of amplifying high-frequency noise.*\n\n### Circumstantial signatures and their classical mimics\n\nThe historical menagerie of \"nonclassicality indicators\" predates Wigner-as-resource by decades and is not equivalent to $W\u003c0$. The honest taxonomy:\n\n| Signature | What it shows | Classical / Gaussian mimic | Discriminator |\n|---|---|---|---|\n| Quadrature squeezing $\\langle(\\Delta x_\\theta)^2\\rangle\u003c1/2$ | $P$-function negativity (Glauber sense) | None classically, but every pure squeezed vacuum is Gaussian with $W\\ge 0$ everywhere [75] | Squeezing alone *never* implies $W\u003c0$; one needs a non-Gaussian operation (photon subtraction, Kerr) afterwards |\n| Antibunching $g^{(2)}(0)\u003c1$ | Photon-number variance below Poisson on detection | Classical light with rapid intensity modulation can mimic dips in $g^{(2)}(\\tau)$; \"antibunching from blinking\" is a known artefact | Multi-detector cross-correlations, deadtime audit, and full photon-number statistics (Mandel $Q\u003c0$) |\n| Sub-Poisson $\\mathrm{Var}(n)\u003c\\langle n\\rangle$ | Mandel $Q\u003c0$ | Post-selected / heralded thermal mixtures can spoof low variance over short gates | Unconditioned counting; full histogram, not first two moments |\n| Two-mode fringe visibility $V\u003e1/\\sqrt 2$ | Coherence beyond a separable classical bound | Bright thermal sources with stabilised phase can saturate naïve visibility bounds | Bell-type inequality with proper normalisation, or full state tomography |\n| HOM dip depth $\u003e50\\%$ | Indistinguishable bosonic interference | Two coherent states with matched amplitudes give a 50% dip — no quantum interference | Variation with input intensity; coincidence-to-singles ratio scaling |\n\nThe conceptual rule: squeezing, antibunching, and sub-Poissonian statistics are properties of the Glauber–Sudarshan $P$-function ($P$ fails to be a probability density). They are necessary for $W\u003c0$ only after a non-Gaussian operation; a pure Gaussian state has $W\\ge 0$ globally by Hudson [75], yet can violate every $P$-based classicality test. The converse trap is mixed-state: Bröcker–Werner [78] guarantees non-Gaussian density operators with $W\\ge 0$, so *absence* of negativity does not certify Gaussianity or classicality of the underlying ρ.\n\n### A naming hazard worth flagging explicitly\n\n\"Wigner negativity\" and \"logarithmic negativity\" are different objects that share a word. Logarithmic negativity is $E_{\\mathcal N}(\\rho_{AB}) = \\log_2\\|\\rho_{AB}^{T_B}\\|_1$, a bipartite entanglement monotone built from the partial transpose; it is a property of a two-party density operator and is non-zero precisely when the PPT criterion is violated. Wigner negativity is a single-state phase-space property — a feature of one $W(q,p)$, independent of any bipartition. A two-mode squeezed vacuum has large $E_{\\mathcal N}$ and $W\\ge 0$ everywhere; a single photon has $W(0,0)\u003c0$ and no bipartite structure at all. Claims that conflate the two — most often in CV-entanglement papers that quote \"negativity\" without qualifier — should be read with the question *of what object, with respect to what operation*. Direct negativity is a statement about $W$. Logarithmic negativity is a statement about $\\rho^{T_B}$. They coincide only by accident."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: Meaning Drift in the Current Literature", "markdown": "## Use \u0026 Abuse: Meaning Drift in the Current Literature\n\nThe slogan \"Wigner negativity = quantumness\" has metastasised. The five patterns below are the ones that recur in papers I referee, in talks at quantum-information meetings, and — most stubbornly — in the introductions of otherwise careful experimental papers. Each has a tell that a reader can spot in a single paragraph.\n\n### Abuse 1 — Hudson cited for $\\rho$\n\nThe most common citation error: \"By Hudson's theorem [75], a state with non-negative Wigner function is Gaussian.\" The theorem says no such thing about mixed states. Bröcker and Werner [78] exhibited non-Gaussian density operators with $W_\\rho\\ge 0$ everywhere; Mandilara, Karpov, and Cerf later parametrised the mixed-state corridor in which non-Gaussianity coexists with positivity ([Mandilara–Karpov–Cerf, PRA 79, 062302 (2009)](https://arxiv.org/abs/0808.2501)). The structural reason: Hudson's argument uses that a pure-state Wigner function squared integrates to $(2\\pi\\hbar)^{-1}$, which forces a Gaussian when $W\\ge 0$. For mixed states $\\mathrm{Tr}\\,\\rho^2\u003c1$ and the Cauchy–Schwarz step that pinned Gaussianity collapses. **Tell:** any sentence of the form \"since $W\\ge 0$, the state is (a mixture of) coherent states\" applied to a thermalised or lossy system. The honest statement is non-classicality in the Glauber sense ($P$ not a probability), which is strictly weaker than negativity of $W$.\n\n### Abuse 2 — Dips reported without $\\eta$\n\nA homodyne experiment with detection efficiency $\\eta\u003c1$ does not measure $W$. The quadrature data are drawn from the Gaussian-smoothed $s$-ordered distribution of [74] with\n$$s_{\\text{eff}} = -\\frac{1-\\eta}{\\eta},$$\nso $\\eta=1$ gives $s=0$ (Wigner), $\\eta=1/2$ gives $s=-1$ (Husimi $Q$, **non-negative for every state**), and $\\eta\u003c1/2$ gives an even more deeply smoothed object that is also non-negative by construction. Below the half-efficiency line, any reconstructed \"negativity\" is an artefact of the deconvolution (or of the regulariser in a maximum-likelihood pipeline) and not data ([Lvovsky 2004 inverse-problem analysis](https://arxiv.org/abs/quant-ph/0311097); see also the loss-corrected reconstructions reviewed in [Filip \u0026 Mišta, recent CV-tomography literature](https://arxiv.org/abs/2509.18080)). **Tell:** a phase-space plot showing $W(0,0)\u003c0$ accompanied only by an \"overall efficiency\" number, with no statement of whether loss correction was applied, no error bar on the dip, and no comparison to the no-correction $s_{\\text{eff}}$. If the authors quote $\\eta\\lesssim 0.5$ and report negativity without iterative reconstruction, you are looking at the kernel, not the state.\n\n### Abuse 3 — Kenfack–Życzkowski as a monotone\n\nThe integral\n$$\\mathcal{N}_{\\text{KZ}}(\\rho)=\\int\\!\\!\\int \\!|W_\\rho(q,p)|\\,dq\\,dp-1$$\nis a useful scalar nonclassicality indicator but it is not a resource monotone under any of the standard CV free-operation sets. The proper monotones are (a) **mana**, $\\mathcal{M}(\\rho)=\\log\\sum_{u,v}|W_\\rho(u,v)|$, on the discrete phase space (Gross / Veitch–Mousavian–Gottesman); and (b) the **Wigner logarithmic negativity** of [Albarelli, Genoni, Ferraro, Paris, PRA 98, 052350 (2018)](https://arxiv.org/abs/1804.05763),\n$$\\mathcal{W}(\\rho)=\\log\\!\\int\\!\\!\\int |W_\\rho(q,p)|\\,dq\\,dp,$$\non the CV phase space, which is non-increasing under Gaussian unitaries, partial traces over Gaussian-correlated ancillas, and Gaussian-measurement-conditioned coarse-graining. Note that $\\mathcal{W}=\\log(\\mathcal{N}_{\\text{KZ}}+1)$ — the same integral, but the logarithm and the carefully specified free set are what make it a monotone. **Tell:** a paper quoting $\\mathcal{N}_{\\text{KZ}}$ values across a parameter sweep and calling them a \"resource\". Without the free-operation list the number has no resource-theoretic content.\n\n### Abuse 4 — Discrete results ported to CV without a bridge\n\nHoward–Wallman–Veitch–Emerson [82] identified contextuality, equivalent via Gross's Clifford-covariance theorem to discrete-Wigner negativity, as the resource powering magic-state distillation **for odd-prime-dimensional qudits with stabiliser operations**. The continuous-variable analogue is not a corollary; it requires the Mari–Eisert simulation argument [81] together with the Veitch et al. structural results, and was sharpened only later — see [Booth, Markham, Pashayan \u0026 Emeriau, \"Contextuality and Wigner negativity are equivalent for continuous-variable quantum measurements\", PRX Quantum 2022](https://arxiv.org/abs/2112.14788). **Tell:** the citation chain \"Howard et al. 2014 ⇒ negativity is the resource\" appended to a CV optics paper with no mention of Mari–Eisert, no Gaussian-measurement assumption stated, and no acknowledgement that the discrete result lives over $\\mathbb{Z}_d\\times\\mathbb{Z}_d$ for $d$ odd prime.\n\n### Abuse 5 — \"Negativity = quantumness\" for thermal plus noise\n\nThe two-mode thermal state and the displaced thermal state both have manifestly Gaussian, manifestly non-negative Wigner functions. They are nevertheless **not** Glauber-classical once the thermal occupation drops below threshold for a chosen ordering — but they have no contextuality, no computational magic, and no Hudson-violation. A sub-Poissonian Mandel parameter, a $g^{(2)}(0)\u003c1$, or a squeezed quadrature variance are evidence of **circumstantial** nonclassicality in the s-ordered hierarchy of [74], not of phase-space negativity. **Tell:** \"the negativity of our state demonstrates its quantum character\" applied to a Gaussian squeezed vacuum or a single-mode squeezed thermal state. The Wigner function of any zero-mean Gaussian is $W(\\xi)\\propto \\exp(-\\xi^\\top\\sigma^{-1}\\xi)$, strictly positive whenever $\\sigma$ is a valid covariance matrix (i.e., $\\sigma+i\\Omega/2\\succeq 0$). The author meant *non-classicality*, conflated it with *negativity*, and reported a property the state does not possess.\n\nThe through-line is taxonomic. Negativity is a **specific** property of one quasi-distribution — the $s=0$ symbol — measured under specific assumptions, with a specific role inside a specific resource theory. Each abuse pattern is the same move: a quantitative claim about one of those four \"specifics\" is silently exchanged for a qualitative slogan about the others.\n\nSources:\n- [Albarelli, Genoni, Ferraro, Paris — Resource theory of quantum non-Gaussianity and Wigner negativity (PRA 2018)](https://arxiv.org/abs/1804.05763)\n- [Mandilara, Karpov, Cerf — Extending Hudson's theorem to mixed quantum states (PRA 2009)](https://arxiv.org/abs/0808.2501)\n- [Booth, Markham, Pashayan, Emeriau — Contextuality and Wigner negativity are equivalent for CV measurements (PRX Quantum 2022)](https://arxiv.org/abs/2112.14788)\n- [Lvovsky — Iterative maximum-likelihood reconstruction in quantum homodyne tomography (quant-ph/0311097)](https://arxiv.org/abs/quant-ph/0311097)\n- [Pulsed homodyne Gaussian tomography with low detection efficiency](https://arxiv.org/abs/1301.2471)"}, {"id": "status-and-checklist", "title": "Status \u0026 The Believer's Checklist", "markdown": "## Status \u0026 The Believer's Checklist\n\nThree positions on Wigner negativity hold up under scrutiny in 2026; one popular position does not.\n\n**Position 1 — pure-state nonclassicality witness.** For pure $\\psi\\in L^2(\\mathbb{R}^n)$, $W_\\psi\\ge 0$ iff $\\psi$ is Gaussian [75,76]. This is the cleanest statement in the entire portfolio: necessary and sufficient, no asterisks, dimension-independent. As a witness against the Glauber convex hull of coherent states it is also correct — $P$-distribution negativity is the stronger statement, Wigner negativity the more diagnostically tractable one [77].\n\n**Position 2 — continuous-variable computational resource.** Mari–Eisert [81] showed that if a CV circuit's input state, gates (Gaussian), and measurements all preserve $W\\ge 0$, the circuit admits efficient classical simulation by phase-space Monte Carlo. Negativity is therefore necessary for any super-classical CV speed-up in that class. The hypotheses are precise — Gaussian or stochastic-positive operations, measurements with non-negative phase-space symbol — and citing the theorem outside that class is illegitimate.\n\n**Position 3 — finite-dimensional resource.** On the Wootters–Gross odd-prime-dimensional phase space, negativity of $W_d$ is equivalent (Spekkens 2008; Gross 2006) to generalised contextuality, and Howard–Wallman–Veitch–Emerson [82] identify it as the resource consumed by magic-state distillation. The monotone is *mana*, $\\mathcal{M}(\\rho)=\\log\\sum_{\\mathbf u}|W_d(\\mathbf u\\mid\\rho)|$, introduced in [Veitch et al., *NJP* 16, 013009 (2014)](https://iopscience.iop.org/article/10.1088/1367-2630/16/1/013009). Odd dimension is load-bearing: the Clifford-covariance theorem fails for $d=2$, where alternative discrete-Wigner constructions lose the clean Clifford–positivity equivalence.\n\n**The mutated position — \"Wigner negativity $\\equiv$ quantumness\" — fails for mixed states.** Bröcker–Werner [78] proved that non-Gaussian density operators with $W\\ge 0$ everywhere exist; Mandilara–Karpov–Cerf gave explicit constructions. Negativity is sufficient but not necessary for nonclassicality once one leaves the pure-state submanifold. The slogan is also dimensionally promiscuous: importing the Howard et al. magic-state statement into a CV mode, or the Mari–Eisert CV statement into qudit fault tolerance, is a category error.\n\nA further confound is the continuum $s$-ordered family [74]: tomographic data, after loss with efficiency $\\eta$, returns the $s=-(1-\\eta)/\\eta$ smoothed quasi-distribution, not $W$. For $\\eta\\le 1/2$ one is reconstructing the Husimi $Q$, which is non-negative for every state. \"Observed\" negativity is therefore conditional on the assumed loss model, and the Gaussian smoothing kernel of any maximum-likelihood prior can either fabricate or annihilate sub-zero structure.\n\n### The believer's checklist\n\nA claim of Wigner negativity arriving for review must answer all ten before AETHER signs off.\n\n1. **Pure or mixed?** State whether Hudson's theorem [75] applies, or whether one is in the Bröcker–Werner regime [78] where negativity is sufficient but not necessary.\n2. **Detection efficiency $\\eta$ reported, with loss-correction explicit.** Bare-detector tomography measures $W_{s=-(1-\\eta)/\\eta}$; the deconvolution back to $s=0$ must be shown, with its error budget — early demonstrations [79,80] are exemplary on this point.\n3. **Reconstruction kernel disclosed.** Maximum-likelihood, pattern-function, or inverse-Radon — each carries a smoothing prior that can mask or manufacture $W\u003c0$. Regularisation parameters and binning must be reported.\n4. **$s$-parameter of the actually reconstructed object stated.** Without this number, \"the Wigner function\" is metonymy for an unspecified quasi-distribution.\n5. **Statistical significance of $W(\\mathbf r)\u003c0$ quoted with error bars.** A point estimate below zero at sub-$\\sigma$ confidence is not a measurement of negativity; it is a fluctuation. State the bootstrap or covariance procedure used.\n6. **Gaussian-convolution sanity check.** Convolve the reconstruction with a thermal kernel of variance $\\sigma^2\\ge 1/2$; if negativity survives only *without* this smoothing, one has measured $P$-distribution nonclassicality, not robust phase-space negativity.\n7. **Mari–Eisert hypotheses verified, if a CV-computational claim is being made.** Gates Gaussian or stochastic-positive, measurements with positive phase-space symbol, input state class declared [81]. Outside this class the theorem is silent.\n8. **Gross covariance theorem and odd $d$ stated, if discrete.** The magic/mana story [82] is an odd-prime-power statement; qubit ($d=2$) extensions require separate justification.\n9. **\"Negativity\" disambiguated from logarithmic negativity.** The CV-entanglement quantity $E_N(\\rho)=\\log\\lVert\\rho^{T_A}\\rVert_1$ shares nothing but the word; CV papers conflating the two should be sent back.\n10. **Genuine monotone reported.** Kenfack–Życzkowski $\\nu(\\rho)=\\int|W|-1$ is an indicator, not a monotone under the relevant free operations. For CV use the Wigner logarithmic negativity $\\mathcal{N}(\\rho)=\\log\\int|W_\\rho|\\,d^{2n}\\mathbf r$ of [Albarelli–Genoni–Ferraro–Paris, *PRA* 98, 052350 (2018)](https://journals.aps.org/pra/abstract/10.1103/PhysRevA.98.052350); for discrete systems use *mana*. State which, and why it matches the resource theory invoked.\n\nPass all ten and the claim deserves to be taken at face value. Fail any one and the negativity in the title is decorative."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI will stake my name on the following: Wigner negativity is a *necessary* phase-space fingerprint of any computational advantage that survives stabilizer simulation, and it is the *correct* nonclassicality witness for pure continuous-variable states. Beyond that, the field has been living off slogans, and I think the next decade will be spent paying that debt.\n\n### (a) What I defend with my reputation\n\nThe Groenewold–Moyal deformation is the right way to teach quantization. The $\\star$-product is not a curiosity — it is the only associative bilinear that reproduces $[\\hat A,\\hat B]/i\\hbar$ as its antisymmetric part while preserving classical limits, and Groenewold's no-go (no associative *commutative* product can do this) is the cleanest statement of why quantization is hard. I defend Hudson's theorem as stated — pure-state, single-mode, $L^2(\\mathbb{R})$ — and nothing past its hypotheses. I defend the Mari–Eisert / Veitch–Ferrie–Emerson efficient-simulability line: a CV circuit on a Wigner-positive input with Gaussian unitaries and homodyne readout is classically simulable, period. And I defend the experimental protocol of loss-deconvolved tomography with a stated $\\eta$ — the only honest way to make a negativity claim.\n\n### (b) What is shakier than the literature admits\n\nFour loose joists, in order of how much load they actually bear:\n\n1. **\"Magic = negativity.\"** True for *qudit-stabilizer odd-prime-power systems with the Gross Wigner function* (Veitch et al., Howard et al.). The slogan transports to qubits only through Wigner-like constructions whose covariance group is not the full Clifford group; the cleanest qubit results (Raussendorf, Delfosse) use contextuality or Λ-polytopes, *not* a Wigner negativity. Reviewers conflate these routinely.\n2. **Negativity volume as a resource monotone.** Kenfack–Życzkowski $\\int|W|-1$ is not monotone under partial trace, not monotone under Gaussian channels in general, and not the operationally meaningful quantity — Albarelli–Genoni–Ferraro–Serafini's Wigner logarithmic negativity is. The volume persists in the literature because it is easy to compute, not because it is right.\n3. **Mixed-state nonclassicality witnessing.** The Bröcker–Werner and Mandilara–Karpov–Cerf counterexamples have not been internalized. Any paper that infers \"nonclassical because $W \\ge 0$ fails\" without specifying purity, or that infers \"classical because $W \\ge 0$\" for a mixed state, is making a category error.\n4. **Detector-loss honesty.** Below $\\eta \\lesssim 1/2$ you are measuring the Husimi $Q$; \"no negativity seen\" is then a tautology, not a result. The community tolerates this in figure captions far more than it should.\n\n### (c) Three open questions I would actually work on, ranked\n\n1. **Operational classification of Wigner-positive non-Gaussian mixed states.** Are they free under some realistic channel class, or is their non-Gaussianity a *hidden* resource that becomes negativity after a single non-Gaussian unitary? This is the cleanest unsolved question in CV resource theory.\n2. **A genuine CV magic monotone with a circuit-cost lower bound.** Wigner logarithmic negativity is the candidate; what is its analogue of the Howard–Campbell bound? Without this, \"CV magic\" is a metaphor.\n3. **Robust loss-corrected negativity estimation with calibrated confidence intervals.** Maximum-likelihood reconstruction smooths $W$; we still lack a statistically defensible $p$-value for \"$W(\\alpha_0) \u003c 0$\". This is engineering, but it is what stops referees arguing.\n\n### (d) Reading path\n\n1. **Wigner 1932** [71] — read the footnote crediting Szilard; everything downstream begins here, including the misattribution.\n2. **Groenewold 1946** (thesis/Physica paper) — the actual birth of phase-space quantization; understand the no-go before you trust any \"Moyal bracket.\"\n3. **Hudson 1974** — five pages, one theorem, stated under hypotheses the field has spent fifty years ignoring.\n4. **Bröcker–Werner 1995; Mandilara–Karpov–Cerf 2009** — read together: the mixed-state counterexample and its explicit construction, so the pure-state slogan stops surviving in your head.\n5. **Veitch–Ferrie–Gross–Emerson 2012 + Albarelli–Genoni–Ferraro–Serafini 2018** — the simulability theorem and the only CV monotone with the right properties; this is where the resource-theoretic story actually stands in 2026.\n\nEverything else is commentary."}], "references": [{"n": 1, "title": "UNIVERSITY COLLEGE, LONDON.", "authors": ["G. Montagnac", "Razvan Caracas", "E. Bobocioiu", "F. Vittoz", "Bruno Reynard", "Raúl Arenal"], "year": 1891, "venue": "The Lancet", "url": "https://doi.org/10.1016/s0140-6736(02)01200-x", "cited_by": 11, "bucket": "earliest"}, {"n": 2, "title": "Item Unavailable", "authors": ["Simon Catterall", "Roni Harnik", "Veronika E. Hubeny", "C. Bauer", "Asher Berlin", "Zohreh Davoudi"], "year": 1900, "venue": "", "url": "https://doi.org/10.2172/1892238", "cited_by": 10, "bucket": "earliest"}, {"n": 3, "title": "Effect of Nuclear Spin on the Radiation Excited by Electron Impact", "authors": ["William George Penney"], "year": 1932, "venue": "Proceedings of the National Academy of Sciences", "url": "https://doi.org/10.1073/pnas.18.3.231", "cited_by": 32, "bucket": "earliest"}, {"n": 4, "title": "The riddle of the Earth: Efforts to read it", "authors": ["Frederick Ehrenfeld"], "year": 1933, "venue": "Journal of the Franklin Institute", "url": "https://doi.org/10.1016/s0016-0032(33)91342-3", "cited_by": 0, "bucket": "earliest"}, {"n": 5, <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}

        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
