oint at coupling gain $g=1$ — is then a single line that follows from the Ginibre spectrum [3] of the linearized Jacobian. Each of these four moves was already in the literature for spin glasses [8, 7, 6, 9]; the SCS achievement is the recognition that the same machinery, applied to a neural firing-rate ODE, predicts a true dynamical chaos rather than a glassy slow-down.\n\n### The model and its symmetries\n\nLet $i=1,\\dots,N$ index the units and write\n$$\\dot{x}_i(t) = -x_i(t) + \\sum_{j=1}^N J_{ij}\\,\\phi(x_j(t)),\\qquad J_{ij}\\stackrel{\\text{i.i.d.}}{\\sim}\\mathcal{N}\\!\\left(0,\\frac{g^2}{N}\\right),$$\nwith $\\phi$ an odd, bounded, monotonically increasing sigmoid, normalized so $\\phi'(0)=1$ (SCS take $\\phi=\\tanh$). The matrix $J$ is *not* symmetric — this is the decisive departure from Sherrington–Kirkpatrick. The $1/\\sqrt{N}$ scaling of $J_{ij}$ is the only scaling that keeps the input $\\sum_j J_{ij}\\phi(x_j)$ an $O(1)$ Gaussian by the central limit theorem; it is also the scaling for which Ginibre's circular law applies cleanly [3]. Note that quenched disorder is in $J$, not in any noise driving — the SCS model is *autonomous and deterministic* at finite $N$. Any \"chaos\" must therefore come from the dynamics itself, not from a stochastic forcing, a point that is muddled in much of the secondary literature and that the 2026 reframing [10] insists upon.\n\n### The MSR generating functional and disorder average\n\nThe MSR construction [5], in the Janssen–De Dominicis convention [6], represents the path probability by inserting a delta functional and an auxiliary \"response\" field $\\tilde{x}_i(t)$:\n$$Z[\\ell,\\tilde{\\ell}] = \\int\\!\\mathcal{D}x\\,\\mathcal{D}\\tilde{x}\\;\\exp\\!\\left\\{\\,\\mathrm{i}\\!\\int\\! dt\\,\\sum_i \\tilde{x}_i\\!\\left[\\dot{x}_i + x_i - \\sum_j J_{ij}\\phi(x_j)\\right]\\right\\}\\exp\\!\\left\\{\\!\\int\\! dt\\,(\\ell_i x_i + \\tilde{\\ell}_i\\tilde{x}_i)\\right\\}.$$\n$Z=1$ identically before averaging, so $\\overline{\\ln Z}=\\ln\\overline{Z}$ and no replicas are needed — this is exactly the trick De Dominicis exploited for off-equilibrium spin glasses [6]. The coupling appears only in the bilinear $\\mathrm{i}\\tilde{x}_i J_{ij}\\phi(x_j)$, so the Gaussian disorder integral is immediate:\n$$\\overline{\\exp\\!\\left[\\mathrm{i}\\sum_{ij}\\!\\int\\!dt\\,\\tilde{x}_i J_{ij}\\phi(x_j)\\right]} = \\exp\\!\\left[-\\frac{g^2}{2N}\\sum_{ij}\\!\\int\\!dt\\,dt'\\,\\tilde{x}_i(t)\\tilde{x}_i(t')\\,\\phi(x_j(t))\\phi(x_j(t'))\\right].$$\nThe crucial $N$-power-counting is that the $j$-sum becomes $N$ times the empirical mean of $\\phi(x_j(t))\\phi(x_j(t'))$, while the $1/N$ from the variance cancels it — yielding an $O(1)$ effective bilocal coupling. Introducing the order parameter\n$$C(t,t') = \\frac{1}{N}\\sum_j \\phi(x_j(t))\\phi(x_j(t'))$$\nvia a Hubbard–Stratonovich / delta-function insertion and its conjugate $\\hat{C}(t,t')$ decouples the sites. At leading order in $1/N$, a saddle-point on $\\hat{C}$ sets $\\hat{C}\\equiv 0$ (in the absence of response–response anomalies; see [5, 6]), and the site-decoupled action describes $N$ independent copies of the same *effective process*:\n\n$$\\dot{x}(t) = -x(t) + \\eta(t),\\qquad \\langle\\eta(t)\\eta(t')\\rangle = g^2\\,\\overline{\\langle \\phi(x(t))\\phi(x(t'))\\rangle},$$\nwith $\\eta$ a Gaussian *colored noise* whose covariance is self-consistently equal to $g^2$ times the average of $\\phi\\phi$ over the very same effective process. This is the Sompolinsky–Zippelius closure [8, 7] transplanted from the SK Langevin problem to the neural ODE.\n\n### From the effective process to the Newton-form ODE\n\nDefine\n$$\\Delta(t,t') = \\langle x(t)x(t')\\rangle,\\qquad C_\\phi(t,t')=\\langle\\phi(x(t))\\phi(x(t'))\\rangle.$$\nIn the time-translation-invariant stationary phase, $\\Delta(t,t')=\\Delta(\\tau)$ with $\\tau=t-t'$, and Gaussianity of $x$ under the effective process makes $C_\\phi$ a *deterministic* functional of $\\Delta(0)$ and $\\Delta(\\tau)$:\n$$C_\\phi(\\tau) = \\mathcal{F}_\\phi\\!\\big(\\Delta(0),\\Delta(\\tau)\\big) \\equiv \\!\\!\\int\\!\\!\\int\\!\\frac{du\\,dv}{2\\pi\\sqrt{\\det\\Sigma}}\\,\\mathrm{e}^{-\\tfrac{1}{2}\\mathbf{z}^\\top\\Sigma^{-1}\\mathbf{z}}\\,\\phi(u)\\phi(v),$$\nwith $\\Sigma=\\big(\\begin{smallmatrix}\\Delta(0)\u0026\\Delta(\\tau)\\\\\\Delta(\\tau)\u0026\\Delta(0)\\end{smallmatrix}\\big)$. Acting twice with $(-\\partial_\\tau^2+1)$ on the stationary Wiener–Hopf relation $\\Delta(\\tau)=\\int K(\\tau-s)\\,g^2 C_\\phi(s)\\,ds$, with $K$ the Green's function of $\\partial_t+1$, the SCS Letter collapses the whole machinery to a single second-order ODE in fictitious \"time\" $\\tau$:\n$$\\ddot{\\Delta}(\\tau) = \\Delta(\\tau) - g^2\\,\\mathcal{F}_\\phi\\!\\big(\\Delta(0),\\Delta(\\tau)\\big) \\equiv -\\frac{\\partial V}{\\partial \\Delta}\\bigg|_{\\Delta(0)}.$$\nThis is the *Newton-form ODE*: a unit-mass particle in a potential $V(\\Delta;\\Delta(0))$ that depends parametrically on the still-unknown equal-time variance. The conservation law $E=\\tfrac{1}{2}\\dot{\\Delta}^2+V$ provides the second self-consistency: physically admissible trajectories are those that start with $\\dot{\\Delta}(0)=0$ and decay to a finite $\\Delta(\\infty)\\geq 0$, and the requirement $E(\\Delta(0))=V(\\Delta(\\infty);\\Delta(0))$ closes the system. Below $g=1$ only the trivial $\\Delta\\equiv 0$ solution exists; above $g=1$ a non-trivial $\\Delta(0)\u003e0$ solution appears, and it is this branch that carries the chaotic phase. The Newton-form derivation is, technically, the only original calculation in the 1988 Letter — everything upstream is Sompolinsky–Zippelius [8, 7] dressed in MSR clothing [5, 6].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eSCS phase portrait: Ginibre spectrum, V(C) potential, C(tau) Newton motion\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cg font-family=\"serif\" font-size=\"14\" fill=\"#e8e6e1\"\u003e\u003ctext x=\"120\" y=\"24\" text-anchor=\"middle\"\u003eJacobian spectrum (Ginibre)\u003c/text\u003e\u003ctext x=\"380\" y=\"24\" text-anchor=\"middle\"\u003eNewton potential V(C; C(0))\u003c/text\u003e\u003ctext x=\"600\" y=\"24\" text-anchor=\"middle\"\u003eAutocorrelation C(τ)\u003c/text\u003e\u003c/g\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003cline x1=\"40\" y1=\"220\" x2=\"220\" y2=\"220\"/\u003e\u003cline x1=\"120\" y1=\"120\" x2=\"120\" y2=\"320\"/\u003e\u003c/g\u003e\u003ccircle cx=\"120\" cy=\"220\" r=\"55\" stroke=\"#7aa2ff\" stroke-width=\"1.5\" fill=\"none\"/\u003e\u003ccircle cx=\"120\" cy=\"220\" r=\"80\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" fill=\"none\"/\u003e\u003cg fill=\"#7aa2ff\"\u003e\u003ccircle cx=\"100\" cy=\"205\" r=\"2\"/\u003e\u003ccircle cx=\"140\" cy=\"240\" r=\"2\"/\u003e\u003ccircle cx=\"115\" cy=\"250\" r=\"2\"/\u003e\u003ccircle cx=\"155\" cy=\"215\" r=\"2\"/\u003e\u003ccircle cx=\"85\" cy=\"235\" r=\"2\"/\u003e\u003ccircle cx=\"130\" cy=\"190\" r=\"2\"/\u003e\u003ccircle cx=\"160\" cy=\"245\" r=\"2\"/\u003e\u003ccircle cx=\"95\" cy=\"180\" r=\"2\"/\u003e\u003ccircle cx=\"170\" cy=\"225\" r=\"2\"/\u003e\u003ccircle cx=\"105\" cy=\"255\" r=\"2\"/\u003e\u003ccircle cx=\"135\" cy=\"170\" r=\"2\"/\u003e\u003ccircle cx=\"165\" cy=\"195\" r=\"2\"/\u003e\u003c/g\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003cline x1=\"120\" y1=\"220\" x2=\"200\" y2=\"220\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003c/g\u003e\u003cg font-family=\"serif\" font-size=\"13\" fill=\"#e8e6e1\"\u003e\u003ctext x=\"210\" y=\"217\"\u003e−1\u003c/text\u003e\u003ctext x=\"200\" y=\"240\" fill=\"#ff7a90\"\u003e1 (g=1)\u003c/text\u003e\u003ctext x=\"220\" y=\"155\" fill=\"#ffb86b\"\u003eradius g\u003c/text\u003e\u003ctext x=\"120\" y=\"350\" text-anchor=\"middle\"\u003eRe λ + 1\u003c/text\u003e\u003c/g\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003cline x1=\"270\" y1=\"320\" x2=\"490\" y2=\"320\"/\u003e\u003cline x1=\"280\" y1=\"120\" x2=\"280\" y2=\"330\"/\u003e\u003c/g\u003e\u003cpath d=\"M 280 200 Q 330 380 400 320 Q 460 270 488 280\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpath d=\"M 280 250 Q 340 330 405 308 Q 460 290 488 300\" stroke=\"#7ee0a3\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ccircle cx=\"280\" cy=\"200\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"405\" cy=\"320\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003cg font-family=\"serif\" font-size=\"13\" fill=\"#e8e6e1\"\u003e\u003ctext x=\"265\" y=\"195\"\u003eC(0)\u003c/text\u003e\u003ctext x=\"415\" y=\"338\"\u003eC(∞)\u003c/text\u003e\u003ctext x=\"380\" y=\"345\" text-anchor=\"middle\"\u003eC\u003c/text\u003e\u003ctext x=\"265\" y=\"135\"\u003eV\u003c/text\u003e\u003ctext x=\"495\" y=\"284\" fill=\"#7aa2ff\"\u003eg\u0026gt;1\u003c/text\u003e\u003ctext x=\"495\" y=\"304\" fill=\"#7ee0a3\"\u003eg≈1⁺\u003c/text\u003e\u003c/g\u003e\u003cg stroke=\"#e8e6e1\" stroke-width=\"1\" fill=\"none\"\u003e\u003cline x1=\"540\" y1=\"320\" x2=\"700\" y2=\"320\"/\u003e\u003cline x1=\"550\" y1=\"120\" x2=\"550\" y2=\"330\"/\u003e\u003c/g\u003e\u003cpath d=\"M 550 150 Q 580 200 600 230 Q 625 270 650 295 Q 675 312 700 318\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpath d=\"M 550 150 L 700 150\" stroke=\"#ff7a90\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" fill=\"none\"/\u003e\u003cpath d=\"M 550 320 L 700 320\" stroke=\"#ffb86b\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" fill=\"none\"/\u003e\u003cg font-family=\"serif\" font-size=\"13\" fill=\"#e8e6e1\"\u003e\u003ctext x=\"535\" y=\"155\"\u003eC(0)\u003c/text\u003e\u003ctext x=\"535\" y=\"325\"\u003eC(∞)\u003c/text\u003e\u003ctext x=\"620\" y=\"345\" text-anchor=\"middle\"\u003eτ\u003c/text\u003e\u003ctext x=\"660\" y=\"145\" fill=\"#ff7a90\"\u003e⟨φ²⟩\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\n*Figure: Left — the Jacobian of $-\\mathbf{1}+J\\phi'(0)$ has eigenvalues on a disc of radius $g$ centered at $-1$ (Ginibre [3]); $g=1$ is the instant the disc kisses the imaginary axis. Center — the SCS Newton potential $V(C;C(0))$ above and just above $g=1$; the order-parameter \"particle\" rolls from $C(0)$ to a strictly positive $C(\\infty)$. Right — the resulting autocorrelation $C(\\tau)$ relaxes monotonically from $\\langle\\phi^2\\rangle$ at $\\tau=0$ to $C(\\infty)$, the quenched component.*\n\n### The $g=1$ threshold from Ginibre's spectrum\n\nLinearizing the firing-rate ODE about $x\\equiv 0$ gives $\\dot{\\delta x} = (-\\mathbf{1}+J)\\delta x$, since $\\phi'(0)=1$. By Ginibre's theorem [3], the spectrum of an $N\\times N$ matrix of i.i.d. $\\mathcal{N}(0,g^2/N)$ entries converges, as $N\\to\\infty$, to the uniform measure on the disc $|z|\\leq g$ in the complex plane. The eigenvalues of $-\\mathbf{1}+J$ therefore fill the disc $|z+1|\\leq g$, and the fixed point loses linear stability precisely when this disc first touches the imaginary axis — *i.e.*, at $g=1$. Girko's circular law [4] is the real-i.i.d. generalization and is not actually needed for the Gaussian SCS setup; this is the credit slippage flagged in §1. Beyond linear stability, the chaotic nature of the new phase is established by computing the maximum Lyapunov exponent $\\lambda_{\\max}$ for the tangent-space dynamics under the same DMFT closure: SCS show that $\\lambda_{\\max}\u003e0$ for all $g\u003e1$, with $\\lambda_{\\max}\\sim (g-1)$ near threshold, a square-root in $|\\lambda_{\\max}|$ that mirrors the bifurcation of $C(\\infty)$ from zero. The two statements — non-trivial $C(\\infty)$ branch and positive $\\lambda_{\\max}$ — together constitute \"chaos\" in the SCS sense and exhaust the analytical content of the 1988 Letter [1]. Everything else in the dossier — driven networks [11, 12], sparse and excitatory–inhibitory extensions [13], optimal sequence memory at criticality [14], the reframing as predictable mean-field chaos [10] — is built on this scaffold."}, {"id": "predictable-mean-field-trajectory", "title": "The Mean-Field Trajectory Is Not Stochastic: Untangling Two Senses of 'Chaos'", "markdown": "## The Mean-Field Trajectory Is Not Stochastic: Untangling Two Senses of 'Chaos'\n\nThe 1988 Letter's title — *Chaos in Random Neural Networks* [1] — bundles two objects that the modern literature regularly confuses. The first is a property of the finite‑$N$ deterministic flow $\\dot x_i = -x_i + \\sum_j J_{ij}\\phi(x_j)$: for $g\u003e1$ the maximum Lyapunov exponent is strictly positive and infinitesimally close initial conditions separate exponentially. This is *deterministic chaos* in the textbook sense of Lorenz, Ruelle, and Eckmann. The second is the $N\\to\\infty$ object that DMFT actually computes: the two‑time autocorrelation $C(t,t') = N^{-1}\\sum_i \\overline{x_i(t)x_i(t')}$ (overbar = disorder average). In the stationary phase this depends only on $\\tau=t-t'$, and it satisfies a *purely deterministic* ordinary differential equation in $\\tau$ — a single trajectory, fixed once and forever by its own past, with no noise term, no random initial condition surviving the average, no stochastic kernel. The collision of these two senses inside one word is the source of more confusion than any other feature of the SCS construction, and it is the precise point Yadav, Shaidurov \u0026 Kadmon [10] take aim at when they rebrand the phenomenon \"predictable mean‑field chaos.\"\n\nIt is worth being mechanical about how the layers separate. The MSR/Janssen–De Dominicis generating functional [5, 6] averages $e^{i\\int J \\cdot \\text{stuff}}$ over the Gaussian couplings, leaving an effective single‑neuron action whose Euler–Lagrange equation is the colored‑noise Langevin process\n\n$$(\\partial_t + 1)\\,x(t) = \\eta(t), \\qquad \\langle \\eta(t)\\eta(t')\\rangle = g^2\\, C_\\phi(t,t'),$$\n\nwith the self‑consistency closure $C_\\phi(t,t') = \\langle \\phi(x(t))\\phi(x(t'))\\rangle_\\eta$. This is the Sompolinsky–Zippelius closure transplanted from the spin glass [8, 7]. So *layer 2* — the effective single‑neuron process — is genuinely stochastic: $x(t)$ is a random variable, $\\eta$ is a Gaussian noise with non‑white covariance, and any individual realization of $x(t)$ exhibits non‑repeating fluctuations of order $\\sqrt{q_0}$. A reader who stops here is entitled to think DMFT replaces deterministic chaos with stochastic dynamics, and many pedagogical accounts unfortunately do stop here.\n\nBut the noise covariance $C_\\phi$ is itself the object DMFT solves for. Imposing stationarity, defining $C(\\tau) = \\langle x(t)x(t+\\tau)\\rangle_\\eta$, and Wick‑contracting the jointly Gaussian pair $(x(t),x(t+\\tau))$ against $\\phi=\\tanh$ gives the Newton‑form ODE\n\n$$\\ddot C(\\tau) \\;=\\; C(\\tau)\\; -\\; g^2\\,\\mathcal{F}\\!\\big(C(\\tau),\\,q_0\\big),$$\n\nwhere $\\mathcal{F}(C,q_0) = \\langle\\phi(u_1)\\phi(u_2)\\rangle$ with $(u_1,u_2)$ centered Gaussian of variance $q_0=C(0)$ and covariance $C$. Reading this as a Newtonian particle in pseudo‑time $\\tau$ with potential $V(C) = -\\tfrac{1}{2}C^2 + g^2 \\int_0^{C}\\!\\mathcal{F}(C',q_0)\\,dC'$, energy conservation $E=\\tfrac{1}{2}\\dot C^2 + V(C)$ becomes an exact identity, and the chaotic phase is precisely the *separatrix* solution: $\\dot C(0)=0$ (from time‑reversal symmetry of the stationary state), $C(0)=q_0$ tuned so that $E=V(0)$, and $C(\\tau)\\to 0$ monotonically as $\\tau\\to\\infty$ [1, 9]. This is *layer 3* — the order parameter — and it is unambiguously deterministic. Given two numbers, $q_0$ and $\\dot C(0)=0$, the function $C(\\tau)$ is uniquely determined by the Newton ODE for all $\\tau\\geq 0$.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003cdefs\u003e\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003ctext x=\"360\" y=\"20\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"sans-serif\"\u003eThree layers of the SCS construction\u003c/text\u003e\u003crect x=\"20\" y=\"40\" width=\"200\" height=\"180\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"120\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eL1: finite N\u003c/text\u003e\u003ctext x=\"120\" y=\"78\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003edeterministic ODE in R^N\u003c/text\u003e\u003cpath d=\"M 40 170 Q 70 150 95 165 T 140 130 T 200 115\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"1.5\"/\u003e\u003cpath d=\"M 40 172 Q 70 165 95 138 T 140 188 T 200 165\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"1.5\"/\u003e\u003cpath d=\"M 40 174 Q 70 192 95 178 T 140 200 T 200 145\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"120\" y=\"208\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eλ_max \u0026gt; 0 (Lyapunov chaos)\u003c/text\u003e\u003cline x1=\"222\" y1=\"130\" x2=\"258\" y2=\"130\" stroke=\"#e8e6e1\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/\u003e\u003ctext x=\"240\" y=\"120\" fill=\"#e8e6e1\" font-size=\"10\" text-anchor=\"middle\"\u003eN→∞,\u003c/text\u003e\u003ctext x=\"240\" y=\"146\" fill=\"#e8e6e1\" font-size=\"10\" text-anchor=\"middle\"\u003eMSR / disorder avg\u003c/text\u003e\u003crect x=\"260\" y=\"40\" width=\"200\" height=\"180\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"360\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eL2: effective SDE\u003c/text\u003e\u003ctext x=\"360\" y=\"78\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003ecolored-noise Langevin\u003c/text\u003e\u003cpath d=\"M 275 160 L 280 168 L 285 152 L 290 172 L 295 158 L 300 178 L 305 150 L 310 170 L 315 142 L 320 168 L 325 138 L 330 165 L 335 132 L 340 160 L 345 128 L 350 155 L 355 124 L 360 150 L 365 120 L 370 145 L 375 116 L 380 142 L 385 112 L 390 138 L 395 108 L 400 135 L 405 105 L 410 132 L 415 100 L 420 128 L 425 96 L 430 125 L 440 120\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"360\" y=\"208\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003ex(t) is a random variable\u003c/text\u003e\u003cline x1=\"462\" y1=\"130\" x2=\"498\" y2=\"130\" stroke=\"#e8e6e1\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/\u003e\u003ctext x=\"480\" y=\"120\" fill=\"#e8e6e1\" font-size=\"10\" text-anchor=\"middle\"\u003enoise-average\u003c/text\u003e\u003ctext x=\"480\" y=\"146\" fill=\"#e8e6e1\" font-size=\"10\" text-anchor=\"middle\"\u003e⟨x(t)x(t+τ)⟩\u003c/text\u003e\u003crect x=\"500\" y=\"40\" width=\"200\" height=\"180\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"600\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eL3: C(τ)\u003c/text\u003e\u003ctext x=\"600\" y=\"78\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eNewton ODE, deterministic\u003c/text\u003e\u003cline x1=\"520\" y1=\"195\" x2=\"690\" y2=\"195\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"520\" y1=\"195\" x2=\"520\" y2=\"95\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"694\" y=\"200\" fill=\"#e8e6e1\" font-size=\"11\"\u003eτ\u003c/text\u003e\u003ctext x=\"510\" y=\"92\" fill=\"#e8e6e1\" font-size=\"11\"\u003eC\u003c/text\u003e\u003cpath d=\"M 520 100 Q 550 105 590 130 T 670 188\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.2\"/\u003e\u003ccircle cx=\"520\" cy=\"100\" r=\"3\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"535\" y=\"103\" fill=\"#e8e6e1\" font-size=\"10\"\u003eq_0\u003c/text\u003e\u003cline x1=\"520\" y1=\"188\" x2=\"690\" y2=\"188\" stroke=\"#ff7a90\" stroke-width=\"0.8\" stroke-dasharray=\"3,3\"/\u003e\u003ctext x=\"660\" y=\"183\" fill=\"#ff7a90\" font-size=\"10\"\u003eC(∞) = 0\u003c/text\u003e\u003ctext x=\"120\" y=\"245\" fill=\"#7aa2ff\" font-size=\"12\" text-anchor=\"middle\"\u003echaotic (sensitive)\u003c/text\u003e\u003ctext x=\"360\" y=\"245\" fill=\"#7ee0a3\" font-size=\"12\" text-anchor=\"middle\"\u003estochastic (random)\u003c/text\u003e\u003ctext x=\"600\" y=\"245\" fill=\"#ffb86b\" font-size=\"12\" text-anchor=\"middle\"\u003epredictable (Newton)\u003c/text\u003e\u003ctext x=\"360\" y=\"290\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"middle\"\u003eStationary closure: C̈(τ) = C(τ) − g² ⟨ φ(u₁) φ(u₂) ⟩, Cov(u₁,u₂) = C(τ)\u003c/text\u003e\u003ctext x=\"360\" y=\"312\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eConserved E = ½ Ċ² + V(C); chaotic phase = separatrix joining (q_0, 0) to (0, 0)\u003c/text\u003e\u003ctext x=\"360\" y=\"350\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eL1 ≠ L2 ≠ L3. \"Chaos\" in SCS lives at L1. The Yadav–Shaidurov–Kadmon framing\u003c/text\u003e\u003ctext x=\"360\" y=\"370\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003eemphasizes the exact predictability of L3 despite the chaos of L1.\u003c/text\u003e\u003c/svg\u003e\n*Figure: The three layers separated by DMFT. The finite‑$N$ flow (L1) is deterministic and Lyapunov‑chaotic; the effective single‑neuron process (L2) is genuinely stochastic, driven by colored Gaussian noise whose covariance must be solved for self‑consistently; the disorder‑ and noise‑averaged autocorrelation $C(\\tau)$ (L3) obeys a deterministic Newton‑form ODE and is the separatrix solution of an effective conservative mechanical problem.*\n\nThe Yadav–Shaidurov–Kadmon 2026 contribution [10] is, in this language, an insistence that L3 be *named* for what it is. They emphasize three things that the SCS literature carries implicitly and that the reservoir‑computing and machine‑learning literature tends to drop. (i) The map $\\{C(s):s\\le \\tau\\}\\mapsto C(\\tau+\\Delta)$ is single‑valued and deterministic; the mean‑field trajectory does not branch and does not depend on which realization of $J$ one drew at $t=-\\infty$. (ii) The microscopic instability that gives $\\lambda_\\text{max}\u003e0$ at L1 lives entirely in the *fluctuations* about the mean‑field trajectory — fluctuations that are subleading at $N\\to\\infty$ and whose statistics are themselves controlled by a deterministic two‑replica DMFT (the same machinery used by Crisanti \u0026 Sompolinsky to compute $\\lambda_\\text{max}$ from the largest eigenvalue of a linear stability kernel built out of $C(\\tau)$). (iii) Reframing L3 as a predictable trajectory makes finite‑$N$ corrections the natural object of study: one expands around the deterministic mean‑field path, picks up Gaussian fluctuations of order $N^{-1/2}$, and recovers the microscopic chaos as a *boundary* phenomenon — the separatrix being structurally unstable to those fluctuations.\n\nThis separation also clears up several adjacent confusions. The DMFT effective process at L2 is sometimes described as a \"stochastic neural network\" or even a \"Langevin reservoir,\" and one occasionally reads that SCS chaos is somehow noise‑induced. It is not. The original microscopic system [1] contains no noise; the colored‑noise Langevin at L2 is a representation of the disorder‑averaged statistics of the *deterministic* finite‑$N$ flow, not a model of a noisy network. (Genuinely noise‑driven SCS networks — Molgedey–Schuchhardt–Schuster [11], later Rajan–Abbott–Sompolinsky [12], and the driven‑network extensions of Schuecker–Goedeke–Helias [14] — are a separate construction in which external white noise or time‑dependent input is added to the microscopic ODE, and there the chaotic phase can be *suppressed*.) Likewise, the statement sometimes encountered that \"DMFT replaces the chaotic attractor with a stochastic process\" is at best a half‑truth: the *single‑neuron marginal* at L2 is stochastic, but the *order parameter* at L3 is not, and it is L3 that the textbook bifurcation diagram of SCS actually plots.\n\nValidity audit. The L3 = deterministic Newton ODE statement is exact only in the limits $N\\to\\infty$, strict stationarity, and self‑averaging of the empirical two‑time correlator (verified for i.i.d. Gaussian $J_{ij}$ with $\\overline{J_{ij}^2}=g^2/N$; universality under the Lindeberg condition is expected but the corpus here does not pin down a complete proof beyond Gaussian). At finite $N$, fluctuations of $C_N(\\tau)$ around the DMFT solution scale as $N^{-1/2}$ and acquire their own non‑trivial dynamics — the regime where L1 and L3 begin to mix, and where the [10] reframing has the most teeth. In structurally non‑stationary regimes (transients out of arbitrary initial conditions, driven networks with non‑adiabatic inputs, or networks with low‑rank perturbations), the two‑time $C(t,t')$ no longer reduces to a single‑variable $C(\\tau)$ and the Newton form is replaced by a partial integro‑differential equation that is still deterministic but no longer mechanically conservative. The slogan \"the mean‑field trajectory is not stochastic\" survives intact; the elegant Newton form does not."}, {"id": "evolution-and-supersession", "title": "What Superseded What: Path Integrals, Discrete-Time Bifurcations, and Driven Networks", "markdown": "## What Superseded What: Path Integrals, Discrete-Time Bifurcations, and Driven Networks\n\nThe 1988 Letter [1] is a saddle-point calculation. Stripped of compression, the argument is: write the disorder-averaged generating functional for the firing-rate ODE, decouple sites via a Hubbard–Stratonovich field whose variance is $g^2 C(t,t')$, find the saddle by varying the action with respect to $C$ and the response $R$, and obtain — in the stationary, causal, time-translation-invariant regime where $R\\to 0$ outside equal times — a closed equation for the autocorrelation alone. That equation, the Newton-form\n\n$$\\ddot C(\\tau) = -\\frac{\\partial V[C;C_0]}{\\partial C}, \\qquad V[C;C_0] = -\\tfrac{1}{2}C^2 + g^2\\,\\Phi(C,C_0),$$\n\nwith $\\Phi$ the Gaussian average of the squared transfer function, is what every subsequent paper either reuses, re-derives, or perturbs. The technical history of the field from 1988 to the present is essentially the history of how this single equation was generalized, formalized, and — only rarely — corrected.\n\n### From saddle point to honest path integral\n\nThe original derivation cuts corners that were tolerable in a three-page Letter but accumulated questions over thirty years: the response function is assumed to vanish in the chaotic phase by hand, the Jacobian from the change of variables $\\xi_i = \\dot x_i + x_i - g\\sum_j J_{ij}\\phi(x_j)$ to a Gaussian field is not written out, and the meaning of the saddle for an out-of-equilibrium, non-time-reversal-symmetric problem is left implicit. The MSR–Janssen–De Dominicis machinery [5, 6] supplies the missing scaffolding: a doubled field $(x_i,\\hat x_i)$, an action $S[x,\\hat x] = \\sum_i \\hat x_i(\\dot x_i + x_i) - \\tfrac{1}{2} g^2 \\sum_{ij}\\hat x_i \\hat x_j \\phi(x_i)\\phi(x_j) + \\dots$ after averaging $J_{ij}$, and a Hubbard–Stratonovich step that introduces order parameters $Q_{ab}(t,t') = \\tfrac{1}{N}\\sum_i \\psi_i^a(t)\\psi_i^b(t')$ with $\\psi^a \\in\\{x,\\hat x\\}$. The saddle then reads off as the leading $N$ contribution; corrections are organized as a $1/N$ loop expansion.\n\nThe Crisanti–Sompolinsky 2018 re-derivation in *Physical Review E 98, 062120* (verify) is the canonical modern statement of this program for the SCS network. Mechanically it reproduces the 1988 Newton-form ODE, but it does so with three improvements that the Letter could not: (i) the vanishing of $R(t,t')$ outside the diagonal in the chaotic phase emerges as a consequence of causality plus stationarity, not an assumption; (ii) the parametric structure of the effective single-site stochastic ODE,\n\n$$\\dot\\eta(t) + \\eta(t) = \\xi(t), \\qquad \\langle\\xi(t)\\xi(t')\\rangle = g^2 \\Phi(C(t,t'),C(t,t),C(t',t')),$$\n\nis laid bare as a Gaussian colored-noise problem whose two-time autocorrelation must close on itself self-consistently; (iii) Lyapunov spectra and finite-$N$ corrections become computable in principle from the bilinear-in-$\\hat x$ part of the action. The Helias school [14] (Schuecker–Goedeke–Helias 2018) had already pushed this style of derivation through for the driven case, and Helias \u0026 Dahmen's *Statistical Field Theory for Neural Networks* (Springer 2020) (verify) is now the standard pedagogical reference. The 1988 saddle-point reading is not wrong — it gives the right answer — but as a derivation it is superseded.\n\n### Noise as a control parameter: Molgedey–Schuchhardt–Schuster, 1992\n\nMolgedey, Schuchhardt and Schuster [11] added an additive Gaussian white noise of strength $\\sigma$ to each neuron and asked whether the chaotic attractor survives. Within DMFT the modification is minimal: the effective single-site equation acquires a white-noise term, the autocorrelation ODE picks up a $\\sigma^2 \\delta(\\tau)$ source, and the chaotic phase shrinks as $\\sigma$ grows. The phase boundary deforms into a curve in the $(g,\\sigma)$ plane along which the maximal Lyapunov exponent vanishes; for sufficiently large $\\sigma$ the only fixed point of the order-parameter ODE is $C\\equiv$ const, i.e. a stationary noise-driven state with no slow chaotic component. The 1992 paper is the first DMFT extension of SCS to a driven network and remains canonical for the statement *external noise quenches deterministic chaos*. It was not superseded — it was generalized: Rajan–Abbott–Sompolinsky [12] later showed the same suppression for *coherent* time-dependent inputs, and Schuecker–Goedeke–Helias [14] proved that memory capacity is maximized along the suppressed-chaos boundary.\n\n### The discrete-time branch: Doyon–Cessac–Quoy–Samuelides, 1993–95\n\nA parallel program in Toulouse/Bordeaux replaced the continuous-time firing-rate ODE with the discrete-time map\n\n$$x_i(t+1) = \\sum_j J_{ij}\\,\\phi(x_j(t)),$$\n\nand analyzed the loss of stability of the trivial fixed point as $g$ grows. Because the linearization is a non-Hermitian Gaussian matrix whose eigenvalues fill the Ginibre/Girko disk [4, 3], the first eigenvalue to cross the unit circle is generically a complex-conjugate pair: the bifurcation is a Neimark–Sacker (discrete Hopf), producing a quasi-periodic torus that subsequently breaks down to chaos through the Ruelle–Takens–Newhouse scenario. Doyon, Cessac, Quoy and Samuelides (*Int. J. Bifurc. Chaos* 3, 279, 1993) and Cessac (*J. Physique I* 5, 409, 1995) (verify both) computed Lyapunov spectra rigorously and tracked the route to chaos numerically. Two things are worth saying plainly. First, this picture is *not* the continuous-time SCS picture: the SCS bifurcation in continuous time is a transition from a stable fixed point directly to chaotic activity with no intervening torus, because the spectrum that matters is that of $-I + g\\,\\phi'(0)\\,J$ and the relevant crossing is of the imaginary axis, not the unit circle. Second, the discrete-time picture has been largely absent from the modern ML-flavored revival, even though discrete-time recurrent networks are precisely what is simulated. Where the two pictures touch — large time step, small leak — the Cessac analysis is the rigorous statement; SCS is the small-step limit. Neither was superseded by the other; they were never fully reconciled in print.\n\n### Stimulus-driven networks: Rajan–Abbott–Sompolinsky, 2010\n\nRajan, Abbott and Sompolinsky [12] asked what happens when a time-dependent input $I(t)$ is injected uniformly into the SCS network. Within DMFT the input shifts the mean of the Gaussian field at the single-site level, modulating $\\phi'$ along the trajectory and therefore the effective gain. Because $\\phi$ saturates, a strong input drives neurons into the flat regions of $\\phi$, reducing the effective $g\\,\\langle\\phi'^2\\rangle^{1/2}$ below unity and quenching the chaotic phase. The paper is the first quantitative statement of *stimulus-dependent suppression of chaos* and is the technical anchor for the computational slogan \"operating near the edge of chaos is useful\" — a slogan that, as the credit audit notes, originates with Langton/Packard for cellular automata and only became precise for SCS-class networks after 2010. The Rajan–Abbott–Sompolinsky construction was not superseded; it was extended to spatially structured inputs by later authors and to optimal sequence-memory statements by Schuecker–Goedeke–Helias [14].\n\n### Sparse and E/I extensions: Kadmon–Sompolinsky, 2015\n\nThe 1988 model assumes dense, fully connected, zero-mean Gaussian couplings — a setting in which the spectrum is the Ginibre disk and the DMFT closure is one-dimensional in the order parameter. Kadmon and Sompolinsky [13] relaxed this in two directions simultaneously: sparse connectivity (each neuron receives $K\\ll N$ inputs) and Dale-compliant excitation/inhibition (separate $E$ and $I$ populations with sign-constrained synapses). Both modifications change the spectrum — sparse non-Hermitian matrices have spectra that deviate from a uniform disk, and E/I splitting introduces an outlier eigenvalue that can drive a separate fixed-point instability — and both require a multi-population DMFT in which the order parameter is a matrix $C_{\\alpha\\beta}(\\tau)$ over population labels. The paper's substantive new finding is the existence of *two* chaotic regimes separated by a slow-fluctuation onset: a fast, microscopically-decorrelated regime continuous with SCS, and a slow, population-coherent regime that has no counterpart in the dense model. This was a genuine extension, not a correction; the dense SCS theory remains the $K\\to N$, single-population limit.\n\n### What remains canonical\n\nThe Newton-form autocorrelation ODE of SCS 1988 [1] survives intact as the leading-$N$ DMFT closure; the saddle-point derivation of 1988 has been superseded as a *derivation* by the MSR–Janssen–De Dominicis path integral [5, 6] in its modern Crisanti–Sompolinsky 2018 / Helias–Dahmen presentation; the noise-suppression result of Molgedey–Schuchhardt–Schuster [11] is canonical and was generalized rather than corrected; the discrete-time Neimark–Sacker route of the French school is rigorous in its own setting and remains the right account whenever the time step is not small; Rajan–Abbott–Sompolinsky [12] is canonical for stimulus-driven SCS networks; Kadmon–Sompolinsky [13] is canonical for sparse and E/I extensions; and Schuecker–Goedeke–Helias [14] is the canonical statement that memory capacity peaks at the suppressed-chaos boundary. The 2026 Yadav–Shaidurov–Kadmon reframing [10] does not supersede any of these — it sharpens the interpretation of what the deterministic order-parameter ODE actually predicts, which is the subject of §3 and §6."}, {"id": "landmark-numerical-experiments", "title": "Landmark Numerical Experiments and the Edge-of-Chaos Computational Claim", "markdown": "## Landmark Numerical Experiments and the Edge-of-Chaos Computational Claim\n\nA theorist reading the 1988 Letter [1] could be forgiven for thinking the matter settled: a saddle point, a Newton-form ODE for $C(\\tau)$, a bifurcation at $g=1$, a positive Lyapunov exponent in the chaotic phase. In fact the analytical apparatus delivered only the *order parameter*. The microscopic chaos — its Lyapunov spectrum, its dimension, its dependence on $N$, its response to drive, its computational utility — had to be measured. The body of numerical work that did the measuring, spanning roughly 1988 through the present, is what turned SCS chaos from a phase-diagram cartoon into a quantitative phenomenology. This section catalogues those experiments and is careful, throughout, to flag a distinction the literature blurs: these are computer simulations of a postulated model, not biological measurements. The wet-lab analogue is missing in a way that matters.\n\n### The first wave: confirming the Newton-form ODE and the $g=1$ bifurcation\n\nSCS 1988 [1] itself contains the prototypical experiment. Integrate the firing-rate ODE\n$$\\dot{x}_i = -x_i + \\sum_{j=1}^{N} J_{ij}\\,\\phi(x_j), \\qquad J_{ij}\\sim\\mathcal{N}(0, g^2/N),$$\nfor $\\phi=\\tanh$ at moderate $N$ (a few hundred), compute the empirical autocorrelation $\\hat{C}(\\tau)=\\langle x_i(t)x_i(t+\\tau)\\rangle$, and overlay the DMFT prediction obtained by integrating the Newton-form equation\n$$\\ddot{C}(\\tau) = -\\,\\partial_{C}V(C;\\,g),$$\nwith $V$ the SCS potential. The agreement is excellent already at $N\\sim 10^2$ and becomes essentially perfect at $N\\sim 10^3$. What this experiment establishes is not the existence of chaos — for that one needs a Lyapunov calculation — but the *self-averaging* of the autocorrelation: a single realization of disorder, run long enough, reproduces the disorder-averaged DMFT curve. This is the empirical content of the \"predictable\" in *predictable mean-field chaos* [10]: the order-parameter trajectory is unique, even though the microscopic trajectories diverge exponentially.\n\nThe Lyapunov experiment, missing from the 1988 Letter, was supplied by Sompolinsky and collaborators and elaborated by the French school of Cessac, Doyon, Quoy and Samuelides in the early 1990s (verify). One integrates the variational equation alongside the dynamics, Gram–Schmidt-orthonormalizes the tangent vectors at fixed intervals, and accumulates the logarithmic growth rates. The findings, by now textbook:\n\n1. $\\lambda_{\\max}(g)$ rises continuously from zero at $g=1$; near the bifurcation the scaling is consistent with $\\lambda_{\\max}\\propto(g-1)^{2}$, matching the DMFT prediction obtained by linearizing around the trivial fixed point of $C(\\tau)$.\n2. The Lyapunov spectrum is broadband: an extensive number of exponents are positive, and the Kaplan–Yorke dimension grows linearly with $N$, $D_{\\mathrm{KY}}\\sim \\alpha(g) N$. The attractor is high-dimensional, not low-dimensional in the Lorenz sense — a fact one cannot read off from the scalar $C(\\tau)$.\n3. Finite-$N$ corrections to $\\lambda_{\\max}$ scale as $N^{-1/2}$ at fixed $g\u003e1$, consistent with a Gaussian central limit on the disorder average. Near $g=1$ the scaling crosses over to $N^{-1/3}$, the standard finite-size signature of a mean-field bifurcation.\n\n### Driven networks: Molgedey–Schuchhardt–Schuster, Rajan–Abbott–Sompolinsky, Schuecker–Goedeke–Helias\n\nThe pivot from autonomous to driven dynamics was numerical before it was analytical. Molgedey, Schuchhardt and Schuster [11] showed in 1992 that injecting i.i.d. Gaussian noise of variance $\\sigma^2$ at each neuron pushes the chaotic boundary upward: the critical gain becomes $g_c(\\sigma)\u003e1$, monotonically increasing. Their figures — Lyapunov exponent versus $g$ at several $\\sigma$ — are the canonical pictures of *noise-induced suppression of chaos*. The DMFT extension is straightforward (the noise adds a constant to the source term in the effective single-neuron Langevin equation) but the simulation came first.\n\nRajan, Abbott and Sompolinsky [12] generalised this in 2010 to *time-dependent* drive. The simulation protocol is clean: inject a deterministic input $I_i(t)$ — sinusoidal, or low-pass-filtered noise — and measure both $\\lambda_{\\max}$ and the cross-trial variance $\\Delta(t)=\\langle(x_i^{(1)}(t)-x_i^{(2)}(t))^2\\rangle$ across independent initial conditions sharing the same disorder and same input. They observed that sufficiently strong input quenches $\\lambda_{\\max}$ to negative values, and that the quenching threshold depends on the input's frequency content — slow inputs are less effective than fast ones at the same RMS amplitude. This is the numerical bedrock of the \"stimulus-suppresses-chaos\" picture and, by inversion, of the proposal that input-driven RNNs naturally sit at the *edge* of the chaotic regime.\n\nSchuecker, Goedeke and Helias [14] sharpened the edge-of-chaos claim into a memory-capacity statement in 2018. Their key numerical object is the linear memory function $m(\\tau) = \\mathrm{Corr}(u(t-\\tau),\\hat{u}(t))$, where $\\hat{u}$ is the readout's best linear reconstruction of an i.i.d. Gaussian input $u$ injected through random weights. Integrated memory capacity $M=\\sum_\\tau m(\\tau)$ is computed by simulation at varying $g$ and input variance, and compared to a path-integral prediction. Two findings carry the weight:\n\n1. $M(g)$ peaks sharply at the input-shifted critical gain $g_c(\\sigma)$, not at $g=1$. The peak is the *quantitative* edge-of-chaos statement.\n2. The peak is finite — capacity does not diverge at criticality. This kills a folk version of the claim (\"memory blows up at the edge\") that one occasionally encounters in the reservoir-computing literature.\n\nThe Kadmon–Sompolinsky 2015 paper [13] supplied the matching numerics for sparse and excitation–inhibition-segregated architectures, demonstrating that two distinct chaotic regimes exist (a fast onset and a slow-fluctuation onset separated by a crossover in $C(\\tau)$), and that the SCS phase diagram survives sparsification provided the variance of $J_{ij}$ is rescaled appropriately.\n\n### The Toyoizumi–Abbott separation/expressivity numerics\n\nA separate strand of simulation, often grouped under the heading *separation property*, asks not how long the network remembers a single scalar but how distinguishable its responses are to nearby inputs. Toyoizumi and Abbott (2011) (verify) measured $\\Delta(t)=\\|x^{(1)}(t)-x^{(2)}(t)\\|^2$ for two trajectories driven by inputs differing by $\\epsilon$, as a function of $g$, and showed that the *separation gain* $\\partial_t \\log\\Delta\\big|_{t=0}$ is maximal in the vicinity of $g_c(\\sigma)$. This is the expressivity-side complement of the Schuecker–Goedeke–Helias memory-side picture: one quantity (memory) integrates the past, the other (separation) discriminates between possible pasts, and both peak in the same region. The two-sided coincidence is what gives the \"edge-of-chaos computation\" slogan its rhetorical force; it is, strictly, a numerical observation about specific input ensembles, not a theorem.\n\n### What the simulations did *not* establish — and the missing biological analogue\n\nA validity audit is in order. Three distinctions the numerical literature does not always honour:\n\n- *Lyapunov exponent vs. KS entropy.* Most \"chaos confirmed\" plots report only $\\lambda_{\\max}$. The Pesin equality $h_{\\mathrm{KS}}=\\sum_{\\lambda_i\u003e0}\\lambda_i$ holds only for SRB measures; whether the SCS attractor admits one is, strictly, open. Reported KS entropies are sums of positive Lyapunov exponents, which is a *bound*, not necessarily an equality.\n- *Edge-of-chaos at finite $N$ vs. at $N\\to\\infty$.* The peak of $M(g)$ in [14] sits at $g_c(\\sigma)$ only after $N$ is taken large; at $N\\sim 200$ the peak is broad and shifted. Claims that biological cortex \"operates at the edge\" inherit this $N$-dependence without acknowledgement.\n- *Simulation $\\neq$ experiment.* Every numerical result reviewed here is a simulation of the SCS-class ODE or a near-cousin. None of it is a measurement on a biological network. The closest experimental analogues are the cortical-variability statistics of Shadlen and Newsome [15], which establish that *in vivo* spike trains are noisy and broadband but do not, on their own, identify a deterministic chaotic substrate, a DMFT order parameter, or a $g=1$ bifurcation. The literature occasionally elides this gap by treating Shadlen–Newsome variability as evidence *for* SCS chaos; it is consistent with that picture but does not select it from alternatives (balanced-state asynchronous irregularity, stochastic single-cell noise, sampling-based inference). The honest statement is that the SCS phenomenology is a richly tested *theoretical* object whose biological status remains, in 2026, an inference rather than a measurement."}, {"id": "conflations-and-validity-audit", "title": "Conflation Watch and Validity Audit: Five Confusions That Persist in the Literature", "markdown": "## Conflation Watch and Validity Audit: Five Confusions That Persist in the Literature\n\nThe SCS theory [1] has been retold so many times, in so many adjacent communities — statistical physics, computational neuroscience, machine learning, dynamical systems — that its assumptions have been quietly shed in transit. What follows is a regime-by-regime audit of the five confusions that recur most often in the modern literature, with the loci where each fails.\n\n### Confusion 1: Microscopic chaos vs mean-field \"chaos\"\n\nThe 1988 Letter [1] proves two distinct statements, and the word *chaos* attaches to both.\n\n(a) *Microscopic, finite-$N$ chaos.* The deterministic ODE $\\dot{x}_i = -x_i + g\\sum_j J_{ij}\\phi(x_j)$ has, for $g\u003e1$ and almost every realization of $J$, a positive maximum Lyapunov exponent $\\lambda_{\\max}\u003e0$ — sensitive dependence on $x(0)$, exponential trajectory divergence, a strange attractor in $\\mathbb{R}^N$. This is \"chaos\" in the textbook Ruelle–Eckmann sense.\n\n(b) *Mean-field \"chaos\".* In the $N\\to\\infty$ DMFT limit, the disorder-averaged autocorrelation $C(\\tau) = \\langle x_i(t)x_i(t+\\tau)\\rangle$ satisfies a deterministic, second-order ODE of Newton type,\n$$\\ddot{C}(\\tau) = C(\\tau) - g^2 f\\!\\big(C(\\tau),C(0)\\big),$$\nwith $f$ a Gaussian average over $\\phi$. For $g\u003e1$ the only physical solution has $C(\\tau)\\to 0$ as $\\tau\\to\\infty$ — decorrelation, not divergence.\n\nThese are not the same object. (a) is a property of a sample trajectory; (b) is a property of an averaged statistic. Yadav–Shaidurov–Kadmon [10] make the rebranding sharp: the *mean-field trajectory of the order parameter* is **predictable** — uniquely fixed by its past — even though the *microscopic state* it summarizes is Lyapunov-chaotic. Calling $C(\\tau)$ \"chaotic\" because it descends from chaotic microscopics is a category error analogous to calling the Boltzmann distribution \"chaotic\" because the underlying Hamiltonian dynamics is.\n\nValidity boundary: the equivalence $\\lambda_{\\max}\u003e0 \\Leftrightarrow g\u003e1$ is rigorous only in the SCS regime — i.i.d. Gaussian $J_{ij}$ with zero mean and variance $1/N$, smooth bounded $\\phi$, continuous time, autonomous. Driven networks (Molgedey–Schuchhardt–Schuster [11]; Rajan–Abbott–Sompolinsky [12]; Schuecker–Goedeke–Helias [14]) shift the bifurcation; structured connectivity (Kadmon–Sompolinsky [13]) splits it.\n\n### Confusion 2: SCS $g=1$ vs Langton/Packard \"edge of chaos\" vs Jaeger/Maass echo-state property\n\nThree separate criteria, three separate communities, one slogan.\n\n| Criterion | System | Statement | Reference |\n|---|---|---|---|\n| SCS $g=1$ | Continuous-time, autonomous, fully connected, Gaussian $J$, smooth $\\phi$ | DMFT bifurcation: spectral radius of $g\\phi'(0)J$ crosses 1; $C(\\tau)$ acquires a non-trivial fixed point | [1] |\n| Langton/Packard edge of chaos | Discrete cellular automata | $\\lambda$-parameter that interpolates ordered $\\to$ complex $\\to$ chaotic rules | Langton 1990, Packard 1988 (verify) |\n| Jaeger/Maass echo-state property | Discrete-time, driven, often sparse, linear-stability of the zero state | Spectral radius of $W$ less than 1 ensures fading memory and input-driven contraction | Jaeger 2001, Maass et al. 2002 (verify) |\n\nThe echo-state condition is a *sufficient* condition for fading memory of a driven discrete map; SCS is a *necessary and sufficient* DMFT bifurcation for an autonomous continuous flow. Identifying them ignores three things. First, the echo-state criterion lives in discrete time with input drive; SCS is autonomous continuous time. Second, the echo-state criterion uses the spectral radius of $W$ directly; SCS uses the spectral radius of $g\\phi'(0)J$ — the nonlinearity gain $\\phi'(0)$ is load-bearing. Third, Langton's $\\lambda$-parameter has no continuous analogue at all; it indexes rule space, not weight space.\n\nRigorous bridges exist only piecemeal: Toyoizumi–Abbott (2011) (verify) and Schuecker–Goedeke–Helias [14] showed that *memory capacity* for sequence-reconstruction peaks at the SCS transition when the network is driven by Gaussian inputs — but this is a statement about a driven extension of SCS, not about reservoir computing with arbitrary inputs and outputs.\n\nModern reservoir-computing papers routinely cite SCS [1] as theoretical justification for tuning the spectral radius of a discrete-time echo-state reservoir to unity. The folklore is useful; the theorem is not what they think it is.\n\n### Confusion 3: Ginibre vs Girko attribution\n\nThe linear-stability calculation at $g=1$ uses the circular law: the eigenvalues of $J/\\sqrt{N}$ for $J_{ij}\\sim\\mathcal{N}(0,1)$ i.i.d. fill the unit disk in $\\mathbb{C}$ with uniform density. The relevant result is **Ginibre 1965** [3], not Girko 1985 [4]. Ginibre computed the joint eigenvalue density for complex, real, and quaternion *Gaussian* ensembles directly; this is exactly the SCS setup. Girko's contribution was the much harder extension to non-Gaussian real i.i.d. entries with finite variance — a universality statement that SCS do not need.\n\nModern textbooks and review articles attach Girko's name to SCS because Girko was the first to prove the result *for non-Hermitian real matrices with general distribution*, and because the Soviet-era publication of Ginibre's paper in *J. Math. Phys.* was, for many statistical-physics audiences, less visible than the *Theor. Probab. Appl.* paper of Girko. This is a credit-assignment error, not a mathematical one: in the Gaussian SCS case, Ginibre suffices and predates by twenty years.\n\n### Confusion 4: The SCS model vs engineering reservoir/echo-state networks\n\nThe SCS network and the reservoir-computing reservoir share a sociological lineage but differ in every load-bearing assumption.\n\n| Property | SCS [1] | Reservoir / ESN |\n|---|---|---|\n| Time | Continuous | Discrete |\n| Drive | Autonomous | Input-driven |\n| Connectivity | Fully connected, dense | Often sparse |\n| Coupling distribution | Gaussian i.i.d., variance $1/N$ | Engineered; spectral radius rescaled post-hoc |\n| Nonlinearity | Smooth, odd, bounded $\\phi$ | Often $\\tanh$; sometimes ReLU, leaky, etc. |\n| Goal | Analytical tractability via DMFT | Universal function approximation under training |\n\nThe reservoir-computing literature borrows the *qualitative claim* — \"interesting computation lives near the chaotic transition\" — and the *quantitative threshold* — spectral radius near 1 — but the SCS proof transfers only when the reservoir is, in fact, a continuous-time, autonomous, Gaussian-coupled, fully-connected SCS network. Optoelectronic and delay-based reservoirs [16, 17] live in entirely different dynamical regimes; the SCS bifurcation does not control them. Citing [1] as a theorem for a generic ESN is a regime overreach.\n\n### Confusion 5: \"Mean-field\" as deterministic trajectory vs deterministic order parameter\n\nThe phrase *dynamical mean-field theory* invites a reading borrowed from equilibrium mean-field theory: replace the interaction with its average, get a deterministic single-neuron equation. This reading is wrong.\n\nThe DMFT effective process for a representative neuron is\n$$\\dot{x}(t) = -x(t) + \\eta(t), \\qquad \\langle\\eta(t)\\eta(t')\\rangle = g^2\\,\\langle\\phi(x(t))\\phi(x(t'))\\rangle,$$\na *stochastic* ODE driven by Gaussian colored noise $\\eta(t)$ whose covariance is determined self-consistently. The single-neuron trajectory $x(t)$ is a sample path of a non-Markov Gaussian process — not deterministic in any sense. What is deterministic is the *order parameter* $C(\\tau) = \\langle x(t)x(t+\\tau)\\rangle$, fixed by the Newton-form ODE above.\n\nThe Yadav–Shaidurov–Kadmon [10] reframing as \"predictable mean-field chaos\" makes this precise: the *order-parameter trajectory* is uniquely determined by its history (the second-order ODE plus initial conditions $C(0)$, $\\dot{C}(0)$), and in that sense the mean-field description is predictable; but the microscopic dynamics it summarizes is stochastic (effective DMFT) and chaotic (finite-$N$ Lyapunov). Three different statements live under one word *deterministic*, and the modern literature regularly conflates them.\n\nValidity boundary: the deterministic-$C(\\tau)$ statement is exact only at $N\\to\\infty$. Finite-$N$ corrections — $\\mathcal{O}(1/\\sqrt{N})$ fluctuations of $C(\\tau)$ around its mean — are not in the SCS Letter; Crisanti–Sompolinsky 2018 (verify) and the Helias path-integral school [14] provide the systematic loop expansion. Papers that quote the deterministic $C(\\tau)$ as if it held at finite $N$ are stripping the thermodynamic limit assumption from the statement."}, {"id": "current-frontier", "title": "Current Frontier: Structured Connectivity, Higher-Order Interactions, and Trainable Chaos", "markdown": "## Current Frontier: Structured Connectivity, Higher-Order Interactions, and Trainable Chaos\n\nThe SCS bifurcation [1] is a statement about i.i.d. Gaussian couplings in a fully connected, autonomous, continuous-time firing-rate ODE. Every adjective in that sentence has, in the last decade, been relaxed — and each relaxation has reopened questions that the 1988 saddle point answered only by assumption. The frontier is not whether chaos exists in random recurrent networks; it is what structure does to the SCS skeleton and, dually, what the SCS skeleton does to networks that have been trained, driven, or coupled beyond pairs.\n\n### Higher-order interactions and hypergraph DMFT\n\nThe pairwise sum $\\sum_j J_{ij}\\phi(x_j)$ is structural, not phenomenological: it encodes the assumption that recurrent input decomposes into independent two-body channels. Once one admits triadic or higher-order couplings $\\sum_{j\u003ck} K_{ijk}\\phi(x_j)\\phi(x_k)+\\cdots$, the Sompolinsky–Zippelius DMFT closure no longer self-consistently closes on the two-time function $C(\\tau)$ alone — higher-order Gaussian moments of the colored-noise effective process intrude, and the Newton-form ODE acquires explicit dependence on $C(\\tau)^{p-1}$ for $p$-body interactions. The review by Battiston *et al.* [18] surveys this combinatorial enrichment for synchronization and contagion, but it remains *folklore* (in the strict sense — circulated, not proved) that an SCS-style bifurcation at a single scalar gain survives in the higher-order setting. What is rigorous is restricted: spherical $p$-spin Crisanti–Sompolinsky calculations [9] give the analogous transition for purely $p$-body Gaussian couplings on the hypersphere, with critical gain $g_c$ shifting as a function of $p$ and the closure becoming a $C(\\tau)^{p-1}$-driven Newton equation. Translating that to firing-rate networks with bounded sigmoid nonlinearity is, as of 2026, partial. Adjacent rigorous work has appeared on dynamical cavity methods for continuous-time stochastic dynamics on sparse random hypergraphs [19], which sidesteps the dense-DMFT closure problem at the cost of giving up the closed self-consistent $C(\\tau)$.\n\n### Low-rank plus random: the Mastrogiuseppe–Ostojic programme\n\nA more controlled deformation writes $J = \\chi + \\frac{1}{N}\\sum_{r=1}^{R} m^{(r)} n^{(r)\\top}$, with $\\chi$ i.i.d. Gaussian and $R$ fixed as $N\\to\\infty$. Tao's deterministic-equivalent theorems guarantee that the bulk spectrum of $J$ is still Ginibre's disk [3]; the low-rank perturbation can only emit at most $R$ outlier eigenvalues. The interesting physics is that the *dynamics* split: a low-dimensional manifold spanned by the $\\{m^{(r)}\\}$ supports task-relevant structured trajectories, while the orthogonal complement remains governed by SCS chaos. Mastrogiuseppe \u0026 Ostojic's [Neuron 2018 construction](https://www.sciencedirect.com/science/article/pii/S0896627318305439) and the subsequent multi-population extensions ([Beiran et al. 2021](https://arxiv.org/abs/2007.02062); [Schuessler et al., Phys. Rev. Research 2020](https://link.aps.org/doi/10.1103/PhysRevResearch.2.013111)) derive a reduced DMFT in which the order parameter is the joint distribution of low-rank overlaps $\\kappa^{(r)}(t) = N^{-1}\\sum_i n^{(r)}_i \\phi(x_i(t))$, with the random part appearing only as Gaussian noise on the reduced flow. This is now arguably the best-understood enrichment of SCS: the chaotic bulk acts as a regularizer for a low-dimensional deterministic computation, and the $g=1$ criterion generalizes to a determinantal condition on a small reduced Jacobian. What is *not* yet rigorous is the regime where $R$ grows with $N$, or where $m^{(r)}, n^{(r)}$ are themselves correlated with $\\chi$ — exactly the regime produced by training, where every gradient step injects rank-one structure correlated with the random initialization.\n\n### Excitatory–inhibitory balance beyond Kadmon–Sompolinsky\n\nKadmon \u0026 Sompolinsky [13] established two distinct chaotic regimes — fluctuation-driven and rate-driven — in sparse E/I networks with Dale's law, identifying a slow-fluctuation onset distinct from SCS chaos. The successors split into two streams. The Hansel–Mongillo–Pereira–Harish line treats the strongly balanced regime where excitation and inhibition cancel to leading order in the coupling strength $K^{1/2}$, and chaos appears as residual $\\mathcal{O}(1)$ fluctuations on top of that cancellation; the recent identification of a target-specific-inhibition route to *synchrony rather than chaos* in E/I networks ([Mongillo and collaborators, 2026](https://arxiv.org/html/2605.14916v1)) sharpens the boundary between the SCS-extended and the asynchronous-irregular phases. A second stream studies common-input drive in balanced rate networks and finds that input-correlation-induced cancellation impedes the Rajan–Abbott–Sompolinsky [12] suppression mechanism — the \"edge-of-chaos for learning\" slogan does not survive untouched in biophysically realistic balance.\n\n### Trained chaos and the predictive-alignment line\n\nSussillo \u0026 Abbott's FORCE algorithm and its descendants exploit chaotic reservoirs by clamping read-out projections; the SCS bulk supplies a high-dimensional, decorrelated basis on which a linear decoder can sit. Theoretically what FORCE does is move the network to the edge of, not the interior of, the chaotic phase — a fact made quantitative in DMFT terms by Rajan–Abbott–Sompolinsky [12] and by the input-driven memory-capacity peak of Schuecker–Goedeke–Helias [14]. More recent work, exemplified by the \"[predictive alignment](https://www.nature.com/articles/s41467-025-61309-9)\" rule (2025) and DMFT analyses of synaptic-plasticity-induced shifts of the chaos transition ([Helias group, 2024–25](https://arxiv.org/pdf/2412.15592)), shows that learning rules themselves *renormalize* $g_c$: plasticity is not an external knob acting on a fixed SCS landscape but a process that deforms the landscape. The clean statement — rigorous only for specific Hebbian and predictive-coding rules — is that the effective gain $g_{\\rm eff}$ depends on the second moment of the learned weight perturbation, and the bifurcation moves accordingly.\n\n### Attention, transformers, and in-context learning\n\nThe transplant of DMFT to self-attention layers is the most speculative current frontier. Recent constructions ([Tiberi *et al.* 2024](https://arxiv.org/html/2406.07247v1)) derive a colored-noise effective process for a single token's representation in a deep attention stack, with self-consistent kernel given by the inner product structure of key–query matrices; chaotic phase transitions appear at finite context length. The connection to recurrent SCS is structural — softmax attention is, in a precise sense, a learned, content-addressed low-rank perturbation of the identity — but the claim that in-context learning operates \"at the edge of chaos\" is, at present, *folklore*. No theorem analogous to [14]'s memory-capacity peak has been proved for attention, and the relevant order parameter is unclear (alignment? token-token covariance? attention-entropy?).\n\n### Implications of predictable mean-field chaos for control and inference\n\nThe Yadav–Shaidurov–Kadmon reframing [10] — that the mean-field autocorrelation $C(\\tau)$ obeys a deterministic ODE whose trajectory is fixed by its past — has under-appreciated consequences for control and inference. (i) For *control*, the order-parameter trajectory becomes the state of a low-dimensional deterministic system that one can drive with input; closed-loop control of an N→∞ chaotic network reduces to control of a one-dimensional Newton-form ODE, and the input enters as an inhomogeneity to the self-consistent equation, not as a stochastic forcing. (ii) For *inference*, observing $C(\\tau)$ over a finite window allows one to invert the SCS equation for the underlying gain $g$ and noise level — a population-level system identification protocol with no microscopic readout needed. (iii) The predictability does *not* propagate to finite-$N$ microscopic states; the maximum Lyapunov exponent remains positive [1, 12] and the gap between order-parameter determinism and trajectory unpredictability is precisely $\\mathcal{O}(N^{-1/2})$ in the leading van Kampen expansion. This last point — that the determinism is genuinely an N→∞ statement and corrections are non-perturbative in time — is rigorous and supplies the cleanest contemporary justification for treating $C(\\tau)$ as an honest dynamical variable for engineering applications such as vestibular reservoir computing [20] and critical-branching RNN design [21].\n\n### Rigorous versus folklore — a frontier audit\n\n| Claim | Status |\n|---|---|\n| SCS bifurcation at $g=1$ for i.i.d. Gaussian couplings, sigmoid $\\phi$ | Rigorous (DMFT + Ginibre) [1, 3] |\n| Low-rank + random splits into reduced DMFT on overlap manifold, fixed $R$ | Rigorous in fixed-$R$ limit (deterministic equivalents) |\n| Same, when low-rank component is *correlated* with random part (trained networks) | Open; perturbative results only |\n| Two-regime chaos (rate vs. fluctuation) in sparse E/I networks | Rigorous (DMFT) [13] |\n| Input drive shifts edge of chaos and maximizes sequence memory there | Rigorous [14] |\n| Hypergraph/$p$-body SCS analogue with closed $C(\\tau)$ equation | Folklore for firing-rate; rigorous only for spherical $p$-spin [9] |\n| In-context learning operates \"at the edge of chaos\" of the attention stack | Folklore |\n| Order-parameter $C(\\tau)$ trajectory is uniquely fixed by its past in the $N\\to\\infty$ limit | Rigorous [10] |\n| Predictability extends to microscopic states | False — Lyapunov exponent stays positive |\n\nSources:\n- [Predictable Mean-Field Chaos in Random Recurrent Networks (arXiv:2606.08805)](https://arxiv.org/html/2606.08805)\n- [Linking connectivity, dynamics and computations in low-rank recurrent neural networks (Mastrogiuseppe \u0026 Ostojic, Neuron 2018)](https://www.sciencedirect.com/science/article/pii/S0896627318305439)\n- [Dynamics of random recurrent networks with correlated low-rank structure (Schuessler et al., Phys. Rev. Research 2020)](https://link.aps.org/doi/10.1103/PhysRevResearch.2.013111)\n- [From Chaos to Synchrony in Recurrent Excitatory–Inhibitory Networks with Target-Specific Inhibition (arXiv 2026)](https://arxiv.org/html/2605.14916v1)\n- [Taming the chaos gently: predictive alignment in RNNs (Nature Communications 2025)](https://www.nature.com/articles/s41467-025-61309-9)\n- [Synaptic plasticity alters the nature of chaos transition in neural networks (arXiv 2024)](https://arxiv.org/pdf/2412.15592)\n- [Dynamical Mean-Field Theory of Self-Attention Neural Networks (arXiv 2024)](https://arxiv.org/html/2406.07247v1)\n- [Input correlations impede suppression of chaos and learning in balanced rate networks (PLOS Comp. Biol. 2022)](https://journals.plos.org/ploscompbiol/article?id=10.1371%2Fjournal.pcbi.1010590)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nThe SCS construction [1] is, in my judgement, one of the cleanest theoretical achievements of late-twentieth-century statistical neuroscience: a three-page Letter that wrote down a Newton-form ODE for $C(\\tau)$, identified a Lyapunov-genuine bifurcation at $g=1$, and did so via a saddle point that the authors were too parsimonious to advertise as MSR–Janssen–De Dominicis machinery. I will defend, without hedging, four claims. First: in the autonomous, fully connected, i.i.d. Gaussian $J_{ij}$, continuous-time firing-rate ODE $\\dot{x}_i = -x_i + \\sum_j J_{ij}\\phi(x_j)$ with $\\phi$ smooth, odd, bounded, $\\phi'(0)=1$, the transition at $g=1$ is real, sharp in the $N\\to\\infty$ limit, and coincides with the Ginibre spectral edge of the linearized Jacobian. Second: the DMFT closure is rigorous as a self-consistent equation for the order parameter $C(\\tau)$, and the supercritical phase carries a *positive* maximum Lyapunov exponent — microscopic chaos, not merely decorrelation. Third: the order-parameter trajectory is deterministic; the effective single-neuron process is not. Fourth: the credit pattern I laid out earlier — Ginibre over Girko for the Gaussian spectral input, Sompolinsky–Zippelius for the closure, MSR/Janssen/De Dominicis for the backbone — is the correct attribution.\n\n### What is shakier than the literature admits\n\nThe fragility is concentrated in assumptions that the slogan \"edge of chaos\" papers over. (i) *Gaussianity and independence of $J_{ij}$.* Heavy-tailed or block-structured couplings shift the spectral edge and can produce a bifurcation that no longer coincides with $g=1$; the DMFT integral identity that gives the Newton form leans on Gaussianity through the cumulant truncation, not merely through second moments. (ii) *Boundedness and oddness of $\\phi$.* Non-odd nonlinearities reintroduce a non-zero mean field $m(t)$ that the standard SCS treatment quietly drops; the resulting two-order-parameter DMFT can change the bifurcation order. (iii) *The leap from $\\lambda_{\\max}\u003e0$ to \"computationally optimal at the edge.\"* This is empirical, not theoretical, and the Toyoizumi–Abbott / Schuecker–Goedeke–Helias line tied it to specific information-theoretic functionals — not to \"computation\" in general. (iv) *Discrete-time identifications.* The echo-state spectral-radius criterion is a *linear stability* statement; equating it with the SCS DMFT bifurcation requires assuming the input drive is small and the nonlinearity gain at the operating point is one — assumptions silently invoked across the reservoir-computing literature. (v) *Driven networks.* The clean $g=1$ statement is for the autonomous system. A persistent input regularizes the bifurcation into a crossover whose location depends on input statistics; the literature still quotes $g=1$ for driven networks where the claim is, strictly, false.\n\n### Three open questions, ranked\n\n1. **DMFT for non-Gaussian, sparse, structured $J$.** What replaces the Newton-form ODE when the matrix ensemble is Erdős–Rényi-sparse with degree-correlated motifs? — because every biological and trained network lives here.\n2. **Rigorous bridge from microscopic $\\lambda_{\\max}$ to mean-field $C(\\tau)$ at finite $N$.** A finite-$N$ correction theory with controlled error bars, not a heuristic $1/N$ expansion. — because the gap between mean-field \"chaos\" and ODE chaos is currently a folklore equivalence.\n3. **Trainable chaos: what does gradient descent do to the bifurcation structure?** Empirically, trained RNNs sit near but not on $g=1$; no clean order-parameter theory predicts where. — because it would unify SCS with the modern deep-RNN regime.\n\n**Reading path:**\n1. Sompolinsky, Crisanti \u0026 Sommers (1988) [1] — the Letter itself; read it before any retelling.\n2. Ginibre (1965) — the spectral input the Letter does not cite by name.\n3. Sompolinsky \u0026 Zippelius (1982) on SK dynamics — the closure SCS imported; restores Zippelius's lost credit.\n4. Toyoizumi \u0026 Abbott (2011) — first rigorous bridge between $g=1$ and an information-theoretic \"edge.\"\n5. Schuecker, Goedeke \u0026 Helias (2018) — the cleanest modern path-integral treatment of driven and structured extensions."}], "references": [{"n": 1, "title": "Chaos in Random Neural Networks", "authors": ["H. Sompolinsky", "A. Crisanti", "H. J. Sommers"], "year": 1988, "venue": "Physical Review Letters 61, 259", "url": "https://doi.org/10.1103/PhysRevLett.61.259", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Characteristics of random nets of analog neuron-like elements", "authors": ["Shun-ichi Amari"], "year": 1972, "venue": "IEEE Transactions on Systems, Man, and Cybernetics SMC-2, 643", "url": "https://doi.org/10.1109/TSMC.1972.4309193", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Statistical Ensembles of Complex, Quaternion, and Real Matrices", "authors": ["Jean Ginibre"], "year": 1965, "venue": "Journal of Mathematical Physics 6, 440", "url": "https://doi.org/10.1063/1.1704292", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Circular Law", "authors": ["Vyacheslav L. Girko"], "year": 1985, "venue": "Theory of Probability and Its Applications", "url": "https://doi.org/10.1137/1129095", "cited_by": 287, "bucket": "earliest"}, {"n": 5, "title": "Statistical Dynamics of Classical Systems", "authors": ["P. C. Martin", "E. D. Siggia", "H. A. Rose"], "year": 1973, "venue": "Physical Review A 8, 423", "url": "https://doi.org/10.1103/PhysRevA.8.423", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Dynamics as a substitute for replicas in systems with quenched random impurities", "authors": ["C. De Dominicis"], "year": 1978, "venue": "Physical Review B 18, 4913", "url": "https://doi.org/10.1103/PhysRevB.18.4913", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Dynamic Theory of the Spin-Glass Phase", "authors": ["H. Sompolinsky", "Annette Zippelius"], "year": 1981, "venue": "Physical Review Letters 47, 359", "url": "https://doi.org/10.1103/PhysRevLett.47.359", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Relaxational dynamics of the Edwards-Anderson model and the mean-field theory of spin-glasses", "authors": ["H. Sompolinsky", "Annette Zippelius"], "year": 1982, "venue": "Physical Review B 25, 6860", "url": "https://doi.org/10.1103/PhysRevB.25.6860", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Dynamics of spin systems with randomly asymmetric bonds: Langevin dynamics and a spherical model", "authors": ["A. Crisanti", "H. Sompolinsky"], "year": 1987, "venue": "Physical Review A 36, 4922", "url": "https://doi.org/10.1103/PhysRevA.36.4922", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Predictable Mean-Field Chaos in Random Recurrent Networks", "authors": ["Alkesh Yadav", "Vladimir Shaidurov", "Jonathan Kadmon"], "year": 2026, "venue": "arXiv", "url": "http://arxiv.org/abs/2606.08805v1", "cited_by": null, "bucket": "arXiv"}, {"n": 11, "title": "Suppressing chaos in neural networks by noise", "authors": ["L. Molgedey", "J. Schuchhardt", "H. G. Schuster"], "year": 1992, "venue": "Physical Review Letters 69, 3717", "url": "https://doi.org/10.1103/PhysRevLett.69.3717", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Stimulus-dependent suppression of chaos in recurrent neural networks", "authors": ["Kanaka Rajan", "L. F. Abbott", "Haim Sompolinsky"], "year": 2010, "venue": "Physical Review E 82, 011903", "url": "https://doi.org/10.1103/PhysRevE.82.011903", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Transition to Chaos in Random Neuronal Networks", "authors": ["Jonathan Kadmon", "Haim Sompolinsky"], "year": 2015, "venue": "Physical Review X 5, 041030", "url": "https://doi.org/10.1103/PhysRevX.5.041030", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Optimal Sequence Memory in Driven Random Networks", "authors": ["Jannis Schuecker", "Sven Goedeke", "Moritz Helias"], "year": 2018, "venue": "Physical Review X 8, 041029", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 15, "title": "The Variable Discharge of Cortical Neurons: Implications for Connectivity, Computation, and Information Coding", "authors": ["Michael N. Shadlen", "William T. Newsome"], "year": 1998, "venue": "Journal of Neuroscience", "url": "https://doi.org/10.1523/jneurosci.18-10-03870.1998", "cited_by": 2284, "bucket": "canon"}, {"n": 16, "title": "Information processing using a single dynamical node as complex system", "authors": ["Lennert Appeltant", "Miguel C. Soriano", "Guy Van der Sande", "Jan Danckaert", "Serge Massar", "Joni Dambre"], "year": 2011, "venue": "Nature Communications", "url": "https://doi.org/10.1038/ncomms1476", "cited_by": 1667, "bucket": "canon"}, {"n": 17, "title": "Optoelectronic Reservoir Computing", "authors": ["Y. Paquot", "F. Duport", "A. Smerieri", "J. Dambre", "B. Schrauwen", "M. Haelterman"], "year": 2012, "venue": "Scientific Reports", "url": "https://doi.org/10.1038/srep00287", "cited_by": 758, "bucket": "canon"}, {"n": 18, "title": "Networks beyond pairwise interactions: Structure and dynamics", "authors": ["Federico Battiston", "Giulia Cencetti", "Iacopo Iacopini", "Vito Latora", "Maxime Lucas", "Alice Patania"], "year": 2020, "venue": "Physics Reports", "url": "https://doi.org/10.1016/j.physrep.2020.05.004", "cited_by": 1429, "bucket": "canon"}, {"n": 19, "title": "Dynamical cavity method for continuous-time complex systems on sparse random graphs", "authors": ["Fernando L. Metz", "Isaac Pérez Castillo"], "year": 2026, "venue": "arXiv (Cornell University)", "url": "https://openalex.org/W7164235016", "cited_by": 0, "bucket": "recent"}, {"n": 20, "title": "Vestibular reservoir computing", "authors": ["Ying‐Cheng Lai", "Smita Deb", "Shirin Panahi", "Mulugeta Haile"], "year": 2026, "venue": "Research Square", "url": "https://doi.org/10.21203/rs.3.rs-9635336/v1", "cited_by": 0, "bucket": "recent"}, {"n": 21, "title": "Towards Critical Branching Mechanism in Recurrent Neural Networks", "authors": ["Feixiang Ren", "Ling Feng"], "year": 2026, "venue": "arXiv (Cornell University)", "url": "https://openalex.org/W7164447017", "cited_by": 0, "bucket": "recent"}], "nsec": 8, "nref": 21, "teaser": "From Ginibre's spectrum to the predictable mean-field trajectory: a Sompolinsky–Crisanti–Sommers monograph"}</script>
