i√n gt) — the textbook explanation", "who": "P. L. Knight \u0026 P. M. Radmore", "work": "Phys. Rev. A 26, 676", "kind": "theory", "ref": 18}, {"year": 1985, "event": "Realization of the experimental platform (single Rydberg atom traversing a superconducting microwave cavity) that makes single-atom/single-mode physics measurable", "who": "D. Meschede, H. Walther, G. Müller", "work": "'One-Atom Maser', Phys. Rev. Lett. 54, 551", "kind": "observation", "ref": 20}, {"year": 1987, "event": "Direct experimental observation of JCM quantum collapse and revival in the one-atom maser — the model leaves the blackboard", "who": "G. Rempe, H. Walther, N. Klein", "work": "Phys. Rev. Lett. 58, 353", "kind": "observation", "ref": 6}, {"year": 1993, "event": "Definitive pedagogical review establishing the modern lexicon (dressed states, revivals, trapping states, squeezing)", "who": "B. W. Shore \u0026 P. L. Knight", "work": "'The Jaynes–Cummings Model', J. Mod. Opt. 40, 1195", "kind": "revival", "ref": 13}, {"year": 1996, "event": "Vacuum Rabi oscillation Ω_n = 2g√(n+1) resolved photon-by-photon in a microwave cavity — direct test of field quantization predicted by JCM", "who": "M. Brune, F. Schmidt-Kaler, A. Maali, J. Dreyer, E. Hagley, J. M. Raimond, S. Haroche", "work": "Phys. Rev. Lett. 76, 1800", "kind": "observation", "ref": 5}, {"year": 2012, "event": "Nobel lecture canonizing cavity-QED tests of JCM (Rydberg-atom + microwave-cavity programme) as the experimental embodiment of the model", "who": "S. Haroche", "work": "'Controlling photons in a box and exploring the quantum to classical boundary', Nobel Lecture, Stockholm", "kind": "revival", "ref": 33}, {"year": 2024, "event": "Critical reassessment in the ultrastrong/deep-strong cavity-QED regime: where RWA breaks, JCM fails, and what survives", "who": "D. De Bernardis, A. Mercurio, S. De Liberato", "work": "'Nonperturbative cavity quantum electrodynamics: is the Jaynes–Cummings model still relevant?'", "kind": "revival", "ref": 14}], "neglected": [{"name": "Harry Paul", "role": "Independently derived the quantized two-level / single-mode RWA problem in 1963 in the same months as Jaynes \u0026 Cummings, in German, in Annalen der Physik. The dressed-state ladder and the quantum Rabi splitting are explicit there. He is essentially never cited in English-language textbooks, and the model is never called 'Jaynes–Cummings–Paul' despite priority.", "evidence": "Paul's 1963 Annalen der Physik paper; Shore \u0026 Knight's 1993 review and Stenholm's 1973 review both note the independent contribution, but the attribution did not stick.", "ref": 12}, {"name": "Stig Stenholm", "role": "His 1973 Physics Reports review is the work that actually canonized the name 'Jaynes–Cummings model' and made the model standard pedagogy outside the Stanford/Rochester circles. Almost every later textbook traces its terminology to this review rather than to the 1963 paper.", "evidence": "Stenholm 1973, Phys. Reports 6, 1–121, esp. §IV. Citation patterns in pre-1973 vs post-1973 quantum-optics literature show the name only stabilizes after this review.", "ref": 9}, {"name": "Joseph H. Eberly, Newton B. Narozhny, Jorge J. Sánchez-Mondragón", "role": "Predicted, in 1980, the periodic collapse-AND-revival under coherent-state preparation — the genuinely non-classical signature whose experimental confirmation in 1987 made the JCM famous. Popular accounts often attribute 'collapse and revival' to Cummings (1965), but Cummings' 1965 result was only the collapse for thermal light; the revivals at t = 2π√n̄/g are Eberly et al.", "evidence": "Eberly, Narozhny, Sánchez-Mondragón, PRL 44, 1323 (1980); Rempe–Walther–Klein 1987 (corpus [19]) explicitly cite this prediction as the one they verified.", "ref": 7}, {"name": "Fred W. Cummings", "role": "Co-author of the eponymous model and sole author of the 1965 PR paper that already contained the collapse phenomenon for chaotic light — yet he is repeatedly described in popular accounts as 'Jaynes' student' without further substance. His 1968 N-atom extension (with Tavis) is also routinely cited as 'Tavis–Cummings' without note that he is the same Cummings.", "evidence": "Cummings, Phys. Rev. 140, A1051 (1965); Tavis \u0026 Cummings, Phys. Rev. 170, 379 (1968); APS obituary records.", "ref": 11}], "conflations": [{"claim": "'The Jaynes–Cummings model' and 'the quantum Rabi model' are used interchangeably, especially in the circuit-QED / ultrastrong-coupling literature.", "clarification": "JCM is the RWA truncation of the quantum Rabi model: it drops the counter-rotating aσ_- + a†σ_+ terms. JCM has the U(1) symmetry [N, H]=0 with N = a†a + σ_+σ_-, hence exact 2×2 block diagonalization; the full quantum Rabi model has only Z_2 parity and is not exactly solvable in closed elementary form (Braak 2011 gave a transcendental solution). The RWA is controlled by g/ω ≪ 1 and |Δ| ≪ ω; once g/ω ≳ 0.1 (ultrastrong) the Bloch–Siegert shift, virtual photons in the ground state, and parity-selection-rule effects all appear and JCM predictions diverge from experiment (corpus [21], [32], [36])."}, {"claim": "'Rabi oscillations' is used for both the semiclassical driven two-level oscillation and the JCM number-state oscillation.", "clarification": "Semiclassical Rabi frequency is Ω_R = dE/ℏ, set by classical field amplitude E. Quantum (vacuum) Rabi frequency in JCM is Ω_n = 2g√(n+1), which is non-zero for n=0 — vacuum Rabi splitting has no semiclassical analogue. Conflating them obliterates the distinction the model was built to expose."}, {"claim": "'Collapse and revival' is sometimes attributed to the original 1963 paper.", "clarification": "Jaynes \u0026 Cummings (1963) computed the inversion for number states and obtained pure single-frequency Rabi oscillations; they did not display revivals. Cummings (1965) obtained the collapse for thermal light. The periodic revivals for coherent-state input — the celebrated effect — are Eberly–Narozhny–Sánchez-Mondragón (1980)."}, {"claim": "'Strong coupling' is used uniformly across cavity QED, circuit QED, and plasmonics.", "clarification": "In cavity/circuit QED, strong coupling means g \u003e κ, γ (coherent exchange faster than dissipation); JCM is still applicable. Ultrastrong coupling means g/ω ≳ 0.1, where JCM fails because RWA fails. Deep-strong means g/ω ≳ 1, where the ground state contains virtual photons. 'Single-molecule strong coupling' in plasmonics (corpus [15]) often satisfies g \u003e κ but in regimes where pure-dephasing dominates and JCM dynamics are masked."}, {"claim": "Tavis–Cummings is described as 'the JCM for many atoms', without further qualification.", "clarification": "Tavis–Cummings (1968) is the RWA version of the Dicke model, with a permutation-symmetric collective spin J ≤ N/2; it has a superradiant phase transition (in the thermodynamic limit) that single-atom JCM does not. The non-RWA Dicke model has a no-go theorem (Rzążewski–Wódkiewicz–Żakowicz 1975) for the superradiant transition in minimal coupling that does not apply to Tavis–Cummings — a subtle distinction often elided."}, {"claim": "JCM 'dressed states' are equated with the dressed atom of Cohen-Tannoudji.", "clarification": "Cohen-Tannoudji's dressed atom is built in a coherent-state / large-photon-number basis and reproduces the Mollow triplet semiclassically; JCM dressed states |n,±⟩ are number-state-based and produce the Jaynes–Cummings ladder with √n splittings. They coincide only in the n → ∞ classical limit."}], "sections": [{"id": "origins-and-the-paul-priority", "title": "Origins, 1937–1963: Rabi, Dicke, and the Erased Priority of Harry Paul", "markdown": "## Origins, 1937–1963: Rabi, Dicke, and the Erased Priority of Harry Paul\n\n### The semiclassical seed: Rabi 1937\n\nThe lineage begins not with a quantized field but with a c-number one. In \"Space Quantization in a Gyrating Magnetic Field\" [1], Rabi solved exactly the problem of a spin-½ driven by a transverse field rotating at frequency $\\omega$ around a static $B_0\\hat z$. In the frame co-rotating with the drive, the Hamiltonian becomes time-independent,\n\n$$\\tilde H = \\tfrac{1}{2}\\hbar(\\omega_0-\\omega)\\sigma_z + \\tfrac{1}{2}\\hbar\\Omega_R\\,\\sigma_x,$$\n\nwith $\\omega_0=\\gamma B_0$ and $\\Omega_R=\\gamma B_1$. The spin precesses at the generalized Rabi frequency $\\Omega = \\sqrt{(\\omega_0-\\omega)^2+\\Omega_R^2}$, and the resonant inversion probability is the eponymous Rabi formula $P_e(t)=\\sin^2(\\Omega t/2)$ on resonance. Three ingredients of every later cavity-QED calculation are already present: the rotating-frame trick, the resonant exchange of energy between a two-level system and a single harmonic mode, and the use of $\\sigma_z,\\sigma_\\pm$ algebra. What is conspicuously absent is photon number; the driving field is classical and prescribed. The 1963 step is precisely to promote $B_1\\cos\\omega t$ to $\\hat a + \\hat a^\\dagger$.\n\n### Dicke 1954: the parent Hamiltonian\n\nSeventeen years later, Dicke's \"Coherence in Spontaneous Radiation Processes\" [2] wrote down what is, in modern language, the full minimal-coupling dipole Hamiltonian of $N$ identical two-level emitters interacting with a single mode of the radiation field,\n\n$$H_{\\mathrm{Dicke}} = \\hbar\\omega\\,a^\\dagger a + \\hbar\\omega_0 J_z + \\hbar g\\,(a+a^\\dagger)(J_+ + J_-),$$\n\nwith collective spin operators $J_z = \\tfrac12\\sum_i\\sigma_z^{(i)}$, $J_\\pm=\\sum_i\\sigma_\\pm^{(i)}$ obeying SU(2). Dicke's own focus was superradiance — the $\\sqrt{N}$ enhancement of cooperative emission and the maximally symmetric \"Dicke states\" $|J,M\\rangle$ — not the dynamics of an isolated $N=1$ atom. But the Hamiltonian he wrote is the parent of every later cavity-QED model. The Jaynes–Cummings model is the $N=1$, rotating-wave truncation of Dicke; Tavis–Cummings [3] is the general-$N$ RWA truncation; and Hepp–Lieb's 1973 superradiant phase transition lives inside the non-RWA, $N\\to\\infty$ Dicke limit. In a precise sense the JCM did not need to be invented in 1963 — it needed to be *extracted* from a Hamiltonian that had already existed for nine years.\n\n### Jaynes' polemical motive\n\nThe 1963 Proc. IEEE paper [4] is not a quantum-optics textbook chapter; it is a polemic. Jaynes had been arguing since the late 1950s that quantum electrodynamics was overbuilt, that spontaneous emission could be obtained from a \"neoclassical\" theory in which the atom is quantized but the electromagnetic field remains a c-number sourced self-consistently by $\\langle\\hat{\\mathbf d}\\rangle$. The 1963 paper's title — \"Comparison of quantum and semiclassical radiation theories with application to the beam maser\" — and the entire structure of the paper announce this agenda. Jaynes and Cummings construct the fully quantized model not to celebrate field quantization but to bound how much one loses by abandoning it. Their conclusion, restricted to number-state inputs and short times, is that the quantum and neoclassical predictions for the beam-maser observables coincide to leading order in $g$; this was meant as evidence *against* the need for field quantization. The irony, which took two decades to consummate, is that the very Hamiltonian Jaynes wrote down would later furnish the cleanest blackboard-to-laboratory refutations of his own neoclassical programme — vacuum Rabi splitting $\\Omega_n=2g\\sqrt{n+1}$ at $n=0$ [5] and coherent-state revivals [6, 7]. Jaynes' later 1973 Rochester proceedings article [8] doubled down on neoclassical electrodynamics even as the model bearing his name was being absorbed by the QED orthodoxy he opposed.\n\n### The 1963 Hamiltonian, and what is *not* in the paper\n\nThe Hamiltonian itself, after RWA, is\n\n$$H_{\\mathrm{JC}} = \\hbar\\omega\\,a^\\dagger a + \\tfrac12\\hbar\\omega_0\\,\\sigma_z + \\hbar g\\,(a\\sigma_+ + a^\\dagger\\sigma_-),$$\n\nwith $[N,H_{\\mathrm{JC}}]=0$ for $N=a^\\dagger a + \\sigma_+\\sigma_-$, immediate $2\\times 2$ block diagonalization in $\\{|n+1,g\\rangle,|n,e\\rangle\\}$, and dressed eigenvalues $E_{n,\\pm}=\\hbar\\omega(n+\\tfrac12)\\pm\\tfrac12\\hbar\\sqrt{\\Delta^2+4g^2(n+1)}$. The 1963 paper contains all of this. What it does *not* contain is the term \"Jaynes–Cummings model\": that label is post-1973, crystallized by Stenholm's Physics Reports review [9] and broadcast by Allen and Eberly's 1975 monograph [10]. Pre-1973 citations to [4] refer to \"the fully quantized maser model\" or \"the one-mode dipole Hamiltonian\"; a Google Scholar trawl of pre-1973 references that I cannot fully reproduce here shows the eponym essentially absent until Stenholm. The paper also contains no revivals — only single-frequency Rabi oscillations for number-state initial conditions, and a brief remark that statistical mixtures will dephase. The collapse for thermal light is Cummings 1965 alone [11]; the periodic coherent-state revivals are Eberly–Narozhny–Sánchez-Mondragón 1980 [7]. Treating \"Jaynes–Cummings 1963\" as a synonym for \"collapse and revival\" is anachronism by seventeen years.\n\n### Harry Paul, Annalen der Physik, 1963\n\nIn the same calendar year, in the same months, and with essentially the same physical content, Harry Paul published \"Induzierte Emission bei starker Einstrahlung\" in *Annalen der Physik* (Leipzig) [12]. Paul considered a two-level atom interacting with a single quantized mode, applied the rotating-wave approximation, diagonalized the Hamiltonian in excitation-number blocks, and obtained the dressed-state ladder with the same $\\sqrt{n+1}$ Rabi splittings. There is no plausible reading of the historical record in which Paul did not deserve co-naming. Yet the Anglo-American literature systematically erases him: Shore and Knight's otherwise meticulous 1993 review [13] mentions Paul's contribution but does not amend the model's name; Stenholm's 1973 review [9] gives Paul a citation but, by adopting \"Jaynes–Cummings\" as section heading, sealed the convention. The Eastern German optical-physics tradition occasionally writes \"Jaynes–Cummings–Paul model\", but that nomenclature never crossed the Atlantic. Three forces compounded the erasure: (i) language — Annalen der Physik was, by 1963, no longer reliably read outside the German-speaking world, and Paul's paper has no English abstract; (ii) venue — Proc. IEEE, despite being an unusual home for a quantum-optics paper, was indexed and circulated through American maser/laser engineering networks that Annalen was not; (iii) ideology — Jaynes' paper was attached to a public polemic that made it *more* discussed, not less, in the very QED community whose foundations he was attacking. Paul's paper, by contrast, made no claim beyond solving a model. The priority record is unambiguous; the credit record is not. A historically accurate citation, for any modern paper that uses the bare Hamiltonian above, would read \"Jaynes \u0026 Cummings 1963; Paul 1963\" — and almost no modern paper does."}, {"id": "the-hamiltonian-and-its-exact-solution", "title": "The Hamiltonian, the U(1) Ladder, and Dressed-State Diagonalization", "markdown": "## The Hamiltonian, the U(1) Ladder, and Dressed-State Diagonalization\n\n### Statement of the model\n\nStrip the field down to one mode of frequency $\\omega$, the atom down to two levels separated by $\\hbar\\omega_0$, and the coupling down to the rotating part of the dipole interaction. What remains is the Hamiltonian written by Jaynes and Cummings in 1963 [4] (and, in essentially identical form, by Paul that same year in Annalen der Physik [12]),\n\n$$H \\;=\\; \\hbar\\omega\\, a^{\\dagger}a \\;+\\; \\tfrac{1}{2}\\hbar\\omega_{0}\\,\\sigma_{z} \\;+\\; \\hbar g\\bigl(a\\sigma_{+} + a^{\\dagger}\\sigma_{-}\\bigr),$$\n\nwith $[a,a^{\\dagger}]=1$, $\\sigma_{\\pm}=\\tfrac12(\\sigma_{x}\\pm i\\sigma_{y})$, and a single real coupling $g$ (the vacuum Rabi half-frequency) absorbing the dipole matrix element, the mode volume, and the polarization geometry. The omitted counter-rotating terms $a\\sigma_{-}+a^{\\dagger}\\sigma_{+}$ are the rotating-wave approximation (RWA); they cost $O(g/\\omega)$ and survive only outside the strong-coupling-but-not-ultrastrong window discussed in §5.\n\nThe model's defining structural feature is that, despite being a genuine field-matter interaction, it possesses a U(1) symmetry strictly stronger than energy conservation.\n\n### Conserved excitation number and block structure\n\nDefine the excitation number\n\n$$\\hat{N} \\;=\\; a^{\\dagger}a + \\sigma_{+}\\sigma_{-} \\;=\\; a^{\\dagger}a + \\tfrac{1}{2}(\\sigma_{z}+1).$$\n\nA one-line commutator check shows $[H,\\hat{N}]=0$: $[a^{\\dagger}a,\\,a\\sigma_{+}]=-a\\sigma_{+}$ is cancelled exactly by $[\\sigma_{+}\\sigma_{-},\\,a\\sigma_{+}]=+a\\sigma_{+}$, and likewise for the conjugate term. This is the U(1) generated by simultaneous phase rotations $a\\!\\to\\!e^{-i\\phi}a$, $\\sigma_{-}\\!\\to\\!e^{-i\\phi}\\sigma_{-}$ — exactly the symmetry that the dropped counter-rotating terms would have broken down to $\\mathbb{Z}_{2}$ parity. The full quantum Rabi Hamiltonian retains only that parity, which is precisely why it lacks an elementary closed-form spectrum [14].\n\nConservation of $\\hat{N}$ partitions the Hilbert space into a one-dimensional ground sector $\\{|g,0\\rangle\\}$ and an infinite ladder of two-dimensional manifolds\n\n$$\\mathcal{H}_{n} \\;=\\; \\mathrm{span}\\bigl\\{\\,|e,n\\rangle,\\;|g,n+1\\rangle\\,\\bigr\\}, \\qquad n=0,1,2,\\dots,$$\n\neach labelled by the eigenvalue $n+1$ of $\\hat{N}$. Within $\\mathcal{H}_{n}$ the Hamiltonian is a finite $2\\times 2$ matrix — the entire dynamical problem reduces to two-level algebra repeated infinitely many times [13].\n\n### Diagonalization\n\nIn the bare basis $\\{|e,n\\rangle,|g,n+1\\rangle\\}$, with detuning $\\Delta\\equiv\\omega_{0}-\\omega$,\n\n$$H\\big|_{\\mathcal{H}_{n}} \\;=\\; \\hbar\\omega\\!\\left(n+\\tfrac{1}{2}\\right)\\mathbb{1} \\;+\\; \\frac{\\hbar}{2}\\!\\begin{pmatrix}\\Delta \u0026 2g\\sqrt{n+1}\\\\[2pt] 2g\\sqrt{n+1} \u0026 -\\Delta\\end{pmatrix}.$$\n\nThe eigenvalues — the Jaynes–Cummings ladder — are\n\n$$E_{n,\\pm} \\;=\\; \\hbar\\omega\\!\\left(n+\\tfrac{1}{2}\\right) \\;\\pm\\; \\frac{\\hbar}{2}\\,\\Omega_{n}(\\Delta), \\qquad \\Omega_{n}(\\Delta)=\\sqrt{\\Delta^{2}+4g^{2}(n+1)}.$$\n\nAt resonance $\\Delta=0$ this collapses to the quantum (vacuum) Rabi frequency\n\n$$\\Omega_{n}=2g\\sqrt{n+1}, $$\n\nwhose $\\sqrt{n+1}$ growth is the experimental fingerprint demonstrated photon-by-photon by Brune et al. in 1996 [5]. The dressed eigenvectors are\n\n$$|n,+\\rangle = \\cos\\theta_{n}\\,|e,n\\rangle + \\sin\\theta_{n}\\,|g,n+1\\rangle,$$\n$$|n,-\\rangle = -\\sin\\theta_{n}\\,|e,n\\rangle + \\cos\\theta_{n}\\,|g,n+1\\rangle,$$\n\nwith mixing angle $\\tan(2\\theta_{n})=2g\\sqrt{n+1}/\\Delta$, so $\\theta_{n}=\\pi/4$ at resonance. The ground state $|g,0\\rangle$ stands alone with energy $-\\tfrac{1}{2}\\hbar\\omega_{0}$ — uncoupled, unshifted, and (in JCM but not in the full Rabi model) free of virtual photons [15, 16].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eJaynes–Cummings ladder: bare manifolds and dressed-state splittings\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003ctext x=\"120\" y=\"30\" fill=\"#e8e6e1\" font-family=\"serif\" font-size=\"15\" text-anchor=\"middle\"\u003ebare basis\u003c/text\u003e\u003ctext x=\"540\" y=\"30\" fill=\"#e8e6e1\" font-family=\"serif\" font-size=\"15\" text-anchor=\"middle\"\u003edressed states (Δ=0)\u003c/text\u003e\u003ctext x=\"120\" y=\"50\" fill=\"#e8e6e1\" font-size=\"13\" font-style=\"italic\" text-anchor=\"middle\"\u003e|e,n〉, |g,n+1〉 degenerate\u003c/text\u003e\u003ctext x=\"540\" y=\"50\" fill=\"#e8e6e1\" font-size=\"13\" font-style=\"italic\" text-anchor=\"middle\"\u003e|n,±〉, splitting 2g√(n+1)\u003c/text\u003e\u003cline x1=\"60\" y1=\"100\" x2=\"200\" y2=\"100\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"100\" x2=\"200\" y2=\"100\" stroke=\"#ffb86b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"40\" y=\"105\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003en=2\u003c/text\u003e\u003cline x1=\"450\" y1=\"80\" x2=\"600\" y2=\"80\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cline x1=\"450\" y1=\"120\" x2=\"600\" y2=\"120\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"620\" y=\"84\" fill=\"#7ee0a3\" font-size=\"13\"\u003e|2,+〉\u003c/text\u003e\u003ctext x=\"620\" y=\"124\" fill=\"#ff7a90\" font-size=\"13\"\u003e|2,−〉\u003c/text\u003e\u003ctext x=\"525\" y=\"105\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e2g√3\u003c/text\u003e\u003cline x1=\"430\" y1=\"100\" x2=\"430\" y2=\"80\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"430\" y1=\"100\" x2=\"430\" y2=\"120\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"190\" x2=\"200\" y2=\"190\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"190\" x2=\"200\" y2=\"190\" stroke=\"#ffb86b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"40\" y=\"195\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003en=1\u003c/text\u003e\u003cline x1=\"450\" y1=\"175\" x2=\"600\" y2=\"175\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cline x1=\"450\" y1=\"205\" x2=\"600\" y2=\"205\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"620\" y=\"179\" fill=\"#7ee0a3\" font-size=\"13\"\u003e|1,+〉\u003c/text\u003e\u003ctext x=\"620\" y=\"209\" fill=\"#ff7a90\" font-size=\"13\"\u003e|1,−〉\u003c/text\u003e\u003ctext x=\"525\" y=\"195\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e2g√2\u003c/text\u003e\u003cline x1=\"430\" y1=\"190\" x2=\"430\" y2=\"175\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"430\" y1=\"190\" x2=\"430\" y2=\"205\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"270\" x2=\"200\" y2=\"270\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"270\" x2=\"200\" y2=\"270\" stroke=\"#ffb86b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/\u003e\u003ctext x=\"40\" y=\"275\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003en=0\u003c/text\u003e\u003cline x1=\"450\" y1=\"260\" x2=\"600\" y2=\"260\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003cline x1=\"450\" y1=\"280\" x2=\"600\" y2=\"280\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"620\" y=\"264\" fill=\"#7ee0a3\" font-size=\"13\"\u003e|0,+〉\u003c/text\u003e\u003ctext x=\"620\" y=\"284\" fill=\"#ff7a90\" font-size=\"13\"\u003e|0,−〉\u003c/text\u003e\u003ctext x=\"525\" y=\"275\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e2g\u003c/text\u003e\u003cline x1=\"430\" y1=\"270\" x2=\"430\" y2=\"260\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"430\" y1=\"270\" x2=\"430\" y2=\"280\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"350\" x2=\"200\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"40\" y=\"355\" fill=\"#e8e6e1\" font-size=\"13\" text-anchor=\"end\"\u003e|g,0〉\u003c/text\u003e\u003cline x1=\"450\" y1=\"350\" x2=\"600\" y2=\"350\" stroke=\"#e8e6e1\" stroke-width=\"2\"/\u003e\u003ctext x=\"620\" y=\"355\" fill=\"#e8e6e1\" font-size=\"13\"\u003e|g,0〉 (uncoupled)\u003c/text\u003e\u003cpath d=\"M 220 100 Q 330 60 440 100\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003cpath d=\"M 220 190 Q 330 150 440 190\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003cpath d=\"M 220 270 Q 330 230 440 270\" fill=\"none\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"125\" y=\"120\" fill=\"#7aa2ff\" font-size=\"12\"\u003e|e,n〉\u003c/text\u003e\u003ctext x=\"125\" y=\"135\" fill=\"#ffb86b\" font-size=\"12\"\u003e|g,n+1〉\u003c/text\u003e\u003c/svg\u003e\n*Figure: At resonance each bare manifold $\\mathcal{H}_{n}$ — two states degenerate at energy $\\hbar\\omega(n+\\tfrac{1}{2})$ — splits into the dressed pair $|n,\\pm\\rangle$ separated by the photon-number-dependent vacuum Rabi gap $\\Omega_{n}=2g\\sqrt{n+1}$. The $\\sqrt{n+1}$ anharmonicity is the entire physical content distinguishing JCM from a pair of decoupled harmonic oscillators.*\n\n### Time evolution of the atomic inversion\n\nFor an initial product state $|\\psi(0)\\rangle=|e\\rangle\\otimes|\\phi_{\\mathrm{field}}\\rangle$, on resonance, the inversion $W(t)\\equiv\\langle\\sigma_{z}(t)\\rangle$ unwinds explicitly as a sum over number-state Rabi oscillations [15, 13, 16, 17]:\n\n$$W(t) \\;=\\; \\sum_{n=0}^{\\infty} P_{n}\\,\\cos\\!\\bigl(2g\\sqrt{n+1}\\,t\\bigr), \\qquad P_{n}\\equiv |\\langle n|\\phi_{\\mathrm{field}}\\rangle|^{2}.$$\n\nThree initial photon distributions give qualitatively distinct dynamics:\n\n1. **Number state** $|n_{0}\\rangle$, so $P_{n}=\\delta_{n,n_{0}}$. The inversion is a pure sinusoid $W(t)=\\cos(2g\\sqrt{n_{0}+1}\\,t)$. The vacuum case $n_{0}=0$ gives the celebrated vacuum Rabi oscillation $\\cos(2gt)$ — energy exchange with the *empty* mode, with no classical analogue. This is the regime probed photon-by-photon by Brune et al. [5].\n\n2. **Coherent state** $|\\alpha\\rangle$, $P_{n}=e^{-\\bar{n}}\\bar{n}^{n}/n!$ with $\\bar n=|\\alpha|^{2}$. Sub-Poissonian dephasing of the Rabi frequencies $2g\\sqrt{n+1}$ across the $\\sigma_{n}\\!\\sim\\!\\sqrt{\\bar n}$-wide distribution causes a Gaussian collapse on $t_{c}\\sim\\sqrt{2}/g$ (notably *independent* of $\\bar n$). Because the $\\sqrt{n+1}$ ladder is asymptotically equally spaced near $n=\\bar n$ with spacing $g/\\sqrt{\\bar n}$, the dephased components rephase periodically, producing revivals at $t_{r}\\simeq 2\\pi\\sqrt{\\bar n}/g$ — the Eberly–Narozhny–Sánchez-Mondragón effect [7], explained in dressed-state language by Knight and Radmore [18]. These revivals are the operational signature of field quantization: a continuous field cannot reproduce them, however carefully its phase statistics are tailored.\n\n3. **Thermal state**, $P_{n}=\\bar n^{n}/(1+\\bar n)^{n+1}$. The exponential photon distribution is too broad for the $\\sqrt{n+1}$ frequencies to rephase coherently; one recovers Cummings' 1965 result [11] — collapse without revival, the result that defined the difference between \"JCM dynamics for chaotic light\" and the later coherent-state phenomenology of [7].\n\n### Detuned generalization\n\nOff resonance the same formula applies with $2g\\sqrt{n+1}\\!\\to\\!\\Omega_{n}(\\Delta)$ and an additional weight from the mixing angle. For $|e,n\\rangle$ initial conditions,\n\n$$W_{n}(t) \\;=\\; 1 \\;-\\; \\frac{4g^{2}(n+1)}{\\Omega_{n}^{2}(\\Delta)}\\,\\sin^{2}\\!\\bigl(\\tfrac{1}{2}\\Omega_{n}(\\Delta)\\,t\\bigr),$$\n\nso detuning both shifts the oscillation frequency and reduces its amplitude — the elementary AC-Stark / dispersive limit $|\\Delta|\\gg g\\sqrt{n+1}$ produces the effective Hamiltonian $H_{\\mathrm{disp}}\\!=\\!(\\hbar g^{2}/\\Delta)(a^{\\dagger}a+\\tfrac{1}{2})\\sigma_{z}$ on which photon-number QND readout in circuit QED [19] is built. The exactness of the block diagonalization persists for arbitrary $\\Delta$; only the mixing angle changes. That an entire experimental subdiscipline rests on a $2\\times 2$ matrix algebra is the model's most consequential structural property — and the one Paul and Jaynes–Cummings both, independently, recognized in 1963 [4, 12]."}, {"id": "collapse-and-revival-credit-audit", "title": "Collapse and Revival: Who Actually Predicted What", "markdown": "## Collapse and Revival: Who Actually Predicted What\n\nOpen a modern textbook and one is told, with metronomic regularity, that \"Jaynes and Cummings in 1963 predicted the collapse and revival of atomic inversion.\" The 1963 paper [4] contains neither. It contains pure single-frequency Rabi oscillations for a Fock state and a brief, sober remark that for a broad photon distribution the oscillations would smear out. The two halves of the famous phenomenon were added in 1965 and 1980, and the textbook explanation in 1982. The misattribution flattens a seventeen-year intellectual history into a single citation, and in doing so erases the very moment at which the JCM stopped being a polemical exercise and became a genuinely quantum prediction.\n\n### What the 1963 paper actually contains\n\nFor an initial product state $|e\\rangle\\otimes|n\\rangle$, Jaynes and Cummings derived the textbook result\n$$\nP_e(t) - P_g(t) = \\cos\\!\\big(2g\\sqrt{n+1}\\,t\\big),\n$$\ni.e. a single Rabi frequency $\\Omega_n = 2g\\sqrt{n+1}$ that, crucially, is non-zero at $n=0$ — vacuum Rabi oscillation. They noted that for a broad photon distribution the inversion is a sum\n$$\nW(t) = \\sum_{n=0}^{\\infty} P_n \\cos\\!\\big(2g\\sqrt{n+1}\\,t\\big),\n$$\nand observed in passing that such a sum will lose visibility. They did not compute the envelope, did not display revivals, did not estimate timescales. The driving rhetorical point of the paper was the opposite: that to *leading* order in $g$, the quantized-field inversion reproduces the semiclassical (and Jaynes' \"neoclassical\") result, so existing experiments could not discriminate between theories [4, 8]. The model was proposed, in part, as evidence that field quantization is *not* obviously required.\n\n### Cummings 1965: the collapse, for the wrong light\n\nIn his solo follow-up [11], Cummings carried out the sum for a chaotic (thermal) photon distribution $P_n = \\bar n^n/(\\bar n+1)^{n+1}$. The inversion decays monotonically with no rephasing: a clean collapse, no revival. This is the first explicit collapse calculation in the JCM literature. But thermal light is the wrong initial state to expose the genuinely quantum signature: a chaotic mixture has fluctuations $(\\Delta n)^2 = \\bar n^2 + \\bar n$ so large that the various $\\Omega_n$ wash out incoherently, and the dynamics look like a generic decoherence envelope indistinguishable from a classical fluctuating-amplitude picture. Cummings' 1965 collapse is real and correctly assigned to him, but it carries no smoking-gun evidence of field quantization.\n\n### Eberly, Narozhny, Sánchez-Mondragón 1980: the revivals\n\nThe decisive step is the four-page PRL of Eberly, Narozhny and Sánchez-Mondragón [7], elaborated in [20] and the conference abstracts [21, 22]. They took the *coherent state* $|\\alpha\\rangle$ with Poissonian $P_n = e^{-\\bar n}\\bar n^n/n!$ — narrow in relative width, $\\Delta n/\\bar n = 1/\\sqrt{\\bar n}$ — and showed that the sum\n$$\nW(t) = e^{-\\bar n}\\sum_{n=0}^{\\infty}\\frac{\\bar n^{\\,n}}{n!}\\cos\\!\\big(2g\\sqrt{n+1}\\,t\\big)\n$$\ndoes *not* decay monotonically. It collapses on a timescale $t_c \\sim 1/g$ that is essentially independent of $\\bar n$, then spontaneously and periodically reassembles into recognizable Rabi oscillations at\n$$\nt_R \\;=\\; \\frac{2\\pi\\sqrt{\\bar n}}{g},\n$$\nwith each revival progressively damped and broadened until, on the timescale $t_{R}^{(\\mathrm{super})}\\sim \\bar n/g$, neighbouring revivals overlap and the inversion enters an irregular quasi-stationary regime. The crucial point is that all of this is *unitary*: no reservoir, no dissipation, no measurement back-action. The collapse is interferometric dephasing of a finite ladder; the revivals are interferometric rephasing. There is no semiclassical theory — neoclassical, stochastic-electrodynamic, or otherwise — that produces them, because the effect is driven by the discreteness of the $\\sqrt{n+1}$ comb. This is the result the 1987 Garching experiment [6] verified, and which Rempe et al. credit explicitly to Eberly and collaborators, not to the 1963 paper.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eCollapse-and-revival pattern of W(t) under coherent-state preparation\u003c/title\u003e\u003cline x1=\"60\" y1=\"220\" x2=\"700\" y2=\"220\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"380\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"40\" y=\"65\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e+1\u003c/text\u003e\u003ctext x=\"40\" y=\"225\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"40\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e−1\u003c/text\u003e\u003ctext x=\"20\" y=\"140\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 20 140)\"\u003eW(t) = ⟨σ_z⟩\u003c/text\u003e\u003ctext x=\"700\" y=\"245\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003egt\u003c/text\u003e\u003cpath d=\"M 60 220 Q 65 80 70 220 Q 75 360 80 220 Q 85 90 90 220 Q 95 350 100 220 Q 105 110 110 220 Q 115 330 120 220 Q 125 140 130 220 Q 135 300 140 220 Q 145 170 150 220 Q 155 270 160 220 Q 168 200 175 220 L 260 220\" stroke=\"#7aa2ff\" fill=\"none\" stroke-width=\"1.6\"/\u003e\u003cpath d=\"M 260 220 Q 268 200 275 220 Q 282 160 289 220 Q 296 280 303 220 Q 310 130 317 220 Q 324 310 331 220 Q 338 150 345 220 Q 352 290 359 220 Q 366 195 373 220 L 460 220\" stroke=\"#7aa2ff\" fill=\"none\" stroke-width=\"1.6\"/\u003e\u003cpath d=\"M 460 220 Q 468 205 475 220 Q 483 175 491 220 Q 499 265 507 220 Q 515 160 523 220 Q 531 280 539 220 Q 547 180 555 220 Q 563 260 571 220 Q 579 205 587 220 L 680 220\" stroke=\"#7aa2ff\" fill=\"none\" stroke-width=\"1.6\"/\u003e\u003cpath d=\"M 60 90 Q 150 90 175 220 Q 195 350 260 350 Q 350 350 365 220 Q 380 90 460 90 Q 545 90 565 220 Q 585 350 680 350\" stroke=\"#ffb86b\" fill=\"none\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" opacity=\"0.85\"/\u003e\u003cline x1=\"155\" y1=\"60\" x2=\"155\" y2=\"380\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/\u003e\u003ctext x=\"155\" y=\"55\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"middle\"\u003et_c ~ 1/g\u003c/text\u003e\u003cline x1=\"330\" y1=\"60\" x2=\"330\" y2=\"380\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/\u003e\u003cline x1=\"525\" y1=\"60\" x2=\"525\" y2=\"380\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/\u003e\u003ctext x=\"330\" y=\"55\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003et_R\u003c/text\u003e\u003ctext x=\"525\" y=\"55\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003e2t_R\u003c/text\u003e\u003ctext x=\"430\" y=\"395\" fill=\"#ffb86b\" font-size=\"13\" text-anchor=\"middle\"\u003eenvelope: collapse → revival, t_R = 2π√n̄ / g\u003c/text\u003e\u003ctext x=\"100\" y=\"395\" fill=\"#7aa2ff\" font-size=\"13\" text-anchor=\"start\"\u003eRabi comb 2g√(n+1)\u003c/text\u003e\u003c/svg\u003e\n*Figure: Schematic inversion $W(t)$ for $|e\\rangle\\otimes|\\alpha\\rangle$ with $\\bar n\\sim 25$. Fast oscillations at $\\Omega_n=2g\\sqrt{n+1}$ (blue) dephase on $t_c\\sim 1/g$, then rephase into revivals at integer multiples of $t_R=2\\pi\\sqrt{\\bar n}/g$ under a slowly broadening envelope (orange).*\n\n### Knight and Radmore 1982: why it happens\n\nThe 1980 result was numerical-and-asymptotic; the intuitive explanation appeared two years later in Knight and Radmore [18]. Their argument is the one repeated, often without citation, in every modern lecture course. Expanding $\\sqrt{n+1}$ about the mean,\n$$\n\\Omega_n \\;=\\; 2g\\sqrt{n+1} \\;\\approx\\; 2g\\sqrt{\\bar n+1}\\;+\\;\\frac{g}{\\sqrt{\\bar n+1}}(n-\\bar n)\\;+\\;\\mathcal{O}\\!\\Big(\\frac{(n-\\bar n)^2}{\\bar n^{3/2}}\\Big),\n$$\nthe spread of frequencies seen by a Poissonian wavepacket of width $\\Delta n=\\sqrt{\\bar n}$ is\n$$\n\\Delta\\Omega \\;\\approx\\; \\frac{g}{\\sqrt{\\bar n}}\\cdot\\sqrt{\\bar n}\\;=\\;g,\n$$\ngiving a coupling-only collapse time $t_c\\sim 1/g$. Revivals occur when *neighbouring* frequencies have slipped by exactly $2\\pi$ relative to one another,\n$$\n\\big(\\Omega_{n+1}-\\Omega_n\\big)\\,t_R \\;\\approx\\;\\frac{g}{\\sqrt{\\bar n}}\\,t_R \\;=\\;2\\pi\\;\\;\\Longrightarrow\\;\\;t_R \\;=\\;\\frac{2\\pi\\sqrt{\\bar n}}{g}.\n$$\nThe number of oscillations visible inside one envelope is $t_R/t_c \\sim \\sqrt{\\bar n}$. Revivals decay because the linearization is only first-order in $(n-\\bar n)$; the quadratic curvature in $\\sqrt{n+1}$ supplies a residual dephasing that destroys the $k$th revival on a timescale $\\sim \\bar n/g$. The dressed-state version of the same statement is that $W(t)$ is a Fourier sum over the JC ladder splittings $E_{n,+}-E_{n,-} = \\hbar\\Omega_n$; revivals are *rational* commensurabilities of an irrationally-spaced spectrum, and so are necessarily approximate and progressively smeared. This explanation is the one Shore and Knight [13] adopted as canonical, and via [15] entered every subsequent textbook.\n\n### Why the misattribution is durable\n\nThree causes. (i) Citation compression: by the late 1980s the experimental confirmation [6] was so tightly entangled with the JCM label that the prediction got back-projected onto the model's eponym. (ii) Cummings 1965 [11] does carry the word \"collapse\" — readers who never reach the 1980 PRL assume the rest of the phenomenon is there too. (iii) Jaynes' own retrospective writing [8] emphasized the JCM as a complete predictive structure without flagging the 1980 step, and the Allen–Eberly textbook [10] predates the revival result by five years and so could not codify it. The careful pedagogical reviews [15, 13] get the chronology right; almost every secondary source does not. The honest one-line attribution is: *collapse for thermal light, Cummings 1965 [11]; periodic revivals for coherent light, Eberly–Narozhny–Sánchez-Mondragón 1980 [7]; dressed-state interference explanation, Knight–Radmore 1982 [18]; experimental verification, Rempe–Walther–Klein 1987 [6]*. The 1963 paper is the foundation, not the prediction."}, {"id": "extensions-tavis-cummings-multiphoton-dissipative", "title": "Extensions and Supersessions: Tavis–Cummings, k-Photon JCM, and the Open-System JCM", "markdown": "## Extensions and Supersessions: Tavis–Cummings, k-Photon JCM, and the Open-System JCM\n\nThe 1963 model is a maximally idealized object: one atom, one mode, one coupling, no dissipation, RWA. Every word of that description has been relaxed, and each relaxation generated a literature of its own. Three branches dominate. The collective generalization (Tavis–Cummings) extends $N=1$ to arbitrary $N$ while keeping the RWA and the single mode. The multiphoton generalization (Sukumar–Buck) keeps $N=1$ but replaces the linear coupling $a\\sigma_+ + \\text{h.c.}$ by $a^k\\sigma_+ + \\text{h.c.}$. The open-system generalization couples the JCM bilinearly to Markovian baths, producing the master equation that describes every experimental run. Each branch supersedes the bare 1963 model in a specific regime; outside that regime, it does not.\n\n### Tavis–Cummings: from a single dipole to a collective spin\n\nThe Tavis–Cummings (TC) Hamiltonian [3] is the RWA reduction of the Dicke model [2]:\n$$H_\\text{TC} = \\hbar\\omega\\, a^\\dagger a + \\hbar\\omega_0\\, J_z + \\hbar g\\bigl(aJ_+ + a^\\dagger J_-\\bigr),$$\nwhere $J_\\alpha = \\tfrac{1}{2}\\sum_{i=1}^N \\sigma_\\alpha^{(i)}$ are collective spin operators. Tavis and Cummings exploited the fact that $\\mathbf{J}^2$ commutes with $H_\\text{TC}$: the dynamics splits into blocks labelled by the SU(2) Casimir $J\\le N/2$. Within the totally-symmetric Dicke ladder ($J = N/2$) the conserved excitation number $\\mathcal{N} = a^\\dagger a + J_z + N/2$ again truncates the problem to $(2J+1)$-dimensional sectors, so the model is exactly soluble — but only inside one symmetry sector at a time. The vacuum Rabi splitting becomes the celebrated $\\sqrt{N}$-enhanced collective coupling $g_N = g\\sqrt{N}$, observed routinely in cold-atom cavity QED [23] and in superconducting transmission-line arrays [19].\n\nWhat TC supersedes — and what it does not — must be stated carefully. In the thermodynamic limit $N\\to\\infty$ at fixed $g\\sqrt{N}$, TC predicts a quantum phase transition at $g_c\\sqrt{N} = \\tfrac{1}{2}\\sqrt{\\omega\\omega_0}$ into a superradiant phase with $\\langle a\\rangle\\ne 0$. The famous Rzążewski–Wódkiewicz–Żakowicz no-go theorem (1975, not in the corpus; verify) shows that the diamagnetic $A^2$ term arising from minimal coupling forbids the analogous transition in the full Dicke Hamiltonian in any gauge-consistent matter–light theory. The no-go theorem does *not* directly invalidate the TC transition, because TC has already discarded the counter-rotating term by hand; gauge-invariance is broken at the Hamiltonian level before $A^2$ ever enters. The cleanest reading: TC is a faithful effective model for collective vacuum Rabi physics at $g\\sqrt{N}\\ll\\omega$ — and a *suspect* model for the superradiant transition itself, where the very approximation that makes TC solvable is the approximation the no-go theorem says one cannot make. Recent work continues to harvest accidental symmetries of TC for control protocols and exact spectra [24, 25].\n\n### k-Photon JCM: an exactly-soluble nonlinear family\n\nSukumar and Buck [26] noticed that the JCM remains exactly soluble if the linear coupling is replaced by a $k$th-order one,\n$$H_k = \\hbar\\omega\\, a^\\dagger a + \\tfrac{1}{2}\\hbar\\omega_0\\,\\sigma_z + \\hbar g_k\\bigl(a^k\\sigma_+ + a^{\\dagger k}\\sigma_-\\bigr).$$\nThe conserved excitation $\\mathcal{N}_k = a^\\dagger a + k\\,\\sigma_+\\sigma_-$ block-diagonalizes $H_k$ into $2\\times 2$ subspaces $\\{|e,n\\rangle, |g,n+k\\rangle\\}$ at the multiphoton resonance $k\\omega = \\omega_0$. The Rabi matrix element becomes\n$$\\Omega_n^{(k)} = 2g_k\\sqrt{\\frac{(n+k)!}{n!}},$$\nso for $k\\ge 2$ the splitting grows polynomially in $n$. Revivals proliferate, trapping states multiply, and number-state statistics control the dynamics far more sharply than for $k=1$ [27, 28, 18].\n\nWhere does $H_k$ genuinely supersede the bare JCM? Two places. First, in *engineered* couplings — parametric drives, vibronic interactions, multiphonon sidebands of trapped ions [29] — where the leading physical interaction really is $a^k\\sigma_+$ and the linear term is forbidden by selection rules or detuning. Second, as a tractable proxy for sideband dynamics in the Lamb–Dicke regime, where the Hamiltonian is *by construction* $H_k$ with $k$ set by the sideband order. Where it does not supersede: optical-frequency dipole transitions, where $k=1$ is the actual coupling and higher $k$ are perturbative corrections rather than independent models. The corpus contains a small industry of further generalized JCMs — intensity-dependent couplings, relativistic parametric amplifiers, inverse Holstein–Primakoff reformulations, search-algorithm reinterpretations [30, 31, 32] — almost all of which are reformulations or limiting cases of $H_k$ rather than independent extensions.\n\n### The Open-System JCM: the only version any experiment can see\n\nNo physical cavity is closed and no atom is immortal. The minimal master equation that any cavity-QED experiment actually obeys is\n$$\\dot\\rho = -\\tfrac{i}{\\hbar}[H_\\text{JC},\\rho] + \\kappa\\,\\mathcal{D}[a]\\rho + \\gamma\\,\\mathcal{D}[\\sigma_-]\\rho + \\gamma_\\phi\\,\\mathcal{D}[\\sigma_z/2]\\rho,$$\nwith $\\mathcal{D}[L]\\rho = L\\rho L^\\dagger - \\tfrac{1}{2}\\{L^\\dagger L,\\rho\\}$, photon-loss rate $\\kappa$, spontaneous-emission rate $\\gamma$, and pure-dephasing rate $\\gamma_\\phi$. The Liouvillian preserves the U(1) excitation number only in expectation, not as a strict block decomposition; its spectrum is complex and the JCM dressed states acquire linewidths $\\sim(\\kappa+\\gamma)/2$ in the resonant, low-excitation sector. The \"strong coupling\" criterion $2g \u003e \\kappa,\\gamma$ is the condition that those linewidths do not swamp the $2g\\sqrt{n+1}$ splittings, so that the JCM eigenstructure remains spectroscopically visible.\n\nThis is the model that actually describes the one-atom maser [6, 33], Rydberg-atom microwave cavity QED [5, 17], optical Fabry–Pérot cavity QED [34, 35], plasmonic strong coupling [36], and circuit QED [19]. The standard solution techniques — quantum-jump unraveling [37], adiabatic elimination of the cavity in the bad-cavity limit (yielding the Purcell-enhanced spontaneous-emission rate $\\gamma_P = 4g^2/\\kappa$), and polaron-frame perturbation — were each refined specifically against the JCM as a calibration substrate. Yoo and Eberly's Physics Reports review [38] consolidated the dissipative formulation as the working language of cavity QED, and the JCM master equation has remained the canonical test bed for approximate dissipative treatments [39].\n\nThe open-system JCM supersedes the closed one whenever $(\\kappa,\\gamma)\\,t \\gtrsim 1$, which is most of the time outside microwave-Rydberg setups: the coherent collapse-and-revival envelope is multiplied by $\\exp[-(\\kappa+\\gamma)t/2]$, and revivals are eaten before they finish in nearly all optical and plasmonic systems. It does *not* supersede the closed JCM in the strict coherent regime over a few Rabi periods — precisely the regime [5] exploits — and it does not by itself capture non-Markovian dynamics, structured baths, or correlated reservoirs. Current work on the supersymmetry of dissipative Bose–Fermi systems [40] extends the Lindblad picture rather than replacing it.\n\nThree extensions, three different ways the 1963 toy outgrows itself: more atoms, more photons per quantum, and more environment. None is universally \"better\": each is the right model in a regime where the bare JCM is wrong, and the wrong model everywhere else. The 1963 Hamiltonian survives not because it has not been superseded — it has, repeatedly — but because it is the unique exactly-soluble fixed point against which every supersession is calibrated."}, {"id": "conflations-and-validity-audit", "title": "What the Literature Confuses: RWA, Rabi vs Vacuum-Rabi, Strong vs Ultrastrong, Dressed vs Dressed", "markdown": "## What the Literature Confuses: RWA, Rabi vs Vacuum-Rabi, Strong vs Ultrastrong, Dressed vs Dressed\n\nThe JCM is short, exactly soluble, and pedagogically irresistible — qualities that have made it the carrier vehicle for at least six distinct confusions in the modern literature. They are not innocuous: each elides a regime boundary, and several mask a failed approximation or a no-go theorem.\n\n### 1. JCM vs the full quantum Rabi model\n\nThe Hamiltonian universally written down for \"a two-level atom in a cavity\" is\n$$H_{\\text{QRM}} = \\hbar\\omega\\, a^\\dagger a + \\tfrac{1}{2}\\hbar\\omega_0\\,\\sigma_z + \\hbar g(a + a^\\dagger)(\\sigma_+ + \\sigma_-).$$\nThis is the quantum Rabi model (QRM). The JCM is obtained by dropping $a\\sigma_- + a^\\dagger\\sigma_+$, the counter-rotating terms,\n$$H_{\\text{JCM}} = \\hbar\\omega\\, a^\\dagger a + \\tfrac{1}{2}\\hbar\\omega_0\\,\\sigma_z + \\hbar g(a\\sigma_+ + a^\\dagger\\sigma_-).$$\nThe two have qualitatively different symmetries. JCM commutes with the excitation number $N = a^\\dagger a + \\sigma_+\\sigma_-$, a U(1) charge, so the Hilbert space splits into $2\\times 2$ blocks and the spectrum is the elementary $\\pm\\hbar g\\sqrt{n+1}$ ladder. The QRM has only the $\\mathbb{Z}_2$ parity $\\Pi = e^{i\\pi N}$; no continuous conservation law, hence no block diagonalization in elementary terms. Braak (2011) showed that the QRM is nevertheless integrable in Yang's sense — its spectrum is fixed by the zeros of a transcendental $G$-function — but there is no closed-form basis (verify).\n\nValidity of the RWA needs *both* $g/\\omega \\ll 1$ and detuning $|\\Delta| = |\\omega_0 - \\omega| \\ll \\omega$. When either fails one cannot drop the counter-rotating terms even perturbatively: they shift the resonance (Bloch–Siegert) and dress the ground state with virtual photons [41, 42, 14]. The recent literature [14] explicitly asks whether the JCM retains any predictive content once one leaves the perturbative window.\n\n### 2. Semiclassical Rabi frequency vs vacuum Rabi frequency\n\n\"Rabi oscillation\" carries two meanings stacked on top of each other.\n\nSemiclassical, after Rabi 1937 [1]: an atom driven by a classical field of amplitude $E$ oscillates at\n$$\\Omega_R = \\frac{dE}{\\hbar},$$\nwhich vanishes as $E\\to 0$. This is a c-number statement; field quantization plays no role.\n\nQuantum, in JCM: an atom prepared in $|e,n\\rangle$ exchanges excitation with the field at\n$$\\Omega_n = 2g\\sqrt{n+1}.$$\nThe $+1$ is the entire point. At $n=0$, $\\Omega_0 = 2g \\neq 0$: the *vacuum* Rabi frequency, finite when no photon is present. There is no semiclassical limit in which a vanishing field produces oscillations, so $\\Omega_0$ is a direct probe of field quantization. Brune *et al.* [5] resolved $\\Omega_n \\propto \\sqrt{n+1}$ photon by photon in a microwave cavity, the cleanest single-experiment refutation of any semiclassical theory of resonant absorption. Calling both phenomena \"Rabi oscillations\" without modifier obliterates precisely the distinction the 1963 paper [4] was written to expose.\n\n### 3. Single-atom JCM, Tavis–Cummings, and the Dicke no-go\n\nTavis \u0026 Cummings [3] generalized the JCM to $N$ identical two-level atoms collectively coupled to one mode under the RWA. Because the coupling is permutation-symmetric, the collective spin $\\mathbf{J} = \\sum_i \\boldsymbol{\\sigma}_i/2$ has fixed magnitude $J \\le N/2$ inside each sector, and\n$$H_{\\text{TC}} = \\hbar\\omega\\, a^\\dagger a + \\hbar\\omega_0 J_z + \\hbar g\\,(aJ_+ + a^\\dagger J_-)$$\nagain carries a U(1) conservation law. In the thermodynamic limit $N\\to\\infty$ with $g\\sqrt{N}$ fixed, TC has a second-order *superradiant* phase transition at $g\\sqrt{N} = \\sqrt{\\omega\\omega_0}/2$. This is sometimes called \"the Dicke phase transition\", and that is where the confusion enters.\n\nThe Dicke model is the *non-RWA* parent, with $(a+a^\\dagger)J_x$ coupling. In minimal coupling — when the underlying $\\mathbf{p}\\cdot\\mathbf{A}$ Hamiltonian is rewritten with its $\\mathbf{A}^2$ term — Rzążewski, Wódkiewicz and Żakowicz (1975) proved that the diamagnetic contribution forbids the superradiant transition: the Thomas–Reiche–Kuhn sum rule saturates the would-be order parameter (verify). Under the RWA the $\\mathbf{A}^2$ term is partially absorbed into the rotating coupling and the no-go theorem does *not* apply to Tavis–Cummings; the TC transition is real within its own RWA universe. Circuit-QED implementations [19, 14] reopened the question in a regime where Coulomb-gauge versus dipole-gauge equivalence is not automatic. \"TC is just JCM with N atoms\" hides all of this.\n\n### 4. Strong, ultrastrong, deep-strong\n\nThese three labels track three independent dimensionless ratios.\n\n| Regime | Defining inequality | Status of JCM |\n|---|---|---|\n| Strong | $g \u003e \\kappa,\\,\\gamma$ | Valid; coherent exchange resolved |\n| Ultrastrong | $g/\\omega \\gtrsim 0.1$ | RWA fails; Bloch–Siegert shift appears |\n| Deep-strong | $g/\\omega \\gtrsim 1$ | Ground state holds virtual photons; JCM qualitatively wrong |\n\nStrong coupling is a *kinetic* condition: the vacuum Rabi splitting $2g$ exceeds the cavity loss $\\kappa$ and atomic dephasing $\\gamma$, so individual exchange cycles are visible before decoherence. It says nothing about $g/\\omega$. Ultrastrong and deep-strong are *spectroscopic* conditions on the bare-system scales: they signal RWA breakdown independent of dissipation. The first ultrastrong observations in circuit QED [41, 42] saw the Bloch–Siegert shift while still satisfying $g \\gg \\kappa$. Conversely, optical cavity QED is comfortably strong-coupled at $g/\\omega \\sim 10^{-7}$, deep inside the RWA's domain.\n\n### 5. JCM dressed states vs Cohen-Tannoudji dressed atom\n\nBoth phrases use \"dressed\", both produce avoided crossings, and the two are routinely conflated. They are different objects.\n\nJCM dressed states are eigenvectors in fixed photon-number manifolds,\n$$|n,\\pm\\rangle = \\cos\\theta_n|e,n\\rangle \\pm \\sin\\theta_n|g,n+1\\rangle,\\qquad \\tan 2\\theta_n = \\frac{2g\\sqrt{n+1}}{\\Delta}.$$\nThe ladder is anharmonic, splittings scale as $\\sqrt{n+1}$, and the natural observables are the photon-number-resolved Rabi peaks of [5].\n\nCohen-Tannoudji's dressed atom is constructed in a basis where the field is a coherent state with large mean photon number $\\bar n \\gg 1$ — equivalently a classical drive plus quantum sidebands. Splittings become $\\bar n$-independent at fixed Rabi frequency $\\Omega = 2g\\sqrt{\\bar n}$, the ladder is equally spaced, and the resulting spectrum is the Mollow triplet, which any semiclassical theory reproduces. The two pictures coincide only in the limit $n\\to\\infty$ with $g\\sqrt{n}$ fixed [15, 13]. Stating that \"the Mollow triplet is JCM\" is therefore a category error: it is the classical limit of JCM in which the discrete $\\sqrt{n+1}$ ladder smears into a continuum.\n\n### 6. Plasmonic \"single-molecule strong coupling\" vs cavity-QED strong coupling\n\nPlasmonic nanocavity experiments [36] have reported $g \u003e \\kappa$ for a single emitter at room temperature — formally strong coupling. But $\\kappa$ here is enormous (tens to hundreds of meV) and pure dephasing $\\gamma_\\phi$ is comparable. The JCM ladder is dressed by phonon and plasmon baths so broad that the discrete $\\sqrt{n+1}$ structure is unresolvable; what is observed is a vacuum Rabi splitting in linear spectroscopy with no number-resolved counterpart. The applicable model is not bare JCM but Holstein–Tavis–Cummings with massive cavity- and emitter-loss channels [37]. The phrase \"single-molecule strong coupling\" is technically correct at the level of $g \u003e \\kappa$, yet the physical content — coherent, reversible exchange of a single quantum — is generally not demonstrated. Treating plasmonic spectra as evidence of clean JCM dynamics is the regime confusion most likely to mislead a newcomer who has only read the [4],[13] lineage."}, {"id": "landmark-experiments", "title": "From Blackboard to Laboratory: One-Atom Maser, Photon-Number-Resolved Vacuum Rabi, and Circuit QED", "markdown": "## From Blackboard to Laboratory: One-Atom Maser, Photon-Number-Resolved Vacuum Rabi, and Circuit QED\n\nFor two decades after 1963 the Jaynes–Cummings Hamiltonian lived an exclusively theoretical life. Nothing in the optical regime could realize it: spontaneous emission into the $4\\pi$ continuum dwarfed any single-mode coupling, and the relevant quantity $g/\\kappa$ — coherent exchange rate over cavity loss rate — was hopelessly below unity. The conversion from blackboard to laboratory required three independent technical leaps: (i) atoms with absurdly large dipole moments (circular Rydberg states, $n\\sim 50$–$60$, dipole $\\sim n^{2}ea_{0}$); (ii) a single electromagnetic mode with photon lifetime long enough to be addressed coherently (superconducting niobium millimetre-wave cavities, $Q\\sim 10^{8}$–$10^{10}$); (iii) atomic velocity selection so that the interaction time $\\tau = L/v$ is a well-defined parameter rather than a thermal average. The combination was assembled at the Max-Planck-Institut für Quantenoptik in Garching.\n\n### The one-atom maser as a JCM platform\n\nThe decisive instrument is the one-atom maser of Meschede, Walther and Müller [33]. A thermal beam of $^{85}$Rb is laser-excited into a circular Rydberg state $|63\\,p_{3/2}\\rangle$, velocity-selected, and sent through a cylindrical Nb cavity at $T \\lesssim 0.5$ K resonant on the $63p \\to 61d$ transition near $21$ GHz. The atomic flux is kept so low ($N\\tau \u003c 1$) that with overwhelming probability only one atom traverses the mode at a time. Atoms exit through state-selective field-ionization detectors, returning a binary record $\\{|e\\rangle, |g\\rangle\\}$ as a function of $\\tau$ and of the incoming pumping rate. This is, almost literally, the experimental embodiment of $H = \\hbar\\omega a^{\\dagger}a + \\tfrac{1}{2}\\hbar\\omega_{0}\\sigma_{z} + \\hbar g(a\\sigma_{+} + a^{\\dagger}\\sigma_{-})$: one atom, one mode, RWA validity automatic because $g/\\omega \\sim 10^{-7}$, and a steady-state photon distribution determined by the interplay between atom-driven gain and cavity loss. The 1985 paper already demonstrated sub-Poissonian photon statistics and the appearance of \"trapping states\" $|n_{q}\\rangle$ at interaction times satisfying $g\\tau\\sqrt{n_{q}+1} = q\\pi$ — phenomena with no semiclassical interpretation, because in a semiclassical maser the steady-state field amplitude is a continuous variable, not a number eigenstate.\n\n### Collapse and revival, 1987\n\nThe signature falsification of semiclassical electrodynamics came two years later in Rempe, Walther and Klein [6]. With the same apparatus they measured the probability $P_{e}(\\tau)$ that the atom leaves in the excited state, as a function of interaction time $\\tau$, for low mean photon numbers $\\bar n \\sim 1$–$2$. The data display the textbook structure predicted by Eberly–Narozhny–Sánchez-Mondragón [7]: Rabi oscillation at the start, suppression of contrast on the dephasing timescale $t_{\\mathrm{c}} \\sim 1/g$, near-silence for $g t \\sim \\pi\\sqrt{\\bar n}$, and reappearance at $t_{\\mathrm{r}} \\sim 2\\pi\\sqrt{\\bar n}/g$. The interference between Rabi frequencies $\\Omega_{n} = 2g\\sqrt{n+1}$ weighted by a coherent (or here, sub-Poissonian thermal-plus-pumped) photon distribution is the whole story. The point of principle is sharp: a semiclassical or neoclassical theory — including the one Jaynes was still defending in 1973 [8] — predicts monochromatic Rabi flopping with no revival, because there is no $\\sqrt{n+1}$ ladder to dephase and rephase. The Garching record is the first datum that cannot be reproduced by any c-number field theory, regardless of which photon distribution one imputes. Jaynes' own model had become the cleanest demonstration that his larger program was wrong.\n\n### Photon-number-resolved vacuum Rabi, 1996\n\nThe remaining quantitative prediction is the $\\sqrt{n+1}$ law itself. Brune, Schmidt-Kaler, Maali, Dreyer, Hagley, Raimond and Haroche [5] resolved it photon by photon. Using an ENS-Paris microwave cavity ($Q \\sim 10^{8}$, photon lifetime $\\sim 1$ ms) and circular Rydberg atoms in the $51 \\to 50$ transition near $51$ GHz, they prepared the cavity either in vacuum or in a small coherent state, then sent a resonant atom through and recorded $P_{e}(\\tau)$. Fourier analysis revealed discrete frequencies $\\Omega_{0}, \\Omega_{1}, \\Omega_{2}, \\ldots$ in ratios consistent with $\\sqrt{1}:\\sqrt{2}:\\sqrt{3}:\\ldots$, with weights matching the Poisson distribution of $|\\alpha\\rangle$. The two consequences are independent:\n\n- The component at $\\Omega_{0} = 2g$, observed with the cavity in vacuum, is the vacuum Rabi oscillation. It exists because $a^{\\dagger}|0\\rangle = |1\\rangle$ with non-zero norm — i.e. because the field is quantized. A semiclassical zero-field theory predicts $\\Omega = 0$.\n- The non-equidistant ladder $\\Omega_{n}/\\Omega_{0} = \\sqrt{n+1}$ is the JCM spectrum, and is qualitatively distinct from the equidistant ladder of any harmonic-oscillator coupling. The dressed eigenvalues $E_{n,\\pm} = \\hbar\\omega(n+\\tfrac{1}{2}) \\pm \\hbar g\\sqrt{n+1}$ are visible directly in the data.\n\nTogether these falsify (i) Jaynes' neoclassical theory of spontaneous emission, (ii) any stochastic-electrodynamics surrogate that mimics vacuum fluctuations with a c-number noise field of fixed power spectrum, and (iii) the family of \"rate-equation maser\" models that predict only $\\Omega_{n} \\propto n$ for stimulated processes. Haroche's 2012 Nobel lecture [43] retrospectively framed the entire Rydberg-atom/microwave-cavity programme as the experimental embodiment of the JCM, and that framing has stuck.\n\n### Circuit QED: the JCM becomes routine and starts to break\n\nThe cavity-QED programme operates at $g/\\omega \\sim 10^{-7}$–$10^{-6}$; the RWA is so well satisfied that the question of its validity is academic. The decisive shift was the importation of the JCM into superconducting circuits. A transmon or flux qubit replaces the atom, a coplanar-waveguide or 3D microwave resonator replaces the Fabry–Pérot, and the dipole moment is now geometric (electric-field overlap with a macroscopic capacitor) rather than atomic. The coupling $g/2\\pi$ jumps from $\\sim 50$ kHz in Rydberg-atom cavities to $\\sim 100$ MHz in circuit QED, with $\\omega/2\\pi \\sim 5$–$10$ GHz, i.e. $g/\\omega \\sim 10^{-2}$ — already approaching, in the same hardware, the regime where the RWA starts to be probed. Reviews such as You and Nori [19] catalogue the migration and its consequence: JCM phenomena (vacuum Rabi splitting, number-resolved spectroscopy, dispersive readout, photon-blockade) became standard diagnostics in a few years.\n\nTwo experimental milestones then carried the platform past the JCM itself. Niemczyk *et al.* [41] coupled a flux qubit to a coplanar-waveguide resonator with $g/\\omega \\approx 0.12$, an ultrastrong-coupling regime in which the counter-rotating terms cannot be dropped. The transmission spectrum displayed multi-photon transitions and dressed-state structure that JCM forbids and that the full quantum Rabi model reproduces. In parallel Forn-Díaz *et al.* [42] measured the Bloch–Siegert shift of a qubit's transition by a flux-tunable resonator at comparable coupling and quantified the leading non-RWA correction $\\delta_{\\mathrm{BS}} \\approx g^{2}/(\\omega+\\omega_{0})$, again missing from JCM. These observations falsify not the JCM as such, but the *universal* applicability of its central approximation: the RWA. From a Hamiltonian standpoint the data discriminate between a $U(1)$-symmetric model with conserved excitation number $\\mathcal{N} = a^{\\dagger}a + \\sigma_{+}\\sigma_{-}$ (JCM) and a merely $\\mathbb{Z}_{2}$-symmetric quantum Rabi model in which $\\mathcal{N}$ fluctuates and the ground state carries virtual photons $\\langle 0_{\\mathrm{dressed}}|a^{\\dagger}a|0_{\\mathrm{dressed}}\\rangle \\sim (g/\\omega)^{2}$.\n\n### What each experiment falsifies\n\nA compact ledger:\n\n| Experiment | Observable | Semiclassical alternative ruled out |\n|---|---|---|\n| Meschede–Walther–Müller 1985 [33] | sub-Poissonian photon statistics; trapping states at $g\\tau\\sqrt{n_{q}+1}=q\\pi$ | classical-amplitude maser with continuous steady-state field |\n| Rempe–Walther–Klein 1987 [6] | periodic collapse and revival of $P_{e}(\\tau)$ at $t_{r}\\sim 2\\pi\\sqrt{\\bar n}/g$ | Jaynes' neoclassical / semiclassical electrodynamics [8], any c-number stochastic-field surrogate |\n| Brune *et al.* 1996 [5] | discrete Rabi frequencies $\\Omega_{n}=2g\\sqrt{n+1}$, including $\\Omega_{0}=2g$ in vacuum | linear (equidistant) Rabi ladders; theories without vacuum field fluctuations |\n| You–Nori 2011 [19] review of cQED | reproduction of full JCM toolkit at $g/\\omega \\sim 10^{-2}$ | the claim that JCM physics is peculiar to atomic optics |\n| Niemczyk *et al.* 2010 [41] | multi-photon transitions, dressed splittings at $g/\\omega \\approx 0.12$ | JCM with strict RWA |\n| Forn-Díaz *et al.* 2010 [42] | Bloch–Siegert shift $\\propto g^{2}/(\\omega+\\omega_{0})$ | JCM (the shift is identically zero under RWA) |\n\nThe 1985–1996 sequence converts the JCM from a polemical illustration into the *measured* Hamiltonian of cavity QED; the 2010–2011 circuit-QED data then mark the experimental edge where the model's defining approximation is exposed. The intermediate textbook treatments of the model [13, 15, 16, 17] are largely retroactive in their authority: it is the Garching and ENS data, and not the original 1963 papers, that earn the JCM its present status. The Nobel committee in 2012 was effectively certifying not the model but the apparatus that had made it physical [43, 44]."}, {"id": "current-frontier-and-open-problems", "title": "Frontier: Ultrastrong Coupling, Braak Integrability, and Where JCM Genuinely Fails", "markdown": "## Frontier: Ultrastrong Coupling, Braak Integrability, and Where JCM Genuinely Fails\n\nThe Jaynes–Cummings Hamiltonian survives in the modern literature because four idealizations — two levels, one mode, rotating-wave coupling, no environment — happen to be simultaneously realizable in cavity and circuit QED at $g/\\omega \\sim 10^{-3}$. Push any of those four assumptions and the physics no longer lives in the U(1) ladder. The frontier is precisely the catalogue of regimes where the failure is not a quantitative correction but a qualitative one — different ground state, different selection rules, different spectrum.\n\n### Ultrastrong and deep-strong coupling\n\nDefine the dimensionless coupling $\\eta \\equiv g/\\omega$. The conventional taxonomy [19, 14] partitions the parameter axis as\n\n$$\\eta \\lesssim 10^{-2} \\text{ (strong)} \\;\u003c\\; 0.1 \\lesssim \\eta \\lesssim 1 \\text{ (ultrastrong, USC)} \\;\u003c\\; \\eta \\gtrsim 1 \\text{ (deep-strong, DSC)}.$$\n\nThe RWA discards $g(a\\sigma_- + a^\\dagger\\sigma_+)$, the counter-rotating piece. Restoring it gives the quantum Rabi Hamiltonian\n\n$$H_{\\text{Rabi}} = \\tfrac{1}{2}\\hbar\\omega_0\\sigma_z + \\hbar\\omega\\, a^\\dagger a + \\hbar g(\\sigma_+ + \\sigma_-)(a + a^\\dagger),$$\n\nwhose symmetry is reduced from U(1) to $\\mathbb{Z}_2$ parity $\\Pi = -\\sigma_z(-1)^{a^\\dagger a}$. Three measurable consequences appear when JCM is dropped:\n\n1. **Bloch–Siegert shift.** The lowest correction to the JCM eigenenergies scales as $g^2/(\\omega+\\omega_0)$. Forn-Díaz et al. resolved it cleanly in a flux qubit coupled to an LC oscillator at $\\eta \\approx 0.1$ [42]; Niemczyk et al. observed the full USC spectrum at $\\eta \\approx 0.12$ with a flux qubit galvanically coupled to a transmission-line resonator [41]. In Landau-polariton systems, Faist and coworkers pushed cyclotron-resonance coupling into the same regime in 2D electron gases coupled to terahertz metasurfaces, with vacuum Bloch–Siegert shifts as their signature (see [Bayer et al., *Nano Lett.* 17, 6340 (2017)](https://pubs.acs.org/doi/10.1021/acs.nanolett.7b03103) and [Li et al., *Nat. Photonics* 12, 324 (2018)](https://www.nature.com/articles/s41566-018-0153-0)).\n\n2. **Virtual photons in the ground state.** For $\\eta \\gtrsim 1$, the Rabi ground state is no longer $|g,0\\rangle$ but a squeezed-like state with $\\langle a^\\dagger a\\rangle \\neq 0$. Yoshihara et al. realized $\\eta \\approx 1.4$ in a flux-qubit–LC system, the first unambiguous DSC ([*Nat. Phys.* 13, 44 (2017)](https://www.nature.com/articles/nphys3906)); inversion of the qubit-level ordering in DSC was demonstrated subsequently. JCM cannot reproduce any of this — its ground state is fixed by construction.\n\n3. **Parity-selection rules.** Forbidden transitions in superconducting artificial atoms acquire finite matrix elements once the counter-rotating terms hybridize states of opposite JCM excitation number [45]. These are precisely the transitions JCM forbids by $[N,H]=0$.\n\n### Gauge-invariance controversy\n\nThe cleanest sign that JCM physics in USC is not merely \"JCM plus small corrections\" is that even the *full* Rabi model fails gauge invariance when one truncates the matter system to two levels. Di Stefano, Settineri, Macrì, Garziano, Stassi, Savasta, and Nori showed in [*Nature Physics* 15, 803 (2019)](https://www.nature.com/articles/s41567-019-0534-4) that the Coulomb-gauge and dipole-gauge two-level Rabi Hamiltonians give different spectra at $\\eta \\gtrsim 0.3$ unless the projection onto the two-level subspace is performed *after* the gauge-dependent minimal-coupling substitution. The cure is a modified Coulomb-gauge Rabi Hamiltonian containing nonlinear functions of the bosonic field; the dipole-gauge form remains the textbook one. The point for JCM dogma: any USC prediction made by writing $H_{\\text{JCM}}$ in the dipole gauge, computing, and converting back, is wrong at the level of the spectrum itself, not only at the level of small corrections [14].\n\nThe polemic continues. A 2023 round in *Nature Physics* on \"material truncation\" [Savage; reply](https://www.nature.com/articles/s41567-023-02178-1) sharpened the criterion but did not produce universal consensus on the right truncation prescription for arbitrary matter Hamiltonians. A *decisive* experimental test would be a USC platform in which one can independently access both gauges of the same physical observable (e.g., absorption versus emission spectra at the same $\\eta$) and verify that they coincide *only* when the corrected Coulomb-gauge Hamiltonian is used. Landau polaritons in nanoslot cavities, where the electric-dipole approximation visibly breaks down, are the most promising platform.\n\n### Braak integrability and the Bargmann solution\n\nFor four decades the full Rabi model was widely written down as \"non-integrable\" or \"only numerically solvable\". Braak's 2011 result ([*Phys. Rev. Lett.* 107, 100401 (2011)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.107.100401)) reframed both claims. Working in the Bargmann (Segal–Bargmann) holomorphic representation $a \\to z$, $a^\\dagger \\to d/dz$, he obtained the regular spectrum as the zeros of a transcendental $G_\\pm(x)$ in each parity sector — explicit power-series expressions with simple poles at $x = n\\omega$. The full spectrum is the union of the regular zeros and the *exceptional* (Juddian) eigenvalues coinciding with the poles, which exist for fine-tuned parameters.\n\nBraak's accompanying proposal — that integrability can be defined by the existence of one quantum number per discrete symmetry, here $\\mathbb{Z}_2$ — generated immediate dispute (see [Batchelor \u0026 Zhou's comment, arXiv:1205.3139](https://arxiv.org/abs/1205.3139)). The current consensus among the community working on generalized Rabi models is more modest: Braak's $G$-function is a *solution* (transcendental but exact), the integrability question is taxonomic. The construction has since been extended to two-photon Rabi (where it reveals a spectral-collapse threshold at $g = \\omega/2$), to the anisotropic model that interpolates between JCM ($g_{\\text{co}}=0$) and Rabi ($g_{\\text{co}}=g_{\\text{ro}}$), and to the asymmetric (biased) Rabi model with $\\epsilon\\sigma_x$ term, whose hidden $\\mathbb{Z}_2$ at $\\epsilon = n\\omega/2$ was the last symmetry mystery to fall.\n\nThe relevance for JCM-frontier work is concrete: anisotropic Rabi simulators are being implemented in circuit QED [46, 47], and the asymmetric model is the natural description of any flux qubit biased away from its sweet spot [48]. Each of these is a model the JCM cannot accommodate even qualitatively (the U(1) sector structure is gone), yet each is *exactly* soluble in Braak's sense.\n\n### Driven-dissipative JCM and photon-blockade breakdown\n\nRestore environment and drive: $H_{\\text{JCM}} \\to H_{\\text{JCM}} + \\eta(ae^{i\\omega_d t}+\\text{h.c.})$ with photon loss $\\kappa$ and atomic decay $\\gamma$. Below threshold the anharmonic JCM ladder produces photon blockade — at a multi-photon resonance, populating $n$-th rung requires $n$ simultaneous drive photons. Carmichael showed in [*Phys. Rev. X* 5, 031028 (2015)](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.5.031028) that as the drive is increased the blockade collapses via a *first-order* dissipative phase transition in zero spatial dimension, terminating at a critical point where the transition becomes continuous. The order parameter is the intracavity photon number; the discontinuity is a bona fide nonanalyticity of the steady-state Liouvillian gap in the thermodynamic limit $g/\\kappa \\to \\infty$. Fink et al. observed it in circuit QED ([*Phys. Rev. X* 7, 011012 (2017)](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.7.011012)). This is JCM physics — the model itself is fine — but it is the regime where the steady-state is *not* a perturbation of $|g,0\\rangle$, the rotating frame becomes treacherous, and quantum trajectory methods (Plenio–Knight [37]) become the obligatory language rather than a calculational convenience.\n\n### Open questions and decisive tests\n\n(i) *Is there a clean Landau-polariton experiment that distinguishes the modified Coulomb-gauge Rabi Hamiltonian from the dipole-gauge one at the level of $\\langle a^\\dagger a\\rangle$ in the ground state?* The two predictions begin to diverge at $\\eta \\gtrsim 0.3$; a sub-cycle Wigner-tomography of the vacuum-fluctuation field would settle the gauge dispute experimentally rather than by formal argument.\n\n(ii) *Where does the Braak $G$-function fail to converge as a calculational tool?* For two-photon Rabi the spectral-collapse point $g=\\omega/2$ is a genuine pathology; whether analogous accumulation points exist in $k$-photon JCM for $k \\geq 3$ remains, to my reading, open.\n\n(iii) *Is there a regime in which JCM is the wrong starting point but no exactly soluble replacement exists?* The driven anisotropic Rabi model with Markovian dissipation appears to be one such — recent geometric-criticality results [49] suggest a critical manifold not captured by mean field, with no known closed-form spectrum.\n\nThe JCM remains the cleanest *language* in cavity QED. The frontier is the catalogue of physics that this language cannot speak."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have lived inside this Hamiltonian long enough to have opinions. Here they are, unhedged.\n\n### (a) What I will defend with my reputation\n\nThe Jaynes–Cummings Hamiltonian, in its narrow regime of validity — $g/\\omega \\lesssim 10^{-2}$, $|\\Delta|/\\omega \\ll 1$, single mode, two well-isolated levels, dissipation slower than $g$ — is the most quantitatively successful model in all of quantum optics. The $\\sqrt{n+1}$ vacuum-Rabi ladder is not an artifact of RWA; it is a direct consequence of $[N,H]=0$ with $N=a^\\dagger a + \\sigma_+\\sigma_-$, and it has been resolved photon-by-photon in both microwave Rydberg cavities and superconducting transmons. I will also defend, against the still-fashionable revisionism, that **Eberly, Narozhny and Sánchez-Mondragón (1980)** [the EBN paper], not Jaynes \u0026 Cummings, are the discoverers of coherent-state revivals; the 1963 paper computes single-frequency oscillations for number states and explicitly *downplays* the quantum/semiclassical distinction. Finally: **Harry Paul's 1963 Annalen der Physik priority is real**, independent, and substantively equivalent for the closed-system one-mode problem. Writing \"Jaynes–Cummings–Paul\" is historically accurate; the Anglo-American elision is a citation-network artifact, not a judgment of content.\n\n### (b) What is shakier than the literature admits\n\nFour specific assumptions are routinely smuggled past the reader:\n\n1. **The two-level truncation in transmons.** Circuit-QED papers quoting JCM predictions at $g/\\omega \\sim 0.05$–$0.1$ are simultaneously in a regime where transmon anharmonicity $\\alpha/\\omega \\sim 0.04$ is *smaller* than the coupling. The \"JCM\" being fit is often a Duffing–Rabi model whose higher levels have been adiabatically eliminated; the residual error is conflated with calibration drift.\n2. **The single-mode idealization in cavity/circuit QED.** Purcell tails, slot modes, and the continuum above the photonic bandgap mean the \"one mode\" is dressed by a structured reservoir. The Lindblad-JCM with a flat $\\kappa$ hides this; the resulting decoherence is then misattributed to \"intrinsic\" $1/f$ noise.\n3. **The RWA-Lindblad combination.** Adding $\\mathcal{D}[a]$ and $\\mathcal{D}[\\sigma_-]$ on top of a JCM Hamiltonian is not a controlled approximation when one cares about steady-state photon statistics in the ultrastrong regime — the dissipators must themselves be derived in the dressed basis, a point still routinely ignored.\n4. **Braak \"integrability\" of the quantum Rabi model.** A transcendental constraint with countably many roots is integrability in a weak sense; it does not give the kind of closed-form spectral function the JCM admits, and the literature occasionally oversells this.\n\n### (c) Three open questions I would actually work on\n\n1. **A genuinely non-Markovian, non-RWA solution of the driven dissipative Rabi model at $g/\\omega \\sim 0.3$.** Because every existing \"ultrastrong\" experiment is interpreted through a hybrid of Bloch–Siegert-corrected JCM plus phenomenological dissipators, and the corrections do not commute.\n2. **Photon-number-resolved tomography of the dressed-state ladder in the deep-strong regime ($g/\\omega \\gtrsim 1$).** Because the predicted virtual-photon ground state has never been directly counted, only inferred from spectroscopy.\n3. **A rigorous derivation of the minimal-coupling no-go theorem (Rzążewski–Wódkiewicz–Żakowicz) inside circuit QED's lumped-element gauge.** Because the recurring \"we have observed the superradiant phase transition\" claims keep being walked back, and the gauge issue is the reason.\n\n### (d) Reading path\n\n1. **Jaynes \u0026 Cummings, Proc. IEEE 51, 89 (1963)** [4] — read for what it actually says, not what it is remembered as saying; note the neoclassical motivation.\n2. **Paul, Ann. Phys. (Leipzig) 466, 411 (1963)** — the erased independent derivation; pair it with [4] to see priority clearly.\n3. **Stenholm, Phys. Rep. 6, 1 (1973)** — the review that crystallized the name \"Jaynes–Cummings model\" and set the modern framing.\n4. **Eberly, Narozhny \u0026 Sánchez-Mondragón, PRL 44, 1323 (1980)** — the revival prediction itself; one of the cleanest \"field quantization has observable consequences\" arguments ever written.\n5. **Braak, PRL 107, 100401 (2011)** — the proper place to learn where JCM ends and the full quantum Rabi model begins, and why \"exactly solvable\" is a more delicate phrase than it looks."}], "references": [{"n": 1, "title": "Space Quantization in a Gyrating Magnetic Field", "authors": ["I. I. Rabi"], "year": 1937, "venue": "Physical Review 51, 652", "url": "https://doi.org/10.1103/PhysRev.51.652", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Coherence in Spontaneous Radiation Processes", "authors": ["R. H. Dicke"], "year": 1954, "venue": "Physical Review 93, 99", "url": "https://doi.org/10.1103/PhysRev.93.99", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Exact Solution for an N-Molecule–Radiation-Field Hamiltonian", "authors": ["M. Tavis", "F. W. Cummings"], "year": 1968, "venue": "Physical Review 170, 379", "url": "https://doi.org/10.1103/PhysRev.170.379", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Comparison of quantum and semiclassical radiation theories with application to the beam maser", "authors": ["E. T. Jaynes", "F. W. Cummings"], "year": 1963, "venue": "Proceedings of the IEEE 51, 89", "url": "https://doi.org/10.1109/PROC.1963.1664", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Quantum Rabi Oscillation: A Direct Test of Field Quantization in a Cavity", "authors": ["M. Brune", "F. Schmidt–Kaler", "Abdelhamid Maali", "J. Dreyer", "E. W. Hagley", "J. M. Raimond"], "year": 1996, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/physrevlett.76.1800", "cited_by": 993, "bucket": "canon"}, {"n": 6, "title": "Observation of quantum collapse and revival in a one-atom maser", "authors": ["Gerhard Rempe", "H. Walther", "N. Klein"], "year": 1987, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/physrevlett.58.353", "cited_by": 1423, "bucket": "canon"}, {"n": 7, "title": "Periodic Spontaneous Collapse and Revival in a Simple Quantum Model", "authors": ["J. H. Eberly", "N. B. Narozhny", "J. J. Sánchez-
