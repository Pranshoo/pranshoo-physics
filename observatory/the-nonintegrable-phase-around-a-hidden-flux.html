ipline would profit from labelling them as such rather than as new physics."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent enough pages on this dossier that I owe the reader a position rather than a survey. Here it is, unhedged.\n\n### (a) What I will defend with my reputation\n\nThe Aharonov–Bohm effect, in its magnetic Type-I form, is real, and its correct theoretical home is the Wu–Yang holonomy of the electromagnetic $U(1)$ connection [Wu–Yang 1975]. The gauge-invariant content of electromagnetism on a non-simply-connected configuration space is the set of Wilson loops $W[\\gamma] = \\exp\\!\\left[(ie/\\hbar)\\oint_\\gamma A_\\mu dx^\\mu\\right]$, not the field tensor $F_{\\mu\\nu}$ alone and not the potential $A_\\mu$ alone. Tonomura's toroidal-superconductor experiments [Tonomura 1986] closed the empirical question to a standard I consider unimpeachable: shielded flux, type-I superconductor below $T_c$, Meissner expulsion, electron holographic readout of the phase shift mod $2\\pi$. The Bocchieri–Loinger objection is dead in that geometry, and anyone resurrecting it has to do so against a fringe shift that is *quantitatively* what the holonomy predicts.\n\nI will also defend, less popularly, that the historically correct name is the **Ehrenberg–Siday–Aharonov–Bohm effect**. Ehrenberg and Siday 1949 contained the interferometric prediction — phase shift proportional to enclosed flux, derived from a WKB-style optical analogy — and Bohm himself conceded priority in private. That the community settled on the shorter name is sociology, not physics.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely silent.\n\n1. **\"Force-free.\"** The standard claim is that the electron experiences no local force and the phase is acquired purely by the topology of $A$. This is true of the *asymptotic centroid* of a wavepacket whose support never overlaps $B$. It is *not* obviously true at the level of local current density, and it is not true of the full electron-plus-solenoid system once back-reaction is included. The Vaidman 2012 reformulation — that the phase is acquired by the *source*, not the test particle — is more than a rhetorical inversion; it forces one to specify which subsystem one is doing quantum mechanics on. The textbook derivation tacitly chooses, and never says so.\n\n2. **\"Strictly field-free support.\"** Every real experiment has exponentially small but nonzero $|\\psi|^2$ inside the flux region. The Wu–Yang argument tells you the correction vanishes in a limit; it does not tell you the rate, and the rate matters for any precision test (e.g. mesoscopic interferometers where shielding is imperfect).\n\n3. **\"AB is a Berry phase.\"** It is not. Berry's 1984 phase requires adiabatic transport of a parameter; AB requires neither adiabaticity nor a parametric Hamiltonian. Both fit under the Wu–Yang/Simon fibre-bundle umbrella, but flattening them into one concept is a pedagogical convenience that obscures what the connection is a connection *on*.\n\nA fourth, quieter shakiness: the non-Abelian AB literature on cold atoms and photonic lattices routinely calls phenomena \"non-Abelian AB\" that are really synthetic-gauge holonomies in an effective Hamiltonian — interesting, but not the same gauge structure as Yang–Mills on physical spacetime.\n\n### (c) Three open questions, ranked\n\n1. **Does the AB phase admit a fully local, gauge-invariant account in terms of the source current's quantum state?** — Vaidman's claim deserves a decisive interferometric test, not just a re-derivation.\n2. **What is the precise rate at which the holonomy approximation breaks down for partially shielded flux?** — Critical for mesoscopic precision metrology; the answer is buried in nobody's textbook.\n3. **Is there a clean, non-cold-atom realization of a genuinely non-Abelian AB phase on a physical (not synthetic) gauge field?** — The cleanest candidate is nuclear-spin holonomy in nuclei with degenerate ground multiplets; nobody has done it well.\n\n### Reading path\n\n1. **Ehrenberg \u0026 Siday 1949** — the actual first prediction; read it to recalibrate the name.\n2. **Aharonov \u0026 Bohm 1959** [3] — the paper that made the field; note both Type-I and Type-II are already there.\n3. **Chambers 1960** [9] — first interferometric observation; read it alongside the Bocchieri–Loinger critique to see why \"first\" is not \"final.\"\n4. **Wu \u0026 Yang 1975** — the holonomy reformulation; this is the version modern field theory actually uses.\n5. **Tonomura et al. 1986** [6] — the experiment that closed the loophole; read last, because it is what every prior reference was really asking for."}], "references": [{"n": 1, "title": "The Refractive Index in Electron Optics and the Principles of Dynamics", "authors": ["W. Ehrenberg", "R. E. Siday"], "year": 1949, "venue": "Proceedings of the Physical Society. Section B", "url": "https://doi.org/10.1088/0370-1301/62/1/303", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "Concept of nonintegrable phase factors and global formulation of gauge fields", "authors": ["T. T. Wu", "C. N. Yang"], "year": 1975, "venue": "Physical Review D", "url": "https://doi.org/10.1103/PhysRevD.12.3845", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Significance of Electromagnetic Potentials in the Quantum Theory", "authors": ["Y. Aharonov", "D. Bohm"], "year": 1959, "venue": "Physical Review", "url": "https://doi.org/10.1103/PhysRev.115.485", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Quantized Magnetic Flux in Superconductors", "authors": ["B. S. Deaver", "W. M. Fairbank"], "year": 1961, "venue": "Physical Review Letters", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Observation of h/e Aharonov–Bohm Oscillations in Normal-Metal Rings", "authors": ["R. A. Webb", "S. Washburn", "C. P. Umbach", "R. B. Laibowitz"], "year": 1985, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/PhysRevLett.54.2696", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Evidence for Aharonov–Bohm effect with magnetic field completely shielded from electron wave", "authors": ["A. Tonomura", "N. Osakabe", "T. Matsuda", "T. Kawasaki", "J. Endo", "S. Yano"], "year": 1986, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/PhysRevLett.56.792", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Optics and interferometry with atoms and molecules", "authors": ["Alexander D. Cronin", "Jörg Schmiedmayer", "David E. Pritchard"], "year": 2009, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.81.1051", "cited_by": 1409, "bucket": "earliest"}, {"n": 8, "title": "Topological Quantum Effects for Neutral Particles", "authors": ["Y. Aharonov", "A. Casher"], "year": 1984, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/PhysRevLett.53.319", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Shift of an Electron Interference Pattern by Enclosed Magnetic Flux", "authors": ["R. G. Chambers"], "year": 1960, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/PhysRevLett.5.3", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Observation of Aharonov–Bohm Effect by Electron Holography", "authors": ["A. Tonomura", "T. Matsuda", "R. Suzuki", "A. Fukuhara", "N. Osakabe", "H. Umezaki"], "year": 1982, "venue": "Physical Review Letters", "url": "https://doi.org/10.1103/PhysRevLett.48.1443", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "Significance of Electromagnetic Potentials in Quantum Theory", "authors": ["W. H. Furry", "N. F. Ramsey"], "year": 1960, "venue": "Physical Review", "url": "https://doi.org/10.1103/PhysRev.118.623", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "The quantum effects of electromagnetic fluxes", "authors": ["S. Olariu", "I. Iovitzu Popescu"], "year": 1985, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/RevModPhys.57.339", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Quantal Phase Factors Accompanying Adiabatic Changes", "authors": ["M. V. Berry"], "year": 1984, "venue": "Proceedings of the Royal Society A", "url": "https://doi.org/10.1098/rspa.1984.0023", "cited_by": null, "bucket": "archive"}, {"n": 14, "title": "Geometric Phase in Optics: From Wavefront Manipulation to Waveguiding", "authors": ["Chandroth Pannian Jisha", "Stefan Nolte", "Alessandro Alberucci"], "year": 2021, "venue": "Laser \u0026 Photonics Review", "url": "https://doi.org/10.1002/lpor.202100003", "cited_by": 141, "bucket": "earliest"}, {"n": 15, "title": "Interferometer-Based Studies of Quantum Hall Phenomena", "authors": ["Douglas McClure"], "year": 2012, "venue": "Digital Access to Scholarship at Harvard (DASH) (Harvard University)", "url": "https://openalex.org/W2159948030", "cited_by": 1, "bucket": "earliest"}, {"n": 16, "title": "Geometric Phases and Topological Quantum Computation", "authors": ["Vlatko Vedral"], "year": 2002, "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.48550/arxiv.quant-ph/0212133", "cited_by": 0, "bucket": "earliest"}, {"n": 17, "title": "Quantum double structure in cold atom superfluids", "authors": ["Emil Génetay Johansen", "Chris Vale", "Tapio Simula"], "year": 2024, "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.48550/arxiv.2403.06451", "cited_by": 0, "bucket": "earliest"}], "nsec": 9, "nref": 17, "teaser": "A Monograph on the Aharonov–Bohm Effect and Its Double-Slit Imagination, from Ehrenberg–Siday to the Holographic Torus"}</script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+

     aka+'</header>';
  /* seminar callouts */

  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
</body>
</html>
