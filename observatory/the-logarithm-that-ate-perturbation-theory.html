tion question to the Friedel virtual-bound-state picture being developed concurrently in theory [2] and to Anderson's local-moment criterion [3]: not every dissolved $3d$ element produced a moment in every host, and only the hosts where it did showed an anomaly. The local-moment-or-not distinction was not a Kondo question — it was the precondition for Kondo physics to be operative at all.\n\nVan den Berg's 1964 chapter in *Progress in Low Temperature Physics* volume IV — three decades after his Leiden debut on the same problem — compiled this scattered evidence into a coherent landscape. By that point the empirical statement was crisp: the resistance minimum is a property of dilute magnetic impurities in non-magnetic metallic hosts, additive in concentration, logarithmic in temperature, and demanding a theoretical mechanism that no one had. Sarachik, Corenzwit, and Longinotti's 1964 *Physical Review* paper closed the loop by demonstrating in Mo–Nb–Fe that the anomaly appeared and disappeared in step with the Fe local moment as a function of host composition: turn off the moment, lose the minimum. Months later Jun Kondo's third-order calculation [4] supplied the logarithm — but the target he hit had been drawn, refined, and labelled by three decades of work performed largely by people whose names are absent from the textbook account.\n\nThe credit ledger for this prehistory is uneven and worth stating plainly. The 1934 observation is rightly catalogued under de Haas; de Boer and van den Berg are routinely demoted to *et al.*, despite the fact that van den Berg himself ran the systematic follow-up program for the next thirty years. Meissner's 1936 confirmation is usually skipped over because the interpretation was wrong, although the data were right. Coles's 1956–63 systematics, Cohen's local-moment programme, and the Leiden doctoral output of the early 1960s are the experimental scaffolding on which the Friedel–Anderson local-moment picture and the Kasuya–Yosida Hamiltonian rest, but they are seldom cited outside historical reviews. The convention \"the resistance minimum was an unexplained puzzle from 1934 to 1964\" is true only if one treats the experimental tradition as decoration on the theoretical timeline. It was the other way round: the theorists were chasing curves the experimentalists had already mapped in detail. Kondo, to his credit, says exactly this in the 1969 *Solid State Physics* review that introduced his calculation to a Western audience."}, {"id": "hamiltonian-genealogy-zener-kasuya-yosida-anderson", "title": "Genealogy of the Hamiltonian: Zener, Kasuya, Yosida, Friedel, Anderson", "markdown": "## Genealogy of the Hamiltonian: Zener, Kasuya, Yosida, Friedel, Anderson\n\nThe operator that Kondo expanded to third order in 1964 was not his. By the time he wrote down\n\n$$H_{sd} \\;=\\; -\\,2 J \\, \\mathbf{s}(0)\\!\\cdot\\!\\mathbf{S}\\;+\\;\\sum_{\\mathbf{k}\\sigma}\\varepsilon_{\\mathbf k}c^{\\dagger}_{\\mathbf k\\sigma}c_{\\mathbf k\\sigma},$$\n\nthe s–d exchange Hamiltonian had been in continuous use for thirteen years, with a parallel Soviet life of nearly twenty. Reconstructing the genealogy is not pedantry: each predecessor brought a piece of physics — a sign, a projection, a regime of validity — that the modern abbreviation \"Kondo Hamiltonian\" silently inherits and occasionally betrays.\n\n### Zener 1951: phenomenological exchange, ferromagnetic sign\n\nClarence Zener's three-paper series on transition-metal ferromagnetism (*Phys. Rev.* 81, 440; 82, 403; 83, 299, 1951) introduced an inner-shell ↔ conduction-band coupling of the form $-J\\,\\boldsymbol\\sigma\\!\\cdot\\!\\mathbf S$ in order to communicate the ordering tendency of localised 3d moments to the itinerant 4s electrons. Two features of Zener's construction propagate downstream:\n\n- The interaction is written as a contact spin–spin term, not as a Coulomb integral. Zener is not deriving it; he is asserting an effective Heisenberg coupling between the lattice spin and a single conduction-electron spin density evaluated at the impurity site.\n- $J$ is taken positive (ferromagnetic) on physical grounds. Zener wanted parallel alignment to explain double-exchange in mixed-valence manganites and the high $T_c$ of iron-group metals.\n\nBoth features are wrong for the resistance-minimum problem — there the relevant coupling is *antiferromagnetic* and emerges as a virtual second-order process — but Zener's *form* is exactly what Kasuya and Yosida would later validate microscopically and what Kondo would later perturb in.\n\n### Kasuya 1956 and Yosida 1957: the operator gets a microscopic pedigree\n\nTadao Kasuya, in *Prog. Theor. Phys.* 16, 45 (1956), redid Zener's construction starting from an explicit hybridisation integral between a localised d-orbital and Bloch states. Expanding in $V_{\\mathbf k d}/(\\varepsilon_F - \\varepsilon_d)$ he obtained\n\n$$H_{sd}\\;=\\;-\\,\\frac{J(\\mathbf k,\\mathbf k')}{N}\\sum_{\\mathbf k\\mathbf k'}\\bigl[\\,c^{\\dagger}_{\\mathbf k\\uparrow}c_{\\mathbf k'\\uparrow}-c^{\\dagger}_{\\mathbf k\\downarrow}c_{\\mathbf k'\\downarrow}\\bigr]S^{z}\\;+\\;(\\mathrm{transverse}),$$\n\nwith a momentum-dependent exchange integral whose Fourier transform produces the oscillatory polarisation we now call the RKKY interaction. Kei Yosida (*Phys. Rev.* 106, 893, 1957) then carried out the polarisation calculation that gives the spatial form $J(R)\\!\\propto\\!\\cos(2k_F R)/R^3$ between two localised moments in a free-electron metal. In the same paper Yosida applied first-order perturbation theory in $J$ to compute spin-disorder resistivity and obtained a result *constant in temperature* — the negative result that, in retrospect, is the precise statement of why one had to go to third order to see the logarithm.\n\nThe operator Kondo expanded in 1964 [4] is, line for line, the Kasuya–Yosida Hamiltonian. Within the Anglophone literature the Western convention is to call it \"the s–d Hamiltonian\" through about 1969 and \"the Kondo Hamiltonian\" thereafter, an attribution shift the original authors lived to see and never publicly contested. Yosida himself, in his 1966 variational calculation of the singlet ground state [5], refers to \"the s–d interaction\" throughout and treats the structure of the operator as established background.\n\n### The Sverdlovsk parallel: Vonsovsky and Turov\n\nA second, almost completely independent thread runs through the Ural school. S.V. Vonsovsky's *ZhETF* 16, 981 (1946) — five years before Zener — already contains an s–d exchange operator essentially identical to (1), used to derive the temperature dependence of ferromagnetic resistivity. With E.A. Turov he extended this in *ZhETF* 24, 419 (1953) to compute spin-wave corrections to conduction-electron scattering. The Sverdlovsk programme treated the s–d model not as a phenomenology but as the controlled output of a Wannier-projection procedure applied to the periodic d-electron problem; their derivation contains, in embryonic form, the projection onto the local-moment subspace that Schrieffer and Wolff would rediscover by canonical transformation in 1966 [6]. The omission of Vonsovsky from Anglophone histories is partly a translation lag (the Wiley translation of *Magnetism* did not appear until 1974) and partly Cold-War citation hygiene; Kondo's own *Solid State Physics* review (vol. 23, 1969) does cite Vonsovsky, but most subsequent reviews silently drop the reference.\n\n### Friedel 1956: the virtual bound state\n\nRunning in parallel to the spin-exchange programme, Jacques Friedel was asking a logically prior question: when does a transition-metal impurity in a non-magnetic host carry a local moment at all? His 1956 *Canadian Journal of Physics* paper [2] introduced the *virtual bound state* — a resonance of width $\\Delta = \\pi V^{2}\\rho(\\varepsilon_F)$ at energy $\\varepsilon_d$, with phase shift $\\eta_\\ell(\\varepsilon)$ saturating the Friedel sum rule\n\n$$\\sum_{\\ell\\sigma}(2\\ell+1)\\eta_{\\ell\\sigma}(\\varepsilon_F)/\\pi \\;=\\; Z_{\\rm imp}.$$\n\nFriedel's picture is purely one-body: spin-up and spin-down channels are degenerate, the d-level is broadened but not split, and a moment is impossible at $T=0$. The triumph of the construction is the screening-charge oscillations $\\delta n(r) \\propto \\cos(2k_F r)/r^3$ — the same kernel that drives RKKY — and the prediction that residual resistivities of dilute transition-metal alloys should peak in the middle of each 3d row (the experimentally seen Friedel maxima). The defect of the construction is exactly the spin question Anderson would answer five years later.\n\n### Anderson 1961: charge fluctuations and the local-moment criterion\n\nP.W. Anderson [3] added the Coulomb repulsion Friedel had elided:\n\n$$H_A \\;=\\; \\sum_{\\mathbf k\\sigma}\\varepsilon_{\\mathbf k}c^{\\dagger}_{\\mathbf k\\sigma}c_{\\mathbf k\\sigma}+\\varepsilon_d\\!\\sum_\\sigma n_{d\\sigma}+U n_{d\\uparrow}n_{d\\downarrow}+\\sum_{\\mathbf k\\sigma}\\!\\bigl(V_{\\mathbf k d}c^{\\dagger}_{\\mathbf k\\sigma}d_\\sigma+\\mathrm{h.c.}\\bigr).$$\n\nTreated in Hartree–Fock, the model gives a local-moment criterion $U\\rho(\\varepsilon_F) \u003e 1$ (the *Anderson criterion*), which sharpens Friedel's picture: the virtual bound state spin-splits, and the impurity carries a moment provided $\\varepsilon_d \u003c \\varepsilon_F \u003c \\varepsilon_d + U$ with $U \\gg \\Delta$. Anderson's operator is the *parent* of the Kasuya–Yosida operator — it contains charge fluctuations the s–d model has integrated out — but in 1961 the connection was not yet explicit. That step is Schrieffer and Wolff's [6]: in the local-moment regime, second-order perturbation in $V_{\\mathbf k d}$ generates\n\n$$J \\;\\approx\\; 2|V|^{2}\\!\\left(\\frac{1}{|\\varepsilon_d|}+\\frac{1}{|\\varepsilon_d+U|}\\right) \\;\u003e\\;0\\quad(\\text{antiferromagnetic}),$$\n\nwith sign opposite to Zener's phenomenological $J$. This is the result that fixes the *infrared-unstable* sign of the coupling and forces the logarithmic flow Kondo would later find by brute force.\n\n### What the synthesis bequeaths\n\nBy the eve of Kondo's calculation the field possessed: (i) an operator of agreed form (Zener → Kasuya–Yosida → Vonsovsky), (ii) a one-body backdrop in which to embed it (Friedel), (iii) a derivation that fixes both its sign and its regime of validity (Anderson, made explicit only post hoc by Schrieffer–Wolff), and (iv) Yosida's first-order calculation showing that *something beyond Born* must be responsible for the resistance minimum. The Kasuya–Yosida operator is exact only inside the projected subspace where charge fluctuations on the d-orbital have been quenched; valence-fluctuation regimes (Ce, Yb, U mixed-valence) live outside it and require the full Anderson model. The conflation of the two — endemic in modern quantum-dot literature, where \"Kondo regime\" and \"Anderson dot\" are used as synonyms — is the inheritance tax this genealogy continues to charge."}, {"id": "kondo-1964-and-the-infrared-catastrophe", "title": "Kondo 1964: A Third-Order Logarithm and a Genuine Infrared Catastrophe", "markdown": "## Kondo 1964: A Third-Order Logarithm and a Genuine Infrared Catastrophe\n\nBy 1963 the question was no longer whether dilute Fe in Cu, Au or Ag produced a resistance minimum — that had been settled in Leiden three decades earlier and decorated with a generation of systematics — but why second-order Born scattering off a Kasuya–Yosida exchange vertex stubbornly refused to produce one. Take the Hamiltonian Kondo started from,\n\n$$H \\;=\\; \\sum_{\\mathbf{k}\\sigma}\\varepsilon_{\\mathbf{k}}\\,c^{\\dagger}_{\\mathbf{k}\\sigma}c_{\\mathbf{k}\\sigma} \\;+\\; \\frac{J}{N}\\sum_{\\mathbf{k}\\mathbf{k}'}\\,\\mathbf{S}\\!\\cdot\\!c^{\\dagger}_{\\mathbf{k}\\alpha}\\boldsymbol{\\sigma}_{\\alpha\\beta}c_{\\mathbf{k}'\\beta},$$\n\nwith $J\u003e0$ for antiferromagnetic exchange and $\\rho$ the conduction-band density of states per spin at the Fermi level. Fermi's golden rule at order $J^{2}$ gives a momentum- and temperature-independent transition probability proportional to $J^{2}S(S+1)$, hence a flat impurity resistivity\n\n$$\\rho_{\\rm imp}^{(2)}\\;=\\;\\frac{3\\pi m\\,c_{\\rm imp}}{2 e^{2}\\varepsilon_{F}\\hbar}\\,J^{2}S(S+1).$$\n\nNo minimum, no temperature dependence, nothing to explain de Haas–de Boer–van den Berg. The phonon contribution rises as $T^{5}$, the impurity contribution is constant; their sum is monotonic. This is the wall Kondo walked into.\n\n### The third-order matrix element\n\nKondo's [4] move was to compute the impurity T-matrix to third order in $J$, i.e. one more vertex than Born. Two topologies contribute: the *direct* process in which the conduction electron scatters off the impurity, propagates as a particle of energy $\\varepsilon_{\\mathbf{q}}\u003e\\varepsilon_{F}$, then scatters again; and the *crossed* process in which the intermediate state is a hole of energy $\\varepsilon_{\\mathbf{q}}\u003c\\varepsilon_{F}$ with the impurity in a different magnetic substate. For a static, classical scatterer the two processes would simply add up to the standard particle/hole symmetrisation of T-matrix theory and produce no logarithm. They produce one here because the impurity spin is a quantum operator and the spin operators at the three vertices fail to commute.\n\nSchematically, the third-order amplitude for scattering an electron of spin $\\beta$ to spin $\\alpha$ reads\n\n$$T^{(3)}_{\\alpha\\beta} \\;\\propto\\; \\frac{J^{3}}{N^{2}}\\sum_{\\mathbf{q}} \\Bigl[\\,\\sigma^{a}\\sigma^{b}\\sigma^{c}\\,S^{a}S^{b}S^{c}\\,\\frac{1-f(\\varepsilon_{\\mathbf{q}})}{\\omega-\\varepsilon_{\\mathbf{q}}+i\\eta} \\;+\\; \\sigma^{a}\\sigma^{c}\\sigma^{b}\\,S^{a}S^{b}S^{c}\\,\\frac{-f(\\varepsilon_{\\mathbf{q}})}{\\omega-\\varepsilon_{\\mathbf{q}}+i\\eta}\\Bigr],$$\n\nwith the Pauli operators acting on the conduction-spin indices $\\alpha\\beta$ and the impurity operators acting on its $(2S+1)$-dimensional Hilbert space. Two structures appear on the right. The piece *symmetric* in the order of $S^{b}S^{c}$ multiplies the *Fermi-symmetric* combination $1-f(\\varepsilon_{\\mathbf{q}})-f(\\varepsilon_{\\mathbf{q}})=1-2f(\\varepsilon_{\\mathbf{q}})$ — wrong, the symmetric piece multiplies the standard $1-f$ plus $-f$ recombination that gives the usual principal-value background. The piece *antisymmetric* in $S^{b}S^{c}$ — i.e. proportional to the commutator\n\n$$[S^{b},S^{c}]\\;=\\;i\\epsilon^{bcd}\\,S^{d}$$\n\n— multiplies the antisymmetric combination $(1-f)-(-f)\\!\\to\\!1-2f(\\varepsilon_{\\mathbf{q}})$, the deviation of the Fermi function from a half. Performing the spin trace, the antisymmetric piece contracts $i\\epsilon^{bcd}S^{d}$ with $\\sigma^{b}\\sigma^{c}=i\\epsilon^{bce}\\sigma^{e}+\\delta^{bc}$ and produces an operator proportional to $\\boldsymbol{\\sigma}\\cdot\\mathbf{S}$ — i.e. it *renormalises the original vertex*.\n\nThe accompanying energy integral is the catastrophic one:\n\n$$\\int d\\varepsilon\\,\\rho(\\varepsilon)\\,\\frac{1-2f(\\varepsilon)}{\\omega-\\varepsilon}\\;\\xrightarrow[\\,\\omega\\to 0\\,]{}\\;-\\rho\\,\\ln\\!\\frac{D}{\\max(k_{B}T,|\\omega|)}.$$\n\nThe integrand is peaked within $k_{B}T$ of the Fermi surface, and the energy denominator gives logarithmic weight to every decade out to the bandwidth $D$. Putting the algebra together, Kondo's third-order correction shifts the effective coupling at energy $\\omega\\sim k_{B}T$ to\n\n$$J_{\\rm eff}\\;=\\;J\\Bigl[1\\,-\\,2J\\rho\\,\\ln\\!\\frac{k_{B}T}{D}+\\mathcal{O}(J^{2}\\rho^{2})\\Bigr],$$\n\nand the impurity resistivity acquires the structure announced in [4],\n\n$$\\boxed{\\;\\rho_{\\rm imp}(T)\\;=\\;c_{\\rm imp}\\!\\left[a\\,-\\,b\\,J\\rho\\,\\ln\\!\\frac{k_{B}T}{D}\\right],\\quad b\\propto J^{2}S(S+1).\\;}$$\n\n### Sign and inevitability\n\nThe sign now does all the work. For $T\\ll D$ the logarithm is large and *negative*. With $J\u003e0$ the bracket *grows* as $T$ falls; added to a phonon background $\\sim T^{5}$ that *shrinks*, the sum has a minimum at $T_{\\min}\\sim(b J\\rho/5a)^{1/5}\\Theta_{D}$, with the famous $\\Theta_{D}\\,c_{\\rm imp}^{1/5}$ scaling Kondo extracted from the Cu–Fe data of MacDonald, Pearson and Templeton and the Mo–Nb–Fe data of Sarachik, Corenzwit and Longinotti. For $J\u003c0$ — true ferromagnetic exchange, as in the original Zener double-exchange context — the bracket *shrinks* and no minimum forms; the perturbation series is well-behaved at all temperatures. This asymmetry between $\\pm J$ is not a peculiarity of the third-order calculation but a robust statement about the renormalisation-group flow: the one-loop $\\beta$-function $dg/d\\ln D=-2g^{2}+\\mathcal{O}(g^{3})$, with $g\\equiv J\\rho$, is *quadratic* in $g$ and therefore symmetric in sign at fixed $|g|$, while the bare coupling is not. Antiferromagnetic exchange flows to strong coupling, ferromagnetic to weak.\n\n### Real IR catastrophe, not a calculational artefact\n\nThe instinct of a particle theorist seeing a $\\ln(D/T)$ in third order is to suspect either a missing counterterm or a UV/IR mismatch. Neither applies. The Kondo problem is a 0+1-dimensional fermionic field theory: the impurity has no spatial extent, only a worldline. The dimensionless coupling $g=J\\rho$ is marginal at tree level, and the only available scale in the conduction sea is the bandwidth $D$ — itself a UV cutoff, not a physical scale of the IR theory. Once $g$ is generated logarithmically, it has nowhere to flow but to dynamically produce an IR scale. Anderson's poor-man's scaling [7] made this explicit in 1970, and the Schrieffer–Wolff transformation [6] guaranteed that the $J\\rho\u003e0$ Kondo regime is precisely where this matters — the local-moment limit of the Anderson model [3]. The $\\ln(D/k_{B}T)$ is the 0+1-d analogue of QCD's asymptotic freedom: a marginally relevant coupling generates its own IR scale.\n\n### Parquet, leading logs, and the Abrikosov–Suhl singularity\n\nOnce the third-order log was identified, the obvious next step was to sum its higher-order siblings. Abrikosov (Physics 2, 5, 1965) classified the leading parquet diagrams — repeated insertions of the same spin-exchange ladder — and summed them by an integral equation whose solution exponentiates the third-order result into\n\n$$\\rho_{\\rm imp}^{\\rm parquet}(T)\\;\\sim\\;\\frac{c_{\\rm imp}\\,J^{2}S(S+1)}{\\bigl[1+2J\\rho\\ln(k_{B}T/D)\\bigr]^{2}}\\;=\\;\\frac{c_{\\rm imp}\\,J^{2}S(S+1)}{\\bigl[2J\\rho\\ln(T/T_{K})\\bigr]^{2}},$$\n\nwith the *dynamically generated scale*\n\n$$T_{K}\\;=\\;D\\,\\exp\\!\\Bigl(-\\frac{1}{2J\\rho}\\Bigr).$$\n\nSuhl (Phys. Rev. 138, A515, 1965), using a T-matrix dispersion relation, and Nagaoka (Phys. Rev. 138, A1112, 1965), using a Green's-function decoupling, arrived at the same scaling independently. The resulting \"Abrikosov–Suhl resonance\" — a pole-like feature in the T-matrix pinned to the Fermi level — is what the modern quantum-dot literature still calls the Kondo resonance, even when reading it off an NRG spectral function rather than a parquet diagram. The leading-log resummation is internally consistent above $T_{K}$ and *fails*, in the same way every parquet treatment of a marginally relevant theory fails, at $T\\sim T_{K}$, where the denominator passes through zero and the parquet vertex develops a spurious pole. Suhl and Nagaoka tried, with various decouplings, to push past it; what they could not see — and what Wilson [8] eventually showed and Andrei [9] confirmed exactly — is that nothing pathological happens at $T_{K}$ itself. The coupling continues to flow, all the way to a strong-coupling fixed point where the impurity is screened into a many-body singlet [5]. The third-order logarithm of [4] is the first, perturbative whisper of that flow; the parquet sum is the loudest perturbation theory can shout before its voice gives out."}, {"id": "scaling-nrg-bethe-ansatz-fermi-liquid", "title": "From Poor-Man's Scaling to the Strong-Coupling Fixed Point", "markdown": "## From Poor-Man's Scaling to the Strong-Coupling Fixed Point\n\nBy 1966 the Kondo problem had three faces and no answer. Kondo's third-order $\\ln(D/T)$ was unambiguous; the Abrikosov–Suhl–Nagaoka parquet resummation pushed it to $1/\\ln^2(T/T_K)$ but obviously failed at $T \\lesssim T_K$, where the leading log itself becomes $O(1)$; and the Yosida singlet ansatz [5] gave a sensible $T=0$ picture without a controlled way to connect it to the high-temperature perturbative regime. The cascade that finally closed the gap took fourteen years and reorganized the methodology of many-body theory.\n\n### Schrieffer–Wolff: making Anderson and Kondo siblings\n\nThe first move was less glamorous than the rest but indispensable. Schrieffer and Wolff [6] performed a canonical transformation on the Anderson Hamiltonian [3], rotating away the hybridization $V_{kd}$ to second order in the local-moment regime $\\epsilon_d \u003c 0 \u003c \\epsilon_d + U$, with $|\\epsilon_d|, \\epsilon_d + U \\gg \\Gamma$. The result is\n\n$$J \\;=\\; 2|V_{kd}|^2 \\left( \\frac{1}{|\\epsilon_d|} + \\frac{1}{\\epsilon_d + U} \\right) \\;\u003e\\; 0,$$\n\na manifestly antiferromagnetic exchange in the projected subspace of singly occupied $d$. This did three things: (i) it told experimentalists what $J\\rho$ was as a function of the microscopic $V, \\epsilon_d, U$ — not a phenomenological parameter; (ii) it explained why dilute $3d$ impurities almost always give the divergent sign Kondo needed; (iii) it set the boundary the conflation audit polices, since the projection is valid only when charge fluctuations are frozen out. Intermediate-valence Ce/Yb compounds at high $T$, or quantum dots tuned near a charge-degeneracy point, lie outside the Schrieffer–Wolff window and are Anderson physics, not Kondo physics.\n\n### Anderson–Yuval–Hamann: poor man's scaling and the Coulomb gas\n\nAnderson's 1970 note [7] — three pages of unusually colloquial prose — proposed integrating out conduction states in narrow shells at the band edge $\\pm D \\to \\pm D(1-d\\ell)$ and demanding that the effective $H_{sd}$ retain its form with renormalized couplings. To second order in $J$:\n\n$$\\frac{d(J\\rho)}{d\\ell} \\;=\\; (J\\rho)^2 + O\\!\\big((J\\rho)^3\\big).$$\n\nFor antiferromagnetic $J\u003e0$ the coupling runs upward; the perturbative regime is the ultraviolet, strong coupling the infrared. Integrating yields the invariant\n\n$$T_K \\;\\sim\\; D \\exp\\!\\left(-\\frac{1}{J\\rho}\\right),$$\n\nthe same essential singularity Abrikosov's parquet sums had hidden inside their denominators, now reinterpreted as a dynamically generated scale of an asymptotically free theory. The analogy with Gell-Mann–Low and (slightly later) QCD asymptotic freedom is exact for the $(0+1)$-dimensional fermionic theory.\n\nThe companion paper with Yuval and Hamann [10] made the flow geometrical. Bosonizing the conduction electrons and integrating out everything except the impurity-spin trajectory $S^z(\\tau)$, the partition function becomes a one-dimensional classical Coulomb gas of alternating-sign charges (spin flips) with a logarithmic kernel, on a circle of circumference $\\beta$. The fugacity is set by the transverse exchange $J_\\perp$, the inverse \"temperature\" by $J_z$; the RG equations are Kosterlitz–Thouless seven years early, with the AF Kondo flow sitting on the strong-coupling separatrix. Two facts perturbation theory had hidden become visible: the line $J_z = J_\\perp$ is exactly preserved by the flow (rotational invariance is an RG fixed line, not an accident); and the relevant infrared variable is not $J$ but the spin-flip fugacity, which the conduction electrons screen logarithmically.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eKondo RG flow\u003c/title\u003e\u003cdefs\u003e\u003cmarker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#e8e6e1\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"370\" y1=\"60\" x2=\"370\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"640\" y=\"362\" fill=\"#e8e6e1\" font-size=\"14\"\u003eJ_z ρ\u003c/text\u003e\u003ctext x=\"382\" y=\"68\" fill=\"#e8e6e1\" font-size=\"14\"\u003e|J_⊥| ρ\u003c/text\u003e\u003cline x1=\"370\" y1=\"340\" x2=\"680\" y2=\"60\" stroke=\"#7aa2ff\" stroke-width=\"1.3\" stroke-dasharray=\"5,4\"/\u003e\u003ctext x=\"500\" y=\"135\" fill=\"#7aa2ff\" font-size=\"13\"\u003eisotropic ridge J_z = |J_⊥|\u003c/text\u003e\u003cpath d=\"M 410 320 Q 460 270 510 200\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar)\"/\u003e\u003cpath d=\"M 510 200 Q 555 150 615 95\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar)\"/\u003e\u003cpath d=\"M 430 305 Q 470 270 500 220\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar)\"/\u003e\u003cpath d=\"M 330 340 Q 270 335 200 335\" stroke=\"#ff7a90\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar)\"/\u003e\u003cpath d=\"M 350 320 Q 290 305 220 290\" stroke=\"#ff7a90\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar)\"/\u003e\u003ccircle cx=\"370\" cy=\"340\" r=\"5\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"280\" y=\"362\" fill=\"#e8e6e1\" font-size=\"13\"\u003efree-spin (unstable)\u003c/text\u003e\u003ccircle cx=\"630\" cy=\"80\" r=\"6\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"500\" y=\"80\" fill=\"#7ee0a3\" font-size=\"13\"\u003estrong-coupling FP\u003c/text\u003e\u003ctext x=\"80\" y=\"330\" fill=\"#ff7a90\" font-size=\"13\"\u003eFM line of fixed points\u003c/text\u003e\u003ctext x=\"430\" y=\"380\" fill=\"#ffb86b\" font-size=\"13\"\u003eAF flow → J → ∞\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: RG flow in the anisotropic Kondo $(J_z\\rho, |J_\\perp|\\rho)$ plane. The isotropic separatrix is preserved by the flow. Antiferromagnetic couplings run to a single strong-coupling fixed point (green); ferromagnetic couplings flow to a line of free-spin fixed points where the impurity decouples (red).*\n\n### Wilson 1975: discretize the logs, diagonalize the chain\n\nWilson's RMP article [8] solved what Anderson had set up. The Kondo problem is sensitive to all energy scales between $T$ and $D$ equally — every logarithmic decade contributes — so a *linear* discretization of the conduction band wastes resolution at low energy and resolves nothing at high energy. Wilson partitioned the band into intervals $[\\Lambda^{-(n+1)},\\Lambda^{-n}]$ ($\\Lambda \\approx 2$), kept one orbital per interval, and tridiagonalized the Hamiltonian into a semi-infinite chain with hoppings $t_n \\sim \\Lambda^{-n/2}$. Each successive site addresses an energy scale a factor $\\Lambda^{1/2}$ smaller; truncating to the lowest $\\sim 10^3$ states at every step and rescaling by $\\Lambda^{1/2}$ produces a transfer-like iteration whose fixed points are *directly* the RG fixed points of the original problem.\n\nWhat emerged: (i) an even–odd alternating spectrum flowing from the unstable local-moment fixed point at $J=0$ to a stable strong-coupling fixed point at $J=\\infty$; (ii) the universal crossover function $\\chi_{\\rm imp}(T)\\,T_K = f(T/T_K)$ collapsing data over six decades in $T/T_K$, with the convention-fixing number $T_K\\,\\chi_{\\rm imp}(0) = 0.1032$; (iii) explicit confirmation that the strong-coupling fixed point is what Nozières had argued it must be on symmetry grounds — a free conduction band carrying a $\\pi/2$ phase shift in the screening channel.\n\n### Nozières's local Fermi liquid\n\nNozières [11] made the strong-coupling endpoint analytically tractable. The argument is structural: at $T \\ll T_K$ the impurity spin is locked into a singlet, and the only low-energy degrees of freedom are conduction electrons phase-shifted by the screening cloud. Residual interactions are quasiparticle–quasiparticle and quasiparticle–impurity scatterings of irrelevant operators; expanding the scattering phase shift around the Fermi level,\n\n$$\\delta(\\epsilon, \\{n_{\\sigma'}\\}) \\;=\\; \\delta_0 \\,+\\, \\alpha\\,\\epsilon \\,+\\, \\phi\\sum_{\\sigma'} \\delta n_{\\sigma'} \\,+\\, \\cdots,$$\n\nwith $\\delta_0 = \\pi/2$ fixed by Friedel's sum rule and unitarity, and $\\alpha, \\phi$ tied by SU(2) and particle–hole symmetry to the single scale $1/T_K$. The result is a one-parameter Fermi liquid with three observable consequences:\n\n- Wilson ratio $R \\equiv (\\chi_{\\rm imp}/\\gamma_{\\rm imp})/(\\chi_0/\\gamma_0) = 2$, exact;\n- residual resistivity at the unitary limit, $\\rho_{\\rm imp}(0) = 2/(\\pi n e^2 v_F)$ per spin channel;\n- a $T^2$ coefficient of $\\rho(T)$ and an $\\omega^2$ coefficient of $\\Sigma(\\omega)$ in fixed universal ratio.\n\nThis is what the conflation audit means when it demands $R \\to 2$ before calling a zero-bias anomaly a Kondo resonance: it is the cheapest non-trivial check of strong-coupling Fermi-liquid behaviour and it is parameter-free.\n\n### Andrei–Wiegmann: the Bethe-ansatz audit\n\nWilson's NRG is non-perturbative but numerical; Nozières's Fermi liquid is analytical but asymptotic. The closing chord came independently in 1980 from Andrei [9] and Wiegmann, who diagonalized the Kondo Hamiltonian exactly using the algebraic Bethe ansatz, reducing the eigenvalue problem to a nested system of algebraic equations on rapidities and showing that the multi-particle $S$-matrix factorizes into two-body pieces. The thermodynamic Bethe-ansatz equations reproduced Wilson's $\\chi(T)/T_K$ curve, the Sommerfeld coefficient, and $R=2$ to all decimal places NRG had produced — and gave them in closed form. They also fixed the proportionality between Wilson's $T_K^W$ and the natural scale $T_K^{\\rm BA}$ of the Bethe equations, a convention-dependent factor of order one whose mishandling is responsible for a substantial fraction of inconsistent $J\\rho$ extractions in the literature.\n\nThe four methods now constituted a cross-checked solution: scaling explained *why* a non-perturbative scale exists; NRG computed the *crossover*; Fermi-liquid theory described the *infrared*; Bethe ansatz certified the *exact* thermodynamics. Together they made the single-impurity Kondo problem the first many-body problem in condensed matter physics solved at the level of, and in the same sense as, the Onsager solution of the 2D Ising model — and converted \"strong coupling\" from a confession of ignorance into a calculable fixed point."}, {"id": "landmark-experiments", "title": "Landmark Experiments: From Cu–Fe Wires to Gated Quantum Dots", "markdown": "## Landmark Experiments: From Cu–Fe Wires to Gated Quantum Dots\n\nThe experimental literature on the Kondo effect divides cleanly into three eras separated by the instruments that defined them: bulk transport on dilute alloys (1934–1975), thermodynamic and spectroscopic probes once dilution refrigerators became routine (1965–1990), and gate-controlled single-impurity realisations in mesoscopic devices (1988–present). What follows is a triage of which experiments actually verified universal scaling — collapse onto the Wilson–Costi–Hewson–Zlatić curve $G(T/T_K)$ or its thermodynamic analogue $\\chi_{\\rm imp}(T/T_K)$ — and which only displayed *a peak* or *a minimum* compatible with Kondo but consistent with much else.\n\n### Bulk alloys: from anomaly to local moment\n\nThe 1934 Leiden minimum [1] established the phenomenon but did not identify its mechanism, and for thirty years it competed with explanations ranging from grain-boundary scattering to two-level systems. The decisive bulk experiment is **Sarachik, Corenzwit and Longinotti (1964)** at Bell Labs, who tuned the host alloy $\\mathrm{Mo}_{1-x}\\mathrm{Nb}_x$ to switch Fe impurities between magnetic and non-magnetic configurations and showed that the resistance minimum appears *if and only if* the Fe carries a local moment. This is the empirical anchor that converts Friedel–Anderson local-moment theory and the Zener–Kasuya–Yosida Hamiltonian into a falsifiable scientific programme; Kondo's third-order calculation [4] was published months later in direct response.\n\nThe 1960s programme of **Coles, van den Berg, Daybell, Steyert, Heeger and Hirst** then built the systematics: Cu–Fe, Au–Fe, Cu–Cr, Cu–Mn, La–Ce, and the chalcogenide families. By the early 1970s, resistivity, susceptibility and Mössbauer measurements on Cu–Fe, La–Ce and Cu–Cr had produced an *approximately* universal $\\rho(T)/\\rho_0$ curve with $T_K$ varying by six orders of magnitude across hosts. \"Approximately\" is doing real work in that sentence: bulk alloys at fractions of a percent always carry RKKY-induced impurity–impurity interactions, and only the dilution-refrigerator susceptibility measurements of **Triplett and Phillips (1971)** on Cu–Fe and the later specific-heat work of **Felsch, Winzer and others** on La–Ce reached low enough $T/T_K$ to test the Nozières–Wilson prediction $\\chi_{\\rm imp}(0)/(g\\mu_B)^2 = 0.103/T_K$ and $\\gamma_{\\rm imp}\\cdot T_K = $ universal. Those data did show collapse to within $\\sim$10–20 %, comparable to the residual impurity-interaction corrections — the first quantitative verification of universality.\n\nThe single bulk experiment that closes the loop with theory is **Wilson's 1975 NRG calculation of $\\chi_{\\rm imp}(T)$** [8] plotted directly against the Triplett–Phillips Cu–Fe susceptibility: agreement over four decades in $T/T_K$ with no adjustable parameter once $T_K$ is fixed. That is what \"verified universal scaling\" means in the bulk era.\n\n### Why the bulk era was inevitably limited\n\nA dilute Cu–Fe wire contains $\\sim 10^{18}$ impurities and a distribution of local environments. Even at the cleanest concentrations the inter-impurity distance is comparable to the screening length $\\xi_K \\sim v_F/T_K$, so what one measures is *ensemble-averaged single-impurity behaviour with RKKY corrections*. Magnetic field splits the impurity ground state, but the field scale $g\\mu_B B \\sim k_B T_K$ requires impractical fields for high-$T_K$ alloys and irrelevantly small fields for low-$T_K$ ones. There was no way to *count* impurities, no way to tune $J\\rho$ in situ, and no way to access the Kondo resonance spectroscopically — the local density of states is what the Kondo singlet rearranges, and bulk transport averages over it.\n\n### The mesoscopic revival: predictions before the experiment\n\nThe conceptual move that made gate-tunable Kondo possible is the recognition, by **Glazman and Raikh (1988)** and independently **Ng and Lee (1988)**, that a Coulomb-blockaded quantum dot with an *odd* number of electrons is a single-impurity Anderson model with externally tunable parameters: $\\varepsilon_d$ set by the gate, $U$ by the charging energy, $\\Gamma$ by the tunnel barriers. Their prediction was specific and quantitative: in the local-moment valley the linear conductance should *increase* on cooling, saturating at the unitary limit $G_0 = 2e^2/h$ per spin channel, with universal $G(T/T_K)$ following the Costi–Hewson–Zlatić scaling function. This is the prediction that the abuse-alert in §6 will police; it is also why the 1998 papers were experiments seeking a known target, not discoveries of a new effect.\n\nThe experiments arrived a decade later because the necessary fabrication — sub-100 nm GaAs/AlGaAs lateral dots with electron temperature below the few-100 mK $T_K$ achievable in tunable structures — only became routine in the mid-1990s. **Goldhaber-Gordon et al. (1998)** [12] reported gate-controlled odd/even alternation of a zero-bias conductance peak in a small lateral dot, Zeeman splitting of the peak with the expected $g$-factor, and a logarithmic $G(T)$ in the high-$T$ tail. The simultaneous **Cronenwett, Oosterkamp and Kouwenhoven (1998)** Science paper showed the same phenomenology in a different device geometry and is routinely under-credited [13]. Neither 1998 paper, taken alone, demonstrated unitary-limit conductance or full universal-curve collapse: the dots were too asymmetric and $T/T_K$ never small enough.\n\nThe verification of universality came two years later. **van der Wiel et al. (Science 289, 2105, 2000)** in the Delft group reached $G \\to 2e^2/h$ in a symmetrically coupled dot and collapsed $G(T)/G_0$ for several gate voltages onto a single $G(T/T_K)$ curve indistinguishable from the Costi–Hewson–Zlatić NRG result. **Grobis, Rau, Potok and Goldhaber-Gordon** (reviewed in [14]) added the Fermi-liquid coefficient: the $T^2$ correction $G(T) = G_0[1 - c_T (T/T_K)^2]$ with $c_T$ matching the Nozières fixed-point value to within ~10 %. That triad — unitary limit, universal $G(T/T_K)$, Fermi-liquid $T^2$ — is the minimum evidence required to claim a genuine spin-$\\tfrac12$ single-channel Kondo state in a device.\n\n### Two-channel Kondo: the harder experiment\n\nA peak at zero bias is easy; a non-Fermi-liquid fixed point is not. **Potok, Rau, Shtrikman, Oreg and Goldhaber-Gordon (Nature 446, 167, 2007)** engineered a small dot coupled to a small lead and a large \"reservoir\" dot, fine-tuning the channel symmetry $\\delta$ until $\\delta \\ll T_K^{2\\mathrm{CK}}$, and observed the predicted $\\sqrt{T}$ and $\\sqrt{V}$ scaling of conductance toward the overscreened fixed point. This remains essentially the only experiment that has demonstrated the Nozières–Blandin two-channel fixed point with the universal scaling form; everything earlier — Ralph–Buhrman point contacts, Cichorek glassy systems — showed *consistent* non-Fermi-liquid signatures without the symmetry-tuned demonstration. The Pustilnik review [15] catalogues the relevant nanostructure variants.\n\n### STM: imaging the resonance, not the cloud\n\n**Madhavan, Chen, Jamneala, Crommie and Wingreen (Science 280, 567, 1998)** and the simultaneous **Li, Schneider, Berndt, Delley** work on Co on Au(111) and Ce on Ag(111) used scanning tunnelling spectroscopy to image a Fano lineshape at the Fermi level over single magnetic adatoms — the local-density-of-states signature of the Abrikosov–Suhl resonance. The Fano $q$ parameter encodes the ratio of tunnelling into the resonance versus the conduction band; the width gives $T_K$ to within a convention-dependent factor of order unity. These experiments *did* verify the existence of a many-body resonance at $E_F$ with the expected temperature evolution, but they did not verify universal $G(T/T_K)$ scaling — the STM observable is local DOS, not linear conductance through a Kondo channel, and the $T_K$ extracted from the Fano width is not the same $T_K$ that appears in Wilson's susceptibility convention. The micrometre-scale Kondo screening cloud $\\xi_K = \\hbar v_F/k_B T_K$ has been probed circumstantially via finite-size level statistics in box geometries and quantum-mirage interference (Manoharan, Lutz, Eigler 2000), but no experiment to date has *directly imaged* the spatial extent of the cloud — a gap the dossier will return to in §8.\n\n### A triage table\n\n| Experiment | Year | Shows a feature | Verifies universal $G(T/T_K)$ or $\\chi(T/T_K)$ |\n|---|---|---|---|\n| de Haas–de Boer–van den Berg, Au/Cu/Ag wires [1] | 1934 | minimum | no |\n| Sarachik–Corenzwit–Longinotti, Mo$_{1-x}$Nb$_x$:Fe | 1964 | minimum tied to local moment | no |\n| Triplett–Phillips, Cu–Fe susceptibility | 1971 | $\\chi_{\\rm imp}(T)$ | yes (vs Wilson NRG) |\n| Goldhaber-Gordon et al. dot [12] | 1998 | ZBP, Zeeman, log tail | partial |\n| Cronenwett–Oosterkamp–Kouwenhoven [13] | 1998 | ZBP, gate alternation | partial |\n| van der Wiel et al., symmetric dot | 2000 | unitary $2e^2/h$ | yes |\n| Grobis et al., Fermi-liquid $T^2$ [14] | 2008 | $c_T$ matches Nozières | yes |\n| Madhavan / Li STM Fano on Co, Ce adatoms | 1998 | Abrikosov–Suhl resonance in LDOS | spectroscopic only |\n| Potok et al. two-channel dot | 2007 | $\\sqrt{T}$, $\\sqrt{V}$ | yes (2CK fixed point) |\n\nThe pattern is plain: the *anomaly* was empirically secure by 1936, the *mechanism* by 1971, the *fixed point* by 2000, and the *non-Fermi-liquid extension* by 2007. Every other \"Kondo\" experiment that does not appear in the right column of the table above is, at best, evidence of *a* zero-bias feature compatible with Kondo — which §6 will argue is a much weaker claim than the literature usually admits."}, {"id": "conflations-and-abuses", "title": "What People Call 'Kondo' That Isn't: A Conflation Audit", "markdown": "## What People Call 'Kondo' That Isn't: A Conflation Audit\n\nThe price of a phenomenon named after a single 1964 calculation [4] is that everything resembling it ends up tagged with the same word. Six confusions recur often enough in the literature — and in referee reports — to deserve naming explicitly. None is a matter of taste; each has a sharp operational test.\n\n### 1. Anderson model ≠ Kondo model\n\nThe Anderson Hamiltonian [3]\n$$H_A \\;=\\; \\sum_{k\\sigma}\\varepsilon_k c^\\dagger_{k\\sigma}c_{k\\sigma}+\\sum_\\sigma \\varepsilon_d d^\\dagger_\\sigma d_\\sigma+U n_{d\\uparrow}n_{d\\downarrow}+\\sum_{k\\sigma}\\!\\left(V_{kd}c^\\dagger_{k\\sigma}d_\\sigma+\\text{h.c.}\\right)$$\nkeeps charge fluctuations on the impurity orbital. The Kondo (s-d) Hamiltonian\n$$H_K \\;=\\; \\sum_{k\\sigma}\\varepsilon_k c^\\dagger_{k\\sigma}c_{k\\sigma}+J\\,\\mathbf{s}(0)\\!\\cdot\\!\\mathbf{S}$$\nlives in the projected $n_d=1$ subspace where charge is frozen. The Schrieffer–Wolff transformation [6] is the bridge, valid only when $-\\varepsilon_d,\\;\\varepsilon_d+U \\gg \\pi\\Gamma$ with $\\Gamma=\\pi\\rho|V|^2$, giving\n$$J\\rho \\;=\\; \\frac{2\\Gamma}{\\pi}\\!\\left(\\frac{1}{|\\varepsilon_d|}+\\frac{1}{\\varepsilon_d+U}\\right).$$\nOutside that window — intermediate valence in α-Ce, mixed-valent Yb compounds, gate-detuned dots at the edge of a Coulomb diamond — the physics is Anderson, not Kondo: the local moment is not well-formed, $\\langle n_d\\rangle$ is not pinned at one, and the susceptibility is no longer Curie-like above any sensible $T_K$. Calling such regimes \"Kondo\" because they show a Friedel–Abrikosov–Suhl resonance near $\\varepsilon_F$ confuses the resonance with the screening mechanism that, in this regime, isn't operating.\n\n### 2. One impurity ≠ a lattice of them\n\nThe single-impurity model has one scale $T_K$, a Fermi-liquid fixed point, and Wilson ratio $R=2$ [8, 11]. A Kondo lattice has two: $T_K\\sim D\\exp(-1/2J\\rho)$ and the RKKY scale $T_{\\rm RKKY}\\sim J^2\\rho$. Doniach's argument fixes the competition: $T_K$ wins exponentially at large $J\\rho$, $T_{\\rm RKKY}$ wins as a power at small $J\\rho$, and the crossover hides a quantum critical point — Kondo breakdown — that the impurity problem cannot see. The universal $G(T/T_K)$ collapse of the dot literature [14, 13, 12] does *not* survive lattice coherence: below the coherence temperature $T^*$ the resistivity drops rather than saturating, because Bloch's theorem reasserts itself once the f-electrons hybridize coherently. Citing single-impurity scaling formulas for heavy-fermion compounds at $T\u003cT^*$ — common in early CeAl$_3$ and CeCu$_6$ fits — overstates the calculation's reach.\n\n### 3. Zero-bias peak ≠ Kondo resonance\n\nThis is the noisiest confusion in nanostructure work. Any narrow zero-bias anomaly in $dI/dV$ — from dynamical Coulomb blockade, two-level systems [16, 17], soft co-tunnelling, Andreev bound states near a superconductor, disorder-induced level repulsion, magnetic-field-tuned Majorana modes, or simple weak-localization — will be reported as Kondo somewhere in the literature. The operational checklist that distinguishes genuine Kondo screening:\n\n| Test | Genuine Kondo (S=1/2, 1-channel) | Diagnostic value |\n|---|---|---|\n| Ground-state occupation | Odd $N$ in the dot; CB-diamond bias-floor anomaly only in odd valleys | Eliminates Andreev, even-$N$ co-tunnelling |\n| Temperature scaling | $G(T)/G_0 = \\big[1+(2^{1/s}-1)(T/T_K)^2\\big]^{-s}$, $s\\simeq0.22$ (Costi–Hewson–Zlatić) collapsing to $G_0=2e^2/h$ per channel | Eliminates TLS, disorder ZBA, dyn. Coulomb blockade |\n| Magnetic field | Peak splits at $g\\mu_B B \\gtrsim k_B T_K$ with $\\Delta(B)\\simeq 2g\\mu_B B$ at large field, predicted curvature near $g\\mu_B B\\sim k_B T_K$ | Eliminates Majorana ZBP (no splitting), Andreev (different $g_{\\rm eff}$) |\n| Voltage scaling | $dI/dV$ width $\\sim\\max(T,V,B)/T_K$, Fermi-liquid $T^2$ and $V^2$ coefficients with Nozières ratio $\\alpha_V/\\alpha_T = 3/(2\\pi^2)\\cdot c$ fixed [18, 11] | Eliminates phonon side-bands, inelastic co-tunnelling |\n| Gate dependence | $T_K(\\varepsilon_d)$ minimum at mid-valley, exponential rise toward CB peaks per Haldane formula | Eliminates accidental resonances |\n\nA single bullet item is not a demonstration; the Goldhaber-Gordon [12] and Cronenwett experiments became canonical because they passed nearly all of these together. The Grobis–Rau–Potok–Goldhaber-Gordon review [14] is the modern reference for the full battery, and Pustilnik [15] gives the cleanest theoretical statement.\n\n### 4. \"$T_K$\" is convention-dependent\n\nA persistent error is to import $T_K$ extracted under one convention into a formula derived for another. The common definitions disagree by O(1) factors:\n\n- Wilson's susceptibility definition: $T_K^W \\equiv 0.103/\\chi_{\\rm imp}(0)$ (with $g\\mu_B=1$) [8].\n- Nagaoka/poor-man's perturbative cutoff: $T_K^N = D\\sqrt{J\\rho}\\,e^{-1/2J\\rho}$ [7].\n- Bethe-ansatz natural scale: $T_K^{BA}$ from the Wiegmann–Tsvelick free energy [9].\n- Half-width of the spectral resonance at $\\omega=0$: $T_K^{\\rm spec}\\approx 0.5\\,T_K^W$.\n- Half-width-at-half-max of $G(T)$ from the empirical NRG fit (Goldhaber-Gordon): $T_K^G$, with $G(T_K^G)=G_0/2$ — about a factor 0.6–0.7 of $T_K^W$.\n\nQuoting an experimental $T_K$ in kelvin without naming the convention, then plugging it into Nozières's $\\chi/\\gamma=2$ or into Costi's universal curve, can shift the inferred $J\\rho$ by 20% and inflate or deflate claimed Wilson ratios. Hewson's monograph and Kontani–Yamada [19] tabulate the conversions; nearly every \"anomalous Wilson ratio\" paper turns out, on inspection, to have a convention mismatch.\n\n### 5. Two-channel ≠ ordinary Kondo\n\nNozières–Blandin overscreening flows to a non-Fermi-liquid fixed point: $\\rho(T)-\\rho(0)\\propto\\sqrt{T}$, residual entropy $\\tfrac{1}{2}\\ln 2$, T=0 single-particle S-matrix of modulus $\\tfrac{1}{2}$, and a logarithmic susceptibility. None of this is perturbatively connected to the single-channel fixed point, and the 2CK point is unstable to channel asymmetry $\\delta$: below $T^*\\sim\\delta^2/T_K^{2CK}$ the system crosses over to ordinary Kondo in the stronger channel. A 2CK claim therefore requires not just NFL exponents but a demonstration that $\\delta\\ll T_K^{2CK}$ (Potok–Rau–Shtrikman–Goldhaber-Gordon set the modern bar). The frequent slippage — \"we see a sub-linear $V$-dependence, hence 2CK\" — is the same category error as calling any ZBA Kondo.\n\n### 6. The \"Kondo singlet\" is not a bound state at $-T_K$\n\nDespite the language of compensation clouds and singlet \"binding energy\" $\\sim k_B T_K$, there is no spatially localized bound state at energy $-T_K$ below the Fermi sea. The screened state is a many-body resonance pinned to $\\varepsilon_F$ — the Abrikosov–Suhl / Kondo resonance in the impurity spectral function — whose spatial structure is the Kondo screening cloud\n$$\\xi_K \\;\\sim\\; \\frac{\\hbar v_F}{k_B T_K}.$$\nFor $T_K\\sim 1$ K in a metal with $v_F\\sim 10^6$ m/s this is micrometres, not ångströms; for a quantum dot with $T_K\\sim 1$ K and lead $v_F$, comparably large. Yosida's 1966 variational singlet [5] correctly captures the spin structure but not the spatial extent; Affleck–Simon and Borda's NRG calculations identify $\\xi_K$ as the length on which spin-spin correlations $\\langle\\mathbf{S}\\cdot\\mathbf{s}(r)\\rangle$ change sign. The cloud has been observed only circumstantially — finite-size oscillations in box-geometry simulations, the recent persistent-current and STM-ring claims — and remains the most under-tested prediction of the theory (see §8). Writers who speak of \"breaking the Kondo singlet\" with a field $B$ such that $g\\mu_B B\\sim k_B T_K$ are correct in energy; those who picture the breaking as the dissociation of a tightly bound dimer are wrong in space.\n\nThe unifying lesson of these six confusions is the same: \"Kondo\" names a specific renormalization-group flow with a specific fixed point and specific universal ratios. Anything labelled Kondo that cannot, in principle, be checked against $R=2$, $\\chi_{\\rm imp}T_K=0.103$, $G_0=2e^2/h$ per channel, and the Costi–Hewson–Zlatić collapse is using the word as decoration, not as a claim."}, {"id": "lattice-heavy-fermion-doniach", "title": "From One Impurity to a Lattice: Doniach, RKKY, and Kondo Breakdown", "markdown": "## From One Impurity to a Lattice: Doniach, RKKY, and Kondo Breakdown\n\nPut one localized spin in a Fermi sea and the strong-coupling fixed point is a singlet with a finite screening scale $T_K$ and a textbook Fermi-liquid description [8, 11]. Replace the dilute impurity with a periodic array of moments — a Kondo lattice — and almost every quantitative statement made above must be re-examined. The reason is structural rather than technical: the second moment in the bath is itself dressed by the conduction electrons that were supposed to screen the first, and the indirect exchange between them competes with the Kondo singlet formation that each would prefer on its own.\n\nThe competing interaction is RKKY, fixed by a single second-order calculation: integrating out the conduction electrons at energy $\\sim D$ generates\n$$ H_{\\text{RKKY}} \\;=\\; \\sum_{i\\neq j} J_{ij}\\,\\mathbf{S}_i\\!\\cdot\\!\\mathbf{S}_j,\\qquad J_{ij}\\;\\sim\\;J^2\\rho\\,\\frac{\\cos(2k_F r_{ij}+\\varphi)}{(k_F r_{ij})^3}, $$\noscillating in sign and decaying as $r^{-3}$ in 3D. Its overall scale is $T_{\\text{RKKY}}\\sim J^2\\rho$, set by the same exchange that drives the Kondo logarithm but appearing at one lower order in $J\\rho$. This makes the comparison sharp: at small $J\\rho$ the RKKY scale dominates because $J^2\\rho\\gg D\\exp(-1/J\\rho)$; at large $J\\rho$ the Kondo scale wins because the exponential overtakes the power law. Doniach's 1977 sketch (Doniach, *Physica B* 91, 231, 1977 — verify) drew this crossing as a phase diagram in $J\\rho$, with an antiferromagnetic phase at small coupling, a heavy paramagnet at large coupling, and a quantum critical point separating them. Forty-five years of heavy-fermion phenomenology have refined every line on that diagram, but the skeleton has survived.\n\n### Heavy Fermi liquid as a lattice fixed point\n\nIn the strong-coupling phase the lattice version of the singlet ground state is a Bloch-coherent state of Kondo resonances. Below a *coherence* temperature $T^*$ — not the same as the single-ion $T_K$ — impurity-like incoherent scattering crosses over into a Fermi liquid in which the $f$-moments enter the Luttinger count. The result is a renormalized band structure with quasiparticle mass\n$$ \\frac{m^*}{m}\\;\\sim\\;\\frac{T_F}{T^*}\\;\\sim\\;10^2\\text{–}10^3, $$\nrealized canonically in CeAl$_3$ (Andres–Graebner–Ott, *Phys. Rev. Lett.* 35, 1779, 1975 — verify) and CeCu$_2$Si$_2$ (Steglich et al., *Phys. Rev. Lett.* 43, 1892, 1979 — verify), with linear specific-heat coefficients $\\gamma\\sim 1\\text{ J}/\\text{mol K}^2$. The Sommerfeld–Wilson ratio remains close to 2 — Nozières's single-impurity prediction [11] — which is why heavy-fermion compounds were originally classed as \"Kondo lattices that just got renormalized.\" The deceptive part of this success is that the *temperature dependence* of transport, susceptibility and thermopower above $T^*$ looks single-ion-like, while below $T^*$ it does not: the resistivity changes from an impurity-like $-\\ln T$ rise to a coherence-driven $T^2$ drop, and the universal $G(T/T_K)$ collapse that quantum-dot experiments live by [12] simply ceases to apply. Lattice coherence is a different fixed point.\n\n### What survives, what does not\n\nThe pieces of single-impurity intuition that transfer to the heavy Fermi liquid are: (i) a low scale generated non-perturbatively from $J\\rho$; (ii) phase-shifted Fermi-liquid quasiparticles obeying the Luttinger sum rule with the $f$-electrons *included*; (iii) a Sommerfeld–Wilson ratio of order 2; and (iv) the Nozières $T^2$ coefficient relations between $A$, $\\gamma$, and $\\chi$, which Kadowaki and Woods catalogued empirically as $A/\\gamma^2\\approx 1.0\\times 10^{-5}\\,\\mu\\Omega\\,\\text{cm}\\,(\\text{mol K}/\\text{mJ})^2$ across a remarkable range of materials (Kadowaki–Woods, *Solid State Commun.* 58, 507, 1986 — verify). What does *not* survive is universal $G(T/T_K)$, the unitary-limit per-channel conductance, the single screening scale, and — most damagingly — the assumption that the impurity spin and the conduction electrons share a single ground-state manifold. In a lattice the moments can drop out of the heavy quasiparticle altogether without forming long-range order.\n\n### Kondo breakdown\n\nThe modern controversy is what happens at the Doniach crossing when pressure, chemical doping or magnetic field is tuned through a QCP. The conventional Hertz–Millis–Moriya picture (Hertz 1976; Millis 1993; Moriya 1985 — verify) treats it as a spin-density-wave transition of the heavy Fermi liquid: the $f$-electrons remain part of the Luttinger volume on both sides, and only the magnetic order parameter is critical. The competing *Kondo-breakdown* picture, articulated by Coleman, Pépin, Si and Ramazashvili (*J. Phys. Condens. Matter* 13, R723, 2001 — verify) and by Senthil, Vojta and Sachdev (*Phys. Rev. B* 69, 035111, 2004 — verify), proposes that at the QCP the Kondo screening itself collapses: the $f$-electrons are expelled from the Fermi volume, the Hall coefficient jumps discontinuously, and quasiparticle weight $Z$ vanishes on the *entire* Fermi surface — a \"selective Mott\" transition in which only the $f$-orbital localizes. The cleanest experimental signatures are the abrupt Hall-coefficient jump in YbRh$_2$Si$_2$ (Paschen et al., *Nature* 432, 881, 2004 — verify) and the $E/T$ scaling of magnetic fluctuations in CeCu$_{6-x}$Au$_x$ (Schröder et al., *Nature* 407, 351, 2000 — verify) with anomalous exponent $\\alpha\\approx 0.75$ — far from the Hertz–Millis $\\alpha=1$.\n\nOut of this controversy emerged the *fractionalized Fermi liquid* (FL$^*$), a candidate ground state in which the $f$-moments form a spin liquid with neutral spinon excitations while the conduction electrons retain a small, non-Luttinger Fermi surface. FL$^*$ violates the Oshikawa form of the Luttinger theorem only at the price of an emergent gauge structure, and its experimental signatures — a small Fermi surface coexisting with gapless spin excitations and no broken symmetry — remain contested in YbRh$_2$Si$_2$ and CeRhIn$_5$. From the single-impurity perspective this is the most radical departure: a \"Kondo\" coupling that screens nothing because the would-be screening cloud has been Anderson-localized into a spin liquid before it could form.\n\n### Reading the abuse-alert in the lattice context\n\nThe conflation table in §6 forbids transplanting impurity diagnostics onto lattice systems, but the corollary is constructive. Universal $G(T/T_K)$ collapse, Costi–Hewson–Zlatić scaling and the unitary-limit conductance are *intentional* impurity diagnostics: they work in dilute alloys and quantum dots because each Kondo singlet is independent. In a lattice the corresponding diagnostics are the Kadowaki–Woods ratio, the Luttinger count including or excluding the $f$-electrons, the Hall-jump magnitude at the QCP, and — increasingly — the dynamical scaling exponent of the local susceptibility. These are not single-impurity quantities pushed into the lattice; they are different observables for a genuinely different fixed-point structure that happens to inherit its low-energy scale from the same exchange $J$ that Kondo expanded to third order in 1964 [4]."}, {"id": "frontier-and-open-problems", "title": "Open Problems: Screening Clouds, Non-Fermi Liquids, and Topological Kondo", "markdown": "## Open Problems: Screening Clouds, Non-Fermi Liquids, and Topological Kondo\n\nThe Kondo problem is \"solved\" in the sense that the single-impurity Hamiltonian has a fixed-point spectrum [8], an exact thermodynamic solution [9], and a Fermi-liquid description below $T_K$ [11]. Every live question is about something the textbook fixed point fails to address: where the screening cloud sits in real space, what happens when the bath has the wrong density of states, what happens when more than one channel competes, what happens when a lattice of moments fights itself, and what happens when the impurity Hilbert space is intrinsically nonlocal.\n\n### The screening cloud as an object\n\nYosida's 1966 variational singlet [5] predicted a coherent spin-singlet wavefunction extending over $\\xi_K \\sim \\hbar v_F / k_B T_K$, which for $T_K \\sim 1$ K and $v_F \\sim 10^6$ m/s is a *micrometre* — astonishingly large for a \"screening\" length. Almost every signature that would distinguish a real cloud from a renormalized point-impurity (NMR Knight shifts, RKKY oscillations around the impurity, transport through a ring threading the cloud) integrates out to nearly the same answer the local Fermi-liquid theory gives, which is why Affleck and Simon's 2001 proposal to use a finite-size mesoscopic ring as a \"ruler\" for $\\xi_K$ took two decades to realise. Borzenets *et al.* (Nature **579**, 210, 2020) finally extracted the cloud profile in a gated GaAs quantum dot embedded in a long lead, finding $\\xi_K$ scaling as $1/T_K$ over a decade and a shape consistent with the universal NRG prediction ([sciencedaily](https://www.sciencedaily.com/releases/2020/03/200311121831.htm), [Nature](https://www.nature.com/articles/s41586-020-2058-6)). What is *still* missing is a direct real-space image. STM Fano line-shape mapping around a Co adatom resolves spatial decoration on the lattice scale [14], not the $\\mu$m envelope; a real-space mapping of $\\xi_K$ would require interferometry against a second screened impurity, or a scanning-NV probe of the spin-correlation envelope. Neither has been done.\n\n### Overscreening and non-Fermi-liquid fixed points\n\nThe Nozières–Blandin multichannel model with $k \u003e 2S$ flows to an *intermediate-coupling* fixed point at which the impurity is overscreened: the residual entropy is $S_{\\rm imp}(0) = \\tfrac{1}{2}\\ln 2$ for the two-channel case, the resistivity has a $\\sqrt{T}$ rather than $T^2$ low-temperature correction, and the conduction-electron $S$-matrix has magnitude $\u003c1$ — the signature of inelasticity from a genuinely many-body resonance. The decisive realisations are not magnetic impurity dilution but mesoscopic engineering: Iftikhar *et al.* used the charge degree of freedom of a metallic island coupled to two and three ballistic quantum-point-contact channels to enforce the channel symmetry by construction (Science **360**, 1315, 2018) — the symmetry $\\delta = 0$ is geometric, not fine-tuned. Subsequent extensions probed the Seebeck coefficient ([PRL **125**, 026801](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.125.026801)) and single-electron scattering through the NFL fixed point. The most recent thermodynamic test — Pouse *et al.*'s direct measurement of the $\\tfrac{1}{2}\\ln 2$ fractional entropy via Maxwell-relation charge sensing in a charge-Kondo island ([arXiv:2605.00669](https://arxiv.org/abs/2605.00669)) — is the cleanest existing answer to the abuse-alert in §6: a $\\sqrt{T}$ resistance alone is not enough, the *residual entropy* is what the multichannel fixed point uniquely fixes. The symplectic and $SU(N)$ generalisations [20, 21] supply a richer zoo of NFL fixed points whose residual entropies are calculable from Affleck–Ludwig boundary CFT but mostly unexplored experimentally.\n\n### Pseudogap and Dirac baths\n\nWhen the bath density of states vanishes as $\\rho(\\varepsilon) \\sim |\\varepsilon|^r$ — graphene at the Dirac point ($r=1$), $d$-wave superconductors ($r=1$), surfaces of Weyl semimetals — the Anderson–Kondo problem of Withoff and Fradkin (PRL **64**, 1835, 1990) hosts a *quantum phase transition* at finite coupling: below a critical $J_c(r)$ the impurity is unscreened down to $T=0$ [22]. The Vojta–Fritz NRG analysis (PRB **70**, 094502) maps out the symmetric- and asymmetric-pseudogap fixed points and predicts non-Fermi-liquid impurity thermodynamics at the critical coupling. The experimental status is awkward: gated graphene with vacancy moments (Mao *et al.*, Nat. Commun. **9**, 2073) shows Kondo signatures whose chemical-potential dependence is roughly consistent with the pseudogap phase boundary, but the disorder-broadened bath obscures the universal scaling. Twisted-bilayer graphene at magic angle revived this problem in a new guise: Song and Bernevig's topological heavy-fermion representation (PRL **129**, 047601, 2022) and the Kondo-lattice models that followed (Shi *et al.*, [PRL **131**, 026501](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.131.026501)) embed flat-band local moments in a Dirac-like conduction sea — a designer pseudogap Kondo lattice whose phase diagram includes a \"symmetric Kondo state\" at integer fillings.\n\n### Topological and Majorana Kondo\n\nBéri and Cooper's 2012 proposal coupled a normal lead to $M \\geq 3$ Majorana zero modes on a mesoscopic superconducting island; the resulting \"topological Kondo\" model has an $SO(M)$ exchange symmetry enforced by the *nonlocality* of the Majoranas rather than by orbital fine-tuning, and flows to an overscreened multichannel fixed point with residual entropy $\\tfrac{1}{2}\\ln(M/2)$ for even $M$. The fractional-entropy program above [arXiv:2605.00669](https://arxiv.org/abs/2605.00669) is the first thermodynamic probe in this direction; a true topological Kondo experiment requires demonstrating that the entropy persists against perturbations that would lift accidental degeneracies but not topological ones — *exactly* what fine-tuned 2CK realisations cannot do. The symplectic-Kondo proposal [20] generalises the same idea to $Sp(2N)$ fixed points and connects to the ABCD classification [21].\n\n### Kondo breakdown vs Hertz–Millis\n\nThe Doniach competition discussed in §7 leaves open whether the magnetic QCP in heavy-fermion materials is conventional (Hertz–Millis: order parameter critical, quasiparticles spectators) or \"Kondo-destroying\" (the local moments delocalize *at* the QCP, the Fermi surface jumps, $T^*\\to 0$). YbRh$_2$Si$_2$ under field tuning remains the cleanest test bed: the Hall coefficient shows a step crossover sharpening to a jump as $T\\to 0$, the $T^*$ line collapses onto the QCP, the Wiedemann–Franz law is violated at $H=H_c$ ([arXiv:1309.7260](https://arxiv.org/abs/1309.7260)). Recent strange-metal theory ([sciencenewstoday](https://www.sciencenewstoday.org/new-theoretical-framework-explains-strange-metal-behavior-near-quantum-critical-points), 2025) frames the Kondo-breakdown fixed point as an *intrinsic* attractor for the marginal-Fermi-liquid optical conductivity of YbRh$_2$Si$_2$ and CeCoIn$_5$. The Hertz–Millis description, by contrast, cannot accommodate Fermi-surface reconstruction at the QCP. The decisive missing experiment is a *direct* photoemission measurement of the Fermi-surface volume on both sides of $H_c$ at $T \\ll T^*$; ARPES on heavy-fermion materials at sub-100 mK is still bleeding-edge.\n\n### What would constitute a decisive experiment\n\nAlmost any of the above can be faked by a zero-bias anomaly. The hierarchy of evidence required to claim a new Kondo result, in increasing order of weight:\n\n1. A peak that gates with occupancy and splits in field with the predicted $g_{\\rm eff}$.\n2. Universal $G(T/T_K)$ collapse onto the appropriate fixed-point curve — Costi–Hewson–Zlatić for single-channel Fermi-liquid, Affleck–Ludwig for multichannel, Béri–Cooper for topological.\n3. Residual entropy: $0$, $\\tfrac{1}{2}\\ln 2$, $\\tfrac{1}{2}\\ln(M/2)$, or fractional values matching the postulated fixed point. Entropy is what genuinely distinguishes fixed points; transport does not.\n4. A spatial probe of $\\xi_K$ or of the Fermi-surface reconstruction, where applicable.\n\nSteps 3–4 are where the field is now. Another zero-bias peak is not news; a thermodynamic measurement that pins the residual entropy of a putative fixed point is.\n\nSources:\n- [Observation of the Kondo screening cloud (Nature 2020)](https://www.nature.com/articles/s41586-020-2058-6)\n- [Experimental Evidence of Fractional Entropy in Critical Kondo Systems (arXiv:2605.00669)](https://arxiv.org/abs/2605.00669)\n- [Thermoelectric Transport in a Three-Channel Charge Kondo Circuit (PRL 125, 026801)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.125.026801)\n- [Kondo Lattice Model in Magic-Angle Twisted Bilayer Graphene (PRL 131, 026501)](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.131.026501)\n- [Topological Kondo effect with Majorana fermions (arXiv:1206.2224)](https://arxiv.org/abs/1206.2224)\n- [Evidence for a Kondo-destroying QCP in YbRh2Si2 (arXiv:1309.7260)](https://arxiv.org/abs/1309.7260)\n- [Strange-metal framework from Kondo breakdown (2025)](https://www.sciencenewstoday.org/new-theoretical-framework-explains-strange-metal-behavior-near-quantum-critical-points)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier arguing that the Kondo problem is the cleanest example we have of a non-trivial infrared instability in a Fermi system being tamed, end to end, by a sequence of theoretical ideas — perturbative resummation, scaling, numerical renormalization group, Bethe ansatz, Fermi-liquid expansion around a strong-coupling fixed point. Here is what I actually think about the present state of the field.\n\n### (a) What I would defend with my reputation\n\nThe single-impurity, single-channel, spin-$\\tfrac12$ Kondo model is *solved* in the strongest sense a many-body problem can be solved: Wilson's NRG [8] gives the full crossover, Andrei's and Wiegmann's Bethe ansatz [9] gives the exact thermodynamics, and Nozières's local Fermi-liquid expansion [11] gives the leading low-temperature transport coefficients with a Wilson ratio of exactly 2. Any new claim about single-impurity Kondo that disagrees with these three pillars is, with overwhelming prior, wrong. I would also defend Anderson's poor-man's scaling as the historically pivotal step — not because it was numerically the most accurate, but because it was the first place anyone showed in condensed matter that an effective coupling could *flow*, an idea Wilson then made rigorous.\n\nI will defend the quantum-dot demonstrations of universal $G(T/T_K)$ collapse to the Costi–Hewson–Zlatić curve and unitary $2e^2/h$ as a genuine reproduction of the impurity fixed point, not an analogy.\n\n### (b) What is shakier than the literature admits\n\nThree things.\n\nFirst, **the Kondo-lattice problem is not a controlled extension of the impurity problem** — it is a different problem wearing the same notation. The DMFT mapping is exact only in $d\\to\\infty$; in three dimensions it discards the momentum dependence of the self-energy and, with it, the very physics (RKKY, magnetic order, Kondo-breakdown lines) that heavy-fermion experiments care about. \"Coherence temperature $T^*$\" is used in the literature with at least four operational definitions that do not coincide.\n\nSecond, **the Kondo screening cloud of spatial extent $\\xi_K \\sim v_F/T_K$ has not been directly imaged.** The Affleck–Simon proposals and the persistent-current and STM-tail experiments are consistent with $\\xi_K$ but do not measure it; the community has quietly settled on \"circumstantially confirmed\" where I would still write \"not observed\".\n\nThird, **two-channel Kondo claims in nanostructures rest on assumptions about channel symmetry that are almost never independently verified.** The relevant inequality is $\\delta \\ll T_K^{2CK}$ where $\\delta$ is the channel-asymmetry energy; in practice $\\delta$ is inferred from the same fits that claim 2CK behaviour, which is circular. Potok-type setups [referenced in §5] are the cleanest cases and I read even those as suggestive rather than decisive.\n\n### (c) Three open questions I would actually work on\n\n1. **Direct spatial imaging of the Kondo cloud.** A clean STM or NV-magnetometry measurement of the $1/r$ susceptibility tail at $r \u003c \\xi_K$ in a known-$T_K$ adatom system would close a 50-year gap.\n2. **Kondo breakdown as a genuine selective-Mott transition.** Distinguishing it from spin-density-wave criticality requires a single experiment showing simultaneous Fermi-surface reconstruction *and* loss of $f$-electron coherence at the same $H$ or $p$ — current data underconstrain the alternatives.\n3. **Two-channel Kondo with tunable, independently calibrated channel asymmetry.** Until $\\delta$ is set by a knob and measured *outside* the fit, every claim of NFL exponents in a dot is a fit, not a fixed point.\n\n### (d) Reading path\n\n1. [4] — Kondo's 1964 calculation. Read it for what a careful perturbative result actually looks like when an infrared divergence is real.\n2. Anderson's poor-man's scaling paper (Anderson 1970, *J. Phys. C*) — the moment scaling enters strongly correlated electrons; short, and the cleanest exposition of the idea is the original.\n3. [8] — Wilson 1975 RMP. The technical landmark; skim the numerics, read the discussion of fixed points and the leading irrelevant operator.\n4. [11] — Nozières 1974. Twelve pages that contain the entire low-$T$ phenomenology of every Kondo dot experiment of the last quarter century.\n5. [9] — Andrei/Wiegmann Bethe-ansatz solution. Read last: it is the consistency check that retrospectively certifies the previous four."}], "references": [{"n": 1, "title": "The electrical resistance of gold, copper and lead at low temperatures", "authors": ["W.J. de Haas", "J. de Boer", "G.J. van den Berg"], "year": 1934, "venue": "Physica 1, 1115", "url": "https://doi.org/10.1016/S0031-8914(34)80310-2", "cited_by": null, "bucket": "archive"}, {"n": 2, "title": "On Some Electrical and Magnetic Properties of Metallic Solid Solutions", "authors": ["J. Friedel"], "year": 1956, "venue": "Canadian Journal of Physics 34, 1190", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Localized Magnetic States in Metals", "authors": ["P.W. Anderson"], "year": 1961, "venue": "Physical Review 124, 41", "url": "https://doi.org/10.1103/PhysRev.124.41", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Resistance Minimum in Dilute Magnetic Alloys", "authors": ["Jun Kondo"], "year": 1964, "venue": "Progress of Theoretical Physics 32, 37", "url": "https://doi.org/10.1143/PTP.32.37", "cited_by": null, "bucket": "archive"}, {"n": 5, "title": "Bound State Due to the s-d Exchange Interaction", "authors": ["Kei Yosida"], "year": 1966, "venue": "Physical Review 147, 223", "url": "https://doi.org/10.1103/PhysRev.147.223", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "Relation between the Anderson and Kondo Hamiltonians", "authors": ["J.R. Schrieffer", "P.A. Wolff"], "year": 1966, "venue": "Physical Review 149, 491", "url": "https://doi.org/10.1103/PhysRev.149.491", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "A poor man's derivation of scaling laws for the Kondo problem", "authors": ["P.W. Anderson"], "year": 1970, "venue": "Journal of Physics C 3, 2436", "url": "https://doi.org/10.1088/0022-3719/3/12/008", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "The renormalization group: Critical phenomena and the Kondo problem", "authors": ["Kenneth G. Wilson"], "year": 1975, "venue": "Reviews of Modern Physics 47, 773", "url": "https://doi.org/10.1103/RevModPhys.47.773", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Diagonalization of the Kondo Hamiltonian", "authors": ["N. Andrei"], "year": 1980, "venue": "Physical Review Letters 45, 379", "url": "https://doi.org/10.1103/PhysRevLett.45.379", "cited_by": null, "bucket": "archive"}, {"n": 10, "title": "Exact Results in the Kondo Problem. II. Scaling Theory, Qualitatively Correct Solution, and Some New Results on One-Dimensional Classical Statistical Models", "authors": ["P.W. Anderson", "G. Yuval", "D.R. Hamann"], "year": 1970, "venue": "Physical Review B 1, 4464", "url": "https://doi.org/10.1103/PhysRevB.1.4464", "cited_by": null, "bucket": "archive"}, {"n": 11, "title": "A \"Fermi-liquid\" description of the Kondo problem at low temperatures", "authors": ["P. Nozières"], "year": 1974, "venue": "Journal of Low Temperature Physics 17, 31", "url": "https://doi.org/10.1007/BF00654541", "cited_by": null, "bucket": "archive"}, {"n": 12, "title": "Kondo effect in a single-electron transistor", "authors": ["D. Goldhaber-Gordon", "Hadas Shtrikman", "D. Mahalu", "David Abusch-Magder", "U. Meirav", "M.A. Kastner"], "year": 1998, "venue": "Nature 391, 156", "url": "https://doi.org/10.1038/34373", "cited_by": null, "bucket": "archive"}, {"n": 13, "title": "Revival of the Kondo effect", "authors": ["Leo Kouwenhoven", "Leonid Glazman"], "year": 2001, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0104100v1", "cited_by": null, "bucket": "arXiv"}, {"n": 14, "title": "Kondo Effect in Mesoscopic Quantum Dots", "authors": ["M. Grobis", "I. G. Rau", "R. M. Potok", "D. Goldhaber-Gordon"], "year": 2006, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0611480v1", "cited_by": null, "bucket": "arXiv"}, {"n": 15, "title": "Kondo effect in nanostructures", "authors": ["M. Pustilnik"], "year": 2005, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0512671v2", "cited_by": null, "bucket": "arXiv"}, {"n": 16, "title": "Kondo Effect on Mesoscopic Scale (Review)", "authors": ["O. Ujsaghy", "A. Zawadowski"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0407766v1", "cited_by": null, "bucket": "arXiv"}, {"n": 17, "title": "Kondo effect in non-equilibrium - Theory of energy relaxation induced by dynamical defects in diffusive nanowires", "authors": ["Johann Kroha"], "year": 2001, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0102185v1", "cited_by": null, "bucket": "arXiv"}, {"n": 18, "title": "Fermi liquid theory for the nonequilibrium Kondo effect at low bias voltages", "authors": ["Akira Oguri"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0412220v2", "cited_by": null, "bucket": "arXiv"}, {"n": 19, "title": "From Kondo Effect to Fermi Liquid", "authors": ["Hiroshi Kontani", "Kosaku Yamada"], "year": 2004, "venue": "arXiv", "url": "http://arxiv.org/abs/cond-mat/0409565v1", "cited_by": null, "bucket": "arXiv"}, {"n": 20, "title": "Topological symplectic Kondo effect", "authors": ["Guangjie Li", "Elio J. König", "Jukka I. Väyrynen"], "year": 2022, "venue": "arXiv", "url": "http://arxiv.org/abs/2210.16614v2", "cited_by": null, "bucket": "arXiv"}, {"n": 21, "title": "ABCD of Kondo effect", "authors": ["Taro Kimura"], "year": 2020, "venue": "arXiv", "url": "http://arxiv.org/abs/2011.08301v2", "cited_by": null, "bucket": "arXiv"}, {"n": 22, "title": "Dirac fermions and Kondo effect", "authors": ["Takashi Yanagisawa"], "year": 2015, "venue": "arXiv", "url": "http://arxiv.org/abs/1502.07898v2", "cited_by": null, "bucket": "arXiv"}], "nsec": 9, "nref": 22, "teaser": "Kondo's anomaly, Wilson's fixed point, and the screening cloud that quantum-dot physics keeps rediscovering"}</script>
