<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "The Logarithm That Ate Perturbation Theory", "alternativeHeadline": "Kondo effect", "name": "Kondo effect", "description": "Kondo's anomaly, Wilson's fixed point, and the screening cloud that quantum-dot physics keeps rediscovering", "inLanguage": "en", "keywords": ["Kondo effect", "s-d problem", "Kondo problem", "resistance minimum problem", "s-d exchange resistivity", "single-impurity Kondo model (SIKM)", "condensed matter"], "about": [{"@type": "Thing", "name": "Kondo effect"}, {"@type": "Thing", "name": "s-d problem"}, {"@type": "Thing", "name": "Kondo problem"}, {"@type": "Thing", "name": "resistance minimum problem"}, {"@type": "Thing", "name": "s-d exchange resistivity"}, {"@type": "Thing", "name": "single-impurity Kondo model (SIKM)"}], "articleSection": "condensed matter", "datePublished": "2026-06-13", "dateModified": "2026-06-13", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/the-logarithm-that-ate-perturbation-theory.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/the-logarithm-that-ate-perturbation-theory.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Leiden 1934: The Anomaly and Its Forgotten Custodians Leiden 1934: The Anomaly and Its Forgotten Custodians In Physica volume 1, a paper signed by Wander Johannes de Haas, Jan Hendrik de Boer, and Gerrit Jan van den Berg — three colleagues at the Kamerlingh Onnes Laboratorium — reported the electrical resistance of gold, copper, and lead measured deep into the liquid-helium range . The data did not behave. For lead the resistivity dropped monotonically to a small residual, exactly as Bloch–Grüneisen prescribed and Matthiessen's rule expected. The \"pure\" gold did something else: below roughly 10 K, \\rho(T) stopped decreasing, passed through a shallow minimum, and began to climb as the temperature was lowered further. The copper showed the same shape with smaller amplitude. The Leiden authors described the curves without naming a mechanism. They had no entitlement to one — the anomaly violated the additive Matthiessen decomposition that had governed metallic conduction for sixty years, and there was no candidate term in any contemporary theory that could rise as T fell. They reported the observation and stopped. Three things deserve early emphasis because they shape the rest of the story. First, the samples were \"pure\" only by the standards of 1934 metallurgy. Spectroscopic estimates that emerged over the following decades put the iron content of the offending gold and copper wires at parts-per-million levels — invisible to ordinary chemistry, decisive for the resistivity. The 1934 paper does not identify Fe as the culprit; that recognition arrived gradually, and the clean demonstration that the minimum tracked dissolved magnetic moments would not be produced until Sarachik, Corenzwit, and Longinotti's 1964 work on Mo–Nb hosts. In 1934 the anomaly was, simply, a property of \"gold and copper at low temperatures\". Second, the Leiden authorship list contained three names but the literature would quickly reduce it to one and a half. Western reviews routinely cite the paper as \"de Haas and van den Berg\" or \"de Haas et al. \"; Jan de Boer — later professor of theoretical physics in Amsterdam and a quantum-statistical-mechanics figure in his own right — disappears entirely from the textbook trail. Van den Berg, who would devote much of the next thirty years to systematic study of the very anomaly the three of them had discovered, is usually allowed to survive as the et al. Third, the experimental Leiden of 1934 was the only laboratory on Earth where this measurement was easy. Kamerlingh Onnes had liquefied helium in 1908; de Haas himself, with Wiersma, had pioneered adiabatic demagnetization the year before the paper appeared. Cryogenic competence, trace-impurity sensitivity, and a cultural appetite for sub-Kelvin curiosities were concentrated in one building. The 1934 observation was therefore not a curiosity of one wire — it was a Leiden program. Van den Berg continued to map the resistance minimum across nominally pure copper, silver, gold, and zinc with collaborators including Brill and Croft, and B.M. Boerstoel and B. Knook would extend the systematics into doctoral theses at Leiden in the early 1960s identifying ppm-level Fe as the controlling parameter (verify). The next public confirmation came in 1936 from Walther Meissner and Berthold Voigt in Berlin, who measured Au and Cu under different metallurgical preparation and reproduced the minimum. Meissner's interpretation differed from the Leiden one — he favoured phonon spectrum truncation or boundary scattering — but the existence of the anomaly was settled. From then until the early 1960s the empirical picture matured slowly, in fragments, in metallurgy journals and conference proceedings rather than in Physical Review . The phenomenology that emerged is captured by the additive decomposition where the first term is residual potential scattering, the second is the Bloch phonon contribution, and the third — anomalous, present only with magnetic dopants and linear in their concentration c {\\text{imp}} — is the term that has no business being there. Setting d\\rho/dT = 0 gives T {\\min} \\propto c {\\text{imp}}^{1/5}: the minimum shifts to higher temperature in dirtier samples but very slowly, while its depth grows linearly. This sublinear shift had been empirically clear by the late 1950s and is the most stringent fingerprint distinguishing the Kondo anomaly from a Bloch–Grüneisen artefact. None of this fingerprinting required a theory; it required systematics , which is what the next generation supplied. Figure: The 1934–1960s empirical picture. The measured \\rho(T) is the sum of a flat residual \\rho 0, the Bloch phonon term \\propto T^{5}, and an anomalous -\\ln T contribution proportional to the magnetic-impurity concentration. The minimum lies where the rising T^{5} term equals the falling logarithm, fixing T {\\min} \\propto c^{1/5}. Kondo would later supply the \\ln T from third-order Born scattering; the 1930s–50s experimentalists had supplied the curve. In the 1950s the program crystallized around two figures in particular. Brian R. Coles at Imperial College, working on Cu–Fe, Au–Fe, and Cu–Mn systems, established that the depth of the minimum scaled linearly with magnetic-impurity concentration while T {\\min} moved very slowly — a c^{1/5} shift, not a c shift — and that the effect required a magnetic impurity: Cu–Zn and Cu–Ag, with no local moment, showed no minimum. Coles's Philosophical Magazine papers, together with A. J. Heeger's compendious 1969 Solid State Physics review, are the closest things to a systematic English-language compendium of the pre-Kondo phenomenology that exist. In parallel, Morrel H. Cohen's group at Chicago and the Bell Labs metallurgists (Matthias, Clogston, Jaccarino) connected the local-moment formation question to the Friedel virtual-bound-state picture being developed concurrently in theory and to Anderson's local-moment criterion : not every dissolved 3d element produced a moment in every host, and only the hosts where it did showed an anomaly. The local-moment-or-not distinction was not a Kondo question — it was the precondition for Kondo physics to be operative at all. Van den Berg's 1964 chapter in Progress in Low Temperature Physics volume IV — three decades after his Leiden debut on the same problem — compiled this scattered evidence into a coherent landscape. By that point the empirical statement was crisp: the resistance minimum is a property of dilute magnetic impurities in non-magnetic metallic hosts, additive in concentration, logarithmic in temperature, and demanding a theoretical mechanism that no one had. Sarachik, Corenzwit, and Longinotti's 1964 Physical Review paper closed the loop by demonstrating in Mo–Nb–Fe that the anomaly appeared and disappeared in step with the Fe local moment as a function of host composition: turn off the moment, lose the minimum. Months later Jun Kondo's third-order calculation supplied the logarithm — but the target he hit had been drawn, refined, and labelled by three decades of work performed largely by people whose names are absent from the textbook account. The credit ledger for this prehistory is uneven and worth stating plainly. The 1934 observation is rightly catalogued under de Haas; de Boer and van den Berg are routinely demoted to et al. , despite the fact that van den Berg himself ran the systematic follow-up program for the next thirty years. Meissner's 1936 confirmation is usually skipped over because the interpretation was wrong, although the data were right. Coles's 1956–63 systematics, Cohen's local-moment programme, and the Leiden doctoral output of the early 1960s are the experimental scaffolding on which the Friedel–Anderson local-moment picture and the Kasuya–Yosida Hamiltonian rest, but they are seldom cited outside historical reviews. The convention \"the resistance minimum was an unexplained puzzle from 1934 to 1964\" is true only if one treats the experimental tradition as decoration on the theoretical timeline. It was the other way round: the theorists were chasing curves the experimentalists had already mapped in detail. Kondo, to his credit, says exactly this in the 1969 Solid State Physics review that introduced his calculation to a Western audience. Genealogy of the Hamiltonian: Zener, Kasuya, Yosida, Friedel, Anderson Genealogy of the Hamiltonian: Zener, Kasuya, Yosida, Friedel, Anderson The operator that Kondo expanded to third order in 1964 was not his. By the time he wrote down the s–d exchange Hamiltonian had been in continuous use for thirteen years, with a parallel Soviet life of nearly twenty. Reconstructing the genealogy is not pedantry: each predecessor brought a piece of physics — a sign, a projection, a regime of validity — that the modern abbreviation \"Kondo Hamiltonian\" silently inherits and occasionally betrays. Zener 1951: phenomenological exchange, ferromagnetic sign Clarence Zener's three-paper series on transition-metal ferromagnetism ( Phys. Rev. 81, 440; 82, 403; 83, 299, 1951) introduced an inner-shell ↔ conduction-band coupling of the form -J\\,\\boldsymbol\\sigma\\!\\cdot\\!\\mathbf S in order to communicate the ordering tendency of localised 3d moments to the itinerant 4s electrons. Two features of Zener's construction propagate downstream: - The interaction is written as a contact spin–spin term, not as a Coulomb integral. Zener is not deriving it; he is asserting an effective Heisenberg coupling between the lattice spin and a single conduction-electron spin density evaluated at the impurity site. - J is taken positive (ferromagnetic) on physical grounds. Zener wanted parallel alignment to explain double-exchange in mixed-valence manganites and the high T c of iron-group metals. Both features are wrong for the resistance-minimum problem — there the relevant coupling is antiferromagnetic and emerges as a virtual second-order process — but Zener's form is exactly what Kasuya and Yosida would later validate microscopically and what Kondo would later perturb in. Kasuya 1956 and Yosida 1957: the operator gets a microscopic pedigree Tadao Kasuya, in Prog. Theor. Phys. 16, 45 (1956), redid Zener's construction starting from an explicit hybridisation integral between a localised d-orbital and Bloch states. Expanding in V {\\mathbf k d}/(\\varepsilon F - \\varepsilon d) he obtained with a momentum-dependent exchange integral whose Fourier transform produces the oscillatory polarisation we now call the RKKY interaction. Kei Yosida ( Phys. Rev. 106, 893, 1957) then carried out the polarisation calculation that gives the spatial form J(R)\\!\\propto\\!\\cos(2k F R)/R^3 between two localised moments in a free-electron metal. In the same paper Yosida applied first-order perturbation theory in J to compute spin-disorder resistivity and obtained a result constant in temperature — the negative result that, in retrospect, is the precise statement of why one had to go to third order to see the logarithm. The operator Kondo expanded in 1964 is, line for line, the Kasuya–Yosida Hamiltonian. Within the Anglophone literature the Western convention is to call it \"the s–d Hamiltonian\" through about 1969 and \"the Kondo Hamiltonian\" thereafter, an attribution shift the original authors lived to see and never publicly contested. Yosida himself, in his 1966 variational calculation of the singlet ground state , refers to \"the s–d interaction\" throughout and treats the structure of the operator as established background. The Sverdlovsk parallel: Vonsovsky and Turov A second, almost completely independent thread runs through the Ural school. S.V. Vonsovsky's ZhETF 16, 981 (1946) — five years before Zener — already contains an s–d exchange operator essentially identical to (1), used to derive the temperature dependence of ferromagnetic resistivity. With E.A. Turov he extended this in ZhETF 24, 419 (1953) to compute spin-wave corrections to conduction-electron scattering. The Sverdlovsk programme treated the s–d model not as a phenomenology but as the controlled output of a Wannier-projection procedure applied to the periodic d-electron problem; their derivation contains, in embryonic form, the projection onto the local-moment subspace that Schrieffer and Wolff would rediscover by canonical transformation in 1966 . The omission of Vonsovsky from Anglophone histories is partly a translation lag (the Wiley translation of Magnetism did not appear until 1974) and partly Cold-War citation hygiene; Kondo's own Solid State Physics review (vol. 23, 1969) does cite Vonsovsky, but most subsequent reviews silently drop the reference. Friedel 1956: the virtual bound state Running in parallel to the spin-exchange programme, Jacques Friedel was asking a logically prior question: when does a transition-metal impurity in a non-magnetic host carry a local moment at all? His 1956 Canadian Journal of Physics paper introduced the virtual bound state — a resonance of width \\Delta = \\pi V^{2}\\rho(\\varepsilon F) at energy \\varepsilon d, with phase shift \\eta \\ell(\\varepsilon) saturating the Friedel sum rule Friedel's picture is purely one-body: spin-up and spin-down channels are degenerate, the d-level is broadened but not split, and a moment is impossible at T=0. The triumph of the construction is the screening-charge oscillations \\delta n(r) \\propto \\cos(2k F r)/r^3 — the same kernel that drives RKKY — and the prediction that residual resistivities of dilute transition-metal alloys should peak in the middle of each 3d row (the experimentally seen Friedel maxima). The defect of the construction is exactly the spin question Anderson would answer five years later. Anderson 1961: charge fluctuations and the local-moment criterion P.W. Anderson added the Coulomb repulsion Friedel had elided: Treated in Hartree–Fock, the model gives a local-moment criterion U\\rho(\\varepsilon F) 1 (the Anderson criterion ), which sharpens Friedel's picture: the virtual bound state spin-splits, and the impurity carries a moment provided \\varepsilon d \u003c \\varepsilon F \u003c \\varepsilon d + U with U \\gg \\Delta. Anderson's operator is the parent of the Kasuya–Yosida operator — it contains charge fluctuations the s–d model has integrated out — but in 1961 the connection was not yet explicit. That step is Schrieffer and Wolff's : in the local-moment regime, second-order perturbation in V {\\mathbf k d} generates with sign opposite to Zener's phenomenological J. This is the result that fixes the infrared-unstable sign of the coupling and forces the logarithmic flow Kondo would later find by brute force. What the synthesis bequeaths By the eve of Kondo's calculation the field possessed: (i) an operator of agreed form (Zener → Kasuya–Yosida → Vonsovsky), (ii) a one-body backdrop in which to embed it (Friedel), (iii) a derivation that fixes both its sign and its regime of validity (Anderson, made explicit only post hoc by Schrieffer–Wolff), and (iv) Yosida's first-order calculation showing that something beyond Born must be responsible for the resistance minimum. The Kasuya–Yosida operator is exact only inside the projected subspace where charge fluctuations on the d-orbital have been quenched; valence-fluctuation regimes (Ce, Yb, U mixed-valence) live outside it and require the full Anderson model. The conflation of the two — endemic in modern quantum-dot literature, where \"Kondo regime\" and \"Anderson dot\" are used as synonyms — is the inheritance tax this genealogy continues to charge. Kondo 1964: A Third-Order Logarithm and a Genuine Infrared Catastrophe Kondo 1964: A Third-Order Logarithm and a Genuine Infrared Catastrophe By 1963 the question was no longer whether dilute Fe in Cu, Au or Ag produced a resistance minimum — that had been settled in Leiden three decades earlier and decorated with a generation of systematics — but why second-order Born scattering off a Kasuya–Yosida exchange vertex stubbornly refused to produce one. Take the Hamiltonian Kondo started from, with J 0 for antiferromagnetic exchange and \\rho the conduction-band density of states per spin at the Fermi level. Fermi's golden rule at order J^{2} gives a momentum- and temperature-independent transition probability proportional to J^{2}S(S+1), hence a flat impurity resistivity No minimum, no temperature dependence, nothing to explain de Haas–de Boer–van den Berg. The phonon contribution rises as T^{5}, the impurity contribution is constant; their sum is monotonic. This is the wall Kondo walked into. The third-order matrix element Kondo's move was to compute the impurity T-matrix to third order in J, i.e. one more vertex than Born. Two topologies contribute: the direct process in which the conduction electron scatters off the impurity, propagates as a particle of energy \\varepsilon {\\mathbf{q}} \\varepsilon {F}, then scatters again; and the crossed process in which the intermediate state is a hole of energy \\varepsilon {\\mathbf{q}}\u003c\\varepsilon {F} with the impurity in a different magnetic substate. For a static, classical scatterer the two processes would simply add up to the standard particle/hole symmetrisation of T-matrix theory and produce no logarithm. They produce one here because the impurity spin is a quantum operator and the spin operators at the three vertices fail to commute. Schematically, the third-order amplitude for scattering an electron of spin \\beta to spin \\alpha reads with the Pauli operators acting on the conduction-spin indices \\alpha\\beta and the impurity operators acting on its (2S+1)-dimensional Hilbert space. Two structures appear on the right. The piece symmetric in the order of S^{b}S^{c} multiplies the Fermi-symmetric combination 1-f(\\varepsilon {\\mathbf{q}})-f(\\varepsilon {\\mathbf{q}})=1-2f(\\varepsilon {\\mathbf{q}}) — wrong, the symmetric piece multiplies the standard 1-f plus -f recombination that gives the usual principal-value background. The piece antisymmetric in S^{b}S^{c} — i.e. proportional to the commutator — multiplies the antisymmetric combination (1-f)-(-f)\\!\\to\\!1-2f(\\varepsilon {\\mathbf{q}}), the deviation of the Fermi function from a half. Performing the spin trace, the antisymmetric piece contracts i\\epsilon^{bcd}S^{d} with \\sigma^{b}\\sigma^{c}=i\\epsilon^{bce}\\sigma^{e}+\\delta^{bc} and produces an operator proportional to \\boldsymbol{\\sigma}\\cdot\\mathbf{S} — i.e. it renormalises the original vertex . The accompanying energy integral is the catastrophic one: The integrand is peaked within k {B}T of the Fermi surface, and the energy denominator gives logarithmic weight to every decade out to the bandwidth D. Putting the algebra together, Kondo's third-order correction shifts the effective coupling at energy \\omega\\sim k {B}T to and the impurity resistivity acquires the structure announced in , Sign and inevitability The sign now does all the work. For T\\ll D the logarithm is large and negative . With J 0 the bracket grows as T falls; added to a phonon background \\sim T^{5} that shrinks , the sum has a minimum at T {\\min}\\sim(b J\\rho/5a)^{1/5}\\Theta {D}, with the famous \\Theta {D}\\,c {\\rm imp}^{1/5} scaling Kondo extracted from the Cu–Fe data of MacDonald, Pearson and Templeton and the Mo–Nb–Fe data of Sarachik, Corenzwit and Longinotti. For J\u003c0 — true ferromagnetic exchange, as in the original Zener double-exchange context — the bracket shrinks and no minimum forms; the perturbation series is well-behaved at all temperatures. This asymmetry between \\pm J is not a peculiarity of the third-order calculation but a robust statement about the renormalisation-group flow: the one-loop \\beta-function dg/d\\ln D=-2g^{2}+\\mathcal{O}(g^{3}), with g\\equiv J\\rho, is quadratic in g and therefore symmetric in sign at fixed g , while the bare coupling is not. Antiferromagnetic exchange flows to strong coupling, ferromagnetic to weak. Real IR catastrophe, not a calculational artefact The instinct of a particle theorist seeing a \\ln(D/T) in third order is to suspect either a missing counterterm or a UV/IR mismatch. Neither applies. The Kondo problem is a 0+1-dimensional fermionic field theory: the impurity has no spatial extent, only a worldline. The dimensionless coupling g=J\\rho is marginal at tree level, and the only available scale in the conduction sea is the bandwidth D — itself a UV cutoff, not a physical scale of the IR theory. Once g is generated logarithmically, it has nowhere to flow but to dynamically produce an IR scale. Anderson's poor-man's scaling made this explicit in 1970, and the Schrieffer–Wolff transformation guaranteed that the J\\rho 0 Kondo regime is precisely where this matters — the local-moment limit of the Anderson model . The \\ln(D/k {B}T) is the 0+1-d analogue of QCD's asymptotic freedom: a marginally relevant coupling generates its own IR scale. Parquet, leading logs, and the Abrikosov–Suhl singularity Once the third-order log was identified, the obvious next step was to sum its higher-order siblings. Abrikosov (Physics 2, 5, 1965) classified the leading parquet diagrams — repeated insertions of the same spin-exchange ladder — and summed them by an integral equation whose solution exponentiates the third-order result into with the dynamically generated scale Suhl (Phys. Rev. 138, A515, 1965), using a T-matrix dispersion relation, and Nagaoka (Phys. Rev. 138, A1112, 1965), using a Green's-function decoupling, arrived at the same scaling independently. The resulting \"Abrikosov–Suhl resonance\" — a pole-like feature in the T-matrix pinned to the Fermi level — is what the modern quantum-dot literature still calls the Kondo resonance, even when reading it off an NRG spectral function rather than a parquet diagram. The leading-log resummation is internally consistent above T {K} and fails , in the same way every parquet treatment of a marginally relevant theory fails, at T\\sim T {K}, where the denominator passes through zero and the parquet vertex develops a spurious pole. Suhl and Nagaoka tried, with various decouplings, to push past it; what they could not see — and what Wilson eventually showed and Andrei confirmed exactly — is that nothing pathological happens at T {K} itself. The coupling continues to flow, all the way to a strong-coupling fixed point where the impurity is screened into a many-body singlet . The third-order logarithm of is the first, perturbative whisper of that flow; the parquet sum is the loudest perturbation theory can shout before its voice gives out. From Poor-Man's Scaling to the Strong-Coupling Fixed Point From Poor-Man's Scaling to the Strong-Coupling Fixed Point By 1966 the Kondo problem had three faces and no answer. Kondo's third-order \\ln(D/T) was unambiguous; the Abrikosov–Suhl–Nagaoka parquet resummation pushed it to 1/\\ln^2(T/T K) but obviously failed at T \\lesssim T K, where the leading log itself becomes O(1); and the Yosida singlet ansatz gave a sensible T=0 picture without a controlled way to connect it to the high-temperature perturbative regime. The cascade that finally closed the gap took fourteen years and reorganized the methodology of many-body theory. Schrieffer–Wolff: making Anderson and Kondo siblings The first move was less glamorous than the rest but indispensable. Schrieffer and Wolff performed a canonical transformation on the Anderson Hamiltonian , rotating away the hybridization V {kd} to second order in the local-moment regime \\epsilon d \u003c 0 \u003c \\epsilon d + U, with \\epsilon d , \\epsilon d + U \\gg \\Gamma. The result is a manifestly antiferromagnetic exchange in the projected subspace of singly occupied d. This did three things: (i) it told experimentalists what J\\rho was as a function of the microscopic V, \\epsilon d, U — not a phenomenological parameter; (ii) it explained why dilute 3d impurities almost always give the divergent sign Kondo needed; (iii) it set the boundary the conflation audit polices, since the projection is valid only when charge fluctuations are frozen out. Intermediate-valence Ce/Yb compounds at high T, or quantum dots tuned near a charge-degeneracy point, lie outside the Schrieffer–Wolff window and are Anderson physics, not Kondo physics. Anderson–Yuval–Hamann: poor man's scaling and the Coulomb gas Anderson's 1970 note — three pages of unusually colloquial prose — proposed integrating out conduction states in narrow shells at the band edge \\pm D \\to \\pm D(1-d\\ell) and demanding that the effective H {sd} retain its form with renormalized couplings. To second order in J: For antiferromagnetic J 0 the coupling runs upward; the perturbative regime is the ultraviolet, strong coupling the infrared. Integrating yields the invariant the same essential singularity Abrikosov's parquet sums had hidden inside their denominators, now reinterpreted as a dynamically generated scale of an asymptotically free theory. The analogy with Gell-Mann–Low and (slightly later) QCD asymptotic freedom is exact for the (0+1)-dimensional fermionic theory. The companion paper with Yuval and Hamann made the flow geometrical. Bosonizing the conduction electrons and integrating out everything except the impurity-spin trajectory S^z(\\tau), the partition function becomes a one-dimensional classical Coulomb gas of alternating-sign charges (spin flips) with a logarithmic kernel, on a circle of circumference \\beta. The fugacity is set by the transverse exchange J \\perp, the inverse \"temperature\" by J z; the RG equations are Kosterlitz–Thouless seven years early, with the AF Kondo flow sitting on the strong-coupling separatrix. Two facts perturbation theory had hidden become visible: the line J z = J \\perp is exactly preserved by the flow (rotational invariance is an RG fixed line, not an accident); and the relevant infrared variable is not J but the spin-flip fugacity, which the conduction electrons screen logarithmically. Figure: RG flow in the anisotropic Kondo (J z\\rho, J \\perp \\rho) plane. The isotropic separatrix is preserved by the flow. Antiferromagnetic couplings run to a single strong-coupling fixed point (green); ferromagnetic couplings flow to a line of free-spin fixed points where the impurity decouples (red). Wilson 1975: discretize the logs, diagonalize the chain Wilson's RMP article solved what Anderson had set up. The Kondo problem is sensitive to all energy scales between T and D equally — every logarithmic decade contributes — so a linear discretization of the conduction band wastes resolution at low energy and resolves nothing at high energy. Wilson partitioned the band into intervals [\\Lambda^{-(n+1)},\\Lambda^{-n}] (\\Lambda \\approx 2), kept one orbital per interval, and tridiagonalized the Hamiltonian into a semi-infinite chain with hoppings t n \\sim \\Lambda^{-n/2}. Each successive site addresses an energy scale a factor \\Lambda^{1/2} smaller; truncating to the lowest \\sim 10^3 states at every step and rescaling by \\Lambda^{1/2} produces a transfer-like iteration whose fixed points are directly the RG fixed points of the original problem. What emerged: (i) an even–odd alternating spectrum flowing from the unstable local-moment fixed point at J=0 to a stable strong-coupling fixed point at J=\\infty; (ii) the universal crossover function \\chi {\\rm imp}(T)\\,T K = f(T/T K) collapsing data over six decades in T/T K, with the convention-fixing number T K\\,\\chi {\\rm imp}(0) = 0.1032; (iii) explicit confirmation that the strong-coupling fixed point is what Nozières had argued it must be on symmetry grounds — a free conduction band carrying a \\pi/2 phase shift in the screening channel. Nozières's local Fermi liquid Nozières made the strong-coupling endpoint analytically tractable. The argument is structural: at T \\ll T K the impurity spin is locked into a singlet, and the only low-energy degrees of freedom are conduction electrons phase-shifted by the screening cloud. Residual interactions are quasiparticle–quasiparticle and quasiparticle–impurity scatterings of irrelevant operators; expanding the scattering phase shift around the Fermi level, with \\delta 0 = \\pi/2 fixed by Friedel's sum rule and unitarity, and \\alpha, \\phi tied by SU(2) and particle–hole symmetry to the single scale 1/T K. The result is a one-parameter Fermi liquid with three observable consequences: - Wilson ratio R \\equiv (\\chi {\\rm imp}/\\gamma {\\rm imp})/(\\chi 0/\\gamma 0) = 2, exact; - residual resistivity at the unitary limit, \\rho {\\rm imp}(0) = 2/(\\pi n e^2 v F) per spin channel; - a T^2 coefficient of \\rho(T) and an \\omega^2 coefficient of \\Sigma(\\omega) in fixed universal ratio. This is what the conflation audit means when it demands R \\to 2 before calling a zero-bias anomaly a Kondo resonance: it is the cheapest non-trivial check of strong-coupling Fermi-liquid behaviour and it is parameter-free. Andrei–Wiegmann: the Bethe-ansatz audit Wilson's NRG is non-perturbative but numerical; Nozières's Fermi liquid is analytical but asymptotic. The closing chord came independently in 1980 from Andrei and Wiegmann, who diagonalized the Kondo Hamiltonian exactly using the algebraic Bethe ansatz, reducing the eigenvalue problem to a nested system of algebraic equations on rapidities and showing that the multi-particle S-matrix factorizes into two-body pieces. The thermodynamic Bethe-ansatz equations reproduced Wilson's \\chi(T)/T K curve, the Sommerfeld coefficient, and R=2 to all decimal places NRG had produced — and gave them in closed form. They also fixed the proportionality between Wilson's T K^W and the natural scale T K^{\\rm BA} of the Bethe equations, a convention-dependent factor of order one whose mishandling is responsible for a substantial fraction of inconsistent J\\rho extractions in the literature. The four methods now constituted a cross-checked solution: scaling explained why a non-perturbative scale exists; NRG computed the crossover ; Fermi-liquid theory described the infrared ; Bethe ansatz certified the exact thermodynamics. Together they made the single-impurity Kondo problem the first many-body problem in condensed matter physics solved at the level of, and in the same sense as, the Onsager solution of the 2D Ising model — and converted \"strong coupling\" from a confession of ignorance into a calculable fixed point. Landmark Experiments: From Cu–Fe Wires to Gated Quantum Dots Landmark Experiments: From Cu–Fe Wires to Gated Quantum Dots The experimental literature on the Kondo effect divides cleanly into three eras separated by the instruments that defined them: bulk transport on dilute alloys (1934–1975), thermodynamic and spectroscopic probes once dilution refrigerators became routine (1965–1990), and gate-controlled single-impurity realisations in mesoscopic devices (1988–present). What follows is a triage of which experiments actually verified universal scaling — collapse onto the Wilson–Costi–Hewson–Zlatić curve G(T/T K) or its thermodynamic analogue \\chi {\\rm imp}(T/T K) — and which only displayed a peak or a minimum compatible with Kondo but consistent with much else. Bulk alloys: from anomaly to local moment The 1934 Leiden minimum established the phenomenon but did not identify its mechanism, and for thirty years it competed with explanations ranging from grain-boundary scattering to two-level systems. The decisive bulk experiment is Sarachik, Corenzwit and Longinotti (1964) at Bell Labs, who tuned the host alloy \\mathrm{Mo} {1-x}\\mathrm{Nb} x to switch Fe impurities between magnetic and non-magnetic configurations and showed that the resistance minimum appears if and only if the Fe carries a local moment. This is the empirical anchor that converts Friedel–Anderson local-moment theory and the Zener–Kasuya–Yosida Hamiltonian into a falsifiable scientific programme; Kondo's third-order calculation was published months later in direct response. The 1960s programme of Coles, van den Berg, Daybell, Steyert, Heeger and Hirst then built the systematics: Cu–Fe, Au–Fe, Cu–Cr, Cu–Mn, La–Ce, and the chalcogenide families. By the early 1970s, resistivity, susceptibility and Mössbauer measurements on Cu–Fe, La–Ce and Cu–Cr had produced an approximately universal \\rho(T)/\\rho 0 curve with T K varying by six orders of magnitude across hosts. \"Approximately\" is doing real work in that sentence: bulk alloys at fractions of a percent always carry RKKY-induced impurity–impurity interactions, and only the dilution-refrigerator susceptibility measurements of Triplett and Phillips (1971) on Cu–Fe and the later specific-heat work of Felsch, Winzer and others on La–Ce reached low enough T/T K to test the Nozières–Wilson prediction \\chi {\\rm imp}(0)/(g\\mu B)^2 = 0.103/T K and \\gamma {\\rm imp}\\cdot T K = universal. Those data did show collapse to within \\sim10–20 %, comparable to the residual impurity-interaction corrections — the first quantitative verification of universality. The single bulk experiment that closes the loop with theory is Wilson's 1975 NRG calculation of \\chi {\\rm imp}(T) plotted directly against the Triplett–Phillips Cu–Fe susceptibility: agreement over four decades in T/T K with no adjustable parameter once T K is fixed. That is what \"verified universal scaling\" means in the bulk era. Why the bulk era was inevitably limited A dilute Cu–Fe wire contains \\sim 10^{18} impurities and a distribution of local environments. Even at the cleanest concentrations the inter-impurity distance is comparable to the screening length \\xi K \\sim v F/T K, so what one measures is ensemble-averaged single-impurity behaviour with RKKY corrections . Magnetic field splits the impurity ground state, but the field scale g\\mu B B \\sim k B T K requires impractical fields for high-T K alloys and irrelevantly small fields for low-T K ones. There was no way to count impurities, no way to tune J\\rho in situ, and no way to access the Kondo resonance spectroscopically — the local density of states is what the Kondo singlet rearranges, and bulk transport averages over it. The mesoscopic revival: predictions before the experiment The conceptual move that made gate-tunable Kondo possible is the recognition, by Glazman and Raikh (1988) and independently Ng and Lee (1988) , that a Coulomb-blockaded quantum dot with an odd number of electrons is a single-impurity Anderson model with externally tunable parameters: \\varepsilon d set by the gate, U by the charging energy, \\Gamma by the tunnel barriers. Their prediction was specific and quantitative: in the local-moment valley the linear conductance should increase on cooling, saturating at the unitary limit G 0 = 2e^2/h per spin channel, with universal G(T/T K) following the Costi–Hewson–Zlatić scaling function. This is the prediction that the abuse-alert in §6 will police; it is also why the 1998 papers were experiments seeking a known target, not discoveries of a new effect. The experiments arrived a decade later because the necessary fabrication — sub-100 nm GaAs/AlGaAs lateral dots with electron temperature below the few-100 mK T K achievable in tunable structures — only became routine in the mid-1990s. Goldhaber-Gordon et al. (1998) reported gate-controlled odd/even alternation of a zero-bias conductance peak in a small lateral dot, Zeeman splitting of the peak with the expected g-factor, and a logarithmic G(T) in the high-T tail. The simultaneous Cronenwett, Oosterkamp and Kouwenhoven (1998) Science paper showed the same phenomenology in a different device geometry and is routinely under-credited . Neither 1998 paper, taken alone, demonstrated unitary-limit conductance or full universal-curve collapse: the dots were too asymmetric and T/T K never small enough. The verification of universality came two years later. van der Wiel et al. (Science 289, 2105, 2000) in the Delft group reached G \\to 2e^2/h in a symmetrically coupled dot and collapsed G(T)/G 0 for several gate voltages onto a single G(T/T K) curve indistinguishable from the Costi–Hewson–Zlatić NRG result. Grobis, Rau, Potok and Goldhaber-Gordon (reviewed in ) added the Fermi-liquid coefficient: the T^2 correction G(T) = G 0[1 - c T (T/T K)^2] with c T matching the Nozières fixed-point value to within 10 %. That triad — unitary limit, universal G(T/T K), Fermi-liquid T^2 — is the minimum evidence required to claim a genuine spin-\\tfrac12 single-channel Kondo state in a device. Two-channel Kondo: the harder experiment A peak at zero bias is easy; a non-Fermi-liquid fixed point is not. Potok, Rau, Shtrikman, Oreg and Goldhaber-Gordon (Nature 446, 167, 2007) engineered a small dot coupled to a small lead and a large \"reservoir\" dot, fine-tuning the channel symmetry \\delta until \\delta \\ll T K^{2\\mathrm{CK}}, and observed the predicted \\sqrt{T} and \\sqrt{V} scaling of conductance toward the overscreened fixed point. This remains essentially the only experiment that has demonstrated the Nozières–Blandin two-channel fixed point with the universal scaling form; everything earlier — Ralph–Buhrman point contacts, Cichorek glassy systems — showed consistent non-Fermi-liquid signatures without the symmetry-tuned demonstration. The Pustilnik review catalogues the relevant nanostructure variants. STM: imaging the resonance, not the cloud Madhavan, Chen, Jamneala, Crommie and Wingreen (Science 280, 567, 1998) and the simultaneous Li, Schneider, Berndt, Delley work on Co on Au(111) and Ce on Ag(111) used scanning tunnelling spectroscopy to image a Fano lineshape at the Fermi level over single magnetic adatoms — the local-density-of-states signature of the Abrikosov–Suhl resonance. The Fano q parameter encodes the ratio of tunnelling into the resonance versus the conduction band; the width gives T K to within a convention-dependent factor of order unity. These experiments did verify the existence of a many-body resonance at E F with the expected temperature evolution, but they did not verify universal G(T/T K) scaling — the STM observable is local DOS, not linear conductance through a Kondo channel, and the T K extracted from the Fano width is not the same T K that appears in Wilson's susceptibility convention. The micrometre-scale Kondo screening cloud \\xi K = \\hbar v F/k B T K has been probed circumstantially via finite-size level statistics in box geometries and quantum-mirage interference (Manoharan, Lutz, Eigler 2000), but no experiment to date has directly imaged the spatial extent of the cloud — a gap the dossier will return to in §8. A triage table Experiment Year Shows a feature Verifies universal G(T/T K) or \\chi(T/T K) --- --- --- --- de Haas–de Boer–van den Berg, Au/Cu/Ag wires 1934 minimum no Sarachik–Corenzwit–Longinotti, Mo {1-x}Nb x:Fe 1964 minimum tied to local moment no Triplett–Phillips, Cu–Fe susceptibility 1971 \\chi {\\rm imp}(T) yes (vs Wilson NRG) Goldhaber-Gordon et al. dot 1998 ZBP, Zeeman, log tail partial Cronenwett–Oosterkamp–Kouwenhoven 1998 ZBP, gate alternation partial van der Wiel et al., symmetric dot 2000 unitary 2e^2/h yes Grobis et al., Fermi-liquid T^2 2008 c T matches Nozières yes Madhavan / Li STM Fano on Co, Ce adatoms 1998 Abrikosov–Suhl resonance in LDOS spectroscopic only Potok et al. two-channel dot 2007 \\sqrt{T}, \\sqrt{V} yes (2CK fixed point) The pattern is plain: the anomaly was empirically secure by 1936, the mechanism by 1971, the fixed point by 2000, and the non-Fermi-liquid extension by 2007. Every other \"Kondo\" experiment that does not appear in the right column of the table above is, at best, evidence of a zero-bias feature compatible with Kondo — which §6 will argue is a much weaker claim than the literature usually admits. What People Call 'Kondo' That Isn't: A Conflation Audit What People Call 'Kondo' That Isn't: A Conflation Audit The price of a phenomenon named after a single 1964 calculation is that everything resembling it ends up tagged with the same word. Six confusions recur often enough in the literature — and in referee reports — to deserve naming explicitly. None is a matter of taste; each has a sharp operational test. 1. Anderson model ≠ Kondo model The Anderson Hamiltonian keeps charge fluctuations on the impurity orbital. The Kondo (s-d) Hamiltonian lives in the projected n d=1 subspace where charge is frozen. The Schrieffer–Wolff transformation is the bridge, valid only when -\\varepsilon d,\\;\\varepsilon d+U \\gg \\pi\\Gamma with \\Gamma=\\pi\\rho V ^2, giving Outside that window — intermediate valence in α-Ce, mixed-valent Yb compounds, gate-detuned dots at the edge of a Coulomb diamond — the physics is Anderson, not Kondo: the local moment is not well-formed, \\langle n d\\rangle is not pinned at one, and the susceptibility is no longer Curie-like above any sensible T K. Calling such regimes \"Kondo\" because they show a Friedel–Abrikosov–Suhl resonance near \\varepsilon F confuses the resonance with the screening mechanism that, in this regime, isn't operating. 2. One impurity ≠ a lattice of them The single-impurity model has one scale T K, a Fermi-liquid fixed point, and Wilson ratio R=2 [8, 11]. A Kondo lattice has two: T K\\sim D\\exp(-1/2J\\rho) and the RKKY scale T {\\rm RKKY}\\sim J^2\\rho. Doniach's argument fixes the competition: T K wins exponentially at large J\\rho, T {\\rm RKKY} wins as a power at small J\\rho, and the crossover hides a quantum critical point — Kondo breakdown — that the impurity problem cannot see. The universal G(T/T K) collapse of the dot literature [14, 13, 12] does not survive lattice coherence: below the coherence temperature T^ the resistivity drops rather than saturating, because Bloch's theorem reasserts itself once the f-electrons hybridize coherently. Citing single-impurity scaling formulas for heavy-fermion compounds at T\u003cT^ — common in early CeAl 3 and CeCu 6 fits — overstates the calculation's reach. 3. Zero-bias peak ≠ Kondo resonance This is the noisiest confusion in nanostructure work. Any narrow zero-bias anomaly in dI/dV — from dynamical Coulomb blockade, two-level systems [16, 17], soft co-tunnelling, Andreev bound states near a superconductor, disorder-induced level repulsion, magnetic-field-tuned Majorana modes, or simple weak-localization — will be reported as Kondo somewhere in the literature. The operational checklist that distinguishes genuine Kondo screening: Test Genuine Kondo (S=1/2, 1-channel) Diagnostic value --- --- --- Ground-state occupation Odd N in the dot; CB-diamond bias-floor anomaly only in odd valleys Eliminates Andreev, even-N co-tunnelling Temperature scaling G(T)/G 0 = \\big[1+(2^{1/s}-1)(T/T K)^2\\big]^{-s}, s\\simeq0.22 (Costi–Hewson–Zlatić) collapsing to G 0=2e^2/h per channel Eliminates TLS, disorder ZBA, dyn. Coulomb blockade Magnetic field Peak splits at g\\mu B B \\gtrsim k B T K with \\Delta(B)\\simeq 2g\\mu B B at large field, predicted curvature near g\\mu B B\\sim k B T K Eliminates Majorana ZBP (no splitting), Andreev (different g {\\rm eff}) Voltage scaling dI/dV width \\sim\\max(T,V,B)/T K, Fermi-liquid T^2 and V^2 coefficients with Nozières ratio \\alpha V/\\alpha T = 3/(2\\pi^2)\\cdot c fixed [18, 11] Eliminates phonon side-bands, inelastic co-tunnelling Gate dependence T K(\\varepsilon d) minimum at mid-valley, exponential rise toward CB peaks per Haldane formula Eliminates accidental resonances A single bullet item is not a demonstration; the Goldhaber-Gordon and Cronenwett experiments became canonical because they passed nearly all of these together. The Grobis–Rau–Potok–Goldhaber-Gordon review is the modern reference for the full battery, and Pustilnik gives the cleanest theoretical statement. 4. \"T K\" is convention-dependent A persistent error is to import T K extracted under one convention into a formula derived for another. The common definitions disagree by O(1) factors: - Wilson's susceptibility definition: T K^W \\equiv 0.103/\\chi {\\rm imp}(0) (with g\\mu B=1) . - Nagaoka/poor-man's perturbative cutoff: T K^N = D\\sqrt{J\\rho}\\,e^{-1/2J\\rho} . - Bethe-ansatz natural scale: T K^{BA} from the Wiegmann–Tsvelick free energy . - Half-width of the spectral resonance at \\omega=0: T K^{\\rm spec}\\approx 0.5\\,T K^W. - Half-width-at-half-max of G(T) from the empirical NRG fit (Goldhaber-Gordon): T K^G, with G(T K^G)=G 0/2 — about a factor 0.6–0.7 of T K^W. Quoting an experimental T K in kelvin without naming the convention, then plugging it into Nozières's \\chi/\\gamma=2 or into Costi's universal curve, can shift the inferred J\\rho by 20% and inflate or deflate claimed Wilson ratios. Hewson's monograph and Kontani–Yamada tabulate the conversions; nearly every \"anomalous Wilson ratio\" paper turns out, on inspection, to have a convention mismatch. 5. Two-channel ≠ ordinary Kondo Nozières–Blandin overscreening flows to a non-Fermi-liquid fixed point: \\rho(T)-\\rho(0)\\propto\\sqrt{T}, residual entropy \\tfrac{1}{2}\\ln 2, T=0 single-particle S-matrix of modulus \\tfrac{1}{2}, and a logarithmic susceptibility. None of this is perturbatively connected to the single-channel fixed point, and the 2CK point is unstable to channel asymmetry \\delta: below T^ \\sim\\delta^2/T K^{2CK} the system crosses over to ordinary Kondo in the stronger channel. A 2CK claim therefore requires not just NFL exponents but a demonstration that \\delta\\ll T K^{2CK} (Potok–Rau–Shtrikman–Goldhaber-Gordon set the modern bar). The frequent slippage — \"we see a sub-linear V-dependence, hence 2CK\" — is the same category error as calling any ZBA Kondo. 6. The \"Kondo singlet\" is not a bound state at -T K Despite the language of compensation clouds and singlet \"binding energy\" \\sim k B T K, there is no spatially localized bound state at energy -T K below the Fermi sea. The screened state is a many-body resonance pinned to \\varepsilon F — the Abrikosov–Suhl / Kondo resonance in the impurity spectral function — whose spatial structure is the Kondo screening cloud For T K\\sim 1 K in a metal with v F\\sim 10^6 m/s this is micrometres, not ångströms; for a quantum dot with T K\\sim 1 K and lead v F, comparably large. Yosida's 1966 variational singlet correctly captures the spin structure but not the spatial extent; Affleck–Simon and Borda's NRG calculations identify \\xi K as the length on which spin-spin correlations \\langle\\mathbf{S}\\cdot\\mathbf{s}(r)\\rangle change sign. The cloud has been observed only circumstantially — finite-size oscillations in box-geometry simulations, the recent persistent-current and STM-ring claims — and remains the most under-tested prediction of the theory (see §8). Writers who speak of \"breaking the Kondo singlet\" with a field B such that g\\mu B B\\sim k B T K are correct in energy; those who picture the breaking as the dissociation of a tightly bound dimer are wrong in space. The unifying lesson of these six confusions is the same: \"Kondo\" names a specific renormalization-group flow with a specific fixed point and specific universal ratios. Anything labelled Kondo that cannot, in principle, be checked against R=2, \\chi {\\rm imp}T K=0.103, G 0=2e^2/h per channel, and the Costi–Hewson–Zlatić collapse is using the word as decoration, not as a claim. From One Impurity to a Lattice: Doniach, RKKY, and Kondo Breakdown From One Impurity to a Lattice: Doniach, RKKY, and Kondo Breakdown Put one localized spin in a Fermi sea and the strong-coupling fixed point is a singlet with a finite screening scale T K and a textbook Fermi-liquid description [8, 11]. Replace the dilute impurity with a periodic array of moments — a Kondo lattice — and almost every quantitative statement made above must be re-examined. The reason is structural rather than technical: the second moment in the bath is itself dressed by the conduction electrons that were supposed to screen the first, and the indirect exchange between them competes with the Kondo singlet formation that each would prefer on its own. The competing interaction is RKKY, fixed by a single second-order calculation: integrating out the conduction electrons at energy \\sim D generates oscillating in sign and decaying as r^{-3} in 3D. Its overall scale is T {\\text{RKKY}}\\sim J^2\\rho, set by the same exchange that drives the Kondo logarithm but appearing at one lower order in J\\rho. This makes the comparison sharp: at small J\\rho the RKKY scale dominates because J^2\\rho\\gg D\\exp(-1/J\\rho); at large J\\rho the Kondo scale wins because the exponential overtakes the power law. Doniach's 1977 sketch (Doniach, Physica B 91, 231, 1977 — verify) drew this crossing as a phase diagram in J\\rho, with an antiferromagnetic phase at small coupling, a heavy paramagnet at large coupling, and a quantum critical point separating them. Forty-five years of heavy-fermion phenomenology have refined every line on that diagram, but the skeleton has survived. Heavy Fermi liquid as a lattice fixed point In the strong-coupling phase the lattice version of the singlet ground state is a Bloch-coherent state of Kondo resonances. Below a coherence temperature T^ — not the same as the single-ion T K — impurity-like incoherent scattering crosses over into a Fermi liquid in which the f-moments enter the Luttinger count. The result is a renormalized band structure with quasiparticle mass realized canonically in CeAl 3 (Andres–Graebner–Ott, Phys. Rev. Lett. 35, 1779, 1975 — verify) and CeCu 2Si 2 (Steglich et al., Phys. Rev. Lett. 43, 1892, 1979 — verify), with linear specific-heat coefficients \\gamma\\sim 1\\text{ J}/\\text{mol K}^2. The Sommerfeld–Wilson ratio remains close to 2 — Nozières's single-impurity prediction — which is why heavy-fermion compounds were originally classed as \"Kondo lattices that just got renormalized.\" The deceptive part of this success is that the temperature dependence of transport, susceptibility and thermopower above T^ looks single-ion-like, while below T^ it does not: the resistivity changes from an impurity-like -\\ln T rise to a coherence-driven T^2 drop, and the universal G(T/T K) collapse that quantum-dot experiments live by simply ceases to apply. Lattice coherence is a different fixed point. What survives, what does not The pieces of single-impurity intuition that transfer to the heavy Fermi liquid are: (i) a low scale generated non-perturbatively from J\\rho; (ii) phase-shifted Fermi-liquid quasiparticles obeying the Luttinger sum rule with the f-electrons included ; (iii) a Sommerfeld–Wilson ratio of order 2; and (iv) the Nozières T^2 coefficient relations between A, \\gamma, and \\chi, which Kadowaki and Woods catalogued empirically as A/\\gamma^2\\approx 1.0\\times 10^{-5}\\,\\mu\\Omega\\,\\text{cm}\\,(\\text{mol K}/\\text{mJ})^2 across a remarkable range of materials (Kadowaki–Woods, Solid State Commun. 58, 507, 1986 — verify). What does not survive is universal G(T/T K), the unitary-limit per-channel conductance, the single screening scale, and — most damagingly — the assumption that the impurity spin and the conduction electrons share a single ground-state manifold. In a lattice the moments can drop out of the heavy quasiparticle altogether without forming long-range order. Kondo breakdown The modern controversy is what happens at the Doniach crossing when pressure, chemical doping or magnetic field is tuned through a QCP. The conventional Hertz–Millis–Moriya picture (Hertz 1976; Millis 1993; Moriya 1985 — verify) treats it as a spin-density-wave transition of the heavy Fermi liquid: the f-electrons remain part of the Luttinger volume on both sides, and only the magnetic order parameter is critical. The competing Kondo-breakdown picture, articulated by Coleman, Pépin, Si and Ramazashvili ( J. Phys. Condens. Matter 13, R723, 2001 — verify) and by Senthil, Vojta and Sachdev ( Phys. Rev. B 69, 035111, 2004 — verify), proposes that at the QCP the Kondo screening itself collapses: the f-electrons are expelled from the Fermi volume, the Hall coefficient jumps discontinuously, and quasiparticle weight Z vanishes on the entire Fermi surface — a \"selective Mott\" transition in which only the f-orbital localizes. The cleanest experimental signatures are the abrupt Hall-coefficient jump in YbRh 2Si 2 (Paschen et al., Nature 432, 881, 2004 — verify) and the E/T scaling of magnetic fluctuations in CeCu {6-x}Au x (Schröder et al., Nature 407, 351, 2000 — verify) with anomalous exponent \\alpha\\approx 0.75 — far from the Hertz–Millis \\alpha=1. Out of this controversy emerged the fractionalized Fermi liquid (FL^ ), a candidate ground state in which the f-moments form a spin liquid with neutral spinon excitations while the conduction electrons retain a small, non-Luttinger Fermi surface. FL^ violates the Oshikawa form of the Luttinger theorem only at the price of an emergent gauge structure, and its experimental signatures — a small Fermi surface coexisting with gapless spin excitations and no broken symmetry — remain contested in YbRh 2Si 2 and CeRhIn 5. From the single-impurity perspective this is the most radical departure: a \"Kondo\" coupling that screens nothing because the would-be screening cloud has been Anderson-localized into a spin liquid before it could form. Reading the abuse-alert in the lattice context The conflation table in §6 forbids transplanting impurity diagnostics onto lattice systems, but the corollary is constructive. Universal G(T/T K) collapse, Costi–Hewson–Zlatić scaling and the unitary-limit conductance are intentional impurity diagnostics: they work in dilute alloys and quantum dots because each Kondo singlet is independent. In a lattice the corresponding diagnostics are the Kadowaki–Woods ratio, the Luttinger count including or excluding the f-electrons, the Hall-jump magnitude at the QCP, and — increasingly — the dynamical scaling exponent of the local susceptibility. These are not single-impurity quantities pushed into the lattice; they are different observables for a genuinely different fixed-point structure that happens to inherit its low-energy scale from the same exchange J that Kondo expanded to third order in 1964 . Open Problems: Screening Clouds, Non-Fermi Liquids, and Topological Kondo Open Problems: Screening Clouds, Non-Fermi Liquids, and Topological Kondo The Kondo problem is \"solved\" in the sense that the single-impurity Hamiltonian has a fixed-point spectrum , an exact thermodynamic solution , and a Fermi-liquid description below T K . Every live question is about something the textbook fixed point fails to address: where the screening cloud sits in real space, what happens when the bath has the wrong density of states, what happens when more than one channel competes, what happens when a lattice of moments fights itself, and what happens when the impurity Hilbert space is intrinsically nonlocal. The screening cloud as an object Yosida's 1966 variational singlet predicted a coherent spin-singlet wavefunction extending over \\xi K \\sim \\hbar v F / k B T K, which for T K \\sim 1 K and v F \\sim 10^6 m/s is a micrometre — astonishingly large for a \"screening\" length. Almost every signature that would distinguish a real cloud from a renormalized point-impurity (NMR Knight shifts, RKKY oscillations around the impurity, transport through a ring threading the cloud) integrates out to nearly the same answer the local Fermi-liquid theory gives, which is why Affleck and Simon's 2001 proposal to use a finite-size mesoscopic ring as a \"ruler\" for \\xi K took two decades to realise. Borzenets et al. (Nature 579 , 210, 2020) finally extracted the cloud profile in a gated GaAs quantum dot embedded in a long lead, finding \\xi K scaling as 1/T K over a decade and a shape consistent with the universal NRG prediction (sciencedaily, Nature). What is still missing is a direct real-space image. STM Fano line-shape mapping around a Co adatom resolves spatial decoration on the lattice scale , not the \\mum envelope; a real-space mapping of \\xi K would require interferometry against a second screened impurity, or a scanning-NV probe of the spin-correlation envelope. Neither has been done. Overscreening and non-Fermi-liquid fixed points The Nozières–Blandin multichannel model with k 2S flows to an intermediate-coupling fixed point at which the impurity is overscreened: the residual entropy is S {\\rm imp}(0) = \\tfrac{1}{2}\\ln 2 for the two-channel case, the resistivity has a \\sqrt{T} rather than T^2 low-temperature correction, and the conduction-electron S-matrix has magnitude \u003c1 — the signature of inelasticity from a genuinely many-body resonance. The decisive realisations are not magnetic impurity dilution but mesoscopic engineering: Iftikhar et al. used the charge degree of freedom of a metallic island coupled to two and three ballistic quantum-point-contact channels to enforce the channel symmetry by construction (Science 360 , 1315, 2018) — the symmetry \\delta = 0 is geometric, not fine-tuned. Subsequent extensions probed the Seebeck coefficient (PRL 125 , 026801) and single-electron scattering through the NFL fixed point. The most recent thermodynamic test — Pouse et al. 's direct measurement of the \\tfrac{1}{2}\\ln 2 fractional entropy via Maxwell-relation charge sensing in a charge-Kondo island (arXiv:2605.00669) — is the cleanest existing answer to the abuse-alert in §6: a \\sqrt{T} resistance alone is not enough, the residual entropy is what the multichannel fixed point uniquely fixes. The symplectic and SU(N) generalisations [20, 21] supply a richer zoo of NFL fixed points whose residual entropies are calculable from Affleck–Ludwig boundary CFT but mostly unexplored experimentally. Pseudogap and Dirac baths When the bath density of states vanishes as \\rho(\\varepsilon) \\sim \\varepsilon ^r — graphene at the Dirac point (r=1), d-wave superconductors (r=1), surfaces of Weyl semimetals — the Anderson–Kondo problem of Withoff and Fradkin (PRL 64 , 1835, 1990) hosts a quantum phase transition at finite coupling: below a critical J c(r) the impurity is unscreened down to T=0 . The Vojta–Fritz NRG analysis (PRB 70 , 094502) maps out the symmetric- and asymmetric-pseudogap fixed points and predicts non-Fermi-liquid impurity thermodynamics at the critical coupling. The experimental status is awkward: gated graphene with vacancy moments (Mao et al. , Nat. Commun. 9 , 2073) shows Kondo signatures whose chemical-potential dependence is roughly consistent with the pseudogap phase boundary, but the disorder-broadened bath obs itical phenomena, but his 1975 RMP solution of the Kondo problem is the more decisive technical achievement and is what convinced the community that strong-coupling fixed points were real and computable. In the parquet-era Soviet literature the dominant credit is Abrikosov's, with Suhl and Nagaoka almost interchangeable; Western textbooks fold Nagaoka into 'Suhl–Nagaoka', understating his independent contribution. Nozières's Fermi-liquid description, written up only as a 1974 conference talk and a J. Low Temp. Phys. paper, is the single most cited result of the entire Kondo program in modern quantum-dot work yet is often paraphrased without citation. Goldhaber-Gordon's 1998 quantum-dot Kondo paper is routinely cited as 'the' Kondo dot paper, eclipsing the simultaneous Cronenwett–Oosterkamp–Kouwenhoven Science paper and the earlier 1988 theoretical predictions by Glazman–Raikh and Ng–Lee that made the experiment thinkable.", "timeline": [{"year": 1934, "event": "Resistance minimum near 4 K observed in Au, Cu, Ag wires — the empirical anomaly that defines the problem", "who": "W.J. de Haas, J. de Boer, G.J. van den Berg", "work": "Physica 1, 1115 (Leiden)", "kind": "observation", "ref": null}, {"year": 1936, "event": "Independent confirmation in Au, attributing the rise to dissolved impurities", "who": "W. Meissner, B. Voigt", "work": "Annalen der Physik 24, 761", "kind": "observation", "ref": null}, {"year": 1951, "event": "s-d exchange Hamiltonian H = −J s·S introduced for transition-metal ferromagnetism", "who": "C. Zener", "work": "Physical Review 81, 440 / 83, 299", "kind": "formalization", "ref": null}, {"year": 1956, "event": "Friedel's virtual bound state: localized d-level broadened by hybridization with conduction band — the conceptual seed of the local moment", "who": "J. Friedel", "work": "Canadian Journal of Physics 34, 1190 (Nuovo Cimento Suppl. 7, 287)", "kind": "theory", "ref": null}, {"year": 1956, "event": "Kasuya works out conduction-electron scattering and indirect exchange from Zener's s-d Hamiltonian — fixes the J·s·S form Kondo will later expand in", "who": "T. Kasuya", "work": "Progress of Theoretical Physics 16, 45", "kind": "formalization", "ref": null}, {"year": 1961, "event": "Anderson impurity model H_U + V_kd: charge-fluctuation parent of the Kondo Hamiltonian — distinguishes when a local moment forms at all", "who": "P.W. Anderson", "work": "Physical Review 124, 41", "kind": "theory", "ref": null}, {"year": 1964, "event": "Sarachik, Corenzwit, Longinotti show experimentally that the resistance minimum tracks Fe local-moment formation in Mo–Nb host — sets the empirical target Kondo answers months later", "who": "M.P. Sarachik, E. Corenzwit, L.D. Longinotti", "work": "Physical Review 135, A1041", "kind": "observation", "ref": null}, {"year": 1964, "event": "Third-order Born calculation yields ρ_imp = c[a − b·Jρ ln(k_B T/D)]; logarithmic divergence for antiferromagnetic J explains the minimum", "who": "J. Kondo", "work": "Progress of Theoretical Physics 32, 37", "kind": "theory", "ref": null}, {"year": 1965, "event": "Parquet/leading-log resummation gives ρ ∝ 1/ln²(T/T_K) and identifies T_K as a dynamically generated scale, but fails below T_K", "who": "A.A. Abrikosov; H. Suhl; Y. Nagaoka", "work": "Physics 2, 5 (1965); Phys. Rev. 138, A515; Phys. Rev. 138, A1112", "kind": "theory", "ref": null}, {"year": 1966, "event": "Schrieffer–Wolff canonical transformation derives the Kondo (s-d) Hamiltonian from the Anderson model in the local-moment regime — making the two models siblings, not synonyms", "who": "J.R. Schrieffer, P.A. Wolff", "work": "Physical Review 149, 491", "kind": "formalization", "ref": null}, {"year": 1966, "event": "Yosida's variational ground-state ansatz: a singlet bound state between the impurity spin and a conduction-electron cloud — earliest correct picture of the screened state", "who": "K. Yosida", "work": "Physical Review 147, 223", "kind": "theory", "ref": null}, {"year": 1970, "event": "'Poor-man's scaling': successive elimination of band-edge states renormalizes J and flows it to strong coupling, identifying the Kondo problem with asymptotic freedom in a 0+1-d fermionic theory; mapping to Coulomb-gas (Anderson–Yuval–Hamann)", "who": "P.W. Anderson; G. Yuval; D.R. Hamann", "work": "J. Phys. C 3, 2436 / Phys. Rev. B 1, 4464", "kind": "theory", "ref": null}, {"year": 1974, "event": "Fermi-liquid description of the T≪T_K regime: phase shifts, Wilson ratio R=2, universal coefficients linking χ, γ, T₁⁻¹ — sets the abuse-alert benchmark for whether a putative 'Kondo' system is actually screened", "who": "P. Nozières", "work": "J. Low Temp. Phys. 17, 31 (Proc. LT13)", "kind": "theory", "ref": null}, {"year": 1975, "event": "Numerical renormalization group: logarithmic discretization + iterative diagonalization yields full crossover, fixed-point spectrum, χ(T)/T_K universal curve — first non-perturbative strong-coupling fixed point in many-body physics", "who": "K.G. Wilson", "work": "Reviews of Modern Physics 47, 773 (lectures 1974)", "kind": "theory", "ref": null}, {"year": 1980, "event": "Exact Bethe-ansatz diagonalization of the Kondo Hamiltonian gives thermodynamics for all T — confirming Wilson's NRG and Nozières's fixed point to high precision", "who": "N. Andrei; P.B. Wiegmann", "work": "Phys. Rev. Lett. 45, 379 / JETP Lett. 31, 392", "kind": "theory", "ref": null}, {"year": 1998, "event": "Tunable Kondo screening in a single-electron transistor: gate-controlled S=1/2 quantum dot exhibits universal G(T/T_K), unitary-limit conductance and Fermi-liquid coefficients — the revival the abuse-alert is policing", "who": "D. Goldhaber-Gordon et al.; S.M. Cronenwett, T.H. Oosterkamp, L.P. Kouwenhoven", "work": "Nature 391, 156 / Science 281, 540", "kind": "revival", "ref": 13}], "neglected": [{"name": "W.J. de Haas, J. de Boer, G.J. van den Berg", "role": "Made the 1934 Leiden observation; routinely cited as 'de Haas et al.' without naming de Boer or van den Berg, despite van den Berg's subsequent decades of careful systematics on the minimum in many host metals (Brill–van den Berg, Croft–van den Berg…)", "evidence": "Physica 1, 1115 (1934); van den Berg's 1964 Prog. Low Temp. Phys. IV review compiled the pre-Kondo experimental landscape", "ref": null}, {"name": "Morrel H. Cohen and collaborators / B.R. Coles", "role": "1950s–60s systematic experimental program (Cu–Fe, Au–Fe, Cu–Mn) tying the minimum to magnetic moments before Sarachik–Matthias; usually skipped over in textbooks that jump straight from 1934 to 1964", "evidence": "Coles, Phil. Mag. 8, 335 (1963); reviewed in van den Berg (1964) and Heeger, Solid State Phys. 23, 283 (1969)", "ref": null}, {"name": "Tadao Kasuya, Kei Yosida", "role": "Wrote down the s-d exchange Hamiltonian Kondo expanded in, three to eight years before Kondo's paper; in the Western literature 'the Kondo Hamiltonian' is essentially the Kasuya–Yosida Hamiltonian", "evidence": "Kasuya, Prog. Theor. Phys. 16, 45 (1956); Yosida, Phys. Rev. 106, 893 (1957)", "ref": null}, {"name": "Yosuke Nagaoka", "role": "Independent 1965 theory of the resistance minimum producing the leading-log resummation 'Suhl–Nagaoka' decoupling; remembered mainly via Nagaoka ferromagnetism, his Kondo contribution mostly absorbed into 'Abrikosov-Suhl'", "evidence": "Phys. Rev. 138, A1112 (1965); discussed in Kondo's own Solid State Phys. 23, 183 (1969) review", "ref": null}, {"name": "Gideon Yuval, Donald R. Hamann", "role": "Co-authors with Anderson on the 1969–70 scaling/Coulomb-gas mapping that opened the road to Wilson; 'Anderson scaling' is shorthand for Anderson–Yuval–Hamann", "evidence": "Phys. Rev. B 1, 1522 and 4464 (1970); acknowledged in Wilson Rev. Mod. Phys. 47, 773 (1975)", "ref": null}, {"name": "S.V. Vonsovsky, Yu.A. Izyumov, E.Z. Kurmaev (Sverdlovsk school)", "role": "Soviet s-d-model program parallel to Kasuya–Yosida and partially predating it in Russian-language journals; absent from most Anglophone reviews", "evidence": "Vonsovsky, ZhETF 16, 981 (1946); Vonsovsky–Turov, ZhETF 24, 419 (1953); summarized in Vonsovsky, *Magnetism* (Wiley 1974)", "ref": null}], "conflations": [{"claim": "'Anderson model' and 'Kondo model' used interchangeably", "clarification": "The Anderson model has charge fluctuations and a finite U; the Kondo (s-d) model lives in the projected local-moment subspace where charge is frozen. Schrieffer–Wolff connects them only in the limit ε_d, ε_d+U far from the Fermi level. Off-resonance valence-fluctuation regimes (intermediate valence, Ce/Yb compounds at high T) are Anderson physics, not Kondo physics."}, {"claim": "'Single-impurity Kondo effect' and 'Kondo lattice / heavy fermion' presented as the same problem", "clarification": "The single-impurity model has one screening scale T_K and a Fermi-liquid fixed point with universal Wilson ratio 2. A Kondo lattice has two competing scales (T_K vs RKKY ~J²ρ) — Doniach diagram — and can magnetically order, undergo a Kondo-breakdown QCP, or form a heavy Fermi liquid with strongly renormalized but lattice-coherent quasiparticles. Universal G(T/T_K) does not survive lattice coherence."}, {"claim": "Zero-bias conductance peak in a quantum dot or molecule = Kondo resonance", "clarification": "Genuine Kondo requires (i) an odd-occupation, unpaired-spin ground state; (ii) universal G(T/T_K) collapse with the known Costi–Hewson–Zlatić curve to unitary limit 2e²/h per channel; (iii) Zeeman splitting of the peak with the predicted g_eff; (iv) where measurable, a Fermi-liquid T² coefficient with the Nozières-fixed-point ratio. ZBA from disorder, two-level systems, dynamical Coulomb blockade, Andreev levels, or simple co-tunnelling reproduces a peak but fails these tests."}, {"claim": "'Kondo temperature' as a single well-defined number", "clarification": "T_K differs by O(1) factors depending on definition: Wilson's susceptibility convention χ_imp(0) = 0.103/T_K, Nagaoka's perturbative cutoff D·exp(−1/2Jρ), the half-width of the spectral peak, or the inflection of G(T). Quoting an experimental T_K without the convention is meaningless; quoting Jρ extracted from one convention into a formula written for another is a common error."}, {"claim": "Two-channel Kondo and ordinary Kondo lumped together as 'Kondo'", "clarification": "The Nozières–Blandin overscreened multichannel models flow to non-Fermi-liquid fixed points with √T resistivity, fractional residual entropy ½ln 2, and non-unitary T=0 scattering. They are not perturbatively connected to the single-channel Fermi-liquid fixed point and require fine-tuned channel symmetry. Claims of '2CK' in quantum dots demand a demonstration that the channel asymmetry δ satisfies δ ≪ T_K^{2CK}."}, {"claim": "Kondo singlet 'compensating' the impurity = a real bound state at finite energy", "clarification": "There is no spatially localized bound state at energy −T_K. The Kondo singlet is a many-body resonance pinned to the Fermi level (Abrikosov–Suhl / Kondo resonance) whose spatial extent is the Kondo screening cloud ξ_K ∼ v_F/T_K — micrometres at typical T_K — not a sharp atomic-scale orbital. Yosida's variational state captures the spin structure but the cloud has only been observed circumstantially."}], "sections": [{"id": "leiden-anomaly-and-forgotten-pioneers", "title": "Leiden 1934: The Anomaly and Its Forgotten Custodians", "markdown": "## Leiden 1934: The Anomaly and Its Forgotten Custodians\n\nIn *Physica* volume 1, a paper signed by Wander Johannes de Haas, Jan Hendrik de Boer, and Gerrit Jan van den Berg — three colleagues at the Kamerlingh Onnes Laboratorium — reported the electrical resistance of gold, copper, and lead measured deep into the liquid-helium range [1]. The data did not behave. For lead the resistivity dropped monotonically to a small residual, exactly as Bloch–Grüneisen prescribed and Matthiessen's rule expected. The \"pure\" gold did something else: below roughly 10 K, $\\rho(T)$ stopped decreasing, passed through a shallow minimum, and began to climb as the temperature was lowered further. The copper showed the same shape with smaller amplitude. The Leiden authors described the curves without naming a mechanism. They had no entitlement to one — the anomaly violated the additive Matthiessen decomposition that had governed metallic conduction for sixty years, and there was no candidate term in any contemporary theory that could rise as $T$ fell. They reported the observation and stopped.\n\nThree things deserve early emphasis because they shape the rest of the story.\n\nFirst, the samples were \"pure\" only by the standards of 1934 metallurgy. Spectroscopic estimates that emerged over the following decades put the iron content of the offending gold and copper wires at parts-per-million levels — invisible to ordinary chemistry, decisive for the resistivity. The 1934 paper does not identify Fe as the culprit; that recognition arrived gradually, and the clean demonstration that the minimum tracked dissolved magnetic moments would not be produced until Sarachik, Corenzwit, and Longinotti's 1964 work on Mo–Nb hosts. In 1934 the anomaly was, simply, a property of \"gold and copper at low temperatures\".\n\nSecond, the Leiden authorship list contained three names but the literature would quickly reduce it to one and a half. Western reviews routinely cite the paper as \"de Haas and van den Berg\" or \"de Haas *et al.*\"; Jan de Boer — later professor of theoretical physics in Amsterdam and a quantum-statistical-mechanics figure in his own right — disappears entirely from the textbook trail. Van den Berg, who would devote much of the next thirty years to systematic study of the very anomaly the three of them had discovered, is usually allowed to survive as the *et al.*\n\nThird, the experimental Leiden of 1934 was the only laboratory on Earth where this measurement was easy. Kamerlingh Onnes had liquefied helium in 1908; de Haas himself, with Wiersma, had pioneered adiabatic demagnetization the year before the paper appeared. Cryogenic competence, trace-impurity sensitivity, and a cultural appetite for sub-Kelvin curiosities were concentrated in one building. The 1934 observation was therefore not a curiosity of one wire — it was a Leiden program. Van den Berg continued to map the resistance minimum across nominally pure copper, silver, gold, and zinc with collaborators including Brill and Croft, and B.M. Boerstoel and B. Knook would extend the systematics into doctoral theses at Leiden in the early 1960s identifying ppm-level Fe as the controlling parameter (verify).\n\nThe next public confirmation came in 1936 from Walther Meissner and Berthold Voigt in Berlin, who measured Au and Cu under different metallurgical preparation and reproduced the minimum. Meissner's interpretation differed from the Leiden one — he favoured phonon spectrum truncation or boundary scattering — but the existence of the anomaly was settled. From then until the early 1960s the empirical picture matured slowly, in fragments, in metallurgy journals and conference proceedings rather than in *Physical Review*. The phenomenology that emerged is captured by the additive decomposition\n\n$$\\rho(T) \\;=\\; \\rho_0 \\;+\\; a\\, T^{5} \\;+\\; c_{\\text{imp}}\\, b\\, \\ln\\!\\frac{T_K}{T},$$\n\nwhere the first term is residual potential scattering, the second is the Bloch phonon contribution, and the third — anomalous, present only with magnetic dopants and linear in their concentration $c_{\\text{imp}}$ — is the term that has no business being there. Setting $d\\rho/dT = 0$ gives $T_{\\min} \\propto c_{\\text{imp}}^{1/5}$: the minimum shifts to higher temperature in dirtier samples but very slowly, while its depth grows linearly. This sublinear shift had been empirically clear by the late 1950s and is the most stringent fingerprint distinguishing the Kondo anomaly from a Bloch–Grüneisen artefact. None of this fingerprinting required a theory; it required *systematics*, which is what the next generation supplied.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctext x=\"360\" y=\"24\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\"\u003eAnatomy of the resistance minimum: additive decomposition\u003c/text\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"50\" x2=\"80\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"385\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eT (logarithmic)\u003c/text\u003e\u003ctext x=\"35\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 35 195)\"\u003eρ(T)\u003c/text\u003e\u003ctext x=\"180\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e~1 K\u003c/text\u003e\u003ctext x=\"400\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eT_min\u003c/text\u003e\u003ctext x=\"600\" y=\"360\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e~100 K\u003c/text\u003e\u003cline x1=\"180\" y1=\"340\" x2=\"180\" y2=\"346\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"400\" y1=\"340\" x2=\"400\" y2=\"346\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"600\" y1=\"340\" x2=\"600\" y2=\"346\" stroke=\"#e8e6e1\"/\u003e\u003cline x1=\"100\" y1=\"290\" x2=\"660\" y2=\"290\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/\u003e\u003ctext x=\"650\" y=\"282\" fill=\"#7ee0a3\" font-size=\"14\" text-anchor=\"end\"\u003eρ₀ residual (impurity)\u003c/text\u003e\u003cpath d=\"M 100 290 Q 320 289, 450 282 Q 540 255, 660 95\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"540\" y=\"200\" fill=\"#ffb86b\" font-size=\"14\"\u003eρ_phonon ∝ T⁵\u003c/text\u003e\u003cpath d=\"M 100 130 Q 220 180, 380 265 Q 500 285, 660 289\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"105\" y=\"120\" fill=\"#ff7a90\" font-size=\"14\"\u003eρ_anom ∝ −ln T (the anomaly)\u003c/text\u003e\u003cpath d=\"M 100 70 Q 220 140, 340 230 Q 400 250, 460 240 Q 540 210, 660 55\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"3\"/\u003e\u003ctext x=\"265\" y=\"95\" fill=\"#7aa2ff\" font-size=\"14\" font-weight=\"bold\"\u003emeasured ρ(T)\u003c/text\u003e\u003ccircle cx=\"400\" cy=\"252\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003cline x1=\"400\" y1=\"252\" x2=\"400\" y2=\"340\" stroke=\"#7aa2ff\" stroke-dasharray=\"3 3\" stroke-width=\"1\" opacity=\"0.6\"/\u003e\u003ctext x=\"425\" y=\"225\" fill=\"#e8e6e1\" font-size=\"14\" font-style=\"italic\"\u003eT_min ∝ c^(1/5)\u003c/text\u003e\u003c/svg\u003e\n*Figure: The 1934–1960s empirical picture. The measured $\\rho(T)$ is the sum of a flat residual $\\rho_0$, the Bloch phonon term $\\propto T^{5}$, and an anomalous $-\\ln T$ contribution proportional to the magnetic-impurity concentration. The minimum lies where the rising $T^{5}$ term equals the falling logarithm, fixing $T_{\\min} \\propto c^{1/5}$. Kondo would later supply the $\\ln T$ from third-order Born scattering; the 1930s–50s experimentalists had supplied the curve.*\n\nIn the 1950s the program crystallized around two figures in particular. Brian R. Coles at Imperial College, working on Cu–Fe, Au–Fe, and Cu–Mn systems, established that the depth of the minimum scaled linearly with magnetic-impurity concentration while $T_{\\min}$ moved very slowly — a $c^{1/5}$ shift, not a $c$ shift — and that the effect required a *magnetic* impurity: Cu–Zn and Cu–Ag, with no local moment, showed no minimum. Coles's *Philosophical Magazine* papers, together with A. J. Heeger's compendious 1969 *Solid State Physics* review, are the closest things to a systematic English-language compendium of the pre-Kondo phenomenology that exist. In parallel, Morrel H. Cohen's group at Chicago and the Bell Labs metallurgists (Matthias, Clogston, Jaccarino) connected the local-moment forma
