<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "headline": "Superfluidity: A Cold Archaeology of the Two-Fluid Quantum", "alternativeHeadline": "superfluidity", "name": "superfluidity", "description": "From Leiden's λ-point to the p-wave matrix order parameter — a forensic re-reading of the record.", "inLanguage": "en", "keywords": ["superfluidity", "Superfluid state", "He II (helium-4 below T_λ ≈ 2.17 K)", "Suprafluidity / Suprafluidität (early German usage)", "Frictionless aggregation (Mendelssohn 1945)", "Hyperfluidity (rare, Soviet usage)"], "about": [{"@type": "Thing", "name": "superfluidity"}, {"@type": "Thing", "name": "Superfluid state"}, {"@type": "Thing", "name": "He II (helium-4 below T_λ ≈ 2.17 K)"}, {"@type": "Thing", "name": "Suprafluidity / Suprafluidität (early German usage)"}, {"@type": "Thing", "name": "Frictionless aggregation (Mendelssohn 1945)"}, {"@type": "Thing", "name": "Hyperfluidity (rare, Soviet usage)"}], "articleSection": "BRIEFING", "datePublished": "2026-06-09", "dateModified": "2026-06-09", "author": {"@type": "Person", "name": "Pranshoo Upadhyay", "url": "https://pranshoo.github.io/pranshoo-physics/"}, "publisher": {"@type": "Person", "name": "Pranshoo Upadhyay"}, "url": "https://pranshoo.github.io/pranshoo-physics/observatory/superfluidity-a-cold-archaeology-of-the-two-fluid-quantum.html", "mainEntityOfPage": "https://pranshoo.github.io/pranshoo-physics/observatory/superfluidity-a-cold-archaeology-of-the-two-fluid-quantum.html", "isPartOf": {"@type": "CreativeWorkSeries", "name": "Excavations", "url": "https://pranshoo.github.io/pranshoo-physics/observatory/"}, "articleBody": "Origins and the Erased Co-Authors: Leiden, Oxford, Cambridge, Moscow (1908–1938) Origins and the Erased Co-Authors: Leiden, Oxford, Cambridge, Moscow (1908–1938) The arc from helium liquefaction to the word \"super-fluid\" runs thirty years across four cities, and at each station a co-author was quietly clipped from the record. Leiden, 1908–1935 Heike Kamerlingh Onnes liquefied ^4He on 10 July 1908 and within a few years had noted a density maximum near 2.2 K — neither he nor his immediate successors recognised it as a phase boundary. That recognition came in 1927 from W. H. Keesom and M. Wolfke, who proposed two distinct liquid phases — He I and He II — separated by what they then called the λ-point . The Greek letter was anchored in 1932 when W. H. Keesom and K. Clusius resolved a knife-edged specific-heat singularity; the definitive curve appeared three years later in W. H. Keesom \u0026 A. P. Keesom (Physica 2, 557, 1935). Anna Petronella (\"Ank\") Keesom — daughter, collaborator, and principal hand at the calorimetry — is routinely absorbed into \"Keesom et al.\" in modern citations. Oxford, 1936 Bernard Vivian Rollin, in F. E. Simon's Clarendon group, reported a creeping film of liquid helium that climbed cold capillaries and emptied open vessels against gravity. He published not in Nature but in the Actes du VII^e Congrès International du Froid (La Haye, 1936) — a refrigeration-engineering proceedings effectively invisible to the Anglophone physics literature. The Rollin film is the oldest transport anomaly of He II in print, predating the viscosity letters by roughly eighteen months. The venue cost it priority in every modern textbook (the effect is occasionally called \"Rollin–Simon film,\" but more often just \"the helium film\"). Cambridge and Moscow, 8 January 1938 Nature 141 carried two back-to-back letters: Kapitza from the Institute for Physical Problems in Moscow , Allen and Misener from the Royal Society Mond Laboratory in Cambridge . Kapitza's apparatus was an annular slit between two optically flat glass disks; Allen and Misener used capillaries so narrow that the resolvable viscosity was bounded above by \\sim 10^{-11} Poise — a limit set by the instrument, not the fluid. Submission record: Kapitza's note left Moscow on 3 December 1937; Allen and Misener's left Cambridge on 22 December 1937. Allen's notebooks, examined by Griffin (2008), show resolvable flow as early as 24 November — predating Kapitza's submission, though not his measurements. Kapitza coined \"super-fluid\"; Allen and Misener did not, and the term stuck. Arthur Donald Misener, a Toronto graduate student visiting Mond, returned to Canada (UWO) after 1938 and never built a career on the discovery. Jack Allen continued at St Andrews and produced the canonical 16 mm film of the fountain and creeping flow. Allen and H. Jones reported the fountain effect — dP/dT = \\rho s — in Nature 141, 243 within months , converting Kapitza's negative result into a positive prediction that Tisza [18, 72] and London would interpret theoretically by year's end. The 1978 citation, in the literal text Kapitza was awarded half of the 1978 Prize \"for his basic inventions and discoveries in the area of low-temperature physics\" — phrasing that names neither superfluidity nor 1937–1938. The Nobel presentation speech does acknowledge that \"the same discovery was made independently by Allen and Misener,\" yet the citation was not amended. Allen lived until 2001 and Misener until 1996; both were available to be added. The 53-year delay — Kapitza was 84 at the ceremony — is itself a tell: the Committee had repeatedly deferred the question because the priority record was, and remains, co-equal at the level of the Nature pages. Soviet historiography credits Kapitza alone; Anglo-American textbooks usually credit \"Kapitza, Allen and Misener\" but bury Misener in a footnote, and treat Rollin and A. P. Keesom as anonymous antecedents. Sources: - Griffin, Superfluidity: three people, two papers, one prize (Physics World/Toronto) - APS News, January 1938: Discovery of Superfluidity - Nobel Prize Press Release, Physics 1978 - Balibar, The discovery of superfluidity (arXiv physics/0611119) The Pedagogical Core: Two Fluids, Phonon–Roton Spectrum, and the Landau Criterion The Pedagogical Core: Two Fluids, Phonon–Roton Spectrum, and the Landau Criterion Below T \\lambda \\simeq 2.17 K the working description of He II is a set of conservation laws written for two interpenetrating fluids. Tisza's 1938 bookkeeping posits a mass density two independent velocity fields \\mathbf{v} n,\\mathbf{v} s, and an entropy carried entirely by the normal component, s = (\\rho n/\\rho)\\,s n. Momentum and entropy then obey with \\mathbf{j}=\\rho n\\mathbf{v} n+\\rho s\\mathbf{v} s. Linearizing about equilibrium gives two decoupled wave equations: ordinary (first) sound u 1^{2}=(\\partial p/\\partial\\rho) s — a density oscillation with \\mathbf{v} n\\parallel\\mathbf{v} s — and Tisza's second sound u 2^{2}=(\\rho s/\\rho n)\\,Ts^{2}/c v, a temperature/entropy wave with \\rho n\\mathbf{v} n+\\rho s\\mathbf{v} s=0. Second sound is the genuine experimental signature of the two-fluid decomposition; predicted by Tisza, refined by Landau (who corrected the prefactor), measured by Peshkov 1944. Landau's 1941 paper replaced Tisza's BEC justification with a gas of elementary excitations on top of a quantum-hydrodynamic vacuum. The dispersion has two regimes: with \\Delta/k B\\simeq 8.6 K, p 0/\\hbar\\simeq 1.9 Å^{-1}, \\mu^{ }\\simeq 0.16\\,m {\\mathrm{He}} — values vindicated by Henshaw–Woods inelastic-neutron data (1961). Integrating the Bose distribution against \\varepsilon(p) gives a normal density \\rho n^{\\mathrm{ph}}\\propto T^{4} at low T, plus an exponentially activated roton piece \\propto T^{1/2}e^{-\\Delta/T} — quantitatively confirmed by Andronikashvili's oscillating-disk stack. Figure: Landau dispersion ε(p) of He II. Tangent from the origin (green dashed) touches the curve near the roton minimum; its slope is the Landau critical velocity v c. The phonon slope c (orange) is the speed of first sound. The geometric criterion follows from Galilean kinematics: in the rest frame of an obstacle moving at \\mathbf{v} through the condensate, exciting a quasiparticle of momentum \\mathbf{p} costs \\varepsilon(p)-\\mathbf{p}\\!\\cdot\\!\\mathbf{v}, which becomes negative only for For the He II dispersion this minimum sits at the roton edge, v c=\\Delta/p 0\\simeq 58 m/s. As flagged in §1's conflation audit, the measured breakdown is two orders smaller — vortex nucleation, not roton emission, sets the experimental ceiling. Bogoliubov 1947 supplied what Landau refused: a microscopic derivation from a weakly interacting Bose gas. Diagonalizing \\hat H = \\sum \\epsilon p^{0}a p^{\\dagger}a p + \\tfrac{n 0 g}{2}\\sum(2 a p^{\\dagger}a p + a p^{\\dagger}a {-p}^{\\dagger}+a p a {-p}) via a p=u p\\alpha p-v p\\alpha {-p}^{\\dagger} yields linear at small p with c=\\sqrt{n 0 g/m} — phonons emerge generically from interactions, the ideal BEC's gapless quadratic spectrum is non-superfluid. The roton is not captured: it requires strong correlations (Feynman 1955 , Feynman–Cohen 1956). Topology closes the circle. The macroscopic wavefunction \\psi=\\sqrt{n s}\\,e^{i\\varphi} gives \\mathbf{v} s=(\\hbar/m)\\nabla\\varphi, so \\nabla\\times\\mathbf{v} s=0 locally but \\oint\\mathbf{v} s\\!\\cdot\\!d\\boldsymbol{\\ell}=(\\hbar/m)\\,2\\pi n. Onsager stated this in one paragraph at Como ; Feynman re-derived it and laid out the vortex-line hydrodynamics [75, 42]; Vinen pinned a single quantum on a vibrating wire . The unit is the structural constant of superfluid hydrodynamics — and the reason rotating He II carries a vortex lattice rather than rigidly co-rotating with its bucket. What Superseded What: Tisza vs Landau, London vs Bogoliubov, and the ODLRO Resolution What Superseded What: Tisza vs Landau, London vs Bogoliubov, and the ODLRO Resolution By 1941 there were three formalisms in play and no agreement on which one was foundational. Tisza had a working hydrodynamics. London had a candidate microscopic mechanism. Landau had a third path — a phenomenological quantum hydrodynamics with a chosen spectrum and an explicit rejection of London. The next fifteen years were spent collapsing the trio into something coherent, and the order of collapses matters. Landau over Tisza, but only on the microscopics Tisza's two-fluid bookkeeping survived intact: \\rho = \\rho n + \\rho s, two velocity fields, only the superfluid carries no entropy. Tisza identified \\rho s with the condensate. Landau (1941) refused this. He built the spectrum first — quantum hydrodynamics with longitudinal phonons and a second, gapped roton branch — and identified \\rho n with the thermal population of these excitations. The low-T scaling \\rho n \\propto T^4 is a phonon Stefan–Boltzmann result; it is not derivable from London's ideal-BEC counting, which gives \\rho n \\propto T^{3/2}. The Andronikashvili torsion-pendulum measurement (1946, verify) settled the question: \\rho n(T) tracks Landau, not London. The exchange in Phys. Rev. 75 [26, 27] is the polite endpoint — Landau conceding the hydrodynamics, Tisza conceding the dispersion. The bookkeeping is Tisza's; the carriers are Landau's. Bogoliubov closes the London gap London's 1938 BEC identification was qualitatively right but technically embarrassing: the ideal-gas Landau criterion gives v c = \\min(\\varepsilon/p) = 0 for \\varepsilon = p^2/2m, so an ideal BEC cannot be superfluid in Landau's own sense. Bogoliubov (1947) resolved this with the first interacting-Bose-gas calculation. The canonical transformation that bears his name diagonalises the quadratic Hamiltonian into quasiparticles with linear at small p and free-particle-like at large p. The phonon branch is now microscopic, not postulated. Landau's spectrum sits on a Bose-gas foundation; London's mechanism survives in the form Bogoliubov gave it — not as a textbook BEC, but as a strongly depleted condensate of order 10% at T=0. Penrose–Onsager: ODLRO as the rigorous order parameter The cleanest reformulation came from Penrose and Onsager . Forget the condensate of an ideal gas; ask instead about the one-body reduced density matrix In a normal fluid \\rho 1 decays to zero as \\mathbf{r}-\\mathbf{r}' \\to \\infty. In a superfluid it tends to a finite asymptote \\varphi^ (\\mathbf{r})\\varphi(\\mathbf{r}') — off-diagonal long-range order . The condensate fraction n 0/n is the asymptote, the macroscopic wavefunction \\varphi(\\mathbf{r}) its phase, and superflow the gradient of that phase. ODLRO survives interactions, finite temperature, and a strongly depleted condensate; it is the order parameter London should have written and could not. Figure: The off-diagonal element of the one-body density matrix decays from n at coincidence to a finite n 0 0 at infinity in a superfluid; the condensate fraction is the asymptote, not the whole density. In He II at T=0, n 0/n \\approx 0.07–0.10 (neutron measurements, verify). Fermions enter: ODLRO of order two and a matrix order parameter For ³He the order parameter cannot live in \\rho 1 — antisymmetry forbids macroscopic occupation of any one-fermion state. Yang's extension (1962, verify) places ODLRO in the two-body density matrix \\rho 2; the asymptote is a pair amplitude \\Delta {\\alpha\\beta}(\\mathbf{r} 1,\\mathbf{r} 2). For p-wave, spin-triplet pairing this is a 3\\times 3 complex matrix A {\\mu i} with \\mu a spin and i an orbital index. The Anderson–Brinkman–Morel (ABM) state takes A {\\mu i}= \\Delta 0\\, \\hat d \\mu (\\hat m i + i\\hat n i) — equal-spin pairing with two point nodes; the Balian–Werthamer (BW) state takes A {\\mu i} = \\Delta 0\\, R {\\mu i} with R\\in SO(3) — an isotropic gap magnitude carrying a spin–orbit texture . London's \"macroscopic wavefunction\" survives as a tensorial object; Tisza's bookkeeping survives but with anisotropic superfluid-density tensors \\rho {s,\\parallel}, \\rho {s,\\perp}. Penrose–Onsager logic is unchanged; only the rank of the order parameter is. Live Confusions in the Modern Literature: Five Equations With Stripped Assumptions Live Confusions in the Modern Literature: Five Equations With Stripped Assumptions Five equations circulate in the modern He II / cold-atom literature with their assumptions quietly stripped. Each is correct in a regime; each is routinely cited outside it. C1. \"The two-fluid model is Landau's\" The bookkeeping together with the second-sound wave equation is Tisza 1938 [18, 72], not Landau 1941 . Landau supplied a different microscopic identification of \\rho n — a gas of phonons and rotons giving \\rho n \\propto T^4 at low T — and explicitly rejected Tisza's BEC underpinning. The Tisza ↔ Landau exchange in Phys. Rev. 75, 884 / 885 [26, 27] is the unambiguous priority-restoration; Tisza's two-fluid equations are valid below T \\lambda for v n,v s \\ll c 1, Landau's identification of \\rho n is valid only for T \\lesssim 0.6 K where rotons are exponentially suppressed. C2. \"BEC implies superfluidity\" The London 1938 identification is qualitatively right and quantitatively insufficient. For the ideal Bose gas the dispersion is \\varepsilon(p)=p^2/2m, so the Landau criterion gives An ideal BEC is not a superfluid. The repair has two pieces: Bogoliubov's interacting spectrum , which is linear at small p and gives v c=c 0; and Penrose–Onsager off-diagonal long-range order , which is the rigorous link between condensation and superflow. In He II the condensate fraction is \\sim 7\\% (verify), yet \\rho s/\\rho \\to 1 at T\\to 0: the macroscopically occupied mode is not the superfluid density. C3. \"Superflow is irrotational because \\nabla\\times\\mathbf{v} s=0\" \\mathbf{v} s = (\\hbar/m)\\nabla\\varphi implies \\nabla\\times\\mathbf{v} s=0 only on simply connected domains . Single-valuedness of \\psi on a non-contractible loop gives the Onsager–Feynman quantization stated by Onsager in a one-paragraph remark at Como and worked out by Feynman [42, 75]. Vinen detected the n=1 quantum in rotating He II . Under rotation \\Omega the equilibrium is a triangular lattice of singly-quantized lines with areal density n v=2\\Omega m/h (Feynman rule); on coarse-grained scales \\langle\\nabla\\times\\mathbf v s\\rangle=2\\boldsymbol\\Omega, mimicking solid-body rotation. The textbook \"irrotational\" statement holds only between vortex cores. C4. \"Landau critical velocity v c\\simeq 60 m/s\" Using the measured roton minimum, the Landau criterion gives Ion-mobility, oscillating-wire and orifice experiments find the breakdown velocity two to three orders of magnitude smaller, typically 0.1–1 cm/s in bulk, set by vortex nucleation (Iordanskii 1965; Langer–Fisher 1967; Volovik ). The roton ceiling is recovered only in negative-ion experiments at high pressure where the nucleation barrier is suppressed. The Landau v c is a thermodynamic upper bound on dissipationless flow, not the experimental onset; quoting it as the latter is a category error endemic to introductory texts. C5. \"He II has zero viscosity\" Kapitza's capillary and the Allen–Misener slit measure an effective \\eta\\to 0 because the superfluid component slips with \\mathbf v s. Andronikashvili's torsional-pendulum (1946) measures a finite \\eta n of the normal component and was the first direct determination of \\rho n(T)/\\rho, confirming Landau's T^4 phonon prediction. The two results are reconciled by the two-fluid stress \\rho s carries no viscous stress, \\rho n does. The Kapitza ↔ Mendelssohn debate of 1939–47 [16, 24, 28] is precisely about which experiment measures which component. The slogan \"He II is inviscid\" applies to \\rho s alone and only outside the vortex-nucleation regime of C4. Current Frontier: Supersolidity, Dipolar and Moiré Superfluids, and the ³He Cosmology Analogue Current Frontier: Supersolidity, Dipolar and Moiré Superfluids, and the ³He Cosmology Analogue Five threads are active; their ratios of established to contested are very different. Supersolids: ⁴He is out, dipolar BECs are in The 2004 Kim–Chan torsional-oscillator signature of supersolid solid ⁴He is no longer accepted. Chan and D. Kim repeated the experiment with a cell engineered to exclude bulk ⁴He outside the Vycor matrix; the period drop vanished, and the residual signal in earlier cells is now ascribed to a Day–Beamish shear-modulus stiffening of the surrounding solid, not a superflow component (Physics World). Bulk ⁴He does not appear to support a supersolid phase. The role has passed to strongly dipolar Bose condensates near a s \\approx a {dd}. The roton minimum softens, crystallisation sets in along one axis, and global phase coherence survives — simultaneous breaking of U(1) and translation, with the predicted low-energy crystalline Goldstone branch observed in trapped Dy and Er. 1D droplet arrays were established by 2019; a 2D droplet array followed in 2021; a 2D stripe supersolid in Er was reported by tilting the dipole axis to select an anisotropic roton (arXiv:2512.13280). Quantised vortices were imaged inside the supersolid in 2024 (Innsbruck press release), settling that the superfluid component is genuine and not a fragmented condensate. Figure: Roton softening connects the uniform dipolar superfluid to the stripe supersolid and onward to the incoherent droplet array. The middle column carries the diagnostic feature — a roton mode driven to zero produces a second gapless Goldstone branch (crystal phonon) coexisting with the long-wavelength superfluid phonon. Moiré and exciton superfluids: confirmed but limited Interlayer-exciton condensates in graphene bilayers and TMD heterostructures show counterflow superfluidity and quantised Hall drag at matched filling. The condensate is composite-boson and survives only at cryogenic temperatures, contrary to the original room-temperature-superfluid proposal of double-bilayer-graphene . In moiré flat-band superconductors descended from magic-angle bilayer graphene , superconductivity is established but the order-parameter symmetry — chiral d\\pm id, nematic d, or topological p+ip — remains contested. This is the Fermi-side ambiguity that haunted Sr₂RuO₄ for two decades and is still not phase-sensitively settled in moiré. Open: p-wave from spin-polarised cold atoms A spin-polarised single-species Fermi gas in a p-wave superfluid state remains the longest-outstanding missing entry. P-wave Feshbach molecules suffer inelastic atom–molecule and molecule–molecule loss with lifetimes 10–20 ms, and no equilibrium p-wave superfluid has been reported in cold atoms (verify). Until this is closed, the only realised p-wave matrix order parameter is the one Leggett wrote down for ³He . Volovik's program: solid core, soft periphery Helsinki (ROTA) and Grenoble demonstrated Kibble–Zurek defect formation in neutron-irradiated ³He-B in the 1990s; 2021 experiments tested suppression of the KZ scaling under a symmetry-violating bias. The A↔B transition as a cosmological-vacuum analogue, the skyrmion/Q-ball catalogue, and the Weyl-fermion structure of A-phase nodes are firm consequences of the ³He order-parameter manifold and form the load-bearing core of . The looser claims — ³He as a literal model for baryogenesis or for the chiral anomaly producing charge in the early universe — are analogies in the precise mathematical sense (identical equations, different physical content) and should be read as such. Vortex reconnection and the dual cascade Two distinct turbulent regimes in He II are confirmed: Vinen (ultraquantum) turbulence with no inertial range, and quasi-classical Kolmogorov turbulence with a k^{-5/3} inertial range above the inter-vortex spacing \\ell and a Kelvin-wave cascade below it . The recent surprise: single-reconnection visualisation now shows time-irreversibility — post-reconnection separation is faster than pre-reconnection approach (PNAS 2025). The textbook assumption of a locally time-symmetric reconnection is therefore wrong, and the dissipation budget bridging the two cascades has not yet absorbed this correction. Where verification is moving The cleanest remaining test in the dipolar program is a direct measurement of the superfluid fraction against Leggett's bound, f s \\le 1/\\!\\left(\\overline{n}\\,\\overline{1/n}\\right), inside the modulated state. For moiré superconductors it is a phase-sensitive Josephson geometry separating chiral from nematic order. For the ³He analogue program it is the lifetime of spin-texture defects under controlled symmetry bias. None of the three is settled, and on the current trajectory the dipolar question will close first. The AETHER Verdict The AETHER Verdict I have read this dossier as both a historian and a working theorist. What follows is what I would say at a seminar, with a glass in hand, if asked to stop being even-handed. (a) What I will defend with my reputation The Penrose–Onsager ODLRO criterion is the only definition of \"superfluid order\" that survives every regime change of the last seventy years — neutral, charged, bosonic, fermionic-paired, lattice, continuum. It is the load-bearing concept; the rest is bookkeeping. Closely behind it I will defend the Bogoliubov 1947 spectrum as the minimal mechanism that converts BEC into superfluidity by lifting \\varepsilon(p)/p off zero. I will defend Onsager's 1949 circulation quantum \\kappa = h/m as the most under-credited single line in the field, and I will defend the historical record that Tisza, not Landau, wrote the two-fluid equations [25,26]. On the experimental side, Andronikashvili's torsion-pendulum measurement of \\rho n(T) is, to my mind, the cleanest demonstration that the two-fluid decomposition is physical and not a calculational fiction. (b) What is shakier than the literature admits Three load-bearing assumptions are routinely smuggled past the reader. 1. The phonon–roton dispersion is treated as fundamental when it is in fact a single-mode approximation — the Feynman–Cohen ansatz with backflow, calibrated against neutron scattering . The roton minimum is a many-body resonance, not an elementary excitation in the QFT sense. Modern DMC results show the single-mode picture loses 15–20% of the spectral weight near the roton; textbooks rarely mention this. 2. The Landau critical velocity is presented as a prediction when it is a thermodynamic upper bound. The observed onset is set by vortex nucleation (Iordanskii / Langer–Fisher / Volovik [49,50]) and depends on geometry, surface roughness, and temperature in ways no closed-form theory captures. Calling the measured v c \"Landau-like\" is sociology, not physics. 3. The two-fluid decomposition is Galilean-frame-dependent , a point Khalatnikov is explicit about but most users forget. \\rho s and \\rho n are defined by the response to a slowly moving wall; they are not the densities of two physically separable populations. This is exactly where supersolid claims get into trouble. A fourth, milder caveat: the dipolar-BEC \"supersolid\" literature [70,71] has imported the word supersolid with its He-II baggage. The droplet-array states satisfy ODLRO and discrete translation breaking, but the NCRI fraction in those systems has not been measured to the standard the Kim–Chan retraction taught us to demand. (c) Three open questions I would actually work on 1. A first-principles calculation of vortex-nucleation rates in He II at the roughness scale of real capillaries. — This is the gap between Landau's v c and every experiment ever done; it is sixty years overdue and now numerically tractable. 2. An unambiguous NCRI measurement in a 2D dipolar supersolid, with the Leggett bound as the benchmark. — Until this exists, \"supersolid\" is a spectroscopic claim, not a mechanical one. 3. Whether the ³He-B surface Majorana cone survives realistic disorder at the silver-sinter interface. — The cosmological analogue is beautiful; the condensed-matter question is whether the topology is robust enough to use . (d) Reading path 1. London 1938 — read first for the question, not the answer; it sets the BEC framing every later paper either extends or rejects. 2. Tisza 1938 — the actual two-fluid equations, in their original form, before Landau's reframing overwrote them. 3. Landau 1941 — the rival microscopic picture; read immediately after Tisza so the disagreement is visible. 4. Penrose \u0026 Onsager 1956 — the definition that retired the priority dispute by making both pictures special cases of ODLRO. 5. Volovik, The Universe in a Helium Droplet — where the field actually lives now: topology, broken symmetries, and the ³He phases as a laboratory for relativistic vacua."}</script>

.wrap{max-width:1140px;margin:0 auto;padding:0 28px;position:relative;z-index:1}
/* topbar */
.obar{position:sticky;top:0;z-index:40;height:60px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.obar .row{max-width:1140px;margin:0 auto;padding:0 28px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}
.obar a.back{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.obar a.back:hover{color:var(--accent)}
.obar .wm{font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;text-decoration:none}
.obar .wm span{color:var(--accent)}
.tbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:none;cursor:pointer;transition:border-color .25s}
.tbtn:hover{border-color:var(--accent)}
.tbtn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.4}
/* landing hero */
.lhero{padding:84px 0 38px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px;margin-bottom:20px}
.kick::after{content:"";height:1px;flex:0 0 56px;background:var(--accent);opacity:.5}
h1.big{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8vw,92px);line-height:1.0;letter-spacing:-.02em;margin-bottom:22px}
.lhero p.manifesto{font-size:21px;font-style:italic;color:var(--ink-2);max-width:680px;line-height:1.6}
.lhero p.note{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:24px;text-transform:uppercase}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:46px 0 6px;border-top:1px solid var(--line-soft);padding-top:24px}
.filter button{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:none;border-radius:99px;padding:8px 15px;cursor:pointer;transition:all .2s}
.filter button:hover{border-color:var(--accent);color:var(--accent)}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* card grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:34px 0 100px}
a.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;background:var(--elev);padding:30px 30px 26px;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative;overflow:hidden}
a.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
a.card .ctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;margin-bottom:16px}
a.card .ctag b{font-weight:400;color:var(--muted)}
a.card h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.18;letter-spacing:-.01em;margin-bottom:8px}
a.card .csubj{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
a.card p{font-size:15.5px;color:var(--ink-2);line-height:1.6;flex:1}
a.card .cfoot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between}
a.card .cfoot .arr{color:var(--accent);transition:transform .25s}
a.card:hover .cfoot .arr{transform:translateX(4px)}
.empty{padding:60px 0;color:var(--muted);font-style:italic}
/* reader */
.rmast{padding:64px 0 30px}
.rmast .kind{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.rmast h1{font-family:var(--serif);font-weight:500;font-size:clamp(33px,5vw,56px);line-height:1.08;letter-spacing:-.015em;margin-bottom:18px}
.rmast .sub{font-size:21px;font-style:italic;color:var(--ink-2);max-width:760px;line-height:1.5}
.rmast .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 20px;text-transform:uppercase}
.aka{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;align-items:center}
.aka .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aka i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px}
.aka i.subj{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.callout{border:1px solid var(--line-soft);border-left:2px solid var(--accent);background:var(--elev);border-radius:0 4px 4px 0;padding:18px 24px;margin:30px 0}
.callout h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.callout p{font-size:15.5px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--gold)}
.callout.warn h4{color:var(--gold)}
.rgrid{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;padding-bottom:40px}
.toc{position:sticky;top:84px;font-family:var(--mono);font-size:11px;line-height:1.5}
.toc .tl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 12px;border-left:1px solid var(--line-soft);transition:color .2s,border-color .2s}
.toc a:hover,.toc a.on{color:var(--accent);border-color:var(--accent)}
article.body{min-width:0;max-width:760px}
.sec{padding:14px 0 8px;scroll-margin-top:80px}
.sec.verdict{border:1px solid var(--line);border-radius:6px;background:var(--elev);padding:8px 34px 24px;margin-top:30px}
.prose h2{font-family:var(--serif);font-weight:500;font-size:clamp(25px,3.4vw,33px);line-height:1.18;letter-spacing:-.01em;margin:40px 0 16px}
.prose h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:30px 0 10px}
.prose h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:24px 0 8px}
.prose p{margin:0 0 1.25em;color:var(--ink-2)}
.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.prose a:hover{color:var(--accent)}
.prose ul,.prose ol{margin:0 0 1.25em 1.3em;color:var(--ink-2)}
.prose li{margin-bottom:.5em}
.prose blockquote{margin:1.4em 0;padding:4px 0 4px 24px;border-left:2px solid var(--accent);font-style:italic;color:var(--ink)}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.prose pre{background:var(--elev);border:1px solid var(--line-soft);border-radius:5px;padding:16px;overflow:auto;margin:0 0 1.25em}
.prose pre code{background:none;padding:0}
.prose hr{border:none;border-top:1px solid var(--line-soft);margin:2em 0}
.prose table{border-collapse:collapse;width:100%;margin:0 0 1.25em;font-size:15px}
.prose th,.prose td{border:1px solid var(--line-soft);padding:8px 12px;text-align:left}
.prose th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* generated SVGs use hardcoded light strokes, so figures keep a dark plate
   in BOTH themes — exactly like the AETHER app */
.fig{margin:26px 0;padding:20px;border:1px solid #222a3a;border-radius:8px;background:#10141d;text-align:center;overflow-x:auto;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.fig svg{max-width:100%;height:auto}
.fig+p em,.figcap{color:var(--muted)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.mathraw{font-family:var(--mono);font-size:.82em;color:var(--ink-2);background:var(--accent-soft);padding:1px 5px;border-radius:3px}
a.cite{color:var(--accent);text-decoration:none;font-size:.84em;vertical-align:super;border:none;padding:0 1px}
a.cite:hover{text-decoration:underline}
/* blocks: timeline / neglected / conflations / refs */
.block{padding:46px 0 8px;border-top:1px solid var(--line-soft);margin-top:40px}
.block>h3{font-family:var(--serif);font-weight:500;font-size:27px;margin-bottom:6px}
.block>.lead{font-size:15px;color:var(--muted);font-style:italic;margin-bottom:26px}
.tline{position:relative;margin-left:8px;padding-left:26px;border-left:1px solid var(--line)}
.tline .ev{position:relative;padding:0 0 22px}
.tline .ev::before{content:"";position:absolute;left:-31px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent)}
.tline .ev .yr{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent)}
.tline .ev .what{font-size:15.5px;color:var(--ink);margin:2px 0}
.tline .ev .who{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ncards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ncard{border:1px solid var(--line-soft);border-radius:5px;padding:20px 22px;background:var(--elev)}
.ncard .nm{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:4px}
.ncard .ro{font-size:14.5px;color:var(--ink-2);margin-bottom:8px}
.ncard .ev{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.conf{list-style:none}
.conf li{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.conf .claim{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:4px;padding:8px 12px;display:inline-block;margin-bottom:8px}
.conf .clar{font-size:15px;color:var(--ink-2)}
.conf .clar::before{content:"→ ";color:var(--accent)}
.refs{list-style:none;counter-reset:r}
.refs li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14px;scroll-margin-top:80px}
.refs li .rn{font-family:var(--mono);font-size:11px;color:var(--accent)}
.refs li .rt{color:var(--ink)}
.refs li .ra{color:var(--muted);font-size:13px}
.refs li a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.refs li a:hover{color:var(--accent);border-color:var(--accent)}
.refs li .bk{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-soft);border-radius:99px;padding:2px 7px;margin-left:6px}
/* footer */
footer{border-top:1px solid var(--line);padding:28px 0 40px;margin-top:60px}
footer .fr{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
footer em{font-family:var(--serif);font-style:italic;text-transform:none;font-size:12.5px}
@media(max-width:880px){.grid{grid-template-columns:1fr}.rgrid{grid-template-columns:1fr;gap:8px}.toc{display:none}.ncards{grid-template-columns:1fr}body{font-size:16.5px}}
