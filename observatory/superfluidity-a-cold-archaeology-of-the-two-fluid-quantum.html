eakly interacting Bose gas; Bogoliubov transformation", "who": "N. N. Bogoliubov", "work": "J. Phys. USSR 11, 23", "kind": "formalization", "ref": null}, {"year": 1949, "event": "Quantized circulation κ = h/m proposed (one paragraph in a conference discussion)", "who": "L. Onsager", "work": "Nuovo Cimento Suppl. 6, 249 (Como conference remark)", "kind": "theory", "ref": null}, {"year": 1955, "event": "Quantized vortex lines and rotational superflow worked out in detail", "who": "R. P. Feynman", "work": "Progress in Low Temperature Physics, vol. 1 (Gorter, ed.)", "kind": "theory", "ref": 42}, {"year": 1956, "event": "Off-diagonal long-range order links BEC to superfluidity rigorously", "who": "O. Penrose \u0026 L. Onsager", "work": "Phys. Rev. 104, 576", "kind": "formalization", "ref": null}, {"year": 1961, "event": "Single quantum of circulation detected in rotating He II — Onsager–Feynman quantization confirmed", "who": "W. F. Vinen", "work": "Proc. Roy. Soc. A 260, 218", "kind": "observation", "ref": null}, {"year": 1972, "event": "Superfluid A and B phases of liquid ³He discovered (Pomeranchuk-cell anomaly)", "who": "D. D. Osheroff, R. C. Richardson, D. M. Lee", "work": "Phys. Rev. Lett. 28, 885; PRL 29, 920", "kind": "observation", "ref": null}], "neglected": [{"name": "A. D. (Don) Misener", "role": "Toronto graduate student visiting Cambridge; co-equal author of the Allen–Misener Nature letter that established vanishing viscosity in He II. Effectively erased — the 1978 Nobel went to Kapitza alone; Misener returned to Canada (UWO) and is rarely cited in modern reviews.", "evidence": "Nature 141, 75 (1938) [corpus 15]; Allen's own historical recollection in 'The Discovery of Superfluidity' (Allen, Physics World 1988) and the Royal Society biographical memoir of Allen.", "ref": 15}, {"name": "J. F. Allen", "role": "Co-discoverer with Misener; also discovered the fountain effect with H. Jones and the visualization of superflow. Despite the back-to-back Nature pairing, he was excluded from Kapitza's 1978 Nobel citation 'for his basic inventions and discoveries in the area of low-temperature physics'.", "evidence": "Nature 141, 75 and 141, 243 [corpus 15, 17]; Royal Society Biographical Memoir (R. M. Bowley, 2003).", "ref": 15}, {"name": "Laszlo Tisza", "role": "Wrote down the two-fluid model in 1938, a year before Landau, and predicted second sound and the fountain effect. Textbook attribution often labels the two-fluid picture 'Landau two-fluid'; Tisza's priority is acknowledged in Landau's 1949 reply [corpus 26] but is usually omitted.", "evidence": "Nature 141, 913 (1938) [corpus 18]; CR Acad. Sci. 207, 1035 \u0026 1186 (1938); J. Phys. Radium 1, 165 \u0026 350 (1940); Landau Phys. Rev. 75, 884 [corpus 26] and Tisza's reply [corpus 27].", "ref": 18}, {"name": "B. V. Rollin", "role": "Discovered the helium-II creeping film at Oxford (1936) — the first transport anomaly ever reported below T_λ, predating Kapitza/Allen–Misener by ~18 months.", "evidence": "Actes du VII Congrès Int. du Froid, La Haye, vol. 1, 187 (1936); reviewed in K. Mendelssohn, 'The Quest for Absolute Zero' (1966).", "ref": null}, {"name": "N. N. Bogoliubov", "role": "First microscopic derivation of a superfluid spectrum from interacting bosons (1947). Well credited inside the Russian school; in Western pedagogy the line London (1938) → BEC experiments (1995) often skips over Bogoliubov entirely.", "evidence": "Bogoliubov, J. Phys. USSR 11, 23 (1947); reproduced in Bogoliubov, 'Lectures on Quantum Statistics' (Gordon \u0026 Breach, 1967).", "ref": null}, {"name": "L. Onsager", "role": "Stated h/m circulation quantization in a one-paragraph discussion remark at the 1949 Como meeting, printed only in Nuovo Cimento Suppl. 6, 249. Feynman re-derived it independently in 1955 and is often given sole credit; Vinen and Hess later corrected the record explicitly.", "evidence": "Nuovo Cimento Suppl. 6, 249 (1949); R. J. Donnelly, 'Quantized Vortices in Helium II' (Cambridge 1991), §1; G. B. Hess, AIP Conf. Proc. 'Onsager: his life and work'.", "ref": null}, {"name": "A. P. (Ank) Keesom", "role": "Daughter and long-time collaborator of W. H. Keesom; co-author on the definitive λ-line specific-heat measurements that pinned down the phase transition. Routinely contracted to 'Keesom et al.' or dropped.", "evidence": "W. H. Keesom \u0026 A. P. Keesom, Physica 2, 557 (1935) and earlier Commun. Leiden papers; cf. Gavroglu \u0026 Goudaroulis, 'Methodological Aspects of the Development of Low Temperature Physics' (Kluwer 1989).", "ref": null}, {"name": "Jack Allen film (1971)", "role": "Allen's 16 mm film of the fountain and creeping film became the canonical pedagogical record but is rarely cited; the visualizations long predate the formal recognition of vortex nucleation phenomenology.", "evidence": "J. F. Allen, 'Liquid Helium II' (Univ. St Andrews 16 mm film, 1971/1982), now archived by the IoP.", "ref": null}], "conflations": [{"claim": "'Two-fluid model' is Landau's", "clarification": "The phenomenological two-fluid bookkeeping (ρ = ρ_n + ρ_s, two velocities, two entropies, second sound) is Tisza 1938. Landau 1941 supplied a different microscopic justification (gas of phonons + rotons carrying the normal density) and predicted ρ_n ∝ T⁴ at low T; he explicitly rejected Tisza's BEC underpinning. The two pictures coincide phenomenologically but disagree on what the 'normal component' is."}, {"claim": "BEC = superfluidity", "clarification": "Ideal BEC has critical velocity zero (Landau criterion gives v_c = min(ε(p)/p) = 0 for a free dispersion). Superfluidity requires the linear phononic part of the spectrum produced by interactions. London's 1938 identification is therefore qualitatively right but quantitatively insufficient; the rigorous link is Penrose–Onsager ODLRO (1956) plus Bogoliubov's interacting spectrum (1947)."}, {"claim": "Superflow is irrotational because ∇×v_s = 0", "clarification": "Superflow is irrotational only in simply connected regions. The phase of the macroscopic wavefunction permits multiply connected topology, giving quantized vortices with circulation κ = h/m (Onsager 1949, Feynman 1955, Vinen 1961). Rotating He II carries a vortex lattice; the bulk normal-component rotation is then mimicked on coarse-grained scales."}, {"claim": "'Landau critical velocity' is observed in He II", "clarification": "The Landau criterion gives v_c ≈ 60 m/s (roton minimum) for He II; the measured breakdown velocity is two to three orders of magnitude smaller, set by vortex nucleation (Iordanskii / Langer–Fisher / Volovik). The textbook v_c is a thermodynamic ceiling, not the experimental onset."}, {"claim": "He II viscosity is zero", "clarification": "Capillary/persistent-current viscosity vanishes, but rotating-disk and oscillating-disk viscometers measure a finite η of the normal component (Andronikashvili 1946). The 'zero viscosity' refers to ρ_s only; this distinction was the Kapitza ↔ Mendelssohn debate of 1939–47."}, {"claim": "³He superfluidity is just BCS s-wave with neutral fermions", "clarification": "³He pairs in a p-wave, spin-triplet, ℓ=S=1 channel (A, A₁, B phases). The order parameter is a 3×3 complex matrix; A is the equal-spin-pairing ABM state, B is the BW state. Symmetry breaking is SO(3)_L × SO(3)_S × U(1), enormously richer than s-wave BCS — this is the basis of Volovik's 'Universe in a Helium Droplet' [corpus 65]."}], "sections": [{"id": "origins-and-erased-coauthors", "title": "Origins and the Erased Co-Authors: Leiden, Oxford, Cambridge, Moscow (1908–1938)", "markdown": "## Origins and the Erased Co-Authors: Leiden, Oxford, Cambridge, Moscow (1908–1938)\n\nThe arc from helium liquefaction to the word \"super-fluid\" runs thirty years across four cities, and at each station a co-author was quietly clipped from the record.\n\n### Leiden, 1908–1935\n\nHeike Kamerlingh Onnes liquefied $^4$He on 10 July 1908 and within a few years had noted a density maximum near 2.2 K — neither he nor his immediate successors recognised it as a phase boundary. That recognition came in 1927 from W. H. Keesom and M. Wolfke, who proposed two distinct liquid phases — He I and He II — separated by what they then called the λ-point [80]. The Greek letter was anchored in 1932 when W. H. Keesom and K. Clusius resolved a knife-edged specific-heat singularity; the definitive curve appeared three years later in W. H. Keesom \u0026 A. P. Keesom (Physica 2, 557, 1935). Anna Petronella (\"Ank\") Keesom — daughter, collaborator, and principal hand at the calorimetry — is routinely absorbed into \"Keesom et al.\" in modern citations.\n\n### Oxford, 1936\n\nBernard Vivian Rollin, in F. E. Simon's Clarendon group, reported a creeping film of liquid helium that climbed cold capillaries and emptied open vessels against gravity. He published not in *Nature* but in the *Actes du VII$^e$ Congrès International du Froid* (La Haye, 1936) — a refrigeration-engineering proceedings effectively invisible to the Anglophone physics literature. The Rollin film is the oldest transport anomaly of He II in print, predating the viscosity letters by roughly eighteen months. The venue cost it priority in every modern textbook (the effect is occasionally called \"Rollin–Simon film,\" but more often just \"the helium film\").\n\n### Cambridge and Moscow, 8 January 1938\n\n*Nature* 141 carried two back-to-back letters: Kapitza from the Institute for Physical Problems in Moscow [16], Allen and Misener from the Royal Society Mond Laboratory in Cambridge [15]. Kapitza's apparatus was an annular slit between two optically flat glass disks; Allen and Misener used capillaries so narrow that the resolvable viscosity was bounded above by $\\sim 10^{-11}$ Poise — a limit set by the instrument, not the fluid. Submission record: Kapitza's note left Moscow on 3 December 1937; Allen and Misener's left Cambridge on 22 December 1937. Allen's notebooks, examined by [Griffin (2008)](https://www.physics.utoronto.ca/documents/13/Physics_World-_griffin.pdf), show resolvable flow as early as 24 November — predating Kapitza's submission, though not his measurements. Kapitza coined \"super-fluid\"; Allen and Misener did not, and the term stuck.\n\nArthur Donald Misener, a Toronto graduate student visiting Mond, returned to Canada (UWO) after 1938 and never built a career on the discovery. Jack Allen continued at St Andrews and produced the canonical 16 mm film of the fountain and creeping flow. Allen and H. Jones reported the fountain effect — $dP/dT = \\rho s$ — in *Nature* 141, 243 within months [17], converting Kapitza's negative result into a positive prediction that Tisza [18, 72] and London [71] would interpret theoretically by year's end.\n\n### The 1978 citation, in the literal text\n\nKapitza was awarded half of the 1978 Prize \"for his basic inventions and discoveries in the area of low-temperature physics\" — phrasing that names neither superfluidity nor 1937–1938. The [Nobel presentation speech](https://www.nobelprize.org/prizes/physics/1978/press-release/) does acknowledge that \"the same discovery was made independently by Allen and Misener,\" yet the citation was not amended. Allen lived until 2001 and Misener until 1996; both were available to be added. The 53-year delay — Kapitza was 84 at the ceremony — is itself a tell: the Committee had repeatedly deferred the question because the priority record was, and remains, co-equal at the level of the *Nature* pages. Soviet historiography credits Kapitza alone; Anglo-American textbooks usually credit \"Kapitza, Allen and Misener\" but bury Misener in a footnote, and treat Rollin and A. P. Keesom as anonymous antecedents.\n\nSources:\n- [Griffin, *Superfluidity: three people, two papers, one prize* (Physics World/Toronto)](https://www.physics.utoronto.ca/documents/13/Physics_World-_griffin.pdf)\n- [APS News, *January 1938: Discovery of Superfluidity*](https://www.aps.org/publications/apsnews/200601/history.cfm)\n- [Nobel Prize Press Release, Physics 1978](https://www.nobelprize.org/prizes/physics/1978/press-release/)\n- [Balibar, *The discovery of superfluidity* (arXiv physics/0611119)](https://arxiv.org/pdf/physics/0611119)"}, {"id": "pedagogical-core", "title": "The Pedagogical Core: Two Fluids, Phonon–Roton Spectrum, and the Landau Criterion", "markdown": "## The Pedagogical Core: Two Fluids, Phonon–Roton Spectrum, and the Landau Criterion\n\nBelow $T_\\lambda \\simeq 2.17$ K the working description of He II is a set of conservation laws written for two interpenetrating fluids. Tisza's 1938 bookkeeping [18] posits a mass density\n\n$$\\rho = \\rho_n(T) + \\rho_s(T), \\qquad \\rho_s(0)=\\rho,\\; \\rho_s(T_\\lambda)=0,$$\n\ntwo independent velocity fields $\\mathbf{v}_n,\\mathbf{v}_s$, and an entropy carried entirely by the normal component, $s = (\\rho_n/\\rho)\\,s_n$. Momentum and entropy then obey\n\n$$\\partial_t \\mathbf{j} + \\nabla p = 0,\\qquad \\partial_t(\\rho s) + \\nabla\\!\\cdot(\\rho s\\,\\mathbf{v}_n)=0,\\qquad \\partial_t\\mathbf{v}_s + \\nabla(\\mu + \\tfrac{1}{2}v_s^{2})=0,$$\n\nwith $\\mathbf{j}=\\rho_n\\mathbf{v}_n+\\rho_s\\mathbf{v}_s$. Linearizing about equilibrium gives two decoupled wave equations: ordinary (first) sound $u_1^{2}=(\\partial p/\\partial\\rho)_s$ — a density oscillation with $\\mathbf{v}_n\\parallel\\mathbf{v}_s$ — and Tisza's *second sound* $u_2^{2}=(\\rho_s/\\rho_n)\\,Ts^{2}/c_v$, a temperature/entropy wave with $\\rho_n\\mathbf{v}_n+\\rho_s\\mathbf{v}_s=0$. Second sound is the genuine experimental signature of the two-fluid decomposition; predicted by Tisza, refined by Landau (who corrected the prefactor), measured by Peshkov 1944.\n\nLandau's 1941 paper [20] replaced Tisza's BEC justification with a *gas of elementary excitations* on top of a quantum-hydrodynamic vacuum. The dispersion has two regimes:\n\n$$\\varepsilon(p)=\\begin{cases} c\\,p \u0026 p\\to 0\\quad(\\text{phonons,}\\;c\\simeq 238\\text{ m/s})\\\\ \\Delta+\\dfrac{(p-p_0)^{2}}{2\\mu^{*}} \u0026 p\\sim p_0\\quad(\\text{rotons})\\end{cases}$$\n\nwith $\\Delta/k_B\\simeq 8.6$ K, $p_0/\\hbar\\simeq 1.9$ Å$^{-1}$, $\\mu^{*}\\simeq 0.16\\,m_{\\mathrm{He}}$ — values vindicated by Henshaw–Woods inelastic-neutron data (1961). Integrating the Bose distribution against $\\varepsilon(p)$ gives a normal density $\\rho_n^{\\mathrm{ph}}\\propto T^{4}$ at low $T$, plus an exponentially activated roton piece $\\propto T^{1/2}e^{-\\Delta/T}$ — quantitatively confirmed by Andronikashvili's oscillating-disk stack.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"70\" y1=\"40\" x2=\"70\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"380\" y=\"380\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003emomentum p\u003c/text\u003e\u003ctext x=\"30\" y=\"190\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 30 190)\"\u003eε(p)/k_B  [K]\u003c/text\u003e\u003cpath d=\"M70,340 L150,250 L210,170 L260,130 L300,115 L335,135 L360,165 L380,200 L395,225 L410,230 L430,225 L450,210 L475,185 L505,150 L545,110 L600,70 L660,45\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.4\"/\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"200\" y2=\"190\" stroke=\"#ffb86b\" stroke-width=\"1.4\" stroke-dasharray=\"5,4\"/\u003e\u003ctext x=\"155\" y=\"230\" fill=\"#ffb86b\" font-size=\"14\"\u003eslope c (phonon)\u003c/text\u003e\u003ccircle cx=\"410\" cy=\"230\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"420\" y=\"260\" fill=\"#ff7a90\" font-size=\"14\"\u003eroton minimum (p₀, Δ)\u003c/text\u003e\u003cline x1=\"70\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#ff7a90\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/\u003e\u003ctext x=\"78\" y=\"225\" fill=\"#ff7a90\" font-size=\"13\"\u003eΔ ≈ 8.6 K\u003c/text\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"560\" y2=\"195\" stroke=\"#7ee0a3\" stroke-width=\"1.6\" stroke-dasharray=\"6,4\"/\u003e\u003ctext x=\"500\" y=\"215\" fill=\"#7ee0a3\" font-size=\"14\"\u003ev_c = min ε(p)/p  ≈ Δ/p₀\u003c/text\u003e\u003ctext x=\"600\" y=\"100\" fill=\"#7aa2ff\" font-size=\"14\"\u003eε(p)\u003c/text\u003e\u003c/svg\u003e\n*Figure: Landau dispersion ε(p) of He II. Tangent from the origin (green dashed) touches the curve near the roton minimum; its slope is the Landau critical velocity $v_c$. The phonon slope $c$ (orange) is the speed of first sound.*\n\nThe geometric criterion follows from Galilean kinematics: in the rest frame of an obstacle moving at $\\mathbf{v}$ through the condensate, exciting a quasiparticle of momentum $\\mathbf{p}$ costs $\\varepsilon(p)-\\mathbf{p}\\!\\cdot\\!\\mathbf{v}$, which becomes negative only for\n\n$$v \u003e v_c=\\min_{p}\\frac{\\varepsilon(p)}{p}.$$\n\nFor the He II dispersion this minimum sits at the roton edge, $v_c=\\Delta/p_0\\simeq 58$ m/s. As flagged in §1's conflation audit, the *measured* breakdown is two orders smaller — vortex nucleation, not roton emission, sets the experimental ceiling.\n\nBogoliubov 1947 [73] supplied what Landau refused: a microscopic derivation from a weakly interacting Bose gas. Diagonalizing $\\hat H = \\sum \\epsilon_p^{0}a_p^{\\dagger}a_p + \\tfrac{n_0 g}{2}\\sum(2 a_p^{\\dagger}a_p + a_p^{\\dagger}a_{-p}^{\\dagger}+a_p a_{-p})$ via $a_p=u_p\\alpha_p-v_p\\alpha_{-p}^{\\dagger}$ yields\n\n$$\\varepsilon(p)=\\sqrt{\\left(\\tfrac{p^{2}}{2m}\\right)^{2}+\\tfrac{p^{2}}{m}n_0 g},$$\n\nlinear at small $p$ with $c=\\sqrt{n_0 g/m}$ — phonons emerge generically from interactions, the ideal BEC's gapless quadratic spectrum is non-superfluid. The roton is *not* captured: it requires strong correlations (Feynman 1955 [75], Feynman–Cohen 1956).\n\nTopology closes the circle. The macroscopic wavefunction $\\psi=\\sqrt{n_s}\\,e^{i\\varphi}$ gives $\\mathbf{v}_s=(\\hbar/m)\\nabla\\varphi$, so $\\nabla\\times\\mathbf{v}_s=0$ locally but $\\oint\\mathbf{v}_s\\!\\cdot\\!d\\boldsymbol{\\ell}=(\\hbar/m)\\,2\\pi n$. Onsager stated this in one paragraph at Como [74]; Feynman re-derived it and laid out the vortex-line hydrodynamics [75, 42]; Vinen pinned a single quantum on a vibrating wire [77]. The unit\n\n$$\\kappa=h/m_{\\mathrm{He}}\\simeq 9.97\\times 10^{-8}\\;\\mathrm{m^{2}/s}$$\n\nis the structural constant of superfluid hydrodynamics — and the reason rotating He II carries a vortex lattice rather than rigidly co-rotating with its bucket."}, {"id": "what-superseded-what", "title": "What Superseded What: Tisza vs Landau, London vs Bogoliubov, and the ODLRO Resolution", "markdown": "## What Superseded What: Tisza vs Landau, London vs Bogoliubov, and the ODLRO Resolution\n\nBy 1941 there were three formalisms in play and no agreement on which one was foundational. Tisza had a working hydrodynamics. London had a candidate microscopic mechanism. Landau had a third path — a phenomenological quantum hydrodynamics with a chosen spectrum and an explicit rejection of London. The next fifteen years were spent collapsing the trio into something coherent, and the order of collapses matters.\n\n### Landau over Tisza, but only on the microscopics\n\nTisza's two-fluid bookkeeping survived intact: $\\rho = \\rho_n + \\rho_s$, two velocity fields, only the superfluid carries no entropy. Tisza identified $\\rho_s$ with the condensate. Landau (1941) [20] refused this. He built the spectrum first — quantum hydrodynamics with longitudinal phonons and a second, gapped roton branch — and identified $\\rho_n$ with the thermal population of these excitations. The low-T scaling $\\rho_n \\propto T^4$ is a phonon Stefan–Boltzmann result; it is not derivable from London's ideal-BEC counting, which gives $\\rho_n \\propto T^{3/2}$. The Andronikashvili torsion-pendulum measurement (1946, verify) settled the question: $\\rho_n(T)$ tracks Landau, not London. The exchange in Phys. Rev. 75 [26, 27] is the polite endpoint — Landau conceding the hydrodynamics, Tisza conceding the dispersion. The bookkeeping is Tisza's; the carriers are Landau's.\n\n### Bogoliubov closes the London gap\n\nLondon's 1938 BEC identification was qualitatively right but technically embarrassing: the ideal-gas Landau criterion gives $v_c = \\min(\\varepsilon/p) = 0$ for $\\varepsilon = p^2/2m$, so an ideal BEC cannot be superfluid in Landau's own sense. Bogoliubov (1947) [73] resolved this with the first interacting-Bose-gas calculation. The canonical transformation that bears his name diagonalises the quadratic Hamiltonian into quasiparticles with\n\n$$\\varepsilon(p) = \\sqrt{\\left(\\frac{p^2}{2m}\\right)^2 + c^2 p^2}, \\qquad c = \\sqrt{n_0 g/m},$$\n\nlinear at small $p$ and free-particle-like at large $p$. The phonon branch is now microscopic, not postulated. Landau's spectrum sits on a Bose-gas foundation; London's mechanism survives in the form Bogoliubov gave it — not as a textbook BEC, but as a strongly depleted condensate of order 10% at $T=0$.\n\n### Penrose–Onsager: ODLRO as the rigorous order parameter\n\nThe cleanest reformulation came from Penrose and Onsager [76]. Forget the condensate of an ideal gas; ask instead about the one-body reduced density matrix\n\n$$\\rho_1(\\mathbf{r},\\mathbf{r}') = \\langle \\hat\\psi^\\dagger(\\mathbf{r})\\hat\\psi(\\mathbf{r}')\\rangle.$$\n\nIn a normal fluid $\\rho_1$ decays to zero as $|\\mathbf{r}-\\mathbf{r}'| \\to \\infty$. In a superfluid it tends to a finite asymptote $\\varphi^*(\\mathbf{r})\\varphi(\\mathbf{r}')$ — *off-diagonal long-range order*. The condensate fraction $n_0/n$ is the asymptote, the macroscopic wavefunction $\\varphi(\\mathbf{r})$ its phase, and superflow the gradient of that phase. ODLRO survives interactions, finite temperature, and a strongly depleted condensate; it is the order parameter London should have written and could not.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eODLRO in normal vs superfluid one-body density matrix\u003c/title\u003e\u003cline x1=\"80\" y1=\"340\" x2=\"680\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"80\" y1=\"60\" x2=\"80\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"380\" y=\"385\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003eseparation |r − r'|\u003c/text\u003e\u003ctext x=\"30\" y=\"200\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" transform=\"rotate(-90 30 200)\"\u003eρ₁(r, r')\u003c/text\u003e\u003cline x1=\"76\" y1=\"80\" x2=\"84\" y2=\"80\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"68\" y=\"84\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003en\u003c/text\u003e\u003cline x1=\"76\" y1=\"200\" x2=\"84\" y2=\"200\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"68\" y=\"204\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003en₀\u003c/text\u003e\u003cline x1=\"80\" y1=\"200\" x2=\"680\" y2=\"200\" stroke=\"#7ee0a3\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/\u003e\u003cpath d=\"M80 80 Q 150 130 230 185 Q 360 205 680 202\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"430\" y=\"180\" fill=\"#7ee0a3\" font-size=\"15\"\u003esuperfluid:  ρ₁ → n₀ \u0026gt; 0   (ODLRO)\u003c/text\u003e\u003cpath d=\"M80 80 Q 130 210 210 295 Q 320 336 680 339\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"430\" y=\"320\" fill=\"#ff7a90\" font-size=\"15\"\u003enormal:  ρ₁ → 0\u003c/text\u003e\u003ctext x=\"180\" y=\"100\" fill=\"#ffb86b\" font-size=\"14\"\u003eshort-range correlations\u003c/text\u003e\u003cline x1=\"175\" y1=\"108\" x2=\"155\" y2=\"130\" stroke=\"#ffb86b\" stroke-width=\"1\"/\u003e\u003ctext x=\"380\" y=\"40\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\"\u003ePenrose–Onsager criterion (1956)\u003c/text\u003e\u003c/svg\u003e\n*Figure: The off-diagonal element of the one-body density matrix decays from $n$ at coincidence to a finite $n_0 \u003e 0$ at infinity in a superfluid; the condensate fraction is the asymptote, not the whole density. In He II at $T=0$, $n_0/n \\approx 0.07$–$0.10$ (neutron measurements, verify).*\n\n### Fermions enter: ODLRO of order two and a matrix order parameter\n\nFor ³He the order parameter cannot live in $\\rho_1$ — antisymmetry forbids macroscopic occupation of any one-fermion state. Yang's extension (1962, verify) places ODLRO in the *two-body* density matrix $\\rho_2$; the asymptote is a pair amplitude $\\Delta_{\\alpha\\beta}(\\mathbf{r}_1,\\mathbf{r}_2)$. For p-wave, spin-triplet pairing this is a $3\\times 3$ complex matrix $A_{\\mu i}$ with $\\mu$ a spin and $i$ an orbital index. The Anderson–Brinkman–Morel (ABM) state takes $A_{\\mu i}= \\Delta_0\\, \\hat d_\\mu (\\hat m_i + i\\hat n_i)$ — equal-spin pairing with two point nodes; the Balian–Werthamer (BW) state takes $A_{\\mu i} = \\Delta_0\\, R_{\\mu i}$ with $R\\in SO(3)$ — an isotropic gap magnitude carrying a spin–orbit texture [79]. London's \"macroscopic wavefunction\" survives as a tensorial object; Tisza's bookkeeping survives but with anisotropic superfluid-density tensors $\\rho_{s,\\parallel}$, $\\rho_{s,\\perp}$. Penrose–Onsager logic is unchanged; only the rank of the order parameter is."}, {"id": "live-confusions", "title": "Live Confusions in the Modern Literature: Five Equations With Stripped Assumptions", "markdown": "## Live Confusions in the Modern Literature: Five Equations With Stripped Assumptions\n\nFive equations circulate in the modern He II / cold-atom literature with their assumptions quietly stripped. Each is correct in a regime; each is routinely cited outside it.\n\n### C1. \"The two-fluid model is Landau's\"\n\nThe bookkeeping\n$$\\rho = \\rho_n + \\rho_s,\\qquad \\mathbf{j} = \\rho_n \\mathbf{v}_n + \\rho_s \\mathbf{v}_s,\\qquad s = (\\rho_n / \\rho)\\, s_n$$\ntogether with the second-sound wave equation\n$$\\partial_t^2 \\delta T - \\frac{\\rho_s}{\\rho_n}\\frac{s^2}{c_v}\\,\\nabla^2 \\delta T = 0$$\nis Tisza 1938 [18, 72], not Landau 1941 [20]. Landau supplied a *different* microscopic identification of $\\rho_n$ — a gas of phonons and rotons giving $\\rho_n \\propto T^4$ at low $T$ — and explicitly rejected Tisza's BEC underpinning. The Tisza ↔ Landau exchange in *Phys. Rev.* 75, 884 / 885 [26, 27] is the unambiguous priority-restoration; Tisza's two-fluid equations are valid below $T_\\lambda$ for $v_n,v_s \\ll c_1$, Landau's identification of $\\rho_n$ is valid only for $T \\lesssim 0.6$ K where rotons are exponentially suppressed.\n\n### C2. \"BEC implies superfluidity\"\n\nThe London 1938 identification [71] is qualitatively right and quantitatively insufficient. For the *ideal* Bose gas the dispersion is $\\varepsilon(p)=p^2/2m$, so the Landau criterion gives\n$$v_c \\;=\\; \\min_p\\frac{\\varepsilon(p)}{p} \\;=\\; 0.$$\nAn ideal BEC is not a superfluid. The repair has two pieces: Bogoliubov's interacting spectrum [73],\n$$\\varepsilon(p)=\\sqrt{\\left(\\tfrac{p^2}{2m}\\right)^2 + c^2 p^2},\\qquad c=\\sqrt{n_0 U_0/m},$$\nwhich is linear at small $p$ and gives $v_c=c\u003e0$; and Penrose–Onsager off-diagonal long-range order [76],\n$$\\lim_{|\\mathbf r-\\mathbf r'|\\to\\infty}\\rho_1(\\mathbf r,\\mathbf r')=\\psi^*(\\mathbf r)\\psi(\\mathbf r')\\neq 0,$$\nwhich is the rigorous link between condensation and superflow. In He II the condensate fraction is $\\sim 7\\%$ (verify), yet $\\rho_s/\\rho \\to 1$ at $T\\to 0$: the macroscopically occupied mode is not the superfluid density.\n\n### C3. \"Superflow is irrotational because $\\nabla\\times\\mathbf{v}_s=0$\"\n\n$\\mathbf{v}_s = (\\hbar/m)\\nabla\\varphi$ implies $\\nabla\\times\\mathbf{v}_s=0$ *only on simply connected domains*. Single-valuedness of $\\psi$ on a non-contractible loop gives the Onsager–Feynman quantization\n$$\\oint \\mathbf{v}_s\\cdot d\\boldsymbol\\ell \\;=\\; \\frac{h}{m_4}\\,n,\\qquad n\\in\\mathbb{Z},$$\nstated by Onsager in a one-paragraph remark at Como [74] and worked out by Feynman [42, 75]. Vinen detected the $n=1$ quantum in rotating He II [77]. Under rotation $\\Omega$ the equilibrium is a triangular lattice of singly-quantized lines with areal density $n_v=2\\Omega m/h$ (Feynman rule); on coarse-grained scales $\\langle\\nabla\\times\\mathbf v_s\\rangle=2\\boldsymbol\\Omega$, mimicking solid-body rotation. The textbook \"irrotational\" statement holds only between vortex cores.\n\n### C4. \"Landau critical velocity $v_c\\simeq 60$ m/s\"\n\nUsing the measured roton minimum, the Landau criterion gives\n$$v_c=\\min_p\\frac{\\varepsilon(p)}{p}\\approx \\frac{\\Delta_{\\rm rot}}{p_{\\rm rot}}\\simeq 58\\text{ m/s}.$$\nIon-mobility, oscillating-wire and orifice experiments find the breakdown velocity two to three orders of magnitude smaller, typically $0.1$–$1$ cm/s in bulk, set by *vortex nucleation* (Iordanskii 1965; Langer–Fisher 1967; Volovik [65]). The roton ceiling is recovered only in negative-ion experiments at high pressure where the nucleation barrier is suppressed. The Landau $v_c$ is a thermodynamic upper bound on dissipationless flow, not the experimental onset; quoting it as the latter is a category error endemic to introductory texts.\n\n### C5. \"He II has zero viscosity\"\n\nKapitza's capillary [16] and the Allen–Misener slit [15] measure an effective $\\eta\\to 0$ because the superfluid component slips with $\\mathbf v_s$. Andronikashvili's torsional-pendulum (1946) measures a *finite* $\\eta_n$ of the normal component and was the first direct determination of $\\rho_n(T)/\\rho$, confirming Landau's $T^4$ phonon prediction. The two results are reconciled by the two-fluid stress\n$$\\sigma_{ij}=-p\\,\\delta_{ij}+\\eta_n\\!\\left(\\partial_i v_{n,j}+\\partial_j v_{n,i}-\\tfrac{2}{3}\\delta_{ij}\\nabla\\!\\cdot\\!\\mathbf v_n\\right);$$\n$\\rho_s$ carries no viscous stress, $\\rho_n$ does. The Kapitza ↔ Mendelssohn debate of 1939–47 [16, 24, 28] is precisely about which experiment measures which component. The slogan \"He II is inviscid\" applies to $\\rho_s$ alone and only outside the vortex-nucleation regime of C4."}, {"id": "current-frontier", "title": "Current Frontier: Supersolidity, Dipolar and Moiré Superfluids, and the ³He Cosmology Analogue", "markdown": "## Current Frontier: Supersolidity, Dipolar and Moiré Superfluids, and the ³He Cosmology Analogue\n\nFive threads are active; their ratios of established to contested are very different.\n\n### Supersolids: ⁴He is out, dipolar BECs are in\n\nThe 2004 Kim–Chan torsional-oscillator signature of supersolid solid ⁴He is no longer accepted. Chan and D. Kim repeated the experiment with a cell engineered to exclude bulk ⁴He outside the Vycor matrix; the period drop vanished, and the residual signal in earlier cells is now ascribed to a Day–Beamish shear-modulus stiffening of the surrounding solid, not a superflow component ([Physics World](https://physicsworld.com/a/moses-chan-backtracks-on-search-for-supersolids/)). Bulk ⁴He does not appear to support a supersolid phase.\n\nThe role has passed to strongly dipolar Bose condensates near $a_s \\approx a_{dd}$. The roton minimum softens, crystallisation sets in along one axis, and global phase coherence survives — simultaneous breaking of $U(1)$ and translation, with the predicted low-energy crystalline Goldstone branch observed in trapped Dy and Er. 1D droplet arrays were established by 2019; a 2D droplet array followed in 2021; a 2D *stripe* supersolid in Er was reported by tilting the dipole axis to select an anisotropic roton ([arXiv:2512.13280](https://arxiv.org/abs/2512.13280)). Quantised vortices were imaged inside the supersolid in 2024 ([Innsbruck press release](https://www.uibk.ac.at/en/newsroom/2024/quantum-vortices-confirm-superfluidity-in-supersolid/)), settling that the superfluid component is genuine and not a fragmented condensate.\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDispersion and density across the dipolar BEC supersolid transition\u003c/title\u003e\u003ctext x=\"360\" y=\"18\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eRoton softening across the dipolar BEC ground states\u003c/text\u003e\u003ctext x=\"130\" y=\"40\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eUniform superfluid\u003c/text\u003e\u003ctext x=\"360\" y=\"40\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\"\u003eSupersolid stripe\u003c/text\u003e\u003ctext x=\"590\" y=\"40\" fill=\"#ff7a90\" font-size=\"14\" text-anchor=\"middle\"\u003eDroplet array\u003c/text\u003e\u003cline x1=\"40\" y1=\"160\" x2=\"220\" y2=\"160\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"40\" y1=\"160\" x2=\"40\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"38\" y=\"58\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eω\u003c/text\u003e\u003ctext x=\"220\" y=\"178\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ek\u003c/text\u003e\u003cpath d=\"M 40 160 Q 70 110 130 90 Q 180 80 220 78\" stroke=\"#7aa2ff\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ctext x=\"130\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003elinear phonon, no roton dip\u003c/text\u003e\u003cline x1=\"270\" y1=\"160\" x2=\"450\" y2=\"160\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"270\" y1=\"160\" x2=\"270\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"268\" y=\"58\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eω\u003c/text\u003e\u003ctext x=\"450\" y=\"178\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ek\u003c/text\u003e\u003cpath d=\"M 270 160 Q 290 130 320 100 Q 350 80 365 158 Q 380 80 400 80 Q 420 75 450 70\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\"/\u003e\u003ccircle cx=\"365\" cy=\"158\" r=\"3\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"365\" y=\"200\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\"\u003eroton → 0: crystal Goldstone emerges\u003c/text\u003e\u003cline x1=\"500\" y1=\"160\" x2=\"680\" y2=\"160\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"500\" y1=\"160\" x2=\"500\" y2=\"60\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"498\" y=\"58\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eω\u003c/text\u003e\u003ctext x=\"680\" y=\"178\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ek\u003c/text\u003e\u003cline x1=\"500\" y1=\"105\" x2=\"680\" y2=\"105\" stroke=\"#ff7a90\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"590\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003egapped: no global U(1) Goldstone\u003c/text\u003e\u003cline x1=\"40\" y1=\"320\" x2=\"220\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"40\" y1=\"320\" x2=\"40\" y2=\"225\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"38\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003en(x)\u003c/text\u003e\u003ctext x=\"220\" y=\"338\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ex\u003c/text\u003e\u003cline x1=\"40\" y1=\"270\" x2=\"220\" y2=\"270\" stroke=\"#7aa2ff\" stroke-width=\"2\"/\u003e\u003cline x1=\"270\" y1=\"320\" x2=\"450\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"270\" y1=\"320\" x2=\"270\" y2=\"225\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"268\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003en(x)\u003c/text\u003e\u003ctext x=\"450\" y=\"338\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ex\u003c/text\u003e\u003cpath d=\"M 270 270 Q 285 240 300 270 Q 315 300 330 270 Q 345 240 360 270 Q 375 300 390 270 Q 405 240 420 270 Q 435 300 450 270\" stroke=\"#ffb86b\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cline x1=\"500\" y1=\"320\" x2=\"680\" y2=\"320\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cline x1=\"500\" y1=\"320\" x2=\"500\" y2=\"225\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"498\" y=\"222\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003en(x)\u003c/text\u003e\u003ctext x=\"680\" y=\"338\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003ex\u003c/text\u003e\u003cpath d=\"M 500 320 L 515 320 L 520 240 L 525 320 L 545 320 L 550 240 L 555 320 L 575 320 L 580 240 L 585 320 L 605 320 L 610 240 L 615 320 L 635 320 L 640 240 L 645 320 L 665 320 L 670 240 L 675 320 L 680 320\" stroke=\"#ff7a90\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cline x1=\"40\" y1=\"370\" x2=\"690\" y2=\"370\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003cpolygon points=\"690,370 680,365 680,375\" fill=\"#e8e6e1\"/\u003e\u003ctext x=\"360\" y=\"392\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003edecreasing a_s / a_dd  (stronger relative dipolar interaction)\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Roton softening connects the uniform dipolar superfluid to the stripe supersolid and onward to the incoherent droplet array. The middle column carries the diagnostic feature — a roton mode driven to zero produces a second gapless Goldstone branch (crystal phonon) coexisting with the long-wavelength superfluid phonon.*\n\n### Moiré and exciton superfluids: confirmed but limited\n\nInterlayer-exciton condensates in graphene bilayers and TMD heterostructures show counterflow superfluidity and quantised Hall drag at matched filling. The condensate is composite-boson and survives only at cryogenic temperatures, contrary to the original room-temperature-superfluid proposal of double-bilayer-graphene [69]. In moiré flat-band superconductors descended from magic-angle bilayer graphene [46], superconductivity is established but the order-parameter symmetry — chiral $d\\pm id$, nematic $d$, or topological $p+ip$ — remains contested. This is the Fermi-side ambiguity that haunted Sr₂RuO₄ for two decades and is still not phase-sensitively settled in moiré.\n\n### Open: p-wave from spin-polarised cold atoms\n\nA spin-polarised single-species Fermi gas in a p-wave superfluid state remains the longest-outstanding missing entry. P-wave Feshbach molecules suffer inelastic atom–molecule and molecule–molecule loss with lifetimes ~10–20 ms, and no equilibrium p-wave superfluid has been reported in cold atoms (verify). Until this is closed, the only realised p-wave matrix order parameter is the one Leggett wrote down for ³He [79].\n\n### Volovik's program: solid core, soft periphery\n\nHelsinki (ROTA) and Grenoble demonstrated Kibble–Zurek defect formation in neutron-irradiated ³He-B in the 1990s; 2021 experiments tested suppression of the KZ scaling under a symmetry-violating bias. The A↔B transition as a cosmological-vacuum analogue, the skyrmion/Q-ball catalogue, and the Weyl-fermion structure of A-phase nodes are firm consequences of the ³He order-parameter manifold and form the load-bearing core of [65]. The looser claims — ³He as a literal model for baryogenesis or for the chiral anomaly producing charge in the early universe — are analogies in the precise mathematical sense (identical equations, different physical content) and should be read as such.\n\n### Vortex reconnection and the dual cascade\n\nTwo distinct turbulent regimes in He II are confirmed: Vinen (ultraquantum) turbulence with no inertial range, and quasi-classical Kolmogorov turbulence with a $k^{-5/3}$ inertial range above the inter-vortex spacing $\\ell$ and a Kelvin-wave cascade below it [82]. The recent surprise: single-reconnection visualisation now shows time-irreversibility — post-reconnection separation is faster than pre-reconnection approach ([PNAS 2025](https://www.pnas.org/doi/10.1073/pnas.2426064122)). The textbook assumption of a locally time-symmetric reconnection is therefore wrong, and the dissipation budget bridging the two cascades has not yet absorbed this correction.\n\n### Where verification is moving\n\nThe cleanest remaining test in the dipolar program is a direct measurement of the superfluid fraction against Leggett's bound, $f_s \\le 1/\\!\\left(\\overline{n}\\,\\overline{1/n}\\right)$, inside the modulated state. For moiré superconductors it is a phase-sensitive Josephson geometry separating chiral from nematic order. For the ³He analogue program it is the lifetime of spin-texture defects under controlled symmetry bias. None of the three is settled, and on the current trajectory the dipolar question will close first."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have read this dossier as both a historian and a working theorist. What follows is what I would say at a seminar, with a glass in hand, if asked to stop being even-handed.\n\n### (a) What I will defend with my reputation\n\nThe **Penrose–Onsager ODLRO criterion** [56] is the only definition of \"superfluid order\" that survives every regime change of the last seventy years — neutral, charged, bosonic, fermionic-paired, lattice, continuum. It is the load-bearing concept; the rest is bookkeeping. Closely behind it I will defend the **Bogoliubov 1947 spectrum** [13] as the *minimal* mechanism that converts BEC into superfluidity by lifting $\\varepsilon(p)/p$ off zero. I will defend **Onsager's 1949 circulation quantum** $\\kappa = h/m$ [44] as the most under-credited single line in the field, and I will defend the historical record that **Tisza, not Landau, wrote the two-fluid equations** [25,26]. On the experimental side, **Andronikashvili's torsion-pendulum measurement of $\\rho_n(T)$** [22] is, to my mind, the cleanest demonstration that the two-fluid decomposition is physical and not a calculational fiction.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely smuggled past the reader.\n\n1. **The phonon–roton dispersion is treated as fundamental** when it is in fact a *single-mode approximation* — the Feynman–Cohen ansatz [33] with backflow, calibrated against neutron scattering [31]. The roton minimum is a many-body resonance, not an elementary excitation in the QFT sense. Modern DMC results [62] show the single-mode picture loses 15–20% of the spectral weight near the roton; textbooks rarely mention this.\n2. **The Landau critical velocity is presented as a prediction** when it is a thermodynamic upper bound. The observed onset is set by **vortex nucleation** (Iordanskii / Langer–Fisher / Volovik [49,50]) and depends on geometry, surface roughness, and temperature in ways no closed-form theory captures. Calling the measured $v_c$ \"Landau-like\" is sociology, not physics.\n3. **The two-fluid decomposition is Galilean-frame-dependent**, a point Khalatnikov [27] is explicit about but most users forget. $\\rho_s$ and $\\rho_n$ are *defined* by the response to a slowly moving wall; they are not the densities of two physically separable populations. This is exactly where supersolid claims get into trouble.\n\nA fourth, milder caveat: the dipolar-BEC \"supersolid\" literature [70,71] has imported the word *supersolid* with its He-II baggage. The droplet-array states satisfy ODLRO and discrete translation breaking, but the **NCRI fraction** [69] in those systems has not been measured to the standard the Kim–Chan retraction [68] taught us to demand.\n\n### (c) Three open questions I would actually work on\n\n1. **A first-principles calculation of vortex-nucleation rates in He II at the roughness scale of real capillaries.** — This is the gap between Landau's $v_c$ and every experiment ever done; it is sixty years overdue and now numerically tractable.\n2. **An unambiguous NCRI measurement in a 2D dipolar supersolid, with the Leggett bound [69] as the benchmark.** — Until this exists, \"supersolid\" is a spectroscopic claim, not a mechanical one.\n3. **Whether the ³He-B surface Majorana cone [65] survives realistic disorder at the silver-sinter interface.** — The cosmological analogue is beautiful; the condensed-matter question is whether the topology is robust enough to *use*.\n\n### (d) Reading path\n\n1. **London 1938** [9] — read first for the question, not the answer; it sets the BEC framing every later paper either extends or rejects.\n2. **Tisza 1938** [25] — the actual two-fluid equations, in their original form, before Landau's reframing overwrote them.\n3. **Landau 1941** [26] — the rival microscopic picture; read immediately after Tisza so the disagreement is visible.\n4. **Penrose \u0026 Onsager 1956** [56] — the definition that retired the priority dispute by making both pictures special cases of ODLRO.\n5. **Volovik, *The Universe in a Helium Droplet*** [65] — where the field actually lives now: topology, broken symmetries, and the ³He phases as a laboratory for relativistic vacua."}], "references": [{"n": 1, "title": "The intra-mercurial planet", "authors": [], "year": 1873, "venue": "Journal of the Franklin Institute", "url": "https://doi.org/10.1016/0016-0032(73)90706-0", "cited_by": 0, "bucket": "earliest"}, {"n": 2, "title": "Item Unavailable", "authors": ["Simon Catterall", "Roni Harnik", "Veronika E. Hubeny", "C. Bauer", "Asher Berlin", "Zohreh Davoudi"], "year": 1900, "venue": "", "url": "https://doi.org/10.2172/1892238", "cited_by": 10, "bucket": "earliest"}, {"n": 3, "title": "High Temperature Superconductors and Other Superfluids", "authors": ["A. S. Alexandrov", "Sir Nevill Mott"], "year": 1900, "venue": "", "url": "https://doi.org/10.4324/9780203211496", "cited_by": 79, "bucket": "earliest"}, {"n": 4, "title": "Precipitin Antisera and their Standardisation", "authors": ["David A. Welsh", "H. G. Chapman"], "year": 1906, "venue": "Journal of Hygiene", "url": "https://doi.org/10.1017/s0022172400002916", "cited_by": 4, "bucket": "earliest"}, {"n": 5, "title": "On the weight of precipitum obtainable in precipitin interactions with small weights of homologous protein", "auth <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var als=(D.aliases||[]).filter(function(a){return a && a.toLowerCase()!==(D.topic||'').toLowerCase();});
  var aka='<div class="aka"><span class="lbl">Subject</span><i class="subj">'+esc(D.topic)+'</i>'+(als.length?'<span class="lbl">also</span>'+als.map(function(a){return '<i>'+esc(a)+'</i>';}).join(''):'')+'</div>';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+
    D.sections.map(function(s){return '<a href="#sec-'+esc(s.id)+'">'+esc(s.title.replace(/^#+\s*/,''))+'</a>';}).join('')+'</nav>';
  var body=D.sections.map(function(s){
    var cls='sec'+(s.id==='verdict'?' verdict':'');
    return '<section class="'+cls+'" id="sec-'+esc(s.id)+'"><div class="prose">'+renderRich(s.markdown,nRefs)+'</div></section>';
  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+
      D.neglected.map(function(n){return '<div class="ncard"><div class="nm">'+esc(n.name)+'</div><div class="ro">'+esc(n.role)+'</div>'+(n.evidence?'<div class="ev">'+esc(n.evidence)+'</div>':'')+'</div>';}).join('')+'</div>';
    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
