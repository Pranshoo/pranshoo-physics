 H. I. S. Ferguson", "work": "Nature 178, 481 (1956)", "kind": "observation", "ref": null}, {"year": 1956, "event": "Purcell's one-page rebuttal interprets HBT as Bose bunching of degenerate-mode photons and shows the Brannen–Ferguson SNR was a factor ~10⁸ short — settles the dispute in principle", "who": "E. M. Purcell", "work": "Nature 178, 1449 (1956)", "kind": "theory", "ref": null}, {"year": 1957, "event": "Twiss, Little \u0026 Hanbury Brown answer Brannen–Ferguson experimentally with a coincidence-counting confirmation; companion full theory in Proc. Roy. Soc. A 242, 300 (1957) and A 243, 291 (1957)", "who": "R. Q. Twiss, A. G. Little, R. Hanbury Brown", "work": "Nature 180, 324 (1957)", "kind": "observation", "ref": null}, {"year": 1959, "event": "First report of like-sign pion enhancement at small relative momentum in p̄p annihilation (the proto-GGLP)", "who": "G. Goldhaber, W. B. Fowler, S. Goldhaber, T. F. Hoang, T. E. Kalogeropoulos, W. M. Powell", "work": "Phys. Rev. Lett. 3, 181 (1959)", "kind": "observation", "ref": 24}, {"year": 1960, "event": "Full GGLP analysis: identical-pion enhancement explained by symmetrisation of the multi-π wavefunction — HBT/Bose–Einstein correlations enter hadron physics", "who": "G. Goldhaber, S. Goldhaber, W.-Y. Lee, A. Pais", "work": "Phys. Rev. 120, 300 (1960)", "kind": "theory", "ref": null}, {"year": 1963, "event": "Quantum theory of optical coherence: P(α) representation, normal-ordered g^(n)(τ) hierarchy; HBT is reread as g^(2)(0)=2 for chaotic, =1 for coherent fields", "who": "R. J. Glauber", "work": "Phys. Rev. Lett. 10, 84 (1963); Phys. Rev. 130, 2529 and 131, 2766 (1963)", "kind": "formalization", "ref": null}, {"year": 1972, "event": "Hadron HBT formalised for the geometry/lifetime of an emitting fireball; provides the template for all subsequent heavy-ion 'femtoscopy'", "who": "G. I. Kopylov \u0026 M. I. Podgoretskiĭ", "work": "Sov. J. Nucl. Phys. 15, 219 (1972); ibid. 18, 336 (1974)", "kind": "theory", "ref": null}, {"year": 1974, "event": "Narrabri Stellar Intensity Interferometer (188 m maximum baseline) completes the 32-star main-sequence diameter survey — definitive proof of HBT as production astronomy", "who": "R. Hanbury Brown, J. Davis, L. R. Allen and collaborators (Sydney)", "work": "Hanbury Brown, The Intensity Interferometer (Taylor \u0026 Francis 1974); MNRAS 167, 121 (1974)", "kind": "observation", "ref": null}, {"year": 1977, "event": "Photon antibunching in resonance fluorescence of single Na atoms: g^(2)(0)\u003c1, the first experimentally manifestly nonclassical light — HBT becomes the operational test for 'single emitter'", "who": "H. J. Kimble, M. Dagenais, L. Mandel", "work": "Phys. Rev. Lett. 39, 691 (1977)", "kind": "observation", "ref": null}], "neglected": [{"name": "R. C. Jennison and M. K. Das Gupta", "role": "Built and ran the original 1952 radio intensity interferometer at Jodrell Bank as Hanbury Brown's PhD students; Jennison went on to invent the closure-phase technique (1958) that now underpins all modern aperture-synthesis imaging. Their names rarely appear in optics-textbook accounts of 'HBT'.", "evidence": "Jennison \u0026 Das Gupta, Phil. Mag. 44, 65 (1953); Jennison, MNRAS 118, 276 (1958); acknowledged in Hanbury Brown's Australian Academy biographical memoir", "ref": null}, {"name": "A. T. Forrester, R. A. Gudmundsen, P. O. Johnson", "role": "Demonstrated photoelectric beating of Zeeman components of incoherent light in 1955 — independent optical evidence that intensity-level mixing of incoherent fields was already a real laboratory phenomenon before HBT's optical paper. Almost never cited in the HBT origin story.", "evidence": "Phys. Rev. 99, 1691 (1955); Forrester's 1961 review J. Opt. Soc. Am. 51, 253; cited in Mandel \u0026 Wolf, Optical Coherence and Quantum Optics, §1.4", "ref": null}, {"name": "A. G. Little", "role": "Co-author on the 1957 Twiss–Little–Hanbury Brown response to Brannen \u0026 Ferguson and lead engineer on the Narrabri instrumentation; his name is consistently dropped when the controversy is retold", "evidence": "Nature 180, 324 (1957); Sydney University historical accounts (arXiv:0905.1749)", "ref": null}, {"name": "G. I. Kopylov and M. I. Podgoretskiĭ", "role": "Wrote the foundational theory of identical-particle interferometry for high-energy collisions (1972–1974) — the basis of every heavy-ion HBT/femtoscopy paper since. Western nuclear-physics reviews often credit only GGLP and skip the Russian formalism that actually underlies the modern fits.", "evidence": "Sov. J. Nucl. Phys. 15, 219 (1972); 18, 336 (1974); credited in Boal–Gelbke–Jennings Rev. Mod. Phys. 62, 553 (1990) [52] and Baym nucl-th/9804026 [69]", "ref": 52}, {"name": "Ádám, Jánossy \u0026 Varga", "role": "Hungarian null experiment of 1955 that Brannen \u0026 Ferguson cited against HBT; it was correct as performed but its sensitivity was many orders of magnitude below what bunching requires — the episode is usually told as a foil rather than as a careful experiment whose lesson was 'mode degeneracy matters'", "evidence": "Ann. Phys. (Leipzig) 16, 408 (1955); Varró review arXiv:0707.1305", "ref": null}], "conflations": [{"claim": "'g^(2)(0)\u003c1 ⇒ single-photon source / quantum light'", "clarification": "g^(2)(0)\u003c1 is a necessary but not sufficient condition for nonclassicality, and only the *background-, dark-count-, multi-emitter- and detector-jitter-corrected* g^(2)(0) is meaningful. A finite IRF convolves the true δ-function antibunching dip, so a measured raw g^(2)(0)≈0.4 from a noisy NV centre can correspond to a true value ≪ 0.05 — or, conversely, to two emitters when uncorrected. The threshold 0.5 separates 1-emitter from 2-emitter Fock content only under specific assumptions (single mode, Poissonian background, perfectly resolved zero delay)."}, {"claim": "'g^(2)(0) \u003e 1 ⇒ thermal/chaotic light'", "clarification": "The Siegert relation g^(2)(τ) = 1 + |g^(1)(τ)|² which gives g^(2)(0) = 2 holds only for stationary, ergodic, zero-mean Gaussian fields. Super-Poissonian g^(2)(0) up to N+1 occurs for thermal-state Fock mixtures, and values g^(2)(0) ≫ 2 are routine for non-Gaussian/non-stationary sources (rogue waves, blinking emitters, cascaded SPDC, supercontinuum) — none of which are 'thermal'."}, {"claim": "'HBT proved photon bunching is quantum'", "clarification": "HBT is fully reproduced by classical stochastic electrodynamics — Purcell, Mandel and Wolf showed this explicitly. The quantum content of optical g^(2) experiments lies in *antibunching* (Kimble–Dagenais–Mandel 1977) and in two-photon interference of indistinguishable single photons (Hong–Ou–Mandel 1987), neither of which the original HBT setup exhibited."}, {"claim": "'Coherent' meant the same thing to HBT and to Glauber", "clarification": "Hanbury Brown \u0026 Twiss used 'coherent' in its pre-1963 optics sense — monochromatic / mutually phase-locked first-order field. Glauber redefined 'fully coherent' to mean factorisation of all g^(n), i.e. an eigenstate of the positive-frequency field operator (a coherent state |α⟩). A laser is 'incoherent' in the HBT first-order sense above threshold only via phase diffusion, and 'fully coherent' in the Glauber sense — the apparent contradiction in old papers is purely terminological."}, {"claim": "'GGLP / heavy-ion HBT measures the size of the fireball'", "clarification": "It measures a *homogeneity length* (HBT radius R_side, R_out, R_long) — the region from which particles with a given momentum are emitted, weighted by the source's space-momentum correlations. Expanding sources give R_HBT \u003c R_geometric, and R_out² − R_side² encodes the emission duration. Equating R_HBT to a fireball radius is one of the most persistent abuses in the heavy-ion literature."}, {"claim": "'Photon bunching at the beamsplitter is two-photon interference (à la HOM)'", "clarification": "HBT bunching of thermal light is a *first-order* intensity correlation that survives if the photons are spectrally distinguishable, polarisation-orthogonal, or even from independent thermal modes — it is essentially classical wave-fluctuation correlation. Hong–Ou–Mandel dip requires genuine two-photon path indistinguishability and number-state inputs; the two phenomena are routinely conflated under 'two-photon interference'."}], "sections": [{"id": "why-this-mattered", "title": "Why This Mattered: Phase-Killing the Ionosphere, Then the Atmosphere", "markdown": "## Why This Mattered: Phase-Killing the Ionosphere, Then the Atmosphere\n\n### The Jodrell Bank problem (1949–1952)\n\nBy 1949 Hanbury Brown wanted angular sizes for the two brightest cosmic radio sources, Cygnus A and Cassiopeia A. The textbook tool — a Michelson amplitude interferometer at 125 MHz — was hopeless: the required baselines (kilometres, in units of $\\lambda \\approx 2.4\\,\\text{m}$) demanded that the *phase* of the incoming field be preserved across the array, and the ionosphere refused to oblige. Travelling ionospheric disturbances modulate path length on second-to-minute scales, so fringe visibility washes out before a usable integration can be assembled.\n\nHanbury Brown's move was to abandon phase. If two antennas square-law detect the field and send the *low-frequency envelope* down a cable to a multiplier, the cross-correlation depends only on the second-order coherence $\\Gamma^{(2)}(\\mathbf{r}_1,\\mathbf{r}_2;\\tau)$ of the field, not on its phase. The Van Cittert–Zernike theorem applied at the *intensity* level still maps source brightness onto a baseline-dependent visibility; ionospheric phase noise contributes equal random phases to the two channels and cancels in the modulus. *The phase-stability budget of the array now belongs to the post-detector electronics, not to the sky.*\n\nThe radio demonstration was carried out in 1952 by Hanbury Brown's PhD students R. C. Jennison and M. K. Das Gupta, using two 500 m² broadside arrays at 125 MHz, and reported in [Nature **172**, 996 (1953)](https://www.nature.com/articles/172996a0). They resolved Cygnus A into a *two-component* source — the first detection of the double radio structure now diagnostic of FR-II AGN — and bounded Cassiopeia A. Jennison went on to invent closure phase (MNRAS **118**, 276, 1958), the trick underwriting every modern aperture-synthesis image from VLBI to the EHT. Telling \"HBT\" as a two-name story writes Jennison and Das Gupta out of the only apparatus that actually ran in 1952.\n\n### The classical-wave theory and the optical leap (1954–1956)\n\nThe 1954 paper [71] formalised the device as a classical-wave effect: for a chaotic source the joint intensity satisfies the *Siegert relation*,\n$$\\langle I_1(t)\\, I_2(t+\\tau)\\rangle = \\langle I_1\\rangle\\langle I_2\\rangle\\!\\left(1 + |\\gamma^{(1)}(\\mathbf{r}_1,\\mathbf{r}_2;\\tau)|^{2}\\right),$$\nwith $\\gamma^{(1)}$ the first-order (field) coherence function. The same paper showed the optical extension was within reach provided the post-photodetection degeneracy parameter $\\delta = n_{\\text{photons per mode}}$ was not catastrophically small.\n\nThe tabletop check followed within months. In the canonical mercury-arc experiment [1], Hanbury Brown and Twiss split the 435.8 nm Hg line on a beamsplitter, fed two PMTs, and recovered a positive shot-noise cross-correlation over a window $\\tau\\lesssim\\tau_{\\text{coh}}$. Independently — and almost never folded into the HBT lineage — Forrester, Gudmundsen and Johnson had in 1955 already mixed the two Zeeman components of the 546.1 nm Hg line at a photocathode and recovered the microwave beat [77], proving directly that incoherent light produces an intensity-domain modulation at the photocurrent. Forrester's experiment took a decade to mount and is the unsung *optical* precursor. Sirius then yielded $\\theta = 6.3\\,\\text{mas}$ at a 9.2 m baseline [72] — the first sub-mas optical stellar measurement.\n\n### The controversy (1956–1957)\n\nReception was hostile. Brannen and Ferguson [73] reported a null coincidence run and warned that confirming HBT \"would call for a major revision of some fundamental concepts in quantum mechanics,\" citing the earlier Hungarian null of Ádám, Jánossy and Varga (Ann. Phys. Leipzig **16**, 408, 1955) for support. Purcell's one-page rebuttal [74] reframed the effect as *Bose bunching of degenerate modes*, $\\overline{(\\Delta n)^2} = \\bar n + \\bar n^2$, and showed Brannen and Ferguson were short on signal-to-noise by roughly a factor $10^{8}$ — millennia of integration. The technical knockout came from the Twiss–**Little**–Hanbury Brown coincidence experiment [75] and the four-part Proc. Roy. Soc. series [76]; A. G. Little, the lead engineer on what became Narrabri, is almost always elided when the episode is retold. The Dirac slogan \"each photon interferes only with itself,\" wielded by skeptics as if it forbade HBT, addresses *first-order* interference and was never published by Dirac as an objection to intensity correlations — that conflation is folklore.\n\n### From Narrabri to antibunching (1963–1977)\n\nThe Narrabri Stellar Intensity Interferometer — two 6.5 m mosaic reflectors on a 188 m circular track — ran 1963–1974 and delivered the 32-star main-sequence diameter survey summarised in [82]. It was the first instrument to resolve *hot* (O/B/A) stars systematically, a regime forbidden to optical Michelson interferometers because atmospheric phase coherence collapses over the requisite baselines. The SNR budget remained the one Hanbury Brown had written down in 1954: $\\text{SNR} \\sim \\alpha\\,\\delta\\,\\sqrt{B\\,T}$, with $\\alpha$ quantum efficiency, $\\delta$ source degeneracy, $B$ electronic bandwidth, $T$ integration time — atmospheric seeing does not appear.\n\nGlauber's coherent-state formalism [79] then folded HBT into a unified $g^{(n)}(\\tau)$ hierarchy, with chaotic light giving $g^{(2)}(0)=2$ and ideal laser light $g^{(2)}(0)=1$. This re-reading as \"the founding experiment of quantum optics\" is fair pedagogy but misleading history: HBT is a classical-wave effect, as Purcell, Mandel and Wolf understood immediately. The genuinely quantum reading arrived twenty-one years later, when Kimble, Dagenais and Mandel measured $g^{(2)}(0)\u003c1$ in the resonance fluorescence of single Na atoms [80] — the first manifestly nonclassical light. *Antibunching*, not bunching, is HBT's quantum dividend.\n\nThe correlator logic crossed disciplines in parallel. Goldhaber, Goldhaber, Lee and Pais [78] saw in 1959–60 that like-sign pions from $\\bar p p$ annihilation pile up at small relative momentum — Bose symmetrisation at a finite-size emitter. The mathematical scaffolding used in *every* modern heavy-ion femtoscopy fit (Gaussian source, side/out/long radii, the $\\lambda$ chaoticity parameter) was supplied not by GGLP but by Kopylov and Podgoretsky [81] in 1972–1974 — a Russian-language contribution that the standard reviews [52,69] credit correctly but that mid-curriculum textbooks routinely skip.\n\nThe arc from 1949 to 1977 is thus a *correlator* tradition, not a \"photon\" one. At each step — Jodrell Bank ionosphere, Narrabri atmosphere, Mandel's classical statistics — when first-order coherence is destroyed by the environment or by the source itself, second-order coherence still carries the physics. The rest of this dossier is about what survives that move, and what doesn't."}, {"id": "the-physics-properly", "title": "The Physics, Properly: From ⟨ΔI₁ΔI₂⟩ to g^(2)(τ) with Every Assumption Numbered", "markdown": "## The Physics, Properly: From ⟨ΔI₁ΔI₂⟩ to g^(2)(τ) with Every Assumption Numbered\n\n### Setup and the assumption stack\n\nTwo detectors at $\\mathbf{r}_1, \\mathbf{r}_2$ view the same extended chaotic source. Each produces a photocurrent $i_k(t) \\propto I_k(t) = |E_k(t)|^2$. The interferometer cross-correlates these *after* square-law detection — phase is discarded at each photocathode, only intensity fluctuations propagate to the correlator. This is the architectural reason HBT is immune to ionospheric and atmospheric phase noise [1,71,82].\n\nNumber the assumptions once and for all (reused in §3–§6):\n\n- **A1 (stationarity):** field statistics invariant under time translation, so $\\langle E^*(t)E(t+\\tau)\\rangle$ depends only on $\\tau$.\n- **A2 (ergodicity):** time averages over the integration window $T \\gg \\tau_c$ equal ensemble averages.\n- **A3 (Gaussian / chaotic statistics):** the analytic signal $E(t)$ is a zero-mean complex Gaussian process — true for thermal sources, sums of many independent atomic emitters, and pseudothermal rotating-ground-glass lamps [2].\n- **A4 (cross-spectral purity / single mode or $1/M$):** the field at the detector populates $M$ effectively equal-weight spatio-temporal modes; contrast is reduced by $1/M$.\n- **A5 (ideal square-law detector):** quantum efficiency $\\eta$ constant, dead time and afterpulsing negligible, detector IRF width $\\sigma_{\\rm IRF} \\ll \\tau_c$.\n- **A6 (negligible background / dark counts):** baseline $\\bar{n}_{\\rm bg} \\ll \\bar{n}_{\\rm sig}$ over the coincidence window.\n- **A7 (far-field, quasi-monochromatic, paraxial source):** small subtended angle, fractional bandwidth $\\Delta\\omega/\\omega_0 \\ll 1$, so van Cittert–Zernike applies.\n- **A8 (linear photocurrent regime):** no detector saturation, no nonlinearity in the amplifier chain — measured $\\langle i_1 i_2\\rangle$ is faithful to $\\langle I_1 I_2\\rangle$.\n\n### Classical-wave derivation\n\nFor a zero-mean Gaussian field (A3) the Isserlis moment theorem gives, on $\\langle I_1 I_2\\rangle = \\langle |E_1|^2 |E_2|^2 \\rangle$,\n\n$$\\langle |E_1|^2 |E_2|^2 \\rangle \\;=\\; \\langle |E_1|^2\\rangle\\langle |E_2|^2\\rangle \\;+\\; |\\langle E_1^* E_2\\rangle|^2.$$\n\nDefining the normalised coherences\n\n$$g^{(1)}(\\mathbf{r}_1,\\mathbf{r}_2;\\tau) = \\frac{\\langle E^*(\\mathbf{r}_1,t) E(\\mathbf{r}_2,t+\\tau)\\rangle}{[\\langle I_1\\rangle\\langle I_2\\rangle]^{1/2}}, \\qquad g^{(2)}(\\tau) = \\frac{\\langle I_1(t) I_2(t+\\tau)\\rangle}{\\langle I_1\\rangle\\langle I_2\\rangle},$$\n\nthe Gaussian factorisation collapses to the **Siegert relation**\n\n$$\\boxed{\\;g^{(2)}(\\tau) \\;=\\; 1 + |g^{(1)}(\\tau)|^2\\;}\\qquad (\\text{A1}+\\text{A2}+\\text{A3}+\\text{A4 with }M=1).$$\n\nAt zero delay this is the textbook excess $g^{(2)}(0) = 2$; the fluctuation correlation is $\\langle \\Delta I_1 \\Delta I_2\\rangle = \\langle I_1\\rangle\\langle I_2\\rangle\\,|g^{(1)}|^2$.\n\n### Mode degeneracy and the $1/M$ factor\n\nIf the detector integrates $M$ statistically independent modes of comparable weight — orthogonal polarisations, transverse speckle cells, frequency bins broader than the electronic bandwidth — each contributes to $\\langle I\\rangle$ but only matched modes survive in the cross-term, so\n\n$$g^{(2)}(0) = 1 + \\frac{1}{M}|\\mu|^2,\\qquad \\mu \\equiv \\text{spectral/spatial coherence factor.}$$\n\nOptical HBT was hard for exactly this reason: a mercury arc through a narrow filter still has $M\\sim 10^6$ across the detector bandwidth, killing contrast. Narrabri compensated not by raising $M^{-1}$ but by integrating $\\sim 10^3$ hours per star [82].\n\n### van Cittert–Zernike: how baseline maps to angular size\n\nA7 lets us relate $g^{(1)}$ to the source brightness $\\mathcal{I}(\\boldsymbol{\\theta})$,\n\n$$g^{(1)}(\\mathbf{b}) = \\frac{\\int \\mathcal{I}(\\boldsymbol{\\theta})\\,e^{-i\\mathbf{k}\\cdot\\mathbf{b}\\,\\boldsymbol{\\theta}}\\,d^2\\theta}{\\int \\mathcal{I}(\\boldsymbol{\\theta})\\,d^2\\theta},$$\n\nwith $\\mathbf{b}=\\mathbf{r}_2-\\mathbf{r}_1$. For a uniform disk of angular diameter $\\theta_d$,\n\n$$|g^{(1)}(b)|^2 = \\left[\\frac{2 J_1(\\pi b\\theta_d/\\lambda)}{\\pi b\\theta_d/\\lambda}\\right]^2,$$\n\nso $g^{(2)}(b)-1$ traces $|g^{(1)}(b)|^2$ directly — phases never enter, which is precisely what survived the ionosphere at Jodrell Bank and the troposphere at Narrabri [71,82].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eHBT detection geometry and correlation\u003c/title\u003e\u003ccircle cx=\"100\" cy=\"200\" r=\"40\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2\"/\u003e\u003ctext x=\"100\" y=\"205\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" font-family=\"serif\"\u003esource\u003c/text\u003e\u003ctext x=\"100\" y=\"260\" fill=\"#ffb86b\" font-size=\"14\" text-anchor=\"middle\"\u003ebrightness I(θ)\u003c/text\u003e\u003cline x1=\"140\" y1=\"190\" x2=\"380\" y2=\"130\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"140\" y1=\"210\" x2=\"380\" y2=\"270\" stroke=\"#7aa2ff\" stroke-width=\"1.2\"/\u003e\u003crect x=\"380\" y=\"115\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"400\" y=\"136\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eD₁\u003c/text\u003e\u003crect x=\"380\" y=\"255\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2\"/\u003e\u003ctext x=\"400\" y=\"276\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eD₂\u003c/text\u003e\u003cline x1=\"400\" y1=\"145\" x2=\"400\" y2=\"255\" stroke=\"#e8e6e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"430\" y=\"205\" fill=\"#e8e6e1\" font-size=\"14\"\u003ebaseline b\u003c/text\u003e\u003cpath d=\"M420 130 L520 130\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" fill=\"none\"/\u003e\u003cpath d=\"M420 270 L520 270\" stroke=\"#7ee0a3\" stroke-width=\"1.5\" fill=\"none\"/\u003e\u003ctext x=\"470\" y=\"122\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ei₁(t) = ηI₁\u003c/text\u003e\u003ctext x=\"470\" y=\"292\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003ei₂(t) = ηI₂\u003c/text\u003e\u003crect x=\"520\" y=\"170\" width=\"140\" height=\"60\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2\"/\u003e\u003ctext x=\"590\" y=\"196\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003e⟨Δi₁ Δi₂⟩\u003c/text\u003e\u003ctext x=\"590\" y=\"216\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003edelay τ, gate T\u003c/text\u003e\u003cline x1=\"520\" y1=\"140\" x2=\"580\" y2=\"170\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003cline x1=\"520\" y1=\"260\" x2=\"580\" y2=\"230\" stroke=\"#ff7a90\" stroke-width=\"1\"/\u003e\u003ctext x=\"360\" y=\"40\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003ePhase dies at the photocathode;\u003c/text\u003e\u003ctext x=\"360\" y=\"60\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003e|g⁽¹⁾(b)|² survives as a current cross-correlation.\u003c/text\u003e\u003ctext x=\"100\" y=\"335\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003evan Cittert–Zernike (A7):\u003c/text\u003e\u003ctext x=\"100\" y=\"358\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eg⁽¹⁾(b) = ℱ[I(θ)]\u003c/text\u003e\u003ctext x=\"580\" y=\"335\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003eSiegert (A3):\u003c/text\u003e\u003ctext x=\"580\" y=\"358\" fill=\"#7aa2ff\" font-size=\"14\" text-anchor=\"middle\"\u003eg⁽²⁾(τ) = 1 + |g⁽¹⁾(τ)|²\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: The HBT architecture — two square-law detectors separated by baseline $b$, no optical recombination. Phase is destroyed at each photocathode; the recovered observable is $\\langle\\Delta i_1\\Delta i_2\\rangle \\propto |g^{(1)}(b)|^2$, related to the source brightness through van Cittert–Zernike (A7) and to $g^{(2)}$ through Siegert (A3).*\n\n### Quantum (Glauber) formulation\n\nGlauber's normal-ordered second-order correlation [79] reads\n\n$$G^{(2)}(\\tau) = \\langle :\\!\\hat{I}(t)\\hat{I}(t+\\tau)\\!:\\rangle = \\int d^2\\alpha\\, P(\\alpha)\\,|\\alpha(t)|^2|\\alpha(t+\\tau)|^2,$$\n\nwith $P(\\alpha)$ the Glauber–Sudarshan distribution. For thermal $P(\\alpha) = (\\pi\\bar n)^{-1}\\exp(-|\\alpha|^2/\\bar n)$ this reproduces Siegert — A3 is *built into* the thermal $P$. For a coherent state $P(\\alpha)=\\delta^2(\\alpha-\\alpha_0)$ and $g^{(2)}(\\tau)\\equiv 1$ identically. For $P$ that is negative or more singular than a delta, $g^{(2)}(0)\u003c1$ — antibunching, exploited by Kimble–Dagenais–Mandel [80] and by every modern single-emitter community [49,51,60,63,68]. HBT itself does *not* live in this regime; Purcell showed the 1956 result is fully classical-wave [74].\n\n### Photocount excess variance (Mandel)\n\nUnder A5 the click count in window $T$ obeys Mandel's formula $P(n) = \\int dW\\, e^{-W} W^n/n!$ with $W = \\eta\\int_0^T I(t)\\,dt$, giving\n\n$$\\langle (\\Delta n)^2\\rangle = \\langle n\\rangle + \\frac{\\langle n\\rangle^2}{M}\\,\\frac{1}{T}\\int_{-T}^{T}\\!\\!\\Big(1-\\frac{|\\tau|}{T}\\Big)|g^{(1)}(\\tau)|^2 d\\tau.$$\n\nThe second term — wave noise — is what HBT actually measures. It dominates shot noise only when the modal occupancy $\\bar n_{\\rm modes}\\equiv \\langle n\\rangle/M \\gtrsim 1$: this is the *mode-degeneracy condition* Purcell used to demolish Brannen–Ferguson, and the reason optical HBT is hard while radio HBT is trivial. Thermal occupancy $(e^{\\hbar\\omega/k_BT}-1)^{-1}$ is $\\sim 10^{-2}$ for visible starlight and $\\gtrsim 10^4$ at metre wavelengths [69,82].\n\nEach signature in §4 and each failure mode in §3 will be tagged with the A-label(s) it violates."}, {"id": "strict-conditions-failure-modes", "title": "Validity Domain: What Breaks When Each Aᵢ Is Violated", "markdown": "## Validity Domain: What Breaks When Each Aᵢ Is Violated\n\nThe clean result $g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2$ and its corollary $g^{(2)}(0) = 2$ sit atop eight assumptions A1–A8. The literature regularly cites the conclusion while silently abandoning at least one of them. What follows is a regime-by-regime audit of where each fails, what replaces it, and what the actual measured number looks like.\n\n**A1 — Stationarity ($\\langle I(t)\\rangle$ and $\\langle I(t)I(t+\\tau)\\rangle$ time-translation invariant).** A1 fails for any pulsed source: ultrafast oscillators, single-emitter pulsed excitation, supercontinuum frames, GRB afterglows, chopped CW. Once $\\langle I(t)\\rangle$ is itself time-dependent, the denominator $\\langle I\\rangle^2$ no longer matches what produced the numerator, and the measured zero-delay value can swing far above 2. The honest fix is a doubly-conditional ratio over the exposure window; few experimental groups do this. For a Gaussian envelope of duration $T_p$ inside a gating window $T_g\\!\\gg\\!T_p$, the apparent bunching peak inflates by roughly $T_g/T_p$ — a 100 fs pulse inside a 10 ns gate of chaotic emission yields a raw $g^{(2)}(0)\\sim 10^5$, an artefact rather than physics. The same arithmetic explains why blinking quantum dots show $g^{(2)}(0)\\!\\gg\\!1$ once integrated through their on/off telegraph.\n\n**A2 — Ergodicity.** A2 is the silent partner of A1 and goes with it whenever the source has a slow nonstationary parameter — drifting laser power, atmospheric scintillation, single-molecule sample drift. The Mandel $Q$ and $g^{(2)}(0)$ measured from a single record then estimate not the field's second moment but a convolution with the slow drift. In open-atmosphere intensity interferometry this is the dominant excess noise, orders of magnitude above true HBT bunching unless removed by a low-frequency reject filter; the Narrabri post-detection bandpass of $\\sim 50$ kHz–100 MHz [82] was precisely an A2 enforcer, as the Cavazzani–Ortolani–Barbieri photon-arrival statistics confirm in modern reanalysis [70].\n\n**A3 — Zero-mean circular complex Gaussian field statistics.** A3 is what licenses the Siegert relation. The instant the field is non-Gaussian, the relation breaks and the link between $g^{(2)}(0)$ and \"thermal\" decouples. Three regimes routinely violate A3: integrable optical turbulence and rogue waves, where $g^{(2)}(0)$ values of $5$–$30$ are now routinely observed [62]; cascaded SPDC and squeezed thermal states, for which the single-mode limit gives $g^{(2)}(0) = 3$ (the heralded-idler signature); and partially-condensed Bose–Einstein systems, where the HBT contrast [50] falls below 2 in proportion to the condensate fraction. Reading $g^{(2)}(0)=2$ as a diagnostic of \"thermalness\" is therefore a sufficient-but-not-necessary statement run in reverse.\n\n**A4 — Single mode ($M\\!=\\!1$) — spatial, temporal, polarisation.** For $M$ incoherent modes the bunching peak collapses to $g^{(2)}(0)= 1 + 1/M$. The two ubiquitous channels are spatial averaging across a detector larger than one coherence area $A_c \\sim \\lambda^2/\\Omega_{\\rm source}$, and temporal averaging when $\\tau_{\\rm IRF}\\gg\\tau_c$ (which we count separately in A6). Polarisation alone gives the universal factor of 2: an unpolarised chaotic source through a polarisation-insensitive detector reports $g^{(2)}(0)=1.5$, not 2. For a star of angular diameter $10^{-8}$ rad seen by a 6 m aperture in the visible, $A_c \\sim 0.06$ m$^2$: the full mirror integrates $M\\sim 10^3$ spatial modes and the per-detector intensity contrast is suppressed by the same factor. This is the geometric reason every modern HBT astronomy concept [48,59] subdivides the aperture into coherence-cell pixels.\n\n**A5 — Quasi-monochromaticity.** A5 sets the coherence time $\\tau_c$. White thermal light has $\\tau_c\\!\\sim\\!1$ fs in the visible; a 1 nm interference filter at 500 nm gives $\\tau_c\\!\\sim\\!0.8$ ps; Hanbury Brown's 4.4 Å Narrabri filter yielded $\\tau_c\\!\\sim\\!5$ ps [82]. None of these are resolvable by PMTs (rise times $\\gtrsim 1$ ns), which is exactly why intensity interferometry survives — it does not need $\\tau_c$ resolved, only the integrated $\\langle I_1 I_2\\rangle$ measured. The degeneracy parameter $\\delta = n_{\\rm photon/mode} = n_\\nu\\,\\tau_c$ then sets the SNR: for Sirius at the Narrabri photocathode $\\delta\\sim 5\\times 10^{-3}$, and the squared contrast $\\delta^2$ is the entire reason Hanbury Brown needed $\\sim 1000$ hours of integration.\n\n**A6 — Instantaneous square-law detection (delta-function IRF, unit QE).** Once $\\tau_{\\rm IRF}\\gtrsim\\tau_c$ the $|g^{(1)}|^2$ peak is convolved by the detector kernel; its area is conserved but its height collapses to $\\sim 1 + \\tau_c/\\tau_{\\rm IRF}$ — the temporal-mode-count version of A4. An InGaAs SPAD with $\\tau_{\\rm IRF}\\!\\approx\\!80$ ps watching a 100 MHz-linewidth filtered thermal source ($\\tau_c\\!\\approx\\!3$ ns) recovers $\\sim$95% of the bunching contrast; the same source through a 2 ns PMT pair gives $g^{(2)}(0)\\!\\approx\\!1.6$; the *same PMTs* on Hanbury Brown's mercury arc ($\\tau_c\\!\\sim\\!5$ ps) report $g^{(2)}(0)-1\\sim 2\\times 10^{-3}$ — exactly why the radio trick of measuring $\\langle\\Delta I_1\\Delta I_2\\rangle$ in the noise bandwidth, not coincidence counts, was the only viable route [1,71]. The same convolution caps the *apparent* antibunching of a single emitter: an NV centre with a true $g^{(2)}(0)\\!\u003c\\!0.01$ measured by a 350 ps SPAD pair on a 12 ns radiative lifetime reports $g^{(2)}(0)\\!\\sim\\!0.03$ — a systematic, not the physics [51,60].\n\n**A7 — Negligible background and dark counts.** If a signal rate $S$ sits on an uncorrelated background $B$, the measured statistic is\n$$g^{(2)}_{\\rm meas}(0)\\;=\\;1+\\frac{S^{2}}{(S+B)^{2}}\\bigl[g^{(2)}_{\\rm true}(0)-1\\bigr],$$\nso any $B$ drags both bunching peaks and antibunching dips toward unity. A single-photon source with $S/B=3$ and true $g^{(2)}(0)=0$ measures as $g^{(2)}_{\\rm meas}(0)=7/16\\approx 0.44$, crossing the conventional $0.5$ \"single-emitter\" threshold by virtue of background alone. The explicitly background-subtracted statistic is the only one worth quoting, and a non-trivial fraction of single-photon claims in the diamond, SiC, and 2D-material literature [51,60,63] are weaker than advertised once it is done honestly.\n\n**A8 — No detector pathologies (dead time, afterpulsing, pile-up).** Dead time $\\tau_d$ truncates the correlation for $|\\tau|\u003c\\tau_d$, depletes the denominator (lost counts), and distorts both bunching and antibunching at short delay. Si-SPAD afterpulsing produces spurious correlated bumps at 50 ns–1 μs that have been misread as bunching wings more than once. Pile-up in fast time-to-amplitude conversion superimposes a fictitious slope. The conservative rule — count rate $\\ll 1/\\tau_d$, deconvolve the afterpulsing tail measured under dark conditions — is necessary, not optional, and is the difference between the cleaned figures in [49,68] and the rawer histograms in their supplementary material.\n\nThe take-home: $g^{(2)}(0)=2$ for thermal light and $g^{(2)}(0)=0$ for a single emitter are *ideal-source, ideal-detector* limits. Every published value below 2 or above 0 lives somewhere in the eight-dimensional space carved out by violations of A1–A8, and any defensible figure must declare which axes have been moved."}, {"id": "signatures-direct-vs-indirect", "title": "Signatures: Smoking Guns vs Circumstantial Evidence", "markdown": "## Signatures: Smoking Guns vs Circumstantial Evidence\n\nA g^(2) measurement is a number with provenance. The number alone licenses almost nothing; the provenance — temporal resolution relative to the relevant correlation time, baseline scan, power dependence, spectral filtering, background subtraction — is what converts the number into a claim about the field. §3 enumerated the assumption stack; here I sort the standard observables into what they can prove, what they can suggest, and what they routinely get mistaken for.\n\n### What a properly resolved g^(2)(τ) curve actually proves\n\nThe smoking-gun observable is not a value at zero delay but a *function* of delay measured with $\\tau_\\mathrm{IRF} \\ll \\tau_c$. For chaotic light, the diagnostic is fourfold: (i) the peak height is $2 \\pm 1/\\sqrt{M}$ where $M$ is the number of detected spatio-temporal modes; (ii) the width matches the independently measured $\\tau_c$ from a Michelson or grating; (iii) the lineshape obeys $g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2$ — Lorentzian source ⇒ exponential bunching, Gaussian source ⇒ Gaussian bunching; (iv) the bunching survives spectral filtering with $\\tau_c$ rescaling as $1/\\Delta\\nu$. The Martienssen–Spiller rotating-ground-glass demonstration [2] is the textbook positive control: an adjustable $\\tau_c$ from $10^{-5}$ s to $1$ s, with the predicted peak height reproduced as the integration time is scanned through the coherence time. A paper that reports $g^{(2)}(0) = 1.9$ without the curve, the spectrum, and the IRF is reporting folklore.\n\nFor stellar HBT the unique signature is sharper still: the *spatial* fall-off of the time-integrated correlation as the baseline $B$ is increased, normalised by photon flux. The fringe-modulation contrast tracks the van Cittert–Zernike transform of the source brightness; for a uniform disk of angular diameter $\\theta$ the first zero of $|\\gamma(B)|^2$ sits at $B = 1.22\\,\\lambda/\\theta$. Hanbury Brown's 32-star Narrabri survey [82] earned its credibility precisely because the *decorrelation curve* was traced star by star — not because any single baseline gave a non-zero correlation. The Cherenkov Telescope Array proposals to resurrect stellar HBT [48] explicitly require baseline scans; a single-$B$ coincidence excess would not be diagnostic.\n\nFor antibunched light the smoking gun is again a function, not a number. The triad is: (i) IRF-deconvolved $g^{(2)}(0) \u003c 0.5$ as one-emitter Fock content, where $0.5$ is the two-emitter threshold *only* in the single-mode, Poissonian-background limit; (ii) recovery $g^{(2)}(\\tau) = 1 - e^{-\\Gamma\\tau}$ with $\\Gamma$ matching the independently measured radiative rate from a TCSPC lifetime decay; (iii) saturation of $g^{(2)}(0)$ toward zero as excitation is raised through the Rabi-resolved regime. The Kimble–Dagenais–Mandel sodium-beam paper [80] satisfied all three, which is why it survived; modern semiconductor-dot, NV, SiV and hBN single-photon claims [49,51,60,63] are obliged to satisfy them too.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eDiagnostic g^(2)(tau) curves\u003c/title\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"60\" y1=\"40\" x2=\"60\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.5\"/\u003e\u003cline x1=\"60\" y1=\"220\" x2=\"690\" y2=\"220\" stroke=\"#e8e6e1\" stroke-width=\"0.6\" stroke-dasharray=\"3,3\"/\u003e\u003ctext x=\"375\" y=\"22\" fill=\"#e8e6e1\" font-size=\"15\" text-anchor=\"middle\" font-family=\"serif\"\u003eg^(2)(τ): what real signatures look like at the same axes\u003c/text\u003e\u003ctext x=\"50\" y=\"104\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e2\u003c/text\u003e\u003ctext x=\"50\" y=\"224\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e1\u003c/text\u003e\u003ctext x=\"50\" y=\"344\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003e0\u003c/text\u003e\u003ctext x=\"375\" y=\"384\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003edelay τ  (in units of τ_c or T₁)\u003c/text\u003e\u003ctext x=\"22\" y=\"195\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 22 195)\"\u003eg^(2)(τ)\u003c/text\u003e\u003cpath d=\"M60,100 Q120,138 200,200 T380,220 L690,220\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"240\" y=\"135\" fill=\"#ffb86b\" font-size=\"14\"\u003echaotic: peak 2, width τ_c\u003c/text\u003e\u003cpath d=\"M60,340 Q90,330 130,260 T220,220 L690,220\" fill=\"none\" stroke=\"#7ee0a3\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"250\" y=\"278\" fill=\"#7ee0a3\" font-size=\"14\"\u003etrue single emitter: dip→0, recovers as 1−e^(−Γτ)\u003c/text\u003e\u003cpath d=\"M60,220 Q80,200 110,178 Q160,160 220,172 Q300,190 380,210 T540,220 L690,220\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.5\" stroke-dasharray=\"6,4\"/\u003e\u003ctext x=\"340\" y=\"172\" fill=\"#7aa2ff\" font-size=\"14\"\u003eblinking emitter: long-τ shoulder \u0026gt;1 (mimics chaotic)\u003c/text\u003e\u003cpath d=\"M60,260 Q90,250 130,240 Q180,232 240,228 L690,222\" fill=\"none\" stroke=\"#ff7a90\" stroke-width=\"2.5\" stroke-dasharray=\"2,3\"/\u003e\u003ctext x=\"270\" y=\"252\" fill=\"#ff7a90\" font-size=\"14\"\u003eIRF-blurred antibunching: raw dip stops at ~0.5\u003c/text\u003e\u003ccircle cx=\"60\" cy=\"100\" r=\"4\" fill=\"#ffb86b\"/\u003e\u003ccircle cx=\"60\" cy=\"340\" r=\"4\" fill=\"#7ee0a3\"/\u003e\u003ccircle cx=\"60\" cy=\"260\" r=\"4\" fill=\"#ff7a90\"/\u003e\u003ccircle cx=\"60\" cy=\"220\" r=\"4\" fill=\"#7aa2ff\"/\u003e\u003c/svg\u003e\n*Figure: Four signatures that are routinely confused at τ=0 but unambiguous over the full delay axis. Only the curve as a function of delay — paired with τ_c (or T₁) from an independent measurement — distinguishes them. The pink dashed curve is the green curve convolved with a finite IRF; the raw zero-delay value is no longer a Fock-state diagnostic.*\n\n### Where the field gets fooled\n\nA bare $g^{(2)}(0) \u003e 1$ is one of the most over-interpreted numbers in modern photonics. Candidates that all produce super-Poissonian zero-delay coincidences: (a) actual chaotic light, (b) a blinking single emitter whose long-time intensity statistics swamp the short-time antibunching [49,63], (c) multi-mode laser operation where mode-partition noise mimics thermal fluctuations, (d) cascaded SPDC and integrable-turbulence supercontinua whose photon-number statistics are non-Gaussian and routinely give $g^{(2)}(0) \\gg 2$ [62], (e) classical pseudo-thermal sources [2]. They are separated by their *spectrum and τ_c*: chaotic light has $\\tau_c = 1/\\Delta\\nu$ tied to the optical bandwidth; blinking has two well-separated timescales (μs–ms shoulder above the ns dip); multi-mode laser noise has $\\tau_c$ set by the mode-beat spectrum; rogue-wave statistics violate stationarity, so A1 fails outright [62].\n\nA bare $g^{(2)}(0) \u003c 1$ is just as treacherous. The single-emitter claim requires four orthogonal checks: (i) IRF deconvolution — a raw $0.4$ at 350 ps IRF can be a true $0.03$ at 50 ps lifetime, *or* two emitters with 30% background; (ii) power dependence — true single-emitter $g^{(2)}(0)$ is excitation-rate-independent in the weak-pump limit, while background-induced apparent antibunching scales with pump as the signal-to-background ratio does; (iii) lifetime consistency — the antibunching recovery rate must match the TCSPC decay; (iv) spectral filtering — narrowing onto the zero-phonon line should *deepen* the dip if the emitter is the source. Papers quoting $g^{(2)}(0) \\approx 0.3$ with no deconvolution, no power scan, no lifetime cross-check, and no background-subtraction policy report an instrument number, not a Fock-state claim [51,60,63].\n\n### Two-photon interference and the HOM mimic\n\nA persistent conflation reads first-order intensity correlation as if it were two-photon path interference. Hong–Ou–Mandel coalescence requires (i) number-state input on both ports, (ii) indistinguishability in every degree of freedom, (iii) a *dip* in coincidences scaling with single-photon-wavefunction overlap. HBT bunching of independent chaotic beams survives spectral and polarisation distinguishability; HOM is destroyed by either. The operational test is trivial: rotate one input polarisation by 90°. If the dip vanishes, it was HOM; if a bunching peak persists, it was HBT [47]. Multi-photon interferometry reviews [47] document several early \"two-photon interference\" reports that, on this criterion, were intensity-correlation experiments mislabelled.\n\nThe pattern across all three cases is the same: a single number at $\\tau=0$ is a Rorschach test. The *curve*, the *spectrum*, the *power dependence*, and the *baseline or distinguishability scan* are what convert intensity correlations from suggestion to evidence."}, {"id": "use-and-abuse", "title": "Use \u0026 Abuse: How g^(2)(0) Became a Slogan", "markdown": "## Use \u0026 Abuse: How g^(2)(0) Became a Slogan\n\nA correlation function with one number at one delay should not bear the weight modern papers place on it. Yet \"$g^{(2)}(0) \u003c 0.5 \\Rightarrow$ single-photon source\" and \"$g^{(2)}(0) \u003e 1 \\Rightarrow$ thermal\" have become press-release shorthand across half a dozen subfields. Below is a field-by-field catalogue of the misuse, with the assumption that was silently dropped in each case.\n\n### The \"0.5 line\" in single-photon-source papers\n\nIn the NV-centre and self-assembled quantum-dot literature the canonical claim runs: a Hanbury Brown–Twiss measurement returning a raw, uncorrected $g^{(2)}(0) \u003c 0.5$ certifies a single emitter. The argument is that $N$ equal-brightness independent emitters give $g^{(2)}(0) = 1 - 1/N$, so $g^{(2)}(0) = 0.5$ separates $N=1$ from $N=2$. Every word of that derivation matters, and almost every word is regularly dropped.\n\nThe threshold assumes equal brightness; unequal coupling — routine in nanopillars, photonic-crystal cavities, hBN flakes — pushes the $N=2$ value below 0.5, so a \"single-emitter\" certificate can conceal two unequal ones ([arXiv:2203.16101](https://arxiv.org/pdf/2203.16101)). It assumes background subtraction. Uncorrelated background (laser leakage, dark counts, autofluorescence from the host) adds a flat pedestal $C_{\\mathrm{bg}}$ to the start–stop histogram, so the *true* antibunched dip\n$$g^{(2)}_{\\mathrm{corr}}(0) = \\frac{g^{(2)}_{\\mathrm{raw}}(0) - (1-\\rho^2)}{\\rho^2}, \\qquad \\rho = \\frac{S}{S + B}$$\nis much deeper than the raw curve; published \"near-unity purity\" numbers frequently lump $\\rho$ into the source and report the raw value [49,51,63]. It assumes a temporal resolution $\\Delta t_{\\mathrm{IRF}}$ much smaller than the emitter lifetime $\\tau$; a 350 ps SPAD jitter convolved against a 12 ns NV lifetime hides a near-zero true dip behind a measured $g^{(2)}(0) \\sim 0.3$. And the result is only an inequality — $g^{(2)}(0) \u003c 0.5$ is necessary, not sufficient, for $|1\\rangle$-state Fock content, which requires the full $P(\\alpha)$ to be non-classical, not a single point on the second-order correlator [79,80]. The instructive review of NV photon statistics ([RG/254500701](https://www.researchgate.net/publication/254500701_Photon_number_statistics_of_NV_centre_emission)) is explicit that the inflated raw $g^{(2)}(0)$ in nominal \"single-photon\" datasets is regularly compatible with a clean single emitter buried under background.\n\n### Photon bunching is not quantum\n\nA persistent abuse in supercontinuum, rogue-wave and \"quantum light from a fibre\" claims is that observation of $g^{(2)}(0) \u003e 1$ — or worse, $\\gg 2$ — is evidence of nonclassical or even thermal behaviour. Purcell's 1956 one-page note [74], and the entire classical-coherence apparatus of Mandel and Wolf, settled this seventy years ago: HBT bunching of chaotic light is a *classical* wave-fluctuation correlation, fully captured by stochastic electrodynamics. The Siegert identity $g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2$ — and hence $g^{(2)}(0) = 2$ — requires the field to be stationary, ergodic, zero-mean Gaussian. Non-Gaussian, non-stationary fields routinely produce $g^{(2)}(0) \\gg 2$ without any quantum content: integrable-turbulence rogue waves measured by time microscopy show heavy-tailed intensity statistics far exceeding the thermal value [62]. Calling such bunching \"thermal\" mislabels the field; calling it \"quantum\" is worse. The genuinely quantum signature is the opposite inequality, $g^{(2)}(0) \u003c 1$, demonstrated for the first time in 1977 [80] — and even there, only after careful subtraction of the elastic Rayleigh component and atomic-beam density fluctuations.\n\n### HBT vs HOM, conflated as \"two-photon interference\"\n\nA second slogan — that \"photon bunching at a beamsplitter is two-photon interference\" — collapses two distinct phenomena. HBT bunching of chaotic light survives spectral distinguishability, polarisation orthogonality, and detection of fields from independent thermal modes; the correlation is intensity-level and first-order in mode degeneracy. Hong–Ou–Mandel coalescence requires number-state inputs and full path indistinguishability — the dip vanishes the moment the two photons can be told apart. The two effects share a beamsplitter and not much else, but quantum-photonics introductions routinely file them under the same heading [47]. The diagnostic is straightforward: if the \"two-photon interference\" persists with attenuated thermal or coherent light, it is HBT; if it requires single-photon Fock inputs and dies under any which-path tagging, it is HOM.\n\n### Heavy-ion R_HBT is not a geometric radius\n\nFemtoscopy press releases — and many textbook chapters — equate the fitted Gaussian widths $R_{\\mathrm{side}}, R_{\\mathrm{out}}, R_{\\mathrm{long}}$ with the spatial extent of the fireball at freeze-out. Boal, Gelbke and Jennings [52] and Baym [69] are explicit, and the recent literature is unambiguous: what is measured is a *homogeneity length* — the region from which particles of a chosen momentum $\\mathbf{K}$ are emitted, weighted by space–momentum correlations from collective flow ([arXiv:0912.3457](https://arxiv.org/pdf/0912.3457)). For an expanding source $R_{\\mathrm{HBT}}(\\mathbf{K}) \u003c R_{\\mathrm{geom}}$, and the ratio $R_{\\mathrm{out}}^2 - R_{\\mathrm{side}}^2$ encodes the emission *duration*, not a geometric anisotropy. The \"RHIC HBT puzzle\" — radii growing more slowly with $\\sqrt{s}$ than naive volume arguments predicted — was a puzzle only under the geometric misreading [54,56,66]; it dissolves once homogeneity is restored to the vocabulary.\n\n### Two senses of \"coherent\", silently swapped\n\nIn pre-1963 papers (Hanbury Brown–Twiss included [1,71,72]) \"coherent\" meant monochromatic, mutually phase-locked, first-order field. Glauber redefined \"fully coherent\" as factorisation of every $g^{(n)}$ — equivalently, an eigenstate $|\\alpha\\rangle$ of $\\hat{a}$ [79]. A laser above threshold is *first-order incoherent* through phase diffusion and *Glauber-coherent* in $g^{(n)}$; the same word denotes opposite properties. Modern papers that quote 1956-era statements about \"coherent light\" without translation produce sentences that are internally self-contradicting — most visibly when an introductory paragraph asserts that HBT \"first demonstrated coherence of light\" and a later paragraph that HBT showed light is \"not coherent in the Glauber sense\". Both are true; the word is doing two jobs."}, {"id": "status-and-believers-checklist", "title": "Status and the Believer's Checklist", "markdown": "## Status and the Believer's Checklist\n\nHBT in 2026 lives in three distinct ecologies, each of which has rediscovered the technique under its own pressure. The principle — square-law detect, cross-correlate, read off the second-order coherence — is canonical. The vocabulary around it has mutated, and the mutations are where the abuse lives.\n\n### Stellar intensity interferometry, reborn at γ-ray observatories\n\nThe Narrabri instrument was decommissioned in 1972 because amplitude interferometry (Mark III, NPOI, CHARA) had overtaken it on bright-star sensitivity. What brought intensity interferometry back is not photon technology in isolation but the existence of Cherenkov Telescope arrays — VERITAS, MAGIC, H.E.S.S., and now CTAO — whose ≥10 m light buckets and ~100 m–1 km baselines sit unused most nights and happen to be optimal SII collectors [48]. VERITAS reported the angular diameter of β UMa at $1.07 \\pm 0.04_\\mathrm{stat} \\pm 0.05_\\mathrm{sys}$ mas in 2024 ([Acharyya et al., ApJ 966, 28](https://iopscience.iop.org/article/10.3847/1538-4357/ad2b68)), MAGIC and the CTAO-LST1 prototype achieved first joint correlation measurements in early 2024 ([MAGIC+LST1 SII, arXiv:2506.04994](https://arxiv.org/abs/2506.04994)), and the CTAO-North LSTs scheduled through 2025 will populate a two-dimensional $(u,v)$ plane that Narrabri never had. The science target is no longer \"measure $\\theta$ for a bright OB star\" but rapidly rotating photospheres, limb darkening, and binary orbits at sub-mas resolution in the visible — territory amplitude interferometry struggles to reach because of atmospheric phase ([van Belle review [57]](https://doi.org/10.1007/s00159-012-0051-2); [Stellar SII workshop 2024](https://inphyni.univ-cotedazur.eu/medias/fichier/bookof-abstract_1725869360906-pdf?ID_FICHE=1224496\u0026INLINE=FALSE)).\n\n### Hadronic femtoscopy as standard fireball metrology\n\nBoal–Gelbke–Jennings [52] and Baym [69] codified the heavy-ion HBT vocabulary in the 1990s; what was once \"an interesting analogy\" is now a routine differential measurement at ALICE, STAR, and PHENIX, with $R_\\mathrm{side}(k_T)$, $R_\\mathrm{out}(k_T)$, $R_\\mathrm{long}(k_T)$, and the chaoticity $\\lambda$ reported as functions of pair transverse momentum, centrality, and collision energy [54, 56, 66]. The 2025 STAR programme has extended femtoscopy into the heavy-flavour sector ([STAR heavy-flavor femtoscopy, arXiv:2507.05076](https://arxiv.org/abs/2507.05076)). The persistent abuse is treating any single $R_\\mathrm{HBT}$ as a \"fireball size\"; what is measured is a homogeneity length, and the $k_T$-slope is the signature of collective flow, not contamination of it.\n\n### Single-emitter quantum light as operational g$^{(2)}$\n\nEvery \"single-photon source\" paper from 2010 onward presents a $g^{(2)}(\\tau)$ trace from a fibre-coupled HBT setup — a Hanbury Brown–Twiss interferometer driven by exactly the same idea Purcell explained in 1956, now applied to states for which $g^{(2)}(0)\u003c1$ is the diagnostic [49, 51, 60, 63, 68, 80]. Best-in-class semiconductor quantum dots and group-IV defects reach raw $g^{(2)}(0) \\lesssim 0.01$. The technique is canonical; the reporting is uneven. Treating $g^{(2)}(0) \u003c 0.5$ as a single-photon certificate ignores that the measured number is the convolution of the true $g^{(2)}$ with the detector IRF plus uncorrected background — IRF-deconvolved and background-subtracted values routinely differ from raw values by an order of magnitude ([Bradac et al. [51]](https://doi.org/10.1038/s41467-019-13332-w); [photon emission correlation spectroscopy review, arXiv:2111.01252](https://arxiv.org/pdf/2111.01252)).\n\n### The Believer's Checklist (C1–C8)\n\nEach item maps onto an assumption $A_i$ in §2 whose violation §3 catalogued. None is a counsel of perfection; all are routinely violated in published work.\n\n- **C1 — Report $g^{(2)}(\\tau)$, not just $g^{(2)}(0)$.** A single zero-delay number is unfalsifiable; the shape — width $\\tau_c$, recovery to unity, side-peak structure — is what licences the physical claim. (← $A_1$ stationarity, $A_7$ ergodicity.)\n- **C2 — State the IRF and deconvolve it.** Quote the FWHM of the SPAD/TDC jitter and the fitting model used. A raw $g^{(2)}(0)$ without an IRF disclosure should be read as an upper bound on the *true* $g^{(2)}(0)$ for antibunching, and a lower bound for bunching. (← $A_4$ infinite temporal resolution.)\n- **C3 — Report background and dark counts explicitly.** Give $C_B/C_\\infty$ and the corrected $g^{(2)}_\\mathrm{corr}(0) = [C_0 - C_B]/[C_\\infty - C_B]$; do not bury the correction inside a fit. (← $A_5$ noiseless detection.)\n- **C4 — Justify stationarity and Gaussianity before invoking Siegert.** $g^{(2)}(\\tau) = 1 + |g^{(1)}(\\tau)|^2$ is not a definition — it is a theorem with hypotheses. Blinking emitters, spectral diffusion, and rogue-wave fields violate one or both. (← $A_2$ Gaussian statistics, $A_3$ zero mean.)\n- **C5 — Report the mode number $M$.** The observed bunching height is $1 + 1/M$; without $M$, a measured $g^{(2)}(0) = 1.05$ is consistent with chaotic light through $M \\approx 20$ modes or partially-coherent light in one. (← $A_6$ single mode.)\n- **C6 — For stellar and femtoscopy claims, give a baseline (or momentum) scan, not a point.** $|g^{(1)}(\\mathbf{b})|^2$ versus baseline is the Van Cittert–Zernike content; $R_\\mathrm{HBT}(k_T)$ versus pair momentum is the flow content. A single number is a calibration, not a measurement. (← $A_8$ spatial/temporal disentanglement.)\n- **C7 — For \"quantum light\" claims, demonstrate power-independence of the dip and rule out two-emitter and blinking artefacts.** A dip that deepens with pump power or vanishes under continuous-wave excitation is a configuration artefact, not antibunching. The threshold $g^{(2)}(0) \u003c 0.5$ separates one- from two-emitter Fock content only under Poissonian background and resolved zero delay [80].\n- **C8 — Cite the actual originators.** Kopylov–Podgoretskiĭ alongside GGLP for hadronic femtoscopy; Jennison and Das Gupta alongside Hanbury Brown–Twiss for the radio origin; Forrester–Gudmundsen–Johnson [77] for the pre-1956 optical evidence of incoherent-light beating. The credit drift documented in §1 is reversible only if reviewers insist on it.\n\nA measurement that satisfies C1–C8 is rare in print and not difficult in practice; the gap between the two is the subject of §7.\n\nSources:\n- [VERITAS β UMa angular diameter, ApJ 966, 28 (2024)](https://iopscience.iop.org/article/10.3847/1538-4357/ad2b68)\n- [MAGIC + CTAO-LST1 SII, arXiv:2506.04994](https://arxiv.org/abs/2506.04994)\n- [Stellar SII in the photon-counting regime, arXiv:2503.22446](https://arxiv.org/pdf/2503.22446)\n- [Stellar Intensity Interferometry Workshop 2024 abstract book](https://inphyni.univ-cotedazur.eu/medias/fichier/bookof-abstract_1725869360906-pdf?ID_FICHE=1224496\u0026INLINE=FALSE)\n- [CTAO SII prospects, PoS(ICRC2025)959](https://pos.sissa.it/501/959/pdf)\n- [STAR heavy-flavor femtoscopy, arXiv:2507.05076](https://arxiv.org/abs/2507.05076)\n- [Pion–kaon femtoscopy, arXiv:2510.19320](https://arxiv.org/html/2510.19320)\n- [Photon emission correlation spectroscopy review, arXiv:2111.01252](https://arxiv.org/pdf/2111.01252)"}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent this dossier defending the proposition that HBT is one of the most misread experiments in twentieth-century physics — celebrated for the wrong reason, attributed to the wrong subset of its authors, and now invoked as a quantum certificate it cannot issue. Here is where I plant my flag.\n\n### (a) What I will defend with my reputation\n\nThe 1952 Jodrell Bank measurement of Cygnus A by Hanbury Brown, Jennison, and Das Gupta is the single most underrated experimental result of post-war radio astronomy: it solved the ionospheric-phase problem by *throwing phase away*, and every modern intensity-interferometry revival — SII at VERITAS, MAGIC, and the CTA prototypes — is a direct descendant. I will also defend, without qualification, that **HBT is classical**. Purcell saw it in three pages of *Nature* in 1956; Mandel and Wolf made it rigorous; nothing in the original Narrabri or Jodrell Bank data demands a single photon. The quantum-optics origin myth, by which Glauber's 1963 papers retrospectively annexed HBT, is a pedagogical convenience, not history. The genuine quantum threshold is Kimble–Dagenais–Mandel 1977 and nowhere earlier.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are quietly violated in routine practice.\n\n**A2 (cross-spectral purity / quasi-monochromaticity).** Modern broadband sources — supercontinua, microcombs, SPDC pumped by femtosecond lasers — produce $g^{(2)}(0)$ values that are quoted as if A2 held. They do not. The \"bunching peak height\" then mixes spatial coherence, spectral filtering, and detector jitter into a single number whose interpretation requires the full $g^{(2)}(\\tau)$ trace, which is rarely shown.\n\n**A6 (stationarity / ergodicity).** Single-emitter blinking, spectral diffusion in NV centres, and rare-event tails in chaotic semiconductor lasers make the time average $\\neq$ the ensemble average. The Siegert relation is then a fiction, and reported $g^{(2)}(0)$ values are estimator-dependent. The community publishes one number; the underlying distribution is bimodal.\n\n**The \"$g^{(2)}(0)\u003c0.5 \\Rightarrow$ single photon\" inequality.** This is folklore-strength only. Background subtraction, multi-emitter Poisson mixtures, and finite IRF deconvolution each shift the threshold; the genuinely defensible statement is the Grangier $\\alpha$ parameter with measured background, not raw $g^{(2)}(0)$. Half the single-photon-source literature would not survive an honest IRF audit.\n\nAnd one historiographic shakiness: the Kopylov–Podgoretsky framework is the actual mathematical engine of every heavy-ion HBT fit, yet Western reviews still front-load GGLP. This is not a minor citation quibble — it obscures *which* assumptions (Gaussian source, on-shell emission, chaoticity $\\lambda$) are doing the work.\n\n### (c) Three open questions, ranked\n\n1. **Sub-shot-noise stellar SII with photon-number-resolving superconducting detectors.** The Narrabri SNR scaling $\\propto \\alpha\\sqrt{A_1 A_2 \\Delta f \\, T/2}$ is the binding constraint on every revival; PNR-TES arrays could break the linear $\\alpha$ dependence and put $\\mu = 12$ stars within reach of a tabletop array. *Why first:* it is the only one whose payoff is a new astrophysical observable, not a refinement.\n2. **A clean, model-independent measurement of $R_{\\text{out}}^2 - R_{\\text{side}}^2$ at the LHC that separates emission duration from transverse flow.** The current degeneracy is the dominant systematic in extracting the QCD phase-transition timescale.\n3. **A rigorous reconstruction of $g^{(2)}(\\tau)$ at femtosecond resolution for a single quantum emitter under non-stationary excitation**, with A6 explicitly tested rather than assumed. This is the experiment that would tell us how much of the \"antibunching\" literature is artefact.\n\n### (d) Reading path\n\n1. Hanbury Brown \u0026 Twiss, *Nature* 1956 [(verify)] — read the original, not the textbook caricature; note how cautiously they phrase the quantum interpretation.\n2. Purcell, *Nature* 1956 [(verify)] — three pages that dissolve the entire \"Dirac forbids it\" objection and ground HBT in classical statistics.\n3. Glauber, *Phys. Rev.* 130 \u0026 131, 1963 [(verify)] — the $g^{(n)}$ hierarchy; read it knowing that HBT motivated but does not require it.\n4. Kimble, Dagenais \u0026 Mandel, *PRL* 39, 1977 [(verify)] — the real birth of quantum optics, where $g^{(2)}(0)\u003c1$ is first measured and the classical bound is broken.\n5. Wiedemann \u0026 Heinz, *Phys. Rep.* 319, 1999 [(verify)] — the honest derivation of the Kopylov–Podgoretsky framework, including what HBT radii *are not*."}], "references": [{"n": 1, "title": "Correlation between Photons in two Coherent Beams of Light", "authors": ["Robert Brown", "R. Q. Twiss"], "year": 1956, "venue": "Nature", "url": "https://doi.org/10.1038/177027a0", "cited_by": 2517, "bucket": "earliest"}, {"n": 2, "title": "Coherence and Fluctuations in Light Beams", "authors": ["W. Martienssen", "Eberhard Spiller"], "year": 1964, "venue": "American Journal of Physics", "url": "https://doi.org/10.1119/1.1970023", "cited_by": 397, "bucket": "earliest"}, {"n": 3, "title": "TWO-BEAM INTERFEROMETRY BY SUCCESSIVE RECORDING OF INTENSITIES IN A SINGLE HOLOGRAM", "authors": ["George W. Stroke", "A. Labeyrie"], "year": 1966, "venue": "Applied Physics Letters", "url": "https://doi.org/10.1063/1.1754473", "cited_by": 18, "bucket": "earliest"}, {"n": 4, "title": "Contributions to radio astronomy and electromagnetic wave theory : Microwave observations of galactic OH, and very high resolution interferometry. Distortion of electromagnetic w <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,function(m,x){maths.push({x:x,d:true});return '@@M'+(maths.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g,function(m,pre,x){maths.push({x:x,d:false});return pre+'@@M'+(maths.length-1)+'@@';});
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
</script>
<script>
_icon();
var D=JSON.parse(document.getElementById('aether-data').textContent);
var nRefs=(D.references||[]).length;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function build(){
  var H='';
  /* masthead */
  var meta=[];
  if(D.kind_long)meta.push(D.kind_long);
  if(D.domain)meta.push(D.domain);
  if(D.era)meta.push(D.era);
  if(D.date)meta.push(D.date);
  meta.push(D.nsec+' sections');meta.push(D.nref+' references');
  if(D.engine)meta.push(D.engine);
  var aka=(D.aliases&&D.aliases.length)?'<div class="aka">'+D.aliases.map(function(a){return '<i>'+esc(a)+'</i>';}).join('')+'</div>':'';
  H+='<header class="rmast">'+
     '<div class="kind">'+esc(D.kind_tag)+'</div>'+
     '<h1>'+esc(D.title)+'</h1>'+
     (D.subtitle?'<p class="sub">'+esc(D.subtitle)+'</p>':'')+
     '<div class="meta">'+meta.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'+
     aka+'</header>';
  /* seminar callouts */
  if(D.why_big)H+='<div class="callout"><h4>Why it was big</h4><p>'+esc(D.why_big)+'</p></div>';
  if(D.abuse)H+='<div class="callout warn"><h4>Abuse alert</h4><p>'+esc(D.abuse)+'</p></div>';
  if(D.origin_story)H+='<div class="callout"><h4>Origin</h4><p>'+esc(D.origin_story)+'</p></div>';
  /* toc + sections */
  var toc='<nav class="toc"><div class="tl">Contents</div>'+

  var body=D.sections.map(function(s){

  }).join('');
  /* timeline */
  if(D.timeline&&D.timeline.length){
    body+='<div class="block"><h3>Origins, in order</h3><div class="lead">How the idea actually arrived — and through whose hands.</div><div class="tline">'+
      D.timeline.map(function(t){return '<div class="ev"><div class="yr">'+esc(t.year)+(t.kind?' · '+esc(t.kind):'')+'</div><div class="what">'+esc(t.event)+'</div>'+((t.who||t.work)?'<div class="who">'+esc([t.who,t.work].filter(Boolean).join(' — '))+'</div>':'')+'</div>';}).join('')+'</div></div>';
  }
  /* neglected */
  if(D.neglected&&D.neglected.length){
    body+='<div class="block"><h3>The forgotten hands</h3><div class="lead">People the textbooks dropped — a credit audit.</div><div class="ncards">'+

    if(D.credit_audit)body+='<div class="callout" style="margin-top:24px"><h4>Credit audit</h4><p>'+esc(D.credit_audit)+'</p></div>';
    body+='</div>';
  }
  /* conflations */
  if(D.conflations&&D.conflations.length){
    body+='<div class="block"><h3>What gets conflated</h3><div class="lead">Claims that travel under this name but should not.</div><ul class="conf">'+
      D.conflations.map(function(c){return '<li><span class="claim">'+esc(c.claim)+'</span><div class="clar">'+esc(c.clarification)+'</div></li>';}).join('')+'</ul></div>';
  }
  /* references */
  if(D.references&&D.references.length){
    body+='<div class="block"><h3>References</h3><div class="lead">Bibliography from real indexes (OpenAlex · Crossref · arXiv · Nobel archive). Verify before citing in print.</div><ol class="refs">'+
      D.references.map(function(r){
        var au=(r.authors||[]).slice(0,4).join(', ')+((r.authors||[]).length>4?' et al.':'');
        var vy=[r.venue,r.year].filter(Boolean).join(' · ');
        var t=r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title);
        return '<li id="ref-'+esc(r.n)+'"><span class="rn">'+esc(r.n)+'</span><span><span class="rt">'+t+'</span>'+(r.bucket?'<span class="bk">'+esc(r.bucket)+'</span>':'')+'<br><span class="ra">'+esc(au)+(vy?' — '+esc(vy):'')+'</span></span></li>';
      }).join('')+'</ol></div>';
  }
  document.getElementById('main').innerHTML=H+'<div class="rgrid">'+toc+'<article class="body">'+body+'</article></div>';
  /* scrollspy on toc */
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function spy(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  addEventListener('scroll',spy,{passive:true});spy();
}
if(window.marked&&window.katex){build();}else{addEventListener('DOMContentLoaded',build);}
</script>
