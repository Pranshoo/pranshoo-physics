ho": "L. F. Cugliandolo \u0026 J. Kurchan", "work": "Phys. Rev. Lett. 71, 173", "kind": "revival", "ref": null}], "neglected": [{"name": "Geertruida L. de Haas-Lorentz", "role": "Her 1912 Leiden dissertation (supervised by her father H. A. Lorentz) computed thermal voltage fluctuations in conductors using equipartition — predating Johnson and Nyquist by 15+ years and almost never cited in physics textbooks", "evidence": "Discussed in van Delft's biographical work on the Leiden school and in J. M. M. Frenken's 2007 historical note 'The first lady of Brownian motion' (Europhys. News)", "ref": null}, {"name": "Marian von Smoluchowski", "role": "Independent derivation of the diffusion-friction relation in 1906 — often dropped in favour of Einstein-only attribution outside the Polish/Austrian literature", "evidence": "Sommerfeld obituary 1917; Chandrasekhar Rev. Mod. Phys. 1943 acknowledges the dual paternity", "ref": null}, {"name": "Hisao Nakano", "role": "Derived the current-current correlator formula for conductivity in 1956, before Kubo's 1957 paper; usually subsumed under 'Kubo formula'", "evidence": "Kubo himself cites Nakano explicitly in the 1957 JPSJ paper; Mahan's 'Many-Particle Physics' notes the priority", "ref": null}, {"name": "Natsuki Hashitsume", "role": "Co-developer with Kubo of the systematic stochastic-Liouville formulation; his name survives mainly in the Kubo-Toda-Hashitsume textbook", "evidence": "Statistical Physics II (Springer, 1985), preface and ch. 4", "ref": null}, {"name": "Melville S. Green", "role": "The 'Green' of Green–Kubo: his 1952/1954 J. Chem. Phys. papers gave correlation-function expressions for transport coefficients independently of Kubo; he rarely appears in condensed-matter texts that say 'Kubo formula'", "evidence": "Zwanzig's 'Nonequilibrium Statistical Mechanics' (2001) ch. 6 attributes the formulas to Green and Kubo jointly", "ref": null}, {"name": "Herbert B. Callen \u0026 Theodore A. Welton", "role": "Authored the first paper actually titled and proved as a general theorem (1951), yet 'Kubo's FDT' is the dominant phrasing in modern condensed-matter literature", "evidence": "Phys. Rev. 83, 34; Callen's later Thermodynamics textbook makes the priority explicit", "ref": null}, {"name": "Leonid Bernshteyn / Leonard Ornstein", "role": "Ornstein–Uhlenbeck 1930 process gave the first rigorous stochastic-process realisation of the Langevin equation consistent with FDT", "evidence": "Uhlenbeck \u0026 Ornstein, Phys. Rev. 36, 823 (1930); Wax anthology 1954", "ref": null}], "conflations": [{"claim": "The FDT and the modern 'fluctuation theorems' (Jarzynski 1997, Crooks 1999, Gallavotti–Cohen 1995) are the same circle of ideas", "clarification": "They are mathematically distinct. FDT is a near-equilibrium, linear-response statement about two-point correlation functions and susceptibilities. Fluctuation theorems are exact identities for the full distribution of entropy production / work in arbitrarily far-from-equilibrium driven processes; they reduce to the FDT only in the linear-response limit. Refs [40,46] in the corpus belong to the latter family and do not generalize FDT."}, {"claim": "The Kubo formula and the FDT are the same statement", "clarification": "The Kubo formula expresses a linear susceptibility χ(ω) as a canonical-ensemble correlator of commutators. The FDT additionally relates the symmetric (anticommutator) correlator S(ω) to Im χ(ω) via the bath temperature. Kubo's formula presumes a Hamiltonian + canonical ensemble; the FDT presumes detailed balance / KMS. One can have a Kubo-type expression without invoking the FDT relation."}, {"claim": "Onsager reciprocity is the FDT", "clarification": "Onsager's L_ij = L_ji (with magnetic-field-sign flip) is a symmetry of the matrix of kinetic coefficients between conjugate fluxes. The FDT additionally fixes the absolute magnitude of fluctuations from the dissipative part. Reciprocity holds even classically without temperature; the FDT does not."}, {"claim": "The Einstein relation D = μ k_B T is the FDT", "clarification": "It is a single-frequency (ω → 0) and single-degree-of-freedom instance. The full theorem is a frequency-resolved spectral identity covering arbitrary linear observables and includes quantum zero-point fluctuations through the coth factor."}, {"claim": "FDT applies to non-equilibrium steady states with an 'effective temperature' T_eff", "clarification": "The original theorem requires (i) true thermal equilibrium, (ii) detailed balance / KMS, (iii) linear response. In driven, sheared, aging, glassy, or active matter these fail. An X(ω) ≡ T·(Im χ)/ωS that varies with ω or with observable means the system simply violates FDT. Fitting a single T_eff to enforce X = 1 is a parametrisation, not a test; only when T_eff is observable-independent over the same time-scale window does it carry thermodynamic meaning (as in slow modes of the Cugliandolo–Kurchan p-spin)."}, {"claim": "Classical and quantum FDT differ only by ħ → 0", "clarification": "The quantum form S(ω) = ℏ coth(ℏω/2k_BT) Im χ(ω) is symmetric in ω; the antisymmetric (commutator) spectrum carries the dissipation. In the classical limit the symmetric spectrum reduces to S(ω) = (2k_BT/ω) Im χ(ω), losing the zero-point contribution that remains finite at T = 0 — important in cavity optomechanics and circuit QED where readout noise hits the ground-state limit."}], "sections": [{"id": "origins-and-forgotten-pioneers", "title": "Origins and Forgotten Pioneers: Einstein, Smoluchowski, Langevin, and the Leiden Thesis Nobody Cites", "markdown": "## Origins and Forgotten Pioneers: Einstein, Smoluchowski, Langevin, and the Leiden Thesis Nobody Cites\n\nThe fluctuation–dissipation theorem was a working identity for nearly half a century before it had a name. It existed first as a single scalar equation — Einstein's $D = \\mu k_B T$ — then as a stochastic differential equation, then as a buried prediction in a doctoral thesis in Leiden, then as an experimental curiosity in the Bell Labs basement. Only in 1951, with Callen and Welton, did the relation become a *theorem*; only in 1966, with Kubo's review [1], did it acquire its modern name and its first/second-kind taxonomy. This section is about the four decades before that — the period when the FDT was, depending on the author, a kinetic argument, an electrical-engineering inconvenience, or a sentence in a thesis nobody read.\n\n### Einstein 1905: the relation as a kinetic identity\n\nEinstein's *Annalen* paper of May 1905 [2] did not set out to relate fluctuations to dissipation. Its declared aim was to settle whether thermal motion of suspended particles was observable, and to extract Avogadro's number from it. The fluctuation–dissipation identity falls out as a side calculation. Einstein balanced the osmotic pressure of dilute suspended particles against a Stokesian drag in an external force field, demanded that the resulting stationary distribution coincide with the barometric law, and concluded that the diffusion coefficient satisfied\n\n$$D = \\frac{k_B T}{6\\pi\\eta a} = \\mu k_B T,$$\n\nwith $\\mu$ the mobility. The structure is already that of the modern FDT in the zero-frequency limit: the response coefficient $\\mu$ (a dissipative quantity, set by viscosity) determines the amplitude of equilibrium fluctuations (the variance $\\langle x^2(t)\\rangle = 2Dt$). That the same $\\eta$ controls both the irreversible relaxation of a macroscopic gradient and the random walk of a single grain was the conceptual novelty; the numerical coincidence was the experimental hook for Perrin.\n\nEinstein did not phrase it as a theorem because there was nothing yet to be a theorem *of*. There was no general notion of linear susceptibility $\\chi(\\omega)$, no spectral decomposition of noise, no Hamiltonian framework for dissipation. The 1905 paper supplies one example; the generalization required the rest of the century.\n\n### Smoluchowski 1906: dual paternity, asymmetric credit\n\nMarian von Smoluchowski's *Annalen* paper of July 1906 [3] derived the same diffusion-mobility relation by a route Einstein had explicitly avoided: a mean-free-path argument for the suspended particle treated as a heavy molecule in a bath of light ones. Smoluchowski had been working on the problem since 1900 and delayed publication while Einstein's note circulated; the two derivations differ in a numerical prefactor (Smoluchowski's $32/27$ correction was later absorbed) but agree on the structural statement.\n\nThe Anglophone canon largely dropped him. Standard textbook attributions read \"Einstein relation\" without qualification; Chandrasekhar's 1943 *Reviews of Modern Physics* survey is one of the few high-visibility English sources that preserves the dual credit, and Sommerfeld's 1917 obituary makes Smoluchowski's priority on the kinetic side explicit. In the Polish, Austrian and German literatures the convention \"Einstein–Smoluchowski relation\" survives; in the American condensed-matter tradition it has all but vanished. The asymmetry is not innocent: Smoluchowski's argument, unlike Einstein's, generalizes naturally to non-spherical particles, to coagulation kinetics, and to the first-passage problems that later anchored Kramers' rate theory [4]. Forgetting him is forgetting a kinetic lineage, not just a name.\n\n### Langevin 1908: dissipation and noise as a single equation\n\nPaul Langevin's 1908 *Comptes Rendus* note [5] reformulated the problem in a way that made the FDT structurally inevitable. He wrote\n\n$$m\\dot v = -\\gamma v + \\xi(t), \\qquad \\langle \\xi(t)\\xi(t')\\rangle = 2\\gamma k_B T\\,\\delta(t-t'),$$\n\nwithout yet using the angle-bracket notation, and showed that equipartition $\\tfrac12 m\\langle v^2\\rangle = \\tfrac12 k_B T$ forces the noise amplitude to be locked to the friction coefficient. This is the prototype of what Kubo would later call the *second-kind* FDT: dissipation and fluctuation are two faces of the same coupling to the bath. Langevin's paper is two pages long and contains no measure theory; the rigorous stochastic-process realization had to wait for Uhlenbeck and Ornstein in 1930 [6], whose Gaussian-Markov solution gave the first mathematically clean implementation of a Langevin equation consistent with the FDT.\n\nWhat Langevin did not do — and what gets routinely projected back onto him — is establish the *spectral* form. The δ-correlation is a white-noise idealization; the genuinely frequency-dependent statement, including the quantum $\\coth(\\hbar\\omega/2k_B T)$ factor, required Callen and Welton in 1951 [7]. Citing Langevin for the full theorem is anachronism.\n\n### 1912, Leiden: the thesis that predicted Johnson noise\n\nThe most systematically under-cited result in this prehistory is the 1912 Leiden doctoral dissertation of Geertruida Luberta de Haas-Lorentz, written under the supervision of her father H. A. Lorentz. She applied equipartition to the free electrons in a metallic conductor and predicted that the open-circuit voltage across a resistor must fluctuate with a mean-square amplitude proportional to $k_B T R$, with a bandwidth set by the circuit time constant $RC$. In modern notation she had\n\n$$\\langle V^2\\rangle \\sim \\frac{k_B T}{C},$$\n\nthe integrated voltage variance, from which the spectral density $S_V \\propto k_B T R$ follows once one resolves the bandwidth — exactly Nyquist's 1928 result [8], fifteen years early. (verify: the precise functional form in the thesis is a circuit-integrated variance rather than the spectral density; the spectral statement is implicit, not displayed.)\n\nNeither Johnson [9] nor Nyquist cited her. The thesis was in Dutch, was not translated, and circulated as a Leiden monograph rather than a journal article; by the time Bell Labs measured the effect, the prediction had been forgotten outside the Lorentz circle. She continued to work on stochastic problems in plasma and superconducting contexts through the 1920s; the historical reconstruction is owed largely to van Delft's biographical research and to a short note by Frenken in *Europhysics News* (2007) titled \"The first lady of Brownian motion\" (verify). The case is the cleanest example in this story of priority lost to language, format, and gender combined.\n\n### What the prehistory does and does not contain\n\nBy 1912 the FDT existed in three independent guises: a zero-frequency identity ($D = \\mu k_B T$), a stochastic-differential equation locking noise to friction, and an electrical prediction $\\langle V^2\\rangle \\propto k_B T R$. Each was tied to a specific physical channel — diffusion, mechanical drag, Johnson noise — and none was understood as a single statement. Three pieces were missing.\n\nFirst, the *spectral* structure: $S(\\omega)$ as a function of frequency, and its identification with $\\mathrm{Im}\\,\\chi(\\omega)$, required the susceptibility formalism that crystallized only in the 1930s. Second, the *quantum* correction: the $\\coth(\\hbar\\omega/2k_B T)$ factor that interpolates between zero-point and thermal fluctuations could not appear before the Planck spectrum had been absorbed into the noise problem, which Nyquist did partially in 1928 [8] and Callen–Welton completed in 1951 [7]. Third, the *generality*: the claim that *any* linear dissipative observable obeys the same identity, not just the three special cases above, required the linear-response machinery that Kubo [10] would assemble in 1957.\n\nThe four pioneers of this section established the *content* of the FDT — that fluctuation amplitudes are not free parameters once dissipation is fixed by the bath. They did not establish it as a theorem, and they did not have the language to recognize it as a single result. The next section takes up Callen and Welton, who did."}, {"id": "the-physics-proper", "title": "The Theorem Proper: Callen–Welton, the coth Factor, and Why Im χ Is Everything", "markdown": "## The Theorem Proper: Callen–Welton, the coth Factor, and Why Im χ Is Everything\n\nBy 1950 the scattered identities — Einstein's $D=\\mu k_B T$, Nyquist's $S_V = 4 k_B T R$, the Langevin calibration of noise to friction — were waiting for a single statement that did not depend on the microscopic model. Callen and Welton supplied it in a six-page paper [7] whose abstract is itself the theorem: for *any* linear dissipative system, the spectrum of spontaneous fluctuations of a generalized coordinate is fixed by the imaginary part of its generalized susceptibility and a universal quantum thermal factor. The derivation is elementary in retrospect, devastating in implication. Everything one needs is (i) a system Hamiltonian $H_0$ coupled to an external classical field $f(t)$ through $H_{\\text{int}} = -\\hat{A}\\, f(t)$, (ii) the canonical ensemble at temperature $T$, and (iii) Fermi's golden rule.\n\n### The Callen–Welton construction\n\nLet $\\hat{A}$ be a Hermitian observable with matrix elements $A_{nm} = \\langle n\\mid \\hat{A}\\mid m\\rangle$ between eigenstates of $H_0$. Switch on $f(t)=f_0\\cos\\omega t$. Golden rule gives the net rate of upward minus downward transitions; multiplying by $\\hbar\\omega$ yields the power absorbed by the system,\n\n$$P(\\omega)=\\frac{\\pi\\,f_0^2\\,\\omega}{2}\\sum_{n,m}\\bigl(p_n-p_m\\bigr)\\,\\lvert A_{nm}\\rvert^2\\,\\delta(\\hbar\\omega-(E_m-E_n)),$$\n\nwith $p_n = e^{-\\beta E_n}/Z$. Independently, the dissipated power in a linear-response framework is $P(\\omega)=\\tfrac{1}{2}\\omega f_0^2\\,\\mathrm{Im}\\,\\chi_{AA}(\\omega)$, so\n\n$$\\mathrm{Im}\\,\\chi(\\omega)=\\frac{\\pi}{\\hbar}\\sum_{n,m}(p_n-p_m)\\,\\lvert A_{nm}\\rvert^2\\,\\delta\\!\\bigl(\\omega-\\omega_{mn}\\bigr),\\qquad \\omega_{mn}\\equiv(E_m-E_n)/\\hbar.$$\n\nNow compute the symmetrized fluctuation spectrum directly,\n\n$$S_{AA}(\\omega)\\equiv\\tfrac{1}{2}\\!\\int_{-\\infty}^{\\infty}\\!dt\\,e^{i\\omega t}\\,\\langle\\{\\hat{A}(t),\\hat{A}(0)\\}\\rangle =\\pi\\sum_{n,m}(p_n+p_m)\\,\\lvert A_{nm}\\rvert^2\\,\\delta(\\omega-\\omega_{mn}).$$\n\nThe two sums differ only in the Boltzmann weight: $(p_n-p_m)$ vs. $(p_n+p_m)$. On the support of the delta function $p_m = p_n e^{-\\beta\\hbar\\omega}$, so the ratio is purely thermal:\n\n$$\\boxed{\\;S_{AA}(\\omega)=\\hbar\\coth\\!\\left(\\frac{\\hbar\\omega}{2 k_B T}\\right)\\mathrm{Im}\\,\\chi_{AA}(\\omega)\\;}$$\n\nThat is the theorem [7]. The conventions in [1] and downstream literature differ by factors of $2$ and $\\pi$ depending on whether one symmetrizes over $\\omega$ and how the Fourier transform is normalized; the *physics* — the $\\coth$ — is convention-independent.\n\n### Anatomy of the two spectra\n\nThe crucial distinction the theorem makes precise is between the two natural two-point functions of a quantum observable. Define\n\n$$S^{+}_{AA}(\\omega)=\\tfrac{1}{2}\\!\\int dt\\,e^{i\\omega t}\\langle\\{\\hat{A}(t),\\hat{A}(0)\\}\\rangle,\\qquad S^{-}_{AA}(\\omega)=\\tfrac{1}{2i}\\!\\int dt\\,e^{i\\omega t}\\langle[\\hat{A}(t),\\hat{A}(0)]\\rangle.$$\n\nThe anticommutator $S^{+}$ is the *fluctuation* spectrum — what a square-law detector reads. The commutator $S^{-}$ is the *dissipation* spectrum and, by the Kubo formula [10, 1], equals $\\hbar\\,\\mathrm{Im}\\,\\chi(\\omega)$. The FDT states $S^{+}=\\coth(\\beta\\hbar\\omega/2)\\,S^{-}$. Because $\\coth$ is odd, $S^{+}$ is even in $\\omega$ (as required for a real classical-looking spectrum) while $S^{-}$ is odd: absorption and emission rates differ by the Boltzmann factor, and their *difference* is fixed by quantum mechanics alone, not by $T$. This is why a vacuum $T\\!\\to\\!0$ resistor still has $S^{+}_V(\\omega)=\\hbar\\omega R/2$ above the ground-state crossover — zero-point voltage fluctuations are a logical necessity once one accepts that $\\mathrm{Im}\\,\\chi\\ne 0$. The point was driven home experimentally only decades later in mesoscopic and optomechanical setups [11].\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eQuantum vs classical FDT spectra\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"60\" y1=\"340\" x2=\"700\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"380\" y1=\"40\" x2=\"380\" y2=\"360\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"690\" y=\"358\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"end\"\u003eω\u003c/text\u003e\u003ctext x=\"388\" y=\"52\" fill=\"#e8e6e1\" font-size=\"14\"\u003eS(ω) / Im χ(ω)\u003c/text\u003e\u003ctext x=\"60\" y=\"60\" fill=\"#e8e6e1\" font-size=\"14\"\u003eunits of ℏ\u003c/text\u003e\u003cpath d=\"M 80 95 Q 200 110 360 250 Q 380 270 400 250 Q 560 110 680 95\" fill=\"none\" stroke=\"#7aa2ff\" stroke-width=\"2.2\"/\u003e\u003cpath d=\"M 80 330 Q 230 280 380 200 Q 530 120 680 75\" fill=\"none\" stroke=\"#ffb86b\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\"/\u003e\u003cline x1=\"60\" y1=\"200\" x2=\"700\" y2=\"200\" stroke=\"#7ee0a3\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/\u003e\u003ctext x=\"68\" y=\"195\" fill=\"#7ee0a3\" font-size=\"13\"\u003ezero-point floor ℏ/2\u003c/text\u003e\u003ctext x=\"120\" y=\"120\" fill=\"#7aa2ff\" font-size=\"14\"\u003eS⁺(ω) = ℏ coth(ℏω/2k_BT) Im χ(ω)\u003c/text\u003e\u003ctext x=\"120\" y=\"305\" fill=\"#ffb86b\" font-size=\"14\"\u003eclassical limit: 2k_BT/ω · Im χ(ω)\u003c/text\u003e\u003ctext x=\"395\" y=\"375\" fill=\"#e8e6e1\" font-size=\"13\"\u003eω = 0\u003c/text\u003e\u003cline x1=\"270\" y1=\"340\" x2=\"270\" y2=\"335\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"232\" y=\"358\" fill=\"#e8e6e1\" font-size=\"12\"\u003ek_BT/ℏ\u003c/text\u003e\u003cline x1=\"490\" y1=\"340\" x2=\"490\" y2=\"335\" stroke=\"#e8e6e1\" stroke-width=\"1\"/\u003e\u003ctext x=\"455\" y=\"358\" fill=\"#e8e6e1\" font-size=\"12\"\u003e+k_BT/ℏ\u003c/text\u003e\u003ctext x=\"60\" y=\"385\" fill=\"#e8e6e1\" font-size=\"12\"\u003ethermal plateau |ω|≪k_BT/ℏ ⇒ S⁺ → 2k_BT Im χ/ω; quantum tail |ω|≫k_BT/ℏ ⇒ S⁺ → ℏ|ω| Im χ (+ vacuum)\u003c/text\u003e\u003c/svg\u003e\n\n*Figure: Symmetric fluctuation spectrum $S^{+}(\\omega)$ (blue) divided by $\\mathrm{Im}\\,\\chi(\\omega)$, compared with the classical Nyquist envelope $2 k_B T/\\omega$ (orange). The two coincide on the thermal plateau $\\lvert\\omega\\rvert\\ll k_B T/\\hbar$ and depart on the quantum tail, where $S^{+}\\to\\hbar\\lvert\\omega\\rvert\\,\\mathrm{Im}\\,\\chi$ leaves a $T$-independent zero-point floor.*\n\n### Classical and high-temperature limits\n\nFor $\\hbar\\omega\\ll k_B T$, $\\coth(\\beta\\hbar\\omega/2)\\to 2 k_B T/\\hbar\\omega$, and\n\n$$S^{+}_{AA}(\\omega)\\xrightarrow{\\hbar\\to 0}\\frac{2 k_B T}{\\omega}\\,\\mathrm{Im}\\,\\chi_{AA}(\\omega).$$\n\nPlugging in the resistor susceptibility $\\chi_{VV}(\\omega)=R$ (purely resistive at low $\\omega$) recovers Nyquist's $S_V(\\omega)=2 k_B T R$ in the symmetric, two-sided convention — equivalently $4 k_B T R$ on a one-sided positive-$\\omega$ axis [9, 8]. Setting $\\chi(\\omega)=1/(-i\\omega\\gamma m)$ for an overdamped Brownian particle reproduces $\\langle x^2\\rangle$ via the Einstein relation $D=k_BT/\\gamma m=\\mu k_B T$ [2, 5]. Every textbook FDT identity is the same equation evaluated on a different $\\chi$.\n\n### Kramers–Kronig and why $\\mathrm{Im}\\,\\chi$ is enough\n\nCausality forces $\\chi(t\u003c0)=0$, hence $\\chi(z)$ is analytic in the upper half $z$-plane. Cauchy's theorem gives the Kramers–Kronig relations\n\n$$\\mathrm{Re}\\,\\chi(\\omega)=\\frac{1}{\\pi}\\,\\mathcal{P}\\!\\!\\int_{-\\infty}^{\\infty}\\!\\!d\\omega'\\,\\frac{\\mathrm{Im}\\,\\chi(\\omega')}{\\omega'-\\omega},\\qquad \\mathrm{Im}\\,\\chi(\\omega)=-\\frac{1}{\\pi}\\,\\mathcal{P}\\!\\!\\int_{-\\infty}^{\\infty}\\!\\!d\\omega'\\,\\frac{\\mathrm{Re}\\,\\chi(\\omega')}{\\omega'-\\omega}.$$\n\nThe reactive part is therefore redundant data once the dissipative part is known. Combined with the FDT, this means a single real function $\\mathrm{Im}\\,\\chi(\\omega)\\ge 0$ encodes the entire linear thermodynamics of the observable: response, fluctuation, and reactive susceptibility. Reading the FDT backwards turns the equilibrium noise spectrum into a non-invasive spectrometer of the dissipative response — the strategy exploited everywhere from dielectric spectroscopy to gravitational-wave interferometer characterization.\n\n### KMS: the axiom underneath\n\nWhy a hyperbolic cotangent and not, say, a Bose factor? Because both appear in the same identity. Kubo, Martin, and Schwinger noticed that the canonical ensemble imposes an analytic condition on equilibrium two-point functions. With $G^{\u003e}(t)\\equiv\\langle\\hat{A}(t)\\hat{A}(0)\\rangle$ and $G^{\u003c}(t)\\equiv\\langle\\hat{A}(0)\\hat{A}(t)\\rangle$, cyclicity of the trace with $\\rho=e^{-\\beta H}/Z$ gives the *KMS condition*\n\n$$G^{\u003e}(t)=G^{\u003c}(t+i\\hbar\\beta)\\quad\\Longrightarrow\\quad \\tilde G^{\u003e}(\\omega)=e^{\\beta\\hbar\\omega}\\,\\tilde G^{\u003c}(\\omega).$$\n\nThis is detailed balance promoted from rates to full correlators. Combining $S^{+}=\\tfrac12(\\tilde G^{\u003e}+\\tilde G^{\u003c})$ and $\\hbar\\,\\mathrm{Im}\\,\\chi=\\tfrac12(\\tilde G^{\u003e}-\\tilde G^{\u003c})$ with the KMS ratio immediately yields the $\\coth$. The FDT is therefore a *theorem about equilibrium states*, not about Hamiltonians: any state satisfying KMS at $(\\beta,H_0)$ obeys it, and any state that violates it — driven steady states, aging glasses, active baths — does not. KMS, formalized in the algebraic-QFT setting in the late 1950s, is the statement that retroactively justifies Onsager's regression hypothesis [12, 13]: it is the regression hypothesis, made an axiom.\n\n### What the theorem is and is not\n\nThe theorem proper is the spectral identity above. It is *not* the Kubo formula (which is the linear-response expression for $\\chi$ itself, valid even out of equilibrium provided one keeps the right density matrix), it is *not* Onsager reciprocity (which is a symmetry of the matrix of $\\chi$'s under time reversal), and it is *not* a fluctuation theorem of the Jarzynski–Crooks family [14, 15] (which constrains the full distribution of work, not the second moment of an observable). These confusions, which the dossier will revisit, all dissolve once the FDT is read as: *given KMS, $S^{+}=\\hbar\\coth(\\beta\\hbar\\omega/2)\\,\\mathrm{Im}\\,\\chi$, full stop.*"}, {"id": "evolution-kubo-mori-green-nakano", "title": "From Nyquist to Kubo: How Linear Response Theory Absorbed the FDT", "markdown": "## From Nyquist to Kubo: How Linear Response Theory Absorbed the FDT\n\nThe 1951 Callen–Welton paper [7] proved a theorem; it did not yet supply a calculus. To compute $\\mathrm{Im}\\,\\chi(\\omega)$ for an actual many-body Hamiltonian — a metal, a magnet, a dielectric — one needed a perturbative machinery that ground out susceptibilities directly from the microscopic dynamics. That machinery is what the next fifteen years assembled, and in doing so the FDT migrated from a stand-alone identity to a corollary of a much larger edifice: linear response theory. The migration is also the reason a result proved in 1951 is, in most modern condensed-matter courses, taught under the name of a 1957 paper.\n\n### Nyquist's shortcut and what it left unfinished\n\nNyquist's 1928 derivation [8] is a marvel of thermodynamic economy. A resistor $R$ is connected by a lossless transmission line of length $L$ to an identical resistor; in equilibrium each carries one-dimensional electromagnetic modes populated according to equipartition (one $k_B T$ per mode in the Rayleigh–Jeans limit, $\\tfrac{1}{2}\\hbar\\omega\\coth(\\hbar\\omega/2k_BT)$ in the full quantum version Nyquist also wrote down). Balancing the power radiated against the power absorbed gives\n$$S_V(\\omega) \\;=\\; 2 R(\\omega)\\,\\hbar\\omega\\,\\coth\\!\\left(\\frac{\\hbar\\omega}{2 k_B T}\\right),$$\nor $4 k_B T R$ in the classical limit. The argument is unimprovable for a two-terminal linear element, but it is also tied to that geometry: it gives no recipe for computing $R(\\omega)$ itself from a microscopic Hamiltonian, and it does not tell you which observable correlator to write down for, say, the spin susceptibility of a paramagnet or the bulk viscosity of a fluid. Johnson's measurement [9] established that $S_V$ depended only on $T$ and $R$ and on no microscopic detail of the conductor — exactly the universality the later theorem demanded — but the microscopic side was missing.\n\n### Onsager 1931: reciprocity is not FDT\n\nThe first piece of microscopic apparatus arrived three years later in Onsager's reciprocity papers [12, 13]. From microscopic reversibility plus the regression hypothesis — that the decay of a spontaneous fluctuation obeys the same linear law as a macroscopically prepared deviation — Onsager derived $L_{ij}(B) = L_{ji}(-B)$ for the matrix of kinetic coefficients between conjugate thermodynamic fluxes and forces. It is tempting, and common, to conflate this with the FDT, but the two statements live on different levels. Reciprocity is a symmetry: it constrains the off-diagonal structure of $\\mathbf{L}$ without fixing any absolute scale. The FDT is a magnitude statement: it equates the size of the equilibrium fluctuation spectrum to the dissipative response, with $k_B T$ as the conversion factor (and $\\hbar\\coth$ as its quantum extension). One can write down a theory satisfying reciprocity but with arbitrary noise normalization; only the regression hypothesis — which Onsager assumed and the FDT actually proves — closes the loop. Onsager's papers are the substrate of the later proofs, not a statement of them; pedagogy that lists \"Onsager–Callen–Welton–Kubo\" as a single result is eliding a real conceptual step.\n\n### Green and Nakano: the correlator emerges\n\nBy the early 1950s the missing ingredient was a microscopic formula expressing a transport coefficient as an equilibrium time-correlation. Green [16] gave it for fluids: viscosities, thermal conductivities and diffusion constants as integrals $\\int_0^\\infty \\langle J(0) J(t)\\rangle_\\mathrm{eq}\\,dt$ of flux autocorrelations, derived through a Markovian analysis of the time evolution of phase-space distributions. Nakano [17] independently derived the electrical conductivity in the same form in 1956, a year before Kubo's JPSJ paper; Kubo himself cites Nakano in [10]. The \"Green\" of the Green–Kubo nomenclature is therefore a historically honest concession that the correlator-as-transport-coefficient idea was in the air before Kubo formalised it — and Nakano's contribution should join it. Crucially, these papers gave the *first-kind* correlator (current–current at equilibrium) without yet exhibiting the broader symmetry structure that ties it to dissipation.\n\n### Kubo 1957: linear response as a unifying frame\n\nKubo's 1957 paper [10] did three things at once that no predecessor had combined. First, it set up the systematic time-dependent perturbation theory for a Hamiltonian $H_0 + H'(t)$ with $H'(t) = -A F(t)$, yielding the response of any observable $B$ as\n$$\\chi_{BA}(t) \\;=\\; \\frac{i}{\\hbar}\\,\\theta(t)\\,\\langle [B(t), A(0)]\\rangle_\\mathrm{eq},$$\nthe canonical-ensemble retarded commutator. Second, it showed that all the Green–Nakano transport formulae are special cases of this expression, by an appropriate choice of $A$ and $B$ and an $\\omega \\to 0$ limit. Third — and this is the step that absorbed the FDT — it exhibited the spectral identity between the symmetric (anticommutator) correlator $S_{BA}(\\omega)$ and $\\mathrm{Im}\\,\\chi_{BA}(\\omega)$, recovering Callen–Welton's coth formula as an immediate corollary of the Kubo–Martin–Schwinger condition on equilibrium states. The FDT thus stopped being a separately proved theorem and became a property of the equilibrium correlator that the linear-response calculus naturally returned.\n\nThis is the source of the \"Kubo's FDT\" anachronism. The general quantum theorem belongs to Callen and Welton in 1951 [7]; what Kubo provided in 1957 was the machinery within which the theorem trivializes. Calling the resulting identity Kubo's is a forgivable but real six-year backdating — and one that has crowded out Callen and Welton from textbooks aimed at condensed-matter audiences, although thermodynamics texts in the Callen lineage have preserved the priority.\n\n### Mori 1965: the second-kind FDT\n\nThe final formal piece is Mori's 1965 projection-operator construction [18]. Define a projector $\\mathcal{P}$ onto a chosen slow subspace of observables $\\{A_i\\}$; apply it to the Liouville equation; iterate. The result is the generalized Langevin equation\n$$\\dot{A}_i(t) \\;=\\; i\\,\\Omega_{ij} A_j(t) \\;-\\; \\int_0^t K_{ij}(t-s)\\,A_j(s)\\,ds \\;+\\; f_i(t),$$\nwith a memory kernel $K_{ij}$ and an orthogonal \"noise\" $f_i$. Mori showed that the kernel and the noise autocorrelation are tied by\n$$K_{ij}(t) \\;=\\; \\beta\\,\\langle f_i(t)\\,f_j(0)\\rangle,$$\nthe *fluctuation–dissipation theorem of the second kind* in Kubo's later terminology. Where the first kind (Callen–Welton, Kubo) is a statement about an open system's response to an external field, the second kind is internal: friction and noise inside a generalized Langevin equation are not independent objects but a single bath correlator viewed from two sides. The Feynman–Vernon influence functional [19], appearing two years earlier, had already exhibited the same identity for a system bilinearly coupled to a harmonic-oscillator bath — independent confirmation that the FDT is a structural feature of any unitary system–bath construction, not a peculiarity of canonical equilibrium.\n\n### Kubo 1966: the name and the partition\n\nBy the mid-1960s the field had two FDTs (first and second kind), four named formulas (Einstein, Nyquist, Callen–Welton, Kubo), and at least three communities (chemical physics via Green, electrical engineering via Nyquist, magnetism and transport via Kubo and Mori) using overlapping notation. Kubo's 1966 *Reports on Progress in Physics* article [1] performed the consolidation: it canonised the phrase \"fluctuation–dissipation theorem\", drew the first/second-kind distinction explicitly, and embedded both inside the linear-response framework. The price of that consolidation, paid in attribution, is the credit-flattening described above: Callen and Welton appear in Kubo's reference list, but in the pedagogical lineage that flows from this review the theorem is essentially branded Kubo's. The mathematics is unchanged. The historical record is not."}, {"id": "landmark-experiments", "title": "Landmark Measurements: Perrin's Granules to Squeezed Light at the Quantum Limit", "markdown": "## Landmark Measurements: Perrin's Granules to Squeezed Light at the Quantum Limit\n\nA theorem of the form $S(\\omega) = \\hbar\\coth(\\hbar\\omega/2k_BT)\\,\\mathrm{Im}\\,\\chi(\\omega)$ makes a strong claim: measure one observable's response, multiply by a known thermal factor, and you have predicted a second, independent observable — its equilibrium noise — with no free parameter. An experiment \"tests\" the theorem only when both sides are measured independently in the same apparatus and forced to agree. An experiment that uses one side to infer the other — overwhelmingly the modern use case — assumes FDT as a calibration tool. The history of FDT instrumentation is in large part the history of which experiments fall into which category, and where the boundary has shifted as the temperature, the frequency, and the smallness of the sensor have moved.\n\n### Perrin: the relation as a route to Avogadro\n\nEinstein's $D = \\mu k_B T$ [2] was, in 1905, a prediction with no instrument behind it. Jean Perrin and his students between 1908 and 1913 supplied the instrument: tracked colloidal mastic and gamboge granules under the ultramicroscope, measured the diffusion constant $D$ directly from $\\langle (\\Delta x)^2 \\rangle = 2Dt$, and measured the Stokes mobility $\\mu = 1/6\\pi\\eta a$ independently from the granule radius $a$ and the calibrated viscosity $\\eta$ of water. The ratio $D/\\mu$ delivered $k_B T$ and hence Avogadro's number; the agreement with values obtained from black-body radiation, electrolysis, and the kinetic theory of gases was the experimental ground on which atomism stopped being controversial. This is the only era in which the FDT was unambiguously *tested* in its simplest incarnation: both $D$ and $\\mu$ measured, with $T$ a thermometer reading, no free parameter (verify). Smoluchowski's 1906 derivation [3] and the Langevin formalism [5] supplied the theoretical scaffold inside which Perrin's numbers became a falsifiable identity, and Uhlenbeck and Ornstein's 1930 stochastic-process treatment [6] later closed the loop on what \"diffusion\" precisely meant at the velocity-correlation level.\n\n### Johnson and the resistor\n\nJohnson's 1928 measurements [9] sit in the same independent-test category. He built a vacuum-tube amplifier of well-characterised bandwidth, immersed metal-film, electrolytic, and carbon resistors in stirred oil baths at temperatures from $\\sim 290\\,\\mathrm{K}$ to $\\sim 370\\,\\mathrm{K}$, and showed that the mean-square voltage scaled linearly with $T$ and with $R$, with a slope material- and geometry-independent. Nyquist's calculation [8], performed on Johnson's request, reproduced the slope $4k_B T R$ from a transmission-line equipartition argument and supplied the high-frequency Planck factor. The combination — Johnson measuring $S_V$, an independent ohmmeter measuring $R$, a thermometer measuring $T$ — is again a parameter-free verification, and the prefactor it pinned down ($4 k_B$) was good to a few percent already in 1928. Modern primary-thermometry programmes (Johnson Noise Thermometry at NIST and PTB) invert this logic: take $4k_B$ and $R$ as known and read $T$ from $S_V$, achieving sub-mK uncertainty near room temperature.\n\n### Mid-century: torsion balances and Kappler\n\nLess remembered than Perrin or Johnson is Eugen Kappler's 1931 mirror–torsion-fibre experiment, which photographed the Brownian-driven angular fluctuations of a $\\sim$ mg quartz mirror and used $\\langle \\theta^2 \\rangle = k_B T / \\kappa$ — the zero-frequency FDT for a torsional oscillator — to extract $k_B$ to better than 1% from $\\kappa$, $T$, and the variance alone (verify). Kappler's apparatus is the conceptual ancestor of every gravitational-wave thermal-noise budget and every AFM cantilever calibration that follows.\n\n\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\u003e\u003ctitle\u003eFDT regimes and experimental landmarks\u003c/title\u003e\u003crect x=\"0\" y=\"0\" width=\"720\" height=\"400\" fill=\"none\"/\u003e\u003cline x1=\"70\" y1=\"340\" x2=\"690\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003cline x1=\"70\" y1=\"60\" x2=\"70\" y2=\"340\" stroke=\"#e8e6e1\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"380\" y=\"378\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\"\u003elog10( ℏω / kBT)\u003c/text\u003e\u003ctext x=\"20\" y=\"200\" fill=\"#e8e6e1\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 20 200)\"\u003eS(ω) / Im χ(ω) [units of ℏω]\u003c/text\u003e\u003ctext x=\"70\" y=\"357\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e-12\u003c/text\u003e\u003ctext x=\"194\" y=\"357\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e-9\u003c/text\u003e\u003ctext x=\"318\" y=\"357\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e-6\u003c/text\u003e\u003ctext x=\"442\" y=\"357\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e-3\u003c/text\u003e\u003ctext x=\"566\" y=\"357\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e0\u003c/text\u003e\u003ctext x=\"690\" y=\"357\" fill=\"#e8e6e1\" font-size=\"12\" text-anchor=\"middle\"\u003e3\u003c/text\u003e\u003cpath d=\"M70,80 L566,335 L690,80\" stroke=\"#7aa2ff\" stroke-width=\"0.6\" stroke-dasharray=\"3,3\" fill=\"none\"/\u003e\u003cpath d=\"M70,330 Q540,330 566,260 Q600,150 690,80\" stroke=\"#7aa2ff\" stroke-width=\"2.2\" fill=\"none\"/\u003e\u003ctext x=\"200\" y=\"320\" fill=\"#7aa2ff\" font-size=\"13\"\u003eclassical: S ≈ 2 kBT · Im χ / ω\u003c/text\u003e\u003ctext x=\"500\" y=\"120\" fill=\"#7aa2ff\" font-size=\"13\"\u003equantum floor: S → ℏ · Im χ\u003c/text\u003e\u003ccircle cx=\"100\" cy=\"332\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"106\" y=\"328\" fill=\"#ffb86b\" font-size=\"12\"\u003ePerrin 1908 (μm beads, 300 K)\u003c/text\u003e\u003ccircle cx=\"260\" cy=\"332\" r=\"5\" fill=\"#ffb86b\"/\u003e\u003ctext x=\"266\" y=\"328\" fill=\"#ffb86b\" font-size=\"12\"\u003eJohnson 1928 (kHz, 300 K)\u003c/text\u003e\u003ccircle cx=\"300\" cy=\"332\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"306\" y=\"318\" fill=\"#7ee0a3\" font-size=\"12\"\u003eLIGO mirror, 100 Hz, 295 K\u003c/text\u003e\u003ccircle cx=\"360\" cy=\"332\" r=\"5\" fill=\"#7ee0a3\"/\u003e\u003ctext x=\"366\" y=\"308\" fill=\"#7ee0a3\" font-size=\"12\"\u003eAFM cantilever, 10 kHz, 300 K\u003c/text\u003e\u003ccircle cx=\"540\" cy=\"320\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"430\" y=\"270\" fill=\"#ff7a90\" font-size=\"12\"\u003eoptomech. drum, 10 MHz, 20 mK\u003c/text\u003e\u003ccircle cx=\"610\" cy=\"180\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"500\" y=\"200\" fill=\"#ff7a90\" font-size=\"12\"\u003ecircuit QED, 6 GHz, 20 mK\u003c/text\u003e\u003ccircle cx=\"660\" cy=\"110\" r=\"5\" fill=\"#ff7a90\"/\u003e\u003ctext x=\"540\" y=\"100\" fill=\"#ff7a90\" font-size=\"12\"\u003esqueezed light (ℏω/2 floor)\u003c/text\u003e\u003c/svg\u003e\n*Figure: The dimensionless FDT spectrum $x\\coth(x/2)$ with $x=\\hbar\\omega/k_BT$, transitioning from the classical Nyquist plateau (slope $-1$ on this axis) to the quantum zero-point floor $\\hbar$Im$\\chi$. Landmark experiments are plotted by their typical $(\\omega,T)$. The leftmost points sit deep in the classical regime; only mK-scale GHz experiments populate the quantum half.*\n\n### Gravitational-wave interferometers: FDT as a design constraint\n\nBy the time Drever, Hough, and Weiss began thinking through suspended-mirror interferometers, the FDT had stopped being something to test and become a hard floor that drove the entire optical and mechanical design. Saulson's 1990 reduction of Callen–Welton to the realistic case of an internal-loss oscillator showed that the displacement noise of a suspended mass with mechanical admittance $Y(\\omega)$ is $S_x(\\omega) = (4 k_B T / \\omega^2)\\,\\mathrm{Re}\\,Y(\\omega)$, which makes the noise spectrum *exactly* as coloured as the loss angle $\\phi(\\omega)$ — viscous damping gives a flat $S_x$, structural damping gives $1/f$ (verify). LIGO and Virgo therefore migrated to fused-silica suspensions, monolithic ear-bonded fibres, and dielectric coatings selected for low $\\phi$, with the residual coating Brownian noise still setting the mid-band sensitivity. The aLIGO sensitivity curve in the 30–300 Hz band is, quite literally, a plot of $\\mathrm{Re}\\,Y(\\omega)$ multiplied by $4k_BT$; the detection of GW150914 is therefore an indirect but spectacular validation that the FDT correctly describes the thermal mechanics of dielectric multilayers at room temperature.\n\n### AFM and torsion balances: FDT as a ruler\n\nThe Hutter–Bechinger calibration of AFM cantilever spring constants from $k = k_B T / \\langle z^2 \\rangle$, and the equivalent procedure for the Cavendish-style torsion balances used in short-range gravity tests at Eöt-Wash and HUST, *assumes* the FDT and uses it to convert a noise spectrum into a force ruler (verify). The fixed point — the cantilever is a passive, near-equilibrium harmonic oscillator at the measured air or vacuum bath temperature — is verified by checking that $\\langle z^2 \\rangle k$ is observable-independent and scales linearly with $T$ over a decade or more. This is the standard pattern in modern soft-matter and biophysics: the FDT becomes a metrology layer, and the experimental discipline is to *bound* the non-equilibrium corrections rather than to retest the theorem at every shot.\n\n### Cavity optomechanics and circuit QED: pushing into the coth ceiling\n\nThe frontier landmark experiments live where $\\hbar\\omega \\gtrsim k_B T$ and the coth factor in $\\hbar\\coth(\\hbar\\omega/2k_BT)$ ceases to be unity. Sideband cooling of mechanical drums and beams to mean phonon occupancies $\\bar n \u003c 1$ (Teufel *et al.* 2011, Chan *et al.* 2011) and direct measurement of the asymmetry between Stokes and anti-Stokes sideband powers — proportional to $\\bar n + 1$ and $\\bar n$ respectively — provided the first thermometry that depends on the *quantum* form of the FDT: the ratio of the two sidebands at temperature $T$ measures $\\exp(\\hbar\\omega/k_BT)$ directly, and reads ground state when it diverges [11]. Circuit QED experiments at $\\sim$6–10 GHz and $\\sim$20 mK live deep in the quantum regime ($\\hbar\\omega/k_BT \\sim 25$); their amplifier noise floors collide with the half-photon zero-point limit $\\hbar\\omega/2$ set by FDT-respecting linear amplification (Caves 1982), and squeezed-light generation from Josephson parametric amplifiers and from optomechanical cavities now demonstrably *redistributes* — but does not eliminate — that floor between conjugate quadratures. The Feynman–Vernon influence-functional construction [19] is the cleanest theoretical bridge: an explicit bath of harmonic oscillators reproduces the coth factor exactly, and the laboratory has now confirmed that real superconducting and mechanical degrees of freedom respect it down to single quanta.\n\nThese experiments invert the historical relationship Perrin established. He used the FDT to measure a number of microscopic constituents; the modern frontier uses the FDT to certify that a quantum device is *in* its ground state — and any residual noise above the coth floor is, by the theorem, evidence of either heating or a breakdown of the equilibrium assumption itself. The latter is the bridge to §6."}, {"id": "conflations-and-what-remains-valid", "title": "Conflation Watch: What FDT Is Not — Kubo Formula, Onsager Reciprocity, Jarzynski–Crooks", "markdown": "## Conflation Watch: What FDT Is Not — Kubo Formula, Onsager Reciprocity, Jarzynski–Crooks\n\nThe fluctuation–dissipation theorem attracts conflations the way a magnet attracts iron filings. Linear response theory, transport correlators, microscopic reversibility, modern entropy-production identities, and the $\\hbar \\to 0$ limit all live in its neighbourhood and all are distinct from it. Conflating them is not pedantic bookkeeping: each of the five elisions below licenses an inference that is false in some regime where the FDT is routinely invoked.\n\n### 1. FDT ≠ Kubo formula\n\nKubo's 1957 paper [10] expresses the linear susceptibility of a Hamiltonian system to a perturbation $H'(t) = -A f(t)$ as\n$$\\chi_{BA}(\\omega) = \\frac{i}{\\hbar}\\int_0^\\infty dt\\, e^{i\\omega t}\\langle [B(t), A(0)] \\rangle_{\\mathrm{eq}}.$$\nThis identity holds for *any* stationary ensemble admitting Heisenberg evolution — canonical, micro-canonical, generalised Gibbs. It is a statement about the *commutator* (antisymmetric) correlator, derivable from first-order time-dependent perturbation theory alone.\n\nThe FDT in the Callen–Welton form [7]\n$$S_{BA}(\\omega) = \\hbar\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_BT}\\right)\\mathrm{Im}\\,\\chi_{BA}(\\omega)$$\nadds a second ingredient: the equilibrium *anticommutator* spectrum $S_{BA}(\\omega) = \\tfrac12\\int dt\\, e^{i\\omega t}\\langle\\{B(t),A(0)\\}\\rangle$ is determined by $\\mathrm{Im}\\,\\chi$ together with the bath temperature. The crucial extra input is the KMS condition $\\langle A(0)B(t)\\rangle = \\langle B(t-i\\hbar\\beta)A(0)\\rangle$, i.e. detailed balance — a property of the *state*, not of the dynamics. In a non-thermal stationary ensemble (a NESS, an integrable system in a GGE, a quenched isolated system) the Kubo formula remains intact while the FDT relation breaks. Mori's 1965 projection-operator construction [18] is again Kubo-type when one writes the generalised Langevin equation, but the identification of the memory kernel with the noise autocorrelation — the \"second-kind FDT\" of Kubo's 1966 review [1] — requires the equilibrium average.\n\n### 2. FDT ≠ Onsager reciprocity\n\nOnsager's 1931 relations [12, 13] are *symmetry* statements about the matrix of linear coefficients $L_{ij}$ relating thermodynamic fluxes $J_i$ to forces $X_j$:\n$$L_{ij}(B) = L_{ji}(-B).$$\nThe derivation invokes microscopic time-reversal and the regression hypothesis — that a spontaneous fluctuation decays by the same macroscopic law that governs the relaxation of an externally prepared deviation. Reciprocity holds in purely classical systems and contains no temperature: cross-conductivities are symmetric whether the bath is at 1 K or 1000 K.\n\nThe FDT, by contrast, fixes the *magnitude* of the fluctuations in terms of the dissipative coefficients and $T$. Reciprocity tells you that thermo-power and the Peltier coefficient are related; the FDT tells you what the Johnson noise on the same wires is. Kubo-style linear response derives both as corollaries of the same Hamiltonian formalism, which is why the two are habitually bundled. They remain logically independent: a hypothetical violation of FDT in a steady state (an \"effective temperature\" that runs with $\\omega$) need not violate Onsager. Gallavotti's chaotic-hypothesis treatment [20] recovers reciprocity from a dynamical SRB-measure assumption without needing the Gibbs measure that the FDT requires — the asymmetry of the two statements is structural.\n\n### 3. FDT ≠ Einstein relation\n\nThe Einstein relation $D = \\mu k_B T$ [2], with Smoluchowski's independent 1906 derivation [3] and Langevin's 1908 stochastic formulation [5], is the zero-frequency, single-degree-of-freedom slice of the FDT. For a tagged particle obeying $m\\dot v = -\\gamma v + \\xi(t)$ with $\\langle \\xi(t)\\xi(0)\\rangle = 2\\gamma k_B T\\,\\delta(t)$ (Uhlenbeck–Ornstein [6]), the mobility is $\\mu = 1/\\gamma$ and $D = k_B T/\\gamma$. The full Callen–Welton statement is *frequency-resolved*: $\\mathrm{Im}\\,\\chi(\\omega)/\\omega$ at all $\\omega$ is fixed by the spectrum. Calling $D = \\mu k_B T$ \"the FDT\" obscures three things: (i) the quantum coth factor at $\\hbar\\omega \\gtrsim k_B T$; (ii) the requirement of Markovian response for the simple Einstein form — non-trivial memory kernels demand the second-kind FDT; (iii) the fact that the same identity, enforced at every $\\omega$, becomes a strong constraint on the entire spectral function, an engine that drives $f$-sum-rule consistency in metals and the Kramers–Kronig structure of $\\chi$.\n\n### 4. FDT ≠ Jarzynski–Crooks fluctuation theorems\n\nThe most common modern confusion is to treat the \"fluctuation theorems\" of Bochkov–Kuzovlev, Evans–Cohen–Morriss, Gallavotti–Cohen, Jarzynski, and Crooks [15] as generalisations of the FDT to far from equilibrium. They are not, in any usefully literal sense. The FDT is a *two-point* identity between an equilibrium correlator and an equilibrium susceptibility, valid to first order in the perturbation. The Crooks relation\n$$\\frac{P_F(+W)}{P_R(-W)} = e^{\\beta(W-\\Delta F)}$$\nis an identity for the *full distribution* of work performed in an arbitrary protocol of arbitrary amplitude, valid for systems coupled to a single thermal bath at temperature $T$. Seifert's review [14] catalogues the modern family — entropy-production fluctuation theorems for Langevin dynamics, Markov-jump processes, feedback-controlled systems — none of which require the perturbation to be small.\n\nThe intersection is narrow: expanding Jarzynski $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ to second order in the protocol reproduces the FDT for the susceptibility of the conjugate observable, and Crooks reduces to a Green–Kubo expression [16] in the same limit. The temperature $T$ in the Jarzynski–Crooks identities is the temperature of the *initial canonical ensemble*; it carries no statement about the spectral content of fluctuations during the driven trajectory. Treating these as \"non-equilibrium FDTs\" elides this distinction and is responsible for a sub-literature claiming to \"test\" FDT in driven steady states by checking integral work identities — a non-sequitur.\n\n### 5. Classical FDT ≠ quantum FDT with $\\hbar \\to 0$\n\nThe quantum FDT\n$$S(\\omega) = \\hbar\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_BT}\\right)\\mathrm{Im}\\,\\chi(\\omega)$$\ncontains a piece that survives every classical limit. As $T \\to 0$, $\\coth \\to \\mathrm{sgn}(\\omega)$ and $S(\\omega) \\to \\hbar\\,|\\mathrm{Im}\\,\\chi(\\omega)|$: a finite, irreducible zero-point spectrum. The Feynman–Vernon influence functional [19] makes this concrete — a harmonic bath contributes a noise kernel that does not vanish at $T = 0$. In the classical regime ($\\hbar\\omega \\ll k_BT$ at all relevant frequencies), $\\hbar\\coth(\\hbar\\omega/2k_BT) \\to 2k_BT/\\omega$, giving the Nyquist form $S(\\omega) = (2k_BT/\\omega)\\mathrm{Im}\\,\\chi(\\omega)$ consistent with Johnson's measurement [9] and Nyquist's derivation [8]. The zero-point piece is not a quantum correction to be Taylor-expanded away; it is what cavity-optomechanics readouts [11] and circuit-QED amplifiers actually measure when they reach the standard quantum limit. A practitioner who uses the classical Nyquist formula at GHz frequencies and mK temperatures will under-estimate the noise floor by orders of magnitude.\n\n### What survives where\n\nThe five statements above can be sorted by what they assume:\n\n| Identity | Hamiltonian dynamics | Canonical state | Detailed balance / KMS | Linear response | Survives at $T=0$ |\n|---|---|---|---|---|---|\n| Onsager reciprocity | yes (microscopic reversibility) | weak | no | yes | yes (trivially) |\n| Kubo formula | yes | optional | no | yes | yes |\n| Classical FDT | no (works for stoch. dyn.) | yes | yes | yes | degenerate |\n| Quantum FDT | yes | yes | yes | yes | yes, with zero-point |\n| Jarzynski–Crooks | no | initial state only | weak | no | open |\n| Einstein $D = \\mu k_BT$ | no | yes | yes | yes (zero-freq) | classical only |\n\nThe FDT proper is the *most constrained* row of this table. It is also the row most often invoked without checking its hypotheses — a habit the next section, on the \"effective temperature\" industry, will dissect."}, {"id": "use-and-abuse", "title": "Use and Abuse: The 'Effective Temperature' Industry in Glassy, Aging, and Active Matter", "markdown": "## Use and Abuse: The 'Effective Temperature' Industry in Glassy, Aging, and Active Matter\n\nThe Callen–Welton identity [7] and its Kubo recast [10, 1] are statements about a system in true thermal equilibrium with a heat bath at temperature $T$. Three preconditions are doing all the work: (i) a Gibbs state $\\rho \\propto e^{-\\beta H}$ — equivalently, the KMS condition $\\langle A(t)B(0)\\rangle = \\langle B(0)A(t+i\\hbar\\beta)\\rangle$; (ii) detailed balance of the microscopic dynamics; (iii) linearity of the response — the perturbation is small enough that one stops at $O(h)$ in the field. Drop any one of these and the theorem becomes, at best, a hypothesis to test. The literature has spent thirty years pretending that two of them — equilibrium and detailed balance — can be quietly retained by relabelling $T \\mapsto T_{\\text{eff}}$.\n\n### Where the violation is unambiguous\n\nIn a system driven by shear, by chemical fuel, or by a self-propulsion force, the stationary distribution is not Gibbsian. There is no $H$ whose canonical ensemble reproduces the statistics, the master equation has irreducible probability currents around closed loops in configuration space, and entropy is produced at a finite rate $\\dot\\sigma\u003e0$. The Harada–Sasa identity makes this concrete: in an overdamped Langevin system the steady-state dissipation rate equals an integral of the *difference* between the measured correlation $C(\\omega)$ and the response $\\mathrm{Im}\\,\\chi(\\omega)/\\omega$ weighted by $2k_BT$. If FDT held, the integrand would vanish identically; the violation is the dissipation. Speck's reviews of driven soft matter [21] and Seifert's stochastic-thermodynamics survey [14] both present the modified FDT in the only form that survives outside equilibrium:\n$$\nT\\,\\chi''(\\omega) \\;=\\; \\tfrac{\\omega}{2}\\,C(\\omega) \\;-\\; \\tfrac{1}{2}B(\\omega),\n$$\nwhere $B(\\omega)$ is the spectrum of a *velocity-like* additive term — the local mean phase-space velocity, or in continuous-space formulations, the conjugate of the probability current. The point is not that fluctuations and dissipation become unrelated; it is that the relation acquires a third term that is *itself measurable* and that vanishes only in equilibrium. There is no need to invent a temperature: there is a missing observable.\n\n### Cugliandolo–Kurchan and the legitimate $T_{\\text{eff}}$\n\nThe one setting in which an effective temperature is more than a fitting parameter is the slow, aging regime of certain mean-field glassy models. Cugliandolo and Kurchan's analytical solution of the spherical $p$-spin glass [22] showed that the two-time correlation $C(t,t_w)$ and integrated response $\\chi(t,t_w)$ at long $t_w$ separate into a *fast* (quasi-equilibrium) sector obeying FDT at the bath temperature $T$, and a *slow* (aging) sector obeying a modified relation\n$$\n\\frac{\\partial \\chi(t,t_w)}{\\partial t_w} \\;=\\; \\frac{X[C(t,t_w)]}{T}\\,\\frac{\\partial C(t,t_w)}{\\partial t_w},\n$$\nwith a *single, observable-independent function* $X(C)$ that plays the role of an inverse temperature ratio. The parametric plot of $T\\chi$ against $1-C$ — what the community calls an FDT plot — produces two straight segments: slope $1$ in the fast sector, slope $X\u003c1$ in the slow sector. Crucially, the same $X(C)$ is recovered from spin, energy, and overlap responses in the same model. That observable independence, together with thermodynamic consistency checks (the same $T_{\\text{eff}}$ governs equipartition of slow modes, and a thermometer coupled selectively to slow modes registers it), is what licenses calling $T_{\\text{eff}} = T/X$ a temperature rather than a regression coefficient.\n\nThe replica calculation that yields $X(C)$ is intimately tied to replica-symmetry breaking. This is why the 2021 Nobel citation to Parisi is, contrary to popular paraphrase, *not* about FDT — it is about the structure of phase space that *forces* a violation of FDT in the aging sector. The correct slogan is \"FDT-violation as diagnostic of RSB\", not \"generalised FDT\".\n\n### The fit-and-declare pattern\n\nOutside mean-field $p$-spin models the situation is grim. The standard procedure in the experimental literature — colloidal glasses under shear, dense active suspensions, microrheology of cytoskeletal networks — reads as follows. (1) Measure $S(\\omega)$ for some chosen observable (a tracer displacement, a stress component). (2) Measure $\\chi''(\\omega)$ for the same observable using a small probe perturbation. (3) Define\n$$\nT_{\\text{eff}}(\\omega) \\;\\equiv\\; \\frac{\\omega\\,S(\\omega)}{2\\,\\chi''(\\omega)}\n$$\nand present its frequency dependence as a discovery. This is a tautology: $T_{\\text{eff}}(\\omega)$ is *defined* so that FDT holds at every frequency. A frequency-dependent $T_{\\text{eff}}$ is a *failure* of FDT dressed in temperature units, not evidence of one. The diagnostic content sits entirely in whether $T_{\\text{eff}}(\\omega)$ collapses across observables and across probe locations over the *same* time-scale window — the Cugliandolo–Kurchan criterion. Almost no paper that reports a $T_{\\text{eff}}$ performs that collapse test.\n\nThree concrete patterns recur:\n\n- **Active-matter rheology.** Suspensions of self-propelled colloids and bacterial baths are routinely characterised by a tracer FDT ratio, with $T_{\\text{eff}}$ reported as a function of activity. Bechinger et al.'s review [23] is candid: in self-propelled systems detailed balance is broken at the single-particle level, persistent flagellar or run-and-tumble forces inject power at finite frequency, and the resulting $T_{\\text{eff}}$ depends on tracer size, density, and the chosen perturbation. The same bath yields a different \"temperature\" to a passive bead than to an embedded filament. This is precisely the observable-dependence that disqualifies the label.\n\n- **Dense colloidal glasses under shear.** Steady shear is the cleanest possible violation: there is a non-zero entropy production rate, a Reynolds-like Galilean structure that mixes fluctuations longitudinal and transverse to the flow, and a manifestly anisotropic susceptibility. The two-time $T_{\\text{eff}}$ extracted from density fluctuations is typically *not* the one extracted from stress fluctuations in the same sample. The Harada–Sasa identity, applied honestly, accounts for the discrepancy as the work done by the shear; the $T_{\\text{eff}}$ literature absorbs it into a redefinition.\n\n- **Biological motors and active networks.** Microrheology of in-vitro acto-myosin gels and intracellular tracking experiments commonly report $T_{\\text{eff}}/T \\sim 2$–$10$ at low frequency, decaying to unity at high frequency. The decay is not the system equilibrating; it is the ATP-driven force spectrum being band-limited. The honest reading — given by Mizuno, MacKintosh, and collaborators in the careful papers — is that $\\chi''(\\omega) - \\omega S(\\omega)/2k_BT$ is a *direct* readout of the non-equilibrium force spectrum injected by motors, and is interesting in its own right. The $T_{\\text{eff}}$ relabel buys nothing and discards the spectral structure that is the actual signal.\n\n### What replaces FDT when FDT fails\n\nAsheichyk and Krüger [24] extend FDT-style identities to systems perturbed by nonconservative forces — useful in optical-trap calibration and in active baths — but only by retaining a Gibbs reference state for the unperturbed system. Speck [21] and Seifert [14] formulate the additive-current correction that turns the violation into an equality. Gallavotti [20] derives, under the chaotic hypothesis, an Onsager-like reciprocity for the non-equilibrium response that reduces to FDT only at zero driving. None of these is a *generalised* FDT in the sense of replacing $T$ by $T_{\\text{eff}}$; all of them keep the structure $\\text{response} = \\text{symmetric correlation} - \\text{current correction}$ and force the experimenter to measure the current. In nonergodic Brownian dynamics [25] and superdiffusive regimes [26], even this structure must be re-examined: the very assumption that a stationary state exists fails, and one is reduced to time-window-resolved statements.\n\nThe lesson is uncomfortable but unambiguous. An effective temperature is meaningful only when (a) two independent observables collapse onto the same $T_{\\text{eff}}$ over the same window, (b) a slow thermometer reads it, (c) the slow sector is dynamically separated from a fast sector that itself obeys FDT at the true bath $T$. Absent these, \"the effective temperature was found to be $T_{\\text{eff}} = 1.8\\,T$\" is a sentence about a fitting procedure, not about thermodynamics."}, {"id": "frontier-and-open-problems", "title": "Frontier: Quantum Limits, Holographic FDT, and the Search for Generalized Theorems", "markdown": "## Frontier: Quantum Limits, Holographic FDT, and the Search for Generalized Theorems\n\nThe Callen–Welton identity [7] is a closed theorem inside its own domain: thermal equilibrium, KMS detailed balance, linear response in a Hamiltonian system. Five distinct frontiers have opened in which one or more of those hypotheses is contested, regulated by a gauge, or absent altogether. None has produced a single replacement theorem of comparable status. The right professional disposition is to know which extension is robust, which is regime-restricted, and which is folklore.\n\n### Zero-point-dominated FDT: optomechanics and circuit QED\n\nThe symmetrised quantum FDT\n$$S_{xx}(\\omega) \\;=\\; \\hbar\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_BT}\\right)\\mathrm{Im}\\,\\chi(\\omega)$$\nloses its classical $2k_BT\\,\\mathrm{Im}\\chi/\\omega$ scaling at $k_BT \\lesssim \\hbar\\omega$ and is dominated by the zero-point term $\\hbar\\,\\mathrm{Im}\\chi(\\omega)$. The sharpest experimental signature lives in the *unsymmetrised* spectrum: a ground-state oscillator can radiate a Stokes photon but cannot give up energy to anti-Stokes scattering, so the sideband ratio is $\\bar n/(\\bar n+1)$ rather than unity. This is now the working calibration for ground-state cooling of MHz mechanical modes in cavity optomechanics [11] and has been pushed to room-T levitated nanoparticles with $\\bar n \\sim 0.04$ ([Magrini et al. 2025](https://www.nature.com/articles/s41567-025-02976-9)). Two issues are technically unresolved: (i) heterodyne readout of a thermal mode can mimic sideband asymmetry classically — [Khalili et al. (2016)](https://arxiv.org/abs/1608.01806) showed the signature is not by itself a quantumness witness without phase-sensitive auxiliary tests; (ii) circuit-QED Josephson parametric amplifiers operating near the Caves bound have non-Hermitian, structured baths, and whether the \"FDT\" in such squeezed reservoirs is the equilibrium relation or a Bogoliubov-rotated cousin is still negotiated mode-by-mode. The Feynman–Vernon influence functional [19] remains the cleanest microscopic generator of FDT-consistent quantum noise when the bath is linear and stationary.\n\n### Holographic FDT and the bulk KMS condition\n\nIn AdS/CFT, the Hartle–Hawking state on the eternal black hole is automatically a KMS state at the Hawking temperature, so the boundary FDT is a *derived* consequence of bulk geometry. The Schwinger–Keldysh contour is realised by the two asymptotic boundaries of the maximally extended Kruskal spacetime, with the thermofield doubling emerging from geometry rather than being imposed. Son–Starinets retarded Green's functions, computed by ingoing-wave conditions at the horizon, satisfy $S/\\mathrm{Im}\\chi = \\coth(\\hbar\\omega/2k_BT)$ by construction; the trailing-string treatment of a heavy quark in a thermal plasma yields a Langevin friction and noise that are FDT-consistent at strong coupling. Recent extensions at finite chemical potential ([arXiv:2501.17852](https://arxiv.org/pdf/2501.17852)) check the quantum coth factor for fermionic correlators. Two items belong in the *plausible but disputed* column:\n\n- FDT-like statements in de Sitter, where no global thermal state exists and the Gibbons–Hawking temperature is observer-dependent ([UTTG-09-14](https://arxiv.org/pdf/1404.0347)). The KMS condition is local at best; whether a sensible global FDT survives is genuinely open.\n- Whether the Kovtun–Son–Starinets viscosity bound implies a universal lower bound on the noise-to-friction ratio for holographic Brownian probes. The moving-mirror / dynamical-Casimir literature reaches adjacent statements from the Unruh side [27, 28], but the connection to a sharp holographic FDT theorem is suggestive, not established.\n\n### Generalised FDTs in stochastic thermodynamics\n\nThree distinct strands now compete for the title of \"generalised FDT\" out of equilibrium.\n\n1. *Harada–Sasa equality.* For overdamped Langevin dynamics in a NESS,\n$$\\dot Q \\;=\\; \\gamma\\!\\int\\!\\frac{d\\omega}{2\\pi}\\bigl[\\tilde C(\\omega) - 2k_BT\\,\\mathrm{Re}\\,\\tilde R(\\omega)\\bigr],$$\nidentifies the dissipated heat with the *spectral gap* between correlation $\\tilde C$ and response $\\tilde R$. The equality is exact for continuous Langevin processes but [breaks for discrete Markov jumps](https://journals.aps.org/pre/abstract/10.1103/PhysRevE.97.052125) whose forward and backward rates respond asymmetrically to the perturbation — a non-trivial restriction routinely ignored when the formula is fitted to molecular-motor or active-matter data [23].\n2. *Speck–Seifert modified FDT* [21]. The deviation from equilibrium FDT is rewritten as a correlator with the local NESS velocity field; Baiesi–Maes–Wynants later organised this as the *frenesy* or dynamical-activity contribution. The structural lesson, often missed, is that out of equilibrium one needs *two* correlators — an entropic and a frenetic one — not a single rescaled temperature.\n3. *Fluctuation–response inequalities*. Recent thermodynamic-uncertainty bounds give one-sided FDT-form relations involving $\\sqrt{\\dot S_{\\mathrm{tot}}}$, consistent with Crooks–Jarzynski identities [15] but not extensions of FDT — they are *inequalities*, and only collapse to the FDT equality inside the linear-response window. Reference [24] applies similar machinery to nonconservative forces and is technically reliable; [29] does the microcanonical version.\n\nFor mesoscopic coarse-graining, FDT enters as a consistency condition: any coarse-graining preserving detailed balance at the fine scale must reproduce an FDT-form noise–friction relation in the reduced description [30].\n\n### Open quantum systems and Lindblad detailed balance\n\nThe Lindbladian analogue of FDT is *quantum detailed balance* in the Agarwal/Alicki sense: a KMS-symmetry of the dissipator with respect to the stationary state. When it holds, one recovers an Agarwal–Kubo formula equivalent to equilibrium FDT for system observables. When it fails — driven cavities, engineered reservoirs, non-Hermitian/PT-symmetric systems, Floquet baths — there is no theorem, only case-by-case relations. The 2025 driven-particle–driven-bath analysis ([Phys. Rev. A 2025](https://journals.aps.org/pra/abstract/10.1103/w3vk-wx62)) makes the warning sharp: the modified FDR for an ac-driven system is generically non-Markovian even when the undriven problem is Markov, which should kill the casual assumption that Lindblad-plus-Floquet preserves FDT. The unitarity-based derivations [31] and the GW-Ward–Takahashi approach [32] are technically clean within their hypotheses but do not lift the constraint.\n\n### Topological edge modes\n\nChirality breaks time-reversal but not unitarity, so FDT-like relations survive on quantum-Hall edges through the underlying $U(1)$ Kac–Moody structure. The clean statement of [Sukhorukov–Cheianov](https://arxiv.org/abs/1104.2878) and follow-ups is that for chiral edges in a NESS, the symmetrised current noise and the *nonlinear* differential conductance satisfy an FDT-form relation with the nonlinear response replacing $\\sigma(0)$; violation is a positive diagnostic that the edge is not purely chiral. This is the closest the field has come to an exact non-equilibrium FDT in a strongly correlated system, and the recent $\\Delta_T$-noise diagnostics for chiral vs helical edges ([arXiv:2509.16747](https://arxiv.org/html/2509.16747)) operationalise it for transport experiments.\n\n### The effective-temperature question, still open\n\nThe Cugliandolo–Kurchan FDT ratio $X(t,t') = T/T_{\\mathrm{eff}}$ [22] is the cleanest non-equilibrium FDT-like object. The required test for thermodynamic meaning is observable-independence of $T_{\\mathrm{eff}}$ inside a given time-scale window. After three decades the honest summary is: $T_{\\mathrm{eff}}$ is observable-independent in mean-field $p$-spin models (proven), in some sheared Lennard-Jones simulations (numerical), and *not* in Bouchaud trap models or in rotation/translation-decoupled molecular liquids ([arXiv:1406.6226](https://arxiv.org/pdf/1406.6226)). No experiment has decisively demonstrated observable-independence across genuinely distinct probes in a real material. Classification: **plausible but disputed**.\n\n### What a working physicist should label \"plausible but disputed\" in 2026\n\n- A universal lower bound on holographic FDT noise/friction at the KSS viscosity bound.\n- $T_{\\mathrm{eff}}$ as a thermodynamic variable outside mean-field disorder models.\n- Any FDT-like sum rule for Floquet-engineered Lindbladians and engineered non-Hermitian reservoirs.\n- The Harada–Sasa equality applied to discrete-state biochemical and active-matter models [23].\n- Generalised-statistics or fractional-derivative \"FDTs\" [33, 34, 26, 35, 25] — internally consistent within their model classes, but their relation to physical heat baths is regulatory, not derived.\n\nWhat is solid: Callen–Welton in equilibrium, Kubo–Mori in Hamiltonian linear response [10, 1], the Stokes/anti-Stokes asymmetry as a zero-point witness in optomechanics [11], and the chiral-edge nonlinear FDT as a working transport diagnostic. Everything outside that perimeter carries a regime, a hypothesis, and — increasingly — a conjecture."}, {"id": "verdict", "title": "The AETHER Verdict", "markdown": "## The AETHER Verdict\n\nI have spent six sections being scrupulous about who proved what. Now I will say what I actually think.\n\n### (a) What I would defend with my reputation\n\nThe Callen–Welton identity [7], in its native habitat — a quantum system weakly coupled to a thermal reservoir at well-defined $T$, probed in linear response — is as secure as any theorem in statistical mechanics. It is a consequence of the KMS condition, nothing more and nothing less; the $\\coth(\\hbar\\omega/2k_BT)$ factor is not a model assumption but an analyticity statement about $\\langle A(t)B(0)\\rangle_\\beta$ in the strip $0\u003c\\mathrm{Im}\\,t\u003c\\beta\\hbar$. I will defend, specifically: (i) that the symmetric spectrum\n\n$$S_{AA}(\\omega)=\\hbar\\coth\\!\\left(\\frac{\\hbar\\omega}{2k_BT}\\right)\\mathrm{Im}\\,\\chi_{AA}(\\omega)$$\n\nis the *correct* statement of the theorem and that the often-quoted $S=(2k_BT/\\omega)\\mathrm{Im}\\,\\chi$ is a classical truncation that fails by order unity once $\\hbar\\omega\\gtrsim k_BT$ — i.e. exactly the regime cavity optomechanics and circuit QED now operate in; (ii) that the zero-point half-photon in a 50 Ω resistor at $T\\to 0$ is real, measurable, and has been measured; (iii) that quantum-limited amplifier noise temperatures saturating $T_N\\to\\hbar\\omega/2k_B$ are not engineering folklore but a direct corollary.\n\n### (b) What is shakier than the literature admits\n\nThree load-bearing assumptions are routinely smuggled in and rarely audited.\n\n1. **Stationarity of the bath.** Almost every textbook derivation assumes the reservoir is in a Gibbs state *for all time*. The instant you have a finite, structured bath — a phonon mode hybridized with the system, a non-Markovian memory kernel with long tails, a sub-Ohmic spectral density — the KMS step in the Callen–Welton proof becomes an approximation, not an identity. The literature is sloppy about which \"effective bath\" inherits which temperature.\n2. **The linear-response regime.** Kubo's formula is an expansion to $\\mathcal{O}(F)$. Convergence of this expansion is not generic; for systems with localization, many-body localization, or quasi-integrable hydrodynamics the leading term can be parametrically smaller than the next, and the FDT prediction quietly fails *before* the drive is \"strong\" in any obvious sense.\n3. **The existence of $T$ at all.** The \"effective temperature\" industry [§6] has trained a generation to treat $T_{\\rm eff}$ as a recovered observable rather than a *fitted parameter conditioned on an FDT ansatz one has no right to assume*. Outside the slow-mode Cugliandolo–Kurchan window, $X(\\omega)\\ne 1$ is a *violation*, not a renormalization.\n\n### (c) Three open questions I would actually work on, ranked\n\n1. **A clean, observable-independent FDT for driven quantum steady states.** The classical Harada–Sasa equality relates FDT violation to dissipated power; the quantum analog is not settled. Worth a career.\n2. **FDT in systems without a global $T$ but with a local KMS structure** — e.g. hydrodynamic subregions of a thermalizing chain, or holographic horizons with Hawking temperature distinct from the boundary bath. The \"two-temperature FDT\" sketches in the holography literature need theorem-status, not heuristic-status.\n3. **The non-Markovian quantum Johnson–Nyquist problem.** What replaces $4k_BTR$ when $R(\\omega)$ is itself a strongly correlated electronic response with anomalous Im $\\chi$? Strange-metal noise spectroscopy is the experimental hook.\n\n### (d) Reading path\n\n1. **Callen \u0026 Welton 1951** [7] — read the original; the proof is shorter and cleaner than any textbook recast and shows exactly where KMS enters.\n2. **Kubo 1957** [10] — to see how linear response supplies the *calculus* that Callen–Welton lacked; pair with Nakano's contemporaneous derivation if you can find it.\n3. **Kubo 1966, \"The fluctuation-dissipation theorem\"** [1] — Kubo's own retrospective; the cleanest single article on the structure of the theorem and its corollaries.\n4. **Cugliandolo–Kurchan on FDT violation in aging systems** [as cited in §6] — the only honest framework for $T_{\\rm eff}$; read it before believing any effective-temperature claim in active or glassy matter.\n5. **A modern quantum-noise review covering circuit QED / optomechanics** [as cited in §4, §7] — to see the $\\coth$ factor and the zero-point half-quantum stop being abstractions and start being calibration constants on a fridge.\n\nRead in that order, the field stops looking like a pile of identities with the same name and starts looking like one theorem with a sharply defined domain — and a frontier where that domain ends."}], "references": [{"n": 1, "title": "The fluctuation-dissipation theorem", "authors": ["Ryogo Kubo"], "year": 1966, "venue": "Reports on Progress in Physics", "url": "https://doi.org/10.1088/0034-4885/29/1/306", "cited_by": 5041, "bucket": "canon"}, {"n": 2, "title": "Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen", "authors": ["Albert Einstein"], "year": 1905, "venue": "Annalen der Physik 17, 549", "url": "https://doi.org/10.1002/andp.19053220806", "cited_by": null, "bucket": "archive"}, {"n": 3, "title": "Zur kinetischen Theorie der Brownschen Molekularbewegung und der Suspensionen", "authors": ["M. von Smoluchowski"], "year": 1906, "venue": "Annalen der Physik 21, 756", "url": "https://doi.org/10.1002/andp.19063261405", "cited_by": null, "bucket": "archive"}, {"n": 4, "title": "Reaction-rate theory: fifty years after Kramers", "authors": ["Peter Hänggi", "Peter Talkner", "Michal Borkovec"], "year": 1990, "venue": "Reviews of Modern Physics", "url": "https://doi.org/10.1103/revmodphys.62.251", "cited_by": 6142, "bucket": "canon"}, {"n": 5, "title": "Sur la théorie du mouvement brownien", "authors": ["Paul Langevin"], "year": 1908, "venue": "Comptes Rendus de l'Académie des Sciences (Paris) 146, 530", "url": "", "cited_by": null, "bucket": "archive"}, {"n": 6, "title": "On the Theory of the Brownian Motion", "authors": ["G. E. Uhlenbeck", "L. S. Ornstein"], "year": 1930, "venue": "Physical Review 36, 823", "url": "https://doi.org/10.1103/PhysRev.36.823", "cited_by": null, "bucket": "archive"}, {"n": 7, "title": "Irreversibility and Generalized Noise", "authors": ["Herbert B. Callen", "Theodore A. Welton"], "year": 1951, "venue": "Physical Review 83, 34", "url": "https://doi.org/10.1103/PhysRev.83.34", "cited_by": null, "bucket": "archive"}, {"n": 8, "title": "Thermal Agitation of Electric Charge in Conductors", "authors": ["H. Nyquist"], "year": 1928, "venue": "Physical Review 32, 110", "url": "https://doi.org/10.1103/PhysRev.32.110", "cited_by": null, "bucket": "archive"}, {"n": 9, "title": "Thermal Agitation of Electricity in Conductors", "authors": ["J. B. Johns <script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* spacing macros (\, \! \; \:) directly before ^/_ are invalid in KaTeX
   (common in term symbols like \,^{2}\!S); insert an empty group to repair. */
function _mfix(x){return x.replace(/(\\[,!;:>\s])\s*(?=[\^_])/g,'$1{}');}
function _kmath(x,d){
  try{return katex.renderToString(x,{displayMode:d,throwOnError:true});}
  catch(e){
    try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:true});}
    catch(e2){
      try{return katex.renderToString(_mfix(x),{displayMode:d,throwOnError:false});}
      catch(e3){return '<code class="mathraw">'+esc(x)+'</code>';}}}
}
/* Strict left-to-right inline-math pairing. The naive /\$..\$(?!\d)/ regex
   desyncs whenever a closing $ is followed by a digit (e.g. "$\sim$95%"),
   cascading prose into math mode. This walks the string and pairs $ in
   order, never crossing a newline, honouring \$ escapes. */
function protectInline(s,maths){
  var out='',i=0,n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='\\'){ out+=s.substr(i,2); i+=2; continue; }
    if(c==='$'){
      var j=i+1, buf='';
      while(j<n){
        if(s[j]==='\n'){ break; }
        if(s[j]==='\\'){ buf+=s.substr(j,2); j+=2; continue; }
        if(s[j]==='$'){ break; }
        buf+=s[j]; j++;
      }
      if(j<n && s[j]==='$' && buf.trim().length){
        maths.push({x:buf,d:false});
        out+='@@M'+(maths.length-1)+'@@'; i=j+1; continue;
      }
      out+=c; i++; continue;   // no closing $ on this line -> literal
    }
    out+=c; i++;
  }
  return out;
}
function renderRich(md,nRefs){
  if(!md) return '';
  var svgs=[],maths=[];
  md=md.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){svgs.push(m);return '@@S'+(svgs.length-1)+'@@';});
  /* display math = block-level only: $$ must begin a line and $$ end a line.
     This stops adjacent inline math in table cells ("$x$$y$") from being
     mistaken for a $$...$$ display block. */
  md=md.replace(/(^|\n)[ \t]*\$\$([\s\S]*?)\$\$[ \t]*(?=\n|$)/g,function(m,pre,x){maths.push({x:x,d:true});return pre+'@@M'+(maths.length-1)+'@@';});
  md=protectInline(md,maths);
  var h=marked.parse(md,{mangle:false,headerIds:false});
  h=h.replace(/@@M(\d+)@@/g,function(m,i){var o=maths[+i];return _kmath(o.x,o.d);});
  h=h.replace(/@@S(\d+)@@/g,function(m,i){return '<div class="fig">'+svgs[+i]+'</div>';});
  if(nRefs>0){h=h.replace(/\[(\d{1,3})\](?!\()/g,function(m,n){return (+n>=1&&+n<=nRefs)?'<a class="cite" href="#ref-'+n+'">['+n+']</a>':m;});}
  return h;
}
